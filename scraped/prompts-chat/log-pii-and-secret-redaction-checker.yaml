  \n#!/usr/bin/env python3\n\"\"\"Log PII and secret redaction checker (offline, Python\
  \ 3.8+ standard library only).\n\nScans plain-text or JSON-lines logs for personal\
  \ data and secrets that should never be logged:\npayment cards (Luhn-checked), IBANs\
  \ (mod-97 checked), US SSNs, API keys and tokens (AWS, Stripe,\nGitHub, Slack, JWT,\
  \ Authorization headers), passwords in key=value or JSON, tokens in URL query\n\
  strings, emails, phone numbers, dates of birth and public IP addresses. Values that\
  \ are already\nmasked (\"***\", \"[REDACTED]\") are ignored. Every value is masked\
  \ in the report; nothing is sent\nanywhere. Optionally writes a redacted copy of\
  \ the log.\n\nUsage:\n  log_redaction_check.py app.log [more.log ...] [--json] [--redact\
  \ OUT] [--allow REGEX ...]\n                         [--include-private-ip] [--max-examples\
  \ 3]\n  log_redaction_check.py --self-test\nExit codes: 0 = no high findings, 1\
  \ = high findings, 2 = bad input.\n\"\"\"\nimport argparse, json, re, sys\nfrom\
  \ collections import Counter, OrderedDict, defaultdict\n\nSEV = {\"high\": 0, \"\
  medium\": 1, \"low\": 2}\nREDACTED = re.compile(r\"^(\\*+.*|x{3,}|\\[?redacted(:\\\
  w+)?\\]?|<redacted>|\\[filtered\\]|null|none|\\\"\\\"|-|)$\", re.I)\n\n# code, kind,\
  \ severity, compiled regex, value group, validator (or None)\ndef luhn(s):\n   \
  \ d = [int(c) for c in s if c.isdigit()]\n    if not 13 <= len(d) <= 19 or len(set(d))\
  \ == 1:\n        return False\n    tot = 0\n    for i, n in enumerate(reversed(d)):\n\
  \        if i % 2:\n            n *= 2\n            n -= 9 if n > 9 else 0\n   \
  \     tot += n\n    return tot % 10 == 0\n\n\ndef iban_ok(s):\n    s = s.replace(\"\
  \ \", \"\")\n    if not 15 <= len(s) <= 34:\n        return False\n    r = s[4:]\
  \ + s[:4]\n    num = \"\".join(str(int(c, 36)) for c in r)\n    return int(num)\
  \ % 97 == 1\n\n\ndef phone_ok(s):\n    return 10 <= sum(c.isdigit() for c in s)\
  \ <= 15\n\n\ndef public_ip(s, include_private=False):\n    parts = s.split(\".\"\
  )\n    if len(parts) != 4 or any(not p.isdigit() or int(p) > 255 or (len(p) > 1\
  \ and p[0] == \"0\") for p in parts):\n        return False\n    a, b = int(parts[0]),\
  \ int(parts[1])\n    private = a in (10, 127, 0) or (a == 172 and 16 <= b <= 31)\
  \ or (a == 192 and b == 168) or (a == 169 and b == 254) or a >= 224\n    return\
  \ include_private or not private\n\n\nDETECTORS = [\n    (\"LR03\", \"PRIVATE_KEY\"\
  , \"high\", re.compile(r\"-----BEGIN [A-Z ]*PRIVATE KEY-----\"), 0, None),\n   \
  \ (\"LR09\", \"URL_TOKEN\", \"high\", re.compile(r\"(?i)[?&](?:access_token|refresh_token|id_token|token|api_key|apikey|sig|signature|password|session|sid|code)=([^&\\\
  s\\\"']+)\"), 1, None),\n    (\"LR03\", \"AUTH_HEADER\", \"high\", re.compile(r\"\
  (?i)\\b(?:authorization|x-api-key|api[_-]?key|x-auth-token)\\b\\\"?\\s*[:=]\\s*\\\
  \"?(?:bearer\\s+|basic\\s+|token\\s+)?([A-Za-z0-9._~+/=-]{12,})\"), 1, None),\n\
  \    (\"LR03\", \"JWT\", \"high\", re.compile(r\"\\beyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\\
  .[A-Za-z0-9_-]{8,}\"), 0, None),\n    (\"LR03\", \"AWS_KEY\", \"high\", re.compile(r\"\
  \\b(?:AKIA|ASIA)[0-9A-Z]{16}\\b\"), 0, None),\n    (\"LR03\", \"API_KEY\", \"high\"\
  , re.compile(r\"\\b(?:sk|rk|pk)_(?:live|test)_[A-Za-z0-9]{16,}\\b|\\bgh[pousr]_[A-Za-z0-9]{30,}\\\
  b|\\bxox[abpr]-[A-Za-z0-9-]{10,}\"), 0, None),\n    (\"LR04\", \"PASSWORD\", \"\
  high\", re.compile(r\"(?i)\\b(?:password|passwd|pwd|secret|client_secret|passphrase)\\\
  b\\\"?\\s*[:=]\\s*\\\"?([^\\s\\\",&}]*)\"), 1, None),\n    (\"LR10\", \"DOB\", \"\
  medium\", re.compile(r\"(?i)\\b(?:dob|date_of_birth|birth_?date|birthday)\\b\\\"\
  ?\\s*[:=]\\s*\\\"?(\\d{4}-\\d{2}-\\d{2}|\\d{1,2}[/.]\\d{1,2}[/.]\\d{2,4})\"), 1,\
  \ None),\n    (\"LR07\", \"IBAN\", \"high\", re.compile(r\"\\b[A-Z]{2}\\d{2}(?:\
  \ ?[A-Z0-9]{4}){2,7}(?: ?[A-Z0-9]{1,4})?\\b\"), 0, iban_ok),\n    (\"LR02\", \"\
  CARD\", \"high\", re.compile(r\"(?<![\\d.:-])\\d(?:[ -]?\\d){12,18}(?![\\d.:])\"\
  ), 0, luhn),\n    (\"LR08\", \"SSN\", \"high\", re.compile(r\"\\b(?!000|666|9\\\
  d\\d)\\d{3}-(?!00)\\d{2}-(?!0000)\\d{4}\\b\"), 0, None),\n    (\"LR01\", \"EMAIL\"\
  , \"medium\", re.compile(r\"\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\\
  b\"), 0, None),\n    (\"LR06\", \"PHONE\", \"medium\", re.compile(r\"(?<![\\w+])\\\
  +\\d{1,3}[ .-]?\\(?\\d{1,4}\\)?(?:[ .-]?\\d{2,4}){2,4}\\b\"), 0, phone_ok),\n  \
  \  (\"LR05\", \"IP\", \"low\", re.compile(r\"(?<![\\d.])(?:\\d{1,3}\\.){3}\\d{1,3}(?![\\\
  d.])\"), 0, \"ip\"),\n]\nTITLES = {\"LR01\": \"email address\", \"LR02\": \"payment\
  \ card number (Luhn valid)\", \"LR03\": \"API key, token or credential\",\n    \
  \      \"LR04\": \"password or secret value\", \"LR05\": \"public IP address\",\
  \ \"LR06\": \"phone number\",\n          \"LR07\": \"IBAN (checksum valid)\", \"\
  LR08\": \"US Social Security number\", \"LR09\": \"token in URL query string\",\n\
  \          \"LR10\": \"date of birth\"}\nVERSION_CTX = re.compile(r\"(?i)(version|build|release|ver|tag|\\\
  bv)[\\s:=]*$\")\nLEVEL_RE = re.compile(r\"\\b(TRACE|DEBUG|INFO|WARN|WARNING|ERROR|FATAL)\\\
  b\\s*[:\\-]?\\s*\\[?([A-Za-z][\\w.\\-]*)\\]?\")\n\n\ndef mask(kind, v):\n    if\
  \ kind == \"CARD\":\n        d = re.sub(r\"\\D\", \"\", v)\n        return d[:1]\
  \ + \"*\" * (len(d) - 5) + d[-4:]\n    if kind == \"EMAIL\":\n        user, _, dom\
  \ = v.partition(\"@\")\n        return user[:1] + \"***@\" + dom\n    if kind ==\
  \ \"PRIVATE_KEY\":\n        return v\n    if len(v) <= 6:\n        return \"*\"\
  \ * len(v)\n    return v[:2] + \"*\" * min(len(v) - 4, 12) + v[-2:]\n\n\ndef source_of(line):\n\
  \    s = line.strip()\n    if s.startswith(\"{\"):\n        try:\n            o\
  \ = json.loads(s)\n            for k in (\"logger\", \"service\", \"component\"\
  , \"module\", \"name\"):\n                if isinstance(o.get(k), str):\n      \
  \              return o[k], str(o.get(\"level\", \"\")).upper()\n        except\
  \ ValueError:\n            pass\n    m = LEVEL_RE.search(line)\n    if m:\n    \
  \    return m.group(2), m.group(1).upper()\n    return \"-\", \"\"\n\n\ndef scan_line(line,\
  \ allow=(), include_private_ip=False):\n    taken, hits = [], []\n    for code,\
  \ kind, sev, rx, grp, val in DETECTORS:\n        for m in rx.finditer(line):\n \
  \           v = m.group(grp)\n            a, b = m.span(grp)\n            if v is\
  \ None or REDACTED.match(v.strip()) or any(x < b and a < y for x, y in taken):\n\
  \                continue\n            if val == \"ip\":\n                if not\
  \ public_ip(v, include_private_ip) or VERSION_CTX.search(line[max(0, a - 12):a]):\n\
  \                    continue\n            elif val and not val(v):\n          \
  \      continue\n            if any(r.search(v) for r in allow):\n             \
  \   continue\n            taken.append((a, b))\n            hits.append({\"code\"\
  : code, \"kind\": kind, \"severity\": sev, \"start\": a, \"end\": b, \"value\":\
  \ v})\n    return sorted(hits, key=lambda h: h[\"start\"])\n\n\ndef redact_line(line,\
  \ hits):\n    out = line\n    for h in sorted(hits, key=lambda h: -h[\"start\"]):\n\
  \        out = out[:h[\"start\"]] + \"[REDACTED:%s]\" % h[\"kind\"] + out[h[\"end\"\
  ]:]\n    return out\n\n\ndef scan(named_lines, allow=(), include_private_ip=False,\
  \ max_examples=3):\n    findings, by_code, sources, redacted = [], OrderedDict(),\
  \ defaultdict(Counter), {}\n    distinct = defaultdict(set)\n    debug_hits = 0\n\
  \    total_lines = 0\n    for name, lines in named_lines:\n        red = []\n  \
  \      for i, line in enumerate(lines, 1):\n            total_lines += 1\n     \
  \       hits = scan_line(line, allow, include_private_ip)\n            red.append(redact_line(line,\
  \ hits))\n            if not hits:\n                continue\n            src, level\
  \ = source_of(line)\n            if level in (\"DEBUG\", \"TRACE\"):\n         \
  \       debug_hits += len(hits)\n            for h in hits:\n                c =\
  \ h[\"code\"]\n                by_code.setdefault(c, {\"code\": c, \"severity\"\
  : h[\"severity\"], \"what\": TITLES[c], \"count\": 0, \"lines\": [], \"examples\"\
  : []})\n                e = by_code[c]\n                e[\"count\"] += 1\n    \
  \            distinct[c].add(h[\"value\"])\n                if len(e[\"lines\"])\
  \ < 20:\n                    e[\"lines\"].append(\"%s:%d\" % (name, i))\n      \
  \          if len(e[\"examples\"]) < max_examples:\n                    e[\"examples\"\
  ].append({\"where\": \"%s:%d\" % (name, i), \"kind\": h[\"kind\"], \"masked\": mask(h[\"\
  kind\"], h[\"value\"]), \"source\": src})\n                sources[src][c] += 1\n\
  \                findings.append({\"file\": name, \"line\": i, \"code\": c, \"kind\"\
  : h[\"kind\"], \"severity\": h[\"severity\"], \"source\": src, \"level\": level,\
  \ \"masked\": mask(h[\"kind\"], h[\"value\"])})\n        redacted[name] = red\n\
  \    for c, e in by_code.items():\n        e[\"distinct_values\"] = len(distinct[c])\n\
  \    summary = sorted(by_code.values(), key=lambda e: (SEV[e[\"severity\"]], e[\"\
  code\"]))\n    counts = Counter(f[\"severity\"] for f in findings)\n    src_rank\
  \ = sorted(((s, sum(c.values()), dict(c)) for s, c in sources.items()), key=lambda\
  \ x: -x[1])\n    return {\"lines_scanned\": total_lines, \"findings_total\": len(findings),\
  \ \"by_severity\": {k: counts.get(k, 0) for k in SEV},\n            \"summary\"\
  : summary, \"sources\": [{\"source\": s, \"hits\": n, \"codes\": c} for s, n, c\
  \ in src_rank],\n            \"debug_level_hits\": debug_hits, \"findings\": findings,\
  \ \"redacted\": redacted}\n\n\ndef print_text(rep):\n    print(\"Scanned %d lines:\
  \ %d findings (%d high, %d medium, %d low)\" % (rep[\"lines_scanned\"], rep[\"findings_total\"\
  ],\n          rep[\"by_severity\"][\"high\"], rep[\"by_severity\"][\"medium\"],\
  \ rep[\"by_severity\"][\"low\"]))\n    if not rep[\"summary\"]:\n        print(\"\
  No personal data or secrets found by the detectors (this is not proof the log is\
  \ clean).\")\n        return\n    print(\"\\nBy type\")\n    for e in rep[\"summary\"\
  ]:\n        print(\"  [%s] %s %-34s %3d hits, %2d distinct  lines %s\" % (e[\"severity\"\
  ].upper(), e[\"code\"], e[\"what\"], e[\"count\"],\n              e[\"distinct_values\"\
  ], \", \".join(x.split(\":\")[-1] for x in e[\"lines\"][:8]) + (\" ...\" if e[\"\
  count\"] > 8 else \"\")))\n        for x in e[\"examples\"]:\n            print(\"\
  \        %s  %-11s %s  (source %s)\" % (x[\"where\"], x[\"kind\"], x[\"masked\"\
  ], x[\"source\"]))\n    print(\"\\nSources to fix first (logger / component)\")\n\
  \    for s in rep[\"sources\"]:\n        print(\"  %-22s %3d  %s\" % (s[\"source\"\
  ], s[\"hits\"], \" \".join(\"%s=%d\" % kv for kv in sorted(s[\"codes\"].items()))))\n\
  \    if rep[\"debug_level_hits\"]:\n        print(\"\\nNote: %d hits are in DEBUG/TRACE\
  \ lines; check that debug logging is off in production.\" % rep[\"debug_level_hits\"\
  ])\n\n\ndef self_test():\n    ok = 0; tests = []\n    def t(name, cond):\n     \
  \   tests.append((name, bool(cond)))\n    k = lambda line, **kw: [h[\"kind\"] for\
  \ h in scan_line(line, **kw)]\n    t(\"Luhn-valid card found\", k(\"charge card=4111\
  \ 1111 1111 1111 ok\") == [\"CARD\"])\n    t(\"Luhn-invalid number ignored\", k(\"\
  order 4111111111111112 shipped\") == [])\n    t(\"epoch ms timestamp not a card\"\
  , k(\"ts=1731995000123 done\") == [])\n    t(\"IBAN mod-97 valid\", k(\"payout to\
  \ DE89 3704 0044 0532 0130 00\") == [\"IBAN\"])\n    t(\"IBAN bad checksum ignored\"\
  , k(\"ref DE00370400440532013000\") == [])\n    t(\"AWS access key id\", k(\"using\
  \ AKIAIOSFODNN7EXAMPLE for s3\") == [\"AWS_KEY\"])\n    t(\"bearer header value\"\
  , k(\"Authorization: Bearer abcDEF1234567890xyz\") == [\"AUTH_HEADER\"])\n    t(\"\
  JWT\", k(\"token eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0In0.c2lnbmF0dXJlLXZhbHVl\"\
  ) == [\"JWT\"])\n    t(\"password in JSON\", k('{\"user\":\"bo\",\"password\":\"\
  hunter2!\"}') == [\"PASSWORD\"])\n    t(\"masked password ignored\", k(\"password=***\
  \ user=bo\") == [] and k('\"password\": \"[REDACTED]\"') == [])\n    t(\"token in\
  \ URL query\", k(\"GET /cb?code=abc123&state=x\") == [\"URL_TOKEN\"])\n    t(\"\
  email\", k(\"signup ana.lima@example.com\") == [\"EMAIL\"])\n    t(\"phone needs\
  \ + and 10-15 digits\", k(\"call +44 20 7946 0958\") == [\"PHONE\"] and k(\"build\
  \ +1 2\") == [])\n    t(\"SSN\", k(\"ssn 123-45-6789\") == [\"SSN\"])\n    t(\"\
  private IP ignored, public flagged\", k(\"from 10.0.0.5\") == [] and k(\"from 203.0.113.7\"\
  ) == [\"IP\"])\n    t(\"include private IP flag\", k(\"from 10.0.0.5\", include_private_ip=True)\
  \ == [\"IP\"])\n    t(\"version string not an IP\", k(\"lib 1.2.3.4.5 loaded\")\
  \ == [])\n    t(\"IP after 'build'/'version' ignored\", k(\"build 1.2.3.4 tagged\"\
  ) == [] and k(\"version=8.8.8.8\") == [])\n    t(\"api_key in URL is a URL token\"\
  , k(\"GET /r?api_key=abcdef123456789\") == [\"URL_TOKEN\"])\n    t(\"allowlist\"\
  , k(\"mail noreply@example.com\", allow=[re.compile(r\"^noreply@\")]) == [])\n \
  \   t(\"date of birth\", k(\"dob=1990-04-12 ok\") == [\"DOB\"])\n    rep = scan([(\"\
  t.log\", [\"INFO [auth] login ana@example.com\", \"DEBUG [pay] card 5500 0000 0000\
  \ 0004\", \"INFO [web] fine\"])])\n    t(\"report counts + severity\", rep[\"findings_total\"\
  ] == 2 and rep[\"by_severity\"][\"high\"] == 1 and rep[\"debug_level_hits\"] ==\
  \ 1)\n    t(\"redaction keeps key, hides value\", rep[\"redacted\"][\"t.log\"][1]\
  \ == \"DEBUG [pay] card [REDACTED:CARD]\")\n    t(\"masked output never shows full\
  \ card\", \"5500000000000004\" not in json.dumps(rep[\"findings\"]))\n    for name,\
  \ c in tests:\n        print(\"%s  %s\" % (\"PASS\" if c else \"FAIL\", name));\
  \ ok += c\n    print(\"%d/%d passed\" % (ok, len(tests)))\n    return 0 if ok ==\
  \ len(tests) else 1\n\n\ndef main():\n    ap = argparse.ArgumentParser(description=__doc__,\
  \ formatter_class=argparse.RawDescriptionHelpFormatter)\n    ap.add_argument(\"\
  files\", nargs=\"*\"); ap.add_argument(\"--json\", action=\"store_true\")\n    ap.add_argument(\"\
  --redact\", metavar=\"OUT\"); ap.add_argument(\"--allow\", action=\"append\", default=[])\n\
  \    ap.add_argument(\"--include-private-ip\", action=\"store_true\"); ap.add_argument(\"\
  --max-examples\", type=int, default=3)\n    ap.add_argument(\"--self-test\", action=\"\
  store_true\")\n    a = ap.parse_args()\n    if a.self_test:\n        return self_test()\n\
  \    if not a.files:\n        ap.print_usage(); return 2\n    try:\n        allow\
  \ = [re.compile(x) for x in a.allow]\n        named = []\n        for f in a.files:\n\
  \            fh = sys.stdin if f == \"-\" else open(f, encoding=\"utf-8\", errors=\"\
  replace\")\n            named.append((f, fh.read().splitlines()))\n    except (OSError,\
  \ re.error) as e:\n        print(\"error: %s\" % e, file=sys.stderr); return 2\n\
  \    rep = scan(named, allow, a.include_private_ip, a.max_examples)\n    if a.redact:\n\
  \        with open(a.redact, \"w\", encoding=\"utf-8\") as out:\n            for\
  \ f in a.files:\n                out.write(\"\\n\".join(rep[\"redacted\"][f]) +\
  \ \"\\n\")\n    red = rep.pop(\"redacted\")\n    if a.json:\n        print(json.dumps(rep,\
  \ indent=2))\n    else:\n        print_text(rep)\n        if a.redact:\n       \
  \     print(\"\\nRedacted copy written to %s (%d lines)\" % (a.redact, sum(len(v)\
  \ for v in red.values())))\n    return 1 if rep[\"by_severity\"][\"high\"] else\
  \ 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())"
