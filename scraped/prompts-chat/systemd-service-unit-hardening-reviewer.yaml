  nLogsDirectory=app\\n\")))\n    t(\"CAP_SYS_ADMIN -> SD07 high\", (\"high\", \"\
  SD07\") in codes(base.replace(\"[Service]\\n\", \"[Service]\\nAmbientCapabilities=CAP_SYS_ADMIN\\\
  n\")))\n    t(\"+ prefix -> SD01 medium\", (\"medium\", \"SD01\") in codes(base.replace(\"\
  [Service]\\n\", \"[Service]\\nUser=a\\nExecStartPre=+/usr/bin/setup\\n\")))\n  \
  \  t(\"TimeoutStopSec=infinity -> SD12\", (\"medium\", \"SD12\") in codes(base.replace(\"\
  [Service]\\n\", \"[Service]\\nTimeoutStopSec=infinity\\n\")))\n    t(\"continuation\
  \ lines joined\", R(\"[Service]\\nExecStart=/usr/bin/app \\\\\\n  --port 80\\nUser=a\\\
  n[Install]\\nWantedBy=multi-user.target\\n\")[\"findings\"] is not None and\n  \
  \    parse(\"[Service]\\nExecStart=/usr/bin/app \\\\\\n  --port 80\\n\", \"x\")[\"\
