  \ else 1\n\n\ndef main(argv=None):\n    ap = argparse.ArgumentParser(description=\"\
  Review systemd .service units for reliability and hardening.\")\n    ap.add_argument(\"\
  units\", nargs=\"*\", help=\"UNIT.service, optionally followed by drop-in .conf\
