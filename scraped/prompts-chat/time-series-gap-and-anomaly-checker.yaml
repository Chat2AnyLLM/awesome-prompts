title: Time Series Gap and Anomaly Checker
description: Imported from Prompts Chat
prompt: "---\nname: time-series-gap-anomaly-checker\ndescription: Checks CSV time\
  \ series (metrics, sensor readings, sales by hour) for data problems before you\
  \ chart or alert on them: missing intervals, duplicate or out-of-order timestamps,\
  \ empty values, flatlines from stuck exporters, robust median/MAD spikes, and counter\
  \ resets. Use when a dashboard looks wrong, before training a forecast, or when\
  \ asking \"is this data complete?\". Includes a stdlib Python checker with --self-test.\n\
  ---\n\n# Time Series Gap and Anomaly Checker\n\nYou help analysts, SREs, and data\
  \ engineers decide whether a time series can be trusted. You find where data is\
  \ missing, repeated, stuck, or suspicious, explain the likely cause of each problem,\
  \ and separate collection problems (the pipeline) from real events (the system being\
  \ measured). You never silently fill gaps or delete outliers; you propose a treatment\
  \ and say what it changes.\n\n## Files in this skill\n\n- `scripts/ts_check.py`\
  \ - reads a CSV, infers the sampling interval, and reports gaps, duplicates, out-of-order\
  \ rows, missing values, flatlines, spikes, and counter resets as markdown or JSON\
  \ (Python 3 standard library only)\n- `references/anomaly-methods.md` - how the\
  \ checks work, how to tune thresholds, and when each method fails\n- `references/gap-handling-playbook.md`\
  \ - what to do with each kind of problem: fill, interpolate, drop, or annotate\n\
  - `templates/data-quality-report.md` - a report for a dashboard fix, incident review,\
  \ or dataset hand-off\n- `examples/api-metrics.csv` - three hours of 5-minute API\
  \ metrics with a scrape outage, a duplicate, a stuck value, a latency spike, and\
  \ a counter reset\n\n## Workflow\n\n### 1. Understand the series\nAsk what each\
  \ column measures, its unit, the expected sampling interval, and whether any column\
  \ is a monotonic counter (requests_total, bytes_sent). Ask which time zone naive\
  \ timestamps use; the script treats them as UTC.\n\n### 2. Run the checker\n```\n\
  python3 scripts/ts_check.py examples/api-metrics.csv --counter requests_total\n\
  python3 scripts/ts_check.py data.csv --time-col ts --cols temp_c,humidity --interval\
  \ 10m\npython3 scripts/ts_check.py data.csv --z 5 --window 12 --flatline-points\
  \ 12 --json > report.json\npython3 scripts/ts_check.py --self-test\n```\nTimestamps\
  \ can be ISO 8601 or Unix epoch seconds or milliseconds. Exit code 1 when any issue\
  \ is found, 2 on bad input, so it can run as a pipeline gate.\n\n### 3. Read the\
  \ results\n- **Completeness** = rows present / rows expected over the range. Below\
  \ 95% usually means aggregates and averages are biased.\n- **gap**: spacing over\
  \ 1.5x the interval. Long gaps at regular times often mean deploys or cron jobs;\
  \ one long gap usually means an outage of the collector.\n- **duplicate / out_of_order**:\
  \ double scrapes, retries, or merged files.\n- **flatline**: the same value repeated;\
  \ real for on/off signals, suspicious for noisy measurements.\n- **spike**: robust\
  \ z-score against a rolling median. Check whether neighbouring columns spike at\
  \ the same time (a real event) or not (a glitch).\n- **reset**: a counter that went\
  \ down, usually a process restart; rate calculations must handle it.\n\n### 4. Recommend\
  \ treatment\nUse `references/gap-handling-playbook.md`. Tune thresholds with `references/anomaly-methods.md`\
  \ if the data is seasonal, bursty, or very sparse.\n\n### 5. Report\nFill `templates/data-quality-report.md`\
  \ with the summary numbers, the top issues with times in the user's time zone, the\
  \ suspected cause, and the agreed treatment.\n\n## Rules\n\n- Report problems; do\
  \ not alter the source data. Write cleaned data to a new file and document every\
  \ change.\n- Do not call a spike an incident without corroboration (other metrics,\
  \ logs, or a human).\n- State the interval and thresholds you used so results are\
  \ reproducible.\n- Convert UTC times to the user's time zone when presenting them.\n\
  \x1FFILE:references/anomaly-methods.md\x1E\n# Anomaly Methods and Tuning\n\n## Interval\
  \ inference\nThe expected interval is the median spacing between sorted unique timestamps.\
  \ This survives a few gaps and jitter. Pass `--interval` when the series is mostly\
  \ gaps (sparse events) or when you know the scrape interval.\n\nA gap is any spacing\
  \ above 1.5x the interval, so 5-minute data with a 7-minute spacing is not a gap\
  \ but a 10-minute spacing is (1 missing point).\n\n## Robust spikes (rolling median\
  \ + MAD)\nFor each point, take up to `--window` neighbours on each side (excluding\
  \ the point), compute their median and the median absolute deviation (MAD). The\
  \ robust z-score is:\n\n    z = |value - median| / (1.4826 * MAD)\n\n1.4826 makes\
  \ MAD comparable to a standard deviation for normal data. Default threshold 4 is\
  \ roughly a 1-in-15,000 event for normal noise. When more than half the neighbours\
  \ are identical (MAD = 0), the mean absolute deviation is used, and for a perfectly\
  \ flat neighbourhood 1% of the level.\n\nWhy not mean and standard deviation? One\
  \ large spike inflates the standard deviation and hides itself. The median and MAD\
  \ ignore it.\n\n## Tuning\n| Data | Suggestion |\n|---|---|\n| Noisy metrics (latency,\
  \ CPU) | `--z 5`, `--window 12` |\n| Daily or weekly seasonality | Check one season\
  \ at a time, or compare to the same hour last week before trusting spikes |\n| Bursty\
  \ business data (orders) | Higher `--z` (6-8); spikes are often real |\n| Integer\
  \ or low-resolution values | Expect MAD = 0; raise `--z` or aggregate first |\n\
  | On/off or status signals | Ignore flatline; check only gaps |\n| Counters | Always\
  \ pass `--counter`; check rates after handling resets |\n\n## Known limits\n- Gradual\
  \ drifts and level shifts are not spikes; plot the series or compare week-over-week\
  \ medians.\n- The first and last few points have fewer neighbours, so their scores\
  \ are less reliable.\n- Irregular event streams (logins, purchases) have no fixed\
  \ interval; aggregate into buckets first.\n\x1FFILE:references/gap-handling-playbook.md\x1E\
  \n# Gap and Anomaly Handling Playbook\n\n| Problem | Likely causes | Default treatment\
  \ | Avoid |\n|---|---|---|---|\n| Short gap (1-2 points) | scrape timeout, network\
  \ blip | Linear interpolation for smooth signals; leave null for counts | Filling\
  \ counts with zero |\n| Long gap | collector down, deploy, host off | Leave null\
  \ and annotate the chart; exclude from SLO math or count as unknown | Interpolating\
  \ across hours |\n| Duplicate timestamps | double scrape, retried batch, merged\
  \ files | Keep one row (first, or the one with most fields); check whether values\
  \ differ | Summing duplicates |\n| Out-of-order rows | late-arriving data, file\
  \ concatenation | Sort by time before any windowed calculation | Assuming file order\
  \ is time order |\n| Missing values | sensor dropout, parse errors, \"N/A\" strings\
  \ | Fix the parser first; then treat as a gap | Treating blank as 0 |\n| Flatline\
  \ | stuck exporter, cached value, sensor freeze | Confirm with a second source;\
  \ mark as suspect | Trusting it for alerts |\n| Spike (single point) | glitch, unit\
  \ error, real burst | Check related columns and logs; cap or remove only with a\
  \ documented reason | Deleting without a note |\n| Counter reset | process restart,\
  \ overflow | Compute rates per segment (rate after reset = new value / interval)\
  \ | Negative rates |\n\n## Before modeling or forecasting\n1. Sort, de-duplicate,\
  \ and regularize to the expected interval (insert nulls for missing slots).\n2.\
  \ Decide gap policy per column and record it.\n3. Keep a mask column (`is_imputed`)\
  \ so models and readers know what was filled.\n4. Re-run the checker on the cleaned\
  \ file and attach both reports.\n\n## When to escalate\n- Completeness under 90%\
  \ for a metric used in an SLO or invoice.\n- Gaps that repeat at the same time every\
  \ day (a job is killing the collector).\n- Spikes that appear in all hosts at once\
  \ (a real incident, not a data issue).\n\x1FFILE:templates/data-quality-report.md\x1E\
  \n# Time Series Data Quality - <dataset or dashboard>\n\n**Source:** <file / query>\
  \  **Range:** <start> to <end> (<time zone>)  **Interval:** <expected>\n**Rows:**\
  \ <n>  **Completeness:** <percent>  **Thresholds:** z=<z>, window=<w>, flatline=<n>\n\
  \n## Summary\n<two sentences: can this data be trusted for the intended use, and\
  \ what must change first>\n\n## Issues\n| Kind | When (<time zone>) | Column | Detail\
  \ | Suspected cause | Treatment |\n|---|---|---|---|---|---|\n| | | | | | |\n\n\
  ## Decisions\n- Gap policy: <interpolate short gaps / leave null / exclude>\n- Outlier\
  \ policy: <keep / cap / remove with note>\n- Counter handling: <segment rates at\
  \ resets>\n\n## Follow-ups\n- [ ] <fix collector / parser / alert> - owner <name>\
  \ - due <date>\n\nGenerated with scripts/ts_check.py. Source data was not modified.\n\
  \x1FFILE:examples/api-metrics.csv\x1E\ntimestamp,p95_latency_ms,error_rate,requests_total\n\
  2026-10-18T22:00:00Z,182,0.4,1200\n2026-10-18T22:05:00Z,176,0.3,2435\n2026-10-18T22:10:00Z,190,0.5,3705\n\
  2026-10-18T22:15:00Z,185,0.4,5010\n2026-10-18T22:20:00Z,179,0.3,6210\n2026-10-18T22:25:00Z,188,0.4,7445\n\
  2026-10-18T22:30:00Z,181,0.5,8715\n2026-10-18T22:35:00Z,193,0.4,10020\n2026-10-18T22:35:00Z,193,0.4,10020\n\
  2026-10-18T22:40:00Z,177,0.3,11220\n2026-10-18T22:45:00Z,184,0.4,12455\n2026-10-18T22:50:00Z,186,0.4,13725\n\
  2026-10-18T22:55:00Z,180,0.4,15030\n2026-10-18T23:00:00Z,191,0.4,16230\n2026-10-18T23:05:00Z,,0.4,17465\n\
  2026-10-18T23:10:00Z,178,0.4,18735\n2026-10-18T23:15:00Z,187,0.4,20040\n2026-10-18T23:20:00Z,182,0.4,21240\n\
  2026-10-18T23:25:00Z,189,0.4,22475\n2026-10-18T23:30:00Z,612,2.1,23745\n2026-10-18T23:35:00Z,185,0.5,25050\n\
  2026-10-18T23:40:00Z,180,0.3,26250\n2026-10-18T23:45:00Z,184,0.4,27485\n2026-10-19T00:10:00Z,188,0.5,28755\n\
  2026-10-19T00:15:00Z,183,0.4,30060\n2026-10-19T00:20:00Z,177,0.3,31260\n2026-10-19T00:25:00Z,185,0.4,32495\n\
  2026-10-19T00:30:00Z,182,0.5,1180\n2026-10-19T00:35:00Z,189,0.4,2485\n2026-10-19T00:40:00Z,184,0.3,3685\n\
  2026-10-19T00:45:00Z,180,0.4,4920\n2026-10-19T00:50:00Z,186,0.5,6190\n2026-10-19T00:55:00Z,183,0.4,7495\n\
  \x1FFILE:scripts/ts_check.py\x1E\n#!/usr/bin/env python3\n\"\"\"Time series gap\
  \ and anomaly checker for CSV metrics (Python 3 standard library only).\n\nReads\
  \ a CSV with a timestamp column and one or more numeric columns, infers the sampling\n\
  interval (median spacing) unless --interval is given, and reports:\n  gap      \
  \    missing samples (spacing > 1.5 x interval), with how many points are missing\n\
  \  duplicate    repeated timestamps\n  out_of_order timestamps that go backwards\n\
  \  missing      empty, NaN, or non-numeric values\n  flatline     the same value\
  \ repeated for >= --flatline-points samples (stuck sensor/exporter)\n  spike   \
  \     robust outliers: |value - rolling median| / (1.4826 * MAD) >= --z (default\
  \ 4);\n               if MAD is 0 the mean absolute deviation is used instead\n\
  \  reset        a counter column that decreases (--counter col1,col2)\n\nTimestamps:\
  \ ISO 8601 (with Z or offset; naive = UTC) or Unix epoch seconds/milliseconds.\n\
  \nUsage:\n  python3 ts_check.py metrics.csv\n  python3 ts_check.py metrics.csv --time-col\
  \ ts --cols cpu,latency_ms --interval 5m --z 5\n  python3 ts_check.py metrics.csv\
  \ --counter requests_total --json\n  python3 ts_check.py --self-test\nExit code:\
  \ 0 clean, 1 issues found, 2 bad input.\n\"\"\"\nimport argparse\nimport csv\nimport\
  \ datetime as dt\nimport io\nimport json\nimport math\nimport re\nimport statistics\n\
  import sys\n\n\nclass InputError(ValueError):\n    pass\n\n\ndef parse_ts(raw):\n\
  \    s = (raw or \"\").strip()\n    if not s:\n        raise InputError(\"empty\
  \ timestamp\")\n    if re.fullmatch(r\"-?\\d+(\\.\\d+)?\", s):\n        v = float(s)\n\
  \        return v / 1000.0 if v > 1e11 else v\n    try:\n        t = dt.datetime.fromisoformat(s.replace(\"\
  Z\", \"+00:00\").replace(\" \", \"T\", 1))\n    except ValueError:\n        raise\
  \ InputError(f\"unparseable timestamp {s!r}\")\n    if t.tzinfo is None:\n     \
  \   t = t.replace(tzinfo=dt.timezone.utc)\n    return t.timestamp()\n\n\ndef parse_interval(s):\n\
  \    m = re.fullmatch(r\"(\\d+(?:\\.\\d+)?)\\s*(ms|s|m|h|d)?\", s.strip())\n   \
  \ if not m:\n        raise InputError(f\"bad interval {s!r}; use e.g. 30s, 5m, 1h\"\
  )\n    mult = {\"ms\": 0.001, \"s\": 1, None: 1, \"m\": 60, \"h\": 3600, \"d\":\
  \ 86400}[m.group(2)]\n    return float(m.group(1)) * mult\n\n\ndef fmt_ts(ts):\n\
  \    return dt.datetime.fromtimestamp(ts, dt.timezone.utc).strftime(\"%Y-%m-%dT%H:%M:%SZ\"\
  )\n\n\ndef fmt_dur(sec):\n    for unit, size in ((\"d\", 86400), (\"h\", 3600),\
  \ (\"m\", 60)):\n        if sec >= size:\n            v = sec / size\n         \
  \   return f\"{v:.0f}{unit}\" if v == int(v) else f\"{v:.1f}{unit}\"\n    return\
  \ f\"{sec:g}s\"\n\n\ndef to_float(raw):\n    s = (raw or \"\").strip()\n    if s\
  \ == \"\" or s.lower() in (\"nan\", \"null\", \"none\", \"na\", \"n/a\", \"-\"):\n\
  \        return None\n    try:\n        v = float(s)\n    except ValueError:\n \
  \       return None\n    return None if math.isnan(v) or math.isinf(v) else v\n\n\
  \ndef load(text, time_col=None, cols=None):\n    reader = csv.DictReader(io.StringIO(text))\n\
  \    if not reader.fieldnames:\n        raise InputError(\"CSV has no header row\"\
  )\n    fields = [f.strip() for f in reader.fieldnames]\n    reader.fieldnames =\
  \ fields\n    if time_col is None:\n        cands = [f for f in fields if f.lower()\
  \ in (\"timestamp\", \"time\", \"ts\", \"date\", \"datetime\")]\n        time_col\
  \ = cands[0] if cands else fields[0]\n    if time_col not in fields:\n        raise\
  \ InputError(f\"time column {time_col!r} not in header {fields}\")\n    value_cols\
  \ = cols or [f for f in fields if f != time_col]\n    for c in value_cols:\n   \
  \     if c not in fields:\n            raise InputError(f\"column {c!r} not in header\
  \ {fields}\")\n    rows = []\n    for i, r in enumerate(reader, start=2):\n    \
  \    rows.append({\"line\": i, \"ts\": parse_ts(r.get(time_col)),\n            \
  \         \"raw\": {c: r.get(c) for c in value_cols}})\n    if len(rows) < 3:\n\
  \        raise InputError(\"need at least 3 data rows\")\n    return time_col, value_cols,\
  \ rows\n\n\ndef rolling_robust(values, idx, window):\n    lo, hi = max(0, idx -\
  \ window), min(len(values), idx + window + 1)\n    neigh = [values[j] for j in range(lo,\
  \ hi) if j != idx and values[j] is not None]\n    if len(neigh) < 4:\n        return\
  \ None, None\n    med = statistics.median(neigh)\n    mad = statistics.median(abs(v\
  \ - med) for v in neigh)\n    scale = 1.4826 * mad\n    if scale == 0:  # more than\
  \ half the neighbours equal the median: fall back to mean absolute deviation\n \
  \       scale = 1.2533 * statistics.fmean(abs(v - med) for v in neigh)\n    if scale\
  \ == 0:  # perfectly flat neighbourhood: 1% of the level\n        scale = max(abs(med)\
  \ * 0.01, 1e-9)\n    return med, scale\n\n\ndef check(text, time_col=None, cols=None,\
  \ interval=None, z=4.0, window=6, flatline_points=6, counters=()):\n    time_col,\
  \ value_cols, rows = load(text, time_col, cols)\n    issues = []\n\n    def add(kind,\
  \ line, ts, col, detail):\n        issues.append({\"kind\": kind, \"line\": line,\
  \ \"time\": fmt_ts(ts), \"column\": col, \"detail\": detail})\n\n    # order and\
  \ duplicates (in file order)\n    seen = {}\n    for prev, cur in zip(rows, rows[1:]):\n\
  \        if cur[\"ts\"] < prev[\"ts\"]:\n            add(\"out_of_order\", cur[\"\
  line\"], cur[\"ts\"], time_col, f\"goes back {fmt_dur(prev['ts'] - cur['ts'])} from\
  \ line {prev['line']}\")\n    for r in rows:\n        if r[\"ts\"] in seen:\n  \
  \          add(\"duplicate\", r[\"line\"], r[\"ts\"], time_col, f\"same timestamp\
  \ as line {seen[r['ts']]}\")\n        else:\n            seen[r[\"ts\"]] = r[\"\
  line\"]\n    srt = sorted({r[\"ts\"]: r for r in reversed(rows)}.values(), key=lambda\
  \ r: r[\"ts\"])  # first occurrence wins\n    diffs = [b[\"ts\"] - a[\"ts\"] for\
  \ a, b in zip(srt, srt[1:]) if b[\"ts\"] > a[\"ts\"]]\n    if interval is None:\n\
  \        if not diffs:\n            raise InputError(\"cannot infer interval: all\
  \ timestamps identical\")\n        interval = statistics.median(diffs)\n    expected\
  \ = int(round((srt[-1][\"ts\"] - srt[0][\"ts\"]) / interval)) + 1\n    missing_points\
  \ = 0\n    for a, b in zip(srt, srt[1:]):\n        d = b[\"ts\"] - a[\"ts\"]\n \
  \       if d > 1.5 * interval:\n            n = int(round(d / interval)) - 1\n \
  \           missing_points += n\n            add(\"gap\", b[\"line\"], a[\"ts\"\
  ], time_col, f\"{fmt_dur(d)} without data after {fmt_ts(a['ts'])} (~{n} missing)\"\
  )\n\n    stats = {}\n    for c in value_cols:\n        vals = [to_float(r[\"raw\"\
  ][c]) for r in srt]\n        for r, v in zip(srt, vals):\n            if v is None:\n\
  \                add(\"missing\", r[\"line\"], r[\"ts\"], c, f\"value {r['raw'][c]!r}\
  \ is empty or not numeric\")\n        # flatline runs\n        run_start = 0\n \
  \       for i in range(1, len(vals) + 1):\n            if i < len(vals) and vals[i]\
  \ is not None and vals[i] == vals[run_start]:\n                continue\n      \
  \      length = i - run_start\n            if vals[run_start] is not None and length\
  \ >= flatline_points:\n                r0, r1 = srt[run_start], srt[i - 1]\n   \
  \             add(\"flatline\", r0[\"line\"], r0[\"ts\"], c, f\"value {vals[run_start]:g}\
  \ repeated {length}x until {fmt_ts(r1['ts'])}\")\n            run_start = i\n  \
  \      if c in counters:\n            for i in range(1, len(vals)):\n          \
  \      if vals[i] is not None and vals[i - 1] is not None and vals[i] < vals[i -\
  \ 1]:\n                    add(\"reset\", srt[i][\"line\"], srt[i][\"ts\"], c, f\"\
  counter dropped {vals[i - 1]:g} -> {vals[i]:g} (restart or wrap)\")\n        else:\n\
  \            for i, v in enumerate(vals):\n                if v is None:\n     \
  \               continue\n                med, scale = rolling_robust(vals, i, window)\n\
  \                if med is None:\n                    continue\n               \
  \ score = abs(v - med) / scale\n                if score >= z:\n               \
  \     add(\"spike\", srt[i][\"line\"], srt[i][\"ts\"], c, f\"{v:g} vs local median\
  \ {med:g} (robust z {score:.1f})\")\n        good = [v for v in vals if v is not\
  \ None]\n        stats[c] = {\"count\": len(good), \"min\": min(good) if good else\
  \ None, \"max\": max(good) if good else None,\n                    \"median\": statistics.median(good)\
  \ if good else None}\n\n    order = {\"out_of_order\": 0, \"duplicate\": 1, \"gap\"\
  : 2, \"reset\": 3, \"missing\": 4, \"flatline\": 5, \"spike\": 6}\n    issues.sort(key=lambda\
  \ x: (order[x[\"kind\"]], x[\"time\"], x[\"column\"]))\n    counts = {}\n    for\
  \ it in issues:\n        counts[it[\"kind\"]] = counts.get(it[\"kind\"], 0) + 1\n\
  \    return {\n        \"rows\": len(rows), \"time_column\": time_col, \"columns\"\
  : value_cols,\n        \"start\": fmt_ts(srt[0][\"ts\"]), \"end\": fmt_ts(srt[-1][\"\
  ts\"]),\n        \"interval\": fmt_dur(interval), \"interval_seconds\": interval,\n\
  \        \"expected_points\": expected, \"missing_points\": missing_points,\n  \
  \      \"completeness\": round(100.0 * len(srt) / expected, 1) if expected else\
  \ 100.0,\n        \"stats\": stats, \"counts\": counts, \"issues\": issues,\n  \
  \  }\n\n\ndef to_markdown(r):\n    lines = [\"# Time series check\", \"\",\n   \
  \          f\"Rows: {r['rows']}  Range: {r['start']} to {r['end']}  Interval: {r['interval']}\"\
  ,\n             f\"Completeness: {r['completeness']}% ({r['missing_points']} of\
  \ {r['expected_points']} expected points missing)\", \"\",\n             \"| Column\
  \ | Count | Min | Median | Max |\", \"|---|---|---|---|---|\"]\n    for c, s in\
  \ r[\"stats\"].items():\n        f = lambda v: \"-\" if v is None else f\"{v:g}\"\
  \n        lines.append(f\"| {c} | {s['count']} | {f(s['min'])} | {f(s['median'])}\
  \ | {f(s['max'])} |\")\n    lines += [\"\", \"## Issues\"]\n    if not r[\"issues\"\
  ]:\n        lines.append(\"No issues found.\")\n    else:\n        lines.append(\"\
  Totals: \" + \", \".join(f\"{k} {v}\" for k, v in r[\"counts\"].items()))\n    \
  \    lines += [\"\", \"| Kind | Time (UTC) | Column | Line | Detail |\", \"|---|---|---|---|---|\"\
  ]\n        lines += [f\"| {i['kind']} | {i['time']} | {i['column']} | {i['line']}\
  \ | {i['detail']} |\" for i in r[\"issues\"]]\n    return \"\\n\".join(lines)\n\n\
  \ndef self_test():\n    cases = []\n\n    def ok(name, cond):\n        cases.append((name,\
  \ bool(cond)))\n\n    base = 1760860800  # 2025-10-19T08:00:00Z\n    def csv_of(points,\
  \ header=\"timestamp,value\"):\n        return header + \"\\n\" + \"\\n\".join(f\"\
  {t},{v}\" for t, v in points) + \"\\n\"\n    wave = [10 + (i % 3) for i in range(30)]\n\
  \    clean = csv_of([(base + 60 * i, v) for i, v in enumerate(wave)])\n    r = check(clean)\n\
  \    ok(\"clean series has no issues\", r[\"issues\"] == [])\n    ok(\"interval\
  \ inferred as 1m\", r[\"interval\"] == \"1m\")\n    ok(\"completeness 100%\", r[\"\
  completeness\"] == 100.0)\n    gap_pts = [(base + 60 * i, v) for i, v in enumerate(wave)\
  \ if not 10 <= i < 15]\n    r = check(csv_of(gap_pts))\n    ok(\"gap detected\"\
  , r[\"counts\"].get(\"gap\") == 1)\n    ok(\"gap counts 5 missing points\", r[\"\
  missing_points\"] == 5)\n    spiky = list(wave); spiky[20] = 95\n    r = check(csv_of([(base\
  \ + 60 * i, v) for i, v in enumerate(spiky)]))\n    ok(\"spike detected\", [i[\"\
  line\"] for i in r[\"issues\"] if i[\"kind\"] == \"spike\"] == [22])\n    flat =\
  \ list(wave); flat[5:13] = [7] * 8\n    r = check(csv_of([(base + 60 * i, v) for\
  \ i, v in enumerate(flat)]), z=100)\n    ok(\"flatline detected\", r[\"counts\"\
  ].get(\"flatline\") == 1)\n    miss = [(base + 60 * i, (\"\" if i == 4 else \"NaN\"\
  \ if i == 9 else v)) for i, v in enumerate(wave)]\n    ok(\"missing values detected\"\
  , check(csv_of(miss)).get(\"counts\").get(\"missing\") == 2)\n    dup = [(base +\
  \ 60 * i, v) for i, v in enumerate(wave)]\n    dup.insert(6, dup[5])\n    ok(\"\
  duplicate detected\", check(csv_of(dup))[\"counts\"].get(\"duplicate\") == 1)\n\
  \    ooo = [(base + 60 * i, v) for i, v in enumerate(wave)]\n    ooo[7], ooo[8]\
  \ = ooo[8], ooo[7]\n    ok(\"out of order detected\", check(csv_of(ooo))[\"counts\"\
  ].get(\"out_of_order\") == 1)\n    counter = [(base + 60 * i, 100 * i if i < 20\
  \ else 100 * (i - 20)) for i in range(30)]\n    r = check(csv_of(counter, \"ts,requests_total\"\
  ), counters=(\"requests_total\",))\n    ok(\"counter reset detected\", r[\"counts\"\
  ].get(\"reset\") == 1 and \"spike\" not in r[\"counts\"])\n    iso_rows = \"time,cpu\\\
  n\" + \"\\n\".join(f\"2026-10-19T08:{i:02d}:00Z,{40 + (i % 2)}\" for i in range(0,\
  \ 60, 5)) + \"\\n\"\n    r = check(iso_rows)\n    ok(\"ISO timestamps and 5m interval\"\
  , r[\"interval\"] == \"5m\" and r[\"issues\"] == [])\n    ms_rows = csv_of([((base\
  \ + 30 * i) * 1000, v) for i, v in enumerate(wave)])\n    ok(\"epoch milliseconds\
  \ accepted\", check(ms_rows)[\"interval\"] == \"30s\")\n    r = check(clean, interval=30.0)\n\
  \    ok(\"explicit 30s interval flags every 1m step as a gap\", r[\"counts\"].get(\"\
  gap\") == 29 and r[\"completeness\"] < 60)\n    jitter = csv_of([(base + 60 * i\
  \ + (3 if i % 2 else -2), v) for i, v in enumerate(wave)])\n    ok(\"small timestamp\
  \ jitter is not a gap\", \"gap\" not in check(jitter)[\"counts\"])\n    multi =\
  \ \"timestamp,a,b\\n\" + \"\\n\".join(f\"{base + 60 * i},{wave[i]},{wave[i] * 2\
  \ if i != 12 else 500}\" for i in range(30)) + \"\\n\"\n    r = check(multi, cols=[\"\
  a\", \"b\"])\n    ok(\"multi-column spike only in b\", {i[\"column\"] for i in r[\"\
  issues\"]} == {\"b\"})\n    for bad, label in ((\"timestamp,value\\n1,2\\n\", \"\
  too few rows rejected\"),\n                       (\"timestamp,value\\nyesterday,1\\\
  ntoday,2\\nnow,3\\n\", \"bad timestamp rejected\")):\n        try:\n           \
  \ check(bad)\n            ok(label, False)\n        except InputError:\n       \
  \     ok(label, True)\n    ok(\"markdown renders\", \"## Issues\" in to_markdown(check(clean)))\n\
  \    passed = sum(c for _, c in cases)\n    for name, c in cases:\n        print((\"\
  PASS \" if c else \"FAIL \") + name)\n    print(f\"{passed}/{len(cases)} passed\"\
  )\n    return 0 if passed == len(cases) else 1\n\n\ndef main(argv=None):\n    ap\
  \ = argparse.ArgumentParser(description=\"Find gaps, duplicates, flatlines, spikes,\
  \ and counter resets in CSV metrics.\")\n    ap.add_argument(\"csv\", nargs=\"?\"\
  , help=\"CSV file, or '-' for stdin\")\n    ap.add_argument(\"--time-col\")\n  \
  \  ap.add_argument(\"--cols\", help=\"comma-separated value columns (default: all\
  \ except the time column)\")\n    ap.add_argument(\"--interval\", help=\"expected\
  \ spacing, e.g. 30s, 5m, 1h (default: median spacing)\")\n    ap.add_argument(\"\
  --z\", type=float, default=4.0, help=\"robust z-score threshold for spikes (default\
  \ 4)\")\n    ap.add_argument(\"--window\", type=int, default=6, help=\"neighbours\
  \ on each side for the rolling median (default 6)\")\n    ap.add_argument(\"--flatline-points\"\
  , type=int, default=6)\n    ap.add_argument(\"--counter\", default=\"\", help=\"\
  comma-separated monotonic counter columns (checked for resets, not spikes)\")\n\
  \    ap.add_argument(\"--json\", action=\"store_true\")\n    ap.add_argument(\"\
  --self-test\", action=\"store_true\")\n    a = ap.parse_args(argv)\n    if a.self_test:\n\
  \        return self_test()\n    if not a.csv:\n        ap.error(\"csv path required\
  \ (or --self-test)\")\n    try:\n        text = sys.stdin.read() if a.csv == \"\
  -\" else open(a.csv, encoding=\"utf-8-sig\").read()\n        r = check(text, a.time_col,\
  \ [c.strip() for c in a.cols.split(\",\")] if a.cols else None,\n              \
  \    parse_interval(a.interval) if a.interval else None, a.z, a.window, a.flatline_points,\n\
  \                  tuple(c.strip() for c in a.counter.split(\",\") if c.strip()))\n\
  \    except (OSError, InputError) as e:\n        print(f\"error: {e}\", file=sys.stderr)\n\
  \        return 2\n    print(json.dumps(r, indent=2) if a.json else to_markdown(r))\n\
  \    return 1 if r[\"issues\"] else 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())"
