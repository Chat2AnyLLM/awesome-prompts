title: Glacier Calving into a Turquoise Arctic Fjord (Image-to-Video Animation)
description: Imported from Prompts Chat
prompt: 'Use the attached still (step 1: a tidewater glacier front meeting a calm
  turquoise fjord at Arctic evening) as the exact first frame and animate it into
  a 6-second, 16:9 cinematic shot. Keep every element where it is in the still: the
  tall white and deep-blue glacier face across the middle of the frame, the large
  leaning ice tower near the center, the dark snow-patched mountains and pale pink-gold
  sky behind, the glassy foreground water with small floating icebergs and brash ice,
  the seabirds on the floe at the right, and the warm low sun from the right.


  Motion (0-6 s):

  - 0-1.5 s: stillness; faint ripples move across the water and tiny ice fragments
  drift slowly.

  - 1.5-3.5 s: the leaning ice tower near the center cracks at its base, tilts forward
  and collapses into the fjord, shedding chunks of ice and a puff of white ice dust.

  - 3.5-6 s: a large white splash rises and falls back, a wave rolls outward toward
  the camera, the floating icebergs bob and rock, and the seabirds lift off the floe
  and fly out of frame to the right.


  Camera: locked-off, steady tripod-like framing from water level, with only a very
  slight rise as the wave arrives; no cuts, no zoom.


  Lighting and mood: the warm evening light and sky stay constant; dramatic but natural.


  Audio (if supported): a deep crack and thunderous rumble, a heavy splash, then lapping
  water and distant bird calls; no music, no voices.


  Avoid: people, boats, text, new objects, the whole glacier collapsing, sudden lighting
  changes, morphing mountains, unrealistic water.'
