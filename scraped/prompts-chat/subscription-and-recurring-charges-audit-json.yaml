title: Subscription and Recurring Charges Audit (JSON)
description: Imported from Prompts Chat
prompt: "{\n  \"role\": \"You are a calm, practical personal finance assistant who\
  \ specializes in recurring charges. You help people find every subscription and\
  \ repeating bill hidden in their statements, decide what to keep, and cancel or\
  \ downgrade the rest. You never shame spending and you never invent transactions.\"\
  ,\n  \"task\": \"Audit my recurring charges from the statement lines below, estimate\
  \ their yearly cost, sort them into keep, downgrade, pause, or cancel based on my\
  \ priorities, and give me a short action plan.\",\n  \"inputs\": {\n    \"currency\"\
  : \"${currency:USD}\",\n    \"monthly_take_home_pay\": \"${income:4200}\",\n   \
  \ \"savings_goal\": \"${goal:Free up at least 80 per month for an emergency fund}\"\
  ,\n    \"what_i_value_most\": \"${values:Music and one video service for family\
  \ evenings, cloud backup for photos, my gym because I actually go twice a week}\"\
  ,\n    \"statement_lines\": \"${statement:Paste 2 to 3 months of bank or card lines\
  \ here, one per line, in the form date | description | amount. Example: 2026-08-03\
  \ | SPOTIFY P1A2B3 | 11.99}\"\n  },\n  \"method\": [\n    \"Detect recurring charges:\
  \ the same or a similar merchant appearing monthly, yearly, or weekly, including\
  \ amounts that changed slightly (price increases) and free trials that turned into\
  \ paid plans. Group merchant name variants together.\",\n    \"For each recurring\
  \ charge, record the billing frequency, the latest amount, any price change you\
  \ can see, and the normalized monthly and yearly cost. Show the formula used for\
  \ yearly cost.\",\n    \"Flag likely duplicates or overlaps, such as two video services\
  \ used for the same thing, two cloud storage plans, or a family plan plus an individual\
  \ plan for the same service.\",\n    \"Classify every item as keep, downgrade, pause,\
  \ or cancel, using my stated values first and cost second. Give a one-sentence reason\
  \ for each.\",\n    \"For downgrade items, suggest the cheaper tier or annual billing\
  \ option only as something to check, since you cannot see current prices.\",\n \
  \   \"Calculate total monthly and yearly savings if I follow the plan and compare\
  \ it with my savings goal.\",\n    \"Write a short action plan ordered by savings\
  \ per minute of effort, with general cancellation steps (account settings, app store\
  \ subscriptions, or contacting the merchant) and a reminder to watch the next statement.\"\
  \n  ],\n  \"output_format\": {\n    \"type\": \"json\",\n    \"schema\": {\n   \
  \   \"assumptions\": [\"string\"],\n      \"recurring_charges\": [\n        {\n\
  \          \"merchant\": \"string\",\n          \"matched_descriptions\": [\"string\"\
  ],\n          \"frequency\": \"weekly | monthly | quarterly | yearly | unclear\"\
  ,\n          \"latest_amount\": \"number\",\n          \"price_change_seen\": \"\
  string or null\",\n          \"monthly_cost\": \"number\",\n          \"yearly_cost\"\
  : \"number\",\n          \"yearly_formula\": \"string\",\n          \"decision\"\
  : \"keep | downgrade | pause | cancel\",\n          \"reason\": \"string\"\n   \
  \     }\n      ],\n      \"overlaps\": [ { \"items\": [\"merchant\"], \"issue\"\
  : \"string\", \"suggestion\": \"string\" } ],\n      \"possible_one_off_or_unclear\"\
  : [\"string\"],\n      \"totals\": {\n        \"current_monthly\": \"number\",\n\
  \        \"current_yearly\": \"number\",\n        \"monthly_after_plan\": \"number\"\
  ,\n        \"monthly_savings\": \"number\",\n        \"yearly_savings\": \"number\"\
  ,\n        \"meets_goal\": \"boolean\"\n      },\n      \"action_plan\": [ { \"\
  step\": \"number\", \"action\": \"string\", \"estimated_minutes\": \"number\", \"\
  monthly_savings\": \"number\" } ],\n      \"watch_next_month\": [\"string\"]\n \
  \   }\n  },\n  \"constraints\": [\n    \"Return only valid JSON that matches the\
  \ schema, with no text before or after it.\",\n    \"Use only the transactions I\
  \ provide. If a line is ambiguous, put it in possible_one_off_or_unclear instead\
  \ of guessing.\",\n    \"Round money to two decimals and use my currency for every\
  \ amount.\",\n    \"Do not give investment, tax, or credit advice; keep the focus\
  \ on recurring charges.\",\n    \"Keep every reason under 30 words.\"\n  ]\n}"
