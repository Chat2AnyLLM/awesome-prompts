prompt: 'Style: Pixar-style 3D animated family drama, warm cinematic morning light
  through a round window, soft shadows, 24 fps, STATIC LOCKED CAMERA for the whole
  clip, same framing as the start frame, smooth natural motion. 16:9, 8 seconds.


  Characters:

  - THE FATHER: adult hedgehog, brown fur, dark spines with cream tips, mustard-yellow
  knitted scarf, dark green vest, exactly two small round hedgehog ears. Determined
  face.

  - SEU BENTO: an old crow, dark grey feathers, round golden glasses, red bow tie,
  brown tweed beret, dark grey beak. Worried face.

  Same faces, outfits and colors in every shot. Only these two characters.


  Location: A cozy hedgehog burrow carved inside tree roots: round window on screen-left,
  wooden shelves with jars, a stone fireplace with fire on screen-right, a colorful
  crocheted rug in the center with several pulled spines lying on it. Bento is perched
  ON THE SILL of the round window on screen-left; the father stands on the rug at
  screen-center, holding one pulled spine in his paw.


  SHOT SEQUENCE:

  * 0-2s: Wide shot. The father throws the spine down onto the pile of spines on the
  rug. Determined, not smiling. Mouths closed.

  * 2-4s: Wide shot. The father looks at Bento and lifts his chin, firm and stubborn.
  Bento looks back, worried. Mouths closed.

  * 4-6s: Wide shot. The father reaches to his own shoulder, pulls out one more spine
  and winces in pain. Mouths closed.

  * 6-8s: Wide shot. Bento slowly shakes his head, opens his wings and flies away
  out through the round window. The father, now alone, turns his head toward screen-right
  as if he heard a voice. Mouths closed.


  Audio: No dialogue. A small tick when the spine hits the rug at 1s, crackling fireplace,
  low emotional piano, a small "pop" at 4.5s, wing flaps at 6.5s, a suspense note
  at the end. No narration.


  Negative: distorted faces, melting features, extra ears, fox or rabbit ears, the
  father turning into another animal, Bento losing his glasses, beret or bow tie,
  yellow or orange beak, changing faces or outfits, extra characters, duplicated characters,
  Bento entering the room, deformed wings, camera movement, zoom, cuts, scene jumps,
  teleportation, flickering, jittery motion, deformed hands, subtitles, readable text,
  logos, watermark.'
