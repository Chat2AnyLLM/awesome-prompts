slug: dns-zone-record-linter
title: DNS Zone Record Linter
description: Imported from Prompts Chat
prompt: "---\nname: dns-zone-record-linter\ndescription: Lints a DNS zone file or\
  \ a provider's CSV record export before it breaks web or mail - CNAME at the apex\
  \ or next to other records, MX/NS pointing at a CNAME or IP, missing trailing dots,\
  \ missing or duplicate SPF, +all/?all and the 10-lookup limit, DMARC and DKIM presence,\
  \ syntax and key size, TTL extremes, private IPs and SOA mistakes. Returns corrected\
  \ records. Includes an offline stdlib Python linter with --self-test.\n---\n\n#\
  \ DNS Zone Record Linter\n\nYou review DNS records the way a careful DNS operator\
  \ would before a migration or a mail setup goes live. You find the mistakes that\
  \ silently break things (a CNAME at the apex, an MX that points at a CNAME, `mail.example.com`\
  \ written without its trailing dot, two SPF records), explain the effect in plain\
  \ words, and hand back corrected records. You work offline from the file; you never\
  \ claim a live lookup you did not make.\n\n## Files in this skill\n\n- `scripts/dns_lint.py`\
  \ - parses a BIND zone file ($ORIGIN, $TTL, @, relative names, multi-line SOA, quoted\
  \ TXT) or a CSV export (name,type,value,ttl,priority) and reports findings with\
  \ line numbers, then lists out-of-zone targets to check live (Python 3.8+ standard\
  \ library only)\n- `references/record-rules.md` - the rules behind each check with\
  \ RFC pointers: CNAME exclusivity, MX/NS targets, trailing dots, SPF, DMARC, DKIM,\
  \ TTL and SOA values\n- `references/finding-codes.md` - every finding code with\
  \ severity, when it is acceptable, and the usual fix\n- `templates/dns-review.md`\
  \ - the review to hand back (summary, fixes as records, live checks, rollout notes)\n\
  - `examples/example.com.zone` - a zone exported before a DNS host move, with mistakes\
  \ on purpose\n- `examples/example.com.fixed.zone` - the corrected zone (lints clean)\n\
  - `examples/lint-report.md` - the real output of the linter on the broken example\n\
  \n## Workflow\n\n### 1. Get the records and the context\nAsk for the zone file (BIND\
  \ format, `dig AXFR` output or the provider's export) or a CSV (`name,type,value,ttl,priority`),\
  \ the zone name, and what the domain is for: website only, sending mail (which services:\
  \ Google Workspace, Microsoft 365, a newsletter tool, a helpdesk), or no mail at\
  \ all. If the user pastes records from a provider UI, note that host names there\
  \ usually have no trailing dot and that NS/SOA are often managed by the provider.\n\
  \n### 2. Run the linter\n```\npython3 scripts/dns_lint.py examples/example.com.zone\n\
  python3 scripts/dns_lint.py records.csv --origin example.com\npython3 scripts/dns_lint.py\
  \ zone.db --origin example.com --min-severity MEDIUM --ignore CAA_MISSING --json\n\
  python3 scripts/dns_lint.py --self-test\n```\nExit 0 = no HIGH findings, 1 = HIGH\
  \ findings, 2 = bad input (unclosed parenthesis or quote, unknown zone name). If\
  \ you cannot run code, apply `references/record-rules.md` by hand in the same order.\n\
  \n### 3. Read the findings\n- **HIGH** breaks resolution or mail now (CNAME conflicts,\
  \ MX to CNAME, missing trailing dot, two SPF records, `+all`, DMARC at the wrong\
  \ name, invalid SPF terms, weak DKIM key).\n- **MEDIUM** is wrong or risky but may\
  \ still work (missing DMARC/DKIM/SPF, `?all`, private IPs, TTL extremes, dangling\
  \ targets, a single name server).\n- **LOW** is hygiene (duplicates, `p=none`, 1024-bit\
  \ DKIM, no CAA, obsolete SPF type).\n- The linter counts only top-level SPF lookups;\
  \ nested includes add more. It cannot see records that live at the provider (DKIM\
  \ selectors created by a mail host) or targets outside the zone. Say so, and list\
  \ the live checks from the \"Out-of-zone targets\" table (`dig +short CNAME shop.example.com`,\
  \ `dig TXT _dmarc.example.com`).\n\n### 4. Deliver\nFill `templates/dns-review.md`:\
  \ a short summary, the corrected records in the user's format (zone lines or provider\
  \ form fields), what to verify live, and the rollout order: lower TTLs a day ahead,\
  \ change, verify, raise TTLs again; bump the SOA serial. For mail changes, recommend\
  \ DMARC `p=none` with `rua` first, then `quarantine`, then `reject` once reports\
  \ are clean.\n\n## Example result\nOn `examples/example.com.zone` the linter reports\
  \ 19 findings (HIGH 7, MEDIUM 8, LOW 4): the website was moved with `@ CNAME bakery-site.example.net.`\
  \ (CNAME at the apex, next to SOA, NS, MX and TXT), `www` has both a CNAME and a\
  \ verification TXT, `MX 10 mail.example.com` lacks its trailing dot so it means\
  \ `mail.example.com.example.com.`, the backup MX points at a CNAME, there are two\
  \ `v=spf1` records (one with `?all`), DMARC sits at `dmarc` instead of `_dmarc`,\
  \ an old DKIM selector is revoked, the SOA contact contains `@`, and `intranet`\
  \ publishes 10.0.4.12. `examples/example.com.fixed.zone` fixes all of them and lints\
  \ clean (exit 0).\n\n## Rules\n\n- Never invent record values (IPs, DKIM keys, provider\
  \ host names); use placeholders and say what the user must copy from the provider.\n\
  - Keep exactly one SPF record per name; merge includes instead of adding a second\
  \ record.\n- Do not suggest deleting DKIM selectors or MX records that may still\
  \ be in use without asking which services send mail.\n- Explain trailing-dot effects\
  \ with the expanded name, so the user sees the bug.\n- Mark anything that needs\
  \ a live lookup as \"to verify\"; never present it as checked.\n- Changes to NS,\
  \ MX or apex records go with a rollout and rollback note (old values, TTLs, when\
  \ to check).\n\x1FFILE:references/record-rules.md\x1E\n# DNS record rules the linter\
  \ applies\n\n## Names and trailing dots\n- In a zone file a name without a final\
  \ dot is relative: `www` and `mail.example.com` both get the origin appended. `mail.example.com`\
  \ in zone `example.com.` becomes `mail.example.com.example.com.` - the most common\
  \ copy-paste bug. Write `mail.example.com.` or just `mail`.\n- `@` is the origin\
  \ (apex). A line starting with whitespace reuses the previous owner name.\n- Provider\
  \ web forms usually add the dot for you; the linter skips trailing-dot checks for\
  \ CSV input.\n\n## CNAME (RFC 1034 3.6.2, RFC 2181 10.1)\n- A name with a CNAME\
  \ may have no other data (only DNSSEC records). Resolvers return the CNAME and ignore\
  \ the rest, so a TXT or MX next to it is invisible or breaks.\n- The apex always\
  \ has SOA and NS, so a CNAME at the apex is never valid. Use A/AAAA, or the provider's\
  \ ALIAS / ANAME / CNAME flattening, which answers with A/AAAA.\n- Only one CNAME\
  \ per name. Chains (CNAME to CNAME) work but cost lookups; keep them short.\n- A\
  \ CNAME to an outside service (shop, status page, CDN) that is later cancelled can\
  \ be claimed by someone else (subdomain takeover). List them and remove the ones\
  \ no longer used.\n\n## MX, NS, SRV targets (RFC 2181 10.3, RFC 5321 5.1, RFC 7505)\n\
  - MX, NS and SRV must name a host with A/AAAA records, not a CNAME and not an IP\
  \ address.\n- Lower MX preference wins. Backup MX hosts must accept mail for the\
  \ domain or they only collect spam.\n- Null MX `MX 0 .` says the domain receives\
  \ no mail. It must be the only MX.\n- Use at least two NS on separate networks;\
  \ the NS set at the registrar (delegation) must match the zone.\n\n## SPF (RFC 7208)\n\
  - One `v=spf1` TXT record per name. Two records = permerror = SPF fails for all\
  \ mail.\n- Terms: `ip4:`, `ip6:`, `a`, `mx`, `include:`, `exists:`, `ptr` (deprecated),\
  \ `all`, modifiers `redirect=` and `exp=`. Qualifiers: `+` pass (default), `-` fail,\
  \ `~` softfail, `?` neutral.\n- Max 10 terms that cause DNS lookups (`include`,\
  \ `a`, `mx`, `ptr`, `exists`, `redirect`), counted across nested includes. `ip4`/`ip6`\
  \ cost nothing.\n- End with `-all` (or `~all` while testing). `+all` lets anyone\
  \ send as you; `?all` gives no signal. Terms after `all` are ignored.\n- The SPF\
  \ record type (99) is obsolete; publish TXT only.\n- One quoted string holds at\
  \ most 255 bytes; long records are written as `\"part one\" \"part two\"` and are\
  \ joined without spaces.\n\n## DMARC (RFC 7489)\n- TXT at `_dmarc.<domain>` only.\
  \ Must start with `v=DMARC1;` and include `p=none|quarantine|reject`. One record.\n\
  - Add `rua=mailto:` to get aggregate reports. Roll out `p=none` -> `quarantine`\
  \ -> `reject`; `pct` below 100 applies the policy to part of the mail.\n- Since\
  \ 2024 Gmail and Yahoo require SPF, DKIM and DMARC (at least `p=none`) for bulk\
  \ senders.\n\n## DKIM (RFC 6376, RFC 8301, RFC 8463)\n- Keys live at `<selector>._domainkey.<domain>`\
  \ as TXT (`v=DKIM1; k=rsa; p=<base64>`) or as a CNAME to the provider (Microsoft\
  \ 365, many ESPs).\n- RSA keys under 1024 bits must not be used; 2048 bits is the\
  \ recommendation. Ed25519 (`k=ed25519`) can be added alongside RSA.\n- Empty `p=`\
  \ means revoked. Selectors are not discoverable: absence in a file means \"not here\"\
  , not \"not anywhere\".\n\n## TTL and SOA (RFC 1035, RFC 2181 8, RFC 2308)\n- TTL\
  \ is 0..2147483647 s. Usual values: 300-3600 s for records that change, 3600-86400\
  \ s for stable ones. Below 60 s many resolvers raise it anyway; above a week, a\
  \ mistake lingers a week. Lower the TTL a day before a planned change.\n- `$TTL`\
  \ sets the default. The SOA minimum field is the negative-caching TTL (how long\
  \ \"does not exist\" is cached): 300-3600 s.\n- The SOA contact (rname) is an email\
  \ written with a dot: `hostmaster.example.com.` for hostmaster@example.com.\n- Bump\
  \ the SOA serial on every change (YYYYMMDDnn).\n\n## Addresses and CAA\n- A holds\
  \ IPv4, AAAA holds IPv6. Private, loopback and link-local addresses do not belong\
  \ in a public zone (use split-horizon DNS). Documentation ranges (192.0.2.0/24,\
  \ 2001:db8::/32) are fine in examples.\n- CAA (RFC 8659) limits which certificate\
  \ authorities may issue for the domain: `@ CAA 0 issue \"letsencrypt.org\"`.\n\x1F\
  FILE:references/finding-codes.md\x1E\n# Finding codes\n\n| Code | Sev | Problem\
  \ | Acceptable when | Usual fix |\n|---|---|---|---|---|\n| CNAME_AT_APEX | HIGH\
  \ | apex CNAME conflicts with SOA/NS, breaks mail | never | A/AAAA or provider ALIAS/flattening\
  \ |\n| CNAME_WITH_OTHER_DATA | HIGH | other records next to a CNAME are ignored\
  \ | DNSSEC records only | move the TXT/MX elsewhere or use A/AAAA |\n| MULTIPLE_CNAME\
  \ | HIGH | two CNAMEs for one name | never | keep one |\n| MX_TO_CNAME / NS_TO_CNAME\
  \ | HIGH | MX/NS/SRV target is an alias | never (some servers tolerate it, many\
  \ do not) | point at the final A/AAAA host |\n| TARGET_IS_IP | HIGH | MX/NS/CNAME\
  \ value is an IP | never | host name with an A record |\n| MISSING_TRAILING_DOT\
  \ | HIGH | full name without dot gets the origin appended | never | add the dot\
  \ or write it relative |\n| OWNER_DOUBLED_ORIGIN | HIGH | owner `www.example.com`\
  \ without dot | never | `www` or `www.example.com.` |\n| SPF_MULTIPLE | HIGH | two\
  \ v=spf1 records -> permerror | never | merge into one |\n| SPF_PASS_ALL | HIGH\
  \ | `+all`/`all` authorizes everyone | never | `-all` / `~all` |\n| SPF_SYNTAX |\
  \ HIGH | unknown term or bad ip4/ip6 -> permerror | never | fix the term |\n| SPF_TOO_MANY_LOOKUPS\
  \ | HIGH | more than 10 lookup terms | never | flatten, remove unused includes |\n\
  | TXT_STRING_TOO_LONG | HIGH | a quoted string over 255 bytes | provider UIs split\
  \ for you (CSV input is not checked) | split into chunks |\n| DMARC_WRONG_NAME |\
  \ HIGH | v=DMARC1 not at _dmarc | never | move to `_dmarc` |\n| DMARC_MULTIPLE /\
  \ DMARC_SYNTAX | HIGH | receivers ignore DMARC | never | one valid record |\n| DKIM_WRONG_NAME\
  \ / DKIM_BAD_KEY | HIGH | key cannot be found or parsed | never | copy again from\
  \ the provider |\n| DKIM_WEAK_KEY | HIGH | RSA key below 1024 bits | never | rotate\
  \ to 2048 |\n| SOA_RNAME_AT | HIGH | `@` in the SOA contact | never | `hostmaster.example.com.`\
  \ |\n| NULL_MX_WITH_OTHERS | HIGH | `MX 0 .` plus real MX | never | one or the other\
  \ |\n| BAD_ADDRESS / WRONG_ADDRESS_FAMILY / TTL_INVALID | HIGH | value cannot be\
  \ loaded | never | fix the value |\n| SPF_MISSING | MEDIUM | MX but no SPF | never\
  \ for a mail domain | one SPF record |\n| DMARC_MISSING | MEDIUM | mail domain without\
  \ DMARC | never | `v=DMARC1; p=none; rua=...` then tighten |\n| DKIM_NOT_FOUND |\
  \ MEDIUM | no selector in this file | selectors hosted elsewhere (check live) |\
  \ publish the provider's selector |\n| DKIM_REVOKED | MEDIUM | `p=` empty | intentionally\
  \ retired selector (then remove it) | remove or publish the new key |\n| SPF_NEUTRAL_ALL\
  \ / SPF_NO_ALL / SPF_TERMS_AFTER_ALL | MEDIUM | weak or ignored policy | short test\
  \ phase | end with `-all` / `~all` |\n| MAYBE_MISSING_TRAILING_DOT | MEDIUM | looks\
  \ like an outside name without dot | it really is a relative name | add the dot\
  \ |\n| DANGLING_TARGET | MEDIUM | in-zone target has no records | defined in another\
  \ file or view | add or fix |\n| MX_TARGET_NO_ADDRESS | MEDIUM | mail host has no\
  \ A/AAAA | address comes from another zone | add A/AAAA |\n| PRIVATE_ADDRESS | MEDIUM\
  \ | RFC 1918/loopback/link-local in public DNS | deliberately internal-only zone\
  \ | split-horizon |\n| TTL_TOO_LOW / TTL_TOO_HIGH | MEDIUM | below 60 s / above\
  \ 7 days | short TTL during a planned cut-over; `_acme-challenge` | 300 s - 1 day\
  \ |\n| NS_MISSING / NS_SINGLE / SOA_MISSING | MEDIUM | incomplete zone file | provider-managed\
  \ NS/SOA (CSV input skips these) | add them |\n| UNKNOWN_TYPE | MEDIUM | record\
  \ type not recognized | new type the script does not know | check spelling |\n|\
  \ SPF_PTR / SPF_TYPE99 / SPF_LOOKUPS_NEAR_LIMIT | LOW | deprecated or close to the\
  \ limit | - | replace / count nested includes live |\n| DMARC_MONITOR_ONLY / DMARC_NO_RUA\
  \ / DMARC_PARTIAL_PCT | LOW | DMARC not yet enforcing or not reporting | during\
  \ rollout | tighten after reviewing reports |\n| DKIM_1024_KEY | LOW | 1024-bit\
  \ RSA | provider does not offer 2048 | rotate when possible |\n| NO_MAIL_POLICY\
  \ / NULL_MX_SPF_NOT_FAIL | LOW | no-mail domain can be spoofed | - | null MX + `v=spf1\
  \ -all` + DMARC reject |\n| CNAME_CHAIN / DUPLICATE_RECORD / CAA_MISSING / NO_DEFAULT_TTL\
  \ / SOA_NEGATIVE_TTL_HIGH / INCLUDE_NOT_FOLLOWED | LOW | hygiene | - | see the fix\
  \ column in the report |\n\nExit codes: 0 = no HIGH, 1 = HIGH present, 2 = bad input.\
  \ In CI, gate on HIGH and keep any `--ignore` list in the repo with a reason.\n\n\
  ## Live checks the linter cannot do (offline)\n- Out-of-zone targets: `dig +short\
  \ A <target>`; a CNAME to a cancelled SaaS host is a takeover risk.\n- Nested SPF\
  \ includes: count with `dig TXT <include>` recursively, or a resolver-based SPF\
  \ checker.\n- DKIM selectors hosted by the mail provider: `dig TXT <selector>._domainkey.<domain>`\
  \ (Google: `google`, Microsoft 365: `selector1`/`selector2` CNAMEs).\n- Delegation:\
  \ `dig NS <domain> @a.gtld-servers.net` (or the TLD's servers) must match the zone's\
  \ NS set.\n\x1FFILE:templates/dns-review.md\x1E\n# DNS review: <domain>\n\n**Source:**\
  \ <zone file / provider export, date>   **Purpose:** <website + Google Workspace\
  \ mail + newsletter tool>\n**Result:** <HIGH n, MEDIUM n, LOW n> - <one-sentence\
  \ verdict, e.g. \"mail delivery is at risk until SPF is merged and MX is fixed\"\
  >\n\n## Fix now (HIGH)\n| # | Record now | Problem | Replace with |\n|---|---|---|---|\n\
  | 1 | `<@ CNAME bakery-site.example.net.>` | <CNAME at apex hides MX/TXT> | `<@\
  \ A 192.0.2.10>` (or ALIAS at the provider) |\n| 2 | `<@ MX 10 mail.example.com>`\
  \ | <no trailing dot -> mail.example.com.example.com.> | `<@ MX 10 mail.example.com.>`\
  \ |\n\n## Fix soon (MEDIUM)\n- <add `_dmarc` TXT `v=DMARC1; p=none; rua=mailto:dmarc-reports@<domain>`>\n\
  \n## Hygiene (LOW)\n- <remove duplicate A for blog; add CAA>\n\n## Mail authentication\
  \ summary\n| Check | Now | After the fix |\n|---|---|---|\n| SPF | <2 records, ?all>\
  \ | <1 record, includes A + B, -all> |\n| DKIM | <google selector 1024-bit, s2019\
  \ revoked> | <2048-bit key, retired selector removed> |\n| DMARC | <wrong name>\
  \ | <_dmarc p=none -> quarantine on <date>> |\n\n## Verify live (not checked offline)\n\
  - `<dig +short CNAME shop.<domain>>` - <target still in use?>\n- `<dig TXT google._domainkey.<domain>>`\
  \ - <matches the provider console?>\n\n## Rollout\n1. <lower TTL of changed records\
  \ to 300 s, wait one old TTL>\n2. <apply changes, bump SOA serial to YYYYMMDDnn>\n\
  3. <verify with dig against the authoritative servers and a public resolver; send\
  \ a test mail and read the Authentication-Results header>\n4. <raise TTLs back to\
  \ 3600 s; review DMARC reports after 1-2 weeks>\n\n**Rollback:** <old values listed\
  \ above; restore them and wait one TTL>\n**Open questions:** <which services send\
  \ mail as this domain? is backupmx still used?>\n\x1FFILE:examples/example.com.zone\x1E\
  \n; example.com - zone exported before the move to a new DNS host (has mistakes\
  \ on purpose)\n$ORIGIN example.com.\n$TTL 3600\n@       IN SOA  ns1.example.net.\
  \ hostmaster@example.com. (\n                2026103001 ; serial\n             \
  \   7200       ; refresh\n                900        ; retry\n                1209600\
  \    ; expire\n                172800 )   ; minimum (negative caching)\n@      \
  \ IN NS   ns1.example.net.\n@       IN NS   ns2.example.net.\n\n; website moved\
  \ to a static host\n@       IN CNAME bakery-site.example.net.\nwww  30 IN CNAME\
  \ bakery-site.example.net.\nwww     IN TXT  \"site-verification=4f9c2a\"\nshop \
  \   IN CNAME shops.myshopify.com\nblog    IN A    192.0.2.44\nblog    IN A    192.0.2.44\n\
  legacy 1209600 IN A 192.0.2.45\nintranet IN A   10.0.4.12\n\n; mail\n@       IN\
  \ MX 10 mail.example.com\n@       IN MX 20 backupmx\nbackupmx IN CNAME mx2.example.net.\n\
  @       IN TXT  \"v=spf1 include:_spf.google.com ~all\"\n@       IN TXT  \"v=spf1\
  \ include:sendgrid.net ?all\"\ndmarc   IN TXT  \"v=DMARC1; p=none\"\ngoogle._domainkey\
  \ IN TXT \"v=DKIM1; k=rsa; p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDbNfaf4mo/6FvrWAv3WssXhXwsdrJxrAuhIVcYXdrMZp55PDpEjo63C/vOuaStp58YtZTnzQlm0V3rjtvOP1XgGAy3LWurXdRkT0zOGxx0AMgjZfD/8QDgjF6f4VW9zmNytbD3EgZXxeGZSBw8JtTdT/rOEygTgYL5+x5DftDSFQIDAQAB\"\
  \ns2019._domainkey  IN TXT \"v=DKIM1; k=rsa; p=\"\n\x1FFILE:examples/example.com.fixed.zone\x1E\
  \n; example.com - corrected zone\n$ORIGIN example.com.\n$TTL 3600\n@       IN SOA\
  \  ns1.example.net. hostmaster.example.com. (\n                2026103002 ; serial\
  \ (bumped)\n                7200       ; refresh\n                900        ; retry\n\
  \                1209600    ; expire\n                3600 )     ; minimum (negative\
  \ caching)\n@       IN NS   ns1.example.net.\n@       IN NS   ns2.example.net.\n\
  @       IN CAA  0 issue \"letsencrypt.org\"\n\n; website: A/AAAA at the apex (or\
  \ the provider's ALIAS/flattening), CNAME only below it\n@       IN A    192.0.2.10\n\
  @       IN AAAA 2001:db8::10\nwww     IN CNAME bakery-site.example.net.\n_site-verification.www\
  \ IN TXT \"site-verification=4f9c2a\"\nshop    IN CNAME shops.myshopify.com.\nblog\
  \    IN A    192.0.2.44\nlegacy  IN A    192.0.2.45\n; intranet moved to the internal\
  \ (split-horizon) view\n\n; mail\n@       IN MX 10 mail.example.com.\n@       IN\
  \ MX 20 mx2.example.net.\nmail    IN A    192.0.2.25\n@       IN TXT  \"v=spf1 include:_spf.google.com\
  \ include:sendgrid.net -all\"\n_dmarc  IN TXT  \"v=DMARC1; p=quarantine; rua=mailto:dmarc-reports@example.com\"\
  \ngoogle._domainkey IN TXT ( \"v=DKIM1; k=rsa; p=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAz7ouq6bH4GbHRPASRa3m/LiSvOKSZ7L7KZqE231EHY1s8FN9criBQkJXXmxkwPERQSVSyRIC4LjSpxwPTe6LEVhg7nrswTX1ktBbXMUmkgj8CPKV+yWzOsDOMk7kjqghuNWXD/R5K/mT7xbTiCaXztegoQi+\"\
  \n                           \"kVXf0xuMmQYLxVthdjIz1h2PORFhtjzwKYbpaMKjq2BWKIaNtaGBxc2kaSLyPw8W65+A7XeLhtKT8zcteU72IpdmibNsHlkBR0Hb7rQgb+0LgNVqPvF/mm37PKFPQPrfWjjL/Fc1MQoCm8jO3kI0O5ssuP7KKO7ZjtT4ekeHytw23INuPh/Kw1LqzwIDAQAB\"\
  \ )\n\x1FFILE:examples/lint-report.md\x1E\n# DNS record lint: example.com.zone\n\
  \nZone: example.com.   Format: zone   Records: 19   Findings: 19 (HIGH 7, MEDIUM\
  \ 8, LOW 4)\n\n| Sev | Code | Line | Name | Type | Problem | Fix |\n|---|---|---|---|---|---|---|\n\
  | HIGH | SOA_RNAME_AT | 4 | @ | SOA | contact 'hostmaster@example.com.' contains\
  \ '@'; in DNS it is written with a dot | write the contact as hostmaster.example.com.\
  \ (first @ becomes a dot) |\n| LOW | SOA_NEGATIVE_TTL_HIGH | 4 | @ | SOA | SOA minimum\
  \ 172800 s: a deleted-then-added name stays 'does not exist' in caches that long\
  \ | set the SOA minimum (negative-caching TTL) to 300-3600 s |\n| HIGH | CNAME_AT_APEX\
  \ | 14 | @ | CNAME | CNAME at the zone apex conflicts with the SOA and NS records\
  \ there; mail and other lookups break | use A/AAAA records at the apex, or your\
  \ provider's ALIAS/ANAME/CNAME-flattening record |\n| HIGH | CNAME_WITH_OTHER_DATA\
  \ | 15 | www | CNAME | name has a CNAME and also TXT; resolvers return only the\
  \ CNAME | a name with a CNAME may have no other records: move the other records\
  \ or replace the CNAME with A/AAAA |\n| MEDIUM | TTL_TOO_LOW | 15 | www | CNAME\
  \ | TTL 30 s: extra query load, slower lookups, and many resolvers raise it anyway\
  \ | use 300 s or more for normal records (lower only for a planned change) |\n|\
  \ MEDIUM | MAYBE_MISSING_TRAILING_DOT | 17 | shop | CNAME | 'shops.myshopify.com'\
