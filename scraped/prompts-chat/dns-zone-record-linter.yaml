  \ SEVERITIES.index(min_sev) and f[\"code\"] not in ignore]\n    cnt = {s: sum(1\
  \ for f in keep if f[\"severity\"] == s) for s in SEVERITIES}\n    out = [f\"# DNS\
  \ record lint: {title}\", \"\",\n           f\"Zone: {res['origin']}   Format: {res['format']}\
  \   Records: {res['records']}   Findings: {len(keep)} (HIGH {cnt['HIGH']}, MEDIUM\
  \ {cnt['MEDIUM']}, LOW {cnt['LOW']})\", \"\"]\n    if keep:\n        out += [\"\
  | Sev | Code | Line | Name | Type | Problem | Fix |\", \"|---|---|---|---|---|---|---|\"\
  ]\n        for f in keep:\n            out.append(f\"| {f['severity']} | {f['code']}\
  \ | {f['line'] or '-'} | {f['name'] or '-'} | {f['type'] or '-'} | {f['problem']}\
  \ | {f['fix']} |\")\n    else:\n        out.append(\"No findings.\")\n    if res[\"\
  external_targets\"]:\n        out += [\"\", \"## Out-of-zone targets to check live\
  \ (no network calls were made)\", \"\",\n                \"| Target | Used by |\"\
  , \"|---|---|\"]\n        for e in res[\"external_targets\"]:\n            out.append(f\"\
  | {e['target']} | {'; '.join(e['used_by'])} |\")\n    return \"\\n\".join(out) +\
  \ \"\\n\", keep\n\n\ndef self_test():\n    Z = \"$ORIGIN example.com.\\n$TTL 3600\\\
  n@ IN SOA ns1 hostmaster 1 7200 900 1209600 300\\n@ NS ns1\\n@ NS ns2.example.net.\\\
  nns1 A 192.0.2.53\\n\"\n    MAIL = '@ MX 10 mail\\nmail A 192.0.2.25\\n@ TXT \"\
  v=spf1 mx -all\"\\n_dmarc TXT \"v=DMARC1; p=reject; rua=mailto:d@example.com\"\\\
  ns1._domainkey CNAME s1.dkim.example.net.\\n@ CAA 0 issue \"letsencrypt.org\"\\\
  n'\n    k1024 = base64.b64encode(bytes.fromhex(\"30819f300d06092a864886f70d010101050003818d0030818902818100\"\
  ) + b\"\\xc1\" + bytes(127) + bytes.fromhex(\"0203010001\")).decode()\n    k512\
  \ = base64.b64encode(bytes.fromhex(\"305c300d06092a864886f70d0101010500034b003048024100\"\
  ) + b\"\\xc1\" + bytes(63) + bytes.fromhex(\"0203010001\")).decode()\n\n    def\
  \ codes(text, **kw):\n        return [f[\"code\"] for f in lint(text, **kw)[\"findings\"\
  ]]\n\n    cases = [\n        (\"clean zone\", Z + MAIL, lambda c: c == []),\n  \
  \      (\"cname at apex\", Z + MAIL + \"@ CNAME shop.example.net.\\n\", lambda c:\
  \ \"CNAME_AT_APEX\" in c),\n        (\"cname with other data\", Z + MAIL + \"www\
  \ CNAME web.example.net.\\nwww TXT \\\"x\\\"\\n\", lambda c: \"CNAME_WITH_OTHER_DATA\"\
  \ in c),\n        (\"multiple cname\", Z + MAIL + \"www CNAME a.example.net.\\nwww\
  \ CNAME b.example.net.\\n\", lambda c: \"MULTIPLE_CNAME\" in c),\n        (\"mx\
  \ to cname\", Z + MAIL.replace(\"mail A 192.0.2.25\", \"mail CNAME mx.example.net.\"\
  ), lambda c: \"MX_TO_CNAME\" in c),\n        (\"ns to cname\", Z.replace(\"ns1 A\
  \ 192.0.2.53\", \"ns1 CNAME dns.example.net.\") + MAIL, lambda c: \"NS_TO_CNAME\"\
  \ in c),\n        (\"mx is ip\", Z + MAIL.replace(\"MX 10 mail\", \"MX 10 192.0.2.25\"\
  ), lambda c: \"TARGET_IS_IP\" in c),\n        (\"missing trailing dot\", Z + MAIL\
  \ + \"www CNAME web.example.com\\nweb A 192.0.2.80\\n\", lambda c: \"MISSING_TRAILING_DOT\"\
  \ in c),\n        (\"maybe missing dot (outside name)\", Z + MAIL + \"shop CNAME\
  \ shops.myshopify.com\\n\", lambda c: \"MAYBE_MISSING_TRAILING_DOT\" in c),\n  \
  \      (\"owner doubled origin\", Z + MAIL + \"www.example.com A 192.0.2.80\\n\"\
  , lambda c: \"OWNER_DOUBLED_ORIGIN\" in c),\n        (\"relative target ok\", Z\
  \ + MAIL + \"www CNAME web\\nweb A 192.0.2.80\\n\", lambda c: c == []),\n      \
  \  (\"dangling target\", Z + MAIL + \"www CNAME web\\n\", lambda c: \"DANGLING_TARGET\"\
  \ in c),\n        (\"cname chain\", Z + MAIL + \"www CNAME web\\nweb CNAME edge.example.net.\\\
  n\", lambda c: \"CNAME_CHAIN\" in c),\n        (\"mx target no address\", Z + MAIL.replace(\"\
  mail A 192.0.2.25\", \"mail TXT \\\"x\\\"\"), lambda c: \"MX_TARGET_NO_ADDRESS\"\
  \ in c),\n        (\"spf missing\", Z + MAIL.replace('@ TXT \"v=spf1 mx -all\"\\\
  n', \"\"), lambda c: \"SPF_MISSING\" in c),\n        (\"spf multiple\", Z + MAIL\
  \ + '@ TXT \"v=spf1 include:_spf.google.com ~all\"\\n', lambda c: \"SPF_MULTIPLE\"\
  \ in c),\n        (\"spf +all\", Z + MAIL.replace(\"mx -all\", \"mx +all\"), lambda\
  \ c: \"SPF_PASS_ALL\" in c),\n        (\"spf ?all\", Z + MAIL.replace(\"mx -all\"\
  , \"mx ?all\"), lambda c: \"SPF_NEUTRAL_ALL\" in c),\n        (\"spf no all\", Z\
  \ + MAIL.replace(\"mx -all\", \"mx\"), lambda c: \"SPF_NO_ALL\" in c),\n       \
  \ (\"spf terms after all\", Z + MAIL.replace(\"mx -all\", \"-all mx\"), lambda c:\
  \ \"SPF_TERMS_AFTER_ALL\" in c),\n        (\"spf syntax typo\", Z + MAIL.replace(\"\
  mx -all\", \"ipv4:192.0.2.1 -all\"), lambda c: \"SPF_SYNTAX\" in c),\n        (\"\
  spf bad ip4\", Z + MAIL.replace(\"mx -all\", \"ip4:300.1.1.1 -all\"), lambda c:\
  \ \"SPF_SYNTAX\" in c),\n        (\"spf too many lookups\", Z + MAIL.replace(\"\
  mx -all\", \" \".join(f\"include:s{i}.example.net\" for i in range(11)) + \" -all\"\
  ), lambda c: \"SPF_TOO_MANY_LOOKUPS\" in c),\n        (\"spf near limit\", Z + MAIL.replace(\"\
  mx -all\", \" \".join(f\"include:s{i}.example.net\" for i in range(8)) + \" -all\"\
  ), lambda c: \"SPF_LOOKUPS_NEAR_LIMIT\" in c and \"SPF_TOO_MANY_LOOKUPS\" not in\
  \ c),\n        (\"spf ptr\", Z + MAIL.replace(\"mx -all\", \"ptr -all\"), lambda\
  \ c: \"SPF_PTR\" in c),\n        (\"spf type99\", Z + MAIL + '@ SPF \"v=spf1 mx\
  \ -all\"\\n', lambda c: \"SPF_TYPE99\" in c),\n        (\"split txt strings joined\"\
  , Z + MAIL.replace('\"v=spf1 mx -all\"', '\"v=spf1 mx \" \"-all\"'), lambda c: c\
  \ == []),\n        (\"txt string too long\", Z + MAIL + '@ TXT \"' + \"a\" * 300\
  \ + '\"\\n', lambda c: \"TXT_STRING_TOO_LONG\" in c),\n        (\"dmarc missing\"\
  , Z + MAIL.replace('_dmarc TXT \"v=DMARC1; p=reject; rua=mailto:d@example.com\"\\\
  n', \"\"), lambda c: \"DMARC_MISSING\" in c),\n        (\"dmarc wrong name\", Z\
  \ + MAIL.replace(\"_dmarc TXT\", \"dmarc TXT\"), lambda c: \"DMARC_WRONG_NAME\"\
  \ in c and \"DMARC_MISSING\" in c),\n        (\"dmarc multiple\", Z + MAIL + '_dmarc\
  \ TXT \"v=DMARC1; p=none\"\\n', lambda c: \"DMARC_MULTIPLE\" in c),\n        (\"\
  dmarc no p\", Z + MAIL.replace(\"p=reject; \", \"\"), lambda c: \"DMARC_SYNTAX\"\
  \ in c),\n        (\"dmarc none + no rua + pct\", Z + MAIL.replace(\"p=reject; rua=mailto:d@example.com\"\
  , \"p=none; pct=50\"), lambda c: {\"DMARC_MONITOR_ONLY\", \"DMARC_NO_RUA\", \"DMARC_PARTIAL_PCT\"\
  } <= set(c)),\n        (\"dkim not found\", Z + MAIL.replace(\"s1._domainkey CNAME\
  \ s1.dkim.example.net.\\n\", \"\"), lambda c: \"DKIM_NOT_FOUND\" in c),\n      \
  \  (\"dkim revoked\", Z + MAIL + 's2._domainkey TXT \"v=DKIM1; k=rsa; p=\"\\n',\
  \ lambda c: \"DKIM_REVOKED\" in c),\n        (\"dkim bad base64\", Z + MAIL + 's2._domainkey\
  \ TXT \"v=DKIM1; p=MIGf!!\"\\n', lambda c: \"DKIM_BAD_KEY\" in c),\n        (\"\
  dkim 512-bit key\", Z + MAIL + f's2._domainkey TXT \"v=DKIM1; k=rsa; p={k512}\"\\\
  n', lambda c: \"DKIM_WEAK_KEY\" in c),\n        (\"dkim 1024-bit key\", Z + MAIL\
  \ + f's2._domainkey TXT \"v=DKIM1; k=rsa; p={k1024}\"\\n', lambda c: \"DKIM_1024_KEY\"\
  \ in c),\n        (\"dkim wrong name\", Z + MAIL + f's2.domainkey TXT \"v=DKIM1;\
  \ p={k1024}\"\\n', lambda c: \"DKIM_WRONG_NAME\" in c),\n        (\"null mx + spf\
  \ -all, no mail checks\", Z + '@ MX 0 .\\n@ TXT \"v=spf1 -all\"\\n_dmarc TXT \"\
  v=DMARC1; p=reject; rua=mailto:d@example.com\"\\n@ CAA 0 issue \"letsencrypt.org\"\
  \\n', lambda c: c == []),\n        (\"null mx with others\", Z + MAIL + \"@ MX 0\
  \ .\\n\", lambda c: \"NULL_MX_WITH_OTHERS\" in c),\n        (\"no mail policy\"\
  , Z + '@ CAA 0 issue \"letsencrypt.org\"\\n', lambda c: \"NO_MAIL_POLICY\" in c),\n\
  \        (\"ttl too low\", Z + MAIL + \"www 30 A 192.0.2.80\\n\", lambda c: \"TTL_TOO_LOW\"\
  \ in c),\n        (\"acme ttl low ok\", Z + MAIL + '_acme-challenge 30 TXT \"token\"\
  \\n', lambda c: c == []),\n        (\"ttl too high (units)\", Z + MAIL + \"www 2w\
  \ A 192.0.2.80\\n\", lambda c: \"TTL_TOO_HIGH\" in c),\n        (\"no $TTL\", Z.replace(\"\
  $TTL 3600\\n\", \"\") + MAIL, lambda c: \"NO_DEFAULT_TTL\" in c),\n        (\"soa\
  \ rname with @\", Z.replace(\"hostmaster\", \"hostmaster@example.com.\") + MAIL,\
  \ lambda c: \"SOA_RNAME_AT\" in c),\n        (\"soa multi-line with comments\",\
  \ Z.replace(\"@ IN SOA ns1 hostmaster 1 7200 900 1209600 300\", \"@ IN SOA ns1 hostmaster\
  \ (\\n 2026103001 ; serial\\n 7200 900 1209600\\n 300 ) ; min\") + MAIL, lambda\
  \ c: c == []),\n        (\"single ns\", Z.replace(\"@ NS ns2.example.net.\\n\",\
  \ \"\") + MAIL, lambda c: \"NS_SINGLE\" in c),\n        (\"bad address\", Z + MAIL\
  \ + \"www A 192.0.2.300\\n\", lambda c: \"BAD_ADDRESS\" in c),\n        (\"wrong\
  \ family\", Z + MAIL + \"www AAAA 192.0.2.80\\n\", lambda c: \"WRONG_ADDRESS_FAMILY\"\
  \ in c),\n        (\"private address\", Z + MAIL + \"intranet A 10.0.0.5\\n\", lambda\
  \ c: \"PRIVATE_ADDRESS\" in c),\n        (\"duplicate record\", Z + MAIL + \"www\
  \ A 192.0.2.80\\nwww A 192.0.2.80\\n\", lambda c: \"DUPLICATE_RECORD\" in c),\n\
  \        (\"blank owner continues\", Z + MAIL + \"www A 192.0.2.80\\n    AAAA 2001:db8::80\\\
  n\", lambda c: c == []),\n        (\"semicolon inside quotes kept\", Z + MAIL.replace('\"\
  v=DMARC1; p=reject; rua=mailto:d@example.com\"', '\"v=DMARC1; p=reject; rua=mailto:d@example.com\"\
  \ ; comment'), lambda c: c == []),\n        (\"caa missing\", Z + MAIL.replace('@\
  \ CAA 0 issue \"letsencrypt.org\"\\n', \"\"), lambda c: c == [\"CAA_MISSING\"]),\n\
  \        (\"csv input\", None, None),\n        (\"unterminated quote is input error\"\
  , None, None),\n    ]\n    passed = 0\n    for name, text, check in cases:\n   \
  \     try:\n            if name == \"csv input\":\n                csvt = (\"name,type,value,ttl,priority\\\
  n@,MX,mail.example.com,3600,10\\nmail,A,192.0.2.25,3600,\\n\"\n                \
  \        \"@,TXT,v=spf1 include:_spf.google.com ~all,3600,\\n@,TXT,v=spf1 mx -all,3600,\\\
  n\"\n                        \"www.example.com,CNAME,example.com,300,\\n@,CNAME,shop.example.net,300,\\\
  n\")\n                res = lint(csvt, origin=\"example.com\", fmt=\"csv\")\n  \
  \              c = [f[\"code\"] for f in res[\"findings\"]]\n                ok\
  \ = {\"SPF_MULTIPLE\", \"CNAME_AT_APEX\", \"DMARC_MISSING\", \"DKIM_NOT_FOUND\"\
  } <= set(c) and \"MISSING_TRAILING_DOT\" not in c and \"MX_TO_CNAME\" not in c\n\
  \            elif name == \"unterminated quote is input error\":\n             \
  \   try:\n                    lint(Z + '@ TXT \"v=spf1 -all\\n')\n             \
  \       ok, c = False, \"no error\"\n                except InputError as e:\n \
  \                   ok, c = True, str(e)\n            else:\n                c =\
  \ codes(text)\n                ok = check(c)\n        except Exception as e:  #\
  \ noqa\n            ok, c = False, f\"exception {e!r}\"\n        passed += ok\n\
  \        print((\"PASS \" if ok else \"FAIL \") + name + (\"\" if ok else f\"  got\
  \ {c}\"))\n    print(f\"{passed}/{len(cases)} passed\")\n    return 0 if passed\
  \ == len(cases) else 1\n\n\ndef main(argv=None):\n    ap = argparse.ArgumentParser(description=\"\
  Lint a DNS zone file or record list (offline)\")\n    ap.add_argument(\"file\",\
  \ nargs=\"?\")\n    ap.add_argument(\"--origin\", help=\"zone name, e.g. example.com\
  \ (default: $ORIGIN or the file name)\")\n    ap.add_argument(\"--format\", choices=[\"\
  zone\", \"csv\"], help=\"input format (default: by extension/content)\")\n    ap.add_argument(\"\
  --json\", action=\"store_true\")\n    ap.add_argument(\"--min-severity\", default=\"\
  LOW\", choices=SEVERITIES)\n    ap.add_argument(\"--ignore\", default=\"\", help=\"\
  comma-separated finding codes to skip\")\n    ap.add_argument(\"--self-test\", action=\"\
  store_true\")\n    a = ap.parse_args(argv)\n    if a.self_test:\n        return\
  \ self_test()\n    if not a.file:\n        ap.error(\"give a zone file or CSV, or\
  \ --self-test\")\n    try:\n        with open(a.file, encoding=\"utf-8\") as fh:\n\
  \            text = fh.read()\n        res = lint(text, origin=a.origin, fmt=a.format,\
  \ filename=a.file)\n    except (OSError, InputError, UnicodeDecodeError) as e:\n\
  \        print(f\"error: {e}\", file=sys.stderr)\n        return 2\n    ignore =\
  \ {c.strip().upper() for c in a.ignore.split(\",\") if c.strip()}\n    md, keep\
  \ = render(res, os.path.basename(a.file), a.min_severity, ignore)\n    if a.json:\n\
  \        print(json.dumps({**res, \"findings\": keep}, indent=2))\n    else:\n \
  \       sys.stdout.write(md)\n    return 1 if any(f[\"severity\"] == \"HIGH\" for\
  \ f in keep) else 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())"
