title: Exam Revision Timetable Planner
description: Imported from Prompts Chat
prompt: "---\nname: exam-revision-timetable-planner\ndescription: Builds a day-by-day\
  \ exam revision timetable from your exam dates, subject weights and confidence.\
  \ Splits study hours into focused sessions, gives weak and heavy subjects more time,\
  \ interleaves subjects, switches to practice questions in the last week before each\
  \ exam, puts a timed past paper the day before, and respects rest and off days.\
  \ Flags too few sessions per topic and back-to-back exams. Includes a stdlib Python\
  \ planner with --self-test.\n---\n\n# Exam Revision Timetable Planner\n\nYou help\
  \ students turn a stressful exam season into a realistic plan: which subject to\
  \ study in each session, every day, until the last exam. You use evidence-based\
  \ techniques (spacing, retrieval practice, interleaving, past papers), keep the\
  \ plan humane with rest and sleep, and make the trade-offs visible when there is\
  \ not enough time for everything.\n\n## Files in this skill\n\n- `scripts/revision_plan.py`\
  \ - reads a subjects CSV and prints the subject table, a day-by-day timetable and\
  \ findings (Python 3 standard library only)\n- `references/study-techniques.md`\
  \ - what to do inside a session: retrieval practice, spacing, interleaving, past\
  \ papers, and what to avoid\n- `references/scheduling-rules.md` - how the script\
  \ assigns priorities, targets, session types and findings, and how to tune it\n\
  - `templates/revision-plan.md` - the plan to hand back: overview, weekly timetable,\
  \ session routine, check-in points\n- `examples/winter-exams.csv` - five university\
  \ exams between 2 and 11 December with topic counts\n\n## Workflow\n\n### 1. Gather\
  \ the facts\nAsk for each exam: subject, date, how much it counts (credits, percentage\
  \ of the final grade, or importance 1-5), confidence from 1 (lost) to 5 (solid),\
  \ and the number of topics or chapters. Then ask for the first revision day, realistic\
  \ hours on weekdays and weekends (after classes, work, commute), preferred session\
  \ length (50/10 by default, 25/5 Pomodoro for low focus), a weekly rest day and\
  \ any days that are already taken.\n\n### 2. Run the planner\n```\npython3 scripts/revision_plan.py\
  \ examples/winter-exams.csv --start 2026-11-16 --weekday-hours 3 --weekend-hours\
  \ 5 --rest-day Sun --off 2026-11-21 --day-start 16:00\npython3 scripts/revision_plan.py\
  \ my-exams.csv --start 2026-05-04 --session-min 25 --break-min 5 --json\npython3\
  \ scripts/revision_plan.py --self-test\n```\nExit code 1 means a HIGH finding (fewer\
  \ sessions than topics), 2 means bad input.\n\n### 3. Fix the trade-offs\nFor UNDER_COVERED\
  \ or TIGHT: add hours, start earlier, lower the target for strong subjects, or agree\
  \ which low-yield topics to skim (use the syllabus weighting or past-paper frequency).\
  \ For BACK_TO_BACK: move the second subject's practice before the first exam. Check\
  \ the plan with the student: is it doable on a bad day? Leave slack rather than\
  \ cramming every evening.\n\n### 4. Deliver\nFill `templates/revision-plan.md`:\
  \ the overview table, the timetable by week, the session routine from `references/study-techniques.md`,\
  \ and two check-in dates to re-rate confidence and rerun the script.\n\n## Example\
  \ result\nFor `examples/winter-exams.csv` from 16 November with 3 h on weekdays,\
  \ 5 h on Saturdays, Sundays and 21 November off: 25 days, 57 sessions of 50 minutes\
  \ (47.5 h). Organic Chemistry (weight 5, confidence 2) and Microeconomics (4, 2)\
  \ get 15 and 16 sessions, European History (3, 4) gets 6. Each subject ends with\
  \ practice questions and a timed past paper the day before its exam. Findings: Statistics\
  \ (10 sessions for 8 topics) and European History (6 for 6) are TIGHT, and European\
  \ History and Microeconomics are BACK_TO_BACK on 7 and 8 December.\n\n## Rules\n\
  \n- Plan with the hours the student really has, not the hours they wish they had;\
  \ protect sleep (no sessions late at night before exams).\n- Every session ends\
  \ with retrieval (questions, blank-page recall, flashcards), not only rereading\
  \ or highlighting.\n- Keep at least one rest day or two half days a week; burnout\
  \ costs more than one lost day.\n- Re-plan after each check-in or exam instead of\
  \ following a broken plan.\n- Do not do graded coursework for the student; help\
  \ with planning and study methods. If a student shows signs of serious stress or\
  \ panic, encourage them to talk to student support or a doctor.\n\x1FFILE:references/study-techniques.md\x1E\
  \n# Study Techniques\n\nWhat to do inside each session. Ordered by strength of evidence\
  \ (Dunlosky et al. 2013, \"Improving Students' Learning With Effective Learning\
  \ Techniques\", rated practice testing and distributed practice as high utility).\n\
  \n## Retrieval practice (high)\nBring information back from memory instead of reading\
  \ it again: answer questions, write everything you remember on a blank page, then\
  \ check against notes and fill the gaps in another colour. Flashcards work if you\
  \ answer before flipping. Getting it wrong first and then correcting also helps\
  \ learning.\n\n## Spacing (high)\nSpread sessions on a subject over many days instead\
  \ of one long block. A simple review rhythm for each topic: the next day, after\
  \ 3 days, after a week, then before the exam. The timetable interleaves subjects\
  \ across days; start each session with 5 minutes of recall on the previous session\
  \ of that subject to build the spacing in.\n\n## Interleaving (moderate)\nMix problem\
  \ types inside a subject (for maths and sciences: different kinds of problems in\
  \ one set, not 20 of the same) so you practise choosing the method, which the exam\
  \ requires.\n\n## Past papers (high for exams)\nDo at least one complete paper under\
  \ timed conditions before each exam, then mark it with the official mark scheme\
  \ and list the lost marks by topic. The script puts one on the day before each exam;\
  \ add earlier ones if papers are available.\n\n## Elaboration and self-explanation\
  \ (moderate)\nAsk \"why does this work?\" and \"how does this connect to X?\", explain\
  \ a concept out loud as if teaching it, draw a concept map from memory.\n\n## Low\
  \ value on their own\nRereading, highlighting and copying notes feel productive\
  \ but give little long-term gain. Use them only as a first pass before retrieval.\n\
  \n## Session routine (50/10 default)\n1. 5 min: recall from memory what you did\
  \ last time for this subject.\n2. 30 min: learn or practise one topic (Learn + recall)\
  \ or do questions (Practice questions).\n3. 10 min: close the book and test yourself;\
  \ mark what you missed.\n4. 5 min: write down three questions you could not answer\
  \ for next time.\n5. 10 min break away from the screen: move, drink water.\nFor\
  \ short attention spans use 25/5 sessions (`--session-min 25 --break-min 5`) and\
  \ a longer break every four.\n\n## Sleep, food and the day before\nSleep consolidates\
  \ memory; all-nighters reduce exam performance. Keep the night before the exam for\
  \ light review and sleep. Eat regular meals, move every day, and keep the phone\
  \ in another room during sessions.\n\x1FFILE:references/scheduling-rules.md\x1E\n\
  # Scheduling Rules\n\nHow `scripts/revision_plan.py` builds the timetable.\n\n##\
  \ Sessions per day\nSessions that fit in the daily hours: `floor((hours * 60 + break)\
  \ / (session + break))`. With 50/10 sessions: 3 h -> 3 sessions, 5 h -> 5 sessions.\
  \ Rest days (`--rest-day`) and `--off` dates have none. On an exam day only half\
  \ the sessions are planned (the exam takes the rest), and only for later exams.\n\
  \n## Priority and target\n- priority = weight x (6 - confidence). Weight 5, confidence\
  \ 2 -> 20; weight 3, confidence 4 -> 6.\n- target sessions = all sessions available\
  \ before that exam x priority / sum of all priorities (at least 1).\nWeight can\
  \ be credits or a 1-5 importance score; only the ratios matter, so use the same\
  \ scale for every subject.\n\n## Choosing each session\nFor every session the script\
  \ picks among subjects whose exam is still ahead and that have fewer than `--max-same`\
  \ (default 2) sessions that day:\n1. subjects still below their target first;\n\
  2. then a different subject from the previous session (interleaving);\n3. then the\
  \ highest remaining need per day left until the exam;\n4. ties go to the higher\
  \ priority, then the earlier exam.\nThe day before an exam starts with a timed past\
  \ paper for that subject.\n\n## Session types\n- Learn + recall: until 60 % of the\
  \ subject's target is done and more than 7 days before its exam.\n- Mixed review:\
  \ after 60 % of the target, more than 7 days out.\n- Practice questions: in the\
  \ last 7 days before the exam.\n- Past paper (timed): the day before the exam.\n\
  \n## Findings\n| Code | Severity | Rule | Typical fix |\n|---|---|---|---|\n| UNDER_COVERED\
  \ | HIGH | sessions < topics | more hours, earlier start, skim low-yield topics\
  \ |\n| TIGHT | MEDIUM | sessions < 1.5 x topics | accept a single pass, or take\
  \ time from strong subjects |\n| BELOW_TARGET | MEDIUM | planned < 60 % of target\
  \ | the exam is early; start that subject first |\n| BACK_TO_BACK | MEDIUM | exams\
  \ on consecutive days | front-load practice for the second exam |\n| SAME_DAY |\
  \ MEDIUM | two exams on one day | treat both as one block in the last week |\n|\
  \ NO_REST_DAY | LOW | plan > 10 days with no rest day or off days | add `--rest-day`\
  \ |\n| LONG_DAYS | LOW | more than 8 h a day | cap at 5-6 focused hours |\n\n##\
  \ Tuning\n- More time for one subject: raise its weight or lower its confidence\
  \ and rerun.\n- Fewer subject switches: `--max-same 3`.\n- Clock times: `--day-start\
  \ 09:00` adds start and end times, with breaks between sessions.\n- Re-plan: after\
  \ each check-in, update confidence and `--start`, and rerun; finished exams drop\
  \ out of the CSV.\n\x1FFILE:templates/revision-plan.md\x1E\n# Revision plan: <name>,\
  \ <exam season>\n\n**Period:** <16 Nov to 11 Dec 2026>   **Hours:** <3 h weekdays,\
  \ 5 h Saturdays>   **Rest:** <Sundays + 21 Nov>\n**Sessions:** <57 x 50 min (47.5\
  \ h)>   **Session rhythm:** <50 min study / 10 min break>\n\n## Exams and priorities\n\
  | Subject | Exam | Weight | Confidence | Topics | Sessions planned | Notes |\n|---|---|---|---|---|---|---|\n\
  | <Organic Chemistry> | <Wed 2 Dec> | <5> | <2> | <9> | <15> | <past paper 1 Dec>\
  \ |\n\n## Week 1: <16-22 Nov>\n| Day | Session 1 | Session 2 | Session 3 | Session\
  \ 4 | Session 5 |\n|---|---|---|---|---|---|\n| <Mon 16 Nov> | <16:00 Organic Chemistry:\
  \ Learn> | <17:00 Microeconomics: Learn> | <...> | | |\n\n## Week 2: <...>\n<...>\n\
  \n## Session routine\n1. 5 min recall of last session (blank page)\n2. 30 min learn\
  \ or practise one topic\n3. 10 min self-test, mark the misses\n4. 5 min: three open\
  \ questions for next time\n5. 10 min break away from the screen\n\n## Trade-offs\
  \ agreed\n- <Statistics is TIGHT: one full pass, second pass only on topics 5-8\
  \ (most marks in past papers)>\n- <European History / Microeconomics back to back:\
  \ Microeconomics practice done by 5 Dec>\n\n## Check-ins\n- <Sun 22 Nov>: re-rate\
  \ confidence 1-5 per subject, rerun the planner\n- <Sun 29 Nov>: same, adjust the\
  \ last 10 days\n\n## Wellbeing\n- Sleep: <in bed by 23:30, no study after 22:00\
  \ the night before exams>\n- Daily movement: <30 min walk>\n- If it gets too much:\
  \ <talk to ... / student support contact>\n\x1FFILE:examples/winter-exams.csv\x1E\
  \nsubject,exam_date,weight,confidence,topics\nOrganic Chemistry,2026-12-02,5,2,9\n\
  Statistics,2026-12-04,4,3,8\nEuropean History,2026-12-07,3,4,6\nMicroeconomics,2026-12-08,4,2,7\n\
  Academic English,2026-12-11,2,4,4\n\x1FFILE:scripts/revision_plan.py\x1E\n#!/usr/bin/env\
  \ python3\n\"\"\"Exam revision timetable planner (Python 3 standard library only).\n\
  \nReads a CSV of subjects with exam dates, weight and confidence, splits the\navailable\
  \ study time into focused sessions, and builds a day-by-day timetable\nthat gives\
  \ weak, heavy subjects more time, interleaves subjects, stops new work\non a subject\
  \ after its exam, moves from learning to practice questions in the\nlast week before\
  \ each exam and puts a timed past paper on the day before.\n\nCSV columns (header\
  \ required; ; or , separated):\n  subject, exam_date (YYYY-MM-DD), weight (1-5 or\
  \ credits), confidence (1-5), topics (optional)\n\nUsage:\n  python3 revision_plan.py\
  \ exams.csv --start 2026-11-16 --weekday-hours 3 --weekend-hours 5\n  python3 revision_plan.py\
  \ exams.csv --start 2026-11-16 --rest-day Sun --off 2026-11-28,2026-11-29 --day-start\
  \ 16:00\n  python3 revision_plan.py --self-test\nExit codes: 0 = plan fits, 1 =\
  \ HIGH findings (not enough sessions), 2 = bad input.\n\"\"\"\nimport argparse,\
  \ csv, datetime as dt, io, json, sys\n\nDAYS = [\"Mon\", \"Tue\", \"Wed\", \"Thu\"\
  , \"Fri\", \"Sat\", \"Sun\"]\nSEV = {\"HIGH\": 0, \"MEDIUM\": 1, \"LOW\": 2}\n\n\
  \nclass InputError(Exception):\n    pass\n\n\ndef parse_date(s, what):\n    try:\n\
  \        return dt.date.fromisoformat(s.strip())\n    except ValueError:\n     \
  \   raise InputError(f\"{what} '{s}' must be YYYY-MM-DD\")\n\n\ndef read_subjects(text):\n\
  \    sample = text[:2000]\n    delim = \";\" if sample.count(\";\") > sample.count(\"\
  ,\") else \",\"\n    rd = csv.DictReader(io.StringIO(text), delimiter=delim)\n \
  \   if not rd.fieldnames:\n        raise InputError(\"empty CSV\")\n    fields =\
  \ [f.strip().lower() for f in rd.fieldnames]\n    missing = [c for c in (\"subject\"\
  , \"exam_date\", \"weight\", \"confidence\") if c not in fields]\n    if missing:\n\
  \        raise InputError(\"missing columns: \" + \", \".join(missing))\n    subs\
  \ = []\n    for i, raw in enumerate(rd, start=2):\n        r = {k.strip().lower():\
  \ (v or \"\").strip() for k, v in raw.items() if k}\n        if not any(r.values()):\n\
  \            continue\n        try:\n            w = float(r[\"weight\"].replace(\"\
  ,\", \".\"))\n            c = int(r[\"confidence\"])\n            t = int(r[\"topics\"\
  ]) if r.get(\"topics\") else None\n        except ValueError:\n            raise\
  \ InputError(f\"row {i}: weight, confidence and topics must be numbers\")\n    \
  \    if w <= 0:\n            raise InputError(f\"row {i}: weight must be positive\"\
  )\n        if not 1 <= c <= 5:\n            raise InputError(f\"row {i}: confidence\
  \ must be 1 (weak) to 5 (strong)\")\n        if not r[\"subject\"]:\n          \
  \  raise InputError(f\"row {i}: subject is empty\")\n        subs.append({\"subject\"\
  : r[\"subject\"], \"exam\": parse_date(r[\"exam_date\"], f\"row {i}: exam_date\"\
  ),\n                     \"weight\": w, \"confidence\": c, \"topics\": t})\n   \
  \ if not subs:\n        raise InputError(\"no subjects in CSV\")\n    return subs\n\
  \n\ndef slots_for(hours, session, brk):\n    \"\"\"Number of sessions that fit in\
  \ `hours` with a break between sessions.\"\"\"\n    mins = hours * 60\n    if mins\
  \ < session:\n        return 0\n    return int((mins + brk) // (session + brk))\n\
  \n\ndef plan(subs, start, weekday_hours=3.0, weekend_hours=5.0, session=50, brk=10,\
  \ rest_day=None,\n         off=(), max_same=2, day_start=None):\n    if session\
  \ < 15 or brk < 0:\n        raise InputError(\"session must be at least 15 minutes\
  \ and break not negative\")\n    for s in subs:\n        if s[\"exam\"] <= start:\n\
  \            raise InputError(f\"{s['subject']}: exam {s['exam']} is not after the\
  \ start date {start}\")\n    last = max(s[\"exam\"] for s in subs)\n    exam_days\
  \ = {}\n    for s in subs:\n        exam_days.setdefault(s[\"exam\"], []).append(s[\"\
  subject\"])\n    for s in subs:\n        s[\"priority\"] = s[\"weight\"] * (6 -\
  \ s[\"confidence\"])\n    days = []\n    d = start\n    while d < last:\n      \
  \  if d in off or (rest_day is not None and d.weekday() == rest_day):\n        \
  \    n = 0\n        else:\n            n = slots_for(weekend_hours if d.weekday()\
  \ >= 5 else weekday_hours, session, brk)\n            if d in exam_days:\n     \
  \           n //= 2  # the exam takes half the day\n        days.append((d, n))\n\
  \        d += dt.timedelta(days=1)\n    # target sessions: share of the slots available\
  \ before each exam, by priority\n    total_p = sum(s[\"priority\"] for s in subs)\n\
  \    for s in subs:\n        before = sum(n for day, n in days if day < s[\"exam\"\
  ])\n        s[\"target\"] = max(1, round(before * s[\"priority\"] / total_p))\n\
  \        s[\"planned\"] = 0\n    timetable = []\n    for day, n in days:\n     \
  \   today, used = [], {}\n        live = [s for s in subs if s[\"exam\"] > day]\n\
  \        # the day before an exam: a timed past paper first\n        for s in live:\n\
  \            if (s[\"exam\"] - day).days == 1 and len(today) < n:\n            \
  \    today.append((s[\"subject\"], \"Past paper (timed)\")); used[s[\"subject\"\
  ]] = 1; s[\"planned\"] += 1\n        while len(today) < n:\n            cands =\
  \ [s for s in live if used.get(s[\"subject\"], 0) < max_same]\n            if not\
  \ cands:\n                break\n            prev = today[-1][0] if today else None\n\
  \n            def score(s):\n                days_left = max(1, (s[\"exam\"] - day).days)\n\
  \                need = (s[\"target\"] - s[\"planned\"]) / days_left\n         \
  \       # subjects still below target first, then interleave (avoid repeating the\
  \ previous subject)\n                return (s[\"planned\"] < s[\"target\"], s[\"\
  subject\"] != prev, need, s[\"priority\"], -s[\"exam\"].toordinal())\n         \
  \   s = max(cands, key=score)\n            left = (s[\"exam\"] - day).days\n   \
  \         kind = \"Practice questions\" if left <= 7 else (\"Learn + recall\" if\
  \ s[\"planned\"] < s[\"target\"] * 0.6 else \"Mixed review\")\n            today.append((s[\"\
  subject\"], kind)); used[s[\"subject\"]] = used.get(s[\"subject\"], 0) + 1; s[\"\
  planned\"] += 1\n        timed = []\n        t = day_start\n        for subj, kind\
  \ in today:\n            if t is not None:\n                end = t + session\n\
  \                timed.append({\"subject\": subj, \"kind\": kind, \"time\": f\"\
  {t // 60:02d}:{t % 60:02d}-{end // 60:02d}:{end % 60:02d}\"})\n                t\
  \ = end + brk\n            else:\n                timed.append({\"subject\": subj,\
  \ \"kind\": kind})\n        timetable.append({\"date\": day.isoformat(), \"dow\"\
  : DAYS[day.weekday()], \"exams\": exam_days.get(day, []), \"sessions\": timed})\n\
  \    findings = []\n    for s in subs:\n        if s[\"topics\"]:\n            if\
  \ s[\"planned\"] < s[\"topics\"]:\n                findings.append((\"HIGH\", \"\
  UNDER_COVERED\", f\"{s['subject']}: {s['planned']} sessions for {s['topics']} topics;\
  \ add hours, drop low-yield topics or start earlier\"))\n            elif s[\"planned\"\
  ] < 1.5 * s[\"topics\"]:\n                findings.append((\"MEDIUM\", \"TIGHT\"\
  , f\"{s['subject']}: {s['planned']} sessions for {s['topics']} topics leaves little\
  \ time for a second pass\"))\n        if s[\"planned\"] < 0.6 * s[\"target\"]:\n\
  \            findings.append((\"MEDIUM\", \"BELOW_TARGET\", f\"{s['subject']}: {s['planned']}\
  \ of {s['target']} target sessions fit before the exam\"))\n    dates = sorted(exam_days)\n\
  \    for a, b in zip(dates, dates[1:]):\n        if (b - a).days <= 1:\n       \
  \     findings.append((\"MEDIUM\", \"BACK_TO_BACK\", f\"exams on {a} ({', '.join(exam_days[a])})\
  \ and {b} ({', '.join(exam_days[b])}); finish the second subject's practice before\
  \ the first exam\"))\n    for day, subjects in exam_days.items():\n        if len(subjects)\
  \ > 1:\n            findings.append((\"MEDIUM\", \"SAME_DAY\", f\"{len(subjects)}\
  \ exams on {day}: {', '.join(subjects)}\"))\n    if rest_day is None and len(days)\
  \ > 10 and not off:\n        findings.append((\"LOW\", \"NO_REST_DAY\", \"no rest\
  \ day in a plan longer than 10 days; take at least half a day off each week\"))\n\
  \    if max(weekday_hours, weekend_hours) > 8:\n        findings.append((\"LOW\"\
  , \"LONG_DAYS\", \"more than 8 hours of revision a day rarely stays productive;\
  \ keep 5-6 focused hours\"))\n    findings.sort(key=lambda f: SEV[f[0]])\n    total_sessions\
  \ = sum(len(t[\"sessions\"]) for t in timetable)\n    return {\n        \"subjects\"\
  : [{\"subject\": s[\"subject\"], \"exam\": s[\"exam\"].isoformat(), \"weight\":\
  \ s[\"weight\"], \"confidence\": s[\"confidence\"],\n                      \"priority\"\
  : s[\"priority\"], \"topics\": s[\"topics\"], \"target\": s[\"target\"], \"planned\"\
  : s[\"planned\"],\n                      \"hours\": round(s[\"planned\"] * session\
  \ / 60, 1)} for s in sorted(subs, key=lambda x: x[\"exam\"])],\n        \"summary\"\
  : {\"start\": start.isoformat(), \"last_exam\": last.isoformat(), \"days\": len(days),\
  \ \"sessions\": total_sessions,\n                    \"study_hours\": round(total_sessions\
  \ * session / 60, 1), \"session_min\": session, \"break_min\": brk},\n        \"\
  timetable\": timetable,\n        \"findings\": [{\"severity\": a, \"code\": b, \"\
  message\": c} for a, b, c in findings],\n    }\n\n\ndef to_markdown(p):\n    s =\
  \ p[\"summary\"]\n    out = [\"# Revision timetable\", \"\",\n           f\"{s['start']}\
  \ to {s['last_exam']}: {s['days']} days, {s['sessions']} sessions of {s['session_min']}\
  \ min ({s['study_hours']} h of focused study), {s['break_min']} min breaks\",\n\
  \           \"\", \"| Subject | Exam | Weight | Confidence | Priority | Topics |\
  \ Target | Planned | Hours |\", \"|---|---|---|---|---|---|---|---|---|\"]\n   \
  \ for x in p[\"subjects\"]:\n        out.append(f\"| {x['subject']} | {x['exam']}\
  \ | {x['weight']:g} | {x['confidence']} | {x['priority']:g} | {x['topics'] or '-'}\
  \ | {x['target']} | {x['planned']} | {x['hours']} |\")\n    out += [\"\", \"## Day\
  \ by day\", \"\"]\n    for t in p[\"timetable\"]:\n        head = f\"- **{t['dow']}\
  \ {t['date']}**\" + (f\" (EXAM: {', '.join(t['exams'])})\" if t[\"exams\"] else\
  \ \"\")\n        if not t[\"sessions\"]:\n            out.append(head + \": rest\"\
  )\n            continue\n        parts = [(f\"{x['time']} \" if \"time\" in x else\
  \ \"\") + f\"{x['subject']} ({x['kind']})\" for x in t[\"sessions\"]]\n        out.append(head\
  \ + \": \" + \"; \".join(parts))\n    out += [\"\", \"## Findings\"]\n    out +=\
  \ [f\"- {f['severity']} {f['code']}: {f['message']}\" for f in p[\"findings\"]]\
  \ or [\"- none\"]\n    out += [\"\", \"Start each session with 5 minutes of recall\
  \ from memory on the previous session of that subject, and end with 3 questions\
  \ you could not answer.\"]\n    return \"\\n\".join(out)\n\n\ndef self_test():\n\
  \    res = []\n\n    def check(name, cond):\n        res.append(cond)\n        print((\"\
  PASS \" if cond else \"FAIL \") + name)\n\n    D = dt.date\n    S = lambda name,\
  \ exam, w=1, c=3, t=None: {\"subject\": name, \"exam\": exam, \"weight\": w, \"\
  confidence\": c, \"topics\": t}\n    check(\"slots: 3 h of 50+10 = 3\", slots_for(3,\
  \ 50, 10) == 3)\n    check(\"slots: 50 min fits exactly 1\", slots_for(50 / 60,\
  \ 50, 10) == 1)\n    check(\"slots: under one session = 0\", slots_for(0.5, 50,\
  \ 10) == 0)\n    check(\"slots: 25+5 in 2 h = 4\", slots_for(2, 25, 5) == 4)\n \
