  \ `api/index.js` (The Vercel Serverless function. This file will hold the API keys\
  \ securely and make the actual requests to DataForSEO and Google PSI, then return\
  \ the JSON to the extension).\n\nSPECIFIC LOGIC REQUIREMENTS:\n- BACKEND (api/index.js):\
  \ \n  - Accept a `domain` and `type` (offpage or technical) query parameter.\n \
  \ - If `type=offpage`, use the DataForSEO API (Basic Auth) to fetch Domain Rank,\
