  \ Show a sleek loading skeleton while waiting for the Vercel backend.\n  - Display\
  \ the data in clean cards (e.g., \"Domain Rating: 45\", \"Est. Traffic: 10k\", \"\
  Backlinks: 5.2k\").\n  - Include basic local caching (`chrome.storage.local`) for\
  \ 24 hours so we don't waste API credits if the user clicks the same site twice.\n\
  \nPlease output the code for each file clearly labeled. Ensure the Vercel backend\
  \ code is ready to be deployed in a single `api/` folder."
