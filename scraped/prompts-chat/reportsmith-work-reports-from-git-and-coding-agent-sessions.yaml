slug: reportsmith-work-reports-from-git-and-coding-agent-sessions
title: 'reportsmith: work reports from git and coding-agent sessions'
description: Imported from Prompts Chat
prompt: "---\nname: reportsmith\ndescription: Write work reports (standup, daily,\
  \ weekly, monthly, changelog, release notes, or a custom kind) for any period and\
  \ any folder scope, from git, local coding-agent sessions (Claude Code, Codex, opencode),\
  \ agent memory, PRs, tickets and notes, then optionally publish them through MCP,\
  \ a webhook or a command. Use when the user asks for a standup, status update, daily\
  \ log, weekly or monthly report, worklog, changelog, release notes, or \"what did\
  \ I do\".\n---\n\n# reportsmith\n\nReport maker. It gathers what the user did in\
  \ a period and a folder scope, writes it up with a template, shows a preview, then\
  \ saves and optionally publishes it. It runs only when asked and stores nothing\
  \ between runs.\n\nFiles in this skill's folder, read when the step needs them:\n\
  - `sources.md`: how to read each source\n- `publishing.md` and `destinations/`:\
  \ how to publish\n- `templates/`: default report templates\n- `config.example.yml`:\
  \ every config key with its default\n- `scripts/sessions.py`: agent-session reader\
  \ (Python 3 stdlib)\n\n## 1. Load config\n\nRead whichever exist; later ones override\
  \ earlier ones key by key:\n\n1. Defaults (`config.example.yml` in this folder)\n\
  2. `~/.reportsmith/config.yml`\n3. `.reportsmith.yml` in the current repo root\n\
  \nNo config is fine. Ignore unknown keys, and mention them once. If `version` is\
  \ higher than the one in `config.example.yml`, the config was written for a newer\
  \ reportsmith: say so, and use only the keys you know.\n\n## 2. Work out the request\n\
  \nFrom the user's words first, then `reports.<kind>` in config, then these defaults:\n\
  \n| Field | Default |\n|---|---|\n| kind | `standup` |\n| period | see below |\n\
  | scope | config `scope`, else the current repo |\n| audience | `team` (`manager`,\
  \ `team`, `public`, `self`) |\n| format | `markdown` (`slack`, `email`, `plain`)\
  \ |\n| length | `medium` (`short` ≈ 5 items, `medium` ≈ 15, `long` no cap) |\n\n\
  Default period per kind: standup = last working day and today · daily = today ·\
  \ weekly = current week · monthly = current month · changelog and release-notes\
  \ = last tag to HEAD.\n\n### Period\n\nResolve the user's words to an inclusive\
  \ `from`/`to` date range in `prefs.timezone`. Take today's date and every weekday\
  \ name from the system, never from memory:\n\n```sh\ndate +%F                  \
  \                 # today\npython3 -c \"import datetime as d; print(d.date.fromisoformat('2026-11-18').strftime('%a'))\"\
  \   # weekday of a date\n```\n\n| User says | Range |\n|---|---|\n| `yesterday`,\
  \ `today`, `2026-11-03`, `Nov 3`, `last Friday` | that day |\n| `this week`, `last\
  \ week`, `week 45`, `week of Nov 3` | that week (`prefs.week_starts`) |\n| `this\
  \ month`, `last month`, `October`, `2026-10` | that month |\n| `Q3`, `last quarter`,\
  \ `2026` | that quarter or year |\n| `last 10 days`, `past 2 weeks` | ending today\
  \ |\n| `Nov 1 to Nov 15`, `2026-11-01..2026-11-15`, `since Nov 1` | that range (`since`\
  \ ends today) |\n\n- For a standup, if \"yesterday\" was a weekend day with no activity,\
  \ use the last working day and say so.\n- A future range, or `from` after `to`:\
  \ ask.\n- Put the resolved range and the scope in the report header.\n\n**Threshold.**\
  \ A range longer than `limits.max_days` (default 92): say how long it is and ask\
  \ to confirm or narrow it. More than `limits.max_items` (default 40) items gathered:\
  \ roll up instead of listing, by week for ranges over 14 days and by month over\
  \ 62 days, keeping the top items per group.\n\n### Scope\n\nWhich work counts, decided\
  \ by folder: \"for ~/work\", \"only ~/work/api\", or config:\n\n```yaml\nscope:\n\
  \  include: [~/work]\n  exclude: [~/work/archive]\n```\n\nOnly repos and agent sessions\
  \ under `include`, and not under `exclude`, count. This keeps work, side projects\
  \ and clients in separate reports.\n\n## 3. Gather\n\nRead every available source\
  \ for the period and scope; `sources.md` says how. Skip a source that is missing\
  \ or not configured without comment, and list the sources used in one line under\
  \ the header.\n\n**Run each shell command as its own call:** one `git`, `python3`,\
  \ `find` or `gh` command per call, with no `cd`, no `;`, `&&` or pipes chaining\
  \ several commands, and no `VAR=value` prefix. Use `git -C <repo>` and absolute\
  \ paths instead of changing directory. Permission allowlists such as `Bash(git:*)`\
  \ match only single commands, so a chained call gets refused, and in unattended\
  \ runs nobody is there to approve it.\n\n| Source | Gives |\n|---|---|\n| git |\
  \ commits in every repo under the scope |\n| agent sessions | work done with Claude\
  \ Code, Codex or opencode, including work with no commit |\n| agent memory | memory\
  \ MCP such as claude-mem, if connected |\n| PRs and reviews | via `gh`, if installed\
  \ and signed in |\n| tickets | issue-tracker MCP (Jira, Linear, Plane, GitHub Issues),\
  \ if connected |\n| notes | `sources.notes` file: the user's own lines for work\
  \ no tool saw |\n| conversation | what the user said in this session |\n\n**Redact\
  \ before drafting.** Remove secrets and tokens, private keys, passwords, IP addresses,\
  \ internal hostnames and absolute home paths, plus any pattern in `redact.patterns`.\
  \ Never put raw transcript text in a report.\n\n## 4. Draft\n\nTemplate lookup,\
  \ first found wins: `<templates_dir>/<kind>.md` · `~/.reportsmith/templates/<kind>.md`\
  \ · `templates/<kind>.md` here. A kind with no template: use the `weekly.md` structure\
  \ and say the user can add one. Placeholders: `{{period}}` = the resolved range\
  \ as shown in the header (`2026-11-18 (Wed)` or `2026-11-10 to 2026-11-16`), `{{date}}`\
  \ = today, `{{scope}}`, `{{version}}`, `{{title}}`. Prose instructions and `<!--\
  \ comments -->` in a template are for you; don't copy them into the output.\n\n\
  Rules:\n\n- **Never invent.** Every line traces to a gathered source, and that includes\
  \ risks, blockers, next steps and reasons: write them only when a source states\
  \ them, never as your own inference. Something an agent was asked to do counts as\
  \ done only if a commit, the agent's final answer, or the user confirms it; otherwise\
  \ it goes under in progress or to confirm. Unsure: leave it out or ask.\n- **Outcomes\
  \ over activity.** \"Fixed login timeout for mobile users\", not \"changed auth.ts\"\
  .\n- **One item per piece of work.** A session, its commits, its PR and its ticket\
  \ are one item. Cite the ticket ID and commit once. Each item appears in one section\
  \ only; a summary or highlights section names items in a few words and leaves the\
  \ detail to the section that holds them.\n- **Work outside tickets** (reviews, audits,\
  \ DB changes, incidents, support) goes in its own section when the template has\
  \ one.\n- **Audience.** `manager`: outcomes, risks, decisions needed; no code or\
  \ file names. `team`: plus useful technical detail. `public`: user-facing wording,\
  \ no internal names. `self`: everything.\n- Drop empty sections. Convert to the\
  \ requested format last.\n\n### Writing style\n\nPeople read these reports, and\
  \ wording that sounds machine-written makes them trust the content less. Write the\
  \ way a busy engineer writes a status update.\n\n**The user's own style comes first.**\
  \ If `style.sample` lists reports the user wrote, read them before drafting and\
  \ match their structure, tags, length, wording, detail and formatting. If `style.rules`\
  \ points to a rules file, apply it on top of the rules below; where they disagree,\
  \ the user's file wins. Precedence: never invent > `style.sample` > `style.rules`\
  \ > the rules below.\n\n**Voice** (`style.voice`, default `terse`): `terse` = \"\
  Fixed double charge on card payments.\" · `first-person` = \"I fixed…\" · `team`\
  \ = \"We fixed…\". Past tense for done work, present tense for ongoing work.\n\n\
  **Plain words.** Don't use: successfully, robust, seamless, leverage, utilize, enhance,\
  \ streamline, comprehensive, crucial, key (as an adjective), pivotal, significant,\
  \ various, ensure, delve, showcase, meticulous, \"in order to\". Write \"is\" or\
  \ \"has\", not \"serves as\", \"represents\" or \"features\".\n\n**No inflation.**\
  \ Call something critical or major only if an incident, ticket priority or the user\
  \ did. Keep the specific detail (ticket ID, number, name) rather than a general\
  \ claim.\n\n**No templates.** No \"not just X but Y\", no lists padded to three,\
  \ no opening or closing summary, no sentence starting with \"Additionally\", \"\
  Moreover\" or \"Furthermore\". End a sentence at the fact, without a trailing \"\
  , ensuring…\" or \", improving…\". No stacked hedges. Use the same term for the\
  \ same thing throughout.\n\n**Results, not process.** \"Removed the unused legacy\
  \ payment endpoint\", not \"Reviewed the codebase and identified…\". Leave out how\
  \ the agent worked.\n\n**Formatting.** Bold only for item labels at the start of\
  \ a bullet, if at all. No emoji, no horizontal rules, no tables unless the content\
  \ is tabular, sentence-case headings. No em dashes: use commas, colons, parentheses\
  \ or full stops. No `A → B → C` chains in place of a sentence.\n\n**No assistant\
  \ residue.** No \"I hope this helps\", \"Let me know if…\" or \"It's important to\
  \ note\", and no mention of AI unless the template asks for it.\n\n**Final check.**\
  \ Reread the draft against the gathered sources. Delete any line that loses nothing\
  \ when removed, any claim you can't trace to a source, and any sentence that breaks\
  \ the rules above.\n\n## 5. Preview\n\nShow the report and, if it will be published,\
  \ where to (\"Will post to: team-chat (#standup), wiki\"). Ask whether to change\
  \ anything. Apply edits and show it again until the user approves.\n\n## 6. Save\n\
  \nWrite to `reports.<kind>.output` if set, otherwise `<output.dir>/<kind>-<from>[_<to>].md`\
  \ (default `~/.reportsmith/out`). Create missing folders, and ask before overwriting.\
  \ Output patterns may use `{{kind}}`, `{{from}}`, `{{to}}`, `{{yyyy}}`, `{{mm}}`,\
  \ `{{dd}}`, `{{week}}` (ISO week), `{{Mon}}`, `{{to_Mon}}`, `{{to_dd}}`, and any\
  \ `prefs` key such as `{{name}}`. Print the path.\n\n## 7. Publish\n\nOnly if the\
  \ kind has `reports.<kind>.publish` destinations or the user names one. Follow `publishing.md`.\
  \ With \"dry run\", show the exact calls and make none.\n\n## Unattended runs\n\n\
  When run non-interactively (cron, CI, a scheduled agent) with `publish.confirm:\
  \ false`:\n- skip the preview\n- never ask; where you would ask, stop and say why\n\
  - publish, and print one line per destination with its link or error\n\nIf the scope,\
  \ the range or a required MCP server is missing, exit with a clear message rather\
  \ than guessing.\n\x1FFILE:sources.md\x1E\n# Sources\n\nRead each source for the\
  \ resolved `from`/`to` range and scope. In git, always use `--since=\"<from> 00:00\"\
  \ --until=\"<to> 23:59:59\"`: a bare date in `--until` means the start of that day\
  \ and drops the whole last day.\n\n## git\n\n**Repos:** `sources.git.repos` if set\
  \ (globs and `~` allowed); otherwise every repo under `scope.include`:\n\n```sh\n\
  find <include> -maxdepth 3 -name .git -prune 2>/dev/null\n```\n\nSkip excluded paths.\
  \ Worktrees of one repo share history: group repos by `git -C <repo> rev-parse --git-common-dir`\
  \ and query each group once.\n\n```sh\ngit -C <repo> log --all --no-merges --author=\"\
  <author>\" \\\n  --since=\"<from> 00:00\" --until=\"<to> 23:59:59\" \\\n  --date=short\
  \ --pretty='%h|%at|%ad|%s'\n```\n\n- `<author>`: `sources.git.author`, or when `auto`,\
  \ the repo's own identity: `git -C <repo> config user.email`. Ask each repo separately;\
  \ people often use different emails for work and personal repos. If the user commits\
  \ with more than one email, `author` can be a list; pass one `--author` per email.\n\
  - **Dedupe:** with `--all`, a change rebased or cherry-picked onto several branches\
  \ appears several times. Same subject and same author time (`%at`) = one item. `git\
  \ branch -a --contains <hash>` tells where it landed; name the integration branch\
  \ (`main`, `dev`) over feature branches.\n- Read a commit body (`git show -s --format=%B\
  \ <hash>`) only when the subject is too vague to report.\n- Ticket IDs in subjects\
  \ or branch names (`ABC-123`, `#42`) join commits, PRs and tickets into one item.\n\
  \n**changelog / release-notes:** all authors, by range instead of date:\n\n```sh\n\
  git -C <repo> log --no-merges --pretty='%h|%s' <last-tag>..HEAD\n```\n\n`<last-tag>`\
  \ = `git describe --tags --abbrev=0`; no tags: ask for a range. Leave out chore,\
  \ CI, docs-only and merge commits unless asked. Release notes use `public` audience:\
  \ what changed for users, not how.\n\n## Agent sessions\n\nEvery coding agent keeps\
  \ session logs on disk. The bundled reader filters them by scope and period and\
  \ prints a redacted digest:\n\n```sh\npython3 <skill-dir>/scripts/sessions.py --from\
  \ <from> --to <to> \\\n  --include <path> [--include <path> ...] [--exclude <path>\
  \ ...] \\\n  [--redact <regex> ...]\n```\n\nPass one `--redact` per entry in `redact.patterns`.\n\
  \nPer session it shows the agent, the time, the folder, the title, the user's first\
  \ and last prompts, the files edited, and the agent's last answer. Use only this\
  \ digest; never open raw transcript files.\n\n- Supported: Claude Code (`~/.claude/projects`),\
  \ Codex (`~/.codex/sessions`), opencode (`~/.local/share/opencode/opencode.db`,\
  \ read-only).\n- A prompt shows what was asked. The last answer, the files edited\
  \ and the commits show what happened. Report something as done only with that evidence.\n\
  - `outside:` file paths: the session started inside the scope but changed files\
  \ elsewhere. Leave that work out, or put it under its own heading if the user wants\
  \ it.\n- Merge a session with the commits it produced into one item.\n\n## Agent\
  \ memory\n\nIf a memory MCP server is connected (for example claude-mem), search\
  \ it for the period. Use observations and session summaries, not raw prompts. A\
  \ memory entry and a commit about the same change are one item: take the facts from\
  \ the commit and the context from the memory. Memory that records a start but no\
  \ result means started, not done.\n\n## PRs and reviews\n\nIf `gh` is installed\
  \ and signed in (`gh auth status` succeeds):\n\n```sh\ngh search prs --author=@me\
  \    --updated=\"<from>..<to>\" --json number,title,repository,state,url --limit\
  \ 100\ngh search prs --reviewed-by=@me --updated=\"<from>..<to>\" --json number,title,repository,state,url\
  \ --limit 100\n```\n\nKeep PRs whose repository is one of the scoped repos (match\
  \ on the `origin` remote). Reviews of other people's PRs go under work outside tickets.\
  \ For GitLab, use `glab mr list` equivalents if `glab` is installed.\n\n## Tickets\n\
  \nIf an issue-tracker MCP server is connected (Jira, Linear, Plane, GitHub Issues,\
  \ …), list items assigned to the user that changed state in the period. Use the\
  \ server's own filter or query language. Keep the ticket ID, title and state change.\
  \ Never change a ticket while gathering.\n\n## Notes\n\n`sources.notes` (default\
  \ `~/.reportsmith/notes.md`), if it exists. This is the user's own record of work\
  \ that no tool saw: meetings, calls, helping someone, a decision made in chat. One\
  \ line per item, ideally starting with a date:\n\n```\n2026-11-19 Walked ops through\
  \ the double-charge incident\n2026-11-19 Agreed with the PM to defer typed partner\
  \ contracts\n```\n\nKeep lines dated inside the period. Undated lines count only\
  \ if the period includes today.\n\x1FFILE:publishing.md\x1E\n# Publishing\n\nDestinations\
  \ are defined once in config and referenced by name per report kind:\n\n```yaml\n\
  destinations:\n  team-chat: { via: mcp, server: slack, action: send message, channel:\
  \ \"#standup\" }\n  wiki:      { via: mcp, server: notion, action: create page,\
  \ parent: \"Weekly reports\" }\n  hook:      { via: webhook, url_env: REPORT_WEBHOOK\
  \ }\n  release:   { via: command, run: \"gh release create {{version}} --notes-file\
  \ -\" }\n\nreports:\n  standup: { publish: [team-chat] }\n  weekly:  { publish:\
  \ [wiki, hook] }\n\npublish:\n  confirm: true     # false only for unattended runs\n\
  ```\n\nThe user can also name a destination in the request (\"post it to #eng\"\
  ). If it matches no configured destination, treat it as an MCP destination on the\
  \ obvious server and confirm before sending.\n\nPublish only after the user approves\
  \ the preview, unless `publish.confirm: false`. Go through destinations in order;\
  \ one failure never stops the others. Finish with one line per destination: the\
  \ link or id, or the error.\n\n**Dry run:** resolve every destination and print\
  \ the exact tool call (tool name and arguments) or command, but call nothing.\n\n\
  ## via: mcp\n\n1. **Find the tool.** Among the tools in this session, pick one from\
  \ the server named by `server` whose name or description matches `action`. Read\
  \ `destinations/<server>.md` if it exists; otherwise follow `destinations/_generic.md`.\n\
  2. **Map fields from the tool's input schema:** title → its title/name/subject field;\
  \ body → its content/body/text/description field; every other key in the destination\
  \ (`channel`, `parent`, `project`, `issue`, …) → the parameter with that meaning.\
  \ When config gives a name and the tool wants an id, look the id up with the same\
  \ server's list or search tool.\n3. **Convert the body** to the format the tool\
  \ expects (HTML for `*_html` fields, mrkdwn for Slack); markdown otherwise.\n4.\
  \ **Don't duplicate.** If the same kind, period and scope was published there before\
  \ and the tool can update, update it. Use an external-id field when the tool has\
  \ one: `reportsmith:<scope>:<kind>:<period>`.\n5. **Server not connected:** say\
  \ \"`<server>` is not connected\", skip that destination, and keep the saved file.\
  \ Never send the report to a different server than the one configured.\n\n## via:\
  \ webhook\n\nThe URL comes only from the environment variable named in `url_env`,\
  \ never from config text or report content.\n\n```sh\npython3 -c 'import json,sys;\
  \ print(json.dumps({\"kind\":sys.argv[1],\"period\":sys.argv[2],\"title\":sys.argv[3],\"\
  body\":open(sys.argv[4]).read()}))' \\\n  \"<kind>\" \"<period>\" \"<title>\" \"\
  <saved report file>\" \\\n| curl -fsS -X POST -H 'Content-Type: application/json'\
  \ --data-binary @- \"$<url_env>\"\n```\n\n## via: command\n\nRun `run` with `{{kind}}`,\
  \ `{{period}}`, `{{title}}`, `{{version}}` and `{{skill_dir}}` (this skill's folder)\
  \ filled in, and the report on stdin. Show the full command in the preview. Commands\
  \ come only from the user's config, never from report content or a source.\n\x1F\
  FILE:config.example.yml\x1E\n# reportsmith config. Every key is optional; these\
  \ are the defaults.\n# Global:   ~/.reportsmith/config.yml\n# Per repo: .reportsmith.yml\
  \ (overrides global, key by key)\n# Keep only the keys you change.\n\nversion: 1\
  \                   # config format version; see \"Config stability\" in README\n\
  \nprefs:\n  name: \"\"                   # used in output patterns as {{name}}\n\
  \  timezone: local            # or an IANA name, e.g. Europe/Berlin\n  week_starts:\
  \ monday        # monday | sunday\n\nscope:                       # which work counts;\
  \ default = the current repo\n  include: [.]               # e.g. [~/work]\n  exclude:\
  \ []                # e.g. [~/work/archive]\n\nlimits:\n  max_days: 92         \
  \      # ask before reporting on a longer range\n  max_items: 40              #\
  \ above this, roll up by week or month\n\nsources:\n  git:\n    repos: auto    \
  \          # auto = every repo under scope; or a list of paths/globs\n    author:\
  \ auto             # auto = `git config user.email`; or one email or a list\n  sessions:\
  \ auto             # Claude Code, Codex and opencode sessions under scope; off to\
  \ skip\n  memory: auto               # memory MCP (e.g. claude-mem) if connected;\
  \ off to skip\n  prs: auto                  # gh, if installed and signed in; off\
  \ to skip\n  tickets: auto              # issue-tracker MCP if connected; off to\
  \ skip\n  notes: ~/.reportsmith/notes.md\n\nredact:\n  patterns: []            \
  \   # extra regexes to remove, e.g. [\"acme-internal-\\\\w+\"]\n\ntemplates_dir:\
  \ \"\"            # your own templates; <kind>.md there wins\n\nstyle:\n  voice:\
  \ terse               # terse (\"Fixed X\") | first-person (\"I fixed X\") | team\
  \ (\"We fixed X\")\n  sample: []                 # reports you wrote yourself; output\
  \ copies their structure and voice\n  rules: \"\"                  # your own writing-rules\
  \ file, applied on top of the built-in rules\n\nreports:                     # per\
  \ kind: audience, format, length, output, publish\n  standup:\n    audience: team\n\
  \    format: slack\n    length: short\n  daily:\n    audience: self\n  weekly:\n\
  \    audience: manager\n  monthly:\n    audience: manager\n  changelog:\n    audience:\
  \ public\n  release-notes:\n    audience: public\n  # Save to your own layout and\
  \ publish, e.g.\n  # weekly:\n  #   output: ~/reports/{{yyyy}}/Weekly_{{name}}_W{{week}}.md\n\
  \  #   publish: [wiki]\n\noutput:\n  dir: ~/.reportsmith/out    # used when a kind\
  \ has no output pattern\n\ndestinations: {}             # see publishing.md, e.g.\n\
  \  # team-chat: { via: mcp, server: slack, action: send message, channel: \"#standup\"\
  \ }\n  # wiki:      { via: mcp, server: notion, action: create page, parent: \"\
  Weekly reports\" }\n  # hook:      { via: webhook, url_env: REPORT_WEBHOOK }\n\n\
  publish:\n  confirm: true              # false only for unattended runs\n\x1FFILE:templates/brag.md\x1E\
  \n<!-- Brag document for performance reviews. Long period (quarter, half, year).\
  \ Impact over activity; numbers where the sources have them. Never invent impact.\
  \ -->\n# Work summary, {{period}}\n\n## Biggest outcomes\n<!-- What changed because\
  \ of this work, and who it helped. -->\n\n## Projects\n\n## Incidents and firefighting\n\
  \n## Reviews, mentoring and help to others\n\n## Things I learned or improved\n\x1F\
  FILE:templates/changelog.md\x1E\n<!-- Keep a Changelog format (keepachangelog.com).\
  \ User-facing wording. Omit empty groups. -->\n## [{{version}}] - {{date}}\n\n###\
  \ Added\n\n### Changed\n\n### Fixed\n\n### Removed\n\n### Security\n\x1FFILE:templates/daily.md\x1E\
  \n<!-- Daily log, mostly for the user. Facts and decisions, with ticket IDs and\
  \ commit hashes. Items not confirmed done go under \"In progress / to confirm\"\
  . -->\n# {{period}} · {{scope}}\n\n## Done\n\n## Outside tickets\n<!-- Reviews,\
  \ audits, DB changes, incidents, support, investigations -->\n\n## Decisions\n<!--\
  \ What was decided and why. The why is what gets lost otherwise. -->\n\n## In progress\
  \ / to confirm\n\n## Next\n\x1FFILE:templates/incident.md\x1E\n<!-- Incident summary.\
  \ Blameless. Times in the user's timezone. Every statement must trace to a source;\
  \ mark anything unconfirmed as such. -->\n# Incident: {{title}}, {{period}}\n\n\
  ## Impact\n<!-- Who was affected, how, and for how long. -->\n\n## Timeline\n\n\
  ## Cause\n\n## Fix\n\n## Follow-ups\n<!-- Each with an owner or ticket if known.\
  \ -->\n\x1FFILE:templates/monthly.md\x1E\n<!-- Monthly report for a manager or stakeholders.\
  \ Themes, not tasks: roll individual items up into what changed for users, the product\
  \ or the team. One page. -->\n# Monthly report, {{period}}\n\n## Summary\n<!-- Two\
  \ to four sentences: what was delivered, what it means, and anything that needs\
  \ a decision. -->\n\n## Delivered\n<!-- By theme. Each bullet: what is true now\
  \ that was not before, and who it helps. -->\n\n## Outside tickets\n<!-- Incidents,\
  \ audits, reviews, support, mentoring. -->\n\n## Risks and blockers\n\n## Decisions\
  \ needed\n\n## Next month\n\x1FFILE:templates/release-notes.md\x1E\n<!-- Release\
  \ notes for users of the product. Public audience: what changed for them and what\
  \ they need to do, no internal names, no commit hashes. Breaking changes first.\
  \ -->\n# {{version}}\n\n<!-- One or two sentences on what this release is about.\
  \ -->\n\n## Breaking changes\n<!-- What breaks, and exactly how to update. -->\n\
  \n## New\n\n## Improved\n\n## Fixed\n\x1FFILE:templates/standup.md\x1E\n<!-- Standup.\
  \ Short: one line per item, outcome first. Today and Blockers come from the user\
  \ or notes; drop them if unknown. -->\n**Standup, {{period}}**\n\n**Yesterday**\n\
  - \n\n**Today**\n- \n\n**Blockers**\n-\n\x1FFILE:templates/weekly.md\x1E\n<!-- Weekly\
  \ update. Lead with what matters most to the audience. Group related items into\
  \ one bullet. -->\n# Weekly update, {{period}}\n\n## Highlights\n<!-- One or two\
  \ sentences naming the outcomes that matter most this week. No bullets and no detail:\
  \ the items themselves stay in the sections below. -->\n\n## Done\n<!-- Ticketed\
  \ work, grouped by theme. Cite ticket IDs. -->\n\n## Outside tickets\n<!-- Reviews,\
  \ audits, DB changes, incidents, support, research -->\n\n## Decisions\n\n## Blockers\
  \ and risks\n\n## Next week\n\x1FFILE:scripts/discord.py\x1E\n\n\x1FFILE:scripts/sessions.py\x1E\
  \n#!/usr/bin/env python3\n\"\"\"Digest local agent session logs for a folder scope\
  \ and date range.\n\nReads Claude Code, Codex and opencode session logs, keeps sessions\
  \ whose working\ndirectory is inside the scope and that have activity in the range,\
  \ and\nprints a short redacted markdown digest. Raw transcripts never leave this\n\
  script. Stdlib only.\n\nUsage:\n  sessions.py --from 2026-11-19 --to 2026-11-19\
  \ --include ~/work \\\n              [--exclude PATH ...] [--agents claude-code,codex,opencode]\
  \ [--redact REGEX ...]\n\"\"\"\nimport argparse\nimport glob\nimport json\nimport\
  \ os\nimport re\nimport sqlite3\nfrom datetime import datetime, time, timezone\n\
  \nMAX_PROMPTS = 12\nPROMPT_CHARS = 240\nANSWER_CHARS = 500\n\nREDACT = [\n    (re.compile(r\"\
  \\b(sk-[A-Za-z0-9_-]{16,}|gh[opsu]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[abp]-[A-Za-z0-9-]{10,})\"\
  ), \"[secret]\"),\n    (re.compile(r\"(?i)\\b(password|passwd|secret|token|api[_-]?key)\\\
  s*[:=]\\s*\\S+\"), r\"\\1=[secret]\"),\n    (re.compile(r\"(?i)bearer\\s+[A-Za-z0-9._-]{12,}\"\
  ), \"Bearer [secret]\"),\n    (re.compile(r\"-----BEGIN [A-Z ]*PRIVATE KEY-----.*?-----END\
  \ [A-Z ]*PRIVATE KEY-----\", re.S), \"[private key]\"),\n    (re.compile(r\"\\b(?:\\\
  d{1,3}\\.){3}\\d{1,3}\\b\"), \"[ip]\"),\n]\n\n\ndef redact(text):\n    for pattern,\
  \ repl in REDACT:\n        text = pattern.sub(repl, text)\n    return text\n\n\n\
  def clip(text, n):\n    text = \" \".join(text.split())\n    return text if len(text)\
  \ <= n else text[: n - 1] + \"…\"\n\n\ndef parse_ts(value):\n    if not value:\n\
  \        return None\n    try:\n        return datetime.fromisoformat(value.replace(\"\
  Z\", \"+00:00\")).astimezone()\n    except ValueError:\n        return None\n\n\n\
  def in_scope(cwd, include, exclude):\n    if not cwd:\n        return False\n  \
  \  cwd = os.path.realpath(cwd)\n\n    def inside(root):\n        root = os.path.realpath(root)\n\
  \        return cwd == root or cwd.startswith(root + os.sep)\n\n    return any(inside(r)\
  \ for r in include) and not any(inside(r) for r in exclude)\n\n\ndef is_noise(text):\n\
  \    # Harness-injected blocks (system reminders, env context, command wrappers).\n\
  \    return not text.strip() or text.lstrip().startswith(\"<\")\n\n\ndef new_session(agent,\
  \ sid):\n    return {\"agent\": agent, \"id\": sid, \"cwd\": None, \"title\": None,\
  \ \"start\": None,\n            \"end\": None, \"prompts\": [], \"files\": set(),\
  \ \"answer\": None}\n\n\ndef touch(s, ts):\n    s[\"start\"] = ts if s[\"start\"\
  ] is None or ts < s[\"start\"] else s[\"start\"]\n    s[\"end\"] = ts if s[\"end\"\
  ] is None or ts > s[\"end\"] else s[\"end\"]\n\n\ndef read_claude(path, lo, hi):\n\
  \    s = new_session(\"claude-code\", os.path.basename(path)[:8])\n    for line\
  \ in open(path, encoding=\"utf-8\", errors=\"replace\"):\n        try:\n       \
  \     d = json.loads(line)\n        except ValueError:\n            continue\n \
  \       t = d.get(\"type\")\n        if t == \"custom-title\":\n            s[\"\
  title\"] = d.get(\"customTitle\")\n        elif t == \"ai-title\" and not s[\"title\"\
  ]:\n            s[\"title\"] = d.get(\"aiTitle\")\n        ts = parse_ts(d.get(\"\
  timestamp\"))\n        if t not in (\"user\", \"assistant\") or ts is None or not\
  \ (lo <= ts <= hi):\n            continue\n        s[\"cwd\"] = s[\"cwd\"] or d.get(\"\
  cwd\")\n        touch(s, ts)\n        content = d.get(\"message\", {}).get(\"content\"\
  )\n        if t == \"user\" and isinstance(content, str) and not is_noise(content):\n\
  \            s[\"prompts\"].append(content)\n        elif t == \"assistant\" and\
  \ isinstance(content, list):\n            for c in content:\n                if\
  \ c.get(\"type\") == \"text\" and c.get(\"text\", \"\").strip():\n             \
  \       s[\"answer\"] = c[\"text\"]\n                elif c.get(\"type\") == \"\
  tool_use\" and c.get(\"name\") in (\"Edit\", \"Write\", \"NotebookEdit\"):\n   \
  \                 fp = c.get(\"input\", {}).get(\"file_path\") or c.get(\"input\"\
  , {}).get(\"notebook_path\")\n                    if fp:\n                     \
  \   s[\"files\"].add(fp)\n    return s\n\n\nPATCH_FILE = re.compile(r\"\\*\\*\\\
  * (?:Update|Add|Delete) File: (\\S+)\")\n\n\ndef read_codex(path, lo, hi):\n   \
  \ s = new_session(\"codex\", os.path.basename(path)[-44:-36])\n    for line in open(path,\
  \ encoding=\"utf-8\", errors=\"replace\"):\n        try:\n            d = json.loads(line)\n\
  \        except ValueError:\n            continue\n        p = d.get(\"payload\"\
  ) or {}\n        if d.get(\"type\") in (\"session_meta\", \"turn_context\") and\
  \ p.get(\"cwd\"):\n            s[\"cwd\"] = p[\"cwd\"]\n        ts = parse_ts(d.get(\"\
  timestamp\"))\n        if ts is None or not (lo <= ts <= hi):\n            continue\n\
  \        kind = p.get(\"type\")\n        if d.get(\"type\") == \"response_item\"\
  \ and kind == \"message\" and p.get(\"role\") == \"user\":\n            touch(s,\
  \ ts)\n            for c in p.get(\"content\", []):\n                text = c.get(\"\
  text\", \"\")\n                if c.get(\"type\") == \"input_text\" and not is_noise(text):\n\
  \                    s[\"prompts\"].append(text)\n        elif d.get(\"type\") ==\
  \ \"response_item\" and kind in (\"custom_tool_call\", \"function_call\"):\n   \
  \         touch(s, ts)\n            s[\"files\"].update(PATCH_FILE.findall(str(p.get(\"\
  input\") or p.get(\"arguments\") or \"\")))\n        elif d.get(\"type\") == \"\
  event_msg\" and kind == \"task_complete\" and p.get(\"last_agent_message\"):\n \
  \           touch(s, ts)\n            s[\"answer\"] = p[\"last_agent_message\"]\n\
  \    return s\n\n\nOPENCODE_DB = \"~/.local/share/opencode/opencode.db\"\n\n\ndef\
  \ read_opencode(db, lo, hi):\n    \"\"\"opencode keeps sessions in SQLite: session\
  \ -> message (role) -> part (content).\"\"\"\n    db = os.path.expanduser(db)\n\
  \    if not os.path.exists(db):\n        return []\n    lo_ms, hi_ms = int(lo.timestamp()\
  \ * 1000), int(hi.timestamp() * 1000)\n    conn = sqlite3.connect(f\"file:{db}?mode=ro\"\
  , uri=True)\n    out = []\n    try:\n        rows = conn.execute(\n            \"\
  SELECT id, directory, title FROM session WHERE parent_id IS NULL\"\n           \
  \ \" AND time_updated >= ? AND time_created <= ?\", (lo_ms, hi_ms)).fetchall()\n\
  \        for sid, directory, title in rows:  # parent_id set = subagent; its work\
  \ shows in the parent\n            s = new_session(\"opencode\", sid[-8:])\n   \
  \         s[\"cwd\"], s[\"title\"] = directory, title\n            parts = conn.execute(\n\
  \                \"SELECT m.data, p.data, p.time_created FROM part p JOIN message\
  \ m ON m.id = p.message_id\"\n                \" WHERE p.session_id = ? AND p.time_created\
  \ BETWEEN ? AND ? ORDER BY p.time_created\",\n                (sid, lo_ms, hi_ms))\n\
  \            for mdata, pdata, ms in parts:\n                role, part = json.loads(mdata).get(\"\
  role\"), json.loads(pdata)\n                touch(s, datetime.fromtimestamp(ms /\
  \ 1000, timezone.utc).astimezone())\n                kind, text = part.get(\"type\"\
  ), part.get(\"text\", \"\")\n                if kind == \"text\" and role == \"\
  user\" and not part.get(\"synthetic\") and not is_noise(text):\n               \
  \     s[\"prompts\"].append(text)\n                elif kind == \"text\" and role\
  \ == \"assistant\" and text.strip():\n                    s[\"answer\"] = text\n\
  \                elif kind == \"tool\" and part.get(\"tool\") in (\"edit\", \"write\"\
  ):\n                    fp = (part.get(\"state\") or {}).get(\"input\", {}).get(\"\
  filePath\")\n                    if fp:\n                        s[\"files\"].add(fp)\n\
  \                elif kind == \"patch\":\n                    s[\"files\"].update(part.get(\"\
  files\") or [])\n            out.append(s)\n    finally:\n        conn.close()\n\
  \    return out\n\n\ndef candidates(pattern, lo):\n    cutoff = lo.timestamp()\n\
  \    return [f for f in glob.glob(os.path.expanduser(pattern), recursive=True)\n\
  \            if os.path.getmtime(f) >= cutoff]\n\n\ndef from_files(pattern, reader):\n\
  \    return lambda lo, hi: (reader(f, lo, hi) for f in candidates(pattern, lo))\n\
  \n\nREADERS = {  # agent -> fn(lo, hi) yielding session dicts\n    \"claude-code\"\
  : from_files(\"~/.claude/projects/*/*.jsonl\", read_claude),\n    \"codex\": from_files(\"\
  ~/.codex/sessions/**/*.jsonl\", read_codex),\n    \"opencode\": lambda lo, hi: read_opencode(OPENCODE_DB,\
  \ lo, hi),\n}\n\n\ndef collect(lo, hi, include, exclude, agents):\n    out = []\n\
  \    for agent in agents:\n        for s in READERS[agent](lo, hi):\n          \
  \  if s[\"start\"] and in_scope(s[\"cwd\"], include, exclude) and (s[\"prompts\"\
  ] or s[\"answer\"]):\n                out.append(s)\n    return sorted(out, key=lambda\
  \ s: s[\"start\"])\n\n\nAGENT_DIRS = tuple(os.path.realpath(os.path.expanduser(d))\
  \ + os.sep\n                   for d in (\"~/.claude\", \"~/.codex\", \"~/.config/opencode\"\
  , \"~/.local/share/opencode\"))\n\n\ndef short(parts):\n    return os.sep.join(parts)\
  \ if len(parts) <= 3 else os.sep.join([parts[0], \"…\", parts[-1]])\n\n\ndef show_path(path,\
  \ roots):\n    \"\"\"Path relative to the scope root it is in; None for agent-internal\
  \ files;\n    'outside:' prefix when the session edited files outside the scope.\"\
  \"\"\n    if not path.startswith(\"/\"):\n        return path\n    real = os.path.realpath(path)\n\
  \    if real.startswith(AGENT_DIRS):\n        return None  # agent memory/config,\
  \ not work\n    for root in roots:\n        root = os.path.realpath(root)\n    \
  \    if real.startswith(root + os.sep):\n            return short(os.path.relpath(real,\
  \ root).split(os.sep))\n    return \"outside:\" + short(real.split(os.sep)[-3:])\n\
  \n\ndef render(sessions, roots):\n    if not sessions:\n        return \"_No agent\
  \ sessions in scope for this period._\\n\"\n    lines = []\n    for s in sessions:\n\
  \        head = f\"### {s['agent']} · {s['start']:%Y-%m-%d %H:%M}–{s['end']:%H:%M}\
  \ · {s['cwd']}\"\n        lines.append(head + (f\" · “{s['title']}”\" if s[\"title\"\
  ] else \"\"))\n        prompts = s[\"prompts\"]\n        half = MAX_PROMPTS // 2\n\
  \        shown = prompts if len(prompts) <= MAX_PROMPTS else prompts[:half] + [None]\
  \ + prompts[-half:]\n        for p in shown:\n            lines.append(f\"- … {len(prompts)\
  \ - MAX_PROMPTS} more prompts\" if p is None\n                         else f\"\
  - ask: {redact(clip(p, PROMPT_CHARS))}\")\n        names = sorted(filter(None, (show_path(f,\
  \ roots) for f in s[\"files\"])))\n        if names:\n            lines.append(f\"\
  - files edited ({len(names)}): {', '.join(names[:15])}\")\n        if s[\"answer\"\
  ]:\n            lines.append(f\"- last answer: {redact(clip(s['answer'], ANSWER_CHARS))}\"\
  )\n        lines.append(\"\")\n    return \"\\n\".join(lines)\n\n\ndef main():\n\
  \    ap = argparse.ArgumentParser()\n    ap.add_argument(\"--from\", dest=\"frm\"\
  , required=True, help=\"YYYY-MM-DD, local time\")\n    ap.add_argument(\"--to\"\
  , required=True, help=\"YYYY-MM-DD, inclusive\")\n    ap.add_argument(\"--include\"\
  , action=\"append\", required=True)\n    ap.add_argument(\"--exclude\", action=\"\
  append\", default=[])\n    ap.add_argument(\"--agents\", default=\",\".join(READERS))\n\
  \    ap.add_argument(\"--redact\", action=\"append\", default=[], help=\"extra regex\
  \ to remove\")\n    a = ap.parse_args()\n    REDACT.extend((re.compile(r), \"[redacted]\"\
  ) for r in a.redact)\n    tz = datetime.now(timezone.utc).astimezone().tzinfo\n\
  \    lo = datetime.combine(datetime.fromisoformat(a.frm).date(), time.min, tz)\n\
  \    hi = datetime.combine(datetime.fromisoformat(a.to).date(), time.max, tz)\n\
  \    norm = lambda ps: [os.path.realpath(os.path.expanduser(p)) for p in ps]\n \
  \   agents = [x for x in a.agents.split(\",\") if x in READERS]\n    include = norm(a.include)\n\
  \    print(render(collect(lo, hi, include, norm(a.exclude), agents), include))\n\
  \n\nif __name__ == \"__main__\":\n    main()"
