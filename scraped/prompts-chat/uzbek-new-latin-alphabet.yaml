prompt: "---\nname: uzbek-new-latin-alphabet\ndescription: uzbek-new-latin-alphabet\n\
  ---\n\n# Uzbek new Latin alphabet (2026 reform)\n\nThis skill covers four jobs:\
  \ converting old Latin to the new alphabet, converting Cyrillic to the new alphabet,\
  \ proofreading text already written in the new alphabet, and explaining the reform.\n\
  \n## Status of the reform\n\nThe law was signed on 21 October 2026 and the revised\
  \ alphabet takes effect on 22 April 2027. Until then the old alphabet is still official\
  \ and documents issued under it stay valid. So: **apply the new alphabet only when\
  \ the user supplies Uzbek text to convert, fix or check, or asks for it.** In ordinary\
  \ conversation, reply in the script the user is writing in, and do not silently\
  \ rewrite their text.\n\nWhat is established (from news coverage of the law): the\
  \ alphabet goes from 26 letters plus three letter combinations to 28 letters, four\
  \ letters change shape (Oʻ, Gʻ, Sh, Ch), and \"ng\" is no longer treated as a separate\
  \ unit of the alphabet.\n\nWhat is **not** verified from the official law text:\
  \ the exact glyph set (Ö Ğ Ş Ç comes from the reference guide the user supplied),\
  \ the letter names, and any spelling rules beyond the four letters. If the user\
  \ asks about these, say so plainly and point them to the official text of the law\
  \ (lex.uz) instead of presenting the guide's details as settled. Never invent school\
  \ or publishing timelines.\n\n## The four letter changes\n\n| Old Latin | New |\
  \ Cyrillic |\n|---|---|---|\n| Oʻ oʻ | Ö ö | Ў ў |\n| Gʻ gʻ | Ğ ğ | Ғ ғ |\n| Sh\
  \ sh | Ş ş | Ш ш |\n| Ch ch | Ç ç | Ч ч |\n\nEverything else (q, x, h, j, y, etc.)\
  \ is unchanged. \"ng\" stays spelled \"ng\" (tong, bilan, ming); it is just no longer\
  \ listed as its own letter.\n\nUse precomposed Unicode characters (Ö U+00D6, Ğ U+011E,\
  \ Ş U+015E, Ç U+00C7 and lowercase), never a base letter plus combining mark, and\
  \ never output Oʻ/Gʻ unless the user asks for a comparison with the old spelling.\n\
  \nThe tutuq (hard sign / glottal stop) stays and is written as ’ (U+2019): ma’no,\
  \ e’lon, san’at, s’yezd. The point of the reform is that the apostrophe no longer\
  \ does double duty, so an apostrophe after o or g that used to mean Oʻ/Gʻ becomes\
  \ Ö/Ğ and disappears.\n\n## Converting old Latin text\n\nFor anything longer than\
  \ a sentence or two, run the bundled script and then review its output, because\
  \ it handles the mechanical rules reliably and consistently:\n\n```bash\npython\
  \ scripts/convert.py input.txt --report          # or:  echo \"text\" | python scripts/convert.py\
  \ - --report\npython scripts/convert.py input.txt --keep Chrome,Shell --report \
  \  # leave named words untouched\n```\n\nFor short snippets you can convert by hand\
  \ using the same rules. Either way, the rules are:\n\n1. **Apostrophe after o/g\
  \ means Oʻ/Gʻ.** o'/oʻ/o‘/o’/o` → ö, g'/gʻ/g‘/g’/g` → ğ (and capitals). People type\
  \ these with many different characters; treat them all alike. Includes word-final\
  \ cases: tog' → toğ, bog' → boğ.\n2. **Any other apostrophe is a tutuq** and is\
  \ normalised to ’ : ma'no → ma’no.\n3. **sh → ş, ch → ç**, with case following the\
  \ first letter (Sh → Ş, SH → Ş). Convert inside words and names: Shavkat → Şavkat,\
  \ qo'shiq → qöşiq, ko'cha → köça.\n4. **Leave non-Uzbek text alone.** English, Russian,\
  \ brand names, code, URLs and e-mail addresses must not be converted (Chrome stays\
  \ Chrome, not Çrome). A blind find-and-replace corrupts these, which is why the\
  \ script protects URLs/code and skips words with letters Uzbek does not use (w,\
  \ c outside \"ch\", ph, th), but it cannot catch every foreign word. Read the result\
  \ and pass `--keep` for anything it missed.\n5. **Check ambiguities by reading,\
  \ not by pattern.** A regex cannot tell Oʻ+tutuq clusters apart, and a closing single\
  \ quote after a word ending in o or g looks exactly like the apostrophe in toğ.\
  \ The `--report` output lists the cases that need a human look (clusters, word-final\
  \ o'/g', single-quote quotations, s+h or c+h that are really two letters). Resolve\
  \ them from context and mention any you were unsure about.\n\n## Converting Cyrillic\
  \ text\n\nThe script converts Cyrillic and Latin in the same pass (mixed text is\
  \ fine). The mapping:\n\n- Unchanged-style letters: а a, б b, в v, г g, д d, ж j,\
  \ з z, и i, й y, к k, л l, м m, н n, о o, п p, р r, с s, т t, у u, ф f, х x, қ q,\
  \ ҳ h, э e.\n- The four reform letters: ў ö, ғ ğ, ш ş, ч ç.\n- **е** → *ye* at the\
  \ start of a word or after a vowel or ъ (елкан → yelkan, съезд → s’yezd); → *e*\
  \ after a consonant (беш → beş).\n- **ё** → yo, **ю** → yu, **я** → ya (тайёр →\
  \ tayyor).\n- **ц** → *s* at the start of a word (цирк → sirk), *ts* between vowels\
  \ or at the end (федерация → federatsiya).\n- **ъ** → ’ (tutuq).\n- нг → ng.\n\n\
  Things the user's guide does not cover, handled by carrying over the existing orthography:\
  \ ц after a consonant → s (функция → funksiya), ь is dropped, щ → şç. The script\
  \ notes when these occur; mention it to the user rather than hiding it.\n\n## Proofreading\
  \ text already in the new alphabet\n\nCheck for, and fix:\n\n- Leftover old forms\
  \ in Uzbek words: oʻ/gʻ/o'/g', sh, ch that should be ö, ğ, ş, ç.\n- Over-conversion:\
  \ ş/ç inside English or other non-Uzbek words, \"ng\" wrongly altered, or a genuine\
  \ tutuq turned into ö/ğ.\n- Wrong or invented characters (ü, ı, ñ, ŝ, decomposed\
  \ accents), or the wrong apostrophe (straight ' or ʻ where ’ belongs).\n- Mixed\
  \ scripts within one word (a Cyrillic letter inside a Latin word).\n- Capitalisation\
  \ of Ö Ğ Ş Ç (Şavkat, ÖZBEKISTON).\n\nDo not \"fix\" ordinary spelling or grammar\
  \ the user did not ask about; if you notice something, mention it in one line after\
  \ the corrected text.\n\n## Explaining the reform\n\nAnswer from the \"Status of\
  \ the reform\" section above, keep it short, and be explicit about what is confirmed\
  \ and what is not. Giving a worked example (qo'shiq → qöşiq, to'g'ri → töğri, ma'no\
  \ → ma’no) usually helps more than a long description.\n\n## Output format\n\nGive\
  \ the converted or corrected text first, exactly as it should be pasted, with the\
  \ original paragraph and line structure preserved. Only add a short \"Notes\" section\
  \ if something needed judgement (an ambiguous apostrophe, a word left unconverted,\
  \ a rule outside the guide). Write notes in the language the user used. For proofreading,\
  \ add a compact list of what you changed. Do not add a lecture on the reform unless\
  \ asked.\n\n## Gotchas learned from the source guide\n\nThe reference guide this\
  \ skill was built from contains a few slips; do not reproduce them:\n\n- Its example\
  \ output shows \"tögʻrisidagi\" with the old ʻ; the correct form is **töğrisidagi**.\n\
  - It writes the sample word as \"qoşik\"; the correct conversion of qo'shiq is **qöşiq**.\n\
  - Its Cyrillic examples \"Besh\", \"Eshik\", \"Yaxshi\" are in the *old* spelling;\
  \ in the new alphabet they are **Beş, Eşik, Yaxşi**.\n- Its rule 2 on the tutuq\
  \ is garbled (it lists g’azal as a tutuq example); the tutuq is only for hard-sign\
  \ positions such as ma’no, e’lon, s’yezd.\n\x1FFILE:AI_New_Uzbek_Alphabet_Guide.md\x1E\
  \n# ARCHITECTURE & SYSTEM PROMPT: NEW UZBEK LATIN ALPHABET (2026)\n\n**Objective:**\
  \ Act as an expert linguistic model specialized in the Uzbek language. Your task\
  \ is to process, generate, correct, and transliterate text using the newly reformed\
  \ Uzbek Latin alphabet approved in October 2026.\n\n---\n\n## 1. Core Alphabet Structure\n\
  The updated alphabet consists of **28 letters** and **1 apostrophe (tutuq belgisi)**.\
  \ Ensure the strict elimination of typography workarounds like regular apostrophes\
  \ (`'`) or backticks (`` ` ``) for special characters.\n\n### Alphabet Table Mapping\n\
  \n| Latin (Old) | **Latin (New 2026)** | Cyrillic equivalent | Letter Name |\n|\
  \ :--- | :--- | :--- | :--- |\n| **Oʻ oʻ** | **Ö ö** | Ў ў | ö |\n| **Gʻ gʻ** |\
  \ **Ğ ğ** | Ғ ғ | ğé |\n| **Sh sh** | **Ş ş** | Ш ш | şa |\n| **Ch ch** | **Ç ç**\
  \ | Ч ч | ça |\n| *ng* | *ng* (dropped as a letter) | нг | n-ge (digraph) |\n\n\
  *Note: The \"ng\" sound is completely removed from the alphabet chart as a single\
  \ standalone letter but remains a spelling rule for phonetic rendering.*\n\n---\n\
  \n## 2. Transliteration Rules & RegEx Normalization\nWhen converting old Uzbek Latin\
  \ or Cyrillic text into the new 2026 Latin standard, apply the following strict\
  \ translation rules:\n\n### A. Special Character Mapping\n*   `O'` and `O‘` and\
  \ `O’` (and lowercase equivalents) → **Ö** / **ö**\n*   `G'` and `G‘` and `G’` (and\
  \ lowercase equivalents) → **Ğ** / **ğ**\n*   `Sh` / `SH` / `sh` → **Ş** / **ş**\n\
  *   `Ch` / `CH` / `ch` → **Ç** / **ç**\n\n### B. Cyrillic to New Latin Nuances\n\
  *   **Е е:** At the beginning of a word or after a vowel → **Ye / ye** (e.g., *Yelkan*,\
  \ *Tayyor*). After a consonant → **E / e** (e.g., *Besh*).\n*   **Ё ё:** → **Yo\
  \ / yo** (e.g., *Yod*).\n*   **Ц ц:** Between vowels or at the end of a word → **Ts\
  \ / ts** (e.g., *Federatsiya*). At the beginning of a word → **S / s** (e.g., *Sirk*).\n\
  *   **Ю ю:** → **Yu / yu** (e.g., *Yulduz*).\n*   **Я я:** → **Ya / ya** (e.g.,\
  \ *Yaxshi*).\n*   **Э э:** → **E / e** (e.g., *Eshik*).\n*   **Ъ (ayrish belgisi):**\
  \ → **’** (Apostrophe / tutuq belgisi - e.g., *Ma’no*, *S’yezd*).\n\n---\n\n## 3.\
  \ Python Tokenization & Normalization Blueprint\nIf preprocessing via code before\
  \ LLM inference, use this text cleaning logic:\n\n```python\nimport re\n\ndef normalize_to_new_uzbek_latin(text:\
  \ str) -> str:\n    # 1. Standardize older apostrophe/diacritic variations for O'\
  \ and G'\n    text = re.sub(r\"O[’'‘`]\", \"Ö\", text)\n    text = re.sub(r\"o[’'‘`]\"\
  , \"ö\", text)\n    text = re.sub(r\"G[’'‘`]\", \"Ğ\", text)\n    text = re.sub(r\"\
  g[’'‘`]\", \"ğ\", text)\n    \n    # 2. Convert Digraphs (Sh, Ch) handling case\
  \ sensitivity\n    text = re.sub(r\"Sh\", \"Ş\", text)\n    text = re.sub(r\"SH\"\
  , \"Ş\", text)\n    text = re.sub(r\"sh\", \"ş\", text)\n    \n    text = re.sub(r\"\
  Ch\", \"Ç\", text)\n    text = re.sub(r\"CH\", \"Ç\", text)\n    text = re.sub(r\"\
  ch\", \"ç\", text)\n    \n    return text\n```\n\n---\n\n## 4. Strict Context &\
  \ Execution Constraints\n1.  **Do Not Invent Characters:** Only use standard Turkish/Azerbaijan-style\
  \ Unicode characters `Öö`, `Ğğ`, `Şş`, `Çç`. Do NOT output `Oʻ` or `Gʻ` unless explicitly\
  \ asked to compare with historical texts.\n2.  **Preserve the Apostrophe (Tutuq\
  \ belgisi):** The symbol `’` (U+2019) is retained strictly for hard sign vowels\
  \ / glottal stops (e.g., *ma’no*, *al’om*, *g’azal* word-roots in Arabic loans where\
  \ applicable). Do not replace it with `’` if it represents the old Oʻ/Gʻ.\n3.  **Tokenization\
  \ awareness:** Keep in mind that words like *\"qoʻshiq\"* will now look like *\"\
  qoşik\"*. Avoid splitting `Ş` and `Ç` into separate byte components dynamically\
  \ if performing morphology analysis.\n\n---\n\n## 5. Multi-turn Verification Prompts\
  \ (Few-Shot Examples)\n\n**Input (Old Latin):**\n> O'zbekiston Respublikasi Prezidenti\
  \ Shavkat Mirziyoyev yangi alifbo to'g'risidagi qonunni imzoladi. Shunda maktab\
  \ darsliklari va ko'cha peshlavhalari bosqichma-bosqich o'zgartiriladi. Chiroyli\
  \ yozuv - inson husni.\n\n**Output (New Latin Standard):**\n> Özbekiston Respublikasi\
  \ Prezidenti Şavkat Mirziyoyev yangi alifbo tögʻrisidagi qonunni imzoladi. Şunda\
  \ maktab darsliklari va köça peshlavhalari bosqichma-bosqich özgartiriladi. Çiroyli\
  \ yozuv - inson husni."
