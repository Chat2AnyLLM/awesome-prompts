  \ by total (cash + time cost).\n\n## Headline\n\n- Cheapest in cash: **Bus + light\
  \ rail** ($49.00/month).\n- Cheapest once time counts: **Park and ride** ($361/month\
  \ at $20.00/hour).\n- Fastest: **Drive downtown** (28 min one way, 17.9 h/month).\n\
  \n## Break-even value of time (vs Bus + light rail, the cheapest in cash)\n\n| Option\
  \ | Extra cash / year | Lost hours saved / year | Worth it if your hour is worth\
  \ more than |\n|---|---|---|---|\n| Drive downtown | $3,697 | 32 | $115/hour |\n\
  | E-bike | $215 | none (75 more lost) | never on cost: it does not save usable time\
  \ |\n| E-bike 3 days, transit 2 days | $210 | none (45 more lost) | never on cost:\
  \ it does not save usable time |\n| Park and ride | $555 | 87 | $6.35/hour |\n\n\
  ## Notes per option\n\n- **Drive downtown** (car): per month: fuel/energy $51.20,\
  \ maintenance + depreciation $75.90, parking + tolls $230; fixed costs (insurance,\
  \ registration) not counted: you keep the car anyway\n- **Bus + light rail** (transit):\
  \ per month: fares $49.00; monthly pass (cheaper than $105/month pay per ride at\
  \ 19.2 days/month); employer subsidy $50.00/month deducted\n- **E-bike** (ebike):\
  \ per month: bike + upkeep $65.83, fuel/energy $1.08; ownership costs counted in\
  \ full (they do not shrink on days you do not ride)\n- **E-bike 3 days, transit\
  \ 2 days** (mix): E-bike 60 % of days (11.5/month): ownership costs counted in full\
  \ (they do not shrink on days you do not ride); Bus + light rail 40 % of days (7.7/month):\
  \ pay per ride (pass would cost $99.00/month at 7.7 days/month)\n- **Park and ride**\
  \ (multi): leg 2 (transit): monthly pass (cheaper than $105/month pay per ride at\
