  \ return True\n    case(\"mix shares must sum to 1\", lambda: bad(bike, tr, dict(mixo,\
  \ shares={\"Bike\": 0.6, \"Transit\": 0.6})))\n    case(\"mix share must name an\
  \ option\", lambda: bad(bike, dict(mixo, shares={\"Bike\": 0.5, \"Train\": 0.5})))\n\
  \    case(\"unknown mode rejected\", lambda: bad({\"name\": \"Boat\", \"mode\":\
  \ \"boat\", \"minutes_one_way\": 5}))\n    case(\"duplicate names rejected\", lambda:\
  \ bad(car, car))\n    case(\"missing fuel economy rejected\", lambda: bad({\"name\"\
  : \"Car\", \"mode\": \"car\", \"minutes_one_way\": 20, \"fuel_price\": 1.5}))\n\
  \    case(\"negative price rejected\", lambda: bad(dict(car, fuel_price=-1)))\n\
  \    case(\"bad units rejected\", lambda: bad(car, units=\"furlongs\"))\n    case(\"\
  usable share above 1 rejected\", lambda: bad(dict(tr, usable_time_share=1.5)))\n\
  \    passed = 0\n    for name, ok, err in cases:\n        passed += ok\n       \
  \ print((\"PASS \" if ok else \"FAIL \") + name + (\"\" if ok else f\"  {err}\"\
  ))\n    print(f\"{passed}/{len(cases)} passed\")\n    return 0 if passed == len(cases)\
  \ else 1\n\n\ndef main(argv=None):\n    ap = argparse.ArgumentParser(description=\"\
  Compare commute options per month and year, including time value\")\n    ap.add_argument(\"\
  scenario\", nargs=\"?\")\n    ap.add_argument(\"--value-of-time\", type=float, help=\"\
  override value_of_time_per_hour\")\n    ap.add_argument(\"--days-per-week\", type=float,\
  \ help=\"override days_per_week (e.g. 3 for hybrid work)\")\n    ap.add_argument(\"\
  --json\", action=\"store_true\")\n    ap.add_argument(\"--self-test\", action=\"\
  store_true\")\n    a = ap.parse_args(argv)\n    if a.self_test:\n        return\
  \ self_test()\n    if not a.scenario:\n        ap.error(\"give a scenario JSON file,\
  \ or --self-test\")\n    try:\n        with open(a.scenario, encoding=\"utf-8\"\
  ) as fh:\n            sc = json.load(fh)\n        if a.days_per_week is not None\
  \ and not 0.5 <= a.days_per_week <= 7:\n            raise InputError(\"--days-per-week\
  \ must be 0.5..7\")\n        res = evaluate(sc, a.value_of_time, a.days_per_week)\n\
  \    except json.JSONDecodeError as e:\n        print(f\"error: scenario is not\
  \ valid JSON: {e}\", file=sys.stderr)\n        return 2\n    except (OSError, InputError,\
  \ UnicodeDecodeError) as e:\n        print(f\"error: {e}\", file=sys.stderr)\n \
  \       return 2\n    print(json.dumps(res, indent=2) if a.json else render(res),\
