title: Commute Cost Comparison Calculator
description: Imported from Prompts Chat
prompt: "---\nname: commute-cost-comparison-calculator\ndescription: Compares commute\
  \ options - car (fuel or EV), transit, bike, e-bike, walking, day-share mixes and\
  \ park-and-ride legs - per month and year with cash cost, door-to-door time, time\
  \ cost at your own hourly value, cost per trip and CO2. Picks pass vs pay-per-ride\
  \ for the days you ride, separates car running costs from fixed costs, and shows\
  \ the break-even value of an hour. Includes a stdlib Python calculator with --self-test.\n\
  ---\n\n# Commute Cost Comparison Calculator\n\nYou help someone decide how to get\
  \ to work by putting every option on the same footing: what it costs in cash, how\
  \ much of their life it takes, and what that time is worth to them. You count what\
  \ really changes with the choice (fuel, parking, fares, the bike), keep costs they\
  \ pay anyway out unless they would actually sell the car, and show the trade-off\
  \ as a clear number: \"driving saves 32 lost hours a year and costs $3,697 more,\
  \ so it pays only if your hour is worth more than $115\".\n\n## Files in this skill\n\
  \n- `scripts/commute_cost.py` - reads a scenario JSON (distance, commute days, value\
  \ of time, options) and prints a comparison table, headline, break-even values of\
  \ time and per-option notes; supports metric (km, L/100 km) and imperial (mi, mpg),\
  \ EVs, transit passes with daily caps and employer subsidies, day-share mixes and\
  \ multi-leg trips (Python 3.8+ standard library only)\n- `references/cost-components.md`\
  \ - every option field, what to include for each mode, where to find the numbers,\
  \ and typical ranges\n- `references/time-value-and-assumptions.md` - how to choose\
  \ a value of time, usable time on transit, what the totals leave out (health, safety,\
  \ weather, flexibility) and how to run sensitivity checks\n- `templates/commute-comparison.md`\
  \ - the decision summary to hand back\n- `examples/commute.json` - an 11-mile commute\
  \ with driving, bus + light rail, an e-bike, an e-bike/transit mix and park-and-ride\n\
  - `examples/comparison-output.md` - the real output of the calculator for that scenario\n\
  \n## Workflow\n\n### 1. Collect the facts\nOne-way distance, commute days per week\
  \ (hybrid work matters a lot) and weeks worked per year, door-to-door minutes per\
  \ option (including walking, waiting, parking and transfers: ask for a real trip,\
  \ not the map estimate), and per mode: car fuel economy, fuel or electricity price,\
  \ parking and tolls, whether they would keep the car anyway; transit fare, pass\
  \ price, daily cap, employer subsidy; bike or e-bike price, expected life and upkeep.\
  \ Ask what an hour of their time is worth, or offer a default (half their hourly\
  \ pay) and show the sensitivity.\n\n### 2. Run the calculator\n```\npython3 scripts/commute_cost.py\
  \ examples/commute.json\npython3 scripts/commute_cost.py scenario.json --days-per-week\
  \ 3\npython3 scripts/commute_cost.py scenario.json --value-of-time 0 --json\npython3\
  \ scripts/commute_cost.py --self-test\n```\nExit 0 = comparison printed, 2 = bad\
  \ input (missing field, mix shares not adding up to 1, unknown mode, negative price).\
  \ Without code, follow the formulas in `references/cost-components.md`.\n\n### 3.\
  \ Read the result\n- The table is sorted by total (cash + time cost); the headline\
  \ names the cheapest in cash, the cheapest once time counts and the fastest.\n-\
  \ **Break-even value of time** compares every option with the cheapest in cash:\
  \ an option that costs more is worth it only if your hour is worth more than the\
  \ number shown. \"Never\" means it costs more and does not save usable time.\n-\
  \ Time spent on transit that you can use (reading, email) is discounted with `usable_time_share`;\
  \ the same field can credit bike time that replaces exercise you would do anyway.\
  \ Say which you used.\n- Check the transit note: on 2-3 commute days a week a monthly\
  \ pass is often dearer than pay-per-ride; the calculator picks the cheaper and says\
  \ so.\n\n### 4. Deliver\nFill `templates/commute-comparison.md`: recommendation\
  \ in one sentence, the table, break-even values, what changes the answer (hybrid\
  \ days, fuel price, parking, value of time), what is not priced, and a trial suggestion\
  \ (e.g. two weeks of the mix before buying anything).\n\n## Example result\n11 miles\
  \ each way, 5 days a week, 46 weeks, time valued at $20/hour (`examples/commute.json`).\
  \ Cheapest in cash: bus + light rail at $49/month after a $50 employer subsidy (the\
  \ $99 pass beats $105 of single fares). Cheapest once time counts: park and ride\
  \ ($95 cash, $361/month total) because 80 % of the train leg is usable. Driving\
  \ downtown is fastest (28 min) but costs $357/month with $12/day parking and pays\
  \ off only if an hour is worth more than $115. The e-bike costs $67/month all-in\
  \ and emits nothing, but it does not save usable time at these numbers; it wins\
  \ if the ride replaces gym time. See `examples/comparison-output.md`.\n\n## Rules\n\
  \n- Count only costs that change with the choice; include car insurance, registration\
  \ and loan costs only if the person would actually give up the car (`count_fixed`).\n\
  - Use real door-to-door times, including walking, waiting, parking and transfers.\n\
  - Never present the value of time as a fact: it is the person's own choice; show\
  \ at least one sensitivity run (e.g. `--value-of-time 0` and their wage).\n- Keep\
  \ health, safety and weather out of the money totals but mention them; do not moralize\
  \ about cars or bikes.\n- State every assumption with its number (fuel price, parking,\
  \ depreciation per mile) so the person can change it.\n- Give currency and units\
  \ as the person uses them; do not mix miles and kilometres in one scenario.\n\x1F\
  FILE:references/cost-components.md\x1E\n# Cost components and option fields\n\n\
  Scenario fields: `currency` (USD, EUR, GBP, TRY, ...), `units` (`metric`: km, L/100\
  \ km, price per litre; `imperial`: miles, mpg, price per US gallon), `one_way_distance`,\
  \ `days_per_week` (default 5), `weeks_per_year` (default 46: holidays, sick days,\
  \ travel), `value_of_time_per_hour`, `options`.\n\nEvery option: `name`, `mode`,\
  \ `minutes_one_way` (door to door), optional `distance_one_way` (defaults to the\
  \ scenario distance), optional `usable_time_share` (0..1).\n\n## Car (`mode: car`)\n\
  | Field | Meaning | Typical |\n|---|---|---|\n| `fuel_economy_mpg` / `fuel_l_per_100km`\
  \ | real-world consumption on this route (city driving is worse than the label)\
  \ | 25-35 mpg / 6-9 L/100 km |\n| `fuel_price` | per gallon / per litre | local\
  \ pump price |\n| `fuel: \"diesel\"` | uses the diesel CO2 factor | petrol default\
  \ |\n| `kwh_per_100` + `electricity_price` | electric car instead of fuel (kWh per\
  \ 100 mi or km) | 25-35 kWh/100 mi, 16-22 kWh/100 km |\n| `grid_kg_co2_per_kwh`\
  \ | grid intensity for EV CO2 | 0.4 default; 0.05 hydro/nuclear, 0.7 coal-heavy\
  \ |\n| `maintenance_per_distance` | tyres, servicing, repairs per mile/km | $0.08-0.12/mi,\
  \ 0.05-0.08/km |\n| `depreciation_per_distance` | value lost from extra mileage\
  \ only (not age) | $0.05-0.15/mi |\n| `parking_per_day`, `tolls_per_day` | per commute\
  \ day | workplace parking can dominate |\n| `fixed_per_year` + `count_fixed` | insurance,\
  \ registration, loan interest, age depreciation; counted only when `count_fixed`\
  \ is true | true only if commuting is the reason to own the car |\n\nFuel cost =\
  \ 2 x distance x days / mpg x price (or x L/100 km / 100 x price). CO2: petrol 2.35\
  \ kg/L (8.89 kg per US gallon), diesel 2.68 kg/L (10.18 kg/gal), EV kWh x grid factor.\n\
  \nAll-in per-mile rates (tax mileage rates, AAA \"Your Driving Costs\") include\
  \ fixed costs; they overstate the marginal cost of a commute when the car is kept\
  \ anyway.\n\n## Transit (`mode: transit`)\n| Field | Meaning |\n|---|---|\n| `fare_per_ride`,\
  \ `rides_per_day` (default 2) | single fares; add a ride for each paid transfer\
  \ that is not free |\n| `daily_cap` | fare capping per day, if the system has it\
  \ |\n| `monthly_pass` | price per month; the calculator compares 12 passes with\
  \ pay-per-ride for the actual days and picks the cheaper |\n| `subsidy_per_month`\
  \ | employer or tax-free benefit, deducted (never below zero) |\n| `co2_g_per_passenger_km`\
  \ | default 80 g; electric rail 20-40, diesel bus 80-120 at average load |\n| `usable_time_share`\
  \ | share of the trip you can read or work (seat, no transfer stress): 0.2-0.8 |\n\
  \n## Bike, e-bike, walk (`mode: bike | ebike | walk`)\n| Field | Meaning | Typical\
  \ |\n|---|---|---|\n| `purchase_price`, `life_years` | spread over the life (default\
  \ 5 years); not used for walk | e-bike $1,500-3,500 |\n| `maintenance_per_year`\
  \ | tyres, chain, brake pads, battery fund for e-bikes | $100-300 |\n| `gear_per_year`\
  \ | lights, lock, rain gear, helmet replacement | $50-150 |\n| `kwh_per_100`, `electricity_price`\
  \ | e-bike charging | 1-2 kWh per 100 mi |\n| `other_per_month` | bike parking,\
  \ locker, shower membership | 0-30 |\nOwnership costs are counted in full even in\
  \ a mix: you pay for the bike whether you ride 3 or 5 days.\n\n## Mix (`mode: mix`)\n\
  `\"shares\": {\"E-bike\": 0.6, \"Bus + light rail\": 0.4}` splits commute days between\
  \ other options (shares add up to 1). Each part is costed for its own days, so a\
  \ transit part on 2 days a week usually goes pay-per-ride. Use it for weather-dependent\
  \ cycling, hybrid driving, or carpool days.\n\n## Multi-leg (`mode: multi`)\n`\"\
  legs\": [ {car leg}, {transit leg} ]` with `transfer_minutes`. Each leg needs its\
  \ own `distance_one_way` and `minutes_one_way`; costs and minutes are summed. Use\
  \ it for park and ride, bike + train, or walk + bus.\n\n## Where to get the numbers\n\
  - Fuel economy: the car's trip computer over a week of commuting.\n- Parking and\
  \ fares: the operator's price page; check employer benefits (pre-tax transit, parking\
  \ cash-out).\n- Door-to-door time: time one real trip each way at commute hours;\
  \ add 5 minutes for parking or waiting variability.\n\x1FFILE:references/time-value-and-assumptions.md\x1E\
  \n# Value of time and what the totals leave out\n\n## Choosing a value of time\n\
  - There is no correct number: it is what an hour of this person's commute is worth\
  \ to them.\n- Common anchor: about half of hourly take-home pay for personal travel\
  \ (the US Department of Transportation's travel-time guidance uses 50 % of hourly\
  \ income for personal local trips; business travel is valued at 100 %).\n- Someone\
  \ on a fixed salary who cannot earn more by commuting less may choose a lower value;\
  \ a freelancer who bills the saved hours may choose a higher one.\n- Always show\
  \ a sensitivity: `--value-of-time 0` (cash only), the chosen value, and their full\
  \ hourly wage. If the ranking does not change, the decision is robust.\n\n## Usable\
  \ time\n`usable_time_share` discounts time you can use. Rough guide:\n| Situation\
  \ | Share |\n|---|---|\n| Driving, cycling in traffic, standing on a crowded bus\
  \ | 0 |\n| Bus with a seat, short hops, transfers | 0.2-0.4 |\n| Train with a seat\
  \ and table, 20+ minutes without changes | 0.6-0.8 |\n| Bike or walk that replaces\
  \ exercise you would otherwise do | 0.3-0.7 (say so explicitly) |\n\n## Not in the\
  \ money totals (mention them)\n- **Health:** regular cycling or walking is associated\
  \ with better cardiovascular health; some people value it highly, others not at\
  \ all. Use `usable_time_share` if they want it priced.\n- **Safety:** road risk\
  \ per mile differs by mode and route; a protected bike route changes the picture.\n\
  - **Weather and season:** use a mix (e.g. 60 % bike days) rather than assuming every\
  \ day is a bike day.\n- **Reliability:** a 40-minute train with a 10-minute spread\
  \ may beat a 30-minute drive that ranges from 25 to 60; ask about late penalties\
  \ (childcare pick-up).\n- **Flexibility and option value:** having a car for errands\
  \ on the way, or for emergencies; car share or taxi credits can replace it for rare\
  \ days (add them as `other_per_month`).\n- **Stress and comfort:** do not price\
  \ it, but ask.\n\n## Sensitivity runs worth doing\n- Hybrid work: `--days-per-week\
  \ 3` often flips pass vs pay-per-ride and makes owning a second car look worse.\n\
  - Parking: a change in parking price (or employer parking cash-out) is often the\
  \ biggest single lever.\n- Fuel or electricity price +-25 %.\n- Selling a second\
  \ car: rerun with `count_fixed: true` on the car to see the full saving.\n\n## Sanity\
  \ checks before presenting\n- Cash per trip for driving should be at least fuel\
  \ + parking per trip.\n- Transit cash per month should not exceed the pass price\
  \ unless the pass does not cover the route.\n- Hours per month = minutes one way\
  \ x 2 x days per month / 60.\n- If the \"winner\" depends on a value of time far\
  \ from what the person said, say so plainly.\n\x1FFILE:templates/commute-comparison.md\x1E\
