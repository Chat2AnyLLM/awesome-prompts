  \ value of having a car; see references/time-value-and-assumptions.md.\n\x1FFILE:scripts/commute_cost.py\x1E\
  \n#!/usr/bin/env python3\n\"\"\"Commute cost comparison calculator (Python 3.8+\
  \ standard library only).\n\nCompares commute options - car (fuel or electric),\
  \ transit, bike, e-bike, walking,\nday-share mixes (\"bike 3 days, train 2 days\"\
  ) and same-day multi-leg trips (\"drive to\nthe station, then train\") - per month\
  \ and per year: cash cost, time spent, time cost at\nyour own hourly value, total,\
  \ cost per trip and CO2. For transit it picks the cheaper of\npay-per-ride (with\
  \ a daily cap) and a monthly pass for the days you actually ride; for\ncars it separates\
  \ running costs from fixed costs you would keep paying anyway. It also\nprints break-even\
  \ values of time: how much an hour must be worth to you before a faster,\ndearer\
  \ option pays off.\n\nUsage:\n  python3 commute_cost.py scenario.json [--value-of-time\
  \ 25] [--days-per-week 3] [--json]\n  python3 commute_cost.py --self-test\nscenario.json:\
  \ {\"currency\": \"USD\", \"units\": \"imperial\"|\"metric\", \"one_way_distance\"\
  : 11,\n  \"days_per_week\": 5, \"weeks_per_year\": 46, \"value_of_time_per_hour\"\
  : 20,\n  \"options\": [{\"name\": \"...\", \"mode\": \"car|transit|bike|ebike|walk|mix|multi\"\
  , ...}]}\nSee references/cost-components.md for every option field.\nExit codes:\
  \ 0 = comparison printed, 2 = bad input.\n\"\"\"\nimport argparse, json, sys\n\n\
  PETROL_CO2 = {\"metric\": 2.35, \"imperial\": 8.89}   # kg CO2 per litre / per US\
  \ gallon burned (diesel: 2.68 / 10.18)\nDIESEL_CO2 = {\"metric\": 2.68, \"imperial\"\
  : 10.18}\nKM_PER_UNIT = {\"metric\": 1.0, \"imperial\": 1.609344}\nLABELS = {\"\
  energy\": \"fuel/energy\", \"running\": \"maintenance + depreciation\", \"parking_tolls\"\
  : \"parking + tolls\",\n          \"fixed\": \"fixed costs\", \"fares\": \"fares\"\
  , \"ownership\": \"bike + upkeep\", \"other\": \"other\"}\nMODES = {\"car\", \"\
  transit\", \"bike\", \"ebike\", \"walk\", \"mix\", \"multi\"}\nSYMBOLS = {\"USD\"\
  : \"$\", \"EUR\": \"€\", \"GBP\": \"£\", \"TRY\": \"₺\", \"CAD\": \"C$\", \"AUD\"\
  : \"A$\", \"JPY\": \"¥\", \"INR\": \"₹\"}\n\n\nclass InputError(Exception):\n  \
  \  pass\n\n\ndef num(o, key, default=None, lo=0.0, hi=None, who=\"\"):\n    v =\
  \ o.get(key, default)\n    if v is None:\n        raise InputError(f\"{who}: '{key}'\
  \ is required\")\n    if isinstance(v, bool) or not isinstance(v, (int, float)):\n\
  \        raise InputError(f\"{who}: '{key}' must be a number\")\n    if v < lo or\
  \ (hi is not None and v > hi):\n        raise InputError(f\"{who}: '{key}' = {v}\
  \ is out of range\" + (f\" ({lo}..{hi})\" if hi is not None else f\" (>= {lo})\"\
  ))\n    return float(v)\n\n\ndef car_cost(o, sc, days, who):\n    \"\"\"Annual cost\
  \ dict for a car over `days` commute days.\"\"\"\n    units = sc[\"units\"]\n  \
  \  d = num(o, \"distance_one_way\", sc[\"distance\"], who=who) * 2 * days      #\
  \ user units per year\n    if \"kwh_per_100\" in o:\n        kwh = d / 100 * num(o,\
  \ \"kwh_per_100\", who=who)\n        energy = kwh * num(o, \"electricity_price\"\
  , who=who)\n        co2 = kwh * num(o, \"grid_kg_co2_per_kwh\", 0.4, who=who)\n\
  \    else:\n        if units == \"imperial\":\n            vol = d / num(o, \"fuel_economy_mpg\"\
  , lo=1, who=who)\n        else:\n            vol = d / 100 * num(o, \"fuel_l_per_100km\"\
  , lo=0.5, who=who)\n        energy = vol * num(o, \"fuel_price\", who=who)\n   \
  \     co2 = vol * (DIESEL_CO2 if o.get(\"fuel\") == \"diesel\" else PETROL_CO2)[units]\n\
