  picture of him. He is wearing a well-worn, slightly faded black ''NIRVANA'' t-shirt
  from the album ''SMELLS LIKE TEEN SPIRIT'', and faded blue jeans with a rip in the
  right knee. He is sitting on the floor with his knees bent up, both hands raised
  at shoulder height showing the middle finger with both hands, black painted nails.
  He has a SWATCH watch on his left wrist, and thin leather string, and metal bead
  bracelets on his right wrist. He is wearing dog tags for a necklace. His expression
  is serious, defiant, and cool, looking directly at the camera through the sunglasses.
  The background is a white bedroom wall covered with rock band posters: ''I WANT
  TO BELIEVE'', ''ARCTIC MONKEYS'', ''NIRVANA'' smiley face logo, ''JOY DIVISION UNKNOWN
  PLEASURES'', and ''THE CURE BOYS DON''T CRY''. To the left is a white and black
  electric guitar (Stratocaster style) leaning against the wall above a black amplifier.
  To the right are black Dr. Martins combat boots and stacked Vans shoe boxes. Lighting
  is direct frontal flash creating harsh shadows on the wall behind him and specular
  highlights on the lenses of the sunglasses. Shot with a disposable camera, eye-level
  angle, full color, saturated colors, casual grunge aesthetic, rebellious boy vibe,
  90s rock revival style, typical spontaneous aesthetic, ultra-realistic.'
