prompt: "# Task: Deep Research & System Optimization\n\n**Objective:** Act as a senior\
  \ research methodology expert. Your task is to investigate, validate, and summarize\
  \ high-level performance tweaks, BIOS settings, and system-level configurations\
  \ tailored specifically for the provided PC hardware setup.\n\n### Hardware Specifications\n\
  \n- **CPU:** \n- **GPU:** \n- **RAM:** \n- **Motherboard:** \n- **SSD:** \n- **Cooling/Case:**\
  \ \n\n### Guidelines & Constraints\n\n1. **Persona:** Assume the role of a \"Technical\
  \ Peer.\" Focus on deep, architecture-level optimizations.\n2. **Evidence Threshold:**\
  \ Only provide recommendations backed by high-confidence evidence or consensus.\
  \ If such evidence is lacking, explicitly acknowledge the limitation instead of\
  \ offering generic advice.\n3. **Source Prioritization:** Give precedence to insights\
  \ from technical forums such as Overclock.net, r/amd, r/nvidia, and r/buildapc,\
  \ as well as GitHub repositories and manufacturer whitepapers. Avoid generic, SEO-heavy\
  \ tech news or blog sites.\n4. **Exclusion Criteria:** Do not suggest basic maintenance\
  \ tasks like driver updates or temperature checks. Concentrate solely on niche,\
  \ advanced, or \"hidden\" tweaks.\n5. **Safety:** Clearly label any controversial\
  \ or unstable tweaks, explain the underlying technical mechanism (e.g., \"reduces\
  \ L3 latency\"), and provide a detailed rollback procedure.\n\n### Required Output\
  \ Format\n\n- **Validated Tweaks:** List changes that have measurable, technical\
  \ support.\n- **Community Anecdotes:** Include niche bugs, known workarounds, or\
  \ recurring issues specific to this hardware combination.\n- **Risks/Caveats:**\
  \ Highlight any potential impacts on system stability or warranty."
