slug: python-requirements-pin-and-conflict-checker
title: Python Requirements Pin and Conflict Checker
description: Imported from Prompts Chat
prompt: "---\nname: python-requirements-pin-and-conflict-checker\ndescription: Checks\
  \ pip requirements and constraints files offline before they break a build - unpinned\
  \ and lower-bound-only packages, PEP 440 specifier conflicts across files and markers,\
  \ git refs without a commit hash, editable and local paths, partial hash mode, pre-releases,\
  \ --extra-index-url dependency confusion, http indexes, stdlib backports, dev tools\
  \ in runtime files and pip freeze drift. Includes a stdlib Python checker with --self-test.\n\
  ---\n\n# Python Requirements Pin and Conflict Checker\n\nYou help Python developers\
  \ and DevOps engineers make `pip install -r requirements.txt` boring: the same versions\
  \ on every machine, no ResolutionImpossible at 2 a.m., no package quietly fetched\
  \ from the wrong index. Most broken installs come from a few patterns that are visible\
  \ in the files themselves: a constraint file that contradicts a requirement, `requests`\
  \ with no pin, a git dependency on `@main`, one line with `--hash` that switches\
  \ the whole file into hash mode, or an extra index that lets a public package shadow\
  \ an internal one. You read every file pip would read, check the specifiers with\
  \ real PEP 440 rules, and turn the result into a short fix list and a lock-file\
  \ plan.\n\n## Files in this skill\n\n- `scripts/req_check.py` - parses requirements\
  \ files the way pip does (`-r` includes, `-c` constraints, line continuations, comments,\
  \ extras, PEP 508 markers, `--hash`, index options, VCS/URL/editable lines), evaluates\
  \ PEP 440 specifiers including `~=`, wildcards and pre-releases, searches for a\
  \ version that satisfies every specifier per marker environment, compares with `pip\
  \ freeze` output, and reports findings PR01-PR14 (Python 3.8+ standard library only,\
  \ no network)\n- `references/specifiers-and-markers.md` - PEP 440 operators, pre-release\
  \ rules, constraints vs requirements, marker evaluation, and why the checker cannot\
  \ see transitive dependencies\n- `references/pinning-strategy.md` - apps vs libraries,\
  \ the requirements.in + lock workflow, hashes, indexes and supply-chain hygiene,\
  \ and what each finding code means\n- `templates/requirements-review.md` - the review\
  \ to hand back\n- `examples/requirements.txt` - a Django invoice service with a\
  \ typo, a git branch dependency, an extra index, a marker-split numpy, a duplicate\
  \ Django, enum34 and pytest in runtime\n- `examples/constraints.txt` - the platform\
  \ team's constraints file that contradicts two of those requirements\n- `examples/req-report.md`\
  \ - the real checker output on those files\n\n## Workflow\n\n### 1. Collect the\
  \ inputs\nAsk for every file pip reads for the target: the main requirements file,\
  \ anything it includes with `-r` or `-c`, plus `pip.conf` / `PIP_INDEX_URL` / `PIP_EXTRA_INDEX_URL`\
  \ settings from CI and Dockerfiles (index options outside the file are invisible\
  \ to the checker; add them by hand). Ask whether the project is an **app** (deployed\
  \ service, notebook image, CLI shipped as a container: pins expected) or a **library**\
  \ (installed by other projects: ranges expected), which Python versions and platforms\
  \ it targets, and for a `pip freeze` from the environment that misbehaves.\n\n###\
  \ 2. Run the checker\n```\npython3 scripts/req_check.py examples/requirements.txt\n\
  python3 scripts/req_check.py requirements.txt --python 3.12 --platform linux\npython3\
  \ scripts/req_check.py requirements.txt requirements-dev.txt --installed freeze.txt\n\
  python3 scripts/req_check.py requirements.txt --mode lib --json\npython3 scripts/req_check.py\
  \ --self-test\n```\nExit 0 = no high findings, 1 = high findings, 2 = a file could\
  \ not be read. Without `--python`, each marker combination is checked as its own\
  \ environment; with it, lines whose markers do not apply are dropped. Without a\
  \ shell, go line by line with `references/specifiers-and-markers.md` and test each\
  \ package's combined specifiers against a concrete version.\n\n### 3. Read the result\n\
  - Install blockers first: PR03 (no version satisfies the combined specifiers), PR07\
  \ (partial hash mode), PR13 (lines pip refuses). These fail before anything installs.\n\
  - Supply chain: PR09 extra index, PR10 http or trusted hosts, PR05 git refs that\
  \ can move, PR11 bogus or dangerous packages (`sklearn`, `enum34`, `pycrypto`).\n\
  - Reproducibility: PR01 unpinned and PR02 open-ended ranges in apps; in libraries,\
  \ PR02 flags exact pins that would force versions on users.\n- Drift: PR12 shows\
  \ where the running environment differs from the files.\n- Tidy-ups: PR04 duplicates,\
  \ PR06 editable/local paths, PR08 pre-releases, PR14 dev tools in runtime files.\n\
  \n### 4. Fix and lock\nResolve each conflict by deciding which side is right (often\
  \ the constraint is stale; check the changelog of the newer version), then move\
  \ intent-level ranges to `requirements.in` and generate the pinned, hashed lock\
  \ with pip-tools or uv (`references/pinning-strategy.md`). Re-run the checker on\
  \ the lock: it should come back with no high or medium findings. Never \"fix\" a\
  \ conflict by deleting the constraint without asking who owns it.\n\n### 5. Deliver\n\
  Fill `templates/requirements-review.md`: verdict, blockers with exact replacement\
  \ lines, supply-chain changes, the lock workflow and CI commands, and an owner for\
  \ each change.\n\n## Example result\nOn `examples/requirements.txt` the checker\
  \ finds 6 high findings. Two conflicts make pip fail: `urllib3>=2.2` against the\
  \ platform constraint `urllib3<2`, and `numpy>=2.1` against the constraint `numpy==1.26.4`\
  \ for Python 3.9+ (the Python < 3.9 branch is fine). `pandas=2.2.3` uses a single\
  \ `=` and is refused. `pdf-stamp` is installed editable from `@main`, the internal\
  \ index is added with `--extra-index-url` (dependency confusion risk for `acme-billing-core`),\
  \ and `enum34` breaks the standard library `enum` on modern Python. Medium and low:\
  \ open-ended `whitenoise` and `urllib3`, the editable install, Django declared twice\
  \ as `Django` and `django`, and `pytest` in the runtime file.\n\n## Rules\n\n- Read\
  \ every file pip reads, including constraints and includes; a single file in isolation\
  \ hides conflicts.\n- Use PEP 440 semantics, not string comparison (`2.10` > `2.9`,\
  \ `~=2.1` allows 2.9 but not 3.0, `<2.0` excludes `2.0rc1`).\n- Say clearly that\
  \ the checker sees only declared packages: transitive conflicts and CVEs need the\
  \ resolver (`pip install --dry-run`, `pip-compile`, `uv pip compile`) and `pip-audit`.\n\
  - Prefer a lock file generated by a tool over hand pins; never invent version numbers\
  \ - take them from the current environment, the lock, or the package changelog.\n\
  - Treat index and VCS findings as security issues, not style.\n\x1FFILE:references/specifiers-and-markers.md\x1E\
  \n# Specifiers, constraints and markers\n\n## PEP 440 operators\n| Specifier | Means\
  \ | Example matches | Does not match |\n|---|---|---|---|\n| `==2.32.3` | exactly\
  \ this version (trailing zeros ignored: `==2.0` = `==2.0.0`) | 2.32.3 | 2.32.4 |\n\
  | `==2.32.*` | any 2.32.x | 2.32.0, 2.32.9 | 2.33.0 |\n| `~=2.31` | `>=2.31, ==2.*`\
  \ | 2.31, 2.40 | 3.0 |\n| `~=2.31.0` | `>=2.31.0, ==2.31.*` | 2.31.5 | 2.32.0 |\n\
  | `>=4.2,<5.0` | range | 4.2.16 | 5.0 |\n| `!=3.1.2` | anything but | 3.1.3 | 3.1.2\
  \ |\n| `===foo` | arbitrary string equality (avoid) | foo | |\n\n- Order: `1.0.dev1\
  \ < 1.0a1 < 1.0b1 < 1.0rc1 < 1.0 < 1.0.post1`; `1.10 > 1.9` (numeric, not text).\n\
  - `~=2` is invalid (needs at least two release parts); `pkg=1.0` is invalid (single\
  \ `=`).\n- Pre-releases are only chosen if a specifier names one (`>=2.0rc1`), you\
  \ pass `--pre`, or nothing else matches.\n- `<2.0` excludes 2.0 pre-releases; `>1.4`\
  \ excludes 1.4 post-releases.\n- Local versions (`1.0+cpu`) only match `==1.0+cpu`\
  \ or ranges; `==1.0` matches `1.0+cpu` too.\n\n## Requirements vs constraints\n\
  - A requirement (`pkg>=1`) asks pip to install the package.\n- A constraint (`-c\
  \ constraints.txt`, `PIP_CONSTRAINT`) only restricts versions if something requires\
  \ the package; it never installs anything. Constraints cannot have extras or be\
  \ editable.\n- pip combines all specifiers for a name (after PEP 503 normalisation:\
  \ `Django`, `django`, `DJANGO` and `foo_bar` / `foo-bar` / `foo.bar` are the same).\
  \ If nothing satisfies all of them, the resolver stops with ResolutionImpossible.\n\
  \n## Markers (PEP 508)\n- `numpy<2 ; python_version < \"3.9\"` - the line applies\
  \ only where the marker is true.\n- Variables: `python_version` (\"3.12\"), `python_full_version`,\
  \ `sys_platform` (linux, win32, darwin), `platform_system` (Linux, Windows, Darwin),\
  \ `os_name` (posix, nt), `platform_machine`, `implementation_name`, `extra`.\n-\
  \ Two lines for one package with opposite markers are fine; two lines with the same\
  \ (or no) marker are duplicates.\n- The checker evaluates markers when you pass\
  \ `--python` / `--platform`; otherwise it checks the unmarked lines plus each marker\
  \ set as a separate environment.\n\n## What an offline file check cannot see\n-\
  \ Transitive dependencies: `requests==2.32.3` needs `urllib3>=1.21.1,<3`; a conflict\
  \ between what your packages need is only visible to the resolver. Run `pip install\
  \ --dry-run --report report.json -r requirements.txt` or compile a lock.\n- Wheels:\
  \ a pinned version may have no wheel for your Python/platform (e.g. a new Python\
  \ release) and fall back to a source build.\n- Yanked releases and CVEs: use `pip-audit`\
  \ and the index.\n\x1FFILE:references/pinning-strategy.md\x1E\n# Pinning strategy\
  \ and supply-chain hygiene\n\n## Apps vs libraries\n| | App (service, job, notebook\
  \ image) | Library (installed by others) |\n|---|---|---|\n| Direct deps | ranges\
  \ in `requirements.in` / pyproject | ranges in pyproject `dependencies` |\n| What\
  \ gets installed | a lock: every package `==` + `--hash` | whatever the user's resolver\
  \ picks |\n| Exact pins | required (in the lock) | avoid: they force versions on\
  \ every user |\n| Upper bounds | let the lock hold them | only for known breakage\
  \ (`<3` when 3.0 broke you) |\n\n## The lock workflow (apps)\n1. `requirements.in`:\
  \ what you import, with intent-level ranges (`Django>=4.2,<5`).\n2. Compile: `pip-compile\
  \ --generate-hashes -o requirements.txt requirements.in` or `uv pip compile --generate-hashes\
  \ requirements.in -o requirements.txt`. Add `-c constraints.txt` if the platform\
  \ team ships constraints.\n3. Install: `pip install --require-hashes --no-deps -r\
  \ requirements.txt` (the lock already contains everything).\n4. Update on purpose:\
  \ `pip-compile --upgrade-package django`, review the diff, run tests. Automate with\
  \ Dependabot/Renovate.\n5. Dev tools go to `requirements-dev.in` compiled with `-c\
  \ requirements.txt` so versions agree.\n\n## Hashes\n- One `--hash` anywhere turns\
  \ on hash-checking mode for the whole install: every package (including transitive\
  \ ones) needs `==` and a hash, or pip refuses. That is why partial hashes (PR07)\
  \ break installs.\n- Generate hashes with a tool, never by hand; include every platform's\
  \ wheel hash if you build on several.\n\n## Indexes\n- `--extra-index-url` makes\
  \ pip look at both indexes and take the highest version: anyone can upload `acme-billing-core==99.0`\
  \ to PyPI and win (dependency confusion). Use one `--index-url` that points to a\
  \ proxy (Artifactory, Nexus, devpi, CodeArtifact, Azure Artifacts) serving PyPI\
  \ plus internal packages, and reserve internal names on PyPI.\n- https only; `--trusted-host`\
  \ turns off certificate checks.\n- VCS dependencies: pin a full commit (`@3f2a...`\
  \ 40 hex); branches and tags move. Better: publish a wheel to the internal index.\n\
  \n## Finding codes (req_check.py)\n| Code | Severity | Meaning |\n|---|---|---|\n\
  | PR01 | high (app) / info (lib) | no version specifier and no pin elsewhere |\n\
  | PR02 | medium | app: only `>=`/`>`; lib: exact `==` pin |\n| PR03 | high | no\
  \ version satisfies the combined specifiers (per marker environment) |\n| PR04 |\
  \ low / info | declared more than once, or spelt differently |\n| PR05 | high /\
  \ medium | VCS ref without commit hash / archive URL without hash |\n| PR06 | medium\
  \ | editable or local path |\n| PR07 | high | partial hash mode, or hashed line\
  \ without `==` |\n| PR08 | medium | pre-release pin or `--pre` |\n| PR09 | high\
  \ | `--extra-index-url` |\n| PR10 | high / medium | http index or URL / `--trusted-host`\
  \ |\n| PR11 | varies | bogus, unmaintained or backport package (sklearn, pycrypto,\
  \ enum34, typing, nose ...) |\n| PR12 | high / medium | installed version does not\
  \ satisfy the files / package missing |\n| PR13 | high | line pip refuses (bad specifier,\
  \ missing include) |\n| PR14 | low | test or dev tool in a runtime file |\n\x1F\
  FILE:templates/requirements-review.md\x1E\n# Requirements review: <project>\n\n\
  **Files:** <requirements.txt, constraints.txt (-c)>   **Kind:** <app / library>\
  \   **Python:** <3.12, linux>\n**Verdict:** <install fails / installs but not reproducible\
  \ / reproducible>\n\n## Blockers (install fails)\n| # | Where | Problem | Replace\
  \ with |\n|---|---|---|---|\n| 1 | <constraints.txt:3 + requirements.txt:24> | <urllib3\
  \ <2 vs >=2.2> | <agree on urllib3>=2.2,<3 with platform team; update PLAT-412>\
  \ |\n| 2 | <requirements.txt:20> | <pandas=2.2.3> | <pandas==2.2.3> |\n\n## Supply\
  \ chain\n| # | Where | Problem | Fix |\n|---|---|---|---|\n| 1 | <requirements.txt:5>\
  \ | <--extra-index-url internal> | <single --index-url to the proxy; reserve acme-*\
  \ on PyPI> |\n| 2 | <requirements.txt:28> | <pdf-stamp @main, editable> | <publish\
  \ a wheel or pin @<commit>> |\n\n## Reproducibility and tidy-ups\n- <unpinned /\
  \ open ranges: ...>\n- <duplicates, backports, dev tools: ...>\n\n## Lock plan\n\
  ```\n<requirements.in contents (intent ranges)>\npip-compile --generate-hashes -c\
  \ constraints.txt -o requirements.txt requirements.in\npip install --require-hashes\
  \ --no-deps -r requirements.txt\n```\n\n## Not covered by this check\n<transitive\
  \ conflicts: run pip install --dry-run / pip-compile; CVEs: pip-audit; wheel availability\
  \ for Python X.Y>\n\n## Owners and dates\n| Change | Owner | By |\n|---|---|---|\n\
  | <...> | <...> | <...> |\n\x1FFILE:examples/requirements.txt\x1E\n# invoice-service\
  \ runtime dependencies (deployed as a Docker image, Python 3.12)\n# org-wide pins\
  \ from the platform team:\n-c constraints.txt\n--index-url https://pypi.org/simple\n\
  --extra-index-url https://pkgs.acme.internal/simple\n\n# web\nDjango>=4.2,<5.0\n\
  djangorestframework~=3.15\ngunicorn==23.0.0\nwhitenoise>=6.7\n\n# data and storage\n\
  psycopg[binary]==3.2.3\nredis>=5.0\ncelery[redis]==5.4.0\nboto3\nnumpy<2 ; python_version\
  \ < \"3.9\"\nnumpy>=2.1 ; python_version >= \"3.9\"\npandas=2.2.3\n\n# http\nrequests==2.32.3\n\
  urllib3>=2.2\n\n# pdf invoices\nweasyprint==63.0\n-e git+https://github.com/acme/pdf-stamp.git@main#egg=pdf-stamp\n\
  acme-billing-core==1.8.2\n\n# misc\npython-dateutil==2.9.0.post0\nsentry-sdk>=2.0\n\
  django==4.2.16\nenum34==1.1.10\npytest==8.3.3\n\x1FFILE:examples/constraints.txt\x1E\
  \n# Platform team constraints, applied to every service with -c\n# (pins only; a\
  \ constraint never installs anything by itself)\nurllib3<2                  # legacy\
  \ proxy TLS issue, see PLAT-412\nnumpy==1.26.4              # matches the shared\
  \ analytics image\nredis==5.0.8\nboto3==1.35.36\nsentry-sdk==2.17.0\ncelery==5.4.0\n\
  cryptography>=43.0.1       # CVE floor\n\x1FFILE:examples/req-report.md\x1E\n# Requirements\
  \ check: examples/requirements.txt\n\nMode: app.  Packages: 19 (14 pinned with ==).\
  \  Findings: 6 high, 3 medium, 2 low, 0 info.\n\n**Verdict: install will fail or\
  \ is unsafe - fix the high findings first**\n\n## Packages\n\n| Package | Specifiers\
  \ (all files) | Marker | Declared in | Status |\n|---|---|---|---|---|\n| urllib3\
  \ | `<2,>=2.2` | - | examples/constraints.txt:3 (constraint), examples/requirements.txt:24\
  \ | conflict |\n| numpy | `<2,==1.26.4,>=2.1` | `python_version < \"3.9\"; python_version\
  \ >= \"3.9\"` | examples/constraints.txt:4 (constraint), examples/requirements.txt:18,\
  \ examples/requirements.txt:19 | conflict |\n| redis | `==5.0.8,>=5.0` | - | examples/constraints.txt:5\
  \ (constraint), examples/requirements.txt:15 | ok |\n| boto3 | `==1.35.36` | - |\
  \ examples/constraints.txt:6 (constraint), examples/requirements.txt:17 | ok |\n\
  | sentry-sdk | `==2.17.0,>=2.0` | - | examples/constraints.txt:7 (constraint), examples/requirements.txt:33\
  \ | ok |\n| celery | `==5.4.0` | - | examples/constraints.txt:8 (constraint), examples/requirements.txt:16\
  \ | ok |\n| cryptography | `>=43.0.1` | - | examples/constraints.txt:9 (constraint)\
  \ | ok |\n| Django | `<5.0,==4.2.16,>=4.2` | - | examples/requirements.txt:8, examples/requirements.txt:34\
  \ | ok |\n| djangorestframework | `~=3.15` | - | examples/requirements.txt:9 | ok\
  \ |\n| gunicorn | `==23.0.0` | - | examples/requirements.txt:10 | ok |\n| whitenoise\
  \ | `>=6.7` | - | examples/requirements.txt:11 | ok |\n| psycopg | `==3.2.3` | -\
  \ | examples/requirements.txt:14 | ok |\n| requests | `==2.32.3` | - | examples/requirements.txt:23\
  \ | ok |\n| weasyprint | `==63.0` | - | examples/requirements.txt:27 | ok |\n| pdf-stamp\
  \ | `url` | - | examples/requirements.txt:28 | ok |\n| acme-billing-core | `==1.8.2`\
  \ | - | examples/requirements.txt:29 | ok |\n| python-dateutil | `==2.9.0.post0`\
  \ | - | examples/requirements.txt:32 | ok |\n| enum34 | `==1.1.10` | - | examples/requirements.txt:35\
  \ | ok |\n| pytest | `==8.3.3` | - | examples/requirements.txt:36 | ok |\n\n## Findings\n\
  \n- **HIGH PR03** `examples/constraints.txt:3, examples/requirements.txt:24` urllib3:\
  \ no version satisfies <2 (examples/constraints.txt:3), >=2.2 (examples/requirements.txt:24)\
  \ - pip will fail with ResolutionImpossible\n- **HIGH PR03** `examples/constraints.txt:4,\
  \ examples/requirements.txt:19` numpy: no version satisfies ==1.26.4 (examples/constraints.txt:4),\
  \ >=2.1 (examples/requirements.txt:19) when python_version >= \"3.9\" - pip will\
  \ fail with ResolutionImpossible\n- **HIGH PR05** `examples/requirements.txt:28`\
  \ pdf-stamp comes from git+https://github.com/acme/pdf-stamp.git@main#egg=pdf-stamp\
  \ without a full commit hash; the branch or tag can move under you - pin @<40-char\
  \ commit>\n- **HIGH PR09** `examples/requirements.txt:5` --extra-index-url https://pkgs.acme.internal/simple:\
  \ pip picks the highest version from ANY index, so a public package with the same\
  \ name as an internal one wins (dependency confusion); use a single --index-url\
  \ proxy that serves both, or pin with --hash\n- **HIGH PR11** `examples/requirements.txt:35`\
  \ enum34 breaks the stdlib enum on Python 3.6+ (e.g. AttributeError in re); remove\
  \ it\n- **HIGH PR13** `examples/requirements.txt:20` pandas: single '=' in '=2.2.3'\
  \ (use ==) - pip will refuse this line\n- **MEDIUM PR02** `examples/requirements.txt:11`\
  \ whitenoise >=6.7 has no upper bound and no pin; a future major release installs\
  \ automatically\n- **MEDIUM PR02** `examples/requirements.txt:24` urllib3 >=2.2\
  \ has no upper bound and no pin; a future major release installs automatically\n\
  - **MEDIUM PR06** `examples/requirements.txt:28` pdf-stamp is an editable install;\
  \ it will not exist on a clean build machine - publish it or build a wheel\n- **LOW\
  \ PR04** `examples/requirements.txt:8, examples/requirements.txt:34` Django is declared\
  \ 2 times (spelt Django, django); keep one line\n- **LOW PR14** `examples/requirements.txt:36`\
  \ pytest is a development/test tool in a runtime requirements file; move it to requirements-dev.txt\
  \ so production images stay small\n\n## Next steps\n\n1. Fix every PR03/PR07/PR13\
  \ line - these stop `pip install` outright.\n2. Keep loose, intent-level ranges\
  \ in `requirements.in` (or pyproject) and generate a fully pinned, hashed lock with\
  \ `pip-compile --generate-hashes` or `uv pip compile --generate-hashes`; install\
  \ with `pip install --require-hashes -r requirements.txt`.\n3. Use one `--index-url`\
  \ (a proxy that mirrors PyPI and hosts internal packages), https only.\n4. Run `pip-audit\
  \ -r requirements.txt` (online) for known vulnerabilities - this checker is offline\
  \ and does not know CVEs.\n\x1FFILE:scripts/req_check.py\x1E\n#!/usr/bin/env python3\n\
  \"\"\"Python requirements pin and conflict checker (Python 3.8+ standard library\
  \ only, offline).\n\nReads pip requirements files (following -r includes and -c\
  \ constraints), and reports what makes\ninstalls non-reproducible, unsatisfiable\
  \ or risky:\n\n  PR01 unpinned requirement            PR08 pre-release pin or --pre\n\
  \  PR02 lower bound only (>=, >)        PR09 --extra-index-url (dependency confusion)\n\
  \  PR03 conflicting specifiers          PR10 plain http:// index/URL, --trusted-host\n\
  \  PR04 duplicate / differently spelt   PR11 deprecated, renamed or stdlib-backport\
  \ package\n  PR05 VCS/URL without immutable ref   PR12 installed version (pip freeze)\
  \ does not match\n  PR06 editable or local path          PR13 line pip cannot parse\n\
  \  PR07 incomplete hash-checking mode  PR14 dev/test tool in runtime requirements\n\
  \nSpecifiers follow PEP 440 (==, !=, <=, >=, <, >, ~=, ===, ==X.*), names PEP 503\
  \ normalisation,\nmarkers PEP 508 (evaluated with --python / --platform, otherwise\
  \ each marker set is checked as its\nown environment).\n\nUsage:\n  python3 req_check.py\
  \ requirements.txt [more.txt ...] [--mode app|lib] [--installed freeze.txt]\n  \
  \                     [--python 3.11] [--platform linux] [--json]\n  python3 req_check.py\
  \ --self-test\nExit codes: 0 = no high findings, 1 = high findings, 2 = file missing\
  \ or unreadable.\n\"\"\"\nimport argparse\nimport json\nimport os\nimport re\nimport\
  \ sys\nfrom collections import OrderedDict, defaultdict\n\n# -----------------------------------------------------------------------------\
  \ versions (PEP 440)\nVERSION_RE = re.compile(r\"\"\"^\\s*v?(?:(?P<epoch>\\d+)!)?(?P<release>\\\
  d+(?:\\.\\d+)*)\n    (?:[-_.]?(?P<pre_l>a|alpha|b|beta|c|rc|pre|preview)[-_.]?(?P<pre_n>\\\
  d*))?\n    (?:-(?P<post_n1>\\d+)|[-_.]?(?P<post_l>post|rev|r)[-_.]?(?P<post_n2>\\\
  d*))?\n    (?:[-_.]?(?P<dev_l>dev)[-_.]?(?P<dev_n>\\d*))?\n    (?:\\+(?P<local>[a-z0-9]+(?:[-_.][a-z0-9]+)*))?\\\
  s*$\"\"\", re.I | re.X)\nPRE_RANK = {\"a\": 0, \"alpha\": 0, \"b\": 1, \"beta\"\
  : 1, \"c\": 2, \"rc\": 2, \"pre\": 2, \"preview\": 2}\nINF = float(\"inf\")\n\n\n\
  class Version:\n    def __init__(self, s):\n        m = VERSION_RE.match(s)\n  \
