  \ does not \"\n                    \"match what CI builds\" % (p[\"name\"], ver,\
  \ \",\".join(map(repr, bad))))\n\n    order = {\"high\": 0, \"medium\": 1, \"low\"\
  : 2, \"info\": 3}\n    findings.sort(key=lambda f: (order[f[\"severity\"]], f[\"\
  code\"], f[\"where\"]))\n    counts = {k: sum(f[\"severity\"] == k for f in findings)\
  \ for k in order}\n    pinned = sum(1 for p in packages if re.search(r\"(^|,)===?[^=,*]+(,|$)\"\
  , p[\"specs\"]) and \"*\" not in p[\"specs\"])\n    return {\"files\": [show(p)\
