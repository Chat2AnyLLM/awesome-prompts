  \ and decl:\n            sev, why = DEPRECATED[key]\n            add(sev, \"PR11\"\
  , decl[0].src, \"%s %s\" % (decl[0].name, why))\n        packages.append({\"name\"\
  : rs[0].name, \"key\": key,\n                         \"specs\": \",\".join(sorted({repr(s)\
  \ for s in all_specs})) or (\"url\" if any(r.url for r in rs) else \"any\"),\n \
