  \n#!/usr/bin/env python3\n\"\"\"Disk capacity runway forecaster (Python 3 standard\
  \ library only).\n\nInput: CSV with a header row and columns\n  timestamp,volume,used_gb,size_gb\n\
  timestamp is ISO 8601 (\"2026-10-01T00:00\", \"2026-10-01 06:00\" or a date); one\
  \ row per sample,\nany order, several volumes in one file. size_gb may change (a\
  \ resize); the latest value is used.\n\nModel per volume:\n  - growth rate = least-squares\
  \ slope of used_gb over time (GB/day), plus R^2 for fit quality;\n    one-off steps\
  \ larger than 5% of the size are kept in current usage but removed from the trend\n\
  \  - recent rate = slope over the last 7 days of samples (or the last third if shorter)\n\
  \  - runway to 80/90/95/100% full = (threshold x size - used now) / max(rate, recent\
  \ rate),\n    counted from the LAST sample (not from today), so results are reproducible\n\
  \  - suggested size: smallest whole 10 GB step that keeps the volume under 80% for\n\
  \    --horizon days (default 90) at the worse of the two rates\nStatus / findings\
  \ (severity):\n  CRITICAL FULL_SOON       100% within 7 days, or already >= 95%\
  \ used\n  HIGH     RUNWAY_SHORT    90% within 14 days\n  MEDIUM   RUNWAY_WATCH \
  \   80% within 30 days\n  MEDIUM   ACCELERATING    recent rate > 1.5x the overall\
  \ rate (and > 0.1 GB/day)\n  MEDIUM   SUDDEN_JUMP     one step grew by more than\
  \ 5% of the volume size\n  LOW      NOISY_TREND     R^2 < 0.5: usage swings (log\
  \ rotation, temp files); trust less\n  LOW      SHRINKING       usage is falling;\
  \ no runway\n  LOW      FEW_SAMPLES     fewer than 4 samples or under 2 days of\
  \ data\nUsage:\n  python3 disk_runway.py usage.csv\n  python3 disk_runway.py usage.csv\
  \ --horizon 180 --json\n  python3 disk_runway.py --self-test\nExit code: 0 no CRITICAL/HIGH,\
  \ 1 CRITICAL or HIGH findings, 2 bad input.\n\"\"\"\nimport argparse\nimport csv\n\
  import datetime as dt\nimport io\nimport json\nimport math\nimport sys\n\nTHRESHOLDS\
  \ = (0.8, 0.9, 0.95, 1.0)\n\n\nclass DataError(ValueError):\n    pass\n\n\ndef parse_time(s):\n\
  \    s = s.strip().replace(\"Z\", \"+00:00\")\n    try:\n        t = dt.datetime.fromisoformat(s)\n\
  \    except ValueError:\n        raise DataError(f\"bad timestamp {s!r}\")\n   \
  \ return t.replace(tzinfo=None) if t.tzinfo is None else t.astimezone(dt.timezone.utc).replace(tzinfo=None)\n\
  \n\ndef read_rows(text):\n    rd = csv.DictReader(io.StringIO(text))\n    need =\
  \ {\"timestamp\", \"volume\", \"used_gb\", \"size_gb\"}\n    if not rd.fieldnames\
  \ or not need <= {f.strip() for f in rd.fieldnames}:\n        raise DataError(f\"\
  CSV header must contain {', '.join(sorted(need))}\")\n    vols = {}\n    for n,\
  \ row in enumerate(rd, start=2):\n        row = {k.strip(): (v or \"\").strip()\
  \ for k, v in row.items() if k}\n        if not any(row.values()):\n           \
  \ continue\n        try:\n            used, size = float(row[\"used_gb\"]), float(row[\"\
  size_gb\"])\n        except ValueError:\n            raise DataError(f\"line {n}:\
  \ used_gb and size_gb must be numbers\")\n        if size <= 0 or used < 0:\n  \
  \          raise DataError(f\"line {n}: size_gb must be > 0 and used_gb >= 0\")\n\
  \        vols.setdefault(row[\"volume\"] or \"(unnamed)\", []).append((parse_time(row[\"\
  timestamp\"]), used, size))\n    if not vols:\n        raise DataError(\"no data\
  \ rows\")\n    return {k: sorted(v) for k, v in vols.items()}\n\n\ndef slope(points):\n\
  \    \"\"\"points: [(days, value)] -> (slope per day, r2)\"\"\"\n    n = len(points)\n\
  \    if n < 2:\n        return 0.0, 0.0\n    mx = sum(p[0] for p in points) / n\n\
  \    my = sum(p[1] for p in points) / n\n    sxx = sum((p[0] - mx) ** 2 for p in\
  \ points)\n    if sxx == 0:\n        return 0.0, 0.0\n    sxy = sum((p[0] - mx)\
  \ * (p[1] - my) for p in points)\n    b = sxy / sxx\n    syy = sum((p[1] - my) **\
  \ 2 for p in points)\n    r2 = 1.0 if syy == 0 else (sxy * sxy) / (sxx * syy)\n\
  \    return b, r2\n\n\ndef analyze(samples, horizon=90):\n    t0 = samples[0][0]\n\
  \    last_t, used, size = samples[-1]\n    # one-off steps (> 5% of size in one\
  \ sample) are removed from the trend, not extrapolated\n    steps = [samples[i][1]\
  \ - samples[i - 1][1] for i in range(1, len(samples))]\n    normal = sorted(x for\
  \ x in steps if x <= 0.05 * size)\n    typical = normal[len(normal) // 2] if normal\
  \ else 0.0\n    shift, pts = 0.0, []\n    for i, (t, u, _) in enumerate(samples):\n\
  \        if i and steps[i - 1] > 0.05 * size:\n            shift += steps[i - 1]\
  \ - typical\n        pts.append(((t - t0).total_seconds() / 86400, u - shift))\n\
  \    span = pts[-1][0]\n    rate, r2 = slope(pts)\n    cut = pts[-1][0] - 7 if span\
  \ >= 14 else pts[-1][0] - span / 3\n    recent_pts = [p for p in pts if p[0] >=\
  \ cut]\n    recent, _ = slope(recent_pts) if len(recent_pts) >= 2 else (rate, 0)\n\
  \    worst = max(rate, recent)\n    pct = used / size\n    runway = {}\n    for\
  \ th in THRESHOLDS:\n        left = th * size - used\n        if left <= 0:\n  \
  \          runway[th] = (0.0, last_t)\n        elif worst > 1e-9:\n            d\
  \ = left / worst\n            runway[th] = (d, last_t + dt.timedelta(days=d))\n\
  \        else:\n            runway[th] = (None, None)\n    need = used + max(worst,\
  \ 0) * horizon\n    suggest = max(size, math.ceil(need / 0.8 / 10) * 10)\n    findings\
  \ = []\n\n    def f(sev, code, msg):\n        findings.append({\"severity\": sev,\
  \ \"code\": code, \"message\": msg})\n\n    d100, d90, d80 = runway[1.0][0], runway[0.9][0],\
  \ runway[0.8][0]\n    if pct >= 0.95 or (d100 is not None and d100 <= 7):\n    \
  \    f(\"CRITICAL\", \"FULL_SOON\", f\"{pct:.0%} used; full in {fmt_days(d100)}\"\
  )\n    elif d90 is not None and d90 <= 14:\n        f(\"HIGH\", \"RUNWAY_SHORT\"\
  , f\"90% in {fmt_days(d90)}\")\n    elif d80 is not None and d80 <= 30:\n      \
  \  f(\"MEDIUM\", \"RUNWAY_WATCH\", f\"80% in {fmt_days(d80)}\")\n    if rate > 0\
  \ and recent > 1.5 * rate and recent > 0.1:\n        f(\"MEDIUM\", \"ACCELERATING\"\
  , f\"last-week rate {recent:.2f} GB/day vs overall {rate:.2f} GB/day\")\n    jumps\
  \ = [(samples[i][0], samples[i][1] - samples[i - 1][1]) for i in range(1, len(samples))]\n\
  \    big = [j for j in jumps if j[1] > 0.05 * size]\n    if big:\n        t, g =\
  \ max(big, key=lambda j: j[1])\n        f(\"MEDIUM\", \"SUDDEN_JUMP\", f\"+{g:.1f}\
  \ GB in one step at {t:%Y-%m-%d %H:%M} (backup, dump, log burst?)\")\n    if len(pts)\
  \ >= 4 and r2 < 0.5 and worst > 0:\n        f(\"LOW\", \"NOISY_TREND\", f\"R^2 {r2:.2f};\
  \ usage swings, so treat the runway as rough\")\n    if worst < 0:\n        f(\"\
  LOW\", \"SHRINKING\", f\"usage falling {rate:.2f} GB/day\")\n    if len(pts) < 4\
  \ or span < 2:\n        f(\"LOW\", \"FEW_SAMPLES\", f\"{len(pts)} samples over {span:.1f}\
  \ days; collect more data\")\n    rank = {\"CRITICAL\": 0, \"HIGH\": 1, \"MEDIUM\"\
  : 2, \"LOW\": 3}\n    findings.sort(key=lambda x: rank[x[\"severity\"]])\n    return\
  \ {\"last_sample\": last_t.strftime(\"%Y-%m-%d %H:%M\"), \"used_gb\": round(used,\
  \ 2), \"size_gb\": size,\n            \"used_pct\": round(pct * 100, 1), \"rate_gb_day\"\
  : round(rate, 3), \"recent_rate_gb_day\": round(recent, 3),\n            \"r2\"\
  : round(r2, 3), \"samples\": len(pts), \"span_days\": round(span, 2),\n        \
  \    \"runway\": {f\"{int(th * 100)}%\": {\"days\": None if d is None else round(d,\
  \ 1),\n                                             \"date\": None if t is None\
  \ else t.strftime(\"%Y-%m-%d\")}\n                       for th, (d, t) in runway.items()},\n\
  \            \"suggested_size_gb\": suggest, \"horizon_days\": horizon, \"findings\"\
  : findings,\n            \"status\": findings[0][\"severity\"] if findings and findings[0][\"\
  severity\"] in (\"CRITICAL\", \"HIGH\", \"MEDIUM\") else \"OK\"}\n\n\ndef fmt_days(d):\n\
  \    if d is None:\n        return \"never at current rate\"\n    if d <= 0:\n \
  \       return \"already\"\n    if d < 1:\n        return f\"{d * 24:.0f} h\"\n\
  \    return f\"{d:.1f} days\"\n\n\ndef report(res, horizon):\n    out = [\"# Disk\
  \ runway report\", \"\", f\"Runway uses the worse of the overall and last-week growth\
  \ rate; suggested size keeps usage under 80% for {horizon} days.\", \"\",\n    \
  \       \"| Volume | Status | Used | Size | Growth GB/day (overall / recent) | 80%\
  \ | 90% | 100% | Suggested size |\",\n           \"|---|---|---|---|---|---|---|---|---|\"\
  ]\n    order = {\"CRITICAL\": 0, \"HIGH\": 1, \"MEDIUM\": 2, \"OK\": 3}\n    for\
  \ name, r in sorted(res.items(), key=lambda kv: (order[kv[1][\"status\"]], kv[0])):\n\
  \        def cell(k):\n            x = r[\"runway\"][k]\n            if x[\"days\"\
  ] is None:\n                return \"never\"\n            return \"now\" if x[\"\
  days\"] == 0 else f\"{x['days']} d ({x['date']})\"\n        out.append(f\"| {name}\
  \ | {r['status']} | {r['used_gb']:g} GB ({r['used_pct']}%) | {r['size_gb']:g} GB\
  \ | \"\n                   f\"{r['rate_gb_day']} / {r['recent_rate_gb_day']} | {cell('80%')}\
  \ | {cell('90%')} | {cell('100%')} | \"\n                   f\"{r['suggested_size_gb']:g}\
  \ GB |\")\n    out += [\"\", \"## Findings\"]\n    any_f = False\n    for name,\
  \ r in sorted(res.items(), key=lambda kv: (order[kv[1][\"status\"]], kv[0])):\n\
  \        for x in r[\"findings\"]:\n            any_f = True\n            out.append(f\"\
  - **{x['severity']} {x['code']}** ({name}): {x['message']}\")\n    if not any_f:\n\
  \        out.append(\"- none\")\n    out += [\"\", \"Last samples: \" + \", \".join(f\"\
  {n} {r['last_sample']} ({r['samples']} samples, {r['span_days']} days, R^2 {r['r2']})\"\
  \ for n, r in sorted(res.items()))]\n    return \"\\n\".join(out) + \"\\n\"\n\n\n\
  def run(text, horizon=90):\n    if horizon <= 0:\n        raise DataError(\"horizon\
  \ must be > 0\")\n    return {name: analyze(s, horizon) for name, s in read_rows(text).items()}\n\
  \n\ndef self_test():\n    cases = []\n\n    def ok(name, cond):\n        cases.append(bool(cond))\n\
  \        print((\"PASS \" if cond else \"FAIL \") + name)\n\n    b, r2 = slope([(0,\
  \ 10), (1, 12), (2, 14)])\n    ok(\"slope 2/day exact fit\", abs(b - 2) < 1e-9 and\
  \ abs(r2 - 1) < 1e-9)\n    ok(\"flat slope 0\", slope([(0, 5), (1, 5), (2, 5)])[0]\
  \ == 0)\n    hdr = \"timestamp,volume,used_gb,size_gb\\n\"\n    lin = hdr + \"\"\
  .join(f\"2026-10-{d:02d},v,{100 + 2 * d},500\\n\" for d in range(1, 15))\n    r\
  \ = run(lin)[\"v\"]\n    ok(\"rate 2 GB/day\", abs(r[\"rate_gb_day\"] - 2) < 1e-6)\n\
  \    ok(\"80% runway (400-128)/2 = 136 d\", r[\"runway\"][\"80%\"][\"days\"] ==\
  \ 136.0)\n    ok(\"runway date from last sample\", r[\"runway\"][\"100%\"][\"date\"\
  ] == \"2027-04-18\")\n    ok(\"healthy volume status OK\", r[\"status\"] == \"OK\"\
  \ and r[\"findings\"] == [])\n    ok(\"suggested size keeps 500\", r[\"suggested_size_gb\"\
  ] == 500)\n    r = run(lin, horizon=180)[\"v\"]\n    ok(\"180 d horizon suggests\
  \ 610\", r[\"suggested_size_gb\"] == 610)\n    full = hdr + \"\".join(f\"2026-10-{d:02d},v,{80\
  \ + 3 * d},100\\n\" for d in range(1, 6))\n    r = run(full)[\"v\"]\n    ok(\"95%\
  \ used is CRITICAL\", r[\"status\"] == \"CRITICAL\" and r[\"findings\"][0][\"code\"\
  ] == \"FULL_SOON\")\n    ok(\"past threshold runway is 0\", r[\"runway\"][\"90%\"\
  ][\"days\"] == 0)\n    short = hdr + \"\".join(f\"2026-10-{d:02d},v,{50 + 3 * d},100\\\
  n\" for d in range(1, 8))\n    r = run(short)[\"v\"]\n    ok(\"90% in ~6 days is\
  \ HIGH\", r[\"status\"] == \"HIGH\")\n    watch = hdr + \"\".join(f\"2026-10-{d:02d},v,{40\
  \ + d},100\\n\" for d in range(1, 8))\n    ok(\"80% in 33 d is OK, 80% in 26 d is\
  \ MEDIUM\", run(watch)[\"v\"][\"status\"] == \"OK\" and\n       run(hdr + \"\".join(f\"\
  2026-10-{d:02d},v,{47 + d},100\\n\" for d in range(1, 8)))[\"v\"][\"status\"] ==\
  \ \"MEDIUM\")\n    acc = hdr + \"\".join(f\"2026-10-{d:02d},v,{100 + (d if d <=\
  \ 14 else 14 + 5 * (d - 14))},1000\\n\" for d in range(1, 22))\n    r = run(acc)[\"\
  v\"]\n    ok(\"accelerating flagged\", any(x[\"code\"] == \"ACCELERATING\" for x\
  \ in r[\"findings\"]))\n    ok(\"recent rate used for runway\", r[\"recent_rate_gb_day\"\
  ] > r[\"rate_gb_day\"])\n    jump = hdr + \"2026-10-01,v,100,500\\n2026-10-02,v,101,500\\\
  n2026-10-03,v,140,500\\n2026-10-04,v,141,500\\n\"\n    r = run(jump)[\"v\"]\n  \
  \  ok(\"sudden jump flagged\", any(x[\"code\"] == \"SUDDEN_JUMP\" for x in r[\"\
  findings\"]))\n    ok(\"jump removed from trend (1 GB/day)\", abs(r[\"rate_gb_day\"\
  ] - 1) < 1e-6 and r[\"used_gb\"] == 141)\n    noisy = hdr + \"\".join(f\"2026-10-{d:02d},v,{100\
  \ + (8 if d % 2 else 0) + 0.3 * d:.1f},500\\n\" for d in range(1, 21))\n    ok(\"\
  noisy trend flagged\", any(x[\"code\"] == \"NOISY_TREND\" for x in run(noisy)[\"\
  v\"][\"findings\"]))\n    shr = hdr + \"\".join(f\"2026-10-{d:02d},v,{200 - 3 *\
  \ d},500\\n\" for d in range(1, 8))\n    r = run(shr)[\"v\"]\n    ok(\"shrinking\
  \ flagged and runway never\", any(x[\"code\"] == \"SHRINKING\" for x in r[\"findings\"\
  ]) and r[\"runway\"][\"100%\"][\"days\"] is None)\n    few = hdr + \"2026-10-01T00:00,v,10,100\\\
  n2026-10-01T12:00,v,11,100\\n\"\n    ok(\"few samples flagged\", any(x[\"code\"\
  ] == \"FEW_SAMPLES\" for x in run(few)[\"v\"][\"findings\"]))\n    multi = hdr +\
  \ \"2026-10-02,b,5,100\\n2026-10-01,a,1,100\\n2026-10-01,b,4,100\\n2026-10-02,a,1,100\\\
  n\"\n    r = run(multi)\n    ok(\"multiple volumes, unsorted rows\", set(r) == {\"\
  a\", \"b\"} and r[\"b\"][\"rate_gb_day\"] == 1)\n    ok(\"resize uses latest size\"\
  , run(hdr + \"2026-10-01,v,50,100\\n2026-10-02,v,52,200\\n\")[\"v\"][\"size_gb\"\
  ] == 200)\n    ok(\"fmt_days hours\", fmt_days(0.5) == \"12 h\")\n    for bad, label\
  \ in ((\"a,b\\n1,2\\n\", \"missing columns\"), (hdr, \"no rows\"), (hdr + \"x,v,1,10\\\
  n\", \"bad timestamp\"),\n                       (hdr + \"2026-10-01,v,abc,10\\\
  n\", \"bad number\"), (hdr + \"2026-10-01,v,1,0\\n\", \"zero size\")):\n       \
  \ try:\n            run(bad)\n            ok(label + \" rejected\", False)\n   \
  \     except DataError:\n            ok(label + \" rejected\", True)\n    print(f\"\
  {sum(cases)}/{len(cases)} passed\")\n    return 0 if all(cases) else 1\n\n\ndef\
  \ main(argv=None):\n    ap = argparse.ArgumentParser(description=\"Forecast when\
  \ disks fill up from usage samples.\")\n    ap.add_argument(\"file\", nargs=\"?\"\
  , help=\"CSV: timestamp,volume,used_gb,size_gb\")\n    ap.add_argument(\"--horizon\"\
  , type=int, default=90, help=\"days of runway the suggested size must cover (default\
  \ 90)\")\n    ap.add_argument(\"--json\", action=\"store_true\")\n    ap.add_argument(\"\
  --self-test\", action=\"store_true\")\n    a = ap.parse_args(argv)\n    if a.self_test:\n\
  \        return self_test()\n    if not a.file:\n        ap.error(\"give a CSV file\
  \ or --self-test\")\n    try:\n        res = run(open(a.file, encoding=\"utf-8\"\
  ).read(), a.horizon)\n    except (OSError, DataError) as e:\n        print(f\"error:\
  \ {e}\", file=sys.stderr)\n        return 2\n    print(json.dumps(res, indent=2)\
  \ if a.json else report(res, a.horizon), end=\"\\n\" if a.json else \"\")\n    return\
  \ 1 if any(r[\"status\"] in (\"CRITICAL\", \"HIGH\") for r in res.values()) else\
  \ 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())"
