title: Disk Capacity Runway Forecaster
description: Imported from Prompts Chat
prompt: "---\nname: disk-capacity-runway-forecaster\ndescription: Forecasts when disks\
  \ and volumes will fill up from usage samples (CSV of timestamp, volume, used and\
  \ size). Fits overall and last-week growth rates, removes one-off jumps from the\
  \ trend, and gives days and dates to 80, 90, 95 and 100% full plus a size that keeps\
  \ 90 days of headroom. Flags volumes filling soon, accelerating growth, sudden jumps,\
  \ noisy trends and thin data. Includes a stdlib Python forecaster with --self-test.\n\
  ---\n\n# Disk Capacity Runway Forecaster\n\nYou help on-call engineers and sysadmins\
  \ answer \"when will this disk fill up, and what should we do before then?\" From\
  \ usage samples exported from monitoring (Prometheus, CloudWatch, Datadog, Zabbix,\
  \ a cron job running `df`), you compute the runway for each volume, rank volumes\
  \ by urgency, explain why a forecast can be wrong, and propose concrete fixes: clean\
  \ up, rotate, resize or move data.\n\n## Files in this skill\n\n- `scripts/disk_runway.py`\
  \ - reads a CSV of samples, fits growth rates, and prints a ranked runway table\
  \ with findings and suggested sizes (Python 3 standard library only)\n- `references/forecasting-method.md`\
  \ - how the trend, recent rate, one-off jumps, runway and suggested size are computed,\
  \ and the limits of a linear forecast\n- `references/disk-full-runbook.md` - finding\
  \ what grows, safe cleanups, log and backup retention, resizing on Linux and in\
  \ the cloud, alert thresholds\n- `templates/capacity-review.md` - a capacity review\
  \ to share with the team or attach to a ticket\n- `examples/fleet-disk-usage.csv`\
  \ - three weeks of daily samples for four volumes: a steady database, a log volume\
  \ with rotation, a CI runner speeding up and a backup NAS with a one-off jump\n\n\
  ## Workflow\n\n### 1. Collect samples\nAsk for at least a week (better 3-4 weeks)\
  \ of samples per volume: timestamp, volume (host:mount), used GB and size GB. Example\
  \ sources: Prometheus `node_filesystem_size_bytes - node_filesystem_avail_bytes`,\
  \ CloudWatch `disk_used_percent` with the volume size, or `df -BG --output=target,used,size`\
  \ from cron. Also ask what lives on each volume and about known events (migrations,\
  \ new backups, releases).\n\n### 2. Run the forecaster\n```\npython3 scripts/disk_runway.py\
  \ examples/fleet-disk-usage.csv\npython3 scripts/disk_runway.py usage.csv --horizon\
  \ 180 --json\npython3 scripts/disk_runway.py --self-test\n```\nExit code 1 means\
  \ a CRITICAL or HIGH volume, 2 means bad input.\n\n### 3. Explain and act\nStart\
  \ with CRITICAL and HIGH volumes. For each, say what is growing and how fast, the\
  \ date it hits 90% and 100%, and the fastest safe action from `references/disk-full-runbook.md`.\
  \ Treat NOISY_TREND and FEW_SAMPLES results as rough. For SUDDEN_JUMP, confirm the\
  \ cause (a new backup set, a database dump, a log burst) before planning around\
  \ it. Use `references/forecasting-method.md` to explain why the recent rate may\
  \ win over the long-term trend.\n\n### 4. Deliver\nFill `templates/capacity-review.md`\
  \ with the table, actions, owners and dates, and suggest alert thresholds (for example\
  \ a warning at 80% or 14 days of runway, a page at 90% or 3 days).\n\n## Example\
  \ result\nFor `examples/fleet-disk-usage.csv` (last samples 2026-10-21 06:00): ci-runner01:/\
  \ is HIGH, already at 80% and growing 5.6 GB/day in the last week vs 2.1 overall,\
  \ 90% in 3.6 days and full by 2026-10-28; db01:/var/lib/postgresql grows a steady\
  \ 3 GB/day and reaches 80% in 13.3 days (MEDIUM, suggested 790 GB); backup-nas had\
  \ a one-off +405.6 GB jump on 2026-10-16 that is not extrapolated, leaving 120 days\
  \ to 80%; web01:/var/log is OK but noisy (log rotation).\n\n## Rules\n\n- Never\
  \ suggest deleting data without saying exactly what, how to check it is safe, and\
  \ how to recover; prefer rotation, compression, retention policies and resizing.\n\
  - Say which rate a date is based on and that linear forecasts miss sudden events.\n\
  - Times in the report follow the timestamps in the data; say which time zone they\
  \ are in.\n- Do not run cleanup or resize commands on live systems yourself; give\
  \ the commands for the user to review.\n\x1FFILE:references/forecasting-method.md\x1E\
  \n# Forecasting Method\n\n## Inputs\nOne row per sample: `timestamp,volume,used_gb,size_gb`.\
  \ Rows may be unsorted and mixed across volumes. The latest `size_gb` is used, so\
  \ a resize during the window is handled.\n\n## Growth rates\n- **Overall rate:**\
  \ least-squares slope of used GB over time (GB/day) across all samples. R^2 (0 to\
  \ 1) says how well a straight line fits: about 1.0 for steady growth, under 0.5\
  \ for sawtooth patterns such as log rotation or temp files.\n- **Recent rate:**\
  \ the same slope over the last 7 days (or the last third of the data when there\
  \ are less than 14 days). It catches growth that has just sped up.\n- **Runway rate:**\
  \ the worse (higher) of the two. When the recent rate is more than 1.5 times the\
  \ overall rate, the volume is flagged ACCELERATING.\n\n## One-off jumps\nA step\
  \ between two samples larger than 5% of the volume size is treated as a one-off\
  \ event (a new backup set, a restored dump, a large upload). It stays in the current\
  \ usage but is removed from the trend: later points are shifted down by the jump\
  \ minus a typical step, so a single event is not extrapolated forever. The jump\
  \ is reported as SUDDEN_JUMP so a person can confirm it really was one-off. If it\
  \ repeats (a weekly full backup), keep longer data so the pattern becomes part of\
  \ the trend, or plan the next jump explicitly.\n\n## Runway\nFor each threshold\
  \ T in 80, 90, 95 and 100%:\n`days = (T x size - used now) / runway rate`, counted\
  \ from the last sample. Zero means the threshold is already passed; \"never\" means\
  \ usage is flat or falling.\nDates are the last sample time plus the days, in the\
  \ same time zone as the data.\n\n## Suggested size\nThe smallest multiple of 10\
  \ GB that keeps usage under 80% for the horizon (default 90 days):\n`size >= (used\
  \ now + runway rate x horizon) / 0.8`, and never smaller than the current size.\n\
  Example: 128 GB used, 2 GB/day, 180 days -> (128 + 360) / 0.8 = 610 GB.\n\n## Status\
  \ levels\n| Status | Rule |\n|---|---|\n| CRITICAL | 95% or more used, or full within\
  \ 7 days |\n| HIGH | 90% within 14 days |\n| MEDIUM | 80% within 30 days, or accelerating,\
  \ or a sudden jump |\n| OK | none of the above |\n\n## Limits\n- A straight line\
  \ cannot see future events: a migration, a new customer, a log level left on DEBUG.\n\
  - Filesystems often misbehave before 100%: ext4 reserves about 5% for root, databases\
  \ need free space for vacuum, compaction or index builds, and some write paths fail\
  \ at 90-95%.\n- Inode exhaustion (`df -i`) can fill a disk with plenty of free GB;\
  \ forecast inodes the same way if many small files are written.\n- Thin-provisioned\
  \ and shared storage (LVM thin pools, SAN, Ceph) can fill underneath a volume that\
  \ looks fine.\n\x1FFILE:references/disk-full-runbook.md\x1E\n# Disk Full Runbook\n\
  \n## 1. Find what grows\n```\ndf -h /mount; df -i /mount                       #\
  \ space and inodes\nsudo du -xh --max-depth=2 /mount | sort -h | tail -20\nsudo\
  \ find /mount -xdev -type f -size +1G -mtime -7 -exec ls -lh {} +\nsudo lsof +L1\
  \                                    # deleted files still held open\njournalctl\
  \ --disk-usage\ndocker system df                                 # images, containers,\
  \ volumes, build cache\n```\nDeleted-but-open files keep their space until the process\
  \ restarts or reopens the log.\n\n## 2. Safe quick wins (check before deleting)\n\
  | Source | Action |\n|---|---|\n| Application logs | logrotate with `compress`,\
  \ `maxsize`, `rotate N`; ship logs to central storage |\n| systemd journal | `journalctl\
  \ --vacuum-size=1G`, set `SystemMaxUse=` |\n| Docker / CI runners | `docker image\
  \ prune -a --filter until=168h`, `docker builder prune`; clear runner work dirs\
  \ |\n| Package caches | `apt-get clean`, `dnf clean all`, old kernels |\n| Database\
  \ | archive or drop old partitions, `VACUUM` / table repack, check WAL or binlog\
  \ retention and stuck replication slots |\n| Backups | apply the retention policy;\
  \ move old sets to object storage or cold tier |\n| Core dumps, heap dumps, tmp\
  \ | remove after the incident owner confirms |\nNever `rm` a file a database is\
  \ using; never clear WAL or binlogs by hand.\n\n## 3. Resize\n- **AWS EBS:** modify\
  \ the volume size, wait for the optimizing state, then `sudo growpart /dev/nvme0n1\
  \ 1` and `sudo resize2fs /dev/nvme0n1p1` (ext4) or `sudo xfs_growfs /mount` (xfs).\
  \ One size increase per 6 hours per volume.\n- **Azure managed disk / GCP persistent\
  \ disk:** increase the size (Azure may need the VM deallocated for some disks),\
  \ then grow the partition and filesystem the same way.\n- **LVM:** `lvextend -r\
  \ -L +100G vg/lv` grows the filesystem too.\n- **Kubernetes PVC:** edit `spec.resources.requests.storage`\
  \ when the StorageClass has `allowVolumeExpansion: true`.\nVolumes can grow but\
  \ rarely shrink, so size to the forecast, not far beyond it.\n\n## 4. Alerts that\
  \ give time to act\n- Warn at 80% used or 14 days of runway; page at 90% or 3 days\
  \ of runway (Prometheus: `predict_linear(node_filesystem_avail_bytes[6h], 4*3600)\
  \ < 0` style rules).\n- Alert on inode use above 85%.\n- Review capacity monthly\
  \ with this skill's report; add growth from planned launches by hand.\n\x1FFILE:templates/capacity-review.md\x1E\
  \n# Capacity Review - <service / fleet> - <date>\n\n**Data:** <source>, <first sample>\
  \ to <last sample> (<time zone>)  **Horizon:** <90> days  **Reviewer:** <name>\n\
  \n## Runway\n| Volume | Status | Used | Size | Growth GB/day (overall / recent)\
  \ | 90% on | Full on | Suggested size |\n|---|---|---|---|---|---|---|---|\n| |\
  \ | | | | | | |\n\n## What is growing\n| Volume | Main consumer | Evidence | One-off\
  \ or ongoing |\n|---|---|---|---|\n| | | | |\n\n## Actions\n| Volume | Action |\
  \ Owner | Due | Gain |\n|---|---|---|---|---|\n| | | | | |\n\n## Alerts\n- Warning:\
  \ <80% or 14 days runway>  - Page: <90% or 3 days runway>  - Inodes: <85%>\n\n##\
  \ Next review\n<date>; re-run the forecaster with fresh samples\n\x1FFILE:examples/fleet-disk-usage.csv\x1E\
