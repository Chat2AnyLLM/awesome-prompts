title: 'Ancient Egyptians Casually Use Modern Tech: Six-Vignette Comedy Montage (20s
  Video)'
description: Imported from Prompts Chat
prompt: '20 seconds, horizontal 16:9. A photorealistic live-action comedy montage
  consisting of exactly SIX separate vignettes. Ancient Egyptians casually use modern
  technology as if it has always existed.


  Six shots total, in the exact order below. Each vignette is ONE continuous shot,
  with hard cuts only at 00:03, 00:06, 00:09, 00:12 and 00:16. No transitions or additional
  shots. Begin each scene with the characters already positioned for its action. Show
  one clear gag, then cut after its payoff. Normal real-time movement, no slow motion.


  CHARACTERS

  Egyptian men: adults aged 25-45, olive-to-brown skin, dark eyes with black kohl,
  shaved heads or blue-and-gold striped nemes headdresses. Bare chests, white linen
  knee-length shendyt kilts and brown leather sandals. Real human actors with natural
  proportions.


  Queen, scene 3 only: approximately 28, olive skin, dark almond-shaped eyes, black
  shoulder-length bob with a blunt fringe, dramatic black eyeliner, turquoise eyeshadow.
  Thin gold diadem with a small upright cobra, broad gold-and-lapis collar, gold upper-arm
  cuffs and gold sandals. Fitted ankle-length white pleated linen dress. Calm regal
  expression. Both hands stay on the jet ski handlebars.


  Market woman, scene 4 only: approximately 35, long thin black braids reaching her
  shoulder blades, kohl eyeliner, plain ankle-length white linen dress, leather sandals.
  Turquoise-and-gold beaded collar with a gold scarab pendant hanging at upper-chest
  height. Visibly different from the queen.


  Mummy, scene 6 only: adult human figure completely wrapped in aged beige-grey linen
  bandages, with small frayed ends and dark gaps at the eyes. No exposed face.


  All fabric is opaque and securely fitted. Preserve each character''s appearance
  and clothing within their scene.


  SETTING

  Ancient Egypt during its flourishing period. Stone temples, painted columns, palms,
  the Nile, working animals and ancient market stalls. Completed monuments look maintained
  and freshly finished. Scene 2 is an active construction site with unfinished stonework.


  No modern architecture, roads, cables, tourists or modern background clothing.


  Exactly one visible modern device in each scene:

  1. Electric scooter.

  2. Forklift.

  3. Jet ski.

  4. Payment terminal.

  5. Cordless leaf blower.

  6. Smartphone.


  The scarab pendant contains an invisible NFC chip but looks entirely ancient. No
  additional visible modern accessories or devices. All modern devices are unbranded.


  LOOK AND CAMERA

  Realistic cinema-camera footage with restrained handheld documentary character.
  Subtle hand movement, natural motion blur, slight grain, realistic skin pores, sweat,
  linen fibres, weathered wood and stone dust. Prioritize clear readable actions and
  stable object shapes. No deliberate focus hunting during a gag.


  Outdoor scenes share hard midday sunlight, a clear sky, short shadows and natural
  reflected light from sand, stone and water. The market awning creates believable
  shade. Natural colours, restrained contrast, no glossy commercial lighting.


  The tomb is illuminated only by one clay oil lamp and the smartphone while its screen
  is on. Expose the image so the mummy''s final movement remains visible in the lamp
  light.


  Camera operators and filming equipment never appear.


  TIMELINE


  00:00-00:03 | ELECTRIC SCOOTER

  One side three-quarter tracking shot at waist height on a stone-paved avenue lined
  with two rows of ram-headed sphinxes. A temple pylon stands in the distance.


  At the opening, a man wearing a nemes headdress is already riding a matte-black
  electric kick scooter toward screen right. Both feet are on the deck and both hands
  hold the handlebars. The scooter travels at a brisk but controlled speed over closely
  fitted paving stones.


  He overtakes a walking man leading a camel on the right side of the avenue, leaving
  a clear safe gap. The camel turns its head to follow the scooter. The rider stays
  casually serious.


  Keep the scooter wheels and the camel visible during the pass. Linen and headdress
  flaps move naturally in the breeze. Cut immediately after the scooter clears the
  camel.


  00:03-00:06 | FORKLIFT

  One steady medium-wide shot at a pyramid construction site. A half-built pyramid
  rises in the background, with a small group of workers waiting beside slack hauling
  ropes.


  A yellow industrial forklift faces a wooden stone-hauling sledge. A roughly one-metre
  limestone cube rests on two thick wooden support runners on the sledge, leaving
  clear channels beneath the stone.


  At the opening, the forklift is stationary and both forks are already inserted fully
  through these channels beneath the block. A shaved-head Egyptian driver raises the
  block approximately 30 centimetres clear of the supports. The heavy block remains
  level and stable. A small amount of dust falls from its edges.


  Beside the forklift, outside the load''s path, a foreman watches the successful
  lift and makes one short mark on a papyrus scroll with a reed pen.


  Show the lift and the foreman''s reaction in the same composition. Cut after his
  mark. No driving, turning or additional lifting.


  00:06-00:09 | JET SKI

  One wide shot from a low riverbank position, looking across the Nile. Palms and
  the opposite bank form the background, with a distant pyramid on the horizon.


  The queen is already riding a white-and-gold sit-down jet ski from screen left to
  screen right at a brisk speed. She sits securely astride the seat, her dress arranged
  clear of the controls and water intake. Her fitted diadem stays secure; only the
  tips of her bob and the edges of the dress move in the wind.


  A small papyrus-reed fishing boat floats several metres to the side of her route.
  Two fishermen are aboard, one seated and one crouched while holding a fishing net.
  The jet ski passes without contact and continues toward screen right.


  Its nearby trailing wake reaches the boat within the shot. The boat tilts once.
  The crouching fisherman drops backward onto the boat''s low seat and accidentally
  releases the net''s loose edge into the water. The seated fisherman grips the gunwale.


  The queen remains composed and does not look back. Keep the passing jet ski and
  the boat''s reaction readable in the same shot. Cut on the fisherman''s landing;
  the boat may still be rocking.


  00:09-00:12 | CONTACTLESS SCARAB

  One medium shot beneath a linen market awning. Flatbreads, dates, onions and clay
  jars cover a wooden stall. Soft background movement from shoppers and a donkey carrying
  baskets.


  A bald merchant already holds a small black contactless payment terminal near the
  market woman''s upper chest. His other hand already supports two flatbreads.


  The woman lifts her gold scarab pendant a short distance from her chest and touches
  it once to the terminal''s upper contactless reader. The necklace is long enough
  for the movement and does not stretch. The pendant has a concealed NFC chip, with
  no visible modern markings.


  The terminal shows a simple green confirmation light and makes one beep. No readable
  words are needed.


  She releases the pendant, which falls back against her collar. The merchant immediately
  extends the two flatbreads, and she takes them with both hands. Both remain entirely
  matter-of-fact.


  Cut as the bread transfer finishes.


  00:12-00:16 | LEAF BLOWER

  One medium-wide shot in a temple courtyard with painted stone columns.


  A priest wearing a nemes headdress stands to screen left with an orange cordless
  leaf blower. A thin layer of loose dry sand covers the paved ground directly beside
  the paws of a large stone sphinx.


  A second priest is already entering the background to screen right, carrying an
  incense bowl.


  The first priest points the nozzle low and toward screen right. The blower pushes
  the loose surface sand off the paving. A low plume travels approximately two metres
  in the established direction and briefly envelops the passing priest''s upper body.


  The second priest stops. A light dusting remains on his face, shoulders and chest,
  leaving his expression clearly visible. He keeps hold of the incense bowl and gives
  the first priest a long, offended stare. A few grains fall from his brow.


  The first priest notices him, releases the trigger and lowers the nozzle. The motor
  winds down quickly. Quiet courtyard ambience remains audible.


  Cut on their awkward eye contact. No additional blast or repeated reaction.


  00:16-00:20 | MUMMY''S BATTERY

  One continuous elevated medium shot looking diagonally into an open granite sarcophagus.
  A gentle handheld move closer is allowed, without changing the viewing side.


  The mummy is already seated INSIDE the sarcophagus, with its legs extended along
  the interior and its back raised against the head end. This position allows it to
  recline directly backward without climbing or turning.


  One clay oil lamp burns on the floor to the left, close enough to cast warm flickering
  light across the mummy''s upper body and the inner rim. Painted hieroglyphs are
  faintly visible on the chamber wall.


  00:16-00:17.3:

  The mummy scrolls once with a bandaged thumb. Hold the phone at an angle where its
  screen and the mummy''s upper body are both readable. Cold screen light illuminates
  the bandages.


  A simple red battery icon with "1%" appears on the phone screen, accompanied by
  a brief low-battery chime. This is an in-world phone display, not a video overlay.


  00:17.3-00:18.3:

  The mummy pauses, drops its shoulders and gives a tired muffled sigh. It presses
  the phone''s side button once, turning the display off.


  00:18.3-00:19.6:

  Still holding the phone, it reclines backward into the sarcophagus. Its head settles
  naturally against the inner headrest. It places the dark phone flat on its chest
  and rests its hands beside it.


  00:19.6-00:20:

  Brief final hold on the mummy lying motionless, with the dark phone visible on its
  chest in the warm oil-lamp light. The sarcophagus remains open. End.


  AUDIO

  Only diegetic sound synchronized with visible actions. No music, narration, dialogue,
  laugh track or added comedy effects.


  Scene 1: quiet electric motor, wheels over stone, camel grunt and market-distance
  ambience.

  Scene 2: forklift motor and hydraulics, falling grit, faint construction ambience.

  Scene 3: jet ski engine, water spray, wake slapping the reed hull, one brief startled
  fisherman vocalization.

  Scene 4: subdued market chatter without intelligible words, one payment beep, bread
  and fabric movement.

  Scene 5: blower motor and sand hiss, then the motor winding down and quiet courtyard
  ambience.

  Scene 6: faint phone taps, one battery chime, muffled sigh and bandage rustle. Very
  quiet tomb ambience.


  CONTINUITY AND PRIORITIES

  Exactly six vignettes, each shown once, in the specified order. Total duration exactly
  20 seconds.


  Each vignette has one main gag. Prioritize its visible setup, action and reaction
  over background detail. No extra business, repeated attempts or inserted close-ups.


  Maintain spatial positions and movement direction within each shot. Hands retain
  believable contact with controls and props. All vehicles remain supported by the
  appropriate surface. The forklift block remains stable on both forks. The jet ski
  never touches the fishing boat. The blower''s sand follows the nozzle direction.


  The queen and market woman remain two distinct people with different hairstyles
  and jewellery.


  The phone remains in the mummy''s hand until it is placed on the chest. Its screen
  stays dark after the side button is pressed. The oil lamp stays lit, and the sarcophagus
  never closes.


  Photorealistic actors, environments and effects. No cartoon appearance, plastic
  skin, duplicated people, body deformation, teleportation, changing costumes, floating
  props or impossible object intersections.


  No captions, subtitles, logos, watermarks or recording interface. The only required
  readable text is the small "1%" on the smartphone screen.'
