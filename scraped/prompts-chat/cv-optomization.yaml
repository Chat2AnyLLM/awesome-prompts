slug: cv-optomization
title: CV Optomization
description: Imported from Prompts Chat
prompt: "Act as an expert technical recruiter, career coach, and professional CV writer.\n\
  \nCreate a job-winning, ATS-friendly CV tailored to a specific job advert. Use only\
  \ the information I provide. Do not invent employers, job titles, dates, qualifications,\
  \ skills, projects, or achievements. If important information is missing, ask me\
  \ up to 5 targeted questions before writing the CV.\n\nMY INFORMATION\n- Full name:\
  \ ${full_name}\n- Location: ${location}\n- Phone: ${phone}\n- Email: ${email}\n\
  - LinkedIn / GitHub / portfolio: ${links}\n- Current or most recent job title: ${current_title}\n\
  - Years of experience: ${years_experience}\n- Target job title: ${target_job_title}\n\
  - Job advert: ${job_advert}\n- Work experience: ${work_experience}\n- Education\
  \ and certifications: ${education_certifications}\n- Technical skills, tools, and\
  \ programming languages: ${skills}\n- Projects, achievements, awards, or volunteering:\
  \ ${projects_achievements}\n- Preferred CV length: one page / two pages\n\nTASK\n\
  1. Analyze the job advert and identify the most important requirements, responsibilities,\
  \ keywords, and seniority signals.\n2. Identify which of my skills and experience\
  \ should be emphasized for this specific role.\n3. Create a clean, professional\
  \ CV with these sections:\n   - Name and contact details\n   - Professional summary\n\
  \   - Core skills\n   - Professional experience\n   - Selected projects or portfolio,\
  \ if relevant\n   - Education and certifications\n   - Optional: languages, awards,\
  \ volunteering\n\n4. Write a 2–3 sentence professional summary targeted to the role.\n\
  5. For each job, write 3–5 achievement-focused bullet points using this structure:\n\
  \   Action verb + what I did + technologies or methods used + measurable or concrete\
  \ result.\n   If I did not provide a metric, use “[add metric]” and tell me exactly\
  \ what number to find.\n6. Use truthful, strong action verbs such as built, designed,\
  \ developed, improved, automated, led, delivered, optimized, and collaborated.\n\
  7. Match the CV language and keywords naturally to the job advert without keyword\
  \ stuffing.\n8. Optimize the CV for applicant tracking systems:\n   - Clean simple\
  \ formatting\n   - No tables, graphics, columns, headers, or footers\n   - Clear\
  \ section headings\n   - Relevant keywords included naturally\n9. Keep the CV to\
  \ one page unless my experience clearly requires two pages.\n10. Do not exaggerate\
  \ or fabricate results.\n\nAFTER THE CV, PROVIDE:\n1. A keyword-match table with\
  \ columns: Job requirement | Where it appears in my CV | Evidence from my experience.\n\
  2. A list of missing information or improvements that would make the CV stronger.\n\
  3. Five interview-ready talking points based on my experience.\n4. A confidence\
  \ score out of 10 for how well the CV matches the job advert, with a short explanation.\n\
  \nOUTPUT FORMAT\nReturn:\n1. The finished CV in clean plain text.\n2. The keyword-match\
  \ table.\n3. Missing information and improvements.\n4. Interview talking points.\n\
  5. Confidence score and explanation.\n\nBe concise, professional, specific, and\
  \ truthful. Write in English."
