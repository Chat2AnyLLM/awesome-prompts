prompt: "Do not change the girl's facial features, eye shape, eyebrows, nose, or lips.\
  \ Maintain 100% facial resemblance.\n\nAspect ratio: 3:4. Ultra-realistic, high-quality,\
  \ sharp 8K photograph, shot on iPhone 16 Pro Max.\n\nSubject & Framing:\nA three-quarter\
  \ body portrait (from the top of the head to just below the boots). The woman is\
  \ the central subject, sitting on a light gray stone ledge in an elegant autumn\
  \ city park. The composition is vertical, with the model occupying most of the frame\
  \ while the softly blurred background creates depth.\n\nCamera Angle:\nEye-level\
  \ perspective with a slight diagonal composition. The camera is positioned about\
  \ 2–3 meters away using a natural portrait lens look (around 50–85mm). Shallow depth\
  \ of field keeps the face, sweater, and legs sharp while the background melts into\
  \ creamy bokeh.\n\nPose:\nShe sits sideways on the stone ledge with relaxed posture.\
  \ One leg is crossed gracefully over the other, creating an elegant feminine silhouette.\
  \ Her left hand rests naturally beside her on the ledge with slightly curved fingers,\
  \ while the other arm disappears softly into the oversized sweater. Her head is\
  \ tilted downward and slightly to the side as she looks toward her lap instead of\
  \ the camera, giving a candid, unposed feeling.\n\nExpression:\nSoft, calm, introspective\
  \ expression with relaxed lips and half-lowered eyes. The mood feels thoughtful,\
  \ cozy, and quietly romantic rather than smiling.\n\nHair:\n silky  hair with a\
  \ subtle warm shine. The hair is straight with a slight natural bend at the ends.\
  \ A gentle autumn breeze blows several strands across one side of her face, partially\
  \ covering one eye for an effortless cinematic look.\n\nMakeup:\nNatural clean-girl\
  \ makeup.  subtle brown eyeshadow, delicate eyeliner, natural lashes, soft contour,\
  \ and nude pink lips without gloss. \n\nOutfit:\nOversized charcoal-black knitted\
  \ sweater with long sleeves covering part of the hands. Short ivory satin skirt\
  \ finished with delicate floral lace along the hem. White ribbed mid-calf socks.\
  \ Black matte leather knee-high boots with chunky platform soles. Short glossy deep-red\
  \ manicure.\n\nLighting:\nNatural overcast autumn daylight with warm golden undertones.\
  \ The light is soft, diffused, and flattering with no harsh shadows. Gentle highlights\
  \ appear on the hair and legs while maintaining a cozy cinematic atmosphere.\n\n\
  Background:\nAn elegant city park in early autumn. Golden-orange and muted green\
  \ trees, soft bokeh foliage, a blurred wooden bench, and stone architecture remain\
  \ visible but out of focus. The environment feels peaceful, minimal, and luxurious.\n\
  \nColor Palette:\nChocolate brown, charcoal black, ivory white, warm beige stone,\
  \ golden amber, burnt orange, and muted olive green.\n\nMood & Aesthetic:\nQuiet\
  \ luxury, Pinterest aesthetic, cinematic autumn editorial, cozy, feminine, sophisticated,\
  \ candid, emotionally warm, premium lifestyle photography.\n\nNegative prompt:\n\
  No smile, no teeth, no accessories, no handbag, no jewelry, no text, no watermark,\
  \ no extra people, no distorted anatomy, no AI artifacts, no oversaturated colors."
