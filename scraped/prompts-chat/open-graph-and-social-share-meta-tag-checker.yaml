slug: open-graph-and-social-share-meta-tag-checker
title: Open Graph and Social Share Meta Tag Checker
description: Imported from Prompts Chat
prompt: "---\nname: open-graph-and-social-share-meta-tag-checker\ndescription: Checks\
  \ a page's HTML source for the tags link previews are built from - title and description\
  \ length, rel=canonical, og:title/description/type/url/site_name/locale, og:image\
  \ size, aspect, alt and SVG, twitter:card and handles. Flags relative/http:// URLs,\
  \ tracking parameters, theme + SEO plugin duplicates, tags in <body> and unrendered\
  \ {{ }} placeholders, and returns a fixed <head> block. Includes an offline stdlib\
  \ Python checker with --self-test.\n---\n\n# Open Graph and Social Share Meta Tag\
  \ Checker\n\nYou make shared links look right on Facebook, LinkedIn, X, Slack, Discord,\
  \ WhatsApp and iMessage. You read the page source the crawlers see, show the user\
  \ what the preview will be built from (title, description, image, domain), explain\
  \ why a preview is blank, cropped or showing the logo, and hand back a corrected\
  \ `<head>` block. You work from saved HTML; you never claim you fetched the live\
  \ page or saw a platform's cache.\n\n## Files in this skill\n\n- `scripts/og_meta_check.py`\
  \ - parses HTML with `html.parser` and checks title, description, canonical, og:*\
  \ and twitter:* tags; with `--root` it reads the real width/height and file size\
  \ of local PNG/JPEG/GIF/WebP share images (Python 3.8+ standard library only)\n\
  - `references/tag-rules.md` - each tag, the values crawlers accept, lengths, image\
  \ sizes and fallbacks\n- `references/platform-notes.md` - how Facebook, LinkedIn,\
  \ X, Slack, Discord, WhatsApp and iMessage build previews, cache them and how to\
  \ refresh\n- `templates/share-meta-review.md` - the review to hand back (preview,\
  \ fix table, fixed head block, refresh steps)\n- `examples/product-page.html` -\
  \ a product page whose theme and SEO plugin both write tags, with mistakes on purpose\n\
  - `examples/product-page-fixed.html` - the same page with a correct head (checks\
  \ clean)\n- `examples/meta-report.md` - the real output of the checker on the broken\
  \ example\n\n## Workflow\n\n### 1. Get the HTML the crawlers see\nAsk for the page\
  \ URL and the server-rendered source, not the DevTools Elements view (that shows\
  \ tags added by JavaScript, which most crawlers never run):\n```\ncurl -sL -A \"\
  facebookexternalhit/1.1\" https://example.com/page -o page.html\ncurl -sL -A \"\
  Twitterbot/1.0\" https://example.com/page -o page-x.html\n```\nFor a static site\
  \ or a build folder, point the checker at the folder and pass `--root` so share\
  \ images are measured from disk. Ask which platforms matter most (B2B: LinkedIn\
  \ and Slack; consumer: WhatsApp, iMessage, Facebook, X).\n\n### 2. Run the checker\n\
  ```\npython3 scripts/og_meta_check.py examples/product-page.html --url https://shop.example.com/shoes/trail-grip\n\
  python3 scripts/og_meta_check.py dist/ --root dist/ --min-severity MEDIUM\npython3\
  \ scripts/og_meta_check.py page.html --url https://example.com/blog/post --json\n\
  python3 scripts/og_meta_check.py --self-test\n```\nGive `--url` for a single page\
  \ so relative links are resolved and canonical/og:url compared. Exit 0 = no HIGH,\
  \ 1 = HIGH findings, 2 = bad input. If you cannot run code, walk through `references/tag-rules.md`\
  \ in the same order.\n\n### 3. Explain the preview\n- Start with the preview table:\
  \ that is what people will see. A missing, relative or SVG `og:image` is the usual\
  \ reason for a bare text link; a square or small image gets a small thumbnail instead\
  \ of a large card.\n- **HIGH** breaks the preview (no or relative og:image, image\
  \ under 200x200, no title, several canonicals). **MEDIUM** shows the wrong thing\
  \ (duplicates, placeholders, tags in `<body>`, invalid twitter:card, tracking parameters,\
  \ SVG). **LOW** is polish (lengths, alt text, locale format, site_name).\n- Duplicates\
  \ usually come from two systems (theme plus SEO plugin, framework default plus page\
  \ component). Say which one to switch off rather than adding a third set.\n\n###\
  \ 4. Deliver\nFill `templates/share-meta-review.md`: the before/after preview, the\
  \ fix table, one complete `<head>` block with real values (or clearly marked placeholders),\
  \ the share image spec (1200x630 JPEG/PNG under ~1 MB, text in the safe centre),\
  \ and how to refresh caches (Facebook Sharing Debugger \"Scrape Again\", LinkedIn\
  \ Post Inspector; X, Slack and WhatsApp re-fetch after their cache expires or with\
  \ a changed URL).\n\n## Example result\nOn `examples/product-page.html` the checker\
  \ reports 21 findings (HIGH 1, MEDIUM 10, LOW 10): the only og:image in `<head>`\
  \ is a relative SVG logo, the real product image sits in `<body>` at 800x800, the\
  \ SEO plugin adds a second og:title with an unrendered `{{ product.name }}`, og:url\
  \ carries `?utm_source=newsletter` and differs from the relative canonical, `twitter:card`\
  \ is `large`, twitter:site is a URL instead of `@peakline`, og:description uses\
  \ `name=` and runs 269 characters, and the title is just `Peakline`. `examples/product-page-fixed.html`\
  \ checks clean (exit 0).\n\n## Rules\n\n- Judge the server-rendered HTML; say plainly\
  \ when tags exist only after JavaScript runs.\n- Never invent product facts, prices\
  \ or brand handles for the fixed tags; use the page's own copy or mark `<placeholder>`.\n\
  - One value per single-value tag; remove the duplicate source instead of overriding\
  \ it.\n- All URLs in og:url, og:image, twitter:image and canonical must be absolute\
  \ https:// URLs without tracking parameters.\n- Do not promise how a platform will\
  \ crop or when it refreshes; give the documented sizes and the refresh tool, and\
  \ mark the rest \"to verify\" in the platform's debugger.\n- Keep og:title free\
  \ of the site-name suffix (og:site_name carries the brand) unless the user wants\
  \ it.\n\x1FFILE:references/tag-rules.md\x1E\n# Tag rules\n\nReview order: title\
  \ and description -> canonical -> og core tags -> og:image -> twitter:* -> placement,\
  \ duplicates and placeholders.\n\n## Basic head tags\n| Tag | Rule | Checker range\
  \ |\n|---|---|---|\n| `<meta charset=\"utf-8\">` | first in `<head>`, so non-ASCII\
  \ text in previews is decoded | LOW if missing |\n| `<title>` | one per page, specific,\
  \ brand at the end | 15-60 characters (LOW outside) |\n| `<meta name=\"description\"\
  >` | one, plain sentence(s), no keyword lists | 50-160 characters (LOW outside)\
  \ |\n| `<link rel=\"canonical\">` | one, absolute https URL, no tracking parameters,\
  \ in `<head>` | MEDIUM missing/relative, HIGH several |\n\n## Open Graph (ogp.me)\n\
  - Use `property=\"og:...\"` and `content=\"...\"`. `name=\"og:...\"` works on some\
  \ platforms only; `value=` or text content is ignored.\n- `og:title` - the headline\
  \ without the site suffix, up to ~70 characters shown fully (checker warns over\
  \ 90).\n- `og:description` - 1-2 sentences, ~200 characters max shown.\n- `og:type`\
  \ - `website` for home and landing pages, `article` for posts (add `article:published_time`),\
  \ `product` for shop pages.\n- `og:url` - the canonical URL, so likes and shares\
  \ of `?utm=` variants merge into one object.\n- `og:site_name` - the brand; LinkedIn\
  \ and Slack show it above the title.\n- `og:locale` - `language_TERRITORY` with\
  \ an underscore: `en_US`, `de_DE`, `pt_BR`; alternates with `og:locale:alternate`.\n\
  - Single-value tags (`og:title`, `og:description`, `og:type`, `og:url`, `og:site_name`,\
  \ `og:locale`) must appear once. `og:image` may repeat (several images); the first\
  \ is usually used.\n\n## og:image\n- Absolute https URL that returns 200 to crawlers\
  \ without login, cookies or hotlink protection, `Content-Type: image/jpeg|png|webp|gif`.\n\
  - Size: at least 200x200 (Facebook minimum, HIGH below), 1200x630 recommended for\
  \ large cards (MEDIUM below), 1.91:1 aspect for `summary_large_image` (LOW if outside\
  \ 1.75-2.05). `summary` cards use a square crop.\n- File size: under ~1 MB loads\
  \ reliably; X rejects images over 5 MB, Facebook over 8 MB.\n- SVG is not rendered\
  \ by the major platforms (MEDIUM). Animated GIFs show the first frame.\n- Add `og:image:width`\
  \ and `og:image:height` (whole numbers, pixels) so Facebook renders the first share\
  \ before it has downloaded the image; with `--root` the checker compares them with\
  \ the file.\n- `og:image:alt` - a sentence describing the image (used by X and LinkedIn\
  \ for screen readers).\n- Change the image URL (e.g. `share-v2.jpg`) when you replace\
  \ an image; platforms cache by URL.\n\n## X (Twitter) cards\n- `twitter:card`: `summary`,\
  \ `summary_large_image`, `app` or `player`. Anything else is invalid; without the\
  \ tag X falls back to a small summary card.\n- X reads `og:title`, `og:description`\
  \ and `og:image` when `twitter:title/description/image` are absent, so only add\
  \ those to show different text on X.\n- `twitter:site` (the brand) and `twitter:creator`\
  \ (the author) are `@handles`, not URLs.\n\n## Placement, duplicates, placeholders\n\
  - Crawlers read `<head>` only. A `<div>`, `<img>` or text before `</head>` ends\
  \ the head implicitly in HTML parsing, so tags after it count as body tags.\n- Theme\
  \ + SEO plugin (WordPress, Shopify), framework default + page component (Next.js\
  \ `metadata`, Nuxt `useHead`) are the usual sources of duplicates. Keep one source.\n\
  - Unrendered template text (`{{ product.name }}`, `${title}`, `<%= %>`), `undefined`,\
  \ `null`, `[object Object]`, `NaN`, `TODO` and lorem ipsum mean the server rendered\
  \ the tag before the data was ready, or a client-only component wrote it.\n- Tracking\
  \ parameters (`utm_*`, `fbclid`, `gclid`, `ref`, `mc_cid`) never belong in canonical\
  \ or og:url.\n\n## Fixed head block (shape)\n```\n<meta charset=\"utf-8\">\n<title>{Page\
  \ headline} | {Brand}</title>\n<meta name=\"description\" content=\"{50-160 characters}\"\
  >\n<link rel=\"canonical\" href=\"https://{host}/{clean-path}\">\n<meta property=\"\
  og:type\" content=\"website\">\n<meta property=\"og:site_name\" content=\"{Brand}\"\
  >\n<meta property=\"og:title\" content=\"{Headline}\">\n<meta property=\"og:description\"\
  \ content=\"{1-2 sentences}\">\n<meta property=\"og:url\" content=\"https://{host}/{clean-path}\"\
  >\n<meta property=\"og:image\" content=\"https://{host}/img/{name}-1200x630.jpg\"\
  >\n<meta property=\"og:image:width\" content=\"1200\">\n<meta property=\"og:image:height\"\
  \ content=\"630\">\n<meta property=\"og:image:alt\" content=\"{What the image shows}\"\
  >\n<meta property=\"og:locale\" content=\"en_US\">\n<meta name=\"twitter:card\"\
  \ content=\"summary_large_image\">\n<meta name=\"twitter:site\" content=\"@{brand}\"\
  >\n```\n\x1FFILE:references/platform-notes.md\x1E\n# Platform notes\n\nWhat each\
  \ app reads, how long it caches, and how to refresh. Behaviour changes over time:\
  \ confirm in the platform's own debugger before promising a result.\n\n| Platform\
  \ | Crawler user agent | Reads | Image used | Cache / refresh |\n|---|---|---|---|---|\n\
  | Facebook, Messenger | `facebookexternalhit/1.1` | og:*, then title/description\
  \ | og:image, 1200x630 large card, 200x200 minimum | ~30 days; Sharing Debugger\
  \ -> \"Scrape Again\" |\n| Instagram (link stickers, DMs) | Facebook crawler | og:*\
  \ | og:image | as Facebook |\n| LinkedIn | `LinkedInBot/1.0` | og:* (title, description,\
  \ image, site_name) | og:image, 1200x627, min 200 px wide | ~7 days; Post Inspector\
  \ re-scrapes |\n| X | `Twitterbot/1.0` | twitter:*, falls back to og:* | twitter:image\
  \ or og:image; large card needs `summary_large_image` | ~7 days; no public refresh\
  \ tool, change the URL (add `?v=2` to the shared link, not to canonical) |\n| Slack\
  \ | `Slackbot-LinkExpanding 1.0` | og:*, twitter:*, oEmbed | og:image (large when\
  \ 1.91:1) | ~30 min per workspace; re-post after the fix |\n| Discord | `Discordbot/2.0`\
  \ | og:*, twitter:card, `theme-color` for the side bar | large image with `summary_large_image`\
  \ | cached; append a query string to re-test |\n| WhatsApp | `WhatsApp/2.x` | og:title,\
  \ og:description, og:image | og:image; small files (a few hundred KB) give the most\
  \ reliable thumbnails | per device; new link or new image URL |\n| iMessage | Apple's\
  \ link preview fetcher (runs on the sender's device) | og:title, og:image, favicon\
  \ | og:image or apple-touch-icon | on device |\n| Telegram | `TelegramBot` | og:*\
  \ | og:image | @WebpageBot to refresh |\n\n## Common reasons a preview is wrong\n\
  - **No preview at all:** crawler blocked by robots.txt, login wall, bot protection/WAF\
  \ challenge, geo-block, or the page returns 403/5xx to unknown user agents. Test\
  \ with `curl -sI -A \"facebookexternalhit/1.1\" URL`.\n- **Old title or image:**\
  \ the platform cache. Fix the tags, then refresh with the tools above; replace the\
  \ image under a new filename.\n- **Logo instead of the product image:** og:image\
  \ points at the logo, or the right tag sits in `<body>` and is ignored.\n- **Cropped\
  \ text on the image:** keep important text inside the centre ~80% of a 1200x630\
  \ canvas; LinkedIn and X crop the edges differently.\n- **Wrong language or mojibake:**\
  \ missing `<meta charset=\"utf-8\">` or the server sends a different `Content-Type`\
  \ charset.\n- **Single-page apps:** tags set by client-side JavaScript are not seen\
  \ by Facebook, LinkedIn, Slack or WhatsApp. Pre-render or render the head on the\
  \ server.\n\n## Testing checklist\n1. `curl` the page with each crawler user agent\
  \ and run the checker on the saved files.\n2. `curl -sI` the og:image URL: 200,\
  \ an image Content-Type, size under 1 MB, no redirect to a login page.\n3. Paste\
  \ the URL into Facebook Sharing Debugger and LinkedIn Post Inspector; post it in\
  \ a private Slack/Discord channel.\n4. Record the before/after screenshots in the\
  \ review.\n\x1FFILE:templates/share-meta-review.md\x1E\n# Share preview review:\
  \ <page URL>\n\n**Source:** <curl -A facebookexternalhit, saved <date>>   **Platforms\
  \ that matter:** <LinkedIn, Slack, WhatsApp>\n**Result:** <HIGH n, MEDIUM n, LOW\
  \ n> - <one-sentence verdict, e.g. \"shares show the logo and a template placeholder;\
  \ fix the SEO plugin output\">\n\n## Preview now vs after the fix\n| Field | Now\
  \ | After |\n|---|---|---|\n| Title | <{{ product.name }} / Peakline> | <Trail Grip\
  \ - the trail shoe for wet rock> |\n| Description | <269 characters, cut mid-sentence>\
  \ | <Grippy, light trail shoes tested on wet granite and mud. ...> |\n| Image |\
  \ </img/logo.svg (relative SVG)> | <https://shop.example.com/img/trail-grip-share-1200x630.jpg>\
  \ |\n| Card on X | <invalid \"large\"> | <summary_large_image> |\n\n## Fix list\n\
  | # | Sev | Tag | Problem | Fix | Where |\n|---|---|---|---|---|---|\n| 1 | <HIGH>\
  \ | <og:image> | <relative SVG logo> | <absolute 1200x630 JPEG> | <theme header.liquid>\
  \ |\n| 2 | <MEDIUM> | <og:title> | <duplicate from SEO plugin, unrendered> | <disable\
  \ theme OG output, keep plugin> | <plugin settings> |\n\n## Fixed head block\n```\n\
  <paste the complete corrected tags here, in this order: charset, title, description,\
  \ canonical, og:*, twitter:*>\n```\n\n## Share image spec\n- <1200x630 JPEG or PNG,\
  \ under ~1 MB, new filename; text and logo inside the centre 80%>\n- <alt text:\
  \ \"...\">\n\n## After deploying\n1. <curl -sL -A \"facebookexternalhit/1.1\" <URL>\
  \ | grep -E 'og:|twitter:|canonical'>\n2. <Facebook Sharing Debugger: Scrape Again;\
  \ LinkedIn Post Inspector: Inspect>\n3. <post in a private Slack channel; check\
  \ X with a fresh share>\n\n**To verify (not checked offline):** <image URL returns\
  \ 200 to crawlers; robots.txt/WAF does not block the user agents; tags present without\
  \ JavaScript>\n**Open questions:** <which system should own the tags - theme or\
  \ SEO plugin? per-product share images available?>\n\x1FFILE:examples/product-page.html\x1E\
  \n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta http-equiv=\"X-UA-Compatible\"\
  \ content=\"IE=edge\">\n  <title>Peakline</title>\n  <meta name=\"viewport\" content=\"\
  width=device-width, initial-scale=1\">\n  <meta name=\"description\" content=\"\
  Shoes.\">\n  <link rel=\"canonical\" href=\"/shoes/trail-grip\">\n  <!-- theme defaults\
  \ -->\n  <meta property=\"og:type\" content=\"website\">\n  <meta property=\"og:title\"\
  \ content=\"Peakline Shop\">\n  <meta property=\"og:url\" content=\"https://shop.example.com/shoes/trail-grip?utm_source=newsletter\"\
  >\n  <meta property=\"og:image\" content=\"/img/logo.svg\">\n  <meta property=\"\
  og:locale\" content=\"en-us\">\n  <!-- SEO plugin -->\n  <meta property=\"og:title\"\
  \ content=\"{{ product.name }} | Peakline\">\n  <meta name=\"og:description\" content=\"\
  Grippy, light trail running shoes tested on wet granite, roots and mud. Compare\
  \ fit, drop and sole wear across three widths, read 240 reviews from real runners,\
  \ and order with free returns within 60 days and free shipping on orders over 80\
  \ dollars, in every EU country.\">\n  <meta name=\"twitter:card\" content=\"large\"\
  >\n  <meta name=\"twitter:site\" content=\"https://x.com/peakline\">\n  <link rel=\"\
  stylesheet\" href=\"/css/site.css\">\n</head>\n<body>\n  <header><a href=\"/\">Peakline</a></header>\n\
  \  <main>\n    <h1>Trail Grip - wet rock trail shoe</h1>\n    <meta property=\"\
  og:image\" content=\"https://shop.example.com/img/trail-grip-800.jpg\">\n    <meta\
  \ property=\"og:image:width\" content=\"800\">\n    <meta property=\"og:image:height\"\
  \ content=\"800\">\n    <p>Grippy, light trail shoes tested on wet granite and mud.</p>\n\
  \  </main>\n</body>\n</html>\n\x1FFILE:examples/product-page-fixed.html\x1E\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"\
  viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Trail Grip\
  \ Running Shoes for Wet Rock | Peakline</title>\n  <meta name=\"description\" content=\"\
  Grippy, light trail shoes tested on wet granite and mud. Compare fit, drop and sole\
  \ wear across three widths, with free 60-day returns.\">\n  <link rel=\"canonical\"\
  \ href=\"https://shop.example.com/shoes/trail-grip\">\n  <meta property=\"og:type\"\
  \ content=\"product\">\n  <meta property=\"og:site_name\" content=\"Peakline\">\n\
  \  <meta property=\"og:title\" content=\"Trail Grip - the trail shoe for wet rock\"\
  >\n  <meta property=\"og:description\" content=\"Grippy, light trail shoes tested\
  \ on wet granite and mud. Three widths, free 60-day returns.\">\n  <meta property=\"\
  og:url\" content=\"https://shop.example.com/shoes/trail-grip\">\n  <meta property=\"\
  og:image\" content=\"https://shop.example.com/img/trail-grip-share-1200x630.jpg\"\
  >\n  <meta property=\"og:image:width\" content=\"1200\">\n  <meta property=\"og:image:height\"\
  \ content=\"630\">\n  <meta property=\"og:image:alt\" content=\"Blue Trail Grip\
  \ shoe gripping a wet granite slab\">\n  <meta property=\"og:locale\" content=\"\
  en_US\">\n  <meta name=\"twitter:card\" content=\"summary_large_image\">\n  <meta\
  \ name=\"twitter:site\" content=\"@peakline\">\n  <link rel=\"stylesheet\" href=\"\
  /css/site.css\">\n</head>\n<body>\n  <header><a href=\"/\">Peakline</a></header>\n\
  \  <main>\n    <h1>Trail Grip - wet rock trail shoe</h1>\n    <p>Grippy, light trail\
  \ shoes tested on wet granite and mud.</p>\n  </main>\n</body>\n</html>\n\x1FFILE:examples/meta-report.md\x1E\
  \n# Social share meta check\n\nPages: 1   Findings: 21 (HIGH 1, MEDIUM 10, LOW 10)\
  \   Page URL: https://shop.example.com/shoes/trail-grip\n\n## product-page.html\n\
  \nPreview as built from the tags (card: large)\n\n| Field | Shown |\n|---|---|\n\
  | Domain | shop.example.com |\n| Title | Peakline Shop |\n| Description | Grippy,\
  \ light trail running shoes tested on wet granite, roots and mud. Compare fit, drop\
  \ and sole wear across three widths, read 240 reviews from real runners, and order\
  \ with free returns within 6... |\n| Image | /img/logo.svg |\n\n| Sev | Code | Tag\
  \ | Line | Problem | Fix |\n|---|---|---|---|---|---|\n| HIGH | RELATIVE_URL | og:image\
  \ | 13 | og:image is relative (/img/logo.svg); crawlers need an absolute URL - would\
  \ mean https://shop.example.com/img/logo.svg | write the full URL, e.g. https://shop.example.com/img/logo.svg\
  \ |\n| MEDIUM | RELATIVE_URL | canonical | 8 | canonical is relative (/shoes/trail-grip);\
  \ crawlers need an absolute URL - would mean https://shop.example.com/shoes/trail-grip\
  \ | write the full URL, e.g. https://shop.example.com/shoes/trail-grip |\n| MEDIUM\
  \ | TRACKING_PARAMS | og:url | 12 | og:url carries tracking parameters (utm_source=newsletter);\
  \ every share then counts the campaign | use the clean URL without ?utm_/fbclid/gclid\
  \ |\n| MEDIUM | IMAGE_SVG | og:image | 13 | SVG images are not rendered by Facebook,\
  \ X, LinkedIn or Slack | export a PNG or JPEG |\n| MEDIUM | IMAGE_SMALL | og:image\
  \ | 13 | image is 800x800 (declared); large previews need at least 1200x630 (shown\
  \ small or blurry) | use 1200x630 (2400x1260 for sharp retina) |\n| MEDIUM | PLACEHOLDER_VALUE\
  \ | og:title | 16 | og:title looks like an unrendered template or placeholder: '{{\
  \ product.name }} / Peakline' | fix the template variable |\n| MEDIUM | DUPLICATE_TAG\
  \ | og:title | 16 | 2 different og:title values; apps pick the first or last unpredictably\
  \ | keep one (often a theme and an SEO plugin both add tags) |\n| MEDIUM | TWITTER_CARD_INVALID\
  \ | twitter:card | 18 | twitter:card 'large' is not one of summary, summary_large_image,\
  \ app, player | use summary_large_image (or summary) |\n| MEDIUM | TAG_OUTSIDE_HEAD\
  \ | og:image | 26 | og:image is inside `<body>`; Facebook and LinkedIn read only\
  \ `<head>` | move into `<head>` |\n| MEDIUM | TAG_OUTSIDE_HEAD | og:image:width\
  \ | 27 | og:image:width is inside `<body>`; Facebook and LinkedIn read only `<head>`\
  \ | move into `<head>` |\n| MEDIUM | TAG_OUTSIDE_HEAD | og:image:height | 28 | og:image:height\
  \ is inside `<body>`; Facebook and LinkedIn read only `<head>` | move into `<head>`\
  \ |\n| LOW | OG_MISSING | og:site_name | - | og:site_name missing: LinkedIn and\
  \ Slack show the bare domain instead of your brand | `<meta property=\"og:site_name\"\
  \ content=\"Brand\">` |\n| LOW | CHARSET_MISSING | meta charset | - | no `<meta\
  \ charset>`; non-ASCII titles can show as mojibake in previews | `<meta charset=\"\
  utf-8\">` first in `<head>` |\n| LOW | TITLE_LENGTH | `<title>` | 5 | title is 8\
  \ characters (aim for 15-60): 'Peakline' | front-load the key words; search results\
  \ cut around 60 characters |\n| LOW | DESCRIPTION_LENGTH | meta description | 7\
  \ | description is 6 characters (aim for 50-160) | rewrite to one or two sentences\
  \ with the key benefit first |\n| LOW | CANONICAL_OG_URL_MISMATCH | og:url | 12\
  \ | og:url (https://shop.example.com/shoes/trail-grip?utm_source=newsletter) differs\
  \ from canonical (/shoes/trail-grip) | use the canonical URL in og:url |\n| LOW\
  \ | IMAGE_ALT_MISSING | og:image:alt | 13 | no og:image:alt (screen readers on X/LinkedIn\
  \ get nothing) | describe the image in one sentence |\n| LOW | OG_LOCALE_FORMAT\
  \ | og:locale | 14 | og:locale 'en-us' should look like en_US (underscore, region\
  \ in capitals) | e.g. en_US, de_DE, pt_BR |\n| LOW | OG_DESCRIPTION_LONG | og:description\
