  og:\") and m.attr == \"name\":\n            add(\"LOW\", \"OG_USES_NAME_ATTR\",\
  \ m.key, \"%s uses name= instead of property= (Open Graph spec; some parsers skip\
  \ it)\" % m.key,\n                \"<meta property=\\\"%s\\\" ...>\" % m.key, m.line)\n\
  \        if (m.key.startswith((\"og:\", \"twitter:\")) or m.key == \"description\"\
  ) and not m.in_head:\n            add(\"MEDIUM\", \"TAG_OUTSIDE_HEAD\", m.key, \"\
  %s is inside <body>; Facebook and LinkedIn read only <head>\" % m.key, \"move into\
  \ <head>\", m.line)\n        if m.content is None and (m.key.startswith((\"og:\"\
  , \"twitter:\")) or m.key == \"description\"):\n            add(\"MEDIUM\", \"NO_CONTENT_ATTR\"\
  , m.key, \"%s has no content attribute (value=/text= are ignored)\" % m.key, \"\
  use content=\\\"...\\\"\", m.line)\n        if m.content and PLACEHOLDER_RE.search(m.content)\
  \ and (m.key.startswith((\"og:\", \"twitter:\")) or m.key == \"description\"):\n\
  \            add(\"MEDIUM\", \"PLACEHOLDER_VALUE\", m.key, \"%s looks like an unrendered\
  \ template or placeholder: %r\" % (m.key, m.content[:60]),\n                \"fix\
  \ the template variable\", m.line)\n    for key in SINGLE_OG + (\"twitter:card\"\
  , \"twitter:title\", \"twitter:description\"):\n        ms = metas.get(key, [])\n\
  \        if len(ms) > 1 and len(set((m.content or \"\") for m in ms)) > 1:\n   \
  \         add(\"MEDIUM\", \"DUPLICATE_TAG\", key, \"%d different %s values; apps\
  \ pick the first or last unpredictably\" % (len(ms), key),\n                \"keep\
  \ one (often a theme and an SEO plugin both add tags)\", ms[1].line)\n    if titles\
  \ and titles[0][0] and PLACEHOLDER_RE.search(titles[0][0]):\n        add(\"MEDIUM\"\
  , \"PLACEHOLDER_VALUE\", \"<title>\", \"title looks like a placeholder: %r\" % titles[0][0],\
  \ \"fix the template\", titles[0][1])\n    if not p.charset:\n        add(\"LOW\"\
  , \"CHARSET_MISSING\", \"meta charset\", \"no <meta charset>; non-ASCII titles can\
  \ show as mojibake in previews\", \"<meta charset=\\\"utf-8\\\"> first in <head>\"\
  )\n\n    preview = {\n        \"title\": _cut(ogt or (titles[0][0] if titles else\
  \ \"\") or \"\", OG_TITLE_MAX),\n        \"description\": _cut(ogd or desc or \"\
  \", OG_DESC_MAX),\n        \"image\": img or tw_img or \"\",\n        \"domain\"\
  : urlsplit(val(\"og:url\") or canon_url or page_url or \"\").netloc,\n        \"\
  card\": card or (\"summary\" if img else \"none\"),\n    }\n    return f, preview\n\
  \n\ndef _cut(text, n):\n    return text if len(text) <= n else text[:n - 3].rstrip()\
  \ + \"...\"\n\n\ndef _code(text):\n    \"\"\"Wrap <tags> in backticks so markdown\
  \ shows them instead of swallowing them as HTML.\"\"\"\n    return re.sub(r\"(<[^<>]+>)\"\
  , r\"`\\1`\", text.replace(\"|\", \"/\"))\n\n\ndef _local_path(url, page_url, root):\n\
  \    s = urlsplit(url)\n    if s.scheme and page_url and s.netloc and s.netloc !=\
  \ urlsplit(page_url).netloc:\n        return None  # image on another host (CDN):\
  \ cannot check locally\n    path = urlsplit(urljoin(page_url or \"https://local.invalid/\"\
  , url)).path\n    return os.path.join(root, path.lstrip(\"/\"))\n\n\ndef run_files(paths,\
  \ page_url, root, min_sev, ignore):\n    results = []\n    files = []\n    for p\
  \ in paths:\n        if os.path.isdir(p):\n            for dp, _, fns in os.walk(p):\n\
  \                files += [os.path.join(dp, fn) for fn in sorted(fns) if fn.lower().endswith((\"\
  .html\", \".htm\"))]\n        else:\n            files.append(p)\n    if not files:\n\
  \        raise ValueError(\"no HTML files found\")\n    for fp in files:\n     \
  \   with open(fp, encoding=\"utf-8\", errors=\"replace\") as fh:\n            html\
  \ = fh.read()\n        if not re.search(r\"<(html|head|meta|title|link)\\b\", html,\
  \ re.I):\n            raise ValueError(\"%s does not look like HTML\" % fp)\n  \
  \      fs, prev = analyze(html, page_url if len(files) == 1 else \"\", root, os.path.basename(fp))\n\
  \        fs = [x for x in fs if SEV_ORDER[x[\"severity\"]] >= SEV_ORDER[min_sev]\
  \ and x[\"code\"] not in ignore]\n        fs.sort(key=lambda x: (-SEV_ORDER[x[\"\
  severity\"]], x[\"line\"]))\n        results.append((fp, fs, prev))\n    return\
  \ results\n\n\ndef render_md(results, page_url):\n    allf = [x for _, fs, _ in\
  \ results for x in fs]\n    c = {k: sum(1 for x in allf if x[\"severity\"] == k)\
  \ for k in (\"HIGH\", \"MEDIUM\", \"LOW\")}\n    o = [\"# Social share meta check\"\
  , \"\",\n         \"Pages: %d   Findings: %d (HIGH %d, MEDIUM %d, LOW %d)%s\" %\
  \ (len(results), len(allf), c[\"HIGH\"], c[\"MEDIUM\"], c[\"LOW\"],\n          \
  \                                                           (\"   Page URL: \" +\
  \ page_url) if page_url and len(results) == 1 else \"\")]\n    for fp, fs, prev\
  \ in results:\n        o += [\"\", \"## %s\" % os.path.basename(fp), \"\",\n   \
  \           \"Preview as built from the tags (card: %s)\" % prev[\"card\"], \"\"\
  ,\n              \"| Field | Shown |\", \"|---|---|\",\n              \"| Domain\
  \ | %s |\" % (prev[\"domain\"] or \"(unknown)\"),\n              \"| Title | %s\
  \ |\" % (prev[\"title\"].replace(\"|\", \"/\") or \"(none)\"),\n              \"\
  | Description | %s |\" % (prev[\"description\"].replace(\"|\", \"/\") or \"(none)\"\
  ),\n              \"| Image | %s |\" % (prev[\"image\"] or \"(none)\"), \"\"]\n\
  \        if not fs:\n            o.append(\"No findings.\")\n            continue\n\
  \        o += [\"| Sev | Code | Tag | Line | Problem | Fix |\", \"|---|---|---|---|---|---|\"\
  ]\n        for x in fs:\n            o.append(\"| %s | %s | %s | %s | %s | %s |\"\
  \ % (x[\"severity\"], x[\"code\"], _code(x[\"tag\"]), x[\"line\"] or \"-\",\n  \
  \                                                       _code(x[\"problem\"]), _code(x[\"\
  fix\"])))\n    o += [\"\", \"Offline check of the saved HTML only: tags injected\
  \ by JavaScript after load are invisible to most crawlers too, \"\n          \"\
  but redirects, robots rules, the live image URL and each platform's preview cache\
  \ were not tested.\"]\n    return \"\\n\".join(o) + \"\\n\"\n\n\n# -----------------------------------------------------------------------------\
  \ self-test\n\nGOOD = \"\"\"<!doctype html><html lang=\"en\"><head><meta charset=\"\
  utf-8\">\n<title>Trail Running Shoes for Wet Rocks | Peakline</title>\n<meta name=\"\
  description\" content=\"Grippy, light trail shoes tested on wet granite and mud.\
  \ Compare fit, drop and sole wear, then pick your size.\">\n<link rel=\"canonical\"\
  \ href=\"https://shop.example.com/shoes/trail-grip\">\n<meta property=\"og:type\"\
  \ content=\"product\"><meta property=\"og:site_name\" content=\"Peakline\">\n<meta\
  \ property=\"og:title\" content=\"Trail Running Shoes for Wet Rocks\">\n<meta property=\"\
  og:description\" content=\"Grippy, light trail shoes tested on wet granite and mud.\"\
  >\n<meta property=\"og:url\" content=\"https://shop.example.com/shoes/trail-grip\"\
  >\n<meta property=\"og:image\" content=\"https://shop.example.com/img/trail-grip-share.jpg\"\
  >\n<meta property=\"og:image:width\" content=\"1200\"><meta property=\"og:image:height\"\
  \ content=\"630\">\n<meta property=\"og:image:alt\" content=\"Blue trail shoe on\
  \ a wet granite slab\">\n<meta property=\"og:locale\" content=\"en_US\">\n<meta\
  \ name=\"twitter:card\" content=\"summary_large_image\"><meta name=\"twitter:site\"\
  \ content=\"@peakline\">\n</head><body><h1>Trail Grip</h1></body></html>\"\"\"\n\
  \n\ndef self_test():\n    import tempfile\n    cases = []\n\n    def codes(html,\
  \ url=\"https://shop.example.com/shoes/trail-grip\", root=None):\n        return\
  \ [x[\"code\"] for x in analyze(html, url, root)[0]]\n\n    def case(name, fn):\n\
  \        try:\n            ok, err = bool(fn()), \"\"\n        except Exception\
  \ as e:  # noqa\n            ok, err = False, repr(e)\n        cases.append((name,\
  \ ok, err))\n\n    def sub(a, b):\n        assert a in GOOD, a\n        return GOOD.replace(a,\
  \ b)\n\n    case(\"good page is clean\", lambda: codes(GOOD) == [])\n    case(\"\
  missing title\", lambda: \"TITLE_MISSING\" in codes(sub(\"<title>Trail Running Shoes\
  \ for Wet Rocks | Peakline</title>\", \"\")))\n    case(\"two titles\", lambda:\
  \ \"TITLE_MULTIPLE\" in codes(sub(\"</head>\", \"<title>Other</title></head>\")))\n\
  \    case(\"title too long\", lambda: \"TITLE_LENGTH\" in codes(sub(\"Trail Running\
  \ Shoes for Wet Rocks | Peakline\", \"x\" * 75)))\n    case(\"description missing\"\
  , lambda: \"DESCRIPTION_MISSING\" in codes(re.sub(r'<meta name=\"description\"[^>]*>',\
  \ \"\", GOOD)))\n    case(\"description short\", lambda: \"DESCRIPTION_LENGTH\"\
  \ in codes(re.sub(r'(<meta name=\"description\" content=\")[^\"]*', r\"\\1Shoes.\"\
  , GOOD)))\n    case(\"canonical missing\", lambda: \"CANONICAL_MISSING\" in codes(re.sub(r'<link\
  \ rel=\"canonical\"[^>]*>', \"\", GOOD)))\n    case(\"canonical relative\", lambda:\
  \ \"RELATIVE_URL\" in codes(sub('href=\"https://shop.example.com/shoes/trail-grip\"\
  ', 'href=\"/shoes/trail-grip\"')))\n    case(\"two canonicals\", lambda: \"CANONICAL_MULTIPLE\"\
  \ in codes(sub(\"</head>\", '<link rel=\"canonical\" href=\"https://shop.example.com/x\"\
  ></head>')))\n    case(\"canonical vs og:url mismatch\", lambda: \"CANONICAL_OG_URL_MISMATCH\"\
  \ in codes(sub('og:url\" content=\"https://shop.example.com/shoes/trail-grip\"',\
  \ 'og:url\" content=\"https://shop.example.com/shoes/trail-grip?utm_source=x\"')))\n\
  \    case(\"trailing slash difference ignored\", lambda: \"CANONICAL_OG_URL_MISMATCH\"\
  \ not in codes(sub('og:url\" content=\"https://shop.example.com/shoes/trail-grip\"\
  ', 'og:url\" content=\"https://shop.example.com/shoes/trail-grip/\"')))\n    case(\"\
  og:image missing HIGH\", lambda: \"OG_IMAGE_MISSING\" in codes(re.sub(r'<meta property=\"\
  og:image[^>]*>', \"\", GOOD)))\n    case(\"og:image relative HIGH\", lambda: [x[\"\
  severity\"] for x in analyze(sub('content=\"https://shop.example.com/img/trail-grip-share.jpg\"\
  ', 'content=\"/img/trail-grip-share.jpg\"'), \"https://shop.example.com/p\")[0]\
  \ if x[\"code\"] == \"RELATIVE_URL\"] == [\"HIGH\"])\n    case(\"og:image http\"\
  , lambda: \"HTTP_URL\" in codes(sub(\"https://shop.example.com/img/\", \"http://shop.example.com/img/\"\
  )))\n    case(\"og:image svg\", lambda: \"IMAGE_SVG\" in codes(sub(\"trail-grip-share.jpg\"\
  , \"logo.svg\")))\n    case(\"image dims missing\", lambda: \"IMAGE_DIMENSIONS_MISSING\"\
  \ in codes(re.sub(r'<meta property=\"og:image:(width|height)\"[^>]*>', \"\", GOOD)))\n\
  \    case(\"image too small HIGH\", lambda: \"IMAGE_TOO_SMALL\" in codes(sub('content=\"\
  1200\"', 'content=\"150\"').replace('content=\"630\"', 'content=\"150\"')))\n  \
  \  case(\"image small MEDIUM\", lambda: \"IMAGE_SMALL\" in codes(sub('content=\"\
  1200\"', 'content=\"600\"').replace('content=\"630\"', 'content=\"315\"')))\n  \
  \  case(\"image square aspect for large card\", lambda: \"IMAGE_ASPECT\" in codes(sub('content=\"\
  630\"', 'content=\"1200\"')))\n    case(\"summary card allows square\", lambda:\
  \ \"IMAGE_ASPECT\" not in codes(sub('content=\"630\"', 'content=\"1200\"').replace(\"\
  summary_large_image\", \"summary\")))\n    case(\"image alt missing\", lambda: \"\
  IMAGE_ALT_MISSING\" in codes(re.sub(r'<meta property=\"og:image:alt\"[^>]*>', \"\
  \", GOOD)))\n    case(\"dims not numbers\", lambda: \"IMAGE_DIMENSIONS_INVALID\"\
  \ in codes(sub('content=\"1200\"', 'content=\"1200px\"')))\n    case(\"og:title\
  \ missing\", lambda: \"OG_MISSING\" in codes(re.sub(r'<meta property=\"og:title\"\
  [^>]*>', \"\", GOOD)))\n    case(\"empty og:description\", lambda: \"EMPTY_CONTENT\"\
  \ in codes(re.sub(r'(<meta property=\"og:description\" content=\")[^\"]*', r\"\\\
  1\", GOOD)))\n    case(\"og:title too long\", lambda: \"OG_TITLE_LONG\" in codes(sub('og:title\"\
  \ content=\"Trail Running Shoes for Wet Rocks\"', 'og:title\" content=\"' + \"y\"\
  \ * 120 + '\"')))\n    case(\"tracking params in og:url\", lambda: \"TRACKING_PARAMS\"\
  \ in codes(sub('og:url\" content=\"https://shop.example.com/shoes/trail-grip\"',\
  \ 'og:url\" content=\"https://shop.example.com/shoes/trail-grip?utm_source=nl\"\
  ')))\n    case(\"relative canonical compared after resolving\", lambda: \"CANONICAL_OG_URL_MISMATCH\"\
  \ in codes(sub('href=\"https://shop.example.com/shoes/trail-grip\"', 'href=\"/shoes/other\"\
  ')))\n    case(\"preview cut with ellipsis\", lambda: _cut(\"a\" * 300, 200).endswith(\"\
  ...\") and len(_cut(\"a\" * 300, 200)) <= 200)\n    case(\"og:locale format\", lambda:\
  \ \"OG_LOCALE_FORMAT\" in codes(sub(\"en_US\", \"en-us\")))\n    case(\"og:type\
  \ unknown\", lambda: \"OG_TYPE_UNKNOWN\" in codes(sub('og:type\" content=\"product\"\
  ', 'og:type\" content=\"shoe\"')))\n    case(\"og with name attr\", lambda: \"OG_USES_NAME_ATTR\"\
  \ in codes(sub('property=\"og:title\"', 'name=\"og:title\"')))\n    case(\"twitter\
  \ card missing\", lambda: \"TWITTER_CARD_MISSING\" in codes(re.sub(r'<meta name=\"\
  twitter:card\"[^>]*>', \"\", GOOD)))\n    case(\"twitter card invalid\", lambda:\
  \ \"TWITTER_CARD_INVALID\" in codes(sub(\"summary_large_image\", \"large\")))\n\
  \    case(\"twitter handle format\", lambda: \"TWITTER_HANDLE_FORMAT\" in codes(sub(\"\
  @peakline\", \"https://x.com/peakline\")))\n    case(\"large card without any image\"\
  , lambda: \"TWITTER_CARD_NO_IMAGE\" in codes(re.sub(r'<meta property=\"og:image[^>]*>',\
  \ \"\", GOOD)))\n    case(\"tag in body\", lambda: \"TAG_OUTSIDE_HEAD\" in codes(sub(\"\
  <h1>Trail Grip</h1>\", '<h1>T</h1><meta property=\"og:video\" content=\"https://a/v.mp4\"\
  >')))\n    case(\"implied body by div\", lambda: \"TAG_OUTSIDE_HEAD\" in codes(GOOD.replace(\"\
  </head><body>\", \"<div>x</div>\").replace('<meta name=\"twitter:site\" content=\"\
  @peakline\">', \"\").replace(\"<h1>\", '<meta name=\"twitter:site\" content=\"@peakline\"\
  ><h1>')))\n    case(\"placeholder value\", lambda: \"PLACEHOLDER_VALUE\" in codes(sub('og:title\"\
  \ content=\"Trail Running Shoes for Wet Rocks\"', 'og:title\" content=\"{{ product.name\
  \ }}\"')))\n    case(\"undefined value\", lambda: \"PLACEHOLDER_VALUE\" in codes(sub(\"\
  Blue trail shoe on a wet granite slab\", \"undefined\")))\n    case(\"duplicate\
  \ og:title different values\", lambda: \"DUPLICATE_TAG\" in codes(sub(\"</head>\"\
  , '<meta property=\"og:title\" content=\"Peakline Shop\"></head>')))\n    case(\"\
  duplicate same value tolerated\", lambda: \"DUPLICATE_TAG\" not in codes(sub(\"\
  </head>\", '<meta property=\"og:title\" content=\"Trail Running Shoes for Wet Rocks\"\
  ></head>')))\n    case(\"no content attribute\", lambda: \"NO_CONTENT_ATTR\" in\
  \ codes(sub('<meta property=\"og:site_name\" content=\"Peakline\">', '<meta property=\"\
  og:site_name\" value=\"Peakline\">')))\n    case(\"charset missing\", lambda: \"\
  CHARSET_MISSING\" in codes(sub('<meta charset=\"utf-8\">', \"\")))\n    case(\"\
  html entities decoded in title\", lambda: analyze(re.sub(r'<meta property=\"og:title\"\
  [^>]*>', \"\", sub(\"Wet Rocks | Peakline\", \"Wet Rocks &amp; Mud\")))[1][\"title\"\
  ] == \"Trail Running Shoes for Wet Rocks & Mud\")\n    case(\"preview uses og values\"\
  , lambda: analyze(GOOD, \"https://shop.example.com/shoes/trail-grip\")[1][\"domain\"\
  ] == \"shop.example.com\")\n\n    tmp = tempfile.mkdtemp()\n    os.makedirs(os.path.join(tmp,\
  \ \"img\"))\n    png = b\"\\x89PNG\\r\\n\\x1a\\n\" + b\"\\x00\\x00\\x00\\x0dIHDR\"\
  \ + struct.pack(\">II\", 800, 418) + b\"\\x08\\x02\\x00\\x00\\x00\"\n    with open(os.path.join(tmp,\
  \ \"img\", \"trail-grip-share.jpg\"), \"wb\") as fh:\n        fh.write(png)\n  \
  \  case(\"--root reads real image size\", lambda: \"IMAGE_DIMENSIONS_WRONG\" in\
  \ codes(GOOD, root=tmp) and \"IMAGE_SMALL\" in codes(GOOD, root=tmp))\n    case(\"\
  --root image not found\", lambda: \"IMAGE_NOT_FOUND\" in codes(sub(\"trail-grip-share.jpg\"\
  , \"nope.png\"), root=tmp))\n    case(\"png size parser\", lambda: image_size(os.path.join(tmp,\
  \ \"img\", \"trail-grip-share.jpg\"))[:2] == (800, 418))\n    gif = b\"GIF89a\"\
  \ + struct.pack(\"<HH\", 1200, 630) + b\"\\x00\" * 20\n    jpg = (b\"\\xff\\xd8\"\
  \ + b\"\\xff\\xe0\" + struct.pack(\">H\", 16) + b\"JFIF\\x00\" + b\"\\x00\" * 9\
  \ +\n           b\"\\xff\\xc0\" + struct.pack(\">H\", 17) + b\"\\x08\" + struct.pack(\"\
  >HH\", 630, 1200) + b\"\\x03\" + b\"\\x00\" * 9)\n    webp = b\"RIFF\" + b\"\\x00\"\
  \ * 4 + b\"WEBPVP8X\" + b\"\\x0a\\x00\\x00\\x00\" + b\"\\x00\" * 4 + (1199).to_bytes(3,\
  \ \"little\") + (629).to_bytes(3, \"little\")\n    for fn, data in ((\"a.gif\",\
  \ gif), (\"a.jpg\", jpg), (\"a.webp\", webp)):\n        with open(os.path.join(tmp,\
  \ fn), \"wb\") as fh:\n            fh.write(data)\n    case(\"gif size parser\"\
  , lambda: image_size(os.path.join(tmp, \"a.gif\"))[:2] == (1200, 630))\n    case(\"\
  jpeg size parser\", lambda: image_size(os.path.join(tmp, \"a.jpg\"))[:2] == (1200,\
  \ 630))\n    case(\"webp size parser\", lambda: image_size(os.path.join(tmp, \"\
  a.webp\"))[:2] == (1200, 630))\n    case(\"cdn image skipped for --root\", lambda:\
  \ _local_path(\"https://cdn.other.net/a.png\", \"https://shop.example.com/\", tmp)\
  \ is None)\n    case(\"non-HTML file rejected\", lambda: _rejects(tmp))\n    case(\"\
  markdown render\", lambda: \"Preview as built\" in render_md([(\"p.html\", [], analyze(GOOD)[1])],\
  \ \"\"))\n\n    passed = sum(1 for _, ok, _ in cases if ok)\n    for name, ok, err\
  \ in cases:\n        print((\"PASS \" if ok else \"FAIL \") + name + ((\" \" + err)\
  \ if err else \"\"))\n    print(\"%d/%d passed\" % (passed, len(cases)))\n    return\
  \ 0 if passed == len(cases) else 1\n\n\ndef _rejects(tmp):\n    fp = os.path.join(tmp,\
  \ \"notes.md\")\n    with open(fp, \"w\") as fh:\n        fh.write(\"# Notes\\nuse\
  \ <b>bold</b>\\n\")\n    try:\n        run_files([fp], \"\", None, \"LOW\", set())\n\
  \    except ValueError:\n        return True\n    return False\n\n\ndef main(argv=None):\n\
  \    ap = argparse.ArgumentParser(description=\"Check Open Graph / X card / canonical\
  \ meta tags in saved HTML (offline).\")\n    ap.add_argument(\"paths\", nargs=\"\
  *\", help=\"HTML files or folders\")\n    ap.add_argument(\"--url\", default=\"\"\
  , help=\"public URL of the page (single file)\")\n    ap.add_argument(\"--root\"\
  , default=None, help=\"local folder mapped to the site root, to read og:image files\"\
  )\n    ap.add_argument(\"--min-severity\", default=\"LOW\", choices=[\"LOW\", \"\
  MEDIUM\", \"HIGH\"])\n    ap.add_argument(\"--ignore\", default=\"\", help=\"comma-separated\
  \ finding codes to skip\")\n    ap.add_argument(\"--json\", action=\"store_true\"\
  )\n    ap.add_argument(\"--self-test\", action=\"store_true\")\n    a = ap.parse_args(argv)\n\
  \    if a.self_test:\n        return self_test()\n    if not a.paths:\n        ap.error(\"\
  give HTML files/folders or --self-test\")\n    ignore = {c.strip() for c in a.ignore.split(\"\
  ,\") if c.strip()}\n    try:\n        results = run_files(a.paths, a.url, a.root,\
  \ a.min_severity, ignore)\n    except (OSError, ValueError) as e:\n        print(\"\
  error: %s\" % e, file=sys.stderr)\n        return 2\n    if a.json:\n        print(json.dumps([{\"\
  file\": fp, \"preview\": prev, \"findings\": fs} for fp, fs, prev in results], indent=2))\n\
  \    else:\n        sys.stdout.write(render_md(results, a.url))\n    return 1 if\
  \ any(x[\"severity\"] == \"HIGH\" for _, fs, _ in results for x in fs) else 0\n\n\
  \nif __name__ == \"__main__\":\n    sys.exit(main())"
