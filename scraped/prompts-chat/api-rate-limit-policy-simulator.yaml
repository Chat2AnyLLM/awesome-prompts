  \ (p[\"name\"], theo, p[\"window_s\"], obs))\n    if sample:\n        add(\"info\"\
  , \"RL08\", \"Return 429 with Retry-After on every rejection (see the sample headers)\
  \ and document the \"\n            \"limits so clients can pace themselves.\")\n\
  \    order = {\"high\": 0, \"medium\": 1, \"low\": 2, \"info\": 3}\n    findings.sort(key=lambda\
  \ f: (order[f[\"severity\"]], f[\"code\"]))\n    return {\"service\": cfg.get(\"\
  service\", \"API\"), \"duration_s\": cfg[\"duration_s\"], \"requests\": len(reqs),\n\
  \            \"admitted\": len(admitted), \"peak_admitted_rps\": peak_rps, \"peak_second\"\
  : peak_sec,\n            \"capacity_rps\": cap, \"clients\": clients, \"policies\"\
  : policies, \"findings\": findings,\n            \"sample_429\": sample}\n\n\n#\
  \ -----------------------------------------------------------------------------\
  \ report\ndef fmt(x):\n    return (\"%g\" % x) if isinstance(x, float) else str(x)\n\
  \n\ndef scope(p):\n    parts = []\n    if p[\"endpoints\"]:\n        parts.append(\"\
  , \".join(p[\"endpoints\"]))\n    if p[\"clients\"]:\n        parts.append(\"only\
  \ \" + \", \".join(p[\"clients\"]))\n    if p[\"exclude_clients\"]:\n        parts.append(\"\
  not \" + \", \".join(p[\"exclude_clients\"]))\n    return \"; \".join(parts) or\
  \ \"all\"\n\n\ndef report(r):\n    L = [\"# Rate limit simulation: %s\" % r[\"service\"\
  ], \"\"]\n    cap = (\" vs capacity %g\" % r[\"capacity_rps\"]) if r[\"capacity_rps\"\
  ] else \"\"\n    L.append(\"Simulated %gs, %d logical requests, %d admitted, peak\
  \ %d req/s admitted (second %d)%s.\"\n             % (r[\"duration_s\"], r[\"requests\"\
  ], r[\"admitted\"], r[\"peak_admitted_rps\"], r[\"peak_second\"], cap))\n    highs\
  \ = sum(f[\"severity\"] == \"high\" for f in r[\"findings\"])\n    L += [\"\", \"\
  **Verdict: %s**\" % (\"%d high finding(s) - fix before shipping these limits\" %\
  \ highs if highs\n                                   else \"policies hold - no high\
  \ findings\"), \"\"]\n    L += [\"## Clients\", \"\", \"| Client | Kind | Requests\
  \ | Attempts | Allowed | 429s | OK after retry | Failed | Failed % | Max Retry-After\
  \ | Top policy |\",\n          \"|---|---|---|---|---|---|---|---|---|---|---|\"\
  ]\n    for c in r[\"clients\"]:\n        L.append(\"| %s | %s | %d | %d | %d | %d\
  \ | %d | %d | %.1f%% | %ss | %s |\" % (\n            c[\"client\"], c[\"kind\"],\
  \ c[\"logical\"], c[\"attempts\"], c[\"allowed\"], c[\"rejected\"], c[\"delayed\"\
  ], c[\"failed\"],\n            c[\"failed_pct\"], fmt(c[\"max_retry_after_s\"]),\
  \ c[\"top_policy\"] or \"-\"))\n    L += [\"\", \"## Policies\", \"\", \"| Policy\
  \ | Algorithm | Key | Scope | Sustained | Worst case / window | Busiest key / window\
  \ | Checks | Rejects |\",\n          \"|---|---|---|---|---|---|---|---|---|\"]\n\
  \    for p in r[\"policies\"]:\n        L.append(\"| %s | %s | %s | %s | %s req/s\
  \ | %s per %ss | %d | %d | %d |\" % (\n            p[\"name\"], p[\"algorithm\"\
  ], p[\"key\"], scope(p), fmt(p[\"sustained_rps\"]),\n            fmt(p[\"worst_case_per_window\"\
  ]), fmt(p[\"window_s\"]), p[\"observed_max_per_window\"], p[\"checks\"], p[\"rejects\"\
  ]))\n    L += [\"\", \"## Findings\", \"\"]\n    if not r[\"findings\"]:\n     \
  \   L.append(\"- none\")\n    for f in r[\"findings\"]:\n        L.append(\"- **%s\
  \ %s** %s\" % (f[\"severity\"].upper(), f[\"code\"], f[\"message\"]))\n    s = r[\"\
  sample_429\"]\n    if s:\n        L += [\"\", \"## Sample 429 (first rejection,\
  \ t=%ss, %s %s)\" % (s[\"t\"], s[\"client\"], s[\"endpoint\"]), \"\", \"```\",\n\
  \              \"HTTP/1.1 429 Too Many Requests\",\n              \"Retry-After:\
  \ %d\" % s[\"retry_after\"],\n              'RateLimit-Policy: \"%s\";q=%s;w=%s'\
  \ % (s[\"policy\"], fmt(float(s[\"quota\"])), fmt(float(s[\"window_s\"]))),\n  \
  \            'RateLimit: \"%s\";r=0;t=%d' % (s[\"policy\"], s[\"retry_after\"]),\n\
  \              \"Content-Type: application/problem+json\", \"```\",\n          \
  \    \"Header names follow the IETF httpapi ratelimit-headers draft; older gateways\
  \ use \"\n              \"X-RateLimit-Limit / -Remaining / -Reset instead.\"]\n\
  \    return \"\\n\".join(L) + \"\\n\"\n\n\n# -----------------------------------------------------------------------------\
  \ self-test\ndef self_test():\n    cases = []\n\n    def check(name, cond, detail=\"\
  \"):\n        cases.append((name, bool(cond), detail))\n\n    tb = TokenBucket(rate=1,\
  \ burst=3)\n    ok = 0\n    for i in range(5):\n        a, w, _ = tb.check(\"k\"\
  , 0.0, 1)\n        if a:\n            tb.consume(\"k\", 0.0, 1)\n            ok\
  \ += 1\n    check(\"token bucket burst of 3 at t=0\", ok == 3, ok)\n    a, w, _\
  \ = tb.check(\"k\", 0.0, 1)\n    check(\"token bucket retry-after 1s\", (not a)\
  \ and abs(w - 1.0) < 1e-6, w)\n    a, w, _ = tb.check(\"k\", 1.0, 1)\n    check(\"\
  token bucket refills 1 token per second\", a)\n\n    fw = FixedWindow(limit=10,\
  \ window=60)\n    times = [59.0 + i * 0.01 for i in range(10)] + [60.0 + i * 0.01\
  \ for i in range(10)]\n    allowed = []\n    for t in times:\n        a, _, _ =\
  \ fw.check(\"k\", t, 1)\n        if a:\n            fw.consume(\"k\", t, 1)\n  \
  \          allowed.append(t)\n    check(\"fixed window boundary burst = 2x limit\"\
  , max_in_window(allowed, 60) == 20, len(allowed))\n    a, w, _ = fw.check(\"k\"\
  , 61.0, 1)\n    check(\"fixed window retry-after until reset\", (not a) and abs(w\
  \ - 59.0) < 1e-6, w)\n\n    sl = SlidingLog(limit=10, window=60)\n    allowed =\
  \ []\n    for t in times:\n        a, _, _ = sl.check(\"k\", t, 1)\n        if a:\n\
  \            sl.consume(\"k\", t, 1)\n            allowed.append(t)\n    check(\"\
  sliding log never exceeds limit\", max_in_window(allowed, 60) == 10, len(allowed))\n\
  \    a, w, _ = sl.check(\"k\", 60.5, 1)\n    check(\"sliding log retry-after = oldest\
  \ + window\", (not a) and abs(w - (59.0 + 60 - 60.5)) < 1e-6, w)\n\n    sc = SlidingCounter(limit=10,\
  \ window=60)\n    allowed = []\n    for t in times + [90.0 + i for i in range(10)]:\n\
  \        a, _, _ = sc.check(\"k\", t, 1)\n        if a:\n            sc.consume(\"\
  k\", t, 1)\n            allowed.append(t)\n    first = [t for t in allowed if t\
  \ < 61]\n    later = [t for t in allowed if t >= 90]\n    check(\"sliding counter\
  \ blocks the boundary burst\", len(first) == 10, len(first))\n    check(\"sliding\
  \ counter weights previous window (about half at mid-window)\", 4 <= len(later)\
  \ <= 7, len(later))\n\n    cfg = normalize({\"service\": \"t\", \"duration_s\":\
  \ 60, \"capacity_rps\": 1000, \"policies\": [\n        {\"name\": \"pc\", \"algorithm\"\
  : \"token_bucket\", \"key\": \"client\", \"rate\": 5, \"burst\": 5}],\n        \"\
  clients\": [{\"name\": \"good\", \"kind\": \"legit\", \"rps\": 2},\n           \
  \         {\"name\": \"bad\", \"kind\": \"abusive\", \"rps\": 20, \"retry\": \"\
  immediate\"}]})\n    r = analyse(cfg, generate(cfg))\n    by = {c[\"client\"]: c\
  \ for c in r[\"clients\"]}\n    check(\"legit client under limit not throttled\"\
  , by[\"good\"][\"rejected\"] == 0, by[\"good\"])\n    check(\"abusive client mostly\
  \ throttled\", by[\"bad\"][\"allowed\"] <= 5 * 60 + 10, by[\"bad\"][\"allowed\"\
  ])\n    check(\"immediate retries amplify attempts\", by[\"bad\"][\"amplification\"\
  ] > 1.5, by[\"bad\"][\"amplification\"])\n    codes = {f[\"code\"] for f in r[\"\
  findings\"]}\n    check(\"RL05 retry amplification finding\", \"RL05\" in codes,\
  \ codes)\n\n    cfg2 = normalize({\"duration_s\": 30, \"capacity_rps\": 10, \"policies\"\
  : [\n        {\"name\": \"g\", \"algorithm\": \"fixed_window\", \"key\": \"global\"\
  , \"limit\": 600, \"window_s\": 60}],\n        \"clients\": [{\"name\": \"hog\"\
  , \"kind\": \"abusive\", \"rps\": 30},\n                    {\"name\": \"app\",\
  \ \"kind\": \"legit\", \"rps\": 1, \"start\": 25, \"duration\": 5}]})\n    r2 =\
  \ analyse(cfg2, generate(cfg2))\n    codes2 = {f[\"code\"]: f[\"severity\"] for\
  \ f in r2[\"findings\"]}\n    check(\"RL03 over capacity is high\", codes2.get(\"\
  RL03\") == \"high\", codes2)\n    check(\"RL06 noisy neighbour on global\", \"RL06\"\
  \ in codes2, codes2)\n    check(\"RL01 legit client starved\", codes2.get(\"RL01\"\
  ) == \"high\", codes2)\n\n    cfg3 = normalize({\"duration_s\": 10, \"policies\"\
  : [\n        {\"name\": \"login\", \"algorithm\": \"sliding_log\", \"key\": \"client\"\
  , \"limit\": 2, \"window_s\": 60, \"endpoints\": [\"/login\"]}],\n        \"clients\"\
  : [{\"name\": \"u\", \"rps\": 1, \"endpoint\": \"/orders\"}, {\"name\": \"v\", \"\
  rps\": 1, \"endpoint\": \"/login\"}]})\n    r3 = analyse(cfg3, generate(cfg3))\n\
  \    by3 = {c[\"client\"]: c for c in r3[\"clients\"]}\n    check(\"endpoint-scoped\
  \ policy ignores other endpoints\", by3[\"u\"][\"rejected\"] == 0 and by3[\"v\"\
  ][\"allowed\"] == 2,\n          (by3[\"u\"], by3[\"v\"]))\n    check(\"burst pattern\
  \ generates bursts\", len(generate(normalize({\"duration_s\": 120, \"policies\"\
  : cfg3[\"policies\"],\n          \"clients\": [{\"name\": \"b\", \"pattern\": \"\
  burst\", \"burst\": 5, \"every_s\": 60}]}))) == 10)\n    cfg4 = normalize({\"duration_s\"\
  : 10, \"policies\": [\n        {\"name\": \"default\", \"algorithm\": \"token_bucket\"\
  , \"key\": \"client\", \"rate\": 1, \"burst\": 1, \"exclude_clients\": [\"vip\"\
  ]},\n        {\"name\": \"vip\", \"algorithm\": \"token_bucket\", \"key\": \"client\"\
  , \"rate\": 10, \"burst\": 10, \"clients\": [\"vip\"]}],\n        \"clients\": [{\"\
  name\": \"vip\", \"rps\": 5}, {\"name\": \"std\", \"rps\": 5}]})\n    by4 = {c[\"\
  client\"]: c for c in analyse(cfg4, generate(cfg4))[\"clients\"]}\n    check(\"\
  client tiers: vip unthrottled, std limited\", by4[\"vip\"][\"rejected\"] == 0 and\
  \ by4[\"std\"][\"allowed\"] <= 11,\n          (by4[\"vip\"], by4[\"std\"]))\n  \
  \  try:\n        normalize({\"policies\": [{\"algorithm\": \"leaky\"}]})\n     \
  \   check(\"bad algorithm rejected\", False)\n    except InputError:\n        check(\"\
  bad algorithm rejected\", True)\n    rep = report(r2)\n    check(\"report has verdict\
  \ and sample 429\", \"Verdict\" in rep and \"429 Too Many Requests\" in rep)\n\n\
  \    for name, ok, detail in cases:\n        print(\"%s  %s%s\" % (\"PASS\" if ok\
  \ else \"FAIL\", name, \"\" if ok else \"  -> %r\" % (detail,)))\n    passed = sum(1\
  \ for _, ok, _ in cases if ok)\n    print(\"%d/%d passed\" % (passed, len(cases)))\n\
  \    return 0 if passed == len(cases) else 1\n\n\ndef main(argv=None):\n    ap =\
  \ argparse.ArgumentParser(description=\"Simulate API rate limit policies against\
  \ traffic.\")\n    ap.add_argument(\"config\", nargs=\"?\")\n    ap.add_argument(\"\
  --trace\", help=\"CSV with t,client[,endpoint][,cost] instead of generated traffic\"\
  )\n    ap.add_argument(\"--json\", action=\"store_true\")\n    ap.add_argument(\"\
  --self-test\", action=\"store_true\")\n    a = ap.parse_args(argv)\n    if a.self_test:\n\
  \        return self_test()\n    if not a.config:\n        ap.print_usage(sys.stderr)\n\
  \        return 2\n    try:\n        with open(a.config, encoding=\"utf-8\") as\
  \ f:\n            cfg = normalize(json.load(f))\n        reqs = read_trace(a.trace)\
  \ if a.trace else generate(cfg)\n        if not reqs:\n            raise InputError(\"\
  no traffic: add clients to the config or pass --trace\")\n        r = analyse(cfg,\
  \ reqs)\n    except (InputError, OSError, json.JSONDecodeError) as e:\n        print(\"\
  error: %s\" % e, file=sys.stderr)\n        return 2\n    print(json.dumps(r, indent=2)\
  \ if a.json else report(r), end=\"\" if not a.json else \"\\n\")\n    return 1 if\
  \ any(f[\"severity\"] == \"high\" for f in r[\"findings\"]) else 0\n\n\nif __name__\
  \ == \"__main__\":\n    sys.exit(main())"
