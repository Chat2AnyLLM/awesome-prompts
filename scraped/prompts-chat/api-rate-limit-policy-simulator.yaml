title: API Rate Limit Policy Simulator
description: Imported from Prompts Chat
prompt: "---\nname: api-rate-limit-policy-simulator\ndescription: Simulates API rate\
  \ limits before you ship them - token bucket, fixed window, sliding log and sliding\
  \ counter, per client, endpoint, tier or global - against generated or recorded\
  \ traffic with retrying clients. Shows who gets 429s and for how long, fixed-window\
  \ boundary bursts, retry herds, noisy neighbours, abusive clients that still get\
  \ through and peaks over backend capacity. Includes an offline stdlib Python simulator\
  \ with --self-test.\n---\n\n# API Rate Limit Policy Simulator\n\nYou help backend\
  \ and platform engineers choose rate limits with evidence instead of round numbers.\
  \ A limit that looks safe on paper (\"300 per minute per key\") can still let 1.8x\
  \ that through at a window boundary, throttle a mobile app whose thousands of users\
  \ share one API key, release a herd of retries at the reset second, and do nothing\
  \ against a scraper that stays just under it. You describe the policies and the\
  \ traffic in a small JSON file, replay it, and read the result client by client\
  \ and policy by policy.\n\n## Files in this skill\n\n- `scripts/rate_sim.py` - simulates\
  \ token bucket, fixed window, sliding log and sliding counter limiters keyed by\
  \ client, endpoint, client+endpoint or global, scoped to endpoints and client tiers;\
  \ generates steady, Poisson or burst traffic (or replays a CSV trace), lets clients\
  \ retry immediately, with backoff or by honouring Retry-After, and reports 429s,\
  \ delays, failures, worst-case and observed window counts, peaks vs capacity, findings\
  \ RL01-RL10 and a sample 429 response (Python 3.8+ standard library only)\n- `references/algorithms.md`\
  \ - how each algorithm behaves, its worst case, memory cost and when to pick it\n\
  - `references/policy-design.md` - choosing keys, tiers, numbers, headers and client\
  \ retry rules; what the finding codes mean\n- `templates/rate-limit-review.md` -\
  \ the review to hand back\n- `examples/orders-api.json` - a public orders API with\
  \ a per-key fixed window, a login limit and a global fixed window; five clients\
  \ including a shared mobile key, a bulk partner, a scraper and a credential stuffer\n\
  - `examples/orders-api-report.md` - the real simulator output on that file\n- `examples/orders-api-tuned.json`\
  \ - the same API after the fixes: per-tier token buckets, a global token bucket\
  \ sized to capacity\n\n## Workflow\n\n### 1. Collect the inputs\nAsk for: the limits\
  \ as configured today or as proposed (algorithm, key, numbers, which endpoints and\
  \ which clients), where they are enforced (gateway, CDN, app, Redis), the backend\
  \ capacity in requests per second it can sustain, and the traffic: the biggest legitimate\
  \ clients and their shape (steady, bursty batch jobs, many users behind one key\
  \ or one NAT IP), how each one retries, and any abuse seen in logs. Real access\
  \ logs beat guesses: export `t,client,endpoint` for a busy 5-15 minutes and pass\
  \ it with `--trace`.\n\n### 2. Run the simulator\n```\npython3 scripts/rate_sim.py\
  \ examples/orders-api.json\npython3 scripts/rate_sim.py examples/orders-api-tuned.json\n\
  python3 scripts/rate_sim.py policies.json --trace access-sample.csv\npython3 scripts/rate_sim.py\
  \ policies.json --json\npython3 scripts/rate_sim.py --self-test\n```\nExit 0 = no\
  \ high findings, 1 = high findings (legitimate clients throttled or admitted traffic\
  \ over capacity), 2 = bad input. Without a shell, reason with `references/algorithms.md`:\
  \ per key, compare the client's peak per window with the limit, the worst case (2x\
  \ limit for fixed windows, burst + rate for buckets) with capacity, and think through\
  \ what each client does after a 429.\n\n### 3. Read the result\n- Legit clients\
  \ first (RL01): any failed or delayed requests, and how long they waited. One key\
  \ shared by an app's users needs its own tier or a per-user key.\n- Capacity (RL03):\
  \ the peak admitted second vs what the backend sustains. A global limit is the only\
  \ thing that protects capacity; per-key limits multiply by the number of keys.\n\
  - Shape (RL04, RL10): fixed windows let bursts through at boundaries and hand out\
  \ a whole window at once; retries without jitter all come back in the same second.\n\
  - Abuse (RL02): a scraper under the per-key limit is not stopped by limits; it needs\
  \ detection, auth or a per-endpoint limit.\n- Retries (RL05): attempts per logical\
  \ request above 1.5 means the clients amplify load when throttled.\n\n### 4. Tune\
  \ and re-run\nChange one thing at a time and re-run with the same traffic: switch\
  \ fixed windows to token buckets or sliding counters, add tiers with `clients` /\
  \ `exclude_clients`, size the global bucket to capacity (rate = sustainable rps,\
  \ burst = what the backend absorbs for a second), add endpoint limits for login\
  \ and expensive calls, and agree pacing with batch partners. Use `references/policy-design.md`\
  \ for the numbers.\n\n### 5. Deliver\nFill `templates/rate-limit-review.md`: verdict,\
  \ a before/after table per client, the policy changes as config, the 429 response\
  \ and headers, client guidance (Retry-After, backoff with jitter, max retries) and\
  \ what to monitor after rollout.\n\n## Example result\nOn `examples/orders-api.json`\
  \ the shared `mobile-app` key hits the 300/minute per-key window: 1,042 of its 1,839\
  \ requests succeed only after waiting up to 60 s (RL01, high). Honouring Retry-After\
  \ without jitter releases 289 retries in second 240, so admitted traffic peaks at\
  \ 313 req/s against a capacity of 80 (RL03, RL10). The per-key fixed window lets\
  \ 544 requests through in one rolling minute (1.8x, RL04), and the scraper still\
  \ gets 45% of its calls through while its immediate retries push it to 2.67 attempts\
  \ per request. The login limit stops the credential stuffer (40 of 480). In `examples/orders-api-tuned.json`\
  \ (tier token buckets, global bucket 50 req/s + 30 burst, partner pacing at 2 req/s)\
  \ legit clients see no 429s, the peak is 27 req/s and only the scraper findings\
  \ remain.\n\n## Rules\n\n- Simulate with the traffic you actually have (or a trace),\
  \ not an average; bursts and retries are where limits fail.\n- Never call a limit\
  \ safe for capacity unless a global limit bounds the total.\n- Treat delayed requests\
  \ of legitimate clients as harm, not as success.\n- Always return 429 with Retry-After,\
  \ add jitter, and tell clients how to back off.\n- Rate limits are not abuse protection\
  \ on their own; say when authentication, bot detection or WAF rules are needed.\n\
  - Results are a model: confirm with gateway metrics after rollout and keep the limits\
  \ in config, not code.\n\x1FFILE:references/algorithms.md\x1E\n# Rate limit algorithms\n\
  \n| Algorithm | Admits | Worst case in one window | Memory per key | Good for |\n\
  |---|---|---|---|---|\n| Token bucket (GCRA) | while tokens remain; refills at `rate`/s\
  \ up to `burst` | burst + rate x window | 2 numbers | most APIs: smooth average,\
  \ bounded bursts |\n| Fixed window | `limit` per calendar window, counter resets\
  \ | 2 x limit (end of one window + start of next) | 1 counter | quotas and billing\
  \ (\"10,000 per day\"), not capacity |\n| Sliding log | at most `limit` in any rolling\
  \ window | limit (exact) | one timestamp per request | small limits: login, OTP,\
  \ password reset |\n| Sliding counter | previous window weighted by overlap + current\
  \ | about limit (assumes even spread) | 2 counters | large limits where exactness\
  \ is not needed |\n\n## Token bucket\n- `rate` is the long-run average; `burst`\
  \ is how many calls can arrive at once after a quiet period.\n- `limit` + `window_s`\
  \ without a burst means rate = limit/window and burst = limit: a client can spend\
  \ the whole minute in one second. Set the burst explicitly.\n- Retry-After = (cost\
  \ - tokens) / rate: usually well under a second, so retries spread out by themselves.\n\
  - GCRA (used by many gateways) stores one timestamp and gives the same admit/reject\
  \ decisions.\n\n## Fixed window\n- Cheap (`INCR` + `EXPIRE` in Redis) and easy to\
  \ explain, so it is everywhere.\n- A client can send `limit` in the last second\
  \ of a window and `limit` again in the first second of the next.\n- Every throttled\
  \ client gets Retry-After = time to the reset, so they all come back in the same\
  \ second (retry herd).\n- Use it for quotas that match business periods; put a token\
  \ bucket in front of it for capacity.\n\n## Sliding log\n- Exact, but stores every\
  \ admitted timestamp for the window: 10,000/hour per key = 10,000 entries per key.\n\
  - Retry-After = oldest relevant entry + window - now: can be long; tell the client.\n\
  \n## Sliding counter\n- Estimate = previous count x (1 - elapsed/window) + current\
  \ count.\n- Error comes from uneven traffic: a burst at the end of the previous\
  \ window is under-counted later (in the simulator's self-test, 10 requests at the\
  \ very end of one window plus an even trickle later admit 16 in one rolling minute\
  \ for a limit of 10).\n- Good default for large per-key limits behind a token bucket.\n\
  \n## Concurrency limits (not simulated)\nLimits on in-flight requests protect slow\
  \ endpoints better than rate limits; combine with a rate limit for fairness.\n\x1F\
  FILE:references/policy-design.md\x1E\n# Designing rate limit policies\n\n## Pick\
  \ the key\n- **API key / token** for authenticated traffic. Watch for keys shared\
  \ by many users (mobile apps, SDKs embedded in customer sites): give them a tier\
  \ or move to per-user keys.\n- **User or account id** behind the key when the API\
  \ knows it; fairer than the key.\n- **IP** only for anonymous endpoints; offices,\
  \ schools, carriers and VPNs put thousands of users behind one IP (CGNAT). Use generous\
  \ IP limits and stricter account limits.\n- **Endpoint** for expensive calls (search,\
  \ export, bulk) and sensitive ones (login, OTP, password reset).\n- **Global** to\
  \ protect capacity. Without it, per-key limits x number of keys is the real ceiling.\n\
  \n## Pick the numbers\n1. Sustained rate per key: p99 of a normal busy client's\
  \ requests per second x 2-3 headroom.\n2. Burst: the largest legitimate batch (page\
  \ load fan-out, sync job) that must not be throttled.\n3. Global: rate = what the\
  \ backend sustains at acceptable latency (load test), burst = what it absorbs for\
  \ about a second.\n4. Login/OTP: 5-10 per minute per account and per IP, sliding\
  \ log, plus lockout or CAPTCHA after repeated failures.\n5. Quotas (per day/month)\
  \ are a product decision; keep them separate from capacity limits.\n\n## Tiers\n\
  Scope policies with `clients` and `exclude_clients` in the simulator; in production\
  \ map tiers to plans or key metadata (free, paid, partner, internal). Internal services\
  \ should usually bypass public limits but stay under the global one.\n\n## Responses\
  \ and headers\n- 429 Too Many Requests, `Retry-After` in seconds, a problem+json\
  \ body naming the limit.\n- Advertise the policy: the IETF httpapi ratelimit-headers\
  \ draft defines `RateLimit-Policy` and `RateLimit` fields (field syntax changed\
  \ between drafts); many gateways still send `X-RateLimit-Limit`, `-Remaining`, `-Reset`.\
  \ Pick one and document it.\n- Add 0-20% random jitter to Retry-After for fixed\
  \ windows so throttled clients do not return together.\n- Use 503 + Retry-After\
  \ for overload (global limit), 429 for per-client limits, so clients can tell them\
  \ apart.\n\n## Client rules to publish\nHonour Retry-After; otherwise exponential\
  \ backoff with full jitter (1, 2, 4 s ...), at most 3-5 retries, never retry non-idempotent\
  \ calls without an idempotency key; pace batch jobs instead of bursting.\n\n## Finding\
  \ codes (rate_sim.py)\n| Code | Meaning |\n|---|---|\n| RL01 | legit client failed\
  \ or delayed (high above 1% of its requests) |\n| RL02 | abusive client still gets\
  \ more than 25% through |\n| RL03 | admitted peak over capacity, or no global limit\
  \ to bound it |\n| RL04 | fixed window let more than the limit through in a rolling\
  \ window |\n| RL05 | client retries amplify attempts 1.5x or more |\n| RL06 | noisy\
  \ neighbour holds most of a global limit while legit clients are rejected |\n| RL07\
  \ | sliding log with a very large limit (memory) |\n| RL08 | reminder: 429 + Retry-After\
  \ and documented limits |\n| RL09 | policy never triggers and is 10x above the busiest\
  \ key |\n| RL10 | retry herd: most of the peak second are retries released together\
  \ |\n\x1FFILE:templates/rate-limit-review.md\x1E\n# Rate limit review: <service>\n\
  \n**Scope:** <endpoints / gateway>   **Capacity:** <80 req/s sustained>   **Traffic\
  \ used:** <generated from ... / trace of 10 min on ...>\n**Verdict:** <ship / ship\
  \ with changes / do not ship>\n\n## What happens today\n| Client | Kind | Requests\
  \ | 429s | OK after retry | Failed | Max wait | Main policy |\n|---|---|---|---|---|---|---|---|\n\
  | <mobile-app> | <legit> | <1,839> | <1,081> | <1,042> | <0> | <60 s> | <per-key\
  \ minute> |\n\nPeak admitted: <313 req/s in second 240> vs capacity <80>.\n\n##\
  \ Findings\n1. <HIGH RL01 - shared mobile key throttled; 57% of requests delayed\
  \ up to 60 s>\n2. <HIGH RL03 / MEDIUM RL10 - retry herd at window reset, 4x capacity>\n\
  3. <MEDIUM RL04 - fixed window 1.8x at boundary>\n4. <MEDIUM RL02 - scraper under\
  \ the per-key limit>\n\n## Proposed policies\n```json\n<policies block from the\
  \ tuned config>\n```\n\n## After the change (same traffic)\n| Client | 429s before\
  \ | 429s after | Failed before | Failed after |\n|---|---|---|---|---|\n| <...>\
  \ | | | | |\n\nPeak admitted after: <27 req/s>.\n\n## Response contract\n- 429 +\
  \ Retry-After (+ jitter) for per-client limits; 503 + Retry-After for global overload\n\
  - Headers: <RateLimit-Policy / RateLimit or X-RateLimit-*>\n- Client guidance: <honour\
  \ Retry-After, backoff with jitter, max 3 retries, pace batch jobs>\n\n## Outside\
  \ rate limits\n<bot detection / auth / WAF rule for the scraper; lockout or CAPTCHA\
  \ for login>\n\n## Monitor after rollout\n<429 rate per client and policy, top throttled\
  \ keys, p99 latency, admitted rps vs capacity; review in 2 weeks>\n\x1FFILE:examples/orders-api.json\x1E\
  \n{\n  \"service\": \"Orders API (public v2)\",\n  \"duration_s\": 300,\n  \"capacity_rps\"\
  : 80,\n  \"seed\": 7,\n  \"policies\": [\n    {\"name\": \"per-key minute\", \"\
  algorithm\": \"fixed_window\", \"key\": \"client\", \"limit\": 300, \"window_s\"\
  : 60},\n    {\"name\": \"login\", \"algorithm\": \"sliding_log\", \"key\": \"client\"\
  , \"limit\": 10, \"window_s\": 60,\n     \"endpoints\": [\"/v2/login\"]},\n    {\"\
  name\": \"global\", \"algorithm\": \"fixed_window\", \"key\": \"global\", \"limit\"\
  : 3600, \"window_s\": 60}\n  ],\n  \"clients\": [\n    {\"name\": \"mobile-app\"\
  , \"kind\": \"legit\", \"pattern\": \"poisson\", \"rps\": 6, \"endpoint\": \"/v2/orders\"\
  ,\n     \"retry\": \"honor\"},\n    {\"name\": \"partner-erp\", \"kind\": \"legit\"\
  , \"pattern\": \"burst\", \"burst\": 120, \"every_s\": 60, \"start\": 58,\n    \
  \ \"endpoint\": \"/v2/orders/bulk\", \"retry\": \"backoff\"},\n    {\"name\": \"\
  checkout-web\", \"kind\": \"legit\", \"pattern\": \"poisson\", \"rps\": 3, \"endpoint\"\
  : \"/v2/checkout\",\n     \"retry\": \"honor\"},\n    {\"name\": \"price-scraper\"\
  , \"kind\": \"abusive\", \"pattern\": \"steady\", \"rps\": 12, \"start\": 20,\n\
  \     \"endpoint\": \"/v2/products\", \"retry\": \"immediate\"},\n    {\"name\"\
  : \"cred-stuffer\", \"kind\": \"abusive\", \"pattern\": \"steady\", \"rps\": 2,\
  \ \"start\": 60,\n     \"endpoint\": \"/v2/login\"}\n  ]\n}\n\x1FFILE:examples/orders-api-report.md\x1E\
  \n# Rate limit simulation: Orders API (public v2)\n\nSimulated 300s, 7227 logical\
  \ requests, 4930 admitted, peak 313 req/s admitted (second 240) vs capacity 80.\n\
  \n**Verdict: 2 high finding(s) - fix before shipping these limits**\n\n## Clients\n\
  \n| Client | Kind | Requests | Attempts | Allowed | 429s | OK after retry | Failed\
  \ | Failed % | Max Retry-After | Top policy |\n|---|---|---|---|---|---|---|---|---|---|---|\n\
  | price-scraper | abusive | 3360 | 8961 | 1503 | 7458 | 15 | 1857 | 55.3% | 35.2s\
  \ | per-key minute |\n| mobile-app | legit | 1839 | 2920 | 1839 | 1081 | 1042 |\
  \ 0 | 0.0% | 59.9s | per-key minute |\n| checkout-web | legit | 948 | 948 | 948\
  \ | 0 | 0 | 0 | 0.0% | 0s | - |\n| partner-erp | legit | 600 | 600 | 600 | 0 | 0\
  \ | 0 | 0.0% | 0s | - |\n| cred-stuffer | abusive | 480 | 480 | 40 | 440 | 0 | 440\
  \ | 91.7% | 55s | login |\n\n## Policies\n\n| Policy | Algorithm | Key | Scope |\
  \ Sustained | Worst case / window | Busiest key / window | Checks | Rejects |\n\
  |---|---|---|---|---|---|---|---|---|\n| per-key minute | fixed_window | client\
  \ | all | 5 req/s | 600 per 60s | 544 | 13909 | 8539 |\n| login | sliding_log |\
  \ client | /v2/login | 0.167 req/s | 10 per 60s | 10 | 480 | 440 |\n| global | fixed_window\
  \ | global | all | 60 req/s | 7200 per 60s | 1235 | 13909 | 0 |\n\n## Findings\n\
  \n- **HIGH RL01** Legit client mobile-app is throttled on 56.7% of its requests\
  \ (0 failed, 1042 only after retrying, waits up to 59.9s), mostly by policy 'per-key\
  \ minute'; raise that limit or give this client its own tier.\n- **HIGH RL03** Admitted\
  \ traffic peaks at 313 req/s (second 240) over the backend capacity of 80 req/s;\
  \ add or lower a global limit.\n- **MEDIUM RL02** Abusive client price-scraper still\
  \ gets 45% of its requests through (1503); tighten the per-client limit or add a\
  \ stricter policy for its pattern.\n- **MEDIUM RL04** Fixed window 'per-key minute'\
  \ let 544 requests through in one rolling 60s window (limit 300, 1.8x) across a\
  \ window boundary; use sliding_counter or a token bucket if the limit protects capacity.\n\
  - **MEDIUM RL05** Client price-scraper sends 2.67x attempts per logical request\
  \ because it retries throttled calls; retries count against the limit and add load\
  \ - require Retry-After or backoff with jitter.\n- **MEDIUM RL05** Client mobile-app\
  \ sends 1.59x attempts per logical request because it retries throttled calls; retries\
  \ count against the limit and add load - require Retry-After or backoff with jitter.\n\
  - **MEDIUM RL10** Retry herd: 289 of the 313 requests admitted in second 240 are\
  \ retries released by the same Retry-After / window reset; add jitter to Retry-After\
  \ (or client backoff) and prefer a token bucket or sliding window so capacity is\
  \ not handed out all at once.\n- **INFO RL08** Return 429 with Retry-After on every\
  \ rejection (see the sample headers) and document the limits so clients can pace\
  \ themselves.\n\n## Sample 429 (first rejection, t=45.0s, price-scraper /v2/products)\n\
  \n```\nHTTP/1.1 429 Too Many Requests\nRetry-After: 15\nRateLimit-Policy: \"per-key\
  \ minute\";q=300;w=60\nRateLimit: \"per-key minute\";r=0;t=15\nContent-Type: application/problem+json\n\
  ```\nHeader names follow the IETF httpapi ratelimit-headers draft; older gateways\
  \ use X-RateLimit-Limit / -Remaining / -Reset instead.\n\x1FFILE:examples/orders-api-tuned.json\x1E\
  \n{\n  \"service\": \"Orders API (public v2, tuned)\",\n  \"notes\": \"Same traffic\
  \ as orders-api.json except partner-erp, which agreed to pace its bulk sync at 2\
  \ req/s instead of 120-request bursts. Token buckets per tier, a global token bucket\
  \ sized to capacity.\",\n  \"duration_s\": 300,\n  \"capacity_rps\": 80,\n  \"seed\"\
  : 7,\n  \"policies\": [\n    {\"name\": \"default key\", \"algorithm\": \"token_bucket\"\
  , \"key\": \"client\", \"rate\": 4, \"burst\": 40,\n     \"exclude_clients\": [\"\
  mobile-app\", \"partner-erp\"]},\n    {\"name\": \"mobile tier\", \"algorithm\"\
  : \"token_bucket\", \"key\": \"client\", \"rate\": 15, \"burst\": 60,\n     \"clients\"\
  : [\"mobile-app\"]},\n    {\"name\": \"partner tier\", \"algorithm\": \"token_bucket\"\
  , \"key\": \"client\", \"rate\": 3, \"burst\": 20,\n     \"clients\": [\"partner-erp\"\
  ]},\n    {\"name\": \"login\", \"algorithm\": \"sliding_log\", \"key\": \"client\"\
  , \"limit\": 10, \"window_s\": 60,\n     \"endpoints\": [\"/v2/login\"]},\n    {\"\
  name\": \"global\", \"algorithm\": \"token_bucket\", \"key\": \"global\", \"rate\"\
  : 50, \"burst\": 30}\n  ],\n  \"clients\": [\n    {\"name\": \"mobile-app\", \"\
  kind\": \"legit\", \"pattern\": \"poisson\", \"rps\": 6, \"endpoint\": \"/v2/orders\"\
  ,\n     \"retry\": \"honor\"},\n    {\"name\": \"partner-erp\", \"kind\": \"legit\"\
  , \"pattern\": \"steady\", \"rps\": 2, \"start\": 58,\n     \"endpoint\": \"/v2/orders/bulk\"\
  , \"retry\": \"backoff\"},\n    {\"name\": \"checkout-web\", \"kind\": \"legit\"\
  , \"pattern\": \"poisson\", \"rps\": 3, \"endpoint\": \"/v2/checkout\",\n     \"\
  retry\": \"honor\"},\n    {\"name\": \"price-scraper\", \"kind\": \"abusive\", \"\
  pattern\": \"steady\", \"rps\": 12, \"start\": 20,\n     \"endpoint\": \"/v2/products\"\
  , \"retry\": \"immediate\"},\n    {\"name\": \"cred-stuffer\", \"kind\": \"abusive\"\
  , \"pattern\": \"steady\", \"rps\": 2, \"start\": 60,\n     \"endpoint\": \"/v2/login\"\
  }\n  ]\n}\n\x1FFILE:scripts/rate_sim.py\x1E\n#!/usr/bin/env python3\n\"\"\"API rate\
  \ limit policy simulator (Python 3.8+ standard library only).\n\nReplays generated\
  \ or recorded traffic against one or more rate limit policies and shows who\ngets\
  \ throttled, why, for how long, and whether the policies protect the backend without\n\
  hurting legitimate clients.\n\nAlgorithms (per policy):\n  token_bucket     rate\
  \ (tokens/s) + burst (bucket size); or limit + window_s (rate = limit/window_s,\n\
  \                   burst defaults to limit). GCRA behaves the same for admit/reject.\n\
  \  fixed_window     limit requests per window_s, counter resets on window boundaries\n\
  \                   (allows up to 2 x limit across a boundary)\n  sliding_log  \
  \    exact: at most limit requests in any window_s (stores one timestamp per request)\n\
  \  sliding_counter  approximation: previous window weighted by overlap + current\
  \ window (Cloudflare /\n                   Redis style, about limit per rolling\
  \ window, a few % error)\n\nConfig JSON:\n{\n  \"service\": \"Orders API\", \"duration_s\"\
  : 300, \"capacity_rps\": 60, \"seed\": 7,\n  \"policies\": [\n    {\"name\": \"\
  per-client burst\", \"algorithm\": \"token_bucket\", \"key\": \"client\", \"rate\"\
  : 5, \"burst\": 20},\n    {\"name\": \"per-client minute\", \"algorithm\": \"fixed_window\"\
  , \"key\": \"client\", \"limit\": 200, \"window_s\": 60},\n    {\"name\": \"login\"\
  , \"algorithm\": \"sliding_log\", \"key\": \"client\", \"limit\": 5, \"window_s\"\
  : 60,\n     \"endpoints\": [\"/login\"]},\n    {\"name\": \"global\", \"algorithm\"\
  : \"sliding_counter\", \"key\": \"global\", \"limit\": 3000, \"window_s\": 60}\n\
  \  ],\n  \"clients\": [\n    {\"name\": \"mobile-app\", \"kind\": \"legit\", \"\
  pattern\": \"steady\", \"rps\": 2, \"endpoint\": \"/orders\"},\n    {\"name\": \"\
  nightly-sync\", \"kind\": \"legit\", \"pattern\": \"burst\", \"burst\": 40, \"every_s\"\
  : 60, \"start\": 5},\n    {\"name\": \"scraper\", \"kind\": \"abusive\", \"pattern\"\
  : \"poisson\", \"rps\": 25, \"retry\": \"immediate\"}\n  ]\n}\n  key        client\
  \ | endpoint | client+endpoint | global\n  endpoints  optional list: the policy\
  \ applies only to these endpoints (prefix match)\n  clients / exclude_clients  \
  \ optional lists: apply only to / skip these clients (tiers, allow lists)\n  pattern\
  \    steady (rps) | poisson (rps, seeded) | burst (burst requests every every_s\
  \ seconds)\n  start, duration   seconds (default 0 and duration_s); cost = tokens\
  \ per request (default 1)\n  retry      none (default) | immediate (0.1 s later)\
  \ | backoff (1, 2, 4 s) | honor (Retry-After);\n             max_retries default\
  \ 3\n  kind       legit | abusive | unknown - used to judge false positives and\
  \ leakage\n\nRecorded traffic instead of generated: --trace trace.csv with columns\
  \ t,client[,endpoint][,cost]\n(t in seconds from start). Clients in the config then\
  \ only add kind/retry information.\n\nUsage:\n  python3 rate_sim.py config.json\
  \ [--trace trace.csv] [--json]\n  python3 rate_sim.py --self-test\nExit codes: 0\
  \ = no high findings, 1 = high findings (legit clients throttled or backend over\n\
  capacity), 2 = bad input.\n\"\"\"\nimport argparse\nimport csv\nimport heapq\nimport\
  \ json\nimport math\nimport random\nimport sys\nfrom collections import defaultdict,\
