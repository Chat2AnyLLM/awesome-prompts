  \x1FFILE:scripts/cashflow13.py\x1E\n#!/usr/bin/env python3\n\"\"\"13-week cash flow\
  \ forecaster for a small business (Python 3.8+ standard library only).\n\nTurns\
  \ a CSV of expected receipts and payments into a week-by-week cash forecast (default\
  \ 13\nweeks), in cents, with a base case and a stress case, and answers: when is\
  \ cash lowest, when\ndoes it drop below the minimum buffer, how much is missing,\
  \ which payments could be deferred,\nwhich receivables matter most, and how long\
  \ the run-rate lasts after the horizon.\n\nCSV columns (header row required, extra\
  \ columns ignored):\n  item,kind,amount,schedule,start,end,probability,flex,notes\n\
  \n  kind         in | out\n  amount       positive amount in the business currency\
  \ (per occurrence)\n  schedule     once:2026-11-20 (or just a date) | weekly:fri\
  \ | biweekly:2026-11-06 (anchor date)\n               monthly:15 | monthly:last\
  \ | quarterly:2026-12-15 (anchor) | yearly:2027-01-15\n               net:30  (invoice\
  \ terms: start = invoice date, due = start + 30 days; customers'\n             \
  \           average lateness '# ar_delay_days' is added to kind=in)\n  start, end\
  \   optional bounds for recurring items (YYYY-MM-DD); invoice date for net:<days>\n\
  \  probability  % chance the receipt/payment happens (default 100); base case =\
  \ amount x probability\n  flex         yes = payment can be deferred or cut if cash\
  \ is short\n  notes        free text\n\nComment lines at the top set the frame (or\
  \ use the CLI flags):\n  # business: Lumen Design Studio\n  # currency: EUR\n  #\
  \ start: 2026-11-02            (Monday that starts week 1)\n  # weeks: 13\n  # opening_balance:\
  \ 38500\n  # min_balance: 15000           (cash buffer you do not want to go below)\n\
  \  # ar_delay_days: 10            (customers pay this many days after the due date\
  \ on average)\n  # credit_line: 20000           (undrawn overdraft / credit facility,\
  \ optional)\n\nStress case: receipts with probability < 90% are dropped, invoice\
  \ receipts arrive\n--stress-delay days later (default 14) and recurring receipts\
  \ are cut by --stress-cut %\n(default 20). Payments are unchanged.\n\nUsage:\n \
