  \ 1, e[\"date\"],\n                                                     (\", %s%%\
  \ likely\" % e[\"prob\"]) if e[\"prob\"] < 100 else \"\",\n                    \
  \                                 (\", \" + e[\"note\"]) if e[\"note\"] else \"\"\
  ))\n    if fc.warnings:\n        o += [\"\", \"## Warnings\", \"\"] + [\"- \" +\
  \ w for w in fc.warnings]\n    wk = week_detail if week_detail else lb[\"week\"\
  ]\n    if 1 <= wk <= fc.weeks:\n        o += [\"\", \"## Week %d detail (base case)\"\
  \ % wk, \"\", \"| Date | Item | In | Out | Note |\", \"|---|---|---|---|---|\"]\n\
  \        for e in sorted((e for e in fc.events[\"base\"] if e[\"week\"] == wk -\
  \ 1), key=lambda e: (e[\"date\"], e[\"kind\"])):\n            o.append(\"| %s |\
  \ %s | %s | %s | %s |\" % (\n                e[\"date\"], e[\"item\"], fmtc(e[\"\
  cents\"]) if e[\"kind\"] == \"in\" else \"\", fmtc(e[\"cents\"]) if e[\"kind\"]\
  \ == \"out\" else \"\",\n                \"; \".join(x for x in ((\"%s%% likely\"\
  \ % e[\"prob\"]) if e[\"prob\"] < 100 else \"\", \"flex\" if e[\"flex\"] else \"\
  \", e[\"note\"]) if x)))\n    return \"\\n\".join(o) + \"\\n\"\n\n\ndef as_json(fc):\n\
  \    def row(r):\n        return {k: (v.isoformat() if isinstance(v, dt.date) else\
  \ v) for k, v in r.items()}\n    lb, ls = fc.low(\"base\"), fc.low(\"stress\")\n\
  \    rw, rr = fc.runway()\n    return {\"business\": fc.business, \"currency\":\
  \ fc.currency, \"start\": fc.start.isoformat(), \"weeks\": fc.weeks,\n         \
  \   \"opening_cents\": fc.opening, \"min_balance_cents\": fc.min_balance,\n    \
  \        \"base\": [row(r) for r in fc.table[\"base\"]], \"stress\": [row(r) for\
  \ r in fc.table[\"stress\"]],\n            \"low_base\": row(lb), \"low_stress\"\
  : row(ls), \"run_rate_cents_per_week\": rr, \"runway_weeks_after_horizon\": rw,\n\
  \            \"below_min\": fc.worst_flag(), \"warnings\": fc.warnings}\n\n\ndef\
  \ self_test():\n    cases = []\n\n    def case(name, fn):\n        try:\n      \
  \      ok, err = bool(fn()), \"\"\n        except Exception as e:  # noqa\n    \
  \        ok, err = False, repr(e)\n        cases.append((name, ok, err))\n\n   \
  \ HEAD = \"# start: 2026-11-02\\n# weeks: 13\\n# opening_balance: 10000\\n# min_balance:\
  \ 2000\\nitem,kind,amount,schedule,start,end,probability,flex,notes\\n\"\n\n   \
  \ def F(rows, **kw):\n        return Forecast(HEAD + rows, **kw)\n\n    def raises(fn):\n\
  \        try:\n            fn()\n        except InputError:\n            return\
  \ True\n        return False\n\n    def dates(rows):\n        return [e[\"date\"\
  ].isoformat() for e in F(rows).events[\"base\"]]\n\n    case(\"once lands in its\
  \ week\", lambda: F(\"Tax,out,500,once:2026-11-11,,,,,\\n\").table[\"base\"][1][\"\
  out\"] == 50000)\n    case(\"bare date means once\", lambda: dates(\"Tax,out,500,2026-11-11,,,,,\\\
  n\") == [\"2026-11-11\"])\n    case(\"weekly friday x13\", lambda: len(dates(\"\
  Sales,in,100,weekly:fri,,,,,\\n\")) == 13 and dates(\"Sales,in,100,weekly:fri,,,,,\\\
  n\")[0] == \"2026-11-06\")\n    case(\"biweekly from anchor\", lambda: dates(\"\
  Pay,out,100,biweekly:2026-11-06,,,,,\\n\")[:3] == [\"2026-11-06\", \"2026-11-20\"\
  , \"2026-12-04\"])\n    case(\"biweekly anchor before start\", lambda: dates(\"\
  Pay,out,100,biweekly:2026-10-09,,,,,\\n\")[0] == \"2026-11-06\")\n    case(\"monthly\
  \ 15th\", lambda: dates(\"Rent,out,100,monthly:15,,,,,\\n\") == [\"2026-11-15\"\
  , \"2026-12-15\", \"2027-01-15\"])\n    case(\"monthly last clamps\", lambda: dates(\"\
  Fee,out,100,monthly:last,,,,,\\n\") == [\"2026-11-30\", \"2026-12-31\", \"2027-01-31\"\
  ])\n    case(\"monthly 31 clamps to 30 Nov\", lambda: dates(\"Fee,out,100,monthly:31,,,,,\\\
  n\")[0] == \"2026-11-30\")\n    case(\"quarterly from anchor\", lambda: dates(\"\
  VAT,out,100,quarterly:2026-08-10,,,,,\\n\") == [\"2026-11-10\"])\n    case(\"yearly\
  \ in horizon\", lambda: dates(\"Ins,out,100,yearly:2026-01-15,,,,,\\n\") == [\"\
  2027-01-15\"])\n    case(\"start/end bounds\", lambda: dates(\"Rent,out,100,monthly:1,2026-12-01,2026-12-31,,,\\\
  n\") == [\"2026-12-01\"])\n    case(\"net terms + ar delay\", lambda: Forecast(\"\
  # start: 2026-11-02\\n# ar_delay_days: 10\\n# opening_balance: 0\\nitem,kind,amount,schedule,start\\\
  nINV,in,100,net:30,2026-10-20\\n\").events[\"base\"][0][\"date\"].isoformat() ==\
  \ \"2026-11-29\")\n    case(\"overdue receivable in week 1\", lambda: (lambda f:\
  \ f.events[\"base\"][0][\"week\"] == 0 and \"overdue\" in f.events[\"base\"][0][\"\
  note\"])(F(\"INV,in,100,net:30,2026-08-01,,,,\\n\")))\n    case(\"probability weighting\"\
  , lambda: F(\"Deal,in,1000,once:2026-11-05,,,40,,\\n\").table[\"base\"][0][\"in\"\
  ] == 40000)\n    case(\"stress drops unlikely receipts\", lambda: F(\"Deal,in,1000,once:2026-11-05,,,40,,\\\
  n\").table[\"stress\"][0][\"in\"] == 0)\n    case(\"stress cuts recurring receipts\"\
  , lambda: F(\"Sales,in,100,weekly:fri,,,,,\\n\").table[\"stress\"][0][\"in\"] ==\
  \ 8000)\n    case(\"stress delays invoices\", lambda: (lambda f: f.events[\"stress\"\
  ][0][\"date\"] - f.events[\"base\"][0][\"date\"] == dt.timedelta(days=14))(F(\"\
  INV,in,100,net:30,2026-10-20,,,,\\n\")))\n    case(\"balances roll forward\", lambda:\
  \ (lambda t: t[0][\"closing\"] == 1000000 + 10000 and t[1][\"opening\"] == t[0][\"\
  closing\"])(F(\"Sales,in,100,weekly:fri,,,,,\\n\").table[\"base\"]))\n    case(\"\
  low point and first below\", lambda: (lambda f: f.low(\"base\")[\"week\"] == 3 and\
  \ f.first_below(\"base\", f.min_balance)[\"week\"] == 3)(F(\"Big,out,9000,once:2026-11-18,,,,,\\\
  nBack,in,9000,once:2026-11-25,,,,,\\n\")))\n    case(\"verdict flags below min\"\
  , lambda: F(\"Big,out,9000,once:2026-11-18,,,,,\\n\").worst_flag())\n    case(\"\
  covered when fine\", lambda: not F(\"Small,out,100,once:2026-11-18,,,,,\\n\").worst_flag())\n\
  \    case(\"run-rate recurring only\", lambda: F(\"Sales,in,100,weekly:fri,,,,,\\\
  nOne,out,5000,once:2026-11-20,,,,,\\n\").run_rate() == 10000)\n    case(\"runway\
  \ weeks when burning\", lambda: (lambda f: f.runway()[0] is not None and f.runway()[1]\
  \ < 0)(F(\"Rent,out,1000,monthly:1,,,,,\\n\")))\n    case(\"flex levers before low\
  \ point\", lambda: (lambda f: [e[\"item\"] for e in f.levers()[1]] == [\"Laptop\"\
  ])(F(\"Laptop,out,2000,once:2026-11-04,,,,yes,\\nBig,out,9000,once:2026-11-18,,,,,\\\
  n\")))\n    case(\"unquoted commas go to notes with a warning\", lambda: (lambda\
  \ f: any(\"more field\" in w for w in f.warnings) and f.items[0][\"notes\"] == \"\
  a,b\")(F(\"X,out,1,once:2026-11-05,,,,,a,b\\n\")))\n    case(\"money parsing with\
  \ commas\", lambda: money(\"12,400.50\", \"x\") == 1240050)\n    case(\"bad kind\
  \ rejected\", lambda: raises(lambda: F(\"X,maybe,10,once:2026-11-05,,,,,\\n\")))\n\
  \    case(\"negative amount rejected\", lambda: raises(lambda: F(\"X,out,-10,once:2026-11-05,,,,,\\\
  n\")))\n    case(\"unknown schedule rejected\", lambda: raises(lambda: F(\"X,out,10,fortnightly:2026-11-05,,,,,\\\
  n\")))\n    case(\"net without invoice date rejected\", lambda: raises(lambda: F(\"\
  X,in,10,net:30,,,,,\\n\")))\n    case(\"bad probability rejected\", lambda: raises(lambda:\
  \ F(\"X,in,10,once:2026-11-05,,,120,,\\n\")))\n    case(\"missing columns rejected\"\
  , lambda: raises(lambda: Forecast(\"# start: 2026-11-02\\nname,value\\na,1\\n\"\
  )))\n    case(\"non-Monday start warns\", lambda: any(\"not a Monday\" in w for\
  \ w in F(\"X,out,1,once:2026-11-05,,,,,\\n\", start=\"2026-11-04\").warnings))\n\
  \    case(\"duplicate warning\", lambda: any(\"duplicate\" in w for w in F(\"X,out,1,once:2026-11-05,,,,,\\\
  nX,out,1,once:2026-11-05,,,,,\\n\").warnings))\n    case(\"items after horizon counted\"\
  , lambda: F(\"Later,out,10,once:2027-06-01,,,,,\\n\").beyond == 1)\n    case(\"\
  CLI overrides opening\", lambda: F(\"X,out,1,once:2026-11-05,,,,,\\n\", opening=\"\
  500\").opening == 50000)\n    case(\"render sections\", lambda: all(s in render(F(\"\
  Rent,out,1000,monthly:1,,,,yes,\\n\")) for s in (\"## Weekly forecast\", \"## Key\
  \ numbers\", \"## Levers\")))\n    case(\"json output\", lambda: json.dumps(as_json(F(\"\
  Rent,out,1000,monthly:1,,,,,\\n\"))) and as_json(F(\"Rent,out,1000,monthly:1,,,,,\\\
  n\"))[\"low_base\"][\"closing\"] == 1000000 - 200000)\n    case(\"format\", lambda:\
  \ fmt(123456789) == \"1,234,567\" and fmtc(-123456, \"EUR\") == \"-1,234.56 EUR\"\
  )\n\n    passed = sum(1 for _, ok, _ in cases if ok)\n    for name, ok, err in cases:\n\
  \        print((\"PASS \" if ok else \"FAIL \") + name + ((\" \" + err) if err else\
  \ \"\"))\n    print(\"%d/%d passed\" % (passed, len(cases)))\n    return 0 if passed\
  \ == len(cases) else 1\n\n\ndef main(argv=None):\n    ap = argparse.ArgumentParser(description=\"\
  13-week cash flow forecast with base and stress cases.\")\n    ap.add_argument(\"\
  file\", nargs=\"?\", help=\"CSV of receipts and payments ('-' = stdin)\")\n    ap.add_argument(\"\
  --opening\", default=None, help=\"opening cash (overrides '# opening_balance:')\"\
  )\n    ap.add_argument(\"--min\", dest=\"min_balance\", default=None, help=\"minimum\
  \ cash buffer\")\n    ap.add_argument(\"--weeks\", type=int, default=None)\n   \
  \ ap.add_argument(\"--start\", default=None, help=\"first Monday (YYYY-MM-DD; default:\
  \ '# start:' or next Monday)\")\n    ap.add_argument(\"--stress-cut\", type=float,\
  \ default=20, help=\"%% cut to recurring receipts in the stress case\")\n    ap.add_argument(\"\
  --stress-delay\", type=int, default=14, help=\"extra days late for invoices in the\
  \ stress case\")\n    ap.add_argument(\"--week\", type=int, default=None, help=\"\
  show the item list for this week (default: base low week)\")\n    ap.add_argument(\"\
  --json\", action=\"store_true\")\n    ap.add_argument(\"--self-test\", action=\"\
  store_true\")\n    a = ap.parse_args(argv)\n    if a.self_test:\n        return\
  \ self_test()\n    if not a.file:\n        ap.error(\"give a CSV file or --self-test\"\
  )\n    try:\n        text = sys.stdin.read() if a.file == \"-\" else open(a.file,\
  \ encoding=\"utf-8-sig\").read()\n        fc = Forecast(text, a.opening, a.min_balance,\
  \ a.weeks, a.start, a.stress_cut, a.stress_delay)\n        out = json.dumps(as_json(fc),\
  \ indent=2) + \"\\n\" if a.json else render(fc, a.week)\n    except (OSError, ValueError)\
  \ as e:\n        print(\"error: %s\" % e, file=sys.stderr)\n        return 2\n \
  \   sys.stdout.write(out)\n    return 1 if fc.worst_flag() else 0\n\n\nif __name__\
  \ == \"__main__\":\n    sys.exit(main())"
