  \ = []\n        self.meta = {\"business\": \"\", \"currency\": \"\", \"ar_delay_days\"\
  : 0, \"credit_line\": 0}\n        body = []\n        for raw in text.splitlines():\n\
  \            m = re.match(r\"\\s*#\\s*([a-z_ ]+?)\\s*:\\s*(.*?)\\s*$\", raw, re.I)\n\
