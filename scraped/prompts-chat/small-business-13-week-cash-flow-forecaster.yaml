  \ | <4,800> | <3> | <...> | <date> |\n| 4 | <Confirm Atlas milestone sign-off date,\
  \ invoice same day> | <22,000> | <10> | <...> | <date> |\n\n**After actions:** base\
  \ low <...> in week <...>; stress low <...>; credit line needed <...> for weeks\
