  \ = base and stress stay at or above the minimum balance, 1 = cash drops below the\n\
  minimum (or below zero) in either case, 2 = bad input.\n\"\"\"\nimport argparse\n\
  import calendar\nimport csv\nimport datetime as dt\nimport io\nimport json\nimport\
  \ re\nimport sys\nfrom decimal import Decimal, InvalidOperation, ROUND_HALF_UP\n\
  \nDAYS = {\"mon\": 0, \"tue\": 1, \"wed\": 2, \"thu\": 3, \"fri\": 4, \"sat\": 5,\
