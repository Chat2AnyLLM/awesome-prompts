slug: python-exception-handling-smell-finder
title: Python Exception Handling Smell Finder
description: Imported from Prompts Chat
prompt: "---\nname: python-exception-handling-smell-finder\ndescription: Finds risky\
  \ exception handling in Python code offline: bare and swallowed excepts, errors\
  \ turned into silent return values, raise without from, caught KeyboardInterrupt,\
  \ return in finally, logs without traceback and oversized try blocks, with file:line,\
  \ severity and fix recipes. Stdlib Python.\n---\n\n# Python Exception Handling Smell\
  \ Finder\n\nYou help developers find the places where a Python codebase hides its\
  \ own failures: `except: pass`, broad handlers that return `None` or `[]`, re-raised\
  \ errors that lose their cause, logs without a traceback, `return` inside `finally`,\
  \ and workers that swallow Ctrl+C. These smells turn crashes that would be fixed\
  \ in a day into silent data loss that is found weeks later. You scan the code, explain\
  \ which findings can really hurt in production, and propose small, safe fixes.\n\
  \nYou work on the user's code locally and never upload it. The script only parses\
  \ files with `ast`; it never imports or runs project code. You suggest changes and\
  \ explain the behavior difference (which errors will now propagate), but you do\
  \ not rewrite large parts of the code without the user's go-ahead.\n\n## Files in\
  \ this skill\n\n- `scripts/exception_smells.py` - scans files or folders (skips\
  \ venvs, build and cache folders) and reports EX01-EX08 with file:line, severity,\
  \ the source line and a fix hint; `--format text|json|md`, `--min-severity`, `--ignore\
  \ EX07,EX08`, `--max-try-statements N`, inline `# smell: ignore[EX03]` comments;\
  \ `--self-test` runs 23 checks (Python 3.8+ standard library only)\n- `references/smell-catalog.md`\
  \ - every code, why it hurts, what is deliberately not reported, and the known limits\
  \ of static analysis\n- `references/fix-recipes.md` - eight before/after fixes:\
  \ narrow the type, `raise ... from err`, `logger.exception`, cleanup-only `finally`,\
  \ letting shutdown signals through, smaller try blocks, loud retries, visible catch-all\
  \ boundaries\n- `templates/exception-report.md` - the review summary you hand back\n\
  - `examples/sync_orders.py` - a fictional nightly order sync with eight findings\
  \ (3 high); `examples/sync_orders_fixed.py` - the same job with every smell fixed\
  \ (0 findings)\n\n## Workflow\n\n### 1. Scope\nAsk what to scan (a PR diff, a package,\
  \ a whole repo), the Python version, how the code reports errors today (logging\
  \ setup, error tracker such as Sentry) and whether any module is a deliberate catch-all\
  \ boundary (web handler, job runner, CLI `main`). For a PR, scan only the changed\
  \ files first.\n\n### 2. Run the scanner\n```\npython3 scripts/exception_smells.py\
  \ path/to/package\npython3 scripts/exception_smells.py src tests --min-severity\
  \ medium\npython3 scripts/exception_smells.py src --format md > exception-report-table.md\n\
  python3 scripts/exception_smells.py --self-test\n```\nExit 0 = no high findings,\
  \ 1 = at least one high finding, 2 = bad input. Without a shell, search the code\
  \ for `except:`, `except Exception`, `except BaseException`, `finally:` and `raise\
  \ ` inside except blocks, and apply `references/smell-catalog.md` by hand.\n\n###\
  \ 3. Triage\nRead each finding in context before proposing a fix:\n- **High (EX01,\
  \ EX02, EX05, EX06)**: fix these first; they hide failures or break shutdown.\n\
  - **Medium (EX03, EX04)**: fix when the function is not a deliberate boundary; at\
  \ a boundary, make sure it logs with a traceback.\n- **Low (EX07, EX08)**: cheap\
  \ improvements; batch them or suppress with a reason.\n- Ask \"what did the author\
  \ expect to fail here?\" and narrow the handler to that type.\n- Mark a finding\
  \ as accepted only with a reason, and add `# smell: ignore[CODE] - reason` on the\
  \ line.\n\n### 4. Fix\nUse `references/fix-recipes.md`. Keep each change small and\
  \ explain the new behavior: \"a malformed `sync.json` now raises `JSONDecodeError`\
  \ instead of silently using defaults\". Suggest a test for every error path that\
  \ now propagates.\n\n### 5. Verify\nRe-run the scanner until no high findings remain,\
  \ run the test suite, and check that a forced failure now shows up in logs with\
  \ a traceback. Suggest adding the scanner to CI with `--min-severity high` so new\
  \ swallowed errors fail the build.\n\n### 6. Report\nFill `templates/exception-report.md`:\
  \ counts, the fixes for high and medium findings, accepted findings with reasons,\
  \ behavior changes and what was verified.\n\n## Rules\n- Never execute or import\
  \ the user's code to analyze it.\n- Do not \"fix\" a smell by catching more broadly\
  \ or adding `# smell: ignore` without a reason.\n- A narrow `except SomeError: pass`\
  \ can be correct; do not flag it as a bug without context.\n- Call out that static\
  \ analysis cannot see which exceptions a call raises or how custom logging wrappers\
  \ behave.\n\n\x1FFILE:references/smell-catalog.md\x1E\n# Exception handling smell\
  \ catalog\n\nEach code below is reported by `scripts/exception_smells.py`. Severity\
  \ says how likely the smell is to hide a real failure in production, not how ugly\
  \ it looks.\n\n| Code | Severity | Smell | Why it hurts |\n|---|---|---|---|\n|\
  \ EX01 | high | bare `except:` | Also catches `KeyboardInterrupt`, `SystemExit`\
  \ and `GeneratorExit`, so Ctrl+C, `sys.exit()` and clean shutdown stop working,\
  \ and every bug inside the try becomes \"handled\". |\n| EX02 | high | broad except\
  \ whose body only `pass`es, `continue`s or returns a constant | The error disappears\
  \ without a log line, metric or return signal. The caller sees success. This is\
  \ the classic \"it silently did nothing\" bug. |\n| EX03 | medium | broad except\
  \ that neither re-raises nor logs | The error is turned into a normal value (`None`,\
  \ `[]`, `{\"ok\": False}`) that callers often ignore. Not always wrong at a boundary,\
  \ but it must be deliberate and visible. |\n| EX04 | medium | `raise NewError(...)`\
  \ inside `except` without `from` | Python still shows \"During handling of the above\
  \ exception, another exception occurred\", but the link reads like a second bug.\
  \ `raise ... from err` states the cause; `from None` hides it on purpose (for example\
  \ to avoid leaking secrets). |\n| EX05 | high | `except BaseException` / `KeyboardInterrupt`\
  \ / `SystemExit` without re-raise | Swallows shutdown signals. Workers that ignore\
  \ SIGINT or `sys.exit()` hang deploys and leave half-finished work. |\n| EX06 |\
  \ high | `return`, `break` or `continue` inside `finally` | Silently cancels any\
  \ exception raised in the try or except block, including ones you never expected.\
  \ Python 3.14 warns about this (PEP 765). |\n| EX07 | low | `logger.error(...)`\
  \ / `warning` in `except` without traceback | The message says what failed but not\
  \ where. Use `logger.exception(...)` (ERROR level with traceback) or pass `exc_info=True`.\
  \ |\n| EX08 | low | broad except around a large try body (default > 8 statements)\
  \ | One handler covers many operations, so a bug in any of them is treated like\
  \ the expected failure. Wrap only the call that can fail. |\n| EX00 | error | file\
  \ could not be parsed | Syntax error or a newer syntax than the running Python;\
  \ the file was not checked. |\n\n## What is NOT reported\n- Narrow handlers that\
  \ pass: `except FileNotFoundError: pass` is often correct (for example optional\
  \ config). Review them, but they are not smells by default.\n- Handlers that re-raise\
  \ (`raise`, `raise err`, `raise X from err`).\n- Handlers that log with a traceback\
  \ or report to an error tracker (`logger.exception`, `exc_info=True`, `sentry_sdk.capture_exception`,\
  \ `traceback.print_exc`).\n- `break` / `continue` inside a loop that itself lives\
  \ in the `finally` block.\n\n## Known limits\n- Static analysis only: the scanner\
  \ cannot know which exceptions a call raises, whether a custom logger wrapper logs\
  \ tracebacks, or whether a returned error value is checked by callers.\n- Logger\
  \ detection is by name (`log`, `logger`, `logging`, `LOG`, `_logger`, `self.logger`,\
  \ ...). A differently named logger looks like \"no logging\" and may produce EX03\
  \ instead of EX07.\n- `contextlib.suppress(Exception)` is not reported; search for\
  \ it separately if the codebase uses it.\n\n## Suppressing a finding on purpose\n\
  Add a trailing comment on the reported line with a reason in the code review:\n\n\
  ```python\nexcept Exception:  # smell: ignore[EX03] - top-level boundary, error\
  \ returned to the API client as 500\n```\n\n\x1FFILE:references/fix-recipes.md\x1E\
  \n# Fix recipes\n\nPick the smallest change that makes the failure visible to the\
  \ right place: the caller, the log, or the user.\n\n## 1. Catch what you expect,\
  \ let the rest propagate (EX01, EX02, EX03)\n```python\n# before\ntry:\n    cfg\
  \ = json.load(open(path))\nexcept:\n    cfg = {}\n\n# after\ntry:\n    with open(path)\
  \ as fh:\n        cfg = json.load(fh)\nexcept FileNotFoundError:\n    logger.info(\"\
  no %s, using defaults\", path)\n    cfg = {}\n# a broken JSON file now raises json.JSONDecodeError\
  \ instead of silently using defaults\n```\nAsk: \"Which failure did the author have\
  \ in mind?\" Catch exactly that type.\n\n## 2. Keep the cause when translating errors\
  \ (EX04)\n```python\nexcept KeyError as err:\n    raise OrderError(f\"order {order_id}\
  \ is missing {err}\") from err\n```\nUse `from None` only when the original exception\
  \ would leak secrets or confuse the user, and say so in a comment.\n\n## 3. Log\
  \ with the traceback, once (EX07)\n```python\nexcept PaymentError:\n    logger.exception(\"\
  payment %s failed\", payment_id)   # ERROR level + traceback\n    raise\n```\nLog\
  \ at the boundary that handles the error, not at every layer it passes through (otherwise\
  \ one failure becomes five log lines).\n\n## 4. Never return from finally (EX06)\n\
  ```python\n# before\ntry:\n    process()\nfinally:\n    if pushed == 0:\n      \
  \  return {\"ok\": True}\n\n# after\ntry:\n    process()\nfinally:\n    client.close()\
  \          # cleanup only\nreturn {\"ok\": True, \"pushed\": pushed}\n```\n`finally`\
  \ is for cleanup. Move results and decisions after the try statement.\n\n## 5. Let\
  \ shutdown signals through (EX05)\n```python\nexcept KeyboardInterrupt:\n    save_checkpoint()\n\
  \    raise\n```\nIn worker loops, catch `Exception` for per-item failures and let\
  \ `BaseException` subclasses stop the process.\n\n## 6. Shrink the try body (EX08)\n\
  Wrap only the line that can raise the expected error. Put the \"happy path\" after\
  \ the try in an `else:` block or after the statement.\n\n```python\ntry:\n    resp\
  \ = session.get(url, timeout=10)\nexcept requests.RequestException as err:\n   \
  \ raise FetchError(url) from err\nelse:\n    data = resp.json()\n```\n\n## 7. Retries:\
  \ fail loudly after the last attempt\n```python\nfor attempt in range(3):\n    try:\n\
  \        return client.send(msg)\n    except (ConnectionError, TimeoutError):\n\
  \        logger.debug(\"retry %d\", attempt + 1)\n        time.sleep(2 ** attempt)\n\
  raise DeliveryError(f\"message {msg.id} not sent after 3 attempts\")\n```\n\n##\
  \ 8. Boundaries are allowed to catch everything, visibly\nA web request handler,\
  \ a job runner or a CLI `main()` may catch `Exception` to turn it into a 500 response,\
  \ a failed job status or exit code 1, as long as it logs with the traceback (or\
  \ reports to the error tracker) and does not hide `KeyboardInterrupt`/`SystemExit`.\n\
  \n\x1FFILE:templates/exception-report.md\x1E\n# Exception handling review: {{project_or_pr}}\n\
  \n**Scanned:** {{files_scanned}} files ({{paths}}) on {{date}}, `exception_smells.py`\
  \ {{options}}\n**Result:** {{high}} high, {{medium}} medium, {{low}} low, {{parse_errors}}\
  \ parse errors\n\n## Fix first (high)\n| # | Location | Code | What can go wrong\
  \ in production | Proposed fix |\n|---|---|---|---|---|\n| 1 | `{{file}}:{{line}}`\
  \ | {{code}} | {{impact}} | {{fix}} |\n\n## Fix in this PR if cheap (medium)\n|\
  \ # | Location | Code | Proposed fix |\n|---|---|---|---|\n| 1 | `{{file}}:{{line}}`\
  \ | {{code}} | {{fix}} |\n\n## Low / accepted on purpose\n- `{{file}}:{{line}}`\
  \ {{code}}: {{reason it is fine, or suppress comment added}}\n\n## Behavior changes\
  \ to check\n- {{which errors now propagate instead of being swallowed, and who handles\
  \ them}}\n- {{tests added or updated: e.g. a test that a broken config file now\
  \ raises}}\n\n## Verified\n- [ ] Re-ran the scanner: no high findings left (exit\
  \ 0)\n- [ ] Test suite passes\n- [ ] Logs now include a traceback for {{failure}}\n\
  \n\x1FFILE:examples/sync_orders.py\x1E\n\"\"\"Fictional nightly job that copies\
  \ new web-shop orders into the accounting system.\nIt runs, but its exception handling\
  \ hides real failures. Used to demo exception_smells.py.\"\"\"\nimport json\nimport\
  \ logging\nimport time\n\nimport requests  # third-party; the scanner never imports\
  \ it\n\nlogger = logging.getLogger(__name__)\nAPI = \"https://shop.example.com/api/orders\"\
  \n\n\nclass SyncError(Exception):\n    pass\n\n\ndef load_config(path):\n    try:\n\
  \        with open(path) as fh:\n            return json.load(fh)\n    except:\n\
  \        return {}\n\n\ndef fetch_orders(since):\n    try:\n        resp = requests.get(API,\
  \ params={\"since\": since}, timeout=10)\n        resp.raise_for_status()\n    \
  \    return resp.json()[\"orders\"]\n    except Exception as err:\n        logger.error(\"\
  could not fetch orders: %s\", err)\n        return []\n\n\ndef to_invoice(order):\n\
  \    try:\n        return {\"number\": order[\"id\"], \"total\": round(float(order[\"\
  total\"]), 2), \"currency\": order[\"currency\"]}\n    except KeyError:\n      \
  \  raise SyncError(\"order is missing a field\")\n\n\ndef push_invoice(client, invoice):\n\
  \    for attempt in range(3):\n        try:\n            client.create_invoice(invoice)\n\
  \            return True\n        except Exception:\n            time.sleep(2 **\
  \ attempt)\n            continue\n    return False\n\n\ndef run(client, since):\n\
  \    pushed = 0\n    try:\n        config = load_config(\"sync.json\")\n       \
  \ orders = fetch_orders(since)\n        batch = config.get(\"batch_size\", 50)\n\
  \        for order in orders[:batch]:\n            invoice = to_invoice(order)\n\
  \            if push_invoice(client, invoice):\n                pushed += 1\n  \
  \      client.commit()\n        logger.info(\"pushed %d invoices\", pushed)\n  \
  \      client.close()\n    except Exception as e:\n        status = {\"ok\": False,\
  \ \"error\": str(e)}\n        return status\n    finally:\n        if pushed ==\
  \ 0:\n            return {\"ok\": True, \"pushed\": 0}\n    return {\"ok\": True,\
  \ \"pushed\": pushed}\n\n\ndef main():\n    try:\n        run(client=None, since=\"\
  2026-11-23\")\n    except BaseException:\n        logger.exception(\"sync failed\"\
  )\n\n\x1FFILE:examples/sync_orders_fixed.py\x1E\n\"\"\"The same nightly order sync\
  \ with the smells fixed. exception_smells.py reports nothing here.\"\"\"\nimport\
  \ json\nimport logging\nimport time\n\nimport requests  # third-party; the scanner\
  \ never imports it\n\nlogger = logging.getLogger(__name__)\nAPI = \"https://shop.example.com/api/orders\"\
  \n\n\nclass SyncError(Exception):\n    pass\n\n\ndef load_config(path):\n    try:\n\
  \        with open(path) as fh:\n            return json.load(fh)\n    except FileNotFoundError:\n\
  \        logger.info(\"no %s, using defaults\", path)\n        return {}\n\n\ndef\
  \ fetch_orders(since):\n    try:\n        resp = requests.get(API, params={\"since\"\
  : since}, timeout=10)\n        resp.raise_for_status()\n    except requests.RequestException\
  \ as err:\n        raise SyncError(\"could not fetch orders since %s\" % since)\
  \ from err\n    return resp.json()[\"orders\"]\n\n\ndef to_invoice(order):\n   \
  \ try:\n        return {\"number\": order[\"id\"], \"total\": round(float(order[\"\
  total\"]), 2), \"currency\": order[\"currency\"]}\n    except KeyError as err:\n\
  \        raise SyncError(\"order %s is missing field %s\" % (order.get(\"id\", \"\
  ?\"), err)) from err\n\n\ndef push_invoice(client, invoice, retryable=(ConnectionError,\
  \ TimeoutError)):\n    for attempt in range(3):\n        try:\n            client.create_invoice(invoice)\n\
  \            return\n        except retryable:\n            logger.debug(\"retry\
  \ %d for invoice %s\", attempt + 1, invoice[\"number\"])\n            time.sleep(2\
  \ ** attempt)\n    raise SyncError(\"invoice %s not pushed after 3 attempts\" %\
  \ invoice[\"number\"])\n\n\ndef run(client, since):\n    config = load_config(\"\
  sync.json\")\n    orders = fetch_orders(since)\n    batch = config.get(\"batch_size\"\
  , 50)\n    pushed, failed = 0, []\n    for order in orders[:batch]:\n        try:\n\
  \            push_invoice(client, to_invoice(order))\n            pushed += 1\n\
  \        except SyncError:\n            logger.exception(\"order %s skipped\", order.get(\"\
  id\", \"?\"))\n            failed.append(order.get(\"id\"))\n    try:\n        client.commit()\n\
  \    finally:\n        client.close()\n    logger.info(\"pushed %d invoices, %d\
  \ failed\", pushed, len(failed))\n    return {\"ok\": not failed, \"pushed\": pushed,\
  \ \"failed\": failed}\n\n\ndef main():\n    try:\n        run(client=None, since=\"\
  2026-11-23\")\n    except SyncError:\n        logger.exception(\"sync failed\")\n\
  \        raise\n\n\x1FFILE:scripts/exception_smells.py\x1E\n#!/usr/bin/env python3\n\
  \"\"\"exception_smells.py - find risky exception handling in Python code, offline.\n\
  \nParses files with the standard library `ast` module (it never imports or runs\
  \ the code) and reports:\n  EX01 high    bare `except:` (also catches KeyboardInterrupt\
  \ and SystemExit)\n  EX02 high    broad except whose body only passes / continues\
  \ / returns (error silently swallowed)\n  EX03 medium  broad except that neither\
  \ re-raises nor logs (error turned into a normal value)\n  EX04 medium  new exception\
  \ raised inside `except` without `from` (original cause hidden)\n  EX05 high   \
  \ `except BaseException` (or KeyboardInterrupt / SystemExit) without re-raise\n\
  \  EX06 high    return / break / continue inside `finally` (silently cancels any\
  \ exception)\n  EX07 low     error logged in `except` without the traceback (no\
  \ exc_info / logger.exception)\n  EX08 low     broad except around a large try body\
  \ (hides which statement failed)\n  EX00 error   file could not be parsed\n\nUsage:\n\
  \  python3 exception_smells.py PATH [PATH ...] [--format text|json|md] [--min-severity\
  \ low|medium|high]\n                              [--ignore EX07,EX08] [--max-try-statements\
  \ 8]\n  python3 exception_smells.py --self-test\nSuppress one finding with a trailing\
  \ comment on the `except` / `raise` / `finally` line: `# smell: ignore[EX03]`.\n\
  Exit codes: 0 = no high findings, 1 = at least one high finding, 2 = bad input.\n\
  Standard library only, Python 3.8+.\n\"\"\"\nimport argparse, ast, json, os, re,\
  \ sys, tempfile, textwrap\n\nSEVERITY = {\"EX00\": \"error\", \"EX01\": \"high\"\
  , \"EX02\": \"high\", \"EX03\": \"medium\", \"EX04\": \"medium\",\n            \"\
  EX05\": \"high\", \"EX06\": \"high\", \"EX07\": \"low\", \"EX08\": \"low\"}\nTITLE\
  \ = {\"EX00\": \"file could not be parsed\",\n         \"EX01\": \"bare except\"\
  ,\n         \"EX02\": \"broad except swallows the error\",\n         \"EX03\": \"\
  broad except neither re-raises nor logs\",\n         \"EX04\": \"raise inside except\
  \ without 'from'\",\n         \"EX05\": \"catches BaseException / KeyboardInterrupt\
  \ / SystemExit without re-raise\",\n         \"EX06\": \"return/break/continue in\
  \ finally cancels exceptions\",\n         \"EX07\": \"error logged without traceback\"\
  ,\n         \"EX08\": \"broad except around a large try body\"}\nRANK = {\"low\"\
  : 0, \"medium\": 1, \"high\": 2, \"error\": 3}\nBROAD = {\"Exception\", \"BaseException\"\
  }\nSYSTEM = {\"BaseException\", \"KeyboardInterrupt\", \"SystemExit\", \"GeneratorExit\"\
  }\nLOG_METHODS = {\"debug\", \"info\", \"warning\", \"warn\", \"error\", \"exception\"\
  , \"critical\", \"fatal\", \"log\"}\nLOGGER_NAMES = re.compile(r\"(^|_)(log|logger|logging|logs|_log|_logger|LOG|LOGGER)$\"\
  )\nSKIP_DIRS = {\".git\", \".hg\", \".venv\", \"venv\", \"env\", \"__pycache__\"\
  , \"node_modules\", \"build\", \"dist\", \".tox\", \".mypy_cache\", \"site-packages\"\
  }\nIGNORE_RE = re.compile(r\"#\\s*smell:\\s*ignore\\[([A-Z0-9, ]+)\\]\")\n\n\ndef\
  \ type_names(node):\n    \"\"\"Names of the exception classes an except handler\
  \ catches ([] for bare except).\"\"\"\n    if node is None:\n        return []\n\
  \    items = node.elts if isinstance(node, ast.Tuple) else [node]\n    out = []\n\
  \    for it in items:\n        if isinstance(it, ast.Name):\n            out.append(it.id)\n\
  \        elif isinstance(it, ast.Attribute):\n            out.append(it.attr)\n\
  \        else:\n            out.append(\"?\")\n    return out\n\n\ndef walk_no_nested(nodes):\n\
  \    \"\"\"Walk statements but do not descend into nested functions, classes or\
  \ lambdas.\"\"\"\n    stack = list(nodes)\n    while stack:\n        n = stack.pop()\n\
  \        yield n\n        for child in ast.iter_child_nodes(n):\n            if\
  \ isinstance(child, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef, ast.Lambda)):\n\
  \                continue\n            stack.append(child)\n\n\ndef is_log_call(call):\n\
  \    if not isinstance(call, ast.Call):\n        return False\n    f = call.func\n\
  \    if isinstance(f, ast.Attribute) and f.attr in LOG_METHODS:\n        base =\
  \ f.value\n        name = base.id if isinstance(base, ast.Name) else (base.attr\
  \ if isinstance(base, ast.Attribute) else \"\")\n        return bool(LOGGER_NAMES.search(name))\n\
  \    return False\n\n\ndef has_traceback(call):\n    f = call.func\n    if isinstance(f,\
  \ ast.Attribute) and f.attr == \"exception\":\n        return True\n    for kw in\
  \ call.keywords:\n        if kw.arg in (\"exc_info\", \"stack_info\") and not (isinstance(kw.value,\
  \ ast.Constant) and kw.value.value in (False, None)):\n            return True\n\
  \    return False\n\n\ndef handler_facts(h):\n    body = list(walk_no_nested(h.body))\n\
  \    reraises = any(isinstance(n, ast.Raise) for n in body)\n    logs = [n for n\
  \ in body if is_log_call(n)]\n    reports = any(isinstance(n, ast.Call) and (\n\
  \        (isinstance(n.func, ast.Attribute) and n.func.attr in (\"capture_exception\"\
  , \"print_exc\", \"format_exc\", \"notify\", \"report_exc\"))\n        or (isinstance(n.func,\
  \ ast.Name) and n.func.id in (\"capture_exception\", \"print_exc\"))) for n in body)\n\
  \    trivial = all(isinstance(s, (ast.Pass, ast.Continue, ast.Break)) or\n     \
  \             (isinstance(s, ast.Expr) and isinstance(s.value, ast.Constant)) or\n\
  \                  (isinstance(s, ast.Return) and (s.value is None or isinstance(s.value,\
  \ ast.Constant)))\n                  for s in h.body)\n    return reraises, logs,\
  \ reports, trivial\n\n\nclass Finder(ast.NodeVisitor):\n    def __init__(self, path,\
  \ lines, max_try):\n        self.path, self.lines, self.max_try = path, lines, max_try\n\
  \        self.found = []\n        self.handler_stack = []\n\n    def add(self, code,\
  \ node, detail):\n        line = getattr(node, \"lineno\", 0)\n        src = self.lines[line\
  \ - 1] if 0 < line <= len(self.lines) else \"\"\n        m = IGNORE_RE.search(src)\n\
  \        if m and code in [c.strip() for c in m.group(1).split(\",\")]:\n      \
  \      return\n        self.found.append({\"code\": code, \"severity\": SEVERITY[code],\
  \ \"file\": self.path, \"line\": line,\n                           \"title\": TITLE[code],\
  \ \"detail\": detail, \"source\": src.strip()})\n\n    def visit_Try(self, node):\n\
  \        n_body = sum(1 for _ in walk_no_nested(node.body) if isinstance(_, ast.stmt))\n\
  \        for h in node.handlers:\n            names = type_names(h.type)\n     \
  \       reraises, logs, reports, trivial = handler_facts(h)\n            broad =\
  \ (not names) or any(n in BROAD for n in names)\n            if not names:\n   \
  \             self.add(\"EX01\", h, \"use `except Exception:` (or narrower) so Ctrl+C\
  \ and sys.exit() still work\" + (\"\" if reraises else \"; the error is not re-raised\"\
  ))\n            elif any(n in SYSTEM for n in names) and not reraises:\n       \
  \         self.add(\"EX05\", h, \"catches %s; re-raise it or catch Exception instead\"\
  \ % \", \".join(n for n in names if n in SYSTEM))\n            if broad and trivial\
  \ and not reraises:\n                self.add(\"EX02\", h, \"the handler body only\
  \ passes/continues/returns a constant; the error disappears without a trace\")\n\
  \            elif broad and not reraises and not logs and not reports and names:\n\
  \                self.add(\"EX03\", h, \"the error becomes a normal return value;\
  \ log it, re-raise it, or catch a narrower type\")\n            for call in logs:\n\
  \                if call.func.attr in (\"error\", \"critical\", \"fatal\", \"warning\"\
  , \"warn\") and not has_traceback(call) and not reraises:\n                    self.add(\"\
  EX07\", call, \"add exc_info=True or use logger.exception(...) so the traceback\
  \ is kept\")\n            if broad and n_body > self.max_try:\n                self.add(\"\
  EX08\", h, \"try body has %d statements; wrap only the call that can fail\" % n_body)\n\
  \            self.handler_stack.append(h)\n            for s in h.body:\n      \
  \          self.visit(s)\n            self.handler_stack.pop()\n        for part\
  \ in (node.body, node.orelse):\n            for s in part:\n                self.visit(s)\n\
  \        for s in node.finalbody:\n            self.visit(s)\n        for n in walk_no_nested(node.finalbody):\n\
  \            if isinstance(n, (ast.Return, ast.Break, ast.Continue)) and not self._inside_loop_in(node.finalbody,\
  \ n):\n                self.add(\"EX06\", n, \"`%s` in finally discards any exception\
  \ raised in the try block\" % type(n).__name__.lower())\n\n    visit_TryStar = visit_Try\n\
  \n    def _inside_loop_in(self, stmts, target):\n        \"\"\"True if a break/continue\
  \ sits inside a loop that is itself inside the finally block (that is fine).\"\"\
  \"\n        if isinstance(target, ast.Return):\n            return False\n     \
  \   for n in walk_no_nested(stmts):\n            if isinstance(n, (ast.For, ast.While,\
  \ ast.AsyncFor)):\n                if any(c is target for c in walk_no_nested(n.body\
  \ + n.orelse)):\n                    return True\n        return False\n\n    def\
  \ visit_Raise(self, node):\n        if self.handler_stack and node.exc is not None\
  \ and node.cause is None:\n            h = self.handler_stack[-1]\n            if\
  \ not (isinstance(node.exc, ast.Name) and h.name and node.exc.id == h.name):\n \
  \               self.add(\"EX04\", node, \"use `raise NewError(...) from err` (or\
  \ `from None` on purpose) to keep the cause\")\n        self.generic_visit(node)\n\
  \n    def visit_FunctionDef(self, node):\n        saved, self.handler_stack = self.handler_stack,\
  \ []\n        self.generic_visit(node)\n        self.handler_stack = saved\n\n \
  \   visit_AsyncFunctionDef = visit_FunctionDef\n    visit_Lambda = visit_FunctionDef\n\
  \n\ndef scan_source(src, path=\"<string>\", max_try=8):\n    lines = src.splitlines()\n\
  \    try:\n        tree = ast.parse(src, filename=path)\n    except SyntaxError\
  \ as e:\n        return [{\"code\": \"EX00\", \"severity\": \"error\", \"file\"\
  : path, \"line\": e.lineno or 0, \"title\": TITLE[\"EX00\"],\n                 \"\
  detail\": str(e.msg), \"source\": \"\"}]\n    f = Finder(path, lines, max_try)\n\
  \    f.visit(tree)\n    seen, out = set(), []\n    for x in sorted(f.found, key=lambda\
  \ x: (x[\"line\"], x[\"code\"])):\n        k = (x[\"code\"], x[\"line\"])\n    \
  \    if k not in seen:\n            seen.add(k)\n            out.append(x)\n   \
  \ return out\n\n\ndef iter_files(paths):\n    for p in paths:\n        if os.path.isfile(p):\n\
  \            yield p\n        elif os.path.isdir(p):\n            for root, dirs,\
  \ files in os.walk(p):\n                dirs[:] = sorted(d for d in dirs if d not\
  \ in SKIP_DIRS and not d.endswith(\".egg-info\"))\n                for fn in sorted(files):\n\
  \                    if fn.endswith(\".py\"):\n                        yield os.path.join(root,\
  \ fn)\n        else:\n            raise FileNotFoundError(p)\n\n\ndef scan_paths(paths,\
  \ max_try=8):\n    findings, n = [], 0\n    for fp in iter_files(paths):\n     \
  \   n += 1\n        with open(fp, encoding=\"utf-8\", errors=\"replace\") as fh:\n\
  \            findings += scan_source(fh.read(), fp, max_try)\n    return n, findings\n\
  \n\ndef render(n_files, findings, fmt):\n    counts = {s: sum(1 for f in findings\
  \ if f[\"severity\"] == s) for s in (\"high\", \"medium\", \"low\", \"error\")}\n\
  \    if fmt == \"json\":\n        return json.dumps({\"files_scanned\": n_files,\
  \ \"counts\": counts, \"findings\": findings}, indent=2)\n    if fmt == \"md\":\n\
  \        out = [\"| Code | Severity | Location | Problem | Fix hint |\", \"|---|---|---|---|---|\"\
  ]\n        for f in findings:\n            out.append(\"| %s | %s | `%s:%d` | %s\
  \ | %s |\" % (f[\"code\"], f[\"severity\"], f[\"file\"], f[\"line\"], f[\"title\"\
  ], f[\"detail\"]))\n        out.append(\"\")\n        out.append(\"Files scanned:\
  \ %d. High: %d, medium: %d, low: %d, parse errors: %d.\" % (n_files, counts[\"high\"\
  ], counts[\"medium\"], counts[\"low\"], counts[\"error\"]))\n        return \"\\\
  n\".join(out)\n    out = []\n    for f in findings:\n        out.append(\"%s:%d\
  \  %s [%s] %s\" % (f[\"file\"], f[\"line\"], f[\"code\"], f[\"severity\"], f[\"\
  title\"]))\n        if f[\"source\"]:\n            out.append(\"    > \" + f[\"\
  source\"])\n        out.append(\"    hint: \" + f[\"detail\"])\n    out.append(\"\
  \")\n    out.append(\"Files scanned: %d. High: %d, medium: %d, low: %d, parse errors:\
  \ %d.\" % (n_files, counts[\"high\"], counts[\"medium\"], counts[\"low\"], counts[\"\
  error\"]))\n    return \"\\n\".join(out)\n\n\ndef self_test():\n    T = []\n\n \
  \   def codes(src, **kw):\n        return [f[\"code\"] for f in scan_source(textwrap.dedent(src),\
  \ **kw)]\n\n    def check(name, cond):\n        T.append((name, bool(cond)))\n\n\
  \    check(\"bare except is EX01\", \"EX01\" in codes(\"try:\\n    x()\\nexcept:\\\
  n    raise\\n\"))\n    check(\"bare except with pass is EX01 + EX02\", {\"EX01\"\
  , \"EX02\"} <= set(codes(\"try:\\n    x()\\nexcept:\\n    pass\\n\")))\n    check(\"\
  except Exception: pass is EX02\", codes(\"try:\\n    x()\\nexcept Exception:\\n\
  \    pass\\n\") == [\"EX02\"])\n    check(\"narrow except ValueError: pass is fine\"\
  , codes(\"try:\\n    int(s)\\nexcept ValueError:\\n    pass\\n\") == [])\n    check(\"\
  broad except returning a value without log is EX03\",\n          codes(\"def f():\\\
  n    try:\\n        return x()\\n    except Exception as e:\\n        y = str(e)\\\
  n        return {'ok': False, 'err': y}\\n\") == [\"EX03\"])\n    check(\"broad\
  \ except that logs with exception() is fine\",\n          codes(\"def f():\\n  \
  \  try:\\n        x()\\n    except Exception:\\n        logger.exception('boom')\\\
  n        return None\\n\") == [])\n    check(\"logger.error without exc_info is\
  \ EX07\",\n          codes(\"try:\\n    x()\\nexcept Exception as e:\\n    logger.error('failed:\
  \ %s', e)\\n\") == [\"EX07\"])\n    check(\"logger.error with exc_info=True is fine\"\
  ,\n          codes(\"try:\\n    x()\\nexcept Exception:\\n    log.error('failed',\
  \ exc_info=True)\\n\") == [])\n    check(\"raise without from in except is EX04\"\
  ,\n          codes(\"try:\\n    x()\\nexcept KeyError as e:\\n    raise ValueError('bad')\\\
  n\") == [\"EX04\"])\n    check(\"raise ... from err is fine\", codes(\"try:\\n \
  \   x()\\nexcept KeyError as e:\\n    raise ValueError('bad') from e\\n\") == [])\n\
  \    check(\"re-raising the caught name is fine\", codes(\"try:\\n    x()\\nexcept\
  \ KeyError as e:\\n    cleanup()\\n    raise e\\n\") == [])\n    check(\"except\
  \ BaseException without re-raise is EX05\",\n          \"EX05\" in codes(\"try:\\\
  n    x()\\nexcept BaseException:\\n    logger.exception('x')\\n\"))\n    check(\"\
  except KeyboardInterrupt with re-raise is fine\",\n          codes(\"try:\\n   \
  \ x()\\nexcept KeyboardInterrupt:\\n    cleanup()\\n    raise\\n\") == [])\n   \
  \ check(\"return in finally is EX06\", \"EX06\" in codes(\"def f():\\n    try:\\\
  n        x()\\n    finally:\\n        return 1\\n\"))\n    check(\"break inside\
  \ a loop within finally is fine\",\n          codes(\"try:\\n    x()\\nfinally:\\\
  n    for i in r:\\n        break\\n\") == [])\n    check(\"large try body with broad\
  \ except is EX08\",\n          \"EX08\" in codes(\"try:\\n\" + \"\".join(\"    a%d()\\\
  n\" % i for i in range(10)) + \"except Exception:\\n    logger.exception('x')\\\
  n    raise\\n\"))\n    check(\"--max-try-statements raises the limit\",\n      \
  \    \"EX08\" not in codes(\"try:\\n\" + \"\".join(\"    a%d()\\n\" % i for i in\
  \ range(10)) + \"except Exception:\\n    raise\\n\", max_try=20))\n    check(\"\
  inline ignore comment suppresses a code\",\n          codes(\"try:\\n    x()\\nexcept\
  \ Exception:  # smell: ignore[EX02]\\n    pass\\n\") == [])\n    check(\"nested\
  \ function raise is not attributed to outer except\",\n          codes(\"try:\\\
  n    x()\\nexcept KeyError as e:\\n    def g():\\n        raise ValueError()\\n\
  \    raise\\n\") == [])\n    check(\"syntax error reported as EX00\", codes(\"def\
  \ f(:\\n    pass\\n\") == [\"EX00\"])\n    check(\"tuple of exceptions incl. Exception\
  \ is broad\",\n          codes(\"try:\\n    x()\\nexcept (ValueError, Exception):\\\
  n    pass\\n\") == [\"EX02\"])\n    with tempfile.TemporaryDirectory() as d:\n \
  \       os.makedirs(os.path.join(d, \"pkg\")); os.makedirs(os.path.join(d, \".venv\"\
  ))\n        open(os.path.join(d, \"pkg\", \"a.py\"), \"w\").write(\"try:\\n    x()\\\
  nexcept:\\n    pass\\n\")\n        open(os.path.join(d, \".venv\", \"b.py\"), \"\
  w\").write(\"try:\\n    x()\\nexcept:\\n    pass\\n\")\n        n, fs = scan_paths([d])\n\
  \        check(\"directory scan skips .venv\", n == 1 and all(\".venv\" not in f[\"\
  file\"] for f in fs))\n        check(\"json output parses\", json.loads(render(n,\
  \ fs, \"json\"))[\"counts\"][\"high\"] == 2)\n    ok = sum(1 for _, r in T if r)\n\
  \    for name, r in T:\n        print((\"PASS  \" if r else \"FAIL  \") + name)\n\
  \    print((\"ALL PASS\" if ok == len(T) else \"FAILED\") + \" (%d/%d)\" % (ok,\
  \ len(T)))\n    return 0 if ok == len(T) else 1\n\n\ndef main(argv=None):\n    ap\
  \ = argparse.ArgumentParser(description=__doc__.split(\"\\n\")[0])\n    ap.add_argument(\"\
  paths\", nargs=\"*\")\n    ap.add_argument(\"--format\", choices=(\"text\", \"json\"\
  , \"md\"), default=\"text\")\n    ap.add_argument(\"--min-severity\", choices=(\"\
  low\", \"medium\", \"high\"), default=\"low\")\n    ap.add_argument(\"--ignore\"\
  , default=\"\", help=\"comma-separated codes to skip, e.g. EX07,EX08\")\n    ap.add_argument(\"\
  --max-try-statements\", type=int, default=8)\n    ap.add_argument(\"--self-test\"\
  , action=\"store_true\")\n    a = ap.parse_args(argv)\n    if a.self_test:\n   \
  \     return self_test()\n    if not a.paths:\n        ap.print_usage(sys.stderr)\n\
  \        return 2\n    try:\n        n, fs = scan_paths(a.paths, a.max_try_statements)\n\
  \    except FileNotFoundError as e:\n        print(\"error: path not found: %s\"\
  \ % e, file=sys.stderr)\n        return 2\n    if n == 0:\n        print(\"error:\
  \ no .py files found\", file=sys.stderr)\n        return 2\n    skip = {c.strip().upper()\
  \ for c in a.ignore.split(\",\") if c.strip()}\n    fs = [f for f in fs if f[\"\
  code\"] not in skip and RANK[f[\"severity\"]] >= RANK[a.min_severity]]\n    print(render(n,\
  \ fs, a.format))\n    return 1 if any(f[\"severity\"] == \"high\" for f in fs) else\
  \ 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())"
