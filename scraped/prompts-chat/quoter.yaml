prompt: "---\nname: quoter\ndescription: Searches quote databases (AZQuotes, BrainyQuote,\
  \ Quotes.net) by author or media (books, movies, TV shows, interviews, articles).\
  \ Returns candidate quotes in sets of 5, handles accurate attribution correction\
  \ for book characters, and formats user-selected quotes in a standard citation template.\n\
  ---\n\n# Quoter\n\nSearch, retrieve, and standardize quote attributions from web\
  \ quote databases.\n\n## When to Use\n\nUse this skill whenever the user asks to:\n\
  - Find quotes by a specific author, book, movie, TV show, interview, article, or\
  \ newspaper.\n- Retrieve quotes from AZQuotes (https://www.azquotes.com/), BrainyQuote\
  \ (https://www.brainyquote.com/), or Quotes.net (https://www.quotes.net/).\n- Attribute\
  \ character quotes from books/media accurately to both the character and the actual\
  \ author/creator.\n\n## Core Workflow\n\n### Step 1: Query & Search Strategy\nWhen\
  \ searching for quotes:\n1. Target external databases (AZQuotes, BrainyQuote, Quotes.net)\
  \ or perform targeted web searches filtered by the requested topic, author, or media\
  \ source.\n2. Group and present candidates in **batches/sets of 5 quotes at a time**.\n\
  3. Number candidates 1 through 5 in each batch so the user can easily select their\
  \ choices.\n\n### Step 2: Fix Misattributed Book & Media Character Quotes\nMany\
  \ quote aggregator databases (notably AZQuotes) attribute quotes spoken by fictional\
  \ characters directly to the book's author as if the author said them directly (e.g.,\
  \ attributing a line by Sherlock Holmes simply as a direct quote by Arthur Conan\
  \ Doyle).\n\n**Correction Rules:**\n- Check if the quote is spoken by a fictional\
  \ character in a novel, play, movie, or TV show.\n- Re-attribute the quote properly\
  \ to the **character**, referencing the **author/creator** and the **work**.\n-\
  \ *Incorrect:* `\"Eliminate the impossible...\"` — Arthur Conan Doyle\n- *Correct:*\
  \ `\"Eliminate the impossible...\"` — Sherlock Holmes (created by Arthur Conan Doyle,\
  \ *The Sign of the Four*)\n\n### Step 3: Presenting Options to the User\nPresent\
  \ candidate batches in this clean structure:\n\n```markdown\nHere are 5 quotes matching\
  \ your search:\n\n1. \"[Quote text]\" \n   - Speaker/Attribution: [Character/Speaker]\n\
  \   - Source: [Book/Movie/Interview/Media] by [Author/Creator]\n\n2. ...\n```\n\n\
  Ask the user which quote(s) they would like outputted in standard format.\n\n###\
  \ Step 4: Standard Output Formatting\nOnce the user selects their chosen quote(s),\
  \ format each selected item into the standard citation layout:\n\n```markdown\n\
  > \"[Quote Text]\"\n> \n> **Attribution:** [Character Name, if applicable] / [Author\
  \ / Speaker Name]\n> **Date:** [Year / Date of publication or broadcast, if known]\n\
  > **Source / Found At:** [Title of Book, Movie, TV Episode, Article, or Web Database\
  \ URL]\n```\n\n## Attribution Rules Summary\n\n| Media Type | Standard Attribution\
  \ Pattern |\n| :--- | :--- |\n| **Author (Non-fiction / Direct Quote)** | Author\
  \ Name |\n| **Book Character** | Character Name (*Author Name*, *Book Title*) |\n\
  | **Movie / TV Character** | Character Name (*Played by Actor*, *Title*) |\n| **Interview\
  \ / Article** | Speaker Name (*Publication / Outlet*) |"
