title: 'Black Sails in the Fog: 15-Second Four-Shot Maritime Reveal of a Giant Pirate
  Ship (16:9 Video)'
description: Imported from Prompts Chat
prompt: '[Title] Black Sails in the Fog

  [Overall Direction]

  A 15-second photorealistic maritime film sequence in 16:9, composed with a 2.39:1
  widescreen sensibility and natural 24fps motion. The sequence contains four distinct
  shots.

  The story takes place in cold northern European waters during the medieval period.
  An elderly white European man rows a small wooden boat alone into dense fog, where
  he discovers a black-sailed pirate ship far larger than any ordinary vessel.

  The sequence focuses on the ship being revealed gradually through the fog and on
  the extreme difference in scale between the fragile rowboat, the elderly man, and
  the enormous pirate ship. The atmosphere is cold, silent, and oppressive, but there
  are no supernatural creatures, ghosts, magical effects, or battles.

  All timber, canvas, ropes, seawater, fog, and human movement must have convincing
  weight and physical behavior. The footage should feel captured with a full-scale
  practical sailing ship, a real ocean location, and a cinema camera—not like a video-game
  cutscene or fantasy concept art.

  [Fixed Continuity Anchors]

  Maintain the same elderly white man, the same face, the same distressed medieval
  clothing, the same four-meter dark wooden rowboat, the same pair of wooden oars,
  the same three-masted black-sailed pirate ship, and the same cold blue fog-covered
  sea throughout the sequence.

  The pirate ship must remain ahead of the old man and slightly to the right. Its
  bow faces the rowboat at a slight angle. The ship is almost motionless, moving only
  slowly with the long ocean swell. The rowboat continues moving toward the pirate
  ship.

  Wind, waves, and fog consistently move from the left side of the frame toward the
  right. Cold morning light always comes from the upper left.

  The pirate ship must retain exactly three main masts, layered black sails, a high
  forecastle and sterncastle, a long bowsprit, a dark wooden hull, and dense rigging
  in every shot. Its design must not change between cuts.

  [The Old Man’s Appearance]

  The only character is a 74-year-old white European man. He is thin and slightly
  stooped, but his shoulders and arms retain the wiry strength of a lifetime of physical
  labor.

  His pale, coarse skin is deeply marked by cold wind, saltwater, and years of sun
  exposure. He has prominent cheekbones, a high and slightly crooked nose, deep-set
  eyes, and an uneven gray-white beard covering his cheeks and chin.

  His eyes are gray-blue, naturally moist, with small living catchlights. His forehead,
  eye corners, and mouth carry authentic age lines. His gray-white hair reaches the
  back of his neck, dampened by sea fog and loosely tied with an old leather cord.
  Several wet strands cling to his temples and ears.

  His skin must retain pores, age spots, and wrinkles. Do not beautify, smooth, or
  artificially dirty his face.

  [The Old Man’s Clothing]

  The old man wears a damaged charcoal-gray coarse-wool cloak. Its edges are frayed
  and repaired with a few simple hand-sewn patches. Moisture from the sea fog has
  darkened the fabric.

  Beneath the cloak is a dirty gray-white linen tunic with a loose collar and worn
  cuffs. A weathered dark-brown leather belt secures the clothing at his waist. He
  wears dark gray-brown woven trousers and cracked old leather boots.

  A short length of faded dark reddish-brown wool is tied around his neck. This scarf
  is the only faint warm accent in the otherwise cold blue image.

  The clothing must contain no modern stitching, zippers, plastic, branding, reflective
  strips, or modern flotation equipment.

  [Character Behavior]

  The old man’s immediate objective is to cross the fog-covered water and determine
  what the enormous shadow ahead actually is. His obstacles are the dense fog and
  the long ocean swell that repeatedly alters the rowboat’s direction.

  He rows with the practiced economy of an aging seaman. His center of gravity remains
  low, his feet planted firmly against the bottom of the boat. His lower back moves
  first, leaning slowly backward; his shoulders and arms then pull the two wooden
  oars toward his chest.

  The strength of his left and right arms differs slightly. Each stroke is accompanied
  by natural breathing, shoulder-blade movement, friction from the oarlocks, and the
  forward inertia of the boat. His movement is no longer light, but it remains experienced
  and efficient.

  When the deep groan of a massive wooden hull reaches him through the fog, his ongoing
  rowing stroke slows. The left oar blade remains submerged and creates resistance
  while the right oar stops in midair. Seawater drips continuously from its edge.

  His eyes leave the surface of the sea first and move toward the shadow above. He
  gives one slow blink. Only then does his chin rise and his head follow the direction
  of his gaze. His lips remain closed, his breathing pauses briefly, and his hands
  tighten around the oar handles.

  He does not shout or flee. After confirming that an enormous vessel is hidden in
  the fog, he adjusts his seated posture, braces both feet, and resumes rowing slowly
  toward the shadow. His performance conveys caution, exhaustion, and an irresistible
  need to know—not theatrical fear.

  [The Rowboat]

  A medieval wooden rowboat approximately 4.2 meters long, constructed from dark,
  aged oak. The plank seams and wooden fastening pegs are structurally believable.
  Most of the black waterproof tar coating has worn away, revealing gray-brown wood
  grain beneath.

  The gunwales show wear from years of use. The interior remains sparse, containing
  only one coil of old hemp rope. Do not add fishing nets, lanterns, barrels, crates,
  or decorative objects.

  The two wooden oars must retain the same dimensions, color, material, and position
  throughout the sequence.

  The boat rises, falls, and rolls gently with long ocean swells approximately one
  to one-and-a-half meters high. It must have convincing weight and inertia. Its bow
  creates a small amount of dark spray as it cuts through the water. It must not float
  or bounce like a lightweight toy.

  [The Giant Pirate Ship]

  The pirate ship is based on the structure of an old European three-masted galleon,
  but it is far larger than any ordinary historical vessel: approximately 140 meters
  long, with its tallest mast reaching roughly 80 meters.

  Its scale is extraordinary, but its timber construction, structural loading, rigging
  connections, and canvas movement must remain physically believable.

  The hull is built from almost black, heavily weathered oak. Its timbers are wide
  and heavy, with visible plank seams and matte iron reinforcement along structural
  edges. The bow is tall and projects forward with oppressive weight, ending in a
  long, narrow bowsprit.

  The stern rises into a multi-level sterncastle. Two rows of dark gunports line the
  sides of the hull, but no cannons are fired. Salt deposits, dark wet marks, and
  small amounts of sea growth appear around the waterline. The ship is not rotten
  and does not glow.

  Three tall main masts carry multiple levels of square black sails. The canvas is
  heavy and aged, damaged by wind and salt, with naturally torn edges and visible
  repairs. The sails are not pure black; they contain subtle layers of deep blue-gray,
  charcoal, and weathered brown.

  Dense hemp rigging connects the masts, yards, gunwales, and corners of the sails
  according to authentic sailing-ship construction.

  A small faded black flag flies from the highest mast. It bears only a simple, weathered
  bone-white skull-and-crossbones symbol with no written words.

  No crew members, torches, or artificial lights are visible on deck. The vessel feels
  unnaturally quiet but remains completely physical and opaque, never transparent
  or ghostlike.

  [Ocean, Fog, and Color]

  The sequence takes place in cold northern waters at dawn. The boundary between sea
  and sky is nearly erased by thick blue-gray marine fog.

  The fog must retain realistic depth:

  The old man and his rowboat remain relatively clear in the foreground.

  Water several dozen meters away loses contrast.

  Only portions of the pirate ship are visible in the middle distance.

  The upper masts and corners of the sails disappear back into the fog.

  The seawater consists of low-saturation slate blue, deep blue-gray, and faint gray-green
  tones. Wave crests do not produce unnaturally bright white foam.

  The sky is pale cold blue mixed with pearl gray. The pirate ship is near-black wood
  with deep blue-gray sails. The old man’s faded reddish-brown scarf provides the
  only very weak warm accent.

  Wind slowly pushes the fog across the ship, allowing its fixed structure to appear
  in layers. The fog changes what is visible; the vessel itself never changes shape.

  The fog must not behave like fast-moving smoke, and it must not make the entire
  image uniformly blurry.

  [Shot One | 0–3.5 Seconds | Side Close-Up of the Old Man]

  A 65mm cinema lens. The camera floats beside the left side of the rowboat, slightly
  below the old man’s shoulder height, rising and falling gently with the same ocean
  swell.

  The old man’s side profile occupies the left half of the frame. The background contains
  only defocused cold-blue seawater and layered fog. The pirate ship must not appear
  yet.

  The old man is already midway through a rowing stroke. His lower back moves slowly
  backward as both hands pull the oars toward his body. Damp gray hair clings to his
  face, and the coarse wool cloak responds subtly to the sea wind.

  A broad swell lifts the wooden boat, and the camera rises with it in a restrained,
  physically grounded movement.

  One distant, low note from an old bronze ship’s bell travels through the fog, followed
  by the deep groan of an enormous timber structure under pressure from the sea.

  The old man’s rowing motion gradually stops. One oar blade remains submerged while
  the other pauses in midair. Water drips from the edge of the blade.

  His eyes move toward the upper-right side of the frame first. He gives one slow
  blink, then gradually raises his head.

  Cut directly before the head movement is fully completed. Do not reveal what he
  sees in this shot.

  [Shot Two | 3.5–10 Seconds | Rear View and Fog-Shrouded Reveal]

  Cut to a medium-wide rear view of the old man using a 35mm lens. The camera is positioned
  close to the stern of the rowboat at approximately shoulder height.

  Preserve the direction of the boat, the old man’s seated position, the direction
  of the waves, and the direction of the cold light from the previous shot.

  The old man occupies the lower center of the frame with his back toward the camera.
  An enormous dark shape rises inside the fog ahead.

  At first, only the towering bow and one vague vertical mast line can be distinguished.
  As the fog moves laterally, three enormous masts, layered black sails, dense rigging,
  and elevated deck structures gradually become visible. The tops of the masts remain
  hidden.

  The pirate ship must not appear completely in a single instant. Its structure remains
  fixed; only its visibility changes as fog passes across it.

  After a short pause, the old man resumes rowing. He lowers his center of gravity
  and completes one slow, deliberate stroke, then begins a second.

  The rowboat moves forward with the swell. Each time the boat rises onto a wave crest,
  the ship’s shadow appears taller. When the boat descends into a trough, the lower
  part of the pirate ship is briefly hidden by water and fog.

  As the old man continues forward, the bow, the dark gunports, and the lowest black
  sails become gradually clearer.

  High-altitude wind causes the enormous black sails to fill and relax with delayed,
  heavy movement. The rigging tightens and loosens slightly. It must not swing wildly.

  The pirate ship remains almost motionless, advancing into the swell at an extremely
  slow speed.

  [Shot Three | 10–12.5 Seconds | First Wide Shot: Bow Pressure]

  Cut directly to a low, water-level wide shot using a 28mm lens, observing the rowboat
  from a distance on its left side.

  A defocused dark-blue wave crest occupies the foreground. The old man and rowboat
  sit in the middle ground. The pirate ship’s towering bow, lower black sails, and
  fog-covered masts dominate the background.

  The rowboat occupies only about 2% of the frame width. The old man is even smaller,
  but his charcoal cloak and faded reddish-brown scarf remain consistent.

  The pirate ship’s bow rises from the sea like a dark timber cliff. Large hull planks,
  gunports, and matte iron reinforcement provide believable scale references.

  The foreground wave briefly hides the lower half of the rowboat. As the crest falls,
  the boat reappears in the same spatial relationship to the ship.

  The vessel’s position, size, and structure remain stable. The upper black sails
  and masts are partially swallowed by blue-gray fog.

  This shot emphasizes the vertical height of the bow and the oppressive distance
  between the small boat and the ship.

  [Shot Four | 12.5–15 Seconds | Second Wide Shot: Complete Scale]

  Cut to a distant, slightly elevated extreme-wide shot using a 50mm long lens to
  compress spatial depth. The camera remains stable without a fast aerial dive, orbit,
  or rotation.

  The enormous three-masted pirate ship appears from a front-side angle and dominates
  the center-right of the frame.

  Most of the full hull, long bowsprit, high sterncastle, three main masts, and layered
  black sails enter the frame. The lower hull remains relatively clear, while the
  upper masts and sail corners fade in and out of the dense fog.

  The black pirate flag moves slowly at the top of the highest mast.

  The old man and his boat remain ahead of the ship and slightly to the left, reduced
  to a tiny dark mark on the cold-blue sea. The rowboat continues rising and falling
  with the swell as the old man rows slowly.

  The pirate ship remains heavy, silent, and almost immovable.

  Maintain a safe distance between both vessels. No collision occurs.

  Large areas of cold-blue water and empty fog surround the subjects. There is no
  land, no other vessel, and no modern structure on the horizon.

  Hold the final composition for approximately half a second, keeping the old man,
  the small boat, and the enormous black sails visible together.

  [Editing Logic]

  The sequence contains four shots and three direct cuts.

  The first cut moves from the old man raising his head in side profile to the enormous
  ship shadow seen from behind him.

  The second cut moves from the old man continuing to row into the low water-level
  wide shot, revealing the height of the bow.

  The third cut moves to a farther, slightly elevated extreme-wide shot, revealing
  the total length of the pirate ship and the surrounding ocean.

  The two wide shots have different purposes:

  The first wide shot establishes the vertical pressure of the bow.

  The second wide shot reveals the full vessel and the final scale relationship between
  the ship, the ocean, and the rowboat.

  Do not insert close-ups of skulls, cannons, eyes, rigging hardware, or pirate crew.

  [Cinematography and Image Texture]

  A 35mm theatrical release-print look with soft gate edges, medium-low microcontrast,
  fine and slightly uneven natural grain, layered deep blues and charcoal blacks,
  and gentle highlight rolloff.

  Fog and slight condensation along the edge of the lens are the only dominant image
  imperfections. Do not simultaneously add rain, dust, smoke, sparks, or strong lens
  flares.

  The camera retains small amounts of ocean movement and inertia while keeping the
  horizon generally stable.

  Close shots use restrained depth of field. Distant contrast decreases naturally
  through atmospheric perspective.

  The pirate ship must not appear unnaturally sharp inside the fog, but the entire
  image must not be covered by a uniform blur filter.

  [Lighting]

  The only primary light source is cold dawn light diffused through cloud cover from
  the upper left.

  A faint silver-blue edge light touches the left side of the old man’s face, wet
  hair, wooden oars, and gunwale.

  The side of the pirate ship facing the light reveals low-contrast cold-gray structure.
  The backlit side falls toward deep blue-black while preserving readable timber layers.

  Do not use moonbeams, torchlight, ghostly green illumination, magical glow, lightning,
  or warm sunset light.

  [Sound]

  No dialogue, narration, or musical score.

  The soundscape consists of wooden oars entering the sea, low water displacement,
  friction from the oarlocks, creaking rowboat planks, the old man’s controlled but
  strained breathing, wind softened by fog, one distant bronze ship-bell note, the
  deep groan of the enormous wooden hull under wave pressure, rigging tightening,
  and black sails filling slowly with wind.

  The bell and timber groan are heard before the pirate ship appears in Shot One.

  Low wooden resonance expands when the ship is revealed in Shot Two.

  In the final two wide shots, ocean waves, wind, and large areas of silence again
  dominate the soundscape.

  [Negative Constraints]

  Avoid changes to the old man’s face, age, skin tone, beard length, hairstyle, cloak
  color, scarf, or clothing between shots. Do not make him suddenly younger.

  Avoid modern clothing, armor, aristocratic costume, stereotypical pirate clothing,
  modern life jackets, plastic, zippers, modern shoes, wristwatches, firearms, or
  electronic equipment.

  Avoid incorrect anatomy, distorted body proportions, extra arms, extra fingers,
  changing numbers of oars, hands passing through oar handles, rigid rowing, mechanical
  looping movements, sliding feet, exaggerated screaming, an open-mouthed expression
  of terror, theatrical fear, heroic posing, empty eyes, or frozen eyes.

  Avoid changes to the rowboat’s dimensions, color, design, or material. Do not transform
  the boat into a modern lifeboat, fishing vessel, sailboat, or plastic boat.

  Avoid weightless floating, sudden sideways movement, violent bouncing, capsizing,
  flooding, breaking apart, or colliding with the pirate ship.

  Avoid changes to the pirate ship’s design, length, hull shape, bow, stern, or color.
  Maintain exactly three main masts. Do not allow masts to appear or disappear.

  Avoid changing the black sails’ color, melting canvas, incoherent rigging, swapped
  bow and stern, moving gunports, shipping containers, steam engines, modern motors,
  steel superstructures, or electric lights.

  Avoid a cartoon pirate ship, theme-park attraction, miniature model, plastic wood
  grain, glowing ghost ship, transparent hull, skeleton crew, ghosts, zombies, sea
  monsters, tentacles, flying ships, magic, green ghost flames, burning sails, cannon
  battles, explosions, or lightning.

  Avoid fog disappearing suddenly between cuts or changing color. Do not make the
  fog behave like fast-moving smoke. The pirate ship must not deform as fog passes
  over it.

  Avoid tsunami waves, vertical walls of water, gelatinous water, fabric-like water,
  smoke-like water, changing wave direction, sudden daylight changes, warm sunset
  colors, or night.

  Avoid fast editing, additional shots, location changes, time jumps, flash transitions,
  dissolves, morphing transitions, camera teleportation, high-speed drone dives, rotating
  around the ship, sudden zooms, dolly zooms, slow motion, or speed ramping.

  Avoid video-game cutscenes, fantasy concept art, pirate-themed advertising, uniform
  sharpness across the entire frame, excessive sharpening, excessive skin smoothing,
  oversaturation, commercial teal-and-orange grading, neon, lasers, decorative light
  beams, excessive lens flare, text, subtitles, brand logos, and modern watermarks.

  Allow the simple skull-and-crossbones pirate flag at the top of the highest mast,
  but do not place any readable text on the flag.'
