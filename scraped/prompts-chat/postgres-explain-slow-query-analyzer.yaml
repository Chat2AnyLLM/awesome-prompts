  \ % (sev, code, msg.replace(\"|\", \"/\")))\n    lines.append(\"\")\n    lines.append(\"\
  ## Ranked fixes (suggested)\")\n    lines.append(\"\")\n    fixes = []\n    codes\
  \ = {f[1] for f in findings}\n    if \"EX01\" in codes:\n        fixes.append(\"\
  Add a btree/expression index that matches the Seq Scan Filter (check function wrappers\
