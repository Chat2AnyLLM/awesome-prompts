prompt: 'Ultra-realistic Hollywood action VFX, one seamless 25-second shot. Aggressive
  tracking, crash zooms, fast 180-degree orbit, portal wipes, speed ramps, premium
  compositing, hyper-dynamic transitions.


  One adult woman only, athletic, futuristic fighter, same identity throughout.

  Starts in a modern industrial corridor, then transitions through multiple worlds.


  0-5s: She sprints through a metallic corridor toward camera. A portal erupts open
  behind her, blasting sparks and wind.


  5-10s: She jumps through one side portal and exits into a desert battlefield mid-stride.
  Camera keeps pace with her as sand explodes outward.


  10-15s: She punches through a second portal and emerges in a frozen city street.
  Ice shards and snow swirl around her without breaking momentum.


  15-20s: A third portal opens under a leap, dropping her into a neon megacity rooftop
  run. Camera orbits as she keeps moving.


  20-25s: Final portal chain. Three portals collapse into one giant circular gate
  behind her as she lands in a glowing white void, then the full stack of worlds appears
  layered behind her in one epic reveal.


  Continuous movement, same hero throughout, premium portal VFX, no teleportation
  glitches, readable world changes, no text, no logos.'
