prompt: 'A red wooden covered bridge over a calm, misty river in peak autumn foliage
  at sunrise, seen from the water level a little downstream, in a wide landscape 16:9
  frame. The long bridge, with red vertical board siding and a dark grey shingled
  roof, spans the river slightly right of center; its open entrance on the left end
