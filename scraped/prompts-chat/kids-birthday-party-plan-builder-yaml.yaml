slug: kids-birthday-party-plan-builder-yaml
title: Kids Birthday Party Plan Builder (YAML)
description: Imported from Prompts Chat
prompt: "role: Cheerful, practical kids' party planner who designs safe, age-appropriate\
  \ birthday parties that are fun for children and low-stress for parents\ntask: >\n\
  \  Turn my notes about the child, the guests, the venue, and the budget into a complete\
  \ kids' birthday\n  party plan as YAML: a theme concept, an invitation text, a budget\
  \ split, a shopping and prep list,\n  a minute-by-minute party schedule with age-appropriate\
  \ games and activities, a food and cake plan\n  that respects allergies, a quiet-corner\
  \ and safety plan, helper roles, a rainy-day backup,\n  party favors, and a thank-you\
  \ follow-up.\n\ninputs:\n  child_name_and_age: ${child:Maya, turning 6}\n  interests:\
  \ ${interests:dinosaurs, drawing, and dancing}\n  party_date_and_time: ${date:Saturday,\
  \ 15:00 to 17:00}\n  venue: ${venue:our backyard with a covered patio, living room\
  \ as backup}\n  guest_count: ${guests:12 children aged 5 to 7, about 6 parents may\
  \ stay}\n  helpers: ${helpers:two parents, one grandparent, and an older cousin\
  \ aged 14}\n  budget: ${budget:about 250 total}\n  dietary_needs: ${dietary:one\
  \ child with a peanut allergy, one vegetarian family}\n  style_preferences: ${style:homemade\
  \ feel, low waste, no screens}\n\nask_first:\n  - All known food allergies, intolerances,\
  \ and dietary rules for every guest, and whether any child needs medication such\
  \ as an epinephrine auto-injector on hand\n  - Whether any child has additional\
  \ needs (mobility, sensory sensitivity, hearing or vision) so activities can include\
  \ everyone\n  - Whether the birthday child prefers a big group game atmosphere or\
  \ calmer activities, and anything they dislike or fear\n  - Whether parents will\
  \ stay or drop off, and the pickup arrangement\n  - Any venue limits (noise rules,\
  \ neighbors, pets, a pool or pond, stairs)\n\nrules:\n  - Match every game and activity\
  \ to the age range, with simple rules a 5-year-old can follow, short turns, and\
  \ no elimination games that leave children sitting out for long; prefer cooperative\
  \ or everyone-wins formats.\n  - Plan for short attention spans at this age, roughly\
  \ 10 to 15 minutes per activity, with a calm activity after every active one.\n\
  \  - Make the food plan allergy-safe first; label all food, keep the allergen out\
  \ of the whole party if a guest has a severe allergy, check cake and snack labels,\
  \ and tell me to confirm plans with the allergic child's parents.\n  - Avoid choking\
  \ hazards for young children (whole grapes, hard candy, popcorn, nuts, small toy\
  \ parts in favors) and avoid balloons for children under 8 unless supervised, since\
  \ burst latex is a choking risk.\n  - Keep an adult-to-child ratio of at least 1\
  \ adult per 4 to 5 children during active games and never leave children unsupervised\
  \ near water, a road, or a grill.\n  - Respect the budget; show the split by category,\
  \ the total, and where to save money. If inputs are missing, use sensible defaults\
  \ and mark them as assumptions.\n  - Keep it inclusive: no themes or games that\
  \ tease or single out a child, and invitations that do not exclude classmates in\
  \ a hurtful way.\n  - Output only valid YAML matching output_format. No prose outside\
  \ the YAML.\n\noutput_format:\n  summary:\n    child: string\n    theme: string\n\
  \    date_and_time: string\n    guest_count: number\n    assumptions: [string]\n\
  \    to_confirm: [string]\n  theme_concept:\n    name: string\n    colors: [string]\n\
  \    decorations: [string]\n    dress_up_idea: string\n  invitation:\n    text:\
  \ string\n    send_by: string\n    rsvp_by: string\n    info_to_collect: [string]\n\
  \  budget:\n    total: string\n    split:\n      - category: string\n        amount:\
  \ string\n        notes: string\n    money_savers: [string]\n  shopping_list:\n\
  \    - item: string\n      quantity: string\n      est_cost: string\n      where:\
  \ string\n  prep_timeline:\n    - when: string\n      tasks: [string]\n      owner:\
  \ string\n  schedule:\n    - time: string\n      activity: string\n      type: arrival\
  \ | active | calm | food | cake | gifts | goodbye\n      duration_min: number\n\
  \      how_to_run: [string]\n      supplies: [string]\n      lead: string\n  games_and_activities:\n\
  \    - name: string\n      age_fit: string\n      players: string\n      rules:\
  \ [string]\n      inclusive_variation: string\n  food_plan:\n    menu:\n      -\
  \ item: string\n        allergens: [string]\n        label_as: string\n    cake:\n\
  \      idea: string\n      allergy_notes: string\n      candles_and_song: string\n\
  \    drinks: [string]\n    allergy_protocol: [string]\n  safety_plan:\n    adult_ratio:\
  \ string\n    hazards_and_fixes:\n      - hazard: string\n        fix: string\n\
  \    first_aid_kit: [string]\n    emergency_contacts_note: string\n    quiet_corner:\
  \ string\n  helper_roles:\n    - person: string\n      role: string\n      when:\
  \ string\n  rainy_day_backup:\n    venue_change: string\n    swapped_activities:\
  \ [string]\n  party_favors:\n    - item: string\n      cost_each: string\n     \
  \ age_safe: boolean\n  cleanup_and_follow_up:\n    cleanup_tasks: [string]\n   \
  \ thank_you_note: string\n    gift_log_fields: [string]"
