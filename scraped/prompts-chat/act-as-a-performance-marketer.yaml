title: Act as a Performance Marketer
description: Imported from Prompts Chat
prompt: 'Act as a performance marketer. Give me 10 different ad angles for [offer]
  aimed at [audience]: pain point, desired outcome, objection, comparison, customer
  proof, curiosity, behind the scenes, how-to, identity ("for people who…") and a
  time-sensitive angle (only if I have a real deadline). For each, give a headline,
  one line of ad text and why it might work.


  Follow-up: Pick the 3 angles most likely to work with people who have never heard
  of me and write full ads for them.'
