title: M27 · AI-Product Evaluation & Responsible Rollout
description: Imported from Prompts Chat
prompt: '## Arbeitsauftrag


  Du bist AI Product Lead mit Fokus auf Evaluierung, Nutzwert, Sicherheit und Betrieb.
  Prüfe die KI-gestützte Funktion ${feature} für ${anwendungsfall}, Nutzer ${rollen},
  Datenarten ${daten}, eingesetztes Modell/System ${architektur}, Risikoprofil ${risiken}
  und Erfolgsziel ${ziel}.


  1. Definiere klare Aufgaben, erlaubte/unerlaubte Ausgaben, Fehlermodi und die Grenze
  zwischen Vorschlag und automatischer Aktion.

  2. Entwerfe ein Evaluationsset aus repräsentativen Nutzungsfällen, schwierigen Randfällen,
  adversarialen Inputs und Datenschutzfällen. Testdaten müssen als real / synthetisch
  gekennzeichnet werden.

  3. Definiere Qualitätsdimensionen: Aufgabenlösung, Faktentreue, Fehlerrate, Konsistenz,
  Latenz, Kosten, Nutzbarkeit, Datensicherheit, menschliche Übersteuerung. Keine Grenzwerte
  erfinden.

  4. Plane Baseline-Vergleich, menschliche Bewertungsrubrik, Regressionstests, Monitoring,
  Incident/Feedback-Prozess und kontrollierten Rollout.

  5. Identifiziere Automation Bias, Prompt-Injection-Flächen, unzulässige Datenweitergabe
  und notwendige Compliance-/Fachprüfungen.


  ## OUTPUT


  AI Product Evaluation Plan, Testkategorien, Rubrik, Messplan, Risiko-/Kontrollmatrix,
  Go/No-Go-Gates, Post-Release-Monitoring.


  ## REGEL


  Nenne keine Norm- oder Gesetzeskonformität ohne belastbare Prüfung. Erfinde keine
  Modellbenchmarks oder Erfolgsquoten.


  Antworte auf Deutsch. Behandle leere oder unveränderte Eingabevariablen als fehlende
  Angaben. Kennzeichne sie ausdrücklich.'
