  \ \"headers\": {\n        \"X-Slack-Signature\": \"v0=675094d734821c12a58309211f8d66c58fffbbf86f25ba8424acb5cffd228fe6\"\
  ,\n        \"X-Slack-Request-Timestamp\": \"1794553800\"\n      },\n      \"body\"\
  : \"token=demo&team_id=T000&command=%2Fdeploy&text=shop-api+staging&user_name=dev-ana\"\
  \n    },\n    {\n      \"id\": \"D11\",\n      \"endpoint\": \"contact-form\",\n\
  \      \"headers\": {\n        \"X-Form-Signature\": \"50c78cd627e684b0c1c024f1dfe22cc321a4afb6d25aed29aad8f1c6c2c66dce\"\
  \n      },\n      \"body\": \"{\\\"form\\\":\\\"contact\\\",\\\"name\\\":\\\"Sam\\\
  \",\\\"message\\\":\\\"Please call me back\\\"}\"\n    }\n  ]\n}\n\n\x1FFILE:scripts/verify_webhooks.py\x1E\
  \n#!/usr/bin/env python3\n\"\"\"Webhook signature verifier and replay guard (offline,\
  \ Python 3.8+ standard library only).\n\nReads a JSON file with endpoint configs\
  \ and captured deliveries (raw body + headers),\nrecomputes each HMAC signature,\
  \ checks timestamps, duplicates and config hygiene, and\nexplains the most likely\
  \ cause of every mismatch.\n\nUsage:\n  verify_webhooks.py deliveries.json [--now\
  \ 2026-11-13T10:00:00Z] [--json]\n  verify_webhooks.py --sign SCHEME --secret S\
  \ --body-file body.txt [--timestamp 1794560400]\n  verify_webhooks.py --self-test\n\
  Exit codes: 0 = no high findings, 1 = high findings, 2 = bad input.\n\"\"\"\nimport\
  \ argparse, base64, hashlib, hmac, json, math, sys\nfrom collections import Counter\n\
  from datetime import datetime, timezone\n\nSCHEMES = {\n    # header, algorithm,\
  \ encoding, prefix, signed-string template, timestamp header\n    \"github\":  {\"\
  header\": \"X-Hub-Signature-256\", \"alg\": \"sha256\", \"enc\": \"hex\", \"prefix\"\
  : \"sha256=\", \"template\": \"{body}\", \"ts_header\": None},\n    \"github-sha1\"\
  : {\"header\": \"X-Hub-Signature\", \"alg\": \"sha1\", \"enc\": \"hex\", \"prefix\"\
  : \"sha1=\", \"template\": \"{body}\", \"ts_header\": None},\n    \"shopify\": {\"\
  header\": \"X-Shopify-Hmac-Sha256\", \"alg\": \"sha256\", \"enc\": \"base64\", \"\
  prefix\": \"\", \"template\": \"{body}\", \"ts_header\": None},\n    \"slack\":\
  \   {\"header\": \"X-Slack-Signature\", \"alg\": \"sha256\", \"enc\": \"hex\", \"\
  prefix\": \"v0=\", \"template\": \"v0:{ts}:{body}\", \"ts_header\": \"X-Slack-Request-Timestamp\"\
  },\n    \"stripe\":  {\"header\": \"Stripe-Signature\", \"alg\": \"sha256\", \"\
  enc\": \"hex\", \"prefix\": \"\", \"template\": \"{ts}.{body}\", \"ts_header\":\
  \ None},\n}\nSEV_ORDER = {\"high\": 0, \"medium\": 1, \"low\": 2, \"info\": 3}\n\
  \n\ndef scheme_for(ep):\n    base = dict(SCHEMES.get(ep.get(\"scheme\", \"generic\"\
  ), {}))\n    for k in (\"header\", \"alg\", \"enc\", \"prefix\", \"template\", \"\
  ts_header\"):\n        if k in ep:\n            base[k] = ep[k]\n    missing = [k\
  \ for k in (\"header\", \"alg\", \"enc\", \"template\") if not base.get(k)]\n  \
  \  if missing:\n        raise ValueError(\"endpoint %r: generic scheme needs %s\"\
  \ % (ep.get(\"name\"), \", \".join(missing)))\n    base.setdefault(\"prefix\", \"\
  \")\n    base.setdefault(\"ts_header\", None)\n    return base\n\n\ndef digest(secret,\
  \ msg, alg, enc):\n    mac = hmac.new(secret.encode(\"utf-8\"), msg.encode(\"utf-8\"\
  ), getattr(hashlib, alg)).digest()\n    return mac.hex() if enc == \"hex\" else\
  \ base64.b64encode(mac).decode(\"ascii\")\n\n\ndef signed_string(sch, body, ts):\n\
  \    return sch[\"template\"].replace(\"{ts}\", str(ts or \"\")).replace(\"{body}\"\
  , body)\n\n\ndef sign(scheme_name, secret, body, ts=None):\n    sch = scheme_for({\"\
  scheme\": scheme_name})\n    sig = digest(secret, signed_string(sch, body, ts),\
  \ sch[\"alg\"], sch[\"enc\"])\n    if scheme_name == \"stripe\":\n        return\
  \ {sch[\"header\"]: \"t=%s,v1=%s\" % (ts, sig)}\n    out = {sch[\"header\"]: sch[\"\
  prefix\"] + sig}\n    if sch[\"ts_header\"]:\n        out[sch[\"ts_header\"]] =\
  \ str(ts)\n    return out\n\n\ndef get_header(headers, name):\n    for k, v in headers.items():\n\
  \        if k.lower() == name.lower():\n            return v\n    return None\n\n\
  \ndef parse_stripe(value):\n    ts, sigs = None, []\n    for part in value.split(\"\
  ,\"):\n        k, _, v = part.strip().partition(\"=\")\n        if k == \"t\":\n\
  \            ts = v\n        elif k == \"v1\":\n            sigs.append(v)\n   \
  \ return ts, sigs\n\n\ndef entropy_bits(secret):\n    if not secret:\n        return\
  \ 0.0\n    counts = Counter(secret)\n    h = -sum(c / len(secret) * math.log2(c\
  \ / len(secret)) for c in counts.values())\n    return h * len(secret)\n\n\ndef\
  \ diagnose(sch, ep, body, ts, received):\n    \"\"\"Try the usual mistakes and return\
  \ a human explanation, or None.\"\"\"\n    secret = ep[\"secret\"]\n    alg, enc\
  \ = sch[\"alg\"], sch[\"enc\"]\n    tries = []\n    for old in ep.get(\"previous_secrets\"\
  , []):\n        tries.append((\"WH07\", \"matches a PREVIOUS secret: the sender\
  \ still signs with the old secret (finish the rotation)\", old, signed_string(sch,\
  \ body, ts), enc))\n    try:\n        obj = json.loads(body)\n        tries.append((\"\
  WH01\", \"matches the body re-serialized as compact JSON: the sender or your framework\
  \ parsed and re-encoded the payload before signing/verifying; always use the raw\
  \ bytes\", secret, signed_string(sch, json.dumps(obj, separators=(\",\", \":\")),\
  \ ts), enc))\n        tries.append((\"WH01\", \"matches the body re-serialized with\
  \ default json.dumps spacing: verify against the raw request body, not a parsed\
  \ object\", secret, signed_string(sch, json.dumps(obj), ts), enc))\n    except ValueError:\n\
  \        pass\n    tries.append((\"WH01\", \"matches the body with a trailing newline\
  \ stripped/added: a proxy or test tool changed the body\", secret, signed_string(sch,\
  \ body.rstrip(\"\\n\") if body.endswith(\"\\n\") else body + \"\\n\", ts), enc))\n\
  \    if \"{ts}\" in sch[\"template\"]:\n        tries.append((\"WH01\", \"matches\
  \ HMAC over the body alone: the timestamp prefix is missing from the signed string\"\
  , secret, body, enc))\n    if secret.startswith(\"whsec_\"):\n        tries.append((\"\
  WH01\", \"matches when the 'whsec_' prefix is removed from the secret: check how\
  \ the secret is loaded\", secret[len(\"whsec_\"):], signed_string(sch, body, ts),\
  \ enc))\n    tries.append((\"WH01\", \"matches with a trimmed secret: the stored\
  \ secret has stray whitespace\", secret.strip(), signed_string(sch, body, ts), enc))\n\
  \    other = \"base64\" if enc == \"hex\" else \"hex\"\n    tries.append((\"WH01\"\
  , \"matches with %s encoding instead of %s: wrong digest encoding\" % (other, enc),\
  \ secret, signed_string(sch, body, ts), other))\n    for code, why, sec, msg, e\
  \ in tries:\n        if sec == secret and msg == signed_string(sch, body, ts) and\
  \ e == enc:\n            continue\n        cand = digest(sec, msg, alg, e)\n   \
  \     if any(hmac.compare_digest(cand, r) for r in received):\n            return\
  \ code, why\n    return None\n\n\ndef check_delivery(d, ep, now, tolerance, skew,\
  \ seen_ids):\n    findings = []\n    def add(code, sev, msg):\n        findings.append({\"\
  code\": code, \"severity\": sev, \"delivery\": d.get(\"id\"), \"endpoint\": ep.get(\"\
  name\"), \"message\": msg})\n    try:\n        sch = scheme_for(ep)\n    except\
  \ ValueError as e:\n        add(\"WH00\", \"high\", str(e))\n        return findings,\
  \ None\n    headers = d.get(\"headers\", {})\n    body = d.get(\"body\")\n    if\
  \ not isinstance(body, str):\n        add(\"WH00\", \"high\", \"body must be the\
  \ raw request body as a string (not parsed JSON)\")\n        return findings, None\n\
  \    raw = get_header(headers, sch[\"header\"])\n    if raw is None:\n        if\
  \ ep.get(\"scheme\") == \"github\" and get_header(headers, \"X-Hub-Signature\"):\n\
  \            add(\"WH06\", \"medium\", \"only legacy X-Hub-Signature (HMAC-SHA1)\
  \ present; enable and verify X-Hub-Signature-256\")\n        add(\"WH02\", \"high\"\
  , \"missing signature header %s: reject with 401 before doing any work\" % sch[\"\
  header\"])\n        return findings, False\n    ts = None\n    if ep.get(\"scheme\"\
  ) == \"stripe\":\n        ts, received = parse_stripe(raw)\n        if not ts or\
  \ not received:\n            add(\"WH02\", \"high\", \"Stripe-Signature header has\
  \ no t= or v1= part\")\n            return findings, False\n    else:\n        if\
  \ sch[\"prefix\"] and not raw.startswith(sch[\"prefix\"]):\n            add(\"WH01\"\
  , \"high\", \"signature does not start with %r (wrong scheme or algorithm?)\" %\
  \ sch[\"prefix\"])\n            return findings, False\n        received = [raw[len(sch[\"\
  prefix\"]):]]\n        if sch[\"ts_header\"]:\n            ts = get_header(headers,\
  \ sch[\"ts_header\"])\n            if ts is None:\n                add(\"WH02\"\
  , \"high\", \"missing timestamp header %s\" % sch[\"ts_header\"])\n            \
  \    return findings, False\n    if sch[\"alg\"] in (\"sha1\", \"md5\"):\n     \
  \   add(\"WH06\", \"medium\", \"weak HMAC algorithm %s: prefer SHA-256 if the provider\
  \ supports it\" % sch[\"alg\"].upper())\n    expected = digest(ep[\"secret\"], signed_string(sch,\
  \ body, ts), sch[\"alg\"], sch[\"enc\"])\n    valid = any(hmac.compare_digest(expected,\
  \ r) for r in received)\n    if not valid:\n        hint = diagnose(sch, ep, body,\
  \ ts, received)\n        if hint and hint[0] == \"WH07\":\n            add(\"WH07\"\
  , \"medium\", hint[1])\n            valid = None  # authentic but signed with the\
  \ old secret\n        elif hint:\n            add(\"WH01\", \"high\", \"signature\
  \ mismatch; likely cause: \" + hint[1])\n        else:\n            add(\"WH01\"\
  , \"high\", \"signature mismatch; no common mistake reproduces it: wrong secret\
  \ for this endpoint, or the body was modified in transit\")\n    if ts is not None:\n\
  \        try:\n            tsv = int(ts)\n        except ValueError:\n         \
  \   add(\"WH00\", \"high\", \"timestamp %r is not unix seconds\" % ts)\n       \
  \     tsv = None\n        if tsv is not None and now is not None:\n            age\
  \ = now - tsv\n            if age > tolerance:\n                add(\"WH03\", \"\
  high\", \"timestamp is %d s old (tolerance %d s): possible replay, reject even if\
  \ the signature is valid\" % (age, tolerance))\n            elif age < -skew:\n\
  \                add(\"WH05\", \"medium\", \"timestamp is %d s in the future (allowed\
  \ skew %d s): check server clocks (NTP)\" % (-age, skew))\n    event_id = d.get(\"\
  event_id\") or get_header(headers, ep.get(\"id_header\", \"X-Webhook-Id\") or \"\
  \") or get_header(headers, \"X-GitHub-Delivery\")\n    if event_id:\n        key\
  \ = (ep.get(\"name\"), event_id)\n        if key in seen_ids:\n            add(\"\
  WH04\", \"medium\", \"duplicate event id %s (first seen in delivery %s): process\
  \ idempotently, do not run side effects twice\" % (event_id, seen_ids[key]))\n \
  \       else:\n            seen_ids[key] = d.get(\"id\")\n    else:\n        add(\"\
  WH10\", \"low\", \"no event/delivery id: cannot de-duplicate retries; store a hash\
  \ of the body or ask the provider for an id header\")\n    limit = ep.get(\"max_body_bytes\"\
  )\n    if limit and len(body.encode(\"utf-8\")) > limit:\n        add(\"WH11\",\
  \ \"low\", \"body is %d bytes, above max_body_bytes %d\" % (len(body.encode(\"utf-8\"\
  )), limit))\n    return findings, valid\n\n\ndef check_endpoint(ep):\n    out =\
  \ []\n    def add(code, sev, msg):\n        out.append({\"code\": code, \"severity\"\
  : sev, \"delivery\": None, \"endpoint\": ep.get(\"name\"), \"message\": msg})\n\
  \    url = ep.get(\"url\", \"\")\n    if url and not url.lower().startswith(\"https://\"\
  ):\n        add(\"WH09\", \"high\", \"endpoint URL is not HTTPS (%s): signatures\
  \ do not hide the payload\" % url)\n    sec = ep.get(\"secret\", \"\")\n    if not\
  \ sec:\n        add(\"WH00\", \"high\", \"no secret configured\")\n    elif len(sec)\
  \ < 24 or entropy_bits(sec) < 96:\n        add(\"WH08\", \"medium\", \"secret is\
  \ short or low-entropy (%d chars, ~%d bits): generate at least 32 random bytes\"\
  \ % (len(sec), entropy_bits(sec)))\n    if ep.get(\"scheme\") == \"github-sha1\"\
  :\n        add(\"WH06\", \"medium\", \"endpoint configured for HMAC-SHA1 only\"\
  )\n    return out\n\n\ndef to_epoch(s):\n    return int(datetime.fromisoformat(s.replace(\"\
  Z\", \"+00:00\")).astimezone(timezone.utc).timestamp())\n\n\ndef run(data, now_override=None):\n\
  \    eps = {}\n    for name, ep in data.get(\"endpoints\", {}).items():\n      \
  \  ep = dict(ep); ep[\"name\"] = name; eps[name] = ep\n    now = to_epoch(now_override)\
  \ if now_override else (to_epoch(data[\"now\"]) if data.get(\"now\") else int(datetime.now(timezone.utc).timestamp()))\n\
  \    tol = int(data.get(\"tolerance_seconds\", 300)); skew = int(data.get(\"future_skew_seconds\"\
  , 60))\n    findings, results, seen = [], [], {}\n    for ep in eps.values():\n\
  \        findings += check_endpoint(ep)\n    for d in data.get(\"deliveries\", []):\n\
  \        ep = eps.get(d.get(\"endpoint\"))\n        if ep is None:\n           \
  \ findings.append({\"code\": \"WH00\", \"severity\": \"high\", \"delivery\": d.get(\"\
  id\"), \"endpoint\": d.get(\"endpoint\"), \"message\": \"unknown endpoint\"})\n\
  \            results.append({\"delivery\": d.get(\"id\"), \"verdict\": \"error\"\
  }); continue\n        f, valid = check_delivery(d, ep, now, tol, skew, seen)\n \
  \       findings += f\n        hard = any(x[\"severity\"] == \"high\" for x in f)\n\
  \        verdict = \"reject\" if hard else (\"accept-rotate-secret\" if valid is\
  \ None else (\"accept\" if valid else \"reject\"))\n        if any(x[\"code\"] ==\
  \ \"WH04\" for x in f) and verdict.startswith(\"accept\"):\n            verdict\
  \ = \"accept-duplicate(skip side effects)\"\n        results.append({\"delivery\"\
  : d.get(\"id\"), \"endpoint\": ep[\"name\"], \"verdict\": verdict})\n    findings.sort(key=lambda\
  \ x: (SEV_ORDER[x[\"severity\"]], x[\"code\"], str(x[\"delivery\"])))\n    summary\
  \ = Counter(x[\"severity\"] for x in findings)\n    return {\"now\": now, \"tolerance_seconds\"\
  : tol, \"results\": results, \"findings\": findings,\n            \"summary\": {k:\
  \ summary.get(k, 0) for k in (\"high\", \"medium\", \"low\")}}\n\n\ndef print_text(rep):\n\
  \    print(\"Webhook verification report (now=%s, tolerance %ss)\" % (datetime.fromtimestamp(rep[\"\
  now\"], timezone.utc).strftime(\"%Y-%m-%d %H:%M:%SZ\"), rep[\"tolerance_seconds\"\
  ]))\n    print(\"\\nDeliveries:\")\n    for r in rep[\"results\"]:\n        print(\"\
  \  %-6s %-14s %s\" % (r[\"delivery\"], r.get(\"endpoint\", \"?\"), r[\"verdict\"\
  ]))\n    print(\"\\nFindings: %(high)d high, %(medium)d medium, %(low)d low\" %\
  \ rep[\"summary\"])\n    for f in rep[\"findings\"]:\n        where = f[\"delivery\"\
  ] or (\"endpoint \" + str(f[\"endpoint\"]))\n        print(\"  [%s] %s %s: %s\"\
  \ % (f[\"severity\"].upper(), f[\"code\"], where, f[\"message\"]))\n\n\ndef self_test():\n\
  \    ok = 0; total = 0\n    def t(name, cond):\n        nonlocal ok, total\n   \
  \     total += 1; ok += bool(cond)\n        print((\"PASS  \" if cond else \"FAIL\
  \  \") + name)\n    sec = \"whsec_selftest_7f3a9c2e5b1d48a6b0c4e2f19d7a3b58\"\n\
  \    body = '{\"id\":\"evt_1\",\"type\":\"invoice.paid\",\"amount\":4200}'\n   \
  \ ts = 1794560400\n    def rep_for(dels, eps=None, now=ts + 10):\n        eps =\
  \ eps or {\"s\": {\"scheme\": \"stripe\", \"secret\": sec, \"url\": \"https://x.test/hook\"\
  }}\n        return run({\"endpoints\": eps, \"deliveries\": dels}, datetime.fromtimestamp(now,\
  \ timezone.utc).isoformat())\n    good = {\"id\": \"a\", \"endpoint\": \"s\", \"\
  event_id\": \"evt_1\", \"headers\": sign(\"stripe\", sec, body, ts), \"body\": body}\n\
  \    r = rep_for([good]); t(\"stripe valid accepted\", r[\"results\"][0][\"verdict\"\
  ] == \"accept\" and r[\"summary\"][\"high\"] == 0)\n    r = rep_for([good], now=ts\
  \ + 900); t(\"WH03 stale timestamp\", any(f[\"code\"] == \"WH03\" for f in r[\"\
  findings\"]))\n    r = rep_for([good], now=ts - 600); t(\"WH05 future timestamp\"\
  , any(f[\"code\"] == \"WH05\" for f in r[\"findings\"]))\n    r = rep_for([good,\
  \ dict(good, id=\"b\")]); t(\"WH04 duplicate id\", any(f[\"code\"] == \"WH04\" for\
  \ f in r[\"findings\"]) and r[\"results\"][1][\"verdict\"].startswith(\"accept-duplicate\"\
  ))\n    pretty = json.dumps(json.loads(body))\n    bad = dict(good, id=\"c\", body=pretty,\
  \ headers=sign(\"stripe\", sec, body, ts))\n    r = rep_for([bad]); t(\"WH01 re-serialized\
  \ body diagnosed\", any(f[\"code\"] == \"WH01\" and \"re-serialized\" in f[\"message\"\
  ] for f in r[\"findings\"]))\n    eps = {\"g\": {\"scheme\": \"github\", \"secret\"\
  : sec, \"previous_secrets\": [\"old_secret_value_1234567890abcdef\"], \"url\": \"\
  https://x.test/gh\"}}\n    old = {\"id\": \"d\", \"endpoint\": \"g\", \"event_id\"\
  : \"g1\", \"headers\": sign(\"github\", \"old_secret_value_1234567890abcdef\", body),\
  \ \"body\": body}\n    r = rep_for([old], eps); t(\"WH07 previous secret\", any(f[\"\
  code\"] == \"WH07\" for f in r[\"findings\"]) and r[\"results\"][0][\"verdict\"\
  ] == \"accept-rotate-secret\")\n    nohdr = {\"id\": \"e\", \"endpoint\": \"g\"\
  , \"event_id\": \"g2\", \"headers\": {\"X-Hub-Signature\": \"sha1=abc\"}, \"body\"\
  : body}\n    r = rep_for([nohdr], eps); t(\"WH02 + WH06 legacy sha1 only\", {\"\
  WH02\", \"WH06\"} <= {f[\"code\"] for f in r[\"findings\"]})\n    eps2 = {\"sl\"\
  : {\"scheme\": \"slack\", \"secret\": \"short\", \"url\": \"http://x.test/slack\"\
  }}\n    sl = {\"id\": \"f\", \"endpoint\": \"sl\", \"headers\": sign(\"slack\",\
  \ \"short\", body, ts), \"body\": body}\n    r = rep_for([sl], eps2); codes = {f[\"\
  code\"] for f in r[\"findings\"]}\n    t(\"slack valid + WH08 weak secret + WH09\
  \ http + WH10 no id\", {\"WH08\", \"WH09\", \"WH10\"} <= codes and \"WH01\" not\
  \ in codes)\n    nots = {\"id\": \"g\", \"endpoint\": \"s\", \"event_id\": \"e9\"\
  , \"headers\": {\"Stripe-Signature\": \"t=%d,v1=%s\" % (ts, digest(sec, body, \"\
  sha256\", \"hex\"))}, \"body\": body}\n    r = rep_for([nots]); t(\"WH01 missing\
  \ timestamp in signed string diagnosed\", any(\"timestamp prefix\" in f[\"message\"\
  ] for f in r[\"findings\"]))\n    eps3 = {\"sh\": {\"scheme\": \"shopify\", \"secret\"\
  : sec, \"url\": \"https://x.test/shop\"}}\n    hexsig = {\"id\": \"h\", \"endpoint\"\
  : \"sh\", \"event_id\": \"s1\", \"headers\": {\"X-Shopify-Hmac-Sha256\": digest(sec,\
  \ body, \"sha256\", \"hex\")}, \"body\": body}\n    r = rep_for([hexsig], eps3);\
  \ t(\"WH01 hex vs base64 diagnosed\", any(\"encoding\" in f[\"message\"] for f in\
  \ r[\"findings\"]))\n    eps4 = {\"gen\": {\"scheme\": \"generic\", \"header\":\
  \ \"X-Signature\", \"alg\": \"sha512\", \"enc\": \"hex\", \"prefix\": \"\", \"template\"\
  : \"{body}\", \"secret\": sec, \"url\": \"https://x.test/g\"}}\n    gen = {\"id\"\
  : \"i\", \"endpoint\": \"gen\", \"event_id\": \"x1\", \"headers\": {\"X-Signature\"\
  : digest(sec, body, \"sha512\", \"hex\")}, \"body\": body}\n    r = rep_for([gen],\
  \ eps4); t(\"generic sha512 scheme accepted\", r[\"results\"][0][\"verdict\"] ==\
  \ \"accept\")\n    print(\"%d/%d passed\" % (ok, total))\n    return 0 if ok ==\
  \ total else 1\n\n\ndef main():\n    ap = argparse.ArgumentParser(description=__doc__,\
  \ formatter_class=argparse.RawDescriptionHelpFormatter)\n    ap.add_argument(\"\
  file\", nargs=\"?\")\n    ap.add_argument(\"--now\"); ap.add_argument(\"--json\"\
  , action=\"store_true\")\n    ap.add_argument(\"--sign\", choices=sorted(SCHEMES));\
  \ ap.add_argument(\"--secret\"); ap.add_argument(\"--body-file\"); ap.add_argument(\"\
  --timestamp\", type=int)\n    ap.add_argument(\"--self-test\", action=\"store_true\"\
  )\n    a = ap.parse_args()\n    if a.self_test:\n        return self_test()\n  \
  \  if a.sign:\n        if not (a.secret and a.body_file):\n            print(\"\
  --sign needs --secret and --body-file\", file=sys.stderr); return 2\n        body\
  \ = open(a.body_file, encoding=\"utf-8\", newline=\"\").read()\n        ts = a.timestamp\
  \ or int(datetime.now(timezone.utc).timestamp())\n        print(json.dumps(sign(a.sign,\
  \ a.secret, body, ts), indent=2)); return 0\n    if not a.file:\n        ap.print_help();\
  \ return 2\n    try:\n        with open(a.file, encoding=\"utf-8\") as fh:\n   \
  \         data = json.load(fh)\n        rep = run(data, a.now)\n    except (OSError,\
  \ ValueError, KeyError) as e:\n        print(\"bad input: %s\" % e, file=sys.stderr);\
  \ return 2\n    if a.json:\n        print(json.dumps(rep, indent=2))\n    else:\n\
  \        print_text(rep)\n    return 1 if rep[\"summary\"][\"high\"] else 0\n\n\n\
  if __name__ == \"__main__\":\n    sys.exit(main())"
