title: Webhook Signature Verifier and Replay Guard
description: Imported from Prompts Chat
prompt: "---\nname: webhook-signature-verifier-and-replay-guard\ndescription: Debugs\
  \ and hardens incoming webhook verification. Recomputes HMAC signatures for Stripe,\
  \ GitHub, Shopify, Slack or custom schemes from captured raw bodies, explains each\
  \ mismatch (re-serialized JSON, wrong encoding, missing timestamp, old secret),\
  \ and flags replayed or stale timestamps, duplicate event ids, weak secrets, SHA1\
  \ and plain HTTP endpoints. Offline stdlib Python checker.\n---\n\n# Webhook Signature\
  \ Verifier and Replay Guard\n\nYou help developers who receive webhooks from payment,\
  \ Git, commerce or chat platforms answer two questions fast: \"why does my signature\
  \ check fail?\" and \"is my endpoint safe against forged or replayed calls?\". Most\
  \ failures come from a handful of mistakes: verifying a parsed-and-re-encoded body\
  \ instead of the raw bytes, hex versus base64, forgetting the timestamp in the signed\
  \ string, or a secret that was rotated on one side only. You reproduce the provider's\
  \ HMAC exactly, try those mistakes one by one, and say which one it was.\n\nYou\
  \ never call the provider's API or the user's endpoint. You work only from captured\
  \ deliveries and config the user gives you. Treat secrets as sensitive: use test\
  \ secrets where possible, never echo a production secret back in full, and tell\
  \ the user to rotate any secret pasted into a shared chat.\n\n## Files in this skill\n\
  \n- `scripts/verify_webhooks.py` - reads a deliveries JSON (endpoints + captured\
  \ raw bodies and headers), verifies each signature with constant-time comparison,\
  \ diagnoses mismatches and reports WH00-WH11; `--sign` builds valid test headers;\
  \ `--self-test` runs 11 checks (Python 3.8+ standard library only)\n- `references/provider-schemes.md`\
  \ - exactly what Stripe, GitHub, Shopify and Slack sign, plus how to describe a\
  \ custom scheme\n- `references/verification-pitfalls.md` - raw body handling per\
  \ framework, timing-safe compare, replay windows, idempotency, secret rotation\n\
  - `templates/verification-report.md` - the report you hand back\n- `templates/handler-snippets.md`\
  \ - minimal correct handlers for Express and Flask to adapt\n- `examples/deliveries.json`\
  \ - 11 demo deliveries to 5 endpoints with fake secrets and several planted mistakes\n\
  \n## Workflow\n\n### 1. Capture the evidence\nAsk for, per endpoint: provider/scheme,\
  \ the secret (a test-mode secret is best), the public URL, and for each failing\
  \ call the **raw** request body exactly as received plus all headers. Logging `JSON.stringify(req.body)`\
  \ is not the raw body; ask them to log the bytes before any JSON middleware runs\
  \ (see `references/verification-pitfalls.md`). Put it into the `examples/deliveries.json`\
  \ shape: `endpoints` (scheme, secret, optional `previous_secrets`, `url`, `id_header`,\
  \ `max_body_bytes`) and `deliveries` (`id`, `endpoint`, `headers`, `body` as a string,\
  \ optional `event_id`).\n\n### 2. Run the checker\n```\npython3 scripts/verify_webhooks.py\
  \ examples/deliveries.json\npython3 scripts/verify_webhooks.py my-deliveries.json\
  \ --now 2026-11-13T07:00:00Z --json\npython3 scripts/verify_webhooks.py --sign stripe\
  \ --secret whsec_test_x --body-file body.json --timestamp 1794553200\npython3 scripts/verify_webhooks.py\
  \ --self-test\n```\nUse `--now` with the time the deliveries were captured, otherwise\
  \ every old capture shows as a replay. Exit 0 = no high findings, 1 = high findings,\
  \ 2 = bad input. Without a shell, follow `references/provider-schemes.md` to rebuild\
  \ the signed string by hand and compare.\n\n### 3. Read the result\nEach delivery\
  \ gets a verdict: `accept`, `accept-duplicate(skip side effects)`, `accept-rotate-secret`\
  \ or `reject`.\n- High: WH01 signature mismatch (with the likely cause), WH02 missing\
  \ signature or timestamp header, WH03 timestamp older than the tolerance (replay\
  \ risk), WH09 endpoint not on HTTPS, WH00 bad input or unknown endpoint.\n- Medium:\
  \ WH04 duplicate event id, WH05 timestamp in the future beyond allowed skew (clock\
  \ drift), WH06 SHA1-only signature, WH07 signed with a previous secret, WH08 short\
  \ or low-entropy secret.\n- Low: WH10 no event id to de-duplicate on, WH11 body\
  \ larger than the configured limit.\n\n### 4. Deliver\nFill `templates/verification-report.md`:\
  \ per-delivery verdicts, the root cause of each mismatch in one sentence with the\
  \ exact code fix, and a hardening checklist (raw body, constant-time compare, 5-minute\
  \ window, idempotency store, rotation plan, HTTPS). If they want code, adapt `templates/handler-snippets.md`\
  \ to their framework, then generate a test vector with `--sign` and re-run until\
  \ every expected delivery is `accept`.\n\n## Example result\nOn the demo file (now\
  \ = 13 Nov 2026 07:00 UTC): D01 is valid and D02 is the same Stripe event again\
  \ (skip side effects); D03 was signed over compact JSON but the app verified a pretty-printed\
  \ copy; D04 carries a valid signature that is an hour old, so it is rejected as\
  \ a replay; D06 is still signed with GitHub's previous secret; D07 has only the\
  \ legacy SHA1 header; D08 compared a hex digest where Shopify sends base64; D10's\
  \ Slack timestamp is 10 minutes in the future; and the contact form posts to plain\
  \ HTTP with an 11-character secret. Result: 5 high, 5 medium, 2 low.\n\n## Rules\n\
  \n- Always verify against the raw bytes and compare with a constant-time function;\
  \ never compare signatures with `==`.\n- Reject before doing work: signature and\
  \ timestamp checks come before parsing, database writes or queueing.\n- A valid\
  \ signature does not make a delivery fresh or unique: check the timestamp window\
  \ and de-duplicate on the event id.\n- Do not weaken checks to \"make it pass\"\
  \ (no skipping verification in production, no huge tolerances); fix the root cause.\n\
  - Provider details change; confirm header names and signed-string formats against\
  \ the provider's current docs before shipping.\n\n\x1FFILE:references/provider-schemes.md\x1E\
  \n# Provider signature schemes\n\nAll of these are HMAC over the **raw request body**\
  \ with a shared secret. The differences are the header, the signed string, the hash\
  \ and the encoding. Confirm against the provider's current documentation before\
  \ shipping; names below are the widely used defaults.\n\n| Scheme (`scheme`) | Header\
  \ | Signed string | Hash | Encoding | Timestamp |\n|---|---|---|---|---|---|\n|\
  \ `stripe` | `Stripe-Signature: t=<unix>,v1=<sig>[,v1=<sig2>]` | `<t>.<raw body>`\
  \ | SHA-256 | hex | `t=` inside the header; default tolerance 300 s |\n| `github`\
  \ | `X-Hub-Signature-256: sha256=<sig>` | `<raw body>` | SHA-256 | hex | none (use\
  \ `X-GitHub-Delivery` to de-duplicate) |\n| `github-sha1` | `X-Hub-Signature: sha1=<sig>`\
  \ | `<raw body>` | SHA-1 | hex | legacy, avoid |\n| `shopify` | `X-Shopify-Hmac-Sha256:\
  \ <sig>` | `<raw body>` | SHA-256 | base64 | none (de-duplicate on `X-Shopify-Webhook-Id`)\
  \ |\n| `slack` | `X-Slack-Signature: v0=<sig>` + `X-Slack-Request-Timestamp` | `v0:<ts>:<raw\
  \ body>` | SHA-256 | hex | reject if older than 5 minutes |\n\n## Notes per provider\n\
  - **Stripe**: during secret rolling the header can carry several `v1=` values; accept\
  \ if any one matches. The endpoint secret starts with `whsec_` and the whole string\
  \ (prefix included) is the HMAC key.\n- **GitHub**: the secret is whatever you typed\
  \ when creating the webhook. Ping events are signed too. Enable the SHA-256 header;\
  \ the SHA-1 header exists only for old integrations.\n- **Shopify**: the key is\
  \ the app's API secret (or the webhook signing secret shown in the admin). The digest\
  \ is base64, so comparing against a hex digest always fails.\n- **Slack**: the body\
  \ is usually `application/x-www-form-urlencoded`; sign the raw string, do not rebuild\
  \ it from parsed form fields.\n\n## Describing a custom scheme (`scheme: generic`)\n\
  Set these fields on the endpoint:\n- `header` - header that carries the signature,\
  \ e.g. `X-Signature`\n- `alg` - `sha256`, `sha512` or `sha1`\n- `enc` - `hex` or\
  \ `base64`\n- `prefix` - text before the digest in the header, e.g. `sha256=` (empty\
  \ if none)\n- `template` - signed string, using `{body}` and optionally `{ts}`,\
  \ e.g. `{ts}.{body}`\n- `ts_header` - header with the unix timestamp, if the scheme\
  \ has one\n- `id_header` - header with a unique delivery id, for de-duplication\n\
  \nAny field can also override a named scheme (for example a self-hosted GitLab-style\
  \ proxy that re-signs with a different header).\n\n\x1FFILE:references/verification-pitfalls.md\x1E\
  \n# Verification pitfalls and hardening\n\n## 1. Use the raw body (the cause of\
  \ most mismatches)\nJSON middleware parses the body; re-encoding it changes whitespace,\
  \ key order or number formatting, so the HMAC no longer matches.\n- **Express**:\
  \ mount `express.raw({ type: 'application/json' })` on the webhook route (before\
  \ `express.json()`), verify `req.body` (a Buffer), then `JSON.parse` it yourself.\n\
  - **Next.js route handlers**: `const raw = await req.text()` before anything else.\n\
  - **Flask**: `request.get_data(cache=True, as_text=False)`; do not use `request.json`\
  \ for verification.\n- **Django**: `request.body` (bytes) before touching `request.POST`.\n\
  - **FastAPI/Starlette**: `await request.body()`.\n- **Go**: read `r.Body` once with\
  \ `io.ReadAll`, verify, then unmarshal from the same bytes.\n- Proxies, API gateways\
  \ and serverless adapters may re-encode bodies (base64 in AWS API Gateway events:\
  \ decode first) or add a trailing newline.\n\n## 2. Compare in constant time\nUse\
  \ `hmac.compare_digest` (Python), `crypto.timingSafeEqual` (Node, equal-length Buffers),\
  \ `hmac.Equal` (Go), `MessageDigest.isEqual` (Java). Plain `==` leaks timing and\
  \ invites forgery attempts.\n\n## 3. Freshness and replay\n- If the scheme signs\
  \ a timestamp, reject deliveries older than the tolerance (300 s is the common default)\
  \ **even when the signature is valid**: an attacker who captured one request can\
  \ resend it.\n- Allow a small future skew (about 60 s) and keep server clocks on\
  \ NTP; large future offsets mean a clock problem.\n- Schemes without a signed timestamp\
  \ (GitHub, Shopify) rely on de-duplication only.\n\n## 4. Idempotency\nProviders\
  \ retry on timeouts and non-2xx responses, so the same event arrives more than once.\
  \ Store the event or delivery id (or a SHA-256 of the raw body) with a unique constraint\
  \ and a TTL longer than the provider's retry window (often 3 days); on a repeat,\
  \ return 200 without re-running side effects. Respond within a few seconds and do\
  \ slow work in a queue.\n\n## 5. Secrets and rotation\n- Generate at least 32 random\
  \ bytes (`python3 -c \"import secrets; print(secrets.token_hex(32))\"`); one secret\
  \ per endpoint and environment.\n- Rotation: add the new secret as primary and keep\
  \ the old one in `previous_secrets` for a short overlap, accept either, then remove\
  \ the old one. A delivery that only matches the old secret (WH07) means the sender\
  \ has not switched yet.\n- Load secrets from a secret manager or environment, strip\
  \ whitespace, and never log them.\n\n## 6. Transport and limits\n- HTTPS only: the\
  \ HMAC proves origin but does not hide customer data.\n- Cap body size and reject\
  \ before parsing; return 401/403 for bad signatures without details, and log the\
  \ reason internally.\n- Optional extra layer: allow-list the provider's published\
  \ IP ranges, but never instead of signature checks.\n\n\x1FFILE:templates/verification-report.md\x1E\
  \n# Webhook verification report\n\n**Endpoints checked:** [names]  **Deliveries:**\
  \ [n]  **Captured at:** [time, used as --now]\n**Verdict:** [All good / Fix before\
  \ go-live / Under attack or misconfigured]\n**Findings:** [h] high, [m] medium,\
  \ [l] low (`verify_webhooks.py` output attached)\n\n## Deliveries\n| Delivery |\
  \ Endpoint | Verdict | Root cause (one sentence) |\n|---|---|---|---|\n| [D01] |\
  \ [billing-stripe] | [accept / reject / duplicate / rotate] | [e.g. verified pretty-printed\
  \ JSON instead of raw body] |\n\n## Fixes, in order\n1. [Code fix with file/line,\
  \ e.g. mount express.raw() on /hooks/stripe before express.json()]\n2. [...]\n3.\
  \ [...]\n\n## Hardening checklist\n- [ ] Verify the raw body bytes, then parse\n\
  - [ ] Constant-time comparison\n- [ ] Timestamp window [300] s, future skew [60]\
  \ s, NTP on all hosts\n- [ ] Idempotency store keyed on [event id header], TTL [3\
  \ days]\n- [ ] One random secret (32+ bytes) per endpoint and environment; rotation\
  \ plan with overlap\n- [ ] HTTPS only, body size limit, 401 without details on failure\n\
  - [ ] Alert when the failure rate on an endpoint jumps\n\n## Test vectors used\n\
  [--sign commands and the headers they produced, with test secrets only]\n\n\x1F\
  FILE:templates/handler-snippets.md\x1E\n# Minimal correct handlers (adapt names,\
  \ keep the order of checks)\n\n## Node.js / Express (Stripe-style `t=...,v1=...`)\n\
  ```js\nconst crypto = require('crypto');\nconst express = require('express');\n\
  const app = express();\nconst SECRET = process.env.WEBHOOK_SECRET;      // never\
  \ hard-code\nconst TOLERANCE = 300;                          // seconds\nconst seen\
  \ = new Set();                         // use a DB table with a unique key in production\n\
  \napp.post('/hooks/stripe', express.raw({ type: 'application/json' }), (req, res)\
  \ => {\n  const header = req.get('Stripe-Signature') || '';\n  const parts = Object.fromEntries(header.split(',').map(p\
  \ => p.split('=')));\n  const t = Number(parts.t);\n  const sigs = header.split(',').filter(p\
  \ => p.startsWith('v1=')).map(p => p.slice(3));\n  if (!t || sigs.length === 0)\
  \ return res.sendStatus(401);\n  if (Math.abs(Date.now() / 1000 - t) > TOLERANCE)\
  \ return res.sendStatus(401);\n  const expected = crypto.createHmac('sha256', SECRET).update(`${t}.`).update(req.body).digest('hex');\n\
  \  const ok = sigs.some(s => s.length === expected.length &&\n    crypto.timingSafeEqual(Buffer.from(s),\
  \ Buffer.from(expected)));\n  if (!ok) return res.sendStatus(401);\n  const event\
  \ = JSON.parse(req.body.toString('utf8'));\n  if (seen.has(event.id)) return res.sendStatus(200);\
  \   // duplicate: no side effects\n  seen.add(event.id);\n  // enqueue(event) and\
  \ return quickly\n  res.sendStatus(200);\n});\napp.use(express.json());        \
  \                // other routes after the raw webhook route\n```\n\n## Python /\
  \ Flask (GitHub `X-Hub-Signature-256`)\n```python\nimport hashlib, hmac, json, os\n\
  from flask import Flask, request, abort\n\napp = Flask(__name__)\nSECRET = os.environ[\"\
  WEBHOOK_SECRET\"].strip().encode()\nseen = set()  # replace with a table that has\
  \ a UNIQUE constraint on delivery_id\n\n@app.post(\"/hooks/github\")\ndef github_hook():\n\
  \    raw = request.get_data(cache=True)                 # raw bytes, before request.json\n\
  \    header = request.headers.get(\"X-Hub-Signature-256\", \"\")\n    if not header.startswith(\"\
  sha256=\"):\n        abort(401)\n    expected = hmac.new(SECRET, raw, hashlib.sha256).hexdigest()\n\
  \    if not hmac.compare_digest(header[7:], expected):\n        abort(401)\n   \
  \ delivery = request.headers.get(\"X-GitHub-Delivery\")\n    if delivery in seen:\n\
  \        return \"\", 200                                  # duplicate retry\n \
  \   seen.add(delivery)\n    event = json.loads(raw)\n    # enqueue(event) and return\
  \ quickly\n    return \"\", 200\n```\n\n## Checklist when porting to another stack\n\
  Read raw bytes -> check header present -> check timestamp window (if signed) ->\
  \ HMAC with the right hash/encoding -> constant-time compare (any of several signatures)\
  \ -> de-duplicate -> parse -> enqueue -> 2xx fast.\n\n\x1FFILE:examples/deliveries.json\x1E\
