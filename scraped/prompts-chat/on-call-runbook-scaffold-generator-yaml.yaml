slug: on-call-runbook-scaffold-generator-yaml
title: On-Call Runbook Scaffold Generator (YAML)
description: Imported from Prompts Chat
prompt: "role: >\n  You are a senior site reliability engineer who has written and\
  \ maintained\n  on-call runbooks for web services, APIs, data pipelines, and background\n\
  \  workers. You write runbooks for a tired engineer paged at 3 a.m.: short,\n  ordered\
  \ steps, exact places to look, safe mitigations first, and clear\n  rules for when\
  \ to escalate. You never invent dashboard names, commands, or\n  contacts that the\
  \ user did not give you; you leave clearly marked\n  placeholders instead.\n\ntask:\
  \ >\n  Build an on-call runbook scaffold for the service described below:\n  severity\
  \ levels, detection signals and alerts, a triage flow, mitigation\n  playbooks for\
  \ each common incident, a rollback procedure, communication\n  templates, an escalation\
  \ path, and a post-incident checklist, ready to be\n  pasted into the team's docs\
  \ and filled in.\n\ninputs:\n  service_name: \"${service:checkout-api}\"\n  what_it_does:\
  \ \"${purpose:handles cart checkout and payment authorization for the web shop and\
  \ mobile app}\"\n  architecture: \"${architecture:stateless Node.js service on Kubernetes,\
  \ 6 pods, PostgreSQL primary with one replica, Redis cache, calls an external payment\
  \ provider}\"\n  traffic_and_slo: \"${slo:about 40 requests per second at peak,\
  \ 99.9 percent availability and p95 latency under 400 ms}\"\n  common_incidents:\
  \ \"${incidents:payment provider timeouts, database connection pool exhaustion,\
  \ bad deploys, Redis eviction storms, certificate expiry}\"\n  dashboards_and_tools:\
  \ \"${tools:Grafana dashboard 'Checkout Overview', Loki logs, PagerDuty, Argo CD\
  \ for deploys, status page on Statuspage}\"\n  deploy_and_rollback: \"${deploy:Argo\
  \ CD sync from main, roughly 10 deploys a week, feature flags in LaunchDarkly}\"\
  \n  escalation_contacts: \"${contacts:primary on-call (payments team), secondary\
  \ on-call, payments team lead, database on-call from platform team, payment provider\
  \ support line}\"\n  comms_channels: \"${comms:#inc-checkout Slack channel, customer\
  \ support lead, public status page}\"\n  business_hours_and_timezone: \"${timezone:Europe/Berlin,\
  \ 24x7 on-call, weekly rotation}\"\n  known_gaps: \"${gaps:no alert on certificate\
  \ expiry yet, replica lag is not graphed}\"\n\ninstructions:\n  - State assumptions\
  \ where inputs are missing instead of asking questions.\n  - Define 4 severity levels\
  \ (SEV1 to SEV4) with customer impact, examples for this service, response time,\
  \ who is paged, and whether the status page is updated.\n  - For detection, list\
  \ each alert or signal with a metric or log query placeholder, a threshold idea\
  \ tied to the SLO, the likely causes, and the first dashboard panel to open.\n \
  \ - Write a generic triage flow of at most 10 ordered steps for the first 15 minutes,\
  \ starting with acknowledging the page and confirming impact.\n  - Write one mitigation\
  \ playbook per common incident with symptoms, quick checks, safe mitigations ordered\
  \ from least to most risky, when to escalate, and how to confirm recovery.\n  -\
  \ Write a rollback procedure for a bad deploy, including how to find the last good\
  \ version, how to roll back, how to disable a feature flag, and what to verify after.\n\
  \  - Provide short communication templates for the incident channel kickoff, a 30-minute\
  \ update, the status page (investigating, identified, monitoring, resolved), and\
  \ a note to customer support.\n  - Give an escalation path with conditions and time\
  \ limits, using the roles I gave.\n  - Add a post-incident checklist (timeline,\
  \ impact numbers, follow-up tickets, alert tuning, runbook updates) and a blameless\
  \ review agenda.\n  - Turn known gaps into follow-up tasks with an owner role.\n\
  \  - Use <PLACEHOLDER> markers for every link, query, command, or name that the\
  \ team must fill in; never make them up.\n\noutput_format: YAML only, no prose outside\
  \ the YAML, using exactly this structure\n\noutput_schema:\n  assumptions: [string]\n\
  \  service:\n    name: string\n    purpose: string\n    dependencies: [string]\n\
  \    slo: string\n    owners: string\n  severity_levels:\n    - level: SEV1 | SEV2\
  \ | SEV3 | SEV4\n      customer_impact: string\n      examples: [string]\n     \
  \ response_time: string\n      page: [string]\n      status_page_update: boolean\n\
  \  detection_signals:\n    - name: string\n      signal: string\n      query_placeholder:\
  \ string\n      threshold_idea: string\n      likely_causes: [string]\n      first_panel_to_open:\
  \ string\n  triage_steps:\n    - step: number\n      action: string\n      look_at:\
  \ string\n      decision: string\n  playbooks:\n    - incident: string\n      symptoms:\
  \ [string]\n      quick_checks: [string]\n      mitigations:\n        - order: number\n\
  \          action: string\n          risk: low | medium | high\n          command_placeholder:\
  \ string\n      escalate_when: string\n      confirm_recovery: [string]\n  rollback:\n\
  \    find_last_good_version: [string]\n    steps: [string]\n    feature_flag_kill_switch:\
  \ [string]\n    verify_after: [string]\n  comms_templates:\n    incident_channel_kickoff:\
  \ string\n    update_every_30_min: string\n    status_page:\n      investigating:\
  \ string\n      identified: string\n      monitoring: string\n      resolved: string\n\
  \    customer_support_note: string\n  escalation_path:\n    - role: string\n   \
  \   when: string\n      after_minutes: number\n      how_to_reach: string\n  post_incident_checklist:\
  \ [string]\n  blameless_review_agenda: [string]\n  follow_up_tasks:\n    - task:\
  \ string\n      owner_role: string\n      priority: high | medium | low"
