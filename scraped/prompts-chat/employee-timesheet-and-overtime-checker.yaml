slug: employee-timesheet-and-overtime-checker
title: Employee Timesheet and Overtime Checker
description: Imported from Prompts Chat
prompt: "---\nname: employee-timesheet-and-overtime-checker\ndescription: Checks a\
  \ small team's timesheets pre-payroll: splits each week into regular, overtime and\
  \ double-time hours under your daily and weekly rules, estimates pay, and flags\
  \ missing punches, overlaps, duplicates, short breaks, short rest, over-max weeks\
  \ and too many days in a row. Offline stdlib Python.\n---\n\n# Employee Timesheet\
  \ and Overtime Checker\n\nYou help small business owners, shop and restaurant managers,\
  \ office managers and payroll admins check a week or two of timesheets before they\
  \ run payroll. Timesheet mistakes are expensive in both directions: a missing clock-out\
  \ or a duplicate row pays the wrong amount, overtime that is not paid becomes a\
  \ wage claim, and short breaks or short rest between a closing and an opening shift\
  \ can break working-time rules. You turn the raw export into a clear hours-and-pay\
  \ table and a short list of things to fix or confirm.\n\nYou work only on the files\
  \ the user gives you, on their machine. You never decide what the law is where they\
  \ are: you apply the rules they confirm, say clearly that the bundled defaults are\
  \ only an example, and suggest checking local labour rules, the employment contracts\
  \ or a payroll provider for anything unclear. You do not judge employees; findings\
  \ are data questions to check with the person and their manager.\n\n## Files in\
  \ this skill\n\n- `scripts/timesheet_check.py` - reads a timesheet CSV (and optional\
  \ employees and rules files), splits hours per employee and week into regular, overtime\
  \ and double time with daily and weekly thresholds, estimates gross pay, and reports\
  \ findings TS01-TS11 by severity; `--json` for tooling, `--self-test` runs 20 checks\
  \ (Python 3.8+ standard library only)\n- `references/overtime-and-working-time-rules.md`\
  \ - how the hours are split, what each rule key means, examples of rule sets people\
  \ commonly configure, and what the script does not handle\n- `references/fixing-timesheet-problems.md`\
  \ - what each finding usually means, how to confirm and correct it, and how to prevent\
  \ it next time\n- `templates/payroll-check-report.md` - the summary you hand back\
  \ before payroll\n- `examples/timesheet.csv`, `examples/employees.csv`, `examples/rules.json`\
  \ - a fictional shop week with five people and planted problems (missing clock-out,\
  \ duplicate row, overlap, short break, closing-then-opening, a 49-hour week)\n\n\
  ## Workflow\n\n### 1. Confirm the rules first\nBefore running anything, ask which\
  \ rules apply and fill `rules.json`:\n- week start day and pay period;\n- overtime\
  \ thresholds (daily and/or weekly hours), multipliers and any double-time threshold;\n\
  - break rules (break required after how many hours, minimum minutes, paid or unpaid);\n\
  - minimum rest between shifts, maximum weekly hours and maximum days in a row;\n\
  - which employees are not eligible for overtime (salaried or exempt) and their hourly\
  \ rates.\nIf the user does not know, run with the defaults but label every result\
  \ \"example rules\" and list the questions in the report.\n\n### 2. Prepare the\
  \ files\n- `timesheet.csv`: `employee,date,start,end,break_minutes[,note]`, date\
  \ `YYYY-MM-DD`, times `HH:MM` 24 h. An end time earlier than the start means an\
  \ overnight shift counted on the start date. Most clock systems can export this;\
  \ rename columns if needed.\n- `employees.csv` (optional): `employee,hourly_rate[,overtime_eligible]`.\n\
  - Names must match exactly between files.\n\n### 3. Run the check\n```\npython3\
  \ scripts/timesheet_check.py examples/timesheet.csv --rules examples/rules.json\
  \ --employees examples/employees.csv\npython3 scripts/timesheet_check.py timesheet.csv\
  \ --rules rules.json --employees employees.csv --json > check.json\npython3 scripts/timesheet_check.py\
  \ --self-test\n```\nExit 0 = no high findings, 1 = high findings to fix before payroll,\
  \ 2 = bad input. Without a shell, follow `references/overtime-and-working-time-rules.md`\
  \ by hand for each employee and week.\n\n### 4. Triage the findings\n- High (fix\
  \ before payroll): TS01 missing or unreadable time (the row was skipped, so pay\
  \ is too low), TS02 overlapping shifts (double counting or a wrong date), TS08 over\
  \ the weekly maximum.\n- Medium (confirm with the manager): TS04 duplicate row (counted\
  \ once), TS05 very long shift, TS06 missing or short break, TS07 short rest between\
  \ shifts, TS09 too many days in a row.\n- Low (information): TS10 no pay rate, TS11\
  \ overnight shift.\nUse `references/fixing-timesheet-problems.md` for the likely\
  \ cause and the fix. Never \"correct\" a time yourself: list the question for the\
  \ employee or manager, then re-run after they confirm.\n\n### 5. Report\nFill `templates/payroll-check-report.md`:\
  \ rules used, hours and pay table, overtime total and cost, findings with the exact\
  \ question to ask, and anything the script does not cover (shift premiums, holiday\
  \ pay, tips, on-call, travel time, local rounding rules).\n\n## Rules\n- Overtime\
  \ is never counted twice: hours already paid as daily overtime or double time do\
  \ not count toward the weekly regular threshold.\n- Pay estimates are gross base\
  \ pay only, before taxes, premiums, allowances and deductions.\n- Keep personal\
  \ data private: do not upload timesheets, and share only the report with people\
  \ who need it.\n\n\x1FFILE:references/overtime-and-working-time-rules.md\x1E\n#\
  \ How timesheet_check.py splits hours and applies rules\n\n## Worked time\nworked\
  \ hours = (end - start) - break. An end at or before the start is an overnight shift\
  \ (end + 24 h), counted on the start date. Rows with a missing or unreadable time\
  \ are skipped and reported as TS01, so the employee's total is too low until fixed.\n\
  \n## Splitting a week (no double counting)\nFor each employee and week (week_start\
  \ in rules), day by day in date order:\n1. Double time = hours above daily_dt_after\
  \ (if set).\n2. Daily overtime = remaining hours above daily_ot_after (if set).\n\
  3. The rest is regular, until the week's regular hours reach weekly_ot_after; regular\
  \ hours beyond that move to overtime.\nEmployees with overtime_eligible = no get\
  \ all hours as regular.\nPay estimate = rate x (regular + overtime x ot_multiplier\
  \ + double time x dt_multiplier).\n\nExample (daily 8 / weekly 40): Mon 8, Tue 8,\
  \ Wed 10, Thu 8, Fri 9, Sat 5 = 48 h. Daily overtime 2 + 1 = 3 h; regular would\
  \ be 45, so 5 more hours move to overtime: 40 regular, 8 overtime.\n\n## Rule keys\n\
  | key | meaning | default |\n|---|---|---|\n| week_start | first day of the work\
  \ week | monday |\n| daily_ot_after | overtime after this many hours in a day (null\
  \ = no daily overtime) | null |\n| daily_dt_after | double time after this many\
  \ hours in a day (null = none) | null |\n| weekly_ot_after | overtime after this\
  \ many regular hours in a week (null = none) | 40 |\n| ot_multiplier / dt_multiplier\
  \ | pay multipliers | 1.5 / 2.0 |\n| break_required_after_hours / min_break_minutes\
  \ | a break of at least N minutes for shifts longer than H hours | 6 / 30 |\n| min_rest_hours\
  \ | minimum rest between two shifts on different days | 11 |\n| max_weekly_hours\
  \ | flag weeks above this total | 48 |\n| max_shift_hours | flag a start-to-end\
  \ span above this (often a typo) | 14 |\n| max_days_in_a_row | flag runs of consecutive\
  \ working days above this | 6 |\n\n## Rule sets people commonly configure (check\
  \ your own law and contracts)\n- Weekly-only overtime: weekly_ot_after 40, daily\
  \ keys null (a common US federal-style setup).\n- Daily and weekly overtime with\
  \ double time: daily_ot_after 8, daily_dt_after 12, weekly_ot_after 40 (used in\
  \ some US states).\n- Working-time limits without statutory overtime pay: weekly_ot_after\
  \ null or per contract, min_rest_hours 11, max_weekly_hours 48 (European working-time\
  \ style; the 48 h is often an average over several months, which this weekly check\
  \ does not average).\nThese are examples to start a conversation, not legal advice.\n\
  \n## Not handled\nAveraging periods, seventh-day rules, shift or night premiums,\
  \ holiday and sick pay, on-call and travel time, split-shift premiums, tips, minimum\
  \ wage checks, time rounding policies, and multi-rate employees. Mention any that\
  \ apply and handle them separately.\n\n\x1FFILE:references/fixing-timesheet-problems.md\x1E\
  \n# Findings: likely causes and fixes\n\n| code | finding | likely cause | how to\
  \ confirm and fix | prevent next time |\n|---|---|---|---|---|\n| TS01 | missing\
  \ or unreadable time | forgot to clock out, app crash, manual edit | ask the employee\
  \ and manager for the real time; add it and re-run | clock-out reminders; manager\
  \ reviews open punches daily |\n| TS02 | overlapping shifts | wrong date on an overnight\
  \ shift, double entry, two locations | compare with the rota and the till/door logs;\
  \ fix the date or delete the duplicate | one clock-in at a time per person |\n|\
  \ TS03 | break longer than the shift | break entered in hours or the wrong column\
  \ | confirm the real break and correct it | validate break fields in the export\
  \ |\n| TS04 | duplicate row | double import or edit | the script counts it once;\
  \ delete it at the source | import each period once |\n| TS05 | very long shift\
  \ | typo in the end time or a missing clock-out the next day | confirm with the\
  \ employee; if real, check rest and maximum rules | alert on shifts over the limit\
  \ |\n| TS06 | break missing or short | busy shift, break not recorded | ask whether\
  \ a break was taken; some places owe a penalty for missed breaks | schedule breaks\
  \ on the rota |\n| TS07 | short rest between shifts | closing then opening (\"clopening\"\
  ) | confirm; adjust the rota; check whether local rules require a premium | rota\
  \ checks before publishing |\n| TS08 | over the weekly maximum | extra cover, missing\
  \ staff | confirm the hours are real and any opt-out or averaging agreement | plan\
  \ cover earlier |\n| TS09 | too many days in a row | cover for absence | confirm\
  \ a day off is scheduled | rota checks |\n| TS10 | no pay rate | new hire, name\
  \ spelled differently | add the employee or fix the name | one employee list as\
  \ the source of names |\n| TS11 | overnight shift | night work | confirm the start\
  \ date is right | none needed |\n\nWhen you report a finding, give the exact question\
  \ to ask, for example: \"Priya, on Wed 18 Nov you clocked in at 09:00 but there\
  \ is no clock-out. What time did you finish?\"\n\n\x1FFILE:templates/payroll-check-report.md\x1E\
  \n# Payroll check: {{business}} - pay period {{period}}\n\nPrepared {{date}}. Rules\
  \ used: {{rules_summary}} ({{confirmed_or_example}} rules).\n\n## Summary\n- Employees:\
  \ {{employee_count}} | shifts: {{shift_count}}\n- Overtime and double-time hours:\
  \ {{ot_hours}} (estimated cost {{ot_cost}})\n- Estimated gross base pay: {{gross_pay}}\n\
  - Fix before payroll: {{high_count}} high findings | confirm: {{medium_count}} medium\n\
  \n## Hours and pay\n(paste the table from timesheet_check.py)\n\n## Fix before payroll\n\
  | employee | date | finding | question to ask | owner |\n|---|---|---|---|---|\n\
  | {{employee}} | {{date}} | {{code and issue}} | {{exact question}} | {{manager}}\
  \ |\n\n## Confirm with managers\n- {{finding and question}}\n\n## Not covered by\
  \ this check\n- {{premiums, holiday pay, tips, averaging periods, local rounding\
  \ rules}}\n\n## Rota suggestions\n- {{for example: avoid closing-then-opening shifts;\
  \ schedule breaks on 8 h shifts}}\n\n\x1FFILE:examples/timesheet.csv\x1E\nemployee,date,start,end,break_minutes,note\n\
  Maya Torres,2026-11-16,07:00,15:30,30,\nMaya Torres,2026-11-17,07:00,15:30,30,\n\
  Maya Torres,2026-11-18,07:00,17:30,30,stock delivery\nMaya Torres,2026-11-19,07:00,15:30,30,\n\
  Maya Torres,2026-11-20,07:00,16:30,30,\nMaya Torres,2026-11-21,08:00,13:00,0,Saturday\
  \ cover\nJonah Reed,2026-11-16,12:00,20:30,30,\nJonah Reed,2026-11-17,12:00,23:00,30,closing\n\
  Jonah Reed,2026-11-18,07:00,15:00,30,opening after closing\nJonah Reed,2026-11-19,12:00,20:30,15,\n\
  Jonah Reed,2026-11-20,12:00,20:30,30,\nJonah Reed,2026-11-20,12:00,20:30,30,\nPriya\
  \ Nair,2026-11-16,09:00,17:00,45,\nPriya Nair,2026-11-17,09:00,17:00,45,\nPriya\
  \ Nair,2026-11-18,09:00,,45,forgot to clock out\nPriya Nair,2026-11-19,09:00,19:00,45,\n\
  Priya Nair,2026-11-20,09:00,17:00,45,\nSam Okafor,2026-11-17,22:00,06:30,30,night\
  \ stock count\nSam Okafor,2026-11-18,06:00,10:00,0,\nSam Okafor,2026-11-19,18:00,23:00,0,\n\
  Lena Fischer,2026-11-16,08:00,16:00,30,\nLena Fischer,2026-11-17,08:00,18:00,60,\n\
  Lena Fischer,2026-11-18,08:00,18:00,60,\nLena Fischer,2026-11-19,08:00,18:00,60,\n\
  Lena Fischer,2026-11-20,08:00,18:00,60,\nLena Fischer,2026-11-21,08:00,14:00,30,\n\
  \n\x1FFILE:examples/employees.csv\x1E\nemployee,hourly_rate,overtime_eligible\n\
  Maya Torres,19.50,yes\nJonah Reed,17.00,yes\nPriya Nair,24.00,yes\nSam Okafor,18.25,yes\n\
  Lena Fischer,32.00,no\n\n\x1FFILE:examples/rules.json\x1E\n{\n  \"name\": \"Example\
  \ shop rules (illustrative only, set yours from local law and contracts)\",\n  \"\
  week_start\": \"monday\",\n  \"daily_ot_after\": 8,\n  \"daily_dt_after\": 12,\n\
  \  \"weekly_ot_after\": 40,\n  \"ot_multiplier\": 1.5,\n  \"dt_multiplier\": 2.0,\n\
  \  \"break_required_after_hours\": 6,\n  \"min_break_minutes\": 30,\n  \"min_rest_hours\"\
  : 11,\n  \"max_weekly_hours\": 48,\n  \"max_shift_hours\": 14,\n  \"max_days_in_a_row\"\
  : 6\n}\n\n\x1FFILE:scripts/timesheet_check.py\x1E\n#!/usr/bin/env python3\n\"\"\"\
  timesheet_check.py - check a team's timesheets and work out regular, overtime and\
  \ double-time hours.\n\nReads shift rows, applies your overtime and working-time\
  \ rules (daily and weekly\nthresholds, multipliers, breaks, rest between shifts,\
  \ weekly maximum, days in a\nrow), estimates pay per employee and week, and flags\
  \ data errors and rule\nbreaches before payroll. Standard library only.\n\nUsage:\n\
  \  python3 timesheet_check.py TIMESHEET.csv [--rules RULES.json] [--employees EMPLOYEES.csv]\
  \ [--json]\n  python3 timesheet_check.py --self-test\n\nTIMESHEET.csv columns: employee,date,start,end,break_minutes[,note]\n\
  \  date YYYY-MM-DD, start/end HH:MM (24 h). An end earlier than the start is an\
  \ overnight shift\n  (counted on the start date).\nEMPLOYEES.csv columns: employee,hourly_rate[,overtime_eligible]\
  \  (overtime_eligible: yes/no, default yes)\nRULES.json keys (all optional, defaults\
  \ in DEFAULT_RULES): week_start (monday..sunday),\n  daily_ot_after, daily_dt_after,\
  \ weekly_ot_after (hours or null), ot_multiplier, dt_multiplier,\n  break_required_after_hours,\
  \ min_break_minutes, min_rest_hours, max_weekly_hours,\n  max_shift_hours, max_days_in_a_row.\n\
  Exit codes: 0 no high findings, 1 high findings, 2 bad input.\nThe default rules\
  \ are an example, not the law where you are: set them from your local labour rules\
  \ and contracts.\n\"\"\"\nimport csv, datetime as dt, json, sys\nfrom collections\
  \ import defaultdict\n\nDEFAULT_RULES = {\n    \"week_start\": \"monday\",\n   \
  \ \"daily_ot_after\": None,          # e.g. 8 where daily overtime applies\n   \
  \ \"daily_dt_after\": None,          # e.g. 12 where daily double time applies\n\
  \    \"weekly_ot_after\": 40,\n    \"ot_multiplier\": 1.5,\n    \"dt_multiplier\"\
  : 2.0,\n    \"break_required_after_hours\": 6,\n    \"min_break_minutes\": 30,\n\
  \    \"min_rest_hours\": 11,\n    \"max_weekly_hours\": 48,\n    \"max_shift_hours\"\
  : 14,\n    \"max_days_in_a_row\": 6,\n}\nDAYS = [\"monday\", \"tuesday\", \"wednesday\"\
  , \"thursday\", \"friday\", \"saturday\", \"sunday\"]\nSEV = {\"TS01\": \"high\"\
  , \"TS02\": \"high\", \"TS03\": \"high\", \"TS04\": \"medium\", \"TS05\": \"medium\"\
  , \"TS06\": \"medium\",\n       \"TS07\": \"medium\", \"TS08\": \"high\", \"TS09\"\
  : \"medium\", \"TS10\": \"low\", \"TS11\": \"low\"}\nNAMES = {\"TS01\": \"missing\
  \ or unreadable time\", \"TS02\": \"overlapping shifts\", \"TS03\": \"break longer\
  \ than the shift\",\n         \"TS04\": \"duplicate row\", \"TS05\": \"very long\
  \ shift (typo?)\", \"TS06\": \"required break missing or short\",\n         \"TS07\"\
  : \"short rest between shifts\", \"TS08\": \"over the weekly maximum\", \"TS09\"\
  : \"too many days in a row\",\n         \"TS10\": \"no pay rate\", \"TS11\": \"\
  overnight shift (check the date)\"}\n\n\nclass InputError(Exception):\n    pass\n\
  \n\ndef parse_time(s):\n    try:\n        h, m = s.strip().split(\":\")\n      \
  \  h, m = int(h), int(m)\n        if not (0 <= h <= 24 and 0 <= m < 60) or (h ==\
  \ 24 and m):\n            raise ValueError\n        return h * 60 + m\n    except\
  \ (ValueError, AttributeError):\n        return None\n\n\ndef load_rules(path):\n\
  \    rules = dict(DEFAULT_RULES)\n    if path:\n        with open(path, encoding=\"\
  utf-8\") as f:\n            user = json.load(f)\n        unknown = set(user) - set(DEFAULT_RULES)\
  \ - {\"name\", \"notes\"}\n        if unknown:\n            raise InputError(\"\
  unknown rule keys: \" + \", \".join(sorted(unknown)))\n        rules.update({k:\
  \ v for k, v in user.items() if k in DEFAULT_RULES})\n    if str(rules[\"week_start\"\
  ]).lower() not in DAYS:\n        raise InputError(\"week_start must be a weekday\
  \ name\")\n    for k in (\"ot_multiplier\", \"dt_multiplier\"):\n        if not\
  \ isinstance(rules[k], (int, float)) or rules[k] < 1:\n            raise InputError(k\
  \ + \" must be a number >= 1\")\n    return rules\n\n\ndef load_employees(path):\n\
  \    emp = {}\n    if not path:\n        return emp\n    with open(path, newline=\"\
  \", encoding=\"utf-8\") as f:\n        for i, row in enumerate(csv.DictReader(f),\
  \ start=2):\n            row = {k.strip(): (v or \"\").strip() for k, v in row.items()}\n\
  \            try:\n                rate = float(row.get(\"hourly_rate\", \"\"))\n\
  \            except ValueError:\n                raise InputError(\"employees line\
  \ %d: hourly_rate must be a number\" % i)\n            emp[row[\"employee\"]] =\
  \ {\"rate\": rate, \"ot\": row.get(\"overtime_eligible\", \"yes\").lower() not in\
  \ (\"no\", \"n\", \"false\", \"0\")}\n    return emp\n\n\ndef load_shifts(path):\n\
  \    shifts, findings = [], []\n    with open(path, newline=\"\", encoding=\"utf-8\"\
  ) as f:\n        r = csv.DictReader(f)\n        need = {\"employee\", \"date\",\
  \ \"start\", \"end\", \"break_minutes\"}\n        if not r.fieldnames or not need.issubset({h.strip()\
  \ for h in r.fieldnames}):\n            raise InputError(\"timesheet needs columns\
  \ employee,date,start,end,break_minutes\")\n        seen = set()\n        for i,\
  \ row in enumerate(r, start=2):\n            row = {k.strip(): (v or \"\").strip()\
  \ for k, v in row.items() if k}\n            if not any(row.values()):\n       \
  \         continue\n            e = row[\"employee\"]\n            key = (e, row[\"\
  date\"], row[\"start\"], row[\"end\"])\n            if key in seen:\n          \
  \      findings.append((\"TS04\", e, row[\"date\"], \"line %d repeats an earlier\
  \ row; counted once\" % i))\n                continue\n            seen.add(key)\n\
  \            try:\n                day = dt.date.fromisoformat(row[\"date\"])\n\
  \            except ValueError:\n                findings.append((\"TS01\", e, row[\"\
  date\"], \"line %d: date is not YYYY-MM-DD; row skipped\" % i)); continue\n    \
  \        s, en = parse_time(row[\"start\"]), parse_time(row[\"end\"])\n        \
  \    if s is None or en is None:\n                findings.append((\"TS01\", e,\
  \ row[\"date\"], \"line %d: start or end missing/unreadable (%r-%r); row skipped\"\
  \ % (i, row[\"start\"], row[\"end\"]))); continue\n            try:\n          \
  \      brk = int(row[\"break_minutes\"] or 0)\n            except ValueError:\n\
  \                findings.append((\"TS01\", e, row[\"date\"], \"line %d: break_minutes\
  \ is not a whole number; treated as 0\" % i)); brk = 0\n            overnight =\
  \ en <= s\n            if overnight:\n                en += 24 * 60\n          \
  \      findings.append((\"TS11\", e, row[\"date\"], \"line %d: %s-%s crosses midnight;\
  \ counted on %s\" % (i, row[\"start\"], row[\"end\"], row[\"date\"])))\n       \
  \     start = dt.datetime.combine(day, dt.time()) + dt.timedelta(minutes=s)\n  \
  \          end = dt.datetime.combine(day, dt.time()) + dt.timedelta(minutes=en)\n\
  \            span = (en - s)\n            if brk > span:\n                findings.append((\"\
  TS03\", e, row[\"date\"], \"line %d: break %d min is longer than the %d-min shift;\
  \ worked time set to 0\" % (i, brk, span)))\n                brk = span\n      \
  \      shifts.append({\"employee\": e, \"date\": day, \"start\": start, \"end\"\
  : end, \"break\": brk,\n                           \"hours\": (span - brk) / 60.0,\
  \ \"span_h\": span / 60.0, \"line\": i, \"note\": row.get(\"note\", \"\")})\n  \
  \  return shifts, findings\n\n\ndef week_of(day, week_start):\n    offset = (day.weekday()\
  \ - DAYS.index(week_start)) % 7\n    return day - dt.timedelta(days=offset)\n\n\n\
  def analyse(shifts, rules, employees, findings):\n    ws = rules[\"week_start\"\
  ].lower()\n    by_emp = defaultdict(list)\n    for s in shifts:\n        by_emp[s[\"\
  employee\"]].append(s)\n    weeks = []\n    for e, ss in sorted(by_emp.items()):\n\
  \        ss.sort(key=lambda x: x[\"start\"])\n        for a, b in zip(ss, ss[1:]):\n\
  \            if b[\"start\"] < a[\"end\"]:\n                findings.append((\"\
  TS02\", e, b[\"date\"].isoformat(), \"lines %d and %d overlap (%s-%s and %s-%s)\"\
  \ % (\n                    a[\"line\"], b[\"line\"], a[\"start\"].strftime(\"%a\
  \ %H:%M\"), a[\"end\"].strftime(\"%H:%M\"), b[\"start\"].strftime(\"%a %H:%M\"),\
  \ b[\"end\"].strftime(\"%H:%M\"))))\n            else:\n                rest = (b[\"\
  start\"] - a[\"end\"]).total_seconds() / 3600\n                if rules[\"min_rest_hours\"\
  ] and rest < rules[\"min_rest_hours\"] and b[\"date\"] != a[\"date\"]:\n       \
  \             findings.append((\"TS07\", e, b[\"date\"].isoformat(), \"only %.1f\
  \ h rest between line %d and line %d (minimum %s h)\" % (rest, a[\"line\"], b[\"\
  line\"], rules[\"min_rest_hours\"])))\n        for s in ss:\n            if rules[\"\
  max_shift_hours\"] and s[\"span_h\"] > rules[\"max_shift_hours\"]:\n           \
  \     findings.append((\"TS05\", e, s[\"date\"].isoformat(), \"line %d: %.1f h from\
  \ start to end (limit %s h); check for a typo\" % (s[\"line\"], s[\"span_h\"], rules[\"\
  max_shift_hours\"])))\n            if rules[\"break_required_after_hours\"] and\
  \ s[\"span_h\"] > rules[\"break_required_after_hours\"] and s[\"break\"] < rules[\"\
  min_break_minutes\"]:\n                findings.append((\"TS06\", e, s[\"date\"\
  ].isoformat(), \"line %d: %.1f h shift with %d min break (needs %d min after %s\
  \ h)\" % (s[\"line\"], s[\"span_h\"], s[\"break\"], rules[\"min_break_minutes\"\
