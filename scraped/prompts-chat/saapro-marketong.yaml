prompt: 'أنشئ موقعًا إلكترونيًا احترافيًا وفاخرًا وتفاعليًا بالكامل لشركة SaaPro Marketing
  – سابرو للتسويق.


  أريد الموقع أن يبدو كأنه موقع لوكالة تسويق وإبداع عالمية، وليس قالب شركة تقليديًا.
  الانطباع الأول يجب أن يكون قويًا جدًا ومبهرًا بصريًا، بحيث يشعر الزائر منذ الثواني
  الأولى أن SaaPro شركة حديثة تجمع بين التسويق، الإبداع، المحتوى، التقنية، الذكاء
  الاصطناعي والإنتاج المرئي.


  الهوية العامة


  اسم الشركة: SaaPro Marketing – سابرو للتسويق


  المجال: شركة تسويق وإبداع رقمي تقدم حلولًا متكاملة لبناء العلامات التجارية وتنميتها.


  الفكرة الأساسية للعلامة:


  الفكرة → التجربة → التحويل → النمو


  والفلسفة التي يجب أن يعكسها الموقع هي أننا لا نقدم مجرد إعلان أو تصميم، بل نبني
  رحلة متكاملة تبدأ من الفكرة، تتحول إلى تجربة مؤثرة، ثم إلى نتائج وتحويلات، وتنتهي
  بنمو حقيقي للعلامة التجارية.


  استخدم هوية بصرية Premium/Futuristic تعتمد على اللون التركوازي/النعناعي الخاص بـ
  SaaPro مع الأسود والفحمي الداكن والأبيض، مع إضاءات وتدرجات ناعمة تعطي إحساسًا بالتقنية
  والفخامة.


  لا أريد ألوانًا كثيرة أو تصميمًا مزدحمًا. المطلوب تصميم راقٍ، مظلم، سينمائي، تقني
  وإبداعي.


  اللغة واتجاه الموقع


  الموقع بالكامل باللغة العربية وباتجاه RTL من اليمين إلى اليسار.


  يجب الاهتمام جدًا بالخط العربي واستخدام Typography كبيرة وواضحة وحديثة.


  في الشريط العلوي Header:


  روابط التنقل تكون في الجهة اليمنى، وشعار SaaPro في الجهة اليسرى.


  روابط التنقل الرئيسية:


  الرئيسية – خدماتنا – أعمالنا – من نحن – تواصل معنا


  مع زر CTA واضح مثل:


  ابدأ مشروعك


  تجربة الدخول إلى الموقع


  عند فتح الموقع أريد تجربة افتتاحية قصيرة ومميزة، وليست شاشة Loading تقليدية.


  يمكن أن يظهر شعار SaaPro أو حرف S بشكل سينمائي مع حركة بسيطة، ثم تنتقل الشاشة بسلاسة
  إلى الصفحة الرئيسية.


  يجب ألا تكون المقدمة طويلة أو مزعجة؛ الهدف منها خلق انطباع Premium خلال ثانية أو
  ثانيتين.


  الصفحة الرئيسية – Hero Section


  أريد Hero ضخمًا يملأ الشاشة تقريبًا.


  استخدم عنوانًا عربيًا قويًا مثل:


  نحوّل الأفكار إلى تأثير.


  ثم:


  والتأثير إلى نمو.


  أو صياغة إبداعية مشابهة تناسب شركة تسويق حديثة.


  مع نص مختصر يشرح SaaPro:


  استراتيجية، محتوى، تقنية وإبداع بصري تعمل معًا لبناء علامات تجارية تنمو.


  أضف عنصرًا بصريًا رئيسيًا في منتصف أو جانب الشاشة مستوحى من هوية SaaPro، مثل كرة
  أو Orb ثلاثية الأبعاد تحمل حرف S أو شعار الشركة، مع حركة خفيفة مرتبطة بحركة الماوس
  والتمرير.


  حول العنصر تظهر التسميات الأربع:


  01 — الاستراتيجية


  02 — المحتوى


  03 — التقنية


  04 — النمو


  ويجب أن تكون هذه الكلمات كبيرة وواضحة جدًا، وليست بحجم صغير يصعب قراءته.


  أريد أيضًا عبارة:


  نمو متكامل 360°


  وتحتها:


  مرّر لتكتشف


  مع مؤشر بصري بسيط يشجع المستخدم على النزول.


  الحركة والتفاعل


  هذه نقطة أساسية جدًا.


  لا أريد موقعًا ثابتًا. أريد أن تكون تجربة التصفح نفسها جزءًا من هوية الشركة.


  استخدم Scroll Animations احترافية، Parallax، Reveal Animations، Text Masking، Smooth
  Transitions، Image Parallax، Hover Effects، Magnetic Buttons، Animated Counters،
  Sticky Sections، وتغيّر العناصر تدريجيًا أثناء التمرير.


  بعض النصوص الكبيرة يمكن أن تتحرك ببطء أثناء Scroll، وبعض الصور يمكن أن تدخل من جوانب
  الشاشة أو تتوسع تدريجيًا.


  أريد الانتقال بين الأقسام سلسًا وسينمائيًا، وليس مجرد أقسام موضوعة الواحد تحت الآخر.


  لكن يجب أن تكون الحركة راقية ومدروسة وليست مزعجة.


  مهم جدًا: لا تستخدم مؤشر Mouse Cursor مخصصًا كبيرًا أو دائرة تتحرك فوق النصوص. استخدم
  مؤشر الجهاز الطبيعي حتى لا يغطي الكلمات أو الأزرار.


  قسم ماذا نقدم


  يظهر عنوان كبير:


  01 — ماذا نقدم


  ثم كلمة كبيرة جدًا:


  نصنع


  وتظهر حولها أو معها المجالات:


  الاستراتيجية


  المحتوى


  التقنية


  النمو


  الإنتاج المرئي


  الذكاء الاصطناعي


  لا تجعل هذه الكلمات صغيرة. Typography جزء رئيسي من التصميم.


  عند تمرير الماوس أو النزول، يمكن أن يتغير المحتوى البصري والخلفية بحسب الخدمة.


  خدمات SaaPro


  أنشئ قسمًا متطورًا للخدمات يشمل على الأقل:


  الاستراتيجية والتخطيط التسويقي، إدارة منصات التواصل الاجتماعي، صناعة المحتوى، تصميم
  الهوية والمحتوى البصري، الحملات الإعلانية الرقمية، التصوير والإنتاج المرئي، المونتاج
  وصناعة الفيديو، حلول الذكاء الاصطناعي للمحتوى والإعلانات، المواقع والتجارب الرقمية،
  وتحليل الأداء والنمو.


  لا تعرض الخدمات على شكل Grid تقليدي ممل فقط.


  يمكن استخدام بطاقات كبيرة تفاعلية، أو Sticky Panels، بحيث تتحول الشاشة أثناء Scroll
  من خدمة إلى أخرى مع عنوان كبير ووصف مختصر وعنصر بصري.


  منهجية SaaPro


  أنشئ قسمًا يحكي رحلة العميل:


  الفكرة → التجربة → التحويل → النمو


  01 الفكرة: نفهم العلامة والسوق والجمهور ونبني الاستراتيجية.


  02 التجربة: نحول الاستراتيجية إلى محتوى وتصميم وتجربة رقمية.


  03 التحويل: نحول اهتمام الجمهور إلى تفاعل وطلبات ونتائج قابلة للقياس.


  04 النمو: نحلل البيانات ونطور الأداء للوصول إلى نمو مستمر.


  أريد هذا القسم Storytelling وليس أربع بطاقات عادية.


  قسم المشاريع والأعمال


  هذا أحد أهم أقسام الموقع.


  عنوان:


  أعمال مختارة


  أو:


  مشاريع صنعت أثرًا


  اعرض المشاريع بطريقة Editorial/Cinematic كبيرة.


  المشروع يحتوي على:


  اسم المشروع، العميل، التصنيف، وصف مختصر، صورة غلاف، صور متعددة، فيديوهات متعددة،
  وسنة المشروع عند توفرها.


  عند Hover على المشروع تتحرك الصورة أو تكبر قليلًا.


  عند الضغط عليه يتم فتح صفحة تفاصيل المشروع.


  صفحة المشروع يجب أن تكون فخمة جدًا وتحتوي على صورة غلاف كبيرة، وصف المشروع، الصور،
  والفيديوهات.


  يجب توفير Gallery وLightbox لفتح الصور بالحجم الكامل والتنقل بينها.


  الفيديوهات يجب أن تعمل داخل الموقع بشكل احترافي.


  يجب دعم رفع فيديو حتى 400MB لكل فيديو.


  SaaPro AI Lab


  أنشئ قسمًا خاصًا باسم:


  مختبر SaaPro


  أو:


  SaaPro AI Lab


  يوضح كيف تستخدم الشركة الذكاء الاصطناعي في صناعة المحتوى، توليد الأفكار، التصميم،
  إنتاج الفيديو، تحليل البيانات وتطوير الحملات.


  اجعل تصميم هذا القسم مستقبليًا أكثر من باقي الموقع، مع خطوط أو نقاط أو عناصر بيانات
  متحركة بشكل خفيف.


  لا تجعله يبدو مثل واجهة Hacker؛ المطلوب Creative Technology.


  قسم النتائج والأرقام


  أنشئ مساحة لعرض مؤشرات الشركة، مثل:


  المشاريع المنجزة


  الحملات


  العملاء


  المحتوى المنتج


  نسب النمو


  الأرقام يجب أن تكون Dynamic Counters ويمكن تعديل قيمها من لوحة الإدارة لاحقًا.


  لا تضع أرقامًا وهمية على أنها نتائج حقيقية؛ استخدم Placeholder حتى يتم إدخال بيانات
  الشركة الفعلية.


  صفحة من نحن


  لا أريد نصًا تقليديًا مثل "نحن شركة رائدة...".


  أريد صفحة تعكس شخصية SaaPro.


  استخدم فكرة مثل:


  لسنا مجرد وكالة تسويق.


  نحن فريق يجمع الفكرة والإبداع والتقنية لصناعة نمو يمكن رؤيته وقياسه.


  ثم اعرض رؤية الشركة، أسلوب العمل، القيم، والتخصصات.


  يمكن إضافة الفريق لاحقًا من لوحة الإدارة.


  صفحة التواصل


  تصميم بسيط وفخم.


  تحتوي على نموذج:


  الاسم، اسم الشركة، رقم التواصل، البريد الإلكتروني، الخدمة المطلوبة، الميزانية التقريبية،
  تفاصيل المشروع.


  زر:


  لنبدأ


  وتصل الطلبات إلى لوحة الإدارة.


  أضف روابط حسابات التواصل الخاصة بالشركة وWhatsApp.


  Footer


  Footer داكن وأنيق يحتوي على شعار SaaPro، وصف قصير، روابط الموقع، وسائل التواصل،
  البريد الإلكتروني:


  info@saapro.sa


  ومعلومات الحقوق.


  لا تستخدم @saapro360 بشكل افتراضي. يجب أن تكون أسماء وروابط حسابات التواصل قابلة
  للتعديل من لوحة الإدارة.


  لوحة الإدارة


  الموقع ليس واجهة عرض فقط؛ أريد نظام إدارة فعلي.


  يجب أن يكون هناك Admin Login فقط، ولا يوجد تسجيل حساب للزوار.


  بعد تسجيل الدخول تظهر لوحة تحكم احترافية يستطيع المسؤول من خلالها إدارة المشاريع
  والخدمات ومحتوى الموقع وطلبات العملاء وروابط التواصل الاجتماعي والإعدادات.


  بالنسبة للمشاريع، يستطيع المسؤول إنشاء وتعديل وحذف ونشر وإخفاء المشروع، ورفع عدة
  صور وعدة فيديوهات للمشروع الواحد، وحذف الوسائط، واختيار صورة الغلاف.


  دعم الفيديو حتى 400MB.


  يجب أيضًا توفير قسم للتذكيرات Reminders داخل لوحة الإدارة، بحيث يستطيع المسؤول إضافة
  تذكير مرتبط بعميل أو حساب أو مهمة، مع التاريخ والوقت والأولوية والحالة، وإظهار المتأخر
  منها بوضوح.


  أضف إمكانية تغيير كلمة مرور المسؤول وإعدادات الشركة.


  المتطلبات التقنية


  أريد الموقع Responsive بالكامل.


  يجب اختباره على:


  Desktop كبير، Laptop، Tablet أفقي وعمودي، iPhone، Android، وشاشات الجوال الصغيرة.


  لا أريد أي نص يخرج خارج الشاشة أو عناصر تتداخل مع بعضها.


  استخدم clamp() للأحجام المهمة حتى تتكيف Typography تلقائيًا مع حجم الشاشة.


  على الكمبيوتر تكون التجربة كاملة بالحركات، أما على الجوال فيجب تبسيط الحركات الثقيلة
  مع المحافظة على جمال التصميم.


  أضف prefers-reduced-motion لإمكانية تقليل الحركة.


  اهتم جدًا بالأداء وLazy Loading للصور والفيديو.


  يجب ألا تتسبب الحركات أو العناصر ثلاثية الأبعاد في جعل الموقع بطيئًا.


  بالنسبة للفيديوهات الكبيرة، استخدم Video Streaming / HTTP Range Requests بدل تحميل
  ملف الفيديو كاملًا في الذاكرة.


  الموقع يجب أن يكون مناسبًا لاحقًا لتحسين SEO، مع عناوين ووصف Meta مناسبين، Open
  Graph، Semantic HTML، وتهيئة جيدة لمحركات البحث.


  المعيار النهائي للتصميم


  عندما يدخل شخص إلى الموقع لا أريده أن يقول:


  "هذا موقع شركة تسويق جميل."


  أريده أن يشعر:


  "إذا كانت هذه هي الطريقة التي تقدم بها SaaPro نفسها، فأريد أن أرى ماذا يمكن أن تصنع
  لعلامتي."


  اجعل الموقع يعرض قدرات الشركة من خلال التجربة نفسها؛ الحركة تثبت الإبداع، التنظيم
  يثبت الاستراتيجية، التقنية تظهر الاحتراف، والمشاريع تثبت النتائج.


  لا تستخدم Template جاهزًا واضحًا، ولا Cards متكررة في كل مكان، ولا Stock Photos
  عشوائية، ولا Animations لمجرد الحركة.


  المطلوب هو:


  Premium + Cinematic + Interactive + Creative + Futuristic + Arabic RTL + Marketing
  Focused.


  وفي النهاية سلّم مشروعًا كاملاً قابلًا للتشغيل والتعديل، وليس مجرد Mockup أو صورة
  للواجهة.'
