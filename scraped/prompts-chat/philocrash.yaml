prompt: "This generalized framework breaks a philosopher's worldview down from their\
  \ core concepts to their specific views on personal existence, balanced by critical\
  \ evaluation and anchored in their most vital primary texts.\n\n\U0001F31F Phase\
  \ 1: The Big Picture (Introduction & Core Pillars)\nBegin by establishing the foundation,\
  \ major themes, and intellectual environment.\n* What is the philosopher's primary\
  \ mission or target of critique (e.g., abstract logic, religious institutions, political\
  \ power)?\n* What are their 4–5 core philosophical pillars?\n* What are their most\
  \ influential or foundational written works?\n* Did they use any unique writing\
  \ styles or literary devices (e.g., pseudonyms, aphorisms, dialogues) to convey\
  \ their ideas?\n\n\U0001F4AC Phase 2: The Core Vocabulary (Key Quotes & Concepts)\n\
  Anchor the abstract theory into memorable, definitive statements.\n* What are their\
  \ most famous quotes regarding:\n  * The nature of life, time, and human existence?\n\
  \  * Psychological friction (e.g., anxiety, guilt, will, desire)?\n  * The tension\
  \ between the individual and society?\n* What specific, unique vocabulary did they\
  \ invent to describe human experience?\n\n\U0001F464 Phase 3: The Human Element\
  \ (Views on Authenticity & Selfhood)\nExamine how their philosophy applies directly\
  \ to the individual's life choices.\n* How does this philosopher define an \"authentic\"\
  \ or \"meaningful\" human life?\n* What do they consider to be the greatest threat\
  \ to a person's individuality or selfhood (e.g., the crowd, state control, consumerism,\
  \ religious dogma)?\n* What practical or existential \"leap,\" transformation, or\
  \ mindset shift do they demand from an individual who wants to live truthfully?\n\
  * What are the specific quotes where they demand personal accountability, subjective\
  \ truth, or non-conformity?\n\n⚖️ Phase 4: The Crucible (Strengths, Weaknesses &\
  \ Legacy)\nCritically evaluate the execution, logical consistency, and historical\
  \ impact of their ideas.\n* What are the greatest strengths of this framework? (e.g.,\
  \ how effectively does it liberate the individual, expose societal illusions, or\
  \ provide emotional resonance?)\n* Where does the logic fracture? What are the primary\
  \ contradictions, blind spots, or inherent paradoxes within their system?\n* How\
  \ did external critics, contemporary peers, or later schools of thought challenge\
  \ their views? (e.g., accusations of nihilism, elitism, solipsism, or impracticality)\n\
  * How has this philosophy endured? Did its strengths ultimately outshine its weaknesses\
  \ in shaping modern psychology, ethics, or culture?\n\n\U0001F4DA Primary Text Prioritisation\
  \ Engine\nWhen generating this analysis, curate and heavily prioritise evidence,\
  \ vocabulary, and quotes from the subject's bibliography using the following hierarchy:\n\
  1. The Existential/Practical Blueprint: Prioritise the specific text or essay where\
  \ the philosopher outlines their definition of personal truth, individual accountability,\
  \ or the necessary psychological shift required to live authentically.\n2. The Societal\
  \ Critique: Prioritise the work that best captures their hostility toward conformity,\
  \ institutional control, or the specific \"threats to selfhood\" identified in Phase\
  \ 3.\n3. The Manifesto/Vocabulary Hub: Prioritise the text that introduces their\
  \ most famous neologisms, unique vocabulary, and signature literary style.\n4. The\
  \ Defensive Text: Prioritise shorter essays, lectures, or later prefaces where the\
  \ philosopher explicitly responds to their contemporary critics, clarifies misunderstandings,\
  \ or defends their system against accusations of logical failure."
