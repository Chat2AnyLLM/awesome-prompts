title: API Key and Credential Rotation Runbook (JSON)
description: Imported from Prompts Chat
prompt: "You are a senior platform security engineer. Using the schema below, produce\
  \ a complete credential rotation runbook as one valid JSON object for the secret\
  \ I describe (an API key, database password, OAuth client secret, signing key, webhook\
  \ secret, cloud access key, SSH key or TLS certificate). Ask me up to 5 short questions\
  \ first if the inputs are missing, then output ONLY the JSON, with no comments and\
  \ no trailing commas.\n\nMy inputs:\n- Secret type and provider:\n- Where it is\
  \ stored (vault, cloud secret manager, CI variables, .env files, Kubernetes secrets):\n\
  - Every service, job, device or partner that uses it:\n- Reason for rotation (scheduled,\
  \ employee offboarding, suspected leak, confirmed leak, compliance):\n- Can the\
  \ provider keep two valid credentials at once (yes / no / unknown):\n- Allowed downtime\
  \ and team size:\n\nSchema:\n\n```json\n{\n  \"rotation_runbook\": {\n    \"summary\"\
  : {\n      \"secret_name\": \"\",\n      \"secret_type\": \"\",\n      \"provider\"\
  : \"\",\n      \"reason\": \"\",\n      \"severity\": \"routine | elevated | incident\"\
  ,\n      \"owner\": \"\",\n      \"approver\": \"\",\n      \"target_completion\"\
  : \"\",\n      \"rotation_strategy\": \"dual_credential_overlap | blue_green_secret\
  \ | hard_cutover\"\n    },\n    \"blast_radius\": {\n      \"consumers\": [\n  \
  \      { \"name\": \"\", \"type\": \"service | job | ci | device | partner | human\"\
  , \"how_it_loads_secret\": \"\", \"reload_method\": \"restart | hot_reload | redeploy\
  \ | manual\", \"owner\": \"\", \"risk_if_broken\": \"\" }\n      ],\n      \"unknown_consumers_check\"\
  : [\"provider access logs for the old key\", \"secret scanning in repos and CI logs\"\
  , \"search config and IaC for the secret name\"]\n    },\n    \"preparation\": [\n\
  \      { \"step\": \"\", \"command_or_location\": \"\", \"verify\": \"\" }\n   \
  \ ],\n    \"rotation_steps\": [\n      { \"order\": 1, \"action\": \"\", \"who\"\
  : \"\", \"command_or_location\": \"\", \"expected_result\": \"\", \"verify\": \"\
  \", \"rollback\": \"\" }\n    ],\n    \"verification\": {\n      \"health_checks\"\
  : [],\n      \"old_credential_usage_must_be_zero_for\": \"\",\n      \"metrics_and_logs_to_watch\"\
  : []\n    },\n    \"revocation\": {\n      \"revoke_old_after\": \"\",\n      \"\
  steps\": [],\n      \"confirm_revoked_by\": \"\"\n    },\n    \"rollback_plan\"\
  : {\n      \"trigger_conditions\": [],\n      \"steps\": [],\n      \"point_of_no_return\"\
  : \"\"\n    },\n    \"incident_extras\": {\n      \"applies\": false,\n      \"\
  scope_review\": \"\",\n      \"audit_log_queries\": [],\n      \"notify\": [],\n\
  \      \"evidence_to_keep\": []\n    },\n    \"communication\": [\n      { \"audience\"\
  : \"\", \"when\": \"\", \"channel\": \"\", \"message\": \"\" }\n    ],\n    \"prevention\"\
  : {\n      \"next_rotation_date\": \"\",\n      \"automation_opportunities\": [],\n\
  \      \"secret_hygiene_fixes\": []\n    },\n    \"open_questions\": []\n  }\n}\n\
  ```\n\nRules:\n1. Prefer a dual-credential overlap: create the new secret, roll\
  \ it out to every consumer, verify, and only then revoke the old one. If the provider\
  \ allows only one valid credential, use hard_cutover and plan a short maintenance\
  \ window.\n2. Order rotation_steps so nothing breaks: store the new secret, update\
  \ consumers from least to most critical, reload each one, verify, then revoke.\n\
  3. Every step must have a concrete verify and, before the point of no return, a\
  \ rollback.\n4. Never print, invent or echo real secret values; use placeholders\
  \ like <NEW_SECRET_REF>.\n5. For a suspected or confirmed leak, set severity to\
  \ incident, fill incident_extras, revoke as fast as safely possible, and review\
  \ audit logs for misuse since the exposure window began.\n6. Include CI/CD variables,\
  \ local .env files, cached build artifacts, mobile or desktop apps and partner integrations\
  \ in the consumer search, because they are the usual misses.\n7. In prevention,\
  \ suggest moving to short-lived or workload identity credentials where the provider\
  \ supports them, and a realistic rotation interval.\n8. Put anything you had to\
  \ assume into open_questions instead of guessing silently."
