title: reviews
description: Imported from Prompts Chat
prompt: "Objective: Summarize many reviews\n\n1. **Process available reviews**\n\n\
  \    * Note the number of reviews and remember that value as \"number_reviews\"\n\
  \    * Overall rating\n    * Rating distribution if visible\n    * It's possible\
  \ there aren't any reviews, for example if a product is new or out of stock. If\
  \ that's the case, don't include any review analysis in your response.\n\n2. **Identify\
  \ repeated patterns**\n\n    * Common positive themes\n    * Common complaints\n\
  \    * Frequency of each theme\n\n3. **Support themes with evidence**\n\n    * Representative\
  \ quotes for major themes\n    * Specific examples that illustrate points\n\n4.\
  \ **Evaluate trustworthiness**\n\n    * Do reviews seem genuine?\n    * Suspicious\
  \ patterns (all 5-star, generic language)\n    * Verified purchase indicators\n\n\
  5. **Summarize overall sentiment**\n\n    * Would most reviewers buy again?\n  \
  \  * Who loves it vs. who hates it?\n\n6. **Handling exceptions**\n\n    Prioritize\
  \ excellent content in your response. If you're unable to formulate a response that\
  \ meets all criteria, you should\n    * respond as best you can and\n    * acknowledge\
  \ any limitations or challenges you faced. For example, maybe there wasn't sufficient\
  \ content on a webpage or the content wasn't compatible with a given request.\n\n\
  \    Consider your proposed response objectively and rate it on a scale from 1-10.\
  \ If you wouldn't give it a 10, either try to create a stronger response or consider\
  \ acknowledging any limitations or challenges you faced. The score is just for your\
  \ own purposes; don't share it with the user.\n\n7. **Final response**\n\n    If\
  \ you have relevant info to share, your final response should follow standard writing\
  \ guidelines, including:\n\n    * Sentence case: titles, labels, and all other content\
  \ should be displayed using sentence case (only proper nouns and the first letter\
  \ of a string appear capitalized).\n    * Favor simple sentences that use common\
  \ words\n    If number_reviews is 0, your response should mention that there aren't\
  \ any reviews and you should jump to the follow-on question.\n\n    **Overview:**\
  \ [X] reviews, [Y] average rating\n\n    **Pros**\n\n    | Theme | Frequency | Example\
  \ |\n    | :---: | :---: | :---: |\n\n    **Cons**\n\n    | Theme | Frequency |\
  \ Example |\n    | :---: | :---: | :---: |\n\n    **Quality of reviews:** [Do they\
  \ seem genuine?]\n\n    **Bottom line:** [Would most reviewers buy again?]\n\n8.\
  \ **Follow-up questions**\n\n    If you can think of a way you can help the user\
  \ act on information shown in the response, conclude with one (at most two) sentences\
  \ that offers this help. Frame it as a question so that a simple response like \"\
  yes please\" might launch the next round."
