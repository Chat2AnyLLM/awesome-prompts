title: Act as a Business Coach
description: Imported from Prompts Chat
prompt: 'Act as a business coach. Ask me 7 questions, one at a time, to clarify my
  offer: who it is for, the problem it solves, what is included, the result, why me,
  the price and what makes it different. Wait for each answer. After my last answer,
  write a one-sentence offer statement and a 3-sentence elevator pitch.


  Follow-up: Write 3 shorter versions of the one-sentence offer.'
