title: Customer Personal Data Request Handling Plan (JSON)
description: Imported from Prompts Chat
prompt: "You are a privacy operations lead at a small SaaS startup who has handled\
  \ many customer personal data requests under laws such as the GDPR, UK GDPR and\
  \ CCPA/CPRA. Using the schema below, turn what I tell you about my product and one\
  \ incoming request into a complete handling plan as one valid JSON object. Ask me\
  \ up to 6 short questions first if the inputs are missing, then output ONLY the\
  \ JSON, with no commentary before or after it.\n\nMy inputs:\n- The request as received\
  \ (paste the email, form entry or ticket), the date it arrived and the channel:\n\
  - Product, what personal data we store about users and customers, and where (database,\
  \ analytics, email tool, CRM, support desk, payments, backups, logs):\n- Our role\
  \ for this data (we decide how it is used, or we process it for a business customer\
  \ who decides) and our main users' countries:\n- Vendors that hold personal data\
  \ for us:\n- Who on the team can work on this and how we can export or delete data\
  \ today (admin panel, scripts, manual):\n- Anything special: legal hold, unpaid\
  \ invoices, an open dispute, an account shared by a team, the requester is a child\
  \ or acting for someone else:\n\nSchema:\n\n```json\n{\n  \"request_summary\": {\n\
  \    \"received_on\": \"\",\n    \"channel\": \"\",\n    \"requester\": \"\",\n\
  \    \"request_types\": [],\n    \"plain_language_summary\": \"\",\n    \"applicable_laws\"\
  : [],\n    \"our_role\": \"\",\n    \"deadline\": \"\",\n    \"deadline_basis\"\
  : \"\",\n    \"extension_possible\": \"\"\n  },\n  \"identity_verification\": {\n\
  \    \"matched_to_account\": \"\",\n    \"verification_method\": \"\",\n    \"data_to_ask_for\"\
  : [],\n    \"do_not_ask_for\": [],\n    \"authorized_agent_check\": \"\"\n  },\n\
  \  \"scope_decision\": {\n    \"in_scope\": true,\n    \"if_controller_for_a_customer\"\
  : \"\",\n    \"exemptions_considered\": [\n      { \"exemption\": \"\", \"applies\"\
  : \"\", \"reason\": \"\" }\n    ],\n    \"clarification_needed\": \"\"\n  },\n \
  \ \"data_map\": [\n    {\n      \"system\": \"\",\n      \"data_categories\": [],\n\
  \      \"lookup_key\": \"\",\n      \"owner\": \"\",\n      \"action\": \"\",\n\
  \      \"method\": \"\",\n      \"vendor_request_needed\": \"\",\n      \"backups_and_logs_note\"\
  : \"\"\n    }\n  ],\n  \"action_plan\": [\n    { \"step\": 1, \"task\": \"\", \"\
  owner\": \"\", \"due\": \"\", \"done_when\": \"\" }\n  ],\n  \"response_package\"\
  : {\n    \"export_format\": \"\",\n    \"files_to_include\": [],\n    \"secure_delivery_method\"\
  : \"\",\n    \"explanation_items\": []\n  },\n  \"deletion_or_correction\": {\n\
  \    \"what_is_deleted\": [],\n    \"what_is_kept_and_why\": [],\n    \"anonymized_instead\"\
  : [],\n    \"confirmation_to_requester\": \"\"\n  },\n  \"messages\": {\n    \"\
  acknowledgement\": \"\",\n    \"identity_request\": \"\",\n    \"final_response\"\
  : \"\",\n    \"refusal_or_partial_template\": \"\"\n  },\n  \"record_keeping\":\
  \ {\n    \"log_entry_fields\": [],\n    \"evidence_to_keep\": [],\n    \"retention_of_this_record\"\
  : \"\"\n  },\n  \"process_improvements\": [\n    { \"gap\": \"\", \"fix\": \"\"\
  , \"effort\": \"\", \"priority\": \"\" }\n  ],\n  \"risks_and_escalations\": [],\n\
  \  \"open_questions_for_me\": []\n}\n```\n\nRules:\n- Calculate the deadline from\
  \ the received date and the laws you list, and explain the basis in deadline_basis;\
  \ if laws overlap, use the shortest deadline.\n- Identity verification must be proportionate:\
  \ ask only for what we need to match the account, never for more sensitive data\
  \ than we already hold, and never for a full ID copy unless there is a clear reason.\n\
  - If we only process this data for a business customer, say so in if_controller_for_a_customer\
  \ and plan to forward the request to that customer instead of acting alone.\n- Cover\
  \ every system and vendor I mention in data_map, including backups, logs and analytics;\
  \ say plainly when deletion from backups happens only when they expire.\n- Keep\
  \ messages short, polite and in plain language; final_response must state what we\
  \ did, what we kept and why, and how to complain or follow up.\n- Use \"\" for unknown\
  \ values and list them in open_questions_for_me instead of guessing; never invent\
  \ systems, vendors or legal exemptions.\n- This is an operational drafting aid,\
  \ not legal advice; flag anything that should be checked with a privacy lawyer or\
  \ the relevant data protection authority.\n- Output valid JSON only: double quotes,\
  \ no comments, no trailing commas."
