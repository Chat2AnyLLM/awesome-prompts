prompt: "---\nname: crypto-whitepaper-writer\ndescription: Write a credible, well-structured\
  \ whitepaper for any crypto/blockchain project (L1 chain, DeFi protocol, oracle\
  \ network, stablecoin, token system) — grounded in the structural and rhetorical\
  \ patterns of Bitcoin, Ethereum, Uniswap, Chainlink, and MakerDAO, not generic ICO-hype\
  \ templates. Use whenever asked to draft, outline, or review a crypto/Web3 whitepaper.\n\
  ---\n\n# Crypto Whitepaper Writer\n\n## Why this skill exists\n\nMost AI-generated\
  \ crypto whitepapers read like marketing decks: vague \"revolutionary\" language,\n\
  unbacked security claims, a roadmap standing in for proof, tokenomics as decoration.\
  \ The five\nmost-cited whitepapers in the industry — Bitcoin, Ethereum, Uniswap,\
  \ Chainlink, MakerDAO — share a\ndifferent discipline instead: problem-first framing,\
  \ incremental mechanism-building, named threat\nmodels, and per-actor incentive\
  \ analysis. This skill encodes that discipline so the output reads\nlike engineering,\
  \ not a pitch.\n\nSee `reference.md` for the full research base: archetype skeletons,\
  \ craft principles, anti-patterns,\nand the pre-publish checklist. Read it before\
  \ drafting.\n\n## Step 1 — Gather inputs before writing a word\n\nDo not start drafting\
  \ until you have, from the user:\n\n- **The problem** this project solves, in one\
  \ sentence, with a concrete scenario of what fails\n  without it.\n- **The project\
  \ archetype** — the closest match in `reference.md` → Archetypes: base-layer\n \
  \ consensus/settlement, DeFi mechanism (AMM/lending/derivatives), oracle/coordination\
  \ network,\n  stablecoin/collateral system, or application-layer protocol/token\
  \ system.\n- **The core mechanism** — what actually happens on-chain/off-chain,\
  \ in enough detail to describe a\n  state transition or formula, not just a feature\
  \ list.\n- **Token existence and role** — if a token exists, what specific mechanical\
  \ function does it serve\n  (fee payment, collateral, staking/slashing, governance\
  \ weight)? If the project doesn't need a\n  token, say so explicitly rather than\
  \ inventing tokenomics to look complete.\n- **Known limitations / open risks** the\
  \ team is willing to state honestly.\n\nIf any of these is missing or vague, ask\
  \ before drafting — never fabricate a problem statement, team\nbackground, adoption\
  \ numbers, or token model to fill a gap.\n\n## Step 2 — Pick the section skeleton,\
  \ calibrate length\n\nMatch the archetype to its skeleton in `reference.md`. Don't\
  \ force every whitepaper through an\nidentical template — Bitcoin has no tokenomics\
  \ section; MakerDAO has no proof-of-work security proof.\nUse the shared spine (problem\
  \ → mechanism → actor/incentive analysis → threat/risk model →\narchitecture → [governance/token,\
  \ only if applicable] → limitations → conclusion), and cut whatever\ndoesn't apply\
  \ to this project.\n\nLength follows mechanism complexity, not a fixed page count\
  \ — Bitcoin proves its point in 9 pages;\nMakerDAO needs far more because it coordinates\
  \ more actors and failure modes. Let each section run as\nlong as the idea needs\
  \ and no longer (anti-pattern: forced symmetry). If the project has a token or\n\
  makes any financial/return-implying claim, include a short disclaimer (Uniswap's\
  \ precedent) stating\nthe document is not investment advice.\n\n## Step 3 — Draft\
  \ section by section, applying the craft principles\n\nWork through `reference.md`'s\
  \ craft principles as each section gets written. The ones that matter\nmost in practice:\n\
  \n- Open with a failure scenario, not a mission statement.\n- Build the mechanism\
  \ from a minimal model upward — don't state the final design cold.\n- Every security\
  \ or performance claim gets a number, threshold, or named proof — never an adjective\n\
  \  alone (\"highly secure\" is not a claim).\n- Every incentive-driven actor (miner,\
  \ LP, oracle node, keeper, validator) gets its own paragraph\n  naming exactly what\
  \ they earn and what punishes defection.\n- Name specific attack vectors and pair\
  \ each with its specific countermeasure.\n- Include at least one worked, traceable\
  \ example — a transaction walkthrough, a numeric calculation,\n  a step-by-step\
  \ lifecycle.\n- If this design revises or extends a known predecessor, write it\
  \ as an explicit delta (what changed\n  and why), not a from-scratch re-explanation.\n\
  \n## Step 4 — Run the anti-pattern filter before showing a draft\n\nScan against\
  \ `reference.md`'s anti-pattern list. Any hit is a reason to rewrite the line, not\
  \ soften\nit: price predictions or market-cap claims, unverifiable team/advisor\
  \ credentials used as an\nargument, roadmap phases presented as proof of viability,\
  \ a tokenomics table with no stated\nmechanical purpose, novelty claimed without\
  \ naming what came before, a security claim with no threat\nmodel behind it, a missing\
  \ limitations section, buzzwords substituting for a mechanism description.\n\n##\
  \ Step 5 — Self-check and disclose gaps\n\nBefore finalizing:\n\n- Confirm every\
  \ numeric or technical claim traces to something the user provided or a cited external\n\
  \  source — flag anything you inferred rather than were told.\n- Confirm a limitations/risks\
  \ section exists and isn't hollow.\n- Run `reference.md`'s pre-publish checklist\
  \ and state the result (pass/fail per item, or a\n  self-rating) to the user before\
  \ calling the draft done — don't ship a whitepaper without surfacing\n  what's unresolved.\n\
  \n## Output format\n\nMarkdown, sections matching the chosen archetype skeleton,\
  \ an abstract at the top, references/sources\nat the bottom if external material\
  \ was used. No emoji, no bolded label scaffolding (`Problem:`,\n`Solution:`), no\
  \ forced symmetry between sections — a simple idea gets a short section, a hard\
  \ one\ngets a long one, exactly as the five reference papers do.\n\nCite every external\
  \ claim (a cryptographic primitive, a competitor's known limitation, a market fact)\n\
  inline with a bracketed marker (e.g. `[1]`) resolving to a numbered reference list\
  \ at the end — never\nassert an outside fact with no traceable source. See `reference.md`\
  \ → Calibration examples for what a\ncompliant vs. non-compliant sentence looks\
  \ like before you draft the real thing."
