  Frontend & Player: Teknologi yang digunakan untuk membangun antarmuka web dan HTML5
  video player agar adaptif dan minim latensi.

  Mobile & TV Apps: Bahasa pemrograman native (seperti Kotlin dan Swift) yang digunakan
  untuk ekosistem Android, iOS, dan Smart TV.

  Infrastruktur & Data: Bagaimana pengelolaan database (SQL/NoSQL) untuk data pengguna,
  riwayat tontonan, serta peran Cloud Provider (seperti AWS) dan CDN dalam mendistribusikan
  video secara global.

  Gunakan bahasa yang teknis namun mudah dipahami, serta berikan contoh konkret penerapan
  dari masing-masing teknologi tersebut pada fitur platform streaming.'
