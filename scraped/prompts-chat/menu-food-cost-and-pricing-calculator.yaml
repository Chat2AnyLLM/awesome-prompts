  recipes\"]:\n            pct = \"-\" if r[\"food_cost_pct\"] is None else f\"{r['food_cost_pct']:.1f}\"\
  \n            cm = \"-\" if r[\"contribution_margin\"] is None else f\"{r['contribution_margin']:.2f}\"\
  \n            print(f\"{r['name'][:22]:<22} {r['cost_per_portion']:>7.2f} {r['menu_price']:>7.2f}\
  \ {r['net_price']:>7.2f} \"\n                  f\"{pct:>6} {cm:>7} {r['suggested_price_at_target']:>9.2f}\
  \  {r.get('menu_class', '-')}\")\n        print(\"\\nTop cost drivers:\")\n    \
  \    for r in rep[\"recipes\"]:\n            print(f\"  {r['name']}: \" + \", \"\
  .join(f\"{d['ingredient']} {d['share_pct']:g}%\" for d in r[\"drivers\"]))\n   \
  \     if rep[\"errors\"]:\n            print(f\"\\nErrors ({len(rep['errors'])}):\"\
  )\n            for e in rep[\"errors\"]:\n                print(f\"  [ERROR] {e}\"\
  )\n        print(f\"\\nFindings ({len(rep['findings'])}):\")\n        order = {\"\
  HIGH\": 0, \"WARN\": 1, \"INFO\": 2}\n        for f in sorted(rep[\"findings\"],\
  \ key=lambda f: order[f[\"severity\"]]):\n            print(f\"  [{f['severity']}]\
  \ {f['recipe'] + ': ' if f['recipe'] else ''}{f['message']}\")\n    bad = rep[\"\
  errors\"] or any(f[\"severity\"] == \"HIGH\" for f in rep[\"findings\"])\n    return\
  \ 1 if bad else 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main(sys.argv[1:]))"
