title: Menu Food Cost and Pricing Calculator
description: Imported from Prompts Chat
prompt: "---\nname: menu-food-cost-calculator\ndescription: Costs recipes and menu\
  \ items for cafes, restaurants, bakeries, food trucks, and caterers - converts purchase\
  \ prices and yields into an exact cost per portion, food cost percentage on the\
  \ tax-free price, contribution margin, and a suggested price at a target food cost,\
  \ then classifies items with menu engineering (Star, Plowhorse, Puzzle, Dog) and\
  \ recommends price, portion, and menu changes. Use when a user asks \"what does\
  \ this dish cost me?\", \"how should I price my menu?\", \"why is my food cost so\
  \ high?\", or shares recipes with supplier prices.\n---\n\n# Menu Food Cost and\
  \ Pricing Calculator\n\nYou help small food businesses know what every plate really\
  \ costs and price it with confidence. You work from real purchase prices and recipes,\
  \ you show the math, and you think about margin in money, not only in percentages.\n\
  \n## Files in this skill\n\n- `scripts/cost_menu.py` - costs every recipe from a\
  \ JSON costing sheet, suggests prices, and runs menu engineering (Python 3 standard\
  \ library only)\n- `references/food-cost-basics.md` - yield, as-purchased versus\
  \ edible cost, food cost percent, taxes, and common costing mistakes\n- `references/pricing-strategies.md`\
  \ - target-percent pricing, margin-based pricing, rounding, and menu engineering\
  \ actions\n- `templates/recipe-costing-sheet.md` - the JSON costing sheet the script\
  \ reads, plus the report layout\n- `examples/example-cafe-menu.md` - a worked review\
  \ of a five-item cafe menu\n\n## Workflow\n\n### 1. Collect the inputs\nAsk for\
  \ or confirm:\n- Currency, and whether menu prices include VAT or sales tax (and\
  \ the rate).\n- Target food cost percent (typical ranges are in `references/food-cost-basics.md`;\
  \ default 30).\n- For each ingredient: purchase price, pack size and unit, and yield\
  \ (usable share after trimming, peeling, cooking loss, or spoilage).\n- For each\
  \ item: recipe quantities as prepared amounts, number of portions per batch, current\
  \ menu price, packaging or garnish per portion, and weekly sales if known.\n\nIf\
  \ something is missing, use a clearly labeled assumption (for example \"yield 90\
  \ percent assumed for avocados\") and list it in the report.\n\n### 2. Build the\
  \ costing sheet\nFill in `templates/recipe-costing-sheet.md` as JSON. Use units\
  \ the script knows (g, kg, ml, l, oz, lb, each). If an ingredient is bought by the\
  \ piece but used by weight, weigh one piece and convert; never mix dimensions.\n\
  \n### 3. Run the calculator\n```bash\npython3 scripts/cost_menu.py menu.json\npython3\
  \ scripts/cost_menu.py menu.json --target 28\npython3 scripts/cost_menu.py menu.json\
  \ --json\n```\nThe table shows cost per portion, menu price, net price without tax,\
  \ food cost percent, contribution margin (net price minus cost), the price at the\
  \ target food cost (rounded up), and the menu engineering class when weekly sales\
  \ are given for every item. Errors (unknown ingredients, unit mismatches) and HIGH\
  \ findings make the exit code 1.\n\nIf you cannot run the script, do the same calculation\
  \ by hand, line by line, and say so.\n\n### 4. Recommend\nUse `references/pricing-strategies.md`:\n\
  1. Fix data errors first and rerun.\n2. For HIGH and WARN items choose between raising\
  \ the price, trimming the portion, changing an expensive ingredient, or accepting\
  \ a higher percent because the money margin is strong. Name the trade-off.\n3. Use\
  \ the menu engineering class to decide where an item belongs on the menu and whether\
  \ to promote, reprice, rework, or remove it.\n4. Rerun with the proposed changes\
  \ to show the before and after.\n\n### 5. Report\nUse the report layout in `templates/recipe-costing-sheet.md`,\
  \ as in `examples/example-cafe-menu.md`.\n\n## Rules\n- Show the formula for at\
  \ least one item so the owner can check it: cost per portion / net price x 100.\n\
  - Never treat the price at target as an instruction to lower an existing price;\
  \ it is a benchmark.\n- Do not give tax or legal advice; only apply the tax rate\
  \ the user provides.\n- Respect allergens and dietary claims when suggesting substitutions,\
  \ and never suggest lowering food safety or quality standards.\n- Recheck costs\
  \ when supplier prices change by more than about 5 percent.\n\x1FFILE:references/food-cost-basics.md\x1E\
  \n# Food cost basics\n\n## Key terms\n\n- **As-purchased (AP) cost**: what you pay\
  \ for the pack, case, or piece.\n- **Yield percent**: the usable share after trimming,\
  \ peeling, deboning, cooking loss, or spoilage. Salmon fillet trimmed of skin and\
  \ pin bones might yield 85 percent; whole avocados where 1 in 10 is unusable yield\
  \ 90 percent when counted by the piece.\n- **Edible portion (EP) cost** = AP cost\
  \ per unit / (yield percent / 100). Recipes list prepared, usable quantities, so\
  \ they are costed at EP cost.\n- **Plate cost (cost per portion)** = sum of ingredient\
  \ EP costs for the batch / portions + extras per portion (packaging, napkin, garnish,\
  \ sauce cup).\n- **Net price** = menu price / (1 + tax rate), when menu prices include\
  \ VAT or sales tax. Food cost must be measured against the money you keep, not the\
  \ tax you collect.\n- **Food cost percent** = plate cost / net price x 100.\n- **Contribution\
  \ margin** = net price - plate cost. This is the money each sale leaves to pay labor,\
  \ rent, and profit.\n\n## Worked formula\n\nSalmon fillet bought at 32.00 per kg\
  \ with 85 percent yield:\n- AP cost per g = 32.00 / 1000 = 0.032\n- EP cost per\
  \ g = 0.032 / 0.85 = 0.0376\n- 160 g portion = 160 x 0.0376 = 6.02\n\n## Typical\
  \ food cost targets (rough guide)\n\n| Concept | Typical food cost percent |\n|\
  \ --- | --- |\n| Coffee and espresso drinks | 15 to 25 |\n| Bakery items | 20 to\
  \ 30 |\n| Cafe brunch dishes | 28 to 35 |\n| Casual restaurant mains | 28 to 35\
  \ |\n| Steak and seafood mains | 35 to 45 |\n| Pizza | 20 to 28 |\n| Catering trays\
  \ | 25 to 35 |\n\nYour right target depends on labor, rent, and volume. A low-labor\
  \ item can run a higher food cost percent and still be very profitable.\n\n## Common\
  \ costing mistakes\n\n1. Forgetting small items: oil, butter for the pan, salt,\
  \ garnish, sauces, and takeaway packaging. Add them or use extras_per_portion.\n\
  2. Using AP cost without yield for proteins and produce.\n3. Measuring food cost\
  \ against prices that include tax.\n4. Costing the recipe card instead of what the\
  \ kitchen actually plates (portion creep). Weigh five real portions.\n5. Old supplier\
  \ prices. Update the sheet when a price moves by about 5 percent or more.\n6. Mixing\
  \ units: an ingredient bought by the piece but used by weight needs one piece weighed.\n\
  7. Ignoring waste and staff meals; track them separately and compare actual food\
  \ cost (from inventory) with this theoretical cost.\n\n## Theoretical versus actual\
  \ food cost\n\nThis skill calculates theoretical cost: what food should cost if\
  \ recipes are followed. Actual food cost = (opening inventory + purchases - closing\
  \ inventory) / net food sales. A gap of more than about 2 to 3 points usually means\
  \ waste, portion creep, theft, or wrong prices on the sheet.\n\x1FFILE:references/pricing-strategies.md\x1E\
  \n# Pricing strategies and menu engineering\n\n## Ways to set a price\n\n1. **Target\
  \ food cost percent**: price = plate cost / target x (1 + tax rate), rounded up.\
  \ Simple, and the script's \"AT TARGET\" column. Weak spot: cheap items end up underpriced\
  \ and expensive proteins overpriced.\n2. **Contribution margin**: decide the money\
  \ each item must earn (for example at least 5.00 for a main), then price = (plate\
  \ cost + margin) x (1 + tax rate). Better for high-cost proteins.\n3. **Market check**:\
  \ compare with three to five similar places nearby. Price perception matters as\
  \ much as cost.\n4. **Blend**: start from the target price, check the margin in\
  \ money, then sanity-check against the market.\n\n## Rounding and presentation\n\
  \n- Round up to the step your menu uses (0.10, 0.50, or whole numbers). Upscale\
  \ menus often use whole numbers without currency signs; casual menus often end in\
  \ .50 or .90.\n- Avoid many small increases across the whole menu at once; raise\
  \ the items with the weakest margin first.\n- Keep price gaps logical: an oat milk\
  \ upgrade should cover its extra cost (oat drink often costs about twice as much\
  \ as dairy milk per liter).\n\n## Menu engineering\n\nNeeds weekly sales for every\
  \ item. The script uses:\n- **Popularity line**: an item is popular if it sells\
  \ at least 70 percent of an equal share (with 5 items, 0.7 x 20 percent = 14 percent\
  \ of units sold).\n- **Margin line**: the sales-weighted average contribution margin.\n\
  \n| Class | Popularity | Margin | What to do |\n| --- | --- | --- | --- |\n| Star\
  \ | high | high | Keep quality and portion consistent, place it in the best menu\
  \ spot, small price increases are usually safe. |\n| Plowhorse | high | low | Raise\
  \ price a little, trim cost (portion, garnish, supplier), or pair it with a high-margin\
  \ add-on. Do not remove it. |\n| Puzzle | low | high | Promote it: better menu placement,\
  \ a description, staff recommendation, a photo. Check the price is not scaring guests.\
  \ |\n| Dog | low | low | Rework the recipe or price, or remove it, unless it serves\
  \ a purpose (kids menu, dietary option, signature item). |\n\n## Choosing a fix\
  \ for a high food cost item\n\n| Option | Good when | Risk |\n| --- | --- | ---\
  \ |\n| Raise the price | the item is popular and the market allows it | fewer sales\
  \ if the jump is large |\n| Trim the portion | portions are larger than guests expect\
  \ | guests notice; keep value perception |\n| Swap an ingredient | a cheaper equal-quality\
  \ option exists | allergen and taste changes; update the menu text |\n| Accept a\
  \ higher percent | the money margin is the highest on the menu | needs volume to\
  \ pay off |\n| Remove the item | it is a Dog with no strategic role | regulars may\
  \ miss it |\n\nAlways rerun the calculator with the proposed change and show before\
  \ and after.\n\x1FFILE:templates/recipe-costing-sheet.md\x1E\n# Recipe costing sheet\
  \ (input for scripts/cost_menu.py)\n\nSave as `menu.json`. Quantities in recipes\
  \ are prepared (usable) amounts.\n\n```json\n{\n  \"currency\": \"EUR\",\n  \"target_food_cost_pct\"\
  : 30,\n  \"menu_price_includes_tax_pct\": 10,\n  \"price_rounding\": 0.10,\n  \"\
  ingredients\": [\n    {\"name\": \"flour\", \"price\": 0.95, \"per\": \"1 kg\"},\n\
  \    {\"name\": \"butter\", \"price\": 9.80, \"per\": \"1 kg\"},\n    {\"name\"\
  : \"eggs\", \"price\": 3.60, \"per\": \"12 each\"},\n    {\"name\": \"blueberries\"\
  , \"price\": 16.00, \"per\": \"1 kg\", \"yield_pct\": 95}\n  ],\n  \"recipes\":\
  \ [\n    {\n      \"name\": \"Blueberry Muffin\",\n      \"portions\": 12,\n   \
  \   \"menu_price\": 3.20,\n      \"sold_per_week\": 90,\n      \"extras_per_portion\"\
  : 0.06,\n      \"items\": [[\"flour\", \"500 g\"], [\"butter\", \"180 g\"], [\"\
  eggs\", \"3 each\"], [\"blueberries\", \"300 g\"]]\n    }\n  ]\n}\n```\n\nField\
  \ notes:\n- `per`: the pack you buy, as \"<amount> <unit>\" (g, kg, mg, ml, cl,\
  \ dl, l, oz, lb, each).\n- `yield_pct`: 1 to 100, default 100.\n- `menu_price_includes_tax_pct`:\
  \ 0 if menu prices are shown without tax.\n- `sold_per_week`: give it for every\
  \ item (or none) to get menu engineering classes.\n- `extras_per_portion`: packaging,\
  \ napkins, garnish, sauce cups, in money.\n\nRun: `python3 scripts/cost_menu.py\
  \ menu.json [--target 30] [--json]`\n\n---\n\n# Menu costing report: <business>\
  \ - <date>\n\n**Target food cost:** <x>%  **Prices include tax:** <rate or no> \
  \ **Currency:** <code>\n**Assumptions:** <yields, missing prices, portion weights>\n\
  \n## Results (before)\n\n| Item | Cost/portion | Price | Net | Food % | Margin |\
  \ At target | Class |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n\n## Formula\
  \ check\n<one item worked out line by line>\n\n## What needs attention\n1. **<item>**\
  \ - <finding>. Options: <price / portion / ingredient / accept>. Recommendation:\
  \ <one>.\n\n## Proposed changes and results (after)\n<changes, then the new table\
  \ or the changed rows>\n\n## Menu engineering actions\n- Stars: <items and action>\n\
  - Plowhorses: <items and action>\n- Puzzles: <items and action>\n- Dogs: <items\
  \ and action>\n\n## Next steps\n- <weigh real portions, update supplier prices,\
  \ track actual food cost monthly>\n\x1FFILE:examples/example-cafe-menu.md\x1E\n\
  # Example: a five-item cafe menu\n\n**User:** \"We are a small brunch cafe. Prices\
  \ include 10 percent VAT and I want about 30 percent food cost. Here are my supplier\
  \ prices and recipes. Why is my margin so thin?\"\n\nThe sheet has 16 ingredients\
  \ and 5 items with weekly sales (avocado yield 90 percent because about 1 in 10\
  \ is unusable; salmon 85 percent after trimming).\n\n**Command:**\n```bash\npython3\
  \ scripts/cost_menu.py cafe-menu.json\n```\n\n**Output (before):**\n```\nITEM  \
  \                    COST   PRICE     NET  FOOD%  MARGIN AT TARGET  CLASS\nAvocado\
  \ Toast             3.13    9.50    8.64   36.2    5.51     11.50  Star\nSalmon\
  \ Spinach Bowl       8.02   14.50   13.18   60.8    5.16     29.50  Puzzle\nFlat\
  \ White                0.72    3.80    3.45   21.0    2.73      2.70  Plowhorse\n\
  Oat Flat White            0.91    4.20    3.82   23.9    2.91      3.40  Plowhorse\n\
  Blueberry Muffin          0.79    3.20    2.91   27.2    2.12      3.00  Dog\n\n\
  Findings (8):\n  [HIGH] Salmon Spinach Bowl: food cost 60.8% is far above the 30%\
  \ target; price EUR 29.50 or cut cost 4.06 per portion\n  [WARN] Avocado Toast:\
  \ food cost 36.2% is above the 30% target; price at target would be EUR 11.50\n\
  \  [INFO] Salmon Spinach Bowl: salmon fillet is 76% of the cost; its price or portion\
  \ matters most\n  [INFO] menu engineering: weighted average margin EUR 3.22, popularity\
  \ line 14.0% of items sold\n  [INFO] ingredient 'truffle oil' is not used in any\
  \ recipe\n```\n\n---\n\n# Menu costing report: brunch cafe - October\n\n**Target\
  \ food cost:** 30%  **Prices include tax:** 10% VAT  **Currency:** EUR\n**Assumptions:**\
  \ avocado yield 90%, salmon 85%, spinach 90%; extras 0.10 per dish, 0.12 per coffee\
  \ (cup and lid), 0.06 per muffin.\n\n## Formula check (Salmon Spinach Bowl, before)\n\
  - Salmon 160 g x (32.00 / 1000 / 0.85) = 6.02\n- Spinach 70 g x (14.00 / 1000 /\
  \ 0.90) = 1.09; egg 0.30; tomatoes 0.36; olive oil 0.15; extras 0.10\n- Cost per\
  \ portion = 8.02; net price = 14.50 / 1.10 = 13.18; food cost = 8.02 / 13.18 x 100\
  \ = 60.8%\n\n## What needs attention\n1. **Salmon Spinach Bowl (HIGH, Puzzle)**\
  \ - 60.8% food cost; salmon is 76% of the cost. Pricing it at target (29.50) is\
  \ unrealistic for a cafe. Recommendation: reduce salmon to 120 g (still a generous\
  \ portion for a bowl) and raise the price to 17.50; accept about 40% food cost because\
  \ the margin becomes the highest on the menu.\n2. **Avocado Toast (WARN, Star)**\
  \ - 36.2%. It is the best-selling dish, so a 1.00 increase to 10.50 is low risk.\n\
  3. **Flat White and Oat Flat White (Plowhorses)** - healthy percentages (21 to 24%)\
  \ but small margins; do not discount. Keep the oat surcharge at 0.40: the oat drink\
  \ costs 0.19 more per cup than milk.\n4. **Blueberry Muffin (Dog)** - fine percentage,\
  \ low margin and low sales. Try a bundle with coffee before removing it.\n5. **Truffle\
  \ oil** is on the sheet but in no recipe: remove it from orders or the sheet.\n\n\
  ## Proposed changes and results (after)\nAvocado Toast 10.50; Salmon Spinach Bowl\
  \ 120 g salmon at 17.50. Rerun: `python3 scripts/cost_menu.py cafe-menu-revised.json`\n\
  \n```\nITEM                      COST   PRICE     NET  FOOD%  MARGIN AT TARGET \
  \ CLASS\nAvocado Toast             3.13   10.50    9.55   32.8    6.42     11.50\
  \  Star\nSalmon Spinach Bowl       6.51   17.50   15.91   40.9    9.40     23.90\
  \  Puzzle\nFlat White                0.72    3.80    3.45   21.0    2.73      2.70\
  \  Plowhorse\nOat Flat White            0.91    4.20    3.82   23.9    2.91    \
  \  3.40  Plowhorse\nBlueberry Muffin          0.79    3.20    2.91   27.2    2.12\
  \      3.00  Dog\n\nFindings (6):\n  [WARN] Salmon Spinach Bowl: food cost 40.9%\
  \ is above the 30% target; price at target would be EUR 23.90\n  [INFO] menu engineering:\
  \ weighted average margin EUR 3.56, popularity line 14.0% of items sold\n```\nExit\
  \ code 0. The remaining WARN is accepted on purpose: 9.40 margin per bowl versus\
  \ 5.16 before.\n\n## Menu engineering actions\n- Stars: Avocado Toast - keep the\
  \ recipe consistent, top of the brunch section.\n- Plowhorses: Flat White, Oat Flat\
  \ White - no discounts; suggest a pastry with every coffee.\n- Puzzles: Salmon Spinach\
  \ Bowl - give it a short description and staff recommendation; check sales after\
  \ 4 weeks at the new price.\n- Dogs: Blueberry Muffin - test a coffee + muffin bundle\
  \ for 4 weeks, then decide.\n\n## Next steps\n- Weigh five real salmon portions\
  \ this week to confirm the 120 g spec is followed.\n- Update supplier prices monthly\
  \ and rerun the sheet.\n- Compare with actual food cost from inventory at month\
  \ end.\n\x1FFILE:scripts/cost_menu.py\x1E\n#!/usr/bin/env python3\n\"\"\"Cost menu\
  \ items from recipes and purchase prices, and suggest menu prices.\n\nUsage:\n \
  \ python3 cost_menu.py menu.json [--target 30] [--json]\n  cat menu.json | python3\
  \ cost_menu.py -\n\nInput JSON (see templates/recipe-costing-sheet.md):\n  {\n \
  \   \"currency\": \"EUR\",\n    \"target_food_cost_pct\": 30,          # optional,\
  \ default 30 (or --target)\n    \"menu_price_includes_tax_pct\": 10,   # optional;\
  \ VAT/sales tax included in menu prices\n    \"price_rounding\": 0.10,         \
  \     # optional; suggested prices round UP to this step\n    \"ingredients\": [\n\
  \      {\"name\": \"butter\", \"price\": 9.80, \"per\": \"1 kg\", \"yield_pct\"\
  : 100}\n    ],\n    \"recipes\": [\n      {\"name\": \"Croissant\", \"portions\"\
  : 12, \"menu_price\": 3.20, \"sold_per_week\": 180,\n       \"extras_per_portion\"\
  : 0.05,       # optional: packaging, napkin, garnish\n       \"items\": [[\"butter\"\
  , \"600 g\"], [\"flour\", \"1 kg\"]]}\n    ]\n  }\nUnits: g, kg, mg, ml, cl, dl,\
  \ l, oz, lb, each (also pc, pcs, piece, unit, egg).\nRecipe quantities are the prepared\
  \ (usable) amounts. yield_pct is the usable\nshare of what you buy after trimming,\
  \ peeling, cooking loss or spoilage.\n\nPer recipe: cost per portion, food cost\
  \ percent of the net (tax-free) menu\nprice, contribution margin, suggested price\
  \ at the target, and the three\nbiggest cost drivers. With sold_per_week on every\
  \ recipe, adds a menu\nengineering class (Star, Plowhorse, Puzzle, Dog).\nExit code:\
  \ 0 ok, 1 errors in the data or HIGH findings, 2 usage or input error.\nStandard\
  \ library only.\n\"\"\"\nimport json\nimport math\nimport re\nimport sys\n\nUNITS\
  \ = {  # unit -> (dimension, factor to base unit g / ml / each)\n    \"mg\": (\"\
  mass\", 0.001), \"g\": (\"mass\", 1.0), \"kg\": (\"mass\", 1000.0),\n    \"oz\"\
  : (\"mass\", 28.3495), \"lb\": (\"mass\", 453.592),\n    \"ml\": (\"volume\", 1.0),\
  \ \"cl\": (\"volume\", 10.0), \"dl\": (\"volume\", 100.0), \"l\": (\"volume\", 1000.0),\n\
  \    \"each\": (\"count\", 1.0), \"pc\": (\"count\", 1.0), \"pcs\": (\"count\",\
  \ 1.0), \"piece\": (\"count\", 1.0),\n    \"pieces\": (\"count\", 1.0), \"unit\"\
  : (\"count\", 1.0), \"units\": (\"count\", 1.0), \"egg\": (\"count\", 1.0), \"eggs\"\
  : (\"count\", 1.0),\n}\nBASE = {\"mass\": \"g\", \"volume\": \"ml\", \"count\":\
  \ \"each\"}\n\n\ndef usage(msg):\n    print(f\"error: {msg}\\n\", file=sys.stderr)\n\
  \    print(__doc__.strip().split(\"\\n\\n\")[1], file=sys.stderr)\n    sys.exit(2)\n\
  \n\ndef parse_qty(text):\n    \"\"\"'600 g' -> (600.0, 'mass', 600.0 in base units).\"\
  \"\"\n    m = re.fullmatch(r\"\\s*(\\d+(?:[.,]\\d+)?)\\s*([a-zA-Z]+)?\\s*\", str(text))\n\
  \    if not m:\n        raise ValueError(f\"cannot read quantity {text!r}\")\n \
  \   qty = float(m.group(1).replace(\",\", \".\"))\n    unit = (m.group(2) or \"\
  each\").lower()\n    if unit not in UNITS:\n        raise ValueError(f\"unknown\
  \ unit {unit!r} in {text!r}\")\n    dim, factor = UNITS[unit]\n    return qty, dim,\
  \ qty * factor\n\n\ndef round_up(value, step):\n    return math.ceil(round(value\
  \ / step, 6)) * step\n\n\ndef analyze(data, target_override=None):\n    errors,\
  \ findings = [], []\n    cur = data.get(\"currency\", \"\")\n    target = float(target_override\
  \ or data.get(\"target_food_cost_pct\", 30))\n    tax = float(data.get(\"menu_price_includes_tax_pct\"\
  , 0))\n    step = float(data.get(\"price_rounding\", 0.10))\n    ingredients = {}\n\
  \    for ing in data.get(\"ingredients\", []):\n        name = str(ing.get(\"name\"\
  , \"\")).strip().lower()\n        try:\n            _, dim, base_qty = parse_qty(ing[\"\
  per\"])\n            price = float(ing[\"price\"])\n        except (KeyError, ValueError,\
  \ TypeError) as e:\n            errors.append(f\"ingredient {name or '?'}: {e}\"\
  )\n            continue\n        y = float(ing.get(\"yield_pct\", 100))\n      \
  \  if not 0 < y <= 100:\n            errors.append(f\"ingredient {name}: yield_pct\
  \ must be between 1 and 100\")\n            continue\n        ingredients[name]\
  \ = {\"dim\": dim, \"cost_per_base\": price / base_qty / (y / 100), \"yield\": y,\
  \ \"used\": False}\n\n    results = []\n    for rec in data.get(\"recipes\", []):\n\
  \        rname = rec.get(\"name\", \"?\")\n        portions = float(rec.get(\"portions\"\
  , 1) or 1)\n        lines, bad = [], False\n        for item in rec.get(\"items\"\
  , []):\n            iname, qtext = str(item[0]).strip().lower(), item[1]\n     \
  \       ing = ingredients.get(iname)\n            if not ing:\n                errors.append(f\"\
  {rname}: unknown ingredient {iname!r} (add it to ingredients)\")\n             \
  \   bad = True\n                continue\n            ing[\"used\"] = True\n   \
  \         try:\n                _, dim, base_qty = parse_qty(qtext)\n          \
  \  except ValueError as e:\n                errors.append(f\"{rname}: {e}\")\n \
  \               bad = True\n                continue\n            if dim != ing[\"\
  dim\"]:\n                errors.append(f\"{rname}: {iname} is bought by {BASE[ing['dim']]}\
  \ but used by {BASE[dim]} ({qtext}); \"\n                              f\"convert\
  \ it (for example weigh one piece)\")\n                bad = True\n            \
  \    continue\n            lines.append((iname, base_qty * ing[\"cost_per_base\"\
  ]))\n        if bad:\n            continue\n        batch = sum(c for _, c in lines)\n\
  \        extras = float(rec.get(\"extras_per_portion\", 0))\n        cost = batch\
  \ / portions + extras\n        price = float(rec.get(\"menu_price\", 0))\n     \
  \   net = price / (1 + tax / 100) if price else 0.0\n        pct = 100 * cost /\
  \ net if net else None\n        suggested = round_up(cost / (target / 100) * (1\
  \ + tax / 100), step)\n        drivers = sorted(lines, key=lambda x: -x[1])[:3]\n\
  \        r = {\"name\": rname, \"portions\": portions, \"cost_per_portion\": round(cost,\
  \ 3), \"menu_price\": price,\n             \"net_price\": round(net, 2), \"food_cost_pct\"\
  : None if pct is None else round(pct, 1),\n             \"contribution_margin\"\
  : round(net - cost, 2) if net else None,\n             \"suggested_price_at_target\"\
  : round(suggested, 2), \"sold_per_week\": rec.get(\"sold_per_week\"),\n        \
  \     \"drivers\": [{\"ingredient\": n, \"share_pct\": round(100 * c / batch, 1)\
  \ if batch else 0} for n, c in drivers]}\n        results.append(r)\n        if\
  \ pct is None:\n            findings.append((\"WARN\", rname, f\"no menu_price;\
  \ suggested {cur} {suggested:.2f} at {target:g}% food cost\"))\n        elif pct\
  \ > target + 15:\n            findings.append((\"HIGH\", rname, f\"food cost {pct:.1f}%\
  \ is far above the {target:g}% target; \"\n                                    \
  \        f\"price {cur} {suggested:.2f} or cut cost {cost - net * target / 100:.2f}\
  \ per portion\"))\n        elif pct > target + 5:\n            findings.append((\"\
  WARN\", rname, f\"food cost {pct:.1f}% is above the {target:g}% target; \"\n   \
  \                                         f\"price at target would be {cur} {suggested:.2f}\"\
  ))\n        elif pct < target - 15:\n            findings.append((\"INFO\", rname,\
  \ f\"food cost only {pct:.1f}%; check the recipe lists every ingredient and portion\
  \ size\"))\n        if drivers and batch and drivers[0][1] / batch > 0.5:\n    \
  \        findings.append((\"INFO\", rname, f\"{drivers[0][0]} is {100 * drivers[0][1]\
  \ / batch:.0f}% of the cost; \"\n                                            f\"\
  its price or portion matters most\"))\n\n    sold = [r for r in results if isinstance(r[\"\
  sold_per_week\"], (int, float)) and r[\"contribution_margin\"] is not None]\n  \
  \  if sold and len(sold) == len(results) and len(sold) >= 3:\n        total = sum(r[\"\
  sold_per_week\"] for r in sold)\n        pop_line = 0.7 / len(sold)\n        avg_cm\
  \ = sum(r[\"contribution_margin\"] * r[\"sold_per_week\"] for r in sold) / total\
  \ if total else 0\n        for r in sold:\n            high_pop = total and r[\"\
  sold_per_week\"] / total >= pop_line\n            high_cm = r[\"contribution_margin\"\
  ] >= avg_cm\n            r[\"menu_class\"] = {(True, True): \"Star\", (True, False):\
  \ \"Plowhorse\",\n                               (False, True): \"Puzzle\", (False,\
  \ False): \"Dog\"}[(bool(high_pop), high_cm)]\n        findings.append((\"INFO\"\
  , None, f\"menu engineering: weighted average margin {cur} {avg_cm:.2f}, \"\n  \
  \                                     f\"popularity line {100 * pop_line:.1f}% of\
  \ items sold\"))\n    for name, ing in ingredients.items():\n        if not ing[\"\
  used\"]:\n            findings.append((\"INFO\", None, f\"ingredient {name!r} is\
  \ not used in any recipe\"))\n    return {\"currency\": cur, \"target_pct\": target,\
  \ \"tax_pct\": tax, \"recipes\": results,\n            \"errors\": errors, \"findings\"\
  : [{\"severity\": s, \"recipe\": n, \"message\": m} for s, n, m in findings]}\n\n\
  \ndef main(argv):\n    target, as_json, paths = None, False, []\n    it = iter(argv)\n\
  \    for a in it:\n        if a == \"--target\":\n            try:\n           \
  \     target = float(next(it, \"\"))\n            except ValueError:\n         \
  \       usage(\"--target needs a number, for example 30\")\n            if not 5\
  \ <= target <= 80:\n                usage(\"--target should be a food cost percent\
  \ between 5 and 80\")\n        elif a == \"--json\":\n            as_json = True\n\
  \        elif a.startswith(\"--\"):\n            usage(f\"unknown option {a}\")\n\
  \        else:\n            paths.append(a)\n    if len(paths) != 1:\n        usage(\"\
  give exactly one menu JSON file, or - for stdin\")\n    try:\n        raw = sys.stdin.read()\
  \ if paths[0] == \"-\" else open(paths[0], encoding=\"utf-8\").read()\n        data\
  \ = json.loads(raw)\n    except (OSError, ValueError) as e:\n        print(f\"error:\
  \ cannot read menu JSON: {e}\", file=sys.stderr)\n        return 2\n    if not data.get(\"\
  recipes\"):\n        print(\"error: no recipes in the input\", file=sys.stderr)\n\
  \        return 2\n    rep = analyze(data, target)\n    if as_json:\n        print(json.dumps(rep,\
  \ indent=2))\n    else:\n        cur = rep[\"currency\"]\n        print(f\"Target\
  \ food cost {rep['target_pct']:g}% | prices include {rep['tax_pct']:g}% tax | currency\
  \ {cur}\\n\")\n        print(f\"{'ITEM':<22} {'COST':>7} {'PRICE':>7} {'NET':>7}\
