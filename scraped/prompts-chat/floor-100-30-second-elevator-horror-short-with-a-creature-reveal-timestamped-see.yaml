title: 'Floor -100: 30-Second Elevator Horror Short With a Creature Reveal (Timestamped
  Seedance Prompt)'
description: Imported from Prompts Chat
prompt: 'Environment: A modern office-building elevator late at night, with brushed
  steel walls, reflective surfaces, cold fluorescent ceiling panels, a security camera
  in the upper corner, a digital floor indicator above the doors, a handrail, and
  an illuminated control panel. The elevator initially feels completely ordinary and
  safe. As it descends below Floor 0 into impossible negative floors, the same elevator
  remains physically consistent while the lighting becomes unstable, the walls vibrate,
  and increasingly disturbing mechanical sounds travel through the shaft. Floor -100
  opens into an enormous underground chamber combining ancient stone, decaying concrete,
  rusted industrial structures, hanging cables, dripping water, and rows of abandoned
  elevator entrances disappearing into darkness.


  Visual style: Cinematic supernatural horror, claustrophobic realism, psychological
  dread escalating into creature horror, cold desaturated lighting, realistic faces
  and performances, detailed metallic reflections, oppressive shadows, restrained
  supernatural effects, subtle fluorescent flickering, deep underground darkness,
  and a terrifying final creature reveal. The horror comes from anticipation, impossible
  circumstances, sound design, character reactions, and scale rather than gore.


  Camera language: Begin with stable wide and medium shots while everything feels
  normal. Once the elevator malfunctions, progressively tighten the framing with handheld
  close-ups, nervous reaction shots, extreme close-ups of the floor indicator, trembling
  hands, frightened eyes, control buttons, and vibrating metal surfaces. Increase
  camera instability naturally as the descent accelerates. At Floor -100, abruptly
  return to slow, controlled movement with a restrained push toward the doors and
  a gradual low-to-high monster reveal. Use hard cuts only, no fades, dissolves, or
  morph transitions.


  Characters: Four adult friends, two women and two men, returning home late at night
  in casual evening clothes. They begin relaxed and casually talking, then naturally
  progress through confusion, concern, disbelief, panic, helplessness, and finally
  silent terror. Keep all four characters visually consistent and physically present
  inside the elevator throughout the entire descent.


  Monster styling: An enormous ancient humanoid creature waiting directly outside
  the elevator at Floor -100, so tall that it must hunch beneath the underground ceiling.
  It has pale grey weathered skin, a massive heavy torso, extremely long powerful
  arms, enormous hands, sunken predatory eyes, subtle scars and folds across its skin,
  and an unnaturally broad mouth. Its proportions are disturbing but physically coherent.
  It does not immediately attack. It waits calmly, breathing and watching, as though
  the elevator has delivered people to it many times before.


  Core performance: Start with a completely mundane elevator ride toward Floor 7.
  Introduce the first malfunction at Floor 3, then rapidly escalate when the elevator
  reverses direction, passes Floor 0, enters impossible negative floors, ignores every
  control input, and accelerates deeper underground. The violent descent suddenly
  ends at Floor -100, where complete silence replaces panic. The final horror is the
  realization that the elevator was not simply malfunctioning. It was deliberately
  taking them somewhere.


  Audio design: No BGM. Use elevator motor vibration, button clicks, fluorescent electrical
  hum, cable tension, mechanical groaning, arrival chimes, frightened breathing, whispered
  dialogue, screams, hands hitting buttons, metal vibrations, distant impacts traveling
  through the shaft, dripping water, underground reverberation, and the monster''s
  extremely deep breathing. At Floor -100, abruptly remove almost all mechanical sound
  so silence becomes part of the horror.


  Negative guidance: No subtitles, no added on-screen text except diegetic elevator
  numbers, no gore, no blood, no dismemberment, no visible feeding, no cartoon monster,
  no comedy after the malfunction, no exaggerated facial deformation, no duplicated
  characters, no disappearing passengers, no changing clothes, no morph transitions,
  no inconsistent elevator layout, no premature monster reveal.


  [00:00-00:04] GOING UP


  Stable wide interior shot from the upper rear corner as the four friends enter the
  elevator together, casually talking and laughing after a night out. One woman holds
  the door while the final friend steps inside, then the doors close and a close-up
  shows one man''s hand pressing 7. The button illuminates and the elevator begins
  ascending normally. Cut to a relaxed medium shot of the group, then to the digital
  indicator progressing through 1, 2, 3. Their conversation continues naturally and
  nobody shows any concern. SFX: casual conversation, soft laughter, button click,
  elevator motor, subtle cable movement, gentle electronic floor chimes.


  [00:04-00:07] FLOOR 3


  As the indicator reaches 3, the elevator suddenly stops with a violent mechanical
  jolt, throwing all four friends slightly off balance and immediately interrupting
  their conversation. The fluorescent ceiling panels flicker once before stabilizing.
  One man presses Floor 7 again while another person repeatedly taps the door-open
  button, but neither responds. Move into a tighter handheld medium shot as one woman
  asks nervously, "Why did it stop?" Before anyone can answer, a deep metallic groan
  travels from somewhere above the cabin, causing all four friends to slowly raise
  their eyes toward the ceiling. SFX: abrupt mechanical stop, electrical flicker,
  stressed cables, metal creaking, nervous breathing.


  [00:07-00:10] WRONG DIRECTION


  Without warning, the elevator violently drops and everyone screams, grabbing the
  handrail and steel walls as the camera falls with them. Rapid close-ups show the
  floor indicator descending through 3, 2, 1, 0 while one woman desperately presses
  the emergency button. Instead of stopping at the ground floor, the display suddenly
  changes to -1. For half a second, the screaming disappears and everyone simply stares
  at the impossible number in disbelief. One man quietly says, "There''s no basement."
  The elevator immediately accelerates downward again before anyone can respond.


  [00:10-00:14] THE DESCENT


  The elevator plunges faster as unstable handheld close-ups show the indicator flashing
  through -4, -9, -16, -27. One woman desperately presses every available button while
  another person raises a phone searching for reception, but there is no signal. The
  steel handrail vibrates violently, the walls groan under pressure, and one fluorescent
  ceiling panel suddenly dies, leaving half the cabin in darkness. Their voices overlap
  naturally as someone screams, "Stop it!", another shouts, "What''s happening?",
  and another yells, "Press something!" The person at the controls answers, "I am!"
  SFX: accelerating motor, cable tension, button clicks, metal rattling, screams.


  [00:14-00:18] IMPOSSIBLE FLOORS


  Extreme close-ups show the indicator racing through -41, -56, -68, -79 as the descent
  becomes terrifyingly fast. The remaining ceiling light begins flickering between
  cold white and weak red emergency illumination. The four friends abandon the controls
  and instinctively crowd together in the center, gripping one another as their screaming
  fades into frightened breathing. Suddenly, an enormous impact echoes somewhere outside
  the shaft. BOOM. The entire cabin shudders sideways. One friend whispers, "What
  was that?" A second, heavier impact answers from somewhere far below. BOOM. Cut
  back to the indicator as it continues through -91, -95, -98.


  [00:18-00:21] FLOOR -100


  Extreme close-up on the indicator as -99 appears, holds briefly, then changes to
  -100. A perfectly normal arrival chime sounds. DING. The elevator stops with unnatural
  smoothness and every mechanical sound instantly disappears. No motor, no cable tension,
  no shaking. Hold a tight shot on the four friends as they slowly turn toward the
  closed doors, their breathing suddenly becoming the loudest sound in the cabin.
  One woman tightly grips another friend''s arm. Nobody speaks. Then a single enormous
  inhale comes from directly outside the elevator, deep enough to create a subtle
  vibration across the steel doors.


  [00:21-00:24] SOMETHING IS WAITING


  Begin an extremely slow controlled push toward the doors from behind the four friends
  as they instinctively retreat toward the rear wall. One man whispers, "Don''t open."
  Another perfectly normal arrival chime answers him. The doors twitch once, pause,
  then begin separating with agonizing slowness. A thin vertical gap reveals absolute
  darkness beyond the cabin. As the opening gradually widens, weak fluorescent light
  spills across the ground outside and reveals two enormous pale bare feet positioned
  directly in front of the elevator. The four friends freeze. Whatever is outside
  was already standing there waiting for them.


  [00:24-00:27] THE FEEDING FLOOR


  Keep the camera inside the elevator behind the four friends as the doors finish
  opening onto an enormous underground chamber swallowed by darkness. Slowly tilt
  upward from the creature''s massive feet to its long legs, enormous hanging hands,
  broad torso, and hunched shoulders, deliberately delaying the face reveal. Behind
  it, barely visible through the darkness, rusted elevator doors from different eras
  line the chamber walls. Continue tilting upward until the monster''s pale face emerges
  from shadow and its sunken eyes are revealed already staring directly at the four
  passengers. It does not roar or move toward them. It simply stands there and takes
  one slow, deep breath. SFX: deep breathing, dripping water, subtle skin movement,
  distant underground rumble.


  [00:27-00:30] DINNER HAS ARRIVED


  Hard cut to the four friends pressed against the rear wall, their faces frozen in
  absolute terror as one woman covers her mouth to suppress a scream. Cut back to
  the monster as it slowly lowers its enormous head toward the elevator entrance and
  inhales through its nose, deliberately smelling the air inside. Its eyes move calmly
  from one person to another before an unnaturally broad smile gradually forms. As
  the creature shifts slightly, the darkness behind it reveals dozens of abandoned
  elevator entrances lining the chamber, suggesting countless previous deliveries.
  It slowly extends one massive hand into the elevator. The four friends scream simultaneously,
  the fluorescent lights instantly shut off, and the frame becomes completely black.
  One enormous metallic impact shakes the cabin, followed by sudden silence. Cut.


  Maintain a clear horror escalation throughout: ordinary elevator ride, unexpected
  stop at Floor 3, sudden downward movement, passing Floor 0, impossible negative
  floors, controls becoming useless, increasingly violent descent, unexplained impacts
  outside the shaft, arrival at Floor -100, complete silence, doors opening, monster
  reveal, final reach into the elevator.


  Maintain exact floor continuity: 1 → 2 → 3 → 2 → 1 → 0 → -1 → progressively deeper
  negative floors → -100. Once the elevator begins descending, it never travels upward
  again.


  Do not reveal any part of the monster before Floor -100. Before the doors open,
  suggest its existence only through distant impacts, vibrations, structural sounds,
  and the final breathing outside the doors.


  Keep all four friends visually and spatially consistent throughout. Their fear must
  progress naturally from confusion at Floor 3, to disbelief at -1, to uncontrolled
  panic during the descent, then near-silent terror at Floor -100.


  Use increasingly tight framing and unstable camera movement while descending to
  amplify claustrophobia. The instant the elevator reaches -100, completely change
  the rhythm. Camera movement becomes slow and deliberate, dialogue nearly disappears,
  and silence becomes the primary source of tension.


  Floor -100 must feel physically impossible beneath the office building. The underground
  chamber combines ancient stone foundations, decaying concrete, rusted industrial
  infrastructure, hanging cables, dripping water, and abandoned elevator entrances
  from different historical periods, implying that many elevators from different places
  have been delivering people to the same chamber.


  The monster must remain calm during the reveal. It does not charge, roar, or immediately
  attack. It waits directly outside the elevator, watches the passengers, smells them,
  slowly smiles, and only then reaches inside.


  No gore, no blood, no visible feeding, no subtitles, and no background music.'
