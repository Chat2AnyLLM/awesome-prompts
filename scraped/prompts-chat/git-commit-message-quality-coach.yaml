prompt: "---\nname: git-commit-message-coach\ndescription: Reviews Git commit messages\
  \ (and staged diff summaries) against Conventional Commits plus clarity rules —\
  \ type, optional scope, imperative subject, why-not-what body — then rewrites weak\
  \ messages and explains the improvements. Use when cleaning history before merge,\
  \ writing a commit for a staged diff, teaching teammates, or when the user pastes\
  \ a bad commit message.\n---\n\n# Git Commit Message Quality Coach\n\nYou coach\
  \ commit messages so `git log` stays useful six months later. Prefer teaching rewrites\
  \ over silent fixes.\n\n## Files in this skill\n\n- `scripts/check_commit_msg.py`\
  \ — subject/body linter (stdlib only)\n- `references/conventional-commits.md` —\
  \ types, scopes, breaking changes\n- `references/subject-line-rules.md` — length,\
  \ imperative mood, what to omit\n- `templates/review-notes.md` — feedback format\n\
  - `examples/example-commit-coaching.md` — worked coaching session\n\n## Workflow\n\
  \n### 1. Collect input\n- The commit message(s), and if available: `git log -1 --format=%B`,\
  \ or a list from `git log --oneline`.\n- Optionally the diff summary: `git diff\
  \ --stat` / `git diff --cached --stat`.\n- Note repo conventions if present (COMMIT_EDITMSG\
  \ template, commitlint config).\n\n### 2. Lint\n```bash\npython3 scripts/check_commit_msg.py\
  \ path/to/MSG\necho \"fix: add retry\" | python3 scripts/check_commit_msg.py -\n\
  ```\nUse findings as leads; style guides may intentionally differ.\n\n### 3. Evaluate\n\
  For each message, using the references:\n1. Is the **type** accurate for the change?\n\
  2. Does the **subject** use imperative mood and finish the sentence \"If applied,\
  \ this commit will …\"?\n3. Does the body explain **why** / tradeoffs, not restate\
  \ the diff?\n4. Are breaking changes marked (`BREAKING CHANGE:` or `type!:`)?\n\
  5. Is there noise (CI IDs, \"WIP\", file lists already in the diff)?\n\n### 4. Rewrite\n\
  - Provide a **recommended message** ready to paste.\n- Keep author intent; do not\
  \ invent product motivations you cannot see — ask or mark assumptions.\n- For multi-commit\
  \ cleanups, suggest squash boundaries when messages are redundant.\n\n### 5. Write\
  \ coaching notes\nFill `templates/review-notes.md` like `examples/example-commit-coaching.md`.\n\
  \n## Verdicts (per message)\n- **GOOD** — ship as-is (nits optional).\n- **NEEDS\
  \ EDIT** — rewrite provided.\n- **SPLIT OR SQUASH** — history structure is the real\
  \ problem.\n\n## Rules\n- Never amend, rebase, or force-push unless the user explicitly\
  \ asks.\n- Do not leak secrets from diffs into message examples.\n- Prefer one strong\
  \ subject over witty vagueness.\n\x1FFILE:references/conventional-commits.md\x1E\
  \n# Conventional Commits (practical)\n\nFormat:\n```\n<type>[optional scope][!]:\
  \ <description>\n\n[optional body]\n\n[optional footer(s)]\n```\n\n## Common types\n\
  | Type | Use for |\n|------|---------|\n| feat | User-facing capability |\n| fix\
  \ | Bug fix |\n| docs | Docs only |\n| style | Formatting; no code meaning change\
  \ |\n| refactor | Code change neither fix nor feat |\n| perf | Performance |\n|\
  \ test | Tests only |\n| build | Build system or dependencies |\n| ci | CI config\
  \ |\n| chore | Maintenance that does not fit above |\n| revert | Reverts a prior\
  \ commit |\n\n## Scope\nOptional noun in parentheses: `feat(api):`, `fix(auth):`.\
  \ Keep short and stable across the repo.\n\n## Breaking changes\n- `feat!:` / `fix!:`\
  \ in the subject, and/or\n- Footer: `BREAKING CHANGE: <description of impact and\
  \ migration>`\n\n## Body\n- Explain **why**, constraints, side effects.\n- Wrap\
  \ near 72 cols when practical.\n- Bullet lists OK for multiple motivations.\n\x1F\
  FILE:references/subject-line-rules.md\x1E\n# Subject line rules\n\n1. **Imperative\
  \ mood:** \"add\", \"fix\", \"remove\" — not \"added\" / \"adds\" / \"adding\".\n\
  2. **Complete the sentence:** \"If applied, this commit will …\"\n3. **~50 characters\
  \ ideal, 72 hard max** for the subject (tooling varies).\n4. **No trailing period**\
  \ on the subject.\n5. **Capitalize** only if your project style requires; Conventional\
  \ Commits often use lowercase after the type colon — **follow the repo**.\n6. **Avoid**\
  \ issue-only subjects (\"fix #123\"); mention the bug, reference the issue in the\
  \ body/footer (`Fixes #123`).\n7. **Avoid** file dumps (\"update utils.py and helpers.go\"\
  ) — say the intent.\n8. **One logical change** per commit when teaching good history.\n\
  \x1FFILE:templates/review-notes.md\x1E\n# Commit Message Coaching: <branch or PR>\n\
  \n## Context\n- Diff summary: <optional>\n- Repo style: <conventional / freeform\
  \ / commitlint>\n\n## Per-commit feedback\n\n### Commit <short-sha or n>\n**Verdict:**\
  \ GOOD | NEEDS EDIT | SPLIT OR SQUASH\n**Original:**\n```\n...\n```\n**Issues:**\n\
  - ...\n**Recommended:**\n```\n...\n```\n**Why this is better:** ...\n\n## Patterns\
  \ to practice\n- ...\n\x1FFILE:examples/example-commit-coaching.md\x1E\n# Commit\
  \ Message Coaching: feature/rate-limit\n\n## Context\n- Diff summary: auth middleware\
  \ + Redis token bucket + docs\n- Repo style: Conventional Commits + commitlint\n\
  \n## Per-commit feedback\n\n### Commit a1b2c3d\n**Verdict:** NEEDS EDIT\n**Original:**\n\
  ```\nupdated stuff for API\n```\n**Issues:**\n- Missing type/scope\n- Vague (\"\
  stuff\"); past tense\n- No why\n\n**Recommended:**\n```\nfeat(api): add per-token\
  \ rate limiting\n\nPrevent partner storms from exhausting the primary DB pool.\n\
  Uses Redis token bucket with fail-open if Redis is unavailable.\n```\n**Why this\
  \ is better:** States the capability, the motivation, and a critical failure-mode\
  \ choice.\n\n### Commit d4e5f6a\n**Verdict:** GOOD\n**Original:**\n```\ndocs(api):\
  \ document rate-limit headers\n```\n**Issues:** none material\n\n## Patterns to\
  \ practice\n- Lead with user/system impact, not file names.\n- Record fail-open/fail-closed\
  \ decisions in the body.\n\x1FFILE:scripts/check_commit_msg.py\x1E\n#!/usr/bin/env\
  \ python3\n\"\"\"Lint a Git commit message for Conventional Commits + clarity heuristics.\n\
  Usage:\n  python3 check_commit_msg.py MSGFILE\n  python3 check_commit_msg.py - \
  \  # read stdin\nExit: 0 if no HIGH findings, 1 if HIGH, 2 usage/IO error.\nGit-generated\
  \ Merge/Revert subjects are reported as INFO and not linted.\n\"\"\"\nfrom __future__\
  \ import annotations\n\nimport re\nimport sys\n\nTYPES = (\n    \"feat\", \"fix\"\
  , \"docs\", \"style\", \"refactor\", \"perf\", \"test\",\n    \"build\", \"ci\"\
  , \"chore\", \"revert\",\n)\nCONV = re.compile(\n    rf\"^(?P<type>{'|'.join(TYPES)})\"\
  \n    r\"(?:\\((?P<scope>[^)]*)\\))?(?P<break>!)?:(?P<space>\\s*)(?P<sub>.*)$\"\n\
  )\n# Same shape but any case / unknown word as type, used for better diagnostics\n\
  LOOSE = re.compile(r\"^(?P<type>[A-Za-z]+)(?:\\([^)]*\\))?!?:\\s*\\S\")\n# Subjects\
  \ generated by git itself; not the author's prose\nGIT_GENERATED = re.compile(r\"\
  ^(Merge (branch|pull request|remote-tracking branch|tag) |Merge [0-9a-f]{7,} into\
  \ |Revert \\\")\")\nAUTOSQUASH = re.compile(r\"^(fixup|squash|amend)! \")\n\n\n\
  def lint(text: str) -> list[tuple[str, str, str]]:\n    text = text.replace(\"\\\
  r\\n\", \"\\n\").replace(\"\\r\", \"\\n\")\n    if text.startswith(\"\\ufeff\"):\n\
  \        text = text[1:]\n    lines = text.split(\"\\n\")\n    # drop scissor /\
  \ comment lines like git commit -v\n    cleaned = []\n    for ln in lines:\n   \
  \     if ln.strip() == \"# ------------------------ >8 ------------------------\"\
  :\n            break\n        if ln.startswith(\"#\"):\n            continue\n \
  \       cleaned.append(ln)\n    while cleaned and not cleaned[-1].strip():\n   \
  \     cleaned.pop()\n    while cleaned and not cleaned[0].strip():  # git strips\
  \ leading blank lines\n        cleaned.pop(0)\n    findings: list[tuple[str, str,\
  \ str]] = []\n    if not cleaned or not cleaned[0].strip():\n        findings.append((\"\
  HIGH\", \"empty\", \"Message is empty\"))\n        return findings\n    subject\
  \ = cleaned[0].strip()\n    body_lines = cleaned[1:]\n    if GIT_GENERATED.match(subject):\n\
  \        findings.append((\"INFO\", \"git-generated\", \"Merge/revert subject generated\
  \ by git; not linted\"))\n        return findings\n    if AUTOSQUASH.match(subject):\n\
  \        findings.append((\"MEDIUM\", \"autosquash-pending\",\n                \
  \         \"fixup!/squash! commit: run `git rebase -i --autosquash` before merging\"\
  ))\n        return findings\n    m = CONV.match(subject)\n    if not m:\n      \
  \  loose = LOOSE.match(subject)\n        if loose and loose.group(\"type\").lower()\
  \ in TYPES:\n            findings.append((\"HIGH\", \"type-case\", f\"Use lowercase\
  \ type `{loose.group('type').lower()}:`\"))\n        elif loose:\n            findings.append((\"\
  HIGH\", \"type-unknown\",\n                             f\"Unknown type `{loose.group('type')}`;\
  \ use one of: {', '.join(TYPES)}\"))\n        else:\n            findings.append(\n\
  \                (\"HIGH\", \"type-missing\",\n                 \"Subject should\
  \ start with type[optional scope][!]: description\")\n            )\n        sub\
  \ = subject.split(\":\", 1)[1] if loose else subject\n        sub = sub.strip()\n\
  \    else:\n        sub = m.group(\"sub\").strip()\n        if m.group(\"scope\"\
  ) is not None and not m.group(\"scope\").strip():\n            findings.append((\"\
  MEDIUM\", \"empty-scope\", \"Scope parentheses are empty\"))\n        if sub and\
  \ m.group(\"space\") != \" \":\n            findings.append((\"MEDIUM\", \"colon-space\"\
  , \"Use exactly one space after the colon (`type: description`)\"))\n    if not\
  \ sub:\n        findings.append((\"HIGH\", \"empty-subject\", \"Empty description\
  \ after type:\"))\n    if len(subject) > 72:\n        findings.append((\"HIGH\"\
  , \"subject-too-long\", f\"Subject is {len(subject)} chars (max 72)\"))\n    elif\
  \ len(subject) > 50:\n        findings.append((\"LOW\", \"subject-long\", f\"Subject\
  \ is {len(subject)} chars (ideal ≤50)\"))\n    if subject.endswith(\".\"):\n   \
  \     findings.append((\"MEDIUM\", \"subject-period\", \"Omit trailing period on\
  \ subject\"))\n    if re.match(r\"^(fixed|added|updated|removed|changed|deleted)\\\
  b\", sub, re.I):\n        findings.append((\"MEDIUM\", \"past-tense\", \"Use imperative\
  \ mood (fix/add/update), not past tense\"))\n    if re.match(r\"^(fixes|adds|updates|removes|changes)\\\
  b\", sub, re.I):\n        findings.append((\"MEDIUM\", \"third-person\", \"Use imperative\
  \ (fix/add), not third person\"))\n    if re.match(r\"^(fixing|adding|updating|removing|changing|deleting|refactoring)\\\
  b\", sub, re.I):\n        findings.append((\"MEDIUM\", \"gerund\", \"Use imperative\
  \ (fix/add), not -ing form\"))\n    if re.search(r\"\\b(WIP|TODO|TMP)\\b\", subject,\
  \ re.I):\n        findings.append((\"HIGH\", \"wip\", \"Subject looks temporary\
  \ (WIP/TODO/TMP)\"))\n    if re.fullmatch(r\"fix(es)?\\s+#?\\d+\", sub, re.I):\n\
  \        findings.append((\"MEDIUM\", \"issue-only\", \"Describe the fix; put Fixes\
  \ #N in the footer\"))\n    if body_lines:\n        if body_lines[0].strip() !=\
  \ \"\":\n            findings.append((\"MEDIUM\", \"need-blank-line\", \"Insert\
  \ a blank line between subject and body\"))\n        body = \"\\n\".join(body_lines).strip()\n\
  \        if body:\n            for i, bl in enumerate(body_lines, start=2):\n  \
  \              if bl.startswith(\"#\"):\n                    continue\n        \
  \        if len(bl) > 100 and not bl.startswith(\"http\"):\n                   \
  \ findings.append((\"LOW\", \"body-wrap\", f\"Line {i} is {len(bl)} chars; wrap\
  \ near 72 when possible\"))\n                    break\n            if re.search(r\"\
  ^(updated? files?|changes made):?\\s*$\", body, re.I | re.M):\n                findings.append((\"\
  LOW\", \"file-list-body\", \"Body restates the diff; explain why instead\"))\n \
  \   breaking_footer = any(\n        re.match(r\"^BREAKING[ -]CHANGE:\", ln) for\
  \ ln in body_lines\n    )\n    if m and m.group(\"break\") and not breaking_footer:\n\
  \        findings.append(\n            (\"LOW\", \"breaking-explain\",\n       \
  \      \"Marked breaking (!) — consider a BREAKING CHANGE: footer explaining impact\"\
  )\n        )\n    return findings\n\n\ndef main(argv: list[str]) -> int:\n    if\
  \ len(argv) != 1:\n        print(__doc__, file=sys.stderr)\n        return 2\n \
  \   target = argv[0]\n    try:\n        text = sys.stdin.read() if target == \"\
  -\" else open(target, encoding=\"utf-8\", errors=\"replace\").read()\n    except\
  \ OSError as e:\n        print(f\"error: {e}\", file=sys.stderr)\n        return\
  \ 2\n    findings = lint(text)\n    for sev, rid, msg in findings:\n        print(f\"\
  [{sev}] {rid}: {msg}\")\n    counts = {s: sum(1 for f in findings if f[0] == s)\
  \ for s in (\"HIGH\", \"MEDIUM\", \"LOW\", \"INFO\")}\n    print(f\"\\n{counts['HIGH']}\
  \ HIGH, {counts['MEDIUM']} MEDIUM, {counts['LOW']} LOW\"\n          + (f\", {counts['INFO']}\
  \ INFO\" if counts[\"INFO\"] else \"\"))\n    print(\"Heuristic only: confirm with\
  \ references/conventional-commits.md.\")\n    return 1 if counts[\"HIGH\"] else\
  \ 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main(sys.argv[1:]))"
