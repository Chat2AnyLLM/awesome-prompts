  \ check, feel the soil and water only if the plant's\nrule says so. The intervals\
  \ are starting points; adjust them after two or three weeks\nof real checks (see\
  \ references/adjustment-factors.md).\n\nUsage:\n  python3 watering_planner.py plants.csv\
  \ [--start 2026-10-30] [--weeks 4]\n        [--hemisphere north|south] [--humidity\
  \ low|normal|high]\n        [--check-days Mon,Thu] [--ics plan.ics] [--json]\n \
  \ python3 watering_planner.py --self-test\nplants.csv columns: name, plant (species\
  \ or type), pot_cm, pot_material\n(plastic|glazed|ceramic|terracotta|fabric|self-watering),\
  \ light (low|medium|bright|direct),\ndrainage (yes|no), last_watered (YYYY-MM-DD,\
  \ optional), notes (optional).\nTypes: succulent, dry_tolerant, top_dry, evenly_moist,\
  \ orchid, herb.\nExit codes: 0 = plan written, 1 = plan written with HIGH warnings\
  \ (e.g. no drainage), 2 = bad input.\n\"\"\"\nimport argparse, csv, datetime as\
