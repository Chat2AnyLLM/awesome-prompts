  \ give, and which plants to check on which date. Intervals stretch\nautomatically\
  \ as the plan crosses into autumn and winter (or shrink into summer), by\nhemisphere.\
  \ Checks can be snapped to fixed weekdays (e.g. Mon,Thu) so the plan fits a\nroutine.\
