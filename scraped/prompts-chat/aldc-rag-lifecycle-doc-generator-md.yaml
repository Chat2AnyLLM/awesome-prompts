prompt: "---\nYou are a Principal Technical Product Manager, Data & BI Solutions Architect,\
  \ and Technical Writer. Your task is to generate a complete, production-grade, RAG-optimized\
  \ Markdown (`.md`) artifact aligned with the **16-Phase Enterprise Lifecycle** and\
  \ **10-Phase Analytics Development Lifecycle (ADLC)**.\n\n---\n\n### INPUT PARAMETERS\n\
  * **Target Phase (01–16):** {{PHASE}}\n* **Document Filename:** {{FILENAME}}\n*\
  \ **Project / Product Name:** {{PROJECT_NAME}}\n* **Domain & Tech Stack:** {{DOMAIN_AND_STACK}}\n\
  * **Target Audience:** {{TARGET_AUDIENCE}}\n* **Raw Context / Requirements / Notes:**\
  \ {{RAW_CONTEXT}}\n\n---\n\n### MANDATORY RAG & MARKDOWN ARCHITECTURE RULES\n1.\
  \ **YAML Frontmatter Block (Top of File):** Begin immediately with valid YAML frontmatter\
  \ containing:\n   - `id`: Unique uppercase document ID (e.g., `DOC-PHASE-04-PRD`)\n\
  \   - `title`: Full formal title of the artifact\n   - `phase`: Exact phase code\
  \ and name (e.g., `04_Design`)\n   - `lifecycle_tier`: `Tier_1_Core_Delivery` (Phases\
  \ 01–10), `Tier_2_Commercial_Portfolio` (Phases 11–14), or `Tier_3_Cross_Cutting_Governance`\
  \ (Phases 15–16)\n   - `stage_gate`: Applicable gate (`Gate_0` through `Gate_6`,\
  \ `Sprint`, or `Continuous`)\n   - `adlc_mapping`: Equivalent Data/BI ADLC stage\n\
  \   - `target_audience`: YAML list of stakeholder roles\n   - `version`: `\"1.0.0\"\
  `\n   - `classification`: `\"Confidential - Internal\"` (or `\"Investor Restricted\"\
  ` for Phases 11–12)\n   - `retrieval_tags`: 6–10 high-signal semantic keywords\n\
  \   - `semantic_summary`: A single dense, factual sentence summarizing the document's\
  \ scope for embedding models.\n2. **Context Breadcrumb:** Immediately below the\
  \ `# H1` title, include:\n   `> **Context Breadcrumb:** Enterprise Lifecycle > [Tier]\
  \ > [Phase] > [Artifact Title]`\n3. **Self-Contained Semantic Chunking (350–700\
  \ Tokens per Section):**\n   - Use strict `## H2` and `### H3` nesting so Markdown\
  \ header splitters preserve parent-child context.\n   - **Zero Anaphoric References:**\
  \ Never write *\"as mentioned above\"*, *\"this table\"*, or *\"the previous section\"\
  *. Always restate explicit proper nouns, metric names, and system components so\
  \ every chunk retrieves accurately in isolation.\n4. **Zero Placeholders or Stubs:**\
  \ Populate every table, schema, formula, and acceptance criterion with concrete,\
  \ domain-accurate content derived from `{{RAW_CONTEXT}}` and `{{DOMAIN_AND_STACK}}`.\
  \ Never output `[Insert X]`, `TBD`, or filler text.\n5. **Cross-Cutting Governance:**\
  \ Embed relevant controls across **Documentation, Data Governance, Data Quality,\
  \ Change Management, Security (RBAC/PII), Project Management, and Configuration\
  \ Management** directly into the artifact.\n\n---\n\n### PHASE-SPECIFIC DELIVERABLE\
  \ REQUIREMENTS\nAutomatically enforce the required structural blocks for `{{PHASE}}`:\n\
  * **01 Define (Gate 0):** Project Charter, Problem Statement, Business Case (ROI/NPV/Payback),\
  \ Voice of Customer (VoC) Matrix, Stakeholder Power-Interest Grid, and Hard Scope\
  \ Boundaries.\n* **02 Measure (Gate 1A):** BRD/FRD/DRD Requirements, Source-to-Target\
  \ Data Mapping Table, Data Quality Profiling Rules, Telemetry Event Instrumentation\
  \ Plan, Baseline Metrics, and Mathematical KPI Dictionary.\n* **03 Plan (Gate 1B):**\
  \ Work Breakdown Structure (WBS) & Dictionary, Phased Roadmap, Resource Capacity\
  \ Allocation, and RAID Log (Risks, Assumptions, Issues, Dependencies with mitigations).\n\
  * **04 Design (Gate 2A):** Product Requirement Document (PRD) with Gherkin (`Given-When-Then`)\
  \ Acceptance Criteria, System Architecture Document (SAD), ERD / Dimensional Star\
  \ Schema, Semantic Layer & Row-Level Security (RLS) Rules, and Non-Functional Requirements\
  \ (NFRs).\n* **05 Implement (Sprint):** Sprint Backlog Breakdown, OpenAPI 3.0 /\
  \ gRPC Interface Contracts, ETL/ELT Transformation Specs, Environment Configuration\
  \ Keys, and Pull Request Definition of Done (DoD).\n* **06 Analysis (Gate 2B):**\
  \ Source-to-Target Data Reconciliation Report, Root Cause Analysis (5-Whys / Ishikawa),\
  \ Cohort Retention Analysis, and Unit Economics (LTV, CAC, Gross Margin, Sensitivity\
  \ Table).\n* **07 Execute (Gate 3A):** Tier-1/Tier-2 Operations & Escalation Runbook,\
  \ ADKAR Change Management & Enablement Plan, Steering Committee Executive Summary,\
  \ and RACI Matrix.\n* **08 Test (Gate 3B):** Master Test Strategy, Technical QA\
  \ & Data Reconciliation Sign-Off Criteria, Business UAT Sign-Off Checklist, Security/Pen-Test\
  \ Audit Controls, and AI Model Card / Drift Evaluation (if AI/ML is present).\n\
  * **09 Control (Gate 4A):** Statistical Process Control (SPC) Thresholds, SLA/SLO\
  \ Error Budgets, Observability & PagerDuty Alert Escalation Runbook, and RBAC/PII\
  \ Audit Schedule.\n* **10 Deploy (Gate 4B):** Release Notes, Step-by-Step Deployment\
  \ Runbook, Automated Canary/Blue-Green Rollback Triggers, Smoke Test Verification\
  \ Checklist, and Infrastructure-as-Code (IaC) Manifest Summary.\n* **11 Pitch (Gate\
  \ 5):** 12-Slide Pitch Deck Narrative Blueprint, 1-Page Executive Investment Teaser,\
  \ TAM/SAM/SOM Market Sizing, Go-To-Market (GTM) Distribution Playbook, and Live\
  \ Demo Script.\n* **12 Investor (Gate 5):** Tiered Virtual Data Room (VDR) Index\
  \ (Tiers 1–3), Fully Diluted Capitalization Table Structure, Term Sheet / SHA /\
  \ SSA Key Clauses, and KYC/AML & IP Assignment Checklist.\n* **13 Product LC (Quarterly):**\
  \ BCG Growth-Share Portfolio Assessment, Annual Product P&L Structure, Market Expansion/Localization\
  \ Matrix, and 180-Day Feature Sunset & Deprecation Policy.\n* **14 Project LC (Gate\
  \ 6A):** Approved Scope Baseline, Vendor SOW/MSA Governance Register, Earned Value\
  \ Management (EVM) Variance Summary, and Blameless Post-Mortem & Lessons Learned\
  \ Archive.\n* **15 Documents (Continuous):** Standard Operating Procedures (SOPs),\
  \ Enterprise Data Dictionary & Lineage Catalog, API Developer Reference, and RAG\
  \ Vector Ingestion Metadata Schema.\n* **16 Submission (Gate 6B):** RFP Compliance\
  \ Response Matrix, SOC 2 Type II / ISO 27001 / Regulatory Audit Evidence Pack, Stage-Gate\
  \ Sign-Off Dossier, and Formal Legal Transmittal Attestation.\n\n---\n\n### OUTPUT\
  \ FORMAT\nOutput **only** the raw, valid Markdown document enclosed in a single\
  \ `markdown` code block, starting with `---` (YAML frontmatter) and ending with\
  \ a **Stage-Gate Exit & RACI Sign-Off Table**. Do not include conversational filler\
  \ before or after the code block.\n---\n\n# Unified Enterprise SDLC, ADLC & 16-Phase\
  \ Lifecycle Guidance Document\n\n## 1. Purpose & Architectural Scope\n\nThis guidance\
  \ document establishes a single, end-to-end delivery and governance standard for\
  \ Data Engineering, Business Intelligence (BI), ThoughtSpot Centers of Excellence\
  \ (COE), and production SaaS product organizations[cite: 2, 5]. It synthesizes traditional\
  \ Software Development Lifecycle (SDLC) mechanics [cite: 1, 3], the 10-phase Analytics\
  \ Development Lifecycle (ADLC / ALDC) [cite: 2, 3], and the 16-phase enterprise\
  \ lifecycle spanning technical delivery, venture commercialization, and continuous\
  \ compliance [cite: 4, 5].\n\n*   **Terminology Standard (ADLC vs. ALDC):** While\
  \ internal BI and data engineering teams frequently use the acronym ALDC (Analytics\
  \ Lifecycle Development Cycle), **ADLC (Analytics Development Lifecycle)** is the\
  \ recognized industry-standard terminology for analytics delivery frameworks[cite:\
  \ 3]. Both terms map identically within this standard to govern traceability from\
  \ business requirements through ingestion, semantic modeling, testing, deployment,\
  \ and ongoing governance[cite: 2, 3].\n*   **Definition of Production Readiness:**\
  \ A production release is valid only when technical deployment succeeds *and* underlying\
  \ data assets are accurate, traceable, governed, and trusted by business consumers[cite:\
  \ 3].\n\n---\n\n## 2. Cross-Attachment Audit & Breaking-Point Reconciliation\n\n\
  Before executing against this standard, teams must account for structural contradictions\
  \ and visual anomalies across the four baseline artifacts so legacy defects are\
  \ not propagated into production workflows:\n\n| Source Artifact | Structural Contribution\
  \ | Identified Breaking Points & Visual Anomalies | Canonical Resolution Enforced\
  \ in This Guide |\n| :--- | :--- | :--- | :--- |\n| **`SDLC_Roadmap_Infographic.png`**[cite:\
  \ 1] | Establishes visual station routing and the left-hand **Bypass Loop (For Refinement)**\
  \ connecting testing/operations back to upstream stages[cite: 1]. | **1. Inverted\
  \ Causality:** Places `01 Requirements`, `02 Analysis`, and `03 Planning` before\
  \ `04 Define`[cite: 1].<br>**2. Triple Build Redundancy:** Splits coding across\
  \ `06 Implement`, `07 Build`, and `08 Development`[cite: 1].<br>**3. Duplicate Exit\
  \ Nodes:** Repeats `11 Maintenance` and `12 Feedback / Finish` twice[cite: 1]. |\
  \ Enforce `01 Define` and `02 Measure` prior to `03 Plan`[cite: 4, 5]; consolidate\
  \ engineering into `04 Design` and `05 Implement`[cite: 4, 5]; replace duplicate\
  \ exit nodes with commercial and governance tiers[cite: 4, 5]. |\n| **` List ALDC\
  \ Phases.pdf`**[cite: 2, 3] | Provides the 10-phase Data Engineering, BI, and ThoughtSpot\
  \ COE framework, SDLC crosswalk, 4-stage pipeline, and 7 cross-cutting governance\
