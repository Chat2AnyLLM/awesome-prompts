  \ 7. Business UAT**[cite: 2, 3] | Testing & Acceptance[cite: 1, 2] | Test[cite:\
  \ 3] | Master Test Plan, QA Sign-Off, Business UAT Sign-Off, Security Audit[cite:\
  \ 2, 3] |\n| **09. ** Control** | **Tier 1** • Gate 4[cite: 5] | **9. Operations,\
  \ Monitoring & Security**[cite: 2, 3] | Maintenance[cite: 1, 2] | Observe[cite:\
  \ 3] | SPC Control Charts, SLA/SLO Budgets, RBAC/PII Audit, Drift Alerts[cite: 3]\
  \ |\n| **10. Deploy** | **Tier 1** • Gate 4[cite: 5] | **8. Release & Production\
  \ Deployment**[cite: 2, 3] | Deployment / Release[cite: 1, 2] | Deploy[cite: 3]\
  \ | Deployment Runbook, Canary/Rollback Protocol, Smoke Test Logs[cite: 3] |\n|\
  \ **11. Pitch** | **Tier 2** • Gate 5[cite: 5] | *Value Realization & Executive\
  \ Showcase* | — | — | Pitch Deck, Investment Teaser, Commercial GTM Strategy |\n\
  | **12. Investor** | **Tier 2** • Gate 5[cite: 5] | *Fiduciary & Capital Governance*\
  \ | — | — | Virtual Data Room (VDR) Index, Cap Table, SHA/SSA, KYC/AML |\n| **13.\
  \ Product LC** | **Tier 2** • Quarterly[cite: 5] | **10. Continuous Improvement\
  \ & Enhancements**[cite: 2, 3] | Continuous Development[cite: 2] | Discover[cite:\
  \ 3] | BCG Portfolio Strategy, Market Localization, Feature Sunset Policy |\n| **14.\
  \ ** Project LC** | **Tier 2** • Gate 6[cite: 5] | *Lifecycle Governance & Closure*[cite:\
  \ 3] | Project Closure | — | Scope Baseline, Vendor SOW/MSA, Earned Value (EVM),\
  \ Post-Mortem |\n| **15. Document** | **Tier 3** • Continuous[cite: 5] | **Documentation\
  \ & Metadata Governance**[cite: 3] | Documentation | — | BRD/FRD/DRD/TDD, SOPs,\
  \ Metadata & Lineage Catalog, RAG `.md` Files[cite: 3] |\n| **16. Submission** |\
  \ **Tier 3** • Gate 6[cite: 5] | *Regulatory Compliance & Audit Attestation*[cite:\
  \ 3] | Governance Audit | — | RFP Tender Dossier, SOC 2 / ISO 27001 Filing, Gate\
  \ Sign-Off Pack |\n\n---\n\n## 4. Operational Guidance by Tier & Phase\n\n### Tier\
  \ 1: Core Delivery & ADLC Pipeline (`01 Define` → `10 Deploy`)[cite: 5]\n\n####\
  \ Phase 01: Define *(ADLC Phase 1 — Initiation & Discovery)*[cite: 2, 5]\n*   **Objective:**\
  \ Identify core business problems, commercial objectives, executive sponsors, technical\
  \ feasibility, and measurable outcomes before committing build capacity[cite: 2].\n\
  *   **Key Activities:** Conduct discovery workshops; map stakeholder authority;\
  \ establish hard scope boundaries; validate strategic alignment[cite: 2].\n*   **Mandatory\
  \ Documents:** `01_define_charter_business_case.md` (Project Charter, Business Case\
  \ with NPV/ROI assumptions, Voice of Customer Matrix, Stakeholder Power-Interest\
  \ Grid)[cite: 2].\n*   **Stage-Gate Exit Criterion (Gate 0):** Signed Project Charter\
  \ authorizing discovery budget and naming accountable business and technical owners[cite:\
  \ 2, 5].\n\n#### Phase 02: Measure *(ADLC Phase 2 — Requirements & Phase 3 — Data\
  \ Assessment)*[cite: 2, 5]\n*   **Objective:** Elicit functional, technical, data,\
  \ reporting, and non-functional requirements while auditing source systems for data\
  \ availability, quality, lineage, and dependencies[cite: 2].\n*   **Key Activities:**\
  \ Profile source database tables and columns; benchmark current baseline latencies\
  \ or conversion drop-offs; define canonical KPI formulas; instrument telemetry SDKs[cite:\
  \ 2].\n*   **Mandatory Documents:** `02_measure_telemetry_kpi_dictionary.md` (Business\
  \ Requirements Document [BRD], Functional Requirements Document [FRD], Data Requirements\
  \ Document [DRD], Source-to-Target Mapping, KPI Dictionary, Baseline Metrics Report)[cite:\
  \ 2, 3].\n*   **Stage-Gate Exit Criterion (Gate 1A):** Verified Source-to-Target\
  \ mapping and signed-off BRD/FRD/DRD confirming all required source columns exist\
  \ and meet baseline quality thresholds[cite: 2, 3].\n\n#### Phase 03: Plan *(Continuous\
  \ Project Management Track)*[cite: 3, 5]\n*   **Objective:** Decompose validated\
  \ requirements into deterministic work packages, critical-path schedules, resource\
  \ capacity allocations, and risk mitigation plans[cite: 3].\n*   **Key Activities:**\
  \ Build the Work Breakdown Structure (WBS); sequence dependencies across data engineering,\
  \ semantic modeling, and frontend teams; initialize the RAID log[cite: 3].\n*  \
  \ **Mandatory Documents:** `03_plan_wbs_roadmap_raid_log.md` (WBS & Dictionary,\
  \ Product/COE Roadmap, Resource Capacity Plan, Risk Management Matrix / RAID Log)[cite:\
  \ 3].\n*   **Stage-Gate Exit Criterion (Gate 1B):** Approved scope baseline, sprint\
  \ schedule, and resource allocation plan[cite: 3, 5].\n\n#### Phase 04: Design *(ADLC\
  \ Phase 4 — Solution Architecture, Data Modelling & Semantic Design)*[cite: 2, 3,\
  \ 5]\n*   **Objective:** Architect end-to-end cloud infrastructure, relational/dimensional\
  \ schemas, transformation logic, and semantic-layer definitions[cite: 2, 3].\n*\
  \   **Key Activities:** Model star/snowflake fact and dimension tables; define join\
  \ cardinalities, row-level security (RLS) rules, and ThoughtSpot worksheet/semantic\
  \ formulas; draft API contracts and UI wireframes[cite: 2, 3].\n*   **Mandatory\
  \ Documents:** `04_design_prd_system_architecture.md` (Product Requirement Document\
  \ [PRD] with Gherkin acceptance criteria, System Architecture Document [SAD], Entity-Relationship\
  \ Diagrams [ERD], Technical Design Document [TDD], Semantic Layer Spec)[cite: 2,\
  \ 3].\n*   **Stage-Gate Exit Criterion (Gate 2A — Architecture Freeze):** Peer-reviewed\
  \ SAD, ERD, and Semantic Model specification signed off by Principal Architecture\
  \ and Data Governance[cite: 2, 3, 5].\n\n#### Phase 05: Implement *(ADLC Phase 5\
  \ — Development & Configuration)*[cite: 2, 5]\n*   **Objective:** Construct ingestion\
  \ pipelines, ETL/ELT transformations, database tables, semantic layers, KPI formulas,\
  \ interactive Liveboards, and application microservices[cite: 2, 3].\n*   **Key\
  \ Activities:** Execute Agile sprints using version-controlled Git workflows; enforce\
  \ peer Pull Request reviews; build automated unit tests alongside pipeline and API\
  \ code[cite: 3].\n*   **Mandatory Documents:** `05_implement_sprint_api_contract.md`\
  \ (Sprint Backlogs, OpenAPI/Swagger Contracts, Environment Configuration Guides,\
  \ Repository READMEs).\n*   **Stage-Gate Exit Criterion (Sprint Acceptance):** All\
  \ sprint stories pass static linting, unit tests, and peer code reviews in the development\
  \ environment.\n\n#### Phase 06: Analysis *(ADLC Data Quality & Analytical Diagnostics)*[cite:\
  \ 3, 5]\n*   **Objective:** Reconcile transformed datasets against source systems,\
  \ diagnose performance bottlenecks, and validate commercial unit economics[cite:\
  \ 3].\n*   **Key Activities:** Execute row-count, checksum, and aggregate metric\
  \ reconciliations; run 5-Whys Root Cause Analysis (RCA) on pipeline anomalies; evaluate\
  \ cohort retention and LTV/CAC models[cite: 3].\n*   **Mandatory Documents:** `06_analysis_rca_cohort_economics.md`\
  \ (Data Reconciliation Report, Root Cause Analysis Dossier, Cohort & Retention Analysis,\
  \ Unit Economics & Sensitivity Model)[cite: 3].\n*   **Stage-Gate Exit Criterion\
  \ (Gate 2B — Viability Sign-Off):** Zero unexplained data variance between source\
  \ systems and target semantic models, plus validated commercial unit economics[cite:\
  \ 3, 5].\n\n#### Phase 07: Execute *(ADLC Phase 10 — Operational Rollout & Change\
  \ Enablement)*[cite: 2, 3, 5]\n*   **Objective:** Prepare operational support teams,\
  \ business users, and executive stakeholders for organizational adoption before\
  \ production cutover[cite: 3].\n*   **Key Activities:** Deliver enablement training\
  \ for BI consumers and tier-1/tier-2 support engineers; publish change communications;\
  \ finalize escalation trees[cite: 3].\n*   **Mandatory Documents:** `07_execute_operations_change_mgmt.md`\
  \ (Operations & Support Runbook, ADKAR Change Management Plan, Steering Committee\
  \ Deck, RACI Execution Matrix)[cite: 3].\n*   **Stage-Gate Exit Criterion (Gate\
  \ 3A — Operational Readiness):** Support runbooks published and user enablement\
  \ sessions completed.\n\n#### Phase 08: Test *(ADLC Phase 6 — Technical QA & Phase\
  \ 7 — Business UAT)*[cite: 2, 3, 5]\n*   **Objective:** Verify technical integrity\
  \ (schema, data types, relationships, performance) and validate business KPI calculations,\
  \ report outputs, and access permissions with end users[cite: 2, 3].\n*   **Key\
  \ Activities:** Run automated integration, regression, load, and security penetration\
  \ tests; conduct structured Business UAT sessions validating ThoughtSpot Liveboards\
  \ and SaaS workflows against BRD/PRD acceptance criteria[cite: 2, 3].\n*   **Mandatory\
  \ Documents:** `08_test_strategy_uat_security_audit.md` (Master Test Plan, Technical\
  \ QA Sign-Off, Business UAT Sign-Off, Security/Pen-Test Audit, AI Model Card)[cite:\
  \ 2, 3].\n*   **Stage-Gate Exit Criterion (Gate 3B — Quality & Security Sign-Off):**\
  \ Formal written QA Sign-Off and Business UAT Sign-Off with zero unresolved Severity-1\
  \ or Severity-2 defects[cite: 2, 3, 5].\n\n#### Phase 09: Control *(ADLC Phase 9\
  \ — Operations, Monitoring & Security Governance)*[cite: 2, 3, 5]\n*   **Objective:**\
  \ Enforce continuous pipeline reliability, refresh schedules, data quality thresholds,\
  \ role-based access control (RBAC), and drift alerting in production[cite: 2, 3].\n\
  *   **Key Activities:** Configure automated SLA/SLO alerts; enforce PII masking\
  \ and RBAC policies; monitor data freshness, query latency, and model drift via\
  \ Statistical Process Control (SPC) charts[cite: 3].\n*   **Mandatory Documents:**\
  \ `09_control_spc_slo_drift_runbook.md` (Statistical Process Control Plan, SLA/SLO\
  \ Error Budget Framework, Observability & PagerDuty Escalation Runbook, RBAC/PII\
  \ Compliance Log)[cite: 3].\n*   **Stage-Gate Exit Criterion (Gate 4A — Stability\
  \ Check):** Automated monitoring dashboards and synthetic alerts verified active\
  \ in staging/pre-prod[cite: 3].\n\n#### Phase 10: Deploy *(ADLC Phase 8 — Release\
  \ & Production Deployment)*[cite: 2, 5]\n*   **Objective:** Obtain final release\
  \ approvals, promote validated assets from QA to production, and execute post-deployment\
  \ smoke tests[cite: 2, 3].\n*   **Key Activities:** Execute CI/CD canary or blue-green\
  \ deployments; validate database migrations; run automated production smoke tests;\
  \ verify rollback readiness[cite: 2, 3].\n*   **Mandatory Documents:** `10_deploy_release_rollback_iac.md`\
  \ (Release Notes, Deployment Runbook, Automated Rollback Protocol, Infrastructure-as-Code\
  \ [Terraform/Helm] Manifests)[cite: 3].\n*   **Stage-Gate Exit Criterion (Gate 4B\
  \ — Production Release Sign-Off):** Verified production smoke tests passing 100%,\
  \ and release approval logged[cite: 2, 3, 5].\n\n---\n\n### Tier 2: Commercial,\
  \ Venture & Portfolio Lifecycle (`11 Pitch` → `14 Project LC`)[cite: 5]\n\n####\
  \ Phase 11: Pitch *(Commercialization & Value Realization)*[cite: 5]\n*   **Objective:**\
  \ Package verified production traction, unit economics, and technical differentiation\
  \ into persuasive commercial and investor narratives.\n*   **Key Activities:** Synthesize\
  \ TAM/SAM/SOM sizing, live product demos, and customer ROI case studies; run red-team\
  \ Q&A drills.\n*   **Mandatory Documents:** `11_pitch_deck_gtm_commercial.md` (12–15\
  \ Slide Investor Pitch Deck, 1-Page Executive Teaser, Commercial Go-To-Market [GTM]\
  \ Playbook, Demo Walkthrough Script).\n\n#### Phase 12: Investor *(Investor Onboarding\
  \ & Fiduciary Diligence)*[cite: 5]\n*   **Objective:** Execute institutional due\
  \ diligence, capitalization table modeling, definitive legal agreements, and capital\
  \ disbursement.\n*   **Key Activities:** Structure tiered Virtual Data Room (VDR)\
  \ access; reconcile diluted equity and ESOP pools; complete KYC/AML and IP assignment\
  \ audits.\n*   **Mandatory Documents:** `12_investor_vdr_cap_table_term_sheet.md`\
  \ (Tiered VDR Index, Fully Diluted Cap Table, Term Sheet, Shareholders' Agreement\
  \ [SHA], Share Subscription Agreement [SSA]).\n*   **Stage-Gate Exit Criterion (Gate\
  \ 5):** Executed definitive agreements and cleared escrow capital transfer[cite:\
  \ 5].\n\n#### Phase 13: Product Life Cycle *(ADLC Phase 10 — Continuous Improvement\
  \ & Portfolio Stewardship)*[cite: 2, 5]\n*   **Objective:** Govern product and analytics\
  \ portfolio evolution across Introduction, Growth, Maturity, and Decline stages[cite:\
  \ 2, 3].\n*   **Key Activities:** Prioritize enhancement backlogs and impact assessments;\
  \ allocate R&D capital via BCG growth-share reviews; manage orderly deprecation\
  \ and migration of legacy reports or APIs[cite: 2, 3].\n*   **Mandatory Documents:**\
  \ `13_plc_portfolio_sunset_strategy.md` (Product Portfolio Strategy, Annual Product\
  \ P&L, Market Localization Dossier, Feature Sunset & Deprecation Policy)[cite: 2,\
  \ 3].\n\n#### Phase 14: Project Life Cycle *(Governance, Vendor Management & Closure)*[cite:\
  \ 3, 5]\n*   **Objective:** Maintain contractual governance over bounded initiatives\
  \ from scope baseline through vendor management and formal post-mortem closure[cite:\
  \ 3].\n*   **Key Activities:** Track Earned Value Management (EVM) cost/schedule\
  \ variances; audit vendor Statements of Work (SOW); conduct blameless post-mortems\
  \ and archive lessons learned[cite: 3].\n*   **Mandatory Documents:** `14_project_lifecycle_sow_closure.md`\
  \ (Project Scope Baseline, Vendor SOW/MSA Register, RAID Escalation Archive, Project\
  \ Closure & Lessons Learned Report)[cite: 3].\n*   **Stage-Gate Exit Criterion (Gate\
  \ 6A):** Formal stakeholder project acceptance and financial closeout[cite: 5].\n\
  \n---\n\n### Tier 3: Cross-Cutting Governance & Compliance Foundation (`15 Document`\
  \ & `16 Submission`)[cite: 3, 5]\n\nRather than executing solely at the end of a\
  \ project, Tier 3 operates continuously beneath Tiers 1 and 2 to enforce institutional\
  \ memory and regulatory compliance[cite: 3, 5]:\n\n#### Phase 15: Document *(Continuous\
  \ Knowledge & Metadata Governance)*[cite: 3, 5]\n*   **Objective:** Maintain living,\
  \ version-controlled technical documentation, data lineage catalogs, Standard Operating\
  \ Procedures (SOPs), and RAG-ready Markdown knowledge bases[cite: 3].\n*   **Key\
  \ Activities:** Enforce docs-as-code in Git alongside every Pull Request; update\
  \ data dictionaries, lineage graphs, and ThoughtSpot metric definitions whenever\
  \ schemas evolve; index `.md` files with YAML frontmatter into enterprise vector\
  \ stores[cite: 3].\n*   **Mandatory Documents:** `15_document_sop_api_data_catalog.md`\
  \ (BRD/FRD/DRD/TDD Templates, Operational SOPs, Enterprise Data Dictionary & Lineage\
  \ Catalog, Developer API Hub)[cite: 3].\n\n#### Phase 16: Submission *(Institutional\
  \ Audits, Regulatory Filings & RFP Tenders)*[cite: 3, 5]\n*   **Objective:** Assemble,\
  \ verify, and formally transmit compliance attestations, regulatory filings, enterprise\
  \ RFP responses, and Stage-Gate audit packages[cite: 3, 5].\n*   **Key Activities:**\
  \ Compile SOC 2 Type II, ISO 27001, GDPR/DPDP, or financial regulatory evidence;\
  \ execute legal compliance sign-offs; submit encrypted RFP tender dossiers[cite:\
  \ 3].\n*   **Mandatory Documents:** `16_submission_rfp_compliance_gate.md` (RFP\
  \ Response Dossier, SOC 2 / ISO Compliance Pack, Stage-Gate Governance Audit Dossier,\
  \ Formal Legal Transmittal Letter).\n*   **Stage-Gate Exit Criterion (Gate 6B):**\
  \ Executed executive and legal attestation sign-off[cite: 5].\n\n---\n\n## 5. Cross-Cutting\
  \ Governance Matrix (7 Core Pillars)\n\nPer the BI & Data Engineering COE governance\
  \ standard, these seven disciplines execute continuously across all 16 phases[cite:\
  \ 3]:\n\n| Governance Pillar[cite: 3] | Operational Mandate[cite: 3] | Primary Enforcing\
  \ Phases | Core Control Artifacts[cite: 3] |\n| :--- | :--- | :--- | :--- |\n| **1.\
  \ Documentation**[cite: 3] | Maintain living traceability across business, functional,\
  \ data, and technical specs[cite: 2, 3]. | All Phases (`01–16`), anchored in `15\
  \ Document`[cite: 3, 5] | BRD, FRD, DRD, TDD, Source-to-Target Mapping, Test Cases[cite:\
  \ 2, 3] |\n| **2. Data Governance**[cite: 3] | Enforce clear domain ownership, metadata\
  \ tagging, data lineage, and sensitivity classification[cite: 3]. | `02 Measure`,\
  \ `04 Design`, `09 Control`, `15 Document`[cite: 2, 3, 5] | Metadata Catalog, Lineage\
  \ Graph, Data Ownership Matrix[cite: 3] |\n| **3. Data Quality**[cite: 3] | Guarantee\
  \ completeness, accuracy, consistency, and source-to-target reconciliation[cite:\
  \ 3]. | `02 Measure`, `06 Analysis`, `08 Test`, `09 Control`[cite: 2, 3, 5] | Automated\
  \ dbt/SQL Reconciliation Tests, Anomaly Logs[cite: 3] |\n| **4. Change Management**[cite:\
  \ 3] | Control schema and code evolution via versioning, impact analysis, and formal\
  \ approvals[cite: 3]. | `03 Plan`, `05 Implement`, `07 Execute`, `13 Product LC`[cite:\
  \ 2, 3, 5] | Change Request (CR) Log, Semantic Impact Assessment[cite: 2, 3] |\n\
  | **5. Security**[cite: 3] | Protect sensitive data via RBAC, PII masking/encryption,\
  \ access reviews, and audit trails[cite: 3]. | `04 Design`, `08 Test`, `09 Control`,\
  \ `12 Investor`, `16 Submission`[cite: 3, 5] | RBAC Policy Matrix, PII Classification\
  \ Register, Pen-Test Audit[cite: 3] |\n| **6. Project Management**[cite: 3] | Synchronize\
  \ delivery velocity, dependencies, risks, and executive status reporting[cite: 3].\
  \ | `01 Define`, `03 Plan`, `07 Execute`, `14 Project LC`[cite: 3, 5] | Sprint Boards,\
  \ RAID Log, RACI Matrix, Steering Decks[cite: 3] |\n| **7. Configuration Mgmt**[cite:\
  \ 3] | Isolate Dev/QA/Prod environments, track release history, and guarantee instant\
  \ rollback[cite: 3]. | `05 Implement`, `09 Control`, `10 Deploy`[cite: 3, 5] | Git\
  \ Branching Policy, IaC State Files, Rollback Runbooks[cite: 3] |\n\n---\n\n## 6.\
  \ Alternative Paradigms & Failure-Mode Playbook\n\n### Paradigm Selection Matrix\n\
  Depending on organizational maturity and regulatory exposure, teams should calibrate\
  \ gate strictness using one of three operating modes:\n\n1.  **Strict Stage-Gate\
  \ Governance *(Recommended for Regulated FinTech, Enterprise BI COE & Institutional\
  \ Audits)*:** Enforces hard physical/digital sign-offs at Gates `0–6`[cite: 5].\
  \ Prevents unvalidated data models from reaching ThoughtSpot Liveboards or external\
  \ clients[cite: 3].\n2.  **Dual-Track Agile & DataOps *(Recommended for High-Velocity\
  \ SaaS & AI Product Teams)*:** Runs Discovery/Design (`01–04`) one sprint ahead\
  \ of Build/Validate (`05–08`), automating `08 Test`, `09 Control`, and `10 Deploy`\
  \ via CI/CD pipelines (e.g., dbt + GitHub Actions)[cite: 3, 5].\n3.  **Lean Venture\
  \ Validation Loop *(Recommended for 0-to-1 Pre-Seed/Seed Products)*:** Compresses\
  \ `01 Define` → `04 Design` → `05 Implement` → `10 Deploy` → `11 Pitch` into 2-week\
  \ validation cycles while deferring heavy `14 Project LC` and `16 Submission` overhead\
  \ until institutional diligence (`12 Investor`) begins[cite: 5].\n\n### Critical\
  \ Failure Modes & Red-Team Mitigations\n\n*   **Failure Mode 1 — Skipping Phase\
  \ `02 Measure` (Data Assessment) to Accelerate `05 Implement`:**\n    *   *Symptom:*\
  \ Engineers build ETL pipelines and semantic models only to discover missing historical\
  \ columns, broken foreign keys, or conflicting business KPI definitions during UAT[cite:\
  \ 2, 3].\n    *   *Mitigation:* Enforce **Gate 1A**—no transformation code or ThoughtSpot\
  \ worksheet creation is permitted until the Source-to-Target mapping and KPI Dictionary\
  \ are signed off[cite: 2, 3].\n*   **Failure Mode 2 — Treating Phase `15 Document`\
  \ as a Post-Deployment Chore:**\n    *   *Symptom:* Documentation decays immediately\
  \ after launch, breaking downstream RAG retrieval accuracy and creating single-person\
  \ operational bottlenecks[cite: 3].\n    *   *Mitigation:* Embed `.md` documentation\
  \ updates directly into Pull Request Definition-of-Done (DoD) checklists and automate\
  \ vector-store re-indexing on merge to `main`.\n*   **Failure Mode 3 — Broken Continuous\
  \ Refinement Loop (`10 Deploy` → `01 Define`):**\n    *   *Symptom:* Production\
  \ incidents, user feedback, and metric drift are patched ad-hoc in production without\
  \ updating upstream BRDs, DRDs, or test suites[cite: 1, 3].\n    *   *Mitigation:*\
  \ Route every production incident and enhancement request through formal change\
  \ impact analysis (`06 Analysis` / `13 Product LC`) before re-entering the delivery\
  \ pipeline[cite: 2, 3].\n\n### OUTPUT FORMAT\nOutput **only** the raw, valid Markdown\
  \ document enclosed in a single `markdown` code block, starting with `---` (YAML\
  \ frontmatter) and ending with a **Stage-Gate Exit & RACI Sign-Off Table**. Do not\
  \ include conversational filler before or after the code block."
