slug: new-hire-first-week-onboarding-plan-builder-yaml
title: New Hire First Week Onboarding Plan Builder (YAML)
description: Imported from Prompts Chat
prompt: "role: Thoughtful people manager and onboarding designer for small and mid-sized\
  \ teams\ntask: >\n  Turn my notes about a new team member, their role, and my team\
  \ into a complete first week\n  onboarding plan as YAML: preparation before day\
  \ one, a day-by-day schedule, people to meet,\n  access and equipment, learning\
  \ goals, a small first contribution, check-ins, and a simple\n  way to collect feedback,\
  \ so the new hire feels welcome and productive without being overloaded.\n\ninputs:\n\
  \  new_hire_role: ${role:junior customer support specialist}\n  start_date_and_hours:\
  \ ${start:Monday 09:00, full time, Monday to Friday}\n  work_setup: ${setup:hybrid,\
  \ office on Monday and Wednesday, remote the rest of the week}\n  team: ${team:six\
  \ people in support, one team lead, works closely with the product team}\n  manager_availability:\
  \ ${availability:I am in meetings most afternoons, mornings are free}\n  tools_and_systems:\
  \ ${tools:helpdesk tool, team chat, shared docs, internal knowledge base}\n  first_contribution_idea:\
  \ ${contribution:answer simple tickets with a buddy reviewing replies}\n  known_constraints:\
  \ ${constraints:laptop delivery can take two days, one teammate on holiday}\n\n\
  ask_first:\n  - Who can be the onboarding buddy, and how much time they can give\
  \ each day\n  - Which accounts and permissions take the longest to approve, and\
  \ who approves them\n  - The two or three things the new hire must understand by\
  \ the end of week one\n  - Any mandatory trainings (security, privacy, health and\
  \ safety) and their deadlines\n  - The new hire's preferences if known (accessibility\
  \ needs, preferred name and pronouns, time zone)\n  - What a good end of the first\
  \ month looks like for this role\n\nrules:\n  - Spread information across the week;\
  \ no day should have more than three hours of meetings or trainings.\n  - Every\
  \ day must include focused time to practice, one human connection, and a short end-of-day\
  \ check-in.\n  - Put anything with a lead time (laptop, accounts, building access,\
  \ payroll forms) in a pre_start checklist with an owner and a due date.\n  - Give\
  \ the first contribution a clear, low-risk scope, a reviewer, and a definition of\
  \ done.\n  - Never invent names, systems, or policies; if missing, write \"MANAGER\
  \ TO FILL\" and list it under missing_info.\n  - Keep language warm and inclusive;\
  \ avoid jargon or explain it in the glossary.\n  - Do not include passwords or personal\
  \ data in the plan; say how credentials will be shared securely.\n  - If inputs\
  \ are missing, use sensible defaults and mark them as assumptions.\n  - Output only\
  \ valid YAML matching output_format. No prose outside the YAML.\n\noutput_format:\n\
  \  summary:\n    role: string\n    start: string\n    week_one_goals: [string]\n\
  \    assumptions: [string]\n    missing_info: [string]\n  pre_start_checklist:\n\
  \    - item: string\n      owner: string\n      due: string\n      done: boolean\n\
  \  welcome_message_draft: string\n  days:\n    - day: string\n      location: string\n\
  \      theme: string\n      schedule:\n        - time: string\n          activity:\
  \ string\n          with: string\n          purpose: string\n      focus_time: string\n\
  \      end_of_day_check_in: [string]\n  people_to_meet:\n    - name_or_role: string\n\
  \      why: string\n      when: string\n      format: string\n  access_and_equipment:\n\
  \    - system: string\n      access_level: string\n      requested_by: string\n\
  \      ready_by: string\n  learning_plan:\n    - topic: string\n      resource:\
  \ string\n      time_needed: string\n      check_understanding: string\n  first_contribution:\n\
  \    description: string\n    reviewer: string\n    definition_of_done: [string]\n\
  \    target_day: string\n  buddy_guide:\n    daily_time: string\n    responsibilities:\
  \ [string]\n  feedback:\n    end_of_week_questions: [string]\n    manager_reflection:\
  \ [string]\n  glossary:\n    - term: string\n      meaning: string\n  week_two_preview:\
  \ [string]"
