prompt: "---\nname: jet-lag-sleep-shift-planner\ndescription: Builds a day-by-day\
  \ jet lag plan from flight times and your usual sleep hours. Computes the DST-aware\
  \ time difference, chooses advance or delay (including the long way round for big\
  \ eastward trips), estimates days to adjust, and lists pre-trip bedtime shifts,\
  \ in-flight sleep, and daily sleep windows, light to seek and avoid, caffeine cut-off\
  \ and nap limits. Flags short trips. Includes a stdlib Python planner with --self-test.\n\
  ---\n\n# Jet Lag Sleep Shift Planner\n\nYou help travelers arrive rested. From real\
  \ flight times and their normal sleep schedule, you build a practical day-by-day\
  \ plan: when to sleep, when to get bright light and when to avoid it, when to stop\
  \ coffee, whether to sleep on the plane, and whether shifting before the trip is\
  \ worth it. You explain the why in plain words and keep the plan realistic for the\
  \ person's calendar.\n\n## Files in this skill\n\n- `scripts/jetlag_plan.py` - computes\
  \ the shift, strategy, pre-trip days, in-flight sleep and a daily table of sleep,\
  \ light, caffeine and nap times (Python 3 standard library only; IANA zones via\
  \ zoneinfo or fixed offsets like UTC+3)\n- `references/body-clock-basics.md` - body\
  \ clock, adjustment rates, the light rule around CBTmin, meals, caffeine, naps,\
  \ melatonin caution, when to see a doctor\n- `references/trip-strategies.md` - strategy\
  \ by trip length, pre-trip shifting, on the plane, arrival day, the return trip,\
  \ a checklist\n- `templates/jet-lag-plan.md` - a one-page plan to fill in or print\n\
  - `examples/istanbul-to-los-angeles.json` - an 11-hour westward conference trip\
  \ in November, with a return trip\n\n## Workflow\n\n### 1. Gather the trip\nAsk\
  \ for origin and destination cities (or time zones), departure local time and date,\
  \ arrival local time and date, the usual bedtime and wake time, how many days they\
  \ can shift before the trip (0-3), how long they stay, and any important events\
  \ (talks, meetings, a wedding). Also ask if they have health conditions or time-critical\
  \ medication; if yes, add a reminder to plan it with a doctor or pharmacist.\n\n\
  ### 2. Run the planner\n```\npython3 scripts/jetlag_plan.py examples/istanbul-to-los-angeles.json\n\
  python3 scripts/jetlag_plan.py --from Europe/Istanbul --to Asia/Tokyo --depart 2026-11-10T01:30\
  \ --arrive 2026-11-10T19:05 --bedtime 23:00 --wake 07:00 --pre-days 3 --stay 10\n\
  python3 scripts/jetlag_plan.py trip.json --json\npython3 scripts/jetlag_plan.py\
  \ --self-test\n```\nIf the tz database is missing (some Windows Pythons), use offsets\
  \ like `UTC+3` and `-8`, or `pip install tzdata`. Exit code 2 means bad input.\n\
  \n### 3. Shape the plan\nUse `references/trip-strategies.md`: for SHORT_TRIP, recommend\
  \ staying on home time; for SMALL_SHIFT, no special plan. Move important events\
  \ into the body's good hours or suggest arriving earlier. Explain the light windows\
  \ with `references/body-clock-basics.md` and give practical ways to follow them\
  \ (morning walk, window seat at breakfast, sunglasses on the commute, dim lights\
  \ in the hotel).\n\n### 4. Deliver\nFill `templates/jet-lag-plan.md` with the table\
  \ and the 3-5 most important actions. Offer to add the sleep and light windows as\
  \ calendar reminders.\n\n## Example result\nFor `examples/istanbul-to-los-angeles.json`\
  \ (Istanbul -> Los Angeles on 2026-11-03, after US DST ends): -11 h, delay at about\
  \ 1.5 h/day; 2 pre-trip days with bedtime 00:30 then 01:30; sleep on the plane during\
  \ LA night 02:40-07:00; about 6 days to adjust after arrival, starting with sleep\
  \ 21:30-05:30 and bright light 16:30-19:30 on day 0, back to 23:30-07:30 on day\
  \ 6; the return trip (+11 h) is planned the long way round as a 13 h delay, about\
  \ 9 days.\n\n## Rules\n\n- This is general wellness guidance, not medical advice;\
  \ do not give melatonin or sleep medication doses.\n- Respect the person's constraints\
  \ (kids, work hours); a partial plan they follow beats a perfect one they skip.\n\
  - Never suggest unsafe sleep deprivation or driving while very sleepy; recommend\
  \ a nap or a taxi instead.\n- Use local times in every table and say which clock\
  \ (home or destination) each section uses.\n\x1FFILE:references/body-clock-basics.md\x1E\
  \n# Body Clock Basics for Travelers\n\n## Why jet lag happens\nYour body clock (circadian\
  \ rhythm) runs on home time and shifts only gradually. After crossing time zones,\
  \ sleepiness, hunger, alertness and digestion stay on home time for days. Typical\
  \ symptoms: trouble falling asleep or waking at 3 a.m., daytime sleepiness, poor\
  \ focus, upset stomach.\n\n## How fast the clock moves\n| Direction | Clock change\
  \ | Typical rate | Feels like |\n|---|---|---|---|\n| East (Istanbul -> Tokyo) |\
  \ advance (earlier) | about 1 h per day | harder; trouble falling asleep at night\
  \ |\n| West (Istanbul -> Los Angeles) | delay (later) | about 1.5 h per day | easier;\
  \ sleepy early evening, awake at 4 a.m. |\nThese are averages; age, sleep debt,\
  \ alcohol and light exposure change them.\n\nFor shifts of about 10-12 hours east,\
  \ the clock often adjusts \"the long way round\" by delaying instead (for example\
  \ +11 h east becomes -13 h of delay at 1.5 h/day = 9 days instead of 11). The planner\
  \ picks whichever takes fewer days.\n\n## The light rule\nThe strongest signal for\
  \ the body clock is bright light. Its effect depends on timing relative to the **core\
  \ body temperature minimum (CBTmin)**, which falls about 2-3 hours before your usual\
  \ wake time (for a 07:30 riser, around 04:30 body time).\n- Light in the ~3 hours\
  \ **after** CBTmin moves the clock **earlier** (advance; needed when flying east).\n\
  - Light in the ~3 hours **before** CBTmin moves the clock **later** (delay; needed\
  \ when flying west).\n- Light at the wrong time pushes the clock the wrong way,\
  \ which is why the plan also lists times to avoid bright light (sunglasses outdoors,\
  \ dim indoor lights, screen night mode).\nBecause CBTmin moves each day, the windows\
  \ move too. When a window falls during sleep, the planner moves it to the nearest\
  \ waking time.\n\n## Other signals\n- **Sleep timing:** keep the plan's sleep window,\
  \ even if you cannot sleep at first; rest in the dark.\n- **Meals:** eat on local\
  \ time from the first day; a big breakfast in daylight helps when advancing.\n-\
  \ **Exercise:** morning exercise helps advance, early-evening exercise helps delay;\
  \ avoid hard workouts within 2 hours of bed.\n- **Caffeine:** helps alertness but\
  \ stays in the body for 5-6 hours (half-life); stop about 8 hours before bed.\n\
  - **Naps:** up to 20 minutes, before the plan's \"naps end by\" time. Long naps\
  \ anchor you to home time.\n- **Alcohol:** makes sleep worse and dehydration worse;\
  \ skip it on the flight.\n- **Melatonin:** often used for eastward trips, but timing\
  \ and dose matter and it is a medicine in many countries. Ask a doctor or pharmacist;\
  \ the planner gives no dosing.\n\n## When to see a doctor first\nPregnancy, epilepsy,\
  \ bipolar disorder (light and sleep changes can trigger episodes), diabetes with\
  \ insulin (meal and dose timing across zones), heart conditions, sleep apnea, or\
  \ regular medication taken at fixed times (contraceptive pills, anticoagulants,\
  \ epilepsy drugs). Plan the medication schedule with a professional.\n\x1FFILE:references/trip-strategies.md\x1E\
  \n# Trip Strategies\n\n## Pick the strategy by trip length and shift\n| Trip | Shift\
  \ | Strategy |\n|---|---|---|\n| 1-2 days | any | Stay on home time. Book meetings\
  \ inside your home daytime, keep home sleep hours, use caffeine and short naps.\
  \ |\n| 3-5 days | up to 3 h | Switch to local time on arrival; no pre-trip shift\
  \ needed. |\n| 3-5 days | 4+ h | Partial shift: 1-2 pre-trip days and the light\
  \ plan for the first days; accept some lag. |\n| 6+ days | 4+ h | Full plan: 2-3\
  \ pre-trip days, light plan until adjusted. |\n| Important event on day 1-2 | 6+\
  \ h | Arrive earlier if possible (one day per 1-1.5 h of shift is ideal), or schedule\
  \ the event in the body's best hours. |\n\n## Pre-trip shifting\nMove bedtime and\
  \ wake time 1 hour per day toward the destination for 1-3 days (earlier for east,\
  \ later for west), with light at the planner's \"seek\" times. Even 2 hours of pre-shift\
  \ removes 1-2 days of jet lag. Stop if it hurts work or family routines; partial\
  \ is fine.\n\n## On the plane\n- Set your watch and phone to destination time when\
  \ you board.\n- If the flight crosses destination night, sleep then: eye mask, ear\
  \ plugs or noise-cancelling headphones, neck pillow, no alcohol. Otherwise stay\
  \ awake with light and short naps only.\n- Drink water regularly; walk and stretch\
  \ every 1-2 hours.\n- Eat at destination meal times when practical.\n\n## Arrival\
  \ day\n- Westward evening arrival: go outside in daylight if any is left, stay up\
  \ until the planned bedtime (a 20-minute nap before the cut-off is fine).\n- Eastward\
  \ morning arrival: follow the seek/avoid light windows; if you must work, put bright\
  \ tasks in the seek window.\n\n## Coming home\nThe return trip is a new shift in\
  \ the opposite direction. Use the planner again with the return flight; plan 1-2\
  \ easy days after landing if you can.\n\n## Business traveler checklist\n- [ ] Planner\
  \ run with real flight times\n- [ ] Calendar: no critical meetings in the body's\
  \ night\n- [ ] Hotel: blackout curtains or eye mask; ask for a quiet room\n- [ ]\
  \ Light: sunglasses for avoid windows, a walk or a light box for seek windows\n\
  - [ ] Medication timing checked with a pharmacist\n\x1FFILE:templates/jet-lag-plan.md\x1E\
  \n# Jet Lag Plan - <traveler> - <origin> to <destination>\n\n**Flight:** <depart\
  \ local> -> <arrive local> (<hours> h)  **Time difference:** <+/- h>  **Strategy:**\
  \ <advance / delay / stay on home time>\n**Usual sleep:** <bedtime>-<wake>  **Pre-trip\
  \ shift:** <h>  **Expected days to adjust:** <n>\n\n## Before the trip\n| Date |\
  \ Sleep | Bright light | Avoid light | Notes |\n|---|---|---|---|---|\n| | | | |\
  \ |\n\n## Flight\n- Sleep on board: <times or \"stay awake\">\n- Meals: <destination\
  \ times>\n- Watch set to destination time: [ ]\n\n## At the destination\n| Date\
  \ | Sleep | Bright light | Avoid light | Caffeine until | Naps end by | Key events\
  \ |\n|---|---|---|---|---|---|---|\n| | | | | | | |\n\n## Packing\n- [ ] Eye mask\
  \ and ear plugs  - [ ] Sunglasses  - [ ] Water bottle  - [ ] Medication schedule\
  \ (checked with a professional)\n\n## Return\n- Shift: <h>, about <n> days to readjust;\
  \ easy days planned: <dates>\n\x1FFILE:examples/istanbul-to-los-angeles.json\x1E\
  \n{\n  \"traveler\": \"conference trip, usual sleep 23:30-07:30\",\n  \"from_tz\"\
  : \"Europe/Istanbul\",\n  \"to_tz\": \"America/Los_Angeles\",\n  \"depart\": \"\
  2026-11-03T13:40\",\n  \"arrive\": \"2026-11-03T17:25\",\n  \"bedtime\": \"23:30\"\
  ,\n  \"wake\": \"07:30\",\n  \"pre_trip_days\": 2,\n  \"stay_days\": 8,\n  \"return_trip\"\
  : true\n}\n\x1FFILE:scripts/jetlag_plan.py\x1E\n#!/usr/bin/env python3\n\"\"\"Jet\
  \ lag sleep shift planner (Python 3 standard library only).\n\nInput: a trip JSON\
  \ file (or the same fields as command-line flags):\n  {\"from_tz\": \"Europe/Istanbul\"\
  , \"to_tz\": \"America/Los_Angeles\",\n   \"depart\": \"2026-11-03T13:40\", \"arrive\"\
  : \"2026-11-03T17:25\",\n   \"bedtime\": \"23:30\", \"wake\": \"07:30\", \"pre_trip_days\"\
  : 2, \"stay_days\": 8}\nTime zones: IANA names (zoneinfo, DST-aware; needs the system\
  \ tz database or the tzdata\npackage) or fixed offsets like \"UTC+3\", \"+05:30\"\
  , \"-8\".  depart is local time at the origin,\narrive is local time at the destination.\n\
  \nModel (rules of thumb used by sleep clinics, not a medical device):\n  - shift\
  \ = destination offset - origin offset, normalized to -12..+12 h (+ = east).\n \
  \ - the body clock moves about 1 h/day when advancing (eastward) and 1.5 h/day when\n\
  \    delaying (westward); for big eastward shifts the planner picks the direction\
  \ that\n    takes fewer days (often delaying \"the long way round\").\n  - optional\
  \ pre-trip shift: 1 h/day for pre_trip_days, toward the destination.\n  - core body\
  \ temperature minimum (CBTmin) ~3 h before usual wake time. Light in the 3 h\n \
  \   after CBTmin advances the clock, light in the 3 h before it delays the clock.\n\
  \  - planned sleep is a compromise: target local bedtime moved toward body time\
  \ by\n    min(2 h, half the remaining gap). Caffeine stops 8 h and naps (max 20\
  \ min) end 7 h\n    before planned bedtime.\nUsage:\n  python3 jetlag_plan.py trip.json\n\
  \  python3 jetlag_plan.py --from Europe/Istanbul --to Asia/Tokyo --depart 2026-11-10T01:30\
  \ \\\n      --arrive 2026-11-10T19:05 --bedtime 23:00 --wake 07:00 --pre-days 3\
  \ --stay 10\n  python3 jetlag_plan.py trip.json --json\n  python3 jetlag_plan.py\
  \ --self-test\nExit code: 0 OK, 2 bad input.\n\"\"\"\nimport argparse\nimport datetime\
  \ as dt\nimport json\nimport math\nimport re\nimport sys\n\nADVANCE_RATE = 1.0\n\
  DELAY_RATE = 1.5\n\n\nclass TripError(ValueError):\n    pass\n\n\ndef parse_tz(name):\n\
  \    s = str(name).strip()\n    m = re.fullmatch(r\"(?:UTC|GMT)?\\s*([+-])(\\d{1,2})(?::?(\\\
  d{2}))?\", s, re.I)\n    if m:\n        sign = 1 if m.group(1) == \"+\" else -1\n\
  \        mins = int(m.group(2)) * 60 + int(m.group(3) or 0)\n        if mins > 14\
  \ * 60:\n            raise TripError(f\"offset out of range: {s!r}\")\n        return\
  \ dt.timezone(dt.timedelta(minutes=sign * mins), s)\n    if s.upper() in (\"UTC\"\
  , \"GMT\", \"Z\"):\n        return dt.timezone.utc\n    try:\n        from zoneinfo\
  \ import ZoneInfo\n        return ZoneInfo(s)\n    except Exception:\n        raise\
  \ TripError(f\"unknown time zone {s!r}; use an IANA name like Europe/Istanbul or\
  \ an offset like UTC+3\")\n\n\ndef parse_hm(s, field):\n    m = re.fullmatch(r\"\
  (\\d{1,2}):(\\d{2})\", str(s).strip())\n    if not m or int(m.group(1)) > 23 or\
  \ int(m.group(2)) > 59:\n        raise TripError(f\"{field} must be HH:MM, got {s!r}\"\
  )\n    return int(m.group(1)) * 60 + int(m.group(2))\n\n\ndef parse_local(s, tz,\
  \ field):\n    try:\n        t = dt.datetime.fromisoformat(str(s).strip())\n   \
  \ except ValueError:\n        raise TripError(f\"{field} must be YYYY-MM-DDTHH:MM,\
  \ got {s!r}\")\n    if t.tzinfo is not None:\n        t = t.replace(tzinfo=None)\n\
  \    return t.replace(tzinfo=tz)\n\n\ndef hm(mins):\n    mins = round(mins) % 1440\n\
  \    return f\"{mins // 60:02d}:{mins % 60:02d}\"\n\n\ndef offset_h(t):\n    return\
  \ t.utcoffset().total_seconds() / 3600\n\n\ndef choose_direction(shift):\n    \"\
  \"\"shift in -12..12 (east positive). Return (signed hours to move the body, rate,\
  \ label).\"\"\"\n    if shift == 0:\n        return 0.0, ADVANCE_RATE, \"none\"\n\
  \    if shift > 0:\n        adv_days = math.ceil(shift / ADVANCE_RATE)\n       \
  \ alt = shift - 24\n        del_days = math.ceil(-alt / DELAY_RATE)\n        if\
  \ del_days < adv_days:\n            return alt, DELAY_RATE, \"delay (long way round)\"\
  \n        return shift, ADVANCE_RATE, \"advance\"\n    del_days = math.ceil(-shift\
  \ / DELAY_RATE)\n    alt = shift + 24\n    adv_days = math.ceil(alt / ADVANCE_RATE)\n\
  \    if adv_days < del_days:\n        return alt, ADVANCE_RATE, \"advance (long\
  \ way round)\"\n    return shift, DELAY_RATE, \"delay\"\n\n\ndef night_overlap(start_utc,\
  \ end_utc, tz, night_start=22 * 60, night_end=7 * 60):\n    \"\"\"Return list of\
  \ (start_local, end_local) pieces of the flight inside destination nights.\"\"\"\
  \n    pieces = []\n    t = start_utc\n    step = dt.timedelta(minutes=5)\n    cur\
  \ = None\n    while t < end_utc:\n        loc = t.astimezone(tz)\n        m = loc.hour\
  \ * 60 + loc.minute\n        is_night = m >= night_start or m < night_end\n    \
  \    if is_night and cur is None:\n            cur = loc\n        if not is_night\
  \ and cur is not None:\n            pieces.append((cur, loc))\n            cur =\
  \ None\n        t += step\n    if cur is not None:\n        pieces.append((cur,\
  \ end_utc.astimezone(tz)))\n    return pieces\n\n\ndef overlap(a0, a1, b0, b1):\n\
  \    \"\"\"Minutes of overlap between [a0, a1) and [b0, b1) on a 24 h circle.\"\"\
  \"\n    best = 0\n    for k in (-1440, 0, 1440):\n        best += max(0, min(a1,\
  \ b1 + k) - max(a0, b0 + k))\n    return best\n\n\ndef light_windows(cbt, sign,\
  \ sleep_start, sleep_len):\n    \"\"\"Seek/avoid windows around CBTmin, moved or\
  \ clipped to waking hours.\n    sign > 0 (advance): seek 3 h after CBTmin, avoid\
  \ 3 h before; sign < 0 (delay): the reverse.\n    A seek window that falls into\
  \ planned sleep moves to the nearest waking edge (after wake\n    when advancing,\
  \ before bedtime when delaying). Avoid windows are clipped to waking time.\"\"\"\
  \n    sleep_end = sleep_start + sleep_len\n    if sign > 0:\n        seek, avoid\
  \ = (cbt, cbt + 180), (cbt - 180, cbt)\n        if overlap(seek[0], seek[1], sleep_start,\
  \ sleep_end):\n            seek = (sleep_end, sleep_end + 180)\n    else:\n    \
  \    seek, avoid = (cbt - 180, cbt), (cbt, cbt + 180)\n        if overlap(seek[0],\
  \ seek[1], sleep_start, sleep_end):\n            seek = (sleep_start - 180, sleep_start)\n\
  \    ov = overlap(avoid[0], avoid[1], sleep_start, sleep_end)\n    if ov >= 180:\n\
  \        avoid_s = \"asleep\"\n    elif ov:\n        # keep the waking part of the\
  \ avoid window\n        a0, a1 = avoid\n        if overlap(a0, a0 + 1, sleep_start,\
  \ sleep_end):\n            a0 = a1 - (180 - ov)\n        else:\n            a1 =\
  \ a0 + (180 - ov)\n        avoid_s = f\"{hm(a0)}-{hm(a1)}\"\n    else:\n       \
  \ avoid_s = f\"{hm(avoid[0])}-{hm(avoid[1])}\"\n    return f\"{hm(seek[0])}-{hm(seek[1])}\"\
  , avoid_s\n\n\ndef plan(trip):\n    for k in (\"from_tz\", \"to_tz\", \"depart\"\
  , \"arrive\"):\n        if not trip.get(k):\n            raise TripError(f\"missing\
  \ {k}\")\n    ftz, ttz = parse_tz(trip[\"from_tz\"]), parse_tz(trip[\"to_tz\"])\n\
  \    dep = parse_local(trip[\"depart\"], ftz, \"depart\")\n    arr = parse_local(trip[\"\
  arrive\"], ttz, \"arrive\")\n    if arr.astimezone(dt.timezone.utc) <= dep.astimezone(dt.timezone.utc):\n\
  \        raise TripError(\"arrive must be after depart (check the dates and time\
  \ zones)\")\n    bed = parse_hm(trip.get(\"bedtime\", \"23:00\"), \"bedtime\")\n\
  \    wake = parse_hm(trip.get(\"wake\", \"07:00\"), \"wake\")\n    sleep_len = (wake\
  \ - bed) % 1440\n    if not 4 * 60 <= sleep_len <= 12 * 60:\n        raise TripError(\"\
  bedtime to wake must be 4-12 hours\")\n    pre = int(trip.get(\"pre_trip_days\"\
  , 0))\n    stay = int(trip.get(\"stay_days\", 7))\n    if pre < 0 or pre > 4 or\
  \ stay < 1:\n        raise TripError(\"pre_trip_days must be 0-4 and stay_days at\
  \ least 1\")\n    shift = offset_h(arr) - offset_h(dep.astimezone(ftz))\n    shift\
  \ = ((shift + 12) % 24) - 12 if abs(shift) > 12 else shift\n    if shift == -12:\n\
  \        shift = 12.0\n    move, rate, direction = choose_direction(shift)\n   \
  \ sign = 1 if move > 0 else -1\n    flags = []\n    if abs(shift) <= 2:\n      \
  \  flags.append(\"SMALL_SHIFT: 2 h or less; most people adapt within a day, keep\
  \ usual habits on local time\")\n    if stay <= 2 and abs(shift) >= 3:\n       \
  \ flags.append(\"SHORT_TRIP: 2 days or fewer; consider staying on home time and\
  \ scheduling meetings inside your home daytime\")\n    if \"long way round\" in\
  \ direction:\n        flags.append(f\"LONG_WAY_ROUND: a {shift:+g} h shift is planned\
  \ as {move:+g} h, which usually takes fewer days\")\n    pre_used = min(pre, int(abs(move)))\
  \ if move else 0\n    pre_days = []\n    for i in range(1, pre_used + 1):\n    \
  \    b = bed - sign * 60 * i\n        cbt = wake - 180 - sign * 60 * i\n       \
  \ seek_s, avoid_s = light_windows(cbt, sign, b, sleep_len)\n        pre_days.append({\"\
  day\": f\"pre {i - pre_used - 1}\", \"date\": str((dep.date() - dt.timedelta(days=pre_used\
  \ - i + 1))),\n                         \"sleep\": f\"{hm(b)}-{hm(b + sleep_len)}\"\
  , \"seek_light\": seek_s,\n                         \"avoid_light\": avoid_s, \"\
  clock\": \"home time\"})\n    body = sign * pre_used  # hours already moved toward\
  \ destination\n    total = abs(move)\n    days_needed = math.ceil(max(0.0, total\
  \ - pre_used) / rate) if move else 0\n    days = []\n    d = 0\n    while True:\n\
  \        remaining = move - body  # signed hours the body is still away from local\
  \ time\n        gap = abs(remaining)\n        comp = min(120, gap * 60 / 2)\n  \
  \      # remaining > 0: body clock is behind local time, so it wants to sleep later\
  \ (and vice versa)\n        b = bed + (comp if remaining > 0 else -comp) if gap\
  \ else bed\n        cbt_local = (wake - 180) + remaining * 60\n        if gap <\
  \ 0.5:\n            seek_s, avoid_s = \"daylight as usual\", \"-\"\n        else:\n\
  \            seek_s, avoid_s = light_windows(cbt_local, sign, b, sleep_len)\n  \
  \      if remaining > 0:\n            status = f\"{gap:g} h behind local time\"\n\
  \        elif remaining < 0:\n            status = f\"{gap:g} h ahead of local time\"\
  \n        else:\n            status = \"adjusted\"\n        days.append({\"day\"\
  : d, \"date\": str(arr.date() + dt.timedelta(days=d)), \"body_clock\": status,\n\
  \                     \"sleep\": f\"{hm(b)}-{hm(b + sleep_len)}\", \"seek_light\"\
  : seek_s, \"avoid_light\": avoid_s,\n                     \"caffeine_until\": hm(b\
  \ - 480), \"naps_end_by\": hm(b - 420)})\n        if gap == 0 or d + 1 >= stay:\n\
  \            break\n        body = body + sign * min(rate, gap)\n        d += 1\n\
  \    flight_h = (arr.astimezone(dt.timezone.utc) - dep.astimezone(dt.timezone.utc)).total_seconds()\
  \ / 3600\n    nights = night_overlap(dep.astimezone(dt.timezone.utc), arr.astimezone(dt.timezone.utc),\
  \ ttz)\n    nights = [(a, b) for a, b in nights if (b - a).total_seconds() >= 3600]\n\
  \    if nights:\n        inflight = \"sleep during destination night: \" + \"; \"\
  .join(f\"{a:%a %H:%M}-{b:%H:%M}\" for a, b in nights)\n    else:\n        inflight\
  \ = \"flight is during destination daytime: stay awake, get daylight/screen light,\
  \ at most a 20-minute nap\"\n    res = {\"from_tz\": str(trip[\"from_tz\"]), \"\
  to_tz\": str(trip[\"to_tz\"]), \"shift_h\": shift, \"plan_move_h\": move,\n    \
  \       \"direction\": direction, \"rate_h_per_day\": rate, \"pre_trip_shift_h\"\
  : pre_used,\n           \"days_to_adjust_after_arrival\": days_needed, \"flight_h\"\
