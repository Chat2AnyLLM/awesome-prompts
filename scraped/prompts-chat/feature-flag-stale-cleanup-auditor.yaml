  \n# Feature flag cleanup audit\n\nToday 2026-11-05, primary environment `production`,\
  \ stale after 30 days. 9 flag(s) in the inventory, 3 source file(s) scanned in examples/src.\n\
  \n**Verdict: 3 high finding(s) - flags used in code that the flag service does not\
  \ know**\n\nCleanup candidates: 6 (4 removable now, 4 reference(s) to change). Findings:\
  \ 3 high, 9 medium, 2 low, 3 info.\n\n## Cleanup plan\n\n| # | Flag | Type | Owner\
  \ | Primary | Action | Why | Refs (files) | Effort | Where |\n|---|---|---|---|---|---|---|---|---|---|\n\
  | 1 | `legacy-pdf-invoices` | release | team-billing | archived | **remove code**\
  \ | archived but still in code | 1 (1) | S | `examples/src/checkout.ts:20` |\n|\
  \ 2 | `new-checkout-flow` | release | team-payments | 100% | **remove, keep ON**\
  \ | 100% on for 86 days | 2 (1) | S | `examples/src/checkout.ts:4`, `examples/src/checkout.ts:14`\
  \ |\n| 3 | `recs-carousel` | release | team-growth | 100% | **remove, keep ON**\
  \ | 100% on for 170 days | 0 (0) | - | - |\n| 4 | `holiday-banner-2025` | release\
  \ | team-growth | 0% | **remove, keep OFF** | off for 303 days | 1 (1) | S | `examples/src/Header.tsx:5`\
  \ |\n| 5 | `search-v2` | release | team-search | 25% | **finish rollout** | stuck\
  \ at 25% | 1 (1) | S | `examples/src/search.py:5` |\n| 6 | `pricing-page-test` |\
  \ experiment | team-growth | 50% | **decide experiment** | running 199 days | 1\
  \ (1) | S | `examples/src/Header.tsx:15` |\n\nEffort: S = 1-2 references, M = 3-6,\
  \ L = 7 or more. \"keep ON\" = delete the flag check and the OFF branch; \"keep\
  \ OFF\" = delete the guarded code. Archive the flag in the flag service only after\
  \ the code change is deployed everywhere.\n\n## Findings\n\n| Sev | Code | Flag\
  \ | Finding | Fix |\n|---|---|---|---|---|\n| high | FF01 | `new-checkout-flow-v3`\
  \ | used in code (examples/src/checkout.ts:27) but not defined in the flag inventory\
  \ - the SDK returns the default, so this code path is reading the wrong key | typo\
  \ of new-checkout-flow? use the exact key |\n| high | FF01 | `recs_carousel` | used\
  \ in code (examples/src/search.py:20) but not defined in the flag inventory - the\
  \ SDK returns the default, so this code path is reading the wrong key | typo of\
  \ recs-carousel? use the exact key |\n| high | FF14 | `legacy-pdf-invoices` | flag\
  \ is archived in the flag service but still referenced in 1 place(s) - it now returns\
  \ the default | remove the references |\n| medium | FF02 | `new-checkout-flow` |\
  \ release flag 100% on in production for 86 days | remove the flag and keep the\
  \ ON path; delete the OFF branch and old code |\n| medium | FF02 | `recs-carousel`\
  \ | release flag 100% on in production for 170 days | remove the flag and keep the\
  \ ON path; delete the OFF branch and old code |\n| medium | FF03 | `holiday-banner-2025`\
  \ | release flag off in production for 303 days - the guarded code is dead | remove\
  \ the flag and the guarded code (or decide to launch it) |\n| medium | FF05 | `holiday-banner-2025`\
  \ | expired on 2026-01-10 (299 days ago) | remove it now or agree a new date with\
  \ the owner |\n| medium | FF05 | `new-checkout-flow` | expired on 2026-09-30 (36\
  \ days ago) | remove it now or agree a new date with the owner |\n| medium | FF05\
