title: Wild Horses Galloping Through Shallow Surf at Dawn (Image-to-Video Animation)
description: Imported from Prompts Chat
prompt: 'Use the attached still (step 1: a sunrise telephoto photograph of nine wild
  horses, mostly black and dark brown with three dappled greys, galloping left to
  right through shallow surf on an empty beach, spray glowing in the backlight, the
  sun low at the far left) as the exact first frame and animate it into an 8-second,
  16:9 cinematic shot. Keep every element as it is in the still: the nine horses,
  their coat colors and order, the lone horse running behind on the right, the sun
  position, the mist band and the reflections on the wet sand.


  Motion (0-8 s):

  - 0-3 s: the frozen spray falls and the herd continues its gallop in smooth, natural
  motion; manes and tails stream back, legs reach and land with a correct galloping
  gait.

  - 3-6 s: hooves keep striking the shallow water and throwing fresh arcs of glowing
  spray; the horses shift slightly in the group, heads bobbing with each stride; their
  dark reflections move across the wet sand.

  - 6-8 s: the herd keeps galloping left to right through the surf in the same tight
  group, the lone horse still following behind, spray and mist hanging in the warm
  light.


  Camera: smooth tracking shot moving alongside the herd at sand level, keeping the
  horses roughly in the same place in the frame while the beach and water slide past;
  telephoto compression; focus stays on the herd; no cuts, no zoom jumps.


  Ambient motion: small waves rolling in and sliding up the sand, sea mist drifting,
  sparkles on the water.


  Lighting and mood: constant warm sunrise light from the low sun at the left; calm,
  powerful and free.


  Sound: off (silent clip).


  Avoid: people, riders, saddles, horses taking off or leaving the group, extra horses
  appearing, horses merging or morphing, extra or missing legs, unnatural gait, sudden
  lighting changes, text.'
