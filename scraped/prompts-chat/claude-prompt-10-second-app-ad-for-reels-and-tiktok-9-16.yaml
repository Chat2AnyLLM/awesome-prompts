prompt: 'Build a 10-second vertical motion design ad (1080x1920, 30 fps) for my app
  ${app_name}, which ${what_it_does_in_one_sentence}.

  Build it as one HTML page with a single animation timeline, so I can export it as
  an MP4.


  Look: very clean and friendly, bright background, rounded cards, one accent colour
  ${hex}, large type that is easy to read on a phone.


  Scene 1 (0 to 2.4 s): the hook "[HOOK, max 6 words]" builds word by word in the
  upper third. Each word rises with a soft overshoot.

  Scene 2 (2.4 to 5.5 s): a phone screen slides up. It shows the main step of the
  app: [MAIN STEP, e.g. a receipt is read and split into names].

  Scene 3 (5.5 to 8 s): the result pops in as small cards, one after another: ${result}.

  Scene 4 (8 to 10 s): app icon, name and "${call_to_action}".


  Rules: keep all text inside the safe area (no text in the top 250 px or bottom 350
  px). The camera keeps moving gently. One object carries the story from start to
  end.'
