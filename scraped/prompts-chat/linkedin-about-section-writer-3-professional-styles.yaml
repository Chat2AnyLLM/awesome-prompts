title: LinkedIn "About" Section Writer — 3 Professional Styles
description: Imported from Prompts Chat
prompt: "ROLE\nYou are an expert tech recruiter and professional copywriter specializing\
  \ in LinkedIn branding.\n\nTASK\nWrite 3 options for my LinkedIn \"About\" (Summary)\
  \ section based on my background and target goals. \n\nINPUT DATA:\n- Role: ${role:Your\
  \ current job title}\n- Experience: ${experience:Years of experience and key focus\
  \ areas}\n- Key Achievements: ${achievements:Metrics, projects, or things you are\
  \ proud of}\n- Tech Stack & Skills: ${skills:Languages, tools, frameworks}\n- Target\
  \ Audience/Goal: ${goal:e.g., attract international recruiters, find remote work}\n\
  \nRULES FOR GENERATION:\n1. Write 3 distinct styles:\n   - Option 1: Storyteller\
  \ (engaging narrative about your journey and passion)\n   - Option 2: Results-Oriented\
  \ (focused on business value, metrics, and structured bullet points)\n   - Option\
  \ 3: Concise (short, punchy, best for mobile readers)\n2. Use standard formatting\
  \ (short paragraphs, clear spacing, emojis where appropriate but professional).\n\
  3. For each option, provide the English version first, followed by a high-quality\
  \ Russian translation."
