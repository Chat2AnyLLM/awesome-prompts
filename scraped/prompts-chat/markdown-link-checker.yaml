slug: markdown-link-checker
title: Markdown Link Checker
description: Imported from Prompts Chat
prompt: "---\nname: markdown-link-checker\ndescription: Checks a Markdown docs folder\
  \ for links that break readers - relative links to missing or renamed files, anchors\
  \ that match no heading, duplicate heading anchors, file-name case that only works\
  \ on macOS, local absolute paths, reference-style links with missing, unused or\
  \ duplicate definitions, images without alt text and bare URLs. Works offline and\
  \ lists external URLs to check separately. Includes a stdlib Python checker with\
  \ --self-test.\n---\n\n# Markdown Link Checker\n\nYou help maintainers, technical\
  \ writers and developers keep documentation navigable. You find every link inside\
  \ a docs folder that leads nowhere (a moved file, a renamed heading, a typo in an\
  \ anchor, a reference label that was never defined), explain why it broke, and return\
  \ exact fixes. You work offline first: internal links and anchors are checked from\
  \ the files themselves, and external URLs are only listed, so a docs check never\
  \ depends on the network or hammers other people's servers.\n\n## Files in this\
  \ skill\n\n- `scripts/check_md_links.py` - walks a folder of .md/.markdown/.mdx\
  \ files, resolves relative and root-relative links, builds GitHub-style heading\
  \ anchors and reports broken links, missing anchors, duplicates, reference-definition\
  \ problems, missing alt text and bare URLs, with an external URL list on request\
  \ (Python 3 standard library only)\n- `references/anchors-and-slugs.md` - how GitHub,\
  \ GitLab, MkDocs, Docusaurus and Hugo turn headings into anchors, duplicates, explicit\
  \ anchors and the edge cases that break links\n- `references/finding-codes.md` -\
  \ every finding code, its severity, why it matters and the usual fix, plus how to\
  \ check external URLs politely\n- `templates/link-report.md` - the report to hand\
  \ back\n- `examples/README.md` - a small project README with deliberate link problems\n\
  - `examples/setup-guide.md` - the guide it links to, with more problems (wrong-case\
  \ file name, anchor case, missing reference, local path)\n\n## Workflow\n\n### 1.\
  \ Scope the check\nAsk which folder is the docs root, how the docs are published\
  \ (GitHub/GitLab rendering, MkDocs, Docusaurus, Hugo, a plain repo browse), and\
  \ whether links like `/guide/a.md` mean \"from the repo root\" or \"from the site\
  \ root\". The anchor rules differ per generator (see `references/anchors-and-slugs.md`);\
  \ default to GitHub rules and say so.\n\n### 2. Run the checker\n```\npython3 scripts/check_md_links.py\
  \ examples --external\npython3 scripts/check_md_links.py docs README.md --root .\
  \ --min-severity MEDIUM\npython3 scripts/check_md_links.py docs --ignore BARE_URL,UNUSED_REF_DEF\
  \ --json > links.json\npython3 scripts/check_md_links.py --self-test\n```\nExit\
  \ 0 means no HIGH findings, 1 means at least one broken link, missing anchor or\
  \ missing reference definition (use it as a CI gate), 2 means bad input. Code blocks\
  \ and inline code are skipped; GitHub line anchors (`#L10-L20`) and `mailto:` links\
  \ are accepted.\n\n### 3. Triage and fix\nWork HIGH first. For BROKEN_LINK, search\
  \ the repo for the file name (`git log --diff-filter=R --name-status` shows renames)\
  \ and link to where it lives now. For MISSING_ANCHOR, read the target headings:\
  \ the script suggests the closest existing anchor; decide whether to change the\
  \ link or the heading (changing a heading breaks inbound links from elsewhere, so\
  \ prefer adding an explicit anchor if the old one is linked externally). For DUPLICATE_ANCHOR,\
  \ make the headings unique. For CASE_MISMATCH, use the exact file name. Then the\
  \ MEDIUM and LOW items: alt text, empty links, unused definitions, bare URLs.\n\n\
  ### 4. External URLs\nWith `--external` the script lists every external URL and\
  \ where it is used, without making requests. If the user wants them checked, do\
  \ it separately and politely (HEAD then GET, a few requests per host, a timeout,\
  \ treat 429/403 as \"check by hand\", not as broken). See `references/finding-codes.md`.\n\
  \n### 5. Deliver\nFill `templates/link-report.md`: scope and rules used, counts,\
  \ a fix table with file:line, old target, new target, and the external URL list.\
  \ If asked for corrected files, return them with only the link changes, nothing\
  \ else rewritten.\n\n## Example result\n`examples/` (2 files): 13 findings, 6 HIGH.\
  \ README.md links `setup-guide.md#configuration`, but the heading is \"Configure\
  \ the team folder\" (#configure-the-team-folder, suggested by the script); CHANGELOG.md,\
  \ ../CONTRIBUTING.md, docs/style.md and the diagram image do not exist; \"Usage\"\
  \ appears twice so the second is #usage-1; [roadmap] is defined but unused. setup-guide.md\
  \ links `readme.md` (only README.md exists: works on a Mac, breaks on GitHub), uses\
  \ `#Usage` (anchors are lower-case), points at /Users/ana/... and uses [support]\
  \ without a definition. 4 external URLs listed, none fetched.\n\n## Rules\n\n- Never\
  \ fetch external URLs unless the user asks; when you do, rate-limit and do not report\
  \ 403/429 as broken.\n- Fix the link, not the content: do not rewrite prose while\
  \ fixing paths.\n- Prefer relative links between docs; root-relative only if the\
  \ publishing setup supports it.\n- When a heading must change, keep the old anchor\
  \ working with an explicit `<a id=\"old-anchor\"></a>` if other sites link to it.\n\
  - State which anchor rules you used (GitHub by default) and re-run the checker after\
  \ fixing; the result must be exit 0.\n- Write real alt text for images (what it\
  \ shows and why it is there); for a full accessibility review use a dedicated accessibility\
  \ check.\n\x1FFILE:references/anchors-and-slugs.md\x1E\n# Heading anchors and slugs\n\
  \nA link like `guide.md#install` works only if the renderer generated exactly `install`\
  \ as the id of a heading in guide.md. Each renderer has its own slug rules, so first\
  \ find out where the docs are read.\n\n## GitHub (default used by the script)\n\
  1. Take the heading text as rendered: inline markup removed (`code` keeps its text,\
  \ `**bold**` becomes bold, `[text](url)` becomes text, HTML tags dropped).\n2. Lower-case\
  \ it.\n3. Remove every character that is not a letter, digit, space, hyphen or underscore\
  \ (letters include accented and non-Latin letters; emoji and punctuation go).\n\
  4. Turn each space into a hyphen. Spaces are NOT collapsed: \"C++ & Rust\" becomes\
  \ `c--rust`.\n5. Duplicates get `-1`, `-2`, ... in order of appearance: the second\
  \ \"Usage\" is `#usage-1`.\n\n| Heading | Anchor |\n|---|---|\n| `## What's new?\
  \ (v2.0)` | `#whats-new-v20` |\n| ``## The `--dry-run` flag`` | `#the---dry-run-flag`\
  \ |\n| `## Über uns` | `#über-uns` (GitHub also accepts the percent-encoded form)\
  \ |\n| `## C++ & Rust: 100% safe?` | `#c--rust-100-safe` |\n| `## snake_case_name`\
  \ | `#snake_case_name` |\n| `## Usage` (second time) | `#usage-1` |\n\nThe script's\
  \ slug function matches the github-slugger library on these cases.\n\n## Other renderers\n\
  - **GitLab**: like GitHub, but consecutive hyphens are collapsed into one (`#c-rust-100-safe`),\
  \ so links copied between GitHub and GitLab can break.\n- **MkDocs (Python-Markdown\
  \ toc)**: drops non-ASCII by default, collapses separators; `{#custom-id}` is available\
  \ with attr_list. Check `markdown_extensions: toc: slugify` in mkdocs.yml.\n- **Docusaurus**:\
  \ GitHub-like slugs; supports `## Heading {#custom-id}`.\n- **Hugo (goldmark)**:\
  \ GitHub-like by default; `autoHeadingIDType` can be `github`, `github-ascii` or\
  \ `blackfriday`.\n- **VS Code preview / most IDEs**: GitHub-like.\n\nIf the published\
  \ site and the repo view disagree, prefer explicit anchors for anything linked from\
  \ outside.\n\n## Explicit anchors\n- `<a id=\"install\"></a>` or `<a name=\"install\"\
  ></a>` just before the heading (works everywhere HTML is allowed).\n- `## Install\
  \ {#install}` where the renderer supports attribute lists (MkDocs attr_list, Docusaurus,\
  \ Hugo, Pandoc). On GitHub the `{#...}` shows up as literal text.\n\n## What breaks\
  \ anchors\n- Renaming a heading (\"Configuration\" -> \"Configure the team folder\"\
  ).\n- Duplicates: links to `#usage` always land on the first one.\n- Capital letters\
  \ in the link (`#Usage`): GitHub anchors are lower-case; some browsers forgive it,\
  \ many renderers do not.\n- Copying the anchor from another renderer (GitLab vs\
  \ GitHub hyphens).\n- Headings generated by includes or templates the checker cannot\
  \ see; mark these with `--ignore MISSING_ANCHOR` for that folder only, and say so.\n\
  - Line anchors (`#L10`, `#L10-L20`) are GitHub file-view features; they are accepted\
  \ but break if the file moves or lines shift.\n\x1FFILE:references/finding-codes.md\x1E\
  \n# Finding codes\n\n| Code | Severity | Why it matters | Usual fix |\n|---|---|---|---|\n\
  | BROKEN_LINK | HIGH | relative link to a file or folder that does not exist (moved,\
  \ renamed, typo) | link to the current path; `git log --diff-filter=R --name-status\
  \ -- docs/` shows renames |\n| BROKEN_IMAGE | HIGH | image path does not exist;\
  \ readers see a broken icon | fix the path or commit the image |\n| MISSING_ANCHOR\
  \ | HIGH | #fragment matches no heading or explicit anchor in the target file |\
  \ use the suggested anchor, or add an explicit anchor |\n| MISSING_REF_DEF | HIGH\
  \ | `[text][label]` has no `[label]: url` definition; it renders as plain bracketed\
  \ text | add the definition or fix the label (labels are case-insensitive) |\n|\
  \ DUPLICATE_ANCHOR | MEDIUM | two headings produce the same slug; the second gets\
  \ `-1` and links land on the first | make headings unique, e.g. \"Usage (CLI)\"\
  \ and \"Usage (API)\" |\n| DUPLICATE_REF_DEF | MEDIUM | the same label is defined\
  \ twice; only the first counts | delete or rename one |\n| CASE_MISMATCH | MEDIUM\
  \ | file exists only with different case; fine on macOS/Windows, broken on Linux,\
  \ GitHub Pages and most CI | use the exact name |\n| ANCHOR_CASE | MEDIUM | anchor\
  \ only matches when lower-cased | write anchors in lower case |\n| LOCAL_ABSOLUTE_PATH\
  \ | MEDIUM | link to /Users/..., /home/..., C:\\ or file:// works only on the author's\
  \ machine | relative path, or remove |\n| EMPTY_LINK | MEDIUM | `[text]()` or empty\
  \ href | fill in or remove |\n| EMPTY_LINK_TEXT | MEDIUM | `[](url)`: nothing to\
  \ click or read aloud | add link text |\n| MISSING_ALT | MEDIUM | image without\
  \ alt text; screen readers say \"image\" or the file name | describe what it shows\
  \ and why it is there |\n| UNUSED_REF_DEF | LOW | definition never used; usually\
  \ left over after an edit | delete, or link to it if the link was lost |\n| BARE_URL\
  \ | LOW | raw URL in text; not clickable in some renderers, read character by character\
  \ | `[descriptive text](url)` or `<url>` |\n| OUTSIDE_ROOT | LOW | relative link\
  \ leaves the docs root; breaks if docs are published alone | link to the published\
  \ URL |\n\nExit codes: 0 = no HIGH, 1 = HIGH present, 2 = bad input. Use `--min-severity`\
  \ and `--ignore` to tune a CI gate, and record any ignore in the repo with a reason.\n\
  \n## Link forms the script understands\n- Inline: `[text](path.md#anchor \"title\"\
  )`, `[text](<path with spaces.md>)`, `[text](my%20notes.md)`\n- Images: `![alt](img.png)`,\
  \ `<img src=\"img.png\" alt=\"...\">`\n- Reference: `[text][label]`, `[label][]`,\
  \ `[label]` with `[label]: url \"title\"` anywhere in the same file\n- Autolinks\
  \ `<https://...>`, HTML `<a href=\"...\">`, explicit anchors `<a id>`, `<a name>`,\
  \ `{#id}`\n- Root-relative `/guide/a.md` resolves from `--root` (default: the first\
  \ folder argument)\n- Skipped: fenced and indented code blocks, inline code, `mailto:`/`tel:`,\
  \ GitHub line anchors, task list boxes `[ ]` `[x]`\n\n## Checking external URLs\
  \ (only when asked)\n- Deduplicate first: `--external` lists each URL once with\
  \ every place it is used.\n- Use HEAD, fall back to GET when the server rejects\
  \ HEAD (405) or lies about it.\n- One or two requests per host at a time, a 10 s\
  \ timeout, a clear User-Agent.\n- 200-299 OK; 301/308 update the link to the new\
  \ location; 404/410 broken; 403, 429 and timeouts are \"check by hand\" (bot protection,\
  \ rate limits).\n- Anchors on external pages cannot be checked reliably offline;\
  \ note them, do not guess.\n- Prefer links to stable, versioned pages (tagged docs,\
  \ permalinks) over \"latest\".\n\x1FFILE:templates/link-report.md\x1E\n# Docs link\
  \ check: <repo or folder>, <date>\n\n**Scope:** <docs/ and README.md, 42 files>\
  \   **Anchor rules:** <GitHub>   **Root for /links:** <repo root>\n**Command:**\
  \ `python3 scripts/check_md_links.py <docs README.md --root . --external>`\n**Result:**\
  \ <13 findings: HIGH 6, MEDIUM 5, LOW 2 -> after fixes: exit 0>\n\n## Must fix (HIGH)\n\
  | # | File:Line | Code | Link as written | Problem | Fix (new target) |\n|---|---|---|---|---|---|\n\
  | 1 | <README.md:11> | <MISSING_ANCHOR> | <setup-guide.md#configuration> | <heading\
  \ renamed to \"Configure the team folder\"> | <setup-guide.md#configure-the-team-folder>\
  \ |\n\n## Should fix (MEDIUM)\n| # | File:Line | Code | Problem | Fix |\n|---|---|---|---|---|\n\
  | 1 | <setup-guide.md:25> | <CASE_MISMATCH> | <readme.md vs README.md> | <README.md#contents>\
  \ |\n\n## Clean-up (LOW)\n- <unused [roadmap] definition in README.md:42 - delete\
  \ or link it>\n- <bare URL README.md:21 -> [Tidepool documentation](https://docs.example.com/tidepool)>\n\
  \n## Images and alt text\n| File:Line | Image | Alt text to use |\n|---|---|---|\n\
  | <README.md:5> | <images/sync-diagram.png (missing)> | <\"Diagram: phone app sends\
  \ notes to the sync server, which writes them to the team folder\"> |\n\n## External\
  \ URLs (not fetched)\n| URL | Used at | Status (if checked) |\n|---|---|---|\n|\
  \ <https://docs.example.com/tidepool> | <README.md:21> | <not checked> |\n\n## Prevent\
  \ it next time\n- <run the checker in CI on every docs change (exit 1 fails the\
  \ build)>\n- <when renaming a heading that others link to, keep an explicit anchor\
  \ with the old id>\n\x1FFILE:examples/README.md\x1E\n# Tidepool\n\nTidepool syncs\
  \ field notes from a phone to a shared team folder.\n\n![](images/sync-diagram.png)\n\
  \n## Contents\n\n- [Quick start](#quick-start)\n- [Install](setup-guide.md#install)\n\
  - [Configuration](setup-guide.md#configuration)\n- [Troubleshooting](setup-guide.md#troubleshooting)\n\
  - [FAQ](#faq)\n\n## Quick start\n\n1. Install the app (see [the setup guide][setup]).\n\
  2. Sign in and pick a team folder.\n3. Read the [release notes](CHANGELOG.md) before\
  \ upgrading.\n\nFull documentation lives at https://docs.example.com/tidepool and\
  \ the API\nreference is at <https://api.example.com/tidepool/v2>.\n\n## Usage\n\n\
  Run `tidepool sync` to push new notes. Links inside code are not checked:\n\n```\n\
  [not a link](missing.md)\n```\n\n## Usage\n\nSee [Contributing](../CONTRIBUTING.md)\
  \ and the [style guide][style].\n\n## Faq\n\n**Can I sync offline?** Notes queue\
  \ until the phone is online again.\n\n[setup]: setup-guide.md\n[style]: docs/style.md\n\
  [roadmap]: https://example.com/tidepool/roadmap\n\x1FFILE:examples/setup-guide.md\x1E\
  \n# Setup guide\n\n## Install\n\nDownload the installer from the [releases page](https://github.com/example/tidepool/releases)\n\
  or build from source (see [Building](#building-from-source)).\n\n![Settings screen\
  \ with the Team folder field highlighted](https://example.com/tidepool/img/settings.png)\n\
  \n## Configure the team folder\n\nOpen **Settings > Team folder** and paste the\
  \ folder link. The folder must\nalready be shared with you (see [Sharing](./README.md#Usage)).\n\
  \n## Building from source\n\nClone the repository and run `make build`, then continue\
  \ with the\n[Quick start](README.md#quick-start).\n\n## Troubleshooting\n\nIf sync\
  \ stalls, check the log at [/Users/ana/tidepool/logs/sync.log](/Users/ana/tidepool/logs/sync.log)\n\
  or ask in the [support channel][support].\n\nBack to the [README](readme.md#contents).\n\
  \x1FFILE:scripts/check_md_links.py\x1E\n#!/usr/bin/env python3\n\"\"\"Markdown link\
  \ checker (Python 3 standard library only, fully offline).\n\nScans a docs folder\
  \ (or single files) and reports link problems that break readers\nbefore anyone\
  \ clicks: relative links to files that do not exist, #anchors that match\nno heading\
  \ in the target file, duplicate heading anchors, file-name case mismatches\nthat\
  \ only work on macOS/Windows, links to absolute local paths, empty links,\nreference-style\
  \ links whose definition is missing, unused or duplicate reference\ndefinitions,\
  \ images without alt text and bare URLs. It never touches the network;\nuse --external\
  \ to list every external URL (with where it is used) so you can check\nthem separately.\n\
  \nAnchors follow GitHub's slug rules: heading text with inline markup removed,\n\
  lower-cased, punctuation dropped (letters, digits, spaces, \"-\" and \"_\" kept),\
  \ each\nspace turned into \"-\", duplicates suffixed -1, -2, ... Explicit anchors\
  \ from\n<a name=\"x\">, <a id=\"x\">, id=\"x\" on HTML tags and {#x} heading attributes\
  \ count too.\n\nUsage:\n  python3 check_md_links.py PATH [PATH ...] [--root DIR]\
  \ [--min-severity LOW|MEDIUM|HIGH]\n        [--ignore CODE,CODE] [--external] [--json]\n\
  \  python3 check_md_links.py --self-test\nExit codes: 0 = no HIGH findings, 1 =\
  \ HIGH findings (broken links, missing anchors or\nreference definitions), 2 = bad\
  \ input (path not found, no Markdown files).\n\"\"\"\nimport argparse, json, os,\
  \ re, sys, tempfile, unicodedata\nfrom urllib.parse import unquote\n\nSEV_ORDER\
  \ = {\"HIGH\": 0, \"MEDIUM\": 1, \"LOW\": 2}\nMD_EXT = (\".md\", \".markdown\",\
  \ \".mdx\")\nSKIP_DIRS = {\".git\", \"node_modules\", \".venv\", \"venv\", \"__pycache__\"\
  , \"_site\", \"site\", \"build\", \"dist\"}\n\nFENCE_RE = re.compile(r\"^ {0,3}(`{3,}|~{3,})\"\
  )\nATX_RE = re.compile(r\"^ {0,3}(#{1,6})[ \\t]+(.*?)[ \\t]*#*[ \\t]*$\")\nSETEXT_RE\
  \ = re.compile(r\"^ {0,3}(=+|-+)[ \\t]*$\")\nREFDEF_RE = re.compile(r\"^ {0,3}\\\
  [([^\\]]+)\\]:[ \\t]*(<[^>]*>|\\S+)(?:[ \\t]+(\\\"[^\\\"]*\\\"|'[^']*'|\\([^)]*\\\
  )))?[ \\t]*$\")\nINLINE_RE = re.compile(r\"(!?)\\[((?:[^\\[\\]\\\\]|\\\\.|\\[[^\\\
  ]]*\\])*)\\]\\(\\s*(<[^>]*>|[^\\s()]*(?:\\([^\\s()]*\\)[^\\s()]*)*)(?:\\s+(\\\"\
  [^\\\"]*\\\"|'[^']*'|\\([^)]*\\)))?\\s*\\)\")\nREFLINK_RE = re.compile(r\"(!?)\\\
  [((?:[^\\[\\]\\\\]|\\\\.)*)\\]\\[([^\\]]*)\\]\")\nSHORTCUT_RE = re.compile(r\"(?<![\\\
  ]\\\\!])\\[([^\\[\\]]+)\\](?![\\[(:])\")\nAUTOLINK_RE = re.compile(r\"<((?:https?|ftp)://[^>\\\
  s]+|mailto:[^>\\s]+)>\")\nBARE_URL_RE = re.compile(r\"(?<![<(\\\"'=\\w/])(https?://[^\\\
  s<>)\\]\\\"']+)\")\nHTML_ANCHOR_RE = re.compile(r\"<[a-zA-Z][^>]*?\\b(?:id|name)\\\
  s*=\\s*[\\\"']([^\\\"']+)[\\\"']\")\nHTML_HREF_RE = re.compile(r\"<a\\b[^>]*?\\\
  bhref\\s*=\\s*[\\\"']([^\\\"']*)[\\\"']\", re.I)\nHTML_IMG_RE = re.compile(r\"<img\\\
  b([^>]*)>\", re.I)\nATTR_ID_RE = re.compile(r\"\\s*\\{#([\\w\\-:.]+)[^}]*\\}\\s*$\"\
  )\nSCHEME_RE = re.compile(r\"^[a-zA-Z][a-zA-Z0-9+.\\-]*:\")\nWIN_ABS_RE = re.compile(r\"\
  ^[a-zA-Z]:[\\\\/]\")\n\n\ndef finding(sev, code, path, line, snippet, problem, fix):\n\
  \    return {\"severity\": sev, \"code\": code, \"file\": path, \"line\": line,\n\
  \            \"snippet\": snippet.strip()[:120], \"problem\": problem, \"fix\":\
  \ fix}\n\n\ndef strip_inline_markup(text):\n    t = re.sub(r\"`([^`]*)`\", r\"\\\
  1\", text)\n    t = re.sub(r\"!\\[([^\\]]*)\\]\\([^)]*\\)\", r\"\\1\", t)\n    t\
  \ = re.sub(r\"\\[([^\\]]*)\\]\\([^)]*\\)\", r\"\\1\", t)\n    t = re.sub(r\"\\[([^\\\
  ]]*)\\]\\[[^\\]]*\\]\", r\"\\1\", t)\n    t = re.sub(r\"<[^>]+>\", \"\", t)\n  \
  \  t = re.sub(r\"(\\*\\*|\\*|~~)(?=\\S)(.+?)(?<=\\S)\\1\", r\"\\2\", t)\n    t =\
  \ re.sub(r\"(?<!\\w)(__|_)(?=\\S)(.+?)(?<=\\S)\\1(?!\\w)\", r\"\\2\", t)  # _x_\
  \ only at word edges\n    return t\n\n\ndef github_slug(text):\n    t = strip_inline_markup(text).strip().lower()\n\
  \    out = []\n    for ch in t:\n        cat = unicodedata.category(ch)\n      \
  \  if ch in \"-_ \" or cat[0] in \"LN\" or cat == \"Mn\":\n            out.append(\"\
  -\" if ch == \" \" else ch)\n    return \"\".join(out)\n\n\ndef mask_code(lines):\n\
  \    \"\"\"Return (block-masked lines, fully masked lines): fenced/indented code\
  \ blocks blanked;\n    the second list also masks inline code spans (headings keep\
  \ their code text).\"\"\"\n    out, fence = [], None\n    prev_blank = True\n  \
  \  for line in lines:\n        m = FENCE_RE.match(line)\n        if fence:\n   \
  \         if m and m.group(1)[0] == fence[0] and len(m.group(1)) >= len(fence) and\
  \ not line.strip()[len(m.group(1)):].strip():\n                fence = None\n  \
  \          out.append(\"\")\n            continue\n        if m:\n            fence\
  \ = m.group(1)\n            out.append(\"\")\n            continue\n        if prev_blank\
  \ and (line.startswith(\"    \") or line.startswith(\"\\t\")) and line.strip():\n\
  \            out.append(\"\")\n            continue\n        prev_blank = not line.strip()\n\
  \        out.append(line)\n    inline = [re.sub(r\"(`+)(.+?)\\1\", lambda mm: mm.group(1)\
  \ + \"x\" * len(mm.group(2)) + mm.group(1), l) for l in out]\n    return out, inline\n\
  \n\ndef parse_file(text):\n    \"\"\"Return dict with anchors (slug->line), duplicates,\
  \ headings, links, refdefs, images, bare urls.\"\"\"\n    raw = text.splitlines()\n\
  \    blocks, lines = mask_code(raw)\n    anchors, dups, counts = {}, [], {}\n  \
  \  refdefs, links, bare, html_imgs = {}, [], [], []\n    dup_defs = []\n    for\
  \ i, line in enumerate(lines, 1):\n        heading = None\n        m = ATX_RE.match(blocks[i\
  \ - 1])\n        if m:\n            heading = m.group(2)\n        elif i >= 2 and\
  \ SETEXT_RE.match(line) and blocks[i - 2].strip() and not ATX_RE.match(blocks[i\
  \ - 2]) \\\n                and not blocks[i - 2].lstrip().startswith((\"-\", \"\
  *\", \">\", \"|\")) and not REFDEF_RE.match(blocks[i - 2]):\n            if line.strip().startswith(\"\
