  \ (\"unknown key\", dict(base, quotas=1))]:\n        try:\n            load_plan(bad);\
  \ ok = False\n        except InputError:\n            ok = True\n        t(\"bad\
  \ plan rejected: \" + label, ok)\n    rr = run(\"1,2026-10-05,a,new,4000,,,won,,,,\\\
  n\")\n    t(\"report has verdict and payouts table\", \"**Verdict:\" in report(rr,\
  \ \"t\") and \"## Payouts\" in report(rr, \"t\"))\n    for name, ok in tests:\n\
  \        print((\"PASS  \" if ok else \"FAIL  \") + name)\n    passed = sum(ok for\
  \ _, ok in tests)\n    print(\"%d/%d passed\" % (passed, len(tests)))\n    return\
  \ 0 if passed == len(tests) else 1\n\n\ndef main(argv=None):\n    ap = argparse.ArgumentParser(description=\"\
  Calculate sales commission payouts for one period.\")\n    ap.add_argument(\"plan\"\
  , nargs=\"?\")\n    ap.add_argument(\"deals\", nargs=\"?\")\n    ap.add_argument(\"\
  --rep\", action=\"append\", default=[], help=\"only show this rep id (repeatable)\"\
  )\n    ap.add_argument(\"--json\", action=\"store_true\")\n    ap.add_argument(\"\
  --self-test\", action=\"store_true\")\n    a = ap.parse_args(argv)\n    if a.self_test:\n\
  \        return self_test()\n    if not a.plan or not a.deals:\n        ap.print_usage(sys.stderr)\n\
  \        return 2\n    try:\n        try:\n            cfg = json.load(open(a.plan,\
  \ encoding=\"utf-8\"))\n        except json.JSONDecodeError as e:\n            raise\
  \ InputError(\"plan is not valid JSON: %s\" % e)\n        p = load_plan(cfg)\n \
  \       res = compute(p, open(a.deals, encoding=\"utf-8-sig\").read(), [x.lower()\
  \ for x in a.rep] or None)\n    except (OSError, InputError, KeyError) as e:\n \
