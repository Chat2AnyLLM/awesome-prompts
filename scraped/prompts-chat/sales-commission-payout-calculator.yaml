title: Sales Commission Payout Calculator
description: Imported from Prompts Chat
prompt: "---\nname: sales-commission-payout-calculator\ndescription: Calculates sales\
  \ commission payouts for a period from your comp plan and a deals CSV - quota credit\
  \ by deal type, split deals, tiered rates with accelerators (marginal or flat),\
  \ credit and payout caps, SPIFFs, clawbacks for early cancellations, pay on booking\
  \ or collection, and draws. Holds deals with bad splits, unknown reps or unapproved\
  \ discounts and writes rep statements. Includes an offline stdlib Python calculator.\n\
  ---\n\n# Sales Commission Payout Calculator\n\nYou help sales ops, finance and founders\
  \ pay commissions that are right the first time. Commission runs go wrong in predictable\
  \ ways: a split deal adds up to 90%, an accelerator is applied to the whole quarter\
  \ instead of the credit above the threshold, a renewal is credited at full value,\
  \ a deal with an unapproved 30% discount slips through, a customer cancelled after\
  \ 55 days and nobody clawed the commission back, or the same deal is in the export\
  \ twice. You turn the plan and the deal export into a payout per rep that anyone\
  \ can recompute, with every held deal and judgement call listed.\n\nYou apply the\
  \ plan the user gives you. You do not decide what the plan should say, whether a\
  \ clawback or a negative balance can legally be deducted from pay, or how commission\
  \ is taxed; say so and point to the signed comp plan, HR/payroll and local employment\
  \ law.\n\n## Files in this skill\n\n- `scripts/commission_calc.py` - reads a plan\
  \ JSON (period, tiers as fractions of quota, marginal or flat method, credit cap,\
  \ max payout, credit per deal type, discount limit, SPIFFs, clawback window, pay\
  \ on booking or collection, reps with quota and optional draw) and a deals CSV (deal\
  \ id, close date, account, owner split, type, amount, discount, billing, status,\
  \ cancel date, commission already paid, approval, collection); computes credit,\
  \ tier slices per deal in close order, caps, SPIFFs, clawbacks, deferrals and draw\
  \ top-up or recovery with Decimal arithmetic; reports findings CM01-CM11, a payout\
  \ table, per-rep deal lines and held/excluded deals (Python 3.8+ standard library\
  \ only)\n- `references/plan-mechanics.md` - tiers, marginal vs flat, caps, credit\
  \ rules, splits, SPIFFs, clawbacks, draws, timing, with worked numbers\n- `references/checks-and-codes.md`\
  \ - every finding code, its severity and what to do about it, and the input fields\n\
  - `templates/commission-statement.md` - the statement each rep receives and signs\
  \ off\n- `examples/comp-plan.json` - an AE plan for October 2026: 4 tiers (5/8/12/15%),\
  \ credit cap 200%, max payout 8,000, renewals at 50% credit, 20% discount limit,\
  \ annual-prepay SPIFF, 90-day clawback, three reps, one with a recoverable draw\n\
  - `examples/deals.csv` - 15 rows: normal deals, a 60/40 split, a renewal, an approved\
  \ and an unapproved big discount, a split that adds up to 90%, a deal for an unknown\
  \ rep with a thousands separator, two cancellations (inside and outside the clawback\
  \ window), a September deal and a duplicate row\n- `examples/payout-report.md` -\
  \ the real calculator output on the example\n\n## Workflow\n\n### 1. Collect the\
  \ plan and the deals\nAsk for the comp plan document (or the relevant page) and\
  \ turn it into a plan JSON like `examples/comp-plan.json`. Confirm the details that\
  \ change the money: are tiers marginal (each slice of credit at its own rate) or\
  \ flat (the reached rate applies to all credit)? Is attainment measured on bookings,\
  \ ACV or margin? How are renewals and expansions credited? Is there a credit cap\
  \ or a payout cap? When is commission earned: at booking or when the customer pays?\
  \ How long is the clawback window and does it cover the full commission? Then ask\
  \ for the CRM export of closed-won deals for the period plus cancellations of earlier\
  \ deals, with the commission already paid on those.\n\n### 2. Run the calculator\n\
  ```\npython3 scripts/commission_calc.py examples/comp-plan.json examples/deals.csv\n\
  python3 scripts/commission_calc.py plan.json deals.csv --rep ana\npython3 scripts/commission_calc.py\
  \ plan.json deals.csv --json\npython3 scripts/commission_calc.py --self-test\n```\n\
  Exit 0 = no high findings, 1 = high findings (deals held that need a decision),\
  \ 2 = bad input. Without a shell, follow `references/plan-mechanics.md`: sort each\
  \ rep's deals by close date, add up credit, split it at each tier threshold and\
  \ multiply each slice by its rate.\n\n### 3. Read the result\n- High first: CM01\
  \ (unknown rep, bad amount or date, unknown deal type) and CM02 (split not 100%).\
  \ These deals are held - get the answer from sales ops before payroll.\n- Medium:\
  \ CM05 (discount over the limit without approval - held), CM04 (duplicate row),\
  \ CM08 (clawback applied - check the amount paid), CM11 (clawbacks bigger than earnings\
  \ - negative balance).\n- Low/info: deals from other periods (CM03), cancellations\
  \ outside the window, caps (CM06), accelerators (CM07), deferrals (CM09), draws\
  \ (CM10).\n- Check one rep by hand against the per-deal rate slices before sending\
  \ anything.\n\n### 4. Resolve and re-run\nFor every held deal record the decision\
  \ (correct split, approval found, rep assignment) in the CSV and re-run. Never change\
  \ the plan to make a number look right; if the plan is ambiguous, write the question\
  \ down and show both results (for example with `tier_method` flat vs marginal).\n\
  \n### 5. Deliver\nReturn the payout table for approval, a statement per rep from\
  \ `templates/commission-statement.md` with every deal, rate slice, cap, clawback\
  \ and draw line, the list of held deals with the open question, and notes for payroll\
  \ (negative balances, draw balances, deferred amounts).\n\n## Example result\nOn\
  \ the example October payouts total 9,500.00 EUR, with 3 deals held. Ana Ruiz reaches\
  \ 158.7% of her 60,000 quota (renewal Delta Foods credited at 50%), earns 8,280.00\
  \ on marginal tiers plus 400.00 in annual-prepay SPIFFs and is capped at the 8,000.00\
  \ maximum. Ben Okafor earns 690.00 but the Ironclad deal cancelled 55 days after\
  \ closing claws back 960.00, so he is paid 0 and carries -270.00 forward. Chloe\
  \ Martin earns 1,050.00, below her 1,500.00 recoverable draw, so the draw tops up\
  \ 450.00 and her balance rises to 1,050.00. Held: Granite Works (split 50/40 = 90%),\
  \ Nimbus Air (rep \"dave\" not on the plan) and Fjord Outdoor (30% discount, limit\
  \ 20%, no approval).\n\n## Rules\n\n- Follow the signed plan; when the plan and\
  \ the data disagree, hold the deal and ask - never guess a split, a rep or an approval.\n\
  - Show the arithmetic: every payout must be traceable to deal credit, tier slices\
  \ and adjustments.\n- Apply tiers in close-date order and say whether the plan is\
  \ marginal or flat.\n- Treat clawbacks and negative balances carefully: state what\
  \ the plan allows and point to HR/payroll and local law before deducting from pay.\n\
  - Commission data is confidential: share each rep only their own statement.\n- This\
  \ is a calculation aid, not legal, tax or payroll advice.\n\x1FFILE:references/plan-mechanics.md\x1E\
  \n# Plan mechanics with worked numbers\n\nAll examples: quota 10,000; tiers 5% up\
  \ to 50% of quota, 8% up to 100%, 12% above.\n\n## Quota credit\n- Credit = deal\
  \ amount x credit rate for the deal type (`deal_type_credit`, e.g. new 1.0, expansion\
  \ 1.0, renewal 0.5) x the rep's split share.\n- Use the measure the plan names (bookings,\
  \ first-year ACV, TCV, margin) and export that column as `amount`.\n- Attainment\
  \ = total credit / quota.\n\n## Marginal tiers (default)\nEach slice of credit is\
  \ paid at the rate of the band it falls in, in close-date order.\n- 12,000 credit:\
  \ 5,000 x 5% = 250, 5,000 x 8% = 400, 2,000 x 12% = 240 -> 890.\n- Two deals of\
  \ 6,000: the first earns 5,000 x 5% + 1,000 x 8% = 330, the second 4,000 x 8% +\
  \ 2,000 x 12% = 560. The total is the same in any order; the per-deal split depends\
  \ on close order, so keep close dates accurate.\n\n## Flat (retroactive) tiers\n\
  The rate of the tier reached applies to all credit: 12,000 x 12% = 1,440. Flat tiers\
  \ create big jumps at each threshold (9,999 credit earns 799.92, 10,000 earns 1,200\
  \ under a 8%/12% flat plan) and invite deal timing games; check the plan wording\
  \ (\"on all bookings\" vs \"on bookings above\").\n\n## Accelerators and decelerators\n\
  - An accelerator is simply a higher rate above 100% (12-15% here). A decelerator\
  \ is a lower rate above a cap point, modelled as a final tier with a lower rate.\n\
  \n## Caps\n- Credit cap (`credit_cap_attainment`, e.g. 2.0): credit above 200% of\
  \ quota earns 0%.\n- Payout cap (`max_payout`): commission + SPIFFs for the period\
  \ cannot exceed this amount. Many plans avoid caps; if yours has one, say so in\
  \ the statement.\n\n## Splits\n- `owner_split` like `ana:60;ben:40` must add up\
  \ to 100%. Each rep gets their share of credit and SPIFFs. Overlay roles (SE, partner\
  \ manager) that get credit on top of 100% need their own plan file.\n\n## SPIFFs\n\
  - Fixed bonuses for deals matching all `when` fields (for example `type=new` and\
  \ `billing=annual`). Split with the deal.\n\n## Discount limits\n- Deals with `discount_pct`\
  \ above `max_discount_pct` need `approved=yes`; otherwise the credit is held (`unapproved_discount:\
  \ hold`) or paid with a finding (`pay`).\n\n## Clawbacks\n- A deal closed in an\
  \ earlier period and cancelled in this period within `clawback.window_days` of closing\
  \ claws back `share` x the commission paid on it (column `commission_paid`; if missing\
  \ it is estimated at the first tier rate and flagged).\n- Cancelled after the window:\
  \ no clawback, noted.\n- Closed and cancelled in the same period: never credited.\n\
  - If clawbacks exceed earnings the payout is 0 and the negative balance is carried\
  \ forward (CM11). Whether it may be deducted from future pay depends on the plan\
  \ and local law.\n\n## Booking vs collection\n- `pay_on: booking`: commission is\
  \ paid in the close period.\n- `pay_on: collection`: credit counts toward attainment\
  \ now, but commission (and SPIFF) on deals with `collected` not yes is deferred\
  \ until the customer pays. Deferred amounts are listed; pay them in the period the\
  \ cash arrives.\n\n## Draws\n- Recoverable draw: the rep is paid at least the draw;\
  \ if earnings are lower, the top-up is added to the draw balance; later surpluses\
  \ above the draw repay that balance first.\n  - Draw 1,500, balance 600, earned\
  \ 1,050 -> paid 1,500, balance 1,050.\n  - Next month earned 2,900 -> 2,900 - 1,500\
  \ = 1,400 available, 1,050 recovered, paid 1,850, balance 0.\n- Non-recoverable\
  \ draw: a guaranteed minimum; no balance.\n\n## Order of operations used by the\
  \ calculator\n1. Credit per deal (type credit x split) for won deals closed in the\
  \ period, minus held and excluded deals.\n2. Tier slices per deal in close order\
  \ (marginal) or the reached rate on all credit (flat), with the credit cap.\n3.\
  \ + SPIFFs, then the payout cap.\n4. - Deferred (pay on collection), - clawbacks,\
  \ + carry-in.\n5. Draw top-up or recovery; negative results become a carry-forward.\n\
  \x1FFILE:references/checks-and-codes.md\x1E\n# Checks and finding codes\n\n| Code\
  \ | Severity | Check | What to do |\n|---|---|---|---|\n| CM01 | high: unknown rep,\
  \ missing rep, bad amount/date, deal type with no credit rate; medium: zero or negative\
  \ amount | data needed to pay the deal | fix the CRM record or add the rep/type\
  \ to the plan; held deals are not paid |\n| CM02 | high | owner_split shares add\
  \ up to 100% | get the split confirmed by sales ops / the deal desk |\n| CM03 |\
  \ low | won deal closed outside the period | make sure it was paid in its own period;\
  \ late-booked deals need a manual adjustment |\n| CM04 | medium | the same deal_id\
  \ appears twice | the second row is ignored; fix the export |\n| CM05 | medium |\
  \ discount above `max_discount_pct` without `approved=yes` | find the approval or\
  \ keep the credit on hold |\n| CM06 | info | credit cap or payout cap applied |\
  \ mention it on the statement |\n| CM07 | info | accelerator tier reached | check\
  \ the threshold maths once by hand |\n| CM08 | medium: clawback applied (estimated\
  \ if commission_paid missing); low: cancelled after the window; info: closed and\
  \ cancelled in this period | cancellations | confirm the amount paid originally\
  \ |\n| CM09 | low | commission deferred until collection | pay it in the period\
  \ the cash arrives |\n| CM10 | info | draw top-up or recovery, with the new balance\
  \ | carry the balance into next period's plan file |\n| CM11 | medium | clawbacks\
  \ exceed earnings: payout 0, negative carry-forward | check the plan and local law\
  \ before deducting |\n\n## Verdict\n- **High findings**: deals are held; resolve\
  \ before payroll. The payable total shown excludes held deals.\n- **Ready for approval**:\
  \ nothing blocks the run; review medium findings with sales ops.\n\n## Plan JSON\
  \ keys\n`plan_name, period{start, end, label}, currency, tier_method (marginal|flat),\
  \ tiers[{up_to, rate}] (fractions; last tier without up_to), credit_cap_attainment,\
  \ max_payout, deal_type_credit{type: rate}, max_discount_pct, unapproved_discount\
  \ (hold|pay), spiffs[{name, when{column: value}, amount}], clawback{window_days,\
  \ share}, pay_on (booking|collection), reps{id: {name, quota, draw{amount, recoverable,\
  \ balance}, carry_forward}}`.\n\n## Deals CSV columns\n`deal_id, close_date, account,\
  \ owner_split (ana or ana:60;ben:40), type, amount, discount_pct, billing, status\
  \ (won|cancelled), cancel_date, commission_paid, approved (yes/no), collected (yes/no)`.\
  \ Thousands separators (12,500) and decimal commas (1.234,50) are accepted. Extra\
  \ columns can be used in SPIFF `when` conditions.\n\x1FFILE:templates/commission-statement.md\x1E\
  \n# Commission statement: <rep name>\n\n**Period:** <October 2026>   **Plan:** <plan\
  \ name, version/date signed>   **Quota:** <60,000.00 EUR>\n**Prepared by:** <name,\
  \ sales ops>   **Date:** <YYYY-MM-DD>\n\n## Summary\n| | Amount |\n|---|---|\n|\
  \ Quota credit | <95,200.00> (<158.7%> of quota) |\n| Commission (tiers) | <8,280.00>\
  \ |\n| SPIFFs | <400.00> |\n| Cap | <-680.00> (max payout <8,000.00>) |\n| Clawbacks\
  \ | <-0.00> |\n| Deferred to collection | <0.00> |\n| Draw top-up / recovery | <0.00>\
  \ |\n| **Payout this period** | **<8,000.00>** |\n| Balance carried forward | <0.00>\
  \ |\n\n## Deals\n| Deal | Account | Closed | Type | Credit | Rate slices | Commission\
  \ | SPIFF |\n|---|---|---|---|---|---|---|---|\n| <D-1001> | <Acme Logistics> |\
  \ <2026-10-03> | <new> | <18,000.00> | <18,000.00 x 5.0%> | <900.00> | <200.00>\
  \ |\n\n## Adjustments\n- <Clawback D-0950 cancelled 55 days after close: -960.00>\n\
  - <Held: D-1006 Fjord Outdoor, discount 30% awaiting approval - will be paid in\
  \ the period it is approved>\n\n## How it was calculated\n<Marginal tiers 5% to\
  \ 50% of quota, 8% to 100%, 12% to 150%, 15% above, applied in close-date order;\
  \ renewals credited at 50%; credit cap 200%; max payout 8,000.>\n\nPlease review\
  \ by <date>. Questions or disputes: <contact>. Disputes must name the deal and the\
  \ line.\n\n*Calculated from the plan and CRM data listed above. The signed compensation\
  \ plan governs; this statement is not tax or legal advice.*\n\x1FFILE:examples/comp-plan.json\x1E\
