  ) and rep(r, \"a\")[\"payout\"] == Decimal(\"350.00\"))\n    r = run(\"1,2026-10-05,a,new,4000,,,won,,,,no\\\
  n\", pay_on=\"collection\")\n    t(\"pay on collection defers unpaid deals\", rep(r,\
  \ \"a\")[\"deferred\"] == Decimal(\"200.00\") and rep(r, \"a\")[\"payout\"] == 0)\n\
  \    cfg = dict(base, reps={\"a\": {\"quota\": 10000, \"draw\": {\"amount\": 500,\
  \ \"recoverable\": True, \"balance\": 0}}})\n    res = compute(load_plan(cfg), H\
  \ + \"1,2026-10-05,a,new,4000,,,won,,,,\\n\")\n    t(\"recoverable draw tops up\
  \ and builds balance\", rep(res, \"a\")[\"payout\"] == Decimal(\"500.00\") and rep(res,\
  \ \"a\")[\"draw_balance\"] == Decimal(\"300\"))\n    cfg = dict(base, reps={\"a\"\
  : {\"quota\": 10000, \"draw\": {\"amount\": 500, \"recoverable\": True, \"balance\"\
  : 300}}})\n    res = compute(load_plan(cfg), H + \"1,2026-10-05,a,new,12000,,,won,,,,\\\
  n\")\n    t(\"surplus recovers draw balance\", rep(res, \"a\")[\"draw_recovered\"\
  ] == Decimal(\"300\") and rep(res, \"a\")[\"payout\"] == Decimal(\"590.00\"))\n\
  \    cfg = dict(base, reps={\"a\": {\"quota\": 10000, \"draw\": {\"amount\": 500,\
  \ \"recoverable\": False}}})\n    res = compute(load_plan(cfg), H + \"1,2026-10-05,a,new,4000,,,won,,,,\\\
  n\")\n    t(\"non-recoverable draw: no balance\", rep(res, \"a\")[\"payout\"] ==\
  \ Decimal(\"500.00\") and rep(res, \"a\")[\"draw_balance\"] == 0)\n    t(\"thousands\
  \ separator parsed\", D(\"12,000\") == Decimal(\"12000\") and D(\"1.234,50\") ==\
  \ Decimal(\"1234.50\"))\n    for label, bad in [(\"tiers out of order\", dict(base,\
  \ tiers=[{\"up_to\": 1, \"rate\": 0.05}, {\"up_to\": 0.5, \"rate\": 0.08}])),\n\
