  ] is not None else \"\", title))\n    L.append(\"\")\n    if c[\"high\"]:\n    \
  \    L.append(\"**Verdict: %d high finding(s), %d deal(s) held - resolve them before\
  \ payroll; total payable now %s%s**\" % (c[\"high\"], len(res[\"held\"]), fm(total),\
  \ cur))\n    else:\n        L.append(\"**Verdict: ready for approval - total payable\
  \ %s%s%s**\" % (fm(total), cur, \" (medium findings to review)\" if c[\"medium\"\
  ] else \"\"))\n    L.append(\"\")\n    L.append(\"Findings: %d high, %d medium,\
  \ %d low, %d info. Figures follow the plan file you provided; the signed comp plan\
  \ and local pay law win if they differ.\" % (c[\"high\"], c[\"medium\"], c[\"low\"\
  ], c[\"info\"]))\n    L += [\"\", \"## Payouts\", \"\", \"| Rep | Quota | Credit\
  \ | Attainment | Tier | Commission | SPIFFs | Cap | Clawbacks | Deferred | Draw\
  \ | Payout |\", \"|---|---|---|---|---|---|---|---|---|---|---|---|\"]\n    for\
  \ r in res[\"reps\"]:\n        draw = (\"+%s\" % fm(r[\"draw_topup\"])) if r[\"\
  draw_topup\"] else ((\"-%s recovered\" % fm(r[\"draw_recovered\"])) if r[\"draw_recovered\"\
  ] else \"\")\n        L.append(\"| %s | %s | %s | %s | %d | %s | %s | %s | %s |\
  \ %s | %s | **%s** |\" % (\n            r[\"name\"], fm(r[\"quota\"]), fm(r[\"credit\"\
  ]), pct(r[\"attainment\"]), r[\"tier\"], fm(r[\"commission\"]), fm(r[\"spiffs\"\
  ]),\n            (\"-\" + fm(r[\"capped\"])) if r[\"capped\"] else \"\", (\"-\"\
  \ + fm(r[\"clawbacks\"])) if r[\"clawbacks\"] else \"\",\n            fm(r[\"deferred\"\
  ]) if r[\"deferred\"] else \"\", draw, fm(r[\"payout\"])))\n    L.append(\"| **Total**\
  \ | | | | | | | | | | | **%s** |\" % fm(total))\n    for r in res[\"reps\"]:\n \
  \       L += [\"\", \"## %s\" % r[\"name\"], \"\"]\n        if not r[\"deals\"]:\n\
  \            L.append(\"No credited deals this period.\")\n        else:\n     \
  \       L += [\"| Deal | Account | Closed | Type | Amount | Share | Credit | Attainment\
  \ after | Rate slices | Commission | SPIFF |\", \"|---|---|---|---|---|---|---|---|---|---|---|\"\
  ]\n            for d in r[\"deals\"]:\n                L.append(\"| %s | %s | %s\
  \ | %s | %s | %s%% | %s | %s | %s | %s | %s |\" % (\n                    d[\"deal\"\
  ], d[\"account\"], d[\"close\"], d[\"type\"], fm(d[\"amount\"]), num(d[\"share\"\
  ]), fm(d[\"credit\"]),\n                    pct(d[\"att_after\"]), \"; \".join(d[\"\
  slices\"]) or \"-\", fm(d[\"commission\"]) + (\" (deferred)\" if d[\"deferred\"\
  ] else \"\"), fm(d[\"spiff\"]) if d[\"spiff\"] else \"\"))\n        extra = []\n\
  \        for cl in [x for x in res[\"clawbacks\"] if x[\"rep\"] == r[\"id\"]]:\n\
  \            extra.append(\"- Clawback %s (%s, cancelled %d days after close): -%s%s\"\
  \ % (cl[\"deal\"], cl[\"account\"], cl[\"age\"], fm(cl[\"amount\"]), \" (estimated)\"\
  \ if cl[\"estimated\"] else \"\"))\n        if r[\"carry_in\"]:\n            extra.append(\"\
  - Carried in from last period: %s\" % fm(r[\"carry_in\"]))\n        if r[\"draw_topup\"\
  ] or r[\"draw_recovered\"] or r[\"draw_balance\"]:\n            extra.append(\"\
  - Draw: top-up %s, recovered %s, outstanding balance %s\" % (fm(r[\"draw_topup\"\
  ]), fm(r[\"draw_recovered\"]), fm(r[\"draw_balance\"])))\n        if r[\"carry_out\"\
  ]:\n            extra.append(\"- Negative balance carried forward: %s\" % fm(r[\"\
  carry_out\"]))\n        L += [\"\"] + extra if extra else []\n    if res[\"held\"\
  ]:\n        L += [\"\", \"## Held deals (need a decision)\", \"\", \"| Deal | Account\
  \ | Reason |\", \"|---|---|---|\"]\n        L += [\"| %s | %s | %s |\" % h for h\
  \ in res[\"held\"]]\n    if res[\"excluded\"]:\n        L += [\"\", \"## Not counted\
  \ this period\", \"\", \"| Deal | Account | Reason |\", \"|---|---|---|\"]\n   \
  \     L += [\"| %s | %s | %s |\" % h for h in res[\"excluded\"]]\n    L += [\"\"\
  , \"## Findings\", \"\"]\n    L += [\"- **%s %s** %s\" % (s.upper(), code, m) for\
  \ s, code, m, _ in F] or [\"- none\"]\n    L += [\"\", \"Recompute check: commission\
  \ per deal = sum of (credit in each tier band x tier rate); payout = commission\
  \ + SPIFFs - cap - deferred - clawbacks + carry-in, then draw rules. Have sales\
  \ ops and payroll approve before paying.\"]\n    return \"\\n\".join(L) + \"\\n\"\
  \n\n\ndef to_json(res):\n    def j(x):\n        if isinstance(x, Decimal):\n   \
  \         return float(money(x))\n        if isinstance(x, datetime.date):\n   \
  \         return x.isoformat()\n        if isinstance(x, dict):\n            return\
  \ {k: j(v) for k, v in x.items()}\n        if isinstance(x, (list, tuple)):\n  \
  \          return [j(v) for v in x]\n        return x\n    out = {\"period\": res[\"\
  plan\"][\"label\"], \"reps\": [], \"held\": [list(h) for h in res[\"held\"]], \"\
  excluded\": [list(h) for h in res[\"excluded\"]],\n           \"clawbacks\": j(res[\"\
  clawbacks\"]), \"findings\": [{\"severity\": s, \"code\": c, \"message\": m} for\
  \ s, c, m, _ in res[\"findings\"]]}\n    for r in res[\"reps\"]:\n        rr = {k:\
  \ v for k, v in r.items() if k != \"deals\"}\n        rr[\"attainment\"] = round(float(r[\"\
  attainment\"]), 4)\n        rr = j(rr)\n        rr[\"deals\"] = [j({k: v for k,\
  \ v in d.items() if k not in (\"att_after\",)}) for d in r[\"deals\"]]\n       \
  \ out[\"reps\"].append(rr)\n    return out\n\n\n# ----------------------------------------------------------------\
  \ self-test\ndef self_test():\n    tests = []\n    def t(name, cond):\n        tests.append((name,\
  \ bool(cond)))\n    base = {\"period\": {\"start\": \"2026-10-01\", \"end\": \"\
  2026-10-31\"}, \"tiers\": [{\"up_to\": 0.5, \"rate\": 0.05}, {\"up_to\": 1.0, \"\
  rate\": 0.08}, {\"rate\": 0.12}],\n            \"reps\": {\"a\": {\"quota\": 10000},\
  \ \"b\": {\"quota\": 10000}}}\n    H = \"deal_id,close_date,owner_split,type,amount,discount_pct,billing,status,cancel_date,commission_paid,approved,collected\\\
  n\"\n    def run(rows, **over):\n        cfg = dict(base); cfg.update(over)\n  \
  \      return compute(load_plan(cfg), H + rows)\n    def rep(res, rid):\n      \
  \  return next(r for r in res[\"reps\"] if r[\"id\"] == rid)\n    def codes(res):\n\
  \        return [(f[0], f[1]) for f in res[\"findings\"]]\n    r = run(\"1,2026-10-05,a,new,4000,,,won,,,,\\\
  n\")\n    t(\"below first threshold: 4000 x 5% = 200\", rep(r, \"a\")[\"commission\"\
  ] == Decimal(\"200.00\"))\n    r = run(\"1,2026-10-05,a,new,12000,,,won,,,,\\n\"\
  )\n    t(\"marginal: 5000x5% + 5000x8% + 2000x12% = 890\", rep(r, \"a\")[\"commission\"\
  ] == Decimal(\"890.00\"))\n    r = run(\"1,2026-10-05,a,new,12000,,,won,,,,\\n\"\
  , tier_method=\"flat\")\n    t(\"flat: 12000 x 12% = 1440\", rep(r, \"a\")[\"commission\"\
  ] == Decimal(\"1440.00\"))\n    r = run(\"1,2026-10-05,a,new,6000,,,won,,,,\\n2,2026-10-20,a,new,6000,,,won,,,,\\\
  n\")\n    t(\"tiers follow close order across deals\", [d[\"commission\"] for d\
  \ in rep(r, \"a\")[\"deals\"]] == [Decimal(\"330.00\"), Decimal(\"560.00\")])\n\
  \    t(\"accelerator reached -> CM07\", (\"info\", \"CM07\") in codes(r))\n    r\
  \ = run(\"1,2026-10-05,a,new,30000,,,won,,,,\\n\", credit_cap_attainment=2.0)\n\
  \    t(\"credit cap at 200%: 250+400+1200 = 1850\", rep(r, \"a\")[\"commission\"\
  ] == Decimal(\"1850.00\") and (\"info\", \"CM06\") in codes(r))\n    r = run(\"\
  1,2026-10-05,a,new,30000,,,won,,,,\\n\", max_payout=1000)\n    t(\"max_payout caps\
  \ the payout\", rep(r, \"a\")[\"payout\"] == Decimal(\"1000.00\"))\n    r = run(\"\
  1,2026-10-05,a,renewal,10000,,,won,,,,\\n\", deal_type_credit={\"new\": 1, \"renewal\"\
  : 0.5})\n    t(\"renewal credited at 50%\", rep(r, \"a\")[\"credit\"] == Decimal(\"\
  5000\") and rep(r, \"a\")[\"commission\"] == Decimal(\"250.00\"))\n    r = run(\"\
  1,2026-10-05,a:60;b:40,new,10000,,,won,,,,\\n\")\n    t(\"split 60/40 credits both\
  \ reps\", rep(r, \"a\")[\"credit\"] == Decimal(\"6000\") and rep(r, \"b\")[\"credit\"\
  ] == Decimal(\"4000\"))\n    r = run(\"1,2026-10-05,a:60;b:30,new,10000,,,won,,,,\\\
  n\")\n    t(\"split not 100% -> CM02 high, held\", (\"high\", \"CM02\") in codes(r)\
  \ and rep(r, \"a\")[\"credit\"] == 0 and r[\"held\"])\n    r = run(\"1,2026-10-05,zed,new,10000,,,won,,,,\\\
  n\")\n    t(\"unknown rep -> CM01 high\", (\"high\", \"CM01\") in codes(r))\n  \
  \  r = run(\"1,2026-10-05,a,new,10000,30,,won,,,,\\n\", max_discount_pct=20)\n \
  \   t(\"discount over limit unapproved -> CM05 held\", (\"medium\", \"CM05\") in\
  \ codes(r) and rep(r, \"a\")[\"credit\"] == 0)\n    r = run(\"1,2026-10-05,a,new,10000,30,,won,,,yes,\\\
