  n\", clawback={\"window_days\": 90})\n    t(\"cancelled after window -> no clawback\"\
  , rep(r, \"a\")[\"clawbacks\"] == 0 and (\"low\", \"CM08\") in codes(r))\n    r\
  \ = run(\"9,2026-09-20,a,new,8000,,,cancelled,2026-10-10,,,\\n\", clawback={\"window_days\"\
