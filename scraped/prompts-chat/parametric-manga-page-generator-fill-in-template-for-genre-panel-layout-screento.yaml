slug: parametric-manga-page-generator-fill-in-template-for-genre-panel-layout-screento
title: 'Parametric Manga Page Generator: Fill-in Template for Genre, Panel Layout,
  Screentones, SFX and Reading Direction'
description: Imported from Prompts Chat
prompt: "Create a clean, coherent Japanese manga page based on the following parameters.\n\
  \nVARIABLES\nTOPIC: <string describing the core idea or situation of the manga page>\n\
  CHARACTERS: <optional string describing character(s); if empty, invent suitable\
  \ character(s) based on TOPIC>\nGENRE: <manga demographic/genre, e.g. shonen action,\
  \ shojo romance, seinen drama, slice of life, horror, 4-koma gag>\nPANEL_COUNT:\
  \ <number of panels, e.g. 4, 5, 6, 7>\nPAGE_LAYOUT: <layout approach, e.g. dynamic\
  \ mixed-size panels, 4-koma vertical strip, one splash panel + small panels, uniform\
  \ grid>\nREADING_DIRECTION: <right-to-left (traditional) | left-to-right>\nTONE_STYLE:\
  \ <rendering approach, e.g. pure black and white ink, ink with screentones, ink\
  \ with one spot color, full color>\nART_STYLE: <line and drawing style, e.g. clean\
  \ thin lines, bold brush inking, sketchy G-pen, retro 90s manga, soft shojo linework>\n\
  MOOD: <overall emotional tone, e.g. tense, melancholic, comedic, heartwarming, eerie>\n\
  NARRATION_MODE: <visual | visual+text | text-led>\nTEXT_LANGUAGE: <language of all\
  \ in-panel text, e.g. English, Japanese>\nSFX: <none | minimal | expressive>\nSIGNATURE:\
  \ <optional signature text and placement, e.g. \"Koda, bottom-left\"; if empty,\
  \ do not add a signature>\n\nINSTRUCTIONS\n1. Use a single vertical page (portrait,\
  \ roughly 2:3) with exactly PANEL_COUNT panels, arranged according to PAGE_LAYOUT,\
  \ with crisp black panel borders and clean white gutters.\n2. Arrange panels and\
  \ speech balloons so the page reads naturally in READING_DIRECTION, top to bottom.\n\
  3. Interpret TOPIC as the narrative anchor and invent a short story that unfolds\
  \ across the panels.\n4. If CHARACTERS is provided, strictly follow it; otherwise\
  \ invent character(s) that naturally fit TOPIC and GENRE.\n5. Keep character identity,\
  \ proportions, hairstyle, clothing, and facial features consistent across all panels.\n\
  6. Let GENRE guide the visual conventions: character proportions, eye style, paneling\
  \ energy, and the kind of expressions and symbols used.\n7. Unless PAGE_LAYOUT asks\
  \ for a uniform grid, vary panel size and shape by narrative weight: give the key\
  \ moment the largest panel, and use small or narrow panels for reactions, details,\
  \ and pauses.\n8. Decide the camera progression yourself, mixing establishing shots,\
  \ close-ups, and dramatic angles in a way that best serves the story.\n9. Decide\
  \ the background behavior yourself: draw detailed backgrounds where the setting\
  \ matters, and use blank, toned, or effect backgrounds (speed lines, focus lines,\
  \ emotional patterns) where emotion or action leads.\n10. Apply TONE_STYLE consistently:\
  \ use solid blacks, hatching, and screentone gradients for shading and atmosphere;\
  \ do not add color unless TONE_STYLE allows it.\n11. Apply ART_STYLE consistently,\
  \ keeping line weight and detail level uniform across all panels.\n12. Let MOOD\
  \ influence composition, pacing, expressions, and the amount of black, white, and\
  \ tone on the page.\n13. Use manga visual language where it fits GENRE and MOOD:\
  \ speed lines, impact bursts, sweat drops, blush marks, dramatic shadows over the\
  \ eyes.\n14. Follow NARRATION_MODE strictly:\n    - If visual: include no balloons\
  \ or captions and rely entirely on imagery.\n    - If visual+text: decide which\
  \ panels include text and which remain silent.\n    - If text-led: include text\
  \ in most or all panels, with visuals supporting the narration.\n15. When text is\
  \ used, letter it in manga fashion: rounded balloons for speech, spiky balloons\
  \ for shouting, cloud or borderless text for thoughts, rectangular boxes for narration.\n\
  16. Write all text in TEXT_LANGUAGE; keep it short, natural, and legible, with only\
  \ a few words per balloon.\n17. Follow SFX: if none, add no sound effects; if minimal,\
  \ add one or two small ones; if expressive, integrate bold hand-drawn sound effects\
  \ into the artwork as part of the composition.\n18. Ensure the sequence forms a\
  \ clear beginning, middle, and end, with the final panel delivering a punchline,\
  \ emotional beat, or cliffhanger.\n19. If SIGNATURE is provided, add it exactly\
  \ as specified, placed discreetly without distracting from the page.\n20. Avoid\
  \ unnecessary elements, visual clutter, and garbled or pseudo-text.\n21. Ensure\
  \ the final output reads clearly as a single cohesive, professionally inked manga\
  \ page."
