title: 'Ink-Burst Fox Spirit Transformation: Painted 2.5D Animation (15s Video)'
description: Imported from Prompts Chat
prompt: 'SCENE

  A visceral solo transformation test on a charcoal-gray studio stage. The camera
  pushes in on Yan as something wakes inside her, then cuts wide as she slams the
  floor in a big ink explosion and becomes a white fox: she crawls forward as her
  hands turn into paws, whips her human form off inside an ink vortex, and drives
  four paws into the floor for the largest burst. She holds a stalking stance and
  growls. Ink and paint carry all of the energy, building from strong to strongest.


  REFERENCES

  @Image 1 - Yan: adult woman, amber-brown eyes, untidy black hair with an uneven
  fringe, patched oatmeal wrap with faded green trim and a loose collar, brown waist
  tie, ragged dark sage skirt with a muddy hem, worn brown shoes, tied cloth bundle.
  Use it for her face, costume and painted finish. Her pose, gaze and every action
  come from this prompt.

  @Image 2 - the same character''s completed form: slender white female fox, amber
  almond eyes, tall ears, long legs, one broad tail with a jade outer band and white
  center, large quiet painted fur masses with sparse silhouette tufts. Use it for
  design. Her stance and gaze come from this prompt.


  FIRST FRAME

  Full-body Yan from @Image 1, centered and facing the camera, already mid-stagger:
  hunched, one hand clutching the wrap over her chest, shoulders heaving, head bowed
  so her hair falls forward over her face. Her tied bundle lies on the floor beside
  her feet at picture-left. Charcoal-gray stage.


  FORMAT

  15 seconds, portrait 3:4. Two shots with one hard cut at 3.0s. C1 is short and the
  cut lands at 3.0s on her drop. Each shot runs continuously.


  CAMERA

  C1 (0.0-3.0s): 47° field of view, eye level. Starts on her full body and dollies
  straight in, fast and smooth, reaching a bust shot (head and shoulders) by 2.0s,
  then holds on her face.

  C2 (3.0-15.0s): wide shot, 47° field of view, camera slightly above her and looking
  a little down at the floor contacts. Constant distance. The camera pans slowly with
  her travel toward screen-right so her entire body and tail stay inside generous
  frame margins. A hard jolt on each impact, the biggest on the final one. During
  the slowdown (8.8-10.0s), one smooth arc of about 15 degrees, same side of the action,
  settling on a three-quarter front view of the fox facing screen-right. From 10.0s
  to the end, a very slow creep-in that keeps her whole body and tail in frame. Lens
  stays at 47° throughout.


  TIMELINE

  0.0s to 3.0s - CUT C1 - PUSH-IN

  The camera dollies in from full body to bust as Yan staggers to a stop, breath ragged,
  shoulders heaving. At about 2.0s she lifts her head and stares straight into the
  lens. Her brown irises turn fox amber and her pupils narrow to thin vertical slits;
  her upper lip lifts off clenched teeth. At 2.7s she drops sharply down out of the
  bottom of the frame.


  3.0s HARD CUT


  3.0s to 15.0s - CUT C2 - WIDE

  3.0-4.2s: FIRST IMPACT, already strong. Full-body Yan, left of center, lands in
  a deep crouch and drives both palms into the floor. A huge fan of black ink and
  jade paint explodes upward and outward from her hands, rising about twice her standing
  height and reaching both side edges of the frame, with jagged spikes and flying
  droplets. The stage behind her drops to near black for a split-second hit-stop so
  the ink reads at full contrast; her hair and sleeves blast upward. Release sharply.
  The ink rains down and leaves a wide splatter around her.

  4.2-6.5s: Ink still falling, she lifts her head, fox-amber eyes fixed toward screen-right,
  and crawls forward low and heavy, hand over hand, palms and knees always on the
  floor. Each hand plant stamps a black ink print. White fur floods down her forearms
  from under the sleeves and her fingers fuse into white forepaws with dark claws.

  6.5-8.0s: SECOND IMPACT, bigger: she whips her whole body in a violent shake from
  head to hips. A tight vortex of black and jade ink spins up around her, taller than
  she is, hiding her body for a beat. Inside the spin her clothes, shoes and hair
  dissolve into the swirling ink, her hair turns white into the neck ruff, her face
  lengthens into the fox muzzle and one broad jade-edged tail sweeps out. Every scrap
  of cloth becomes ink.

  8.0-8.5s: The vortex snaps inward and the complete fox stands inside it on four
  planted paws. She sinks her full weight down hard through all four legs into the
  floor.

  At 8.5s: THIRD AND LARGEST IMPACT, the biggest of all: a radial explosion of saturated
  magenta and jade paint, black ink, jagged white lightning strokes and a broad ground
  shockwave fills the entire frame, edge to edge, around the fox. Keep this strike
  sharp and full speed, followed by a hit-stop of about 0.3s. From 8.8-10.0s the paint
  keeps expanding at roughly 70 percent speed during the camera arc while she settles
  into her stance. Restore full speed by 10.0s.

  10.0-15.0s: The burst tears apart into falling ink droplets, and the floor around
  her paws is splattered magenta and jade. She holds a stalking stance: standing on
  all four long legs, belly held well clear of the floor, shoulders and head lowered
  to the same height, neck reaching forward, near forepaw extended forward, tail extended
  low behind her. Her amber eyes stay fixed off-screen right. At about 11.5s her ears
  pin back, the ruff bristles, her lip peels back from bared teeth and a low, rough
  growl builds, then pulses once harder. Small tense weight shifts keep her alive;
  she holds the standing stance through the final frame.


  PERFORMANCE

  Driven and predatory from the first frame: compressed anticipation, explosive release,
  heavy follow-through. Every effect is triggered by a body action: palms, shake,
  paws driven down. She is heavy and grounded the whole time; she travels only by
  crawling, and her weight stays pressed into the floor. Her face stays visible and
  active until the vortex, eyes always locked on a target: the lens in C1, screen-right
  in C2.


  PHYSICS

  One connected, opaque body with continuous ground contact through all of C2. Hands
  plant before they become paws. Cloth turns to liquid ink as it leaves her body;
  the ink spins, flies outward with weight and splashes on the floor. The fox''s four
  paws stay planted from 8.0s to the end. The tied bundle stays at its floor position,
  unchanged. Ink fills the background and surroundings while her silhouette stays
  readable against it.


  LIGHTING

  Neutral top-front studio light on a charcoal-gray stage, 5600K, readable contrast.
  On each impact the stage behind her drops to near black for the hit-stop, a little
  deeper each time, and a hard white flash rims her silhouette. Her skin, clothes,
  eyes and fur carry only neutral light and shadow; her eyes are matte painted amber,
  lit like the rest of her face. All color in the frame comes from the ink and paint
  pigment. Readable white fur, amber eyes and jade tail markings return as the energy
  decays.


  AUDIO

  0.0s to 3.0s - CUT C1 - AUDIO

  SPOKEN DIALOGUE: NONE

  Ragged breathing, two heavy heartbeat thumps, a low rumble rising as the camera
  closes in, a sharp whoosh as she drops.

  3.0s to 15.0s - CUT C2 - AUDIO

  SPOKEN DIALOGUE: NONE

  Three bass impacts, each heavier than the last. Palm slap with a deep impact and
  a big wet ink explosion. Heavy padded contacts and wet ink stamps on the crawl.
  The shake: a ripping cloth tear swallowed by a spinning wet whoosh. The final burst:
  the heaviest impact, an electrical lightning crack and tearing brush-stroke whooshes,
  with the trailing rumble stretched through the slowdown. Then pattering ink droplets,
  a low rough breathy fox growl that pulses once harder, and tense breathing. Foley
  and impacts only; the growl is the only animal vocal.


  STYLE

  Graphic 2.5D painted animation. Broad gouache masses, matte hair and fur, shaped
  shadows and selective facial modeling. Worn cloth and repairs stay visible until
  the vortex. The fox has large quiet fur masses, minimal internal facets and sparse
  silhouette tufts. Thick calligraphic black ink, ragged jade and magenta paint fans,
  sharp motion smears. Brief posterized impact frames punctuate fluid follow-through;
  surface brushwork stays stable.


  FINAL STATE

  One complete white fox from @Image 2, fully visible in a three-quarter front view
  angled toward screen-right, standing in the stalking stance: four legs standing,
  near forepaw extended, head and shoulders low, tail extended low behind. Ears pinned
  back, lip curled off bared teeth, amber eyes fixed off-screen right. Ink droplets
  drift down; magenta and jade splatter marks the floor. The growl fades into tense
  breathing.


  LOCKS

  One character, one transformation, one fox with four legs and one tail at the end.
  One cut, at 3.0s. Whole body and entire tail inside the frame for all of C2. Effects
  escalate: strong at the palm strike, bigger in the vortex, largest at 8.5s. All
  four paws stay on the floor from 8.0s to the end. Light on her body is always neutral;
  magenta appears only as ink and paint. Clothing becomes ink entirely; the floor
  holds only ink splatter. The tied bundle stays on the floor where it started. Clean
  frame without text or logos.'
