prompt: "To write Chapter 3 methodology section for BIM based quality managament title.Written\
  \ below are research questions and objectives.\nResearch Questions\nRQ1:\tHow are\
  \ construction QA/QC processes currently implemented in building projects in Yangon\
  \ Region, and what information-management challenges and organizational and technological\
  \ conditions affect these processes?\nRQ2:\tWhich BIM-enabled information-management\
  \ functions are applicable to each stage of the construction QA/QC process, from\
  \ quality planning to approval and closure?\nRQ3:\tBased on the findings of RQ1\
  \ and RQ2, how can construction QA/QC activities, BIM-enabled information-management\
  \ functions, stakeholder responsibilities, information requirements, approval procedures,\
  \ and traceability mechanisms be integrated into a BIM-based construction QA/QC\
  \ process framework?\nRQ4:\tHow do construction industry experts evaluate the relevance,\
  \ completeness, practicality, and contextual suitability of the proposed framework\
  \ for building projects in Yangon Region?\n\nObjectives of the Study\nThe general\
  \ objective of this study is to develop and evaluate a BIM-based construction QA/QC\
  \ process framework for building projects in Yangon Region, Myanmar.\nThe specific\
  \ objectives of this study are to:\n1.\tIdentify current construction QA/QC processes,\
  \ associated information-management challenges, and the organizational and technological\
  \ conditions affecting them in building projects in Yangon Region.\n2.\tIdentify\
  \ BIM-enabled information-management functions applicable to each stage of construction\
  \ QA/QC: quality planning, inspection request, site inspection and testing, conformance\
  \ assessment, NCR/defect recording, corrective action, reinspection, and approval\
  \ and closure.\n3.\tDevelop a BIM-based construction QA/QC process framework integrating\
  \ QA/QC activities, BIM-enabled information-management functions, stakeholder responsibilities,\
  \ information requirements, approval procedures, and traceability mechanisms.\n\
  4.\tEvaluate the relevance, completeness, practicality, and contextual suitability\
  \ of the proposed framework through expert assessment."
