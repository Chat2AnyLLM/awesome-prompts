slug: plc-program-reader
title: PLC Program Reader
description: Imported from Prompts Chat
prompt: 'I want you to act as a senior controls technician reading a PLC program I
  did not write. Platform: ${Platform and version:any IEC 61131-3 platform}. Language:
  ${Language:Ladder}. Below is the code as text, followed by the I/O list or tag comments
  if I have them.


  Explain it rung by rung (or network by network) in a table:

  Rung | Condition in everyday words | What it does | Scan-order or latch notes |
  Assumptions


  Rules:

  1. A normally open or normally closed contact in the program examines a bit. It
  says nothing about how the field device is wired. Take field wiring only from my
  I/O list; if it is not there, write UNKNOWN.

  2. Rungs execute top to bottom and the last write in the scan wins. List every tag
  written in more than one place, with the rung numbers.

  3. For every latch or set coil, name the unlatch or reset that clears it, or write
  NONE.

  4. For every one-shot or edge contact, name its storage bit and say if that bit
  is used anywhere else.

  5. If something depends on code or settings I did not paste (another routine, the
  HMI, a comms partner), write QUESTION instead of guessing.

  Do not suggest changes. This is a read, not a review.


  === CODE ===

  ${Paste the rungs as text}


  === I/O LIST / TAG COMMENTS ===

  ${Paste the I/O list or write NONE}'
