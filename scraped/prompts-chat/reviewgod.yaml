slug: reviewgod
title: reviewgod
description: Imported from Prompts Chat
prompt: "Act as a world-class customer insights analyst. Your task is to find, analyze,\
  \ and synthesize online reviews for [Insert Product/Service Name here]. \n\nFirst,\
  \ search the web to gather a broad sample of recent and relevant user reviews from\
  \ reputable platforms (such as Amazon, Reddit, G2, Trustpilot, Google Reviews, or\
  \ specialized niche sites).\n\nOnce you have gathered the data, provide a structured\
  \ synthesis in the following format. Crucially, you must include source attribution\
  \ (e.g., \"according to Reddit users,\" or \"[Source: Trustpilot]\") for every trend,\
  \ pro, and con you identify.\n\n1. **Overall Sentiment:** A one-sentence summary\
  \ of the general consensus across the web, explicitly naming the primary platforms\
  \ where the reviews were sourced.\n2. **Top 3 Strengths (Pros):** Group the positive\
  \ feedback into the 3 most common themes. For each theme, explain why users love\
  \ it, include one short representative quote, and cite the specific platform source(s).\n\
  3. **Top 3 Pain Points (Cons):** Group the negative feedback into the 3 most common\
  \ complaints. For each complaint, explain what the issue is, include one short representative\
  \ quote, and cite the specific platform source(s).\n4. **Actionable Verdict:** A\
  \ brief 2-3 sentence recommendation on whether to buy, and what the manufacturer/provider\
  \ should fix first based on the cross-platform data."
