title: Ukiyo-e Woodblock Print of a River Ferry Crossing in Autumn Rain
description: Imported from Prompts Chat
prompt: A Japanese ukiyo-e woodblock print of a small wooden ferry boat crossing a
  wide, calm river in autumn rain, in a wide landscape 16:9 composition on warm beige
  paper with visible fibers and wood grain texture. A long, low wooden boat sits in
  the center right of the frame, carrying three seated passengers under round oiled
  paper umbrellas, from left to right one vermilion red, one deep indigo blue, and
  one ochre yellow, the passengers wearing simple robes in indigo, ochre, and rust.
  At the stern on the right, a ferryman stands in a pale blue-grey robe and a wide
  conical straw hat, pushing a long wooden pole diagonally into the water. In the
  upper left, a red maple tree reaches into the frame with clusters of bright orange-red
  leaves, above a grassy, rocky near bank with tall reeds in the lower left. In the
  background, a misty grey-blue volcano-shaped mountain rises behind a hazy far shore
  with soft tree silhouettes on the right. Fine diagonal rain lines fall across the
  whole scene, the river shows gentle horizontal ripple lines, and the sky has a soft
  bokashi gradient from dark slate grey at the top to pale beige near the horizon.
  Flat color areas, fine black outlines, muted indigo, ochre, vermilion, and grey
  palette, quiet and contemplative mood. No text, no seals, no signature, no border.
