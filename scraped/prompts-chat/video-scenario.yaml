prompt: "TASK: Creative Concept & Full Script for a Corporate Christmas Gift Campaign\n\
  \nAct as an experienced Creative Director, Advertising Scriptwriter, and Social\
  \ Media Video Producer.\n\nI need you to develop a professional, creative, and commercially\
  \ effective video concept and full shooting script for a company specializing in\
  \ customized corporate Christmas gift boxes.\n\n1. Company Profile & Services\n\n\
  The company offers:\n\n* Custom-designed corporate gift boxes.\n* Personalized gift\
  \ selections based on each company’s preferences, budget, and brand identity.\n\
  * Customized packaging and branding.\n* Tailor-made gift solutions for employees,\
  \ business partners, clients, and executives.\n* Both ready-made gift concepts and\
  \ fully customized orders.\n\nThe key selling point is that every gift can be individually\
  \ tailored to the company’s needs, preferences, and budget.\n\n2. Main Objective\n\
  \nThe video should target:\n\n* Company owners and CEOs.\n* HR managers.\n* Marketing\
  \ and communications teams.\n* Business representatives responsible for corporate\
  \ gifting.\n\nThe objective is to encourage companies to place their Christmas and\
  \ New Year corporate gift orders.\n\nThe video should sell more than just gift boxes.\
  \ It should communicate the value of appreciation, meaningful gestures, business\
  \ relationships, and thoughtful gifting.\n\n3. My Contribution & On-Camera Role\n\
  \nI will personally participate in the video.\n\nMy role should go beyond simply\
  \ presenting the products. I want to appear as a confident, engaging person who\
  \ communicates directly with the audience and explains why personalized corporate\
  \ gifting matters.\n\nMy on-camera presence should feel:\n\n* Natural and authentic.\n\
  * Confident but not overly promotional.\n* Friendly, sophisticated, and engaging.\n\
  * Professional without sounding corporate or scripted.\n* Persuasive without being\
  \ pushy.\n\nWrite my dialogue in a way that sounds natural when spoken directly\
  \ to the camera.\n\nI want my contribution to be meaningful and integrated into\
  \ the creative concept, not just an appearance inserted into the video.\n\n4. What\
  \ I Need You to Deliver\n\nDevelop the following:\n\n1. Main Creative Concept: Create\
  \ a strong central idea and creative direction for the campaign.\n2. Three Different\
  \ Video Concepts:\n    * Elegant, emotional, and premium.\n    * Modern, dynamic,\
  \ and sales-oriented.\n    * Creative, engaging, and memorable.\n3. Complete Shooting\
  \ Script: Break down each concept scene by scene, including timing and duration.\n\
  4. My On-Camera Dialogue: Write the exact words I should say, including opening\
  \ lines, transitions, and closing statements.\n5. B-Roll & Product Shots: Suggest\
  \ detailed shots of:\n    * Selecting products.\n    * Arranging gift boxes.\n \
  \   * Packaging and wrapping.\n    * Tying ribbons.\n    * Adding personalized elements.\n\
  \    * Showing finished gift boxes.\n    * Close-up shots of textures, details,\
  \ and presentation.\n6. Visual Storytelling: Show how my direct-to-camera appearance\
  \ should alternate with product footage and behind-the-scenes scenes.\n7. Strong\
  \ Opening Hook: The first 3 seconds must immediately capture attention and make\
  \ the viewer want to continue watching.\n8. Call to Action: Create a compelling\
  \ ending that encourages businesses to contact the company, request a quotation,\
  \ or place an order.\n9. On-Screen Text: Suggest short, impactful overlay texts\
  \ for each scene.\n10. Production & Editing Direction: Specify camera angles, framing,\
  \ transitions, editing rhythm, music style, lighting, and overall visual atmosphere.\n\
  \n5. Technical Requirements\n\n* Duration: 45–60 seconds.\n* Format: Vertical 9:16.\n\
  * Platforms: Instagram Reels, Facebook Reels, and TikTok.\n* Visual aesthetic: Festive,\
  \ elegant, sophisticated, modern, and premium.\n* Production: Low-budget and realistically\
  \ achievable without complicated equipment or elaborate setups.\n\n6. Creative Guidelines\n\
  \n* Avoid generic Christmas advertising clichés.\n* Avoid overly sentimental, exaggerated,\
  \ or artificial dialogue.\n* Do not make the video look like a simple product catalogue.\n\
  * Focus on storytelling, emotional connection, and commercial value.\n* Clearly\
  \ communicate that every corporate gift can be customized according to the client’s\
  \ needs, preferences, and budget.\n* Make the video feel like a professionally produced\
  \ brand campaign rather than a typical social media advertisement.\n\n7. Final Deliverable\n\
  \nI expect a complete, production-ready creative package.\n\nFor every scene, specify:\n\
  \n* Exact duration.\n* What appears on screen.\n* Whether I am speaking or whether\
  \ it is a voice-over.\n* My exact dialogue.\n* Camera angle and movement.\n* Product\
  \ shots and supporting footage.\n* On-screen text.\n* Editing and transition suggestions.\n\
  \nThink like a high-level advertising agency creative team. Prioritize originality,\
  \ visual storytelling, audience engagement, brand positioning, and conversion.\n\
  \nThe final result should make corporate decision-makers think:\n\n“This is exactly\
  \ the kind of thoughtful, personalized Christmas gifting solution we need for our\
  \ company.”"
