  n\").lines[0][\"paid\"] == {\"Ana\": 4000, \"Ben\": 2000})\n    case(\"several payers\
  \ must add up\", lambda: raises(lambda: L(\",Train,Ana:40;Ben:10,60,,equal,Ana;Ben,\\\
  n\")))\n    case(\"refund (negative amount)\", lambda: nets(L(\",Museum refund,Ben,-24,,equal,Ben;Cem,\\\
  n\")) == {\"Ben\": -1200, \"Cem\": 1200})\n    case(\"currency conversion\", lambda:\
  \ L(\",Surf,Ana,100,USD,equal,Ana;Ben,\\n\", rates=\"USD=0.92\").lines[0][\"total\"\
  ] == 9200)\n    case(\"rates from comment line\", lambda: Ledger(\"# base: EUR\\\
  n# rates: USD=0.92, GBP=1.16\\n\" + H + \",S,Ana,10,GBP,equal,Ana;Ben,\\n\").lines[0][\"\
  total\"] == 1160)\n    case(\"missing rate rejected\", lambda: raises(lambda: L(\"\
  ,S,Ana,10,CHF,equal,Ana;Ben,\\n\")))\n    case(\"unknown split rejected\", lambda:\
  \ raises(lambda: L(\",S,Ana,10,,halves,Ana;Ben,\\n\")))\n    case(\"strict people\
  \ list rejects typo\", lambda: raises(lambda: Ledger(\"# people: Ana, Ben\\n\" +\
  \ H + \",S,Anna,10,,equal,all,\\n\")))\n    case(\"case-insensitive names merge\"\
  , lambda: L(\",A,Ana,10,,equal,ana;Ben,\\n\").people == [\"Ana\", \"Ben\"])\n  \
  \  case(\"duplicate line warning\", lambda: any(\"duplicate\" in w for w in L(\"\
  1,Taxi,Ana,10,,equal,Ana;Ben,\\n1,Taxi,Ana,10,,equal,Ana;Ben,\\n\").warnings))\n\
  \    case(\"missing columns rejected\", lambda: raises(lambda: Ledger(\"what,who\\\
  nx,y\\n\")))\n    case(\"bad number rejected\", lambda: raises(lambda: L(\",S,Ana,ten,,equal,Ana;Ben,\\\
  n\")))\n    # minimum transfers\n    case(\"zero-sum pairs found (4 people -> 2\
  \ transfers)\", lambda: len(minimal({\"A\": 500, \"B\": -500, \"C\": 300, \"D\"\
  : -300}, list(\"ABCD\"))[0]) == 2)\n    case(\"no zero-sum subgroup -> people -\
  \ 1 transfers\", lambda: len(greedy({\"A\": 600, \"B\": 400, \"C\": -500, \"D\"\
  : -500}, list(\"ABCD\"))) == 3 and len(minimal({\"A\": 600, \"B\": 400, \"C\": -500,\
  \ \"D\": -500}, list(\"ABCD\"))[0]) == 3)\n    case(\"min beats greedy on 6 people\"\
  , lambda: (lambda n: len(minimal(n, list(\"ABCDEF\"))[0]) == 4 and len(greedy(n,\
  \ list(\"ABCDEF\"))) == 5)({\"A\": 700, \"B\": 300, \"C\": 250, \"D\": -500, \"\
  E\": -450, \"F\": -300}))\n    case(\"everyone even -> no transfers\", lambda: minimal({\"\
  A\": 0, \"B\": 0}, [\"A\", \"B\"])[0] == [])\n\n    def brute_min(net):\n      \
  \  ps = [p for p in net if net[p]]\n        best = len(ps) - 1 if ps else 0\n  \
  \      for parts in _partitions(ps):\n            if all(sum(net[p] for p in g)\
  \ == 0 for g in parts):\n                best = min(best, len(ps) - len(parts))\n\
  \        return best\n\n    def check_random():\n        rnd = random.Random(7)\n\
  \        for _ in range(60):\n            k = rnd.randint(2, 7)\n            vals\
  \ = [rnd.choice([-1, 1]) * rnd.choice([100, 200, 300, 500, 250, 50]) for _ in range(k\
  \ - 1)]\n            vals.append(-sum(vals))\n            net = {chr(65 + i): v\
  \ for i, v in enumerate(vals)}\n            tr = minimal(net, list(net))[0]\n  \
  \          bal = dict(net)\n            for d, c, x in tr:\n                assert\
  \ x > 0\n                bal[d] += x\n                bal[c] -= x\n            if\
  \ any(bal.values()) or len(tr) != brute_min(net):\n                return False\n\
  \        return True\n    case(\"minimal == brute force on 60 random groups and\
  \ settles everyone\", check_random)\n    case(\"transfers settle the example-like\
  \ ledger\", lambda: _settles(L(\",Flat,Ana,840,,shares,,Ana:3;Ben:3;Cem:2\\n,Food,Cem,63.75,,equal,all,\\\
  n,Wine,Ben,36,,percent,,Ana:25;Ben:25;Cem:50\\n\")))\n    case(\"render has transfers\
  \ and chat message\", lambda: \"Message for the group chat\" in render(L(\",Taxi,Ana,10,,equal,Ana;Ben,\\\
  n\")))\n    case(\"detail view\", lambda: \"Detail: Ben\" in render(L(\",Taxi,Ana,10,,equal,Ana;Ben,\\\
  n\"), \"ben\"))\n    case(\"json output\", lambda: as_json(L(\",Taxi,Ana,10,,equal,Ana;Ben,\\\
  n\"))[\"transfers\"] == [{\"from\": \"Ben\", \"to\": \"Ana\", \"cents\": 500}])\n\
  \    case(\"format thousands\", lambda: fmt(123456789, \"EUR\") == \"1,234,567.89\
  \ EUR\" and fmt(-5) == \"-0.05\")\n\n    passed = sum(1 for _, ok, _ in cases if\
  \ ok)\n    for name, ok, err in cases:\n        print((\"PASS \" if ok else \"FAIL\
  \ \") + name + ((\" \" + err) if err else \"\"))\n    print(\"%d/%d passed\" % (passed,\
  \ len(cases)))\n    return 0 if passed == len(cases) else 1\n\n\ndef _partitions(items):\n\
  \    if not items:\n        yield []\n        return\n    first, rest = items[0],\
  \ items[1:]\n    for p in _partitions(rest):\n        for i in range(len(p)):\n\
  \            yield p[:i] + [[first] + p[i]] + p[i + 1:]\n        yield [[first]]\
  \ + p\n\n\ndef _settles(led):\n    b = led.balances()\n    net = {p: b[p][\"net\"\
  ] for p in led.people}\n    for d, c, x in minimal(net, led.people)[0]:\n      \
  \  net[d] += x\n        net[c] -= x\n    return not any(net.values())\n\n\ndef main(argv=None):\n\
  \    ap = argparse.ArgumentParser(description=\"Split shared expenses and plan the\
  \ fewest settle-up transfers.\")\n    ap.add_argument(\"file\", nargs=\"?\", help=\"\
  CSV ledger ('-' = stdin)\")\n    ap.add_argument(\"--base\", default=None, help=\"\
  base currency (default: '# base:' line or EUR)\")\n    ap.add_argument(\"--rates\"\
  , default=None, help=\"USD=0.92,GBP=1.16 (1 unit = rate units of base)\")\n    ap.add_argument(\"\
  --people\", default=None, help=\"comma-separated group members (strict: typos are\
  \ errors)\")\n    ap.add_argument(\"--detail\", default=None, help=\"show the line-by-line\
  \ breakdown for one person\")\n    ap.add_argument(\"--json\", action=\"store_true\"\
  )\n    ap.add_argument(\"--self-test\", action=\"store_true\")\n    a = ap.parse_args(argv)\n\
  \    if a.self_test:\n        return self_test()\n    if not a.file:\n        ap.error(\"\
  give a CSV ledger or --self-test\")\n    try:\n        text = sys.stdin.read() if\
  \ a.file == \"-\" else open(a.file, encoding=\"utf-8-sig\").read()\n        people\
  \ = [p.strip() for p in a.people.split(\",\")] if a.people else None\n        led\
  \ = Ledger(text, a.base, a.rates, people)\n        out = json.dumps(as_json(led),\
  \ indent=2) + \"\\n\" if a.json else render(led, a.detail)\n    except (OSError,\
  \ LedgerError) as e:\n        print(\"error: %s\" % e, file=sys.stderr)\n      \
  \  return 2\n    sys.stdout.write(out)\n    return 0\n\n\nif __name__ == \"__main__\"\
  :\n    sys.exit(main())"
