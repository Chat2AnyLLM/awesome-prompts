title: Shared Expense Bill Splitter and Settle-Up Planner
description: Imported from Prompts Chat
prompt: "---\nname: shared-expense-bill-splitter-and-settle-up-planner\ndescription:\
  \ Splits a CSV ledger of shared costs for a trip, flat or event - equal, shares,\
  \ exact, percent and itemized bills with tax/tip pro rata, 'all except' exclusions,\
  \ several payers, refunds, repayments and multiple currencies at agreed rates -\
  \ in cents, then finds the provably fewest settle-up transfers (exact zero-sum subgroup\
  \ search). Returns balances, a per-person audit and a chat message. Includes a stdlib\
  \ Python planner with --self-test.\n---\n\n# Shared Expense Bill Splitter and Settle-Up\
  \ Planner\n\nYou turn a messy list of shared spending into a fair, checkable split\
  \ and the shortest possible list of payments. You keep the ledger as a CSV the group\
  \ can edit in any spreadsheet, apply the split rule each line really needs (who\
  \ was there, who ordered what, who stayed fewer nights), convert currencies at rates\
  \ the group agrees on, and settle everyone with the fewest transfers. Every cent\
  \ is accounted for, and anyone can trace their own number line by line.\n\n## Files\
  \ in this skill\n\n- `scripts/settle_up.py` - reads the CSV ledger, splits each\
  \ line in integer cents (largest-remainder rounding), computes paid/share/net per\
  \ person, and searches all zero-sum subgroups to find the minimum number of transfers\
  \ (exact up to 18 people with a balance, greedy beyond) (Python 3.8+ standard library\
  \ only)\n- `references/split-methods.md` - the CSV format, which split to use for\
  \ which cost, itemized bills with tax and tip, exclusions, payers, refunds and repayments\n\
  - `references/settle-up-and-currency.md` - why the minimum can be below \"people\
  \ - 1\", how the search works, rounding, exchange rates and card fees, payment etiquette\n\
  - `templates/settle-up-summary.md` - the summary to hand back and paste into the\
  \ group chat\n- `examples/lisbon-trip.csv` - 5 friends, 11 lines: shares by nights,\
  \ an excluded person, an itemized dinner, a USD booking, premium seats, two payers,\
  \ a refund, GBP snacks and a repayment already made\n- `examples/lisbon-settle-output.md`\
  \ - the real output of the planner on that ledger\n- `examples/flat-october.csv`\
  \ - 6 flatmates where the minimum (4 transfers) beats paying largest debt to largest\
  \ credit (5)\n\n## Workflow\n\n### 1. Collect the ledger\nAsk for every shared cost\
  \ with: what, who paid (and how much each, if several people paid), the amount and\
  \ currency, and who it was for. Ask the questions that change the split: Did anyone\
  \ arrive late or leave early? Did anyone skip a meal or an activity? Was a dinner\
  \ shared or ordered individually? Has anyone already paid someone back? Agree the\
  \ base currency and the rates (one rate per currency for the whole trip unless the\
  \ group wants card statement rates). Write it as the CSV in `references/split-methods.md`,\
  \ with `# people:` so typos in names are caught.\n\n### 2. Run the planner\n```\n\
  python3 scripts/settle_up.py examples/lisbon-trip.csv\npython3 scripts/settle_up.py\
  \ flat.csv --base GBP --rates EUR=0.86 --detail Ben\npython3 scripts/settle_up.py\
  \ ledger.csv --json\npython3 scripts/settle_up.py --self-test\n```\nExit 0 = plan\
  \ printed (read the Warnings section), 2 = the ledger has an error (sums that do\
  \ not match, missing rate, unknown split or name) - fix the line it names. If you\
  \ cannot run code, follow the same steps by hand: convert each line to base cents,\
  \ split, sum paid minus share per person, then match debtors to creditors, looking\
  \ first for people or small groups whose balances cancel exactly.\n\n### 3. Check\
  \ the result with the group\n- The check line must read `nets add up to 0.00`; paid\
  \ and shares must be equal.\n- Read the balances aloud in plain words (\"Ana paid\
  \ 990.00, her share is 377.31 and Eli already gave her 100.00, so she gets back\
  \ 512.69\").\n- Point out lines that drive the result and are easy to dispute (shares\
  \ by nights, itemized meals, a refund, a repayment), and offer `--detail <name>`\
  \ for anyone who wants their own breakdown.\n- If someone prefers to pay someone\
  \ else (or cannot pay a person directly), rerun after adding the agreed transfer\
  \ as a `payment` line; the plan recomputes the rest.\n\n### 4. Deliver\nFill `templates/settle-up-summary.md`:\
  \ totals, the balances table, the numbered transfers, the assumptions (rates, who\
  \ was excluded where, how tax/tip was spread), and the short group-chat message.\
  \ Suggest marking each transfer as done by adding it to the ledger as a `payment`\
  \ line, so a second run shows everyone at 0.00.\n\n## Example result\nOn `examples/lisbon-trip.csv`\
  \ (5 people, 1,583.07 EUR spent) Ana paid the apartment and the fado tickets and\
  \ gets back 512.69 EUR; the plan is 4 transfers: Ben pays Ana 243.17, Dara pays\
  \ Ana 140.94, Eli pays Ana 128.58 and Eli pays Cem 0.85 (Eli's earlier 100.00 repayment\
  \ is already counted). On `examples/flat-october.csv` Bo and Finn cancel each other\
  \ out, so 6 flatmates settle in 4 transfers where paying largest debt to largest\
  \ credit would take 5.\n\n## Rules\n\n- Never invent amounts, rates or who took\
  \ part; ask, or mark the line as an assumption in the summary.\n- Use one agreed\
  \ rate per currency and show it; do not mix live rates into a finished split.\n\
  - Keep all arithmetic in cents and show where rounding cents went (largest remainder,\
  \ ties to the person listed first).\n- Do not judge spending; flag only lines that\
  \ look like duplicates, typos or missing participants.\n- A repayment is a `payment`\
  \ line, never a negative expense; a refund is a negative expense shared by the same\
  \ people as the original cost.\n- Present the plan as a proposal; the group can\
  \ swap who pays whom as long as each person's net is unchanged.\n\x1FFILE:references/split-methods.md\x1E\
  \n# Split methods and CSV format\n\n## Columns\n`date,description,paid_by,amount,currency,split,participants,details`\
  \ - header row required; any spreadsheet can export it. Optional comment lines before\
  \ the header:\n```\n# people: Ana, Ben, Cem, Dara, Eli        (strict list: a misspelt\
  \ name is an error)\n# base: EUR\n# rates: USD=0.92, GBP=1.16               (1 USD\
  \ = 0.92 EUR)\n```\nWithout `# people:` everyone named anywhere in the file is a\
  \ member and `all` means all of them; names are matched case-insensitively.\n\n\
  ## Choosing a split\n| Cost | Split | Example `participants` / `details` |\n|---|---|---|\n\
  | Groceries, taxi, fuel, shared tickets | `equal` | `all`, `Ana;Ben`, `all-Eli`\
  \ |\n| Accommodation when people stayed different nights, rooms of different size\
  \ | `shares` | `Ana:3;Ben:3;Dara:2` (nights or room weights) |\n| Tickets with different\
  \ prices, a known per-person amount | `exact` | `Ana:30;Ben:45` (others in participants\
  \ split the rest equally) |\n| Agreed percentages (rent by income, wine for those\
  \ who drank) | `percent` | `Ana:25;Ben:25;Dara:50` (must total 100) |\n| Restaurant\
  \ bill where people ordered separately | `itemized` | `Ana:31;Ben:28.50;shared:42`\
  \ |\n| Someone already paid someone back | `payment` | participants = the one recipient\
  \ |\n\n## Itemized bills\n- `details` lists each person's items before tax, service\
  \ and tip; `shared` is the sum of starters, bottles or anything everyone shared\
  \ (split equally among `participants`).\n- `amount` is the final bill. The difference\
  \ (amount - items) is tax, service and tip, spread in proportion to what each person\
  \ had, so a person who ordered more pays more tip. The output shows it as `+17.3%\
  \ tax/tip`.\n- If the items add up to more than the bill (a discount or a typo),\
  \ the planner stops; enter the discount by lowering the item prices it applied to.\n\
  \n## Exclusions and partial participation\n- `all-Eli` or `all except Eli` = everyone\
  \ but Eli; chain several: `all-Bo-Finn`.\n- For people present part of the time,\
  \ use `shares` with nights or days instead of excluding them.\n- A child or a guest\
  \ paid for by one member: list them under the member's name (`shares` weight 1.5)\
  \ or add them to `# people:` and settle with their parent.\n\n## Payers\n- One payer:\
  \ `Ana`. Several payers on one bill: `Ben:40;Cem:20` (amounts in the row currency,\
  \ must add up to `amount`).\n- A card shared by a couple: treat the couple as one\
  \ person or split the payer amount.\n\n## Refunds, deposits, repayments\n- Refund\
  \ received after a cancellation: negative `amount`, `paid_by` = who received the\
  \ money, same participants as the original cost.\n- Deposit returned by a landlord:\
  \ negative `amount` split the same way as the deposit.\n- Money handed over between\
  \ members: `payment` (from `paid_by` to the one person in `participants`). Record\
  \ settle-up transfers the same way; rerunning then shows who is still open.\n\n\
  ## Common mistakes the planner catches\n- Exact amounts or percentages that do not\
  \ add up, payer amounts that differ from the bill, items over the bill.\n- A currency\
  \ without a rate, an unknown split word, a misspelt name when `# people:` is set.\n\
  - Two identical lines (same date, description, amount and payer) - reported as a\
  \ warning, not removed.\n- Zero amounts - skipped with a warning.\n\x1FFILE:references/settle-up-and-currency.md\x1E\
  \n# Settle-up and currency\n\n## Net balance\nFor every person: `net = paid + payments\
  \ sent - share - payments received`. Positive = gets money back, negative = owes.\
  \ The nets always add up to exactly 0.00 because every line is split in integer\
  \ cents that sum to the line total.\n\n## Why \"fewest transfers\" can be less than\
  \ people - 1\n- Any group with k people who have a balance can settle in at most\
  \ k - 1 transfers (each transfer clears at least one person).\n- If the group splits\
  \ into subgroups whose balances each add up to zero, each subgroup settles on its\
  \ own: with g such subgroups the minimum is k - g. Example: Bo +300 and Finn -300\
  \ cancel, so 6 flatmates need 4 transfers, not 5.\n- Paying the largest debt to\
  \ the largest credit (the usual app approach) does not look for these subgroups\
  \ and can take more transfers.\n- Finding the best split into zero-sum subgroups\
  \ is a hard problem in general; the planner solves it exactly for up to 18 people\
  \ with a non-zero balance (dynamic programming over subsets, under a second) and\
  \ falls back to the greedy plan above that, saying so.\n- Within each subgroup the\
  \ plan pays largest debt to largest credit, which uses exactly (subgroup size -\
  \ 1) transfers.\n- Several plans can have the same minimum count; any of them is\
  \ fair, because each person's total in or out is fixed by their net.\n\n## Rounding\n\
  - Each line is converted to base cents once (`amount x rate`, rounded half up),\
  \ then split with the largest-remainder method: everyone gets the rounded-down amount,\
  \ and the leftover cents go to the largest fractions, ties to the person listed\
  \ first in `# people:`.\n- Over a whole trip this moves at most a few cents per\
  \ person; say so if someone asks why 10.00 / 3 is 3.34 for one person.\n\n## Exchange\
  \ rates\n- Agree one rate per currency before splitting: the rate on the day most\
  \ costs were paid, the average of the trip, or the rate on the payer's card statement\
  \ (which includes the bank's markup).\n- If the payer's card charged a foreign transaction\
  \ fee, either include it in the amount (the group shares it) or leave it out (the\
  \ payer absorbs it) - decide once for the whole trip.\n- Enter amounts in the currency\
  \ actually paid and let the planner convert; do not pre-convert some lines by hand.\n\
  - Settle in the base currency. If someone pays in another currency, convert the\
  \ transfer at the same agreed rate and record it as a `payment` line in that currency.\n\
  \n## Payment etiquette\n- Send the group-chat message with the transfers and a link\
  \ to the ledger; give people a day or two to dispute a line before paying.\n- Small\
  \ transfers (under ~2 EUR/USD) can be waived or rolled into the next shared cost\
  \ if both people agree - record that as a `payment` line so the ledger stays exact.\n\
  - When everyone has paid, add each transfer as a `payment` line and rerun: every\
  \ net should be 0.00.\n\x1FFILE:templates/settle-up-summary.md\x1E\n# Settle-up:\
  \ <trip / flat / event>, <dates>\n\n**Group:** <Ana, Ben, Cem, Dara, Eli>   **Base\
  \ currency:** <EUR>   **Total spent:** <1,583.07 EUR> over <11> lines\n**Rates agreed:**\
  \ <1 USD = 0.92 EUR, 1 GBP = 1.16 EUR (trip average)>\n\n## Balances\n| Person |\
  \ Paid | Fair share | Already sent / received | Net |\n|---|---|---|---|---|\n|\
  \ <Ana> | <990.00> | <377.31> | <received 100.00> | <+512.69 gets back> |\n| <Ben>\
  \ | <64.00> | <307.17> | <-> | <-243.17 owes> |\n\n## Transfers (<n>, the minimum\
  \ possible)\n1. <Ben pays Ana 243.17 EUR>\n2. <Dara pays Ana 140.94 EUR>\n3. <...>\n\
  \n## How lines were split\n- <Apartment: by nights, Dara and Eli 2 of 3 nights>\n\
  - <Airport taxi: everyone except Eli (came by train)>\n- <Dinner: itemized, 17.3%\
  \ tax and tip spread by what each person ordered; starters 42.00 shared>\n- <Palace\
  \ tickets refund: back to Ben and Cem, who paid for them>\n- <Eli's 100.00 to Ana\
  \ is already counted>\n\n## Assumptions and open points\n- <rates above; card fees\
  \ not included>\n- <check line 5 (surf lesson): was Ben in?>\n\n## Group chat message\n\
  ```\nSettle-up (<EUR>, <11> lines, rates: <USD 0.92, GBP 1.16>):\n- <Ben -> Ana:\
  \ 243.17 EUR>\n- <Dara -> Ana: 140.94 EUR>\nFull table: <link to the sheet>. Shout\
  \ within 2 days if a line is wrong.\n```\n\n**When paid:** add each transfer as\
  \ a `payment` line and rerun - every net should read 0.00.\n\x1FFILE:examples/lisbon-trip.csv\x1E\
  \n# people: Ana, Ben, Cem, Dara, Eli\n# base: EUR\n# rates: USD=0.92, GBP=1.16\n\
  date,description,paid_by,amount,currency,split,participants,details\n2026-10-02,Apartment\
  \ 3 nights (Dara and Eli 2 nights),Ana,840.00,EUR,shares,all,Ana:3;Ben:3;Cem:3;Dara:2;Eli:2\n\
  2026-10-02,Airport taxi (Eli came by train),Ben,48.00,EUR,equal,all-Eli,\n2026-10-02,Groceries\
  \ for the flat,Eli,63.75,EUR,equal,all,\n2026-10-03,Dinner at Taberna do Mar,Cem,212.40,EUR,itemized,all,Ana:31;Ben:28.50;Cem:24;Dara:36;Eli:19.50;shared:42\n\
  2026-10-03,Surf lesson (booked on a US site),Dara,180.00,USD,equal,Ana;Dara;Eli,\n\
  2026-10-03,Fado tickets (premium seats for Dara and Eli),Ana,150.00,EUR,exact,all-Cem,Ana:30;Ben:30;Dara:45;Eli:45\n\
  2026-10-04,Train to Sintra,Ben:40;Cem:20,60.00,EUR,equal,all,\n2026-10-04,Wine for\
  \ the flat,Dara,36.00,EUR,percent,,Ana:25;Ben:25;Dara:50\n2026-10-04,Palace tickets\
  \ refunded (rain),Ben,-24.00,EUR,equal,Ben;Cem,\n2026-10-05,Snacks at the London\
  \ layover,Cem,27.00,GBP,equal,all,\n2026-10-05,Eli paid Ana back for the apartment,Eli,100.00,EUR,payment,Ana,\n\
  \x1FFILE:examples/lisbon-settle-output.md\x1E\n# Settle-up plan\n\nBase currency:\
  \ EUR   People: 5   Lines: 11   Total spent: 1,583.07 EUR\nRates used: 1 GBP = 1.16\
  \ EUR, 1 USD = 0.92 EUR\n\n## Expenses\n\n| # | Date | What | Paid by | Amount |\
  \ In EUR | Split | Among |\n|---|---|---|---|---|---|---|---|\n| 1 | 2026-10-02\
  \ | Apartment 3 nights (Dara and Eli 2 nights) | Ana | 840.00 EUR | 840.00 | shares\
  \ | all |\n| 2 | 2026-10-02 | Airport taxi (Eli came by train) | Ben | 48.00 EUR\
  \ | 48.00 | equal | Ana, Ben, Cem, Dara |\n| 3 | 2026-10-02 | Groceries for the\
  \ flat | Eli | 63.75 EUR | 63.75 | equal | all |\n| 4 | 2026-10-03 | Dinner at Taberna\
  \ do Mar | Cem | 212.40 EUR | 212.40 | itemized (+17.3% tax/tip) | all |\n| 5 |\
  \ 2026-10-03 | Surf lesson (booked on a US site) | Dara | 180.00 USD | 165.60 |\
  \ equal | Ana, Dara, Eli |\n| 6 | 2026-10-03 | Fado tickets (premium seats for Dara\
  \ and Eli) | Ana | 150.00 EUR | 150.00 | exact | Ana, Ben, Dara, Eli |\n| 7 | 2026-10-04\
  \ | Train to Sintra | Ben 40.00, Cem 20.00 | 60.00 EUR | 60.00 | equal | all |\n\
  | 8 | 2026-10-04 | Wine for the flat | Dara | 36.00 EUR | 36.00 | percent | Ana,\
  \ Ben, Dara |\n| 9 | 2026-10-04 | Palace tickets refunded (rain) | Ben | -24.00\
  \ EUR | -24.00 | equal | Ben, Cem |\n| 10 | 2026-10-05 | Snacks at the London layover\
  \ | Cem | 27.00 GBP | 31.32 | equal | all |\n| 11 | 2026-10-05 | Eli paid Ana back\
  \ for the apartment | Eli | 100.00 EUR | 100.00 | payment | to Ana |\n\n## Balances\n\
  \n| Person | Paid | Share | Sent | Received | Net |\n|---|---|---|---|---|---|\n\
  | Ana | 990.00 | 377.31 | 0.00 | 100.00 | 512.69 (gets back) |\n| Ben | 64.00 |\
  \ 307.17 | 0.00 | 0.00 | -243.17 (owes) |\n| Cem | 263.72 | 262.87 | 0.00 | 0.00\
  \ | 0.85 (gets back) |\n| Dara | 201.60 | 342.54 | 0.00 | 0.00 | -140.94 (owes)\
  \ |\n| Eli | 63.75 | 293.18 | 100.00 | 0.00 | -129.43 (owes) |\n\nCheck: nets add\
  \ up to 0.00 (paid 1,583.07 = shares 1,583.07).\n\n## Transfers (4)\n\n1. Ben pays\
  \ Ana **243.17 EUR**\n2. Dara pays Ana **140.94 EUR**\n3. Eli pays Ana **128.58\
  \ EUR**\n4. Eli pays Cem **0.85 EUR**\n\nMinimum possible: 4 transfers for 5 people\
  \ with a balance (no smaller subgroup evens out on its own).\n\n## Message for the\
  \ group chat\n\n```\nSettle-up (EUR, 11 lines, rates: GBP 1.16, USD 0.92):\n- Ben\
  \ -> Ana: 243.17 EUR\n- Dara -> Ana: 140.94 EUR\n- Eli -> Ana: 128.58 EUR\n- Eli\
  \ -> Cem: 0.85 EUR\nFull table in the shared sheet. Shout within 2 days if a line\
  \ is wrong.\n```\n\x1FFILE:examples/flat-october.csv\x1E\n# people: Asha, Bo, Chen,\
  \ Dev, Ema, Finn\n# base: EUR\ndate,description,paid_by,amount,currency,split,participants,details\n\
  2026-10-01,Festival tickets for Bo and Finn,Bo,600,EUR,exact,Bo;Finn,Bo:300;Finn:300\n\
  2026-10-31,October groceries (Bo and Finn on tour),Asha,800,EUR,equal,all-Bo-Finn,\n\
  2026-10-31,Electricity Sep-Oct (Bo and Finn on tour),Chen,600,EUR,equal,all-Bo-Finn,\n\
  2026-10-20,Second-hand sofa (Dev and Ema's part),Asha,250,EUR,exact,Dev;Ema,Dev:150;Ema:100\n\
  \x1FFILE:scripts/settle_up.py\x1E\n#!/usr/bin/env python3\n\"\"\"Shared expense\
  \ bill splitter and settle-up planner (Python 3.8+ standard library only).\n\nReads\
  \ a CSV ledger of shared costs (a trip, a flat, an event), splits every line in\n\
  integer cents, and finds the SMALLEST possible number of transfers that settles\
  \ the group\n(exact search over zero-sum subgroups, not just \"at most people -\
  \ 1\").\n\nCSV columns (header row required, extra columns ignored):\n  date,description,paid_by,amount,currency,split,participants,details\n\
  \n  paid_by       Ana            one payer\n                Ana:40;Ben:20  several\
  \ payers (amounts in the row currency, must add up)\n  amount        total in the\
  \ row currency; negative = refund received by paid_by\n  currency      blank = base\
  \ currency\n  split         equal | shares | exact | percent | itemized | payment\n\
  \  participants  all | Ana;Ben;Cem | all-Eli (everyone except Eli) | blank = names\
  \ in details\n  details       shares:   Ana:3;Ben:2          (people in participants\
  \ but not listed get 1)\n                exact:    Ana:30;Ben:45        (rest, if\
  \ any, split equally among the other participants)\n                percent:  Ana:50;Ben:30;Cem:20\
  \ (must total 100)\n                itemized: Ana:18;Ben:22.50;shared:12  (item\
  \ prices before tax/tip; \"shared\"\n                          items are split equally;\
  \ amount - items = tax/service/tip, split in\n                          proportion\
  \ to what each person ordered)\n                payment:  (none) paid_by gave `amount`\
  \ to the one person in participants\n\nComment lines at the top set the group and\
  \ the rates (or use the CLI flags):\n  # people: Ana, Ben, Cem\n  # base: EUR\n\
  \  # rates: USD=0.92, GBP=1.16      (1 unit of that currency = rate units of base)\n\
  \nUsage:\n  python3 settle_up.py ledger.csv [--base EUR] [--rates USD=0.92,GBP=1.16]\
  \ [--people Ana,Ben]\n                                  [--detail Ana] [--json]\n\
  \  python3 settle_up.py --self-test\n\nExit codes: 0 = settled plan printed, 2 =\
  \ bad input (unknown split, sums that do not\nmatch, missing exchange rate, unknown\
  \ person in a strict list).\n\"\"\"\nimport argparse\nimport csv\nimport io\nimport\
  \ json\nimport re\nimport sys\nfrom decimal import Decimal, ROUND_HALF_UP, InvalidOperation\n\
  \nMAX_EXACT = 18  # people with a non-zero balance for the exact minimum search\
  \ (2^18 states)\nSPLITS = (\"equal\", \"shares\", \"exact\", \"percent\", \"itemized\"\
  , \"payment\")\n\n\nclass LedgerError(ValueError):\n    pass\n\n\ndef dec(s, what):\n\
  \    try:\n        return Decimal(str(s).replace(\",\", \"\").strip())\n    except\
  \ (InvalidOperation, AttributeError):\n        raise LedgerError(\"%s: %r is not\
  \ a number\" % (what, s))\n\n\ndef to_cents(amount):\n    return int((amount * 100).quantize(Decimal(\"\
  1\"), rounding=ROUND_HALF_UP))\n\n\ndef fmt(cents, cur=\"\"):\n    sign = \"-\"\
  \ if cents < 0 else \"\"\n    c = abs(cents)\n    s = \"%s%d.%02d\" % (sign, c //\
  \ 100, c % 100)\n    s = re.sub(r\"(\\d)(?=(\\d{3})+\\.)\", r\"\\1,\", s)\n    return\
  \ (s + \" \" + cur).strip()\n\n\ndef allocate(total, weights, order):\n    \"\"\"\
  Split integer `total` cents in proportion to `weights` (dict name -> Decimal >=\
  \ 0).\n    Largest remainder method; ties go to the earlier name in `order`. Sum\
  \ is exact.\"\"\"\n    names = [n for n in order if n in weights]\n    wsum = sum(weights[n]\
  \ for n in names)\n    if wsum <= 0:\n        raise LedgerError(\"weights add up\
  \ to zero\")\n    sign = -1 if total < 0 else 1\n    t = abs(total)\n    raw = {n:\
  \ Decimal(t) * weights[n] / wsum for n in names}\n    base = {n: int(raw[n]) for\
  \ n in names}\n    left = t - sum(base.values())\n    rank = sorted(names, key=lambda\
  \ n: (-(raw[n] - base[n]), order.index(n)))\n    for n in rank[:left]:\n       \
  \ base[n] += 1\n    return {n: sign * v for n, v in base.items() if v}\n\n\ndef\
  \ parse_pairs(text, what):\n    out = {}\n    for part in [p for p in re.split(r\"\
  [;|]\", text or \"\") if p.strip()]:\n        if \":\" not in part:\n          \
  \  raise LedgerError(\"%s: %r should look like Name:value\" % (what, part.strip()))\n\
  \        k, v = part.split(\":\", 1)\n        k = k.strip()\n        out[k] = out.get(k,\
  \ Decimal(0)) + dec(v, what)\n    return out\n\n\nclass Ledger:\n    def __init__(self,\
  \ text, base=None, rates=None, people=None):\n        self.warnings = []\n     \
  \   self.base = base\n        self.rates = {}\n        self.people = []\n      \
  \  self._canon = {}\n        header_people = None\n        body = []\n        for\
  \ line in text.splitlines():\n            s = line.strip()\n            if s.startswith(\"\
  #\"):\n                m = re.match(r\"#\\s*(people|base|rates?)\\s*:\\s*(.*)$\"\
