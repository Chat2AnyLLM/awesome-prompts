title: Snowy Mountain Onsen at Dusk Scene Concept Brief Builder
description: Imported from Prompts Chat
prompt: 'Act as a cinematic landscape designer who writes image-ready and motion-ready
  scene briefs. Help me design one hero shot of a steaming outdoor hot spring (onsen)
  beside a traditional mountain inn during snowfall at dusk. The shot will first be
  generated as a still image and then animated into a short video that uses that image
  as its first frame. Your brief must make the still image rich in elements that can
  move naturally (steam drifting and curling over the water, snowflakes falling, soft
  snow slipping off a pine branch, gentle ripples on the pool, the warm glow of lanterns
  and windows) while keeping the composition calm, balanced, readable, and easy to
  animate.


  My starting idea: ${idea:a steaming rock-lined hot spring in the snow next to an
  old wooden inn, at blue hour, with stone lanterns}


  My starting choices:

  - Pool: ${pool:a natural outdoor pool of clear teal water framed by dark volcanic
  rocks capped with snow, filling the center and foreground}

  - Steam: ${steam:thick white steam rising from the water and drifting to one side}

  - Inn: ${inn:a two-storey traditional Japanese wooden inn on the right with snow-covered
  tiled roofs and rows of warmly lit windows}

  - Lanterns: ${lanterns:two snow-capped stone lanterns glowing softly, one small
  on the left rocks and one larger near the inn}

  - Trees and mountains: ${trees:snow-laden pine trees behind the pool and a dark
  forested mountain slope on the left}

  - Weather: ${weather:large soft snowflakes falling slowly}

  - Time and light: ${time:deep blue twilight just after sunset, warm amber light
  from the inn and lanterns}

  - Visual style: ${style:photoreal travel and landscape photography, natural colors}

  - Mood words: ${mood:quiet, warm, peaceful, wintry, inviting}


  First ask me, in one short message, for anything missing: the camera height (low
  near the water, eye level, or slightly raised), how much of the frame the inn should
  take, how dense the steam and snowfall should be, how bright the windows and lanterns
  are, whether I want one small natural event in the video (for example a clump of
  snow sliding off a pine branch into the pool), and anything to avoid (people, bathers,
  animals, text, signs, logos, or copying a specific real inn, photograph, or named
  landmark).


  Then produce the brief with these sections:


  1. **Scene Overview**: two or three sentences on the place, the moment, the light,
  and the feeling. Describe an imagined mountain hot spring inn in a Japanese spirit,
  not a copy of a specific real ryokan or a famous photograph.


  2. **The Pool and Rocks**: the pool''s shape and size in the frame, the water color
  and clarity, the dark rocks around it and the snow on their tops, and where the
  water catches warm and cool light.


  3. **Steam**: how thick it is, where it rises most, which way it drifts, how it
  softens the background, and how it should read as warm vapor rather than fog or
  smoke.


  4. **The Inn**: its position, number of storeys, roof shape and the snow on it,
  the wooden walls, the rows of lit windows, and how much detail is visible through
  the steam and snow.


  5. **Lanterns, Trees, and Mountain**: the two stone lanterns with snow caps and
  their glow, the snow-laden pines behind the pool (including one branch above the
  water that could shed snow), and the dark mountain slope against the sky.


  6. **Light, Sky, and Snow**: the deep blue twilight sky, the cool ambient light
  on the snow, the warm amber accents from the windows and lanterns, the size and
  density of the falling snowflakes, and how soft the shadows are.


  7. **Fixed Visual Details**: a numbered list of 8 to 10 details that must stay identical
  in the still image and in the video (pool shape and position, rock edges, inn position
  and roofline, window pattern, both lantern positions, pine trees, mountain silhouette,
  camera position, framing, overall steam zone).


  8. **Motion Map**: a table of every element that can move in the video, with columns:
  element, type of motion, direction, speed (very slow, slow, medium), and how strongly
  it should move. Include the steam, the snowfall, the water surface, the lantern
  and window glow, one optional snow clump falling from a pine branch into the pool
  with a small splash and ripples, and the camera move. Keep total motion subtle and
  physically plausible, with one gentle air direction.


  9. **Prompt Seed A - Hero Still Image**: a ready-to-paste image prompt under 170
  words for a wide landscape 16:9 frame, with the steaming hot spring, the snowy inn,
  and the stone lanterns at blue hour in the first sentence, ending with: no people,
  no text, no logos.


  10. **Prompt Seed B - Image-to-Video Animation**: a ready-to-paste video prompt
  under 120 words that starts from the hero still as the first frame, describes the
  steam drifting and curling, snow falling, the steady glow of lanterns and windows,
  a slow gentle push-in toward the pool and the inn for about 6 seconds, and (if I
  want it) one clump of snow falling from a pine branch into the pool with a small
  splash and spreading ripples, and says to keep the pool, rocks, inn, lanterns, trees,
  and framing exactly as in the image with no new objects.


  Rules: no people, bathers, or animals; no text, signs, or logos; no fast camera
  moves or cuts; and no motion that breaks physics (rocks, lanterns, and the inn never
  move, steam rises and drifts and does not pour downward, snow falls slowly and evenly,
  a falling snow clump drops straight down under gravity and makes only a small splash,
  the light does not flicker or jump). Use short paragraphs and lists.'
