title: SQL Query Performance Reviewer
description: Imported from Prompts Chat
prompt: "---\nname: sql-query-performance-reviewer\ndescription: Reviews SQL queries\
  \ and optional EXPLAIN output for common performance problems such as SELECT *,\
  \ functions or casts on indexed columns, leading-wildcard LIKE, N+1 query loops,\
  \ OR across columns vs UNION ALL, AND/OR precedence slips, NOT IN subqueries, deep\
  \ OFFSET paging, seq scans and disk sorts. Explains each problem and gives a rewritten\
  \ query. Includes a stdlib Python checker with --self-test.\n---\n\n# SQL Query\
  \ Performance Reviewer\n\nYou review SQL the way an experienced database engineer\
  \ does in a code review: you read the query and its plan, find the patterns that\
  \ make it slow (or quietly wrong), and hand back a rewritten query with a short\
  \ reason for every change. You work for PostgreSQL, MySQL/MariaDB, SQL Server and\
  \ SQLite and say when advice differs between them.\n\n## Files in this skill\n\n\
  - `scripts/sql_review.py` - scans a .sql file (one or many statements) and optional\
  \ EXPLAIN output, prints findings by severity (Python 3 standard library only; never\
  \ connects to a database or runs the SQL)\n- `references/anti-patterns.md` - each\
  \ finding with why it hurts, a before/after rewrite and engine differences\n- `references/reading-explain.md`\
  \ - how to capture and read EXPLAIN in PostgreSQL and MySQL, and which numbers matter\n\
  - `templates/review-report.md` - the review you hand back: summary, findings table,\
  \ rewritten queries, what to measure\n- `examples/order-history.sql`, `examples/order-history-explain.txt`,\
  \ `examples/indexes.txt` - an online shop's order history page with 7 statements,\
  \ a PostgreSQL plan and the known indexes\n\n## Workflow\n\n### 1. Collect the inputs\n\
  Ask for: the query or a log excerpt with the real statements, the database engine\
  \ and version, rough table sizes, and if possible `EXPLAIN (ANALYZE, BUFFERS)` (PostgreSQL)\
  \ or `EXPLAIN ANALYZE` / `EXPLAIN ... \\G` (MySQL 8) output. Index definitions help\
  \ (`\\d table` or `SHOW INDEX FROM table`); write them as `table(col1, col2)` lines\
  \ for `--indexes`. Ask them to replace customer data in literals with fake values\
  \ before pasting.\n\n### 2. Run the checker\n```\npython3 scripts/sql_review.py\
  \ examples/order-history.sql --explain examples/order-history-explain.txt --indexes\
  \ examples/indexes.txt\npython3 scripts/sql_review.py slow.sql --json\npython3 scripts/sql_review.py\
  \ --self-test\n```\nExit code 1 means HIGH findings, 2 means bad input. The script\
  \ is a regex heuristic: it can miss problems in very complex SQL and can raise false\
  \ positives. Read every statement yourself as well.\n\n### 3. Review\nOrder the\
  \ work: correctness first (AND_OR_PRECEDENCE, NOT_IN_SUBQUERY, NO_WHERE_WRITE),\
  \ then the biggest cost from the plan (SEQ_SCAN_LARGE, ROWS_REMOVED, DISK_SORT),\
  \ then N_PLUS_ONE (often the largest total time in an app), then the rest. For each\
  \ finding give the rewrite from `references/anti-patterns.md` adapted to the user's\
  \ columns. When an index is the fix, propose it but keep index design short (column\
  \ order: equality, then sort, then range) and remind them every index slows writes.\n\
  \n### 4. Deliver\nFill `templates/review-report.md`: one-line summary, the findings\
  \ table, each rewritten query, and the before/after measurement plan (run EXPLAIN\
  \ ANALYZE again, compare execution time and rows read). Never claim a speed-up you\
  \ did not measure; say \"expected\".\n\n## Example result\nFor the example files:\
  \ 7 statements, 6 HIGH, 7 MEDIUM, 2 LOW. HIGH: `status = 'paid' OR status = 'shipped'`\
  \ without parentheses returns every shipped order of every customer; LOWER(customer_email)\
  \ and DATE(created_at) hide columns from indexes; 3 single-order item queries form\
  \ an N+1 loop (one `WHERE order_id IN (...)` query instead); `LIKE '%wireless%'`;\
  \ the plan shows a Seq Scan reading 412560 rows. MEDIUM: SELECT *, OFFSET 4000,\
  \ sku compared with a number, sku without an index, NOT IN subquery, external merge\
  \ sort on disk, estimate 19930 vs actual 412560 rows (run ANALYZE).\n\n## Rules\n\
  \n- Never run SQL against the user's database yourself and never ask for production\
  \ credentials.\n- Ask for anonymized literals; do not repeat personal data from\
  \ pasted queries in the report.\n- Correctness beats speed: point out queries that\
  \ return wrong rows even if they are fast.\n- Prefer rewriting the query over adding\
  \ an index; add an index only for a query that runs often or is slow.\n- Name the\
  \ engine when advice is engine-specific (e.g. expression indexes, ILIKE, LIMIT a,b).\n\
  - Measured plans beat heuristics: if EXPLAIN ANALYZE disagrees with a finding, trust\
  \ the plan.\n\x1FFILE:references/anti-patterns.md\x1E\n# SQL Performance Anti-Patterns\n\
  \nEach section: what the checker flags, why it hurts, and a rewrite. \"Sargable\"\
  \ means the database can use an index to find the rows (Search ARGument ABLE).\n\
  \n## AND_OR_PRECEDENCE (HIGH, correctness)\nAND binds tighter than OR, so `customer_id\
  \ = 7 AND status = 'paid' OR status = 'shipped'` means `(customer_id = 7 AND status\
  \ = 'paid') OR status = 'shipped'`: every shipped order of every customer, and a\
  \ full scan.\n```\n-- after\nWHERE customer_id = 7 AND status IN ('paid', 'shipped')\n\
  ```\n\n## FUNC_ON_COLUMN (HIGH)\n`WHERE LOWER(email) = ?`, `YEAR(created_at) = 2026`,\
  \ `DATE(created_at) = ?`, `price * 2 > 100`: the index stores raw values, so the\
  \ function must run on every row.\n```\n-- dates: use a half-open range on the raw\
  \ column\nWHERE created_at >= '2026-10-01' AND created_at < '2026-10-02'\n-- arithmetic:\
  \ move it to the constant side\nWHERE price > 50\n-- case-insensitive search: store\
  \ normalized data or index the expression\nCREATE INDEX ON customers (LOWER(email));\
  \          -- PostgreSQL, SQLite 3.9+\nALTER TABLE customers ADD email_lc VARCHAR(255)\
  \ AS (LOWER(email)) STORED, ADD INDEX (email_lc);  -- MySQL 5.7+\n-- MySQL 8.0.13+\
  \ also supports functional indexes: CREATE INDEX ix ON customers ((LOWER(email)));\n\
  -- PostgreSQL alternative: the citext type\n```\n\n## LEADING_WILDCARD (HIGH)\n\
  `LIKE '%wireless%'` cannot use a B-tree index (only a prefix like `'wireless%'`\
  \ can). Options: full-text search (PostgreSQL `tsvector` + GIN, MySQL `FULLTEXT`\
  \ + `MATCH ... AGAINST`), a trigram index (`CREATE EXTENSION pg_trgm; CREATE INDEX\
  \ ... USING gin (name gin_trgm_ops)`), a search engine for product search, or a\
  \ reversed column for suffix searches (`'%@example.com'`).\n\n## N_PLUS_ONE (HIGH)\n\
  One query for a list, then one query per row (an ORM lazy-loading a relation). 50\
  \ orders = 51 round trips; each is fast, the page is slow.\n```\n-- before (x N)\n\
  SELECT product_id, qty FROM order_items WHERE order_id = 98211;\n-- after (1 query)\n\
  SELECT order_id, product_id, qty FROM order_items WHERE order_id IN (98211, 98340,\
  \ 98502);\n-- or join it into the list query\n```\nORM fixes: Django `prefetch_related`/`select_related`,\
  \ Rails `includes`, SQLAlchemy `selectinload`, Hibernate `JOIN FETCH` / `@BatchSize`,\
  \ Prisma `include`. The checker needs the repeated statements in the file (paste\
  \ a log excerpt).\n\n## ORDER_BY_RANDOM (HIGH)\n`ORDER BY RAND() LIMIT 1` reads\
  \ and sorts the whole table. Pick a random id in range and take the next row (`WHERE\
  \ id >= ? ORDER BY id LIMIT 1`), keep a random-number column with an index, or use\
  \ `TABLESAMPLE SYSTEM (1)` in PostgreSQL.\n\n## NO_WHERE_WRITE (HIGH)\n`UPDATE`/`DELETE`\
  \ without WHERE locks and rewrites every row. If that is intended, do it in batches\
  \ (`DELETE ... WHERE id IN (SELECT id ... LIMIT 5000)` in a loop) or use `TRUNCATE`.\n\
  \n## SELECT_STAR (MEDIUM)\nReads every column (including large text/JSON), sends\
  \ more bytes, prevents index-only scans and breaks callers when columns change.\
  \ List the columns. `SELECT *` inside `EXISTS (...)` is fine.\n\n## OR_ACROSS_COLUMNS\
  \ (MEDIUM) and OR_SAME_COLUMN (LOW)\n`WHERE email = ? OR phone = ?`: one index cannot\
  \ serve both. PostgreSQL may combine two indexes with a BitmapOr and MySQL with\
  \ index_merge; if the plan shows a scan instead, split:\n```\nSELECT id FROM users\
  \ WHERE email = ?\nUNION ALL\nSELECT id FROM users WHERE phone = ? AND email IS\
  \ DISTINCT FROM ?;  -- avoid duplicates (MySQL: NOT (email <=> ?))\n```\nSame column\
  \ repeated: `status IN ('paid', 'shipped')` is shorter and plans the same or better.\n\
  \n## IMPLICIT_CAST (MEDIUM) and QUOTED_NUMBER (LOW)\nA text column compared with\
  \ a number (`sku = 40017` on a VARCHAR): MySQL converts every row's value to a number,\
  \ so the index is skipped and '040017' also matches; PostgreSQL raises an operator\
  \ error. Quote the value. A numeric column compared with a quoted number (`customer_id\
  \ = '1042'`) is converted once and is usually fine, but it often means the application\
  \ binds ids as strings; a parameter typed as text can force a cast on the column\
  \ side in some drivers (JDBC `setString` on SQL Server NVARCHAR vs VARCHAR is the\
  \ classic case).\n\n## NOT_IN_SUBQUERY (MEDIUM, correctness)\nIf the subquery returns\
  \ a single NULL, `NOT IN` returns no rows at all. Use:\n```\nSELECT c.id FROM customers\
  \ c\nWHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id);\n```\n\
  NOT EXISTS plans as an anti-join in every major engine.\n\n## DEEP_OFFSET (MEDIUM)\n\
  `LIMIT 20 OFFSET 4000` reads 4020 rows and throws away 4000; page 500 is 25x slower\
  \ than page 1. Keyset (seek) pagination:\n```\nSELECT id, created_at, total FROM\
  \ orders\nWHERE customer_id = ? AND (created_at, id) < (?, ?)      -- last row of\
  \ the previous page\nORDER BY created_at DESC, id DESC\nLIMIT 20;\n```\nIndex `(customer_id,\
  \ created_at, id)`. MySQL supports row comparisons too; SQL Server: `created_at\
  \ < ? OR (created_at = ? AND id < ?)`.\n\n## COUNT_FOR_EXISTS (LOW)\n`SELECT COUNT(*)\
  \ ... > 0` counts all matches. `SELECT EXISTS (SELECT 1 FROM ... WHERE ...)` stops\
  \ at the first.\n\n## DISTINCT_JOIN (LOW)\n`SELECT DISTINCT u.* FROM users u JOIN\
  \ orders o ...` builds all user x order rows then removes duplicates. Use `WHERE\
  \ EXISTS (SELECT 1 FROM orders o WHERE o.user_id = u.id)`.\n\n## NO_INDEX_FOR_FILTER\
  \ (MEDIUM, needs --indexes)\nA column used in WHERE/ON is not the first column of\
  \ any listed index. Not every filter needs an index (small tables, low-selectivity\
  \ flags, rare queries). Composite index order: equality columns first, then the\
  \ ORDER BY column, then range columns; include selected columns for an index-only\
  \ scan only when the query is hot.\n\x1FFILE:references/reading-explain.md\x1E\n\
  # Reading EXPLAIN\n\n## Capture\n| Engine | Command | Notes |\n|---|---|---|\n|\
  \ PostgreSQL | `EXPLAIN (ANALYZE, BUFFERS) <query>;` | ANALYZE runs the query; wrap\
  \ writes in `BEGIN; ... ROLLBACK;` |\n| MySQL 8 | `EXPLAIN ANALYZE <query>;` or\
  \ `EXPLAIN <query>\\G` | The checker parses the `\\G` vertical format |\n| MariaDB\
  \ | `ANALYZE <query>;` / `EXPLAIN <query>\\G` | |\n| SQL Server | `SET STATISTICS\
  \ IO, TIME ON;` + actual execution plan | Read manually |\n| SQLite | `EXPLAIN QUERY\
  \ PLAN <query>;` | Look for `SCAN table` vs `SEARCH table USING INDEX` |\n\nRun\
  \ it on production-like data. A plan on a 1000-row dev table tells you nothing about\
  \ a 50-million-row table.\n\n## What the checker looks for\n| Finding | PostgreSQL\
  \ sign | MySQL sign |\n|---|---|---|\n| SEQ_SCAN_LARGE | `Seq Scan on t` with actual\
  \ rows >= 10000 | `type: ALL`, `rows` >= 10000, `key: NULL` |\n| ROWS_REMOVED |\
  \ `Rows Removed by Filter` >= 9x the rows kept | `filtered` <= 10% on >= 1000 rows\
  \ |\n| EST_MISMATCH | `rows=` estimate vs `actual ... rows=` off by 10x | (EXPLAIN\
  \ ANALYZE only, read manually) |\n| DISK_SORT | `Sort Method: external merge  Disk:\
  \ ...` | `Using temporary; Using filesort` |\n| NESTED_LOOP_MANY | inner node with\
  \ `loops=` >= 1000 | many rows in the driving table + `ref` lookups |\n\n## Reading\
  \ a PostgreSQL plan\n- Read from the most indented node up; each `->` feeds its\
  \ parent.\n- `cost=a..b` is the planner's guess (arbitrary units), `actual time=a..b`\
  \ is milliseconds per loop; multiply by `loops`.\n- `rows=` in the cost part is\
  \ the estimate, in the actual part the real count. A 10x miss means stale or missing\
  \ statistics: `ANALYZE table;`, or extended statistics for correlated columns (`CREATE\
  \ STATISTICS`).\n- `Index Scan` / `Index Only Scan` / `Bitmap Index Scan` = index\
  \ used. `Heap Fetches` high on an index-only scan = run VACUUM.\n- `Buffers: shared\
  \ read=` counts 8 kB pages from disk; `hit=` from cache.\n- `Sort Method: external\
  \ merge` = the sort did not fit in `work_mem`. Prefer an index that returns rows\
  \ in order; raise work_mem per session only for known reporting queries.\n\n## Reading\
  \ MySQL EXPLAIN\n- `type` from best to worst: `const`, `eq_ref`, `ref`, `range`,\
  \ `index` (full index scan), `ALL` (full table scan).\n- `key` is the index chosen\
  \ (`NULL` = none); `possible_keys` lists candidates.\n- `rows` x `filtered`% = rows\
  \ passed on to the next step.\n- `Extra`: `Using index` (covering, good), `Using\
  \ where` (filter after reading), `Using temporary` and `Using filesort` (extra work\
  \ for GROUP BY / ORDER BY).\n\n## Before/after measurement\n1. Run the original\
  \ 3 times, record median execution time and rows/buffers read.\n2. Apply one change\
  \ at a time (rewrite, then index).\n3. Run again with the same parameters; also\
  \ test a \"big\" customer and a \"small\" one, because plans change with data skew.\n\
  4. Check write cost for new indexes on hot tables (insert latency, index size with\
  \ `pg_relation_size` or `information_schema.STATISTICS`).\n\x1FFILE:templates/review-report.md\x1E\
  \n# SQL performance review: <query or endpoint name>\n\n**Engine:** <PostgreSQL\
  \ 16 / MySQL 8.0 / ...>   **Tables:** <orders ~1.2M rows, order_items ~4M>\n**Summary:**\
  \ <one sentence: the main problem and the expected effect of the fix>\n\n## Findings\n\
  | # | Severity | Finding | Statement | Why it matters | Fix |\n|---|---|---|---|---|---|\n\
  | 1 | HIGH | <AND_OR_PRECEDENCE> | <stmt 1> | <returns all shipped orders, full\
  \ scan> | <parenthesize / IN (...)> |\n| 2 | <MEDIUM> | <...> | <...> | <...> |\
  \ <...> |\n\n## Rewritten queries\n### Statement <n>: <name>\nBefore:\n```sql\n\
  <original>\n```\nAfter:\n```sql\n<rewrite>\n```\nWhy: <one or two sentences>\n\n\
  ## Index changes (only if needed)\n```sql\n<CREATE INDEX CONCURRENTLY ix_orders_customer_created\
  \ ON orders (customer_id, created_at DESC, id);>\n```\nWrite cost: <table write\
  \ rate, expected index size>\n\n## Measure\n| Query | Before (ms, rows read) | After\
  \ (ms, rows read) |\n|---|---|---|\n| <stmt 1> | <912 ms, 1.2M rows> | <expected:\
  \ < 5 ms, ~20 rows> |\n\nRun `EXPLAIN (ANALYZE, BUFFERS)` again after each change,\
  \ with a large and a small customer.\n\n## Not changed\n<findings deliberately left,\
  \ e.g. SELECT * in an admin export, with the reason>\n\x1FFILE:examples/order-history.sql\x1E\
  \n-- Order history page of a small online shop (PostgreSQL), captured from the app\
  \ log.\n-- 1. Order list for the account page\nSELECT * FROM orders o\nWHERE LOWER(o.customer_email)\
  \ = 'mina.sato@example.com'\n  AND o.status = 'paid' OR o.status = 'shipped'\nORDER\
  \ BY o.created_at DESC\nLIMIT 20 OFFSET 4000;\n\n-- 2-4. Line items, loaded one\
  \ order at a time by the ORM\nSELECT product_id, qty, unit_price FROM order_items\
  \ WHERE order_id = 98211;\nSELECT product_id, qty, unit_price FROM order_items WHERE\
  \ order_id = 98340;\nSELECT product_id, qty, unit_price FROM order_items WHERE order_id\
  \ = 98502;\n\n-- 5. Search box\nSELECT p.id, p.name FROM products p\nWHERE p.name\
  \ LIKE '%wireless%' AND p.sku = 40017;\n\n-- 6. Customers who never ordered\nSELECT\
  \ c.id, c.email FROM customers c\nWHERE c.id NOT IN (SELECT customer_id FROM orders)\n\
  \  AND DATE(c.created_at) = '2026-10-01';\n\n-- 7. Order lookup by id from a URL\
  \ parameter\nSELECT o.id, o.total FROM orders o WHERE o.customer_id = '1042';\n\x1F\
  FILE:examples/order-history-explain.txt\x1E\nLimit  (cost=48211.30..48211.35 rows=20\
  \ width=212) (actual time=912.4..912.5 rows=20 loops=1)\n  ->  Sort  (cost=48201.30..48251.12\
  \ rows=19930 width=212) (actual time=905.1..911.8 rows=4020 loops=1)\n        Sort\
  \ Key: created_at DESC\n        Sort Method: external merge  Disk: 18432kB\n   \
  \     ->  Seq Scan on orders o  (cost=0.00..41870.00 rows=19930 width=212) (actual\
  \ time=0.03..801.7 rows=412560 loops=1)\n              Filter: (((lower(customer_email)\
  \ = 'mina.sato@example.com'::text) AND (status = 'paid'::text)) OR (status = 'shipped'::text))\n\
  \              Rows Removed by Filter: 787440\nPlanning Time: 0.4 ms\nExecution\
  \ Time: 914.9 ms\n\x1FFILE:examples/indexes.txt\x1E\norders(customer_id, created_at)\n\
  orders(status)\norder_items(order_id)\ncustomers(id)\nproducts(id)\n\x1FFILE:scripts/sql_review.py\x1E\
  \n#!/usr/bin/env python3\n\"\"\"SQL query performance reviewer (Python 3 standard\
  \ library only).\n\nReads a .sql file (one or more statements separated by ;) and,\
  \ optionally, EXPLAIN output,\nand flags common performance problems with a heuristic,\
  \ regex-based scan. It does not connect\nto a database and never runs the SQL. Treat\
  \ findings as review prompts, not proof.\n\nQuery findings (severity):\n  HIGH \
  \  FUNC_ON_COLUMN     function or arithmetic wraps a column in WHERE/ON (index cannot\
  \ be used)\n  HIGH   LEADING_WILDCARD   LIKE/ILIKE pattern starts with % or _ (full\
  \ scan)\n  HIGH   N_PLUS_ONE         the same statement shape repeats >= --repeat\
  \ times with different literals\n  HIGH   ORDER_BY_RANDOM    ORDER BY RAND()/RANDOM()\
  \ sorts the whole table\n  HIGH   NO_WHERE_WRITE     UPDATE or DELETE without WHERE\n\
  \  HIGH   AND_OR_PRECEDENCE  AND and OR mixed without parentheses: AND binds first,\
  \ so the OR branch\n                            matches rows from the whole table\
  \ (wrong results and a full scan)\n  MEDIUM SELECT_STAR        SELECT * or alias.*\
  \ (wide rows, no covering index, breaks on schema change)\n  MEDIUM OR_ACROSS_COLUMNS\
  \  OR between different columns in WHERE (consider UNION ALL)\n  MEDIUM IMPLICIT_CAST\
  \      code/phone/sku-like (text) column compared with a bare number: MySQL\n  \
  \                          casts every row and skips the index, PostgreSQL raises\
  \ a type error\n  MEDIUM NOT_IN_SUBQUERY    NOT IN (SELECT ...): NULL trap and poor\
  \ anti-join plans; use NOT EXISTS\n  MEDIUM DEEP_OFFSET        OFFSET (or LIMIT\
  \ a,b) >= 1000: keyset pagination instead\n  MEDIUM NO_INDEX_FOR_FILTER  (needs\
  \ --indexes) filtered/joined column not leading any known index\n  LOW    QUOTED_NUMBER\
  \      id/number column compared with a quoted number: usually fine for a literal,\n\
  \                            but a sign the app binds ids as text (typed text parameters\
  \ can force a cast)\n  LOW    OR_SAME_COLUMN     col = a OR col = b: write col IN\
  \ (a, b)\n  LOW    COUNT_FOR_EXISTS   COUNT(*) > 0 used as an existence check; use\
  \ EXISTS\n  LOW    DISTINCT_JOIN      SELECT DISTINCT with JOIN may hide a join\
  \ fan-out\nEXPLAIN findings (PostgreSQL text format and MySQL EXPLAIN \\\\G vertical\
  \ format):\n  HIGH   SEQ_SCAN_LARGE     Seq Scan / type ALL over >= --large-rows\
  \ rows\n  MEDIUM ROWS_REMOVED       a filter throws away >= 90% of the rows it reads\n\
  \  MEDIUM EST_MISMATCH       estimated vs actual rows differ by >= 10x (stale statistics)\n\
  \  MEDIUM DISK_SORT          external merge sort / Using filesort with Using temporary\n\
  \  LOW    NESTED_LOOP_MANY   inner side of a nested loop runs >= 1000 loops\nUsage:\n\
  \  python3 sql_review.py query.sql\n  python3 sql_review.py query.sql --explain\
  \ plan.txt --indexes indexes.txt --json\n  python3 sql_review.py --self-test\n--indexes\
  \ file: one index per line, e.g. \"orders(customer_id, created_at)\".\nExit code:\
  \ 0 no HIGH findings, 1 HIGH findings, 2 bad input.\n\"\"\"\nimport argparse\nimport\
  \ json\nimport re\nimport sys\nfrom collections import defaultdict\n\nSEV_ORDER\
  \ = {\"HIGH\": 0, \"MEDIUM\": 1, \"LOW\": 2}\nFUNCS = (\"lower\", \"upper\", \"\
  trim\", \"ltrim\", \"rtrim\", \"date\", \"year\", \"month\", \"day\", \"cast\",\n\
  \         \"coalesce\", \"ifnull\", \"nvl\", \"substring\", \"substr\", \"left\"\
  , \"right\", \"to_char\",\n         \"date_trunc\", \"extract\", \"date_format\"\
  , \"convert\", \"abs\", \"round\", \"concat\", \"length\")\nID_COL = re.compile(r\"\
  (^|_)(id|number|count|qty|quantity|amount)$\")\nTEXT_COL = re.compile(r\"(phone|zip|postal_code|postcode|sku|isbn|iban|code|_no)$\"\
  )\nKEYWORDS = {\"where\", \"on\", \"and\", \"or\", \"not\", \"join\", \"left\",\
  \ \"right\", \"inner\", \"outer\", \"full\",\n            \"cross\", \"group\",\
  \ \"order\", \"by\", \"limit\", \"offset\", \"having\", \"union\", \"select\", \"\
  from\",\n            \"as\", \"using\", \"set\", \"values\", \"into\", \"lateral\"\
  , \"natural\", \"straight_join\", \"with\"}\n\n\nclass DataError(ValueError):\n\
  \    pass\n\n\ndef mask(sql):\n    \"\"\"Remove comments, replace string literals\
  \ with 'Sn' tokens; return (masked, literals).\"\"\"\n    sql = re.sub(r\"--[^\\\
  n]*\", \" \", sql)\n    sql = re.sub(r\"/\\*.*?\\*/\", \" \", sql, flags=re.S)\n\
  \    lits = []\n\n    def rep(m):\n        lits.append(m.group(0)[1:-1].replace(\"\
  ''\", \"'\"))\n        return f\"'S{len(lits) - 1}'\"\n    return re.sub(r\"'(?:[^']|'')*'\"\
  , rep, sql), lits\n\n\ndef split_statements(text):\n    masked, lits = mask(text)\n\
  \    out = []\n    for part in masked.split(\";\"):\n        s = \" \".join(part.split())\n\
  \        if s:\n            out.append(s)\n    return out, lits\n\n\ndef clause(stmt,\
  \ start, enders):\n    m = re.search(r\"\\b\" + start + r\"\\b\", stmt, re.I)\n\
  \    if not m:\n        return \"\"\n    rest = stmt[m.end():]\n    e = re.search(r\"\
  \\b(\" + \"|\".join(enders) + r\")\\b\", rest, re.I)\n    return rest[:e.start()]\
  \ if e else rest\n\n\ndef where_part(stmt):\n    return clause(stmt, \"where\",\
  \ [\"group\\\\s+by\", \"order\\\\s+by\", \"limit\", \"offset\", \"having\",\n  \
  \                                \"union\", \"returning\", \"for\\\\s+update\",\
  \ \"window\"])\n\n\ndef join_on_parts(stmt):\n    return re.findall(r\"\\bon\\b(.*?)(?=\\\
  b(?:join|left|right|inner|full|cross|where|group|order|limit|union)\\b|$)\",\n \
  \                     stmt, re.I)\n\n\ndef aliases(stmt):\n    amap = {}\n    for\
  \ m in re.finditer(r\"\\b(?:from|join)\\s+([a-z_][\\w.]*)(?:\\s+(?:as\\s+)?([a-z_]\\\
  w*))?\", stmt, re.I):\n        table, alias = m.group(1).lower(), (m.group(2) or\
  \ \"\").lower()\n        if table == \"select\" or table.startswith(\"(\"):\n  \
  \          continue\n        amap[table.split(\".\")[-1]] = table.split(\".\")[-1]\n\
  \        if alias and alias not in KEYWORDS:\n            amap[alias] = table.split(\"\
  .\")[-1]\n    return amap\n\n\ndef shape(stmt):\n    s = re.sub(r\"'S\\d+'\", \"\
  ?\", stmt)\n    s = re.sub(r\"\\b\\d+(\\.\\d+)?\\b\", \"?\", s)\n    s = re.sub(r\"\
  \\(\\s*\\?(\\s*,\\s*\\?)*\\s*\\)\", \"(?)\", s)\n    return s.lower()\n\n\ndef review_sql(text,\
  \ repeat=3, indexes=None):\n    stmts, lits = split_statements(text)\n    if not\
  \ stmts:\n        raise DataError(\"no SQL statements found\")\n    findings = []\n\
  \n    def add(sev, code, n, msg):\n        findings.append({\"severity\": sev, \"\
  code\": code, \"statement\": n, \"message\": msg})\n\n    shapes = defaultdict(list)\n\
  \    for n, st in enumerate(stmts, 1):\n        low = st.lower()\n        kind =\
  \ low.split()[0]\n        shapes[shape(st)].append(n)\n        where = where_part(st)\n\
  \        ons = join_on_parts(st)\n        filt = \" AND \".join([where] + ons)\n\
  \        if re.search(r\"\\bselect\\s+(distinct\\s+)?(\\w+\\.)?\\*\", low) or re.search(r\"\
  ,\\s*\\w+\\.\\*\", low):\n            add(\"MEDIUM\", \"SELECT_STAR\", n, \"SELECT\
  \ * reads every column; list the columns you need so a covering index can serve\
  \ the query\")\n        for m in re.finditer(r\"\\b(\" + \"|\".join(FUNCS) + r\"\
  )\\s*\\(\\s*([a-z_][\\w]*(?:\\.[a-z_]\\w*)?)\\b[^()]*\\)\\s*(=|<>|!=|<=|>=|<|>|\\\
  bin\\b|\\blike\\b|\\bbetween\\b)\",\n                             filt, re.I):\n\
  \            col = m.group(2)\n            if col.lower() in KEYWORDS or re.fullmatch(r\"\
  S\\d+\", col):\n                continue\n            add(\"HIGH\", \"FUNC_ON_COLUMN\"\
  , n, f\"{m.group(1)}({col}) in a filter hides {col} from its index; compare the\
  \ bare column (e.g. a range on the raw value) or add an expression index\")\n  \
  \      for m in re.finditer(r\"([a-z_][\\w.]*)\\s*[+\\-*/]\\s*\\d+\\s*(=|<|>|<=|>=)\"\
  , filt, re.I):\n            add(\"HIGH\", \"FUNC_ON_COLUMN\", n, f\"arithmetic on\
  \ {m.group(1)} in a filter; move it to the other side of the comparison\")\n   \
  \     for m in re.finditer(r\"([a-z_][\\w.]*)\\s+(not\\s+)?(i?like)\\s+'S(\\d+)'\"\
  , st, re.I):\n            pat = lits[int(m.group(4))]\n            if pat[:1] in\
  \ (\"%\", \"_\"):\n                add(\"HIGH\", \"LEADING_WILDCARD\", n, f\"{m.group(1)}\
  \ {m.group(3).upper()} '{pat}' starts with a wildcard, so no B-tree index helps;\
  \ use full-text search, a trigram index or a reversed column\")\n        if re.search(r\"\
  order\\s+by\\s+(rand|random|newid)\\s*\\(\\s*\\)\", low):\n            add(\"HIGH\"\
  , \"ORDER_BY_RANDOM\", n, \"ORDER BY random sorts every row; pick random ids or\
  \ use TABLESAMPLE\")\n        if kind in (\"update\", \"delete\") and not where.strip():\n\
  \            add(\"HIGH\", \"NO_WHERE_WRITE\", n, f\"{kind.upper()} without WHERE\
  \ touches every row; add a WHERE clause or batch it\")\n        if where:\n    \
  \        top = where\n            while re.search(r\"\\([^()]*\\)\", top):\n   \
  \             top = re.sub(r\"\\([^()]*\\)\", \" _ \", top)\n            top = re.sub(r\"\
  \\bbetween\\s+\\S+\\s+and\\b\", \"between x\", top, flags=re.I)\n            if\
  \ re.search(r\"\\band\\b\", top, re.I) and re.search(r\"\\bor\\b\", top, re.I):\n\
  \                add(\"HIGH\", \"AND_OR_PRECEDENCE\", n, \"AND and OR are mixed\
  \ without parentheses; AND binds first, so 'a AND b OR c' returns every row matching\
  \ c; add parentheses: a AND (b OR c)\")\n            for group in re.split(r\"\\\
  band\\b\", where, flags=re.I):\n                if not re.search(r\"\\bor\\b\",\
  \ group, re.I):\n                    continue\n                cols = re.findall(r\"\
  ([a-z_][\\w.]*)\\s*(?:=|<>|!=|<|>|\\bin\\b|\\blike\\b)\", group, re.I)\n       \
  \         cols = [c.lower() for c in cols if c.lower() not in KEYWORDS and not re.fullmatch(r\"\
  s\\d+\", c.lower())]\n                if len(set(cols)) >= 2:\n                \
  \    add(\"MEDIUM\", \"OR_ACROSS_COLUMNS\", n, f\"OR across {', '.join(sorted(set(cols)))}:\
  \ one index cannot serve both sides; split into UNION ALL of indexed queries (or\
  \ check the plan uses a bitmap OR)\")\n                elif len(cols) >= 2:\n  \
  \                  add(\"LOW\", \"OR_SAME_COLUMN\", n, f\"repeated OR on {cols[0]};\
  \ write {cols[0]} IN (...)\")\n        for m in re.finditer(r\"([a-z_][\\w.]*)\\\
  s*(=|<>|!=|<|>)\\s*'S(\\d+)'\", filt, re.I):\n            col = m.group(1).split(\"\
  .\")[-1].lower()\n            if ID_COL.search(col) and re.fullmatch(r\"-?\\d+(\\\
  .\\d+)?\", lits[int(m.group(3))]):\n                add(\"LOW\", \"QUOTED_NUMBER\"\
  , n, f\"{m.group(1)} compared with the string '{lits[int(m.group(3))]}'; bind it\
  \ as a number so the driver never sends a text parameter\")\n        for m in re.finditer(r\"\
  ([a-z_][\\w.]*)\\s*(=|<>|!=)\\s*(\\d{3,})\\b\", filt, re.I):\n            col =\
  \ m.group(1).split(\".\")[-1].lower()\n            if TEXT_COL.search(col):\n  \
  \              add(\"MEDIUM\", \"IMPLICIT_CAST\", n, f\"{m.group(1)} looks like\
  \ a text column but is compared with the number {m.group(3)}; MySQL then casts every\
  \ row and skips the index (PostgreSQL raises a type error); quote the value\")\n\
  \        if re.search(r\"\\bnot\\s+in\\s*\\(\\s*select\\b\", low):\n           \
  \ add(\"MEDIUM\", \"NOT_IN_SUBQUERY\", n, \"NOT IN (SELECT ...) returns no rows\
  \ if the subquery yields a NULL and often plans badly; use NOT EXISTS\")\n     \
  \   m = re.search(r\"\\boffset\\s+(\\d+)\", low) or re.search(r\"\\blimit\\s+(\\\
  d+)\\s*,\\s*\\d+\", low)\n        if m and int(m.group(1)) >= 1000:\n          \
  \  add(\"MEDIUM\", \"DEEP_OFFSET\", n, f\"OFFSET {m.group(1)} reads and throws away\
  \ {m.group(1)} rows; use keyset pagination (WHERE (created_at, id) < (?, ?) ORDER\
  \ BY ... LIMIT n)\")\n        if re.search(r\"count\\s*\\(\\s*(\\*|1)\\s*\\)\\s*(>\\\
  s*0|>=\\s*1)\", low):\n            add(\"LOW\", \"COUNT_FOR_EXISTS\", n, \"COUNT(*)\
  \ > 0 counts every match; EXISTS stops at the first\")\n        if re.search(r\"\
  \\bselect\\s+distinct\\b\", low) and re.search(r\"\\bjoin\\b\", low):\n        \
  \    add(\"LOW\", \"DISTINCT_JOIN\", n, \"DISTINCT on a join often hides duplicate\
  \ rows from a one-to-many join; use EXISTS or aggregate first\")\n        if indexes\
  \ is not None:\n            amap = aliases(st)\n            seen = set()\n     \
  \       for m in re.finditer(r\"\\b([a-z_]\\w*)\\.([a-z_]\\w*)\\s*(?:=|<|>|<=|>=|\\\
  bin\\b|\\bbetween\\b)\", filt, re.I):\n                table = amap.get(m.group(1).lower())\n\
  \                col = m.group(2).lower()\n                if not table or (table,\
  \ col) in seen:\n                    continue\n                seen.add((table,\
  \ col))\n                if table in indexes and col not in indexes[table]:\n  \
  \                  add(\"MEDIUM\", \"NO_INDEX_FOR_FILTER\", n, f\"{table}.{col}\
  \ is filtered or joined but no listed index on {table} starts with it\")\n    for\
  \ sh, ns in shapes.items():\n        if len(ns) >= repeat and (\"where\" in sh):\n\
  \            add(\"HIGH\", \"N_PLUS_ONE\", ns[0], f\"statements {', '.join(map(str,\
  \ ns))} have the same shape with different values ({len(ns)}x); fetch them in one\
  \ query with IN (...) or a JOIN\")\n    findings.sort(key=lambda f: (SEV_ORDER[f[\"\
  severity\"]], f[\"statement\"], f[\"code\"]))\n    shown = [re.sub(r\"'S(\\d+)'\"\
  , lambda m: \"'\" + lits[int(m.group(1))].replace(\"'\", \"''\") + \"'\", st) for\
  \ st in stmts]\n    return shown, findings\n\n\ndef parse_indexes(text):\n    idx\
  \ = defaultdict(set)\n    for line in text.splitlines():\n        m = re.match(r\"\
  \\s*([\\w.]+)\\s*\\(\\s*([\\w\\s,]+)\\)\", line)\n        if m:\n            idx[m.group(1).split(\"\
  .\")[-1].lower()].add(m.group(2).split(\",\")[0].strip().lower())\n    return idx\n\
  \n\ndef review_explain(text, large=10000):\n    findings = []\n\n    def add(sev,\
  \ code, msg):\n        findings.append({\"severity\": sev, \"code\": code, \"statement\"\
  : 0, \"message\": msg})\n    lines = text.splitlines()\n    if re.search(r\"^\\\
  s*(\\*+ \\d+\\. row|select_type:)\", text, re.M):\n        for block in re.split(r\"\
  \\*+ \\d+\\. row \\*+\", text):\n            f = dict(re.findall(r\"^\\s*(\\w+):\\\
  s*(.*?)\\s*$\", block, re.M))\n            if not f:\n                continue\n\
  \            rows = int(f.get(\"rows\", \"0\") or 0)\n            if f.get(\"type\"\
  ) == \"ALL\" and rows >= large:\n                add(\"HIGH\", \"SEQ_SCAN_LARGE\"\
  , f\"full table scan (type ALL) on {f.get('table')} ~{rows} rows; key={f.get('key',\
  \ 'NULL')}\")\n            extra = f.get(\"Extra\", \"\")\n            if \"Using\
  \ filesort\" in extra and \"Using temporary\" in extra:\n                add(\"\
  MEDIUM\", \"DISK_SORT\", f\"{f.get('table')}: Using temporary; Using filesort -\
  \ an index matching GROUP BY/ORDER BY avoids it\")\n            filtered = float(f.get(\"\
  filtered\", \"100\") or 100)\n            if rows >= 1000 and filtered <= 10:\n\
  \                add(\"MEDIUM\", \"ROWS_REMOVED\", f\"{f.get('table')}: only {filtered:g}%\
  \ of {rows} rows pass the filter\")\n        return findings\n    for i, line in\
  \ enumerate(lines):\n        m = re.search(r\"(Parallel )?Seq Scan on (\\S+).*?rows=(\\\
  d+)\", line)\n        if m:\n            act = re.search(r\"actual[^)]*rows=(\\\
  d+)\", line)\n            rows = int(act.group(1) if act else m.group(3))\n    \
  \        if rows >= large:\n                add(\"HIGH\", \"SEQ_SCAN_LARGE\", f\"\
  Seq Scan on {m.group(2)} returns ~{rows} rows; an index on the filter columns may\
  \ help\")\n        m = re.search(r\"Rows Removed by Filter:\\s*(\\d+)\", line)\n\
  \        if m:\n            removed = int(m.group(1))\n            prev = next((l\
  \ for l in reversed(lines[:i]) if \"actual\" in l), \"\")\n            k = re.search(r\"\
  actual[^)]*rows=(\\d+)\", prev)\n            kept = int(k.group(1)) if k else 0\n\
  \            if removed >= 1000 and removed >= 9 * max(kept, 1):\n             \
  \   add(\"MEDIUM\", \"ROWS_REMOVED\", f\"filter removed {removed} rows to keep {kept}\
  \ ({prev.strip()[:60]}...)\")\n        m = re.search(r\"cost=[\\d.]+\\.\\.[\\d.]+\
  \ rows=(\\d+).*actual time=[\\d.]+\\.\\.[\\d.]+ rows=(\\d+) loops=(\\d+)\", line)\n\
  \        if m:\n            est, act, loops = int(m.group(1)), int(m.group(2)),\
  \ int(m.group(3))\n            if max(est, act) >= 100 and max(est, act) >= 10 *\
  \ max(min(est, act), 1):\n                node = line.strip().lstrip(\"->\").strip().split(\"\
  \  \")[0]\n                add(\"MEDIUM\", \"EST_MISMATCH\", f\"{node[:50]}: estimated\
  \ {est} rows, actual {act}; run ANALYZE\")\n            if loops >= 1000:\n    \
  \            node = line.strip().lstrip(\"->\").strip().split(\"  \")[0]\n     \
  \           add(\"LOW\", \"NESTED_LOOP_MANY\", f\"{node[:50]} runs {loops} loops;\
  \ check the join index or consider a hash join\")\n        if re.search(r\"Sort\
  \ Method: external merge\", line):\n            add(\"MEDIUM\", \"DISK_SORT\", \"\
  sort spilled to disk (external merge); add an index for ORDER BY or raise work_mem\
  \ for this query\")\n    findings.sort(key=lambda f: SEV_ORDER[f[\"severity\"]])\n\
  \    return findings\n\n\ndef render(path, stmts, findings):\n    out = [f\"# SQL\
  \ performance review: {path}\", \"\",\n           f\"{len(stmts)} statement(s);\
  \ {sum(f['severity'] == 'HIGH' for f in findings)} HIGH, \"\n           f\"{sum(f['severity']\
  \ == 'MEDIUM' for f in findings)} MEDIUM, {sum(f['severity'] == 'LOW' for f in findings)}\
  \ LOW\", \"\"]\n    for n, st in enumerate(stmts, 1):\n        out.append(f\"{n}.\
  \ {st[:110]}{'...' if len(st) > 110 else ''}\")\n    out += [\"\", \"## Findings\"\
  ]\n    if not findings:\n        out.append(\"- none (heuristics only: still check\
  \ the real plan with EXPLAIN ANALYZE)\")\n    for f in findings:\n        where\
  \ = f\"stmt {f['statement']}\" if f[\"statement\"] else \"EXPLAIN\"\n        out.append(f\"\
  - {f['severity']} {f['code']} ({where}): {f['message']}\")\n    return \"\\n\".join(out)\n\
  \n\ndef self_test():\n    results = []\n\n    def check(name, cond):\n        results.append(cond)\n\
  \        print((\"PASS \" if cond else \"FAIL \") + name)\n\n    def codes(sql,\
  \ **kw):\n        return [f[\"code\"] for f in review_sql(sql, **kw)[1]]\n    check(\"\
  select star\", \"SELECT_STAR\" in codes(\"SELECT * FROM users WHERE id = 1\"))\n\
  \    check(\"alias star\", \"SELECT_STAR\" in codes(\"SELECT o.* FROM orders o WHERE\
  \ o.id = 1\"))\n    check(\"explicit columns ok\", \"SELECT_STAR\" not in codes(\"\
  SELECT id, name FROM users WHERE id = 1\"))\n    check(\"lower(col) HIGH\", \"FUNC_ON_COLUMN\"\
  \ in codes(\"SELECT id FROM users WHERE LOWER(email) = 'a@b.c'\"))\n    check(\"\
  year(col) HIGH\", \"FUNC_ON_COLUMN\" in codes(\"SELECT id FROM orders WHERE YEAR(created_at)\
  \ = 2026\"))\n    check(\"arithmetic HIGH\", \"FUNC_ON_COLUMN\" in codes(\"SELECT\
  \ id FROM t WHERE price * 2 > 100\"))\n    check(\"function on value side ok\",\
  \ \"FUNC_ON_COLUMN\" not in codes(\"SELECT id FROM users WHERE email = LOWER('A@B.C')\"\
  ))\n    check(\"leading wildcard\", \"LEADING_WILDCARD\" in codes(\"SELECT id FROM\
  \ p WHERE name LIKE '%phone%'\"))\n    check(\"trailing wildcard ok\", \"LEADING_WILDCARD\"\
  \ not in codes(\"SELECT id FROM p WHERE name LIKE 'phone%'\"))\n    check(\"wildcard\
  \ inside string literal ignored\", \"LEADING_WILDCARD\" not in codes(\"SELECT 'x\
  \ LIKE %y' AS note FROM p WHERE id = 1\"))\n    check(\"N+1 detected\", \"N_PLUS_ONE\"\
  \ in codes(\"SELECT name FROM users WHERE id = 1; SELECT name FROM users WHERE id\
  \ = 2; SELECT name FROM users WHERE id = 3;\"))\n    check(\"2 repeats not N+1\"\
  , \"N_PLUS_ONE\" not in codes(\"SELECT name FROM users WHERE id = 1; SELECT name\
  \ FROM users WHERE id = 2;\"))\n    check(\"OR across columns\", \"OR_ACROSS_COLUMNS\"\
  \ in codes(\"SELECT id FROM u WHERE email = 'a' OR phone = 'b'\"))\n    check(\"\
  OR same column LOW\", \"OR_SAME_COLUMN\" in codes(\"SELECT id FROM u WHERE status\
  \ = 'a' OR status = 'b'\"))\n    check(\"quoted number LOW\", \"QUOTED_NUMBER\"\
  \ in codes(\"SELECT id FROM orders WHERE customer_id = '42'\"))\n    check(\"implicit\
  \ cast phone number\", \"IMPLICIT_CAST\" in codes(\"SELECT id FROM users WHERE phone\
  \ = 5551234\"))\n    check(\"number id ok\", \"QUOTED_NUMBER\" not in codes(\"SELECT\
  \ id FROM orders WHERE customer_id = 42\"))\n    check(\"NOT IN subquery\", \"NOT_IN_SUBQUERY\"\
  \ in codes(\"SELECT id FROM a WHERE id NOT IN (SELECT a_id FROM b)\"))\n    check(\"\
  deep offset\", \"DEEP_OFFSET\" in codes(\"SELECT id FROM a ORDER BY id LIMIT 20\
  \ OFFSET 50000\"))\n    check(\"mysql limit a,b offset\", \"DEEP_OFFSET\" in codes(\"\
  SELECT id FROM a ORDER BY id LIMIT 20000, 20\"))\n    check(\"order by rand\", \"\
  ORDER_BY_RANDOM\" in codes(\"SELECT id FROM a ORDER BY RAND() LIMIT 1\"))\n    check(\"\
  delete without where\", \"NO_WHERE_WRITE\" in codes(\"DELETE FROM sessions\"))\n\
  \    check(\"AND/OR precedence HIGH\", \"AND_OR_PRECEDENCE\" in codes(\"SELECT id\
  \ FROM o WHERE a = 1 AND b = 2 OR b = 3\"))\n    check(\"parenthesized OR ok\",\
  \ \"AND_OR_PRECEDENCE\" not in codes(\"SELECT id FROM o WHERE a = 1 AND (b = 2 OR\
  \ b = 3)\"))\n    check(\"BETWEEN ... AND not an AND\", \"AND_OR_PRECEDENCE\" not\
  \ in codes(\"SELECT id FROM o WHERE d BETWEEN 1 AND 5 OR e = 2\"))\n    check(\"\
  literals restored in output\", \"'mina'\" in review_sql(\"SELECT id FROM u WHERE\
  \ name = 'mina'\")[0][0])\n    check(\"count for exists\", \"COUNT_FOR_EXISTS\"\
  \ in codes(\"SELECT CASE WHEN COUNT(*) > 0 THEN 1 END FROM a WHERE b = 1\"))\n \
  \   check(\"distinct join\", \"DISTINCT_JOIN\" in codes(\"SELECT DISTINCT u.id FROM\
  \ users u JOIN orders o ON o.user_id = u.id\"))\n    idx = parse_indexes(\"orders(customer_id,\
  \ created_at)\\nusers(id)\")\n    c = codes(\"SELECT o.id FROM orders o JOIN users\
  \ u ON u.id = o.customer_id WHERE o.status = 'paid'\", indexes=idx)\n    check(\"\
  no index for filter\", c.count(\"NO_INDEX_FOR_FILTER\") == 1)\n    check(\"comments\
  \ stripped\", codes(\"-- SELECT * FROM x\\nSELECT id FROM users WHERE id = 1\")\
  \ == [])\n    pg = \"\"\"Seq Scan on orders  (cost=0.00..25000.00 rows=50 width=8)\
  \ (actual time=0.1..310.2 rows=48210 loops=1)\n  Filter: (status = 'paid'::text)\n\
  \  Rows Removed by Filter: 951790\nSort Method: external merge  Disk: 51200kB\"\"\
  \"\n    e = [f[\"code\"] for f in review_explain(pg)]\n    check(\"pg seq scan large\"\
  , \"SEQ_SCAN_LARGE\" in e)\n    check(\"pg rows removed\", \"ROWS_REMOVED\" in e)\n\
  \    check(\"pg estimate mismatch\", \"EST_MISMATCH\" in e)\n    check(\"pg disk\
  \ sort\", \"DISK_SORT\" in e)\n    my = \"\"\"*************************** 1. row\
  \ ***************************\n           id: 1\n  select_type: SIMPLE\n       \
  \ table: orders\n         type: ALL\n          key: NULL\n         rows: 980000\n\
  \     filtered: 5.00\n        Extra: Using where; Using temporary; Using filesort\"\
  \"\"\n    e = [f[\"code\"] for f in review_explain(my)]\n    check(\"mysql type\
  \ ALL\", \"SEQ_SCAN_LARGE\" in e and \"DISK_SORT\" in e and \"ROWS_REMOVED\" in\
  \ e)\n    try:\n        review_sql(\"  -- only a comment\\n\")\n        check(\"\
  empty input rejected\", False)\n    except DataError:\n        check(\"empty input\
  \ rejected\", True)\n    print(f\"{sum(results)}/{len(results)} passed\")\n    return\
  \ 0 if all(results) else 1\n\n\ndef main():\n    ap = argparse.ArgumentParser(description=\"\
  SQL query performance reviewer (heuristic)\")\n    ap.add_argument(\"sql\", nargs=\"\
  ?\", help=\".sql file with one or more statements\")\n    ap.add_argument(\"--explain\"\
  , help=\"EXPLAIN output (PostgreSQL text or MySQL \\\\G)\")\n    ap.add_argument(\"\
  --indexes\", help=\"known indexes, one per line: table(col1, col2)\")\n    ap.add_argument(\"\
  --repeat\", type=int, default=3, help=\"N+1 threshold (default 3)\")\n    ap.add_argument(\"\
  --large-rows\", type=int, default=10000, help=\"rows for SEQ_SCAN_LARGE (default\
  \ 10000)\")\n    ap.add_argument(\"--json\", action=\"store_true\")\n    ap.add_argument(\"\
  --self-test\", action=\"store_true\")\n    a = ap.parse_args()\n    if a.self_test:\n\
  \        return self_test()\n    if not a.sql:\n        ap.error(\"give a .sql file\
  \ or --self-test\")\n    try:\n        with open(a.sql, encoding=\"utf-8\") as fh:\n\
  \            text = fh.read()\n        idx = None\n        if a.indexes:\n     \
  \       with open(a.indexes, encoding=\"utf-8\") as fh:\n                idx = parse_indexes(fh.read())\n\
  \        stmts, findings = review_sql(text, a.repeat, idx)\n        if a.explain:\n\
  \            with open(a.explain, encoding=\"utf-8\") as fh:\n                findings\
  \ += review_explain(fh.read(), a.large_rows)\n    except (OSError, DataError) as\
  \ e:\n        print(f\"error: {e}\", file=sys.stderr)\n        return 2\n    if\
  \ a.json:\n        print(json.dumps({\"statements\": stmts, \"findings\": findings},\
  \ indent=2))\n    else:\n        print(render(a.sql, stmts, findings))\n    return\
  \ 1 if any(f[\"severity\"] == \"HIGH\" for f in findings) else 0\n\n\nif __name__\
  \ == \"__main__\":\n    sys.exit(main())"
