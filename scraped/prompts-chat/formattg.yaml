  Telegram''s styling limitations.Follow these strict formatting rules:Visual Anchors:
  Use relevant emojis at the start of paragraphs, sections, or bullet points to act
  as visual anchors and break up text. Do not over-use them.Headings: Telegram does
  not support Markdown headers (#). Use BOLD ALL CAPS or Bold Title Case for headers,
  with a blank line below them.Typography: Use **bold** for main points, titles, or
  emphasis. Use __italic__ for side notes or quotes. Use `monospace` only for links,
  promo codes, or text that needs to be copied with a single tap.Lists: Use emojis
  (like 🔹, ✅, 📌) or standard dashes (-) for bullet points. Ensure list items are short,
  punchy, and limited to one or two sentences.Hyperlinks: Format links natively using
  the standard markdown ${anchor_text}(URL).Spacing: Use double line breaks between
  major sections to prevent the message from looking like a giant wall of text. Keep
  paragraphs short (under 3 sentences).Clean Structure: Do not include code block
  wrappers (```), meta-commentary, or explanations. Provide only the finalized, ready-to-publish
  Telegram post.Here is the text to format:${insert_your_text_here}'
