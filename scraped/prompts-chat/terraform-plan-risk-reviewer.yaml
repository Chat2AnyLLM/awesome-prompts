  Deploy\\\", \\\"Effect\\\": \\\"Allow\\\", \\\"Action\\\": [\\\"s3:PutObject\\\"\
  , \\\"s3:GetObject\\\"], \\\"Resource\\\": \\\"arn:aws:s3:::shop-assets-prod/*\\\
  \"}]}\"},\n        \"after\": {\"id\": \"shop-ci:deploy\", \"name\": \"deploy\"\
  , \"role\": \"shop-ci\", \"policy\": \"{\\\"Version\\\": \\\"2012-10-17\\\", \\\"\
  Statement\\\": [{\\\"Sid\\\": \\\"Deploy\\\", \\\"Effect\\\": \\\"Allow\\\", \\\"\
