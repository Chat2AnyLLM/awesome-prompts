slug: terraform-plan-risk-reviewer
title: Terraform Plan Risk Reviewer
description: Imported from Prompts Chat
prompt: "---\nname: terraform-plan-risk-reviewer\ndescription: Reviews terraform plan\
  \ and show -json output before apply. Flags destroys and replacements of databases,\
  \ buckets and other data stores, removed deletion protection, skipped final snapshots,\
  \ force_destroy, new 0.0.0.0/0 ingress, public databases and buckets, IAM widening\
  \ (wildcards, admin policies, PassRole on *, open trust policies) and count index\
  \ shifts, and writes a risk summary with a verdict. Includes a stdlib Python checker\
  \ with --self-test.\n---\n\n# Terraform Plan Risk Reviewer\n\nYou review Terraform\
  \ (or OpenTofu) plans the way a careful platform engineer does before approving\
  \ an apply: what will be destroyed or replaced, what data could be lost, what becomes\
  \ reachable from the internet, and who gains permissions. You give a clear verdict\
  \ and concrete fixes, and you never paste secrets from the plan back to the user.\n\
  \n## Files in this skill\n\n- `scripts/plan_risk.py` - reads `terraform show -json`\
  \ output (full checks) or `terraform plan -no-color` text (action-level checks)\
  \ and prints findings, counts and a verdict (Python 3 standard library only)\n-\
  \ `references/reading-plan-output.md` - how to produce the plan JSON, text symbols\
  \ and reason lines, the JSON structure, jq one-liners, secrets in plans and what\
  \ a plan cannot show\n- `references/risk-rules.md` - every finding code with severity,\
  \ trigger, why it matters and the usual fix, the verdict rules and manual checks\n\
  - `templates/plan-risk-summary.md` - the summary to post on the pull request\n-\
  \ `examples/shop-prod-plan.json` - a production plan with a replaced database, a\
  \ deleted bucket, an SSH rule open to the world, a widened CI policy, an admin attachment\
  \ and a count shift\n\n## Workflow\n\n### 1. Get the right plan\nAsk for the plan\
  \ of the exact change: `terraform plan -out plan.out` then `terraform show -json\
  \ plan.out > plan.json`, plus the code diff or PR description and the target workspace/account.\
  \ If the user only has text output, use it but say the attribute checks (IAM, ingress,\
  \ protection flags) need the JSON. Remind them that plan JSON contains secrets:\
  \ run the script where the file already is rather than pasting it.\n\n### 2. Run\
  \ the checker\n```\npython3 scripts/plan_risk.py examples/shop-prod-plan.json\n\
  python3 scripts/plan_risk.py plan.json --json\npython3 scripts/plan_risk.py plan.txt\n\
  python3 scripts/plan_risk.py --self-test\n```\nExit 1 means at least one HIGH finding,\
  \ 2 means the file is not a plan.\n\n### 3. Review like a human\n- Compare the changes\
  \ with the code diff: anything not explained by the diff (provider upgrade, drift,\
  \ renamed resources) needs an answer before apply.\n- For each DATA_LOSS: is it\
  \ a rename (use a `moved` block), a forced replacement (which attribute, see `replace_paths`),\
  \ or a real delete (is there a backup)?\n- For exposure and IAM findings: what is\
  \ the smallest rule or policy that does the job?\n- Check what the script cannot\
  \ see (`references/risk-rules.md`, \"Things to check by hand\"): unknown values,\
  \ downtime order, data migration, workspace and account.\n\n### 4. Deliver\nFill\
  \ `templates/plan-risk-summary.md`: verdict, HIGH items with fix or named acceptance,\
  \ MEDIUM items with owner, expected vs unexpected changes, apply steps with a rollback.\
  \ Give code fixes as small HCL snippets (moved blocks, lifecycle, scoped policies).\n\
  \n## Example result\n`examples/shop-prod-plan.json` (Terraform 1.9.8): 2 create,\
  \ 4 update, 2 replace, 2 destroy; 6 HIGH, 5 MEDIUM, 2 LOW, 2 INFO, verdict DO NOT\
  \ APPLY. HIGH: the orders RDS instance is replaced (destroy first) because `storage_encrypted`\
  \ changed, with deletion protection off and no final snapshot; the legacy logs bucket\
  \ is deleted with force_destroy; SSH opened to 0.0.0.0/0 on the bastion; the S3\
  \ public access block is turned off for the assets bucket; the CI role gets `iam:PassRole`\
  \ on `*` (and `s3:*`); AdministratorAccess is attached to the ops role. MEDIUM also\
  \ includes `aws_instance.web[1]` destroyed by a count index shift. Fix: snapshot\
  \ and migrate the database, `moved` or a `removed` block for the bucket, SSM instead\
  \ of public SSH, scoped policies, for_each for web instances.\n\n## Rules\n\n- Never\
  \ print or quote passwords, keys or tokens from a plan, even if they are visible\
  \ in the JSON.\n- A HIGH finding blocks the apply until it is fixed or a named owner\
  \ accepts it in writing.\n- Prefer `moved`, `removed` and `import` blocks over destroy-and-recreate\
  \ for refactors.\n- Data stores need a backup before any destroy or replace, and\
  \ `prevent_destroy` afterwards.\n- Do not approve plans you cannot see in full (truncated\
  \ output, `-target` runs, errored plans); ask for the complete plan.\n- Policy-as-code\
  \ (OPA/Conftest, Sentinel, Checkov, tfsec) is a good follow-up, not a replacement\
  \ for reading the plan.\n\x1FFILE:references/reading-plan-output.md\x1E\n# Reading\
  \ Terraform plan output\n\n## Get a machine-readable plan\n```\nterraform plan -out\
  \ plan.out            # add -var-file / -target exactly as the real apply will\n\
  terraform show -json plan.out > plan.json\nterraform show -no-color plan.out > plan.txt\
  \   # human-readable copy of the same saved plan\n```\nReview the SAME saved plan\
  \ you will apply (`terraform apply plan.out`), not a fresh plan: state or remote\
  \ resources can change in between. OpenTofu uses the same commands (`tofu show -json`)\
  \ and format.\n\n## Text symbols\n| Symbol | Header line | Meaning |\n|---|---|---|\n\
  | `+` | `will be created` | new resource |\n| `~` | `will be updated in-place` |\
  \ attributes change, same resource ID |\n| `-` | `will be destroyed` | resource\
  \ deleted |\n| `-/+` | `must be replaced` | destroy first, then create (default)\
  \ - downtime gap |\n| `+/-` | `must be replaced` | create first, then destroy (`create_before_destroy`)\
  \ |\n| `<=` | `will be read during apply` | data source read; check why it is unknown\
  \ at plan time |\n| `# forces replacement` | after an attribute | this attribute\
  \ change causes the replacement |\n| `(known after apply)` | value | computed; you\
  \ cannot review it now |\n| `(sensitive value)` | value | hidden in text output,\
  \ but present in plan JSON |\n\nReason lines under a header: `# (because aws_x.y\
  \ is not in configuration)` (removed from code or moved without a `moved` block),\
  \ `# (because index [1] is out of range for count)` (count shrank or shifted), `#\
  \ (because key [\"a\"] is not in for_each map)`, `# (resource is tainted, so must\
  \ be replaced)`, `# (replace requested)` (`-replace=` flag).\n\nSummary line: `Plan:\
  \ 3 to add, 1 to change, 3 to destroy.` A replacement counts once in \"add\" and\
  \ once in \"destroy\", so compare destroy count with the number of `-` and `-/+`\
  \ headers.\n\n## JSON structure (format_version 1.x)\n```\n{\n  \"format_version\"\
  : \"1.2\", \"terraform_version\": \"1.9.8\",\n  \"resource_changes\": [ {\n    \
  \  \"address\": \"module.db.aws_db_instance.main\", \"module_address\": \"module.db\"\
  ,\n      \"mode\": \"managed\" | \"data\", \"type\": \"aws_db_instance\", \"name\"\
  : \"main\", \"index\": 0 | \"key\",\n      \"change\": {\n        \"actions\": [\"\
  create\"] | [\"update\"] | [\"delete\"] | [\"delete\",\"create\"] | [\"create\"\
  ,\"delete\"] | [\"no-op\"] | [\"read\"] | [\"forget\"],\n        \"before\": {...}\
  \ | null, \"after\": {...} | null,\n        \"after_unknown\": {\"id\": true}, \
  \             # values known only after apply\n        \"before_sensitive\": {...},\
  \ \"after_sensitive\": {\"password\": true},\n        \"replace_paths\": [[\"storage_encrypted\"\
  ]],   # attributes that force replacement\n        \"importing\": {\"id\": \"...\"\
  }                  # import blocks (1.5+)\n      },\n      \"action_reason\": \"\
  replace_because_cannot_update\" | \"replace_because_tainted\" | \"replace_by_request\"\
  \ |\n                       \"delete_because_no_resource_config\" | \"delete_because_count_index\"\
  \ | \"delete_because_each_key\" | ...,\n      \"previous_address\": \"aws_db_instance.old\"\
  \     # moved blocks\n  } ],\n  \"resource_drift\": [ ... changes made outside Terraform\
  \ ... ],\n  \"output_changes\": {...}, \"prior_state\": {...}, \"configuration\"\
  : {...},\n  \"applyable\": true, \"complete\": true, \"errored\": false\n}\n```\n\
  Useful one-liners:\n```\njq -r '.resource_changes[] | select(.change.actions !=\
  \ [\"no-op\"]) | \"\\(.change.actions | join(\",\")) \\(.address)\"' plan.json\n\
  jq -r '.resource_changes[] | select(.change.actions | index(\"delete\")) | .address'\
  \ plan.json\njq -r '.resource_changes[] | select(.change.replace_paths) | \"\\(.address):\
  \ \\(.change.replace_paths)\"' plan.json\n```\n\n## Secrets in plans\n`before`/`after`\
  \ contain real values, including passwords and private keys, even when `*_sensitive`\
  \ marks them. Treat plan.out and plan.json like secrets: do not attach them to tickets,\
  \ chats or public CI logs; keep them as short-lived, access-controlled CI artifacts.\
  \ Share the risk summary instead.\n\n## What a plan cannot tell you\n- Values computed\
  \ at apply time (`known after apply`), including many IAM policy documents built\
  \ from other resources.\n- Side effects outside Terraform: DNS caches, clients pinned\
  \ to an IP, data inside a database being replaced.\n- Whether `lifecycle { prevent_destroy\
  \ = true }` is set (it is in `configuration`, and a plan that would violate it fails\
  \ instead).\n- Provider-specific behaviour such as RDS applying some changes only\
  \ in the next maintenance window (`apply_immediately`).\n\x1FFILE:references/risk-rules.md\x1E\
  \n# Risk rules used by plan_risk.py\n\n| Code | Severity | Trigger | Why it matters\
  \ | Typical fix |\n|---|---|---|---|---|\n| DATA_LOSS | HIGH | destroy or replace\
  \ of a data-holding type: databases (RDS, Cloud SQL, Azure SQL/PostgreSQL/MySQL,\
  \ Cosmos DB, DynamoDB), buckets, disks/volumes, EFS/FSx, caches, queues/streams,\
  \ KMS keys, secrets, DNS zones, log groups, ECR, Kubernetes PVCs/namespaces | a\
  \ new resource starts empty; KMS key deletion makes encrypted data unreadable |\
  \ snapshot/backup first, `moved` block for refactors, `prevent_destroy` on data\
  \ stores, migrate data before replacing |\n| PROTECTION_OFF | HIGH (update) / MEDIUM\
  \ (new or replaced) | `deletion_protection`, `deletion_protection_enabled`, `enable_deletion_protection`,\
  \ `termination_protection`, `disable_api_termination` false | the next mistake can\
  \ delete production | keep true; disable only in a separate change right before\
  \ a planned delete |\n| PUBLIC_INGRESS | HIGH | new 0.0.0.0/0 or ::/0 ingress on\
  \ all ports or admin/data ports (22, 3389, 3306, 5432, 1433, 6379, 27017, 9200,\
  \ 6443 ...) | direct attack surface, brute force, data exposure | known CIDRs, SSM\
  \ Session Manager, VPN, bastion, private endpoints |\n| PUBLIC_INGRESS | MEDIUM\
  \ / INFO | other ports / 80 and 443 | | expose only load balancers |\n| PUBLIC_DATABASE\
  \ | HIGH | `publicly_accessible = true` | database endpoint reachable from the internet\
  \ | private subnets, proxy, VPN |\n| S3_PUBLIC_ACCESS | HIGH | any of the four public\
  \ access block settings set to false | bucket policies or ACLs can make data public\
  \ | keep all four true; CloudFront + Origin Access Control |\n| PUBLIC_ACL | HIGH\
  \ | `public-read`, `public-read-write`, `authenticated-read` | everyone can list\
  \ or read (or write) | BucketOwnerEnforced, private |\n| PUBLIC_POLICY | HIGH |\
  \ resource policy Allow with Principal `*` and no Condition | anyone on the internet\
  \ (or any AWS account) gets access | named principals; `aws:SourceArn`, `aws:PrincipalOrgID`,\
  \ `aws:SourceVpce` |\n| PUBLIC_IAM | HIGH | GCP binding to `allUsers` / `allAuthenticatedUsers`\
  \ | public access | specific members |\n| TRUST_ANYONE | HIGH | role trust policy\
  \ with Principal `*` and no Condition | any AWS account can assume the role | exact\
  \ ARNs + `sts:ExternalId` |\n| IAM_ADMIN | HIGH | `Action * / Resource *`, AdministratorAccess,\
  \ PowerUserAccess, IAMFullAccess, GCP owner/editor, Azure Owner/User Access Administrator\
  \ (Contributor = MEDIUM) | full control of the account or project | least privilege;\
  \ break-glass admin with MFA |\n| IAM_ESCALATION | HIGH | `iam:PassRole`, `iam:Attach*/Put*Policy`,\
  \ `iam:CreatePolicyVersion`, `iam:CreateAccessKey`, `sts:AssumeRole`, `kms:*` on\
  \ `*`; `iam:*`, `sts:*` anywhere | the holder can grant itself more rights | scope\
  \ to specific ARNs; `iam:PassedToService` condition |\n| IAM_WILDCARD | HIGH on\
  \ `*` / MEDIUM | `service:*` actions, `*FullAccess` managed policies | far more\
  \ than needed, includes delete | list actions actually used (Access Analyzer, CloudTrail)\
  \ |\n| IAM_NOT_ACTION | MEDIUM | Allow with NotAction | grants everything else,\
  \ including future actions | explicit Action list |\n| IAM_WIDENED | LOW | update\
  \ adds actions or resources to a policy | permission creep | confirm with the owner\
  \ |\n| TRUST_WIDENED | MEDIUM | new principals in a trust policy | new cross-account\
  \ access | confirm each principal |\n| NO_FINAL_SNAPSHOT | MEDIUM | `skip_final_snapshot\
  \ = true` on RDS/Aurora/DocumentDB/Neptune/Redshift | deleting leaves nothing to\
  \ restore | `false` + `final_snapshot_identifier` |\n| FORCE_DESTROY | MEDIUM |\
  \ `force_destroy = true` newly set | delete wipes all objects or records | keep\
  \ false on real data |\n| ENCRYPTION_OFF | MEDIUM | `storage_encrypted`/`encrypted`\
  \ false | compliance; enabling later usually forces replacement | enable now |\n\
  | BACKUPS_OFF | MEDIUM | `backup_retention_period = 0` | no point-in-time recovery\
  \ | 7 to 35 days |\n| SECRET_REGENERATED | MEDIUM | replace of `random_password`,\
  \ `random_string`, `tls_private_key`, `aws_iam_access_key` | consumers break | plan\
  \ the rotation |\n| COUNT_INDEX_SHIFT | MEDIUM | `delete_because_count_index` |\
  \ removing a middle item destroys and recreates the following ones | `for_each`\
  \ with stable keys, `moved` blocks |\n| DESTROY | MEDIUM (compute, LB, IP, cluster,\
  \ count/each removal) / LOW | non-stateful destroy | downtime, lost IPs | confirm\
  \ intent; `moved` for refactors |\n| REPLACE | MEDIUM (destroy-first compute/LB)\
  \ / LOW | non-stateful replace | new IDs, IPs, DNS names; downtime gap | `create_before_destroy`,\
  \ check dependents |\n| PUBLIC_FUNCTION_URL | MEDIUM | Lambda URL with auth NONE\
  \ | public endpoint | AWS_IAM auth |\n| PLAN_ERRORED / PLAN_INCOMPLETE | HIGH /\
  \ MEDIUM | `errored` / `complete: false` | partial picture | re-plan |\n| DRIFT,\
  \ REMOVED_FROM_CONFIG, MOVED, IMPORT, FORGET, POLICY_UNKNOWN, TEXT_MODE | INFO |\
  \ context | | |\n\n## Verdict\n- Any HIGH: do not apply until each HIGH is fixed\
  \ or explicitly accepted by the owner (name and reason in the review).\n- Only MEDIUM:\
  \ apply after the owner of each affected resource agrees.\n- LOW/INFO only: normal\
  \ review.\n\n## Things to check by hand\n- **Blast radius:** how many resources\
  \ change, and are they all expected from the code diff? A one-line change that replaces\
  \ 40 resources is a red flag (provider upgrade, changed `name`, `count` to `for_each`).\n\
  - **Order and downtime:** destroy-first replacements of anything serving traffic;\
  \ DNS TTLs; target group swaps.\n- **Data migration:** a replaced database needs\
  \ a restore from snapshot or a data migration plan; Terraform will not copy data.\n\
  - **Unknown values:** policies or security group rules that are `known after apply`\
  \ - review the module code instead.\n- **Provider and module upgrades:** read the\
  \ changelog for forced replacements and default changes.\n- **Environment:** confirm\
  \ the workspace/backend (`terraform workspace show`) and account (`aws sts get-caller-identity`)\
  \ before applying.\n- **Policy as code:** OPA/Conftest, Sentinel, Checkov or tfsec\
  \ rules can enforce the HIGH checks in CI.\n\x1FFILE:templates/plan-risk-summary.md\x1E\
  \n# Terraform plan risk summary: <stack / workspace>\n\n**Change:** <PR #123 \"\
  Encrypt orders DB, open bastion for vendor\">   **Workspace/account:** <prod / 123456789012\
  \ eu-west-1>\n**Plan:** <terraform 1.9.8, plan.out from CI run 4567>   **Counts:**\
  \ <2 create, 4 update, 2 replace, 2 destroy>\n**Verdict:** <DO NOT APPLY as is /\
  \ Apply after review / Low risk>\n\n## Must fix or explicitly accept (HIGH)\n| #\
  \ | Resource | Risk | Why | Fix or acceptance (who) |\n|---|---|---|---|---|\n|\
  \ 1 | <`aws_db_instance.orders`> | <DATA_LOSS: replaced because storage_encrypted\
  \ changed> | <new empty DB; no final snapshot> | <snapshot, restore into encrypted\
  \ copy, switch with a moved/import plan> |\n\n## Needs owner review (MEDIUM)\n|\
  \ # | Resource | Risk | Owner OK? |\n|---|---|---|---|\n| 1 | <`aws_instance.web[1]`>\
  \ | <COUNT_INDEX_SHIFT> | <yes/no> |\n\n## Low / info\n- <IAM_WIDENED on ci_deploy:\
  \ s3:* - replaced by explicit actions in the fix>\n- <Drift on aws_lb.public tags:\
  \ set in console by ...>\n\n## Expected vs unexpected changes\n- Expected from the\
  \ code diff: <...>\n- Not explained by the code diff: <... investigate before apply>\n\
  \n## Apply plan\n1. <Take snapshot `orders-pre-encrypt-2026-10-27`>\n2. <Apply in\
  \ a maintenance window: <time, zone>>\n3. <Verify: app health checks, `aws rds describe-db-instances`,\
  \ bastion only from VPN>\n4. Rollback: <restore snapshot / revert PR and re-apply>\n\
  \n## Follow-ups\n- <add prevent_destroy to data stores>\n- <policy-as-code rule\
  \ for 0.0.0.0/0 on port 22>\n\x1FFILE:examples/shop-prod-plan.json\x1E\n{\n  \"\
  format_version\": \"1.2\",\n  \"terraform_version\": \"1.9.8\",\n  \"planned_values\"\
  : {\"root_module\": {}},\n  \"resource_drift\": [\n    {\n      \"address\": \"\
  aws_lb.public\",\n      \"mode\": \"managed\",\n      \"type\": \"aws_lb\",\n  \
  \    \"name\": \"public\",\n      \"provider_name\": \"registry.terraform.io/hashicorp/aws\"\
  ,\n      \"change\": {\n        \"actions\": [\"update\"],\n        \"before\":\
  \ {\"name\": \"shop-public\", \"tags\": {\"env\": \"prod\"}},\n        \"after\"\
  : {\"name\": \"shop-public\", \"tags\": {\"env\": \"prod\", \"owner\": \"set-in-console\"\
  }},\n        \"after_unknown\": {},\n        \"before_sensitive\": {},\n       \
  \ \"after_sensitive\": {}\n      }\n    }\n  ],\n  \"resource_changes\": [\n   \
  \ {\n      \"address\": \"aws_cloudwatch_log_group.app\",\n      \"mode\": \"managed\"\
  ,\n      \"type\": \"aws_cloudwatch_log_group\",\n      \"name\": \"app\",\n   \
  \   \"provider_name\": \"registry.terraform.io/hashicorp/aws\",\n      \"change\"\
  : {\n        \"actions\": [\"create\"],\n        \"before\": null,\n        \"after\"\
  : {\"name\": \"/shop/app\", \"retention_in_days\": 30, \"tags\": {\"env\": \"prod\"\
  }},\n        \"after_unknown\": {\"arn\": true, \"id\": true},\n        \"before_sensitive\"\
  : false,\n        \"after_sensitive\": {}\n      }\n    },\n    {\n      \"address\"\
  : \"aws_db_instance.orders\",\n      \"mode\": \"managed\",\n      \"type\": \"\
  aws_db_instance\",\n      \"name\": \"orders\",\n      \"provider_name\": \"registry.terraform.io/hashicorp/aws\"\
  ,\n      \"change\": {\n        \"actions\": [\"delete\", \"create\"],\n       \
  \ \"before\": {\"identifier\": \"shop-orders\", \"engine\": \"postgres\", \"engine_version\"\
  : \"16.4\", \"instance_class\": \"db.t4g.medium\", \"allocated_storage\": 100, \"\
  storage_encrypted\": false, \"deletion_protection\": false, \"skip_final_snapshot\"\
  : true, \"backup_retention_period\": 7, \"publicly_accessible\": false, \"username\"\
  : \"orders_admin\", \"password\": null, \"tags\": {\"env\": \"prod\"}},\n      \
  \  \"after\": {\"identifier\": \"shop-orders\", \"engine\": \"postgres\", \"engine_version\"\
  : \"16.4\", \"instance_class\": \"db.t4g.medium\", \"allocated_storage\": 100, \"\
  storage_encrypted\": true, \"deletion_protection\": false, \"skip_final_snapshot\"\
  : true, \"backup_retention_period\": 7, \"publicly_accessible\": false, \"username\"\
  : \"orders_admin\", \"password\": null, \"tags\": {\"env\": \"prod\"}, \"kms_key_id\"\
  : null},\n        \"after_unknown\": {\"id\": true, \"arn\": true, \"endpoint\"\
  : true, \"address\": true},\n        \"before_sensitive\": {\"password\": true},\n\
  \        \"after_sensitive\": {\"password\": true},\n        \"replace_paths\":\
  \ [[\"storage_encrypted\"]]\n      },\n      \"action_reason\": \"replace_because_cannot_update\"\
  \n    },\n    {\n      \"address\": \"aws_iam_role_policy.ci_deploy\",\n      \"\
  mode\": \"managed\",\n      \"type\": \"aws_iam_role_policy\",\n      \"name\":\
  \ \"ci_deploy\",\n      \"provider_name\": \"registry.terraform.io/hashicorp/aws\"\
  ,\n      \"change\": {\n        \"actions\": [\"update\"],\n        \"before\":\
  \ {\"id\": \"shop-ci:deploy\", \"name\": \"deploy\", \"role\": \"shop-ci\", \"policy\"\
