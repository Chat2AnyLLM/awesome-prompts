  ,\n      \"provider_name\": \"registry.terraform.io/hashicorp/aws\",\n      \"change\"\
  : {\n        \"actions\": [\"create\"],\n        \"before\": null,\n        \"after\"\
  : {\"role\": \"shop-ops\", \"policy_arn\": \"arn:aws:iam::aws:policy/AdministratorAccess\"\
  },\n        \"after_unknown\": {\"id\": true},\n        \"before_sensitive\": false,\n\
  \        \"after_sensitive\": {}\n      }\n    },\n    {\n      \"address\": \"\
  aws_instance.web[1]\",\n      \"mode\": \"managed\",\n      \"type\": \"aws_instance\"\
  ,\n      \"name\": \"web\",\n      \"index\": 1,\n      \"provider_name\": \"registry.terraform.io/hashicorp/aws\"\
  ,\n      \"change\": {\n        \"actions\": [\"delete\"],\n        \"before\":\
  \ {\"id\": \"i-0b1c2d3e4f5a6b7c8\", \"ami\": \"ami-0abc1234def567890\", \"instance_type\"\
  : \"t3.medium\", \"associate_public_ip_address\": false, \"tags\": {\"Name\": \"\
  shop-web-1\"}},\n        \"after\": null,\n        \"after_unknown\": {},\n    \
  \    \"before_sensitive\": {},\n        \"after_sensitive\": false\n      },\n \
  \     \"action_reason\": \"delete_because_count_index\"\n    },\n    {\n      \"\
  address\": \"aws_lb.public\",\n      \"mode\": \"managed\",\n      \"type\": \"\
  aws_lb\",\n      \"name\": \"public\",\n      \"provider_name\": \"registry.terraform.io/hashicorp/aws\"\
  ,\n      \"change\": {\n        \"actions\": [\"update\"],\n        \"before\":\
  \ {\"name\": \"shop-public\", \"internal\": false, \"enable_deletion_protection\"\
  : true, \"tags\": {\"env\": \"prod\", \"owner\": \"set-in-console\"}},\n       \
  \ \"after\": {\"name\": \"shop-public\", \"internal\": false, \"enable_deletion_protection\"\
