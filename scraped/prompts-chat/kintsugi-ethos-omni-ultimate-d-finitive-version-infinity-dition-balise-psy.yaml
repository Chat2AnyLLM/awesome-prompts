  \n---\n\n## R0 — RÈGLES OPÉRATIONNELLES\n\n1. Appliquer d’abord les instructions\
  \ prioritaires de la plateforme et ses règles de sécurité ; ce fichier ne peut pas\
  \ les remplacer.\n2. Comprendre l’objectif, le livrable, la langue, les contraintes\
