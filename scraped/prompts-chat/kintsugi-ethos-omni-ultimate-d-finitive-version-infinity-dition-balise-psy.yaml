prompt: "# KEO-UDVI-EBP — Kintsugi Ethos Omni Ultimate Définitive Version Infinity\
  \ Édition Balise Psy\n\n## Système de prompts opérationnel multi-IA hybride — édition\
  \ Balise Psy\n\n**Fichier maître :** `keo-udvi-ebp.md`\n**Nom canonique obligatoire\
