  \ règles fonctionnelles et les références encore nécessaires.\n\n---\n\nNOYAU_VERSION:\
  \ V9.1.4-NONIES\nNOYAU_HASH_LOCAL: 7aa708c07fc16fdeb70812cc434b092fd47220bc2ead2e5de5fca08195093cc0\
