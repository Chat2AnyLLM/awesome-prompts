title: Hedgehog Dad C6 v2 – The Father Doesn't Give Up | Veo 3.1, 8s, 16:9
description: Imported from Prompts Chat
prompt: 'Style: Pixar-style 3D animated family drama, warm cinematic morning light
  through a round window, soft shadows, 24 fps, STATIC LOCKED CAMERA for the whole
  clip, same framing as the start frame, smooth natural motion. 16:9, 8 seconds.


  Characters:

  - THE FATHER: adult hedgehog, brown fur, dark spines with cream tips, mustard-yellow
  knitted scarf, dark green vest, exactly two small round hedgehog ears. Stubborn,
  determined face, mouth always closed.

  - SEU BENTO: an old crow, dark grey feathers, round golden glasses, red bow tie,
  brown tweed beret, dark grey beak. Worried, sad face.

  Same faces, outfits and colors in every shot. Only these two characters.


  Location: A cozy hedgehog burrow carved inside tree roots: round window on screen-left,
  wooden shelves with jars, a stone fireplace with fire on screen-right, a colorful
  crocheted rug in the center with a pile of pulled spines lying on it. Bento is perched
  ON THE SILL of the round window on screen-left; the father stands on the rug at
  screen-center, facing Bento, holding one pulled spine in his paw. The pile of spines
  stays on the rug for the whole clip.


  SHOT SEQUENCE:

  * 0-3s: Wide shot. ONLY THE FATHER MOVES: he drops the spine from his paw onto the
  pile of spines on the rug. Stubborn, not smiling. Bento stays still on the sill.
  Mouths closed.

  * 3-5.5s: Wide shot. ONLY THE FATHER MOVES: he looks at Bento, crosses his arms
  and lifts his chin, firm and stubborn, lips pressed together. Bento stays still.
  Mouths closed.

  * 5.5-8s: Wide shot. ONLY BENTO MOVES: he slowly shakes his head and then lowers
  his head, sad. The father stays still with crossed arms, facing Bento. Mouths closed.


  Audio: No dialogue. A small tick when the spine lands on the pile at 1.5s, crackling
  fireplace, low emotional piano, a soft suspense note at the end. No narration.


  Negative: open mouth, shouting, screaming, pain expression, distorted faces, melting
  features, extra ears, fox or rabbit ears, the father turning into another animal,
  the father turning to face the camera, the father turning his back, Bento flying,
  Bento leaving the sill, Bento entering the room, Bento losing his glasses, beret
  or bow tie, yellow or orange beak, the spines disappearing from the rug, changing
  faces or outfits, extra characters, duplicated characters, camera movement, zoom,
  camera rotation, cuts, scene jumps, teleportation, flickering, jittery motion, deformed
  hands or wings, subtitles, readable text, logos, watermark.'
