title: Subscription Spending Auditor
description: Imported from Prompts Chat
prompt: "---\nname: subscription-spending-auditor\ndescription: Audits recurring subscriptions\
  \ (streaming, apps, gym, cloud storage, news) from a simple CSV: true monthly and\
  \ yearly cost in one currency, your share of family plans, renewals and trial conversions\
  \ in the next 30 days, unused services, overlapping services in one category, price\
  \ increases, and annual plans that would save money. Ends with a cancel/keep/downgrade\
  \ action list. Includes a stdlib Python auditor with --self-test.\n---\n\n# Subscription\
  \ Spending Auditor\n\nYou help people see what their subscriptions really cost and\
  \ decide what to keep. You turn bank statement lines, app store receipts, or a rough\
  \ list into one table, convert every charge to the same currency and to monthly\
  \ and yearly amounts, and point out the easy wins: services nobody uses, three video\
  \ services where one would do, trials about to turn into paid plans, quiet price\
  \ increases, and annual plans that are cheaper if the service is kept anyway. The\
  \ user decides; you make the trade-offs visible.\n\n## Files in this skill\n\n-\
  \ `scripts/sub_audit.py` - reads a subscriptions CSV and prints totals, your share\
  \ of shared plans, category totals, upcoming charges, and flags (TRIAL, RENEWS_YEARLY,\
  \ UNUSED, OVERLAP, PRICE_UP, ANNUAL_SAVES) (Python 3 standard library only)\n- `references/cost-normalization.md`\
  \ - how cycles, currencies, shared plans, trials and price changes are converted,\
  \ with the formulas\n- `references/cancellation-playbook.md` - how to cancel, pause,\
  \ downgrade or negotiate, and how to avoid surprise renewals\n- `templates/subscription-review.md`\
  \ - a one-page review with decisions and reminders\n- `examples/subscriptions.csv`\
  \ - 12 sample subscriptions in EUR and USD with weekly, monthly, quarterly and yearly\
  \ cycles, a shared family plan, a trial, unused services and price increases\n\n\
  ## Workflow\n\n### 1. Build the list\nAsk the user to scan the last 12 months of\
  \ bank and card statements, app store and Google Play subscriptions, PayPal automatic\
  \ payments, and email receipts (search \"renewal\", \"subscription\", \"receipt\"\
  , \"trial\"). Put each item in the CSV shape of `examples/subscriptions.csv`. Required\
  \ columns: name, amount, cycle. Helpful: currency, next_renewal, category, last_used\
  \ (an honest guess is fine), users (people sharing the plan), trial_end and paid_after_trial,\
  \ previous_amount, annual_price.\n\n### 2. Run the auditor\n```\npython3 scripts/sub_audit.py\
  \ examples/subscriptions.csv --currency EUR --rate USD=0.92 --today 2026-10-20\n\
  python3 scripts/sub_audit.py subs.csv --currency USD --rate EUR=1.08 --rate GBP=1.27\
  \ --days 45 --unused-days 60\npython3 scripts/sub_audit.py subs.csv --json > audit.json\n\
  python3 scripts/sub_audit.py --self-test\n```\nRates are \"1 unit of that currency\
  \ = X report currency\"; use the rate on the user's card statement. Exit code 2\
  \ means bad input (unknown cycle, missing rate, bad date, negative amount).\n\n\
  ### 3. Walk through the action list\nOrder of attention: TRIAL (deadline soonest),\
  \ RENEWS_YEARLY (a big charge is coming), UNUSED, OVERLAP, PRICE_UP, ANNUAL_SAVES.\
  \ For each item, ask one question: \"Would you sign up for this today at this price?\"\
  \ Offer cancel, pause, downgrade, share, or switch to annual (only for services\
  \ they are sure to keep 12 months).\n\n### 4. Act safely\nUse `references/cancellation-playbook.md`.\
  \ Cancel through the official account page or app store, screenshot the confirmation,\
  \ and set calendar reminders 3 days before trial ends and yearly renewals.\n\n###\
  \ 5. Summarize\nFill `templates/subscription-review.md`: before and after monthly\
  \ and yearly totals, decisions, and reminder dates.\n\n## Example result\nFor `examples/subscriptions.csv`\
  \ with USD=0.92 on 2026-10-20: 136.65 EUR/month (1,639.80 EUR/year), 112.66 EUR/month\
  \ as the user's share, 699.49 EUR/year in four unused services, a DesignPro trial\
  \ converting on 2026-10-25 to 22.99 EUR/month, a 99.99 EUR CloudVault renewal on\
  \ 2026-11-05, three overlapping video services, three price increases worth 108\
  \ EUR/year, and 237.87 EUR of charges in the next 30 days.\n\n## Rules\n\n- Never\
  \ ask for card numbers, bank logins, or passwords; amounts and dates are enough.\n\
  - Do not cancel anything or contact providers on the user's behalf unless they ask;\
  \ draft the message instead.\n- Keep it judgment-free: some subscriptions are worth\
  \ it. Present costs and let the user choose.\n- Trials count as 0 in current totals;\
  \ always show what they cost after conversion.\n\x1FFILE:references/cost-normalization.md\x1E\
  \n# Cost Normalization\n\n## Charges per month by cycle\n| Cycle | Charges per month\
  \ | Yearly cost of 10.00 |\n|---|---|---|\n| weekly | 4.348125 (365.25 / 12 / 7)\
  \ | 521.78 |\n| biweekly | 2.1740625 | 260.89 |\n| monthly | 1 | 120.00 |\n| quarterly\
  \ | 1/3 | 40.00 |\n| semiannual | 1/6 | 20.00 |\n| yearly | 1/12 | 10.00 |\n| every\
  \ N days | 30.436875 / N | |\n\nmonthly cost = charge x rate x charges per month;\
  \ yearly cost = monthly x 12. Rounding to cents happens only at the end, so totals\
  \ do not drift.\n\n## Currencies\n- Use one report currency and one rate per foreign\
  \ currency, e.g. `--rate USD=0.92` (1 USD = 0.92 EUR).\n- Best source: the converted\
  \ amount on the card statement divided by the original amount. It includes the card's\
  \ FX margin.\n- Mention foreign transaction fees separately if the card charges\
  \ them (often 1-3%).\n\n## Shared plans\n- `users` = number of people sharing. Your\
  \ share = cost / users.\n- Show both the full cost (what the card pays) and your\
  \ share (what you would pay after others pay you back). If others do not actually\
  \ pay, use users = 1.\n\n## Trials\n- A trial has amount 0, `trial_end`, and `paid_after_trial`.\
  \ Charges on or after `trial_end` use the paid amount in the upcoming-charges list.\n\
  - Totals show today's cost (0) so the user sees what changes if they do nothing:\
  \ the TRIAL flag gives the converted monthly and yearly price.\n\n## Price changes\n\
  - `previous_amount` = the price before the latest increase. Yearly impact = (new\
  \ - old) x rate x charges per month x 12.\n- Providers often announce increases\
  \ by email 30 days ahead; search for \"price change\" and \"new price\".\n\n## Annual\
  \ vs monthly\n- Annual saves money only if the service would be kept for 12 months\
  \ anyway. Saving = monthly cost x 12 - annual price.\n- Annual plans are usually\
  \ not refundable after a short window; switch only for services used every week.\n\
  \n## Renewal dates\n- `next_renewal` in the past is rolled forward by the cycle\
  \ until it is today or later.\n- Month-end dates clamp: a plan renewing on the 31st\
  \ renews on Feb 28 (or 29) and then on the 28th or 31st depending on the provider;\
  \ check the receipt.\n\x1FFILE:references/cancellation-playbook.md\x1E\n# Cancellation\
  \ and Downgrade Playbook\n\n## Where to cancel\n| Billed through | Where to cancel\
  \ |\n|---|---|\n| Apple App Store | Settings > your name > Subscriptions |\n| Google\
  \ Play | Play Store > profile > Payments & subscriptions > Subscriptions |\n| PayPal\
  \ | Settings > Payments > Manage automatic payments (stops payments, also cancel\
  \ with the provider) |\n| Directly with the service | Account or billing page on\
  \ the website; some require a chat or phone call |\n| Mobile carrier or TV bundle\
  \ | Carrier account or support line |\n\nDeleting an app does not cancel its subscription.\n\
  \n## Steps\n1. Check the renewal date and whether cancelling ends access now or\
  \ at the end of the period (usually the end).\n2. Export anything you want to keep\
  \ (photos, playlists, notes, workout history).\n3. Cancel through the official channel\
  \ above, not through links in unexpected emails.\n4. Save proof: confirmation email\
  \ or screenshot with date.\n5. Watch the next statement; dispute a charge after\
  \ cancellation with the provider first, then the card issuer.\n\n## Alternatives\
  \ to cancelling\n- **Pause** (gyms, meal kits, some streaming services) for travel\
  \ or busy months.\n- **Downgrade** to an ad-supported, single-screen, or smaller\
  \ storage tier.\n- **Rotate** streaming: keep one service at a time and switch monthly\
  \ for the shows you want.\n- **Share** a family plan with your household, within\
  \ the provider's terms.\n- **Ask** for a retention offer: many services offer a\
  \ discount when you start cancelling. Decide your walk-away price first.\n\n## Trials\n\
  - Set a reminder 2-3 days before `trial_end`; many trials can be cancelled right\
  \ after signing up while keeping the trial period.\n- Use a virtual card with a\
  \ limit or a single-merchant card for trials if the bank offers it.\n\n## Message\
  \ template (support chat or email)\n> Hello, please cancel my <service> subscription\
  \ on the account <email> effective at the end of the current billing period, and\
  \ confirm by email that no further charges will be made. Thank you.\n\n## Habits\
  \ that keep costs down\n- Review subscriptions every quarter with this skill.\n\
  - Keep one calendar with all yearly renewal dates.\n- Before subscribing, ask: will\
  \ I use it at least weekly?\n\x1FFILE:templates/subscription-review.md\x1E\n# Subscription\
  \ Review - <name> - <date>\n\n**Report currency:** <EUR>  **Rates:** <1 USD = 0.92\
  \ EUR (card statement)>\n**Before:** <monthly> /month = <yearly> /year (your share\
  \ <monthly> /month)\n**After decisions:** <monthly> /month = <yearly> /year  **Saved\
  \ per year:** <amount>\n\n## Decisions\n| Subscription | Cost per year | Flag |\
  \ Decision | Done |\n|---|---|---|---|---|\n| | | | keep / cancel / pause / downgrade\
  \ / switch to annual | [ ] |\n\n## Deadlines and reminders\n| Date | What | Reminder\
  \ set |\n|---|---|---|\n| | trial ends | [ ] |\n| | yearly renewal | [ ] |\n\n##\
  \ Next 30 days of charges\n- <date> <name> <amount>\n\n## Notes\n- Shared plans:\
  \ <who pays what back>\n- Price increases noticed: <service old -> new>\n- Next\
  \ review: <date, about 3 months from now>\n\x1FFILE:examples/subscriptions.csv\x1E\
  \nname,amount,currency,cycle,next_renewal,category,last_used,users,trial_end,previous_amount,annual_price,paid_after_trial\n\
  StreamFlix Premium,17.99,EUR,monthly,2026-10-27,Video streaming,2026-10-18,2,,15.99,,\n\
  CineBox,8.99,EUR,monthly,2026-11-03,Video streaming,2026-08-02,1,,,89.90,\nAnimeNow,6.49,USD,monthly,2026-10-22,Video\
  \ streaming,2026-07-15,1,,,,\nTuneWave Family,19.99,EUR,monthly,2026-11-10,Music,2026-10-19,4,,16.99,,\n\
  CloudVault 2 TB,99.99,EUR,yearly,2026-11-05,Cloud storage,2026-10-19,1,,,,\nPhotoCloud\
  \ 200 GB,2.99,EUR,monthly,2026-11-01,Cloud storage,2026-10-10,1,,,29.99,\nFitPulse\
  \ Gym,39.00,EUR,monthly,2026-11-01,Fitness,2026-09-04,1,,35.00,,\nYoga Daily App,59.99,USD,yearly,2027-03-14,Fitness,2026-10-12,1,,,,\n\
  NewsLine Digital,4.99,EUR,weekly,2026-10-23,News,2026-10-19,1,,,,\nPasswordSafe,36.00,USD,yearly,2027-01-20,Software,2026-10-19,1,,,,\n\
  DesignPro Trial,0.00,USD,monthly,2026-10-25,Design,2026-10-02,1,2026-10-25,,,24.99\n\
  LangLeap Plus,12.99,EUR,quarterly,2026-12-01,Learning,2026-06-30,1,,,,\n\x1FFILE:scripts/sub_audit.py\x1E\
  \n#!/usr/bin/env python3\n\"\"\"Subscription spending auditor (Python 3 standard\
  \ library only).\n\nInput CSV columns (header names are case-insensitive; only name,\
  \ amount, cycle are required):\n  name, amount, currency, cycle, next_renewal, category,\
  \ last_used, users, trial_end,\n  previous_amount, annual_price, paid_after_trial\n\
  cycle: weekly, biweekly, monthly, quarterly, semiannual, yearly/annual, or \"every\
  \ N days|weeks|months|years\"\n       (also short forms like 2w, 3m, 1y).\nusers:\
  \ how many people share the plan; your share = amount / users (default 1).\ntrial_end\
  \ + paid_after_trial: a free trial (amount 0) that converts to paid_after_trial\
  \ on trial_end.\n\nReports, all converted to one currency with explicit rates (--rate\
  \ USD=0.92):\n  monthly and yearly cost per item and in total, by category, your\
  \ share of shared plans,\n  renewals in the next --days days (past dates are rolled\
  \ forward by the cycle),\n  flags: UNUSED (last_used older than --unused-days),\
  \ OVERLAP (several items in one category),\n  TRIAL (trial ends within --days; amount\
  \ after trial if given), PRICE_UP (amount > previous_amount),\n  ANNUAL_SAVES (annual_price\
  \ cheaper than 12 x monthly), RENEWS_YEARLY (a yearly charge within --days).\nUsage:\n\
  \  python3 sub_audit.py subscriptions.csv --currency EUR --rate USD=0.92 --today\
  \ 2026-10-20\n  python3 sub_audit.py subscriptions.csv --json\n  python3 sub_audit.py\
  \ --self-test\nExit code: 0 OK, 2 bad input.\n\"\"\"\nimport argparse\nimport calendar\n\
  import csv\nimport datetime as dt\nimport json\nimport re\nimport sys\nfrom decimal\
  \ import Decimal, ROUND_HALF_UP\n\nNAMED = {\"weekly\": (1, \"w\"), \"biweekly\"\
  : (2, \"w\"), \"fortnightly\": (2, \"w\"), \"monthly\": (1, \"m\"),\n         \"\
  bimonthly\": (2, \"m\"), \"quarterly\": (3, \"m\"), \"semiannual\": (6, \"m\"),\
  \ \"semiannually\": (6, \"m\"),\n         \"half-yearly\": (6, \"m\"), \"yearly\"\
  : (12, \"m\"), \"annual\": (12, \"m\"), \"annually\": (12, \"m\")}\nUNIT = {\"d\"\
  : \"d\", \"day\": \"d\", \"days\": \"d\", \"w\": \"w\", \"week\": \"w\", \"weeks\"\
  : \"w\", \"m\": \"m\", \"month\": \"m\",\n        \"months\": \"m\", \"y\": \"y\"\
  , \"year\": \"y\", \"years\": \"y\"}\nPER_MONTH = {\"d\": Decimal(\"30.436875\"\
  ), \"w\": Decimal(\"4.348125\"), \"m\": Decimal(1), \"y\": Decimal(1) / 12}\nD2\
  \ = Decimal(\"0.01\")\n\n\nclass AuditError(ValueError):\n    pass\n\n\ndef parse_cycle(s):\n\
  \    s = (s or \"\").strip().lower()\n    if s in NAMED:\n        n, u = NAMED[s]\n\
  \        return n, u\n    m = re.fullmatch(r\"(?:every\\s+)?(\\d+)\\s*([a-z]+)\"\
  , s)\n    if m and m.group(2) in UNIT:\n        n, u = int(m.group(1)), UNIT[m.group(2)]\n\
  \        if n <= 0:\n            raise AuditError(f\"cycle must be positive: {s!r}\"\
  )\n        if u == \"y\":\n            return n * 12, \"m\"\n        return n, u\n\
  \    raise AuditError(f\"unknown cycle {s!r} (use weekly, monthly, quarterly, yearly\
  \ or 'every 2 months')\")\n\n\ndef monthly_factor(n, u):\n    \"\"\"How many charges\
  \ per month for a cycle of n units.\"\"\"\n    return PER_MONTH[u] / n\n\n\ndef\
  \ add_cycle(d, n, u):\n    if u == \"d\":\n        return d + dt.timedelta(days=n)\n\
  \    if u == \"w\":\n        return d + dt.timedelta(weeks=n)\n    m = d.month -\
  \ 1 + n\n    y, m = d.year + m // 12, m % 12 + 1\n    return dt.date(y, m, min(d.day,\
  \ calendar.monthrange(y, m)[1]))\n\n\ndef parse_date(s, field, name):\n    s = (s\
  \ or \"\").strip()\n    if not s:\n        return None\n    try:\n        return\
  \ dt.date.fromisoformat(s)\n    except ValueError:\n        raise AuditError(f\"\
  {name}: bad {field} date {s!r} (use YYYY-MM-DD)\")\n\n\ndef money(s, field, name,\
  \ required=False):\n    s = (s or \"\").strip().replace(\",\", \"\") if (s or \"\
  \").count(\",\") and \".\" in (s or \"\") else (s or \"\").strip().replace(\",\"\
  , \".\")\n    if not s:\n        if required:\n            raise AuditError(f\"\
  {name}: {field} is required\")\n        return None\n    try:\n        v = Decimal(s)\n\
  \    except Exception:\n        raise AuditError(f\"{name}: bad {field} {s!r}\"\
  )\n    if v < 0:\n        raise AuditError(f\"{name}: {field} cannot be negative\"\
  )\n    return v\n\n\ndef q(v):\n    return v.quantize(D2, rounding=ROUND_HALF_UP)\n\
  \n\ndef load(lines):\n    rd = csv.DictReader(lines)\n    if not rd.fieldnames:\n\
  \        raise AuditError(\"empty CSV\")\n    rows = []\n    for r in rd:\n    \
  \    r = {(k or \"\").strip().lower(): (v or \"\").strip() for k, v in r.items()}\n\
  \        if not any(r.values()):\n            continue\n        if not r.get(\"\
  name\"):\n            raise AuditError(\"every row needs a name\")\n        rows.append(r)\n\
  \    if not rows:\n        raise AuditError(\"no subscriptions found\")\n    return\
  \ rows\n\n\ndef audit(rows, currency=\"EUR\", rates=None, today=None, days=30, unused_days=45):\n\
  \    rates = {k.upper(): Decimal(str(v)) for k, v in (rates or {}).items()}\n  \
  \  rates[currency.upper()] = Decimal(1)\n    today = today or dt.date.today()\n\
  \    horizon = today + dt.timedelta(days=days)\n    items, flags, renewals, raw\
  \ = [], [], [], {}\n    for r in rows:\n        name = r[\"name\"]\n        cur\
  \ = (r.get(\"currency\") or currency).upper()\n        if cur not in rates:\n  \
  \          raise AuditError(f\"{name}: no rate for {cur}; pass --rate {cur}=<value\
  \ in {currency}>\")\n        rate = rates[cur]\n        n, u = parse_cycle(r.get(\"\
  cycle\"))\n        amount = money(r.get(\"amount\"), \"amount\", name, required=True)\n\
  \        after_trial = money(r.get(\"paid_after_trial\"), \"paid_after_trial\",\
  \ name)\n        trial_end = parse_date(r.get(\"trial_end\"), \"trial_end\", name)\n\
  \        users = int(r.get(\"users\") or 1)\n        if users < 1:\n           \
  \ raise AuditError(f\"{name}: users must be at least 1\")\n        charge = amount\
  \ * rate\n        f = monthly_factor(n, u)\n        monthly = charge * f\n     \
  \   item = {\"name\": name, \"category\": r.get(\"category\") or \"Other\", \"currency\"\
  : cur, \"amount\": float(amount),\n                \"cycle\": r.get(\"cycle\"),\
  \ \"monthly\": q(monthly), \"yearly\": q(monthly * 12), \"users\": users,\n    \
  \            \"your_monthly\": q(monthly / users), \"your_yearly\": q(monthly *\
  \ 12 / users)}\n        raw[name] = (monthly, monthly / users)\n        items.append(item)\n\
  \        nxt = parse_date(r.get(\"next_renewal\"), \"next_renewal\", name)\n   \
  \     if nxt:\n            while nxt < today:\n                nxt = add_cycle(nxt,\
  \ n, u)\n            item[\"next_renewal\"] = nxt.isoformat()\n            d = nxt\n\
  \            while d <= horizon:\n                due = charge\n               \
  \ if trial_end and d >= trial_end and after_trial is not None:\n               \
  \     due = after_trial * rate\n                renewals.append({\"date\": d.isoformat(),\
  \ \"name\": name, \"amount\": q(due)})\n                d = add_cycle(d, n, u)\n\
  \            if (n, u) in ((12, \"m\"),) or (u == \"m\" and n >= 12):\n        \
  \        if nxt <= horizon:\n                    flags.append({\"name\": name, \"\
  flag\": \"RENEWS_YEARLY\",\n                                  \"detail\": f\"{q(charge)}\
  \ {currency} charge on {nxt.isoformat()}; decide before then\"})\n        last =\
  \ parse_date(r.get(\"last_used\"), \"last_used\", name)\n        if last and (today\
  \ - last).days > unused_days:\n            flags.append({\"name\": name, \"flag\"\
  : \"UNUSED\",\n                          \"detail\": f\"last used {last.isoformat()}\
  \ ({(today - last).days} days ago); costs {q(monthly * 12)} {currency}/year\"})\n\
  \        if trial_end and today <= trial_end <= horizon:\n            extra = (f\"\
  ; then {q(after_trial * rate)} {currency} per charge ({q(after_trial * rate * f\
  \ * 12)} {currency}/year)\"\n                     if after_trial is not None else\
  \ \"\")\n            flags.append({\"name\": name, \"flag\": \"TRIAL\",\n      \
  \                    \"detail\": f\"trial ends {trial_end.isoformat()} ({(trial_end\
  \ - today).days} days){extra}; cancel or keep on purpose\"})\n        prev = money(r.get(\"\
  previous_amount\"), \"previous_amount\", name)\n        if prev and amount > prev:\n\
  \            pct = (amount - prev) / prev * 100\n            flags.append({\"name\"\
  : name, \"flag\": \"PRICE_UP\",\n                          \"detail\": f\"{prev}\
  \ -> {amount} {cur} (+{q(pct)}%), +{q((amount - prev) * rate * f * 12)} {currency}/year\"\
  })\n        annual = money(r.get(\"annual_price\"), \"annual_price\", name)\n  \
  \      if annual is not None and not (u == \"m\" and n == 12):\n            save\
  \ = monthly * 12 - annual * rate\n            if save > 0:\n                flags.append({\"\
  name\": name, \"flag\": \"ANNUAL_SAVES\",\n                              \"detail\"\
  : f\"annual plan {q(annual * rate)} {currency} vs {q(monthly * 12)} {currency} paid\
  \ {r.get('cycle')}: saves {q(save)} {currency}/year if you keep it 12 months\"})\n\
  \    cats = {}\n    for it in items:\n        c = cats.setdefault(it[\"category\"\
  ], {\"count\": 0, \"monthly\": Decimal(0), \"names\": []})\n        c[\"count\"\
  ] += 1\n        c[\"monthly\"] += raw[it[\"name\"]][0]\n        c[\"names\"].append(it[\"\
  name\"])\n    for cname, c in sorted(cats.items()):\n        if c[\"count\"] > 1:\n\
  \            flags.append({\"name\": \", \".join(c[\"names\"]), \"flag\": \"OVERLAP\"\
  ,\n                          \"detail\": f\"{c['count']} subscriptions in {cname}\
  \ ({q(c['monthly'])} {currency}/month); keep the one you use most\"})\n    order\
  \ = {\"TRIAL\": 0, \"RENEWS_YEARLY\": 1, \"UNUSED\": 2, \"OVERLAP\": 3, \"PRICE_UP\"\
  : 4, \"ANNUAL_SAVES\": 5}\n    flags.sort(key=lambda x: (order[x[\"flag\"]], x[\"\
  name\"]))\n    renewals.sort(key=lambda x: (x[\"date\"], x[\"name\"]))\n    unused_names\
  \ = {f[\"name\"] for f in flags if f[\"flag\"] == \"UNUSED\"}\n    total_m = sum((raw[it[\"\
  name\"]][0] for it in items), Decimal(0))\n    your_m = sum((raw[it[\"name\"]][1]\
  \ for it in items), Decimal(0))\n    return {\n        \"currency\": currency, \"\
  today\": today.isoformat(), \"days\": days, \"rates\": {k: str(v) for k, v in rates.items()},\n\
  \        \"count\": len(items), \"monthly_total\": q(total_m), \"yearly_total\"\
  : q(total_m * 12),\n        \"your_monthly_total\": q(your_m), \"your_yearly_total\"\
  : q(your_m * 12),\n        \"unused_yearly\": q(sum((raw[it[\"name\"]][0] * 12 for\
  \ it in items if it[\"name\"] in unused_names), Decimal(0))),\n        \"next_days_total\"\
  : q(sum((x[\"amount\"] for x in renewals), Decimal(0))),\n        \"by_category\"\
  : {k: {\"count\": v[\"count\"], \"monthly\": q(v[\"monthly\"])} for k, v in sorted(cats.items(),\
  \ key=lambda kv: -kv[1][\"monthly\"])},\n        \"items\": sorted(items, key=lambda\
  \ it: -it[\"monthly\"]), \"renewals\": renewals, \"flags\": flags,\n    }\n\n\n\
  def to_markdown(r):\n    c = r[\"currency\"]\n    out = [\"# Subscription audit\"\
  , \"\",\n           f\"**As of:** {r['today']}  **Subscriptions:** {r['count']}\
  \  **Currency:** {c}  **Rates:** \"\n           + \", \".join(f\"1 {k} = {v} {c}\"\
  \ for k, v in r[\"rates\"].items() if k != c.upper()),\n           f\"**Total:**\
  \ {r['monthly_total']} {c}/month = {r['yearly_total']} {c}/year  \"\n          \
  \ f\"**Your share:** {r['your_monthly_total']} {c}/month = {r['your_yearly_total']}\
  \ {c}/year\",\n           f\"**Unused (yearly cost):** {r['unused_yearly']} {c}\
  \  **Charges in next {r['days']} days:** {r['next_days_total']} {c}\",\n       \
  \    \"\", \"## Action list\", \"\"]\n    out += [f\"- **{f['flag']}** {f['name']}:\
  \ {f['detail']}\" for f in r[\"flags\"]] or [\"- Nothing to act on.\"]\n    out\
  \ += [\"\", \"## All subscriptions (most expensive first)\", \"\",\n           \
  \ \"| Name | Category | Charge | Cycle | Per month | Per year | Users | Your year\
  \ | Next renewal |\",\n            \"|---|---|---|---|---|---|---|---|---|\"]\n\
  \    for it in r[\"items\"]:\n        out.append(f\"| {it['name']} | {it['category']}\
  \ | {it['amount']:.2f} {it['currency']} | {it['cycle']} | {it['monthly']} | \"\n\
  \                   f\"{it['yearly']} | {it['users']} | {it['your_yearly']} | {it.get('next_renewal',\
  \ '')} |\")\n    out += [\"\", \"## By category\", \"\", \"| Category | Count |\
  \ Per month |\", \"|---|---|---|\"]\n    out += [f\"| {k} | {v['count']} | {v['monthly']}\
  \ |\" for k, v in r[\"by_category\"].items()]\n    out += [\"\", f\"## Charges in\
  \ the next {r['days']} days\", \"\"]\n    out += [f\"- {x['date']} {x['name']}:\
  \ {x['amount']} {c}\" for x in r[\"renewals\"]] or [\"- none\"]\n    return \"\\\
  n\".join(out)\n\n\ndef self_test():\n    cases = []\n\n    def ok(name, cond):\n\
  \        cases.append((name, bool(cond)))\n\n    T = dt.date(2026, 10, 20)\n   \
  \ hdr = \"name,amount,currency,cycle,next_renewal,category,last_used,users,trial_end,previous_amount,annual_price,paid_after_trial\"\
  \n\n    def run(*lines, **kw):\n        return audit(load([hdr, *lines]), today=T,\
  \ **kw)\n\n    ok(\"named cycles\", parse_cycle(\"Quarterly\") == (3, \"m\") and\
  \ parse_cycle(\"annual\") == (12, \"m\"))\n    ok(\"every N units\", parse_cycle(\"\
  every 2 weeks\") == (2, \"w\") and parse_cycle(\"1y\") == (12, \"m\"))\n    ok(\"\
  month end clamps\", add_cycle(dt.date(2026, 1, 31), 1, \"m\") == dt.date(2026, 2,\
  \ 28))\n    ok(\"leap year clamp\", add_cycle(dt.date(2027, 2, 28), 12, \"m\") ==\
  \ dt.date(2028, 2, 28) and add_cycle(dt.date(2028, 1, 31), 1, \"m\") == dt.date(2028,\
  \ 2, 29))\n    r = run(\"A,10,EUR,monthly,,X,,,,,,\")\n    ok(\"monthly 10 = 120/year\"\
  , r[\"yearly_total\"] == Decimal(\"120.00\"))\n    r = run(\"A,120,EUR,yearly,,X,,,,,,\"\
  )\n    ok(\"yearly 120 = 10/month\", r[\"monthly_total\"] == Decimal(\"10.00\"))\n\
  \    r = run(\"A,5,EUR,weekly,,X,,,,,,\")\n    ok(\"weekly 5 = 260.89/year\", r[\"\
  yearly_total\"] == Decimal(\"260.89\") and r[\"items\"][0][\"monthly\"] == Decimal(\"\
  21.74\"))\n    r = run(\"A,1,EUR,monthly,,X,,3,,,,\", \"B,1,EUR,monthly,,X,,3,,,,\"\
  , \"C,1,EUR,monthly,,X,,3,,,,\")\n    ok(\"totals use unrounded shares\", r[\"your_monthly_total\"\
  ] == Decimal(\"1.00\"))\n    r = run(\"A,10,USD,monthly,,X,,,,,,\", rates={\"USD\"\
  : \"0.9\"})\n    ok(\"currency rate applied\", r[\"monthly_total\"] == Decimal(\"\
  9.00\"))\n    try:\n        run(\"A,10,GBP,monthly,,X,,,,,,\")\n        ok(\"missing\
  \ rate rejected\", False)\n    except AuditError:\n        ok(\"missing rate rejected\"\
  , True)\n    r = run(\"Fam,20,EUR,monthly,,Music,,4,,,,\")\n    ok(\"shared plan\
  \ your share\", r[\"your_monthly_total\"] == Decimal(\"5.00\") and r[\"monthly_total\"\
  ] == Decimal(\"20.00\"))\n    r = run(\"Old,10,EUR,monthly,,X,2026-07-01,,,,,\"\
  )\n    ok(\"unused flagged\", any(f[\"flag\"] == \"UNUSED\" for f in r[\"flags\"\
  ]) and r[\"unused_yearly\"] == Decimal(\"120.00\"))\n    r = run(\"Fresh,10,EUR,monthly,,X,2026-10-01,,,,,\"\
  )\n    ok(\"recent use not flagged\", not r[\"flags\"])\n    r = run(\"A,10,EUR,monthly,,Video,,,,,,\"\
  , \"B,8,EUR,monthly,,Video,,,,,,\")\n    ok(\"overlap flagged\", [f[\"flag\"] for\
  \ f in r[\"flags\"]] == [\"OVERLAP\"])\n    r = run(\"T,0,EUR,monthly,2026-10-25,Software,,,2026-10-25,,,24.99\"\
  )\n    ok(\"trial flagged with paid price\", r[\"flags\"][0][\"flag\"] == \"TRIAL\"\
  \ and \"24.99\" in r[\"flags\"][0][\"detail\"])\n    ok(\"trial charge counted in\
  \ renewals\", r[\"renewals\"][0][\"amount\"] == Decimal(\"24.99\"))\n    r = run(\"\
  P,12,EUR,monthly,,X,,,,10,,\")\n    ok(\"price increase flagged\", r[\"flags\"][0][\"\
  flag\"] == \"PRICE_UP\" and \"+20.00%\" in r[\"flags\"][0][\"detail\"] and \"+24.00\"\
  \ in r[\"flags\"][0][\"detail\"])\n    r = run(\"M,10,EUR,monthly,,X,,,,,99,\")\n\
  \    ok(\"annual saving flagged\", r[\"flags\"][0][\"flag\"] == \"ANNUAL_SAVES\"\
  \ and \"saves 21.00\" in r[\"flags\"][0][\"detail\"])\n    r = run(\"M,10,EUR,monthly,,X,,,,,130,\"\
  )\n    ok(\"no saving when annual is pricier\", not r[\"flags\"])\n    r = run(\"\
  Y,50,EUR,yearly,2026-11-01,X,,,,,,\")\n    ok(\"yearly renewal soon flagged\", r[\"\
  flags\"][0][\"flag\"] == \"RENEWS_YEARLY\")\n    r = run(\"W,1,EUR,weekly,2026-10-21,X,,,,,,\"\
  )\n    ok(\"weekly renewals listed in window\", len(r[\"renewals\"]) == 5 and r[\"\
  next_days_total\"] == Decimal(\"5.00\"))\n    r = run(\"Past,10,EUR,monthly,2026-08-15,X,,,,,,\"\
  )\n    ok(\"rolled forward to the future\", r[\"items\"][0][\"next_renewal\"] ==\
  \ \"2026-11-15\")\n    for line, label in [(\"A,-3,EUR,monthly,,X,,,,,,\", \"negative\
  \ amount rejected\"),\n                        (\"A,3,EUR,sometimes,,X,,,,,,\",\
  \ \"unknown cycle rejected\"),\n                        (\"A,3,EUR,monthly,20-10-2026,X,,,,,,\"\
  , \"bad date rejected\"),\n                        (\"A,3,EUR,monthly,,X,,0,,,,\"\
  , \"zero users rejected\")]:\n        try:\n            run(line)\n            ok(label,\
  \ False)\n        except AuditError:\n            ok(label, True)\n    ok(\"markdown\
  \ has action list\", \"## Action list\" in to_markdown(run(\"A,10,EUR,monthly,,X,,,,,,\"\
  )))\n    passed = sum(c for _, c in cases)\n    for name, c in cases:\n        print((\"\
  PASS \" if c else \"FAIL \") + name)\n    print(f\"{passed}/{len(cases)} passed\"\
  )\n    return 0 if passed == len(cases) else 1\n\n\ndef default(o):\n    if isinstance(o,\
  \ Decimal):\n        return float(o)\n    raise TypeError(type(o))\n\n\ndef main(argv=None):\n\
  \    ap = argparse.ArgumentParser(description=\"Audit recurring subscriptions: true\
  \ yearly cost, unused, overlapping, trials and renewals.\")\n    ap.add_argument(\"\
  file\", nargs=\"?\", help=\"subscriptions CSV ('-' for stdin)\")\n    ap.add_argument(\"\
  --currency\", default=\"EUR\", help=\"report currency (default EUR)\")\n    ap.add_argument(\"\
  --rate\", action=\"append\", default=[], metavar=\"CUR=VALUE\",\n              \
  \      help=\"1 CUR = VALUE report-currency units, e.g. USD=0.92 (repeatable)\"\
  )\n    ap.add_argument(\"--today\", help=\"evaluation date YYYY-MM-DD (default:\
  \ today)\")\n    ap.add_argument(\"--days\", type=int, default=30, help=\"look-ahead\
  \ for renewals and trials (default 30)\")\n    ap.add_argument(\"--unused-days\"\
  , type=int, default=45, help=\"flag items not used for this many days (default 45)\"\
  )\n    ap.add_argument(\"--json\", action=\"store_true\")\n    ap.add_argument(\"\
  --self-test\", action=\"store_true\")\n    a = ap.parse_args(argv)\n    if a.self_test:\n\
  \        return self_test()\n    if not a.file:\n        ap.error(\"subscriptions\
  \ CSV required (or --self-test)\")\n    try:\n        rates = {}\n        for x\
  \ in a.rate:\n            k, _, v = x.partition(\"=\")\n            if not v:\n\
  \                raise AuditError(f\"bad --rate {x!r}, use CUR=VALUE\")\n      \
  \      rates[k.strip().upper()] = Decimal(v.strip())\n        lines = sys.stdin.read().splitlines()\
  \ if a.file == \"-\" else open(a.file, encoding=\"utf-8\").read().splitlines()\n\
  \        today = dt.date.fromisoformat(a.today) if a.today else None\n        r\
  \ = audit(load(lines), a.currency.upper(), rates, today, a.days, a.unused_days)\n\
  \    except (OSError, AuditError, ValueError) as e:\n        print(f\"error: {e}\"\
  , file=sys.stderr)\n        return 2\n    print(json.dumps(r, indent=2, default=default,\
  \ ensure_ascii=False) if a.json else to_markdown(r))\n    return 0\n\n\nif __name__\
  \ == \"__main__\":\n    sys.exit(main())"
