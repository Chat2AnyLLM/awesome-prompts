slug: swagger-api-synchronization
title: Swagger Api Synchronization
description: Imported from Prompts Chat
prompt: "# Set up an OpenAPI spec-sync workflow in this project\n\nI want the same\
  \ backend-spec workflow I use in another repo: a script that diffs the live\nOpenAPI\
  \ spec against a local snapshot and writes a **frontend-oriented** change report,\
  \ plus a\n`/api-sync` slash command that turns that report into a phased plan.\n\
  \nFill these in from the repo before you start (ask me only if you can't work it\
  \ out):\n\n- **Spec source**: find it yourself — see Part 0. Don't ask me for the\
  \ URL until you've looked.\n  Whatever you find becomes the script's default, overridable\
  \ via an `OPENAPI_URL` env var.\n- **Snapshot path**: `api-spec/openapi.yaml`  ·\
  \  **Report path**: `api-spec/CHANGES.md`\n- **Source root to cross-reference**:\
  \ `src/` (adjust to this repo's layout)\n- **Response-validation library**: zod\
  \ (adjust if this repo uses something else)\n- **Snapshot in git?** Keep the yaml\
  \ **gitignored** (too large/noisy for history) but **commit\n  `CHANGES.md`** —\
  \ the generated report is the durable record of what changed and when. Also\n  ignore\
  \ `api-spec/openapi-*.yaml` and `api-spec/CHANGES-*.md` (dated manual archives).\n\
  \nRead this repo first (package manager, script conventions, how API calls and response\
  \ schemas are\nwritten) and match its style. Don't invent paths — grep for the real\
  \ ones.\n\n---\n\n## Part 0 — find the spec before you write anything\n\nDo this\
  \ first and tell me what you found. Don't guess a URL, and don't ask me until this\
  \ comes up\nempty.\n\n**1. The docs — cheapest place, and usually right.** `README.md`,\
  \ `CLAUDE.md`,\n`AGENTS.md`, `CONTRIBUTING.md`, anything under `docs/`, `.github/`,\
  \ `.cursor/rules/`, a\n`*.http`/`*.rest` scratch file, or a wiki checkout. The URL\
  \ is often in prose (\"API docs:\n…/swagger\"), in a setup step, or next to the\
  \ backend repo link:\n\n```bash\ngrep -rniE 'swagger|openapi|api-?docs|redoc|\\\
  /v3\\/api-docs' --include='*.md' --include='*.mdx' --include='*.txt' --include='*.http'\
  \ --include='*.rest' . | grep -v node_modules\n```\n\nTwo gotchas: a **Swagger UI\
  \ link** (`…/swagger-ui/index.html`, `…/docs`, `…/redoc`) is an HTML\npage, not\
  \ the spec — derive the machine URL from it (`/swagger-ui/index.html` →\n`/v3/api-docs`,\
  \ `/docs` → `/openapi.json`, `/redoc` → the `spec-url` in its HTML) and verify with\n\
  curl. And a docs URL may be **stale** — confirm it answers before adopting it, and\
  \ tell me if the\nREADME points somewhere dead.\n\n**2. A spec file already in or\
  \ near the repo** — someone usually vendored one:\n\n```bash\nfind . -path ./node_modules\
  \ -prune -o -iregex '.*\\(swagger\\|openapi\\|api-docs\\).*\\.\\(ya?ml\\|json\\\
  )' -print\ngit ls-files | grep -iE 'swagger|openapi|api-docs'\n```\n\nAlso check\
  \ `node_modules/.cache/`, `.next/cache/`, `dist/`, `build/`, `coverage/` and any\n\
  gitignored `api/`, `api-spec/`, `docs/`, `schemas/` folder — a previous codegen\
  \ run often left a\ncopy there. A stale cached copy is still useful: it's a **baseline\
  \ to seed the snapshot with**,\nso the first real diff is meaningful instead of\
  \ \"everything is new\". If you find one, say how\nold it is (`git log -1` / file\
  \ mtime) before deciding to trust it.\n\n**3. A generator config that already names\
  \ the source** — this is the highest-signal hit, because\nit points at whatever\
  \ URL or path the team actually uses:\n\n```bash\ngrep -rniE 'openapi|swagger|api-docs'\
  \ --include='*.json' --include='*.ts' --include='*.js' --include='*.mjs' --include='*.yaml'\
  \ --include='*.yml' --include='.env*' --include='Makefile' --include='*.sh' -l .\
  \ | grep -v node_modules\n```\n\nLook specifically for: `openapi-typescript` / `orval.config.*`\
  \ / `kubb.config.*` /\n`swagger-typescript-api` / `@hey-api/openapi-ts` config,\
  \ an `openapi`-ish npm script in\npackage.json, a `.env*` API base URL, `docker-compose.yml`\
  \ service URLs, CI workflow steps, or a\ncommitted generated client whose header\
  \ comment cites its source spec.\n\n**4. Derive it from the API base URL.** If you\
  \ only find a base URL, probe the conventional paths\nfor that backend's framework\
  \ before asking me — FastAPI `/openapi.json`, Spring/springdoc\n`/v3/api-docs` (+\
  \ `.yaml`), ASP.NET `/swagger/v1/swagger.json`, NestJS `/api-json`, Rails/rswag\n\
  `/api-docs/v1/swagger.yaml`, plus plain `/openapi.yaml` and `/swagger.json`:\n\n\
  ```bash\ncurl -sS -o /dev/null -w '%{http_code} %{content_type} %{url_effective}\\\
  n' <BASE>/openapi.json\n```\n\nReport which ones answered. If they all need auth,\
  \ say so — don't bake a token into the script.\n\n**5. Nothing works?** Then ask\
  \ me, and tell me what you ruled out.\n\n### If the spec isn't reachable over HTTP\n\
  \nDon't force the fetch design. Make the source a single `SPEC_SOURCE` that may\
  \ be **a URL, a local\npath, or a shell command** (e.g. the backend repo's own `make\
  \ openapi`, or a sibling checkout's\ngenerated file), resolved in that order: `--to\
  \ <file>` flag → `OPENAPI_URL` env → the default you\ndiscovered. Everything downstream\
  \ — diff, report, snapshot — is unchanged. Say in `CLAUDE.md`\nwhich one this repo\
  \ uses and how to refresh it.\n\n## Part 1 — `scripts/sync-api.mjs`\n\nA single\
  \ dependency-light Node ESM script (`js-yaml` is the only new dep; use the repo's\
  \ package\nmanager). Flags:\n\n```\nnode scripts/sync-api.mjs               fetch\
  \ remote → diff vs snapshot → write report + overwrite snapshot\nnode scripts/sync-api.mjs\
  \ --check       diff only, snapshot untouched, exit 1 if it drifted (CI-friendly)\n\
  node scripts/sync-api.mjs --from <file> diff against <file> instead of the snapshot\n\
  node scripts/sync-api.mjs --to <file>   treat <file> as \"remote\" instead of fetching\
  \ (offline)\nnode scripts/sync-api.mjs --json        also print the raw diff as\
  \ JSON on stdout\n```\n\nAdd `\"sync:api\": \"node scripts/sync-api.mjs\"` to package.json.\n\
  \n**If no snapshot exists yet**: write the fetched spec as the snapshot, print \"\
  seeded — re-run after\nthe backend ships to see a diff\", exit 0. Never report the\
  \ whole API as \"new\". Exception: if Part 0\nturned up an older cached/vendored\
  \ spec, seed the snapshot from **that** instead and run a real\ndiff against the\
  \ live spec on the first run — tell me the cached copy's date so I know what the\n\
  baseline means.\n\n### What it must diff\n\nFlatten `paths` into a `\"GET /a/b\"\
  ` → operation map and diff operations *and*\n`components.schemas` separately:\n\n\
  **Operations**\n- added / removed / changed\n- params: new ones (flag `required`),\
  \ required↔optional flips, enum values added/removed —\n  key a param by `in:name`\
  \ (or `ref:Name` for `$ref` params), not by array index\n- request body and success-response\
  \ schema: if the `$ref` name changed, report the rename; if the\n  shape is **inline**\
  \ (no `$ref`), diff its properties here — an unnamed schema is diffed here or\n\
  \  nowhere. Resolve `allOf: [$ref]` wrappers to the underlying name, and render\
  \ `oneOf`/`anyOf`\n  unions as `A | B` (gaining/losing a union member is a real\
  \ behavioural change).\n- new/removed non-2xx status codes\n- security requirement\
  \ changes, newly `deprecated`\n\n**Schemas**\n- properties added (mark required)\
  \ / removed / retyped\n- enum values added or removed (on the schema and on each\
  \ property, including `items.enum`)\n- required↔optional flips\n\n### The two things\
  \ that make this report worth having\n\n1. **`error_code` extraction from response\
  \ prose.** Machine error codes are usually documented\n   nowhere but each non-2xx\
  \ response's `description` text (\"… already an active member\n   (already_member)\"\
  ), so a new branch we need to handle looks like *nothing changed* to a\n   schema-level\
  \ diff. Parse them by **context, not vocabulary**: tokens inside `(...)`, tokens\n\
  \   after `error_code`-ish prose, and any snake_case token that appears in some\
  \ schema's literal\n   `error_code` enum. Do **not** filter out tokens that collide\
  \ with field names or enum values —\n   those collisions are exactly the codes that\
  \ matter most. Drop tokens introduced by \"field X\"\n   phrasing (those are field\
  \ names, not codes). Report added codes, and for a code that stopped\n   being documented,\
  \ grep the source for `\"that_code\"` and say **which file branches on it** —\n\
  \   that's a dead branch.\n\n2. **Cross-reference every change against the actual\
  \ code.** Load every source file once via\n   `git ls-files --cached --others --exclude-standard\
  \ <src root>` (include untracked so a call\n   site added this session counts; skip\
  \ files listed but deleted from the working tree), then:\n   - **Call sites** for\
  \ a path: turn path params into single-segment wildcards and require the\n     match\
  \ to end at a quote/backtick/`?` so `/orgs/{id}` doesn't match `/orgs/${id}/archive`.\n\
  \     Every removed/changed operation lists its call sites, or \"⬜ no call site\"\
  .\n   - **Schema mirrors**: find the file holding our response-validation mirror\
  \ of a spec schema —\n     match `fooBarSchema` anywhere, plus the bare PascalCase\
  \ name **only inside a `schemas.ts`**\n     (elsewhere it collides with unrelated\
  \ TS identifiers). Adapt the naming convention to\n     whatever this repo actually\
  \ uses — grep first.\n   - A new operation whose path is already referenced in `src/`\
  \ gets a \"⚠️ path already\n     referenced — check the method\" note.\n\n### Report\
  \ format (`api-spec/CHANGES.md`)\n\nHeader with generation date, baseline label,\
  \ spec `info.version`, and before→after operation and\nschema counts; then a small\
  \ added/removed/changed table; then sections, in this order:\n\n- `## \U0001F534\
  \ Removed operations — breaking if we call them` (with call sites)\n- `## \U0001F7E0\
  \ Changed operations` (nested bullets per change + call sites)\n- `## \U0001F7E2\
  \ New operations`, grouped by path area (first segment, with sensible special cases\
  \ for\n  this API's prefixes) — summary, response schema, request-body schema\n\
  - `## \U0001F534 Removed schemas` (with mirror files)\n- `## \U0001F7E0 Changed\
  \ schemas` — **mirrored ones sorted first and bolded with the mirror file**, since\n\
  \  those are what can break parsing today; the rest are informational\n- `## \U0001F7E2\
  \ New schemas` (one comma-separated line)\n\nIf nothing changed, the body is exactly\
  \ \"No changes since the last snapshot.\" Top the file with\n\"do not edit by hand\"\
  .\n\nKeep the script commented where a decision is non-obvious (the error_code heuristic,\
  \ the path\nmatcher's end anchor, why untracked files are included) — future-me\
  \ reads those.\n\n## Part 2 — `.claude/commands/api-sync.md`\n\nA slash command\
  \ (`/api-sync [scope]`, scope optional, also accepts `implement`) that runs the\n\
  workflow. Frontmatter: `description` + `argument-hint`. Steps:\n\n1. **Diff** —\
  \ run `npm run sync:api`, read `api-spec/CHANGES.md`. Call out the two judgement\n\
  \   calls the report can flag but not decide: a changed **request body** on a live\
  \ call site is\n   actionable even with no schema mirror (we build bodies by hand),\
  \ and a new **`error_code`** is\n   a branch we don't have yet — if it's a field\
  \ error it must render inline on the field, not\n   just as a toast. If the report\
  \ says no changes, say so and stop — don't invent work.\n2. **Classify every item**\
  \ into: Breaking (P0) · Silently wrong — a mirrored schema gained a\n   required\
  \ field or an enum grew values our validator rejects (P0) · Now-incomplete — a\n\
  \   hand-built request body gained a field, or a new `error_code` we don't branch\
  \ on (P1) ·\n   Un-mocks a screen (P1) · Extends a screen (P2) · Net-new feature\
  \ (P3) · Backend-only (drop).\n   Never skip an item; if it fits nowhere, list it\
  \ as an open question. Verify each\n   classification against the code rather than\
  \ assuming — open the named mirror file, grep for\n   the mock fixture, confirm\
  \ the screen exists.\n3. **Write the plan** — a dated section in `ROADMAP.md` (or\
  \ this repo's equivalent; create one if\n   there's none), ordered by those priorities\
  \ and phased so each phase ships independently. Per\n   item: the endpoints and\
  \ files that change, what the user can do afterwards that they can't\n   today (the\
  \ point of the work — not \"wire endpoint X\"), and whether it's blocked and on\
  \ whom.\n   One line per item. Then update whatever coverage/tracker docs this repo\
  \ keeps.\n4. **Report back in chat** — what the backend shipped in one plain-language\
  \ paragraph, anything\n   broken right now with the file to fix, the phases one\
  \ line each, and genuine questions for the\n   backend dev only. Stop there; only\
  \ if the argument contains `implement`, build **Phase 1 only**,\n   then run this\
  \ repo's typecheck + lint and report before continuing.\n\n## Part 3 — wire it in\n\
  \n- Add the gitignore entries.\n- Add a short **Backend-change workflow** section\
  \ to `CLAUDE.md` (create it if missing): the\n  snapshot is local and gitignored,\
  \ `CHANGES.md` is the committed record, `CHANGES.md` is\n  generated so never hand-edit\
  \ it, `/api-sync` when the backend dev says something shipped,\n  `npm run sync:api\
  \ -- --check` to detect drift, and the habit of archiving a dated\n  `api-spec/openapi-YYYY-MM-DD.yaml`\
  \ before a big backend change as a committed reference point.\n- Seed the snapshot\
  \ by running the script once, and show me the first report — plus a one-line\n \
  \ note on where the spec came from and, if you seeded from a cached copy, how stale\
  \ it was."
