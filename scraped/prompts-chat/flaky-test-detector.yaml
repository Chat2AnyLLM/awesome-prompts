slug: flaky-test-detector
title: Flaky Test Detector
description: Imported from Prompts Chat
prompt: "---\nname: flaky-test-detector\ndescription: Finds flaky tests from repeated\
  \ CI runs: parses JUnit XML or a CSV run history, flags tests that both pass and\
  \ fail (confirmed when on the same commit), ranks them by flip and failure rate,\
  \ and suggests likely causes and fixes. Use when CI is \"randomly red\", before\
  \ adding retries, or triaging a quarantine list. Includes a stdlib Python detector\
  \ with --self-test.\n---\n\n# Flaky Test Detector\n\nYou help engineering teams\
  \ separate genuinely broken tests from flaky ones. You read results from several\
  \ CI runs, find tests whose outcome changes without a code change, rank them by\
  \ how much pain they cause, and propose a concrete fix or quarantine plan for each.\
  \ You never \"fix\" flakiness by just adding retries, and you never call a test\
  \ flaky without evidence from at least two runs that disagree.\n\n## Files in this\
  \ skill\n\n- `scripts/flaky_tests.py` - parses JUnit XML files (one per run) or\
  \ a CSV history and prints a ranked flakiness table or JSON (Python 3 standard library\
  \ only)\n- `references/flakiness-causes.md` - common root causes with symptoms and\
  \ fixes\n- `references/junit-and-history-formats.md` - how to export JUnit XML and\
  \ CSV history from popular runners and CI systems\n- `templates/flaky-report.md`\
  \ - report for a PR comment, issue, or weekly CI health review\n- `examples/test-history.csv`\
  \ - sample run history with a same-commit flake\n\n## Workflow\n\n### 1. Collect\
  \ evidence\nAsk for, or help produce:\n- JUnit XML from at least 3 runs of the same\
  \ suite (CI artifacts, or a local loop such as running the suite 10 times)\n- Or\
  \ a CSV with `run_id,test,status` and, ideally, `commit` and `duration_s`\n- Context:\
  \ runner (pytest, Jest, JUnit, Go test, RSpec), parallelism, retries already enabled,\
  \ shared services (DB, browser, network)\n\nIf only one run is available, explain\
  \ that flakiness cannot be proven and suggest a rerun loop on an unchanged commit.\n\
  \n### 2. Run the detector\n```\npython3 scripts/flaky_tests.py run1.xml run2.xml\
  \ run3.xml\npython3 scripts/flaky_tests.py --csv examples/test-history.csv --only-flaky\n\
  python3 scripts/flaky_tests.py --csv history.csv --json\npython3 scripts/flaky_tests.py\
  \ --self-test\n```\nExit code 1 means at least one flaky test was found (handy as\
  \ a CI health gate); 2 means bad input.\n\n### 3. Classify\n- **flaky_confirmed**:\
  \ passed and failed on the same commit. Strongest evidence; fix first.\n- **flaky**:\
  \ mixed results across runs, commit unknown or different. Check whether the code\
  \ changed between runs.\n- **always_failing**: a real failure, not flakiness. Route\
  \ to the owner as a bug.\n- **stable** / **insufficient_data**: no action, or collect\
  \ more runs.\n\nUse `flip_rate` (how often the result changes between consecutive\
  \ runs) and `fail_rate` together. A high `duration_spread` hints at timeouts, network\
  \ calls, or resource contention.\n\n### 4. Diagnose\nFor each flaky test, read the\
  \ test code and failure messages, then match symptoms against `references/flakiness-causes.md`:\
  \ timing and sleeps, test order dependence, shared state, time zones and clocks,\
  \ randomness without seeds, network, concurrency, resource limits.\n\n### 5. Recommend\n\
  For each test give: likely cause, evidence, a specific fix (for example \"replace\
  \ sleep(2) with waiting for the order status event\"), an owner, and whether to\
  \ quarantine temporarily. Fill `templates/flaky-report.md`.\n\n## Rules\n\n- Retries\
  \ are a temporary bandage with an expiry date, never the fix.\n- Quarantined tests\
  \ need an owner and a ticket; list them in the report.\n- Do not delete a flaky\
  \ test without the owner's agreement.\n- Keep statistics honest: say how many runs\
  \ the conclusion is based on.\n- Never paste secrets or full logs with tokens into\
  \ reports; trim to the relevant assertion.\n\x1FFILE:references/flakiness-causes.md\x1E\
  \n# Common causes of flaky tests\n\n| Cause | Typical symptoms | Fix |\n|---|---|---|\n\
  | Fixed sleeps and timing | Fails more on busy CI agents; duration spread is high\
  \ | Wait for a condition or event with a timeout instead of `sleep` |\n| Test order\
  \ dependence | Passes alone, fails in the full suite or with random order | Reset\
  \ shared state in setup/teardown; run with random order to reproduce |\n| Shared\
  \ mutable state | Globals, singletons, caches, env vars leak between tests | Isolate\
  \ fixtures; restore env; avoid module-level state |\n| Shared external resources\
  \ | Same DB rows, ports, temp files, or queues used by parallel workers | Unique\
  \ names per worker; transactions rolled back per test; random free ports |\n| Clock\
  \ and time zone | Fails near midnight, month end, DST changes, or on agents in other\
  \ zones | Freeze or inject the clock; use UTC; avoid \"now\" in assertions |\n|\
  \ Unseeded randomness | Rare failures with odd data | Seed generators and print\
  \ the seed on failure |\n| Network and third-party calls | Timeouts, 429s, DNS errors\
  \ | Mock or record responses; keep real calls in a separate, non-blocking suite\
  \ |\n| Concurrency and async | Race conditions, unawaited promises, threads not\
  \ joined | Await everything; use proper synchronization; add deterministic hooks\
  \ |\n| Resource limits | OOM, file handle exhaustion, slow containers | Lower parallelism;\
  \ clean up resources; raise limits deliberately |\n| UI and browser tests | Element\
  \ not found, animation timing, viewport differences | Use stable selectors and auto-waiting\
  \ locators; disable animations in test mode |\n| Floating point and ordering | Assertion\
  \ on unordered collections or exact floats | Compare sorted values; use tolerance\
  \ |\n\n## Triage questions\n1. Does it fail on the same commit when rerun? (flaky_confirmed)\n\
  2. Does it fail alone, or only with other tests?\n3. Does failure correlate with\
  \ a specific agent, time of day, or parallel worker?\n4. Is the failure message\
  \ always the same?\n5. Did retries hide it before? Check retry logs.\n\x1FFILE:references/junit-and-history-formats.md\x1E\
  \n# Getting JUnit XML and run history\n\n## JUnit XML per run\n- pytest: `pytest\
  \ --junitxml=reports/run-$N.xml`\n- Jest: `jest-junit` reporter (`JEST_JUNIT_OUTPUT_FILE=reports/run-$N.xml`)\n\
  - Go: `go test -v ./... 2>&1 | go-junit-report > reports/run-$N.xml`\n- JUnit /\
  \ Maven Surefire: `target/surefire-reports/*.xml` (merge per run)\n- RSpec: `rspec_junit_formatter`\n\
  - Playwright: `--reporter=junit`\n\nRerun loop on an unchanged commit:\n```\nfor\
  \ N in $(seq 1 10); do pytest --junitxml=reports/run-$N.xml || true; done\npython3\
  \ scripts/flaky_tests.py reports/run-*.xml\n```\nPass files in run order (glob order\
  \ is fine if names sort correctly, e.g. run-01..run-10).\n\n## How the script reads\
  \ JUnit\n- Test id = `classname::name`\n- `<failure>` or `<error>` child = fail;\
  \ `<skipped>` = skip; otherwise pass\n- `time` attribute = duration in seconds\n\
  \n## CSV history\nColumns: `run_id,test,status` plus optional `commit,duration_s`.\
  \ Accepted statuses: pass/passed/ok/success, fail/failed/failure/error/broken, skip/skipped/ignored/pending.\
  \ Rows must be in run order.\n\nExport ideas: CI test analytics APIs, a small job\
  \ that appends one row per test per run to a CSV artifact, or a query against your\
  \ test results database.\n\x1FFILE:templates/flaky-report.md\x1E\n# Flaky Test Report\n\
  \n**Suite:** <name>  **Runs analyzed:** <n> (<date range or commits>)  **Runner:**\
  \ <pytest / Jest / ...>\n\n## Summary\n- flaky_confirmed: <n>  flaky: <n>  always_failing:\
  \ <n>  stable: <n>  insufficient_data: <n>\n- Retries currently enabled: <yes/no,\
  \ count>\n\n## Fix first\n| Test | Class | Fail rate | Flip rate | Likely cause\
  \ | Evidence | Proposed fix | Owner | Quarantine? |\n|---|---|---|---|---|---|---|---|---|\n\
  | | | | | | | | | |\n\n## Real failures (not flaky)\n| Test | Failing since | Message\
  \ (trimmed) | Owner |\n|---|---|---|---|\n\n## Quarantine list\n| Test | Ticket\
  \ | Owner | Expiry date |\n|---|---|---|---|\n\n## Next steps\n1. \n2. \n\x1FFILE:examples/test-history.csv\x1E\
  \nrun_id,test,status,commit,duration_s\n1,checkout::test_apply_coupon,pass,a1b2c3,0.42\n\
  1,checkout::test_payment_timeout,pass,a1b2c3,1.10\n1,search::test_autocomplete,pass,a1b2c3,0.31\n\
  1,profile::test_avatar_upload,failed,a1b2c3,2.05\n2,checkout::test_apply_coupon,pass,a1b2c3,0.40\n\
  2,checkout::test_payment_timeout,failed,a1b2c3,5.02\n2,search::test_autocomplete,pass,a1b2c3,0.29\n\
  2,profile::test_avatar_upload,failed,a1b2c3,2.10\n3,checkout::test_apply_coupon,pass,d4e5f6,0.44\n\
  3,checkout::test_payment_timeout,pass,d4e5f6,1.07\n3,search::test_autocomplete,skipped,d4e5f6,\n\
  3,profile::test_avatar_upload,failed,d4e5f6,2.01\n4,checkout::test_apply_coupon,pass,d4e5f6,0.41\n\
  4,checkout::test_payment_timeout,failed,d4e5f6,5.01\n4,search::test_autocomplete,pass,d4e5f6,0.30\n\
  4,profile::test_avatar_upload,failed,d4e5f6,2.07\n\x1FFILE:scripts/flaky_tests.py\x1E\
  \n#!/usr/bin/env python3\n\"\"\"Detect flaky tests from repeated CI runs (Python\
  \ 3 standard library only).\n\nInputs (any mix):\n  * JUnit XML files, one per run,\
  \ in run order:  flaky_tests.py run1.xml run2.xml run3.xml\n  * A CSV history file\
  \ with columns run_id,test,status[,commit][,duration_s]:  flaky_tests.py --csv history.csv\n\
  \nStatuses: pass, fail (failure or error), skip. Skips are ignored for flakiness\
  \ math.\nClassifications per test:\n  flaky_confirmed   - passed AND failed on the\
  \ same commit\n  flaky             - passed AND failed across runs (commit unknown\
  \ or different)\n  always_failing    - failed in every non-skipped run (>= --min-runs)\n\
  \  stable            - passed in every non-skipped run (>= --min-runs)\n  insufficient_data\
  \ - fewer than --min-runs non-skipped results\n\nExit code: 1 if any flaky/flaky_confirmed\
  \ test is found, else 0 (2 on input errors).\n\"\"\"\nimport argparse\nimport csv\n\
  import json\nimport sys\nimport xml.etree.ElementTree as ET\nfrom collections import\
  \ OrderedDict\n\nSTATUS_ALIASES = {\n    \"pass\": \"pass\", \"passed\": \"pass\"\
  , \"ok\": \"pass\", \"success\": \"pass\",\n    \"fail\": \"fail\", \"failed\":\
  \ \"fail\", \"failure\": \"fail\", \"error\": \"fail\", \"broken\": \"fail\",\n\
  \    \"skip\": \"skip\", \"skipped\": \"skip\", \"ignored\": \"skip\", \"pending\"\
  : \"skip\",\n}\n\n\ndef norm_status(raw):\n    s = STATUS_ALIASES.get(str(raw).strip().lower())\n\
  \    if s is None:\n        raise ValueError(f\"unknown status: {raw!r}\")\n   \
  \ return s\n\n\ndef parse_junit_text(text, run_id):\n    \"\"\"Return list of (run_id,\
  \ test_id, status, commit, duration) from JUnit XML text.\"\"\"\n    root = ET.fromstring(text)\n\
  \    rows = []\n    for case in root.iter(\"testcase\"):\n        cls = case.get(\"\
  classname\") or \"\"\n        name = case.get(\"name\") or \"?\"\n        test_id\
  \ = f\"{cls}::{name}\" if cls else name\n        if case.find(\"failure\") is not\
  \ None or case.find(\"error\") is not None:\n            status = \"fail\"\n   \
  \     elif case.find(\"skipped\") is not None:\n            status = \"skip\"\n\
  \        else:\n            status = \"pass\"\n        try:\n            dur = float(case.get(\"\
  time\", \"\") or 0.0)\n        except ValueError:\n            dur = 0.0\n     \
  \   rows.append((run_id, test_id, status, None, dur))\n    return rows\n\n\ndef\
  \ parse_csv_text(text):\n    rows = []\n    reader = csv.DictReader(text.splitlines())\n\
  \    need = {\"run_id\", \"test\", \"status\"}\n    if not reader.fieldnames or\
  \ not need.issubset({f.strip() for f in reader.fieldnames}):\n        raise ValueError(\"\
  CSV needs columns run_id,test,status (optional commit,duration_s)\")\n    for r\
  \ in reader:\n        r = {k.strip(): (v or \"\").strip() for k, v in r.items()\
  \ if k}\n        dur = float(r[\"duration_s\"]) if r.get(\"duration_s\") else 0.0\n\
  \        rows.append((r[\"run_id\"], r[\"test\"], norm_status(r[\"status\"]), r.get(\"\
  commit\") or None, dur))\n    return rows\n\n\ndef analyze(rows, min_runs=3):\n\
  \    \"\"\"rows in run order. Returns OrderedDict test_id -> stats dict.\"\"\"\n\
  \    tests = OrderedDict()\n    for run_id, test_id, status, commit, dur in rows:\n\
  \        t = tests.setdefault(test_id, {\"results\": [], \"durations\": []})\n \
  \       t[\"results\"].append((run_id, status, commit))\n        if status != \"\
  skip\" and dur:\n            t[\"durations\"].append(dur)\n    out = OrderedDict()\n\
  \    for test_id, t in tests.items():\n        seq = [s for _, s, _ in t[\"results\"\
  ] if s != \"skip\"]\n        passes = seq.count(\"pass\")\n        fails = seq.count(\"\
  fail\")\n        skips = sum(1 for _, s, _ in t[\"results\"] if s == \"skip\")\n\
  \        flips = sum(1 for a, b in zip(seq, seq[1:]) if a != b)\n        by_commit\
  \ = {}\n        for _, s, c in t[\"results\"]:\n            if c and s != \"skip\"\
  :\n                by_commit.setdefault(c, set()).add(s)\n        mixed_commits\
  \ = sorted(c for c, ss in by_commit.items() if ss == {\"pass\", \"fail\"})\n   \
  \     n = len(seq)\n        if passes and fails:\n            cls = \"flaky_confirmed\"\
  \ if mixed_commits else \"flaky\"\n        elif n < min_runs:\n            cls =\
  \ \"insufficient_data\"\n        elif fails == n:\n            cls = \"always_failing\"\
  \n        else:\n            cls = \"stable\"\n        durs = t[\"durations\"]\n\
  \        out[test_id] = {\n            \"runs\": n,\n            \"passes\": passes,\n\
  \            \"fails\": fails,\n            \"skips\": skips,\n            \"fail_rate\"\
  : round(fails / n, 3) if n else 0.0,\n            \"flips\": flips,\n          \
  \  \"flip_rate\": round(flips / (n - 1), 3) if n > 1 else 0.0,\n            \"mixed_commits\"\
  : mixed_commits,\n            \"max_duration_s\": round(max(durs), 3) if durs else\
  \ None,\n            \"duration_spread\": round(max(durs) / min(durs), 2) if durs\
  \ and min(durs) > 0 else None,\n            \"classification\": cls,\n        }\n\
  \    return out\n\n\ndef priority(stats):\n    \"\"\"Higher = fix first. Confirmed\
  \ flakiness and high flip rates rank highest.\"\"\"\n    base = {\"flaky_confirmed\"\
  : 3.0, \"flaky\": 2.0, \"always_failing\": 1.0}.get(stats[\"classification\"], 0.0)\n\
  \    return round(base + stats[\"flip_rate\"] + stats[\"fail_rate\"], 3)\n\n\ndef\
  \ render_table(results):\n    lines = [\"| Test | Class | Runs | Fails | Fail rate\
  \ | Flip rate | Same-commit mix | Priority |\",\n             \"|---|---|---|---|---|---|---|---|\"\
  ]\n    ranked = sorted(results.items(), key=lambda kv: (-priority(kv[1]), kv[0]))\n\
  \    for tid, s in ranked:\n        lines.append(f\"| {tid} | {s['classification']}\
  \ | {s['runs']} | {s['fails']} | \"\n                     f\"{s['fail_rate']:.0%}\
  \ | {s['flip_rate']:.0%} | {', '.join(s['mixed_commits']) or '-'} | {priority(s)}\
  \ |\")\n    return \"\\n\".join(lines)\n\n\ndef summary(results):\n    counts =\
  \ {}\n    for s in results.values():\n        counts[s[\"classification\"]] = counts.get(s[\"\
  classification\"], 0) + 1\n    return counts\n\n\nJUNIT_RUN = \"\"\"<testsuites><testsuite\
  \ name=\"api\">\n<testcase classname=\"api.test_orders\" name=\"test_create\" time=\"\
  0.12\"/>\n<testcase classname=\"api.test_orders\" name=\"test_refund\" time=\"{refund_time}\"\
  >{refund}</testcase>\n<testcase classname=\"api.test_auth\" name=\"test_expired_token\"\
  \ time=\"0.05\">{auth}</testcase>\n<testcase classname=\"api.test_search\" name=\"\
  test_reindex\" time=\"1.0\"><skipped/></testcase>\n</testsuite></testsuites>\"\"\
  \"\n\n\ndef _run(refund_fail, auth_fail, refund_time=\"0.30\"):\n    return JUNIT_RUN.format(\n\
  \        refund='<failure message=\"timeout\"/>' if refund_fail else \"\",\n   \
  \     auth='<error message=\"boom\"/>' if auth_fail else \"\",\n        refund_time=refund_time)\n\
  \n\ndef self_test():\n    rows = []\n    pattern = [(False, True), (True, True),\
  \ (False, True), (True, True), (False, True)]\n    for i, (rf, af) in enumerate(pattern,\
  \ 1):\n        rows += parse_junit_text(_run(rf, af, \"0.30\" if not rf else \"\
  3.10\"), f\"run{i}\")\n    res = analyze(rows, min_runs=3)\n    csv_text = (\"run_id,test,status,commit,duration_s\\\
  n\"\n                \"1,ui::login,pass,abc,1.0\\n2,ui::login,failed,abc,1.2\\n3,ui::login,pass,def,0.9\\\
  n\"\n                \"1,ui::cart,pass,abc,\\n2,ui::cart,pass,abc,\\n\"\n      \
  \          \"1,ui::banner,skipped,abc,\\n2,ui::banner,ok,abc,\\n3,ui::banner,ok,def,\\\
  n4,ui::banner,ok,def,\\n\")\n    res_csv = analyze(parse_csv_text(csv_text), min_runs=3)\n\
  \    bad_status = False\n    try:\n        norm_status(\"weird\")\n    except ValueError:\n\
  \        bad_status = True\n    bad_csv = False\n    try:\n        parse_csv_text(\"\
  a,b\\n1,2\\n\")\n    except ValueError:\n        bad_csv = True\n    cases = [\n\
  \        (\"junit_case_count\", len(res), 4),\n        (\"create_stable\", res[\"\
  api.test_orders::test_create\"][\"classification\"], \"stable\"),\n        (\"refund_flaky\"\
  , res[\"api.test_orders::test_refund\"][\"classification\"], \"flaky\"),\n     \
  \   (\"refund_flips\", res[\"api.test_orders::test_refund\"][\"flips\"], 4),\n \
  \       (\"refund_flip_rate\", res[\"api.test_orders::test_refund\"][\"flip_rate\"\
  ], 1.0),\n        (\"refund_fail_rate\", res[\"api.test_orders::test_refund\"][\"\
  fail_rate\"], 0.4),\n        (\"refund_duration_spread\", res[\"api.test_orders::test_refund\"\
  ][\"duration_spread\"], 10.33),\n        (\"error_counts_as_fail\", res[\"api.test_auth::test_expired_token\"\
  ][\"classification\"], \"always_failing\"),\n        (\"skip_only_insufficient\"\
  , res[\"api.test_search::test_reindex\"][\"classification\"], \"insufficient_data\"\
  ),\n        (\"skip_counted\", res[\"api.test_search::test_reindex\"][\"skips\"\
  ], 5),\n        (\"csv_same_commit_confirmed\", res_csv[\"ui::login\"][\"classification\"\
  ], \"flaky_confirmed\"),\n        (\"csv_mixed_commit_listed\", res_csv[\"ui::login\"\
  ][\"mixed_commits\"], [\"abc\"]),\n        (\"csv_two_runs_insufficient\", res_csv[\"\
  ui::cart\"][\"classification\"], \"insufficient_data\"),\n        (\"csv_skip_ignored_stable\"\
  , res_csv[\"ui::banner\"][\"classification\"], \"stable\"),\n        (\"priority_order\"\
  , priority(res_csv[\"ui::login\"]) > priority(res[\"api.test_orders::test_refund\"\
  ]), True),\n        (\"unknown_status_rejected\", bad_status, True),\n        (\"\
  bad_csv_rejected\", bad_csv, True),\n        (\"summary_counts\", summary(res),\
  \ {\"stable\": 1, \"flaky\": 1, \"always_failing\": 1, \"insufficient_data\": 1}),\n\
  \    ]\n    failed = 0\n    for name, got, expected in cases:\n        ok = abs(got\
  \ - expected) < 0.01 if isinstance(expected, float) else got == expected\n     \
  \   failed += not ok\n        print(f\"{'PASS' if ok else 'FAIL'}  {name}: got={got!r}\
  \ expected={expected!r}\")\n    print(f\"\\n{len(cases) - failed}/{len(cases)} passed\"\
  )\n    return 1 if failed else 0\n\n\ndef main(argv=None):\n    p = argparse.ArgumentParser(description=\"\
  Detect flaky tests from repeated JUnit XML runs or a CSV history.\")\n    p.add_argument(\"\
  junit\", nargs=\"*\", help=\"JUnit XML files in run order\")\n    p.add_argument(\"\
  --csv\", help=\"CSV history: run_id,test,status[,commit][,duration_s]\")\n    p.add_argument(\"\
  --min-runs\", type=int, default=3)\n    p.add_argument(\"--json\", action=\"store_true\"\
  , help=\"print JSON instead of a markdown table\")\n    p.add_argument(\"--only-flaky\"\
  , action=\"store_true\")\n    p.add_argument(\"--self-test\", action=\"store_true\"\
  )\n    a = p.parse_args(argv)\n    if a.self_test:\n        return self_test()\n\
  \    rows = []\n    try:\n        for i, path in enumerate(a.junit, 1):\n      \
  \      with open(path, encoding=\"utf-8\") as fh:\n                rows += parse_junit_text(fh.read(),\
  \ f\"run{i}:{path}\")\n        if a.csv:\n            with open(a.csv, encoding=\"\
  utf-8\") as fh:\n                rows += parse_csv_text(fh.read())\n    except (OSError,\
  \ ValueError, ET.ParseError) as e:\n        print(f\"error: {e}\", file=sys.stderr)\n\
  \        return 2\n    if not rows:\n        p.error(\"give JUnit XML files, --csv,\
  \ or --self-test\")\n    res = analyze(rows, a.min_runs)\n    if a.only_flaky:\n\
  \        res = OrderedDict((k, v) for k, v in res.items() if v[\"classification\"\
  ].startswith(\"flaky\"))\n    if a.json:\n        print(json.dumps({\"summary\"\
  : summary(res), \"tests\": res}, indent=2))\n    else:\n        print(render_table(res))\n\
  \        print(\"\\nSummary:\", \", \".join(f\"{k}={v}\" for k, v in sorted(summary(res).items())))\n\
  \    return 1 if any(v[\"classification\"].startswith(\"flaky\") for v in res.values())\
  \ else 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())"
