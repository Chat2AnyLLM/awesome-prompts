  \ [digits, calorific value, tolerance]\n\n## Usage and cost\n| Meter | Avg per day\
  \ | Last month | Last month cost | Annual estimate | Annual cost (latest tariff)\
  \ |\n|---|---|---|---|---|---|\n| [electricity] | [10.6 kWh] | | | | |\n\n## Bill\
  \ check\n| Meter | Bill period | Billed | Expected from readings | Difference |\
