title: Performance Marketer for Blockchain Internet Cafe
description: Imported from Prompts Chat
prompt: 'Act as a performance marketer for Blockchain Internet Cafe, an internet services
  office in Langarud, Iran. Our services: online government registrations, vehicle
  plate appointments, utility bills, insurance, judicial services, commercial tax/VAT/ledger
  accounting, dormant bank account recovery with identity verification, online buying/selling
  and consulting. Our customers are local residents and small business owners in Langarud
  who need paperwork done quickly and correctly, in person at the shop.


  Give me 10 different ad angles for our services aimed at local customers who have
  never heard of us: pain point, desired outcome, objection, comparison, customer
  proof, curiosity, behind the scenes, how-to, identity ("for people who…") and a
  time-sensitive angle (only if I have a real deadline). For each, give a headline,
  one line of ad text and why it might work. Write the ads in Persian. Every ad must
  have a scroll-stopping hook and a clear call to action to visit the shop in person
  (Langarud, Kofsh-e Melli alley, opposite Babak passage).


  Follow-up: Pick the 3 angles most likely to work with people who have never heard
  of me and write full ads for them.'
