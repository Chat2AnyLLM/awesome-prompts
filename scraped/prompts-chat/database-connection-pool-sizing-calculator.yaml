slug: database-connection-pool-sizing-calculator
title: Database Connection Pool Sizing Calculator
description: Imported from Prompts Chat
prompt: "---\nname: database-connection-pool-sizing-calculator\ndescription: Sizes\
  \ database connection pools for Postgres/MySQL apps from a short JSON of services,\
  \ pods, workers, threads and pool settings - worst-case connections at autoscale\
  \ max and during deploy surges vs max_connections, busy connections from rps x hold\
  \ time, per-process wait odds (Erlang C), CPU and memory limits, PgBouncer client\
  \ and server limits. Recommends pool sizes or proxy settings. Includes an offline\
  \ stdlib Python calculator with --self-test.\n---\n\n# Database Connection Pool\
  \ Sizing Calculator\n\nYou work out how many database connections an application\
  \ really needs and whether its pool settings can take the database down. Most \"\
  too many clients already\" outages are arithmetic: pods x worker processes x (pool_size\
  \ + max_overflow), multiplied again by autoscaling and rolling deploys, against\
  \ a max_connections that also has to cover admin sessions, migrations and monitoring.\
  \ You do that arithmetic for every service, compare it with how many connections\
  \ are actually busy at peak, and return pool sizes (or proxy settings) that fit\
  \ with headroom.\n\n## Files in this skill\n\n- `scripts/pool_sizer.py` - reads\
  \ the JSON description, computes open connections today / at autoscaling maximum\
  \ / during a deploy surge, busy connections (Little's law), the chance a request\
  \ waits for a connection and the mean wait per process (Erlang C), CPU sweet spot\
  \ and memory, PgBouncer limits, and recommends pool sizes; `--set` runs what-ifs\
  \ (Python 3.8+ standard library only)\n- `references/sizing-model.md` - the formulas,\
  \ where each input comes from, and the limits of the model\n- `references/pool-settings-by-stack.md`\
  \ - what pool_size, max_overflow, threads and timeouts are called in SQLAlchemy,\
  \ Django, HikariCP, node-postgres, Prisma, Rails, Go database/sql, Celery/Sidekiq,\
  \ PgBouncer and RDS Proxy\n- `templates/pool-sizing-review.md` - the review to hand\
  \ back\n- `examples/shop-pools.json` - a shop with an API (6-12 pods x 4 gthread\
  \ workers, pool 10 + overflow 20), Celery workers, an admin app and a nightly report\
  \ job on a 200-connection Postgres\n- `examples/pool-report.md` - the real report\
  \ on that file\n- `examples/shop-pools-pgbouncer.json` - the fixed setup: right-sized\
  \ fixed pools, API and workers through PgBouncer in transaction mode, admin and\
  \ reports direct\n\n## Workflow\n\n### 1. Collect the inputs\nFor the database:\
  \ engine, `max_connections`, `superuser_reserved_connections` (Postgres default\
  \ 3), connections used by everything that is not an app service (admin tools, monitoring,\
  \ replication, migrations, BI), vCPUs and RAM. For each service: instances now and\
  \ autoscaling maximum, worker processes per instance, threads or concurrency per\
  \ process (async or not), pool size and overflow, pool timeout, request timeout,\
  \ and load: peak requests or jobs per second and how long one keeps a connection\
  \ checked out (`conn_hold_ms`; frameworks with a session per request hold it for\
  \ the whole request). If there is no hold time, use queries per request x average\
  \ query time, or the pool's \"checked out\" gauge as `busy_connections`. Ask for\
  \ the deploy strategy (maxSurge) and any proxy (PgBouncer, RDS Proxy, ProxySQL,\
  \ Supavisor). Write it as JSON like `examples/shop-pools.json`.\n\n### 2. Run the\
  \ calculator\n```\npython3 scripts/pool_sizer.py examples/shop-pools.json\npython3\
  \ scripts/pool_sizer.py pools.json --set api.max_instances=20 --set database.max_connections=400\n\
  python3 scripts/pool_sizer.py pools.json --json\npython3 scripts/pool_sizer.py --self-test\n\
  ```\nExit 0 = no HIGH finding, 1 = HIGH findings, 2 = the JSON is invalid (the message\
  \ names the field). Without a shell, do the same sums by hand with `references/sizing-model.md`:\
  \ open = instances x processes x (pool_size + max_overflow) per service; busy =\
  \ rps x hold seconds; compare both with max_connections - reserved - other.\n\n\
  ### 3. Read the result\n- HIGH findings first: limits exceeded today, at autoscaling\
  \ maximum or during a deploy surge, pools or proxies too small for the load, workers\
  \ saturated by database time.\n- Compare \"busy at peak\" with \"open\": a large\
  \ gap means idle connections hold memory and slots; a transaction-mode proxy or\
  \ smaller fixed pools close it.\n- \"Busy at peak\" above the CPU sweet spot (cores\
  \ x 2 + 1) means the database itself is the bottleneck: more connections make it\
  \ slower, not faster. Fix hold time (short transactions, no HTTP calls inside them,\
  \ indexes) or capacity.\n- Treat the Erlang C numbers as a guide: they assume evenly\
  \ spread, random arrivals. Check them against the pool's wait-time and checked-out\
  \ metrics.\n\n### 4. Recommend\n- Prefer fixed pools (`max_overflow` 0, min idle\
  \ = max) sized per process from the recommendation, never more than the threads\
  \ that can use them.\n- Keep at least 10% of usable connections free at max scale\
  \ + deploy surge for admin sessions, failover and migrations.\n- When direct connections\
  \ cannot fit, put the busy services behind a transaction-mode proxy with the server\
  \ pool the report suggests; keep migrations, `LISTEN/NOTIFY`, advisory locks and\
  \ session settings on a direct connection.\n- Raise `max_connections` only when\
  \ RAM allows it, and say what it costs.\n- Set pool timeouts well below the request\
  \ timeout so overload fails fast instead of piling up.\n- Rerun with `--set` for\
  \ the next traffic peak or the next autoscaling change.\n\n### 5. Deliver\nFill\
  \ `templates/pool-sizing-review.md`: verdict, the connection budget table, findings\
  \ with fixes, the new settings per service in that stack's own names, proxy settings,\
  \ and what to monitor after the change.\n\n## Example result\nOn `examples/shop-pools.json`\
  \ the services can open 1,230 connections today, 2,430 at autoscaling maximum and\
  \ 3,050 during a deploy, against 185 usable, while only about 28 are busy at peak.\
  \ The API pool (10 + 20 per process) is larger than its 8 threads can ever use,\
  \ and every Celery process keeps 15 connections for 1 thread. Right-sized fixed\
  \ pools still need 400 direct connections, so the report suggests a transaction-mode\
  \ PgBouncer with about 53 server connections. `examples/shop-pools-pgbouncer.json`\
  \ applies that and fits in 80 of 185 with no HIGH finding; the remaining MEDIUM\
  \ says the 8-core database is already busy at peak (28 active vs a sweet spot of\
  \ 17).\n\n## Rules\n\n- Never guess max_connections, autoscaling limits or hold\
  \ times; ask, or label the number as an assumption in the review.\n- Size for the\
  \ worst case the platform allows (autoscaling max + deploy surge), not today's pod\
  \ count.\n- Count every client of the database, including cron jobs, BI tools, migrations\
  \ and replicas' replication slots.\n- Do not recommend raising max_connections as\
  \ the first fix; idle connections cost memory and CPU on the database.\n- Give settings\
  \ in the names of the user's own framework (see `references/pool-settings-by-stack.md`).\n\
  - Say clearly that the queueing numbers are a model and name the metric that confirms\
  \ them.\n\x1FFILE:references/sizing-model.md\x1E\n# Sizing model\n\n## Connection\
  \ budget\n- Usable = `max_connections - reserved - other`. Postgres keeps `superuser_reserved_connections`\
  \ (default 3) for admins; managed services reserve more (RDS rdsadmin, Cloud SQL,\
  \ Azure). \"Other\" = monitoring agents, admin tools, BI, migrations, logical replication.\n\
  - Open connections per service = `instances x processes x (pool_size + max_overflow)`.\n\
  - Autoscaling: use `max_instances`. Rolling deploy: old and new pods overlap, `ceil(max_instances\
  \ x (1 + maxSurge)) x processes x pool max`.\n- Via a proxy the database sees only\
  \ the proxy's server connections: `min(default_pool_size x db/user pairs, max_db_connections)\
  \ + reserve_pool_size`, per proxy instance.\n- Headroom: keep >= 10% of usable free\
  \ at max scale + surge.\n\n## Busy connections (Little's law)\n- `busy = arrival\
  \ rate x time each arrival holds a connection`. 1,200 requests/s x 15 ms = 18 connections\
  \ busy on average.\n- Hold time is checkout to return, not query time: a framework\
  \ that opens a transaction or session for the whole request holds the connection\
  \ for the whole request, including template rendering and external HTTP calls.\n\
  - Without measurements: `queries per request x average query time + ~1 ms overhead`;\
  \ better, read the pool's checked-out gauge at peak.\n- Peaks inside a minute are\
  \ higher than the per-minute average; the calculator multiplies load by `burst_factor`\
  \ (default 1.3).\n\n## Waiting for a connection (Erlang C)\n- Per process, offered\
  \ load `a = busy x burst / processes` (in Erlangs). With `c` connections in the\
  \ pool, the probability that a checkout has to wait is Erlang C(c, a); mean wait\
  \ = `C(c, a) x hold / (c - a)`.\n- `a >= c` means the pool is saturated: requests\
  \ queue until `pool_timeout` and then fail.\n- Recommended pool = smallest `c` with\
  \ C(c, a) <= target (default 1%) and utilization `a / c` <= 0.7, never more than\
  \ the threads that can use connections (sync workers) and at least 2 (or the thread\
  \ count if lower).\n- A sync process with N threads never uses more than N connections.\
  \ If `pool >= threads`, nothing waits for a connection; requests wait for a thread\
  \ instead (WORKERS_SATURATED when `a` approaches `threads`).\n- Assumptions: random\
  \ (Poisson) arrivals, exponential hold times, load spread evenly over processes.\
  \ Real traffic is burstier; use the numbers to compare options, then confirm with\
  \ pool wait metrics.\n\n## The database's own limit\n- A database runs about `cores\
  \ x 2 + effective spindles` queries at once efficiently (the HikariCP / PostgreSQL\
  \ wiki rule of thumb; SSD -> spindles about 1). More active connections queue inside\
  \ the database and add context switching and lock contention.\n- So `busy at peak`\
  \ above that number is a capacity or query problem, not a pool problem.\n- Each\
  \ Postgres backend costs roughly 5-10 MB plus `work_mem` per sort/hash node; MySQL\
  \ threads about 1-3 MB plus buffers. The calculator flags open connections x MB\
  \ above 25% of RAM.\n\n## Proxies\n- Transaction mode multiplexes many client connections\
  \ over few server connections; session mode pins one server connection per client\
  \ and saves nothing.\n- Client connections to PgBouncer are cheap (~2 kB); `max_client_conn`\
  \ must cover all client pools at max scale + surge, per proxy instance.\n- Transaction\
  \ mode loses session state between transactions: `SET`, temp tables, advisory locks,\
  \ `LISTEN/NOTIFY`, `WITH HOLD` cursors; protocol-level prepared statements need\
  \ PgBouncer 1.21+ (`max_prepared_statements`). Run migrations directly.\n- RDS Proxy\
  \ \"pins\" connections that use session state, which silently turns it into session\
  \ mode for those clients.\n\n## What to monitor after a change\n- Pool: checked-out\
  \ connections, wait time / wait count, timeouts (SQLAlchemy `QueuePool limit ...\
  \ reached`, HikariCP `Connection is not available, request timed out`).\n- Database:\
  \ `SELECT count(*), state FROM pg_stat_activity GROUP BY state;` (`idle in transaction`\
  \ = held but unused), `max_connections` usage, CPU, `wait_event` types.\n- Proxy:\
  \ `SHOW POOLS;` (`cl_waiting`, `maxwait`), `SHOW STATS;`.\n\x1FFILE:references/pool-settings-by-stack.md\x1E\
  \n# Pool settings by stack\n\n| Stack | Pool size | Overflow / max | Idle min |\
  \ Wait timeout | Concurrency per process |\n|---|---|---|---|---|---|\n| SQLAlchemy\
  \ (QueuePool) | `pool_size` (5) | `max_overflow` (10) | - | `pool_timeout` (30 s)\
  \ | gunicorn `--threads`, uvicorn = async |\n| Django | no pool before 5.1; persistent\
  \ `CONN_MAX_AGE` = 1 connection per thread; 5.1+ psycopg pool `OPTIONS[\"pool\"\
  ]` `min_size`/`max_size` | - | `min_size` | `timeout` | gunicorn workers x threads\
  \ |\n| HikariCP (Java/Spring) | `maximumPoolSize` (10) | - | `minimumIdle` (= max)\
  \ | `connectionTimeout` (30 s) | Tomcat `server.tomcat.threads.max` (200) |\n| node-postgres\
  \ (pg.Pool) | `max` (10) | - | - | `connectionTimeoutMillis` (0 = forever) | async:\
  \ one process, many requests |\n| Prisma | `connection_limit` in the URL (cores\
  \ x 2 + 1) | - | - | `pool_timeout` (10 s) | async |\n| Rails ActiveRecord | `pool`\
  \ in database.yml (5) | - | - | `checkout_timeout` (5 s) | Puma threads (`RAILS_MAX_THREADS`)\
  \ x workers |\n| Go database/sql | `SetMaxOpenConns` (0 = unlimited) | - | `SetMaxIdleConns`\
  \ (2) | context deadline | goroutines: async |\n| Celery | 1 connection per worker\
  \ process (Django) or the SQLAlchemy pool per process | - | - | - | `--concurrency`\
  \ processes, 1 task each (prefork) |\n| Sidekiq | ActiveRecord `pool` >= Sidekiq\
  \ `concurrency` | - | - | - | `concurrency` threads |\n| PgBouncer | `default_pool_size`\
  \ (20) per db/user pair, `max_db_connections` | `reserve_pool_size` | `min_pool_size`\
  \ | `query_wait_timeout` (120 s) | `max_client_conn` (100) |\n| RDS Proxy | `MaxConnectionsPercent`\
  \ of max_connections | - | `MaxIdleConnectionsPercent` | `ConnectionBorrowTimeout`\
  \ (120 s) | - |\n\n## Mapping to the calculator's JSON\n- `processes`: gunicorn/Puma\
  \ workers, Celery `--concurrency` (prefork), uWSGI processes, Node cluster workers.\n\
  - `threads`: gunicorn `--threads`, Puma threads, Tomcat threads, Sidekiq concurrency.\
  \ Set `async: true` for asyncio, Node, Go, reactive Java; then the pool size is\
  \ the only concurrency limit.\n- `pool_size` + `max_overflow`: the most connections\
  \ one process can open.\n- `pool_timeout_ms`, `request_timeout_ms`: the pool's wait\
  \ timeout and the HTTP/load balancer timeout.\n- Serverless functions (Lambda, Cloud\
  \ Run with concurrency 1): each instance is one process; use the account/function\
  \ concurrency limit as `max_instances` and almost always a proxy.\n\n## Common traps\n\
  - Django `CONN_MAX_AGE` with many threads or ASGI opens one connection per thread/task\
  \ and never shares them.\n- Celery/RQ workers that import the web app's SQLAlchemy\
  \ engine get the web pool size (e.g. 10 + 20) for a process that runs one task at\
  \ a time.\n- Node `pg.Pool` per request handler (a new pool on every request) instead\
  \ of one per process.\n- Go without `SetMaxOpenConns`: unlimited connections under\
  \ load.\n- Rails: Puma threads > `pool` gives `ActiveRecord::ConnectionTimeoutError`;\
  \ Sidekiq needs its own pool >= concurrency.\n- Health checks and readiness probes\
  \ that open a new connection every few seconds per pod.\n\x1FFILE:templates/pool-sizing-review.md\x1E\
  \n# Connection pool sizing review: <system>\n\n**Database:** <engine, size, max_connections,\
  \ reserved, other -> usable>   **Proxy:** <none / PgBouncer transaction mode ...>\n\
  **Verdict:** <will run out / works but wasteful / OK> - <n> HIGH, <n> MEDIUM, <n>\
  \ LOW\n**Inputs measured vs assumed:** <rps and hold time from APM for api; worker\
  \ hold time assumed 200 ms ...>\n\n## Connection budget\n| Scenario | Open now (current\
  \ settings) | With recommended settings | Usable |\n|---|---|---|---|\n| Today |\
  \ <1,230> | <...> | <185> |\n| Autoscaling max | <2,430> | <...> | <185> |\n| Max\
  \ + deploy surge | <3,050> | <80 via PgBouncer> | <185> |\n| Busy at peak | <~28>\
  \ | <~28> | CPU sweet spot <~17> |\n\n## Findings\n| Sev | What | Why it matters\
  \ | Fix |\n|---|---|---|---|\n| <HIGH> | <pools can open 1,230 of 185> | <'too many\
  \ clients' during a traffic spike or deploy> | <fixed pools + PgBouncer> |\n\n##\
  \ New settings\n| Service | Setting (in its own stack) | Old | New |\n|---|---|---|---|\n\
  | <api (SQLAlchemy)> | <pool_size / max_overflow / pool_timeout> | <10 / 20 / 30\
  \ s> | <5 / 0 / 2 s> |\n| <celery-worker> | <pool_size / max_overflow> | <5 / 10>\
  \ | <1 / 0> |\n\n## Proxy\n- <pgbouncer.ini: pool_mode = transaction, default_pool_size\
  \ = 27, reserve_pool_size = 3, max_db_connections = 27, max_client_conn = 1000;\
  \ 2 instances>\n- <Keep direct: migrations, admin, nightly-reports (session features)>\n\
  \n## Database\n- <max_connections stays 200; ~80 used at max + surge>\n- <Busy at\
  \ peak (28) above sweet spot (17): look at the slowest queries / long transactions\
  \ first>\n\n## Roll-out and monitoring\n1. <deploy pool changes to workers first,\
  \ then API>\n2. <watch: pool wait time, timeouts, pg_stat_activity by state, PgBouncer\
  \ SHOW POOLS cl_waiting/maxwait>\n3. <rerun the calculator with the measured hold\
  \ time after a week>\n\n## Open questions\n- <real autoscaling max for api?>\n\x1F\
  FILE:examples/shop-pools.json\x1E\n{\n  \"database\": {\n    \"name\": \"shop-orders\
  \ (Postgres 16, 8 vCPU / 32 GB)\",\n    \"engine\": \"postgres\",\n    \"max_connections\"\
  : 200,\n    \"reserved_connections\": 3,\n    \"other_connections\": 12,\n    \"\
  cpu_cores\": 8,\n    \"ram_gb\": 32,\n    \"mb_per_connection\": 10\n  },\n  \"\
  deploy\": {\"surge_percent\": 25},\n  \"settings\": {\"target_wait_probability\"\
  : 0.01, \"burst_factor\": 1.3},\n  \"services\": [\n    {\n      \"name\": \"api\"\
  ,\n      \"instances\": 6,\n      \"max_instances\": 12,\n      \"processes\": 4,\n\
  \      \"threads\": 8,\n      \"pool_size\": 10,\n      \"max_overflow\": 20,\n\
  \      \"peak_rps\": 1200,\n      \"conn_hold_ms\": 15,\n      \"pool_timeout_ms\"\
  : 30000,\n      \"request_timeout_ms\": 10000\n    },\n    {\n      \"name\": \"\
  celery-worker\",\n      \"instances\": 4,\n      \"max_instances\": 8,\n      \"\
  processes\": 8,\n      \"threads\": 1,\n      \"pool_size\": 5,\n      \"max_overflow\"\
  : 10,\n      \"peak_rps\": 40,\n      \"conn_hold_ms\": 200\n    },\n    {\n   \
  \   \"name\": \"admin\",\n      \"instances\": 2,\n      \"processes\": 2,\n   \
  \   \"threads\": 4,\n      \"pool_size\": 5,\n      \"max_overflow\": 0,\n     \
  \ \"peak_rps\": 5,\n      \"conn_hold_ms\": 30\n    },\n    {\n      \"name\": \"\
  nightly-reports\",\n      \"instances\": 1,\n      \"processes\": 1,\n      \"threads\"\
  : 4,\n      \"pool_size\": 5,\n      \"max_overflow\": 5,\n      \"busy_connections\"\
  : 2\n    }\n  ]\n}\n\x1FFILE:examples/pool-report.md\x1E\n# Connection pool sizing\
  \ report\n\nDatabase: **shop-orders (Postgres 16, 8 vCPU / 32 GB)** (postgres),\
  \ max_connections 200, reserved 3, other 12 -> **185 usable**, 8 cores (sweet spot\
  \ ~17 active)\nDeploy surge: 25%   Burst factor: 1.3   Target P(wait): 1.0%\n\n\
  **Verdict: will run out of connections or queue** - 1 HIGH, 8 MEDIUM, 3 LOW finding(s).\n\
  \n## Services\n\n| Service | Path | Procs now / max | Pool (size+overflow) | Busy\
  \ at peak | Per proc load | P(wait) | Mean wait | Open now | Open max | Deploy surge\
  \ |\n|---|---|---|---|---|---|---|---|---|---|---|\n| api | direct | 24 / 48 | 10+20\
  \ | 18 (1200 rps x 15 ms) | 0.98 | 0% | 0 ms | 720 | 1440 | 1800 |\n| celery-worker\
  \ | direct | 32 / 64 | 5+10 | 8 (40 rps x 200 ms) | 0.33 | 0% | 0 ms | 480 | 960\
  \ | 1200 |\n| admin | direct | 4 / 4 | 5+0 | 0.15 (5 rps x 30 ms) | 0.05 | 0% |\
  \ 0 ms | 20 | 20 | 30 |\n| nightly-reports | direct | 1 / 1 | 5+5 | 2 (given) |\
  \ 2.6 | 0% | 0 ms | 10 | 10 | 20 |\n\n## Totals against the database\n\n| Scenario\
  \ | Direct | Via proxy (server side) | Database total | Usable | Headroom |\n|---|---|---|---|---|---|\n\
  | today | 1230 | 0 | 1230 | 185 | -1045 |\n| autoscaling max | 2430 | 0 | 2430 |\
  \ 185 | -2245 |\n| max + deploy surge | 3050 | 0 | 3050 | 185 | -2865 |\n\nBusy\
  \ at peak (all services): ~28.15 connections vs ~17 the CPUs run efficiently.\n\n\
  ## Findings\n\n| Sev | Code | Where | What | Fix |\n|---|---|---|---|---|\n| HIGH\
  \ | POOL_EXCEEDS_DB_LIMIT | shop-orders (Postgres 16, 8 vCPU / 32 GB) (max_connections\
  \ 200 - reserved 3 - other 12 = 185 usable) | pools can open 1230 connections at\
  \ today's size; the database accepts 185 - new connections fail with 'too many clients'\
  \ / 'Too many connections' under load | shrink pools to the recommendation below,\
  \ drop max_overflow, or put the services behind a proxy |\n| MEDIUM | DB_ACTIVE_OVER_CORES\
  \ | shop-orders (Postgres 16, 8 vCPU / 32 GB) | about 28.1 connections are busy\
  \ at peak but 8 cores run about 17 at once efficiently (cores x 2 + spindles); the\
  \ rest queue inside the database | cut connection hold time (shorter transactions,\
  \ no network calls inside them), add read replicas, or scale the database |\n| MEDIUM\
  \ | TOO_MANY_CONNECTIONS_FOR_CORES | shop-orders (Postgres 16, 8 vCPU / 32 GB) |\
  \ up to 2430 open connections for 8 cores (304 per core); idle backends cost memory,\
  \ snapshot and lock-table overhead | fewer, busier connections: smaller pools or\
  \ a transaction-mode proxy |\n| MEDIUM | CONNECTION_MEMORY | shop-orders (Postgres\
  \ 16, 8 vCPU / 32 GB) | 2430 connections x ~10 MB = 23.7 GB of 32 GB RAM before\
  \ work_mem/sort buffers | reduce open connections; keep that memory for cache (shared_buffers\
  \ / page cache) |\n| MEDIUM | PROXY_RECOMMENDED | shop-orders (Postgres 16, 8 vCPU\
  \ / 32 GB) | only ~28 connections are busy at peak but up to 2430 are open; a transaction-mode\
  \ pooler multiplexes them | PgBouncer/RDS Proxy/ProxySQL in front of the database\
  \ (see recommendation) |\n| MEDIUM | POOL_LARGER_THAN_CONCURRENCY | api | pool max\
  \ 30 per process but only 8 thread(s) can use a connection at a time; the extra\
  \ 22 can never be used | pool_size <= threads; max_overflow 0 |\n| MEDIUM | POOL_LARGER_THAN_CONCURRENCY\
  \ | celery-worker | pool max 15 per process but only 1 thread(s) can use a connection\
  \ at a time; the extra 14 can never be used | pool_size <= threads; max_overflow\
  \ 0 |\n| MEDIUM | POOL_LARGER_THAN_CONCURRENCY | admin | pool max 5 per process\
  \ but only 4 thread(s) can use a connection at a time; the extra 1 can never be\
  \ used | pool_size <= threads; max_overflow 0 |\n| MEDIUM | POOL_LARGER_THAN_CONCURRENCY\
  \ | nightly-reports | pool max 10 per process but only 4 thread(s) can use a connection\
  \ at a time; the extra 6 can never be used | pool_size <= threads; max_overflow\
  \ 0 |\n| LOW | LARGE_OVERFLOW | api | max_overflow 20 >= pool_size 10 across 48\
  \ processes makes the worst case 1440 instead of 480 | fixed pools (max_overflow\
  \ 0) keep the total predictable |\n| LOW | POOL_TIMEOUT_LONG | api | pool_timeout\
  \ 30000 ms >= request timeout 10000 ms: a request can time out while still waiting\
  \ for a connection | pool_timeout around 10-30% of the request timeout so overload\
  \ fails fast |\n| LOW | LARGE_OVERFLOW | celery-worker | max_overflow 10 >= pool_size\
  \ 5 across 64 processes makes the worst case 960 instead of 320 | fixed pools (max_overflow\
  \ 0) keep the total predictable |\n\n## Recommended pools\n\n| Service | pool_size\
  \ | max_overflow | P(wait) per proc | Open at max | With deploy surge |\n|---|---|---|---|---|---|\n\
  | api | 5 | 0 | 0.3% | 240 | 300 |\n| celery-worker | 1 | 0 | 0% | 64 | 80 |\n|\
  \ admin | 2 | 0 | 0.1% | 8 | 12 |\n| nightly-reports | 4 | 0 | 0% | 4 | 8 |\n\n\
  Database connections needed with these pools at max scale + deploy surge: **400**\
  \ (direct 400 + proxy 0) of 185 usable -> still does NOT fit.\n\nDirect connections\
  \ cannot fit. Put the services behind a transaction-mode proxy: about **53** server\
  \ connections (default_pool_size / max_db_connections) cover peak x burst with P(wait)\
  \ under 1.0%; keep client pools as above and set max_client_conn above the client\
  \ total.\nOr raise max_connections to at least 457 (check RAM: ~10 MB per connection).\n\
  \nModel: Little's law for busy connections, Erlang C (M/M/c) per process with load\
  \ spread evenly; peak load x burst factor. Validate with the pool's checked-out\
  \ and wait metrics.\n\x1FFILE:examples/shop-pools-pgbouncer.json\x1E\n{\n  \"database\"\
  : {\n    \"name\": \"shop-orders (Postgres 16, 8 vCPU / 32 GB)\",\n    \"engine\"\
  : \"postgres\",\n    \"max_connections\": 200,\n    \"reserved_connections\": 3,\n\
