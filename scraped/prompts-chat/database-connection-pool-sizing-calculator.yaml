  \ main(argv=None):\n    ap = argparse.ArgumentParser(description=\"Size database\
  \ connection pools against load and database limits.\")\n    ap.add_argument(\"\
  file\", nargs=\"?\", help=\"JSON description ('-' = stdin)\")\n    ap.add_argument(\"\
  --set\", action=\"append\", default=[], metavar=\"TARGET.KEY=VALUE\",\n        \
  \            help=\"what-if override, e.g. api.max_instances=16 or database.max_connections=400\
  \ (repeatable)\")\n    ap.add_argument(\"--json\", action=\"store_true\")\n    ap.add_argument(\"\
  --self-test\", action=\"store_true\")\n    a = ap.parse_args(argv)\n    if a.self_test:\n\
  \        return self_test()\n    if not a.file:\n        ap.error(\"give a JSON\
  \ file or --self-test\")\n    try:\n        text = sys.stdin.read() if a.file ==\
  \ \"-\" else open(a.file, encoding=\"utf-8\").read()\n        cfg = json.loads(text)\n\
  \        cfg = copy.deepcopy(cfg)\n        for e in a.set:\n            apply_set(cfg,\
  \ e)\n        pl = Plan(cfg)\n    except (OSError, ValueError) as e:\n        print(\"\
  error: %s\" % e, file=sys.stderr)\n        return 2\n    sys.stdout.write(json.dumps(as_json(pl),\
  \ indent=2) + \"\\n\" if a.json else render(pl))\n    return 1 if pl.worst() ==\
  \ \"HIGH\" else 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())"
