title: Hand-Painted Alebrije Wood Carving of a Leaping Jaguar
description: Imported from Prompts Chat
prompt: 'A studio photograph of a hand-carved and hand-painted Oaxacan-style alebrije
  wood sculpture of a jaguar caught mid-leap, its front paws reaching forward and
  its long tail curling up into a spiral, standing on a small carved rock base. The
  whole figure is painted in bright folk colors over carved copal wood: a cobalt blue
  body covered in tight rows of tiny white and yellow dots, orange rosettes outlined
  in black, magenta zigzag bands on the legs, lime green leaf shapes along the spine,
  a turquoise face with large almond eyes, small carved ears and a row of painted
  white teeth. Separate carved ears and tail are fitted into the body as real alebrijes
  are.


  Render it like real handmade folk art: visible knife facets under the paint, slightly
  uneven brushwork and dot spacing, a few tiny hairline cracks in the wood and a soft
  satin sheen. The figure sits on a warm terracotta-colored tabletop against a plain
  off-white wall, soft window light from the left, gentle shadow, shallow depth of
  field. No text, no people, no hands. Portrait 3:4.'
