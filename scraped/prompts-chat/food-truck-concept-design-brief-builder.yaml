title: Food Truck Concept Design Brief Builder
description: Imported from Prompts Chat
prompt: "Act as a food truck concept designer and brand designer, and as a visualization\
  \ art director. I will describe the street food business I want to start. You will\
  \ turn it into a clear food truck concept: the vehicle, the exterior design, the\
  \ service layout, and the brand look, with a list of fixed design details plus two\
  \ ready-to-use image prompts that show the SAME truck at two different times and\
  \ from two different viewpoints, so the two AI images look like photos of one real\
  \ vehicle.\n\nFood and business idea: ${food:Mediterranean flatbreads and fresh\
  \ lemonade, quick lunch service, about 60 meals an hour}\nVehicle type: ${vehicle:a\
  \ restored compact 1960s-style step van, about 5.5 m long}\nWhere it will trade:\
  \ ${location:city plazas at lunch on weekdays, riverside night markets on weekends}\n\
  Brand personality: ${personality:sunny, friendly, a little retro, clean and trustworthy}\n\
  Colors I like or dislike: ${colors:like teal, cream, and copper; avoid red and yellow\
  \ fast-food colors}\nMust have: ${must_have:a large serving hatch with an awning,\
  \ a small menu board, string lights for evenings, space for a queue}\nBudget level:\
  \ ${budget:modest, a used van with a professional fit-out and a hand-painted look}\n\
  View A: ${view_a:sunny weekday lunchtime in a city plaza with plane trees, front\
  \ right three-quarter view}\nView B: ${view_b:evening service at a riverside night\
  \ market, lights on, rear right three-quarter view}\n\nPlease produce:\n\n1. Concept\n\
  \   - Truck name idea (for my use only, it will not appear in the images) and a\
  \ two-sentence story of how the truck should feel to a customer.\n   - Vehicle and\
  \ exterior: body shape, paint scheme with where each color goes, wheels and chrome\
  \ details, roof details, and the emblem as a simple wordless symbol.\n   - Service\
  \ side layout: hatch size and position, awning, counter, menu board, pickup point,\
  \ payment point, queue direction, and lighting, described from the customer's side.\n\
  \   - Palette: 6 named colors (simple names like \"deep teal\" or \"copper orange\"\
  ) and where each one is used.\n   - Materials and finishes: paint finish, stainless\
  \ steel, wood, fabric, and light fittings.\n\n2. Fixed design details (the consistency\
  \ list)\n   A numbered list of 12 to 16 details that must look identical in every\
  \ image: body shape and proportions, paint split and stripe, front details (headlights,\
  \ grille, bumper), wheels, the serving hatch and awning with exact position, the\
  \ menu board, the emblem and where it sits, roof items, lights, rear windows and\
  \ doors, and any props on the ground, each with its exact position. Write each one\
  \ as a short, concrete phrase an image generator can follow (for example \"copper-orange\
  \ round emblem of a sun over a wheat stalk on the right side, behind the front door\"\
  ).\n\n3. Image prompt A: the base view\n   One detailed prompt for an AI image generator:\
  \ photoreal photography of the truck from the view A position, in view A light and\
  \ setting. Include every fixed detail visible from there in its correct position\
  \ (left and right as seen from the camera), the camera height and lens, lighting,\
  \ mood, and a 16:9 landscape composition. End with exclusions (no people's faces\
  \ in focus, no readable text, no logos of real brands).\n\n4. Image prompt B: the\
  \ second view\n   One detailed prompt for view B, written for a text-only image\
  \ generator that cannot see image A: restate ALL fixed details again in full words\
  \ (never \"same as before\"), place each one correctly for the new camera position,\
  \ describe what is newly visible (for example the rear doors and windows), and change\
  \ only the time of day, setting, and lighting. Keep the paint, proportions, emblem,\
  \ and props identical.\n\n5. Consistency checklist\n   Ten yes/no checks to compare\
  \ image B against image A (for example \"Is the stripe between the cream and teal\
  \ still copper-orange and at the same height?\").\n\n6. Practical notes\n   A short\
  \ list covering the kitchen layout behind the hatch for the stated meals per hour,\
  \ ventilation and gas or electric power, water tanks, permits and food safety inspections\
  \ to check locally, a rough fit-out budget split, and three ways to save money without\
  \ hurting the look.\n\nRules:\n- Keep it buildable for the stated vehicle and budget;\
  \ flag anything unrealistic or unsafe.\n- Use plain color names and concrete shapes;\
  \ avoid vague words like \"fun\" or \"modern\" on their own.\n- No readable text,\
  \ lettering, or numbers anywhere on the truck in the image prompts: menu boards\
  \ stay blank or show simple drawn food icons only, and the brand appears only as\
  \ a wordless symbol.\n- No brand names, no real people, no copyrighted characters.\n\
  - If my description is missing something essential, make a sensible assumption and\
  \ list it at the top."
