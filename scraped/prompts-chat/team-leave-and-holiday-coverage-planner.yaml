  \ No slack on 4 day(s) (21 Dec, 22 Dec, 23 Dec, 29 Dec): one sick day breaks coverage;\
  \ line up a backup.\n\x1FFILE:scripts/leave_cover.py\x1E\n#!/usr/bin/env python3\n\
  \"\"\"Team leave and holiday coverage planner (Python 3.8+ standard library only).\n\
  \nChecks a team's leave requests against minimum staffing rules day by day, decides\
  \ which\nrequests can be approved without leaving a gap, suggests alternative dates\
  \ for the rest, and\ntracks allowances and who gets the peak holiday days.\n\nTeam\
  \ JSON:\n{\n  \"team\": \"Support Desk\", \"period\": \"2026-12-14..2027-01-08\"\
  ,\n  \"workdays\": [\"mon\", \"tue\", \"wed\", \"thu\", \"fri\"],\n  \"holidays\"\
  : [\"2026-12-25\", \"2026-12-28\", \"2027-01-01\"],          (office closed, no\
  \ coverage needed)\n  \"coverage\": {\"lead\": 1, \"tier2\": 2, \"oncall\": 1, \"\
  any\": 4},     (\"any\" = total people working)\n  \"coverage_overrides\": [{\"\
  dates\": \"2026-12-24\", \"coverage\": {\"tier2\": 1, \"any\": 3}}],\n  \"blackout\"\
  : [{\"dates\": \"2027-01-05..2027-01-06\", \"reason\": \"billing run\"}],\n  \"\
  peak_days\": \"2026-12-21..2027-01-01\",\n  \"people\": [\n    {\"name\": \"Maya\"\
  , \"roles\": [\"lead\", \"tier2\"], \"allowance\": 25, \"taken\": 17, \"worked_peak_last_year\"\
  : true},\n    {\"name\": \"Priya\", \"roles\": [\"tier1\"], \"days\": [\"mon\",\
  \ \"wed\", \"thu\"], \"allowance\": 15, \"taken\": 9}\n  ]\n}\nEach working person\
  \ fills ONE role slot per day (a lead who is also tier2 counts once), solved\nas\
  \ a bipartite matching.\n\nLeave CSV (header required): person,start,end,type,status,submitted,half_day,notes\n\
  \  type     vacation (counts against allowance) | sick | training | parental | unpaid\
  \ | other\n  status   approved | requested | declined (ignored)\n  half_day yes\
  \ = half a day of allowance; the person is not counted for coverage that day\n\n\
  Usage:\n  python3 leave_cover.py team.json leave.csv [--json]\n  python3 leave_cover.py\
  \ --self-test\nExit codes: 0 = approved leave keeps coverage and nobody is over\
  \ allowance, 1 = approved leave\nalready breaks coverage or exceeds an allowance,\
  \ 2 = bad input.\n\"\"\"\nimport argparse\nimport csv\nimport datetime as dt\nimport\
  \ json\nimport sys\nfrom collections import OrderedDict, defaultdict\n\nDAYS = [\"\
  mon\", \"tue\", \"wed\", \"thu\", \"fri\", \"sat\", \"sun\"]\nTYPE_CODE = {\"vacation\"\
  : \"V\", \"sick\": \"S\", \"training\": \"T\", \"parental\": \"P\", \"unpaid\":\
  \ \"U\", \"other\": \"O\"}\n\n\nclass InputError(ValueError):\n    pass\n\n\ndef\
  \ d(s, what=\"date\"):\n    try:\n        return dt.date.fromisoformat(str(s).strip())\n\
  \    except ValueError:\n        raise InputError(\"%s %r is not YYYY-MM-DD\" %\
  \ (what, s))\n\n\ndef date_range(spec):\n    spec = str(spec)\n    a, _, b = spec.partition(\"\
  ..\")\n    a, b = d(a), d(b or a)\n    if b < a:\n        raise InputError(\"range\
  \ %r ends before it starts\" % spec)\n    return [a + dt.timedelta(days=i) for i\
  \ in range((b - a).days + 1)]\n\n\n# -----------------------------------------------------------------------------\
  \ inputs\ndef load_team(cfg):\n    if \"period\" not in cfg or not cfg.get(\"people\"\
  ):\n        raise InputError(\"team JSON needs 'period' and 'people'\")\n    t =\
  \ dict(cfg)\n    t[\"days\"] = date_range(cfg[\"period\"])\n    t[\"workdays\"]\
  \ = [w.lower()[:3] for w in cfg.get(\"workdays\", DAYS[:5])]\n    t[\"holidays\"\
  ] = {d(h, \"holiday\") for h in cfg.get(\"holidays\", [])}\n    t[\"coverage\"]\
  \ = {k: int(v) for k, v in (cfg.get(\"coverage\") or {}).items()}\n    over = {}\n\
  \    for o in cfg.get(\"coverage_overrides\", []):\n        for day in date_range(o[\"\
  dates\"]):\n            over[day] = {k: int(v) for k, v in o[\"coverage\"].items()}\n\
  \    t[\"overrides\"] = over\n    t[\"blackout\"] = [(set(date_range(b[\"dates\"\
  ])), b.get(\"reason\", \"blackout\")) for b in cfg.get(\"blackout\", [])]\n    t[\"\
  peak\"] = set(date_range(cfg[\"peak_days\"])) if cfg.get(\"peak_days\") else set()\n\
  \    people = OrderedDict()\n    for p in cfg[\"people\"]:\n        if \"name\"\
  \ not in p:\n            raise InputError(\"every person needs a name\")\n     \
  \   q = dict(p)\n        q[\"roles\"] = list(p.get(\"roles\", []))\n        q[\"\
  days\"] = [w.lower()[:3] for w in p.get(\"days\", t[\"workdays\"])]\n        q[\"\
  allowance\"] = float(p.get(\"allowance\", 0))\n        q[\"taken\"] = float(p.get(\"\
  taken\", 0))\n        q[\"carryover_max\"] = p.get(\"carryover_max\", cfg.get(\"\
  carryover_max\"))\n        people[p[\"name\"]] = q\n    t[\"people\"] = people\n\
  \    roles = {r for p in people.values() for r in p[\"roles\"]}\n    for r in list(t[\"\
