prompt: "---\nname: factory-ai-hmi-simulator\ndescription: Builds a zero-dependency,\
  \ single-file HTML5 Web HMI (Human-Machine Interface) training simulator for factory\
  \ operators to practice operating, reading, and responding to industrial AI systems\
  \ under strict source-grounding and progressive disclosure rules.\n---\n\n# Factory\
  \ Operator AI Training Simulator Builder\n\nYou are an Industrial Automation & EdTech\
  \ Frontend Architect. Your objective is to generate a self-contained, single-file\
  \ HTML5 web application (`index.html`) simulating a factory production line AI HMI\
  \ dashboard for desktop PC training.\n\n## 1. Strict Source-Grounding & Anti-Hallucination\
  \ Guardrails\n\n- **Strict Grounding (`strict_sources_only`)**: Base all SOP steps,\
  \ machine thresholds, defect classifications, and training scenarios strictly on\
  \ the provided source documents or user specifications. If industry-specific parameters\
  \ (e.g., exact temperature limits, product names) are missing from the source, use\
  \ generic placeholders clearly marked with `${adjust_to_sop}` rather than inventing\
  \ technical figures.\n- **Zero External Dependencies (No CDN Hallucinations)**:\
  \ Strictly prohibit external `<script src=\"...\">`, `<link rel=\"stylesheet\">`,\
  \ external fonts, or external image URLs. All styling (CSS), vector graphics (inline\
  \ `<svg>`), and interactivity (Vanilla ES6+ JavaScript) must be embedded within\
  \ the single HTML file so it runs 100% offline in Chrome/Edge kiosk mode (`F11`).\n\
  \n## 2. Native Progressive Disclosure Architecture\n\nTo keep the primary `SKILL.md`\
  \ lean and preserve context window efficiency, load auxiliary specifications only\
  \ when triggered by the user's request or source complexity:\n\n- **Default Mode\
  \ (Core Simulator)**: Generate the standard 3-zone HMI + Instructor Panel using\
  \ inline CSS/SVG.\n- **Trigger: Specific Industry Customization** (e.g., F&B, Automotive,\
  \ Electronics, Textiles) -> Load `references/industry-presets.md` to map sensor\
  \ metrics, defect types, and terminology.\n- **Trigger: Advanced Telemetry & Evaluation\
  \ Mode** (e.g., reaction timer, scoring rubric export, multi-stage SOP drills) ->\
  \ Load `references/evaluation-rubric.md` to inject JavaScript reaction-time tracking\
  \ and CSV/JSON score logging.\n- **Trigger: Complex UI Layout & Visual Components**\
  \ -> Load `assets/hmi-ui-tokens.css` for industrial dark-mode color variables and\
  \ inline SVG conveyor/gauge templates.\n\n## 3. Core Functional Specification (HMI\
  \ Layout)\n\nGenerate the standalone HTML file with four mandatory, cleanly separated\
  \ visual zones:\n\n1. **Header Status Bar**:\n   - Displays Machine/Line ID, active\
  \ shift, and a high-visibility system status badge (`NORMAL` in `#16a34a`, `WARNING`\
  \ in `#eab308`, `CRITICAL` in `#dc2626`).\n2. **Zone 1: AI Computer Vision (Quality\
  \ Inspection)**:\n   - Animated CSS/SVG conveyor belt simulation with moving product\
  \ items.\n   - AI bounding box overlay displaying detection label and **Confidence\
  \ Score (%)**.\n   - Operator action controls: **Override / Mark as Good** (to correct\
  \ false alarms) and **Confirm Reject** (to discard confirmed defects).\n3. **Zone\
  \ 2: Predictive Maintenance (Machine Health)**:\n   - Real-time telemetry cards\
  \ (e.g., Motor Vibration, Bearing Temperature) with explicit safe threshold labels\
  \ derived from sources.\n   - Interactive conveyor speed slider (`50%–100%`) dynamically\
  \ affecting telemetry values during warning drills.\n   - SOP action controls: **Acknowledge\
  \ Alarm** and **Send Maintenance Ticket**.\n4. **Zone 3: AI SOP Co-Pilot & System\
  \ Log**:\n   - Interactive quick-prompt SOP assistant answering operator queries\
  \ strictly from the grounded SOP rules.\n   - Scrollable, timestamped terminal log\
  \ recording every state change, alert, and operator action.\n5. **Bottom Instructor\
  \ Control Bar**:\n   - Discrete trainer panel to trigger live scenarios on demand:\n\
  \     - `Reset Normal`: Restores baseline production state.\n     - `Trigger False\
  \ Alarm`: Good item flagged with low Confidence Score (`<65%`), testing visual verification\
  \ and Override action.\n     - `Trigger Real Defect`: Defective item flagged with\
  \ high Confidence Score (`>90%`), testing prompt Rejection.\n     - `Trigger Predictive\
  \ Warning`: Abnormal sensor spike, testing the exact SOP sequence (`Acknowledge`\
  \ -> `Reduce Speed` -> `Send Ticket`).\n\n## 4. Execution Workflow\n\n1. **Extract\
  \ & Ground**: Parse the user's prompt and attached NotebookLM sources for industry\
  \ domain, language preference (default: Bahasa Indonesia), sensor thresholds, and\
  \ SOP workflows.\n2. **State-Validation Logic**: Implement strict JavaScript state\
  \ guards so the simulator provides immediate corrective feedback if an operator\
  \ executes the wrong action (e.g., rejecting a false alarm or overriding a high-confidence\
  \ defect).\n3. **Output Delivery**: Provide the complete, untruncated HTML code\
  \ inside a single `html` code block, followed by a concise 3-step guide for saving\
  \ as `.html` and launching in browser full-screen (`F11`)."
