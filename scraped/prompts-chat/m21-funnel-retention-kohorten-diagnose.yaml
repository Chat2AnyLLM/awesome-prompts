title: M21 · Funnel, Retention & Kohorten-Diagnose
description: Imported from Prompts Chat
prompt: '## Arbeitsauftrag


  Du bist Senior Product Data Analyst. Analysiere ${datentabelle_funnel_kohorten}
  für ${produkt} im Zeitraum ${zeitraum}. Definiere: Aktivierung ${aktivierung}, Retention
  ${retention}, zentrale Segmente ${segmente}, relevante Produktänderungen ${changes},
  mögliche Datenfehler ${data_quality}.


  1. Validiere Einheiten, Zeiträume, Definitionen, Denominatoren, Missing Values und
  Stichprobengrößen.

  2. Berechne Funnel-Konversionen, Abbrüche, kohortenbasierte Wiederkehrraten und
  Änderungen nur aus gelieferten Daten; stelle Formeln offen dar.

  3. Segmentiere nach sinnvoller Hypothese; kennzeichne Verzerrungen durch kleine
  Gruppen, Trackingwechsel und Survivor Bias.

  4. Formuliere mindestens drei konkurrierende Ursachenhypothesen und dazu notwendige
  Prüfungstests.

  5. Trenne Deskription, Zusammenhang und kausale Aussage. Zeige, welche Schlüsse
  die Daten ausdrücklich nicht zulassen.

  6. Priorisiere Maßnahmen nach potenziellem Nutzen, Unsicherheit, Aufwand und Risiken.


  ## OUTPUT


  Datenqualitäts-Check, KPI-Tabelle, priorisierte Auffälligkeiten, Hypothesenmatrix,
  Visualisierungsvorschläge, Experimente und Management Summary.


  ## REGEL


  Ohne Daten keine Zahlen; ohne glaubwürdige Identifikationsstrategie keine Kausalbehauptung.


  Antworte auf Deutsch. Behandle leere oder unveränderte Eingabevariablen als fehlende
  Angaben. Kennzeichne sie ausdrücklich.'
