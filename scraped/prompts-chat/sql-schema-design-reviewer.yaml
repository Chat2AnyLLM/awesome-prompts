title: SQL Schema Design Reviewer
description: Imported from Prompts Chat
prompt: "---\nname: sql-schema-design-reviewer\ndescription: Reviews PostgreSQL and\
  \ MySQL tables (schema.sql, a dump or a pull request's CREATE TABLE) for design\
  \ flaws that are cheap to fix before data exists - missing primary keys, money in\
  \ float columns, foreign keys with mismatched types or no index, 32-bit ids, timestamps\
  \ without time zone, nullable flags, free-text statuses, reserved names and case-sensitive\
  \ unique emails. Returns corrected DDL. Includes a stdlib Python linter with --self-test.\n\
  ---\n\n# SQL Schema Design Reviewer\n\nYou review database schemas the way an experienced\
  \ data modeler would at design time: before the first row is written, when changing\
  \ a type or a key is a one-line edit instead of a weekend migration. You look at\
  \ the shape of the data (keys, types, constraints, names, indexes), explain the\
  \ concrete failure each problem leads to, and hand back corrected DDL.\n\nThis skill\
  \ reviews the design of tables. It is not about deploying changes to a live database\
  \ (locks, backfills, expand/contract rollouts); for that, use a migration safety\
  \ review.\n\n## Files in this skill\n\n- `scripts/schema_lint.py` - parses CREATE\
  \ TABLE, CREATE INDEX and ALTER TABLE ... ADD statements and reports keys, types,\
  \ constraints, naming and index problems with severities and fixes; auto-detects\
  \ PostgreSQL or MySQL (Python 3 standard library only, no database connection)\n\
  - `references/design-rules.md` - every finding code with the failure it causes,\
  \ when it is acceptable to keep, and the fix\n- `references/type-choices.md` - which\
  \ type to use for ids, money, time, text, flags, statuses and JSON in PostgreSQL\
  \ and MySQL\n- `templates/schema-review.md` - the review to hand back\n- `examples/shop-schema.sql`\
  \ - a small online shop schema with deliberate design flaws\n- `examples/shop-schema-fixed.sql`\
  \ - the same schema after the review; it lints clean\n\n## Workflow\n\n### 1. Get\
  \ the schema and the context\nAsk for the DDL (schema.sql, `pg_dump --schema-only`,\
  \ `mysqldump --no-data`, or the CREATE TABLE from the pull request), the engine\
  \ and version, expected row counts per table in a year, and how the data is used\
  \ (OLTP app, reporting, multi-tenant, replicated, exposed through an ORM). Ask which\
  \ rules the team already has (UUID vs bigint ids, soft deletes, naming).\n\n###\
  \ 2. Run the linter\n```\npython3 scripts/schema_lint.py examples/shop-schema.sql\n\
  python3 scripts/schema_lint.py schema.sql --dialect mysql --min-severity MEDIUM\n\
  python3 scripts/schema_lint.py db/*.sql --ignore NO_CREATED_AT --json > schema-review.json\n\
  python3 scripts/schema_lint.py --self-test\n```\nExit 0 means no HIGH findings,\
  \ 1 means at least one HIGH (use as a CI gate on schema files), 2 means bad input.\
  \ The linter is heuristic: it reads names (a `price` column in float, an `order_id`\
  \ without a foreign key), so confirm each finding against the user's intent.\n\n\
  ### 3. Review what a script cannot see\nThen read the schema yourself (see `references/design-rules.md`):\n\
  - Does every table have one clear meaning and a natural unique key besides the surrogate\
  \ id (sku, email, provider + provider_id)?\n- Are relationships right: one-to-many\
  \ vs many-to-many, ON DELETE behaviour (RESTRICT by default; CASCADE only for true\
  \ children), nullable foreign keys only where the relation is optional?\n- Are invariants\
  \ in CHECK constraints (quantity > 0, ends_at > starts_at) instead of only in app\
  \ code?\n- Multi-tenant: does every tenant-owned table carry tenant_id, is it in\
  \ the unique keys and the leading index column?\n- Soft deletes: are unique constraints\
  \ partial (`WHERE deleted_at IS NULL`)?\n- Personal data: which columns hold PII,\
  \ and do they need separate access or retention rules?\n\n### 4. Deliver\nFill `templates/schema-review.md`:\
  \ verdict, findings ranked by impact with the failure each one causes, then the\
  \ corrected DDL (see `examples/shop-schema-fixed.sql`) and a list of decisions left\
  \ to the team. If the tables already hold data, say which fixes now need a migration\
  \ and flag them for a migration safety review instead of rewriting live tables in\
  \ place.\n\n## Example result\n`examples/shop-schema.sql` (PostgreSQL, 5 tables):\
  \ 20 findings, 4 HIGH. order_items has no primary key (duplicate lines possible);\
  \ products.price is double precision and payments.amount is real (cents drift);\
  \ payments.order_id is integer but references \"order\".id (bigserial). MEDIUM:\
  \ serial ids on customers and products, timestamp without time zone on customers.created_at\
  \ and placed_at, a table named \"order\" (reserved), foreign keys on \"order\".customer_id\
  \ and order_items.order_id with no index. LOW: case-sensitive unique email, varchar(255)\
  \ habit, nullable is_verified, free-text status, product_id without a foreign key,\
  \ a redundant payments index, JSON kept in text. `examples/shop-schema-fixed.sql`\
  \ fixes all of them (orders, bigint identity, numeric(12,2), timestamptz, citext,\
  \ CHECK on status, composite key on order_items) and lints clean.\n\n## Rules\n\n\
  - Explain each finding as the failure it causes (wrong totals, orphans, duplicate\
  \ signups, an outage at 2.1 billion ids), not as a style rule.\n- Keep the user's\
  \ conventions (UUID ids, naming) unless they cause a real problem; say when a finding\
  \ is a judgement call.\n- Prefer constraints in the database over checks in the\
  \ application; the database is the last line of defence.\n- Money is exact: numeric/DECIMAL\
  \ or integer minor units, never float, and store the currency.\n- Time is an instant:\
  \ timestamptz in PostgreSQL, UTC everywhere in MySQL.\n- Do not propose changes\
  \ to tables that already hold production data without pointing out that each one\
  \ is a migration with its own risks.\n\x1FFILE:references/design-rules.md\x1E\n\
  # Design rules and finding codes\n\n| Code | Sev | What goes wrong | Acceptable\
  \ when | Fix |\n|---|---|---|---|---|\n| NO_PRIMARY_KEY | HIGH | duplicate rows\
  \ cannot be told apart or deleted one at a time; logical replication and CDC need\
  \ a key; ORMs misbehave | never for OLTP tables (staging tables loaded and dropped\
  \ in one job, maybe) | surrogate `id bigint GENERATED ALWAYS AS IDENTITY PRIMARY\
  \ KEY` or a composite natural key (order_id, product_id) |\n| FLOAT_MONEY | HIGH\
  \ | 0.1 + 0.2 = 0.30000000000000004; sums and refunds drift by cents, reports do\
  \ not tie out | never for money; floats are fine for measurements | `numeric(12,2)`\
  \ / `DECIMAL(12,2)` or `bigint` minor units (`amount_cents`) plus a currency column\
  \ |\n| FK_TYPE_MISMATCH | HIGH | integer column referencing a bigint key: joins\
  \ cast, and inserts fail once ids pass 2,147,483,647 | never | same type on both\
  \ sides |\n| MYISAM_ENGINE | HIGH | no transactions, no foreign keys, table locks,\
  \ corruption on crash | read-only archives, rarely | `ENGINE=InnoDB` |\n| INT32_PRIMARY_KEY\
  \ | MEDIUM | id exhaustion at about 2.1 billion (sequences also skip on rollbacks);\
  \ the fix is a full table rewrite on the biggest table | small lookup tables (statuses,\
  \ countries) | `bigint` identity / `BIGINT UNSIGNED AUTO_INCREMENT` |\n| TIMESTAMP_WITHOUT_TZ\
  \ | MEDIUM | the stored value means different instants depending on the writer's\
  \ zone; DST and server moves corrupt ordering | local wall-clock values that are\
  \ not instants (store opening hours, a birthday time) | `timestamptz` |\n| MONEY_TYPE\
  \ | MEDIUM | Postgres `money` follows lc_monetary, one currency, rounding on division\
  \ | never in new schemas | `numeric(12,2)` + currency |\n| NULLABLE_AUDIT_COLUMN\
  \ | MEDIUM | rows without created_at break \"last 7 days\" reports and backfills\
  \ | never | `NOT NULL DEFAULT now()` |\n| FK_WITHOUT_INDEX | MEDIUM | (PostgreSQL)\
  \ deleting or updating a parent scans the whole child table under lock; joins from\
  \ parent to children are slow. MySQL InnoDB creates the index itself | tiny child\
  \ tables, parents never deleted | index whose leading columns are the FK columns\
  \ |\n| RESERVED_WORD_NAME | MEDIUM | `order`, `user`, `group` must be quoted in\
  \ every query, ORM, BI tool and ad-hoc psql session | never in new schemas | plural\
  \ or qualified names: orders, app_users, user_groups, sort_order |\n| MYSQL_UTF8MB3\
  \ | MEDIUM | `utf8` is 3-byte: emoji and some CJK characters fail or are cut | never\
  \ in new schemas | `utf8mb4` + `utf8mb4_0900_ai_ci` |\n| NULLABLE_BOOLEAN | LOW\
  \ | three-valued logic: `WHERE NOT is_verified` skips NULL rows | when \"unknown\"\
  \ is a real state (then prefer an explicit status) | `NOT NULL DEFAULT false` |\n\
  | UNCHECKED_STATUS | LOW | 'Shipped', 'shipped ', 'shiped' all appear; reports split\
  \ | statuses owned by another system you only mirror | `CHECK (status IN (...))`,\
  \ an enum type or a lookup table FK |\n| MISSING_FOREIGN_KEY | LOW | orphans after\
  \ deletes, typos in ids, no documented relation | cross-database or event-sourced\
  \ references; document them | `REFERENCES parent(id)` + index |\n| CASE_SENSITIVE_UNIQUE_EMAIL\
  \ | LOW | Ana@x.com and ana@x.com are two accounts; password resets go to the wrong\
  \ one | never for login emails | `citext` or `UNIQUE INDEX ON t (lower(email))`\
  \ and normalize on write |\n| VARCHAR_255_HABIT | LOW | in Postgres, 255 is an arbitrary\
  \ MySQL-era limit; real rules are missing and odd values get rejected | when 255\
  \ really is the rule | `text` + `CHECK (char_length(x) <= n)` for real limits |\n\
  | REDUNDANT_INDEX | LOW | an index that is a prefix of another (or of the PK) costs\
  \ writes and memory for nothing | the shorter index is much smaller and very hot\
  \ | drop it |\n| JSON_IN_TEXT | LOW | no validation, no operators, no GIN index\
  \ | the text is not really JSON | `jsonb` / `JSON` |\n| NO_CREATED_AT | LOW | debugging,\
  \ audits and backfills need to know when rows appeared | pure join tables | `created_at\
  \ timestamptz NOT NULL DEFAULT now()` |\n| MIXED_CASE_NAME | LOW | quoted \"OrderItems\"\
  \ must be quoted forever in Postgres | never | snake_case |\n| DATETIME_NO_ZONE\
  \ | LOW | (MySQL) DATETIME has no zone; mixed writers store mixed zones | when every\
  \ connection sets time_zone='+00:00' | enforce UTC |\n\n## Things the linter cannot\
  \ judge (review by hand)\n- **Keys**: is there a natural unique key besides the\
  \ surrogate id? Missing `UNIQUE (provider, provider_id)` is how payments get recorded\
  \ twice.\n- **ON DELETE**: RESTRICT/NO ACTION by default; CASCADE only for true\
  \ child rows (order_items of an order), never from customers to payments.\n- **CHECK\
  \ constraints for invariants**: `quantity > 0`, `ends_at > starts_at`, `discount\
  \ <= total`.\n- **Multi-tenancy**: tenant_id on every tenant table, first in unique\
  \ keys and indexes, and in every FK (composite FKs prevent cross-tenant references).\n\
  - **Soft deletes**: partial unique indexes `WHERE deleted_at IS NULL`, or the email\
  \ can never be reused.\n- **Denormalized totals**: if orders.total is stored, say\
  \ how it stays equal to the sum of order_items.\n- **PII**: list columns with personal\
  \ data; consider a separate table with stricter access and retention.\n\x1FFILE:references/type-choices.md\x1E\
  \n# Type choices (PostgreSQL / MySQL 8)\n\n| Data | PostgreSQL | MySQL 8 | Avoid\
  \ |\n|---|---|---|---|\n| Surrogate id | `bigint GENERATED ALWAYS AS IDENTITY` |\
  \ `BIGINT UNSIGNED AUTO_INCREMENT` | `serial`/`int` on growing tables |\n| Public\
  \ / distributed id | `uuid` (UUIDv7 for index locality, `gen_random_uuid()` for\
  \ v4) | `BINARY(16)` with UUID_TO_BIN(x, 1) | `varchar(36)` UUIDs (3x bigger, slower)\
  \ |\n| Money | `numeric(12,2)` (or (19,4) for rates) + `currency char(3)` | `DECIMAL(12,2)`\
  \ + `CHAR(3)` | `float`, `double`, `real`, Postgres `money` |\n| Money as integer\
  \ | `bigint amount_cents` (mind currencies with 0 or 3 decimals) | `BIGINT` | `int`\
  \ cents (overflows at 21 million) |\n| Instant (event happened) | `timestamptz`\
  \ | `DATETIME(6)` in UTC, or `TIMESTAMP` (2038 limit, converted by session zone)\
  \ | `timestamp` without time zone |\n| Calendar date | `date` | `DATE` | timestamps\
  \ at midnight |\n| Wall-clock time / schedule | `time` + an IANA zone column | `TIME`\
  \ + zone column | `timetz` |\n| Duration | `interval` or integer seconds | `INT`\
  \ seconds | text like \"1h30\" |\n| Text | `text` (+ CHECK for real limits) | `VARCHAR(n)`\
  \ with a real n; `TEXT` for long bodies | `varchar(255)` by habit; `char(n)` padding\
  \ |\n| Case-insensitive text (email, username) | `citext` or a `lower()` unique\
  \ index | case-insensitive `_ci` collation (default) | plain unique on text in Postgres\
  \ |\n| Flag | `boolean NOT NULL DEFAULT false` | `BOOLEAN` (TINYINT(1)) `NOT NULL\
  \ DEFAULT 0` | nullable booleans, 'Y'/'N' strings |\n| Status | `text` + `CHECK\
  \ (... IN (...))`, enum type, or lookup table | `ENUM(...)` or lookup table | unconstrained\
  \ text |\n| JSON | `jsonb` (GIN index for containment) | `JSON` (generated columns\
  \ to index) | JSON in text |\n| IP address | `inet` / `cidr` | `VARBINARY(16)` with\
  \ INET6_ATON | text |\n| Large binary | object storage + key in a `text` column\
  \ | same | big BLOBs in hot tables |\n\n## Notes\n- Changing a column type later\
  \ rewrites the table in both engines (with a few exceptions such as widening varchar\
  \ in Postgres). Get ids and money right first.\n- Enum types in Postgres: adding\
  \ a value is cheap, removing or renaming one is not. Lookup tables are easier to\
  \ evolve and can carry labels and sort order.\n- `NOT NULL` with a sensible default\
  \ is the norm; nullable should mean \"genuinely unknown or not applicable\".\n-\
  \ Store the currency next to every amount, even if today there is only one.\n- Name\
  \ things the same everywhere: `customer_id` in every table that references customers,\
  \ `_at` for instants, `_on` or `_date` for dates, `is_`/`has_` for booleans.\n\x1F\
  FILE:templates/schema-review.md\x1E\n# Schema review: <project / schema file>, <date>\n\
  \n**Engine:** <PostgreSQL 16>   **Scope:** <5 tables: customers, products, orders,\
  \ order_items, payments>\n**Context:** <OLTP shop backend, ~2M orders/year, Prisma\
  \ ORM, no data yet>\n**Command:** `python3 scripts/schema_lint.py <shop-schema.sql>`\n\
  **Verdict:** <CHANGES NEEDED before the first release: 4 HIGH, 8 MEDIUM, 8 LOW>\n\
  \n## Must fix (HIGH)\n| # | Table.column | Finding | What goes wrong | Fix |\n|---|---|---|---|---|\n\
  | 1 | <products.price> | <FLOAT_MONEY> | <0.1 + 0.2 != 0.3; order totals drift by\
  \ cents> | <numeric(12,2) NOT NULL CHECK (price >= 0)> |\n\n## Should fix (MEDIUM)\n\
  | # | Table.column | Finding | What goes wrong | Fix |\n|---|---|---|---|---|\n\
  | 1 | <\"order\"> | <RESERVED_WORD_NAME> | <must be quoted in every query and BI\
  \ tool> | <rename to orders> |\n\n## Consider (LOW / judgement calls)\n- <customers.email:\
  \ citext so Ana@x.com and ana@x.com are one account>\n\n## Found by reading (not\
  \ by the linter)\n- <payments: add UNIQUE (provider, provider_id) so a webhook retry\
  \ cannot record a payment twice>\n- <ON DELETE: keep RESTRICT on payments -> orders;\
  \ CASCADE only order_items -> orders>\n\n## Corrected DDL\n```sql\n<full corrected\
  \ schema, lints clean>\n```\n\n## Decisions for the team\n- <bigint identity vs\
  \ UUIDv7 for public ids>\n- <store orders.total or compute it from order_items?>\n\
  \n## If tables already hold data\n- <each change above is a migration; list them\
  \ and run a migration safety review before deploying>\n\x1FFILE:examples/shop-schema.sql\x1E\
  \n-- Small online shop schema (PostgreSQL), first draft for review.\n-- The problems\
  \ are deliberate: this is what the skill is meant to catch.\n\nCREATE TABLE customers\
  \ (\n    id          serial PRIMARY KEY,\n    email       varchar(255) NOT NULL\
  \ UNIQUE,\n    full_name   varchar(255),\n    phone       varchar(255),\n    is_verified\
  \ boolean,\n    created_at  timestamp\n);\n\nCREATE TABLE products (\n    id   \
  \      serial PRIMARY KEY,\n    sku        varchar(64) NOT NULL UNIQUE,\n    title\
  \      text NOT NULL,\n    price      double precision NOT NULL,\n    attributes\
  \ text,\n    created_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE \"\
  order\" (\n    id          bigserial PRIMARY KEY,\n    customer_id integer NOT NULL\
  \ REFERENCES customers (id),\n    status      varchar(20) NOT NULL DEFAULT 'pending',\n\
  \    total       numeric(12,2) NOT NULL,\n    placed_at   timestamp NOT NULL DEFAULT\
  \ now(),\n    created_at  timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE\
  \ order_items (\n    order_id   bigint NOT NULL REFERENCES \"order\" (id),\n   \
  \ product_id bigint NOT NULL,\n    quantity   integer NOT NULL,\n    unit_price\
  \ numeric(12,2) NOT NULL\n);\n\nCREATE TABLE payments (\n    id          bigint\
  \ GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    order_id    integer NOT NULL REFERENCES\
  \ \"order\" (id),\n    amount      real NOT NULL,\n    provider    text NOT NULL,\n\
  \    provider_id text,\n    created_at  timestamptz NOT NULL DEFAULT now()\n);\n\
  \nCREATE INDEX payments_order_idx ON payments (order_id);\nCREATE INDEX payments_order_created_idx\
  \ ON payments (order_id, created_at);\n\x1FFILE:examples/shop-schema-fixed.sql\x1E\
  \n-- Small online shop schema (PostgreSQL), after review.\n-- Every change is explained\
  \ in templates/schema-review.md style in the review.\n\nCREATE EXTENSION IF NOT\
  \ EXISTS citext;\n\nCREATE TABLE customers (\n    id          bigint GENERATED ALWAYS\
  \ AS IDENTITY PRIMARY KEY,\n    email       citext NOT NULL UNIQUE,\n    full_name\
  \   text,\n    phone       text CHECK (char_length(phone) <= 32),\n    is_verified\
  \ boolean NOT NULL DEFAULT false,\n    created_at  timestamptz NOT NULL DEFAULT\
  \ now()\n);\n\nCREATE TABLE products (\n    id         bigint GENERATED ALWAYS AS\
  \ IDENTITY PRIMARY KEY,\n    sku        text NOT NULL UNIQUE,\n    title      text\
  \ NOT NULL,\n    price      numeric(12,2) NOT NULL CHECK (price >= 0),\n    attributes\
  \ jsonb NOT NULL DEFAULT '{}',\n    created_at timestamptz NOT NULL DEFAULT now()\n\
  );\n\nCREATE TABLE orders (\n    id          bigint GENERATED ALWAYS AS IDENTITY\
  \ PRIMARY KEY,\n    customer_id bigint NOT NULL REFERENCES customers (id),\n   \
  \ status      text NOT NULL DEFAULT 'pending'\n                CHECK (status IN\
  \ ('pending', 'paid', 'shipped', 'cancelled', 'refunded')),\n    total       numeric(12,2)\
  \ NOT NULL CHECK (total >= 0),\n    placed_at   timestamptz NOT NULL DEFAULT now(),\n\
  \    created_at  timestamptz NOT NULL DEFAULT now()\n);\nCREATE INDEX orders_customer_idx\
  \ ON orders (customer_id);\n\nCREATE TABLE order_items (\n    order_id   bigint\
  \ NOT NULL REFERENCES orders (id),\n    product_id bigint NOT NULL REFERENCES products\
  \ (id),\n    quantity   integer NOT NULL CHECK (quantity > 0),\n    unit_price numeric(12,2)\
  \ NOT NULL CHECK (unit_price >= 0),\n    created_at timestamptz NOT NULL DEFAULT\
  \ now(),\n    PRIMARY KEY (order_id, product_id)\n);\nCREATE INDEX order_items_product_idx\
  \ ON order_items (product_id);\n\nCREATE TABLE payments (\n    id          bigint\
  \ GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n    order_id    bigint NOT NULL REFERENCES\
  \ orders (id),\n    amount      numeric(12,2) NOT NULL,\n    provider    text NOT\
  \ NULL,\n    provider_id text,\n    created_at  timestamptz NOT NULL DEFAULT now(),\n\
  \    UNIQUE (provider, provider_id)\n);\nCREATE INDEX payments_order_created_idx\
  \ ON payments (order_id, created_at);\n\x1FFILE:scripts/schema_lint.py\x1E\n#!/usr/bin/env\
  \ python3\n\"\"\"SQL schema design linter for PostgreSQL and MySQL DDL (Python 3\
  \ standard library only).\n\nReads CREATE TABLE / CREATE INDEX / ALTER TABLE ...\
  \ ADD statements (a schema dump,\nschema.sql, or the DDL of new tables in a pull\
  \ request) and reports design problems\nthat are cheap to fix before data exists\
  \ and expensive after: tables without a\nprimary key, money stored in floating point,\
  \ foreign keys whose type differs from the\nreferenced key or that have no supporting\
  \ index (PostgreSQL), *_id columns without a\nforeign key, 32-bit primary keys,\
  \ timestamps without time zone, nullable audit\ncolumns and booleans, unchecked\
  \ status columns, reserved-word and mixed-case names,\ncase-sensitive unique emails,\
  \ redundant indexes, JSON kept in text columns, and MySQL\ntables using MyISAM or\
  \ 3-byte utf8.\n\nIt does not connect to a database and does not judge migration\
  \ safety (locks,\nbackfills); it reviews the shape of the schema itself.\n\nUsage:\n\
  \  python3 schema_lint.py FILE.sql [FILE.sql ...] [--dialect auto|postgres|mysql]\n\
  \        [--min-severity LOW|MEDIUM|HIGH] [--ignore CODE,CODE] [--json]\n  python3\
  \ schema_lint.py --self-test\nExit codes: 0 = no HIGH findings, 1 = HIGH findings,\
  \ 2 = bad input (unreadable file,\nno CREATE TABLE found).\n\"\"\"\nimport argparse,\
  \ json, re, sys\n\nSEV_ORDER = {\"HIGH\": 0, \"MEDIUM\": 1, \"LOW\": 2}\nMONEY_RE\
  \ = re.compile(r\"(^|_)(price|amount|total|subtotal|cost|balance|fee|fees|tax|salary|refund|discount|paid|payment|revenue|credit|debit|charge)(_|$)\"\
  , re.I)\nRESERVED = {\"user\", \"order\", \"group\", \"select\", \"table\", \"column\"\
  , \"desc\", \"asc\", \"check\", \"default\", \"from\",\n            \"where\", \"\
  limit\", \"offset\", \"references\", \"primary\", \"key\", \"range\", \"rank\",\
  \ \"window\", \"all\", \"both\",\n            \"end\", \"grant\", \"to\", \"type\"\
  , \"values\", \"constraint\", \"index\", \"match\", \"condition\", \"interval\"\
  , \"read\", \"row\"}\nRESERVED_PG_ONLY_SAFE = {\"key\", \"range\", \"rank\", \"\
  type\", \"values\", \"match\", \"condition\", \"interval\", \"read\", \"row\", \"\
  index\"}  # fine unquoted in Postgres\nRESERVED_MY_ONLY_SAFE = {\"offset\", \"user\"\
  , \"end\", \"type\", \"values\", \"row\"}  # fine unquoted in MySQL 8\nSTATUS_RE\
  \ = re.compile(r\"^(status|state|kind|role|type|.*_status|.*_state|.*_type)$\",\
  \ re.I)\nJSONISH_RE = re.compile(r\"(^|_)(json|payload|metadata|meta|attributes|settings|extra|data)$\"\
  , re.I)\nINT32 = {\"int\", \"integer\", \"int4\", \"serial\", \"serial4\", \"mediumint\"\
  , \"smallint\", \"int2\", \"smallserial\", \"tinyint\"}\nINT64 = {\"bigint\", \"\
  int8\", \"bigserial\", \"serial8\"}\n\n\ndef finding(sev, code, table, column, problem,\
  \ fix, line=0):\n    return {\"severity\": sev, \"code\": code, \"table\": table,\
  \ \"column\": column, \"line\": line, \"problem\": problem, \"fix\": fix}\n\n\n\
  def strip_comments(sql):\n    out, i, n = [], 0, len(sql)\n    while i < n:\n  \
  \      c = sql[i]\n        if c in \"'\\\"`\":\n            j = i + 1\n        \
  \    while j < n and sql[j] != c:\n                j += 2 if sql[j] == \"\\\\\"\
  \ and c == \"'\" else 1\n            out.append(sql[i:j + 1]); i = j + 1\n     \
  \   elif sql.startswith(\"--\", i) or c == \"#\" and (i == 0 or sql[i - 1] in \"\
  \\n \\t\"):\n            j = sql.find(\"\\n\", i); j = n if j < 0 else j\n     \
  \       out.append(\" \" * (j - i)); i = j\n        elif sql.startswith(\"/*\",\
  \ i):\n            j = sql.find(\"*/\", i + 2); j = n if j < 0 else j + 2\n    \
  \        out.append(re.sub(r\"[^\\n]\", \" \", sql[i:j])); i = j\n        else:\n\
  \            out.append(c); i += 1\n    return \"\".join(out)\n\n\ndef split_top(s,\
  \ sep=\",\"):\n    parts, depth, cur, q = [], 0, [], None\n    for ch in s:\n  \
  \      if q:\n            cur.append(ch)\n            if ch == q:\n            \
  \    q = None\n            continue\n        if ch in \"'\\\"`\":\n            q\
