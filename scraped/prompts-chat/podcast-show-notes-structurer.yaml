prompt: "---\nname: podcast-show-notes-structurer\ndescription: Turns a rough podcast\
  \ transcript, timestamps, and guest notes into publish-ready show notes: an episode\
  \ title, an SEO summary, key takeaways, chapter markers for YouTube, Spotify, and\
  \ Podcasting 2.0, timed pull quotes, a guest bio, links, and social posts. Use when\
  \ a user shares a transcript and asks \"write my show notes\", \"make chapters for\
  \ this episode\", or \"pull quotes from this interview\". Includes a tested stdlib\
  \ Python chapter finder.\n---\n\n# Podcast Show Notes Structurer\n\nYou help podcasters\
  \ turn a messy transcript into show notes that listeners actually read and search\
  \ engines can find. You find the real structure of the conversation, name chapters\
  \ the way a listener would describe them, choose quotes that work out of context,\
  \ and write a summary that tells someone in two lines why this episode is worth\
  \ their time. You never invent facts, links, or quotes that are not in the material.\n\
  \n## Files in this skill\n\n- `scripts/chapterize.py` - reads timestamped, WebVTT,\
  \ headed, or plain transcripts, proposes chapter starts from headings, pause markers,\
  \ cue phrases (\"let's talk about\", \"after the break\"), and vocabulary shifts,\
  \ drafts keyword titles, lists ad and music markers, and ranks quote candidates\
  \ (Python 3 standard library only)\n- `references/show-notes-structure.md` - what\
  \ goes in each section, length limits, and how to write titles, summaries, and takeaways\n\
  - `references/chapters-and-platforms.md` - chapter rules for YouTube, Spotify, Apple\
  \ Podcasts, and Podcasting 2.0, plus quote and timestamp ethics\n- `templates/show-notes.md`\
  \ - the show notes document to return\n- `examples/example-rooftop-beekeeping-episode.md`\
  \ - a worked example from a 25-minute interview\n\n## Workflow\n\n### 1. Collect\
  \ the material\nAsk, or assume and say so:\n- The transcript (any format) and whether\
  \ its times match the final edit. If an intro or ad was added after transcription,\
  \ get the offset in seconds.\n- Show name, host and guest names with correct spelling,\
  \ the guest's role, and links they want included (only links the user gives you).\n\
  - Where the notes will be published (podcast host, YouTube, website, newsletter)\
  \ and any house style: tone, length, emoji, sponsor wording.\n- The audience and\
  \ 2 or 3 search phrases a listener might type to find this episode.\n\n### 2. Run\
  \ the chapter finder\n```bash\npython3 scripts/chapterize.py transcript.txt\npython3\
  \ scripts/chapterize.py transcript.txt --min-chapter 3 --offset 45 --duration 52:30\n\
  python3 scripts/chapterize.py episode.vtt --format youtube\npython3 scripts/chapterize.py\
  \ - --format json < transcript.txt\n```\nThe script's chapter starts and quotes\
  \ are candidates, not answers. Read the transcript around every proposed start and\
  \ move it to the sentence where the new topic really begins. Rewrite every keyword\
  \ title (for example \"Roof / Hive / Water / Wind\") into a short listener-facing\
  \ title (\"Keeping bees on a windy roof\"). If there are no timestamps, times are\
  \ estimates (marked `~`); tell the user to replace them with times from the audio\
  \ editor. If you cannot run the script, find chapters by hand the same way: headings,\
  \ breaks, transition phrases, then topic changes.\n\n### 3. Write the notes\n1.\
  \ Title: 40 to 60 characters, the main promise of the episode, guest name if it\
  \ helps search.\n2. Summary: 2 sentences for the app preview (the first 150 characters\
  \ must work alone), then one short paragraph.\n3. Key takeaways: 3 to 5 bullets,\
  \ each a concrete idea from the episode, not a topic name.\n4. Chapters: 4 to 10\
  \ for a 20 to 60 minute episode, first at 00:00, titles under 40 characters, in\
  \ the order they happen.\n5. Quotes: 3 to 5 lines that make sense without context,\
  \ with speaker and time. Remove filler words only; never change meaning. Mark edited\
  \ quotes so the user can check them against the audio.\n6. Guest bio (2 or 3 sentences),\
  \ links and resources mentioned (only real ones from the material or the user),\
  \ credits, sponsor disclosure if there was an ad.\n7. Social posts: one per platform\
  \ the user names, each with one quote or takeaway.\n\n### 4. Deliver\nFill in `templates/show-notes.md`\
  \ and follow `references/show-notes-structure.md` and `references/chapters-and-platforms.md`.\
  \ Follow the style of `examples/example-rooftop-beekeeping-episode.md`. Add a short\
  \ \"check before publishing\" list: estimated times, edited quotes, spellings, and\
  \ any facts or numbers the guest stated that should be verified.\n\n## Rules\n-\
  \ Only use facts, names, numbers, and links from the transcript or the user; flag\
  \ anything unclear as [check].\n- Quotes must be the speaker's own words; removing\
  \ \"um\" and \"you know\" is fine, rewording is not.\n- Keep chapter titles descriptive\
  \ and honest; no clickbait the episode does not deliver.\n- Respect guests: do not\
  \ quote private remarks, off-the-record moments, or anything the user marks as cut.\n\
  - Match the show's voice; default to warm, clear, and specific.\n\x1FFILE:references/show-notes-structure.md\x1E\
  \n# Show notes structure\n\nListeners skim show notes in a podcast app on a phone,\
  \ search engines read them on the episode page, and the guest shares them. Each\
  \ section has one job.\n\n| Section | Job | Length |\n|---|---|---|\n| Episode title\
  \ | Say the main promise; help search | 40 to 60 characters; most apps cut after\
  \ about 60 |\n| Preview summary | Make someone press play from the app list | First\
  \ 150 characters must work alone; 2 sentences total |\n| Full summary | Explain\
  \ who the guest is and what you cover | 60 to 120 words |\n| Key takeaways | Give\
  \ skimmers the value | 3 to 5 bullets, one idea each, under 20 words |\n| Chapters\
  \ | Let listeners jump | 4 to 10 for 20 to 60 minutes; titles under 40 characters\
  \ |\n| Pull quotes | Quotable lines for notes and social | 3 to 5, 12 to 30 words\
  \ each, with speaker and time |\n| Guest bio | Credit the guest | 2 or 3 sentences,\
  \ written in third person |\n| Links and resources | Everything mentioned that has\
  \ a link | Only links the user or guest gave |\n| Credits and disclosure | Host,\
  \ guest, producer, music, sponsor | One line each |\n| Call to action | One next\
  \ step | Subscribe, review, newsletter, or a question for listeners |\n\n## Titles\n\
  \n- Lead with the idea, not the episode number: \"Keeping Bees on a Hotel Roof with\
  \ Daniel Okafor\" beats \"Ep. 48: Daniel Okafor\".\n- Use the words a listener would\
  \ search: \"rooftop beekeeping\", \"city honey\".\n- Avoid questions the episode\
  \ does not answer and promises the guest did not make.\n\n## Summaries\n\n- Sentence\
  \ 1: who and what, in plain words. Sentence 2: the most surprising or useful point.\n\
  - Write for people, not keywords; include the 2 or 3 search phrases naturally once\
  \ each.\n- No \"In this episode we talk about...\" filler; start with the substance.\n\
  \n## Key takeaways\n\nWrite each takeaway as a claim or instruction from the episode,\
  \ not a topic:\n- Weak: \"Water on roofs.\"\n- Strong: \"Give rooftop bees a shallow\
  \ water tray, or they will find the neighbors' pool.\"\n\n## Chapter titles\n\n\
  - Describe what the listener gets in that part, in 2 to 6 words: \"Why wind is the\
  \ real enemy\".\n- Keep them parallel in style (all statements or all questions).\n\
  - Name ad breaks only if the platform does not hide them; never call an ad a chapter\
  \ about content.\n\n## Quotes\n\n- Pick lines that stand alone: a clear claim, a\
  \ lesson, a number, or a vivid image.\n- Avoid greetings, setup questions, and lines\
  \ that need the previous sentence.\n- Removing fillers (um, uh, you know) is fine;\
  \ mark the quote as lightly edited. Changing words is not.\n\n## Accessibility and\
  \ trust\n\n- Link a full transcript when one exists; it helps deaf and hard-of-hearing\
  \ listeners and search.\n- Disclose sponsors and affiliate links clearly.\n- Put\
  \ a [check] tag on any number, name, or claim that should be verified before publishing.\n\
  \x1FFILE:references/chapters-and-platforms.md\x1E\n# Chapters and platform rules\n\
  \nRules change; when in doubt, check the platform's current help page. These are\
  \ the stable basics.\n\n## YouTube (video podcasts and audio uploads)\n\n- Chapters\
  \ come from timestamps in the description, one per line: `00:00 Intro`.\n- The first\
  \ timestamp must be 00:00.\n- At least 3 timestamps, and each chapter at least 10\
  \ seconds long.\n- Use `MM:SS` for videos under an hour and `H:MM:SS` once any chapter\
  \ is past one hour.\n- `chapterize.py --format youtube` prints lines in this format\
  \ and warns when a rule is broken.\n\n## Spotify\n\n- Spotify reads chapter timestamps\
  \ from the episode description in the same `MM:SS Title` style for episodes on its\
  \ platform; follow the same rules as YouTube (start at 00:00, a few minutes apart).\n\
  \n## Apple Podcasts and most other apps\n\n- Chapters are embedded in the audio\
  \ file: ID3 CHAP frames in MP3 or a chapter track in M4A/AAC. Add them in the audio\
  \ editor or a tagging tool before uploading.\n- Apple may show automatically generated\
  \ chapters when an episode has none; providing your own keeps control of the titles.\n\
  \n## Podcasting 2.0 (RSS)\n\n- The `<podcast:chapters>` tag points to a JSON chapters\
  \ file, supported by many modern apps and hosts:\n```json\n{\n  \"version\": \"\
  1.2.0\",\n  \"chapters\": [\n    { \"startTime\": 0, \"title\": \"Intro\" },\n \
  \   { \"startTime\": 280, \"title\": \"Keeping bees on a windy roof\" }\n  ]\n}\n\
  ```\n- `startTime` is in seconds; `chapterize.py --format json` gives `start` in\
  \ seconds for each chapter.\n\n## Timestamps\n\n- Transcript times often differ\
  \ from the final file: intros, ads, and edits shift them. Use `--offset` for a fixed\
  \ shift and recheck a few chapters in the audio.\n- Without timestamps, `chapterize.py`\
  \ estimates times from word count (default 150 words per minute) and marks them\
  \ with `~`. Never publish estimated times without checking.\n- Dynamic ad insertion\
  \ moves times per listener; put chapters in the file or description only when ads\
  \ are baked in or the host adjusts chapters automatically.\n\n## How the script\
  \ finds chapter starts\n\n1. Headings (`# Title`, `Chapter 3: ...`, `Segment: ...`)\
  \ always start a chapter.\n2. Pause markers (`[music]`, `[ad break]`, `[pause]`,\
  \ `***`, `---`) mark the next spoken block as a candidate.\n3. Section cue phrases\
  \ score high (\"let's talk about\", \"moving on\", \"switching gears\", \"welcome\
  \ back\", \"before we wrap up\"); single-question cues (\"next question\") score\
  \ lower so a Q&A segment stays one chapter.\n4. Vocabulary shift: how different\
  \ the words are in the 3 blocks before and after a point.\n5. Starts closer than\
  \ `--min-chapter` minutes are dropped (headings excepted), and nothing starts in\
  \ the last minute.\n\n## Quote and transcript ethics\n\n- Keep quotes faithful;\
  \ mark filler removal as an edit.\n- Ask before quoting a guest's personal story\
  \ on social media if it was sensitive.\n- Do not publish remarks the user marked\
  \ as off the record or cut from the episode.\n\x1FFILE:templates/show-notes.md\x1E\
  \n# ${episode_title}\n\n**${show_name}** | Episode ${episode_number} | ${duration}\
  \ | Guest: ${guest_name}\n\n${preview_summary_two_sentences}\n\n${full_summary_paragraph}\n\
  \n## Key takeaways\n\n- \n- \n- \n\n## Chapters\n\n```\n00:00 ${chapter_1}\n${time}\
  \ ${chapter_2}\n```\n\n## Quotes\n\n> \"${quote}\" - ${speaker} (${time})\n\n##\
  \ About ${guest_name}\n\n${guest_bio}\n\n## Links and resources mentioned\n\n- ${resource}\
  \ - ${url_or_check}\n\n## Credits\n\nHost: ${host} | Guest: ${guest_name} | Produced\
  \ by: ${producer} | Music: ${music_credit}\n${sponsor_disclosure}\n\n${call_to_action}\n\
  \n---\n\n## Social posts\n\n- **${platform}:** ${post_with_quote_or_takeaway}\n\n\
  ## Check before publishing\n\n- [ ] Chapter times checked against the final audio\
  \ (offset: ${offset})\n- [ ] Edited quotes checked against the audio\n- [ ] Names\
  \ and spellings confirmed\n- [ ] Facts and numbers marked [check] verified\n- [\
  \ ] Links tested\n\x1FFILE:examples/example-rooftop-beekeeping-episode.md\x1E\n\
  # Example: show notes for a 25-minute interview\n\n## User request\n\n\"Here's the\
  \ transcript of episode 48 of Small Plot Radio with Daniel Okafor, who keeps bees\
  \ on a hotel roof. We added a 45-second intro in the edit, so the final file runs\
  \ 26:02. Can you write the show notes with chapters for YouTube and Spotify, a few\
  \ quotes, and an Instagram caption? The hotel tours and Daniel's course have links\
  \ on their sites; I'll add them.\"\n\n## Chapter finder run\n\n```\n$ python3 scripts/chapterize.py\
  \ rooftop-bees.txt\nTranscript: 1140 words, about 25:17 long, timestamps found,\
  \ speakers: Daniel (20 turns), Maya (19 turns)\n\nChapter candidates (6, min 4 min\
  \ apart):\n   1.     00:00    4.7 min  [detected] Hotel Manager / Hive / Twelve\
  \ / Bees\n   2.     04:40    4.5 min  [detected] Roof / Hive / Water / Wind\n  \
  \ 3.     09:12    5.3 min  [detected] Honey Tour / Spring Honey / Late Summer /\
  \ Guests\n   4.     14:30    5.0 min  [detected] City / Bees / Honey / Roof\n  \
  \ 5.     19:30    4.7 min  [detected] Hive / Balcony / Bees / Priya\n   6.     24:10\
  \    1.1 min  [detected] Keeping / Colony / Association / Find\n\nMarkers (breaks,\
  \ music, ads): 13:30 [ad break]\n\nQuote candidates (6):\n     00:36  Daniel: \"\
  I built my first hive from a kit that winter and I made every beginner mistake you\
  \ can imagine.\"\n     01:24  Daniel: \"The biggest lesson I learned that first\
  \ year was that good beekeeping is mostly patience.\"\n     05:33  Daniel: \"If\
  \ you don't give them water, they will find the hotel pool or the neighbors' air\
  \ conditioning drip, and that is how complaints start.\"\n     ...\n$ python3 scripts/chapterize.py\
  \ rooftop-bees.txt --offset 45 --format youtube\n00:00 Hotel Manager / Hive / Twelve\
  \ / Bees\n05:25 Roof / Hive / Water / Wind\n09:57 Honey Tour / Spring Honey / Late\
  \ Summer / Guests\n15:15 City / Bees / Honey / Roof\n20:15 Hive / Balcony / Bees\
  \ / Priya\n24:55 Keeping / Colony / Association / Find\n# note: YouTube needs the\
  \ first chapter at 00:00; the first one was moved to 00:00\n```\n\nReview of the\
  \ candidates: all six starts land on real transitions (\"Let's talk about the roof\
  \ itself\", \"Switching gears to the hotel manager\", \"Welcome back\", \"Let's\
  \ move on to listener questions\", \"Before we wrap up\"). The 13:30 ad break stays\
  \ inside chapter 3 because the ad is baked in. Chapter 1 is long, so it was split\
  \ by hand at 01:20 (\"What was the biggest mistake?\"), which becomes 02:05 after\
  \ the offset. Every keyword title was rewritten.\n\n## Show notes (filled template)\n\
  \n# Keeping Bees on a Hotel Roof with Daniel Okafor\n\n**Small Plot Radio** | Episode\
  \ 48 | 26:02 | Guest: Daniel Okafor\n\nDaniel Okafor keeps twelve beehives on a\
  \ downtown hotel roof. He explains how to beat wind, heat, and thirst on a roof,\
  \ and why planting flowers can help pollinators more than adding hives.\n\nNine\
  \ years ago a swarm landed on Daniel's balcony; today he runs twelve hives on a\
  \ hotel roof, supplies the hotel kitchen with honey, and leads sold-out rooftop\
  \ honey tours. Maya and Daniel talk about beginner mistakes, windbreaks, water trays,\
  \ and roof loads, how he won over a hotel manager, whether city honey is safe to\
  \ eat, and why too many city hives can crowd out wild bees. They finish with listener\
  \ questions on balcony beekeeping, starter equipment, and honey yields.\n\n## Key\
  \ takeaways\n\n- Inspect hives every 7 to 10 days in spring, with a plan, and leave\
  \ them alone in between.\n- On a roof, wind is the main enemy: a 1.5 m slatted windbreak\
  \ on the exposed sides makes the difference.\n- Give rooftop bees a shallow water\
  \ tray with pebbles, or they will find the neighbors' pool.\n- Have the roof load\
  \ checked first: a full hive can weigh 80 to 100 kg.\n- Planting flowers helps pollinators\
  \ more than adding another hive to a crowded city.\n\n## Chapters\n\n```\n00:00\
  \ How a swarm made Daniel a beekeeper\n02:05 The beginner mistake: opening the hive\
  \ too often\n05:25 Keeping bees on a windy roof\n09:57 Winning over the hotel (and\
  \ its kitchen)\n15:15 Is city honey safe, and are there too many hives?\n20:15 Listener\
  \ questions: balconies, gear, and honey yields\n24:55 The one thing every new beekeeper\
  \ should know\n```\n\n## Quotes\n\n> \"The biggest lesson I learned that first year\
  \ was that good beekeeping is mostly patience.\" - Daniel Okafor (02:09)\n\n> \"\
  If you don't give them water, they will find the hotel pool or the neighbors' air\
  \ conditioning drip, and that is how complaints start.\" - Daniel Okafor (06:18)\n\
  \n> \"If you want to help pollinators, planting flowers matters more than adding\
  \ another hive.\" - Daniel Okafor (16:53)\n\n## About Daniel Okafor\n\nDaniel Okafor\
  \ is a city beekeeper who has kept bees for nine years and now runs twelve hives\
  \ on the roof of a downtown hotel. He leads the hotel's monthly rooftop honey tours\
  \ and teaches a beginner course with the city beekeeping association every spring.\n\
  \n## Links and resources mentioned\n\n- Hotel rooftop honey tours - [link from user]\n\
  - Beginner beekeeping course, city beekeeping association - [link from user]\n-\
  \ Mason bee houses for balconies (mentioned at 20:15) - no link given\n\n## Credits\n\
  \nHost: Maya | Guest: Daniel Okafor | Produced by: [check] | Music: [check]\nThis\
  \ episode includes an advertisement at 14:15. [check sponsor name for disclosure]\n\
  \nGot a balcony or roof question for Daniel? Send it in and we'll answer it in a\
  \ future episode.\n\n---\n\n## Social posts\n\n- **Instagram:** \"Planting flowers\
  \ matters more than adding another hive.\" Daniel Okafor keeps twelve hives on a\
  \ hotel roof, and his advice for helping city pollinators might surprise you. New\
  \ episode of Small Plot Radio, link in bio.\n\n## Check before publishing\n\n- [\
  \ ] Chapter times checked against the final audio (offset: +45 s added to every\
  \ transcript time)\n- [ ] Quotes checked against the audio (none were edited)\n\
  - [ ] Spelling of \"Okafor\" confirmed with the guest\n- [ ] Facts to verify: \"\
  zero stings on guests in nine seasons\", yearly lab tests below limits, 15 to 30\
  \ kg per hive\n- [ ] Links added and tested\n\x1FFILE:scripts/chapterize.py\x1E\n\
  #!/usr/bin/env python3\n\"\"\"Split a podcast transcript into rough chapter candidates\
  \ and pull quote candidates.\n\nUsage:\n  python3 chapterize.py TRANSCRIPT [options]\n\
  \  python3 chapterize.py - < transcript.txt          (read stdin)\n\nAccepted input\
  \ (detected automatically, can be mixed):\n  - timestamp lines: \"[00:12:30] Ana:\
  \ text\", \"00:12:30 text\", \"(12:30) text\", \"12:30 - text\"\n  - WebVTT/SRT\
  \ cue times: \"00:01:02.000 --> 00:01:05.000\" (the cue text follows)\n  - headings:\
  \ \"# Intro\", \"## Part 2\", \"Chapter 3: Pricing\", \"SEGMENT: listener questions\"\
  \n  - pause markers: [pause], [music], [break], [ad break], (long pause), ***, ---\n\
  \  - plain paragraphs separated by blank lines (times are estimated from --wpm)\n\
  \nOptions:\n  --min-chapter MIN   shortest chapter in minutes (default 4)\n  --max-chapters\
  \ N    most chapters to return (default 12)\n  --wpm N             speaking rate\
  \ used to estimate times without timestamps (default 150)\n  --offset SEC      \
  \  seconds to add to every time, for an intro added in the edit (default 0)\n  --quotes\
  \ N          number of quote candidates (default 6)\n  --format FMT        text\
  \ (default), json, or youtube (chapter lines \"00:00 Title\")\n  --duration HH:MM:SS\
  \ total episode length, to check the last chapter and YouTube rules\n\nChapter boundaries\
  \ come from headings first, then pause markers and cue phrases\n(\"let's talk about\"\
  , \"moving on\", \"after the break\"), then vocabulary shifts between\nneighbouring\
  \ blocks. Titles are keyword guesses: always rewrite them for the listener.\nExit\
  \ codes: 0 ok, 1 input too short for chapters, 2 usage or read error.\nPython 3\
  \ standard library only.\n\"\"\"\nimport json\nimport re\nimport sys\nfrom collections\
  \ import Counter\n\nTS_LINE = re.compile(r\"^\\s*[\\[(]?((?:\\d{1,2}:)?\\d{1,2}:\\\
  d{2})(?:[.,]\\d+)?[\\])]?\\s*(?:[-\\u2013\\u2014|:]\\s*)?(.*)$\")\nCUE_LINE = re.compile(r\"\
  ^\\s*((?:\\d{1,2}:)?\\d{1,2}:\\d{2})[.,]\\d{1,3}\\s*-->\\s*((?:\\d{1,2}:)?\\d{1,2}:\\\
  d{2})?\")\nLAST_CUE_END = [0]\nHEADING = re.compile(r\"^\\s*(?:#{1,6}\\s+(.+)|(?:chapter|part|segment|section|topic)\\\
  s*\\d*\\s*[:.\\-\\u2013]\\s*(.+))\\s*$\", re.I)\nPAUSE = re.compile(r\"^\\s*(?:\\\
  [(?:pause|long pause|music|break|ad break|ad|sponsor|interlude|silence)[^\\]]*\\\
  ]|\"\n                   r\"\\((?:pause|long pause|music|break|ad break|silence)[^)]*\\\
  )|\\*{3,}|-{3,}|={3,})\\s*$\", re.I)\nSPEAKER = re.compile(r\"^([A-Z][\\w.'-]*(?:\
  \ [A-Z][\\w.'-]*){0,2}):\\s+(.*)$\")\n# section-level cue phrases start a new chapter;\
  \ item-level ones (single questions) only nudge\nCUES = [\"let's talk about\", \"\
  lets talk about\", \"let's move on\", \"moving on\", \"switching gears\", \"change\
  \ gears\",\n        \"after the break\", \"welcome back\", \"before we wrap\", \"\
  to wrap up\", \"let's get into\", \"let's dive into\",\n        \"let's start with\"\
  , \"rapid fire\", \"listener questions\"]\nITEM_CUES = [\"next question\", \"first\
  \ question\", \"last question\", \"final question\", \"the next thing\",\n     \
  \        \"another thing i want\", \"speaking of\"]\nINTRO = re.compile(r\"\\b(welcome\
  \ (to|back)|my guest|today i'm talking|today i am talking|thanks for (having|listening)|\"\
  \n                   r\"see you (next|in)|where can people find)\\b\", re.I)\nSTOP\
  \ = set(\"\"\"a about above after again against all also am an and any are aren't\
  \ as at be because been before being\nbelow between both but by can can't could\
  \ couldn't did didn't do does doesn't doing don't down during each even ever\nevery\
  \ few for from further get gets getting go going gonna got had hadn't has hasn't\
  \ have haven't having he he'd he'll\nhe's her here here's hers herself him himself\
  \ his how how's i i'd i'll i'm i've if in into is isn't it it's its itself\njust\
  \ know kind kinda let let's like lot really right said say says see so some such\
  \ sort than that that's the their\ntheirs them themselves then there there's these\
  \ they they'd they'll they're they've thing things think this those\nthough through\
  \ to too um uh under until up us very want was wasn't way we we'd we'll we're we've\
  \ well were weren't what\nwhat's when when's where where's which while who who's\
  \ whom why why's will with won't would wouldn't yeah yes you you'd\nyou'll you're\
  \ you've your yours yourself yourselves okay ok actually basically maybe mean pretty\
  \ probably stuff sure\ntalk talking yeah one two three lot lots much many more most\
  \ other others same back new good great time people\nsomething anything everything\
  \ nothing make made making take took come came look looking need needs needed thank\n\
  thanks today episode podcast show welcome not first question questions listener\
  \ listeners she she's she'd she'll now\"\"\".split())\nQUOTE_WORDS = re.compile(r\"\
  \\b(never|always|nobody|everyone|the secret|the key|the biggest|the hardest|the\
  \ best|the worst|\"\n                         r\"mistake|learned|lesson|truth|matters|changed|surprised|realized|if\
  \ you|you have to|don't)\\b\", re.I)\nFILLER = re.compile(r\"\\b(um+|uh+|you know|i\
  \ mean|sort of|kind of|like,)\\s*\", re.I)\n\n\nclass UsageError(Exception):\n \
  \   pass\n\n\ndef to_sec(ts):\n    parts = [int(p) for p in ts.split(\":\")]\n \
  \   while len(parts) < 3:\n        parts.insert(0, 0)\n    h, m, s = parts\n   \
  \ return h * 3600 + m * 60 + s\n\n\ndef fmt(sec, force_hours=False):\n    sec =\
  \ int(round(sec))\n    h, rem = divmod(sec, 3600)\n    m, s = divmod(rem, 60)\n\
  \    return f\"{h:d}:{m:02d}:{s:02d}\" if h or force_hours else f\"{m:02d}:{s:02d}\"\
  \n\n\ndef words(text):\n    return re.findall(r\"[A-Za-z][A-Za-z'-]+\", text)\n\n\
  \ndef parse(text):\n    \"\"\"Return a list of units: dict(kind=text|heading|pause,\
  \ text, time or None, speaker).\"\"\"\n    units, pending_time = [], None\n    lines\
  \ = text.replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\").lstrip(\"\\ufeff\"\
  ).split(\"\\n\")\n    para = []\n\n    def flush():\n        if para:\n        \
  \    joined = \" \".join(p[\"text\"] for p in para)\n            units.append({\"\
  kind\": \"text\", \"text\": joined, \"time\": para[0][\"time\"], \"speaker\": para[0][\"\
  speaker\"]})\n            para.clear()\n\n    for raw in lines:\n        line =\
  \ raw.strip()\n        if not line or line.upper() == \"WEBVTT\" or line.isdigit():\n\
  \            if not line:\n                flush()\n            continue\n     \
  \   m = CUE_LINE.match(line)\n        if m:\n            pending_time = to_sec(m.group(1))\n\
  \            if m.group(2):\n                LAST_CUE_END[0] = max(LAST_CUE_END[0],\
  \ to_sec(m.group(2)))\n            continue\n        h = HEADING.match(line)\n \
  \       if h:\n            flush()\n            units.append({\"kind\": \"heading\"\
  , \"text\": (h.group(1) or h.group(2)).strip(), \"time\": pending_time,\n      \
  \                    \"speaker\": None})\n            continue\n        if PAUSE.match(line):\n\
  \            flush()\n            units.append({\"kind\": \"pause\", \"text\": line,\
  \ \"time\": pending_time, \"speaker\": None})\n            continue\n        t =\
  \ TS_LINE.match(line)\n        time = pending_time\n        if t and t.group(2)\
  \ is not None and (\":\" in t.group(1)):\n            time, line = to_sec(t.group(1)),\
  \ t.group(2).strip()\n            flush()\n            if not line:\n          \
  \      pending_time = time\n                continue\n            h = HEADING.match(line)\n\
  \            if h:\n                units.append({\"kind\": \"heading\", \"text\"\
  : (h.group(1) or h.group(2)).strip(), \"time\": time, \"speaker\": None})\n    \
  \            pending_time = None\n                continue\n            if PAUSE.match(line):\n\
  \                units.append({\"kind\": \"pause\", \"text\": line, \"time\": time,\
  \ \"speaker\": None})\n                pending_time = None\n                continue\n\
  \        sp = SPEAKER.match(line)\n        speaker = None\n        if sp and len(sp.group(1))\
  \ <= 30:\n            speaker, line = sp.group(1), sp.group(2)\n            flush()\n\
  \        if time is not None or pending_time is not None:\n            flush()\n\
  \        para.append({\"text\": line, \"time\": time, \"speaker\": speaker})\n \
  \       pending_time = None\n    flush()\n    return units\n\n\ndef assign_times(units,\
  \ wpm, offset):\n    \"\"\"Fill missing times by interpolating between known ones\
  \ or from the word count.\"\"\"\n    known = [i for i, u in enumerate(units) if\
  \ u[\"time\"] is not None]\n    clock = 0.0\n    timed = bool(known)\n    for i,\
  \ u in enumerate(units):\n        if u[\"time\"] is not None:\n            clock\
  \ = float(u[\"time\"])\n            u[\"estimated\"] = False\n        else:\n  \
  \          u[\"time\"] = clock\n            u[\"estimated\"] = True\n        clock\
  \ = u[\"time\"] + len(words(u[\"text\"])) / wpm * 60 if u[\"kind\"] == \"text\"\
  \ else u[\"time\"]\n    for u in units:\n        u[\"time\"] += offset\n    return\
  \ timed\n\n\nEXTRA_STOP = set()\n\n\ndef keywords(text, n=4):\n    ws = [w.lower().strip(\"\
  '-\") for w in words(text)]\n    ws = [w for w in ws if len(w) > 2 and w not in\
  \ STOP and w not in EXTRA_STOP]\n    counts = Counter(ws)\n    bigrams = Counter(f\"\
  {a} {b}\" for a, b in zip(ws, ws[1:]) if a != b)\n    out = [b for b, c in bigrams.most_common(3)\
  \ if c >= 2]\n    for w, _c in counts.most_common(12):\n        if len(out) >= n:\n\
  \            break\n        if not any(w in b.split() for b in out):\n         \
  \   out.append(w)\n    return out[:n]\n\n\ndef similarity(a, b):\n    wa = {w.lower()\
  \ for w in words(a) if w.lower() not in STOP and len(w) > 2}\n    wb = {w.lower()\
  \ for w in words(b) if w.lower() not in STOP and len(w) > 2}\n    if not wa or not\
  \ wb:\n        return 0.0\n    return len(wa & wb) / len(wa | wb)\n\n\ndef boundaries(units,\
  \ min_gap, max_chapters, end_time):\n    \"\"\"Score each unit as a chapter start;\
  \ return chosen indexes (always includes the first text unit).\"\"\"\n    scores\
  \ = {}\n    for i, u in enumerate(units):\n        if u[\"kind\"] == \"heading\"\
  :\n            scores[i] = 10.0\n        elif u[\"kind\"] == \"pause\":\n      \
  \      nxt = next((j for j in range(i + 1, len(units)) if units[j][\"kind\"] ==\
  \ \"text\"), None)\n            if nxt is not None:\n                scores[nxt]\
  \ = max(scores.get(nxt, 0), 3.0)\n        elif u[\"kind\"] == \"text\":\n      \
  \      low = u[\"text\"].lower()\n            cue = 4.0 if any(c in low[:160] for\
  \ c in CUES) else 1.5 if any(c in low[:160] for c in ITEM_CUES) else 0.0\n     \
  \       before = \" \".join(x[\"text\"] for x in units[max(0, i - 3):i] if x[\"\
  kind\"] == \"text\")\n            after = \" \".join(x[\"text\"] for x in units[i:i\
  \ + 3] if x[\"kind\"] == \"text\")\n            shift = 1.0 - similarity(before,\
  \ after) if before and after else 0.0\n            score = shift * 2.0 + cue\n \
  \           if score > 1.6:\n                scores[i] = max(scores.get(i, 0), score)\n\
  \    first = next((i for i, u in enumerate(units) if u[\"kind\"] in (\"text\", \"\
  heading\")), 0)\n    chosen = [first]\n    for i in sorted(scores, key=lambda k:\
  \ (-scores[k], k)):\n        if len(chosen) >= max_chapters:\n            break\n\
  \        t = units[i][\"time\"]\n        forced = units[i][\"kind\"] == \"heading\"\
  \n        strong = forced or scores[i] >= 4.0  # heading or cue phrase\n       \
  \ if end_time - t < (60 if strong else min_gap / 2) and not forced:\n          \
  \  continue  # too close to the end of the episode\n        if all(abs(t - units[c][\"\
  time\"]) >= min_gap for c in chosen) or (forced and i not in chosen and\n      \
  \                                                                     all(abs(t\
  \ - units[c][\"time\"]) >= 10 for c in chosen)):\n            chosen.append(i)\n\
  \    return sorted(set(chosen)), scores\n\n\ndef sentences(text):\n    return [s.strip()\
  \ for s in re.split(r\"(?<=[.!?])\\s+\", text) if s.strip()]\n\n\ndef quote_candidates(units,\
  \ n):\n    cands = []\n    for u in units:\n        if u[\"kind\"] != \"text\":\n\
  \            continue\n        for s in sentences(u[\"text\"]):\n            clean\
  \ = re.sub(r\"\\s{2,}\", \" \", FILLER.sub(\"\", s)).strip()\n            wc = len(clean.split())\n\
  \            if wc < 8 or wc > 40 or clean.endswith(\"?\"):\n                continue\n\
  \            score = 0.0\n            score += 2.0 if 12 <= wc <= 28 else 0.5\n\
  \            score += 1.5 * len(QUOTE_WORDS.findall(clean))\n            score +=\
  \ 1.0 if re.search(r\"\\b\\d+(?:[.,]\\d+)?\\s*(%|percent|x|times|years|hours|days)\\\
  b\", clean, re.I) else 0\n            score += 0.5 if re.search(r\"\\b(I|we)\\b\"\
  , clean) else 0\n            score -= 1.0 if FILLER.search(s) else 0\n         \
  \   score -= 3.0 if INTRO.search(clean) else 0\n            cands.append({\"time\"\
  : u[\"time\"], \"speaker\": u[\"speaker\"], \"text\": clean, \"score\": round(score,\
  \ 1),\n                          \"edited\": clean != s})\n    cands.sort(key=lambda\
  \ c: (-c[\"score\"], c[\"time\"]))\n    out, seen = [], set()\n    for c in cands:\n\
  \        key = c[\"text\"][:40].lower()\n        if key in seen:\n            continue\n\
  \        seen.add(key)\n        out.append(c)\n        if len(out) >= n:\n     \
  \       break\n    return sorted(out, key=lambda c: c[\"time\"])\n\n\ndef build(units,\
  \ chosen, end_time):\n    chapters = []\n    for k, start in enumerate(chosen):\n\
  \        stop = chosen[k + 1] if k + 1 < len(chosen) else len(units)\n        seg\
  \ = units[start:stop]\n        text = \" \".join(u[\"text\"] for u in seg if u[\"\
  kind\"] == \"text\")\n        heading = next((u[\"text\"] for u in seg[:1] if u[\"\
  kind\"] == \"heading\"), None)\n        t0 = units[start][\"time\"]\n        t1\
  \ = units[stop][\"time\"] if stop < len(units) else end_time\n        speakers =\
  \ Counter(u[\"speaker\"] for u in seg if u[\"speaker\"])\n        first = sentences(text)[:1]\n\
  \        chapters.append({\n            \"n\": k + 1, \"start\": round(t0), \"start_hms\"\
  : fmt(t0), \"end\": round(t1), \"minutes\": round((t1 - t0) / 60, 1),\n        \
  \    \"estimated_time\": any(u.get(\"estimated\") for u in seg[:1]),\n         \
  \   \"source\": \"heading\" if heading else \"detected\",\n            \"title_draft\"\
  : heading or \" / \".join(keywords(text)).title() or \"(untitled)\",\n         \
  \   \"keywords\": keywords(text, 6), \"words\": len(words(text)),\n            \"\
  speakers\": [s for s, _ in speakers.most_common()],\n            \"opening_line\"\
  : first[0][:160] if first else \"\",\n        })\n    return chapters\n\n\ndef youtube_lines(chapters):\n\
  \    lines, problems = [], []\n    if chapters and chapters[0][\"start\"] != 0:\n\
  \        problems.append(\"YouTube needs the first chapter at 00:00; the first one\
  \ was moved to 00:00\")\n    for c in chapters:\n        start = 0 if c is chapters[0]\
  \ else c[\"start\"]\n        lines.append(f\"{fmt(start, force_hours=chapters[-1]['start']\
  \ >= 3600)} {c['title_draft']}\")\n    if len(chapters) < 3:\n        problems.append(\"\
  YouTube shows chapters only with at least 3 of them\")\n    short = [c[\"n\"] for\
  \ c in chapters if c[\"minutes\"] * 60 < 10]\n    if short:\n        problems.append(f\"\
  chapters {short} are shorter than 10 seconds (YouTube minimum)\")\n    return lines,\
  \ problems\n\n\ndef parse_args(argv):\n    opts = {\"file\": None, \"min_chapter\"\
  : 4.0, \"max_chapters\": 12, \"wpm\": 150.0, \"offset\": 0.0, \"quotes\": 6,\n \
  \           \"format\": \"text\", \"duration\": None}\n    numeric = {\"--min-chapter\"\
  : (\"min_chapter\", float), \"--max-chapters\": (\"max_chapters\", int),\n     \
  \          \"--wpm\": (\"wpm\", float), \"--offset\": (\"offset\", float), \"--quotes\"\
  : (\"quotes\", int)}\n    i = 0\n    while i < len(argv):\n        a = argv[i]\n\
  \        if a in (\"-h\", \"--help\"):\n            print(__doc__)\n           \
  \ sys.exit(0)\n        if a in numeric or a in (\"--format\", \"--duration\"):\n\
  \            if i + 1 >= len(argv):\n                raise UsageError(f\"{a} needs\
  \ a value\")\n            v = argv[i + 1]\n            if a == \"--format\":\n \
  \               if v not in (\"text\", \"json\", \"youtube\"):\n               \
  \     raise UsageError(\"--format must be text, json, or youtube\")\n          \
  \      opts[\"format\"] = v\n            elif a == \"--duration\":\n           \
  \     if not re.fullmatch(r\"(?:\\d{1,2}:)?\\d{1,2}:\\d{2}\", v):\n            \
  \        raise UsageError(\"--duration must look like 52:30 or 1:05:00\")\n    \
  \            opts[\"duration\"] = to_sec(v)\n            else:\n               \
  \ key, typ = numeric[a]\n                try:\n                    opts[key] = typ(v)\n\
  \                except ValueError:\n                    raise UsageError(f\"{a}\
  \ needs a number, got {v!r}\")\n                if opts[key] < 0 or (key in (\"\
  wpm\", \"max_chapters\") and opts[key] == 0):\n                    raise UsageError(f\"\
  {a} must be positive\")\n            i += 2\n        elif a.startswith(\"--\"):\n\
  \            raise UsageError(f\"unknown option {a}\")\n        elif opts[\"file\"\
  ] is None:\n            opts[\"file\"] = a\n            i += 1\n        else:\n\
  \            raise UsageError(f\"unexpected argument {a!r}\")\n    if opts[\"file\"\
  ] is None:\n        raise UsageError(\"give a transcript file, or - for stdin\"\
  )\n    return opts\n\n\ndef main(argv):\n    try:\n        opts = parse_args(argv)\n\
  \        if opts[\"file\"] == \"-\":\n            text = sys.stdin.read()\n    \
  \    else:\n            with open(opts[\"file\"], encoding=\"utf-8\") as f:\n  \
  \              text = f.read()\n    except UsageError as e:\n        print(f\"error:\
  \ {e}\", file=sys.stderr)\n        return 2\n    except (OSError, UnicodeDecodeError)\
  \ as e:\n        print(f\"error: cannot read {opts['file']}: {getattr(e, 'strerror',\
  \ None) or e}\", file=sys.stderr)\n        return 2\n    units = parse(text)\n \
  \   total_words = sum(len(words(u[\"text\"])) for u in units if u[\"kind\"] == \"\
  text\")\n    if total_words < 50:\n        print(f\"error: only {total_words} words\
  \ of transcript; need at least 50 to suggest chapters\", file=sys.stderr)\n    \
  \    return 1\n    timed = assign_times(units, opts[\"wpm\"], opts[\"offset\"])\n\
  \    last = units[-1]\n    end_time = last[\"time\"] + (len(words(last[\"text\"\
  ])) / opts[\"wpm\"] * 60 if last[\"kind\"] == \"text\" else 0)\n    end_time = max(end_time,\
  \ LAST_CUE_END[0] + opts[\"offset\"] if LAST_CUE_END[0] else 0)\n    if opts[\"\
  duration\"]:\n        end_time = max(end_time, opts[\"duration\"])\n    EXTRA_STOP.update(w.lower()\
  \ for u in units if u[\"speaker\"] for w in u[\"speaker\"].split())\n    chosen,\
  \ _scores = boundaries(units, opts[\"min_chapter\"] * 60, opts[\"max_chapters\"\
  ], end_time)\n    chapters = build(units, chosen, end_time)\n    quotes = quote_candidates(units,\
  \ opts[\"quotes\"])\n    speakers = Counter(u[\"speaker\"] for u in units if u[\"\
  speaker\"])\n    notes = []\n    if not timed:\n        notes.append(f\"no timestamps\
  \ found: times are estimates at {opts['wpm']:g} words per minute; replace them \"\
  \n                     \"with real times from the audio editor before publishing\"\
  )\n    if opts[\"duration\"] and opts[\"duration\"] < end_time - 30 and timed:\n\
  \        notes.append(\"the transcript runs past --duration; check the timestamps\
  \ or the offset\")\n    markers = [{\"time\": round(u[\"time\"]), \"time_hms\":\
  \ fmt(u[\"time\"]), \"marker\": u[\"text\"]}\n               for u in units if u[\"\
  kind\"] == \"pause\"]\n    yt_lines, yt_problems = youtube_lines(chapters)\n   \
  \ report = {\"markers\": markers, \"words\": total_words, \"timestamps\": \"found\"\
  \ if timed else \"estimated\", \"end\": round(end_time),\n              \"end_hms\"\
  : fmt(end_time), \"speakers\": dict(speakers.most_common()), \"chapters\": chapters,\n\
  \              \"quotes\": quotes, \"youtube\": yt_lines, \"youtube_problems\":\
  \ yt_problems, \"notes\": notes}\n    if opts[\"format\"] == \"json\":\n       \
  \ print(json.dumps(report, indent=2, ensure_ascii=False))\n        return 0\n  \
  \  if opts[\"format\"] == \"youtube\":\n        print(\"\\n\".join(yt_lines))\n\
  \        for p in yt_problems + notes:\n            print(f\"# note: {p}\")\n  \
  \      return 0\n    spk = \", \".join(f\"{s} ({c} turns)\" for s, c in speakers.most_common())\
  \ or \"not labeled\"\n    print(f\"Transcript: {total_words} words, about {fmt(end_time)}\
  \ long, timestamps {report['timestamps']}, \"\n          f\"speakers: {spk}\")\n\
  \    print(f\"\\nChapter candidates ({len(chapters)}, min {opts['min_chapter']:g}\
  \ min apart):\")\n    for c in chapters:\n        est = \"~\" if c[\"estimated_time\"\
  ] else \" \"\n        print(f\"  {c['n']:>2}. {est}{c['start_hms']:>8}  {c['minutes']:>5.1f}\
  \ min  [{c['source']}] {c['title_draft']}\")\n        print(f\"      keywords: {',\
  \ '.join(c['keywords']) or '-'}\")\n        if c[\"opening_line\"]:\n          \
  \  print(f\"      opens: \\\"{c['opening_line']}\\\"\")\n    if markers:\n     \
  \   print(\"\\nMarkers (breaks, music, ads): \" + \", \".join(f\"{m['time_hms']}\
  \ {m['marker']}\" for m in markers))\n    print(f\"\\nQuote candidates ({len(quotes)}):\"\
  )\n    for q in quotes:\n        who = f\"{q['speaker']}: \" if q[\"speaker\"] else\
  \ \"\"\n        edited = \" (fillers removed, check against audio)\" if q[\"edited\"\
  ] else \"\"\n        print(f\"  {fmt(q['time']):>8}  {who}\\\"{q['text']}\\\"{edited}\"\
  )\n    print(\"\\nYouTube chapter lines:\")\n    for line in yt_lines:\n       \
  \ print(f\"  {line}\")\n    for p in yt_problems + notes:\n        print(f\"note:\
  \ {p}\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main(sys.argv[1:]))"
