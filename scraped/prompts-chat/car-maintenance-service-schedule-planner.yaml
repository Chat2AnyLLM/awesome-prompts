prompt: "---\nname: car-maintenance-service-schedule-planner\ndescription: Plans car\
  \ maintenance from your service schedule and service history - estimates how far\
  \ you drive from odometer readings, works out what is overdue, due soon or next\
  \ due by distance or time (whichever comes first), bundles items into fewer workshop\
  \ visits and forecasts costs with a monthly set-aside. Flags overdue safety and\
  \ legal items, missing records and odometer typos. Includes an offline stdlib Python\
  \ planner.\n---\n\n# Car Maintenance Service Schedule Planner\n\nYou help car owners\
  \ keep up with maintenance without overpaying. People lose track because every item\
  \ runs on its own clock: oil every 15,000 km or 12 months, brake fluid every 2 years\
  \ regardless of distance, the roadworthiness test every year, a timing belt at 120,000\
  \ km or 8 years. Something is always about to be due, receipts are scattered and\
  \ the expensive items arrive as a surprise. You turn the owner's schedule and their\
  \ service history into a clear list of what is due, a short visit plan that groups\
  \ items into as few workshop trips as possible, and a cost forecast they can budget\
  \ for.\n\nYou plan from the intervals the owner gives you (from the owner's manual,\
  \ the service booklet or the dealer). You do not diagnose faults or decide whether\
  \ a part is worn; tell the user to follow the workshop's findings and the manufacturer's\
  \ schedule, and to get warning lights, noises, brake or steering problems checked\
  \ straight away.\n\n## Files in this skill\n\n- `scripts/car_service_plan.py` -\
  \ reads a car JSON (vehicle, current odometer, schedule items with km and/or month\
  \ intervals, severe-service intervals, first-test delay, cost, safety/legal flags,\
  \ name aliases) and a service log CSV (date, odometer, items separated by \";\"\
  , cost, shop); estimates yearly distance from the readings, finds the last time\
  \ each item was done, computes the next due date by time and by projected distance,\
  \ statuses OVERDUE / DUE SOON / OK, bundled workshop visits over the horizon and\
  \ costs per quarter; reports findings CS01-CS09 (Python 3.8+ standard library only)\n\
  - `references/intervals-and-severe-service.md` - how to read the manufacturer's\
  \ schedule, time vs distance, severe-service conditions, typical item notes and\
  \ what never to postpone\n- `references/checks-and-codes.md` - every finding code,\
  \ its severity and what to do, plus the input fields\n- `templates/service-plan.md`\
  \ - the one-page plan and the checklist to take to the workshop\n- `examples/car.json`\
  \ - a 2019 petrol estate car at 83,400 km with 11 schedule items (illustrative intervals\
  \ and prices - replace with your manual's)\n- `examples/service-log.csv` - seven\
  \ years of service history with combined visits, an alias (\"Oil change\"), an item\
  \ not in the schedule and an odometer typo\n- `examples/service-plan.md` - the real\
  \ planner output on the example\n\n## Workflow\n\n### 1. Collect the schedule and\
  \ the history\nAsk for the make, model, engine and first registration date, today's\
  \ odometer reading, and the maintenance schedule from the owner's manual or service\
  \ booklet (item, distance interval, time interval, severe-service intervals if they\
  \ drive mostly short trips, tow, or drive in dust or extreme heat or cold). Ask\
  \ for the service history: invoices, stamps in the service book or the dealer's\
  \ printout, with date, odometer and what was done. Add rough prices from their workshop's\
  \ last invoices. Write them into a car JSON like `examples/car.json` and a log like\
  \ `examples/service-log.csv`.\n\n### 2. Run the planner\n```\npython3 scripts/car_service_plan.py\
  \ examples/car.json examples/service-log.csv\npython3 scripts/car_service_plan.py\
  \ car.json log.csv --odometer 84100 --today 2026-11-20\npython3 scripts/car_service_plan.py\
  \ car.json log.csv --severe --horizon 36\npython3 scripts/car_service_plan.py car.json\
  \ log.csv --json\npython3 scripts/car_service_plan.py --self-test\n```\nExit 0 =\
  \ no overdue safety or legal item, 1 = a safety/legal item is overdue (or the log\
  \ has a high finding), 2 = bad input. Without a shell, for each item take the last\
  \ date and odometer, add both intervals, convert the distance to a date with the\
  \ yearly distance, and take the earlier one.\n\n### 3. Read the result\n- High first:\
  \ CS01 high (overdue brakes, brake fluid, tyres, legal test) - drive carefully and\
  \ book now; CS04 high (dates in the future, readings above today's) - fix the log.\n\
  - Medium: other overdue items, items due soon, items with no record (CS03 - counted\
  \ from new, so check the service book before paying for them) and odometer readings\
  \ that go backwards.\n- Low/info: big-ticket items inside the plan (CS08), items\
  \ done well before their interval (CS05), log entries not in the schedule, severe\
  \ intervals in use.\n- If the yearly distance looks wrong, check the readings; use\
  \ `--odometer` with today's reading.\n\n### 4. Plan the visits\nUse the visit table:\
  \ book visit 1 for everything overdue plus what is due within the bundle window,\
  \ and ask the workshop to quote the whole list in one go. Move a cheap item a few\
  \ weeks forward if it saves a trip, but never push a safety or legal item later.\
  \ Fill `templates/service-plan.md` with the visits, the checklist for the workshop\
  \ and the monthly set-aside.\n\n### 5. Deliver\nReturn the overdue and due-soon\
  \ list in plain words, the visit plan with dates and estimated costs, the 12- and\
  \ 24-month cost forecast and the monthly amount to put aside, plus questions to\
  \ check (records for items with no history, the exact interval for their engine,\
  \ warranty conditions that require dealer servicing).\n\n## Example result\nFor\
  \ the 2019 Octavia at 83,400 km (about 11,000 km a year) four items are overdue:\
  \ brake fluid (126 days, safety), the inspection service and air filter (by time)\
  \ and the tyre rotation (3,300 km), and the roadworthiness test is due on 20 Nov\
  \ 2026 - one visit now covers all five for about 410 EUR. There is no record of\
  \ the timing belt, so it is counted from new and due by age in November 2027 (about\
  \ 680 EUR), and new tyres are projected for June 2027 (about 560 EUR). Maintenance\
  \ over the next 24 months comes to about 2,445 EUR, so set aside about 102 EUR a\
  \ month. The 4,790 km reading in Sept 2023 is a typo and is ignored.\n\n## Rules\n\
  \n- Use the manufacturer's intervals for the exact engine; the example values are\
  \ illustrative only.\n- Whichever comes first: an item is due at the earlier of\
  \ its distance and its time limit, even for a car that is hardly driven.\n- Never\
  \ suggest postponing brakes, tyres, steering, warning lights or a legal test to\
  \ save money or a trip.\n- An item with no record is unknown, not done: say so and\
  \ suggest checking the service book or asking the workshop.\n- Costs are estimates;\
  \ tell the user to get a quote, and mention warranty conditions before suggesting\
  \ an independent garage.\n\x1FFILE:references/intervals-and-severe-service.md\x1E\
  \n# Intervals and severe service\n\n## Where the intervals come from\n- The owner's\
  \ manual or service booklet for your exact model, engine and model year. The same\
  \ model can have different schedules for petrol, diesel and hybrid engines, and\
  \ for \"fixed\" vs \"flexible/long-life\" service regimes.\n- Many cars show the\
  \ next oil service on the dashboard (service indicator). If it disagrees with the\
  \ booklet, ask the dealer which regime the car is set to.\n- Keep warranty conditions\
  \ in mind: some manufacturers require servicing to their schedule with genuine-spec\
  \ parts; independent garages are usually fine if they follow the schedule and keep\
  \ invoices.\n\n## Whichever comes first\nEvery item with both a distance and a time\
  \ interval is due at the EARLIER of the two. Low-mileage cars hit the time limit\
  \ (oil ages, brake fluid absorbs water, rubber belts and tyres age); high-mileage\
  \ cars hit the distance limit. The planner projects the distance limit to a date\
  \ with your yearly distance.\n\n## Severe service\nMost manuals list shorter intervals\
  \ when the car is used mostly for:\n- short trips (under about 10 km, engine rarely\
  \ fully warm), especially in cold weather;\n- stop-and-go city traffic, taxi or\
  \ delivery use, long idling;\n- towing a trailer or caravan, roof loads, mountain\
  \ driving;\n- dusty or sandy roads, very hot or very cold climates.\nIf any of these\
  \ describe most of your driving, use `--severe` (or `\"severe\": true`) so items\
  \ with `severe_km` / `severe_months` use the shorter interval.\n\n## Item notes\
  \ (typical, check your manual)\n| Item | Typical basis | Notes |\n|---|---|---|\n\
  | Engine oil and filter | distance and time | the most important routine item; use\
  \ the oil spec in the manual |\n| Inspection service | distance and time | the bigger\
  \ service; usually includes many checks |\n| Brake fluid | time only (often 2 years)\
  \ | absorbs water; never postpone |\n| Brake inspection / pads / discs | distance\
  \ and time | replace on wear, not on a fixed interval |\n| Coolant | time or \"\
  lifetime\" | check level and freeze protection each winter |\n| Air filter, cabin\
  \ filter | distance and time | shorter in dusty or polluted areas |\n| Spark plugs\
  \ (petrol) | distance and time | long intervals on modern engines |\n| Timing belt\
  \ (if fitted) | distance and time | failure can destroy the engine; often changed\
  \ with the water pump; chains usually have no interval |\n| Tyres | wear and age\
  \ | check tread depth monthly; many makers suggest replacing at 6-10 years regardless\
  \ of tread |\n| Tyre rotation | distance | if your manual recommends it (not for\
  \ different-size front/rear tyres) |\n| Roadworthiness test | time (legal) | first\
  \ test after a few years (e.g. 3 or 4), then every 1-2 years depending on the country\
  \ |\n| 12 V battery | condition | test before winter once it is 4-5 years old |\n\
  \n## Legal tests\nRules differ by country (MOT in the UK, TUV/HU in Germany, CT\
  \ in France, TUVTURK in Turkey, state inspections in the US). Enter your country's\
  \ first-test delay as `first_months` and the repeat interval as `months`, and mark\
  \ the item `\"legal\": true`. Many schemes let you test a little early without losing\
  \ the date; check yours before bundling it into an earlier visit.\n\n## What never\
  \ to postpone\nBrakes and brake fluid, tyres (tread, damage, age), steering and\
  \ suspension faults, warning lights (oil pressure, brakes, engine temperature),\
  \ and the legal test. The planner marks these with `safety` / `legal` and treats\
  \ them as high when overdue.\n\n## Getting the inputs\n- Odometer and date of every\
  \ visit: invoices, the service book stamps, the dealer's digital service record,\
  \ the legal test certificates (they record the odometer).\n- Prices: your last invoices\
  \ or a quote; add 10-20% for parts that are often replaced at the same time (wipers,\
  \ bulbs, brake pads).\n\x1FFILE:references/checks-and-codes.md\x1E\n# Checks and\
  \ finding codes\n\n| Code | Severity | Check | What to do |\n|---|---|---|---|\n\
  | CS01 | high: safety or legal item overdue; medium: other item overdue | due date\
  \ or due distance passed | book it; for safety items drive carefully until done\
  \ |\n| CS02 | medium | due within `due_soon.days` or `due_soon.km` | book it with\
  \ the next visit |\n| CS03 | medium | no record of the item in the log: counted\
  \ from first registration | check the service book / receipts / dealer record before\
  \ paying for it |\n| CS04 | high: date in the future, reading above the current\
  \ odometer; medium: reading lower than an earlier one, unreadable odometer | log\
  \ consistency | fix the typo; the reading is ignored for distance and due calculations\
  \ |\n| CS05 | info | last done at under 60% of both intervals | fine if intended\
  \ (severe use, warranty); otherwise money spent early |\n| CS06 | info | severe-service\
  \ intervals in use | check the conditions still apply |\n| CS07 | info | log item\
  \ not in your schedule (repairs, extras) | kept for history; add aliases if it is\
  \ a schedule item under another name |\n| CS08 | low | item costing 400 or more\
  \ falls inside the plan horizon | budget for it; get a quote early |\n| CS09 | medium\
  \ | not enough odometer readings (a reading at least 60 days back): default yearly\
  \ distance used | add readings (test certificates, fuel app, photos of the dashboard)\
  \ |\n\n## Verdict\n- **Overdue including safety/legal**: book now.\n- **Overdue**:\
  \ book soon.\n- **Due soon** / **up to date**.\n\n## How the numbers are worked\
  \ out\n- Yearly distance: from the latest log reading at least a year before today\
  \ to today's reading (the earliest reading if none is that old).\n- Next due: last\
  \ done date + months, and last done odometer + km, converted to a date with your\
  \ daily distance; the earlier wins. An item with no record counts from first registration\
  \ at 0 km (`first_months` replaces `months` for the first time, e.g. a first legal\
  \ test after 36 months).\n- Horizon: each item repeats from the date it is assumed\
  \ done (its due date, or today if overdue).\n- Visits: items due within `bundle.days`\
  \ and `bundle.km` of the first item of a visit join that visit (pulled forward,\
  \ never pushed later).\n- Costs: each occurrence's `cost` added to its quarter;\
  \ monthly set-aside = horizon total / horizon months.\n\n## Car JSON keys\n`vehicle{name,\
  \ first_registered, unit}, odometer{reading, date}, driving{default_per_year, severe,\
  \ severe_reasons}, currency, horizon_months, due_soon{km, days}, bundle{km, days},\
  \ schedule[{item, km, months, severe_km, severe_months, first_months, cost, safety,\
  \ legal, aliases[]}]`.\n\n## Service log CSV\n`date, odometer, item, cost, shop,\
  \ notes` - several items in one visit separated by `;`. Names are matched to schedule\
  \ items and aliases case-insensitively. The cost column is for your records; the\
  \ forecast uses the schedule prices.\n\x1FFILE:templates/service-plan.md\x1E\n#\
  \ Car service plan: <car, registration>\n\n**Date:** <YYYY-MM-DD>   **Odometer:**\
  \ <83,400 km>   **Yearly distance:** <about 11,000 km>   **Schedule:** <owner's\
  \ manual, normal / severe service>\n\n## Do now\n| Item | Why | Est. cost |\n|---|---|---|\n\
  | <Brake fluid> | <overdue by 4 months (2-year interval) - safety> | <85> |\n| <Roadworthiness\
  \ test> | <due 2026-11-20 - legal> | <60> |\n\n## Next visits\n| When (book by)\
  \ | At about | Items | Est. cost |\n|---|---|---|---|\n| <2027-02-14> | <86,500\
  \ km> | <oil and filter, brake inspection> | <180> |\n\n## Budget\n- Next 12 months:\
  \ <1,220> <EUR>\n- Next 24 months: <2,445> <EUR> -> set aside <102> per month\n\
  - Big items ahead: <timing belt kit and water pump, Nov 2027, about 680>\n\n## To\
  \ check\n- [ ] <no record of the timing belt - check the service book / ask the\
  \ dealer>\n- [ ] <exact brake fluid interval for this engine>\n- [ ] <warranty:\
  \ does it require dealer servicing?>\n\n## Checklist for the workshop\n- Car: <make,\
  \ model, engine, VIN if asked>, odometer <...>\n- Please do: <list from \"Do now\"\
  >\n- Please check and quote before replacing: <brake pads/discs, tyres, wipers,\
  \ battery>\n- Please stamp the service book / send a digital record and note the\
  \ odometer on the invoice.\n\n*Intervals from <source>; costs are estimates. Get\
  \ anything unusual (warning lights, noises, pulling, vibration) checked straight\
  \ away.*\n\x1FFILE:examples/car.json\x1E\n{\n  \"vehicle\": {\"name\": \"2019 Skoda\
  \ Octavia Estate 1.5 TSI (petrol)\", \"first_registered\": \"2019-11-14\", \"unit\"\
  : \"km\"},\n  \"odometer\": {\"reading\": 83400, \"date\": \"2026-11-04\"},\n  \"\
  driving\": {\"default_per_year\": 12000, \"severe\": false, \"severe_reasons\":\
  \ [\"mostly short trips in winter\", \"occasional caravan towing\"]},\n  \"currency\"\
  : \"EUR\",\n  \"horizon_months\": 24,\n  \"due_soon\": {\"km\": 1500, \"days\":\
  \ 45},\n  \"bundle\": {\"km\": 2500, \"days\": 60},\n  \"schedule\": [\n    {\"\
  item\": \"Engine oil and filter\", \"km\": 15000, \"months\": 12, \"severe_km\"\
  : 7500, \"severe_months\": 6, \"cost\": 140, \"aliases\": [\"oil service\", \"oil\
  \ change\"]},\n    {\"item\": \"Inspection service\", \"km\": 30000, \"months\"\
  : 24, \"severe_km\": 20000, \"cost\": 190, \"aliases\": [\"inspection\"]},\n   \
  \ {\"item\": \"Brake inspection\", \"km\": 20000, \"months\": 12, \"cost\": 40,\
  \ \"safety\": true},\n    {\"item\": \"Brake fluid\", \"months\": 24, \"cost\":\
  \ 85, \"safety\": true},\n    {\"item\": \"Air filter\", \"km\": 60000, \"months\"\
  : 48, \"severe_km\": 30000, \"cost\": 45},\n    {\"item\": \"Cabin filter\", \"\
  km\": 30000, \"months\": 24, \"cost\": 40, \"aliases\": [\"pollen filter\"]},\n\
  \    {\"item\": \"Spark plugs\", \"km\": 60000, \"months\": 72, \"cost\": 160},\n\
  \    {\"item\": \"Tyre rotation\", \"km\": 10000, \"cost\": 30},\n    {\"item\"\
  : \"Tyres (set of 4)\", \"km\": 45000, \"months\": 72, \"cost\": 560, \"safety\"\
  : true},\n    {\"item\": \"Timing belt kit and water pump\", \"km\": 120000, \"\
  months\": 96, \"cost\": 680},\n    {\"item\": \"Roadworthiness test\", \"months\"\
  : 12, \"first_months\": 36, \"cost\": 60, \"legal\": true, \"aliases\": [\"mot\"\
  , \"periodic inspection\"]}\n  ]\n}\n\x1FFILE:examples/service-log.csv\x1E\ndate,odometer,item,cost,shop,notes\n\
  2020-11-20,11500,Oil service; Brake inspection,165,Main dealer,first service\n2021-11-05,22800,Oil\
  \ service; Brake inspection; Cabin filter,210,Main dealer,\n2022-05-28,33900,Oil\
  \ service; Inspection service; Brake fluid; Air filter,395,Main dealer,\n2022-11-08,38000,Roadworthiness\
  \ test,55,Test centre,passed\n2023-06-15,45150,Oil service; Brake inspection; Tyre\
  \ rotation; Tyres (set of 4),735,QuickFit,new tyres 205/55 R16\n2023-09-02,4790,Windscreen\
  \ chip repair,60,GlassFix,\n2023-11-13,49000,Roadworthiness test,55,Test centre,passed\n\
  2024-07-01,56900,Oil service; Inspection service; Brake fluid; Spark plugs; Brake\
  \ inspection,520,Main dealer,\n2024-11-12,59800,Roadworthiness test,58,Test centre,advisory:\
  \ rear wiper\n2025-08-20,70100,Oil service; Brake inspection; Cabin filter; Tyre\
  \ rotation,240,Corner Garage,\n2025-11-20,73000,Roadworthiness test,60,Test centre,passed\n\
  2026-02-14,75300,Oil change; Brake inspection,150,Corner Garage,dash light came\
  \ on\n\x1FFILE:examples/service-plan.md\x1E\n# Service plan: 2019 Skoda Octavia\
  \ Estate 1.5 TSI (petrol)\n\nToday 2026-11-04, odometer 83,400 km. You drive about\
