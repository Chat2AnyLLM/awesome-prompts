  \ plan horizon 24 months. Source: examples/service-log.csv.\n\n**Verdict: 4 item(s)\
  \ overdue, including safety/legal items - book a visit now**\n\nNext 12 months:\
  \ about 1,220.00 EUR; next 24 months: 2,445.00 EUR (set aside about 101.88 EUR per\
