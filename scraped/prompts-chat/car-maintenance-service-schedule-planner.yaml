  \n#!/usr/bin/env python3\n\"\"\"Car maintenance service schedule planner (stdlib\
  \ only, Python 3.8+).\n\nReads your car's maintenance schedule (items with distance\
  \ and/or time intervals, from the\nowner's manual or service booklet) and your service\
  \ history (CSV), estimates how far you drive\nfrom the odometer readings in the\
  \ log, and works out for every item when it was last done, when\nit is next due\
  \ (distance or time, whichever comes first), what is overdue or due soon, which\n\
  items can share one workshop visit, and what maintenance will cost over the next\
  \ months.\n\nUsage:\n  car_service_plan.py CAR.json SERVICE_LOG.csv [--odometer\
