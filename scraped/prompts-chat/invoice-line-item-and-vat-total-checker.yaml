  \ must be line|invoice and rounding half_up|half_even\")\n        today = datetime.date.fromisoformat(a.today)\
  \ if a.today else datetime.date.today()\n        results, R = check(invs, rules,\
  \ today, notes)\n    except (InputError, ValueError) as e:\n        print(\"error:\
  \ %s\" % e, file=sys.stderr)\n        return 2\n    if a.json:\n        conv = lambda\
  \ v: str(v) if isinstance(v, Decimal) else v\n        out = [{\"invoice\": r[\"\
  label\"], \"seller\": r[\"seller\"], \"currency\": r[\"currency\"],\n          \
