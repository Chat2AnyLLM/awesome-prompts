  \ for x in R[\"allowed_vat_rates\"]) + \"%\" if R[\"allowed_vat_rates\"] is not\
  \ None else \"\"))\n    out += [\"\", \"**Verdict: %s**\" % (\"%d of %d invoice(s)\
