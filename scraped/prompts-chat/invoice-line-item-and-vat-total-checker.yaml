  \ 332.38 GBP | 332.38 | 0.00 | 1 | 0 | 0 | FIX |\n| CR-0012 (credit note) | Brightline\
  \ Print | 1 | -22.80 GBP | -22.80 | 0.00 | 0 | 1 | 0 | CHECK |\n\n## 2026/0877 -\
  \ Brightline Print\n\n| # | Item | Qty | Unit price | Disc % | Rate % | Net (stated\
  \ / calc) | Tax (stated / calc) | Issues |\n|---|---|---|---|---|---|---|---|---|\n\
