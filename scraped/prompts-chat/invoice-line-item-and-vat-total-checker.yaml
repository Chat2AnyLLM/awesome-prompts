  \                f(\"medium\", \"IV11\", \"tax breakdown %s%%: stated base %s /\
  \ tax %s, lines give %s / %s\" % (br, bn, bv, got[0], got[1]))\n        seller =\
  \ str(get(inv, \"seller.vat_id\") or get(inv, \"seller.name\") or \"\").strip().lower()\n\
  \        if not blank(num):\n            k = (seller, str(num).strip().lower())\n\
  \            if k in seen_numbers:\n                f(\"high\", \"IV07\", \"invoice\
