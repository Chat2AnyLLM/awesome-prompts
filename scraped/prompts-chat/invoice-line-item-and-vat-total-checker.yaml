  , \"| Invoice | Seller | Lines | Stated total | Recomputed | Difference | High |\
  \ Medium | Low | Status |\", \"|---|---|---|---|---|---|---|---|---|---|\"]\n  \
  \  for r in results:\n        c = {s: sum(1 for f in r[\"findings\"] if f[0] ==\
  \ s) for s in SEV}\n        sg, eg = r[\"stated\"][\"gross\"], r[\"expected\"][\"\
  gross\"]\n        out.append(\"| %s%s | %s | %d | %s %s | %s | %s | %d | %d | %d\
  \ | %s |\" % (\n            r[\"label\"], \" (credit note)\" if r[\"credit\"] else\
  \ \"\", r[\"seller\"], len(r[\"lines\"]), money(sg), r[\"currency\"], money(eg),\n\
  \            money(sg - eg) if sg is not None else \"-\", c[\"high\"], c[\"medium\"\
  ], c[\"low\"],\n            \"FIX\" if c[\"high\"] else (\"CHECK\" if c[\"medium\"\
  ] else \"OK\")))\n    for r in results:\n        if not r[\"findings\"] or all(f[0]\
  \ == \"info\" for f in r[\"findings\"]):\n            continue\n        out += [\"\
  \", \"## %s - %s\" % (r[\"label\"], r[\"seller\"]), \"\"]\n        out += [\"| #\
