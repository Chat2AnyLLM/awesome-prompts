  \ money(r[\"expected\"][k])))\n        if len(r[\"per_rate\"]) > 1:\n          \
  \  out.append(\"| Tax by rate | | %s |\" % \"; \".join(\"%s%%: %s on %s\" % (plain(k),\
  \ money(v[1]), money(v[0])) for k, v in sorted(r[\"per_rate\"].items(), reverse=True)))\n\
  \        out += [\"\"] + [\"- **%s %s** %s\" % (s.upper(), c, m) for s, c, m in\
  \ r[\"findings\"]]\n    out.append(\"\")\n    return \"\\n\".join(out)\n\n\n# ----------------------------------------------------------------\
  \ self-test\ndef self_test():\n    tests = []\n    def t(name, cond):\n        tests.append((name,\
  \ bool(cond)))\n    def inv(lines, totals, **kw):\n        base = {\"number\": \"\
  A1\", \"date\": \"2026-10-01\", \"seller\": {\"name\": \"S\", \"vat_id\": \"X1\"\
  }, \"buyer\": {\"name\": \"B\"},\n                \"currency\": \"EUR\", \"lines\"\
  : lines, \"totals\": totals}\n        base.update(kw); return base\n    codes =\
  \ lambda res: {f[1] for f in res[0][\"findings\"]}\n    sev = lambda res, c: {f[0]\
  \ for f in res[0][\"findings\"] if f[1] == c}\n    ok = [{\"description\": \"a\"\
