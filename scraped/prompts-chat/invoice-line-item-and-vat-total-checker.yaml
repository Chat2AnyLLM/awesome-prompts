  \ % (num, seen_numbers[k] + 1))\n            else:\n                seen_numbers[k]\
  \ = idx\n        if st[\"gross\"] is not None and d:\n            k = (seller, d,\
  \ st[\"gross\"])\n            if k in seen_amounts and str(invoices[seen_amounts[k]].get(\"\
  number\")) != str(num):\n                f(\"medium\", \"IV07\", \"same seller,\
  \ date and total %s as invoice %s - possible duplicate under a new number\" % (st[\"\
  gross\"], invoices[seen_amounts[k]].get(\"number\")))\n            seen_amounts.setdefault(k,\
  \ idx)\n        F.sort(key=lambda x: (SEV[x[0]], x[1]))\n        results.append({\"\
  label\": label, \"seller\": get(inv, \"seller.name\") or \"\", \"currency\": inv.get(\"\
  currency\") or \"\",\n                        \"credit\": credit, \"lines\": lines,\
  \ \"per_rate\": per_rate, \"expected\": exp, \"stated\": st,\n                 \
  \       \"findings\": F, \"rows\": inv.get(\"_rows\")})\n    return results, R\n\
  \n\n# ---------------------------------------------------------------- rendering\n\
  def plain(v):\n    \"\"\"Plain decimal without exponent or trailing zeros (250,\
  \ 0.0185, 12.5).\"\"\"\n    if v is None:\n        return \"-\"\n    t = format(v.normalize(),\
  \ \"f\")\n    return t\n\n\ndef money(v):\n    return \"-\" if v is None else \"\
  {:,.2f}\".format(v)\n\n\ndef report(results, R, src):\n    tot = {s: sum(1 for r\
  \ in results for f in r[\"findings\"] if f[0] == s) for s in SEV}\n    bad = [r\
  \ for r in results if any(f[0] == \"high\" for f in r[\"findings\"])]\n    out =\
  \ [\"# Invoice check: %s\" % src, \"\"]\n    out.append(\"%d invoice(s), %d line(s).\
  \ Rules: %s rounding, tax rounded per %s, tolerance %s, prices %s tax%s.\" % (\n\
  \        len(results), sum(len(r[\"lines\"]) for r in results), R[\"rounding\"].replace(\"\
  _\", \" \"), R[\"vat_rounding\"], R[\"tolerance\"],\n        \"include\" if R[\"\
