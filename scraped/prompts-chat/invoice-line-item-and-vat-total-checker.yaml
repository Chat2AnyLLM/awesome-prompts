  \   return 0 if n == len(tests) else 1\n\n\ndef main(argv=None):\n    ap = argparse.ArgumentParser(description=__doc__.split(\"\
  \\n\")[0])\n    ap.add_argument(\"invoices\", nargs=\"?\", help=\"invoices .json\
