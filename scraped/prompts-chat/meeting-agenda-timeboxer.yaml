slug: meeting-agenda-timeboxer
title: Meeting Agenda Timeboxer
description: Imported from Prompts Chat
prompt: "---\nname: meeting-agenda-timeboxer\ndescription: Turns a rough list of meeting\
  \ topics into a timeboxed agenda with start and end times, owners, and a clear outcome\
  \ for every item (inform, discuss, decide, brainstorm, review), checks that it fits\
  \ the slot with a buffer, flags agenda smells such as late or rushed decisions,\
  \ too many status updates, oversized items, and missing breaks, and writes a ready-to-send\
  \ agenda and pre-read. Use when a user asks \"help me plan this meeting\", \"will\
  \ this agenda fit in an hour?\", \"make this agenda tighter\", or shares a list\
  \ of topics for a team meeting, workshop, offsite, or review.\n---\n\n# Meeting\
  \ Agenda Timeboxer\n\nYou help people run meetings that end on time and produce\
  \ decisions. You turn a list of topics into a realistic schedule, give every item\
  \ an owner and a purpose, move status updates out of the room, and make the time\
  \ math visible so nobody discovers at minute 55 that the main decision has no time\
  \ left.\n\n## Files in this skill\n\n- `scripts/timebox_agenda.py` - schedules every\
  \ item, checks the fit against the slot and buffer, flags agenda smells, and can\
  \ fit items to the slot in 5-minute steps (Python 3 standard library only)\n- `references/timeboxing-principles.md`\
  \ - how long things really take, item outcomes, ordering, buffers, and breaks\n\
  - `references/facilitation-moves.md` - techniques to keep each kind of item inside\
  \ its timebox, and what to do when one runs over\n- `templates/agenda.md` - the\
  \ agenda input format and the agenda to send\n- `examples/example-roadmap-meeting.md`\
  \ - a worked fix of an overloaded one-hour planning meeting\n\n## Workflow\n\n###\
  \ 1. Collect the facts\nAsk, or assume and say so:\n- Purpose of the meeting in\
  \ one sentence: what must be true when it ends?\n- Start time and length (or end\
  \ time), number of attendees, in person or remote.\n- Topics, each with an owner\
  \ and what the group must do with it: inform, update, discuss, brainstorm, review,\
  \ or decide.\n- Hard constraints: people who join late or leave early, fixed breaks.\n\
  \n### 2. Write the draft agenda\nUse the input format in `templates/agenda.md` (one\
  \ line per item: `minutes | topic | owner | outcome`). Use `?` for a duration nobody\
  \ knows yet. Estimate durations with `references/timeboxing-principles.md`.\n\n\
  ### 3. Run the timeboxer\n```bash\npython3 scripts/timebox_agenda.py agenda.txt\n\
  python3 scripts/timebox_agenda.py agenda.txt --fit     # scale to the slot in 5-minute\
  \ steps\npython3 scripts/timebox_agenda.py agenda.json --json\n```\nIt prints the\
  \ schedule with clock times, the buffer, and findings: HIGH when the agenda does\
  \ not fit, WARN for smells, INFO for unplanned time and the meeting cost in person-hours.\
  \ `--fit` trims status items first, then scales everything else; it never reorders\
  \ items, so check the order yourself afterwards.\n\nIf you cannot run the script,\
  \ do the clock math by hand, item by item, and say so.\n\n### 4. Fix the agenda,\
  \ not just the numbers\nWork through the findings in this order:\n1. Remove or shrink\
  \ status updates and announcements: move them into a written pre-read.\n2. Put decisions\
  \ early (first half), and give each one at least 10 minutes plus a written proposal\
  \ sent beforehand.\n3. Give every item an owner and an outcome; drop \"AOB\" or\
  \ turn it into a 5-minute parking lot review.\n4. Split items over 45 minutes; add\
  \ a break every 60 to 90 minutes.\n5. If it still does not fit, propose what to\
  \ cut or move to another meeting or to async, and say what is lost.\nRerun the script\
  \ until there are no HIGH findings and every WARN is either fixed or explained.\n\
  \n### 5. Deliver\nFill in the agenda to send from `templates/agenda.md`: purpose,\
  \ desired outcomes, the timed schedule, pre-reads with owners and deadlines, and\
  \ the parking lot rule. Add one or two facilitation tips per risky item from `references/facilitation-moves.md`.\
  \ Follow the style of `examples/example-roadmap-meeting.md`.\n\n## Rules\n- Never\
  \ make the math work by shrinking a decision below what it needs; cut or move something\
  \ else, or recommend a longer slot.\n- Keep a buffer: about 5 minutes per hour,\
  \ 10 percent for workshops.\n- Say plainly when a meeting should not happen (no\
  \ decisions, nothing to discuss) and suggest the async alternative.\n- Respect the\
  \ user's culture and constraints; suggest, do not lecture.\n- Times are local to\
  \ the meeting; for remote attendees in other time zones, mention it but do not convert\
  \ unless asked.\n\x1FFILE:references/timeboxing-principles.md\x1E\n# Timeboxing\
  \ principles\n\n## Every item needs an outcome\n| Outcome | What the group does\
  \ | Typical time | Notes |\n|---|---|---|---|\n| inform | Hear something, ask a\
  \ clarifying question | 2 to 5 min | Better as a written pre-read. |\n| update |\
  \ Status from people or teams | 1 to 2 min per person | Usually async; keep only\
  \ blockers live. |\n| discuss | Explore a topic, share views, no decision yet |\
  \ 10 to 20 min | Say what the discussion feeds (a decision next week, a doc). |\n\
  | brainstorm | Generate options | 15 to 30 min | Needs a framed question and a method\
  \ (silent writing first). |\n| review | Give feedback on a draft, design, or plan\
  \ | 15 to 40 min | Send the material beforehand; agree what kind of feedback is\
  \ wanted. |\n| decide | Choose between options and commit | 10 to 30 min | Needs\
  \ a written proposal, the options, the decision maker, and the decision rule. |\n\
  | break | Rest | 5 to 15 min | Every 60 to 90 minutes. |\n\nIf an item has no clear\
  \ outcome, ask: \"What will be different after this item?\" If the answer is \"\
  nothing\", cut it.\n\n## How long things really take\n- Introductions: about 1 minute\
  \ per person for a new group, 0 for a regular team.\n- Each person speaking once\
  \ on a topic: about 1.5 to 2 minutes per person. Eight people, one round, is 15\
  \ minutes.\n- Screen sharing and getting started: 2 to 3 minutes, more for remote\
  \ meetings with new tools.\n- A decision with real disagreement: double the estimate,\
  \ or split it into \"discuss\" now and \"decide\" next time.\n- Items late in the\
  \ agenda run faster but worse: people rush or leave.\n\n## Ordering\n1. Start with\
  \ a short framing: purpose and desired outcomes (2 to 5 min).\n2. Decisions and\
  \ the hardest topics in the first half, while energy and attendance are high.\n\
  3. Discussion and review in the middle.\n4. Information and updates last or out\
  \ of the meeting entirely.\n5. End with next steps, owners, and dates (5 min), never\
  \ with AOB.\nGroup items that need the same people, so others can leave early.\n\
  \n## Buffers and breaks\n- Buffer: about 5 minutes per hour, 10 percent for workshops.\
  \ The buffer is part of the slot, not extra time.\n- Breaks: 5 to 10 minutes every\
  \ 60 to 90 minutes; 15 for longer workshops. Remote meetings need breaks sooner.\n\
  - Back-to-back calendars: end 5 minutes early (25 or 50 minute meetings).\n\n##\
  \ Fit checks\n- More than about 8 items per hour means each gets less than 7 minutes;\
  \ merge or cut.\n- Status and announcements above about a third of the time: move\
  \ them to a pre-read.\n- An item over 45 minutes: split it into steps with their\
  \ own outcomes (for example \"brainstorm 25\" then \"cluster and pick 20\").\n\n\
  ## The cost of a meeting\nPerson-hours = attendees x length in hours. A one-hour\
  \ meeting with 9 people costs 9 working hours. Ask whether everyone needs to be\
  \ there for every item.\n\x1FFILE:references/facilitation-moves.md\x1E\n# Facilitation\
  \ moves that keep timeboxes\n\n## Before the meeting\n- Send the agenda and pre-reads\
  \ 24 to 48 hours ahead, with the owner of each item.\n- For every decision item,\
  \ send a one-page proposal: the question, options, recommendation, and who decides.\n\
  - Ask people to add questions to the pre-read in writing, so the meeting starts\
  \ from questions, not from a presentation.\n\n## At the start\n- State the purpose\
  \ and the outcomes you need by the end.\n- Name a timekeeper and agree on the signal\
  \ (a message in the chat, a raised hand at 2 minutes left).\n- Say how decisions\
  \ are made today: the owner decides after input, majority vote, or consent (\"any\
  \ strong objection?\").\n\n## By item type\n- Inform: \"Two minutes, then one clarifying\
  \ question each.\" Detailed questions go to the parking lot or to a follow-up chat.\n\
  - Update: Only blockers and asks live; everything else is in the pre-read.\n- Discuss:\
  \ Frame the question first (\"What worries us about option B?\"). Use a quick round\
  \ so everyone speaks once before anyone speaks twice.\n- Brainstorm: 3 to 5 minutes\
  \ of silent writing first, then share, then cluster. Quantity before judgment.\n\
  - Review: Agree the kind of feedback: blocking issues, questions, or polish. Collect\
  \ blocking issues first.\n- Decide: Restate the proposal, list concerns, check for\
  \ objections, then decide and say it out loud: \"We decided X; owner Y; by date\
  \ Z.\"\n\n## When an item runs over\nMake the choice visible instead of silently\
  \ eating the next item:\n1. \"We have 2 minutes left on this. Do we extend by 5\
  \ minutes and cut something else, or park it?\"\n2. Park it: write it in the parking\
  \ lot with an owner and a date.\n3. Shrink the next item, never the decision items.\n\
  4. If the meeting goal is at risk, schedule a short follow-up with only the people\
  \ needed.\n\n## Remote and hybrid\n- Everyone joins on their own device so remote\
  \ people are equal.\n- Use the chat for the speaking queue and for quick polls.\n\
  - Share the agenda on screen with the current item highlighted.\n\n## At the end\n\
  - Read back decisions, owners, and dates (5 minutes).\n- Review the parking lot:\
  \ assign each item or drop it.\n- Send notes within 24 hours.\n\x1FFILE:templates/agenda.md\x1E\
  \n# Agenda input (for scripts/timebox_agenda.py)\n\n```\nMeeting: <name>\nStart:\
  \ <HH:MM>\nLength: <minutes>            # or End: <HH:MM>\nBuffer: <minutes or percent,\
  \ e.g. 5 or 10%>\nAttendees: <number>\n\n<minutes> | <topic> | <owner> | <inform\
  \ | update | discuss | brainstorm | review | decide | break>\n? | <topic with unknown\
  \ duration> | <owner> | <outcome>\n```\nA Markdown table with the columns Min, Topic,\
  \ Owner, Outcome works too, and so does JSON:\n`{\"meeting\": \"...\", \"start\"\
  : \"14:00\", \"length\": 60, \"buffer\": 5, \"attendees\": 6, \"items\": [{\"minutes\"\
  : 10, \"topic\": \"...\", \"owner\": \"...\", \"outcome\": \"decide\"}]}`\n\n---\n\
  \n# Agenda to send\n\n**<Meeting name>**\n<Day, date>, <start>-<end> (<length> min),\
  \ <place or video link>\nAttendees: <names or teams> | Facilitator: <name> | Timekeeper:\
  \ <name> | Notes: <name>\n\n**Purpose:** <one sentence: what must be true when we\
  \ finish>\n\n**Outcomes we need**\n1. <decision or result>\n2. <decision or result>\n\
  \n**Pre-read (by <day, time>)**\n- <document> - <owner> - <what to look at, how\
  \ long it takes to read>\n\n**Schedule**\n| Time | Min | Item | Owner | Outcome\
  \ |\n|---|---|---|---|---|\n| <HH:MM-HH:MM> | <n> | <topic> | <owner> | <outcome>\
  \ |\n| <HH:MM-HH:MM> | <n> | Buffer and wrap-up: decisions, owners, dates | <facilitator>\
  \ | |\n\n**How we decide today:** <owner decides after input | consent | vote>\n\
  \n**Parking lot:** Off-topic points go to the parking lot and get an owner at the\
  \ end.\n\n**Moved out of this meeting**\n- <item> -> <async update, other meeting,\
  \ or a document>, owner <name>\n\x1FFILE:examples/example-roadmap-meeting.md\x1E\
  \n# Example: fixing an overloaded one-hour planning meeting\n\n## The request\n\"\
  I have one hour with 9 people on Thursday at 14:00 to plan Q4. Here is my agenda.\
  \ Will it fit? The budget split must be approved in this meeting, and the top 3\
  \ initiatives too.\"\n\nDraft agenda (`agenda.txt`):\n```\nMeeting: Q4 roadmap planning\n\
  Start: 14:00\nLength: 60\nBuffer: 5\nAttendees: 9\n\n10 | Welcome and goals | Dana\
  \ | inform\n15 | Team status round (each team lead) | Leads | update\n10 | Customer\
  \ feedback highlights | Priya | inform\n20 | Q4 priorities: pick top 3 initiatives\
  \ | Lee | discuss\n10 | Hiring plan for Q4 | | discuss\n5 | Approve Q4 budget split\
  \ | Dana | decide\n? | AOB | |\n```\n\n## First run\n```\n$ python3 scripts/timebox_agenda.py\
  \ agenda.txt\nQ4 roadmap planning: 14:00-15:00 (60 min, buffer 5 min, 55 min for\
  \ items)\nPlanned: 70 min\n\n  14:00-14:10   10 min            Welcome and goals\
  \ (Dana) [inform]\n  14:10-14:25   15 min            Team status round (each team\
  \ lead) (Leads) [update]\n  14:25-14:35   10 min            Customer feedback highlights\
  \ (Priya) [inform]\n  14:35-14:55   20 min            Q4 priorities: pick top 3\
  \ initiatives (Lee) [discuss]\n  14:55-15:05   10 min            Hiring plan for\
  \ Q4 [discuss]\n  15:05-15:10    5 min            Approve Q4 budget split (Dana)\
  \ [decide]\n  15:10-15:10    ? min            AOB [?]\n  14:55-15:00    5 min  \
  \          Buffer / wrap-up\n\nFindings:\n- [HIGH] Agenda needs 70 min but only\
  \ 55 min are available after the 5-min buffer: overrun of 15 min (ends 15:10 instead\
  \ of 14:55). Cut, shorten, or move items, or run with --fit.\n- [WARN] 1 item(s)\
  \ without a duration: AOB. Remaining time for them: 0 min.\n- [WARN] \"Hiring plan\
  \ for Q4\" has no owner; name who prepares and leads it.\n- [WARN] \"Approve Q4\
  \ budget split\" is a decision with only 5 min; plan at least 10, or decide by a\
  \ written proposal beforehand.\n- [WARN] \"Approve Q4 budget split\" is a decision\
  \ starting at 15:05, in the last quarter of the meeting; move it earlier while energy\
  \ and attendance are high.\n- [WARN] \"AOB\" has no owner; name who prepares and\
  \ leads it.\n- [WARN] \"AOB\" has no outcome; say whether it is to inform, discuss,\
  \ decide, or brainstorm.\n- [WARN] Status updates and announcements take 50% of\
  \ the time; send them as a pre-read and keep the meeting for discussion and decisions.\n\
  - [INFO] Meeting cost: 9 people x 60 min = 9 person-hours.\n```\nExit code 1: the\
  \ agenda does not fit.\n\n## What the numbers say\n- 70 minutes of items (plus AOB)\
  \ in a 55-minute window: 15 minutes over before AOB even starts.\n- Half of the\
  \ time is updates and announcements, while the two things that must be decided get\
  \ 5 minutes (budget) and a \"discuss\" label (priorities), and the budget decision\
  \ would start at 15:05, after the meeting should have ended.\n- Running `--fit`\
  \ alone would squeeze everything into 55 minutes but leave the budget decision last\
  \ with 5 minutes. Fitting the numbers is not enough; the order and the purpose of\
  \ items have to change.\n\n## Changes\n1. Team status round (15 min) and customer\
  \ feedback highlights (10 min) become a written pre-read due Wednesday 12:00; questions\
  \ go in comments.\n2. The budget split moves to the start with 10 minutes and a\
  \ proposal sent Monday, so the meeting only confirms or adjusts it.\n3. \"Q4 priorities\"\
  \ becomes a decision with 25 minutes: the outcome is a ranked top 3.\n4. The hiring\
  \ plan gets an owner (Priya) and a narrower question: which roles to open.\n5. AOB\
  \ is replaced by a 5-minute \"next steps, owners, and parking lot\" close.\n6. Three\
  \ people only needed for the status round can skip the meeting: 6 attendees instead\
  \ of 9.\n\nRevised agenda:\n```\nMeeting: Q4 roadmap planning\nStart: 14:00\nLength:\
  \ 60\nBuffer: 5\nAttendees: 6\n\n5 | Welcome and goals for today | Dana | inform\n\
  10 | Approve Q4 budget split (proposal sent Monday) | Dana | decide\n25 | Q4 priorities:\
  \ pick top 3 initiatives | Lee | decide\n10 | Hiring plan for Q4: agree which roles\
  \ to open | Priya | discuss\n5 | Next steps, owners, and parking lot | Dana | inform\n\
  ```\n\n## Second run\n```\n$ python3 scripts/timebox_agenda.py agenda-revised.txt\n\
  Q4 roadmap planning: 14:00-15:00 (60 min, buffer 5 min, 55 min for items)\nPlanned:\
  \ 55 min\n\n  14:00-14:05    5 min            Welcome and goals for today (Dana)\
  \ [inform]\n  14:05-14:15   10 min            Approve Q4 budget split (proposal\
  \ sent Monday) (Dana) [decide]\n  14:15-14:40   25 min            Q4 priorities:\
  \ pick top 3 initiatives (Lee) [decide]\n  14:40-14:50   10 min            Hiring\
  \ plan for Q4: agree which roles to open (Priya) [discuss]\n  14:50-14:55    5 min\
  \            Next steps, owners, and parking lot (Dana) [inform]\n  14:55-15:00\
  \    5 min            Buffer / wrap-up\n\nFindings:\n- [INFO] Meeting cost: 6 people\
  \ x 60 min = 6 person-hours.\n```\nExit code 0, no warnings, and the meeting costs\
  \ 6 person-hours instead of 9.\n\n## The agenda to send (filled template, shortened)\n\
  \n**Q4 roadmap planning**\nThursday, 14:00-15:00 (60 min), Room 3 and video link\n\
  Facilitator: Dana | Timekeeper: Lee | Notes: Priya\n\n**Purpose:** Leave with an\
  \ approved Q4 budget split and a ranked top 3 of initiatives.\n\n**Pre-read (by\
  \ Wednesday 12:00)**\n- Team status one-pagers - each team lead - 5 min to read\n\
  - Customer feedback highlights - Priya - 5 min\n- Budget split proposal - Dana -\
  \ 10 min\n\n**Schedule**\n| Time | Min | Item | Owner | Outcome |\n|---|---|---|---|---|\n\
  | 14:00-14:05 | 5 | Welcome and goals for today | Dana | inform |\n| 14:05-14:15\
  \ | 10 | Approve Q4 budget split (proposal sent Monday) | Dana | decide |\n| 14:15-14:40\
  \ | 25 | Q4 priorities: pick top 3 initiatives | Lee | decide |\n| 14:40-14:50 |\
  \ 10 | Hiring plan for Q4: agree which roles to open | Priya | discuss |\n| 14:50-14:55\
  \ | 5 | Next steps, owners, and parking lot | Dana | inform |\n| 14:55-15:00 | 5\
  \ | Buffer | | |\n\n**How we decide today:** Dana decides the budget after input;\
  \ the top 3 is chosen by consent (any strong objection?).\n\n**Facilitation tips**\n\
  - Priorities: 3 minutes of silent dot voting on the candidate list, then discuss\
  \ only the items ranked 2 to 5.\n- If the budget item hits 10 minutes, park the\
  \ open point with an owner and a 24-hour deadline instead of eating into priorities.\n\
  \n**Moved out of this meeting:** team status round and customer feedback (pre-read).\n\
  \n## Why this is a good answer\n- It fixes the purpose and the order, not just the\
  \ minutes.\n- Both required decisions now happen in the first 40 minutes, with prepared\
  \ proposals.\n- The script confirms the fit, and the people who were only there\
  \ for updates get their hour back.\n\x1FFILE:scripts/timebox_agenda.py\x1E\n#!/usr/bin/env\
  \ python3\n\"\"\"Timebox a meeting agenda: schedule every item, check the fit, and\
  \ flag agenda smells.\n\nUsage:\n  python3 timebox_agenda.py agenda.txt\n  python3\
  \ timebox_agenda.py agenda.txt --fit          # scale items to fit the slot (5-minute\
  \ steps)\n  python3 timebox_agenda.py agenda.json --json\n  cat agenda.txt | python3\
  \ timebox_agenda.py -\n\nText input: optional \"Key: value\" header lines, then\
  \ one item per line as\n  minutes | topic | owner | outcome\nMarkdown table rows\
  \ (| 10 | Topic | Owner | decide |) also work; header and\nseparator rows are skipped.\
  \ Use ? for an unknown duration.\nHeader keys: Meeting, Start (HH:MM), Length (minutes)\
  \ or End (HH:MM),\n  Buffer (minutes or percent, e.g. 5 or 10%), Attendees (number).\n\
  Outcomes: inform, update, discuss, brainstorm, review, decide, break.\nJSON input:\
  \ {\"meeting\": \"...\", \"start\": \"14:00\", \"length\": 60, \"buffer\": 5,\n\
  \  \"attendees\": 8, \"items\": [{\"minutes\": 10, \"topic\": \"...\", \"owner\"\
  : \"...\", \"outcome\": \"decide\"}]}\n\n--fit trims status items (and items with\
  \ no outcome) first, then scales everything; spare time goes to\ndecide and discuss\
  \ items.\nChecks: overrun (HIGH), missing durations, owners, or outcomes, late or\
  \ rushed\ndecisions, oversized items, long stretches without a break, too many status\n\
  updates, too many items per hour, plus the meeting's cost in person-hours.\nExit\
  \ code: 0 no HIGH findings, 1 HIGH found, 2 usage or input error.\nStandard library\
  \ only.\n\"\"\"\nimport argparse\nimport json\nimport math\nimport re\nimport sys\n\
  \nOUTCOMES = {\"inform\", \"update\", \"discuss\", \"brainstorm\", \"review\", \"\
  decide\", \"break\"}\nALIASES = {\"decision\": \"decide\", \"info\": \"inform\"\
  , \"fyi\": \"inform\", \"status\": \"update\", \"updates\": \"update\",\n      \
  \     \"discussion\": \"discuss\", \"ideas\": \"brainstorm\", \"ideation\": \"brainstorm\"\
  , \"feedback\": \"review\",\n           \"approve\": \"decide\", \"approval\": \"\
  decide\", \"pause\": \"break\", \"coffee\": \"break\"}\n\n\nclass InputError(Exception):\n\
  \    pass\n\n\ndef hhmm(text):\n    m = re.fullmatch(r\"\\s*(\\d{1,2})[:.](\\d{2})\\\
  s*\", str(text))\n    if not m or int(m.group(1)) > 23 or int(m.group(2)) > 59:\n\
  \        raise InputError(f\"time must be HH:MM, got {text!r}\")\n    return int(m.group(1))\
  \ * 60 + int(m.group(2))\n\n\ndef fmt(minutes):\n    minutes = int(round(minutes))\
  \ % (24 * 60)\n    return f\"{minutes // 60:02d}:{minutes % 60:02d}\"\n\n\ndef parse_minutes(text):\n\
  \    t = str(text).strip().lower()\n    if t in (\"\", \"?\", \"tbd\", \"-\"):\n\
  \        return None\n    m = re.fullmatch(r\"(\\d+(?:\\.\\d+)?)\\s*(m|min|mins|minutes?)?\"\
  , t)\n    if m:\n        return float(m.group(1))\n    m = re.fullmatch(r\"(\\d+(?:\\\
  .\\d+)?)\\s*h(?:ours?)?(?:\\s*(\\d+)\\s*m(?:in)?)?\", t)\n    if m:\n        return\
  \ float(m.group(1)) * 60 + float(m.group(2) or 0)\n    raise InputError(f\"cannot\
  \ read duration {text!r}\")\n\n\ndef norm_outcome(text):\n    t = (text or \"\"\
  ).strip().lower()\n    return ALIASES.get(t, t)\n\n\ndef parse_text(text):\n   \
  \ meta, items, errors = {}, [], []\n    for no, raw in enumerate(text.replace(\"\
  \\r\\n\", \"\\n\").split(\"\\n\"), 1):\n        line = raw.strip()\n        if not\
  \ line or line.startswith(\"#\"):\n            continue\n        hm = re.fullmatch(r\"\
  ([A-Za-z ]{3,20}):\\s*(.+)\", line)\n        if hm and \"|\" not in line:\n    \
  \        meta[hm.group(1).strip().lower()] = hm.group(2).strip()\n            continue\n\
  \        if \"|\" not in line:\n            errors.append(f\"line {no}: expected\
  \ 'minutes | topic | owner | outcome', got {line[:60]!r}\")\n            continue\n\
  \        cells = [c.strip() for c in line.strip(\"|\").split(\"|\")]\n        if\
  \ all(re.fullmatch(r\":?-{2,}:?\", c) for c in cells if c):\n            continue\n\
  \        if cells and cells[0].lower() in (\"min\", \"mins\", \"minutes\", \"time\"\
  , \"duration\"):\n            continue\n        cells += [\"\"] * (4 - len(cells))\n\
  \        try:\n            minutes = parse_minutes(cells[0])\n        except InputError\
  \ as e:\n            errors.append(f\"line {no}: {e}\")\n            continue\n\
  \        if not cells[1]:\n            errors.append(f\"line {no}: item has no topic\"\
  )\n            continue\n        items.append({\"line\": no, \"minutes\": minutes,\
  \ \"topic\": cells[1], \"owner\": cells[2],\n                      \"outcome\":\
  \ norm_outcome(cells[3])})\n    return meta, items, errors\n\n\ndef parse_json(text):\n\
  \    data = json.loads(text)\n    if not isinstance(data, dict) or not isinstance(data.get(\"\
  items\"), list):\n        raise InputError(\"JSON input needs an object with an\
  \ 'items' list\")\n    meta = {k.lower(): str(v) for k, v in data.items() if k !=\
  \ \"items\" and v is not None}\n    items, errors = [], []\n    for i, it in enumerate(data[\"\
  items\"], 1):\n        try:\n            minutes = parse_minutes(it.get(\"minutes\"\
  , \"\"))\n        except InputError as e:\n            errors.append(f\"item {i}:\
  \ {e}\")\n            continue\n        if not str(it.get(\"topic\", \"\")).strip():\n\
  \            errors.append(f\"item {i}: item has no topic\")\n            continue\n\
  \        items.append({\"line\": i, \"minutes\": minutes, \"topic\": str(it[\"topic\"\
  ]).strip(),\n                      \"owner\": str(it.get(\"owner\", \"\") or \"\"\
  ).strip(), \"outcome\": norm_outcome(it.get(\"outcome\", \"\"))})\n    return meta,\
  \ items, errors\n\n\ndef settings(meta):\n    start = hhmm(meta.get(\"start\", \"\
  09:00\"))\n    if \"length\" in meta:\n        length = parse_minutes(meta[\"length\"\
  ])\n        if not length or length <= 0:\n            raise InputError(\"Length\
  \ must be a positive number of minutes\")\n    elif \"end\" in meta:\n        length\
  \ = (hhmm(meta[\"end\"]) - start) % (24 * 60)\n        if length == 0:\n       \
  \     raise InputError(\"End must be after Start\")\n    else:\n        raise InputError(\"\
  header needs 'Length: <minutes>' or 'End: HH:MM'\")\n    b = meta.get(\"buffer\"\
  , \"0\").strip()\n    if b.endswith(\"%\"):\n        buffer = 5 * round(length *\
  \ float(b[:-1]) / 100 / 5)  # percent buffers round to 5 minutes\n    else:\n  \
  \      buffer = parse_minutes(b) or 0\n    if buffer >= length:\n        raise InputError(\"\
  Buffer must be shorter than the meeting\")\n    attendees = int(meta[\"attendees\"\
  ]) if str(meta.get(\"attendees\", \"\")).strip().isdigit() else None\n    return\
  \ {\"meeting\": meta.get(\"meeting\", meta.get(\"title\", \"Meeting\")), \"start\"\
  : start, \"length\": length,\n            \"buffer\": buffer, \"available\": length\
  \ - buffer, \"attendees\": attendees}\n\n\ndef fit(items, available):\n    \"\"\"\
  Fit items into `available` minutes in 5-minute steps (missing durations count as\
  \ 10, breaks kept).\n\n    When the agenda is too long, status items (inform, update,\
  \ or no outcome) are trimmed first, down to half\n    their planned time; then every\
  \ item is scaled proportionally. When it is too short, the\n    spare time goes\
  \ to decide and discuss items first.\n    \"\"\"\n    fixed = sum(it[\"minutes\"\
  ] or 0 for it in items if it[\"outcome\"] == \"break\")\n    flex = [it for it in\
  \ items if it[\"outcome\"] != \"break\"]\n    room = available - fixed\n    if not\
  \ flex or room < 5 * len(flex):\n        raise InputError(f\"cannot fit {len(flex)}\
  \ items into {room:g} minutes with at least 5 minutes each\")\n    want = [max(5,\
  \ 5 * round((it[\"minutes\"] or 10) / 5)) for it in flex]\n    cur = list(want)\n\
  \    status = [i for i, it in enumerate(flex) if it[\"outcome\"] in (\"inform\"\
  , \"update\", \"\")]\n    while sum(cur) > room:\n        cands = [i for i in status\
  \ if cur[i] - 5 >= max(5, want[i] / 2)]\n        if not cands:\n            break\n\
  \        cur[max(cands, key=lambda k: cur[k])] -= 5\n    if sum(cur) > room:\n \
  \       scale = room / sum(cur)\n        ref = [c * scale for c in cur]\n      \
  \  cur = [max(5, 5 * round(r / 5)) for r in ref]\n        while sum(cur) > room:\n\
  \            cands = [k for k in range(len(cur)) if cur[k] > 5]\n            cur[max(cands,\
  \ key=lambda k: (cur[k] - ref[k], cur[k]))] -= 5\n        while sum(cur) + 5 <=\
  \ room:\n            cur[min(range(len(cur)), key=lambda k: cur[k] - ref[k])] +=\
  \ 5\n    else:\n        prio = [i for i, it in enumerate(flex) if it[\"outcome\"\
  ] in (\"decide\", \"discuss\")] or list(range(len(flex)))\n        while sum(cur)\
  \ + 5 <= room:\n            cur[min(prio, key=lambda k: cur[k] / want[k])] += 5\n\
  \    out, it_new = [], iter(cur)\n    for it in items:\n        copy = dict(it)\n\
  \        copy[\"original\"] = it[\"minutes\"]\n        if it[\"outcome\"] != \"\
  break\":\n            copy[\"minutes\"] = float(next(it_new))\n        out.append(copy)\n\
  \    return out\n\n\ndef analyze(items, cfg):\n    findings = []\n\n    def add(sev,\
  \ msg):\n        findings.append({\"severity\": sev, \"message\": msg})\n\n    t\
  \ = cfg[\"start\"]\n    for it in items:\n        it[\"start\"] = t\n        t +=\
  \ it[\"minutes\"] or 0\n        it[\"end\"] = t\n    planned = sum(it[\"minutes\"\
  ] or 0 for it in items)\n    avail, end_slot = cfg[\"available\"], cfg[\"start\"\
  ] + cfg[\"length\"]\n    unknown = [it for it in items if it[\"minutes\"] is None]\n\
  \    if planned > avail:\n        add(\"HIGH\", f\"Agenda needs {planned:g} min\
  \ but only {avail:g} min are available\"\n            f\"{' after the ' + format(cfg['buffer'],\
  \ 'g') + '-min buffer' if cfg['buffer'] else ''}: overrun of {planned - avail:g}\
  \ min\"\n            f\" (ends {fmt(cfg['start'] + planned)} instead of {fmt(end_slot\
  \ - cfg['buffer'])}). Cut, shorten, or move items, or run with --fit.\")\n    elif\
  \ avail - planned > 0.15 * avail and not unknown:\n        add(\"INFO\", f\"{avail\
  \ - planned:g} min unplanned; end early or give the main decision more time.\")\n\
  \    if unknown:\n        add(\"WARN\", f\"{len(unknown)} item(s) without a duration:\
  \ \" + \"; \".join(it[\"topic\"][:40] for it in unknown)\n            + f\". Remaining\
  \ time for them: {max(avail - planned, 0):g} min.\")\n    for it in items:\n   \
  \     name = f\"\\\"{it['topic'][:50]}\\\"\"\n        if it[\"outcome\"] != \"break\"\
  \ and not it[\"owner\"]:\n            add(\"WARN\", f\"{name} has no owner; name\
  \ who prepares and leads it.\")\n        if not it[\"outcome\"]:\n            add(\"\
  WARN\", f\"{name} has no outcome; say whether it is to inform, discuss, decide,\
  \ or brainstorm.\")\n        elif it[\"outcome\"] not in OUTCOMES:\n           \
  \ add(\"WARN\", f\"{name} has unknown outcome '{it['outcome']}' (use: {', '.join(sorted(OUTCOMES))}).\"\
  )\n        m = it[\"minutes\"] or 0\n        if it[\"outcome\"] == \"decide\":\n\
  \            if it[\"minutes\"] is not None and m < 10:\n                add(\"\
  WARN\", f\"{name} is a decision with only {m:g} min; plan at least 10, or decide\
  \ by a written proposal beforehand.\")\n            if it[\"start\"] - cfg[\"start\"\
  ] >= 0.75 * cfg[\"length\"]:\n                add(\"WARN\", f\"{name} is a decision\
  \ starting at {fmt(it['start'])}, in the last quarter of the meeting; move it earlier\
  \ while energy and attendance are high.\")\n        if it[\"outcome\"] in (\"discuss\"\
  , \"brainstorm\", \"review\") and it[\"minutes\"] is not None and m < 5:\n     \
  \       add(\"WARN\", f\"{name} is a {it['outcome']} item with {m:g} min; that is\
  \ a mention, not a {it['outcome']}.\")\n        if m > 45 and it[\"outcome\"] !=\
  \ \"break\":\n            add(\"WARN\", f\"{name} is {m:g} min long; split it into\
  \ parts with their own outcomes.\")\n    stretch, stretch_start = 0, cfg[\"start\"\
  ]\n    for it in items:\n        if it[\"outcome\"] == \"break\":\n            stretch,\
  \ stretch_start = 0, it[\"end\"]\n            continue\n        stretch += it[\"\
  minutes\"] or 0\n        if stretch > 90:\n            add(\"WARN\", f\"{stretch:g}\
  \ min without a break from {fmt(stretch_start)}; add a 5 to 10 min break about every\
  \ 60 to 90 min.\")\n            stretch = -10**9\n    status = sum(it[\"minutes\"\
  ] or 0 for it in items if it[\"outcome\"] in (\"inform\", \"update\"))\n    if planned\
  \ and status / planned > 0.35:\n        add(\"WARN\", f\"Status updates and announcements\
  \ take {round(100 * status / planned)}% of the time; send them as a pre-read and\
  \ keep the meeting for discussion and decisions.\")\n    work_items = [it for it\
  \ in items if it[\"outcome\"] != \"break\"]\n    hours = cfg[\"length\"] / 60\n\
  \    if hours and len(work_items) / hours > 8:\n        add(\"WARN\", f\"{len(work_items)}\
  \ items in {cfg['length']:g} min is more than 8 per hour; merge or drop items.\"\
  )\n    if not any(it[\"outcome\"] == \"decide\" for it in items):\n        add(\"\
  INFO\", \"No decision items; check that this meeting needs to be live.\")\n    cost\
  \ = None\n    if cfg[\"attendees\"]:\n        cost = round(cfg[\"attendees\"] *\
  \ cfg[\"length\"] / 60, 1)\n        add(\"INFO\", f\"Meeting cost: {cfg['attendees']}\
  \ people x {cfg['length']:g} min = {cost:g} person-hours.\")\n    order = {\"HIGH\"\
  : 0, \"WARN\": 1, \"INFO\": 2}\n    findings.sort(key=lambda f: order[f[\"severity\"\
  ]])\n    return {\"meeting\": cfg[\"meeting\"], \"start\": fmt(cfg[\"start\"]),\
  \ \"end\": fmt(end_slot), \"length\": cfg[\"length\"],\n            \"buffer\":\
  \ cfg[\"buffer\"], \"available\": avail, \"planned\": planned, \"person_hours\"\
  : cost,\n            \"items\": [{k: (fmt(v) if k in (\"start\", \"end\") else v)\
  \ for k, v in it.items()} for it in items],\n            \"findings\": findings}\n\
  \n\ndef main():\n    ap = argparse.ArgumentParser(description=\"Timebox a meeting\
  \ agenda\")\n    ap.add_argument(\"path\", help=\"agenda text/Markdown/JSON file,\
  \ or - for stdin\")\n    ap.add_argument(\"--fit\", action=\"store_true\", help=\"\
  scale item durations to fit the available time\")\n    ap.add_argument(\"--json\"\
  , action=\"store_true\")\n    args = ap.parse_args()\n    try:\n        text = sys.stdin.read()\
  \ if args.path == \"-\" else open(args.path, encoding=\"utf-8\").read()\n      \
  \  if not text.strip():\n            raise InputError(\"input is empty\")\n    \
  \    meta, items, errors = parse_json(text) if text.lstrip().startswith(\"{\") else\
  \ parse_text(text)\n        if errors:\n            raise InputError(\"could not\
  \ read the agenda:\\n  \" + \"\\n  \".join(errors))\n        if not items:\n   \
  \         raise InputError(\"no agenda items found (expected lines like '10 | Topic\
  \ | Owner | decide')\")\n        cfg = settings(meta)\n        before = sum(it[\"\
  minutes\"] or 0 for it in items)\n        n_unknown = sum(1 for it in items if it[\"\
  minutes\"] is None)\n        if args.fit:\n            items = fit(items, cfg[\"\
  available\"])\n    except FileNotFoundError:\n        print(f\"error: file not found:\
  \ {args.path}\", file=sys.stderr)\n        return 2\n    except (InputError, json.JSONDecodeError,\
  \ ValueError) as e:\n        print(f\"error: {e}\", file=sys.stderr)\n        return\
  \ 2\n    rep = analyze(items, cfg)\n    rep[\"fitted_from\"] = before if args.fit\
  \ else None\n    if args.json:\n        print(json.dumps(rep, indent=2))\n    else:\n\
  \        print(f\"{rep['meeting']}: {rep['start']}-{rep['end']} ({rep['length']:g}\
  \ min, buffer {rep['buffer']:g} min, {rep['available']:g} min for items)\")\n  \
  \      if args.fit:\n            extra = f\" plus {n_unknown} without a duration\
  \ (counted as 10 min each)\" if n_unknown else \"\"\n            print(f\"Fitted:\
  \ {before:g} min of items{extra} fitted into {rep['planned']:g} min (5-minute steps,\
  \ breaks kept).\")\n        print(f\"Planned: {rep['planned']:g} min\\n\")\n   \
  \     for it in rep[\"items\"]:\n            mins = \"?\" if it[\"minutes\"] is\
  \ None else f\"{it['minutes']:g}\"\n            was = f\" (was {it['original']:g})\"\
  \ if args.fit and it.get(\"original\") not in (None, it[\"minutes\"]) else \"\"\n\
  \            who = f\" ({it['owner']})\" if it[\"owner\"] else \"\"\n          \
  \  print(f\"  {it['start']}-{it['end']}  {mins:>3} min{was:<10}  {it['topic']}{who}\
  \ [{it['outcome'] or '?'}]\")\n        if rep[\"buffer\"]:\n            print(f\"\
  \  {fmt(hhmm(rep['end']) - rep['buffer'])}-{rep['end']}  {rep['buffer']:>3g} min\
  \            Buffer / wrap-up\")\n        print()\n        if rep[\"findings\"]:\n\
  \            print(\"Findings:\")\n            for f in rep[\"findings\"]:\n   \
  \             print(f\"- [{f['severity']}] {f['message']}\")\n        else:\n  \
  \          print(\"Findings: none\")\n    return 1 if any(f[\"severity\"] == \"\
  HIGH\" for f in rep[\"findings\"]) else 0\n\n\nif __name__ == \"__main__\":\n  \
  \  sys.exit(main())"
