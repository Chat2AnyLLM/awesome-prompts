  : round(covered / len(ps), 3),\n               \"last_change\": max(f_last[p] for\
  \ p in ps).isoformat(), \"recent_lines_90d\": int(recent_by_mod[m]),\n         \
  \      \"top_author_active\": top in active, \"findings\": []}\n        if covered\
  \ / len(ps) < 0.5:\n            row[\"findings\"].append(\"BF02\")\n        if bf\
  \ == 1 and len(ps) >= 3:\n            row[\"findings\"].append(\"BF03\")\n     \
  \   if bf == 1 and recent_by_mod[m] > 0 and recent_by_mod[m] >= hot_cut and len(mods)\
  \ >= 4:\n            row[\"findings\"].append(\"BF04\")\n        if len(authors_ever[m])\
  \ == 1:\n            row[\"findings\"].append(\"BF06\")\n        out_mods.append(row)\n\
  \    # repository truck factor: greedily remove the author who knows most still-covered\
