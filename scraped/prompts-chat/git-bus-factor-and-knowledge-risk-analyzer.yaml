  \ len(parts) - 1)])\n\n\ndef analyse(commits, aliases=None, depth=1, since=None,\
  \ as_of=None, active_days=120, half_life=365,\n            knows_share=0.25, excludes=None,\
  \ include_bots=False):\n    aliases = aliases or {}\n    pats = DEFAULT_EXCLUDES\
  \ + list(excludes or [])\n    since_d = parse_date(since, \"--since\") if since\
  \ else None\n    as_of_d = parse_date(as_of, \"--as-of\") if as_of else max(c[\"\
  date\"] for c in commits)\n    emails_by_name = defaultdict(set)\n    last_seen\
  \ = {}\n    fw = defaultdict(lambda: defaultdict(float))       # file -> author\
  \ -> weight\n    f_last = {}\n    f_recent = defaultdict(float)                \
  \       # lines in last 90 days\n    commits_per_module = defaultdict(set)\n   \
  \ authors_ever = defaultdict(set)                     # module -> authors (unweighted)\n\
  \    used = 0\n    for c in commits:\n        if since_d and c[\"date\"] < since_d:\n\
  \            continue\n        if c[\"date\"] > as_of_d:\n            continue\n\
  \        if not include_bots and (\"[bot]\" in c[\"name\"].lower() or \"bot@\" in\
  \ c[\"email\"] or c[\"name\"].lower().endswith(\" bot\")):\n            continue\n\
  \        who = aliases.get(c[\"email\"]) or aliases.get(c[\"name\"].lower()) or\
  \ c[\"name\"]\n        if who == c[\"name\"] and not aliases.get(c[\"email\"]):\n\
  \            emails_by_name[c[\"name\"]].add(c[\"email\"])\n        last_seen[who]\
  \ = max(last_seen.get(who, c[\"date\"]), c[\"date\"])\n        age = (as_of_d -\
  \ c[\"date\"]).days\n        w = 0.5 ** (age / float(half_life)) if half_life >\
  \ 0 else 1.0\n        touched = False\n        for path, a, d in c[\"files\"]:\n\
  \            if any(fnmatch.fnmatch(path, p) for p in pats):\n                continue\n\
  \            lines = a + d\n            if lines == 0:\n                continue\n\
  \            touched = True\n            fw[path][who] += math.log1p(lines) * w\
  \     # log damps huge generated diffs\n            f_last[path] = max(f_last.get(path,\
  \ c[\"date\"]), c[\"date\"])\n            if age <= 90:\n                f_recent[path]\
  \ += lines\n            mod = module_of(path, depth)\n            commits_per_module[mod].add(c[\"\
  sha\"])\n            authors_ever[mod].add(who)\n        used += touched\n    if\
  \ not fw:\n        raise InputError(\"no usable file changes after filters\")\n\
  \    active = {a for a, d in last_seen.items() if (as_of_d - d).days <= active_days}\n\
  \n    def knowers(path):\n        tot = sum(fw[path].values())\n        return {a\
  \ for a, v in fw[path].items() if v / tot >= knows_share}\n\n    files = sorted(fw)\n\
  \    mods = defaultdict(list)\n    for p in files:\n        mods[module_of(p, depth)].append(p)\n\
  \    recent_by_mod = {m: sum(f_recent[p] for p in ps) for m, ps in mods.items()}\n\
  \    hot_cut = sorted(recent_by_mod.values())[int(len(recent_by_mod) * 0.75)] if\
  \ recent_by_mod else 0\n    out_mods, findings = [], []\n    for m in sorted(mods):\n\
  \        ps = mods[m]\n        aw = defaultdict(float)\n        for p in ps:\n \
  \           for a, v in fw[p].items():\n                aw[a] += v\n        tot\
  \ = sum(aw.values())\n        ranked = sorted(aw.items(), key=lambda x: -x[1])\n\
  \        acc, bf = 0.0, 0\n        for a, v in ranked:\n            acc += v; bf\
  \ += 1\n            if acc > tot / 2:\n                break\n        kn = set().union(*(knowers(p)\
  \ for p in ps))\n        act_kn = sorted(kn & active)\n        covered = sum(1 for\
