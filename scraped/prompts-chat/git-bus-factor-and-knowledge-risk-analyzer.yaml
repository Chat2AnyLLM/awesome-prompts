  \            \"settings\": {\"depth\": depth, \"active_days\": active_days, \"half_life_days\"\
  : half_life, \"knows_share\": knows_share},\n            \"findings\": findings}\n\
  \n\ndef render(a):\n    L = [\"# Knowledge risk report (as of %s)\" % a[\"as_of\"\
