  \n#!/usr/bin/env python3\n\"\"\"bus_factor.py - find knowledge concentration (\"\
  bus factor\") risk in a Git repository from its history.\n\nReads `git log --numstat`\
  \ history (from a saved log file or by running git on a repo), merges author\naliases,\
  \ skips bots, lockfiles and vendored code, and weights each change by lines touched\
  \ and how\nrecent it is. Per module (top-level folder by default) it reports who\
  \ holds the knowledge, the module\nbus factor (fewest people holding more than half\
  \ of it), whether any active person still knows it,\nand the repository truck factor\
  \ (how many people would have to leave before more than half of the\nfiles have\
  \ no active person who knows them). Standard library only.\n\nUsage:\n  python3\
  \ bus_factor.py LOGFILE [options]\n  python3 bus_factor.py --repo PATH [options]\
  \          (runs git log for you)\n  python3 bus_factor.py --self-test\nMake LOGFILE\
  \ with:\n  git log --no-merges --numstat --date=short --format='@@%H%x09%an%x09%ae%x09%ad'\
  \ > history.log\nOptions:\n  --aliases FILE       CSV alias,canonical  (alias =\
  \ an email or a name; canonical = the person's name)\n  --depth N            module\
  \ = first N folders of the path (default 1; root files = \"(root)\")\n  --since\
  \ YYYY-MM-DD   ignore older commits\n  --as-of YYYY-MM-DD   reference date (default:\
  \ newest commit in the log)\n  --active-days N      an author is active if they\
  \ committed within N days of --as-of (default 120)\n  --half-life-days N   a change\
  \ loses half its weight after N days (default 365)\n  --knows-share X      an author\
  \ \"knows\" a file when they hold at least X of its weight (default 0.25)\n  --exclude\
  \ GLOB       extra path pattern to skip (repeatable); defaults skip lockfiles, vendor,\
  \ dist, minified\n  --include-bots       keep authors whose name or email contains\
  \ [bot] or \"bot@\"\n  --json               machine-readable output\nExit codes:\
  \ 0 no high findings, 1 high findings, 2 bad input.\n\"\"\"\nimport csv, datetime\
  \ as dt, fnmatch, json, math, os, subprocess, sys\nfrom collections import defaultdict\n\
  \nDEFAULT_EXCLUDES = [\"*package-lock.json\", \"*yarn.lock\", \"*pnpm-lock.yaml\"\
  , \"*poetry.lock\", \"*Cargo.lock\", \"*go.sum\",\n                    \"*composer.lock\"\
  , \"*Gemfile.lock\", \"vendor/*\", \"*/vendor/*\", \"node_modules/*\", \"dist/*\"\
  ,\n                    \"build/*\", \"*.min.js\", \"*.min.css\", \"*.svg\", \"*.png\"\
  , \"*.jpg\", \"*.pdf\"]\nSEV = {\"BF01\": \"high\", \"BF02\": \"high\", \"BF03\"\
  : \"medium\", \"BF04\": \"medium\", \"BF05\": \"low\", \"BF06\": \"low\"}\nNAMES\
  \ = {\"BF01\": \"repository truck factor is 1 or 2\",\n         \"BF02\": \"orphaned\
  \ module: most files have no active person who knows them\",\n         \"BF03\"\
  : \"module bus factor 1: one person holds most of the knowledge\",\n         \"\
  BF04\": \"hot spot with a single knower (busy recently, one person)\",\n       \
  \  \"BF05\": \"possible duplicate identity (same name, different emails)\",\n  \
  \       \"BF06\": \"only one person has ever changed this module\"}\n\n\nclass InputError(Exception):\n\
  \    pass\n\n\ndef parse_date(s, what):\n    try:\n        return dt.date.fromisoformat(s.strip()[:10])\n\
  \    except (ValueError, AttributeError):\n        raise InputError(\"bad %s date:\
  \ %r\" % (what, s))\n\n\ndef parse_log(lines):\n    \"\"\"Return list of commits:\
  \ dict(sha, name, email, date, files=[(path, added, deleted)]).\"\"\"\n    commits,\
  \ cur = [], None\n    for n, raw in enumerate(lines, 1):\n        line = raw.rstrip(\"\
  \\n\")\n        if line.startswith(\"@@\"):\n            parts = line[2:].split(\"\
  \\t\")\n            if len(parts) < 4:\n                raise InputError(\"line\
  \ %d: header needs sha, name, email, date separated by tabs\" % n)\n           \
  \ cur = {\"sha\": parts[0], \"name\": parts[1].strip(), \"email\": parts[2].strip().lower(),\n\
  \                   \"date\": parse_date(parts[3], \"commit\"), \"files\": []}\n\
  \            commits.append(cur)\n        elif line.strip():\n            if cur\
  \ is None:\n                raise InputError(\"line %d: numstat line before any\
  \ @@ commit header (wrong --format?)\" % n)\n            parts = line.split(\"\\\
  t\")\n            if len(parts) != 3:\n                raise InputError(\"line %d:\
  \ expected 'added<TAB>deleted<TAB>path'\" % n)\n            a, d, path = parts\n\
  \            if a == \"-\" or d == \"-\":      # binary file\n                continue\n\
  \            path = path.strip()\n            if \" => \" in path:            #\
  \ rename: keep the new path\n                if \"{\" in path:\n               \
  \     pre, rest = path.split(\"{\", 1)\n                    mid, post = rest.split(\"\
  }\", 1)\n                    path = (pre + mid.split(\" => \")[1] + post).replace(\"\
  //\", \"/\")\n                else:\n                    path = path.split(\" =>\
  \ \")[1]\n            try:\n                cur[\"files\"].append((path, int(a),\
  \ int(d)))\n            except ValueError:\n                raise InputError(\"\
  line %d: added/deleted must be numbers\" % n)\n    if not commits:\n        raise\
  \ InputError(\"no commits found (expected lines starting with @@)\")\n    return\
  \ commits\n\n\ndef git_log(repo, since=None):\n    cmd = [\"git\", \"-C\", repo,\
  \ \"log\", \"--no-merges\", \"--numstat\", \"--date=short\", \"--format=@@%H%x09%an%x09%ae%x09%ad\"\
