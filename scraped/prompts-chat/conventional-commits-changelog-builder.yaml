  \ in r[\"findings\"]))\n    r = run(\"a1b2c3d fix: same\\nb2c3d4e fix: same\\n\"\
  )\n    t(\"duplicate listed once\", len(r[\"sections\"][\"Fixed\"]) == 1)\n    sec\
  \ = release_section(run(\"a1b2c3d feat: x\\n\"), \"2026-11-03\", \"https://github.com/o/r\"\
  )\n    t(\"compare link + date\", \"## [1.5.0] - 2026-11-03\" in sec and \"compare/v1.4.2...v1.5.0\"\
