  , new.index(\"## [Unreleased]\") < new.index(\"## [1.5.0]\") < new.index(\"## [1.4.2]\"\
  ))\n    try:\n        insert_into(\"## [1.5.0] - x\\n\", sec, \"1.5.0\"); ok = False\n\
