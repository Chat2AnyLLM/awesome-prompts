  nonconforming\"], st[\"merges\"], st[\"fixups\"]))\n    out.append(\"\")\n    if\
  \ r[\"current\"]:\n        out.append(\"**Version: %s -> %s (%s bump%s)**\" % (r[\"\
  current\"], r[\"next\"] or r[\"current\"], r[\"level\"] or \"no\",\n           \
  \        \", driven by \" + {\"major\": \"breaking changes\", \"minor\": \"new features\"\
  , \"patch\": \"fixes/perf\"}[r[\"level\"]] if r[\"level\"] else \"\"))\n    else:\n\
  \        out.append(\"**Suggested bump: %s** (pass --current X.Y.Z for the version\
  \ number)\" % (r[\"level\"] or \"none\"))\n    out.append(\"\")\n    out.append(\"\
  **Verdict: %s**\" % (\"%d high finding(s) - fix before tagging\" % len(high) if\
  \ high else \"ready to tag\"))\n    out += [\"\", \"## Release section (paste under\
  \ the Unreleased heading of CHANGELOG.md)\", \"\", \"```markdown\",\n          \
  \  release_section(r, args.date, args.repo_url, args.tag_prefix, args.include_internal).rstrip(),\
  \ \"```\", \"\"]\n    out += [\"## Findings\", \"\"]\n    if r[\"findings\"]:\n\
  \        out += [\"- **%s %s** %s\" % (s.upper(), c, m) for s, c, m in r[\"findings\"\
