  findings\"]))\n    t(\"feat removing -> Removed\", r[\"sections\"][\"Removed\"])\n\
  \    rec = \"abc1234\\x1ffeat(cli): new flag\\x1fBody text.\\n\\nBREAKING CHANGE:\
  \ --old is gone, use --new\\x1e\"\n    r = run(rec)\n    t(\"records format + footer\
  \ breaking\", r[\"breaking\"] and r[\"breaking\"][0][\"note\"].startswith(\"--old\"\
  ))\n    t(\"footer-only breaking is info not high\", not any(f[0] == \"high\" for\
  \ f in r[\"findings\"]))\n    t(\"0.x breaking -> minor\", bump_version(\"0.9.3\"\
  , \"major\") == \"0.10.0\")\n    r = run(\"a1b2c3d Fixed crash when saving\\nb2c3d4e\
  \ chore: tidy\\n\")\n    t(\"non-conforming flagged CC01\", any(f[1] == \"CC01\"\
  \ for f in r[\"findings\"]))\n    t(\"suggest drops 'Fixed' verb\", any(\"suggest:\
  \ fix: crash when saving\" in f[2] for f in r[\"findings\"]))\n    t(\"user-facing\
  \ non-conforming is high CC08\", any(f[1] == \"CC08\" and f[0] == \"high\" for f\
  \ in r[\"findings\"]))\n    r = run(\"a1b2c3d feature: dark mode\\n\")\n    t(\"\
  alias feature -> feat\", r[\"sections\"][\"Added\"] and any(f[1] == \"CC02\" for\
  \ f in r[\"findings\"]))\n    r = run(\"a1b2c3d fix:missing space\\n\")\n    t(\"\
  malformed spacing suggestion\", any(\"suggest: fix: missing space\" in f[2] for\
  \ f in r[\"findings\"]))\n    log = (\"commit 1111111aaaa\\nAuthor: A <a@x>\\nDate:\
  \   Mon\\n\\n    Revert \\\"feat: shiny\\\"\\n\\n    This reverts commit 2222222bbbb.\\\
  n\\n\"\n           \"commit 2222222bbbb\\nAuthor: A <a@x>\\nDate:   Mon\\n\\n  \
  \  feat: shiny\\n\")\n    r = run(log)\n    t(\"revert in range cancels both\",\
  \ not any(r[\"sections\"].values()) and any(f[1] == \"CC04\" for f in r[\"findings\"\
