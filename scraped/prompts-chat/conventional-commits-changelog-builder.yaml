  \    n = sum(1 for _, okk in tests if okk)\n    print(\"%d/%d passed\" % (n, len(tests)))\n\
  \    return 0 if n == len(tests) else 1\n\n\ndef main(argv=None):\n    ap = argparse.ArgumentParser(description=__doc__.split(\"\
  \\n\")[0])\n    ap.add_argument(\"commits\", nargs=\"?\")\n    ap.add_argument(\"\
