  \n            out.append(line)\n        out.append(\"\")\n    for s in SECTIONS:\n\
  \        items = sorted(r[\"sections\"][s], key=lambda e: (not e.get(\"breaking\"\
  ), (e.get(\"scope\") or \"~\").lower()))\n        if items:\n            out +=\
  \ [\"### \" + s, \"\"] + [fmt_entry(e, repo_url) for e in items] + [\"\"]\n    if\
  \ include_internal and r[\"internal\"]:\n        out += [\"### Internal\", \"\"\
  ] + [fmt_entry(e, repo_url) for e in r[\"internal\"]] + [\"\"]\n    if r[\"next\"\
  ] and repo_url and r[\"current\"]:\n        out.append(\"[%s]: %s/compare/%s%s...%s%s\"\
  \ % (ver, repo_url, tag_prefix, r[\"current\"].lstrip(\"v\"), tag_prefix, ver))\n\
  \        out.append(\"\")\n    return \"\\n\".join(out).rstrip() + \"\\n\"\n\n\n\
  def insert_into(changelog_text, section, version):\n    if version and re.search(r\"\
  ^## \\[%s\\]\" % re.escape(version), changelog_text, re.M):\n        raise InputError(\"\
  CHANGELOG already has a section for %s\" % version)\n    lines = changelog_text.split(\"\
  \\n\")\n    for i, l in enumerate(lines):\n        if re.match(r\"^## \\[Unreleased\\\
  ]\", l, re.I):\n            j = i + 1\n            while j < len(lines) and not\
  \ lines[j].startswith(\"## \"):\n                j += 1\n            leftover =\
  \ [x for x in lines[i + 1:j] if x.strip()]\n            new = lines[:i + 1] + [\"\
  \"] + section.rstrip(\"\\n\").split(\"\\n\") + [\"\"] + lines[j:]\n            return\
  \ \"\\n\".join(new), leftover\n    for i, l in enumerate(lines):\n        if l.startswith(\"\
  ## \"):\n            return \"\\n\".join(lines[:i] + section.rstrip(\"\\n\").split(\"\
  \\n\") + [\"\"] + lines[i:]), []\n    return changelog_text.rstrip(\"\\n\") + \"\
  \\n\\n\" + section, []\n\n\ndef report(r, args):\n    st = r[\"stats\"]\n    high\
  \ = [f for f in r[\"findings\"] if f[0] == \"high\"]\n    out = [\"# Changelog build:\
  \ %s\" % args.commits, \"\"]\n    out.append(\"%d commits read: %d Conventional\
  \ (%.1f%% of non-merge commits), %d non-conforming, %d merges, %d fixup/WIP.\" %\
