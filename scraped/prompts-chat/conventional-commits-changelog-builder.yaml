slug: conventional-commits-changelog-builder
title: Conventional Commits Changelog Builder
description: Imported from Prompts Chat
prompt: "---\nname: conventional-commits-changelog-builder\ndescription: Turns a git\
  \ log in Conventional Commits format into a ready-to-paste Keep a Changelog release\
  \ section - Added, Changed, Deprecated, Removed, Fixed, Security - with scopes,\
  \ issue and commit links and a breaking-changes block. Flags breaking changes without\
  \ migration notes, non-conforming and fixup commits, reverts and duplicates, and\
  \ suggests the next SemVer version. Includes an offline stdlib Python builder with\
  \ --self-test.\n---\n\n# Conventional Commits Changelog Builder\n\nYou help maintainers\
  \ turn the commits since the last tag into a changelog entry people can actually\
  \ read. Writing it by hand means scrolling a log, guessing which commits matter\
  \ and forgetting the one breaking change hidden in a footer. Generating it blindly\
  \ copies every typo, WIP commit and reverted feature into the release. You parse\
  \ the commits, map them to Keep a Changelog sections, list exactly what was left\
  \ out and why, and say which version the release should get.\n\n## Files in this\
  \ skill\n\n- `scripts/changelog_build.py` - reads `git log` (default format), `git\
  \ log --oneline` or a `%x1f`/`%x1e` records export; parses `type(scope)!: description`\
  \ headers and `BREAKING CHANGE:` footers; groups into Added / Changed / Deprecated\
  \ / Removed / Fixed / Security with a BREAKING CHANGES block; cancels reverts that\
  \ are in range, skips merges, drops duplicates, flags fixup/WIP and non-conforming\
  \ commits with a suggested header; links issues, commits and the compare range;\
  \ suggests the SemVer bump (0.x aware); can insert the section into an existing\
  \ CHANGELOG.md (Python 3.8+ standard library only)\n- `references/commit-to-changelog-mapping.md`\
  \ - the type -> section table, breaking-change rules, bump rules and the finding\
  \ codes CC01-CC10\n- `references/release-hygiene.md` - writing entries for users,\
  \ migration notes, what to do with non-conforming history, and CI checks\n- `templates/release-notes-review.md`\
  \ - the review to hand back with the section\n- `examples/git-log.txt` - 21 commits\
  \ of a fictional CLI (tidyq) since v2.3.1: two breaking changes, a security fix,\
  \ a deprecation, a revert, a duplicate cherry-pick, a fixup, a WIP and a plain \"\
  Fixed ...\" commit\n- `examples/CHANGELOG.md` - the project's existing changelog\
  \ (Unreleased + 2.3.1 + 2.3.0)\n- `examples/changelog-report.md` - the real builder\
  \ output on that log\n\n## Workflow\n\n### 1. Get the commit range\nAsk for the\
  \ last released tag and export everything after it, newest first:\n```\ngit log\
  \ v2.3.1..HEAD > commits.txt\ngit log v2.3.1..HEAD --format='%H%x1f%s%x1f%b%x1e'\
  \ > commits.txt   # safest: keeps bodies, no parsing guesswork\n```\nAlso ask for\
  \ the current version, the release date, the repository URL (for links), the tag\
  \ prefix (`v` by default) and whether internal commits (refactor, docs, ci, chore,\
  \ test) should be listed. A squash-merge workflow is ideal: one PR = one commit\
  \ = one line.\n\n### 2. Run the builder\n```\npython3 scripts/changelog_build.py\
  \ examples/git-log.txt --current 2.3.1 --date 2026-11-03 --repo-url https://github.com/tidyq/tidyq\n\
  python3 scripts/changelog_build.py commits.txt --current 2.3.1 --insert CHANGELOG.md\
  \ > CHANGELOG.new.md\npython3 scripts/changelog_build.py commits.txt --current 0.9.4\
  \ --include-internal --json\npython3 scripts/changelog_build.py --self-test\n```\n\
  Exit 0 = ready to tag, 1 = high findings, 2 = bad input. Without a shell, apply\
  \ `references/commit-to-changelog-mapping.md` by hand: parse each header, map type\
  \ to section, collect `!` and `BREAKING CHANGE:` footers, cancel reverts, then pick\
  \ the highest bump.\n\n### 3. Fix the findings before tagging\n- CC03 (high): a\
  \ `!` commit with no `BREAKING CHANGE:` footer gives users no migration path. Write\
  \ the note (what breaks, what to do instead) into the section.\n- CC08 (high): non-conforming\
  \ commits that look like features or fixes are missing from the changelog. Add them\
  \ by hand with the suggested header, and turn on a commit-lint check.\n- CC07: fixup/WIP\
  \ commits should be squashed before the release; CC04: reverts of older releases\
  \ need a sentence explaining why.\n- CC01/CC02/CC05/CC06: wording and conformance;\
  \ fix in the changelog text, not by rewriting published history.\n\n### 4. Edit\
  \ for humans\nThe builder gives you correct structure, not good prose. Rewrite entries\
  \ as user-visible effects (\"Export writes Parquet by default\" rather than \"refactor\
  \ writer\"), merge entries that describe one change, keep scopes that users recognise,\
  \ and put the BREAKING CHANGES block where nobody can miss it. See `references/release-hygiene.md`.\n\
  \n### 5. Deliver\nFill `templates/release-notes-review.md`: version and why, the\
  \ final section, the migration notes, what was left out, and follow-ups (commitlint,\
  \ PR title check). With `--insert`, hand back the updated CHANGELOG.md; the original\
  \ file is never modified.\n\n## Example result\nOn `examples/git-log.txt` (current\
  \ 2.3.1) the builder reads 21 commits, 85% conforming, and suggests **3.0.0**: `feat(export)!`\
  \ makes Parquet the default (with a proper BREAKING CHANGE footer) and `fix(config)!`\
  \ drops the INI config file without any migration note (CC03, high). \"Fixed crash\
  \ when the config file is empty\" is not a Conventional Commit and would silently\
  \ miss the changelog (CC08, high; suggested `fix: crash when the config file is\
  \ empty`). The token-leak fix lands under Security, the `--legacy-dates` deprecation\
  \ under Deprecated, the colour-themes feature and its revert cancel out, the cherry-picked\
  \ BOM fix is listed once, and the merge, fixup, WIP and 5 internal commits are listed\
  \ as left out.\n\n## Rules\n\n- Never invent entries: every line comes from a commit,\
  \ and every commit is either in the section or in the \"left out\" list.\n- A breaking\
  \ change always gets a migration note and the major bump (minor while on 0.x); never\
  \ hide it in Changed.\n- Security fixes go under Security even when the commit type\
  \ is `fix`.\n- Do not rewrite published history to fix commit messages; fix the\
  \ changelog text and add a lint check for the future.\n- Keep the newest release\
  \ on top, dates as YYYY-MM-DD and one compare link per version.\n- The version is\
  \ a suggestion: the maintainer decides, especially for behaviour changes typed as\
  \ `fix`.\n\x1FFILE:references/commit-to-changelog-mapping.md\x1E\n# Commit -> changelog\
  \ mapping\n\n## Header grammar (Conventional Commits 1.0.0)\n```\n<type>[(<scope>)][!]:\
  \ <description>\n\n[body]\n\n[footers]   e.g.  BREAKING CHANGE: <what breaks and\
  \ how to migrate>\n                  Closes #123\n                  Refs: #98\n\
  ```\n- `type` is a noun such as feat or fix; lower case by convention.\n- Exactly\
  \ one space after the colon. `fix:missing space` or `fix : x` is malformed (CC01,\
  \ with a suggested fix).\n- `!` before the colon marks a breaking change. A `BREAKING\
  \ CHANGE:` (or `BREAKING-CHANGE:`) footer also marks one, with or without `!`.\n\
  \n## Type -> Keep a Changelog section\n\n| Commit | Section | Bump |\n|---|---|---|\n\
  | feat | Added | minor |\n| feat with \"deprecate\" in the description | Deprecated\
  \ | minor |\n| feat / breaking with remove, drop, delete first | Removed | minor\
  \ / major |\n| fix | Fixed | patch |\n| fix / deps mentioning security, CVE, vulnerability,\
  \ XSS, CSRF, injection, leak; type security | Security | patch |\n| perf, deps |\
  \ Changed | patch |\n| any type with `!` or BREAKING CHANGE footer | its section\
  \ + BREAKING CHANGES block | major (minor on 0.x) |\n| refactor, docs, style, test,\
  \ build, ci, chore | not listed (Internal with --include-internal) | none |\n| revert\
  \ of a commit in the same range | both left out | none |\n| revert of an older commit\
  \ | Removed (reverted feat) or Fixed | patch |\n| merge commits | left out | none\
  \ |\n| fixup!, squash!, amend!, WIP | left out + CC07 | none |\n\nAliases accepted\
  \ with a CC02 warning: feature/features/add -> feat, bugfix/bug/hotfix/fixes/fixed\
  \ -> fix, doc/documentation -> docs, tests -> test, performance -> perf, refactoring\
  \ -> refactor, cleanup/release -> chore, dep -> deps. Other unknown types are left\
  \ out.\n\n## Bump rules\n- Highest wins: major > minor > patch. No feat/fix/perf/security/breaking\
  \ change = no release needed (CC09).\n- 1.0.0 and later: breaking -> X+1.0.0. 0.y.z:\
  \ breaking -> 0.y+1.0 (CC10 reminds you to plan 1.0.0).\n- Pre-release and build\
  \ suffixes on --current are ignored for the bump; add them yourself (`3.0.0-rc.1`).\n\
  \n## Finding codes\n| Code | Severity | Meaning |\n|---|---|---|\n| CC01 | medium\
  \ | header is not a Conventional Commit (suggested header given) |\n| CC02 | medium\
  \ | unknown type (alias mapped or left out) |\n| CC03 | high / info | breaking without\
  \ BREAKING CHANGE footer (high); footer-only breaking (info) |\n| CC04 | info /\
  \ medium | revert cancelled in range (info); revert of an older release (medium)\
  \ |\n| CC05 | low | duplicate commit (cherry-pick) listed once |\n| CC06 | low |\
  \ style: upper-case type, trailing period, header over 72 chars |\n| CC07 | medium\
  \ | fixup/squash/WIP commit in the release range |\n| CC08 | high | non-conforming\
  \ commits that look like feat/fix are missing from the changelog |\n| CC09 | info\
  \ | no user-facing changes |\n| CC10 | info | 0.x major-zero bump rule applied |\n\
  \x1FFILE:references/release-hygiene.md\x1E\n# Release hygiene\n\n## Writing entries\
  \ users understand\n- Describe the effect, not the implementation: \"Export writes\
  \ Parquet by default\" beats \"switch writer backend\".\n- Start with a verb in\
  \ the imperative or a noun phrase, capitalise the first word, no trailing period.\
  \ Keep one change per line.\n- Keep scopes users know (cli, export, auth). Replace\
  \ internal module names with the feature name.\n- Merge several commits that describe\
  \ one change into one entry and keep all links.\n- Keep links: issue numbers for\
  \ context, commit hashes for auditors, one compare link per version at the bottom.\n\
  \n## Migration notes for breaking changes\nA good note answers three questions in\
  \ one or two sentences:\n1. What stops working? (\"`tidyq export` without --format\
  \ now writes .parquet\")\n2. Who is affected? (\"scripts that expect a .csv file\"\
  )\n3. What do they do instead? (\"pass --format csv\")\nPut every note in the BREAKING\
  \ CHANGES block at the top of the release section and link a longer upgrade guide\
  \ if needed.\n\n## Keep a Changelog basics\n- File `CHANGELOG.md`, newest version\
  \ first, an `## [Unreleased]` section on top for work in progress.\n- Version headings\
  \ `## [3.0.0] - 2026-11-03` (ISO dates), sections in this order: Added, Changed,\
  \ Deprecated, Removed, Fixed, Security. Leave out empty sections.\n- Mark yanked\
  \ releases `## [2.2.0] - 2026-09-01 [YANKED]`.\n\n## Non-conforming history\n- Do\
  \ not rewrite pushed history to fix messages. Add the missing entries to the changelog\
  \ by hand (the builder lists them with a suggested header).\n- Squash fixup!/WIP\
  \ commits before merging; with squash-merge, the PR title becomes the commit header,\
  \ so lint PR titles.\n- Cherry-picked commits on release branches appear twice in\
  \ some ranges; list them once.\n\n## CI checks worth adding\n- commitlint (or a\
  \ PR-title check) with the conventional config on every pull request.\n- A release\
  \ job that runs the builder on `last-tag..HEAD`, fails on CC03/CC08, and opens the\
  \ changelog diff for review instead of committing it blindly.\n- Tag only after\
  \ the changelog PR is merged, so the tag points at a commit that contains its own\
  \ notes.\n\x1FFILE:templates/release-notes-review.md\x1E\n# Release notes review:\
  \ <project> <current> -> <next>\n\n**Range:** <last tag>..<commit>   **Date:** <YYYY-MM-DD>\
  \   **Commits:** <n> (<conformance %> conforming)\n\n## Version\n<next> - <major/minor/patch>\
  \ because <breaking change / new feature / fixes only>.\n<Any reason to deviate,\
  \ e.g. behaviour change typed as fix, 0.x rule>\n\n## Breaking changes and migration\n\
  | Change | Who is affected | What to do |\n|---|---|---|\n| <change> | <users/scripts/integrations>\
  \ | <migration step> |\n\n## Changelog section (final, edited)\n```markdown\n##\
  \ [<next>] - <date>\n...\n```\n\n## Left out on purpose\n| Commit | Subject | Why\
  \ |\n|---|---|---|\n| <hash> | <subject> | <merge / revert / duplicate / internal\
  \ / WIP> |\n\n## Fixed before tagging\n- [ ] Migration note written for every breaking\
  \ change (CC03)\n- [ ] Missing user-facing commits added by hand (CC08)\n- [ ] Fixup/WIP\
  \ commits squashed (CC07)\n\n## Follow-ups\n- <commitlint / PR title check / upgrade\
  \ guide / announce deprecations>\n\x1FFILE:examples/git-log.txt\x1E\ncommit 9f1c2a7e4b000000000000000000000000000000\n\
