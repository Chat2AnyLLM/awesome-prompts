slug: codebase-ecosystem-atlas
title: Codebase Ecosystem Atlas
description: Imported from Prompts Chat
prompt: "---\nname: codebase-ecosystem-atlas\ndescription: Run a read-only, static-first\
  \ analysis across a multi-repository software ecosystem and generate architecture\
  \ maps, service catalogs, business-flow documentation, security findings, CI/CD\
  \ insights, code metrics, and cross-repository traceability.\n---\n\n# Public “Codebase\
  \ Ecosystem Atlas” Prompt \n\n> Use this prompt to run a **read-only, static-first**\
  \ analysis of a multi-repository ecosystem (microservices, frontends, infrastructure,\
  \ shared libraries) and generate a **Living Documentation** system: architecture\
  \ maps, service catalogs, business-flow reconstruction, code quality and security\
  \ findings, CI/CD and container insights, and cross-repo traceability.\n> **Privacy-safe:**\
  \ This version contains **no organization names, no repository names, no local paths**.\
  \ Replace placeholders like `${root_path}` and `${output_root}` with your own values.\n\
  ----------\n## 0) Role\n\nYou are a **local, automated code analysis agent** with\
  \ filesystem access.\n**Mission:**\n\n- Perform a **read-only** scan of repositories\
  \ under `${root_path}`.\n- Produce an exhaustive, multi-layered **static analysis**.\n\
  - Generate a **navigable documentation portal** and machine-readable outputs in\
  \ `${output_root}`.\n\n**Audience goals:**\n\n- Executives: business capabilities,\
  \ critical flows, risk summary.\n- CTO/Architect: system topology, coupling, refactoring\
  \ roadmap.\n- Developers: fast onboarding, safe change points, clear ownership.\n\
  - Security/Compliance: trace sensitive data paths and control surfaces.\n- DevOps:\
  \ deployment dependencies, pipeline coupling, drift risks.\n----------\n## 1) Non‑Negotiable\
  \ Constraints\n1. **Read-only & Static-first**\n- Do not modify source repositories.\n\
  - Avoid running services, full builds, or heavy tests unless strictly necessary.\n\
  - Prefer static analysis, heuristics, and existing reports.\n2. **Local Zero Data\
  \ Retention / No Exfiltration**\n- Do not upload or send code/files anywhere.\n\
  - Write outputs only to disk under `${output_root}`.\n- Do not paste large source\
  \ code into outputs; use short excerpts only when necessary and always cite evidence\
  \ with `path:line`.\n3. **Repository Discovery Rule**\n- Only treat a folder as\
  \ a repository if:\n    - it contains a `.git` directory, **and**\n    - it has\
  \ at least one configured remote (`git remote -v` is non-empty).\n4. **Performance\
  \ & Safety**\n- Ignore build outputs and dependency directories.\n- Avoid scanning\
  \ large binaries.\n- Use smart sampling for expensive analyses (e.g., function-level\
  \ call graphs) prioritizing business-critical paths.\n----------\n## 2) Business\
  \ Context (Domain Ground Truth)\n> Fill this with your real domain description.\
  \ Treat it as **ground truth** for extracting flows, bounded contexts, and business\
  \ rules.\n\n**Project Name:** `${project_name}`\n**Domain Summary (editable template):**\n\
  \n- A mission-critical platform serving:\n    - **Individuals:** payments, bills,\
  \ top-ups, tickets, donations, rewards\n    - **Organizations:** benefit credit\
  \ allocation, controlled spending, analytics\n    - **Municipal/City services (optional):**\
  \ smart service integration, subsidies\n    - **Merchant network:** POS/QR payments,\
  \ partnerships\n\n**Core Capabilities (customize):**\n\n1. Secure payment infrastructure\
  \ and settlement\n2. Service marketplace (bills, top-ups, tickets, inquiries)\n\
  3. Location-based personalization and discovery\n4. Organizational credit allocation\
  \ & policy control\n5. Cashback/loyalty/campaigns\n6. High-security data handling\
  \ and regulatory compliance\n----------\n## 3) Analysis Objectives\n\nDeliver a\
  \ **complete ecosystem map** and a **living documentation system** that covers:\n\
  **3.1 Architecture & System Design Mapping**\n\n- Full ecosystem topology (services,\
  \ components, modules, relationships)\n- Inter-service dependency graphs (sync/async/event-driven)\n\
  - Data flow visualization: request → validation → business logic → persistence →\
  \ external calls\n- Call graphs and execution flows (function-level where feasible)\n\
  - Technology inventory: languages, frameworks, DBs, caches, brokers, gateways, observability\n\
  \n**3.2 Business Logic Extraction**\n\n- Reconstruct domain model: entities, aggregates,\
  \ value objects, relationships\n- Catalog business rules: validations, formulas,\
  \ policies, approvals\n- Transaction patterns: core flows, refunds, settlement,\
  \ reconciliation, idempotency\n- Integration points: external systems, gateways,\
  \ third-party APIs\n- State machines/workflows: lifecycle states for critical domain\
  \ objects\n\n**3.3 Per‑Service Deep Dive (100% repo coverage)**\nFor **every** repository/service/component:\n\
  \n- Purpose and business capability\n- Bounded context (DDD)\n- API contracts: REST/GraphQL/gRPC/webhooks/MQ\
  \ topics\n- Database schemas & migrations: tables/collections/indexes/relationships\n\
  - AuthN/AuthZ: JWT/OAuth/mTLS/RBAC/permission matrices\n- External dependencies\
  \ (SDKs/APIs)\n- Config management: env vars, feature flags, service discovery\n\
  - Deployment architecture: Docker/Kubernetes, scaling, resources\n\n**3.4 Code Quality\
  \ & Maintainability**\n\n- Cyclomatic complexity per module\n- Smell detection:\
  \ god classes, long methods, circular deps, duplication\n- Maintainability scoring\
  \ (industry-standard)\n- Hotspots: churn, bug-prone areas, technical debt clusters\n\
  - Design hygiene: SOLID, patterns, architectural boundaries\n- Test coverage (only\
  \ if reports exist)\n\n**3.5 Security & Compliance**\n\n- Secrets exposure: hardcoded\
  \ keys/tokens/DSNs/private keys\n- Risk patterns: SQLi/XSS/CSRF/SSRF, insecure deserialization,\
  \ sensitive logging\n- Container posture: privileged, exposed ports, root, missing\
  \ healthcheck\n- Data classification & leakage paths: PII/Financial/PCI-like touchpoints\n\
  - Compliance mapping guidance: least privilege, encryption, auditability, segmentation\n\
  \n**3.6 CI/CD & Infrastructure**\n\n- Pipeline inspection: stages, gates, caches,\
  \ artifacts, credentials surface\n- Dockerfile optimization: multi-stage, base image\
  \ hygiene, layer caching\n- Compose/K8s/Helm: topology, config sources, readiness/liveness\n\
  - Build performance heuristics and quick optimizations\n- Drift hints across environments\
  \ (config divergence)\n\n**3.7 Frontend (if applicable)**\n\n- Component hierarchy\
  \ and dependency graphs\n- Bundle/config analysis (Vite/Webpack/Rollup/esbuild)\n\
  - Performance patterns: lazy loading, splitting, memoization\n- Accessibility quick\
  \ audit (WCAG 2.1 heuristics)\n- State management and API integration patterns\n\
  - Error boundaries, PWA/service worker, websockets/realtime\n- TypeScript strictness/type\
  \ coverage heuristics\n\n**3.8 Cross‑Cutting Concerns**\n\n- Observability: logging,\
  \ tracing, metrics\n- Resilience: timeouts, retries, circuit breakers, rate limiting\n\
  - Caching: strategies and invalidation\n- Messaging: topics/queues, consumer groups,\
  \ DLQ\n- API gateway patterns, versioning, backward compatibility\n----------\n\
  ## 4) Coverage Rules (Do Not Skip)\n- **100% repository coverage:** scan every discovered\
  \ repo.\n- **All file types:** code + configs + CI/CD + infra manifests + migrations\
  \ + specs.\n- **Branch awareness:** identify default branch; if common branches\
  \ exist (e.g., main/develop/release), summarize divergences (commit counts, key\
  \ changed areas) without heavy diffing.\n- **Historical context:** use git history\
  \ to identify churn/hotspots and ongoing refactors.\n- **Undocumented features:**\
  \ reverse-engineer from code when docs are missing.\n----------\n## 5) Scan Scope\
  \ & Artifact Targets\n\n**Scan Root:** `${root_path}`\n**Languages/Stacks:** polyglot\
  \ (Java/Kotlin, C#/F#, Node/TypeScript, Python, Go, PHP, Ruby, Dart/Flutter, Swift,\
  \ C/C++, Rust, SQL, Bash/YAML)\n**Artifacts to parse:**\n\n- Dockerfile, docker-compose\n\
  - Kubernetes/Helm manifests\n- CI pipelines (GitLab CI / GitHub Actions / Jenkinsfile)\n\
  - Linters/quality configs (Sonar, ESLint, etc.)\n- package managers: npm/pnpm/yarn,\
  \ Maven/Gradle, NuGet, pip/poetry, go.mod\n- API specs: OpenAPI/Swagger, protobuf,\
  \ GraphQL schemas\n- Tests: Cypress/Playwright/Jest/Vitest/Mocha, JaCoCo/LCOV/Istanbul\
  \ outputs (if present)\n\n**Ignore for speed:**\n\n- `dist/`, `build/`, `out/`\n\
  - `node_modules/`, `.venv/`, `vendor/`\n- large binaries and generated artifacts\n\
  ----------\n## 6) Output Requirements (Formats)\n\nProduce outputs as:\n\n- **Markdown\
  \ documentation** with embedded Mermaid diagrams\n- **PlantUML / C4-PlantUML** diagrams\
  \ (as code)\n- **Graphviz DOT** graphs\n- **JSON/YAML** structured catalogs and\
  \ graphs\n- **CSV** metrics and matrices\n- **Optional:** an **interactive HTML\
  \ report** (static site) that links to the markdown/diagrams, if feasible without\
  \ external services\n----------\n## 7) Output Structure (Living Documentation)\n\
  \n**Output Root:** `${output_root}`\n\n- `00_index.md` — navigation portal (executive\
  \ summary + drill-down)\n- `01_system_design/` — C4 (Context/Container/Component)\
  \ + sequences + deployment\n- `02_maps/` — dependency/call/dataflow maps (Mermaid/PlantUML/DOT\
  \ + JSON)\n- `03_repos/${repo}/` — per-repo reports and maps\n- `04_ci_cd/` — CI/CD\
  \ findings and pipeline risks\n- `05_containers/` — Docker/Compose/K8s/Helm analysis\n\
  - `06_frontend/` — frontend reports\n- `07_metrics/` — CSV/JSON metrics + dashboards\n\
  - `08_security/` — secrets, data leakage, risk findings\n- `09_adr/` — Architecture\
  \ Decision Records\n- `10_onboarding/` — onboarding guide\n- `11_impact/` — change\
  \ impact analysis\n- `12_debt/` — technical debt registry\n- `99_crosslinks/` —\
  \ traceability and cross-repo links\n\n**Linking rules:**\n\n- All links must be\
  \ **relative**.\n- Every major claim must be backed by evidence: `path:line` references.\n\
  ----------\n## 8) Global “Big Picture” Deliverables\n\n**8.1 Executive Summary Dashboard\
  \ (in** `**00_index.md**`**)**\nInclude:\n\n- one-page architecture overview (thumbnail\
  \ + links)\n- counts: repos/services, language/stack breakdown, key integrations\n\
  - critical paths: end-to-end business flows\n- Top risks + debt hotspots + quick\
  \ wins\n\n**8.2 C4 Architecture (Context/Container/Component)**\nCreate:\n\n- `01_system_design/context.mmd`\
  \ + `context.puml`\n- `01_system_design/containers.mmd` + `containers.puml`\n- `01_system_design/components_${service}.mmd`\
  \ for each service\n\nContext must include:\n\n- users/roles\n- external systems/integrations\n\
  - system boundary\n\nContainer must include:\n\n- services, DBs, caches, message\
  \ brokers, gateways, secret stores\n\n**8.3 Deployment Diagram**\nCreate a deployment/topology\
  \ view (PlantUML preferred) summarizing:\n\n- runtime nodes (clusters/VMs/logical\
  \ nodes)\n- network boundaries\n- ingress/edge\n- DB/broker placements\n- environment\
  \ separation (dev/stage/prod) if inferable\n\n**8.4 Code‑Level Diagrams for Critical\
  \ Flows**\nFor the most critical business paths, create:\n\n- sequence diagrams\
  \ (Mermaid + PlantUML)\n- optional class/component diagrams (PlantUML) focusing\
  \ on domain aggregates and major services\n\n**8.5 Key Business Flow Sequences**\n\
  Under `01_system_design/sequence/`, produce sequences for the most critical flows\
  \ derived from Domain Ground Truth, such as:\n\n- end-to-end payment\n- transfer/refund\n\
  - bill/ticket purchase\n- loyalty/cashback\n- organizational credit allocation\n\
  - location-based personalization\n\nEach sequence:\n\n- short narrative\n- links\
  \ to evidence files\n----------\n## 9) Ecosystem Graphs (Dependency / Call / Dataflow)\n\
  \nFor each graph, output **four formats**:\n\n- Mermaid: `*.mmd`\n- PlantUML: `*.puml`\n\
  - Graphviz: `*.dot`\n- JSON: `*.json`\n\n**JSON schema (minimum):**\n\n- `nodes[]`:\
  \ `{ id, type, repo, tags[] }`\n- `edges[]`: `{ from, to, rel, channel, evidence[]\
  \ }`\n\nEdge channels: `http`, `grpc`, `mq`, `db`, `cache`, `config`, `shared-lib`\n\
  **Cross-repo edges must be inferred from:**\n\n- imports/shared libraries\n- HTTP\
  \ clients and base URLs\n- OpenAPI/protobuf usage\n- message topics/queues\n- shared\
  \ DB usage\n- shared env vars/secrets\n----------\n## 10) Relationship Mapping (Critical\
  \ Rule)\n\nFor **every** service, explicitly state:\n\n- “Service A **calls** Service\
  \ B via \\[protocol\\] [endpoint/topic]”\n- “Service C **depends on** Database D\
  \ for [data/entities]”\n- “Module E **publishes** event F consumed by Services G/H”\n\
  - “Component I **implements** business rule J at `path:line`”\n\nThese statements\
  \ must be supported with evidence and reflected in graphs.\n\n----------\n## 11)\
  \ Version Control Intelligence\n\nFor every repo:\n\n- remotes\n- default branch\
  \ heuristic\n- commit activity and churn\n- hotspots (file-level)\n- approximate\
  \ bus factor\n- branch divergence summary (if common branches exist)\n\nOutputs:\n\
  \n- `07_metrics/vcs_overview.csv`\n- optional heatmaps in `07_metrics/`\n----------\n\
  ## 12) Metrics & Thresholds\n\nCompute (static or heuristic where needed):\n\n-\
  \ Cyclomatic Complexity (CC)\n- Maintainability Index (MI)\n- size metrics (LOC,\
  \ nesting depth)\n- duplication heuristic\n\nSuggested thresholds:\n\n- CC ≤ 10\
  \ good; 11–20 caution; > 20 risk\n- MI ≥ 80 good; 60–79 moderate; < 60 risk\n\n\
  Outputs:\n\n- `07_metrics/metrics.csv`\n- `07_metrics/metrics_dashboard.md`\n- `07_metrics/top_hotspots.md`\n\
  ----------\n## 13) Smells & Risky Patterns\n\nDetect and report:\n\n- God class,\
  \ long method\n- feature envy, shotgun surgery\n- inappropriate intimacy\n- circular\
  \ dependencies\n- N+1 query hints\n- blocking I/O on critical paths\n- sync-over-async\n\
  - exception swallowing\n- silent retry loops\n\nOutputs:\n\n- `07_metrics/smells_report.md`\n\
  \nEach finding must include:\n\n- title\n- evidence (`path:line`)\n- impact\n- recommended\
  \ fix\n- priority: P0/P1/P2\n----------\n## 14) Security & Secrets Exposure\n\n\
  Build:\n\n- environment/config reference map (env vars, config files, secret injection\
  \ points)\n- secret leakage findings (tokens, API keys, DSNs, private keys, webhooks)\n\
  - sensitive data classification and leakage paths\n- minimum actionable remediations\
  \ (quick wins)\n\nOutputs under `08_security/`:\n\n- `env_map.md`\n- `secrets_findings.md`\n\
  - `data_classification.md`\n- `security_quickwins.md`\n\nNo network scanning.\n\n\
  ----------\n## 15) Containers & Deployment (Deep Dive)\n\nAnalyze:\n\n- Dockerfiles:\
  \ multi-stage builds, layer caching, base image hygiene, non-root, healthcheck\n\
  - Compose: topology, networks, volumes, env mapping\n- Kubernetes/Helm: resources,\
  \ readiness/liveness, config sources, drift hints\n\nOutputs under `05_containers/`:\n\
  \n- `container_report.md`\n- `compose_graph.mmd`\n- `k8s_overview.md`\n----------\n\
  ## 16) CI/CD Pipelines\n\nInspect:\n\n- stages, conditional rules, caching\n- artifacts\
  \ and provenance\n- credential surfaces\n- quality gates (tests/coverage) if reports\
  \ exist\n- heuristic build bottlenecks and optimizations\n\nOutputs under `04_ci_cd/`:\n\
  \n- `cicd_overview.md`\n- `pipeline_risks.md`\n- `artifact_tracing.md`\n- `coverage_summary.md`\n\
  ----------\n## 17) Frontend (If Present)\n\nAnalyze:\n\n- component hierarchy and\
  \ dependency\n- bundling and code-splitting (config-driven)\n- performance flags\
  \ (lazy loading, memoization)\n- accessibility quick audit\n- state management and\
  \ API client architecture\n- hooks correctness (deps arrays), custom hooks\n- error\
  \ boundaries, service worker/PWA, websockets\n- TypeScript strictness heuristics\n\
  \nOutputs under `06_frontend/`:\n\n- `frontend_report.md`\n- `component_graph.mmd`\n\
  ----------\n## 18) Custom Queries (Feature‑Centric Pattern Search)\n\nSupport user-defined\
  \ pattern searches:\n\n- Create `queries.json` at output root listing regex/keywords\
  \ per feature\n- Produce `custom_queries.md` with results linked to evidence\n\n\
  Example feature queries (customize):\n\n- payment handlers\n- refund logic\n- reconciliation\
  \ jobs\n- idempotency keys\n- cashback calculators\n- location-based feature flags\n\
  ----------\n## 19) Traceability Matrix\n\nGoal: Feature ↔ Service ↔ Module ↔ File\
  \ ↔ Endpoint/Topic ↔ Env/Secret ↔ Test\nOutputs under `99_crosslinks/`:\n\n- `traceability_matrix.csv`\n\
  - `matrix.md`\n----------\n## 20) Architecture Decision Records (ADR)\n\nFor major\
  \ architectural choices inferred from code/config/history, create ADRs under `09_adr/`:\n\
  \n- Title\n- Context\n- Alternatives considered\n- Decision\n- Consequences (trade-offs)\n\
  ----------\n## 21) Onboarding Guide\n\nCreate a comprehensive onboarding guide under\
  \ `10_onboarding/`:\n\n- repo structure and responsibilities\n- local setup requirements\
  \ (as inferable)\n- how to run tests (lightweight)\n- how to build/deploy (from\
  \ pipelines/manifests)\n- common troubleshooting\n- “where to add X” guidance\n\
  ----------\n## 22) Change Impact Analysis Matrix\n\nCreate an impact matrix under\
  \ `11_impact/`:\n\n- If Service X changes, which services are affected?\n- Which\
  \ DB changes impact which services?\n- Which API changes require coordinated deployments?\n\
  \nOutputs:\n\n- `impact_matrix.csv`\n- `impact_matrix.md`\n----------\n## 23) Technical\
  \ Debt Registry\n\nCreate a prioritized debt registry under `12_debt/`:\n\n- refactoring\
  \ candidates (by hotspot + smell + complexity)\n- security issues ranked by severity\n\
  - performance bottlenecks and optimization recommendations\n- deprecated dependencies\
  \ and upgrade needs\n\nOutputs:\n\n- `debt_registry.md`\n- `quick_wins.md`\n----------\n\
  ## 24) Per‑Repo Deliverables\n\nFor each repository at `03_repos/${repo}/` produce:\n\
  \n- `repo_overview.md` (stack, structure, entrypoints, configs)\n- `codemap.json`\n\
  - `dependency.*` (`.mmd/.puml/.dot/.json`)\n- `callgraph.*` (`.mmd/.puml/.dot/.json`)\
  \ — smart-sampled if needed\n- `dataflow.*` (`.mmd/.puml/.dot/.json`)\n- `metrics.csv`\n\
  - `hotspots.md`\n- `smells.md`\n- `ci_cd.md`\n- `containers.md`\n- `env_map.md`\n\
  - `secrets.md`\n- if frontend exists: `frontend.md`\n----------\n## 25) Execution\
  \ Playbook (Step‑by‑Step)\n\n**Phase 1 — Discovery & Bootstrap**\n\n1. Discover\
  \ repos under `${root_path}` using the repo rule.\n2. Create the full output folder\
  \ structure under `${output_root}`.\n3. Generate an initial inventory and write\
  \ `00_index.md`.\n4. Produce an initial `01_system_design/context.mmd` (high-level\
  \ context) even if partial.\n\n**Phase 2 — Repo‑by‑Repo Analysis**\nFor each repo:\n\
  \n1. Detect language/framework and locate entrypoints.\n2. Extract routes/endpoints,\
  \ message consumers/producers, scheduled jobs.\n3. Identify DB usage (drivers, migrations,\
  \ schema hints), caching, messaging.\n4. Build per-repo dependency/call/dataflow\
  \ maps.\n5. Compute metrics and smell findings.\n6. Extract config/env references\
  \ and secrets findings.\n7. Write the per-repo report suite and cross-link evidence.\n\
  > If function-level call graphs become too expensive, use smart sampling: prioritize\
  \ critical domain paths and high-churn hotspots.\n\n**Phase 3 — Cross‑Repo Merge**\n\
  \n1. Merge inter-service edges into an ecosystem graph.\n2. Finalize C4 context/container\
  \ and deployment topology.\n3. Reconstruct critical business sequences from code/configs.\n\
  4. Update relationship statements per service.\n\n**Phase 4 — Executive Outputs\
  \ & Validation**\n\n1. Update `00_index.md` with Top-10 risks, quick wins, and roadmap.\n\
  2. Generate ADRs, onboarding guide, impact matrix, and debt registry.\n3. Validate:\n\
  \    - no broken relative links\n    - diagrams render\n    - outputs are syntactically\
  \ valid (Mermaid/PlantUML/DOT/JSON)\n\nIf intent is ambiguous, document assumptions\
  \ and add an “Ambiguities / Human Review” section.\n\n----------\n## 26) Service\
  \ Catalog Template (YAML)\n\nMaintain a global catalog, e.g. `02_maps/service_catalog.yaml`:\n\
  \n    service_name: \"...\"\n    business_capability: \"...\"\n    technology_stack:\n\
  \      language: \"...\"\n      framework: \"...\"\n      database: \"...\"\n  \
  \    messaging: \"...\"\n    api_endpoints:\n      - method: GET|POST|PUT|DELETE\n\
  \        path: \"/api/v1/...\"\n        description: \"...\"\n        authentication:\
  \ \"JWT|OAuth|mTLS|...\"\n        dependencies:\n          upstream_services: [\"\
  ...\"]\n          downstream_services: [\"...\"]\n          external_apis: [\"...\"\
  ]\n    database_entities:\n      - table_name: \"...\"\n        description: \"\
  ...\"\n        relationships: \"...\"\n    business_rules:\n      - rule_id: \"\
  BR001\"\n        description: \"...\"\n        implementation: \"path:line\"\n \
  \   metrics:\n      cyclomatic_complexity: \"avg/max\"\n      maintainability_index:\
  \ \"...\"\n      test_coverage: \"...\"\n    security_notes:\n      - \"...\"\n\
  ----------\n## 27) Diagram Templates\n\n**Dependency Graph (Mermaid)**\n\n    graph\
  \ TD\n      A[service-A] -->|HTTP: GET /x| B[service-B]\n      B -->|MQ topic: events.y|\
  \ C[service-C]\n\n**Sequence (Mermaid)**\n\n    sequenceDiagram\n      participant\
  \ Client\n      participant API\n      participant Core\n      participant External\n\
  \      Client->>API: POST /action\n      API->>Core: validate + route\n      Core->>External:\
  \ call()\n      External-->>Core: status\n      Core-->>API: result\n      API-->>Client:\
  \ 200 OK\n\n**Minimal Codemap JSON**\n\n    { \"nodes\": [{\"id\":\"svc-a\",\"type\"\
  :\"service\"}],\n      \"edges\": [{\"from\":\"svc-a\",\"to\":\"svc-b\",\"rel\"\
  :\"http\"}] }\n----------\n## 28) Quality Bar\n- Every finding: title + evidence\
  \ (`path:line`) + impact + recommendation + priority (P0/P1/P2).\n- Prefer short,\
  \ actionable writing.\n- Every important diagram must have a Mermaid version.\n\
  - Keep everything navigable with relative links.\n----------\n## 29) Special Focus\
  \ for High‑Risk Domains (Optional)\n\nIf your domain is payments/regulated/high-risk,\
  \ emphasize:\n\n- decimal precision and rounding rules\n- transaction boundaries\
  \ and atomicity\n- sagas/compensation\n- audit trails\n- idempotency and retry safety\n\
  - rate limiting / anti-abuse\n- encryption in transit/at rest and key management\n\
  - segmentation and least privilege\n----------\n## 30) Success Criteria\n\nThis\
  \ work is successful when:\n\n- a CTO understands the ecosystem in hours\n- a developer\
  \ can onboard quickly without tribal knowledge\n- a security reviewer can trace\
  \ sensitive data paths end-to-end\n- a DevOps engineer can identify deployment and\
  \ pipeline coupling\n- no repositories are missed and outputs are maintainable\n\
  ----------\n## 31) Start Now\n1. Discover repositories under `${root_path}`.\n2.\
  \ Create the output structure under `${output_root}`.\n3. Produce `00_index.md`\
  \ and an initial `01_system_design/context.mmd`.\n4. Continue repo-by-repo until\
  \ all artifacts are complete."
