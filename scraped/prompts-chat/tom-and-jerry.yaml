prompt: "*STORYLINE: \"The House Sitter’s Big Day\"* \n_7 scenes, about 45-60 seconds\
  \ total if you make it as a series_\n\n*Scene 1: The Calm Before Chaos*  \nIt’s\
  \ a quiet Sunday morning. The humans left the house with a note: \"Be good. No chasing.\"\
  \  \nJerry is having breakfast - tiny toast, milk, and a strawberry.  \nTom is sleeping\
  \ in a sun spot, dreaming of fish. Everything is peaceful for 5 minutes... too peaceful.\n\
  \n*Scene 2: The Temptation*  \nJerry finds a GIANT cheese wheel in the fridge. It’s\
  \ meant for the house party tonight.  \nHis eyes turn into hearts. He tries to roll\
  \ it out but it’s too big.  \nTom wakes up from the smell. He sees the cheese too.\
  \ Now both of them want it, but for different reasons.  \nJerry: \"Mine for snacks!\"\
  \  \nTom: \"Mine to frame the mouse!\"\n\n*Scene 3: The First Chase - The Hallway*\
  \  \nClassic chase starts. Jerry leads Tom through the house.  \nTom crashes into\
  \ a laundry basket and comes out wearing socks on his head.  \nJerry slides down\
  \ the stairs on a cookie tray like a skateboard.  \nThey end up in the living room,\
  \ both panting.\n\n*Scene 4: Team Up Twist*  \nSuddenly the doorbell rings. It’s\
  \ the neighbor’s big, scary dog who always steals food.  \nThe dog sniffs and goes\
  \ straight for the cheese wheel in the kitchen.  \nTom and Jerry look at each other\
  \ like \"Wait... not today.\"  \nFor the first time, they team up. No words. Just\
  \ nods.\n\n*Scene 5: The Plan*  \nJerry is the brain. Tom is the muscle.  \nJerry\
  \ ties a rope to a chandelier. Tom pretends to be scared and lures the dog in. \
  \ \nJerry drops a pile of pillows, then a bucket of water, then finally the rope\
  \ swings and launches a bunch of balloons.  \nThe dog gets scared, slips, and runs\
  \ out the door howling.\n\n*Scene 6: The Heart Moment*  \nSilence. Cheese is safe.\
  \  \nTom is tired, sitting on the floor. Jerry brings him a small piece of cheese\
  \ on a leaf.  \nTom looks surprised. Jerry shrugs like \"You helped.\"  \nThey sit\
  \ together and eat, watching cartoons on TV. No chasing. Just vibes.\n\n*Scene 7:\
  \ The Sweet Ending*  \nHumans come back. The house is clean. The cheese is still\
  \ there.  \nThe note now has a paw print and a tiny mouse footprint added under\
  \ \"Be good.\"  \nLast shot: Tom and Jerry are both asleep in the sun spot, leaning\
  \ on each other.  \nText fades in: `Even rivals can be friends sometimes ❤️`"
