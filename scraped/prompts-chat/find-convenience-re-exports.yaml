slug: find-convenience-re-exports
title: Find convenience re-exports
description: Imported from Prompts Chat
prompt: "Find convenience re-exports in <package>: `export * from` and `export { X\
  \ } from` statements that forward symbols owned by another workspace package.\n\n\
  For each re-export:\n\n- Name the owning package. Say whether the re-export forces\
  \ consumers to install or build that package when they would not otherwise need\
  \ it.\n- Count consumers with `git grep` and note which ones already depend on the\
  \ owning package.\n- Classify it:\n  (a) Type-only. Usually keep it, because it\
  \ has no runtime cost.\n  (b) A runtime value with few consumers. Remove it and\
  \ point consumers at the owner.\n  (c) Real code that only looks like a re-export.\
  \ Keep it.\n  (d) Many consumers. Defer it to its own PR.\n\nProduce a table with\
  \ these columns: symbol, owner, consumers, classification, recommended action. Do\
  \ not edit any files yet."
