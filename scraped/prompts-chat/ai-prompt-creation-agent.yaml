description: Imported from Prompts Chat
prompt: '### 1. Short business concept prompt

  > Help me describe a 3D-printing center in AlUla that helps local residents and
  businesses produce, improve, and sell their products. We have MINGDA printers, such
  as the MD-1000 Pro, and Creality K1/K1 Max printers. Write a clear, compelling description
  for potential customers and partners. Do not assume printer capabilities that I
  have not provided.


  ### 2. Detailed business plan prompt

  > Develop a practical business plan for a 3D-printing service center in AlUla, Saudi
  Arabia. The center will use MINGDA printers, including the MD-1000 Pro, and Creality
  K1/K1 Max printers to help residents and nearby communities prototype, manufacture,
  and prepare products for sale. Include target customer groups, services, operating
  workflow, pricing principles, startup and operating cost categories, partnerships,
  sales channels, risks, and a 90-day launch plan. Clearly label assumptions and list
  the information I still need to provide.


  ### 3. Product development prompt

  > Act as a product-development advisor for a 3D-printing workshop in AlUla. Suggest
  15 product ideas that local makers could prototype and potentially sell, inspired
  by local needs, culture, tourism, crafts, and everyday life. For each idea, describe
  its likely customer, the problem it solves, a possible material or production consideration,
  and a low-cost way to test demand. Avoid presenting cultural motifs as generic decoration;
  recommend respectful collaboration with local creators.


  ### 4. Community-focused service prompt

  > Design an accessible service offering for residents, artisans, students, and small
  businesses in AlUla and nearby areas who want to use a 3D-printing center. Propose
  service levels for one-off prototypes, small production runs, and help preparing
  a product for market. Explain how to make pricing competitive and transparent without
  promising prices before material, design, and production costs are known.


  ### 5. Brand and positioning prompt

  > Create three distinct brand-positioning directions for a 3D-printing center based
  in AlUla. The center helps local people turn ideas into prototypes and market-ready
  products, and supports both local and international promotion. For each direction,
  suggest a brand promise, audience, tone of voice, tagline, and a short “About us”
  paragraph. Keep the language credible, welcoming, and grounded in local collaboration.


  ### 6. Marketing campaign prompt

  > Create a 30-day launch marketing plan for a new 3D-printing service center in
  AlUla. The goal is to attract local makers, small businesses, schools, and product
  creators. Include weekly themes, social media post ideas, a simple call to action
  for each post, community outreach activities, and a way to measure interest. Provide
  versions suitable for Instagram and LinkedIn, and do not claim services or technical
  capabilities that have not been confirmed.


  ### 7. Partnership outreach prompt

  > Draft a warm, professional partnership email introducing our AlUla 3D-printing
  center to **[organization, school, artisan group, or business]**. Explain how we
  could help members prototype or produce small batches of products, propose one practical
  pilot project, and invite them to a short meeting. Keep the message concise and
  avoid making unsupported claims.


  ### 8. Investor or sponsor pitch prompt

  > Write a short pitch for a potential sponsor or partner describing a 3D-printing
  center in AlUla. Explain the community opportunity, how the center can help local
  makers develop products, how it could generate revenue, and what support we are
  seeking: **[funding, materials, training, workspace, or partnerships]**. Use a persuasive
  but realistic tone, distinguish confirmed facts from plans, and end with a specific
  next step.


  For the strongest results, add your actual services, printer build volumes, materials,
  team experience, location, budget, and intended customer groups.'
