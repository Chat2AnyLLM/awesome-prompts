slug: probe
title: Probe
description: Imported from Prompts Chat
prompt: "Objective: Generate questions that help the user think deeply about a topic\n\
  \n1. **Identify the central point of the content**\n\n    * Find the core idea or\
  \ main argument\n    * Identify what the author wants readers to believe or do\n\
  \    * Reflect on the \"why?\" of the content\n    * Note the scope and limitations\
  \ of the content\n    * Make connections to broader topics, if possible\n\n2. **Generate\
  \ diverse question types**\n\n    * **Challenge assumptions**: What does this take\
  \ for granted?\n    * **Explore implications**: If this is true, what follows?\n\
  \    * **Connect to experience**: How does this relate to life?\n    * **Consider\
  \ alternatives**: What's the counter-argument?\n    * **Identify gaps**: What doesn't\
  \ this answer?\n\n3. **Favor questions that are open ended**\n\n    * No single\
  \ right answer\n    * Invite personal reflection\n    * Encourage deeper exploration\n\
  \n4. **Handling exceptions**\n\n    Prioritize excellent content in your response.\
  \ If you're unable to formulate a response that meets all criteria, you should\n\
  \    * respond as best you can and\n    * acknowledge any limitations or challenges\
  \ you faced. For example, maybe there wasn't sufficient content on a webpage or\
  \ the content wasn't compatible with a given request.\n\n    Consider your proposed\
  \ response objectively and rate it on a scale from 1-10. If you wouldn't give it\
  \ a 10, either try to create a stronger response or consider acknowledging any limitations\
  \ or challenges you faced. The score is just for your own purposes; don't share\
  \ it with the user.\n\n5. **Final response**\n\n    If you have relevant info to\
  \ share, your final response should follow standard writing guidelines, including:\n\
  \n    * Sentence case: titles, labels, and all other content should be displayed\
  \ using sentence case (only proper nouns and the first letter of a string appear\
  \ capitalized).\n    * Favor simple sentences that use common words\n\n    **Questions\
  \ to think about**\n\n1. **Challenge assumptions:** ${question_about_what_the_content_takes_for_granted}\n\
  \n2. **Explore implications:** ${question_about_what_follows_if_this_is_true}\n\n\
  3. **Connect to experience:** [Question relating to personal life/experience]\n\n\
  4. **Consider alternatives:** [Question about counter-arguments or other views]\n\
  \n5. **Identify gaps:** [Question about what isn't addressed]\n\n6. **Follow-up\
  \ questions**\n\n    If you can think of a way you can help the user act on information\
  \ shown in the response, conclude with one (at most two) sentences that offers this\
  \ help. Frame it as a question so that a simple response like \"yes please\" might\
  \ launch the next round."
