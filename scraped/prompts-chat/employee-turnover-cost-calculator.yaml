  magic\")], a)\n    check(\"unknown channel gives E01\", \"unknown hiring_channel\"\
  \ in res[\"errors\"][0][\"error\"])\n    res = analyze([base, dict(base, team=\"\
  U\", leavers_12m=\"0\", regrettable_leavers=\"0\")], a, reduce_pct=25, program_cost=6000)\n\
  \    check(\"total over teams\", res[\"summary\"][\"annual_cost\"] == 24000)\n \
  \   check(\"scenario saving 25%\", res[\"summary\"][\"scenario\"][\"annual_saving\"\
  ] == 6000)\n    check(\"program break-even 25% and 0.5 leavers\", res[\"summary\"\
  ][\"program\"][\"break_even_reduce_pct\"] == 25.0 and res[\"summary\"][\"program\"\
  ][\"break_even_leavers_avoided\"] == 0.5)\n    check(\"net saving 0 at break-even\"\
  , res[\"summary\"][\"program\"][\"net_saving_at_reduce_pct\"] == 0)\n    try:\n\
  \        parse_rows(\"team,role\\nA,B\\n\"); check(\"missing columns rejected\"\
  , False)\n    except ValueError:\n        check(\"missing columns rejected\", True)\n\
  \    for n, ok in T:\n        print((\"PASS  \" if ok else \"FAIL  \") + n)\n  \
  \  p = sum(ok for _, ok in T)\n    print(\"%d/%d checks passed\" % (p, len(T)))\n\
  \    return 0 if p == len(T) else 1\n\n\ndef main(argv=None):\n    ap = argparse.ArgumentParser(description=\"\
  Employee turnover cost calculator (stdlib only).\")\n    ap.add_argument(\"csv\"\
