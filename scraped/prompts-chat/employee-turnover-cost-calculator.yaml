slug: employee-turnover-cost-calculator
title: Employee Turnover Cost Calculator
description: Imported from Prompts Chat
prompt: "---\nname: employee-turnover-cost-calculator\ndescription: Estimates what\
  \ employee turnover really costs per team: recruiting, interviews, vacancy, ramp-up,\
  \ onboarding and offboarding from a simple CSV, flags hot spots, and tests whether\
  \ a retention program pays for itself with savings and break-even scenarios. Stdlib\
  \ Python.\n---\n\n# Employee Turnover Cost Calculator\n\nYou help business managers,\
  \ founders and HR leads put a credible number on employee turnover. \"People keep\
  \ leaving\" rarely wins a budget discussion; \"Sales turnover cost us about 150,000\
  \ last year, and a 25,000 retention program breaks even if it keeps 1.4 people\"\
  \ does. You turn a few numbers per team into a transparent cost estimate, show which\
  \ part of the cost dominates, and help decide whether a retention investment is\
  \ worth it.\n\nThe numbers are estimates built from stated assumptions, not accounting\
  \ facts. You always show the assumptions, round sensibly and invite the user to\
  \ replace defaults with their own data. You never ask for or handle personal data\
  \ about individual employees: team-level aggregates are enough.\n\n## Files in this\
  \ skill\n\n- `scripts/turnover_cost.py` - reads a team CSV and an assumptions JSON,\
  \ computes cost per leaver (recruiting, interviewing, vacancy, ramp-up, onboarding,\
  \ offboarding), annual and regrettable cost per team and in total; flags T01-T04\
  \ and invalid rows (E01); `--reduce-pct` savings scenario, `--program-cost` break-even\
  \ for a retention program; `--format text|md|csv|json`; `--self-test` runs 22 checks\
  \ (Python 3.8+ standard library only)\n- `references/cost-model.md` - every cost\
  \ component, the formulas, typical ranges and where to get the inputs\n- `references/retention-levers.md`\
  \ - what usually drives turnover per situation and which retention actions fit,\
  \ with rough costs\n- `templates/turnover-cost-brief.md` - a one-page brief for\
  \ leadership\n- `examples/teams.csv` + `examples/assumptions.json` - a fictional\
  \ 93-person company with six teams\n\n## Workflow\n\n### 1. Gather inputs\nAsk for,\
  \ per team or role: average headcount over the last 12 months, number of leavers\
  \ (voluntary and involuntary, or say which), how many were regrettable (people you\
  \ wanted to keep), average salary, typical time to fill a role (calendar days),\
  \ months until a new hire is fully productive, and the main hiring channel. Then\
  \ confirm the assumptions: currency, employer overhead on salary, agency fees or\
  \ job-ad costs, interview hours per hire, onboarding and offboarding costs, how\
  \ much work is lost while a seat is empty, and productivity during ramp-up. Use\
  \ the defaults in `examples/assumptions.json` only when the user has no better number,\
  \ and say so.\n\n### 2. Run the calculation\n```\npython3 scripts/turnover_cost.py\
  \ teams.csv --assumptions assumptions.json\npython3 scripts/turnover_cost.py teams.csv\
  \ --assumptions assumptions.json --reduce-pct 20 --program-cost 25000\npython3 scripts/turnover_cost.py\
  \ teams.csv --assumptions assumptions.json --format md > turnover.md\npython3 scripts/turnover_cost.py\
  \ teams.csv --assumptions assumptions.json --format csv\npython3 scripts/turnover_cost.py\
  \ --self-test\n```\nExit code 0 = no flags, 1 = flags or invalid rows, 2 = unreadable\
  \ input or missing columns.\n\n| Code | Meaning |\n|---|---|\n| T01 | turnover rate\
  \ at or above `high_turnover_pct` (default 25%) |\n| T02 | more than half of the\
  \ team's leavers (2 or more) were regrettable |\n| T03 | cost per leaver at or above\
  \ 50% of annual salary |\n| T04 | time to fill at or above `slow_fill_days` (default\
  \ 60) |\n| E01 | invalid row (non-numeric, regrettable > leavers, unknown hiring\
  \ channel, implausible numbers) |\n\n### 3. Interpret\n- Look at both the total\
  \ and the mix: high-volume, low-cost turnover (warehouse, support) and low-volume,\
  \ high-cost turnover (engineering, sales) need different responses.\n- Check which\
  \ component dominates (`By part`): ramp-up and vacancy usually outweigh recruiting\
  \ fees, which is why \"cheaper recruiting\" rarely fixes the problem.\n- Regrettable\
  \ cost is the number to act on; some turnover is healthy.\n- Run a sensitivity check:\
  \ re-run with ramp-up loss and vacancy cost 20-30% lower; if the conclusion still\
  \ holds, it is robust.\n\n### 4. Decide on retention actions\nUse `references/retention-levers.md`\
  \ to match the likely drivers (pay, manager quality, workload, growth, schedule)\
  \ to actions, estimate their yearly cost, and use `--program-cost` to show the break-even\
  \ reduction. Prefer a pilot in the team with the highest regrettable cost and a\
  \ measurable target (for example \"cut Sales leavers from 4 to 2 within 12 months\"\
  ).\n\n### 5. Report\nFill `templates/turnover-cost-brief.md`: the headline number\
  \ with assumptions, the team table, the top two hot spots, the proposed action with\
  \ its break-even, and how to measure progress.\n\n## Example\n```\npython3 scripts/turnover_cost.py\
  \ examples/teams.csv --assumptions examples/assumptions.json --reduce-pct 20 --program-cost\
  \ 25000\n```\nResult: about EUR 540k per year for 31 leavers (33.3% turnover, avg\
  \ EUR 17.4k per leaver), EUR 298k of it regrettable. Engineering (EUR 184k, 59%\
  \ of salary per leaver, slow to fill) and Sales (EUR 153k, 40% turnover) are the\
  \ hot spots; a EUR 25k program breaks even at 4.6% less turnover, and a 20% reduction\
  \ would save about EUR 108k.\n\n## Limits\n- Estimates only; hidden costs (lost\
  \ customers, team morale, knowledge loss) are not included and usually make the\
  \ real cost higher.\n- Team averages hide individual differences; do not use the\
  \ output to judge individual employees.\n- Vacancy and ramp-up assumptions drive\
  \ most of the result: agree them with finance before presenting.\n\n\x1FFILE:references/cost-model.md\x1E\
  \n# Turnover cost model\n\nAll amounts per leaver unless stated. The script uses\
  \ exactly these formulas.\n\n| Component | Formula | Typical range | Where to get\
  \ the input |\n|---|---|---|---|\n| Recruiting | agency fee % x salary, or fixed\
  \ channel cost (job ads, referral bonus) | agency 15-30% of salary; job boards 300-2,000;\
  \ referral bonus 500-3,000 | finance, recruiting invoices |\n| Interviewing | interview\
  \ hours per hire x loaded hourly cost of interviewers | 8-25 hours | hiring managers,\
  \ ATS stages |\n| Vacancy | working days empty (calendar days x 5/7) x daily loaded\
  \ pay x vacancy cost % | 30-80% of daily pay, depending on how much work is covered\
  \ by others or overtime | time-to-fill from ATS; ask managers how much work is really\
  \ lost |\n| Ramp-up | ramp months / 12 x loaded salary x productivity loss % | 1-2\
  \ months for hourly roles, 3-6 for skilled roles, 6-9 for senior or sales roles\
  \ with long cycles; average loss 40-60% over the ramp | managers |\n| Onboarding\
  \ | fixed: equipment, licences, training, buddy time, admin | 500-4,000 | IT, HR\
  \ |\n| Offboarding | fixed: exit admin, access removal, handover time, final pay\
  \ processing | 200-1,000 | HR, IT |\n\nLoaded salary = salary x (1 + employer overhead\
  \ %). Overhead covers employer taxes, benefits and pension contributions (often\
  \ 15-35%).\nDaily loaded pay = loaded salary / working days per year (around 220).\n\
  Turnover rate = leavers in 12 months / average headcount over the same months.\n\
  \n## Cross-check\nTotal cost per leaver usually lands between 20% and 60% of annual\
  \ salary for most roles, and can exceed 100% for senior, specialist or quota-carrying\
  \ roles once lost revenue is included. If the result is far outside that range,\
  \ check the inputs (monthly vs annual salary, days vs months).\n\n## What is not\
  \ included\n- Lost revenue or customers (sales roles, account managers): add separately\
  \ if the business can estimate it.\n- Overtime and burnout of remaining colleagues,\
  \ and knock-on resignations.\n- Knowledge loss and mistakes made by new hires.\n\
  - Severance and legal costs for involuntary exits.\nMention these as reasons the\
  \ real cost is likely higher, without inventing numbers.\n\n## Data hygiene\n- Use\
  \ team-level aggregates; never collect names or reasons for individual leavers in\
  \ this calculation.\n- Count interns, fixed-term contracts that ended as planned,\
  \ and internal transfers separately or exclude them.\n- Twelve months is the standard\
  \ window; for small teams (under 10 people) one leaver swings the rate a lot, so\
  \ look at two or three years.\n\n\x1FFILE:references/retention-levers.md\x1E\n#\
  \ Retention levers\n\nMatch the likely driver to an action. Ask exit and stay interview\
  \ themes (aggregated) before choosing.\n\n| Likely driver | Signals | Actions |\
  \ Rough yearly cost |\n|---|---|---|---|\n| Pay below market | offers from competitors,\
  \ leavers get 15%+ raises | market pay review for the at-risk roles, clear salary\
  \ bands, retention bonus for critical people | 3-8% of the affected payroll |\n\
  | Manager relationship | turnover concentrated under one or two managers | manager\
  \ training, regular 1:1s, skip-level conversations, coaching | 1,000-3,000 per manager\
  \ |\n| Workload and burnout | overtime, sick leave rising, leavers mention stress\
  \ | hire ahead of demand, cut low-value work, protect focus time, fair on-call rotas\
  \ | varies; often cheaper than one leaver |\n| No growth path | good people leave\
  \ after 18-30 months | career ladders, internal mobility, learning budget, stretch\
  \ projects | 500-2,000 per person |\n| Schedule and flexibility | hourly roles,\
  \ parents, long commutes | predictable shifts published early, shift swapping, hybrid\
  \ days where possible | low |\n| Bad hiring fit | many leavers in the first 90 days\
  \ | clearer job previews, structured interviews, better onboarding and a buddy |\
  \ 500-1,500 per hire |\n| Recognition | leavers mention feeling invisible | regular,\
  \ specific recognition; transparent promotion criteria | low |\n\n## Running a pilot\n\
  1. Pick the team with the highest regrettable cost.\n2. Choose one or two actions\
  \ that fit its driver.\n3. Set a target in leavers (not only percent) and a review\
  \ date (6 and 12 months).\n4. Compare with a similar team that did not get the action,\
  \ if possible.\n5. Re-run the calculator with the new numbers and report the saving\
  \ against the program cost.\n\n## Break-even reasoning\nProgram break-even (leavers\
  \ avoided) = program cost / average cost per leaver. If keeping one or two people\
  \ pays for the program, it is usually worth piloting even with uncertain assumptions.\n\
  \n\x1FFILE:templates/turnover-cost-brief.md\x1E\n# Turnover cost brief: {company\
  \ or department}, {period}\n\n## Headline\nTurnover cost us an estimated **{currency}\
  \ {annual_cost}** in the last 12 months: {leavers} leavers, {turnover_pct}% turnover,\
  \ about {currency} {avg_cost_per_leaver} per leaver. **{currency} {regrettable_cost}**\
  \ of it came from people we wanted to keep.\n\n## Where it hurts\n| Team | Leavers\
  \ | Turnover | Cost per leaver | Annual cost | Why |\n|---|---|---|---|---|---|\n\
  | {team} | {n} | {pct}% | {cost} ({pct_salary}% of salary) | {annual} | {flags in\
  \ plain words} |\n\nBiggest cost component: {ramp-up / vacancy / recruiting} ({share}%\
  \ of the total).\n\n## Proposal\n{Action, team, owner}. Cost: {currency} {program_cost}\
  \ per year. It breaks even if it prevents **{break_even_leavers} leavers** ({break_even_pct}%\
  \ less turnover). A {reduce_pct}% reduction would save about {currency} {annual_saving}\
  \ ({net} net).\n\n## How we will measure it\n- Leavers and regrettable leavers per\
  \ quarter in {team}\n- Time to fill and 90-day attrition of new hires\n- Review\
  \ on {date}; stop or scale based on the result\n\n## Assumptions\n{overhead %, channel\
  \ costs, interview hours, vacancy %, ramp months and loss %, onboarding/offboarding\
  \ costs}. Not included: lost revenue, overtime, knowledge loss, severance, so the\
  \ real cost is likely higher.\n\n\x1FFILE:examples/teams.csv\x1E\nteam,role,avg_headcount,leavers_12m,regrettable_leavers,avg_salary,time_to_fill_days,ramp_months,hiring_channel\n\
  Customer Support,Support Agent,24,9,4,38000,35,2,job_board\nEngineering,Software\
  \ Engineer,18,4,3,78000,62,4,agency\nSales,Account Executive,10,4,2,62000,48,5,agency\n\
  Warehouse,Picker and Packer,30,13,3,31000,14,1,job_board\nFinance,Accountant,5,1,1,58000,55,3,referral\n\
  Marketing,Content Marketer,6,0,0,52000,40,3,job_board\n\n\x1FFILE:examples/assumptions.json\x1E\
  \n{\n  \"currency\": \"EUR\",\n  \"working_days_per_year\": 220,\n  \"employer_overhead_pct\"\
  : 22,\n  \"hiring_channels\": {\n    \"agency\": {\"fee_pct_of_salary\": 20, \"\
  fixed_cost\": 0},\n    \"job_board\": {\"fee_pct_of_salary\": 0, \"fixed_cost\"\
  : 900},\n    \"referral\": {\"fee_pct_of_salary\": 0, \"fixed_cost\": 1500}\n  },\n\
  \  \"interview_hours_per_hire\": 14,\n  \"interviewer_hourly_cost\": 55,\n  \"onboarding_cost_per_hire\"\
  : 1800,\n  \"offboarding_cost_per_leaver\": 400,\n  \"vacancy_cost_pct_of_daily_pay\"\
  : 60,\n  \"ramp_productivity_loss_pct\": 50,\n  \"high_turnover_pct\": 25,\n  \"\
  slow_fill_days\": 60\n}\n\n\x1FFILE:scripts/turnover_cost.py\x1E\n#!/usr/bin/env\
  \ python3\n\"\"\"turnover_cost.py - estimate what employee turnover costs a business,\
  \ per team and in total (standard library only).\n\nInput: a CSV with one row per\
  \ team or role (see examples/teams.csv) and an assumptions JSON (examples/assumptions.json).\n\
  Per leaver the cost is the sum of:\n  recruiting   agency fee (% of salary) or fixed\
  \ channel cost (job ads, referral bonus)\n  interviewing interview hours x interviewer\
  \ hourly cost\n  vacancy      days the seat is empty (time_to_fill_days converted\
  \ to working days) x daily pay x vacancy_cost_pct\n  ramp-up      ramp_months /\
  \ 12 x loaded salary x ramp_productivity_loss_pct\n  onboarding   fixed onboarding\
  \ cost (equipment, training, admin)\n  offboarding  fixed offboarding cost (exit\
  \ admin, access removal, handover)\nLoaded salary = avg_salary x (1 + employer_overhead_pct\
  \ / 100).\nFlags: T01 turnover rate >= high_turnover_pct, T02 more than half of\
  \ 2+ leavers were regrettable,\n       T03 cost per leaver >= 50% of salary, T04\
  \ time to fill >= slow_fill_days, E01 invalid row.\nScenarios: --reduce-pct P shows\
  \ the saving if turnover fell by P percent; --program-cost C (per year) shows\n\
  whether a retention program pays for itself and the break-even reduction.\n\nUsage:\n\
  \  python3 turnover_cost.py teams.csv --assumptions assumptions.json [--format text|md|csv|json]\n\
  \                           [--reduce-pct 20] [--program-cost 15000]\n  python3\
  \ turnover_cost.py --self-test\nExit code: 0 = no flags, 1 = flags present (T01-T04)\
  \ or invalid rows, 2 = bad input file.\n\"\"\"\nimport argparse, csv, io, json,\
  \ sys\n\nREQUIRED = [\"team\", \"role\", \"avg_headcount\", \"leavers_12m\", \"\
  regrettable_leavers\", \"avg_salary\", \"time_to_fill_days\", \"ramp_months\", \"\
  hiring_channel\"]\nDEFAULTS = {\"currency\": \"EUR\", \"working_days_per_year\"\
  : 220, \"employer_overhead_pct\": 20, \"hiring_channels\": {},\n            \"interview_hours_per_hire\"\
  : 12, \"interviewer_hourly_cost\": 50, \"onboarding_cost_per_hire\": 1500,\n   \
  \         \"offboarding_cost_per_leaver\": 300, \"vacancy_cost_pct_of_daily_pay\"\
  : 50, \"ramp_productivity_loss_pct\": 50,\n            \"high_turnover_pct\": 25,\
  \ \"slow_fill_days\": 60}\n\n\ndef load_assumptions(path):\n    a = dict(DEFAULTS)\n\
  \    if path:\n        with open(path, encoding=\"utf-8\") as fh:\n            a.update(json.load(fh))\n\
  \    return a\n\n\ndef parse_rows(text):\n    reader = csv.DictReader(io.StringIO(text))\n\
  \    missing = [c for c in REQUIRED if c not in (reader.fieldnames or [])]\n   \
  \ if missing:\n        raise ValueError(\"missing columns: \" + \", \".join(missing))\n\
  \    return list(reader)\n\n\ndef money(x):\n    return round(x + 0.0, 2)\n\n\n\
  def cost_row(row, a):\n    \"\"\"Return the cost breakdown and flags for one CSV\
  \ row, or raise ValueError for invalid data.\"\"\"\n    try:\n        hc = float(row[\"\
  avg_headcount\"]); leavers = int(row[\"leavers_12m\"]); regret = int(row[\"regrettable_leavers\"\
  ])\n        salary = float(row[\"avg_salary\"]); fill = float(row[\"time_to_fill_days\"\
  ]); ramp = float(row[\"ramp_months\"])\n    except (TypeError, ValueError):\n  \
  \      raise ValueError(\"non-numeric value\")\n    if hc <= 0 or salary <= 0 or\
  \ leavers < 0 or regret < 0 or fill < 0 or ramp < 0:\n        raise ValueError(\"\
  values must be positive (headcount and salary > 0)\")\n    if regret > leavers:\n\
  \        raise ValueError(\"regrettable_leavers > leavers_12m\")\n    if leavers\
  \ > hc * 3:\n        raise ValueError(\"leavers_12m more than 3x headcount - check\
  \ the data\")\n    channel = (row.get(\"hiring_channel\") or \"\").strip()\n   \
  \ ch = a[\"hiring_channels\"].get(channel)\n    if ch is None:\n        raise ValueError(\"\
  unknown hiring_channel %r\" % channel)\n    loaded = salary * (1 + a[\"employer_overhead_pct\"\
  ] / 100.0)\n    daily = loaded / a[\"working_days_per_year\"]\n    working_days_vacant\
  \ = fill * 5.0 / 7.0\n    parts = {\n        \"recruiting\": salary * ch.get(\"\
  fee_pct_of_salary\", 0) / 100.0 + ch.get(\"fixed_cost\", 0),\n        \"interviewing\"\
  : a[\"interview_hours_per_hire\"] * a[\"interviewer_hourly_cost\"],\n        \"\
  vacancy\": working_days_vacant * daily * a[\"vacancy_cost_pct_of_daily_pay\"] /\
  \ 100.0,\n        \"ramp_up\": ramp / 12.0 * loaded * a[\"ramp_productivity_loss_pct\"\
  ] / 100.0,\n        \"onboarding\": float(a[\"onboarding_cost_per_hire\"]),\n  \
  \      \"offboarding\": float(a[\"offboarding_cost_per_leaver\"]),\n    }\n    per_leaver\
  \ = sum(parts.values())\n    rate = 100.0 * leavers / hc\n    flags = []\n    if\
  \ rate >= a[\"high_turnover_pct\"]:\n        flags.append(\"T01 turnover %.1f%%\
  \ >= %s%%\" % (rate, a[\"high_turnover_pct\"]))\n    if leavers >= 2 and regret\
  \ / leavers > 0.5:\n        flags.append(\"T02 %d of %d leavers regrettable\" %\
  \ (regret, leavers))\n    if per_leaver >= 0.5 * salary:\n        flags.append(\"\
  T03 cost per leaver %.0f%% of salary\" % (100 * per_leaver / salary))\n    if fill\
  \ >= a[\"slow_fill_days\"]:\n        flags.append(\"T04 time to fill %g days >=\
  \ %s\" % (fill, a[\"slow_fill_days\"]))\n    return {\"team\": row[\"team\"], \"\
  role\": row[\"role\"], \"avg_headcount\": hc, \"leavers_12m\": leavers, \"regrettable_leavers\"\
  : regret,\n            \"turnover_pct\": round(rate, 1), \"avg_salary\": salary,\
  \ \"cost_per_leaver\": money(per_leaver),\n            \"cost_per_leaver_pct_salary\"\
  : round(100 * per_leaver / salary, 1),\n            \"breakdown_per_leaver\": {k:\
  \ money(v) for k, v in parts.items()},\n            \"annual_cost\": money(per_leaver\
  \ * leavers), \"regrettable_cost\": money(per_leaver * regret), \"flags\": flags}\n\
  \n\ndef analyze(rows, a, reduce_pct=None, program_cost=None):\n    teams, errors\
  \ = [], []\n    for i, row in enumerate(rows, start=2):\n        try:\n        \
  \    teams.append(cost_row(row, a))\n        except ValueError as e:\n         \
  \   errors.append({\"line\": i, \"team\": row.get(\"team\", \"\"), \"error\": \"\
  E01 \" + str(e)})\n    total = sum(t[\"annual_cost\"] for t in teams)\n    leavers\
  \ = sum(t[\"leavers_12m\"] for t in teams)\n    hc = sum(t[\"avg_headcount\"] for\
  \ t in teams)\n    summary = {\"currency\": a[\"currency\"], \"teams\": len(teams),\
  \ \"avg_headcount\": hc, \"leavers_12m\": leavers,\n               \"turnover_pct\"\
  : round(100.0 * leavers / hc, 1) if hc else 0.0, \"annual_cost\": money(total),\n\
  \               \"regrettable_cost\": money(sum(t[\"regrettable_cost\"] for t in\
  \ teams)),\n               \"avg_cost_per_leaver\": money(total / leavers) if leavers\
  \ else 0.0,\n               \"cost_by_part\": {k: money(sum(t[\"breakdown_per_leaver\"\
  ][k] * t[\"leavers_12m\"] for t in teams)) for k in [\"recruiting\", \"interviewing\"\
  , \"vacancy\", \"ramp_up\", \"onboarding\", \"offboarding\"]}}\n    if reduce_pct\
  \ is not None:\n        summary[\"scenario\"] = {\"reduce_pct\": reduce_pct, \"\
  leavers_avoided\": round(leavers * reduce_pct / 100.0, 1), \"annual_saving\": money(total\
  \ * reduce_pct / 100.0)}\n    if program_cost is not None:\n        be = 100.0 *\
  \ program_cost / total if total else None\n        summary[\"program\"] = {\"program_cost\"\
  : money(program_cost), \"break_even_reduce_pct\": round(be, 1) if be is not None\
  \ else None,\n                              \"break_even_leavers_avoided\": round(program_cost\
  \ / summary[\"avg_cost_per_leaver\"], 1) if leavers else None}\n        if reduce_pct\
  \ is not None:\n            summary[\"program\"][\"net_saving_at_reduce_pct\"] =\
  \ money(total * reduce_pct / 100.0 - program_cost)\n    teams.sort(key=lambda t:\
  \ -t[\"annual_cost\"])\n    return {\"summary\": summary, \"teams\": teams, \"errors\"\
  : errors}\n\n\ndef fmt_money(x, cur):\n    return \"%s %s\" % (cur, \"{:,.0f}\"\
  .format(x))\n\n\ndef render(res, fmt):\n    s, cur = res[\"summary\"], res[\"summary\"\
  ][\"currency\"]\n    if fmt == \"json\":\n        return json.dumps(res, indent=2)\n\
  \    if fmt == \"csv\":\n        out = io.StringIO(); w = csv.writer(out, lineterminator=\"\
  \\n\")\n        w.writerow([\"team\", \"role\", \"avg_headcount\", \"leavers_12m\"\
  , \"turnover_pct\", \"cost_per_leaver\", \"cost_per_leaver_pct_salary\", \"annual_cost\"\
  , \"regrettable_cost\", \"flags\"])\n        for t in res[\"teams\"]:\n        \
  \    w.writerow([t[\"team\"], t[\"role\"], t[\"avg_headcount\"], t[\"leavers_12m\"\
  ], t[\"turnover_pct\"], t[\"cost_per_leaver\"], t[\"cost_per_leaver_pct_salary\"\
  ], t[\"annual_cost\"], t[\"regrettable_cost\"], \"; \".join(t[\"flags\"])])\n  \
  \      return out.getvalue().rstrip(\"\\n\")\n    L = []\n    md = fmt == \"md\"\
  \n    L.append((\"## \" if md else \"\") + \"Turnover cost: %s per year (%d leavers,\
  \ %.1f%% turnover, avg %s per leaver)\" % (fmt_money(s[\"annual_cost\"], cur), s[\"\
  leavers_12m\"], s[\"turnover_pct\"], fmt_money(s[\"avg_cost_per_leaver\"], cur)))\n\
  \    L.append((\"- \" if md else \"  \") + \"Regrettable leavers cost: %s\" % fmt_money(s[\"\
  regrettable_cost\"], cur))\n    L.append((\"- \" if md else \"  \") + \"By part:\
  \ \" + \", \".join(\"%s %s\" % (k, fmt_money(v, cur)) for k, v in s[\"cost_by_part\"\
  ].items()))\n    if \"scenario\" in s:\n        sc = s[\"scenario\"]\n        L.append((\"\
  - \" if md else \"  \") + \"Scenario: %g%% less turnover avoids %.1f leavers and\
  \ saves %s per year\" % (sc[\"reduce_pct\"], sc[\"leavers_avoided\"], fmt_money(sc[\"\
  annual_saving\"], cur)))\n    if \"program\" in s:\n        p = s[\"program\"]\n\
  \        line = \"Retention program %s/year breaks even at %.1f%% less turnover\
  \ (%.1f leavers avoided)\" % (fmt_money(p[\"program_cost\"], cur), p[\"break_even_reduce_pct\"\
  ], p[\"break_even_leavers_avoided\"])\n        if \"net_saving_at_reduce_pct\" in\
  \ p:\n            line += \"; net %s at the scenario\" % fmt_money(p[\"net_saving_at_reduce_pct\"\
  ], cur)\n        L.append((\"- \" if md else \"  \") + line)\n    L.append(\"\"\
  )\n    if md:\n        L.append(\"| Team | Role | Headcount | Leavers | Turnover\
  \ | Cost per leaver | % of salary | Annual cost | Flags |\")\n        L.append(\"\
  |---|---|---|---|---|---|---|---|---|\")\n        for t in res[\"teams\"]:\n   \
  \         L.append(\"| %s | %s | %g | %d | %.1f%% | %s | %.1f%% | %s | %s |\" %\
  \ (t[\"team\"], t[\"role\"], t[\"avg_headcount\"], t[\"leavers_12m\"], t[\"turnover_pct\"\
  ], fmt_money(t[\"cost_per_leaver\"], cur), t[\"cost_per_leaver_pct_salary\"], fmt_money(t[\"\
  annual_cost\"], cur), \"<br>\".join(t[\"flags\"]) or \"-\"))\n    else:\n      \
  \  for t in res[\"teams\"]:\n            L.append(\"%-18s %-20s hc %-5g leavers\
  \ %-3d turnover %5.1f%%  per leaver %-12s (%5.1f%% of salary)  annual %s\" % (t[\"\
  team\"], t[\"role\"], t[\"avg_headcount\"], t[\"leavers_12m\"], t[\"turnover_pct\"\
  ], fmt_money(t[\"cost_per_leaver\"], cur), t[\"cost_per_leaver_pct_salary\"], fmt_money(t[\"\
  annual_cost\"], cur)))\n            for f in t[\"flags\"]:\n                L.append(\"\
  \    \" + f)\n    for e in res[\"errors\"]:\n        L.append((\"- \" if md else\
  \ \"\") + \"line %d %s: %s\" % (e[\"line\"], e[\"team\"], e[\"error\"]))\n    return\
  \ \"\\n\".join(L)\n\n\ndef self_test():\n    T = []\n    def check(name, cond):\
  \ T.append((name, bool(cond)))\n    a = dict(DEFAULTS); a.update({\"employer_overhead_pct\"\
  : 0, \"working_days_per_year\": 200, \"hiring_channels\": {\"fixed\": {\"fixed_cost\"\
