  --reduce-pct\", type=float)\n    ap.add_argument(\"--program-cost\", type=float)\n\
  \    ap.add_argument(\"--self-test\", action=\"store_true\")\n    o = ap.parse_args(argv)\n\
  \    if o.self_test:\n        return self_test()\n    if not o.csv:\n        ap.error(\"\
  give a CSV file or --self-test\")\n    try:\n        a = load_assumptions(o.assumptions)\n\
  \        with open(o.csv, encoding=\"utf-8-sig\") as fh:\n            rows = parse_rows(fh.read())\n\
  \    except (OSError, ValueError) as e:\n        print(\"input error: %s\" % e,\
  \ file=sys.stderr)\n        return 2\n    res = analyze(rows, a, o.reduce_pct, o.program_cost)\n\
  \    print(render(res, o.format))\n    return 1 if res[\"errors\"] or any(t[\"flags\"\
  ] for t in res[\"teams\"]) else 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())"
