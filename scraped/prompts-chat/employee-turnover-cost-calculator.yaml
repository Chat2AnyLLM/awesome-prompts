  : 50, \"high_turnover_pct\": 25, \"slow_fill_days\": 60})\n    base = {\"team\"\
  : \"T\", \"role\": \"R\", \"avg_headcount\": \"10\", \"leavers_12m\": \"2\", \"\
  regrettable_leavers\": \"1\", \"avg_salary\": \"40000\", \"time_to_fill_days\":\
  \ \"28\", \"ramp_months\": \"3\", \"hiring_channel\": \"fixed\"}\n    r = cost_row(base,\
  \ a)\n    b = r[\"breakdown_per_leaver\"]\n    check(\"fixed channel recruiting\
  \ cost\", b[\"recruiting\"] == 1000)\n    check(\"interview cost hours x rate\"\
  , b[\"interviewing\"] == 500)\n    check(\"vacancy: 28 calendar days = 20 working\
  \ days x 200/day\", b[\"vacancy\"] == 4000)\n    check(\"ramp: 3/12 x 40000 x 50%\"\
  , b[\"ramp_up\"] == 5000)\n    check(\"cost per leaver sums parts\", r[\"cost_per_leaver\"\
  ] == 12000)\n    check(\"annual cost = per leaver x leavers\", r[\"annual_cost\"\
  ] == 24000)\n    check(\"turnover rate 20%\", r[\"turnover_pct\"] == 20.0)\n   \
  \ check(\"no flags for moderate row\", r[\"flags\"] == [])\n    r2 = cost_row(dict(base,\
  \ hiring_channel=\"agency\", ramp_months=\"4\"), a)\n    check(\"agency fee 20%\
  \ of salary\", r2[\"breakdown_per_leaver\"][\"recruiting\"] == 8000)\n    check(\"\
  T03 when cost >= 50% of salary\", any(f.startswith(\"T03\") for f in r2[\"flags\"\
  ]))\n    a2 = dict(a, employer_overhead_pct=25)\n    check(\"overhead loads ramp\
  \ cost\", cost_row(base, a2)[\"breakdown_per_leaver\"][\"ramp_up\"] == 6250)\n \
  \   r3 = cost_row(dict(base, leavers_12m=\"3\", regrettable_leavers=\"2\", time_to_fill_days=\"\
  70\"), a)\n    check(\"T01 at 30% turnover\", any(f.startswith(\"T01\") for f in\
  \ r3[\"flags\"]))\n    check(\"T02 when most leavers regrettable\", any(f.startswith(\"\
  T02\") for f in r3[\"flags\"]))\n    check(\"no T02 for a single regrettable leaver\"\
  , not any(f.startswith(\"T02\") for f in cost_row(dict(base, leavers_12m=\"1\"),\
  \ a)[\"flags\"]))\n    check(\"T04 slow fill\", any(f.startswith(\"T04\") for f\
  \ in r3[\"flags\"]))\n    res = analyze([base, dict(base, regrettable_leavers=\"\
  5\")], a)\n    check(\"invalid regrettable > leavers gives E01\", res[\"errors\"\
