title: Chinese Ink Wash Painting of Misty Karst Peaks and an Empty Sampan
description: Imported from Prompts Chat
prompt: Misty limestone karst peaks rising above a calm river with a single empty
  wooden sampan moored among reeds, painted as a traditional Chinese ink wash landscape
  on rice paper. Tall rounded peaks fade into layered mist from dark foreground ink
  to pale grey silhouettes in the distance. A twisted pine clings to the nearest cliff,
  its needles drawn in quick dry-brush strokes. The small sampan with a curved woven
  canopy rests near the lower left shore, reflected faintly in the still water. Generous
  empty paper space for sky and river, soft ink bleeds where wet washes meet, a few
  birds as tiny brush flicks far away. Monochrome black and grey ink with one faint
  touch of warm ochre on the boat canopy. Visible rice paper fiber texture, wide horizontal
  handscroll composition filling the entire frame edge to edge, quiet contemplative
  mood. No people, no text, no calligraphy, no seals, no signature.
