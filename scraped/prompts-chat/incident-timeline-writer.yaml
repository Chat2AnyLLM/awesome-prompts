title: Incident Timeline Writer
description: Imported from Prompts Chat
prompt: "---\nname: incident-timeline-writer\ndescription: Turn rough incident notes\
  \ into a clear timeline, impact summary, and follow-up actions.\n---\n\n# Incident\
  \ Timeline Writer\n\nHelp write post-incident narratives from messy notes, Slack\
  \ dumps, or pager logs.\n\n## Workflow\n1. Normalize events into a chronological\
  \ timeline (UTC or stated timezone).\n2. Fill `templates/incident-report.md` sections;\
  \ leave unknowns as `TBD`.\n3. Separate **facts** from **hypotheses**.\n4. Propose\
  \ severity and customer impact only from provided evidence.\n5. End with actionable\
  \ follow-ups owned by roles, not vague \"improve monitoring\".\n\n## Style\n- Short\
  \ sentences, no blame language.\n- Prefer timestamps over \"later\" / \"soon\".\n\
  - Link every impact claim to an observation in the notes.\n\x1FFILE:templates/incident-report.md\x1E\
  \n# Incident report\n\n**Title:**\n**Severity:**\n**Status:**\n**Start / Detect\
  \ / Mitigate / Resolve (timezone):**\n\n## Summary\n(2–4 sentences)\n\n## Timeline\n\
  | Time | Event | Source |\n|------|-------|--------|\n| | | |\n\n## Impact\n- Customers\
  \ / regions affected:\n- Error rates / SLOs:\n- Data loss / corruption:\n\n## Root\
  \ cause (known vs suspected)\n\n## What went well\n\n## What went poorly\n\n## Follow-ups\n\
  | Action | Owner | Due |\n|--------|-------|-----|\n| | | |\n\x1FFILE:references/severity-rubric.md\x1E\
  \n# Severity rubric (default)\n\n- **SEV1**: Complete outage of a core product path\
  \ or confirmed data loss\n- **SEV2**: Major feature broken for a significant user\
  \ segment; workaround painful\n- **SEV3**: Degraded performance or partial feature\
  \ failure; workaround exists\n- **SEV4**: Minor bug / cosmetic; little customer\
  \ impact\n\nIf notes conflict, pick the higher severity and mark confidence as low."
