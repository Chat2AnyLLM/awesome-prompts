  \ in codes(H + \"x-frame-options: DENY\\nx-frame-options: SAMEORIGIN\\n\"))\n  \
  \  case(\"nosniff MEDIUM on script\", lambda: [x[\"severity\"] for _, fs in run(load(\"\
