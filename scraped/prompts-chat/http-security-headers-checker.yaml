  \ HttpOnly\")).count(\"COOKIE_PREFIX_VIOLATION\") == 1 and \"COOKIE_NO_SECURE\"\
  \ not in codes(good.replace(\"Path=/; Secure; HttpOnly\", \"Path=/; HttpOnly\")))\n\
  \    case(\"max-age wording\", lambda: _days(86400) == \"1 day\" and _days(604800)\
  \ == \"7 days\")\n    case(\"cookie broad domain\", lambda: \"COOKIE_BROAD_DOMAIN\"\
  \ in codes(H + \"set-cookie: session=1; Domain=.a.test; Secure; HttpOnly; SameSite=Lax\\\
  n\"))\n    case(\"deleted cookie ignored\", lambda: not any(c.startswith(\"COOKIE\"\
  ) for c in codes(H + \"set-cookie: session=; Max-Age=0\\n\")))\n    J = \"HTTP/2\
  \ 200\\ncontent-type: application/json\\nx-content-type-options: nosniff\\nstrict-transport-security:\
  \ max-age=31536000; includeSubDomains\\n\"\n    case(\"api json not checked for\
