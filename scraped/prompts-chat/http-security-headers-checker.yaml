  \ \" if ok else \"FAIL \") + name + ((\" \" + err) if err else \"\"))\n    print(\"\
  %d/%d passed\" % (passed, len(cases)))\n    return 0 if passed == len(cases) else\
  \ 1\n\n\ndef _raises(fn):\n    try:\n        fn()\n    except ValueError:\n    \
  \    return True\n    return False\n\n\ndef main(argv=None):\n    ap = argparse.ArgumentParser(description=\"\
  Check HTTP security response headers (offline).\")\n    ap.add_argument(\"file\"\
  , nargs=\"?\", help=\"curl -I/-IL/-v output, HAR file or headers file ('-' = stdin)\"\
  )\n    ap.add_argument(\"--url\", default=\"\", help=\"URL of the first response\
