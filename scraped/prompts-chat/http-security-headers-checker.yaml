  n\", \"https://a.test/\")) for x in fs if x[\"code\"] == \"COOKIE_NO_SECURE\"] ==\
  \ [\"HIGH\"])\n    case(\"cookie no httponly\", lambda: \"COOKIE_NO_HTTPONLY\" in\
  \ codes(H + \"set-cookie: auth_token=1; Secure; SameSite=Lax\\n\"))\n    case(\"\
  cookie no samesite\", lambda: \"COOKIE_NO_SAMESITE\" in codes(H + \"set-cookie:\
