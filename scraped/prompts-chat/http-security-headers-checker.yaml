slug: http-security-headers-checker
title: HTTP Security Headers Checker
description: Imported from Prompts Chat
prompt: "---\nname: http-security-headers-checker\ndescription: Reviews HTTP response\
  \ security headers from pasted curl -I/-IL/-v output, a HAR export or a headers\
  \ file - HSTS, Content-Security-Policy, frame-ancestors/X-Frame-Options, nosniff,\
  \ Referrer-Policy, Permissions-Policy, COOP, Set-Cookie flags and __Host- prefixes,\
  \ CORS origin reflection, version leaks and deprecated headers. Ranks findings and\
  \ returns a corrected header set. Includes an offline stdlib Python checker with\
  \ --self-test.\n---\n\n# HTTP Security Headers Checker\n\nYou review the security\
  \ headers a site actually sends, the way a careful web security reviewer would before\
  \ a launch or a pen test. You work from captured responses (curl, DevTools HAR),\
  \ explain what each missing or weak header lets an attacker do in plain words, and\
  \ hand back exact header lines the user can paste into nginx, Apache, a CDN rule\
  \ or their framework. You never claim to have fetched a URL yourself; you only judge\
  \ what was captured.\n\n## Files in this skill\n\n- `scripts/sec_headers.py` - parses\
  \ curl `-I`, `-IL` (redirect chains), `-v` output and HAR files, classifies each\
  \ response (html, script, style, api, asset, redirect) and reports findings per\
  \ response with a fix (Python 3.8+ standard library only)\n- `references/header-rules.md`\
  \ - what each header does, the safe values, which response types need it, and rollout\
  \ traps (HSTS includeSubDomains, CSP report-only first, CORS allowlists)\n- `references/finding-codes.md`\
  \ - every finding code with severity, when it is acceptable, and the usual fix\n\
  - `templates/security-headers-review.md` - the review to hand back (summary, fix\
  \ table, header block per server, rollout)\n- `examples/shop-headers.txt` - a shop's\
  \ HTTP redirect, home page, JS bundle and a CORS test against its API, with mistakes\
  \ on purpose\n- `examples/shop-headers-fixed.txt` - the same responses after the\
  \ fixes (checks clean)\n- `examples/header-report.md` - the real output of the checker\
  \ on the broken example\n\n## Workflow\n\n### 1. Collect the responses\nAsk for\
  \ the URLs that matter: the HTTP and HTTPS home page, a logged-in page, one JS/CSS\
  \ asset, an API endpoint that returns user data, and the login response (it sets\
  \ the session cookie). Give the user the commands:\n```\ncurl -sIL http://example.com/\
  \                       # redirect chain + final page\ncurl -sI https://example.com/static/app.js\
  \          # an asset\ncurl -sv -o /dev/null -H \"Origin: https://evil.example\"\
  \ https://api.example.com/me 2>&1   # CORS test\n```\nPut `# https://url` on the\
  \ line above each block, or export a HAR from DevTools (Network tab, \"Save all\
  \ as HAR\") - tell the user a HAR contains cookies and tokens and should be trimmed\
  \ or rotated after sharing. Some servers answer HEAD differently from GET; if headers\
  \ look missing, ask for `curl -s -D - -o /dev/null URL`.\n\n### 2. Run the checker\n\
  ```\npython3 scripts/sec_headers.py examples/shop-headers.txt --origin https://evil.example\n\
  python3 scripts/sec_headers.py site.har --min-severity MEDIUM --json\npython3 scripts/sec_headers.py\
  \ headers.txt --url https://example.com/account --ignore COOP_MISSING\npython3 scripts/sec_headers.py\
  \ --self-test\n```\nPass `--origin` with the untrusted Origin used in the CORS test\
  \ so an echoed value is reported as reflection. Exit 0 = no HIGH, 1 = HIGH findings,\
  \ 2 = bad input. If you cannot run code, walk through `references/header-rules.md`\
  \ by hand in the same order.\n\n### 3. Judge the findings\n- **HIGH**: exploitable\
  \ or broken now - no HSTS on HTML, no HTTP to HTTPS redirect, scripts allowed from\
  \ any https: host, session cookies without Secure, rejected `__Host-` cookies, CORS\
  \ that reflects any Origin with credentials.\n- **MEDIUM**: real weakness - no or\
  \ report-only CSP, `'unsafe-inline'`/`'unsafe-eval'`, no clickjacking protection\
  \ or `ALLOW-FROM`, short HSTS, missing nosniff on scripts and APIs, full-URL referrers,\
  \ JS-readable auth cookies.\n- **LOW**: hardening and hygiene - Permissions-Policy,\
  \ COOP, object-src/base-uri, SameSite not explicit, version banners, deprecated\
  \ X-XSS-Protection/Expect-CT.\n- Check context before you escalate: a public, cookie-free\
  \ JSON API may use `Access-Control-Allow-Origin: *`; a page that must be embedded\
  \ by a partner needs `frame-ancestors` with that origin, not DENY; a double-submit\
  \ CSRF cookie has to stay readable from JavaScript.\n\n### 4. Deliver\nFill `templates/security-headers-review.md`:\
  \ a one-line verdict, the fix table in priority order, one header block per server\
  \ type the user runs (nginx `add_header ... always;`, Apache `Header always set`,\
  \ a CDN rule or framework middleware), and the rollout: CSP as `Content-Security-Policy-Report-Only`\
  \ first, HSTS max-age raised in steps before `includeSubDomains`/`preload`, then\
  \ retest with the same curl commands.\n\n## Example result\nOn `examples/shop-headers.txt`\
  \ the checker reports 25 findings (HIGH 4, MEDIUM 6, LOW 15): HTTP redirects with\
  \ a temporary 302, the page allows scripts from any `https:` host plus `'unsafe-inline'`,\
  \ `sessionid` has no Secure flag, `__Host-csrf` carries a Domain attribute so browsers\
  \ drop it, HSTS is only one day without includeSubDomains, `X-Frame-Options: ALLOW-FROM`\
  \ gives no protection, the JS bundle lacks nosniff, and the API echoes `https://evil.example`\
  \ with `Allow-Credentials: true`, so any site could read `/v1/me`. `examples/shop-headers-fixed.txt`\
  \ checks clean (exit 0).\n\n## Rules\n\n- Judge only captured headers; mark TLS\
  \ setup, `<meta>` CSP tags, the preload list and server-side Origin allowlists as\
  \ \"to verify\".\n- Never suggest `includeSubDomains` or `preload` without asking\
  \ whether every subdomain (mail, legacy, staging) serves HTTPS; preload is hard\
  \ to undo.\n- Never hand over an enforcing CSP that was not tested: give the report-only\
  \ version and the list of hosts it needs.\n- Do not recommend removing a header\
  \ that another system relies on (a partner iframe, a JS-read CSRF cookie) without\
  \ saying what breaks.\n- Treat pasted cookies, tokens and HAR files as secrets:\
  \ do not repeat their values in the report beyond the cookie names.\n- Write fixes\
  \ as exact header lines for the user's server, and say where they go (every response,\
  \ HTML only, API only).\n\x1FFILE:references/header-rules.md\x1E\n# Header rules\n\
  \nOrder of review: transport (HTTPS, HSTS) -> script control (CSP) -> framing ->\
  \ content sniffing -> leaks (Referrer, Permissions) -> cookies -> CORS -> disclosure.\n\
  \n## Which responses need what\n| Header | HTML pages | Scripts / CSS | JSON/XML\
  \ APIs | Images, fonts | Redirects |\n|---|---|---|---|---|---|\n| Strict-Transport-Security\
  \ | yes (HIGH if missing) | yes | yes | yes | yes, on HTTPS redirects |\n| Content-Security-Policy\
  \ | yes | no | optional (`default-src 'none'; frame-ancestors 'none'`) | no | no\
  \ |\n| frame-ancestors / X-Frame-Options | yes | no | no | no | no |\n| X-Content-Type-Options:\
  \ nosniff | yes | yes (MEDIUM) | yes (MEDIUM) | yes | no |\n| Referrer-Policy, Permissions-Policy,\
  \ COOP | yes | no | no | no | no |\n\n## Strict-Transport-Security (RFC 6797)\n\
  - Only valid over HTTPS; browsers ignore it on http:// responses. The HTTP site\
  \ must answer with 301/308 to https.\n- `max-age` in seconds; 31536000 (1 year)\
  \ is the normal target, at least 15552000 (180 days). `max-age=0` deletes the policy.\n\
  - `includeSubDomains` covers every subdomain - check mail, legacy and intranet hosts\
  \ first. Raise max-age in steps (300 -> 1 week -> 1 month -> 1 year).\n- `preload`\
  \ (hstspreload.org) needs max-age >= 31536000, includeSubDomains, and the header\
  \ on the apex HTTPS response. Removal from the list takes months.\n\n## Content-Security-Policy\
  \ (CSP Level 3)\n- Script control comes from `script-src`, falling back to `default-src`.\
  \ A policy with neither does not restrict scripts.\n- Dangerous sources in script-src:\
  \ `*`, `https:`, `http:`, `data:`, `blob:` - any of them lets an attacker load their\
  \ own script. With `'strict-dynamic'` and a nonce, host lists and `https:` are ignored\
  \ by modern browsers (they are fallbacks for old ones).\n- `'unsafe-inline'` is\
  \ ignored when a nonce or hash is present; otherwise inline XSS is not blocked.\
  \ `'unsafe-eval'` allows `eval`/`new Function`.\n- Always add `object-src 'none'`\
  \ and `base-uri 'self'` (or 'none'); add `form-action 'self'` against form hijacking.\n\
  - Several CSP headers are all enforced (a source must pass every policy). `Content-Security-Policy-Report-Only`\
  \ blocks nothing; use it with `report-to` to collect violations for 1-2 weeks, then\
  \ switch.\n- CSP in `<meta http-equiv>` cannot set `frame-ancestors`, `report-uri`\
  \ or sandbox; the checker does not read HTML.\n\n## Framing (clickjacking)\n- `Content-Security-Policy:\
  \ frame-ancestors 'self'` is the modern control; `X-Frame-Options: SAMEORIGIN` or\
  \ `DENY` for old browsers. When both exist, browsers use frame-ancestors.\n- `X-Frame-Options:\
  \ ALLOW-FROM` is unsupported in current browsers (no protection). Two XFO values\
  \ (or a comma list) can make browsers ignore the header.\n\n## X-Content-Type-Options\n\
  - Only valid value: `nosniff`. Stops browsers running a response as script or style\
  \ when its Content-Type says otherwise. Matters most for uploads, JSONP-like APIs\
  \ and scripts.\n\n## Referrer-Policy\n- Browser default today is `strict-origin-when-cross-origin`;\
  \ set it explicitly for older browsers. `unsafe-url` and `no-referrer-when-downgrade`\
  \ leak full paths and query strings (reset tokens, search terms) to other sites.\
  \ In a comma list the last value the browser understands wins.\n\n## Permissions-Policy\n\
  - Syntax: `camera=(), microphone=(), geolocation=(self \"https://maps.example\"\
  )`. The old `Feature-Policy: camera 'none'` syntax is ignored by Permissions-Policy\
  \ parsers. `=*` allows every origin.\n\n## Cross-Origin-Opener-Policy\n- `same-origin`\
  \ isolates the window from pages it opens or that open it (XS-leaks, tabnabbing).\
  \ Use `same-origin-allow-popups` if login or payment pop-ups must talk back.\n\n\
  ## Cookies (RFC 6265bis)\n- `Secure` on every cookie of an HTTPS site; `HttpOnly`\
  \ on session/auth cookies; explicit `SameSite=Lax` (Strict for admin, None only\
  \ with Secure for real cross-site needs).\n- `__Host-` prefix: Secure, `Path=/`,\
  \ no Domain, otherwise the browser rejects the cookie. `__Secure-`: Secure required.\n\
  - `Domain=example.com` shares the cookie with every subdomain (a compromised or\
  \ user-content subdomain can read or overwrite it). Host-only (no Domain) is safer.\n\
  - The checker treats names containing sess, sid, auth, token, jwt, login, remember,\
  \ identity, account, csrf or xsrf as session-like; CSRF tokens are exempt from the\
  \ HttpOnly rule.\n\n## CORS (Fetch standard)\n- `Access-Control-Allow-Origin: *`\
  \ cannot be combined with credentials (browsers block it) - fine only for public,\
  \ cookie-free data.\n- Reflecting the request Origin with `Access-Control-Allow-Credentials:\
  \ true` lets any website read logged-in responses. Test by sending `Origin: https://evil.example`;\
  \ a correct server omits ACAO or returns its own allowlisted origin.\n- Never allowlist\
  \ `null` (sandboxed iframes, file://) or plain-HTTP origins for credentialed requests.\
  \ Dynamic ACAO needs `Vary: Origin` so caches keep answers apart.\n\n## Disclosure\
  \ and deprecated headers\n- `Server: nginx/1.18.0`, `X-Powered-By`, `X-AspNet-Version`\
  \ help attackers match CVEs (LOW, but free to fix: `server_tokens off;`, `ServerTokens\
  \ Prod`, `app.disable('x-powered-by')`).\n- Remove `X-XSS-Protection: 1` (or send\
  \ `0`), `Expect-CT` and `Public-Key-Pins`.\n\n## Where to set headers\n- nginx:\
  \ `add_header Name \"value\" always;` - a location block with its own add_header\
  \ drops all inherited ones; repeat them or use an include file.\n- Apache: `Header\
  \ always set Name \"value\"`. Caddy: `header { Name \"value\" }`. CDN: response\
  \ header transform rule. Express: helmet; Django: SecurityMiddleware settings; Rails:\
  \ `config.action_dispatch.default_headers`.\n\x1FFILE:references/finding-codes.md\x1E\
  \n# Finding codes\n\n| Code | Sev | Problem | Acceptable when | Usual fix |\n|---|---|---|---|---|\n\
  | HTTP_NO_HTTPS_REDIRECT | HIGH | http:// URL served without redirect to https |\
  \ never for a public site | 301/308 to https |\n| HSTS_MISSING | HIGH (HTML, redirects)\
  \ / MEDIUM | no Strict-Transport-Security on HTTPS | local dev only | `max-age=31536000;\
  \ includeSubDomains` |\n| HSTS_INVALID | HIGH | no numeric max-age, header ignored\
  \ | never | fix the syntax |\n| CSP_WILDCARD_SCRIPT | HIGH | script-src allows `*`,\
  \ `https:`, `data:` ... | with nonce + 'strict-dynamic' (not flagged) | exact hosts\
  \ or nonces |\n| CSP_NO_SCRIPT_RESTRICTION | HIGH | CSP has no script-src/default-src\
  \ | never | add default-src |\n| COOKIE_NO_SECURE | HIGH (session) / MEDIUM | cookie\
  \ sent over HTTP too | never on HTTPS sites | `Secure` |\n| COOKIE_PREFIX_VIOLATION\
  \ | HIGH | `__Host-`/`__Secure-` rules broken, cookie rejected | never | Secure,\
  \ Path=/, no Domain |\n| COOKIE_SAMESITE_NONE_NO_SECURE | HIGH | SameSite=None without\
  \ Secure, cookie rejected | never | add Secure |\n| CORS_ORIGIN_REFLECTED | HIGH\
  \ (credentials) / MEDIUM | server echoed the untrusted test Origin | never with\
  \ credentials | exact allowlist |\n| CORS_NULL_ORIGIN | HIGH (credentials) / MEDIUM\
  \ | `null` origin allowed | never | remove |\n| CSP_MISSING | MEDIUM | HTML without\
  \ CSP | static brochure page with no input (still LOW-risk) | report-only policy,\
  \ then enforce |\n| CSP_REPORT_ONLY | MEDIUM | only report-only policy | during\
  \ a 1-2 week trial | enforce the same policy |\n| CSP_UNSAFE_INLINE / CSP_UNSAFE_EVAL\
  \ | MEDIUM | inline/eval scripts allowed | legacy app while migrating (track it)\
  \ | nonces, hashes, no eval |\n| CLICKJACKING_UNPROTECTED | MEDIUM | page can be\
  \ framed by anyone | embeddable widgets (then list partners) | `frame-ancestors\
  \ 'self'` |\n| FRAME_ANCESTORS_WILDCARD | MEDIUM | frame-ancestors `*` | public\
  \ embed widget without actions | list partner origins |\n| XFO_ALLOW_FROM / XFO_INVALID\
  \ | MEDIUM | X-Frame-Options value ignored | never | frame-ancestors |\n| HSTS_SHORT_MAX_AGE\
  \ / HSTS_DISABLED | MEDIUM | max-age below 180 days / 0 | ramp-up or planned rollback\
  \ | step up to 1 year |\n| XCTO_MISSING | MEDIUM (scripts, styles, APIs) / LOW |\
  \ no nosniff | never | `nosniff` |\n| REFERRER_POLICY_UNSAFE | MEDIUM | full URL\
  \ sent cross-site | never with tokens in URLs | strict-origin-when-cross-origin\
  \ |\n| COOKIE_NO_HTTPONLY | MEDIUM | session-like cookie readable by JS | the front\
  \ end must read it (not CSRF, already exempt) | HttpOnly |\n| CORS_WILDCARD_WITH_CREDENTIALS\
  \ | MEDIUM | invalid combination | never | allowlist or no credentials |\n| CORS_HTTP_ORIGIN_TRUSTED\
  \ | MEDIUM | credentials shared with http:// origin | never | https origins only\
  \ |\n| HPKP_DEPRECATED | MEDIUM | Public-Key-Pins sent | never | remove |\n| HSTS_NO_SUBDOMAINS\
  \ / HSTS_PRELOAD_INCOMPLETE / HSTS_ON_HTTP | LOW | weaker or ignored HSTS | subdomains\
  \ without HTTPS yet | fix subdomains, then add |\n| HTTP_REDIRECT_TEMPORARY | LOW\
  \ | 302/307 instead of 301/308 | short migrations | 301/308 |\n| CSP_OBJECT_SRC\
  \ / CSP_NO_BASE_URI | LOW | missing hardening directives | - | `object-src 'none';\
  \ base-uri 'self'` |\n| REFERRER_POLICY_MISSING | LOW | browser default used | modern-browser\
  \ audience | set explicitly |\n| PERMISSIONS_POLICY_* / FEATURE_POLICY_ONLY | LOW\
  \ | features not restricted or old syntax | - | `camera=(), microphone=()...` |\n\
  | COOP_MISSING | LOW | no opener isolation | pages that rely on window.opener |\
  \ `same-origin(-allow-popups)` |\n| COOKIE_NO_SAMESITE / COOKIE_BROAD_DOMAIN | LOW\
  \ | default SameSite / shared with subdomains | SSO across subdomains (Domain needed)\
  \ | `SameSite=Lax`, host-only |\n| CORS_WILDCARD / CORS_NO_VARY_ORIGIN / CORS_ORIGIN_ECHO\
  \ / CORS_WILDCARD_METHODS | LOW | review CORS scope | public data | allowlist, `Vary:\
  \ Origin` |\n| SERVER_VERSION_DISCLOSED / TECH_DISCLOSED | LOW | version or stack\
  \ banner | - | hide banners |\n| X_XSS_PROTECTION_DEPRECATED / EXPECT_CT_DEPRECATED\
  \ | LOW | obsolete header | - | remove (or `X-XSS-Protection: 0`) |\n| DUPLICATE_HEADER\
  \ | LOW | repeated single-value header | - | send once |\n\nExit codes: 0 = no HIGH,\
  \ 1 = HIGH present, 2 = bad input. In CI, run against staging after deploy and gate\
  \ on HIGH; keep any `--ignore` list in the repo with a reason per code.\n\n## Live\
  \ checks the script cannot do (offline)\n- TLS versions and certificates: `openssl\
  \ s_client -connect host:443 -servername host` or an SSL test service.\n- HSTS preload\
  \ status: hstspreload.org.\n- `<meta http-equiv=\"Content-Security-Policy\">` in\
  \ the HTML body: `curl -s URL | grep -i content-security-policy`.\n- CORS allowlist\
  \ behaviour: repeat the curl with a trusted origin, `null`, `https://example.com.evil.example`\
  \ and `https://evilexample.com` (suffix/prefix match bugs).\n- Error pages (404,\
  \ 500) and the login/logout responses often miss headers set only in the app; capture\
  \ them too.\n\x1FFILE:templates/security-headers-review.md\x1E\n# Security headers\
  \ review: <site>\n\n**Captured:** <date, curl -sIL / HAR, which URLs>   **Stack:**\
  \ <nginx + Node app behind Cloudflare>\n**Result:** <HIGH n, MEDIUM n, LOW n> -\
  \ <one-sentence verdict, e.g. \"session cookie and CORS issues let other sites read\
  \ user data; fix before launch\">\n\n## Fix now (HIGH)\n| # | URL / response | Header\
  \ now | Risk | Set instead |\n|---|---|---|---|---|\n| 1 | <https://api.example.com/v1/me>\
  \ | `<Access-Control-Allow-Origin: (echoes Origin) + credentials>` | <any site reads\
  \ logged-in data> | <allowlist https://example.com only, Vary: Origin> |\n| 2 |\
  \ <https://example.com/> | `<Set-Cookie: sessionid=...; HttpOnly>` | <sent over\
  \ HTTP> | `<__Host-session=...; Path=/; Secure; HttpOnly; SameSite=Lax>` |\n\n##\
  \ Fix soon (MEDIUM)\n- <CSP: remove https: and 'unsafe-inline' from script-src;\
  \ deploy as report-only first>\n\n## Hardening (LOW)\n- <Permissions-Policy, COOP,\
  \ hide Server version>\n\n## Header block for <nginx / Apache / CDN / framework>\n\
  ```\n<add_header Strict-Transport-Security \"max-age=31536000; includeSubDomains\"\
  \ always;>\n<add_header Content-Security-Policy-Report-Only \"default-src 'self';\
  \ script-src 'self' 'nonce-$request_id'; object-src 'none'; base-uri 'self'; frame-ancestors\
  \ 'self'\" always;>\n<add_header X-Content-Type-Options \"nosniff\" always;>\n<add_header\
  \ Referrer-Policy \"strict-origin-when-cross-origin\" always;>\n<add_header Permissions-Policy\
  \ \"camera=(), microphone=(), geolocation=()\" always;>\n```\nWhere: <server block\
  \ for every response; CSP/Permissions/COOP on HTML locations only>\n\n## Rollout\n\
  1. <deploy CSP as report-only with report-to; collect violations for 1-2 weeks>\n\
  2. <HSTS max-age 300 -> 604800 -> 31536000; add includeSubDomains after confirming\
  \ <subdomains> serve HTTPS>\n3. <fix cookies and CORS in the app; retest with the\
  \ same curl commands, including Origin: https://evil.example>\n4. <switch CSP to\
  \ enforcing; keep the report endpoint>\n\n## To verify (not checked offline)\n-\
  \ <TLS configuration; error pages 404/500; login response cookies; meta CSP>\n\n\
  **Rollback:** <remove the CSP header or return to report-only; HSTS cannot be withdrawn\
  \ quickly - lower max-age only after the old value expires>\n**Open questions:**\
  \ <must partner.example.net embed the page? does the front end read any cookie?>\n\
  \x1FFILE:examples/shop-headers.txt\x1E\n# Captured 2026-10-31 for shop.example.com\
  \ before launch\n# curl -sIL http://shop.example.com/\n# http://shop.example.com/\n\
  HTTP/1.1 302 Found\nServer: nginx/1.18.0\nDate: Sat, 31 Oct 2026 07:10:02 GMT\n\
  Content-Type: text/html\nContent-Length: 145\nConnection: keep-alive\nLocation:\
  \ https://shop.example.com/\n\nHTTP/2 200\nserver: nginx/1.18.0\ndate: Sat, 31 Oct\
  \ 2026 07:10:02 GMT\ncontent-type: text/html; charset=utf-8\nstrict-transport-security:\
  \ max-age=86400\ncontent-security-policy: default-src 'self'; script-src 'self'\
  \ 'unsafe-inline' https:; img-src 'self' data: https:\nx-frame-options: ALLOW-FROM\
  \ https://partner.example.net\nx-xss-protection: 1; mode=block\nreferrer-policy:\
  \ no-referrer-when-downgrade\nx-powered-by: Express\nset-cookie: sessionid=4f2a9c;\
  \ Path=/; HttpOnly\nset-cookie: cart_id=88213; Path=/; Secure; SameSite=Lax\nset-cookie:\
  \ __Host-csrf=e1d0; Path=/; Domain=shop.example.com; Secure; SameSite=Strict\n\n\
  # curl -sI https://shop.example.com/static/app.3f9c1e.js\n# https://shop.example.com/static/app.3f9c1e.js\n\
  HTTP/2 200\nserver: nginx/1.18.0\ncontent-type: application/javascript\ncache-control:\
  \ public, max-age=31536000, immutable\nstrict-transport-security: max-age=86400\n\
  \n# curl -sv -o /dev/null -H \"Origin: https://evil.example\" https://api.shop.example.com/v1/me\
  \ 2>&1\n> GET /v1/me HTTP/2\n> Host: api.shop.example.com\n> Origin: https://evil.example\n\
  > Accept: */*\n< HTTP/2 200\n< content-type: application/json\n< access-control-allow-origin:\
  \ https://evil.example\n< access-control-allow-credentials: true\n< strict-transport-security:\
  \ max-age=31536000; includeSubDomains\n< x-content-type-options: nosniff\n\x1FFILE:examples/shop-headers-fixed.txt\x1E\
  \n# Same three URLs after applying the fixes from examples/header-report.md\n# http://shop.example.com/\n\
  HTTP/1.1 301 Moved Permanently\nServer: nginx\nContent-Type: text/html\nLocation:\
  \ https://shop.example.com/\n\nHTTP/2 200\nserver: nginx\ncontent-type: text/html;\
  \ charset=utf-8\nstrict-transport-security: max-age=31536000; includeSubDomains\n\
  content-security-policy: default-src 'self'; script-src 'self' 'nonce-r4nd0m' 'strict-dynamic';\
  \ img-src 'self' data: https://cdn.shop.example.com; object-src 'none'; base-uri\
  \ 'self'; frame-ancestors 'self' https://partner.example.net; form-action 'self'\n\
  x-content-type-options: nosniff\nreferrer-policy: strict-origin-when-cross-origin\n\
  permissions-policy: camera=(), microphone=(), geolocation=(), payment=(self)\ncross-origin-opener-policy:\
  \ same-origin-allow-popups\nset-cookie: __Host-session=4f2a9c; Path=/; Secure; HttpOnly;\
  \ SameSite=Lax\nset-cookie: cart_id=88213; Path=/; Secure; SameSite=Lax\nset-cookie:\
  \ __Host-csrf=e1d0; Path=/; Secure; SameSite=Strict\n\n# https://shop.example.com/static/app.3f9c1e.js\n\
  HTTP/2 200\nserver: nginx\ncontent-type: application/javascript\ncache-control:\
  \ public, max-age=31536000, immutable\nstrict-transport-security: max-age=31536000;\
  \ includeSubDomains\nx-content-type-options: nosniff\n\n> GET /v1/me HTTP/2\n> Host:\
