  , help=\"print JSON instead of markdown\")\n    ap.add_argument(\"--self-test\"\
  , action=\"store_true\")\n    a = ap.parse_args(argv)\n    if a.self_test:\n   \
  \     return self_test()\n    if not a.file:\n        ap.error(\"give a headers\
  \ file or --self-test\")\n    try:\n        text = sys.stdin.read() if a.file ==\
  \ \"-\" else open(a.file, encoding=\"utf-8\", errors=\"replace\").read()\n     \
  \   responses = load(text, a.url)\n    except (OSError, ValueError) as e:\n    \
  \    print(\"error: %s\" % e, file=sys.stderr)\n        return 2\n    ignore = {c.strip()\
  \ for c in a.ignore.split(\",\") if c.strip()}\n    results = run(responses, a.origin,\
