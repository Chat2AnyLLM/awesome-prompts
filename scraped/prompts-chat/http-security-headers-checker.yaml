  \ *\\naccess-control-allow-credentials: true\\n\"))\n    case(\"cors null origin\"\
  , lambda: \"CORS_NULL_ORIGIN\" in codes(J + \"access-control-allow-origin: null\\\
  naccess-control-allow-credentials: true\\n\"))\n    case(\"cors reflected test origin\
  \ HIGH\", lambda: [x[\"severity\"] for _, fs in run(load(J + \"access-control-allow-origin:\
  \ https://evil.example\\naccess-control-allow-credentials: true\\nvary: Origin\\\
  n\", \"https://api.a.test/me\"), \"https://evil.example\") for x in fs if x[\"code\"\
  ] == \"CORS_ORIGIN_REFLECTED\"] == [\"HIGH\"])\n    case(\"cors request origin from\
