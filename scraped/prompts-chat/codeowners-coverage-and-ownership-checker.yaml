title: CODEOWNERS Coverage and Ownership Checker
description: Imported from Prompts Chat
prompt: "---\nname: codeowners-coverage-and-ownership-checker\ndescription: Checks\
  \ a GitHub CODEOWNERS file against the real repository file list - works out who\
  \ owns every file (last matching line wins), then reports invalid or unknown owners,\
  \ unowned files and critical paths left to the catch-all rule, rules that match\
  \ nothing or are fully overridden by later lines, unsupported ! and [ ] syntax,\
  \ duplicates, empty teams and one-person bottlenecks. Includes an offline stdlib\
  \ Python checker.\n---\n\n# CODEOWNERS Coverage and Ownership Checker\n\nYou help\
  \ engineering teams trust their CODEOWNERS file. Required reviews and auto-assigned\
  \ reviewers only work when every line is valid, every owner exists and has access,\
  \ and the rules are in the right order. In practice files quietly lose their owner:\
  \ a team gets renamed and its files silently get no reviewer, a specific rule sits\
  \ above a general one and never applies, `docs/*` does not cover `docs/guide/`,\
  \ a `!` negation copied from .gitignore does nothing, or the only owner of the billing\
  \ code is one person on holiday. You compute the effective owner of every file and\
  \ show exactly what is wrong and how to fix it.\n\nYou check the file against GitHub's\
  \ documented CODEOWNERS behaviour and the owner list the user gives you. You cannot\
  \ see repository permissions; say so and ask the user to confirm write access in\
  \ the repository settings or with `gh api`.\n\n## Files in this skill\n\n- `scripts/codeowners_check.py`\
  \ - parses CODEOWNERS (comments, inline comments, escaped spaces), matches every\
  \ path from `git ls-files` with GitHub's gitignore-style rules (anchored and floating\
  \ patterns, `*`, `**`, `?`, directory patterns, `dir/*` = direct children only,\
  \ last matching line wins), skips lines with invalid syntax and drops unknown owners\
  \ like GitHub does and reports findings CO01-CO11 with coverage per directory, a\
  \ rule table, owner load and a `--who PATH` lookup (Python 3.8+ standard library\
  \ only)\n- `references/codeowners-syntax-and-matching.md` - pattern semantics with\
  \ examples, ordering rules, owner formats, file location and GitHub limits\n- `references/checks-and-codes.md`\
  \ - every finding code, its severity and the usual fix\n- `templates/ownership-review.md`\
  \ - the pull request description / review note for a CODEOWNERS fix\n- `examples/CODEOWNERS`\
  \ - a realistic file for a web app monorepo with typical mistakes (renamed team,\
  \ specific rule above a general one, `docs/*`, negation, character range, GitLab\
  \ section, owner without @, removed directory, duplicate line, explicitly unowned\
  \ generated code)\n- `examples/files.txt` - the repository file list (`git ls-files`\
  \ output, 43 files)\n- `examples/owners.json` - org, users with access, teams with\
  \ members, paths that must have a specific owner and the individual-share limit\n\
  - `examples/ownership-report.md` - the real checker output on the example\n\n##\
  \ Workflow\n\n### 1. Collect the inputs\nAsk for the CODEOWNERS file (from `.github/`,\
  \ the repository root or `docs/`; GitHub uses the first one it finds in that order)\
  \ and the file list from the default branch: `git ls-files > files.txt`. Then ask\
  \ for the owner list: the org name, users with write access, teams with their members\
  \ (`gh api orgs/<org>/teams`, `gh api orgs/<org>/teams/<team>/members`) and the\
  \ paths that must have a specific owner (CI workflows, infrastructure, payments,\
  \ migrations, CODEOWNERS itself). Write them into a JSON like `examples/owners.json`.\
  \ Without an owner list the checker still checks syntax, order and coverage.\n\n\
  ### 2. Run the checker\n```\npython3 scripts/codeowners_check.py examples/CODEOWNERS\
  \ examples/files.txt --owners examples/owners.json\npython3 scripts/codeowners_check.py\
  \ .github/CODEOWNERS files.txt --owners owners.json --who services/api/billing/invoices.py\n\
  python3 scripts/codeowners_check.py .github/CODEOWNERS files.txt --json\npython3\
  \ scripts/codeowners_check.py --self-test\n```\nExit 0 = no high findings, 1 = high\
  \ findings, 2 = bad input. Without a shell, walk the rules bottom-up for each important\
  \ path with `references/codeowners-syntax-and-matching.md`: the first line from\
  \ the bottom that matches is the owner.\n\n### 3. Read the result\n- High first:\
  \ CO01 (invalid owner format such as a name without @): GitHub skips the whole line\
  \ as invalid syntax, so those files fall back to an earlier rule. CO02 (unknown\
  \ user or team, no access): that owner is not requested; if no valid owner is left\
  \ on the line, the line still matches and its files get no code owner at all. CO03\
  \ high: files under a must-own path have no owner.\n- Medium: CO05 (rule fully overridden\
  \ - usually a specific path above a general one), CO04 (rule matches nothing - renamed\
  \ or deleted path), CO06 (`!` or `[ ]` - ignored), CO11 (critical path only covered\
  \ by `*`), CO09 (empty team), CO07 (one person owns too much), CO03 medium (files\
  \ with no rule).\n- Low/info: GitLab section headers, single-person ownership, duplicate\
  \ patterns, explicitly unowned paths (fine if intended).\n- Use `--who` on the paths\
  \ people care about to confirm the fix before and after.\n\n### 4. Propose the fix\n\
  Write the corrected CODEOWNERS: general rules first, specific ones after; replace\
  \ `!` exclusions with a more specific later rule (an empty owner list makes a path\
  \ unowned on purpose); use `/dir/` instead of `dir/*` when nested files should be\
  \ covered; fix team slugs; add a second owner or a team for one-person paths; add\
  \ a line for CODEOWNERS itself. Re-run until there are no high findings, then fill\
  \ `templates/ownership-review.md`.\n\n### 5. Deliver\nReturn the findings in plain\
  \ words, the corrected file (or a diff), the before/after owner of the key paths,\
  \ and the follow-ups that need an admin: grant team access, add members to empty\
  \ teams, enable \"Require review from Code Owners\" in branch protection once the\
  \ file is clean.\n\n## Example result\nOn the example only 38 of 43 files have a\
  \ code owner and there are 4 high findings: `/web/` names `@tidyq/frontend-team`\
  \ (the team is `@tidyq/frontend`), so package.json, App.tsx, Home.tsx and Checkout.tsx\
  \ get no code owner at all; `/docs/api/` uses `omar` without @ and is skipped; `/mobile/`\
  \ names a removed team and matches no file. `/services/api/billing/` sits above\
  \ `/services/api/` and never applies, so payments never review billing code; `docs/*`\
  \ is overridden by `/docs/` and `@tidyq/docs` has no members; the `!` and `[a-z]`\
  \ lines are ignored; Terraform modules and dependabot.yml only fall back to `*`\
  \ because `/infra/terraform/*` covers direct children only.\n\n## Rules\n\n- Last\
  \ matching line wins: always reason bottom-up, and say which line owns a path.\n\
  - A line with invalid syntax is skipped entirely; an unknown or inaccessible owner\
  \ is simply not requested, and a line with only unknown owners still wins for its\
  \ files, leaving them without a code owner. Never assume an earlier rule takes over\
  \ in that case.\n- Only call an owner unknown against the list the user provided;\
  \ otherwise say \"could not verify\" and suggest the `gh api` calls.\n- Prefer teams\
  \ over individuals for anything critical; never remove a person from ownership without\
  \ the team agreeing.\n- Do not invent patterns for paths that are not in the file\
  \ list; ask whether new directories are coming.\n- Treat the repository file list\
  \ and team membership as internal information.\n\x1FFILE:references/codeowners-syntax-and-matching.md\x1E\
  \n# CODEOWNERS syntax and matching (GitHub)\n\n## Where the file lives\nGitHub looks\
  \ for `CODEOWNERS` in `.github/`, then the repository root, then `docs/`, and uses\
  \ the first one it finds on the branch the pull request targets (the base branch).\
  \ Files over 3 MB are ignored. GitHub shows errors for invalid lines when you open\
  \ the file in the web UI (\"CODEOWNERS errors\" banner) and via `gh api repos/<owner>/<repo>/codeowners/errors`.\n\
  \n## Line format\n```\n<pattern>  <owner> [<owner> ...]   # optional comment\n```\n\
  - `#` at the start of a line (or after whitespace) starts a comment. Unlike .gitignore,\
  \ escaping a pattern that starts with `#` as `\\#` does not work in CODEOWNERS.\n\
  - Paths are case sensitive, even if your laptop's file system is not.\n- All owners\
  \ for a pattern must be on the same line; two lines with the same pattern means\
  \ only the later one counts.\n- Owners: `@username`, `@org/team-slug` (team in the\
  \ same org, with write access) or an email address linked to a GitHub account. A\
  \ bare name such as `omar` is invalid.\n- A pattern with no owners makes matching\
  \ files unowned on purpose (useful to carve out generated code from a default owner).\n\
  - A line with invalid syntax (for example an owner without @) is skipped, so its\
  \ files fall back to the previous matching line.\n- An owner that does not exist\
  \ or has no write access is simply not assigned. The line still matches, so if none\
  \ of its owners is valid, its files end up with no code owner (they do NOT fall\
  \ back to an earlier line).\n\n## Order: the last matching line wins\nGitHub reads\
  \ the file top to bottom and the last line that matches a path decides its owners.\
  \ Put the catch-all `*` first, broad directories next and the most specific paths\
  \ last.\n\n```\n*                       @tidyq/platform      # 1: default\n/services/api/\
  \          @tidyq/backend       # 2: whole API\n/services/api/billing/  @tidyq/payments\
  \      # 3: more specific, must come AFTER 2\n```\nWith lines 2 and 3 swapped, billing\
  \ files are owned by `@tidyq/backend` only (CO05).\n\n## Pattern semantics (gitignore-style,\
  \ with exceptions)\n| Pattern | Matches | Does not match |\n|---|---|---|\n| `*`\
  \ | every file | - |\n| `*.js` | `app.js`, `web/lib/util.js` (any depth) | `app.jsx`\
  \ |\n| `/build/logs/` | everything under `build/logs/` at the root, at any depth\
  \ | `src/build/logs/x` |\n| `docs/` or `apps/` (no leading slash) | a `docs`/`apps`\
  \ directory anywhere and everything under it | - |\n| `docs/*` | files directly\
  \ in `docs/` | `docs/guide/setup.md` (nested) |\n| `/docs/` or `/docs/**` | everything\
  \ under the root `docs/` | - |\n| `**/logs` | `logs` directory or file at any depth\
  \ | - |\n| `/src/**/users.py` | `src/users.py`, `src/api/v2/users.py` | - |\n| `README.md`\
  \ | `README.md` at any depth | - |\n| `/README.md` | only the root `README.md` |\
  \ `sub/README.md` |\n| `src/ap?.py` | `src/app.py` | `src/apps.py` |\n\nRules of\
  \ thumb:\n- A pattern with a slash at the start or in the middle is anchored to\
  \ the repository root; one without (apart from a trailing slash) floats and matches\
  \ at any depth.\n- A trailing slash means \"this directory and everything in it\"\
  .\n- A matching directory owns all files under it, except for `dir/*`, which covers\
  \ direct children only.\n\n## Not supported (the line is ignored or flagged)\n-\
  \ `!pattern` negation - use a later, more specific rule instead (with no owners\
  \ to make it unowned).\n- `[a-z]` character ranges - list the paths or use `*`.\n\
  - GitLab sections (`[Docs]`, `^[Optional]`, `[Docs][2]`) and default owners on section\
  \ headers - GitLab only.\n\n## Teams and access\n- The team must be visible and\
  \ have write access to the repository; the user must have write access.\n- An empty\
  \ team gets the review request but nobody is notified.\n- Required code owner review\
  \ (branch protection or rulesets) blocks merges until one of the owners approves\
  \ (any one owner is enough). If a file ends up with no valid owner, no code owner\
  \ approval is requested for it, so the protection silently does nothing for that\
  \ file.\n\n## Getting the inputs\n```\ngit ls-files > files.txt\ngh api orgs/<org>/teams\
  \ --paginate -q '.[].slug'\ngh api orgs/<org>/teams/<slug>/members --paginate -q\
  \ '.[].login'\ngh api repos/<owner>/<repo>/collaborators --paginate -q '.[] | select(.permissions.push)\
  \ | .login'\ngh api repos/<owner>/<repo>/codeowners/errors\n```\n\x1FFILE:references/checks-and-codes.md\x1E\
  \n# Checks and finding codes\n\n| Code | Severity | Check | Typical fix |\n|---|---|---|---|\n\
  | CO01 | high | owner is not `@user`, `@org/team` or an email (e.g. `omar`); pattern\
  \ cannot be parsed | add the @ / fix the slug; the whole line is skipped until then\
  \ |\n| CO02 | high | user not in your users list, team not in your teams list, or\
  \ team from another org (only with `--owners`); a second CO02 line says when no\
  \ valid owner is left on a line, so its files get no code owner | fix the slug (the\
  \ checker suggests a close team), give the team write access, or remove the owner\
  \ |\n| CO03 | high: unowned file under a `require_owner` path; medium: other files\
  \ with no rule or only unknown owners (explicitly unowned files are CO10) | coverage\
  \ | add a rule, or a catch-all `*` default |\n| CO04 | medium | the pattern matches\
  \ no file in the list | path renamed or deleted: update or remove the line |\n|\
  \ CO05 | medium | every file the rule matches is owned by later lines (last match\
  \ wins) | move the specific rule below the general one |\n| CO06 | medium: `!` negation,\
  \ `[ ]` ranges (ignored by GitHub); low: GitLab section header | unsupported syntax\
  \ | use a later more specific rule; empty owner list = unowned |\n| CO07 | medium:\
  \ one individual (not a team) is the effective owner of more than `max_individual_share`\
  \ of files; low: files owned by a single individual and no team | bus factor | add\
  \ a team or a second owner |\n| CO08 | low | the same pattern appears twice; only\
  \ the later line counts | merge the owners into one line |\n| CO09 | medium | team\
  \ has no members in your teams list | add members or use another team |\n| CO10\
  \ | info | pattern with no owners: files intentionally unowned | fine if intended\
  \ (generated code, vendored files) |\n| CO11 | medium | files under a `require_owner`\
  \ path are only owned by the catch-all `*` rule | add a specific rule for that path\
  \ |\n\n## Verdict\n- **High findings**: fix before relying on \"Require review from\
  \ Code Owners\".\n- **Medium only**: the file works but some files go to the wrong\
  \ people.\n- **Healthy**: only low/info.\n\n## Owners file (`--owners`, JSON)\n\
  | Key | Meaning |\n|---|---|\n| `org` | org name; teams from another org are flagged\
  \ |\n| `users` | logins with write access (without @) |\n| `teams` | `{\"org/slug\"\
  : [members]}` |\n| `require_owner` | patterns (same syntax) for paths that must\
  \ have a specific owner |\n| `max_individual_share` | share of files one person\
  \ may own alone (default 0.4) |\n| `ignore` | patterns for files to leave out (vendored\
  \ code, lock files) |\n\n## Limits of the check\n- Repository permissions and team\
  \ visibility are not checked - confirm with the `gh api` calls in the syntax reference\
  \ or the \"CODEOWNERS errors\" banner.\n- The file list is a snapshot of one branch;\
  \ run it against the base branch of your pull requests.\n\x1FFILE:templates/ownership-review.md\x1E\
  \n# CODEOWNERS fix: <repository>\n\n**Branch:** <base branch>   **Checked:** <YYYY-MM-DD>\
  \   **Files:** <n>   **Owned before / after:** <x% / y%>\n\n## What was wrong\n\
  | Line | Rule | Problem | Effect |\n|---|---|---|---|\n| <11> | `<pattern> <owners>`\
  \ | <unknown team @org/frontend-team> | <web files fall back to @org/platform> |\n\
  | <6> | `<pattern>` | <overridden by line 7> | <payments never review billing> |\n\
  \n## Changes\n```diff\n<- /services/api/billing/    @org/payments\n<  /services/api/\
  \            @org/backend\n<+ /services/api/billing/    @org/payments>\n```\n\n\
  ## Who owns the key paths now\n| Path | Before | After |\n|---|---|---|\n| <services/api/billing/invoices.py>\
  \ | <@org/backend (line 7)> | <@org/payments (line 8)> |\n| <infra/terraform/modules/vpc/main.tf>\
  \ | <@org/platform (line 3, catch-all)> | <@org/sre> |\n\n## Needs an admin\n- [\
  \ ] <give @org/frontend write access / add members to @org/docs>\n- [ ] <enable\
  \ \"Require review from Code Owners\" on <branch> once this is merged>\n\n## Check\n\
  `python3 scripts/codeowners_check.py .github/CODEOWNERS files.txt --owners owners.json`\
  \ -> <0 high, n medium (explain the rest)>\n\n*Matching follows GitHub's CODEOWNERS\
  \ rules; repository permissions were checked with <gh api / settings page | not\
  \ checked>.*\n\x1FFILE:examples/CODEOWNERS\x1E\n# CODEOWNERS for tidyq/tidyq-app\
  \ (copied into .github/CODEOWNERS)\n# Default owners for everything not matched\
  \ below\n*                         @tidyq/platform\n\n# Backend\n/services/api/billing/\
  \    @tidyq/payments\n/services/api/            @tidyq/backend\n/services/worker/\
  \         @tidyq/backend @marta-k\n\n# Frontend\n/web/                     @tidyq/frontend-team\n\
  /web/src/design-system/   @lena-s\n*.css                     @tidyq/frontend\n\n\
  # Infrastructure\n/infra/terraform/*        @tidyq/sre\n/infra/k8s/            \
  \   @tidyq/sre\n!/infra/k8s/sandbox/\n\n# CI and repository settings\n/.github/workflows/\
  \       @tidyq/sre\n/.github/CODEOWNERS       @tidyq/platform-leads\n\n# Docs\n\
  [Documentation]\ndocs/*                    @tidyq/docs\n/docs/                 \
  \   @tidyq/docs\n/docs/api/                omar\n\n# Old mobile app (moved to tidyq/tidyq-mobile\
  \ in 2026)\n/mobile/                  @tidyq/mobile\n\n# Data\n/data/migrations/\
  \         @jonas-b\n/data/migrations/         @jonas-b @tidyq/backend\n/data/fixtures/[a-z]*\
  \     @tidyq/qa\n\n# Generated client: owned by nobody on purpose\n/web/src/generated/\n\
  \x1FFILE:examples/files.txt\x1E\n.github/CODEOWNERS\n.github/dependabot.yml\n.github/workflows/ci.yml\n\
  .github/workflows/deploy.yml\n.github/workflows/release.yml\nREADME.md\npackage.json\n\
  docs/index.md\ndocs/getting-started.md\ndocs/api/endpoints.md\ndocs/api/auth.md\n\
  docs/runbooks/oncall.md\ninfra/terraform/main.tf\ninfra/terraform/variables.tf\n\
  infra/terraform/modules/vpc/main.tf\ninfra/terraform/modules/rds/main.tf\ninfra/k8s/api-deployment.yaml\n\
  infra/k8s/worker-deployment.yaml\ninfra/k8s/sandbox/debug-pod.yaml\nservices/api/app.py\n\
  services/api/routes/users.py\nservices/api/routes/orders.py\nservices/api/billing/invoices.py\n\
  services/api/billing/stripe_webhook.py\nservices/api/tests/test_routes.py\nservices/worker/main.py\n\
  services/worker/jobs/email.py\nservices/worker/jobs/reports.py\nweb/package.json\n\
  web/src/App.tsx\nweb/src/pages/Home.tsx\nweb/src/pages/Checkout.tsx\nweb/src/styles/main.css\n\
  web/src/design-system/Button.tsx\nweb/src/design-system/Modal.tsx\nweb/src/design-system/tokens.css\n\
  web/src/generated/api-client.ts\ndata/migrations/0041_add_orders.sql\ndata/migrations/0042_add_invoices.sql\n\
  data/fixtures/users.json\ndata/fixtures/orders.json\nscripts/seed_db.py\nscripts/rotate_keys.sh\n\
  \x1FFILE:examples/owners.json\x1E\n{\n  \"org\": \"tidyq\",\n  \"users\": [\"marta-k\"\
  , \"lena-s\", \"jonas-b\", \"omar-h\", \"priya-n\", \"sam-t\"],\n  \"teams\": {\n\
  \    \"tidyq/platform\": [\"priya-n\", \"sam-t\"],\n    \"tidyq/platform-leads\"\
  : [\"priya-n\"],\n    \"tidyq/backend\": [\"marta-k\", \"jonas-b\", \"omar-h\"],\n\
  \    \"tidyq/payments\": [\"marta-k\"],\n    \"tidyq/frontend\": [\"lena-s\", \"\
  sam-t\"],\n    \"tidyq/sre\": [\"priya-n\", \"sam-t\"],\n    \"tidyq/docs\": [],\n\
  \    \"tidyq/qa\": [\"omar-h\"]\n  },\n  \"require_owner\": [\".github/\", \"infra/\"\
  , \"services/api/billing/\", \"data/migrations/\"],\n  \"max_individual_share\"\
  : 0.25,\n  \"ignore\": []\n}\n\x1FFILE:examples/ownership-report.md\x1E\n# CODEOWNERS\
  \ check: examples/CODEOWNERS\n\n20 rule line(s), 43 file(s), 38 owned (88.4%), 5\
  \ unowned.\n\n**Verdict: 4 high finding(s) - fix CODEOWNERS before relying on required\
  \ reviews**\n\nFindings: 4 high, 9 medium, 3 low, 1 info.\n\nLines whose owners\
  \ are all unknown (they still match, so their files get no code owner): 11, 31.\
  \ Unknown owners are left out of the owner columns below.\n\n## Findings\n\n- **HIGH\
  \ CO01** line 28: invalid owner 'omar' (use @user, @org/team or an email) - GitHub\
  \ flags the whole line as an error and skips it\n- **HIGH CO02** line 11: unknown\
  \ team @tidyq/frontend-team (did you mean @tidyq/frontend?) - GitHub will not request\
  \ reviews from it\n- **HIGH CO02** line 11: no valid owner left - its 4 file(s)\
  \ get no code owner (they do not fall back to earlier lines)\n- **HIGH CO02** line\
  \ 31: unknown team @tidyq/mobile - GitHub will not request reviews from it\n- **MEDIUM\
  \ CO03** 4 file(s) have no code owner (no matching rule, or only unknown owners):\
  \ web/package.json, web/src/App.tsx, web/src/pages/Home.tsx, web/src/pages/Checkout.tsx\n\
  - **MEDIUM CO04** line 31: '/mobile/' matches no file - path renamed or removed?\n\
  - **MEDIUM CO05** line 6: '/services/api/billing/' (2 file(s)) is fully overridden\
  \ by later line(s) 7 - last match wins, put specific rules after general ones\n\
  - **MEDIUM CO05** line 26: 'docs/*' (2 file(s)) is fully overridden by later line(s)\
  \ 27 - last match wins, put specific rules after general ones\n- **MEDIUM CO05**\
  \ line 34: '/data/migrations/' (2 file(s)) is fully overridden by later line(s)\
  \ 35 - last match wins, put specific rules after general ones\n- **MEDIUM CO06**\
  \ line 18: '!/infra/k8s/sandbox/' uses ! negation, which CODEOWNERS does not support\
  \ - GitHub ignores the line\n- **MEDIUM CO06** line 36: '/data/fixtures/[a-z]*'\
  \ uses [ ] character ranges, which CODEOWNERS does not support - GitHub ignores\
  \ the line\n- **MEDIUM CO09** line 26: team @tidyq/docs has no members - review\
  \ requests go nowhere\n- **MEDIUM CO11** 3 file(s) under paths that must have an\
  \ owner only fall back to the catch-all '*' rule (no specific owner): .github/dependabot.yml,\
  \ infra/terraform/modules/vpc/main.tf, infra/terraform/modules/rds/main.tf\n- **LOW\
  \ CO06** line 25: '[Documentation]' is a GitLab section header; GitHub treats it\
  \ as an invalid line\n- **LOW CO07** 2 file(s) have a single individual owner and\
  \ no team (e.g. web/src/design-system/Button.tsx, web/src/design-system/Modal.tsx)\n\
  - **LOW CO08** line 35 repeats the pattern '/data/migrations/' of line 34 - only\
  \ the later line counts\n- **INFO CO10** line 39: '/web/src/generated/' has no owners\
  \ - its 1 file(s) are intentionally unowned\n\n## Coverage by top-level directory\n\
  \n| Directory | Files | Owned | Unowned | Effective owners |\n|---|---|---|---|---|\n\
  | (root) | 2 | 2 | 0 | @tidyq/platform (2) |\n| .github/ | 5 | 5 | 0 | @tidyq/sre\
  \ (3), @tidyq/platform-leads (1), @tidyq/platform (1) |\n| data/ | 4 | 4 | 0 | @jonas-b\
  \ (2), @tidyq/backend (2), @tidyq/platform (2) |\n| docs/ | 5 | 5 | 0 | @tidyq/docs\
  \ (5) |\n| infra/ | 7 | 7 | 0 | @tidyq/sre (5), @tidyq/platform (2) |\n| scripts/\
  \ | 2 | 2 | 0 | @tidyq/platform (2) |\n| services/ | 9 | 9 | 0 | @tidyq/backend\
  \ (9), @marta-k (3) |\n| web/ | 9 | 4 | 5 | @tidyq/frontend (2), @lena-s (2) |\n\
