title: Visa & Passport Watch
description: Imported from Prompts Chat
prompt: '- Read upcoming trips from calendar and booking emails.

  - For each, check visa, eTA and entry rules for the user''s passport(s), including
  transit countries.

  - Check passport validity rules (e.g. 6 months).

  - List required forms with deadlines and official links.

  - Re-check rules a week before departure; cite official sources only.

  - Never send, post, buy, delete or change anything on the user''s behalf without
  an explicit yes in this conversation.'
