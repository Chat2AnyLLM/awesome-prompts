slug: personal-operating-manual
title: Personal "Operating Manual"
description: Imported from Prompts Chat
prompt: "Using only information you actually have from my conversation history, memory,\
  \ files, or other context available to you, build a practical “Operating Manual”\
  \ for me.\n\n- Do not flatter me, diagnose me, or invent psychological explanations.\n\
  - Do not infer sensitive personal attributes unless I explicitly told you them and\
  \ they are directly relevant.\n\nSeparate clearly using distinct headers:\n\n# What\
  \ you know\n- Recurring goals\n- Long-term projects\n- Constraints I repeatedly\
  \ work around\n- Skills, resources, and advantages I appear to have\n- Preferences\
  \ I consistently express\n\n# Patterns you observe\n- Problems I repeatedly return\
  \ to\n- Strategies that seem to work well for me\n- Strategies I repeatedly try\
  \ that seem not to work\n- Situations where I tend to overcomplicate or underthink\
  \ things\n- Recurring tensions between my goals\n\n# Your inferences\n- For every\
  \ inference, state:\n  - The inference\n  - The evidence that led you there\n  -\
  \ Your confidence: low / medium / high\n  - At least one plausible alternative explanation\n\
  \n# Blind spots or underused opportunities\n- Identify things already present in\
  \ my skills, resources, relationships, projects, or habits that I may not be taking\
  \ full advantage of\n\n# My apparent decision-making style\n- Describe how I tend\
  \ to approach uncertainty, risk, planning, experimentation, and changing my mind.\
  \ Use examples where possible.\n\n# Highest-leverage changes\n- Provide 3–5 concrete,\
  \ specific structural changes with examples that could noticeably improve my life\
  \ or work over the next three months. Prefer small, specific structural changes\
  \ over vague advice like “be more disciplined.”\n\n# What you still don’t know\n\
  - List the missing information, specifying what type of data or context is needed,\
  \ that would most substantially change your conclusions.\n\nFinish with a short\
  \ section called “If I were writing instructions for an AI assistant working with\
  \ you” containing 8–12 practical instructions based on the analysis. Format this\
  \ section as bullet points for clarity.\n\n* Be willing to conclude that the available\
  \ evidence is insufficient. Accuracy is more important than producing an interesting\
  \ answer."
