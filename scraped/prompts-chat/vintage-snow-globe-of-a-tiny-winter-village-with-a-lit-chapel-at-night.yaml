title: Vintage Snow Globe of a Tiny Winter Village with a Lit Chapel at Night
description: Imported from Prompts Chat
prompt: 'A close-up studio photograph of a vintage glass snow globe on a dark walnut
  shelf. Inside the clear water-filled dome sits a tiny handmade winter village: a
