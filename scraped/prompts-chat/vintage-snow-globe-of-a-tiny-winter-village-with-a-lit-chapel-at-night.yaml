  glowing windows cast a faint golden light into the snow inside. Behind the globe,
  out of focus, a dark wintry window with blurred warm string-light bokeh. Warm low-key
  lighting from the side, deep blue and charcoal shadows, a cozy, nostalgic holiday
  mood.


  Macro lens, shallow depth of field with the chapel and cottages tack-sharp through
  the glass, slight refraction at the dome''s edges, rich contrast between warm window
  light and cool snow. No people, no figures inside the globe, no readable text or
  logos. Portrait 3:4.'
