title: SRT Subtitle Quality Checker
description: Imported from Prompts Chat
prompt: "---\nname: srt-subtitle-quality-checker\ndescription: Checks SRT and WebVTT\
  \ subtitle files for broken or overlapping timings, numbering gaps, empty cues,\
  \ reading speed above a characters-per-second limit, long or extra lines, cues that\
  \ flash by or linger, unbalanced tags, and sound labels, then rewrites and retimes\
  \ the problem cues and can shift the whole file. Use when a user shares subtitles\
  \ or captions and asks \"check my subtitles\", \"why are these captions hard to\
  \ read?\", \"fix the timing\", or \"make these subtitles follow the guidelines\"\
  .\n---\n\n# SRT Subtitle Quality Checker\n\nYou help video makers, translators,\
  \ and accessibility teams ship subtitles that people can actually read. You find\
  \ timing errors that break players, cues that appear too briefly or carry too much\
  \ text, and lines that are too long, and you fix them by rewriting the text more\
  \ concisely and adjusting times, without changing the meaning.\n\n## Files in this\
  \ skill\n\n- `scripts/check_subtitles.py` - parses SRT and WebVTT, checks timing,\
  \ numbering, reading speed, line length, line count, duration, gaps, tags, and sound\
  \ labels, and can shift every timestamp (Python 3 standard library only)\n- `references/subtitle-guidelines.md`\
  \ - common limits for reading speed, line length, duration, gaps, line breaks, and\
  \ when to use SDH labels\n- `references/condensing-techniques.md` - how to shorten\
  \ subtitle text without losing meaning, and how to retime cues\n- `templates/subtitle-review.md`\
  \ - the review report to return\n- `examples/example-workshop-video.md` - a worked\
  \ review of a short tutorial video\n\n## Workflow\n\n### 1. Collect the facts\n\
  Ask, or assume and say so:\n- The file (SRT or VTT) and the video length; frame\
  \ rate if known (24, 25, or 30 fps).\n- Audience and style guide: general adult\
  \ viewers, children, a platform guide, or the client's own limits.\n- Subtitle type:\
  \ same-language captions, translation, or SDH (for deaf and hard-of-hearing viewers,\
  \ with sound labels).\n- Whether you may rewrite text or only retime it.\n\n###\
  \ 2. Run the checker\n```bash\npython3 scripts/check_subtitles.py movie.srt\npython3\
  \ scripts/check_subtitles.py movie.srt --max-cps 15 --max-line 37   # children or\
  \ stricter guides\npython3 scripts/check_subtitles.py movie.vtt --json\npython3\
  \ scripts/check_subtitles.py movie.srt --shift -1200 > movie-synced.srt   # whole\
  \ file 1.2 s earlier\n```\nDefaults: 17 characters per second, 42 characters per\
  \ line, 2 lines, 0.833 to 7 seconds on screen, 83 ms minimum gap. Pick limits from\
  \ `references/subtitle-guidelines.md` to match the audience. If you cannot run the\
  \ script, check the cues by hand: duration, characters divided by seconds, longest\
  \ line, and overlaps with the next cue.\n\n### 3. Fix in this order\n1. HIGH findings\
  \ first: overlaps, out-of-order cues, end before start, bad timestamps, empty cues.\
  \ These break players or hide text.\n2. Reading speed: extend the cue into free\
  \ time before or after it (respect the minimum gap and shot changes the user mentions),\
  \ otherwise condense the text with `references/condensing-techniques.md`, otherwise\
  \ split the cue in two at a natural pause.\n3. Line length and line count: rebreak\
  \ at natural phrase boundaries; keep the top line shorter when possible; never break\
  \ between an article and its noun.\n4. Too short or too long on screen: merge very\
  \ short cues with a neighbor, split long ones.\n5. INFO items: renumber, balance\
  \ tags, remove sound labels from non-SDH files, chain cues (0 ms gap) or leave a\
  \ visible gap.\nRerun the checker on the corrected file until there are no HIGH\
  \ findings and every WARN is fixed or explained.\n\n### 4. Deliver\nFill in `templates/subtitle-review.md`:\
  \ summary with counts before and after, the limits used, a table of changed cues\
  \ (old and new times and text), and the full corrected file in the same format as\
  \ the input. Follow the style of `examples/example-workshop-video.md`.\n\n## Rules\n\
  - Never change the meaning, tone, or speaker of a line; condense filler, not content.\n\
  - Keep names, numbers, and technical terms exactly; if a term is wrong, flag it\
  \ instead of guessing.\n- Timing changes must stay in sync with the speech: extend\
  \ a cue only into silence, by at most about 0.5 s before speech starts or 1 s after\
  \ it ends, unless the user allows more.\n- Keep the input format (SRT stays SRT,\
  \ VTT stays VTT) and the original encoding (UTF-8).\n- Say clearly which findings\
  \ you could not fix without hearing the audio or seeing the video.\n\x1FFILE:references/subtitle-guidelines.md\x1E\
  \n# Subtitle guidelines: common limits\n\nDifferent broadcasters and platforms publish\
  \ their own style guides. The values below are common starting points; always prefer\
  \ the client's or platform's guide when one exists, and say which limits you used.\n\
  \n## Reading speed (characters per second, CPS)\n\nCPS = visible characters in the\
  \ cue (letters, digits, spaces, punctuation; not tags) divided by seconds on screen.\n\
  \n| Audience | Typical CPS limit |\n|---|---|\n| General adult viewers, same-language\
  \ or translated | 15 to 17 |\n| Fast-paced adult content where the guide allows\
  \ it | up to 20 |\n| Children (around 6 to 11 years) | 12 to 13 |\n| Learners of\
  \ the language, SDH with heavy sound labels | 13 to 15 |\n\nWords per minute is\
  \ an older measure; around 160 to 180 wpm corresponds to about 15 to 17 CPS in English.\n\
  \n## Line length and line count\n\n- 37 to 42 characters per line for most Latin-script\
  \ languages; 42 is the most common modern limit.\n- Maximum 2 lines per cue. A third\
  \ line covers the picture and is hard to read.\n- Use one line when the text fits\
  \ on one line; break into two only when needed.\n\n## Duration on screen\n\n- Minimum:\
  \ about 5/6 of a second (20 frames at 24 fps), even for a single word, so the eye\
  \ registers it.\n- Maximum: about 7 seconds. Longer cues get reread and feel stuck;\
  \ split them.\n\n## Gaps between cues\n\n- Chained cues: 0 ms gap is fine when the\
  \ speech is continuous.\n- Otherwise leave at least 2 frames (83 ms at 24 fps, 80\
  \ ms at 25 fps) so viewers notice that the text changed.\n- Gaps between 1 ms and\
  \ 2 frames cause a visible flicker and should be closed or widened.\n\n## Line breaks\n\
  \nBreak lines at natural linguistic units:\n- After punctuation (comma, full stop)\
  \ when possible.\n- Before conjunctions (and, but, because) and prepositions.\n\
  - Never between an article and its noun, an adjective and its noun, a first and\
  \ last name, or a verb and its auxiliary.\n- Prefer a pyramid shape (shorter top\
  \ line) when both breaks are equally good.\n\n## Timing to speech and shots\n\n\
  - Start the cue when the speech starts (a few frames early is fine), end it no more\
  \ than about 1 second after the speech ends.\n- Avoid carrying a cue across a hard\
  \ shot change; end it a couple of frames before the cut or start it after.\n\n##\
  \ SDH and captions\n\n- Sound labels like [door slams] or (MUSIC) and speaker IDs\
  \ belong in SDH/closed captions, not in standard translated subtitles.\n- Keep labels\
  \ short, lower case in square brackets is the most common modern style, and place\
  \ them where the sound happens.\n\n## Formatting\n\n- Italics for off-screen voices,\
  \ voice-over, songs, and foreign words, if the guide uses them. Every opening tag\
  \ needs a closing tag in the same cue.\n- No full stops at the end of single-line\
  \ fragments is a style choice; follow the guide.\n- SRT: cue number, timestamp line\
  \ `00:01:02,500 --> 00:01:04,000`, text, blank line. VTT: `WEBVTT` header, optional\
  \ cue id, timestamps with a dot `00:01:02.500`.\n\x1FFILE:references/condensing-techniques.md\x1E\
  \n# Condensing and retiming subtitles\n\nWhen a cue is too fast to read, try these\
  \ in order. Stop as soon as the cue fits the limits.\n\n## 1. Use free time first\
  \ (no text change)\n\n- Look at the gap before and after the cue. Extend the start\
  \ up to about 0.5 s earlier if nobody else is speaking, and the end up to about\
  \ 1 s later if the next cue starts later.\n- Keep the minimum gap (2 frames) to\
  \ the neighbors, or chain at 0 ms.\n- Required time for a cue = characters / CPS\
  \ limit. Example: 68 characters at 17 CPS need 4.0 s.\n\n## 2. Cut filler, keep\
  \ content\n\nRemove words that the viewer hears or sees anyway:\n- Hesitations and\
  \ fillers: \"well\", \"you know\", \"I mean\", \"um\", \"so, basically\".\n- Repetitions:\
  \ \"very, very\" -> \"very\"; false starts.\n- Greetings and names already obvious\
  \ from the picture.\n- Tag questions when tone is clear: \"It's ready, isn't it?\"\
  \ -> \"It's ready?\" only if the meaning stays.\n\n## 3. Use shorter forms\n\n|\
  \ Long | Short |\n|---|---|\n| we are going to | we'll |\n| at this point in time\
  \ | now |\n| in order to | to |\n| a large number of | many |\n| it is not possible\
  \ to | you can't |\n| I would like to show you | let me show you |\n| due to the\
  \ fact that | because |\n\nContractions are usually fine in subtitles; follow the\
  \ guide for formal content.\n\n## 4. Simplify structure\n\n- Turn passive into active:\
  \ \"The bowl was cleaned by the artist\" -> \"The artist cleans the bowl\".\n- Replace\
  \ a clause with a single word when possible.\n- Split one long sentence into two\
  \ shorter cues at a natural pause.\n\n## 5. Split or merge cues\n\n- Split a cue\
  \ longer than about 7 s, or one with a 3rd line, at a pause or punctuation; give\
  \ each half time in proportion to its characters.\n- Merge a cue under about 0.8\
  \ s with its neighbor when it is the same speaker and the result fits the limits.\n\
  \n## What never to cut\n\n- Names, numbers, quantities, dates, technical terms,\
  \ and negations (\"not\", \"never\").\n- Words that carry the joke, the twist, or\
  \ the emotion of the line.\n- Information the viewer needs later in the video.\n\
  \n## Retiming the whole file\n\nIf every cue is early or late by the same amount,\
  \ shift the whole file instead of editing cues:\n\n```bash\npython3 scripts/check_subtitles.py\
  \ movie.srt --shift 1500 > movie-shifted.srt    # 1.5 s later\npython3 scripts/check_subtitles.py\
  \ movie.srt --shift -800 > movie-shifted.srt    # 0.8 s earlier\n```\n\nIf the drift\
  \ grows over time (in sync at the start, late at the end), the frame rate is probably\
  \ wrong (for example 23.976 vs 25 fps); a constant shift will not fix it. Say so\
  \ and ask for the frame rate of the video.\n\x1FFILE:templates/subtitle-review.md\x1E\
  \n# Subtitle review: ${file_name}\n\n**Video:** ${video_title} (${duration}, ${fps}\
  \ fps)\n**Type:** ${type: translation / same-language captions / SDH}\n**Limits\
  \ used:** ${cps} chars/s, ${line} chars/line, ${lines} lines, ${min_dur} to ${max_dur}\
  \ s on screen, ${gap} ms minimum gap (${source_of_limits})\n\n## Summary\n\n| |\
  \ Before | After |\n|---|---|---|\n| Cues | | |\n| HIGH | | |\n| WARN | | |\n| INFO\
  \ | | |\n| Average chars/s | | |\n\nMain problems in one or two sentences.\n\n##\
  \ Changes\n\n| Cue | Problem | Old time | New time | Old text | New text |\n|---|---|---|---|---|---|\n\
  | | | | | | |\n\n## Not fixed (needs audio or video)\n\n- Cue ..., reason ...\n\n\
  ## Notes for the editor\n\n- Style choices made (italics, contractions, labels).\n\
  - Anything to check against the picture (shot changes, on-screen text).\n\n## Corrected\
  \ file\n\n```\n(full corrected SRT or VTT here, same format as the input)\n```\n\
  \x1FFILE:examples/example-workshop-video.md\x1E\n# Example: subtitle review of a\
  \ short tutorial video\n\n## User request\n\n\"Here are the English subtitles for\
  \ our 25-second kintsugi workshop clip. Viewers say they can't keep up. Can you\
  \ check them and fix what's wrong? General adult audience, normal subtitles, not\
  \ SDH.\"\n\n## Input (excerpt of interview.srt)\n\n```\n2\n00:00:03,250 --> 00:00:04,000\n\
  Today we are going to look at how to repair a cracked ceramic bowl with gold.\n\n\
  3\n00:00:03,900 --> 00:00:06,500\n[HAMMER TAPPING]\nFirst, clean the edges.\n\n\
  5\n00:00:07,000 --> 00:00:16,000\n<i>This technique is called kintsugi.\n```\n\n\
  ## Checker run\n\n```\n$ python3 scripts/check_subtitles.py interview.srt\ninterview.srt\
  \ (SRT): 8 cues, 00:00:01,000 to 00:00:24,000, avg 16.3 chars/s, avg 2.37 s on screen\n\
  \  HIGH 3  WARN 9  INFO 3\n  HIGH overlap          cue 3 @ 00:00:03,900: overlaps\
  \ the previous cue by 100 ms; end the previous cue at 00:00:03,817\n  HIGH end-before-start\
  \ cue 8 @ 00:00:21,000: ends at 00:00:20,500, not after its start\n  HIGH empty-cue\
  \        cue 9 @ 00:00:22,000: cue has no visible text\n  WARN too-short       \
  \ cue 2 @ 00:00:03,250: on screen 0.75 s (minimum 0.83 s)\n  WARN reading-speed\
  \    cue 2 @ 00:00:03,250: 102.7 chars/s (limit 17); needs 4.53 s on screen or about\
  \ 64 fewer chars\n  ...\n```\n\n## Review (filled template, shortened)\n\n**Limits\
  \ used:** 17 chars/s, 42 chars/line, 2 lines, 0.833 to 7 s, 83 ms gap (common general-audience\
  \ values; no client guide given).\n\n| | Before | After |\n|---|---|---|\n| Cues\
  \ | 8 | 8 |\n| HIGH | 3 | 0 |\n| WARN | 9 | 0 |\n| INFO | 3 | 0 |\n\nMain problems:\
  \ cue 2 carried a whole sentence for under a second, two cues had broken times,\
  \ a 9-second cue lingered, and cue 7 had three long lines. All fixed by condensing\
  \ filler, using the silence after the speech, and splitting one cue.\n\n| Cue |\
  \ Problem | Old time | New time | Old text | New text |\n|---|---|---|---|---|---|\n\
  | 2 | 102.7 chars/s, 77-char line, overlap with 3 | 03,250-04,000 | 03,300-06,600\
  \ | Today we are going to look at how to repair a cracked ceramic bowl with gold.\
  \ | Today we'll repair a cracked bowl / with lacquer and gold. |\n| 3 | sound label\
  \ in non-SDH file, overlap | 03,900-06,500 | 06,700-08,200 | [HAMMER TAPPING] /\
  \ First, clean the edges. | First, clean the edges. |\n| 4 (was 5) | 9 s on screen,\
  \ unclosed italics, numbering gap | 07,000-16,000 | 08,300-11,000 | `<i>`This technique\
  \ is called kintsugi. | `<i>`This technique is called kintsugi.`</i>` |\n| 5 (was\
  \ 6) | 0.4 s on screen | 16,000-16,400 | 16,000-16,900 | Okay. | Okay. |\n| 6 and\
  \ 7 (was 7) | 56 chars/s, 3 lines, 67-char line | 17,000-19,000 | 17,000-21,000\
  \ and 21,100-22,800 | You will need lacquer, a fine brush, and gold powder, and\
  \ patience, / lots of patience, / because each layer must dry. | You'll need lacquer,\
  \ a fine brush, / gold powder, and lots of patience. + Each layer must dry first.\
  \ |\n| 8 (was 8) | ends before it starts | 21,000-20,500 | 22,900-24,000 | Let's\
  \ start. | Let's start. |\n| 9 | empty cue | 22,000-24,000 | removed | | |\n\nNote:\
  \ the old cue 2 was shortened (\"look at how to\", \"ceramic\") only where the picture\
  \ already shows it; \"lacquer\" was added because the speaker names it a few seconds\
  \ later and the viewer needs it.\n\n**Not fixed:** none, but please confirm against\
  \ the video that the speaker pauses after \"gold\" (cue 2 now runs 2.6 s longer,\
  \ into what looks like silence) and that \"Let's start.\" is spoken at about 22.9\
  \ s.\n\nCorrected file rechecked:\n\n```\n$ python3 scripts/check_subtitles.py interview-fixed.srt\n\
  interview-fixed.srt (SRT): 8 cues, 00:00:01,000 to 00:00:24,000, avg 14.5 chars/s,\
  \ avg 2.17 s on screen\n  HIGH 0  WARN 0  INFO 0\n  no problems found\n```\n\x1F\
  FILE:scripts/check_subtitles.py\x1E\n#!/usr/bin/env python3\n\"\"\"Check SRT or\
  \ WebVTT subtitle files for timing and readability problems.\n\nUsage:\n  python3\
  \ check_subtitles.py FILE [FILE ...] [options]\n  python3 check_subtitles.py - <\
  \ movie.srt          (read stdin)\n\nOptions:\n  --max-cps N        maximum characters\
  \ per second (default 17)\n  --max-line N       maximum characters per line (default\
  \ 42)\n  --max-lines N      maximum lines per cue (default 2)\n  --min-dur S   \
  \     minimum cue duration in seconds (default 0.833, 20 frames at 24 fps)\n  --max-dur\
  \ S        maximum cue duration in seconds (default 7.0)\n  --min-gap MS       minimum\
  \ gap between cues in milliseconds (default 83, 2 frames at 24 fps)\n  --shift MS\
  \         print the file with every timestamp shifted by MS (may be negative) and\
  \ exit\n  --json             print findings as JSON\n  --fail-on LEVEL    exit 1\
  \ if any finding is at least LEVEL: high (default), warn, info\n\nFindings: HIGH\
  \ = broken or overlapping timing, unreadable numbering, empty cue;\nWARN = reading\
  \ speed, line length, too many lines, too short or long on screen;\nINFO = tiny\
  \ gaps, unbalanced tags, hearing-impaired brackets, statistics.\nExit codes: 0 ok,\
  \ 1 findings at or above --fail-on, 2 usage or parse error.\nPython 3 standard library\
  \ only.\n\"\"\"\nimport json\nimport math\nimport re\nimport sys\n\nTS = re.compile(r\"\
  ^\\s*(\\d{1,2}:)?(\\d{1,2}):(\\d{2})[,.](\\d{1,3})\\s*-->\\s*(\\d{1,2}:)?(\\d{1,2}):(\\\
  d{2})[,.](\\d{1,3})(.*)$\")\nTAG = re.compile(r\"</?[^>]+>|\\{\\\\[^}]*\\}\")\n\
  LEVELS = {\"info\": 0, \"warn\": 1, \"high\": 2}\n\n\ndef to_ms(h, m, s, ms):\n\
  \    h = int(h[:-1]) if h else 0\n    return ((h * 60 + int(m)) * 60 + int(s)) *\
  \ 1000 + int(ms.ljust(3, \"0\"))\n\n\ndef fmt(ms, vtt=False):\n    sign = \"-\"\
  \ if ms < 0 else \"\"\n    ms = abs(ms)\n    h, rem = divmod(ms, 3600000)\n    m,\
  \ rem = divmod(rem, 60000)\n    s, rem = divmod(rem, 1000)\n    sep = \".\" if vtt\
  \ else \",\"\n    return f\"{sign}{h:02d}:{m:02d}:{s:02d}{sep}{rem:03d}\"\n\n\n\
  def parse(text):\n    \"\"\"Return (cues, errors, is_vtt). Each cue: dict(index,\
  \ start, end, lines, line_no).\"\"\"\n    text = text.replace(\"\\r\\n\", \"\\n\"\
  ).replace(\"\\r\", \"\\n\").lstrip(\"\\ufeff\")\n    is_vtt = text.lstrip().startswith(\"\
  WEBVTT\")\n    blocks = re.split(r\"\\n\\s*\\n\", text.strip(\"\\n\"))\n    cues,\
  \ errors = [], []\n    line_no = 1\n    for block in blocks:\n        lines = block.split(\"\
  \\n\")\n        start_line = line_no\n        line_no += len(lines) + 1\n      \
  \  if is_vtt and (lines[0].startswith(\"WEBVTT\") or lines[0].startswith(\"NOTE\"\
  ) or lines[0].startswith(\"STYLE\") or lines[0].startswith(\"REGION\")):\n     \
  \       continue\n        ts_i = next((i for i, ln in enumerate(lines[:3]) if \"\
  -->\" in ln), None)\n        if ts_i is None:\n            errors.append({\"level\"\
  : \"high\", \"rule\": \"unparsed-block\", \"line\": start_line,\n              \
  \             \"message\": f\"block without a timestamp line: {lines[0][:50]!r}\"\
  })\n            continue\n        m = TS.match(lines[ts_i])\n        if not m:\n\
  \            errors.append({\"level\": \"high\", \"rule\": \"bad-timestamp\", \"\
  line\": start_line + ts_i,\n                           \"message\": f\"cannot read\
  \ timestamp {lines[ts_i].strip()!r} (expected 00:01:02,500 --> 00:01:04,000)\"})\n\
  \            continue\n        g = m.groups()\n        index = lines[0].strip()\
  \ if ts_i == 1 else None\n        cues.append({\"index\": index, \"start\": to_ms(*g[0:4]),\
  \ \"end\": to_ms(*g[4:8]),\n                     \"lines\": [ln for ln in lines[ts_i\
  \ + 1:]], \"line_no\": start_line})\n    return cues, errors, is_vtt\n\n\ndef visible(line):\n\
  \    return TAG.sub(\"\", line).strip()\n\n\ndef check(cues, errors, opts, is_vtt):\n\
  \    out = list(errors)\n\n    def add(level, rule, cue, msg):\n        out.append({\"\
  level\": level, \"rule\": rule, \"line\": cue[\"line_no\"],\n                  \
  \  \"cue\": cue[\"index\"] or \"-\", \"time\": fmt(cue[\"start\"], is_vtt), \"message\"\
  : msg})\n\n    if not is_vtt:\n        expected = 1\n        for c in cues:\n  \
  \          if c[\"index\"] is None or not c[\"index\"].isdigit():\n            \
  \    add(\"high\", \"bad-number\", c, f\"cue number missing or not a number: {c['index']!r}\"\
  )\n            elif int(c[\"index\"]) != expected:\n                add(\"warn\"\
  , \"numbering\", c, f\"cue number {c['index']} but expected {expected} (renumber\
  \ the file)\")\n                expected = int(c[\"index\"])\n            expected\
  \ += 1\n    prev = None\n    for c in cues:\n        dur = (c[\"end\"] - c[\"start\"\
  ]) / 1000\n        text_lines = [visible(ln) for ln in c[\"lines\"] if visible(ln)]\n\
  \        chars = sum(len(ln) for ln in text_lines)\n        if c[\"end\"] <= c[\"\
  start\"]:\n            add(\"high\", \"end-before-start\", c, f\"ends at {fmt(c['end'],\
  \ is_vtt)}, not after its start\")\n        if not text_lines:\n            add(\"\
  high\", \"empty-cue\", c, \"cue has no visible text\")\n        if prev is not None:\n\
  \            gap = c[\"start\"] - prev[\"end\"]\n            if c[\"start\"] < prev[\"\
  start\"]:\n                add(\"high\", \"out-of-order\", c, f\"starts before the\
  \ previous cue ({fmt(prev['start'], is_vtt)}); sort by time\")\n            elif\
  \ gap < 0:\n                add(\"high\", \"overlap\", c, f\"overlaps the previous\
  \ cue by {-gap} ms; end the previous cue at {fmt(c['start'] - opts['min_gap'], is_vtt)}\"\
  )\n            elif 0 < gap < opts[\"min_gap\"]:\n                add(\"info\",\
  \ \"tiny-gap\", c, f\"only {gap} ms after the previous cue; use 0 ms (chained) or\
  \ at least {opts['min_gap']} ms so the change is visible\")\n        if c[\"end\"\
  ] > c[\"start\"] and text_lines:\n            if dur < opts[\"min_dur\"]:\n    \
  \            add(\"warn\", \"too-short\", c, f\"on screen {dur:.2f} s (minimum {opts['min_dur']:.2f}\
  \ s)\")\n            if dur > opts[\"max_dur\"]:\n                add(\"warn\",\
  \ \"too-long\", c, f\"on screen {dur:.2f} s (maximum {opts['max_dur']:.1f} s); split\
  \ it or shorten the time\")\n            cps = chars / dur if dur > 0 else float(\"\
  inf\")\n            if cps > opts[\"max_cps\"]:\n                need = chars /\
  \ opts[\"max_cps\"]\n                cut = max(1, math.ceil(chars - opts[\"max_cps\"\
  ] * dur))\n                add(\"warn\", \"reading-speed\", c, f\"{cps:.1f} chars/s\
  \ (limit {opts['max_cps']:g}); needs {need:.2f} s on screen or about {cut} fewer\
  \ chars\")\n        for ln in text_lines:\n            if len(ln) > opts[\"max_line\"\
  ]:\n                add(\"warn\", \"line-length\", c, f\"line has {len(ln)} chars\
  \ (limit {opts['max_line']}): {ln[:60]!r}\")\n        if len(text_lines) > opts[\"\
  max_lines\"]:\n            add(\"warn\", \"too-many-lines\", c, f\"{len(text_lines)}\
  \ lines (limit {opts['max_lines']})\")\n        raw = \" \".join(c[\"lines\"])\n\
  \        for tag in (\"i\", \"b\", \"u\"):\n            if len(re.findall(rf\"<{tag}>\"\
  , raw, re.I)) != len(re.findall(rf\"</{tag}>\", raw, re.I)):\n                add(\"\
  info\", \"unbalanced-tag\", c, f\"<{tag}> tags are not balanced in this cue\")\n\
  \        if re.search(r\"\\[[^\\]]+\\]|\\([A-Z][A-Z ]+\\)\", raw):\n           \
  \ add(\"info\", \"sdh-label\", c, \"contains a sound or speaker label in brackets;\
  \ keep it only in SDH/CC files\")\n        prev = c\n    return out\n\n\ndef stats(cues,\
  \ is_vtt=False):\n    if not cues:\n        return {}\n    total_chars = sum(len(visible(ln))\
  \ for c in cues for ln in c[\"lines\"])\n    total_time = sum(max(c[\"end\"] - c[\"\
  start\"], 0) for c in cues) / 1000\n    return {\"cues\": len(cues), \"first\":\
  \ fmt(cues[0][\"start\"], is_vtt), \"last_end\": fmt(max(c[\"end\"] for c in cues),\
  \ is_vtt),\n            \"avg_cps\": round(total_chars / total_time, 1) if total_time\
  \ else None,\n            \"avg_duration_s\": round(total_time / len(cues), 2)}\n\
  \n\ndef shift_text(text, delta):\n    def rep(m):\n        g = m.groups()\n    \
  \    vtt = \".\" in m.group(0).split(\"-->\")[0]\n        a = max(to_ms(*g[0:4])\
  \ + delta, 0)\n        b = max(to_ms(*g[4:8]) + delta, 0)\n        return f\"{fmt(a,\
  \ vtt)} --> {fmt(b, vtt)}{g[8]}\"\n    return \"\\n\".join(TS.sub(rep, ln) if \"\
  -->\" in ln else ln\n                     for ln in text.replace(\"\\r\\n\", \"\\\
  n\").split(\"\\n\"))\n\n\ndef main(argv):\n    opts = {\"max_cps\": 17.0, \"max_line\"\
  : 42, \"max_lines\": 2, \"min_dur\": 0.833, \"max_dur\": 7.0,\n            \"min_gap\"\
  : 83, \"json\": False, \"fail_on\": \"high\", \"shift\": None}\n    files = []\n\
  \    it = iter(argv)\n    try:\n        for a in it:\n            if a == \"--json\"\
  :\n                opts[\"json\"] = True\n            elif a in (\"--max-cps\",\
  \ \"--min-dur\", \"--max-dur\"):\n                opts[a[2:].replace(\"-\", \"_\"\
  )] = float(next(it))\n            elif a in (\"--max-line\", \"--max-lines\", \"\
  --min-gap\", \"--shift\"):\n                opts[a[2:].replace(\"-\", \"_\")] =\
  \ int(next(it))\n            elif a == \"--fail-on\":\n                opts[\"fail_on\"\
  ] = next(it).lower()\n                if opts[\"fail_on\"] not in LEVELS:\n    \
  \                raise ValueError(\"--fail-on must be high, warn, or info\")\n \
  \           elif a in (\"-h\", \"--help\"):\n                print(__doc__)\n  \
  \              return 0\n            elif a.startswith(\"--\"):\n              \
  \  raise ValueError(f\"unknown option {a}\")\n            else:\n              \
  \  files.append(a)\n    except (StopIteration, ValueError) as e:\n        print(f\"\
  error: {e or 'option needs a value'}\", file=sys.stderr)\n        return 2\n   \
  \ if not files:\n        print(\"error: give at least one .srt or .vtt file, or\
  \ - for stdin\", file=sys.stderr)\n        return 2\n    report, worst = [], -1\n\
  \    for f in files:\n        try:\n            text = sys.stdin.read() if f ==\
  \ \"-\" else open(f, encoding=\"utf-8-sig\").read()\n        except (OSError, UnicodeDecodeError)\
  \ as e:\n            print(f\"error: cannot read {f}: {e}\", file=sys.stderr)\n\
  \            return 2\n        if opts[\"shift\"] is not None:\n            sys.stdout.write(shift_text(text,\
  \ opts[\"shift\"]))\n            return 0\n        cues, errors, is_vtt = parse(text)\n\
  \        if not cues:\n            print(f\"error: {f}: no subtitle cues found (is\
  \ this an SRT or WebVTT file?)\", file=sys.stderr)\n            return 2\n     \
  \   findings = check(cues, errors, opts, is_vtt)\n        for x in findings:\n \
  \           worst = max(worst, LEVELS[x[\"level\"]])\n        report.append({\"\
  file\": f, \"format\": \"vtt\" if is_vtt else \"srt\", \"stats\": stats(cues, is_vtt),\
  \ \"findings\": findings})\n    if opts[\"json\"]:\n        print(json.dumps(report,\
  \ indent=2))\n    else:\n        for r in report:\n            counts = {lv: sum(1\
  \ for x in r[\"findings\"] if x[\"level\"] == lv) for lv in (\"high\", \"warn\"\
  , \"info\")}\n            st = r[\"stats\"]\n            print(f\"{r['file']} ({r['format'].upper()}):\
  \ {st['cues']} cues, {st['first']} to {st['last_end']}, \"\n                  f\"\
  avg {st['avg_cps']} chars/s, avg {st['avg_duration_s']} s on screen\")\n       \
  \     print(f\"  HIGH {counts['high']}  WARN {counts['warn']}  INFO {counts['info']}\"\
  )\n            for x in sorted(r[\"findings\"], key=lambda x: (-LEVELS[x[\"level\"\
  ]], x[\"line\"])):\n                where = f\"cue {x.get('cue', '-')} @ {x['time']}\"\
  \ if \"time\" in x else f\"line {x['line']}\"\n                print(f\"  {x['level'].upper():<4}\
  \ {x['rule']:<16} {where}: {x['message']}\")\n            if not r[\"findings\"\
  ]:\n                print(\"  no problems found\")\n    return 1 if worst >= LEVELS[opts[\"\
  fail_on\"]] else 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main(sys.argv[1:]))"
