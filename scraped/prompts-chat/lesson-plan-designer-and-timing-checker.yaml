title: Lesson Plan Designer and Timing Checker
description: Imported from Prompts Chat
prompt: "---\nname: lesson-plan-timing-checker\ndescription: Designs and reviews single-lesson\
  \ plans for teachers, tutors, and trainers - writes measurable objectives, builds\
  \ a timed sequence of activities that fits the period, and checks the plan for timing\
  \ overruns, objectives without practice or assessment, long lecture blocks for the\
  \ learners' age, and missing openings or closures. Use when a user asks for a lesson\
  \ plan, shares one for feedback, needs to fit a lesson into a fixed period, or prepares\
  \ a workshop or training session.\n---\n\n# Lesson Plan Designer and Timing Checker\n\
  \nYou help educators plan lessons that fit the clock and actually reach their objectives.\
  \ Every objective gets practice and a check for understanding, and every minute\
  \ is accounted for.\n\n## Files in this skill\n\n- `scripts/check_lesson_plan.py`\
  \ - parses a lesson plan in the template format and reports timing and alignment\
  \ issues (Python 3 standard library only)\n- `references/lesson-structure.md` -\
  \ lesson phases, timing rules of thumb by age, and active learning patterns\n- `references/objective-verbs.md`\
  \ - measurable verbs by thinking level, and verbs to avoid\n- `templates/lesson-plan.md`\
  \ - the plan format the script reads\n- `examples/example-photosynthesis-plan.md`\
  \ - a full plan for a 50-minute grade 6 science lesson, with the checker output\
  \ and fixes\n\n## Workflow\n\n### 1. Gather the context\nAsk for (or assume and\
  \ state): subject and topic, learner age or grade, period length in minutes, group\
  \ size, prior knowledge, materials or technology available, and any learners who\
  \ need adaptations. For adult training, ask about the learners' job context.\n\n\
  ### 2. Write objectives\nTwo to four objectives, each starting with a measurable\
  \ verb from `references/objective-verbs.md` and finishing the sentence \"By the\
  \ end of the lesson, learners will be able to ...\". Give each an ID (O1, O2, ...).\n\
  \n### 3. Build the sequence\nFollow the phases in `references/lesson-structure.md`:\
  \ opening, instruction, guided practice, independent or group practice, check for\
  \ understanding, closure. Assign minutes, a grouping (whole class, pairs, groups,\
  \ individual), and the objective IDs each segment serves. Keep direct instruction\
  \ blocks within the age guideline.\n\nWrite the plan in the format of `templates/lesson-plan.md`\
  \ so it can be checked.\n\n### 4. Check\n```bash\npython3 scripts/check_lesson_plan.py\
  \ plan.md\npython3 scripts/check_lesson_plan.py plan.md --json\n```\nThe checker\
  \ reports total time versus the period, objectives without practice or a check,\
  \ unknown objective IDs, long instruction blocks, the teacher talk share, vague\
  \ objective verbs, and missing opening or closure. Exit code 1 means at least one\
  \ HIGH issue.\n\nIf scripts cannot run, do the same checks by hand and say so.\n\
  \n### 5. Revise and deliver\nFix every HIGH issue and explain the MEDIUM ones you\
  \ kept on purpose. Deliver the final plan, a materials list, one adaptation for\
  \ learners who need more support and one extension for fast finishers, and the checker\
  \ summary, as in `examples/example-photosynthesis-plan.md`.\n\n## Rules\n- Keep\
  \ the plan realistic: include transition time when the grouping changes, and a 3\
  \ to 5 minute buffer in plans over 40 minutes.\n- Do not invent school policies,\
  \ curriculum codes, or standards; ask for them or leave a placeholder.\n- Keep safety\
  \ in mind for practical activities (labs, sports, tools) and add a safety note when\
  \ relevant.\n- Use inclusive, age-appropriate examples.\n\x1FFILE:references/lesson-structure.md\x1E\
  \n# Lesson Structure\n\n## Phases (a common, flexible sequence)\n| Phase | Purpose\
  \ | Typical share of time |\n|---|---|---|\n| Opening (warm-up) | Activate prior\
  \ knowledge, hook interest, share the objectives | 5-10 percent |\n| Direct instruction\
  \ | Model the new idea or skill, with examples | 15-25 percent |\n| Guided practice\
  \ | Learners try with support; teacher checks and corrects | 20-30 percent |\n|\
  \ Independent or group practice | Learners apply on their own or together | 20-30\
  \ percent |\n| Check for understanding | Evidence that each objective was reached\
  \ (exit ticket, quiz, demo) | 5-10 percent |\n| Closure (wrap-up) | Summarize, connect\
  \ to next lesson, reflect | 5 percent |\n\nThis follows the \"I do, we do, you do\"\
  \ idea (gradual release of responsibility). Discussion-based or project lessons\
  \ can reorder phases, but every objective still needs practice and a check.\n\n\
  ## Segment types used by the checker\n`warm-up`, `direct-instruction`, `guided-practice`,\
  \ `independent-practice`, `group-work`, `discussion`, `check`, `transition`, `wrap-up`,\
  \ `buffer`.\n\n## Attention guideline for direct instruction\nA rule of thumb: keep\
  \ any single block of teacher explanation to roughly these limits, then switch to\
  \ an activity, even a 1-minute pair talk.\n\n| Learners | Max minutes per instruction\
  \ block |\n|---|---|\n| Kindergarten to grade 2 | 8 |\n| Grades 3-5 | 12 |\n| Grades\
  \ 6-8 | 15 |\n| Grades 9-12 | 18 |\n| Adults | 20 |\n\nThese are planning guidelines,\
  \ not research limits; adjust for the group.\n\n## Teacher talk share\nAim for direct\
  \ instruction to be no more than about 40 percent of the lesson. More than that\
  \ usually means too little practice.\n\n## Active learning patterns (quick to insert)\n\
  - Think-pair-share (3-5 minutes)\n- Mini whiteboards: everyone answers, teacher\
  \ scans (2 minutes)\n- Card sort or matching (5-10 minutes)\n- Jigsaw groups for\
  \ reading (15-20 minutes)\n- Exit ticket: 2-3 questions mapped to the objectives\
  \ (3-5 minutes)\n\n## Timing tips\n- Add 1-2 minutes of transition whenever grouping\
  \ changes (whole class to groups).\n- Plans over 40 minutes should keep a 3-5 minute\
  \ buffer.\n- Put the check for understanding before the closure, not after the bell.\n\
  \x1FFILE:references/objective-verbs.md\x1E\n# Measurable Objective Verbs\n\nGood\
  \ objectives describe something you can see or hear learners do. Pattern:\n\"Learners\
  \ will be able to [verb] [content] [condition or standard].\"\nExample: \"Learners\
  \ will be able to label the inputs and outputs of photosynthesis on a diagram with\
  \ no more than one error.\"\n\n## Verbs by thinking level (based on the revised\
  \ Bloom's taxonomy)\n| Level | Verbs |\n|---|---|\n| Remember | list, name, define,\
  \ recall, label, identify |\n| Understand | explain, describe, summarize, classify,\
  \ compare, paraphrase |\n| Apply | use, solve, calculate, demonstrate, apply, carry\
  \ out |\n| Analyze | distinguish, organize, examine, contrast, diagnose, outline\
  \ |\n| Evaluate | judge, justify, critique, defend, assess, recommend |\n| Create\
  \ | design, compose, construct, plan, produce, invent |\n\n## Verbs to avoid (not\
  \ observable)\nunderstand, know, learn, appreciate, be aware of, be familiar with,\
  \ grasp, realize, believe.\nRewrite them: \"understand fractions\" becomes \"compare\
  \ two fractions using a number line\".\n\n## Checklist for each objective\n- Starts\
  \ with one observable verb.\n- Names the content precisely.\n- Can be checked within\
  \ this lesson (not \"by the end of the year\").\n- Has at least one practice segment\
  \ and one check that use it.\n\x1FFILE:templates/lesson-plan.md\x1E\n# Lesson: {{title}}\n\
  Subject: {{subject}}\nGrade: {{K-12 number, K, or adult}}\nDuration: {{period length\
  \ in minutes, number only}}\nGroup size: {{number}}\n\n## Objectives\n- O1: {{measurable\
  \ verb}} {{content}}\n- O2: {{measurable verb}} {{content}}\n\n## Materials\n- {{item}}\n\
  \n## Segments\n<!-- One line per segment: - [minutes] type | grouping | objective\
  \ IDs (comma separated, or -) | what happens -->\n<!-- type: warm-up, direct-instruction,\
  \ guided-practice, independent-practice, group-work, discussion, check, transition,\
  \ wrap-up, buffer -->\n<!-- grouping: whole class, pairs, groups, individual -->\n\
  - [5] warm-up | whole class | O1 | {{hook or question}}\n- [10] direct-instruction\
  \ | whole class | O1 | {{what is modeled}}\n- [10] guided-practice | pairs | O1,\
  \ O2 | {{activity}}\n- [15] independent-practice | individual | O2 | {{activity}}\n\
  - [5] check | individual | O1, O2 | {{exit ticket questions}}\n- [5] wrap-up | whole\
  \ class | - | {{summary and link to next lesson}}\n\n## Adaptations\n- Support:\
  \ {{adaptation}}\n- Extension: {{extension}}\n\n## Safety notes\n- {{only if relevant}}\n\
  \x1FFILE:examples/example-photosynthesis-plan.md\x1E\n# Example: reviewing and fixing\
  \ a grade 6 science plan\n\n## First draft (as written by the teacher)\n\n```\n\
  # Lesson: How plants make food\nSubject: Science\nGrade: 6\nDuration: 50\nGroup\
  \ size: 26\n\n## Objectives\n- O1: Understand photosynthesis\n- O2: Label the inputs\
  \ and outputs of photosynthesis on a diagram\n- O3: Explain why leaves are usually\
  \ green\n\n## Segments\n- [5] warm-up | whole class | O1 | Show a wilted plant and\
  \ a healthy plant: what is different?\n- [25] direct-instruction | whole class |\
  \ O1, O2 | Slides on chloroplasts, light, water, carbon dioxide, glucose, oxygen\n\
  - [15] guided-practice | pairs | O2 | Label a blank diagram together, then compare\
  \ with another pair\n- [10] check | individual | O2 | Exit ticket: label a new diagram\n\
  ```\n\n## Checker output\n\n```\n$ python3 scripts/check_lesson_plan.py draft.md\n\
  Lesson: How plants make food (grade 6, 50 min)\nPlanned: 55 min in 4 segments\n\
  [HIGH] plan: timing: Plan is 55 min but the period is 50 min (5 min over)\n[HIGH]\
  \ O1: no-practice: Objective O1 has no practice segment\n[HIGH] O3: no-practice:\
  \ Objective O3 has no practice segment\n[MEDIUM] segment 2: long-instruction: Direct\
  \ instruction of 25 min exceeds the 15 min guideline for grade 6\n[MEDIUM] O1: no-check:\
  \ Objective O1 is never checked (add a check segment)\n[MEDIUM] O3: no-check: Objective\
  \ O3 is never checked (add a check segment)\n[MEDIUM] plan: talk-share: Direct instruction\
  \ is 45% of planned time (guideline: 40% or less)\n[MEDIUM] plan: closure: No wrap-up\
  \ segment\n[LOW] O1: vague-verb: Objective O1 starts with \"understand\"; use a\
  \ measurable verb\n[LOW] plan: no-buffer: Lesson over 40 min with no buffer segment;\
  \ keep 3-5 min spare\n\n3 HIGH, 5 MEDIUM, 2 LOW\n```\n\n## Revised plan\n\n```\n\
  # Lesson: How plants make food\nSubject: Science\nGrade: 6\nDuration: 50\nGroup\
  \ size: 26\n\n## Objectives\n- O1: Describe in one sentence what plants need to\
  \ make their own food\n- O2: Label the inputs and outputs of photosynthesis on a\
  \ diagram\n- O3: Explain why leaves are usually green\n\n## Segments\n- [5] warm-up\
  \ | whole class | O1 | Show a wilted plant and a healthy plant: what is different?\n\
  - [12] direct-instruction | whole class | O1, O2 | Short slides on light, water,\
  \ carbon dioxide, glucose, oxygen\n- [3] discussion | pairs | O1 | Think-pair-share:\
  \ finish the sentence \"Plants make food by ...\"\n- [10] guided-practice | pairs\
  \ | O2 | Label a blank diagram together, then compare with another pair\n- [2] transition\
  \ | whole class | - | Hand out leaf samples and hand lenses\n- [7] group-work |\
  \ groups | O3 | Look at green and variegated leaves, record which parts are green\
  \ and why\n- [5] check | individual | O1, O2, O3 | Exit ticket: one sentence, one\
  \ diagram, one \"why green\" question\n- [3] wrap-up | whole class | - | Share two\
  \ exit ticket answers, preview tomorrow's light experiment\n- [3] buffer | whole\
  \ class | - | Spare time; if unused, extend the leaf observation\n```\n\n## Checker\
  \ output after the fix\n\n```\n$ python3 scripts/check_lesson_plan.py revised.md\n\
  Lesson: How plants make food (grade 6, 50 min)\nPlanned: 50 min in 9 segments\n\n\
  0 HIGH, 0 MEDIUM, 0 LOW\n```\n\n## What changed and why\n- Cut the lecture from\
  \ 25 to 12 minutes and added a think-pair-share for O1, which fixes the attention\
  \ guideline, the talk share, and the missing O1 practice.\n- Rewrote O1 with a measurable\
  \ verb (\"describe\").\n- Added a group activity for O3 so every objective is practiced,\
  \ and widened the exit ticket to check all three.\n- Added a wrap-up, a transition,\
  \ and a 3-minute buffer; the plan now fits exactly 50 minutes.\n\n## Adaptations\n\
  - Support: a word bank (light, water, carbon dioxide, glucose, oxygen) printed on\
  \ the diagram sheet.\n- Extension: predict what happens to a plant kept in green\
  \ light only, and explain why.\n\x1FFILE:scripts/check_lesson_plan.py\x1E\n#!/usr/bin/env\
  \ python3\n\"\"\"Check a lesson plan (templates/lesson-plan.md format) for timing\
  \ and alignment.\n\nUsage:\n  python3 check_lesson_plan.py PLAN.md [--json]\n  python3\
  \ check_lesson_plan.py - < PLAN.md\n\nReads the header fields (Grade, Duration),\
  \ the objectives (- O1: ...) and the\nsegments (- [minutes] type | grouping | objective\
  \ IDs | description), then\nreports: total time versus the period, objectives without\
  \ practice or a check,\nunknown objective IDs, long direct-instruction blocks for\
  \ the grade, the\nteacher talk share, vague objective verbs, a missing opening or\
  \ closure, and\na missing buffer in long lessons.\nExit code: 0 = no HIGH issues,\
  \ 1 = at least one HIGH issue, 2 = cannot parse.\n\"\"\"\nimport argparse\nimport\
  \ json\nimport re\nimport sys\n\nTYPES = {\"warm-up\", \"direct-instruction\", \"\
  guided-practice\", \"independent-practice\",\n         \"group-work\", \"discussion\"\
  , \"check\", \"transition\", \"wrap-up\", \"buffer\"}\nPRACTICE = {\"guided-practice\"\
  , \"independent-practice\", \"group-work\", \"discussion\"}\nVAGUE = {\"understand\"\
  , \"know\", \"learn\", \"appreciate\", \"grasp\", \"realize\", \"believe\",\n  \
  \       \"be aware\", \"be familiar\"}\nSEG_RE = re.compile(r\"^\\s*-\\s*\\[(\\\
  d+)\\]\\s*([^|]+)\\|([^|]*)\\|([^|]*)\\|(.*)$\")\nOBJ_RE = re.compile(r\"^\\s*-\\\
  s*(O\\d+)\\s*:\\s*(.+)$\", re.I)\nFIELD_RE = re.compile(r\"^\\s*(Grade|Duration|Subject|Group\
  \ size)\\s*:\\s*(.+?)\\s*$\", re.I)\nTITLE_RE = re.compile(r\"^#\\s*Lesson\\s*:\\\
  s*(.+)$\", re.I)\n\n\ndef max_instruction(grade):\n    g = str(grade).strip().lower()\n\
  \    if g in (\"k\", \"kindergarten\"):\n        return 8\n    if g in (\"adult\"\
  , \"adults\", \"university\", \"college\"):\n        return 20\n    if g.isdigit():\n\
  \        n = int(g)\n        return 8 if n <= 2 else 12 if n <= 5 else 15 if n <=\
  \ 8 else 18\n    return 15\n\n\ndef parse(text):\n    plan = {\"title\": None, \"\
  grade\": None, \"duration\": None, \"objectives\": {}, \"segments\": []}\n    for\
  \ line in text.splitlines():\n        if line.strip().startswith(\"<!--\"):\n  \
  \          continue\n        if m := TITLE_RE.match(line):\n            plan[\"\
  title\"] = m.group(1).strip()\n        elif m := FIELD_RE.match(line):\n       \
  \     key, val = m.group(1).lower(), m.group(2)\n            if key == \"grade\"\
  :\n                plan[\"grade\"] = val\n            elif key == \"duration\":\n\
  \                num = re.match(r\"\\d+\", val)\n                plan[\"duration\"\
  ] = int(num.group()) if num else None\n        elif m := SEG_RE.match(line):\n \
  \           ids = [x.strip().upper() for x in m.group(4).split(\",\") if x.strip()\
  \ and x.strip() != \"-\"]\n            plan[\"segments\"].append({\n           \
  \     \"minutes\": int(m.group(1)), \"type\": m.group(2).strip().lower(),\n    \
  \            \"grouping\": m.group(3).strip().lower(), \"objectives\": ids,\n  \
  \              \"description\": m.group(5).strip()})\n        elif m := OBJ_RE.match(line):\n\
  \            plan[\"objectives\"][m.group(1).upper()] = m.group(2).strip()\n   \
  \ return plan\n\n\ndef check(plan):\n    issues = []\n\n    def add(sev, where,\
  \ code, msg):\n        issues.append({\"severity\": sev, \"where\": where, \"code\"\
  : code, \"message\": msg})\n\n    segs, objs, dur = plan[\"segments\"], plan[\"\
  objectives\"], plan[\"duration\"]\n    total = sum(s[\"minutes\"] for s in segs)\n\
  \    if dur is None:\n        add(\"HIGH\", \"header\", \"no-duration\", \"Missing\
  \ 'Duration: <minutes>' line\")\n    elif total > dur:\n        add(\"HIGH\", \"\
  plan\", \"timing\", f\"Plan is {total} min but the period is {dur} min ({total -\
  \ dur} min over)\")\n    elif dur - total > 5:\n        add(\"MEDIUM\", \"plan\"\
  , \"timing\", f\"Plan is {total} min, {dur - total} min shorter than the {dur} min\
  \ period\")\n    if not objs:\n        add(\"HIGH\", \"objectives\", \"no-objectives\"\
  , \"No objectives found (- O1: ...)\")\n    for i, s in enumerate(segs, 1):\n  \
  \      if s[\"type\"] not in TYPES:\n            add(\"MEDIUM\", f\"segment {i}\"\
  , \"unknown-type\", f\"Unknown segment type '{s['type']}'\")\n        for oid in\
  \ s[\"objectives\"]:\n            if oid not in objs:\n                add(\"HIGH\"\
  , f\"segment {i}\", \"unknown-objective\", f\"Segment refers to {oid}, which is\
  \ not defined\")\n    limit = max_instruction(plan[\"grade\"] or \"\")\n    for\
  \ i, s in enumerate(segs, 1):\n        if s[\"type\"] == \"direct-instruction\"\
  \ and s[\"minutes\"] > limit:\n            add(\"MEDIUM\", f\"segment {i}\", \"\
  long-instruction\",\n                f\"Direct instruction of {s['minutes']} min\
  \ exceeds the {limit} min guideline for grade {plan['grade']}\")\n    for oid, text\
  \ in objs.items():\n        practiced = any(oid in s[\"objectives\"] and s[\"type\"\
  ] in PRACTICE for s in segs)\n        checked = any(oid in s[\"objectives\"] and\
  \ s[\"type\"] == \"check\" for s in segs)\n        if not practiced:\n         \
  \   add(\"HIGH\", oid, \"no-practice\", f\"Objective {oid} has no practice segment\"\
  )\n        if not checked:\n            add(\"MEDIUM\", oid, \"no-check\", f\"Objective\
  \ {oid} is never checked (add a check segment)\")\n        first = text.lower().split()\n\
  \        if first and (first[0] in VAGUE or \" \".join(first[:2]) in VAGUE):\n \
  \           add(\"LOW\", oid, \"vague-verb\", f\"Objective {oid} starts with \\\"\
  {first[0]}\\\"; use a measurable verb\")\n    if total:\n        talk = sum(s[\"\
  minutes\"] for s in segs if s[\"type\"] == \"direct-instruction\")\n        share\
  \ = round(100 * talk / total)\n        if share > 40:\n            add(\"MEDIUM\"\
  , \"plan\", \"talk-share\", f\"Direct instruction is {share}% of planned time (guideline:\
  \ 40% or less)\")\n    types = [s[\"type\"] for s in segs]\n    if segs and \"warm-up\"\
  \ not in types:\n        add(\"LOW\", \"plan\", \"opening\", \"No warm-up segment\"\
  )\n    if segs and \"wrap-up\" not in types:\n        add(\"MEDIUM\", \"plan\",\
  \ \"closure\", \"No wrap-up segment\")\n    if dur and dur > 40 and \"buffer\" not\
  \ in types and total >= dur:\n        add(\"LOW\", \"plan\", \"no-buffer\", \"Lesson\
  \ over 40 min with no buffer segment; keep 3-5 min spare\")\n    return total, issues\n\
  \n\ndef main(argv=None):\n    ap = argparse.ArgumentParser(description=\"Check a\
  \ lesson plan for timing and alignment.\")\n    ap.add_argument(\"file\", help=\"\
  plan file in templates/lesson-plan.md format, or - for stdin\")\n    ap.add_argument(\"\
  --json\", action=\"store_true\", help=\"print JSON\")\n    a = ap.parse_args(argv)\n\
  \    try:\n        text = sys.stdin.read() if a.file == \"-\" else open(a.file,\
  \ encoding=\"utf-8\").read()\n    except OSError as e:\n        print(f\"error:\
  \ {e}\", file=sys.stderr)\n        return 2\n    plan = parse(text)\n    if not\
  \ plan[\"segments\"]:\n        print(\"error: no segments found; use lines like\
  \ '- [10] guided-practice | pairs | O1 | ...'\", file=sys.stderr)\n        return\
  \ 2\n    total, issues = check(plan)\n    order = {\"HIGH\": 0, \"MEDIUM\": 1, \"\
  LOW\": 2}\n    issues.sort(key=lambda x: order[x[\"severity\"]])\n    if a.json:\n\
  \        print(json.dumps({\"plan\": plan, \"planned_minutes\": total, \"issues\"\
  : issues}, indent=2))\n    else:\n        print(f\"Lesson: {plan['title'] or '(untitled)'}\
  \ (grade {plan['grade'] or '?'}, {plan['duration'] or '?'} min)\")\n        print(f\"\
  Planned: {total} min in {len(plan['segments'])} segments\")\n        for i in issues:\n\
  \            print(f\"[{i['severity']}] {i['where']}: {i['code']}: {i['message']}\"\
  )\n        c = {k: sum(1 for i in issues if i[\"severity\"] == k) for k in order}\n\
  \        print(f\"\\n{c['HIGH']} HIGH, {c['MEDIUM']} MEDIUM, {c['LOW']} LOW\")\n\
  \    return 1 if any(i[\"severity\"] == \"HIGH\" for i in issues) else 0\n\n\nif\
  \ __name__ == \"__main__\":\n    sys.exit(main())"
