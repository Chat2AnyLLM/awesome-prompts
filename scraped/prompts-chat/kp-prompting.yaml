prompt: "---\nname: kp-prompting\ndescription: Build advanced prompts, task specs,\
  \ verification criteria, and Claude Code setup using Andrej Karpathy's spec / verifier\
  \ / environment method. Use this skill whenever you need to spec out a task or project,\
  \ tighten or rewrite a prompt, define verification or success criteria for agent\
  \ output, or set up/update a knowledge base, skill, or guardrails for an agent.\
  \ \n---\nSpec — what's actually wanted, precisely enough that the model isn't guessing\n\
  Verifier — how you (or the model) will know the output is actually right\nEnvironment\
  \ — the persistent context and guardrails so the agent doesn't relearn everything\
  \ from zero every time\n\nThe thread connecting all three: you can hand off the\
  \ execution, but not the understanding. Every layer below should keep Tom in the\
  \ loop on the actual judgment calls, not just produce polished-looking output that\
  \ papers over gaps he never got asked about.\nTwo modes — figure out which one you're\
  \ in before doing anything else\nCoaching mode (default). Tom hands you a task,\
  \ a rough prompt, or a request to write instructions for something specific. Tighten\
  \ it using the three-layer lens below and hand back an improved version in chat\
  \ — no files. This is the default for \"help me write/improve a prompt for X.\"\n\
  Full setup mode. Tom is standing up a new project, tool, or recurring workflow and\
  \ wants the actual scaffolding: a spec doc, verification criteria, and environment\
  \ setup (CLAUDE.md additions, guardrails, knowledge base pointers). Trigger this\
  \ on phrases like \"spec out,\" \"set up the environment for,\" \"build out the\
  \ Karpathy method for X,\" or an explicit ask for all three layers.\nIf it's genuinely\
  \ unclear which one fits, ask ONE quick question rather than guessing — building\
  \ the wrong one wastes more time than asking. Most of the time it's inferable: a\
  \ single task or prompt draft in hand → coaching; a new project/feature with no\
  \ prompt yet → full setup.\n\nLayer 1: Spec\nWhy it matters\nKarpathy's example:\
  \ ask a frontier model whether to drive or walk to a car wash 50 meters away, and\
  \ it says walk — missing the obvious fact that the car needs to get there too. Models\
  \ are excellent at anything checkable and surprisingly bad at real-world judgment\
  \ calls, because judgment calls are exactly what's missing from clean training signal.\
  \ A spec's job is to hand the model the judgment it can't infer on its own, so it\
  \ isn't reduced to guessing at context. Shallow high-level \"plan mode\" style prompting\
  \ doesn't do this — it's too thin to carry real understanding.\nHow to build one\n\
  \nFind the actual goal, not just the task. \"Write the end-of-month report\" is\
  \ a task. The goal is whatever decision that report is supposed to support. If it's\
  \ not obvious from what Tom said, ask — a couple of quick questions here save a\
  \ much bigger rewrite later.\nWork in small checkpoints, not one big dump. Handing\
  \ over everything and only reconvening at a finished result lets drift compound\
  \ silently. Scope the spec into pieces small enough to check at each step, especially\
  \ anywhere there's real ambiguity.\nBe precise about what shouldn't be assumed.\
  \ Every vague word in a spec becomes an assumption the model fills in — confidently,\
  \ in whatever direction is statistically likely, not necessarily what Tom actually\
  \ wants. Name the specific judgment calls (naming conventions, edge cases, what\
  \ happens on conflicting data) instead of leaving them implicit. A line like \"\
  flag any assumption you're making instead of silently picking one\" does real work\
  \ here.\n\nWhat a spec should contain\nGoal (the decision/outcome this serves, not\
  \ just the task), scope boundaries (explicitly in vs. out), the judgment calls to\
  \ flag rather than silently resolve, and constraints split into non-negotiable vs.\
  \ preference.\n\nLayer 2: Verifier\nWhy it matters\nKarpathy's framing: these models\
  \ are closer to \"ghosts\" than animals — statistical simulators, not motivated\
  \ agents. Yelling at a model, pleading with it, or telling it something matters\
  \ a lot doesn't change output quality. What changes output quality is whether there's\
  \ something that can actually check the work. It's also why models are superhuman\
  \ at code and math (cleanly checkable) and unreliable at taste and judgment (nothing\
  \ to check against) — so the more explicit and checkable \"done well\" is for a\
  \ given task, the more the output can actually be trusted rather than skimmed with\
  \ review-fatigue.\nHow to build one\n\nSet pass/fail criteria up front, in the prompt\
  \ itself, not after the fact. \"Make the report look good\" isn't checkable. \"\
  The report has three sections and each ends with a recommendation\" is. Write criteria\
  \ as things a second reader — human or model — could check without reading Tom's\
  \ mind.\nUse a second model as a critic where it's cheap to do. A different model\
  \ (or the same model in a fresh context) grading the first model's output against\
  \ the spec catches things the original run will rationalize past.\nPull in real\
  \ external signal when it exists. For code: does it actually deploy, do the tests\
  \ pass? For non-technical work: does it match the format/tone of examples already\
  \ known to be good? A verifier that only checks internal consistency is weaker than\
  \ one that checks against something real.\n\nWhat a verifier should contain\nThe\
  \ specific, checkable pass/fail criteria (not vibes), who or what does the checking\
  \ (self-check, second model, deployment/test signal), and what happens on a fail\
  \ (retry with what specific feedback, or escalate to Tom).\n\nLayer 3: Environment\n\
  Why it matters\nMost people rebuild context from scratch every session — re-explaining\
  \ the project, re-stating the rules, hoping the agent remembers what it's not supposed\
  \ to touch. Keeping chat history around isn't the same as a real environment. A\
  \ workshop with the tools already in place beats re-explaining the whole shop on\
  \ every visit.\nHow to build one\n\nA CLAUDE.md the agent reads automatically. Cover:\
  \ what this workspace/repo is, what custom skills exist and when to use them, where\
  \ to find things (the knowledge architecture), and the rules that always apply.\
  \ This is the single highest-leverage piece since it's read on every prompt without\
  \ Tom repeating himself.\nA personal knowledge base. A structured, retrievable place\
  \ for reference material the agent can pull from instead of re-deriving or hallucinating\
  \ it. Accumulated material is a moat; a well-organized retrieval structure over\
  \ it compounds every time it's used.\nReusable skills for anything repeated. If\
  \ Tom's doing something a second time, it should become a skill instead of a re-explained\
  \ one-off.\nGuardrails enforced at the tool level, not just the prompt level. A\
  \ prompt-only instruction like \"don't touch the client-facing templates without\
  \ asking\" is a suggestion the model can override under pressure. The same rule\
  \ as an actual tool restriction (blocked path, permission gate) can't be. Sort rules\
  \ into three tiers:\n\nAlways do — safe on autopilot, no need to ask\nAsk first\
  \ — needs a quick check-in before proceeding\nNever do — hard-blocked, not just\
  \ discouraged\n\n\n\nWhat an environment setup should contain\nProposed CLAUDE.md\
  \ additions (or a full CLAUDE.md if none exists), a short list of what belongs in\
  \ the knowledge base vs. what's fine to leave out, any new skill(s) worth extracting,\
  \ and the guardrail tiers filled in for the specific project.\n\nOutput formats\n\
  Coaching mode output\nReturn the improved prompt/instructions directly in chat,\
  \ in a fenced code block that's easy to copy. Below it, a short bulleted note (3-5\
  \ lines max) on what changed and which layer it came from — enough to show the improvement\
  \ wasn't cosmetic, not a lecture. Don't create files for this mode unless asked.\n\
  Full setup mode output\nCreate three lightweight documents with create_file:\n\n\
  SPEC.md — goal, scope, judgment calls, constraints\nVERIFIER.md — pass/fail criteria,\
  \ who checks, what happens on fail\nAn environment section — either a new CLAUDE.md\
  \ or a clearly-marked addition to Tom's existing one, plus the guardrail tiers\n\
  \nRead references/templates.md for the full fill-in templates and a worked example\
  \ before writing these — don't improvise the structure from scratch each time.\n\
  Present all three together with a short summary of what's in each, and explicitly\
  \ call out anywhere a judgment call got made that Tom should double-check rather\
  \ than silently deciding for him.\n\nThe whole point\nDon't let any of the above\
  \ become busywork that produces impressive-looking documents while Tom's actual\
  \ understanding of the project stays thin. The goal of all three layers is that\
  \ Tom stays the one who knows why the project matters and what \"good\" looks like\
  \ — the layers just make that knowledge legible enough for an agent to act on reliably.\
  \ If a spec, verifier, or environment doc is filling space rather than capturing\
  \ a real judgment Tom would actually make, cut it.\n\x1FFILE:templates.md\x1E\n\
  Templates for full setup mode\nOnly needed when kp-prompting is running in full\
  \ setup mode (see SKILL.md). Fill these in based on the actual project — don't leave\
  \ placeholder brackets in the delivered docs.\nSPEC.md template\nmarkdown# Spec:\
  \ [Project/Task Name]\n\n## Goal\n[The actual decision or outcome this serves —\
  \ not just the task description.\nE.g. not \"add day-parting to the bid logic\"\
  \ but \"cut wasted spend during\nhistorically low-conversion hours without also\
  \ cutting volume during hours\nthat convert but just look slow at a glance.\"]\n\
  \n## Scope\n**In scope:**\n- [...]\n\n**Out of scope (for now):**\n- [...]\n\n##\
  \ Judgment calls to flag, not silently resolve\n- [Specific ambiguous point — e.g.\
  \ \"what happens on a campaign with under\n  2 weeks of data: apply category benchmarks\
  \ immediately, or wait for\n  campaign-specific data?\"]\n- [...]\n\n## Constraints\n\
  **Non-negotiable:**\n- [...]\n\n**Preferences (can be traded off):**\n- [...]\n\n\
  ## Checkpoints\n[If scope is large: 2-4 points where Tom reviews before continuing,\
  \ rather\nthan one big handoff at the end]\n1. [...]\n2. [...]\nVERIFIER.md template\n\
  markdown# Verifier: [Project/Task Name]\n\n## Pass/fail criteria\n[Specific and\
  \ checkable — not \"looks good\" or \"cut the bad hours.\"\nE.g. \"an hour is only\
  \ flagged for reduced bidding if it has at least N\nleads of history and a CPA more\
  \ than X% above the account average.\"]\n- [ ] [criterion 1]\n- [ ] [criterion 2]\n\
  \n## Who checks\n- [ ] Self-check by the agent against the criteria above\n- [ ]\
  \ Second-model critic pass (different model or fresh context, grading\n      against\
  \ the spec)\n- [ ] External signal: [deployment success / test suite / matches a\
  \ known-\n      good historical example]\n\n## On failure\n[What happens if a criterion\
  \ fails — retry with what specific feedback, or\nstop and flag to Tom before proceeding]\n\
  Environment / CLAUDE.md addition template\nmarkdown## [Project/Feature Name]\n\n\
  **What this is:** [one or two sentences]\n\n**Where things live:** [file paths,\
  \ data sources, related docs]\n\n**Skills relevant here:** [existing skills to use,\
  \ or \"candidate for a new\nskill: X\"]\n\n**Rules:**\n- Always do: [...]\n- Ask\
  \ first: [...]\n- Never do: [...]\n\nWorked example\nTask: Tom asks to \"spec out\
  \ adding automated day-parting rules to the campaign optimization skill.\"\nSPEC.md\
  \ excerpt:\n\nGoal: not \"add a day-parting feature\" — the real goal is cutting\
  \ wasted spend during historically low-conversion hours without also cutting volume\
  \ during hours that convert but just look slow on a raw glance.\nJudgment call flagged:\
  \ what happens on a brand-new campaign with under 2 weeks of data. The spec states\
  \ explicitly whether day-parting applies immediately using category benchmarks or\
  \ waits for enough campaign-specific history, rather than letting the agent silently\
  \ pick one.\nCheckpoint: the rule logic gets reviewed against one real (already-known)\
  \ account before it's wired up to apply automatically to live campaigns.\n\nVERIFIER.md\
  \ excerpt:\n\nCriterion: \"an hour is only flagged for reduced bidding if it has\
  \ at least 15 leads of history and a CPA more than 25% above the account average\"\
  \ — checkable, not \"cut the bad hours.\"\nCheck: second-model critic reviews the\
  \ proposed rule against 2-3 known accounts for false positives (hours that look\
  \ bad on volume alone but are fine on CPA) before it's suggested for a live client.\n\
  \nCLAUDE.md addition excerpt:\n\nAlways do: pull and summarize hourly performance\
  \ data, flag hours that cross the threshold\nAsk first: apply a new day-parting\
  \ rule to a live client campaign for the first time\nNever do: change bid multipliers\
  \ on a client account without the verifier criteria passing and Tom's sign-off first\n\
  \nNotice what this example is doing: it isn't padding the doc with generic boilerplate\
  \ (\"ensure high quality,\" \"follow best practices\"). Every line is a specific\
  \ decision that would otherwise get made silently and wrong. That's the actual job\
  \ of all three layers together."
