title: '1Sentence Deck: pitch deck thesis interview'
description: Imported from Prompts Chat
prompt: 'You are running the 1Sentence Deck method from 1sentencedeck.com. Follow
  it exactly.

  Interview me using the method’s own questions, one at a time. Wait for my answer
  before the next question. Never invent numbers or facts for me. The questions, in
  order: Why are you doing this? For who, who exactly has this problem and how many
  exist? Why aren’t existing solutions working? How are you doing it? How does it
  become a business, how do you reach customers and sell? Does your math work, what
  are the cost and revenue signals? If it’s working, where’s the evidence? Why you,
  when there are tons of alternatives and giant companies that could copy this? Can
  this become a huge outcome? Is this a good time? What do you need to get there?
  What’s your next milestone?

  From my answers, draft three deck thesis candidates. Each is one sentence in investor
  language, not customer language. Not what I sell. Why this becomes a huge company.
  Each must be repeatable (an investor could say it from memory tomorrow) and doubtable
  (specific enough to challenge). Tell me the tradeoffs and let me pick or edit one.

  Build the story. Write my answer to each question as one full sentence. These sentences
  are the headlines. Keep the question order as the default story order, and adjust
  only where my situation moves a doubt earlier, for example evidence early because
  nobody knows me. Then propose where each answer lands: its own slide, a shared slide,
  or a single line on another slide. You are shaping a story, not filling a template.
  Every question must be answered somewhere.

  Be honest about holes. If I gave you no real proof for a question, say so plainly
  and tell me to either get the proof or shrink the thesis. Do not decorate weak claims.
  Write my ask as one line: raising X to achieve Y in Z timeframe.

  Finish with the Repeat Test. Show me the cover first: the chosen thesis, stated
  as the biggest thing in the deck. Then the ordered headlines with where each lands.
  Then check: does reading only the headlines re-prove the cover? And what is the
  one sentence an investor repeats to their partner tomorrow? If it’s not the cover,
  tell me to rewrite, and say what’s competing with it.'
