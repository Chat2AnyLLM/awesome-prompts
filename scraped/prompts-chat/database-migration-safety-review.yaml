slug: database-migration-safety-review
title: Database Migration Safety Review
description: Imported from Prompts Chat
prompt: "---\nname: migration-safety-review\ndescription: Reviews database schema\
  \ migrations (raw SQL or ORM-generated from Rails, Django, Alembic, Prisma, Knex,\
  \ Laravel, Flyway) for production risks before they ship - table-locking DDL, full\
  \ table rewrites, data loss, breaking changes for running app code, and missing\
  \ rollback paths - and proposes safe zero-downtime rewrites. Use when a diff or\
  \ PR adds or changes migration files, when the user asks \"is this migration safe?\"\
  , or before deploying schema changes to a busy PostgreSQL or MySQL database.\n---\n\
  \n# Migration Safety Review\n\nYou are reviewing schema migrations the way a careful\
  \ senior DBA would before a\nproduction deploy. The goal is a clear verdict plus\
  \ concrete, safer SQL - not a\ngeneric lecture about databases.\n\n## Files in this\
  \ skill\n\n- `scripts/scan_migration.py` - fast heuristic scanner for risky SQL\
  \ statements\n- `references/risk-catalog.md` - operation-by-operation hazards and\
  \ safe patterns\n- `references/expand-contract.md` - keeping old and new app code\
  \ working during rollout\n- `templates/review-report.md` - the report format you\
  \ must produce\n- `examples/example-review.md` - a complete worked review to calibrate\
  \ tone and depth\n\n## Workflow\n\n### 1. Find the migrations in scope\n- If reviewing\
  \ a branch or PR: `git diff --name-only origin/main...HEAD` and keep\n  files under\
  \ migration folders (`migrations/`, `db/migrate/`, `alembic/versions/`,\n  `prisma/migrations/`,\
  \ `database/migrations/`, `db/migration/`).\n- Otherwise use the files or SQL the\
  \ user pointed to.\n- Note which migrations are new versus already applied in any\
  \ environment.\n  Never suggest editing an applied migration; propose a new follow-up\
  \ migration.\n\n### 2. Establish context\nDetermine, from config files, docker-compose,\
  \ or by asking the user:\n- Engine and major version (e.g. PostgreSQL 15, MySQL\
  \ 8.0). Lock behavior depends on it.\n- Approximate size and write traffic of each\
  \ touched table.\n- How deploys work: are migrations run before, during, or after\
  \ new code rolls out?\n\nIf size or traffic is unknown, assume the table is large\
  \ and hot, and say so.\n\n### 3. Get the real SQL\nORM code hides what actually\
  \ runs. Render the SQL first:\n\n| Framework | Command |\n|-----------|---------|\n\
  | Django | `python manage.py sqlmigrate <app> <migration>` |\n| Rails | `rails db:migrate`\
  \ on a scratch DB, then inspect `db/structure.sql` diff |\n| Alembic | `alembic\
  \ upgrade <from>:<to> --sql` |\n| Prisma | read `prisma/migrations/<name>/migration.sql`\
  \ |\n| Laravel | `php artisan migrate --pretend` |\n| Knex | run on a scratch DB\
  \ with `DEBUG=knex:query` and copy the logged SQL |\n| Flyway / Liquibase | the\
  \ `.sql` file or `liquibase update-sql` |\n\nSave rendered SQL to a temp file if\
  \ it is not already a `.sql` file.\n\n### 4. Run the scanner\n```bash\npython3 scripts/scan_migration.py\
  \ --dialect postgres path/to/migration.sql\npython3 scripts/scan_migration.py --dialect\
  \ mysql db/*.sql\n```\nIt prints `file:line [SEVERITY] RULE message` and exits 1\
  \ if any HIGH finding exists.\nTreat its output as leads, not as the verdict: it\
  \ uses regexes, can miss dynamic SQL,\nand cannot know table sizes.\n\n### 5. Review\
  \ every statement manually\nFor each statement, use `references/risk-catalog.md`\
  \ to answer:\n1. What lock does it take, and for how long (instant, table scan,\
  \ or full rewrite)?\n2. Can it lose or corrupt data? Is that intended and backed\
  \ up?\n3. Will it queue behind long transactions? Is `lock_timeout` (Postgres) or\n\
  \   `lock_wait_timeout` (MySQL) set so it fails fast instead of blocking all traffic?\n\
  4. Does it run in a transaction where it must not (e.g. `CREATE INDEX CONCURRENTLY`)?\n\
  5. Are large data backfills batched and separated from DDL?\n\n### 6. Check application\
  \ compatibility\nDuring a rolling deploy, old and new code run at the same time\
  \ against the new schema.\nFollow `references/expand-contract.md`:\n- Search the\
  \ codebase (`rg -n '<column_or_table_name>'`) for every renamed, dropped,\n  or\
  \ retyped object, including raw SQL, serializers, and analytics queries.\n- Flag\
  \ any change the currently deployed code cannot tolerate.\n\n### 7. Verify the rollback\
  \ path\n- Does a down migration exist, and does it actually restore the previous\
  \ state?\n- Drops and lossy type changes are one-way: require a backup or a staged\
  \ plan.\n\n### 8. Write the report\nFill in `templates/review-report.md` exactly.\
  \ Match the depth of\n`examples/example-review.md`. For every HIGH or MEDIUM finding,\
  \ give replacement SQL\nor migration code that achieves the same end state safely,\
  \ split into ordered deploy\nsteps when needed.\n\n## Verdicts\n- **SAFE** - no\
  \ blocking locks on large tables, no data loss, backward compatible.\n- **SAFE WITH\
  \ CHANGES** - can ship once the listed rewrites are applied.\n- **UNSAFE** - would\
  \ cause downtime, data loss, or errors in running code as written.\n\n## Rules\n\
  - Never run migrations against production or shared databases yourself.\n- Do not\
  \ modify migration files unless the user asks; propose changes in the report.\n\
  - Be specific: name the table, the lock, and the failure mode. Skip generic advice.\n\
  - If you are unsure about a version-specific behavior, say so and suggest testing\
  \ on\n  a production-sized copy with `\\timing` / `EXPLAIN` and lock monitoring.\n\
  \x1FFILE:references/risk-catalog.md\x1E\n# Risk Catalog: Common Migration Operations\n\
  \nLock names are PostgreSQL. ACCESS EXCLUSIVE blocks all reads and writes;\nSHARE\
  \ blocks writes; SHARE UPDATE EXCLUSIVE blocks neither.\n\n## The lock queue problem\
  \ (applies to everything below)\nEven an \"instant\" ALTER TABLE needs ACCESS EXCLUSIVE\
  \ briefly. If a long query or\nidle-in-transaction session holds the table, the\
  \ ALTER waits - and every new query\nqueues behind it. A 1 ms change can cause a\
  \ multi-minute outage.\nAlways start risky migrations with:\n```sql\nSET lock_timeout\
  \ = '5s';        -- fail fast, retry later\nSET statement_timeout = '15min'; --\
  \ optional upper bound\n```\nMySQL equivalent: `SET SESSION lock_wait_timeout =\
  \ 5;` (metadata locks).\n\n## PostgreSQL operations\n\n| Operation | Risk | Safe\
  \ pattern |\n|-----------|------|--------------|\n| `CREATE INDEX` | SHARE lock:\
  \ writes blocked for whole build | `CREATE INDEX CONCURRENTLY`, outside a transaction;\
  \ on failure drop the INVALID index and retry. Rails: `disable_ddl_transaction!`;\
  \ Django: `atomic = False` |\n| `DROP INDEX` | ACCESS EXCLUSIVE | `DROP INDEX CONCURRENTLY`\
  \ |\n| `ADD COLUMN` nullable, no default | Instant | Safe (still set lock_timeout)\
  \ |\n| `ADD COLUMN ... DEFAULT <constant>` | Instant on PG 11+, rewrite before 11\
  \ | Safe on 11+ |\n| `ADD COLUMN ... DEFAULT now()/random()/gen_random_uuid()` |\
  \ Volatile default: full table rewrite | Add nullable column, backfill in batches,\
  \ then set default |\n| `ADD COLUMN ... NOT NULL` without default | Fails on non-empty\
  \ table | Add nullable, backfill, then enforce NOT NULL (below) |\n| `ALTER COLUMN\
  \ ... SET NOT NULL` | Full scan under ACCESS EXCLUSIVE | `ADD CONSTRAINT c CHECK\
  \ (col IS NOT NULL) NOT VALID`; `VALIDATE CONSTRAINT c`; then `SET NOT NULL` (PG\
  \ 12+ skips the scan); drop `c` |\n| `ALTER COLUMN ... TYPE` | Usually full rewrite\
  \ + index rebuild under ACCESS EXCLUSIVE | Safe only if binary-coercible (varchar(n)\
  \ to larger n or to text). Otherwise new column + dual write + backfill + swap |\n\
  | `ADD FOREIGN KEY` | Locks both tables while validating all rows | `ADD CONSTRAINT\
  \ ... NOT VALID`, then `VALIDATE CONSTRAINT` in a separate step |\n| `ADD CHECK`\
  \ | Scan under ACCESS EXCLUSIVE | Same NOT VALID + VALIDATE pattern |\n| `ADD UNIQUE`\
  \ / `ADD PRIMARY KEY` | Builds index under lock | `CREATE UNIQUE INDEX CONCURRENTLY\
  \ idx ...`; then `ADD CONSTRAINT ... UNIQUE USING INDEX idx` |\n| `RENAME COLUMN`\
  \ / `RENAME TO` | Instant, but breaks running code | Expand/contract (see expand-contract.md)\
  \ |\n| `DROP COLUMN` | Instant, but irreversible; old code selecting it errors |\
  \ Remove all code references and deploy first; then drop |\n| `DROP TABLE` / `TRUNCATE`\
  \ | Irreversible data loss | Confirm backup and zero readers; consider renaming\
  \ to `_deprecated` first |\n| `ALTER TYPE ... ADD VALUE` | New value unusable in\
  \ same transaction; no transaction at all before PG 12 | Put it in its own migration\
  \ |\n| `VACUUM FULL` / `CLUSTER` / `REINDEX` | Full rewrite under ACCESS EXCLUSIVE\
  \ | `REINDEX CONCURRENTLY` (PG 12+), `pg_repack` for bloat |\n| Big `UPDATE` / `DELETE`\
  \ | Long row locks, WAL spike, replica lag | Batch by primary key (1k-10k rows),\
  \ commit per batch, run outside the DDL migration |\n\n## MySQL 8.0 (InnoDB) notes\n\
  - Always state the algorithm so MySQL errors instead of silently copying the table:\n\
  \  `ALTER TABLE t ADD COLUMN c INT, ALGORITHM=INSTANT;` or\n  `ALTER TABLE t ADD\
  \ INDEX i (c), ALGORITHM=INPLACE, LOCK=NONE;`\n- `ADD COLUMN` is INSTANT on 8.0.12+\
  \ (last position) and 8.0.29+ (any position).\n- `MODIFY` / `CHANGE COLUMN` type\
  \ changes use ALGORITHM=COPY: writes blocked.\n- For large tables with COPY-only\
  \ changes use `gh-ost` or `pt-online-schema-change`.\n- DDL is not transactional\
  \ in MySQL: a failed multi-statement migration leaves\n  the schema half-applied.\
  \ Keep one DDL statement per migration.\n\x1FFILE:references/expand-contract.md\x1E\
  \n# Expand / Contract: Backward-Compatible Schema Changes\n\nDuring a rolling deploy,\
  \ old and new application versions run side by side.\nIf migrations run before the\
  \ new code is live, the old code must work with the\nnew schema. If they run after,\
  \ the new code must work with the old schema.\nExpand/contract makes every step\
  \ compatible with both.\n\n## The three phases\n1. **Expand** - add new structures\
  \ only (columns, tables, indexes). Nothing is\n   removed or renamed. Old code ignores\
  \ the additions.\n2. **Migrate** - deploy code that writes to both old and new structures,\
  \ backfill\n   existing rows in batches, then switch reads to the new structure.\n\
  3. **Contract** - once no deployed code touches the old structure, drop it in a\n\
  \   separate, later migration.\n\nEach phase is its own deploy. Never combine expand\
  \ and contract in one migration.\n\n## Recipes\n\n### Rename a column (`users.name`\
  \ to `users.full_name`)\n1. Migration: add nullable `full_name`.\n2. Code: write\
  \ both `name` and `full_name`; read `name`.\n3. Backfill `full_name = name` in batches\
  \ where `full_name IS NULL`.\n4. Code: read `full_name`; keep writing both.\n5.\
  \ Code: stop writing `name`. (Rails: add `name` to `ignored_columns` here.)\n6.\
  \ Migration: drop `name`.\n\n### Change a column type (`orders.amount` int to numeric)\n\
  Same as rename: add `amount_numeric`, dual write, backfill, switch reads, drop old.\n\
  A trigger can handle dual writes if application changes are hard.\n\n### Make a\
  \ column NOT NULL\n1. Code: always write a value.\n2. Backfill NULL rows in batches.\n\
  3. Migration: CHECK ... NOT VALID, VALIDATE, SET NOT NULL (see risk-catalog.md).\n\
  \n### Drop a column or table\n1. Code: remove every read and write (search ORM models,\
  \ raw SQL, views,\n   reports, ETL jobs, and other services sharing the database).\n\
  2. Deploy and wait at least one full release cycle.\n3. Migration: drop. Take a\
  \ backup or snapshot of the data first if it matters.\n\n### Split or move a table\n\
  Create the new table, dual write, backfill, switch reads, stop old writes, drop.\n\
  \n## Compatibility questions to answer for each change\n- Does any deployed code\
  \ `SELECT *` or map all columns (ORMs often cache the\n  column list at boot and\
  \ fail when one disappears)?\n- Does an insert from old code fail because a new\
  \ column is NOT NULL without default?\n- Do other services, cron jobs, BI dashboards,\
  \ or replicas read this table?\n- Can the deploy be rolled back to the previous\
  \ code version without a down migration?\n\nIf the answer to the last question is\
  \ \"no\", the change is not backward compatible.\n\x1FFILE:templates/review-report.md\x1E\
  \n# Migration Safety Review: <migration name or PR title>\n\n**Verdict:** SAFE |\
  \ SAFE WITH CHANGES | UNSAFE\n**Engine:** <e.g. PostgreSQL 15>  |  **Files reviewed:**\
  \ <count>\n**Assumptions:** <table sizes, traffic, deploy order - mark anything\
  \ guessed>\n\n## Summary\n<2-4 sentences: what the migration does, the biggest risk,\
  \ and what to change.>\n\n## Findings\n\n| # | Severity | File:Line | Statement\
  \ | Risk |\n|---|----------|-----------|-----------|------|\n| 1 | HIGH | <path:line>\
  \ | `<short SQL>` | <lock / data loss / breaks old code> |\n\n### 1. <Short title\
  \ of finding>\n- **What happens:** <lock taken, duration, who is blocked, or what\
  \ breaks>\n- **Why it matters here:** <table size, traffic, code that depends on\
  \ it>\n- **Safe alternative:**\n```sql\n-- replacement SQL or migration code, in\
  \ run order\n```\n\n<Repeat for each HIGH and MEDIUM finding. Group LOW findings\
  \ in one list.>\n\n## Application Compatibility\n- <Each renamed / dropped / retyped\
  \ object and where the code still uses it>\n- <Or: \"No code references affected\
  \ - checked with rg for X, Y.\">\n\n## Rollback Plan\n- <Does the down migration\
  \ restore state? What is irreversible?>\n- <Backup or snapshot required before running:\
  \ yes/no>\n\n## Recommended Deploy Sequence\n1. <Migration or code deploy step>\n\
  2. <...>\n\n## Scanner Output\n```\n<paste scripts/scan_migration.py output, or\
  \ note false positives>\n```\n\x1FFILE:examples/example-review.md\x1E\n# Example\
  \ Review\n\n**Input:** PR \"Add order status tracking\" with one Rails migration\
  \ for PostgreSQL 15.\n`orders` has ~40M rows and receives constant writes. Migrations\
  \ run before new code.\n\n```sql\n-- rendered from db/migrate/20261002_add_status_to_orders.rb\n\
  ALTER TABLE orders ADD COLUMN status varchar NOT NULL DEFAULT 'pending';\nALTER\
  \ TABLE orders RENAME COLUMN shipped_on TO shipped_at;\nCREATE INDEX index_orders_on_status\
  \ ON orders (status);\nALTER TABLE orders ADD CONSTRAINT fk_orders_carrier\n  FOREIGN\
  \ KEY (carrier_id) REFERENCES carriers (id);\n```\n\n**Scanner:** 3 HIGH (rename,\
  \ index-not-concurrent, fk-validated), 1 MEDIUM (no-lock-timeout).\n\n---\n\n# Migration\
  \ Safety Review: Add order status tracking\n\n**Verdict:** UNSAFE\n**Engine:** PostgreSQL\
  \ 15  |  **Files reviewed:** 1\n**Assumptions:** orders ~40M rows, high write traffic\
  \ (from user); carriers is small.\n\n## Summary\nAdds an order status column, renames\
  \ `shipped_on`, indexes status, and adds a carrier\nforeign key. The status column\
  \ itself is safe on PG 15, but the rename will break the\nrunning app, and the index\
  \ and FK will block writes on `orders` for minutes.\nSplit into three migrations\
  \ and use concurrent / NOT VALID variants.\n\n## Findings\n\n| # | Severity | File:Line\
  \ | Statement | Risk |\n|---|----------|-----------|-----------|------|\n| 1 | HIGH\
  \ | rendered.sql:3 | `RENAME COLUMN shipped_on` | Old code errors on deploy |\n\
  | 2 | HIGH | rendered.sql:4 | `CREATE INDEX ... (status)` | Writes blocked during\
  \ build |\n| 3 | HIGH | rendered.sql:5 | `ADD ... FOREIGN KEY` | Full validation\
  \ scan under lock |\n| 4 | MEDIUM | rendered.sql:1 | no `lock_timeout` | ALTERs\
  \ can queue and stall traffic |\n\n### 1. Column rename breaks running code\n- **What\
  \ happens:** the rename is instant, but app servers still on the old release\n \
  \ query `shipped_on` and fail with `column does not exist` until the deploy finishes.\n\
  - **Why it matters here:** `rg -n shipped_on` finds 7 references, including\n  `app/serializers/order_serializer.rb`\
  \ and the nightly `reports/fulfillment.sql`.\n- **Safe alternative:** expand/contract.\
  \ Add `shipped_at`, dual write, backfill in\n  batches, switch reads, then drop\
  \ `shipped_on` in a later release.\n\n### 2. Index build blocks writes\n- **Safe\
  \ alternative** (separate migration, `disable_ddl_transaction!`):\n```sql\nCREATE\
  \ INDEX CONCURRENTLY index_orders_on_status ON orders (status);\n```\n\n### 3. Foreign\
  \ key validates 40M rows under lock\n- **Safe alternative:**\n```sql\nSET lock_timeout\
  \ = '5s';\nALTER TABLE orders ADD CONSTRAINT fk_orders_carrier\n  FOREIGN KEY (carrier_id)\
  \ REFERENCES carriers (id) NOT VALID;\n-- next migration (takes only SHARE UPDATE\
  \ EXCLUSIVE on orders):\nALTER TABLE orders VALIDATE CONSTRAINT fk_orders_carrier;\n\
  ```\n\n**LOW:** none. Note `ADD COLUMN ... DEFAULT 'pending'` is metadata-only on\
  \ PG 11+.\n\n## Application Compatibility\n- `shipped_on`: 7 code references plus\
  \ one SQL report; must stay until contract phase.\n\n## Rollback Plan\n- Down migration\
  \ drops `status` (data loss acceptable: new column). Rename is reversible.\n- No\
  \ backup required for this change set once the rename is removed.\n\n## Recommended\
  \ Deploy Sequence\n1. Migration A: `SET lock_timeout`; add `status`; add `shipped_at`;\
  \ add FK NOT VALID.\n2. Migration B (no transaction): create status index concurrently.\n\
  3. Migration C: validate FK. Deploy code that dual writes `shipped_on`/`shipped_at`.\n\
  4. Backfill `shipped_at`; switch reads; later release drops `shipped_on`.\n\x1F\
  FILE:scripts/scan_migration.py\x1E\n#!/usr/bin/env python3\n\"\"\"Heuristic scanner\
  \ for risky SQL in migration files (PostgreSQL / MySQL).\nUsage: python3 scan_migration.py\
  \ [--dialect postgres|mysql] FILE [FILE ...]\nExit codes: 0 = no HIGH findings,\
  \ 1 = HIGH findings, 2 = usage error.\"\"\"\nimport re, sys\n\nF = re.I | re.S\n\
  COLDEF = r\"(?:\\([^)]*\\)|[^,(])*\"  # one column definition, allowing numeric(10,2)\n\
  RULES = [  # (severity, rule id, dialect or None for both, regex, message)\n   \
  \ (\"HIGH\", \"drop-table\", None, r\"^DROP\\s+TABLE\\b\", \"Irreversible data loss;\
  \ confirm backup and no readers\"),\n    (\"HIGH\", \"truncate\", None, r\"^TRUNCATE\\\
  b\", \"Irreversible data loss\"),\n    (\"HIGH\", \"drop-column\", None, r\"^ALTER\\\
  s+TABLE\\b.*\\bDROP\\s+(COLUMN\\b|(?!CONSTRAINT|INDEX|KEY|PRIMARY|FOREIGN|CHECK|DEFAULT|NOT|IDENTITY|EXPRESSION)\\\
  w)\", \"Data loss; deployed code reading it will fail - remove code refs first\"\
  ),\n    (\"HIGH\", \"rename\", None, r\"^ALTER\\s+TABLE\\b.*\\bRENAME\\b\", \"Breaks\
  \ running code; use expand/contract\"),\n    (\"HIGH\", \"type-change\", \"postgres\"\
  , r\"^ALTER\\s+TABLE\\b.*\\bALTER\\s+(COLUMN\\s+)?\\S+\\s+(SET\\s+DATA\\s+)?TYPE\\\
  b\", \"Usually a full table rewrite under ACCESS EXCLUSIVE\"),\n    (\"HIGH\", \"\
  type-change\", \"mysql\", r\"^ALTER\\s+TABLE\\b.*\\b(MODIFY|CHANGE)\\s+(COLUMN\\\
  s+)?\\S+\", \"Column redefinition usually uses ALGORITHM=COPY (writes blocked)\"\
  ),\n    (\"HIGH\", \"index-not-concurrent\", \"postgres\", r\"^CREATE\\s+(UNIQUE\\\
  s+)?INDEX\\s+(?!CONCURRENTLY)\", \"Blocks writes during build; use CREATE INDEX\
  \ CONCURRENTLY\"),\n    (\"MEDIUM\", \"drop-index-not-concurrent\", \"postgres\"\
  , r\"^DROP\\s+INDEX\\s+(?!CONCURRENTLY)\", \"Takes ACCESS EXCLUSIVE; use DROP INDEX\
  \ CONCURRENTLY\"),\n    (\"HIGH\", \"fk-validated\", \"postgres\", r\"^ALTER\\s+TABLE\\\
  b(?!.*\\bNOT\\s+VALID\\b).*\\b(FOREIGN\\s+KEY|REFERENCES)\\b\", \"Validates all\
  \ rows while locking both tables; add NOT VALID, then VALIDATE\"),\n    (\"MEDIUM\"\
  , \"check-validated\", \"postgres\", r\"^ALTER\\s+TABLE\\b(?!.*\\bNOT\\s+VALID\\\
  b).*\\bADD\\s+(CONSTRAINT\\s+\\S+\\s+)?CHECK\\b\", \"Full scan under lock; add NOT\
  \ VALID, then VALIDATE\"),\n    (\"MEDIUM\", \"set-not-null\", \"postgres\", r\"\
  \\bSET\\s+NOT\\s+NULL\\b\", \"Full scan under ACCESS EXCLUSIVE; validate a CHECK\
  \ (col IS NOT NULL) first\"),\n    (\"HIGH\", \"add-not-null-no-default\", None,\
  \ r\"^ALTER\\s+TABLE\\b.*\\bADD\\s+(COLUMN\\s+)?(?!\" + COLDEF + r\"\\bDEFAULT\\\
  b)\" + COLDEF + r\"\\bNOT\\s+NULL\\b\", \"Fails on non-empty tables (or old code\
  \ inserts fail); add nullable, backfill, then enforce\"),\n    (\"MEDIUM\", \"volatile-default\"\
  , \"postgres\", r\"^ALTER\\s+TABLE\\b.*\\bADD\\b.*\\bDEFAULT\\s+(now|random|clock_timestamp|gen_random_uuid|uuid_generate_v\\\
  d)\\s*\\(\", \"Volatile default rewrites the table; add nullable, backfill, then\
  \ set default\"),\n    (\"MEDIUM\", \"unique-without-index\", \"postgres\", r\"\
  ^ALTER\\s+TABLE\\b(?!.*\\bUSING\\s+INDEX\\b).*\\bADD\\s+(CONSTRAINT\\s+\\S+\\s+)?(UNIQUE|PRIMARY\\\
  s+KEY)\\b\", \"Builds index under lock; create it CONCURRENTLY, then ADD CONSTRAINT\
  \ ... USING INDEX\"),\n    (\"MEDIUM\", \"mysql-no-algorithm\", \"mysql\", r\"^(ALTER\\\
  s+TABLE|CREATE\\s+(UNIQUE\\s+)?INDEX)\\b(?!.*\\bALGORITHM\\s*=)\", \"State ALGORITHM=INSTANT|INPLACE,\
  \ LOCK=NONE so MySQL refuses a blocking copy\"),\n    (\"HIGH\", \"dml-no-where\"\
  , None, r\"^(UPDATE|DELETE)\\b(?!.*\\bWHERE\\b)\", \"Touches every row in one transaction;\
  \ batch it\"),\n    (\"LOW\", \"dml-in-migration\", None, r\"^(UPDATE|DELETE|INSERT)\\\
  b.*\\bWHERE\\b\", \"Data change in migration; batch it if the table is large\"),\n\
  \    (\"MEDIUM\", \"table-rewrite\", \"postgres\", r\"^(VACUUM\\s+FULL|CLUSTER|REINDEX\\\
  s+(?!.*CONCURRENTLY))\", \"Rewrites under ACCESS EXCLUSIVE; use REINDEX CONCURRENTLY\
  \ or pg_repack\"),\n    (\"LOW\", \"enum-add-value\", \"postgres\", r\"^ALTER\\\
  s+TYPE\\b.*\\bADD\\s+VALUE\\b\", \"New value unusable in same transaction; keep\
  \ in its own migration\"),\n]\n\ndef statements(sql):\n    \"\"\"Yield (line_number,\
  \ statement) after stripping comments. Naive ';' split.\"\"\"\n    sql = re.sub(r\"\
  /\\*.*?\\*/\", lambda m: re.sub(r\"[^\\n]\", \" \", m.group()), sql, flags=re.S)\n\
  \    sql = re.sub(r\"--[^\\n]*\", \"\", sql)\n    pos = 0\n    for part in sql.split(\"\
  ;\"):\n        stripped = part.lstrip()\n        line = sql.count(\"\\n\", 0, pos\
  \ + len(part) - len(stripped)) + 1\n        pos += len(part) + 1\n        if stripped.strip():\n\
  \            yield line, \" \".join(stripped.split())\n\ndef scan(path, dialect):\n\
  \    text = open(path, encoding=\"utf-8\", errors=\"replace\").read()\n    stmts,\
  \ out = list(statements(text)), []\n    for line, st in stmts:\n        for sev,\
  \ rid, dia, rx, msg in RULES:\n            if (dia is None or dia == dialect) and\
  \ re.search(rx, st, F):\n                out.append((sev, f\"{path}:{line} [{sev}]\
  \ {rid}: {msg}\\n    > {st[:110]}\"))\n    has_ddl = any(re.match(r\"(ALTER|CREATE\\\
  s+(UNIQUE\\s+)?INDEX|DROP)\\b\", s, re.I) for _, s in stmts)\n    timeout = \"lock_timeout\"\
  \ if dialect == \"postgres\" else \"lock_wait_timeout\"\n    if has_ddl and timeout\
  \ not in text.lower():\n        out.append((\"MEDIUM\", f\"{path}:1 [MEDIUM] no-lock-timeout:\
  \ DDL without {timeout}; it may queue and block all traffic\"))\n    if re.search(r\"\
  \\bCONCURRENTLY\\b\", text, re.I) and re.search(r\"^\\s*(BEGIN|START\\s+TRANSACTION)\\\
  b\", text, re.I | re.M):\n        out.append((\"HIGH\", f\"{path}:1 [HIGH] concurrently-in-transaction:\
