  ,\n      \"Conscientiousness\": \"Green\",\n      \"Extraversion\": \"Orange\",\n\
  \      \"Agreeableness\": \"Teal\",\n      \"Neuroticism\": \"Coral\"\n    },\n\
  \    \"design\": [\n      \"Clean white background\",\n      \"Minimal professional\
  \ layout\",\n      \"Large numerical percentage scores\",\n      \"Rounded horizontal\
  \ progress bars\",\n      \"Light grey background tracks\",\n      \"Consistent\
  \ spacing and typography\",\n      \"Accurate proportional bar lengths\",\n    \
  \  \"No unnecessary decorative elements\"\n    ],\n    \"rules\": [\n      \"Generate\
  \ all five scores dynamically from the current candidate's assessment.\",\n    \
  \  \"Use identical scores in the dashboard and analysis.\",\n      \"Never use predefined\
