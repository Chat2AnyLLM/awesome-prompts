  \      \"Workplace Implications\",\n      \"Confidence Level\"\n    ]\n  },\n\n\
  \  \"advanced_analysis\": {\n    \"personality_interactions\": true,\n    \"leadership_analysis\"\
  : true,\n    \"workplace_alignment\": true,\n    \"instructions\": [\n      \"Identify\
  \ five meaningful personality combinations.\",\n      \"Explain combined strengths\
  \ and potential behavioral tensions.\",\n      \"Analyze leadership tendencies and\
  \ communication preferences.\",\n      \"Evaluate collaboration, decision-making,\
  \ and conflict management.\",\n      \"Identify preferred working environments.\"\
  ,\n      \"Suggest practical professional development priorities.\",\n      \"Avoid\
