  ,\n      \"Risk tolerance and uncertainty management\",\n      \"Consistency and\
  \ attention to detail\"\n    ],\n    \"evidence_rules\": [\n      \"Prioritize recurring\
  \ patterns over isolated statements.\",\n      \"Distinguish observed behavior from\
  \ inferred personality.\",\n      \"Use concrete historical examples wherever possible.\"\
  ,\n      \"Consider contradictory evidence and alternative explanations.\",\n  \
  \    \"Do not confuse professional competence with personality.\",\n      \"Do not\
  \ interpret missing evidence as evidence of a particular trait.\",\n      \"Consider\
  \ the influence of professional roles and task requirements.\",\n      \"Never invent\
  \ historical events, behavioral patterns, or personal characteristics.\"\n    ]\n\
  \  },\n\n  \"scoring_framework\": {\n    \"scale\": \"0-100\",\n    \"meaning\"\
  : \"Percentage of maximum trait score, NOT population percentile.\",\n    \"interpretation_bands\"\
  : {\n      \"0-20\": \"Very Low\",\n      \"21-40\": \"Low\",\n      \"41-60\":\
  \ \"Moderate\",\n      \"61-80\": \"High\",\n      \"81-100\": \"Very High\"\n \
  \   },\n    \"confidence_levels\": [\n      \"High\",\n      \"Moderate\",\n   \
  \   \"Low\",\n      \"Insufficient Evidence\"\n    ],\n    \"methodology\": [\n\
  \      \"Use holistic behavioral judgment rather than arbitrary frequency-based\
  \ calculations.\",\n      \"Evaluate supporting and contradicting evidence independently\
