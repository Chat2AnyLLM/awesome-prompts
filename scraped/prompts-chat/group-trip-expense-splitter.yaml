slug: group-trip-expense-splitter
title: Group Trip Expense Splitter
description: Imported from Prompts Chat
prompt: "---\nname: group-trip-expense-splitter\ndescription: Splits shared costs\
  \ for a group trip, house share, or event: equal, subset, weighted, or exact splits,\
  \ mixed currencies with stated rates, and repayments already made, all in integer\
  \ cents so totals match. Produces per-person balances and a short \"who pays whom\"\
  \ list (at most one transfer fewer than people). Use when friends ask \"who owes\
  \ what?\" after a trip or a shared house month. Includes a stdlib Python splitter\
  \ with --self-test.\n---\n\n# Group Trip Expense Splitter\n\nYou help a group settle\
  \ shared expenses fairly and without arguments. You collect what was bought, who\
  \ paid, and who it was for, convert currencies with agreed rates, compute everyone's\
  \ balance to the cent, and propose a short list of payments (never more than one\
  \ fewer than the number of people) that makes everyone even. You explain every number\
  \ so anyone in the group can check it.\n\n## Files in this skill\n\n- `scripts/split_expenses.py`\
  \ - computes paid, share, and net balance per person and the settle-up transfers;\
  \ supports equal, among, shares, exact, and transfer_to entries (Python 3 standard\
  \ library only)\n- `references/splitting-rules.md` - how to choose a split method\
  \ for each kind of cost and handle common edge cases\n- `references/currency-and-rounding.md`\
  \ - which exchange rate to use, card fees, and how cents are rounded\n- `templates/settle-up-summary.md`\
  \ - a summary to paste into the group chat\n- `examples/trip.json` - a 4-person\
  \ weekend with a skipped dinner, student tickets, weighted drinks, USD and GBP costs,\
  \ and a cash repayment\n\n## Workflow\n\n### 1. Collect the expenses\nAsk for: the\
  \ people, the settlement currency, and for each expense the description, amount,\
  \ currency, who paid, and who it was for. Accept a messy list or receipts and turn\
  \ it into the JSON shape in `examples/trip.json`. Ask about money that already changed\
  \ hands (cash handed over, partial paybacks) and record it as `transfer_to`.\n\n\
  ### 2. Choose the split for each item\nDefault is equal among everyone. Use `among`\
  \ for costs that only some people shared, `shares` for \"Jonas had two drinks to\
  \ Maya's one\", and `exact` for itemized bills. See `references/splitting-rules.md`\
  \ and confirm unclear items with the group instead of guessing.\n\n### 3. Set currency\
  \ rates\nAgree on one rate per currency (card statement rate, or a published rate\
  \ on a stated date) and put it in `rates` as \"1 unit = X settlement units\". See\
  \ `references/currency-and-rounding.md`.\n\n### 4. Run the splitter\n```\npython3\
  \ scripts/split_expenses.py examples/trip.json\npython3 scripts/split_expenses.py\
  \ trip.json --json > settle.json\npython3 scripts/split_expenses.py --self-test\n\
  ```\nExit code 2 with a clear message for unknown names, missing rates, negative\
  \ amounts, or exact splits that do not add up.\n\n### 5. Share the result\nFill\
  \ `templates/settle-up-summary.md`: total spent, each person's paid/share/net, the\
  \ transfers, and the rates used. Keep it short enough for a group chat and offer\
  \ the full expense table on request.\n\n## Rules\n\n- Never guess who shared an\
  \ expense; ask, or split equally and say so.\n- Totals must match to the cent; mention\
  \ who received rounding cents.\n- Show the exchange rates and their source; do not\
  \ look up live rates silently.\n- Stay neutral: present numbers, not judgments about\
  \ who spent more.\n- Do not handle payment credentials or send money; only list\
  \ who should pay whom.\n\x1FFILE:references/splitting-rules.md\x1E\n# Splitting\
  \ Rules and Edge Cases\n\n## Choosing a method\n| Situation | Method | Example |\n\
  |---|---|---|\n| Everyone used it | equal (default) | accommodation, car rental,\
  \ shared groceries |\n| Only some people took part | `among` | dinner one person\
  \ skipped, a tour two people joined |\n| Uneven use of the same thing | `shares`\
  \ | drinks, nights stayed (3 nights vs 2), fuel by distance |\n| Itemized bill or\
  \ different prices | `exact` | student vs adult tickets, separate menu items |\n\
  | Money already handed over | `transfer_to` | cash paid back, a bank transfer during\
  \ the trip |\n\n## Edge cases\n- **Someone arrives late or leaves early.** Use `shares`\
  \ by nights for the accommodation (e.g. 3, 3, 2, 3).\n- **Couples or families paying\
  \ as one.** Either list them as one person, or keep them separate and give children\
  \ a smaller share by agreement.\n- **Deposits and refunds.** Amounts must be positive,\
  \ so lower the original expense by the refund. If the refund landed with someone\
  \ other than the original payer, also add a `transfer_to` entry from the original\
  \ payer to that person for the refunded amount, so the money they are holding counts\
  \ against them.\n- **Tips and service charges.** Split like the bill they belong\
  \ to.\n- **Gifts for one member (birthday dinner).** Use `among` with everyone except\
  \ the guest.\n- **Shared kitty / common pot.** Treat the kitty holder as the payer\
  \ of everything bought from the pot and add each contribution as `transfer_to` the\
  \ holder.\n- **Personal items on a shared receipt.** Split the receipt into two\
  \ entries: shared part (equal) and personal part (`exact` to that person).\n\n##\
  \ Fairness checks before sharing\n1. Sum of everyone's share equals total spent.\n\
  2. Every expense has a payer who was actually there.\n3. Nobody's share includes\
  \ things they explicitly declined.\n4. The group agreed on the rates and on any\
  \ unequal splits.\n\x1FFILE:references/currency-and-rounding.md\x1E\n# Currency\
  \ and Rounding\n\n## Picking exchange rates\n- **Best:** the rate on the payer's\
  \ card or bank statement for that charge, including any foreign transaction fee,\
  \ because that is what they actually paid.\n- **Simple:** one published rate (for\
  \ example a central bank reference rate) on a stated date for the whole trip.\n\
  - **Cash bought at an exchange office:** the rate they bought the cash at.\nWrite\
  \ rates as \"1 unit of foreign currency = X units of settlement currency\": `\"\
  USD\": 0.92` means 1 USD = 0.92 EUR.\n\n## Fees\n- Card foreign transaction fees\
  \ (often 1-3%) are a real cost of the shared purchase; add them to the expense amount\
  \ if the group agrees.\n- Fees to send the settle-up money (bank or app transfer\
  \ fees) are usually paid by the sender.\n\n## Rounding to the cent\n1. Each expense\
  \ is converted and rounded once (half up) to whole cents.\n2. The amount is split\
  \ by weight; each person gets the whole cents of their exact share.\n3. Leftover\
  \ cents (at most one per person) go to people with the largest fractional parts,\
  \ then alphabetically on ties.\nThis keeps every expense exact to the cent and the\
  \ result reproducible. Over a trip the rounding difference per person is a few cents\
  \ at most.\n\n## Settling in more than one currency\nSettle in one currency where\
  \ possible. If someone must pay in another currency, convert their final transfer\
  \ at a rate both sides accept and note it in the summary.\n\x1FFILE:templates/settle-up-summary.md\x1E\
  \n# Settle-up - <trip or event name>\n\n**Dates:** <dates>  **People:** <names>\
  \  **Settlement currency:** <currency>\n**Total spent:** <amount> across <n> expenses\
  \  **Rates used:** <1 USD = 0.92 EUR (card statements), ...>\n\n## Balances\n| Person\
  \ | Paid | Share | Net (+ gets back / - owes) |\n|---|---|---|---|\n| | | | |\n\n\
  ## Who pays whom\n- <name> pays <name> <amount>\n- <name> pays <name> <amount>\n\
  \n## Notes\n- Unequal splits: <dinner without Leo, student tickets, drinks by count>\n\
  - Rounding cents went to: <names>\n- Already settled during the trip: <cash or transfers>\n\
  \n## Group chat message\n> Trip totals are in! We spent <total> together. To settle\
  \ up: <transfer 1>; <transfer 2>; <transfer 3>. Full breakdown is in the thread.\
  \ Shout if anything looks off by <date>.\n\x1FFILE:examples/trip.json\x1E\n{\n \
  \ \"trip\": \"Lisbon long weekend, 4 friends\",\n  \"currency\": \"EUR\",\n  \"\
  rates\": {\"USD\": 0.92, \"GBP\": 1.17},\n  \"people\": [\"Maya\", \"Jonas\", \"\
  Priya\", \"Leo\"],\n  \"expenses\": [\n    {\"desc\": \"Apartment, 3 nights\", \"\
  amount\": 486.00, \"paid_by\": \"Maya\"},\n    {\"desc\": \"Airport taxi\", \"amount\"\
  : 38.50, \"paid_by\": \"Jonas\"},\n    {\"desc\": \"Groceries for breakfasts\",\
  \ \"amount\": 61.27, \"paid_by\": \"Priya\"},\n    {\"desc\": \"Seafood dinner (Leo\
  \ skipped)\", \"amount\": 142.80, \"paid_by\": \"Jonas\", \"among\": [\"Maya\",\
  \ \"Jonas\", \"Priya\"]},\n    {\"desc\": \"Sintra day tour, booked online\", \"\
  amount\": 196.00, \"currency\": \"USD\", \"paid_by\": \"Leo\"},\n    {\"desc\":\
  \ \"Fado show (Priya and Leo have student tickets)\", \"amount\": 84.00, \"paid_by\"\
  : \"Maya\", \"exact\": {\"Maya\": 25, \"Jonas\": 25, \"Priya\": 17, \"Leo\": 17}},\n\
  \    {\"desc\": \"Wine and pastel de nata tasting\", \"amount\": 72.00, \"paid_by\"\
  : \"Priya\", \"shares\": {\"Maya\": 1, \"Jonas\": 2, \"Priya\": 1, \"Leo\": 2}},\n\
  \    {\"desc\": \"Tram and metro cards\", \"amount\": 26.40, \"currency\": \"GBP\"\
  , \"paid_by\": \"Leo\"},\n    {\"desc\": \"Cash Jonas already handed Maya on day\
  \ 2\", \"amount\": 30.00, \"paid_by\": \"Jonas\", \"transfer_to\": \"Maya\"}\n \
  \ ]\n}\n\x1FFILE:scripts/split_expenses.py\x1E\n#!/usr/bin/env python3\n\"\"\"Group\
  \ trip expense splitter and settle-up planner (Python 3 standard library only).\n\
  \nInput JSON:\n{\n  \"currency\": \"EUR\",                         # settlement\
  \ currency\n  \"rates\": {\"USD\": 0.92, \"TRY\": 0.027},      # 1 unit of key =\
  \ rate units of settlement currency\n  \"people\": [\"Ana\", \"Ben\", \"Cem\", \"\
  Dee\"],\n  \"expenses\": [\n    {\"desc\": \"Villa\", \"amount\": 1200, \"paid_by\"\
  : \"Ana\"},                                 # equal, everyone\n    {\"desc\": \"\
  Dinner\", \"amount\": 180, \"paid_by\": \"Ben\", \"among\": [\"Ana\", \"Ben\", \"\
  Cem\"]},   # equal, subset\n    {\"desc\": \"Boat\", \"amount\": 300, \"currency\"\
  : \"USD\", \"paid_by\": \"Cem\",\n     \"shares\": {\"Ana\": 2, \"Ben\": 1, \"Cem\"\
  : 1}},                                         # weighted\n    {\"desc\": \"Museum\"\
  , \"amount\": 54, \"paid_by\": \"Dee\", \"exact\": {\"Dee\": 18, \"Ana\": 36}},\
  \  # exact amounts\n    {\"desc\": \"Ana pays Ben back\", \"amount\": 50, \"paid_by\"\
  : \"Ana\", \"transfer_to\": \"Ben\"}   # direct repayment\n  ]\n}\nAll math is done\
  \ in integer cents. Rounding remainders go to participants in a fixed order (largest\n\
  fractional part first, then name), so totals always match to the cent and results\
  \ are reproducible.\nSettle-up uses a greedy largest-creditor / largest-debtor match,\
  \ which needs at most n-1 transfers.\n\nUsage:\n  python3 split_expenses.py trip.json\n\
  \  python3 split_expenses.py trip.json --json\n  python3 split_expenses.py --self-test\n\
  Exit code: 0 OK, 2 bad input.\n\"\"\"\nimport argparse\nimport json\nimport sys\n\
  from decimal import Decimal, ROUND_HALF_UP\n\n\nclass SplitError(ValueError):\n\
  \    pass\n\n\ndef to_cents(amount, rate=Decimal(1)):\n    try:\n        d = Decimal(str(amount))\
  \ * Decimal(str(rate)) * 100\n    except Exception:\n        raise SplitError(f\"\
  bad amount {amount!r}\")\n    return int(d.quantize(Decimal(1), rounding=ROUND_HALF_UP))\n\
  \n\ndef fmt(cents, cur):\n    sign = \"-\" if cents < 0 else \"\"\n    return f\"\
  {sign}{abs(cents) // 100:,}.{abs(cents) % 100:02d} {cur}\"\n\n\ndef allocate(total,\
  \ weights):\n    \"\"\"Split integer total by weights {name: weight}; largest-remainder\
  \ method, ties by name.\"\"\"\n    wsum = sum(weights.values())\n    if wsum <=\
  \ 0:\n        raise SplitError(\"weights must sum to more than zero\")\n    raw\
  \ = {n: Decimal(total) * Decimal(str(w)) / Decimal(str(wsum)) for n, w in weights.items()}\n\
  \    base = {n: int(v) for n, v in raw.items()}\n    left = total - sum(base.values())\n\
  \    order = sorted(weights, key=lambda n: (-(raw[n] - base[n]), n))\n    for n\
  \ in order[:left]:\n        base[n] += 1\n    return base\n\n\ndef compute(data):\n\
  \    cur = data.get(\"currency\") or \"EUR\"\n    rates = {k.upper(): v for k, v\
  \ in (data.get(\"rates\") or {}).items()}\n    people = data.get(\"people\") or\
  \ []\n    if len(people) < 2:\n        raise SplitError(\"need at least two people\"\
  )\n    if len(set(people)) != len(people):\n        raise SplitError(\"duplicate\
  \ names in people\")\n    known = set(people)\n    paid = {p: 0 for p in people}\n\
  \    owed = {p: 0 for p in people}\n    lines = []\n    for i, e in enumerate(data.get(\"\
  expenses\") or [], start=1):\n        desc = e.get(\"desc\") or f\"expense {i}\"\
  \n        payer = e.get(\"paid_by\")\n        if payer not in known:\n         \
  \   raise SplitError(f\"{desc}: paid_by {payer!r} is not in people\")\n        ecur\
  \ = (e.get(\"currency\") or cur).upper()\n        if ecur == cur.upper():\n    \
  \        rate = 1\n        elif ecur in rates:\n            rate = rates[ecur]\n\
  \        else:\n            raise SplitError(f\"{desc}: no rate for {ecur} -> {cur};\
  \ add it to 'rates'\")\n        total = to_cents(e.get(\"amount\"), rate)\n    \
  \    if total <= 0:\n            raise SplitError(f\"{desc}: amount must be positive\"\
  )\n        modes = [k for k in (\"among\", \"shares\", \"exact\", \"transfer_to\"\
  ) if k in e]\n        if len(modes) > 1:\n            raise SplitError(f\"{desc}:\
  \ use only one of among / shares / exact / transfer_to\")\n        if \"transfer_to\"\
  \ in e:\n            to = e[\"transfer_to\"]\n            if to not in known or\
  \ to == payer:\n                raise SplitError(f\"{desc}: transfer_to must be\
  \ another person\")\n            split = {to: total}\n        elif \"exact\" in\
  \ e:\n            ex = e[\"exact\"]\n            for n in ex:\n                if\
  \ n not in known:\n                    raise SplitError(f\"{desc}: unknown person\
  \ {n!r}\")\n            split = {n: to_cents(v, rate) for n, v in ex.items()}\n\
  \            diff = total - sum(split.values())\n            if abs(diff) > len(split):\
  \  # allow only currency-conversion rounding\n                raise SplitError(f\"\
  {desc}: exact amounts add up to {fmt(sum(split.values()), cur)}, not {fmt(total,\
  \ cur)}\")\n            if diff:\n                split[sorted(split)[0]] += diff\n\
  \        elif \"shares\" in e:\n            sh = e[\"shares\"]\n            for\
  \ n, w in sh.items():\n                if n not in known:\n                    raise\
  \ SplitError(f\"{desc}: unknown person {n!r}\")\n                if float(w) < 0:\n\
  \                    raise SplitError(f\"{desc}: negative share for {n}\")\n   \
  \         split = allocate(total, {n: w for n, w in sh.items() if float(w) > 0})\n\
  \        else:\n            among = e.get(\"among\") or people\n            for\
  \ n in among:\n                if n not in known:\n                    raise SplitError(f\"\
  {desc}: unknown person {n!r}\")\n            split = allocate(total, {n: 1 for n\
  \ in among})\n        paid[payer] += total\n        for n, c in split.items():\n\
  \            owed[n] += c\n        lines.append({\"desc\": desc, \"paid_by\": payer,\
  \ \"amount\": total, \"original\": f\"{e.get('amount')} {ecur}\",\n            \
  \          \"split\": split, \"kind\": modes[0] if modes else \"equal\"})\n    net\
  \ = {p: paid[p] - owed[p] for p in people}\n    assert sum(net.values()) == 0, \"\
  internal error: balances do not sum to zero\"\n    return {\"currency\": cur, \"\
  people\": people, \"expenses\": lines, \"paid\": paid, \"owed\": owed,\n       \
  \     \"net\": net, \"transfers\": settle(net),\n            \"total_spent\": sum(l[\"\
  amount\"] for l in lines if l[\"kind\"] != \"transfer_to\")}\n\n\ndef settle(net):\n\
  \    cred = sorted([[c, n] for n, c in net.items() if c > 0], key=lambda x: (-x[0],\
  \ x[1]))\n    debt = sorted([[-c, n] for n, c in net.items() if c < 0], key=lambda\
  \ x: (-x[0], x[1]))\n    out = []\n    while cred and debt:\n        amt = min(cred[0][0],\
  \ debt[0][0])\n        out.append({\"from\": debt[0][1], \"to\": cred[0][1], \"\
  amount\": amt})\n        cred[0][0] -= amt\n        debt[0][0] -= amt\n        cred\
  \ = sorted([x for x in cred if x[0] > 0], key=lambda x: (-x[0], x[1]))\n       \
  \ debt = sorted([x for x in debt if x[0] > 0], key=lambda x: (-x[0], x[1]))\n  \
  \  return out\n\n\ndef to_markdown(r):\n    c = r[\"currency\"]\n    lines = [\"\
  # Trip settle-up\", \"\", f\"Total spent: {fmt(r['total_spent'], c)} across {len([e\
  \ for e in r['expenses'] if e['kind'] != 'transfer_to'])} expenses\", \"\",\n  \
  \           \"## Expenses\", \"| # | Expense | Paid by | Amount | Split |\", \"\
  |---|---|---|---|---|\"]\n    for i, e in enumerate(r[\"expenses\"], 1):\n     \
  \   split = \", \".join(f\"{n} {fmt(v, c)}\" for n, v in sorted(e[\"split\"].items()))\n\
  \        conv = \"\" if e[\"original\"].endswith(c.upper()) else f\" ({e['original']})\"\
  \n        lines.append(f\"| {i} | {e['desc']} | {e['paid_by']} | {fmt(e['amount'],\
  \ c)}{conv} | {e['kind']}: {split} |\")\n    lines += [\"\", \"## Balances\", \"\
  | Person | Paid | Share | Net |\", \"|---|---|---|---|\"]\n    for p in r[\"people\"\
  ]:\n        lines.append(f\"| {p} | {fmt(r['paid'][p], c)} | {fmt(r['owed'][p],\
  \ c)} | {fmt(r['net'][p], c)} |\")\n    lines += [\"\", \"## Who pays whom\"]\n\
  \    if not r[\"transfers\"]:\n        lines.append(\"Everyone is even.\")\n   \
  \ lines += [f\"- {t['from']} pays {t['to']} {fmt(t['amount'], c)}\" for t in r[\"\
  transfers\"]]\n    return \"\\n\".join(lines)\n\n\ndef self_test():\n    cases =\
  \ []\n\n    def ok(name, cond):\n        cases.append((name, bool(cond)))\n\n  \
  \  base = {\"currency\": \"EUR\", \"people\": [\"Ana\", \"Ben\", \"Cem\"]}\n   \
  \ r = compute(dict(base, expenses=[{\"desc\": \"Taxi\", \"amount\": 10, \"paid_by\"\
  : \"Ana\"}]))\n    ok(\"10.00 split three ways sums exactly\", sum(r[\"owed\"].values())\
  \ == 1000 and sorted(r[\"owed\"].values()) == [333, 333, 334])\n    ok(\"remainder\
  \ cent goes to first name on tie\", r[\"owed\"][\"Ana\"] == 334)\n    ok(\"two transfers\
  \ to the payer\", sorted((t[\"from\"], t[\"amount\"]) for t in r[\"transfers\"])\
  \ == [(\"Ben\", 333), (\"Cem\", 333)])\n    r = compute(dict(base, expenses=[{\"\
  desc\": \"A\", \"amount\": 30, \"paid_by\": \"Ana\"}, {\"desc\": \"B\", \"amount\"\
  : 30, \"paid_by\": \"Ben\"}, {\"desc\": \"C\", \"amount\": 30, \"paid_by\": \"Cem\"\
  }]))\n    ok(\"equal spending means no transfers\", r[\"transfers\"] == [])\n  \
  \  r = compute(dict(base, expenses=[{\"desc\": \"Dinner\", \"amount\": 90, \"paid_by\"\
  : \"Ben\", \"among\": [\"Ana\", \"Ben\"]}]))\n    ok(\"subset split excludes others\"\
  , r[\"owed\"][\"Cem\"] == 0 and r[\"net\"][\"Ana\"] == -4500)\n    r = compute(dict(base,\
  \ expenses=[{\"desc\": \"Boat\", \"amount\": 100, \"paid_by\": \"Cem\", \"shares\"\
  : {\"Ana\": 2, \"Ben\": 1, \"Cem\": 1}}]))\n    ok(\"weighted shares\", r[\"owed\"\
  ] == {\"Ana\": 5000, \"Ben\": 2500, \"Cem\": 2500})\n    r = compute(dict(base,\
  \ expenses=[{\"desc\": \"Tickets\", \"amount\": 50, \"paid_by\": \"Ana\", \"exact\"\
  : {\"Ben\": 20, \"Cem\": 30}}]))\n    ok(\"exact amounts\", r[\"net\"] == {\"Ana\"\
  : 5000, \"Ben\": -2000, \"Cem\": -3000})\n    r = compute(dict(base, rates={\"USD\"\
  : 0.9}, expenses=[{\"desc\": \"Gas\", \"amount\": 30, \"currency\": \"USD\", \"\
  paid_by\": \"Ben\"}]))\n    ok(\"currency conversion to cents\", r[\"paid\"][\"\
  Ben\"] == 2700 and sum(r[\"owed\"].values()) == 2700)\n    r = compute(dict(base,\
  \ expenses=[{\"desc\": \"Hotel\", \"amount\": 300, \"paid_by\": \"Ana\"}, {\"desc\"\
  : \"Payback\", \"amount\": 100, \"paid_by\": \"Ben\", \"transfer_to\": \"Ana\"}]))\n\
  \    ok(\"direct repayment reduces debt\", r[\"net\"] == {\"Ana\": 10000, \"Ben\"\
  : 0, \"Cem\": -10000})\n    ok(\"repayment not counted as spending\", r[\"total_spent\"\
  ] == 30000)\n    big = {\"currency\": \"EUR\", \"people\": [\"A\", \"B\", \"C\"\
  , \"D\", \"E\"],\n           \"expenses\": [{\"desc\": f\"x{i}\", \"amount\": 17.33\
  \ * (i + 1), \"paid_by\": \"ABCDE\"[i % 5], \"among\": list(\"ABCDE\"[: 2 + i %\
  \ 4])} for i in range(12)]}\n    r = compute(big)\n    ok(\"balances sum to zero\"\
  , sum(r[\"net\"].values()) == 0)\n    ok(\"at most n-1 transfers\", len(r[\"transfers\"\
  ]) <= 4)\n    after = dict(r[\"net\"])\n    for t in r[\"transfers\"]:\n       \
  \ after[t[\"from\"]] += t[\"amount\"]\n        after[t[\"to\"]] -= t[\"amount\"\
  ]\n    ok(\"transfers settle everyone to zero\", all(v == 0 for v in after.values()))\n\
  \    ok(\"deterministic output\", compute(big)[\"transfers\"] == r[\"transfers\"\
  ])\n    bad_inputs = [\n        (dict(base, expenses=[{\"desc\": \"X\", \"amount\"\
  : 10, \"paid_by\": \"Zed\"}]), \"unknown payer rejected\"),\n        (dict(base,\
  \ expenses=[{\"desc\": \"X\", \"amount\": 10, \"currency\": \"GBP\", \"paid_by\"\
  : \"Ana\"}]), \"missing rate rejected\"),\n        (dict(base, expenses=[{\"desc\"\
  : \"X\", \"amount\": 10, \"paid_by\": \"Ana\", \"exact\": {\"Ben\": 3}}]), \"exact\
  \ mismatch rejected\"),\n        (dict(base, expenses=[{\"desc\": \"X\", \"amount\"\
  : -5, \"paid_by\": \"Ana\"}]), \"negative amount rejected\"),\n        ({\"people\"\
  : [\"Solo\"], \"expenses\": []}, \"single person rejected\"),\n    ]\n    for data,\
  \ label in bad_inputs:\n        try:\n            compute(data)\n            ok(label,\
  \ False)\n        except SplitError:\n            ok(label, True)\n    ok(\"markdown\
  \ has settle-up section\", \"## Who pays whom\" in to_markdown(compute(dict(base,\
  \ expenses=[{\"desc\": \"Taxi\", \"amount\": 10, \"paid_by\": \"Ana\"}]))))\n  \
  \  passed = sum(c for _, c in cases)\n    for name, c in cases:\n        print((\"\
  PASS \" if c else \"FAIL \") + name)\n    print(f\"{passed}/{len(cases)} passed\"\
  )\n    return 0 if passed == len(cases) else 1\n\n\ndef main(argv=None):\n    ap\
  \ = argparse.ArgumentParser(description=\"Split shared trip expenses and plan a\
  \ short list of settle-up transfers.\")\n    ap.add_argument(\"file\", nargs=\"\
  ?\", help=\"trip JSON file, or '-' for stdin\")\n    ap.add_argument(\"--json\"\
  , action=\"store_true\")\n    ap.add_argument(\"--self-test\", action=\"store_true\"\
  )\n    a = ap.parse_args(argv)\n    if a.self_test:\n        return self_test()\n\
