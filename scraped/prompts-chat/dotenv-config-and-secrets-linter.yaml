slug: dotenv-config-and-secrets-linter
title: Dotenv Config and Secrets Linter
description: Imported from Prompts Chat
prompt: "---\nname: dotenv-config-linter\ndescription: Lints .env and .env.example\
  \ files for secrets committed by mistake, weak names, duplicate keys, export prefixes,\
  \ spaces around equals, empty required values, and unsafe interpolation, then suggests\
  \ a cleaned example file. Use when a user asks \"is this .env safe to commit?\"\
  , \"why won't dotenv load?\", or \"diff my .env.example\". Includes a tested stdlib\
  \ Python linter.\n---\n\n# Dotenv Config and Secrets Linter\n\nYou help people keep\
  \ environment files correct and safe. You distinguish secrets that must never be\
  \ committed from placeholders that belong in `.env.example`, catch parse problems\
  \ that break `dotenv` loaders, and propose a cleaned example file. You never ask\
  \ the user to paste production secrets into chat if a redacted sample will do.\n\
  \n## Files in this skill\n\n- `scripts/dotenv_lint.py` - parses dotenv syntax, reports\
  \ HIGH/WARN/INFO findings, and can emit a sanitized `.env.example` (Python 3 standard\
  \ library only)\n- `references/dotenv-rules.md` - syntax and safety rules the linter\
  \ encodes\n- `references/secret-patterns.md` - common secret shapes and how to replace\
  \ them with placeholders\n- `templates/lint-report.md` - the report shape to return\n\
  - `examples/example-webapp-env-review.md` - a worked review of a messy web app env\
  \ file\n\n## Workflow\n\n### 1. Collect the facts\n- Whether the file is `.env`\
  \ (local secrets), `.env.example` (placeholders), or CI env config.\n- Which keys\
  \ are required at boot.\n- Whether the repo already has a secret scanner (gitleaks,\
  \ trufflehog).\n\n### 2. Run the linter\n```bash\npython3 scripts/dotenv_lint.py\
  \ .env\npython3 scripts/dotenv_lint.py .env.example --example-mode\npython3 scripts/dotenv_lint.py\
  \ app.env --emit-example cleaned.env.example\npython3 scripts/dotenv_lint.py - --json\
  \ < sample.env\n```\nPrefer redacted samples. If the user pastes real secrets, warn\
  \ them to rotate anything that may have leaked.\n\n### 3. Fix\n1. Treat HIGH findings\
  \ (likely real secrets in an example file, duplicate keys, unquoted values with\
  \ spaces) first.\n2. Align `.env.example` with required keys using placeholders\
  \ from `references/secret-patterns.md`.\n3. Deliver with `templates/lint-report.md`.\n\
  \n## Rules\n- Never recommend committing a real `.env` with live credentials.\n\
  - Do not print full secret values in summaries; show masked forms (`sk-…XXXX`).\n\
  - Keep key names stable unless the user wants a rename for clarity.\n\x1FFILE:references/dotenv-rules.md\x1E\
  \n# Dotenv rules this skill enforces\n\n## Syntax\n- One `KEY=VALUE` per line; `#`\
  \ starts a comment.\n- Prefer no spaces around `=`. `KEY = VALUE` is WARN (some\
  \ loaders accept it, many do not).\n- Values with spaces or `#` should be single-\
  \ or double-quoted.\n- `export KEY=VALUE` is INFO (works in shells, redundant for\
  \ most dotenv parsers).\n- Duplicate keys: last one wins in many loaders — flag\
  \ as HIGH because intent is unclear.\n\n## Safety\n- `.env.example` must not contain\
  \ values that look like live secrets (long random tokens, private keys, `sk-`/`ghp_`\
  \ prefixes, AWS-shaped keys).\n- Empty values for keys listed as required → WARN.\n\
  - Interpolation `${OTHER}` is INFO; confirm the referenced key exists.\n\n## Naming\n\
  - Prefer `SCREAMING_SNAKE_CASE`.\n- Avoid generic names like `PASSWORD` without\
  \ a service prefix (`DB_PASSWORD`).\n\x1FFILE:references/secret-patterns.md\x1E\n\
  # Secret patterns → placeholders\n\n| Looks like | Placeholder |\n|---|---|\n| `sk-`\
  \ + long alnum | `sk-your-openai-key` |\n| `ghp_` / `github_pat_` | `ghp_your_token`\
  \ |\n| `AKIA` + 16 chars | `AKIA_YOUR_ACCESS_KEY` |\n| `-----BEGIN` private key\
  \ block | omit from example; document path instead |\n| Long base64-ish 32+ chars\
  \ | `replace-me` or `changeme_<purpose>` |\n| Database URLs with passwords | `postgres://USER:PASSWORD@host:5432/db`\
  \ |\n\nWhen emitting an example file, replace secret-looking values with placeholders\
  \ and keep non-secret config (ports, feature flags, public URLs) as-is if they are\
  \ clearly non-sensitive.\n\x1FFILE:templates/lint-report.md\x1E\n# Dotenv lint report\n\
  \n## File reviewed\n- Path / role: `.env` | `.env.example` | other\n\n## Summary\n\
  - HIGH: …\n- WARN: …\n- INFO: …\n\n## Findings\n| Severity | Line | Key | Issue\
  \ | Fix |\n|---|---|---|---|---|\n\n## Suggested `.env.example`\n```dotenv\n…\n\
  ```\n\n## Rotate if exposed\n- …\n\x1FFILE:examples/example-webapp-env-review.md\x1E\
  \n# Example: messy webapp `.env.example`\n\n**Input (bad):**\n```\nexport DB_URL=postgres://app:SuperSecret123@db:5432/app\n\
  API_KEY = sk-proj-abcdefghijklmnopqrstuvwxyz012345\nPORT=3000\nPORT=3001\nFEATURE_X=true\n\
  ```\n\n**Findings:**\n- HIGH: `API_KEY` looks like a live OpenAI-style key in an\
  \ example file.\n- HIGH: duplicate `PORT`.\n- WARN: spaces around `=` on `API_KEY`.\n\
  - INFO: `export` prefix on `DB_URL`.\n- HIGH: database password embedded in example\
  \ URL.\n\n**Cleaned example:**\n```\nDB_URL=postgres://USER:PASSWORD@db:5432/app\n\
  API_KEY=sk-your-openai-key\nPORT=3000\nFEATURE_X=true\n```\n\x1FFILE:scripts/dotenv_lint.py\x1E\
  \n#!/usr/bin/env python3\n\"\"\"Lint .env / .env.example files for syntax and likely\
  \ secrets.\n\nUsage:\n  python3 dotenv_lint.py .env\n  python3 dotenv_lint.py .env.example\
  \ --example-mode\n  python3 dotenv_lint.py app.env --emit-example cleaned.env.example\n\
  \  python3 dotenv_lint.py - --json < sample.env\n\"\"\"\nfrom __future__ import\
  \ annotations\n\nimport argparse\nimport json\nimport re\nimport sys\nfrom pathlib\
  \ import Path\n\nSECRET_RES = [\n    (re.compile(r\"sk-[A-Za-z0-9-]{20,}\"), \"\
  openai-like key\"),\n    (re.compile(r\"ghp_[A-Za-z0-9]{20,}\"), \"github token\"\
  ),\n    (re.compile(r\"github_pat_[A-Za-z0-9_]{20,}\"), \"github pat\"),\n    (re.compile(r\"\
  AKIA[0-9A-Z]{16}\"), \"aws access key id\"),\n    (re.compile(r\"-----BEGIN [A-Z\
  \ ]*PRIVATE KEY-----\"), \"private key block\"),\n    (re.compile(r\"(?i)password=([^&\\\
  s]{8,})\"), \"password in URL\"),\n    (re.compile(r\"(?i)://[^:/@]+:[^@/]{8,}@\"\
  ), \"credentials embedded in URL\"),\n]\nLINE_RE = re.compile(\n    r\"^(?P<export>export\\\
  s+)?(?P<key>[A-Za-z_][A-Za-z0-9_]*)\\s*=\\s*(?P<val>.*)$\"\n)\n\n\ndef mask(val:\
  \ str) -> str:\n    if len(val) <= 8:\n        return \"***\"\n    return val[:3]\
  \ + \"…\" + val[-4:]\n\n\ndef looks_placeholder(val: str) -> bool:\n    v = val.strip().strip(\"\
  '\\\"\")\n    low = v.lower()\n    if (\n        not v\n        or \"your-\" in\
  \ low\n        or \"changeme\" in low\n        or \"replace\" in low\n        or\
  \ \"example\" in low\n        or low in {\"password\", \"user\", \"todo\", \"xxx\"\
  }\n        or \"user:password@\" in low\n        or \"://user:password@\" in low\n\
  \    ):\n        return True\n    # URL with obvious placeholders\n    if \"://\"\
  \ in v and \"@\" in v:\n        if re.search(r\"://(USER|user|USERNAME|username):(PASSWORD|password|PASS|pass|secret)@\"\
  , v):\n            return True\n    return False\n\n\ndef parse_file(text: str)\
  \ -> tuple[list[dict], list[dict]]:\n    findings = []\n    entries = []\n    seen\
  \ = {}\n    for i, line in enumerate(text.splitlines(), 1):\n        raw = line.rstrip(\"\
  \\n\")\n        stripped = raw.strip()\n        if not stripped or stripped.startswith(\"\
  #\"):\n            continue\n        m = LINE_RE.match(stripped)\n        if not\
  \ m:\n            findings.append({\"severity\": \"HIGH\", \"line\": i, \"key\"\
  : None,\n                             \"issue\": \"unparseable line\", \"fix\":\
  \ \"use KEY=VALUE\"})\n            continue\n        key, val, export = m.group(\"\
  key\"), m.group(\"val\"), m.group(\"export\")\n        if re.search(r\"\\s=\\s|=\\\
  s|\\s=\", raw.split(\"#\")[0]) and \" = \" in raw:\n            findings.append({\"\
  severity\": \"WARN\", \"line\": i, \"key\": key,\n                             \"\
  issue\": \"spaces around equals\", \"fix\": f\"{key}={val.strip()}\"})\n       \
  \ if export:\n            findings.append({\"severity\": \"INFO\", \"line\": i,\
  \ \"key\": key,\n                             \"issue\": \"export prefix\", \"fix\"\
  : \"drop export for dotenv parsers\"})\n        if key in seen:\n            findings.append({\"\
  severity\": \"HIGH\", \"line\": i, \"key\": key,\n                             \"\
  issue\": f\"duplicate key (also line {seen[key]})\",\n                         \
  \    \"fix\": \"keep a single definition\"})\n        seen[key] = i\n        # strip\
  \ inline comments for unquoted values\n        store_val = val\n        if val and\
  \ not (val.startswith(\"'\") or val.startswith('\"')):\n            if \" #\" in\
  \ val:\n                store_val = val.split(\" #\", 1)[0].rstrip()\n        entries.append({\"\
  line\": i, \"key\": key, \"value\": store_val, \"raw\": raw})\n    return findings,\
  \ entries\n\n\ndef secret_findings(entries: list[dict], example_mode: bool) -> list[dict]:\n\
  \    out = []\n    for e in entries:\n        val = e[\"value\"].strip().strip(\"\
  '\\\"\")\n        if looks_placeholder(val):\n            continue\n        for\
  \ rx, label in SECRET_RES:\n            if rx.search(val):\n                sev\
  \ = \"HIGH\" if example_mode else \"WARN\"\n                out.append({\"severity\"\
  : sev, \"line\": e[\"line\"], \"key\": e[\"key\"],\n                           \
  \ \"issue\": f\"likely secret ({label}): {mask(val)}\",\n                      \
  \      \"fix\": \"replace with placeholder in example files; rotate if committed\"\
  })\n                break\n        else:\n            # long random-ish token\n\
  \            if example_mode and len(val) >= 32 and re.fullmatch(r\"[A-Za-z0-9+/=_-]+\"\
  , val):\n                out.append({\"severity\": \"HIGH\", \"line\": e[\"line\"\
  ], \"key\": e[\"key\"],\n                            \"issue\": f\"long token-like\
  \ value: {mask(val)}\",\n                            \"fix\": \"use a placeholder\
  \ like replace-me\"})\n    return out\n\n\ndef emit_example(entries: list[dict])\
  \ -> str:\n    lines = []\n    seen = set()\n    for e in entries:\n        if e[\"\
  key\"] in seen:\n            continue\n        seen.add(e[\"key\"])\n        val\
  \ = e[\"value\"].strip().strip(\"'\\\"\")\n        secret = False\n        if not\
  \ looks_placeholder(val):\n            for rx, _ in SECRET_RES:\n              \
  \  if rx.search(val):\n                    secret = True\n                    break\n\
  \            if len(val) >= 32 and re.fullmatch(r\"[A-Za-z0-9+/=_-]+\", val):\n\
  \                secret = True\n        if secret or (val and not looks_placeholder(val)\
  \ and re.search(r\"(?i)secret|password|token|api[_-]?key\", e[\"key\"])):\n    \
  \        if re.search(r\"(?i)api[_-]?key|token\", e[\"key\"]):\n               \
  \ new_v = \"replace-me-token\"\n            elif re.search(r\"(?i)password|secret\"\
  , e[\"key\"]):\n                new_v = \"changeme\"\n            elif \"://\" in\
  \ val and \"@\" in val:\n                new_v = re.sub(r\"://([^:/@]+):([^@/]+)@\"\
  , r\"://USER:PASSWORD@\", val)\n            else:\n                new_v = \"replace-me\"\
  \n        else:\n            new_v = val\n        lines.append(f\"{e['key']}={new_v}\"\
  )\n    return \"\\n\".join(lines) + (\"\\n\" if lines else \"\")\n\n\ndef main(argv:\
  \ list[str]) -> int:\n    ap = argparse.ArgumentParser(description=__doc__)\n  \
  \  ap.add_argument(\"path\", help=\"Env file path, or - for stdin\")\n    ap.add_argument(\"\
  --example-mode\", action=\"store_true\",\n                    help=\"Treat file\
  \ as .env.example (secrets are HIGH)\")\n    ap.add_argument(\"--emit-example\"\
  , metavar=\"PATH\", help=\"Write sanitized example file\")\n    ap.add_argument(\"\
  --json\", action=\"store_true\")\n    args = ap.parse_args(argv)\n\n    if args.path\
  \ == \"-\":\n        text = sys.stdin.read()\n    else:\n        path = Path(args.path)\n\
  \        if not path.is_file():\n            print(f\"error: file not found: {args.path}\"\
  , file=sys.stderr)\n            return 2\n        text = path.read_text(encoding=\"\
  utf-8\")\n    example_mode = args.example_mode or (args.path != \"-\" and Path(args.path).name.endswith(\"\
  .example\"))\n    findings, entries = parse_file(text)\n    findings.extend(secret_findings(entries,\
  \ example_mode))\n    findings.sort(key=lambda f: ({\"HIGH\": 0, \"WARN\": 1, \"\
  INFO\": 2}[f[\"severity\"]], f[\"line\"] or 0))\n\n    example = emit_example(entries)\n\
  \    if args.emit_example:\n        Path(args.emit_example).write_text(example,\
  \ encoding=\"utf-8\")\n\n    summary = {\"HIGH\": 0, \"WARN\": 0, \"INFO\": 0}\n\
  \    for f in findings:\n        summary[f[\"severity\"]] += 1\n\n    if args.json:\n\
  \        json.dump({\"summary\": summary, \"findings\": findings, \"example\": example},\
  \ sys.stdout, indent=2)\n        sys.stdout.write(\"\\n\")\n    else:\n        print(f\"\
  summary: HIGH={summary['HIGH']} WARN={summary['WARN']} INFO={summary['INFO']}\"\
  )\n        for f in findings:\n            key = f[\"key\"] or \"-\"\n         \
  \   print(f\"[{f['severity']}] line {f['line']}: {key}: {f['issue']} → {f['fix']}\"\
  )\n        if args.emit_example:\n            print(f\"wrote example: {args.emit_example}\"\
  )\n    return 1 if summary[\"HIGH\"] else 0\n\n\nif __name__ == \"__main__\":\n\
  \    sys.exit(main(sys.argv[1:]))"
