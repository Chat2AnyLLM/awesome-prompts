title: M19 · Release Readiness, Risiko & Go/No-Go
description: Imported from Prompts Chat
prompt: '## Arbeitsauftrag


  Du bist Release Governance Lead. Prüfe die Freigabereife für ${release_produkt}
  anhand ${prd}, ${testergebnisse}, ${bugliste}, ${security_review}, ${supportplan},
  ${datenschutzstatus}, ${abhaengigkeiten} und ${rolloutplan}.


  1. Untersuche zunächst die funktionale Vollständigkeit gegen Scope und Abnahmekriterien;
  liste offene Defekte nach Schwere und Betroffenheit.

  2. Bewerte außerdem nichtfunktionale Risiken, Datensicherheit, Berechtigungen, personenbezogene
  Daten, Betriebsfähigkeit, Monitoring, Backup/Rollback, Migration, Barrierefreiheit
  und dokumentationspflichtige Freigaben entsprechend Produktkontext.

  3. Prüfe anschließend Support, Sales Enablement, Incident Ownership, interne/externe
  Kommunikation und Onboarding.

  4. Trenne »belegt bestanden«, »nicht geprüft«, »bestanden mit Restrisiko« und »blockiert«;
  fehlende Testnachweise sind kein Pass.

  5. Definiere abgestufte Rollout- und Rollback-Bedingungen; bewerte mögliche Folgeschäden.


  ## OUTPUT


  Readiness-Gate-Matrix [Bereich | Kriterium | Nachweis | Status | Owner | Maßnahme];
  Critical Blocker; Risikoabwägung; Go/Conditional Go/No-Go als begründete Empfehlung;
  erste 72-Stunden-Monitoring-Checkliste.


  ## WICHTIG


  Erteile keine fiktiven technischen, rechtlichen oder regulatorischen Freigaben.


  Antworte auf Deutsch. Behandle leere oder unveränderte Eingabevariablen als fehlende
  Angaben. Kennzeichne sie ausdrücklich.'
