  \nNever use:\n\n```text\n\"AI says finished\"\n```\n\nas evidence.\n\n---\n\n# EXECUTION\
  \ COMMAND\n\nStart now.\n\nImplement:\n\n```text\nM1\n```\n\nRun its tests.\n\n\
