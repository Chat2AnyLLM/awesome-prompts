title: Meal Prep Storage and Use-By Planner
description: Imported from Prompts Chat
prompt: "---\nname: meal-prep-storage-and-use-by-planner\ndescription: Plans where\
  \ every batch-cooked portion lives after a meal prep session: which stay in the\
  \ fridge, which go in the freezer on prep day, when to move each to the fridge to\
  \ thaw, and what goes on the labels, using conservative USDA fridge and freezer\
  \ times. Flags meals planned past the use-by date, foods that do not freeze, shortfalls,\
  \ leftovers and a full fridge. Includes a stdlib Python planner with --self-test.\n\
  ---\n\n# Meal Prep Storage and Use-By Planner\n\nYou help people who batch-cook\
  \ on one day eat safely all week. Given what they cooked and when they plan to eat\
  \ it, you decide which portions stay in the fridge and which go straight into the\
  \ freezer, schedule the thawing, and write the labels, so nothing on Friday's menu\
  \ is past its fridge window and nothing is wasted.\n\n## Files in this skill\n\n\
  - `scripts/prep_storage.py` - reads the batch (item, category, portions, cooked\
  \ date) and the eating plan, splits portions between fridge and freezer, schedules\
  \ thawing, writes labels and a day-by-day plan, and flags problems (Python 3 standard\
  \ library only)\n- `references/storage-times.md` - fridge and freezer times for\
  \ 15 food categories with sources, and how to treat foods not on the list\n- `references/cooling-thawing-reheating.md`\
  \ - cooling within 2 hours, containers and labels, safe thawing, reheating and cooking\
  \ temperatures, rice and other special cases\n- `templates/prep-week-plan.md` -\
  \ the plan to hand back (storage table, day by day, labels, notes)\n- `examples/sunday-batch.csv`\
  \ - a Sunday prep session: 7 items, 31 portions\n- `examples/week-plan.csv` - Monday\
  \ to Saturday meals that use them\n\n## Workflow\n\n### 1. Collect the batch and\
  \ the plan\nAsk what they cooked or prepped, how many portions of each, the cooking\
  \ date, and which day and meal each portion is for. Map every item to a category\
  \ (`python3 scripts/prep_storage.py --categories`); when unsure, pick the shorter-lived\
  \ one. Ask about fridge space (how many containers fit) and whether anything was\
  \ left out of the fridge for more than 2 hours (that food is not planned, it is\
  \ discarded).\n\n### 2. Run the planner\n```\npython3 scripts/prep_storage.py examples/sunday-batch.csv\
  \ examples/week-plan.csv --fridge-capacity 16\npython3 scripts/prep_storage.py batch.csv\
  \ plan.csv --json\npython3 scripts/prep_storage.py --categories\npython3 scripts/prep_storage.py\
  \ --self-test\n```\nDay 0 is the cooking day. Portions planned within the fridge\
  \ window stay in the fridge; later ones are frozen on prep day and moved to the\
  \ fridge the evening before. Use the optional `fridge_days` and `freezer_months`\
  \ columns for foods not in the table (`freezer_months` 0 = do not freeze). Exit\
  \ 1 means a HIGH finding (a portion would be eaten past its use-by date or before\
  \ it is cooked), 2 means bad input.\n\n### 3. Fix the plan\nResolve every finding\
  \ (see `references/storage-times.md`):\n- PAST_USE_BY: move that meal earlier, swap\
  \ it with a freezable item, or make that food fresh mid-week.\n- SHORTFALL: cook\
  \ more or swap the meal; SURPLUS_NO_FREEZE: eat it earlier or cook less next time.\n\
  - FRIDGE_FULL: freeze more portions on prep day, combine portions, or prep twice\
  \ a week.\nRe-run until there are no HIGH findings.\n\n### 4. Deliver\nFill `templates/prep-week-plan.md`:\
  \ storage table, prep-day actions (cool, portion, label, fridge or freezer), the\
  \ day-by-day list including evening \"move to fridge\" reminders, labels to write,\
  \ and the safety notes from `references/cooling-thawing-reheating.md` that apply\
  \ to this batch.\n\n## Example result\nSunday 2026-11-01 batch: chicken burrito\
  \ bowls, rice and turkey chili keep 3 fridge portions each (eat by Thursday 11-05);\
  \ 2 bowls, 2 rice and 3 chili go in the freezer on Sunday, moved to the fridge Thursday\
  \ and Friday evenings. The raw marinated salmon (2-day window) is frozen raw on\
  \ Sunday, moved to the fridge Tuesday evening, and cooked Wednesday to 145 F / 63\
  \ C. Egg salad on Friday is day 5 and egg salad does not freeze well: HIGH PAST_USE_BY,\
  \ so move that lunch to Wednesday or Thursday or make it fresh. Two hard-boiled\
  \ eggs have no plan (eat by Sunday 11-08), one chili portion is a freezer spare,\
  \ and 22 containers do not fit a 16-container shelf on Sunday.\n\n## Rules\n\n-\
  \ Use the conservative end of every range and say so; when in doubt, throw it out.\n\
  - Count the cooking day as day 0; a 4-day food cooked Sunday is eaten by Thursday.\n\
  - Freezer times are for quality, not safety; fridge times are for safety. Never\
  \ extend fridge times because food \"looks fine\".\n- Thaw in the fridge, cold water\
  \ or microwave, never on the counter; eat thawed cooked food within 3-4 days and\
  \ do not count fridge days already used before freezing as fresh.\n- Raw items get\
  \ a cook-by date and a safe internal temperature, not a reheat note.\n- This is\
  \ general food-safety guidance, not medical advice; for pregnancy, infants, older\
  \ adults or weakened immunity, follow stricter local guidance.\n\x1FFILE:references/storage-times.md\x1E\
  \n# Fridge and freezer storage times\n\nValues used by `scripts/prep_storage.py`.\
  \ Fridge at 40 F / 4 C or colder, freezer at 0 F / -18 C. Day 0 is the day the food\
  \ was cooked (or, for raw items, prepped/marinated after purchase).\n\nSources:\
  \ USDA FSIS / FoodSafety.gov \"Cold Food Storage Chart\" and the USDA FoodKeeper\
  \ app. Where a range is given, the planner uses the shorter fridge time.\n\n| Category\
  \ | Examples | Fridge (chart) | Used | Freezer (quality) | Used |\n|---|---|---|---|---|---|\n\
  | cooked_meat | roast beef, pulled pork, meatballs, cooked mince | 3-4 days | 4\
  \ | 2-6 months | 3 |\n| cooked_poultry | shredded chicken, turkey breast, chicken\
  \ thighs | 3-4 days | 4 | 2-6 months | 3 |\n| soup_stew | soups, stews, chili, curries,\
  \ dal | 3-4 days | 4 | 2-3 months | 3 |\n| casserole | lasagna, enchiladas, bakes,\
  \ shepherd's pie | 3-4 days | 4 | 2-3 months | 3 |\n| cooked_grains | rice, pasta,\
  \ quinoa, couscous | 3-5 days | 4 | 1-2 months | 2 |\n| cooked_vegetables | roasted\
  \ or steamed vegetables, cooked beans | 3-4 days | 4 | about 2 months | 2 |\n| cooked_fish\
  \ | baked salmon, cooked shrimp | 3-4 days | 3 | about 3 months | 3 |\n| pizza |\
  \ pizza, savory pies, quiche slices | 3-4 days | 4 | 1-2 months | 2 |\n| deli_salad\
  \ | egg, chicken, tuna, ham, pasta salads | 3-5 days | 4 | does not freeze well\
  \ | - |\n| hard_boiled_eggs | peeled or unpeeled | 1 week | 7 | do not freeze |\
  \ - |\n| cut_raw_vegetables | carrot sticks, chopped onion, peppers | about 3-5\
  \ days (quality) | 4 | blanch first; not planned | - |\n| raw_ground_meat | ground\
  \ beef, turkey, pork, marinated mince | 1-2 days | 2 | 3-4 months | 3 |\n| raw_poultry\
  \ | chicken pieces, marinated thighs | 1-2 days | 2 | 9 months (pieces) | 9 |\n\
  | raw_steak_chops | steaks, chops, roasts | 3-5 days | 4 | 4-12 months | 4 |\n|\
  \ raw_fish | salmon fillets, white fish | 1-2 days | 2 | 2-3 months (fatty), 6-8\
  \ (lean) | 2 |\n\n## Foods that do not freeze well\nMayonnaise-based salads, hard-boiled\
  \ egg whites (rubbery), raw salad greens, cucumbers, cream sauces that split, fried\
  \ coatings (soggy), cooked pasta in a thin sauce (mushy). Freeze sauce and pasta\
  \ separately when possible.\n\n## Mixed dishes\nUse the shortest-lived ingredient:\
  \ a rice bowl with fish is cooked_fish (3 days), not cooked_grains (4). Sauces and\
  \ dressings stored separately follow their own label; opened store-bought sauces\
  \ follow the jar.\n\n## Foods not on the list\nAdd `fridge_days` and `freezer_months`\
  \ columns in BATCH.csv from FoodKeeper or the product label. If no source is available,\
  \ use 3 fridge days and do not freeze.\n\n## Day counting\n- Cooked Sunday, 4 days:\
  \ Monday (1), Tuesday (2), Wednesday (3), Thursday (4) is the last day.\n- Food\
  \ frozen on prep day and thawed in the fridge: eat within 3-4 days of thawing (the\
  \ planner schedules the move for the evening before).\n- Food frozen on day 3 has\
  \ only about 1 fridge day left after thawing; freeze early, ideally on the cooking\
  \ day.\n\n## Refreezing\nFood thawed in the fridge can be refrozen without cooking\
  \ (quality drops). Food thawed in cold water or the microwave must be cooked before\
  \ refreezing.\n\x1FFILE:references/cooling-thawing-reheating.md\x1E\n# Cooling,\
  \ packing, thawing and reheating\n\n## Cooling after cooking (the 2-hour rule)\n\
  - Get cooked food into the fridge or freezer within 2 hours of cooking (1 hour if\
  \ the room is above 90 F / 32 C).\n- Bacteria grow fastest between 40 F and 140\
  \ F (4-60 C). Large pots cool too slowly: divide into shallow containers (about\
  \ 2 in / 5 cm deep) or cool the pot in an ice bath, stirring.\n- Hot food can go\
  \ straight into the fridge; leave lids slightly open until it stops steaming, and\
  \ do not stack hot containers.\n- Rice and other starches: cool and refrigerate\
  \ quickly. Spores of Bacillus cereus survive cooking and make toxins when rice sits\
  \ warm; reheating does not destroy the toxin.\n\n## Packing and labels\n- One portion\
  \ per container makes the plan work: you only thaw what you eat.\n- Freezer: freezer\
  \ bags pressed flat (fast freezing and thawing), or rigid containers with 1/2 in\
  \ headspace for liquids.\n- Label every container: item, cooked date, \"eat by\"\
  \ (fridge) or \"best by\" (freezer), reheat or cook instruction. Masking tape and\
  \ a marker are enough.\n- Keep raw items on the bottom shelf, below ready-to-eat\
  \ food.\n\n## Thawing\n| Method | How | After thawing |\n|---|---|---|\n| Fridge\
  \ (best) | move the evening before; large or dense items need 24 h per 5 lb / 2.3\
  \ kg | cooked food within 3-4 days; raw ground meat, poultry, fish within 1-2 days\
  \ |\n| Cold water | sealed bag in cold water, change water every 30 min | cook or\
  \ reheat immediately |\n| Microwave | defrost setting | cook or reheat immediately\
  \ |\n| Counter | never | - |\nSoups and stews can be reheated straight from frozen\
  \ in a pot.\n\n## Reheating and cooking temperatures (internal)\n| Food | Temperature\
  \ |\n|---|---|\n| Leftovers and casseroles, reheated | 165 F / 74 C |\n| Soups,\
  \ sauces, gravies | bring to a rolling boil |\n| Poultry, raw | 165 F / 74 C |\n\
  | Ground beef, pork, lamb, raw | 160 F / 71 C |\n| Steaks, chops, roasts, raw |\
  \ 145 F / 63 C plus a 3 minute rest |\n| Fish, raw | 145 F / 63 C or until it flakes\
  \ and is opaque |\nMicrowave: cover, stir halfway, let stand 1-2 minutes, and check\
  \ the center with a thermometer.\n\n## Packed lunches\nUse an insulated bag with\
  \ an ice pack; reheat at work to steaming hot. Food left at room temperature more\
  \ than 2 hours is discarded, not returned to the fridge.\n\n## Signs are not a test\n\
  Spoilage bacteria (smell, slime) and pathogens (illness) are different; food can\
  \ look and smell fine and still be unsafe. Follow the dates, not the nose.\n\n##\
  \ Who should be stricter\nPregnant people, infants, older adults and anyone with\
  \ a weakened immune system: eat leftovers sooner, reheat to steaming hot, avoid\
  \ deli salads after day 2, and follow local health guidance.\n\x1FFILE:templates/prep-week-plan.md\x1E\
  \n# Meal prep plan: week of <2026-11-02>\n\n**Prep day:** <Sunday 2026-11-01>  \
  \ **People:** <2 adults>   **Fridge space:** <16 containers>\n**Status:** <OK /\
  \ 1 meal moved to avoid PAST_USE_BY>\n\n## Storage plan\n| Item | Category | Portions\
  \ | Fridge | Freezer | Eat by (fridge) | Best by (freezer) |\n|---|---|---|---|---|---|---|\n\
  | <Turkey chili> | <soup_stew> | <6> | <3> | <3> | <Thu 11-05> | <2027-02-01> |\n\
  \n## Prep-day checklist\n- [ ] Cool everything in shallow containers; fridge or\
  \ freezer within 2 hours\n- [ ] Portion: one portion per container\n- [ ] Freeze:\
  \ <chili x3, burrito bowls x2, rice x2, salmon x2 (raw, flat)>\n- [ ] Fridge: <...>\n\
  - [ ] Label every container (item, cooked date, eat by / best by, reheat or cook\
  \ to)\n\n## Day by day\n| Day | Breakfast | Lunch | Dinner | Evening: move to fridge\
  \ |\n|---|---|---|---|---|\n| <Mon 11-02> | <hard-boiled eggs x2> | <burrito bowl\
  \ + rice> | <turkey chili x2> | <-> |\n\n## Labels\n| Container | Label text |\n\
  |---|---|\n| <Turkey chili (fridge)> | <TURKEY CHILI - cooked Sun 11/01 - eat by\
  \ Thu 11/05 - reheat to 165 F> |\n\n## Changes made\n- <Egg salad lunch moved from\
  \ Fri to Wed (day 5 is past the 4-day limit)>\n\n## Spares and leftovers\n- <1 chili\
  \ portion in the freezer, best by 2027-02-01>\n\n## Safety notes for this batch\n\
  - <rice: cool fast, reheat once, steaming hot>\n- <salmon: thaw in the fridge Tue\
  \ evening, cook Wed to 145 F / 63 C>\n\x1FFILE:examples/sunday-batch.csv\x1E\nitem,category,portions,cooked_on\n\
  Chicken burrito bowl,cooked_poultry,5,2026-11-01\nCilantro lime rice,cooked_grains,5,2026-11-01\n\
  Turkey chili,soup_stew,6,2026-11-01\nEgg salad,deli_salad,3,2026-11-01\nHard-boiled\
  \ eggs,hard_boiled_eggs,6,2026-11-01\nRoasted vegetables,cooked_vegetables,4,2026-11-01\n\
  Miso salmon (raw marinated),raw_fish,2,2026-11-01\n\x1FFILE:examples/week-plan.csv\x1E\
  \ndate,meal,item,portions\n2026-11-02,breakfast,Hard-boiled eggs,2\n2026-11-02,lunch,Chicken\
  \ burrito bowl,1\n2026-11-02,lunch,Cilantro lime rice,1\n2026-11-02,dinner,Turkey\
  \ chili,2\n2026-11-03,lunch,Egg salad,1\n2026-11-03,dinner,Chicken burrito bowl,1\n\
  2026-11-03,dinner,Cilantro lime rice,1\n2026-11-04,breakfast,Hard-boiled eggs,2\n\
  2026-11-04,lunch,Turkey chili,1\n2026-11-04,dinner,Miso salmon (raw marinated),2\n\
  2026-11-04,dinner,Roasted vegetables,2\n2026-11-05,lunch,Chicken burrito bowl,1\n\
  2026-11-05,lunch,Cilantro lime rice,1\n2026-11-05,dinner,Roasted vegetables,2\n\
  2026-11-06,lunch,Egg salad,2\n2026-11-06,dinner,Chicken burrito bowl,2\n2026-11-06,dinner,Cilantro\
  \ lime rice,2\n2026-11-07,lunch,Turkey chili,2\n\x1FFILE:scripts/prep_storage.py\x1E\
  \n#!/usr/bin/env python3\n\"\"\"Meal prep storage and use-by planner (Python 3 standard\
  \ library only).\n\nTakes a batch-cooking session (what was cooked, how many portions,\
  \ when) and the\nweek's eating plan, and decides for every portion whether it stays\
  \ in the fridge or\ngoes into the freezer on prep day, when to move frozen portions\
  \ to the fridge to thaw,\nand what to write on each label. Flags portions planned\
  \ after their fridge window that\ncannot be frozen, plans that need more portions\
  \ than were cooked, portions planned\nbefore they are cooked, leftovers with no\
  \ plan, and a fridge that holds more\ncontainers than it has room for.\n\nFridge\
  \ and freezer times are conservative values from the USDA/FoodSafety.gov cold\n\
  storage chart and the FoodKeeper app (see references/storage-times.md). Day 0 is\
  \ the\ncooking day; a 4-day item cooked on Sunday must be eaten by Thursday. Freezer\
  \ times\nare for quality: food kept frozen at 0 F / -18 C stays safe, it just gets\
  \ worse.\n\nUsage:\n  python3 prep_storage.py BATCH.csv PLAN.csv [--fridge-capacity\
  \ 12] [--json]\n  python3 prep_storage.py --categories\n  python3 prep_storage.py\
  \ --self-test\nBATCH.csv columns: item,category,portions,cooked_on[,fridge_days,freezer_months]\n\
  PLAN.csv  columns: date,meal,item,portions   (dates as YYYY-MM-DD)\nExit codes:\
  \ 0 = plan is safe, 1 = at least one HIGH finding, 2 = bad input.\n\"\"\"\nimport\
  \ argparse, csv, datetime as dt, io, json, sys\n\nSEV_ORDER = {\"HIGH\": 0, \"MEDIUM\"\
  : 1, \"LOW\": 2, \"INFO\": 3}\nMEAL_ORDER = {\"prep\": 0, \"breakfast\": 1, \"lunch\"\
  : 2, \"snack\": 3, \"dinner\": 4, \"evening\": 5}\nSERVE_COLD = {\"deli_salad\"\
  , \"hard_boiled_eggs\", \"cut_raw_vegetables\"}\n# safe minimum internal temperatures\
  \ for raw categories (cook on the planned day)\nCOOK_TEMP = {\"raw_ground_meat\"\
  : \"160 F / 71 C\", \"raw_poultry\": \"165 F / 74 C\",\n             \"raw_steak_chops\"\
  : \"145 F / 63 C plus 3 min rest\", \"raw_fish\": \"145 F / 63 C\"}\n# category:\
  \ (fridge_days, freezer_months or None if it does not freeze well, note)\nCATEGORIES\
  \ = {\n    \"cooked_meat\":       (4, 3, \"cooked beef, pork, lamb; chart 3-4 days\
  \ / 2-6 months\"),\n    \"cooked_poultry\":    (4, 3, \"cooked chicken, turkey;\
  \ chart 3-4 days / 2-6 months\"),\n    \"soup_stew\":         (4, 3, \"soups, stews,\
  \ chili, curries; chart 3-4 days / 2-3 months\"),\n    \"casserole\":         (4,\
  \ 3, \"casseroles, lasagna, bakes; 3-4 days / 2-3 months\"),\n    \"cooked_grains\"\
  :     (4, 2, \"cooked rice, pasta, quinoa; cool fast; 3-5 days / 1-2 months\"),\n\
  \    \"cooked_vegetables\": (4, 2, \"roasted or steamed vegetables, cooked beans;\
  \ 3-4 days used\"),\n    \"cooked_fish\":       (3, 3, \"cooked fish and seafood;\
  \ 3-4 days, 3 used\"),\n    \"pizza\":             (4, 2, \"pizza, savory pies;\
  \ chart 3-4 days / 1-2 months\"),\n    \"deli_salad\":        (4, None, \"egg, chicken,\
  \ tuna, pasta salads; chart 3-5 days, does not freeze well\"),\n    \"hard_boiled_eggs\"\
  :  (7, None, \"hard-cooked eggs; chart 1 week, do not freeze\"),\n    \"cut_raw_vegetables\"\
  : (4, None, \"washed and cut raw vegetables; quality guide 3-5 days; blanch before\
  \ freezing\"),\n    \"raw_ground_meat\":   (2, 3, \"raw ground meat or marinated\
  \ mince; chart 1-2 days / 3-4 months\"),\n    \"raw_poultry\":       (2, 9, \"raw\
  \ chicken or turkey pieces, marinated; chart 1-2 days / 9 months\"),\n    \"raw_steak_chops\"\
  :   (4, 4, \"raw steaks, chops, roasts; chart 3-5 days / 4-12 months\"),\n    \"\
  raw_fish\":          (2, 2, \"raw fish; chart 1-2 days / 2-3 months fatty, 6-8 months\
  \ lean\"),\n}\n\n\nclass InputError(Exception):\n    pass\n\n\ndef parse_date(s,\
  \ where):\n    try:\n        return dt.date.fromisoformat(s.strip())\n    except\
  \ ValueError:\n        raise InputError(f\"{where}: date '{s}' is not YYYY-MM-DD\"\
  )\n\n\ndef parse_int(s, where, minimum=0):\n    try:\n        v = int(str(s).strip())\n\
  \    except ValueError:\n        raise InputError(f\"{where}: '{s}' is not a whole\
  \ number\")\n    if v < minimum:\n        raise InputError(f\"{where}: {v} must\
  \ be at least {minimum}\")\n    return v\n\n\ndef read_rows(text, required, name):\n\
  \    rows = list(csv.DictReader(io.StringIO(text.lstrip(\"\\ufeff\"))))\n    if\
  \ not rows:\n        raise InputError(f\"{name} has no rows\")\n    missing = [c\
  \ for c in required if c not in rows[0]]\n    if missing:\n        raise InputError(f\"\
  {name} is missing column(s): {', '.join(missing)}\")\n    return [{k.strip(): (v\
  \ or \"\").strip() for k, v in r.items() if k} for r in rows if any((v or \"\").strip()\
  \ for v in r.values())]\n\n\ndef load_batch(text):\n    items = {}\n    for i, r\
  \ in enumerate(read_rows(text, [\"item\", \"category\", \"portions\", \"cooked_on\"\
  ], \"BATCH\"), 2):\n        where = f\"BATCH line {i}\"\n        cat = r[\"category\"\
  ].lower()\n        if cat not in CATEGORIES and not r.get(\"fridge_days\"):\n  \
  \          raise InputError(f\"{where}: unknown category '{r['category']}' (see\
  \ --categories, or give fridge_days/freezer_months)\")\n        fd, fm, note = CATEGORIES.get(cat,\
  \ (None, None, \"custom\"))\n        if r.get(\"fridge_days\"):\n            fd\
  \ = parse_int(r[\"fridge_days\"], where, 1)\n        if r.get(\"freezer_months\"\
  ) is not None and r.get(\"freezer_months\") != \"\":\n            fm = parse_int(r[\"\
  freezer_months\"], where, 0) or None\n        name = r[\"item\"]\n        if name.lower()\
  \ in items:\n            raise InputError(f\"{where}: item '{name}' listed twice;\
  \ give each batch its own name\")\n        items[name.lower()] = {\"item\": name,\
  \ \"category\": cat, \"portions\": parse_int(r[\"portions\"], where, 1),\n     \
  \                          \"cooked_on\": parse_date(r[\"cooked_on\"], where), \"\
  fridge_days\": fd,\n                               \"freezer_months\": fm, \"note\"\
  : note}\n    return items\n\n\ndef load_plan(text, items):\n    plan = []\n    for\
  \ i, r in enumerate(read_rows(text, [\"date\", \"meal\", \"item\", \"portions\"\
  ], \"PLAN\"), 2):\n        where = f\"PLAN line {i}\"\n        key = r[\"item\"\
  ].lower()\n        if key not in items:\n            raise InputError(f\"{where}:\
  \ item '{r['item']}' is not in BATCH\")\n        plan.append({\"date\": parse_date(r[\"\
  date\"], where), \"meal\": r[\"meal\"], \"item\": key,\n                     \"\
  portions\": parse_int(r[\"portions\"], where, 1)})\n    plan.sort(key=lambda p:\
  \ p[\"date\"])\n    return plan\n\n\ndef add_months(d, months):\n    y, m = divmod(d.month\
  \ - 1 + months, 12)\n    y, m = d.year + y, m + 1\n    last = (dt.date(y + (m ==\
  \ 12), m % 12 + 1, 1) - dt.timedelta(days=1)).day\n    return dt.date(y, m, min(d.day,\
  \ last))\n\n\ndef plan_storage(items, plan, fridge_capacity=None):\n    findings,\
  \ timeline, labels = [], {}, []\n\n    def add(sev, code, item, detail):\n     \
  \   findings.append({\"severity\": sev, \"code\": code, \"item\": item, \"detail\"\
  : detail})\n\n    def ev(day, slot, text):\n        timeline.setdefault(day, []).append((MEAL_ORDER.get(slot.lower(),\
  \ 3), text))\n\n    summary = {}\n    for key, it in items.items():\n        cooked,\
  \ fd, fm = it[\"cooked_on\"], it[\"fridge_days\"], it[\"freezer_months\"]\n    \
  \    eat_by = cooked + dt.timedelta(days=fd)\n        best_by = add_months(cooked,\
  \ fm) if fm else None\n        left = it[\"portions\"]\n        fridge_n = freeze_n\
  \ = 0\n        uses = [p for p in plan if p[\"item\"] == key]\n        raw = it[\"\
  category\"] in COOK_TEMP\n        how = (f\"cook to {COOK_TEMP[it['category']]}\"\
  \ if raw else\n               \"serve cold\" if it[\"category\"] in SERVE_COLD else\
  \ \"reheat to 165 F / 74 C\")\n        for p in uses:\n            n = min(p[\"\
  portions\"], left)\n            short = p[\"portions\"] - n\n            if short:\n\
  \                add(\"MEDIUM\", \"SHORTFALL\", it[\"item\"], f\"{p['date']} {p['meal']}\
  \ needs {p['portions']} portion(s), only {n} left; cook more or swap the meal\"\
  )\n            if n == 0:\n                continue\n            left -= n\n   \
  \         if p[\"date\"] < cooked:\n                add(\"HIGH\", \"BEFORE_COOKED\"\
  , it[\"item\"], f\"{p['date']} {p['meal']} is before the cooking day {cooked}\"\
