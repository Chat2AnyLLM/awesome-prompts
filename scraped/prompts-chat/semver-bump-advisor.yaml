slug: semver-bump-advisor
title: SemVer Bump Advisor
description: Imported from Prompts Chat
prompt: "---\nname: semver-bump-advisor\ndescription: Reads Conventional Commits or\
  \ a changelog snippet, classifies fix/feat/breaking changes, and recommends the\
  \ next SemVer bump (patch, minor, or major) with a clear rationale and a preview\
  \ of the resulting version. Use when a user asks \"what version should I ship?\"\
  , \"is this a breaking change?\", or \"bump SemVer from these commits\". Includes\
  \ a tested stdlib Python advisor.\n---\n\n# SemVer Bump Advisor\n\nYou help teams\
  \ pick the next Semantic Version from real change signals: Conventional Commit subject\
  \ lines, a short changelog, or an explicit list of change types. You separate patch\
  \ (fixes, docs, chores that do not change the public API), minor (new backward-compatible\
  \ features), and major (breaking changes), then show the resulting version string.\
  \ You do not invent release notes the user did not imply.\n\n## Files in this skill\n\
  \n- `scripts/semver_bump.py` - parses commits or a CHANGELOG-ish list, scores the\
  \ highest bump required, and prints a rationale table (Python 3 standard library\
  \ only)\n- `references/conventional-commits-semver.md` - how commit types map to\
  \ SemVer, including `BREAKING CHANGE` and `!`\n- `references/edge-cases.md` - pre-1.0\
  \ rules, build metadata, multiple packages, and when not to bump\n- `templates/bump-report.md`\
  \ - the report shape to return\n- `examples/example-library-release.md` - a worked\
  \ example from a small library release\n\n## Workflow\n\n### 1. Collect the facts\n\
  Ask, or assume and say so:\n- The current version (`MAJOR.MINOR.PATCH`, optional\
  \ pre-release).\n- The change signals: Conventional Commit lines, a changelog since\
  \ the last tag, or labeled bullets (fix / feat / breaking).\n- Whether the project\
  \ is still `0.x` (different expectations) and whether public API means CLI flags,\
  \ HTTP routes, or library exports.\n\n### 2. Run the advisor\n```bash\npython3 scripts/semver_bump.py\
  \ 1.4.2 --commits commits.txt\npython3 scripts/semver_bump.py 0.9.1 --commits -\
  \ --pre-1-0-major-as-minor\npython3 scripts/semver_bump.py 2.0.0-rc.1 --json < changes.txt\n\
  ```\nA commits file has one subject per line (optional `type(scope):` prefix). Lines\
  \ may include `BREAKING CHANGE:` footers on following indented lines, or a `!` after\
  \ the type. Always show the tool output, then explain it in plain words.\n\n###\
  \ 3. Advise\n1. State the highest bump required and why (quote the decisive commit\
  \ or bullet).\n2. Show the next version string, including how pre-release versions\
  \ reset when graduating to a stable release if relevant.\n3. Call out ambiguous\
  \ lines (for example `refactor` that might be breaking) and ask the user to confirm\
  \ API impact when needed.\n4. Deliver with `templates/bump-report.md`, following\
  \ `examples/example-library-release.md`.\n\n## Rules\n- Never skip a major bump\
  \ when a breaking change is clearly present, unless the user explicitly opts into\
  \ pre-1.0 soft-major handling.\n- Do not invent commits; if the list is empty, say\
  \ so and refuse to guess.\n- Keep build metadata (`+...`) out of bump math; strip\
  \ or preserve it only as the user requests.\n- Prefer the Conventional Commits mapping\
  \ in `references/conventional-commits-semver.md` over ad-hoc labels.\n\x1FFILE:references/conventional-commits-semver.md\x1E\
  \n# Conventional Commits → SemVer\n\n## Type mapping (default)\n\n| Commit signal\
  \ | SemVer bump |\n|---|---|\n| `fix`, `docs`, `style`, `test`, `chore`, `ci`, `perf`\
  \ (non-breaking) | **patch** |\n| `feat` (non-breaking) | **minor** |\n| `BREAKING\
  \ CHANGE` footer, or `type!:` / `type(scope)!:` | **major** |\n| `refactor`, `build`,\
  \ `revert` without breaking marker | **patch** (confirm if public API moved) |\n\
  \nWhen several commits appear, take the **maximum** bump: major > minor > patch.\n\
  \n## Breaking change markers\n1. A footer line starting with `BREAKING CHANGE:`\
  \ or `BREAKING-CHANGE:`.\n2. `!` immediately before the colon: `feat!: ...` or `feat(api)!:\
  \ ...`.\n\n## Scopes\nScopes do not change the bump by themselves. `feat(cli): add\
  \ --json` is still a minor. `fix(docs): typo` is still a patch.\n\n## Pre-release\
  \ versions\nGiven `1.2.0-rc.3`:\n- A patch-level change while still in RC usually\
  \ becomes `1.2.0-rc.4` if you stay on the RC channel.\n- Graduating to stable after\
  \ RC is a product decision: often `1.2.0` (not `1.2.1`) when RC already represents\
  \ that minor.\n\nThis skill's script treats the numeric core `MAJOR.MINOR.PATCH`\
  \ for bump math and prints pre-release handling notes separately.\n\x1FFILE:references/edge-cases.md\x1E\
  \n# Edge cases\n\n## Pre-1.0 (`0.x.y`)\nSemVer allows breaking changes in `0.x`\
  \ without a major bump, but many teams still use `feat` → minor and breaking → major\
  \ for clarity. Offer both:\n- Strict SemVer comfort: breaking in `0.x` may bump\
  \ minor.\n- Team policy: treat breaking as major even before 1.0 (`--pre-1-0-major-as-minor`\
  \ off).\n\n## Multiple packages\nMonorepos may bump packages independently. Run\
  \ the advisor once per package with that package's commits only.\n\n## Ambiguous\
  \ refactors\n`refactor: rename export Foo to Bar` is breaking for libraries even\
  \ without a `!`. Escalate to the user: if public API renamed → major; if internal\
  \ only → patch.\n\n## Empty or non-conventional lines\nPlain sentences without a\
  \ type still count if they clearly say \"breaking\" or \"add feature\"; otherwise\
  \ mark them **unknown** and ask.\n\n## Build metadata\n`1.2.3+build.9` — bump the\
  \ core version, then decide whether to drop or refresh `+build...`. Do not let metadata\
  \ affect major/minor/patch math.\n\x1FFILE:templates/bump-report.md\x1E\n# SemVer\
  \ bump report\n\n## Current version\n- …\n\n## Recommended bump\n- Level: patch\
  \ | minor | major\n- Next version: …\n- Decisive change: …\n\n## Change tally\n\
  | Level | Count | Examples |\n|---|---|---|\n| major | | |\n| minor | | |\n| patch\
  \ | | |\n| unknown | | |\n\n## Notes and questions\n- …\n\n## Suggested tag / release\
  \ command\n```bash\n# example\ngit tag -a vX.Y.Z -m \"…\"\n```\n\x1FFILE:examples/example-library-release.md\x1E\
  \n# Example: library release from Conventional Commits\n\n**Current version:** `1.4.2`\n\
  \n**Commits since v1.4.2:**\n```\nfix: handle empty Accept headers\nfeat(api): add\
  \ cursor pagination\ndocs: fix README typo\nfeat!: remove deprecated /v1/list route\n\
  ```\n\n**Advisor result:** major → `2.0.0` because of `feat!: remove deprecated\
  \ /v1/list route`.\n\n**Rationale:** The `!` marks a breaking API removal. The new\
  \ pagination feature alone would have been a minor (`1.5.0`), and the fix/docs alone\
  \ a patch (`1.4.3`), but major wins.\n\n**Report excerpt:** Recommend releasing\
  \ `2.0.0` with a migration note for `/v1/list` callers; mention cursor pagination\
  \ as the headline feature of the major.\n\x1FFILE:scripts/semver_bump.py\x1E\n#!/usr/bin/env\
  \ python3\n\"\"\"Recommend a SemVer bump from Conventional Commit subjects or change\
  \ lines.\n\nUsage:\n  python3 semver_bump.py 1.4.2 --commits commits.txt\n  python3\
  \ semver_bump.py 0.9.1 --commits - --pre-1-0-major-as-minor\n  python3 semver_bump.py\
  \ 2.0.0 --json < changes.txt\n\"\"\"\nfrom __future__ import annotations\n\nimport\
  \ argparse\nimport json\nimport re\nimport sys\n\nTYPE_PATCH = {\"fix\", \"docs\"\
  , \"style\", \"test\", \"chore\", \"ci\", \"perf\", \"build\", \"refactor\", \"\
  revert\"}\nTYPE_MINOR = {\"feat\"}\nCOMMIT_RE = re.compile(\n    r\"^(?P<type>[a-zA-Z]+)(?P<scope>\\\
  ([^)]*\\))?(?P<breaking>!)?:\\s*(?P<sub>.+)$\"\n)\nVER_RE = re.compile(\n    r\"\
  ^(?P<major>0|[1-9]\\d*)\\.(?P<minor>0|[1-9]\\d*)\\.(?P<patch>0|[1-9]\\d*)\"\n  \
  \  r\"(?:-(?P<pre>[0-9A-Za-z.-]+))?(?:\\+(?P<build>[0-9A-Za-z.-]+))?$\"\n)\nLEVELS\
  \ = {\"none\": 0, \"patch\": 1, \"minor\": 2, \"major\": 3}\n\n\ndef parse_version(v:\
  \ str) -> dict:\n    m = VER_RE.match(v.strip())\n    if not m:\n        raise SystemExit(f\"\
  error: not a SemVer core version: {v!r}\")\n    return {k: m.group(k) for k in (\"\
  major\", \"minor\", \"patch\", \"pre\", \"build\")}\n\n\ndef classify_line(line:\
  \ str) -> tuple[str, str]:\n    raw = line.strip()\n    if not raw or raw.startswith(\"\
  #\"):\n        return \"skip\", raw\n    lower = raw.lower()\n    if lower.startswith(\"\
  breaking change:\") or lower.startswith(\"breaking-change:\"):\n        return \"\
  major\", raw\n    m = COMMIT_RE.match(raw)\n    if m:\n        if m.group(\"breaking\"\
  ):\n            return \"major\", raw\n        t = m.group(\"type\").lower()\n \
  \       if t in TYPE_MINOR:\n            return \"minor\", raw\n        if t in\
  \ TYPE_PATCH:\n            return \"patch\", raw\n        return \"unknown\", raw\n\
  \    if \"breaking\" in lower:\n        return \"major\", raw\n    if lower.startswith(\"\
  feat\") or \"new feature\" in lower or lower.startswith(\"add \"):\n        return\
  \ \"minor\", raw\n    if lower.startswith(\"fix\") or \"bug\" in lower:\n      \
  \  return \"patch\", raw\n    return \"unknown\", raw\n\n\ndef read_lines(path:\
  \ str) -> list[str]:\n    if path == \"-\":\n        return sys.stdin.read().splitlines()\n\
  \    with open(path, encoding=\"utf-8\") as f:\n        return f.read().splitlines()\n\
  \n\ndef bump(ver: dict, level: str, pre10_soft: bool) -> str:\n    major, minor,\
  \ patch = int(ver[\"major\"]), int(ver[\"minor\"]), int(ver[\"patch\"])\n    if\
  \ level == \"none\":\n        core = f\"{major}.{minor}.{patch}\"\n    elif level\
  \ == \"major\":\n        if pre10_soft and major == 0:\n            minor += 1\n\
  \            patch = 0\n        else:\n            major += 1\n            minor\
  \ = 0\n            patch = 0\n        core = f\"{major}.{minor}.{patch}\"\n    elif\
  \ level == \"minor\":\n        minor += 1\n        patch = 0\n        core = f\"\
  {major}.{minor}.{patch}\"\n    else:\n        patch += 1\n        core = f\"{major}.{minor}.{patch}\"\
  \n    return core\n\n\ndef main(argv: list[str]) -> int:\n    ap = argparse.ArgumentParser(description=__doc__)\n\
  \    ap.add_argument(\"version\", help=\"Current SemVer, e.g. 1.4.2 or 0.9.1-rc.1\"\
  )\n    ap.add_argument(\"--commits\", default=\"-\", help=\"File of commit subjects\
  \ (default: stdin)\")\n    ap.add_argument(\"--pre-1-0-major-as-minor\", action=\"\
  store_true\",\n                    help=\"In 0.x, treat breaking as minor bump\"\
  )\n    ap.add_argument(\"--json\", action=\"store_true\", help=\"Machine-readable\
  \ JSON output\")\n    args = ap.parse_args(argv)\n\n    ver = parse_version(args.version)\n\
  \    lines = read_lines(args.commits)\n    tallies = {\"major\": [], \"minor\":\
  \ [], \"patch\": [], \"unknown\": []}\n    best = \"none\"\n    for line in lines:\n\
  \        level, raw = classify_line(line)\n        if level == \"skip\":\n     \
  \       continue\n        tallies[level].append(raw)\n        if LEVELS[level] >\
  \ LEVELS[best]:\n            best = level\n\n    if best == \"none\":\n        print(\"\
  error: no usable change lines\", file=sys.stderr)\n        return 1\n\n    next_v\
  \ = bump(ver, best, args.pre_1_0_major_as_minor)\n    decisive = (tallies[best][0]\
  \ if tallies[best] else \"\")\n    note = None\n    if args.pre_1_0_major_as_minor\
  \ and int(ver[\"major\"]) == 0 and best == \"major\":\n        note = \"pre-1.0\
  \ soft major: breaking treated as minor bump\"\n        # best label stays major\
  \ for tally, but version used soft path\n    result = {\n        \"current\": args.version,\n\
  \        \"bump\": best,\n        \"next\": next_v,\n        \"decisive\": decisive,\n\
  \        \"tally\": {k: len(v) for k, v in tallies.items()},\n        \"examples\"\
  : {k: v[:5] for k, v in tallies.items() if v},\n        \"note\": note,\n    }\n\
  \    if args.json:\n        json.dump(result, sys.stdout, indent=2)\n        sys.stdout.write(\"\
  \\n\")\n    else:\n        print(f\"current: {args.version}\")\n        print(f\"\
  bump:    {best}\")\n        print(f\"next:    {next_v}\")\n        if note:\n  \
  \          print(f\"note:    {note}\")\n        print(f\"decisive:{decisive}\")\n\
  \        print(\"tally:\")\n        for k in (\"major\", \"minor\", \"patch\", \"\
  unknown\"):\n            print(f\"  {k}: {len(tallies[k])}\")\n            for ex\
  \ in tallies[k][:5]:\n                print(f\"    - {ex}\")\n    return 0\n\n\n\
  if __name__ == \"__main__\":\n    sys.exit(main(sys.argv[1:]))"
