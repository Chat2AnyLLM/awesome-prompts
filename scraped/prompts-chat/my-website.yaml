description: Imported from Prompts Chat
prompt: 'Act as an expert UI/UX designer and professional copywriter. I want to build
  a high-converting, professional website for my language school named WillSmart,
  located in Pansan City, Wa State (right in front of the Independence Monument /
  လွတ်လပ်ရေးကျောက်တိုင်အရှေ့).

  ​Important Requirement:

  Please write the website content using three languages side-by-side or section-by-section:
  Myanmar (မြန်မာ), Chinese (中文), and English. Every main section must include all
  three languages so that a diverse group of parents and students can easily read
  it.

  ​School Details to Include:

  ​Target Age: Starting from 3 years old and above (၃ နှစ်အရွယ်မှစတင်၍).

  ​Day Class (9:00 AM – 3:00 PM):

  ​Tuition only: 600 Yuan / month

  ​Tuition + Healthy Lunch included: 800 Yuan / month

  ​Evening Class:

  ​Tuition fee: 400 Yuan / month

  ​Please design the website sections (Hero, About Us, Location, Programs & Pricing,
  Why Choose Us, and Contact) clearly with clean formatting and translations in Myanmar,
  Chinese, and English."*'
