  under a black metal hood and chimney. Behind him, a rough whitewashed stone wall
  holds a wooden rack with a row of hanging hammers and long-handled tongs. On the
  right, a small multi-pane window lets in cool, soft grey-blue daylight that falls
  on the wall and the windowsill. Warm firelight from the forge and the hot metal
  lights his face, forearms, and apron, contrasting with the cool window light. Dust
  and soot in the air, gritty textures of leather, iron, and stone, shallow depth
  of field, cinematic documentary photography, natural colors. No text, no logos.
