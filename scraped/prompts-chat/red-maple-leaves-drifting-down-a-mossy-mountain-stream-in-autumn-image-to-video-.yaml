title: Red Maple Leaves Drifting Down a Mossy Mountain Stream in Autumn (Image-to-Video
  Animation)
description: Imported from Prompts Chat
prompt: 'Use the attached still (step 1: a photorealistic photograph of a clear mountain
  stream in an autumn forest, water flowing over mossy stones into a quiet pool, red
  maple leaves floating on the dark water and a few falling, crimson and gold trees
  leaning over the banks, thin mist and soft sun rays in the background) as the exact
  first frame and animate it into an 8-second, 16:9 cinematic shot. Keep every element
  as it is in the still: the stones and moss, the shape of the stream and the small
  cascades, the trees, the mist and the light.


  Motion (0-8 s):

  - 0-3 s: the water flows naturally over the stones and down the small cascades;
  the floating maple leaves on the pool drift slowly and turn gently with the current;
  soft ripples spread where the cascade meets the pool.

  - 3-6 s: a light breeze moves the branches overhead; three or four red leaves detach
  and spiral down slowly, one landing on the pool and starting to drift; the sun rays
  brighten slightly as the mist moves.

  - 6-8 s: the breeze calms, the leaves keep drifting downstream past the mossy stones,
  a last leaf twirls down into the frame.


  Camera: locked-off tripod shot with a very slow, subtle push in toward the pool
  (about 3 percent); no cuts, no fast moves; the stones, trunks and banks stay solid
  and still.


  Ambient motion: thin mist drifting slowly between the trunks, tiny sparkles of light
  on the moving water, a few leaves trembling on the branches.


  Lighting and mood: soft, cool morning light with warm autumn colors, calm and meditative.


  Sound: off (silent clip).


  Avoid: people, animals, leaves changing color or multiplying, leaves falling like
  a storm, water freezing or flowing backwards, stones moving or morphing, sudden
  light changes, time-lapse, text.'
