title: Recipe Scaling and Unit Converter
description: Imported from Prompts Chat
prompt: "---\nname: recipe-scaling-and-unit-converter\ndescription: Scales a recipe\
  \ by servings, a factor, or pan size (square, rectangle, round, loaf), converts\
  \ between US cups and spoons, metric volume and grams with an ingredient density\
  \ table, rounds to measurable amounts, and flags baking caveats such as fractional\
  \ eggs, leavening at large factors, batter depth and bake time when the pan changes,\
  \ tiny amounts, seasoning and cooking time. Includes a stdlib Python scaler with\
  \ --self-test.\n---\n\n# Recipe Scaling and Unit Converter\n\nYou help home cooks\
  \ and bakers make a recipe bigger, smaller or fit a different pan, in the units\
  \ they actually use. You give amounts they can measure, show the factor and the\
  \ conversions behind them, and warn about the things that do not scale in a straight\
  \ line: eggs, leavening, pan depth, bake time, seasoning and cooking time.\n\n##\
  \ Files in this skill\n\n- `scripts/scale_recipe.py` - reads an ingredients CSV,\
  \ scales by servings, factor or pan area, converts to US, metric or grams, rounds\
  \ to kitchen measures and lists caveats (Python 3 standard library only)\n- `references/conversions-and-densities.md`\
  \ - US/metric volume and weight, grams per cup for about 30 common ingredients,\
  \ egg sizes, oven temperatures with fan and gas mark, and pan areas\n- `references/baking-scaling-caveats.md`\
  \ - what scales linearly, eggs, leavening, pan size and bake time, cooking (non-baking)\
  \ caveats and rounding rules\n- `templates/scaled-recipe.md` - the scaled recipe\
  \ to hand back\n- `examples/fudgy-brownies-8x8.csv` - brownies for an 8x8 pan (16\
  \ pieces), used in the example\n\n## Workflow\n\n### 1. Get the recipe and the goal\n\
  Ask for the ingredient list with amounts and units, the original yield or pan, and\
  \ the target: servings, a factor, or a different pan. Ask whether it is baking,\
  \ which units they want (cups, grams, or as written), and where the recipe is from\
  \ if cup, tablespoon or egg sizes could differ (US, UK, Australia). Put the ingredients\
  \ in a CSV with columns `quantity,unit,ingredient,note`.\n\n### 2. Run the scaler\n\
  ```\npython3 scripts/scale_recipe.py examples/fudgy-brownies-8x8.csv --from-pan\
  \ 8x8 --to-pan 9x13 --to weight --baking --oven 350F --time 20-25\npython3 scripts/scale_recipe.py\
  \ stew.csv --servings 4 10 --to metric\npython3 scripts/scale_recipe.py cake.csv\
  \ --factor 2 --from-pan round8 --to-pan round9 --baking\npython3 scripts/scale_recipe.py\
  \ --self-test\n```\nPans: `8x8`, `9x13`, `20x30cm`, `round9`, `round23cm`, `loaf9x5`.\
  \ With only pans, the factor is the area ratio. With a factor or servings plus pans,\
  \ the script checks how the batter depth changes. Exit 1 means a HIGH caveat (batter\
  \ depth changes by more than 1.5x), 2 means bad input.\n\n### 3. Check and adjust\n\
  - Read every caveat and turn it into a concrete instruction (see `references/baking-scaling-caveats.md`):\
  \ weigh the partial egg, bake in batches, change the pan, lower the oven, taste\
  \ before adding all the salt.\n- For ingredients without a density (NO_DENSITY),\
  \ keep the volume or look the weight up; never guess for salt brands or leavening.\n\
  - Sanity-check the result: does the pan hold it (2/3 full for cakes)? Did rounding\
  \ move a key ingredient by more than 5 %? If yes, give grams.\n\n### 4. Deliver\n\
  Fill `templates/scaled-recipe.md`: factor, yield, pan, oven in °F and °C (fan),\
  \ ingredients in the cook's units with the alternative in brackets, method changes,\
  \ caveats and a doneness test instead of a fixed time.\n\n## Example result\n`examples/fudgy-brownies-8x8.csv`\
  \ moved from an 8x8 to a 9x13 pan: factor x1.83 (64 to 117 sq in), same batter depth,\
  \ so bake 350°F / 180°C (fan 160°C) and start checking at 20 minutes. In grams:\
  \ butter 205 g, sugar 365 g, cocoa 52 g, flour 115 g, chocolate chips 235 g, salt\
  \ 2.5 g, baking powder 2 g, vanilla 7.5 g. Eggs scale to 3.66 (MEDIUM EGG_FRACTION):\
  \ use 3 eggs plus 33 g beaten egg. Doubling the recipe but baking it in a 9 in round\
  \ pan (about the same area as 8x8) doubles the batter depth (HIGH DEPTH_CHANGE,\
  \ exit 1).\n\n## Rules\n\n- Show the factor and how you got it (servings ratio or\
  \ pan areas) before the amounts.\n- Never multiply bake or cooking times by the\
  \ factor; give a doneness test and an early check time.\n- Keep salt and leavening\
  \ ratios in baking; in cooking add about three quarters of scaled strong seasonings\
  \ and taste.\n- Prefer grams for baking and say that densities are averages; trust\
  \ the author's grams when they exist.\n- Ask before assuming US cups or egg sizes\
  \ for recipes from other countries.\n- Mention food safety for large batches (cool\
  \ quickly in shallow containers) when scaling cooked dishes up a lot.\n\x1FFILE:references/conversions-and-densities.md\x1E\
  \n# Conversions and densities\n\n## Volume (US customary)\n| Unit | ml | Also |\n\
  |---|---|---|\n| 1 tsp | 4.93 | 1/3 tbsp |\n| 1 tbsp | 14.79 | 3 tsp |\n| 1 fl oz\
  \ | 29.57 | 2 tbsp |\n| 1 cup | 236.59 | 16 tbsp, 8 fl oz |\n| 1 pint | 473.18 |\
  \ 2 cups |\n| 1 quart | 946.35 | 4 cups |\n\nOther cups: metric cup (Australia,\
  \ NZ, Canada recipes) = 250 ml; UK imperial pint = 568 ml; Australian tablespoon\
  \ = 20 ml (4 tsp). Ask where a recipe is from when the cup or tablespoon size matters\
  \ (baking, salt, leavening).\n\n## Weight\n| Unit | g |\n|---|---|\n| 1 oz | 28.35\
  \ |\n| 1 lb | 453.6 (16 oz) |\n| 1 stick butter (US) | 113 (1/2 cup, 8 tbsp) |\n\
  \n\"oz\" in a recipe is weight unless it says \"fl oz\". For water and milk 8 fl\
  \ oz weighs about 8 oz; for flour it is about 4.4 oz.\n\n## Grams per US cup (spoon-and-level,\
  \ used by the script)\n| Ingredient | g/cup | g/tbsp | g/tsp |\n|---|---|---|---|\n\
  | All-purpose (plain) flour | 125 | 7.8 | 2.6 |\n| Bread flour | 127 | 7.9 | |\n\
  | Cake flour | 114 | 7.1 | |\n| Whole wheat flour | 113 | 7.1 | |\n| Almond flour\
  \ | 96 | 6 | |\n| Cornstarch (cornflour) | 112 | 7 | |\n| Granulated or caster sugar\
  \ | 200 | 12.5 | 4.2 |\n| Brown sugar, packed | 213 | 13.3 | |\n| Powdered (icing)\
  \ sugar | 120 | 7.5 | |\n| Butter | 227 | 14.2 | |\n| Water | 237 | 14.8 | 4.9 |\n\
  | Milk, buttermilk, sour cream | 242 | 15.1 | |\n| Heavy cream | 238 | 14.9 | |\n\
  | Yogurt | 245 | 15.3 | |\n| Vegetable or canola oil | 218 | 13.6 | |\n| Olive oil\
  \ | 216 | 13.5 | |\n| Honey, golden syrup | 340 | 21 | 7 |\n| Maple syrup | 322\
  \ | 20 | |\n| Cocoa powder | 85 | 5.3 | |\n| Rolled oats | 90 | | |\n| Chocolate\
  \ chips | 170 | | |\n| Raw white rice | 185 | | |\n| Chopped nuts / walnuts | 120\
  \ | | |\n| Pecans | 110 | | |\n| Raisins | 150 | | |\n| Peanut butter | 270 | 17\
  \ | |\n| Table (fine) salt | 288 | 18 | 6 |\n| Baking soda | 230 | | 4.8 |\n| Baking\
  \ powder | 192 | | 4 |\n| Instant or active dry yeast | 149 | | 3.1 |\n| Vanilla\
  \ extract | 202 | | 4.2 |\n| Ground cinnamon | 125 | | 2.6 |\n\nNotes:\n- Flour\
  \ scooped straight from the bag can weigh 140 to 150 g per cup. If a recipe author\
  \ gives grams, trust the grams.\n- Kosher salt depends on the brand: Diamond Crystal\
  \ about 2.8 g/tsp, Morton about 5 g/tsp, table salt about 6 g/tsp. Swapping brands\
  \ by volume can double the salt. The script leaves \"kosher salt\" in volume and\
  \ says so.\n- The table is a practical average; published tables differ by about\
  \ 5 %. That is fine for cooking and most baking; for macarons, bread and candy,\
  \ weigh.\n\n## Eggs\n| Size (US) | Out of shell |\n|---|---|\n| Large | 50 g (yolk\
  \ 18 g, white 32 g), about 3 tbsp beaten |\n| Medium | 44 g |\n| Extra large | 56\
  \ g |\n| Jumbo | 63 g |\nUK/EU \"large\" (63 to 73 g in shell) is about 58 g out\
  \ of the shell: a UK large is closer to a US extra large.\n\n## Oven temperatures\n\
  | °F | °C | Fan °C | Gas mark |\n|---|---|---|---|\n| 300 | 150 | 130 | 2 |\n| 325\
  \ | 160 | 140 | 3 |\n| 350 | 180 | 160 | 4 |\n| 375 | 190 | 170 | 5 |\n| 400 | 200\
  \ | 180 | 6 |\n| 425 | 220 | 200 | 7 |\n| 450 | 230 | 210 | 8 |\nFan (convection)\
  \ ovens: lower about 20 °C / 25 °F, or keep the temperature and check earlier.\n\
  \n## Pan areas\n| Pan | Area (sq in) | Area (cm²) |\n|---|---|---|\n| 8x8 square\
  \ | 64 | 413 |\n| 9x9 square | 81 | 523 |\n| 9x13 rectangle | 117 | 755 |\n| 10x15\
  \ jelly roll | 150 | 968 |\n| 8 in round | 50 | 324 |\n| 9 in round | 64 | 410 |\n\
  | 10 in round | 79 | 507 |\n| 9x5 loaf | 45 | 290 |\n| 20 cm round | 49 | 314 |\n\
  | 23 cm round | 64 | 415 |\n| 20x20 cm square | 62 | 400 |\nArea of a round pan\
  \ = 3.14 x radius². An 8x8 square and a 9 in round hold almost the same batter.\n\
  \x1FFILE:references/baking-scaling-caveats.md\x1E\n# Scaling caveats\n\n## What\
  \ scales linearly\nFlour, sugar, fat, liquids, chocolate, nuts, fruit and (by weight)\
  \ eggs scale with the factor. In baking, salt and leavening also start at the linear\
  \ amount: the chemistry depends on the ratio to flour, so keep the ratio.\n\n##\
  \ Eggs\n- Fractions of an egg: beat the eggs, weigh, and use the needed grams (large\
  \ egg = 50 g out of the shell). 3.66 eggs = 3 eggs + 33 g beaten egg (about 2 tbsp).\n\
  - If you round instead: more egg makes cakes and brownies firmer, cakier or richer;\
  \ less egg makes them denser and more fragile. Round up for cakes, down for fudgy\
  \ brownies and cookies when in doubt.\n- Recipes written in another country may\
  \ use a different egg size (see conversions).\n\n## Leavening (baking powder, baking\
  \ soda, yeast)\n- Start linear and measure precisely; at small factors 1/8 tsp errors\
  \ are large, so weigh on a 0.1 g scale.\n- For factors above 2, mixing and oven\
  \ heat do not scale: big batters are harder to mix evenly and the centre heats slowly.\
  \ Make separate batches of the original size when you can.\n- If the batter ends\
  \ up deeper than the original (same pan, more batter), it rises more slowly in the\
  \ centre. Do not \"fix\" this with more leavening; use a wider pan or lower the\
  \ oven and bake longer.\n- Bread: yeast scales linearly with flour; rising time\
  \ depends on dough temperature, not quantity.\n\n## Pan size and bake time\n- Scaling\
  \ by pan area keeps the batter depth the same, so the bake time stays about the\
  \ same. Start checking 5 minutes early.\n- Same recipe in a different pan: depth\
  \ ratio = old area / new area. Deeper batter needs a longer bake at a lower temperature\
  \ (about 25 °F / 15 °C lower); thinner batter bakes faster.\n- Fill cake pans at\
  \ most 2/3 full, brownie pans about halfway.\n- Glass and dark metal pans bake faster\
  \ at the edges: lower 25 °F / 15 °C.\n- Cupcakes from a cake recipe: 18 to 22 minutes\
  \ at the same temperature; a 9x13 cake recipe makes about 24 cupcakes.\n- Never\
  \ multiply the bake time by the factor. Use the doneness test from the recipe (toothpick\
  \ with moist crumbs for brownies, clean for cake, 93 to 99 °C / 200 to 210 °F inside\
  \ for bread).\n\n## Cooking (not baking)\n- Seasonings: add about three quarters\
  \ of the scaled salt, chilli and strong spices, then taste. A bigger pot evaporates\
  \ differently.\n- Liquids in braises and soups: evaporation depends on the pot's\
  \ surface, not the volume, so a doubled stew in a wider pot may need less extra\
  \ liquid than 2x.\n- Searing and frying: do it in batches; a crowded pan steams\
  \ instead of browning.\n- Time: a doubled pot takes longer to come to a boil and\
  \ to cool, but simmering time is about the same once it is hot. Roasts depend on\
  \ thickness, not weight: use a thermometer.\n- Food safety: cool large batches quickly\
  \ (split into shallow containers) and reheat to 74 °C / 165 °F.\n\n## Rounding for\
  \ real kitchens\n- US measures: cups in 1/4 and 1/3 steps, then tbsp in halves,\
  \ tsp down to 1/8. Below 1/8 tsp = a pinch.\n- Metric: grams to 0.5 g below 10 g,\
  \ 1 g below 100 g, 5 g below 1 kg.\n- Keep the original unit system unless the cook\
  \ asks; offer grams for baking.\n- Check the result against the original ratios\
  \ (for example flour to butter) after rounding; if rounding moved a key ingredient\
  \ by more than 5 %, give the exact gram amount.\n\x1FFILE:templates/scaled-recipe.md\x1E\
  \n# <Recipe name>, scaled <from 8x8 pan to 9x13 pan / from 4 to 10 servings>\n\n\
  **Factor:** x<1.83>   **Makes:** <24 brownies / 10 servings>   **Units:** <grams\
  \ with US measures in brackets>\n**Pan:** <9x13 in (23x33 cm), lined>   **Oven:**\
  \ <350°F / 180°C (fan 160°C)>   **Bake:** <start checking at 20 min; usually 20-25>\n\
  \n## Ingredients\n| Ingredient | Amount | US measure |\n|---|---|---|\n| <unsalted\
  \ butter, melted> | <205 g> | <3/4 cup + 2 1/2 tbsp> |\n| <large eggs> | <3 + 33\
  \ g beaten (about 2 tbsp)> | |\n\n## Method changes from the original\n- <Beat 4\
  \ eggs, weigh out 183 g, keep the rest for an egg wash>\n- <Mix in a bigger bowl;\
  \ fold flour in two additions>\n- <Same bake time because the batter depth is the\
  \ same; test at 20 min>\n\n## Caveats\n- <EGG_FRACTION: ...>\n- <Kosher salt brand:\
  \ ...>\n\n## Doneness check\n<Toothpick 2 cm from the centre comes out with moist\
  \ crumbs, not wet batter.>\n\x1FFILE:examples/fudgy-brownies-8x8.csv\x1E\nquantity,unit,ingredient,note\n\
  1/2,cup,unsalted butter,melted\n1,cup,granulated sugar,\n2,each,large eggs,room\
  \ temperature\n1,tsp,vanilla extract,\n1/3,cup,cocoa powder,unsweetened\n1/2,cup,all-purpose\
  \ flour,spoon and level\n1/4,tsp,salt,\n1/4,tsp,baking powder,\n3/4,cup,chocolate\
  \ chips,semisweet\n\x1FFILE:scripts/scale_recipe.py\x1E\n#!/usr/bin/env python3\n\
  \"\"\"Recipe scaling and unit converter (Python 3 standard library only).\n\nScales\
  \ a recipe by servings, by a factor, or from one pan size to another, converts\n\
  between US volume, metric volume and weight (grams, using an ingredient density\
  \ table),\nrounds to amounts you can measure, and flags baking caveats: fractional\
  \ eggs, leavening\nat large factors, batter depth changes when the pan does not\
  \ scale with the recipe,\ntiny amounts, seasoning and cooking time.\n\nInput CSV\
  \ columns: quantity,unit,ingredient,note\n  quantity: 2 | 1.5 | 3/4 | 1 1/2 | ½\
  \   unit: tsp tbsp cup fl oz pint quart ml l g kg oz lb stick\n  each (or empty)\
  \ for counted items such as eggs.\nUsage:\n  python3 scale_recipe.py recipe.csv\
  \ --servings 4 10 [--to us|metric|weight|keep]\n  python3 scale_recipe.py recipe.csv\
  \ --from-pan 8x8 --to-pan 9x13 --baking --oven 350F --time 20-25\n  python3 scale_recipe.py\
  \ recipe.csv --factor 0.5 --to weight --json\n  python3 scale_recipe.py --self-test\n\
  Pans: WxL (inches, add cm for centimetres: 20x30cm), round9 / round23cm, loaf9x5.\n\
  Exit codes: 0 = no HIGH findings, 1 = HIGH findings, 2 = bad input.\n\"\"\"\nimport\
  \ argparse, csv, io, json, math, re, sys\n\nML = {\"tsp\": 4.92892, \"tbsp\": 14.7868,\
  \ \"cup\": 236.588, \"fl oz\": 29.5735, \"pint\": 473.176,\n      \"quart\": 946.353,\
  \ \"ml\": 1.0, \"l\": 1000.0}\nG = {\"g\": 1.0, \"kg\": 1000.0, \"oz\": 28.3495,\
  \ \"lb\": 453.592, \"stick\": 113.4}\nUNIT_ALIASES = {\"teaspoon\": \"tsp\", \"\
  teaspoons\": \"tsp\", \"t\": \"tsp\", \"tablespoon\": \"tbsp\", \"tablespoons\"\
  : \"tbsp\",\n                \"tbs\": \"tbsp\", \"tbl\": \"tbsp\", \"T\": \"tbsp\"\
  , \"cups\": \"cup\", \"c\": \"cup\", \"floz\": \"fl oz\",\n                \"fl.\
  \ oz\": \"fl oz\", \"fluid ounce\": \"fl oz\", \"fluid ounces\": \"fl oz\", \"pints\"\
  : \"pint\", \"pt\": \"pint\",\n                \"quarts\": \"quart\", \"qt\": \"\
  quart\", \"milliliter\": \"ml\", \"milliliters\": \"ml\", \"mL\": \"ml\",\n    \
  \            \"liter\": \"l\", \"liters\": \"l\", \"litre\": \"l\", \"litres\":\
  \ \"l\", \"L\": \"l\", \"gram\": \"g\", \"grams\": \"g\",\n                \"kilogram\"\
  : \"kg\", \"kilograms\": \"kg\", \"ounce\": \"oz\", \"ounces\": \"oz\", \"pound\"\
  : \"lb\", \"pounds\": \"lb\",\n                \"lbs\": \"lb\", \"sticks\": \"stick\"\
  , \"\": \"each\", \"x\": \"each\", \"whole\": \"each\", \"pc\": \"each\",\n    \
  \            \"pcs\": \"each\", \"piece\": \"each\", \"pieces\": \"each\", \"clove\"\
  : \"each\", \"cloves\": \"each\",\n                \"large\": \"each\", \"medium\"\
  : \"each\", \"small\": \"each\", \"pinch\": \"pinch\", \"pinches\": \"pinch\",\n\
  \                \"dash\": \"pinch\"}\n# grams per US cup (spoon-and-level). Longest\
  \ matching name wins.\nDENSITY = {\n    \"all-purpose flour\": 125, \"plain flour\"\
  : 125, \"flour\": 125, \"bread flour\": 127, \"cake flour\": 114,\n    \"whole wheat\
  \ flour\": 113, \"almond flour\": 96, \"cornstarch\": 112, \"cornflour\": 112,\n\
  \    \"granulated sugar\": 200, \"caster sugar\": 200, \"sugar\": 200, \"brown sugar\"\
  : 213,\n    \"powdered sugar\": 120, \"icing sugar\": 120, \"confectioners sugar\"\
  : 120,\n    \"butter\": 227, \"water\": 237, \"milk\": 242, \"buttermilk\": 242,\
  \ \"heavy cream\": 238, \"cream\": 238,\n    \"sour cream\": 242, \"yogurt\": 245,\
  \ \"vegetable oil\": 218, \"canola oil\": 218, \"olive oil\": 216, \"oil\": 218,\n\
  \    \"honey\": 340, \"maple syrup\": 322, \"golden syrup\": 340, \"cocoa powder\"\
  : 85, \"cocoa\": 85,\n    \"rolled oats\": 90, \"oats\": 90, \"chocolate chips\"\
  : 170, \"rice\": 185, \"chopped nuts\": 120,\n    \"walnuts\": 120, \"pecans\":\
  \ 110, \"raisins\": 150, \"peanut butter\": 270,\n    \"table salt\": 288, \"fine\
  \ salt\": 288, \"salt\": 288, \"kosher salt\": None,\n    \"baking soda\": 230,\
  \ \"bicarbonate of soda\": 230, \"baking powder\": 192, \"instant yeast\": 149,\n\
  \    \"active dry yeast\": 149, \"yeast\": 149, \"vanilla extract\": 202, \"vanilla\"\
  : 202,\n    \"ground cinnamon\": 125, \"cinnamon\": 125,\n}\nLEAVENERS = (\"baking\
  \ soda\", \"bicarbonate\", \"baking powder\", \"yeast\", \"cream of tartar\")\n\
  SEASONINGS = (\"salt\", \"pepper\", \"chili\", \"chilli\", \"cayenne\", \"pepper\
  \ flakes\", \"garlic powder\", \"curry\", \"cumin\", \"paprika\")\nEGG_G = {\"egg\"\
  : 50.0, \"yolk\": 18.0, \"white\": 32.0}  # US large egg out of shell\nUNICODE_FRAC\
  \ = {\"½\": .5, \"¼\": .25, \"¾\": .75, \"⅓\": 1 / 3, \"⅔\": 2 / 3, \"⅛\": .125,\
  \ \"⅜\": .375, \"⅝\": .625, \"⅞\": .875}\nSEV_ORDER = {\"HIGH\": 0, \"MEDIUM\":\
  \ 1, \"LOW\": 2, \"INFO\": 3}\n\n\ndef parse_qty(s):\n    s = s.strip()\n    for\
  \ ch, v in UNICODE_FRAC.items():\n        if ch in s:\n            rest = s.replace(ch,\
  \ \"\").strip()\n            return (float(rest) if rest else 0.0) + v\n    m =\
  \ re.fullmatch(r\"(\\d+)\\s+(\\d+)/(\\d+)\", s)\n    if m:\n        return int(m[1])\
  \ + int(m[2]) / int(m[3])\n    m = re.fullmatch(r\"(\\d+)/(\\d+)\", s)\n    if m:\n\
  \        return int(m[1]) / int(m[2])\n    m = re.fullmatch(r\"\\d+(?:\\.\\d+)?|\\\
  .\\d+\", s)\n    if m:\n        return float(s)\n    raise ValueError(f\"cannot\
  \ read quantity {s!r}\")\n\n\ndef norm_unit(u):\n    u = u.strip()\n    if u in\
  \ UNIT_ALIASES:\n        return UNIT_ALIASES[u]\n    low = u.lower().rstrip(\".\"\
  )\n    if low in ML or low in G or low in (\"each\", \"pinch\"):\n        return\
  \ low\n    if low in UNIT_ALIASES:\n        return UNIT_ALIASES[low]\n    raise\
  \ ValueError(f\"unknown unit {u!r}\")\n\n\ndef density_for(name):\n    low = name.lower()\n\
  \    best = None\n    for key in DENSITY:\n        if re.search(r\"\\b\" + re.escape(key)\
  \ + r\"\\b\", low) and (best is None or len(key) > len(best)):\n            best\
  \ = key\n    return (best, DENSITY[best]) if best else (None, None)\n\n\ndef egg_kind(name):\n\
  \    low = name.lower()\n    if \"yolk\" in low:\n        return \"yolk\"\n    if\
  \ \"white\" in low and \"egg\" in low:\n        return \"white\"\n    if re.search(r\"\
  \\beggs?\\b\", low):\n        return \"egg\"\n    return None\n\n\ndef parse_pan(spec):\n\
  \    s = spec.strip().lower().replace(\" \", \"\").replace(\"inch\", \"\").replace(\"\
  in\", \"\").replace('\"', \"\")\n    cm = s.endswith(\"cm\")\n    if cm:\n     \
  \   s = s[:-2]\n    k = 1 / 2.54 if cm else 1.0\n    m = re.fullmatch(r\"(?:round)?(\\\
  d+(?:\\.\\d+)?)(?:round)?\", s)\n    if m and \"round\" in s:\n        d = float(m[1])\
  \ * k\n        return math.pi * (d / 2) ** 2, f\"{spec} round ({d:.1f} in)\"\n \
  \   m = re.fullmatch(r\"(?:loaf|square|rect)?(\\d+(?:\\.\\d+)?)x(\\d+(?:\\.\\d+)?)\"\
  , s)\n    if m:\n        a, b = float(m[1]) * k, float(m[2]) * k\n        return\
  \ a * b, f\"{spec} ({a:.1f} x {b:.1f} in)\"\n    raise ValueError(f\"cannot read\
  \ pan size {spec!r} (use 9x13, 20x30cm, round9, round23cm, loaf9x5)\")\n\n\ndef\
  \ frac_str(x, denoms=(2, 3, 4, 8)):\n    whole = int(x)\n    rest = x - whole\n\
  \    best = (abs(rest), 0, 1)\n    for d in denoms:\n        n = round(rest * d)\n\
  \        if 0 < n < d and abs(rest - n / d) < best[0] - 1e-9:\n            best\
  \ = (abs(rest - n / d), n, d)\n    if abs(rest - 1) < best[0]:\n        return str(whole\
  \ + 1)\n    _, n, d = best\n    if n == 0:\n        return str(whole)\n    g = math.gcd(n,\
  \ d)\n    return (f\"{whole} \" if whole else \"\") + f\"{n // g}/{d // g}\"\n\n\
  \ndef frac_val(s):\n    return parse_qty(s)\n\n\ndef cup_word(x):\n    return \"\
  cups\" if x > 1 + 1e-9 else \"cup\"\n\n\ndef fmt_us_volume(ml):\n    cups = ml /\
  \ ML[\"cup\"]\n    if cups >= 0.25 - 1e-9:\n        s = frac_str(cups, (2, 3, 4))\n\
  \        err = abs(frac_val(s) - cups) * ML[\"cup\"]\n        if err >= ML[\"tbsp\"\
  ] * 0.75:\n            base = math.floor(cups * 4) / 4\n            tb = (cups -\
  \ base) * ML[\"cup\"] / ML[\"tbsp\"]\n            bs = frac_str(base, (4,))\n  \
  \          return (f\"{bs} {cup_word(base)} + \" if base else \"\") + f\"{frac_str(tb,\
  \ (2,))} tbsp\"\n        return f\"{s} {cup_word(frac_val(s))}\"\n    tbsp = ml\
  \ / ML[\"tbsp\"]\n    if tbsp >= 1 - 1e-9:\n        return f\"{frac_str(tbsp, (2,))}\
  \ tbsp\"\n    tsp = ml / ML[\"tsp\"]\n    if tsp < 1 / 16:\n        return \"pinch\"\
  \n    return f\"{frac_str(tsp, (2, 4, 8))} tsp\"\n\n\ndef round_metric(x):\n   \
  \ if x < 10:\n        return round(x * 2) / 2\n    if x < 100:\n        return round(x)\n\
  \    if x < 1000:\n        return round(x / 5) * 5\n    return round(x / 10) * 10\n\
  \n\ndef fmt_num(x):\n    return f\"{x:g}\"\n\n\ndef fmt_metric(amount, unit):\n\
  \    v = round_metric(amount)\n    if v >= 2000:\n        return f\"{fmt_num(v /\
  \ 1000)} {'kg' if unit == 'g' else 'l'}\"\n    return f\"{fmt_num(v)} {unit}\"\n\
  \n\ndef fmt_us_weight(g):\n    oz = g / G[\"oz\"]\n    if oz >= 16:\n        lb\
  \ = oz / 16\n        return f\"{frac_str(lb, (4,))} lb\"\n    return f\"{frac_str(oz,\
  \ (2, 4))} oz\" if oz >= 1 else f\"{fmt_num(round(oz, 2))} oz\"\n\n\ndef convert(row,\
  \ factor, target):\n    \"\"\"Return dict with scaled display and notes for one\
  \ ingredient row.\"\"\"\n    qty, unit, name = row[\"qty\"] * factor, row[\"unit\"\
  ], row[\"ingredient\"]\n    key, dens = density_for(name)\n    egg = egg_kind(name)\n\
  \    out = {\"ingredient\": name, \"original\": row[\"original\"], \"scaled_qty\"\
  : qty, \"unit\": unit, \"notes\": []}\n    if unit == \"each\":\n        if egg:\n\
  \            g = qty * EGG_G[egg]\n            out[\"display\"] = f\"{fmt_num(round(qty,\
  \ 2))} ({fmt_metric(g, 'g')} beaten)\"\n        else:\n            out[\"display\"\
  ] = fmt_num(round(qty, 2))\n        return out\n    if unit == \"pinch\":\n    \
  \    out[\"display\"] = f\"{fmt_num(round(qty, 2))} pinch\"\n        return out\n\
  \    if unit in ML:\n        ml = qty * ML[unit]\n        out[\"ml\"] = ml\n   \
  \     if target == \"weight\":\n            if dens:\n                out[\"display\"\
  ] = fmt_metric(ml / ML[\"cup\"] * dens, \"g\")\n                out[\"also\"] =\
  \ fmt_us_volume(ml)\n            else:\n                out[\"display\"] = fmt_metric(ml,\
  \ \"ml\")\n                out[\"also\"] = fmt_us_volume(ml)\n                out[\"\
  notes\"].append(\"NO_DENSITY\")\n        elif target == \"metric\" or (target ==\
  \ \"keep\" and unit in (\"ml\", \"l\")):\n            out[\"display\"] = fmt_metric(ml,\
  \ \"ml\")\n            out[\"also\"] = fmt_us_volume(ml)\n        else:\n      \
  \      out[\"display\"] = fmt_us_volume(ml)\n            out[\"also\"] = fmt_metric(ml,\
  \ \"ml\") if not dens else fmt_metric(ml / ML[\"cup\"] * dens, \"g\")\n        return\
  \ out\n    g = qty * G[unit]\n    out[\"g\"] = g\n    if target == \"us\" or (target\
  \ == \"keep\" and unit in (\"oz\", \"lb\", \"stick\")):\n        if unit == \"stick\"\
  \ and target == \"keep\":\n            out[\"display\"] = f\"{frac_str(qty, (2,\
  \ 4))} stick ({fmt_metric(g, 'g')})\"\n        else:\n            out[\"display\"\
  ] = fmt_us_weight(g)\n        out[\"also\"] = fmt_metric(g, \"g\")\n    else:\n\
  \        out[\"display\"] = fmt_metric(g, \"g\")\n        if dens:\n           \
  \ out[\"also\"] = fmt_us_volume(g / dens * ML[\"cup\"])\n    return out\n\n\ndef\
  \ read_recipe(text):\n    rows = []\n    reader = csv.DictReader(io.StringIO(text.lstrip(\"\
  \\ufeff\")))\n    need = {\"quantity\", \"unit\", \"ingredient\"}\n    if not reader.fieldnames\
  \ or not need <= {f.strip().lower() for f in reader.fieldnames}:\n        raise\
  \ ValueError(\"CSV header must include quantity,unit,ingredient (note optional)\"\
  )\n    for i, r in enumerate(reader, 2):\n        r = {k.strip().lower(): (v or\
  \ \"\").strip() for k, v in r.items() if k}\n        if not r.get(\"ingredient\"\
  ):\n            continue\n        try:\n            qty = parse_qty(r[\"quantity\"\
  ])\n            unit = norm_unit(r.get(\"unit\", \"\"))\n        except ValueError\
  \ as e:\n            raise ValueError(f\"line {i}: {e}\")\n        orig = f\"{r['quantity']}\
  \ {r.get('unit', '')}\".strip()\n        rows.append({\"qty\": qty, \"unit\": unit,\
  \ \"ingredient\": r[\"ingredient\"], \"note\": r.get(\"note\", \"\"), \"original\"\
  : orig})\n    if not rows:\n        raise ValueError(\"no ingredient rows\")\n \
  \   return rows\n\n\ndef oven(temp):\n    m = re.fullmatch(r\"\\s*(\\d+(?:\\.\\\
  d+)?)\\s*°?\\s*([CcFf])\\s*\", temp)\n    if not m:\n        raise ValueError(f\"\
  cannot read oven temperature {temp!r} (use 350F or 180C)\")\n    v, u = float(m[1]),\
  \ m[2].upper()\n    if u == \"F\":\n        c = (v - 32) * 5 / 9\n        return\
  \ f\"{v:g}°F = {round(c / 10) * 10:g}°C (fan oven {round(c / 10) * 10 - 20:g}°C)\"\
  \n    f = v * 9 / 5 + 32\n    return f\"{v:g}°C = {round(f / 25) * 25:g}°F\"\n\n\
  \ndef scale(rows, factor, target=\"keep\", baking=False, depth_ratio=None, pan_change=None,\
  \ bake_time=None):\n    items = [convert(r, factor, target) for r in rows]\n   \
  \ findings = []\n    for it, r in zip(items, rows):\n        name = r[\"ingredient\"\
  ].lower()\n        egg = egg_kind(name)\n        if egg and r[\"unit\"] == \"each\"\
  :\n            q = it[\"scaled_qty\"]\n            whole = math.floor(q + 1e-9)\n\
  \            if abs(q - round(q)) > 0.15:\n                extra = (q - whole) *\
  \ EGG_G[egg]\n                findings.append((\"MEDIUM\", \"EGG_FRACTION\", r[\"\
  ingredient\"],\n                                 f\"scales to {q:.2f} {egg}s\",\n\
  \                                 f\"Use {whole} whole {egg}{'s' if whole != 1 else\
  \ ''} plus {round(extra):g} g beaten {egg} (a large {egg} is about {EGG_G[egg]:g}\
  \ g out of the shell), or round to {round(q)} and expect a {'richer' if round(q)\
  \ > q else 'drier'} result.\"))\n        if \"NO_DENSITY\" in it[\"notes\"]:\n \
  \           findings.append((\"LOW\", \"NO_DENSITY\", r[\"ingredient\"], \"no density\
  \ in the table, so it stays in volume\",\n                             \"Weigh it\
  \ once, or look up grams per cup; for kosher salt the brand matters (Diamond Crystal\
  \ about 136 g/cup, Morton about 240 g/cup).\"))\n        ml = it.get(\"ml\")\n \
  \       if ml is not None and ml / ML[\"tsp\"] < 1 / 8 and r[\"unit\"] in ML:\n\
  \            findings.append((\"LOW\", \"TINY_AMOUNT\", r[\"ingredient\"], f\"scales\
  \ to {ml / ML['tsp']:.2f} tsp\",\n                             \"Use a pinch or\
  \ a 1/8 tsp measure; for leavening weigh on a 0.1 g scale.\"))\n        if baking\
  \ and any(w in name for w in LEAVENERS) and (factor > 2 or factor < 0.5):\n    \
  \        findings.append((\"LOW\", \"LEAVENING\", r[\"ingredient\"], f\"leavening\
  \ scaled x{factor:.2f}\",\n                             \"Linear scaling is the\
  \ starting point; measure exactly (weigh), and for factors above 2 consider separate\
  \ batches because mixing and oven heat do not scale.\"))\n        if not baking\
  \ and factor > 2 and any(w in name for w in SEASONINGS):\n            findings.append((\"\
  INFO\", \"SEASONING\", r[\"ingredient\"], f\"seasoning scaled x{factor:.2f}\",\n\
  \                             \"Add about three quarters, then taste and adjust;\
  \ evaporation and pot size change how salty or hot it ends up.\"))\n    if baking\
  \ and (factor > 3 or factor < 1 / 3):\n        findings.append((\"MEDIUM\", \"BIG_FACTOR\"\
  , \"-\", f\"baking recipe scaled x{factor:.2f}\",\n                         \"Bake\
  \ in several batches of the original size, or check mixer bowl capacity; never multiply\
  \ the bake time.\"))\n    if depth_ratio is not None:\n        sev = \"HIGH\" if\
  \ (depth_ratio > 1.5 or depth_ratio < 0.67) else (\"MEDIUM\" if (depth_ratio > 1.25\
  \ or depth_ratio < 0.8) else None)\n        if sev and baking:\n            if depth_ratio\
  \ > 1:\n                fix = \"Batter will be deeper: lower the oven by 25°F/15°C,\
  \ bake longer and test the centre, keep the pan at most 2/3 full, or use a bigger\
  \ pan.\"\n            else:\n                fix = \"Batter will be thinner: start\
  \ checking 25 to 40 % earlier, or use a smaller pan.\"\n            findings.append((sev,\
  \ \"DEPTH_CHANGE\", \"-\", f\"batter depth changes x{depth_ratio:.2f} versus the\
  \ original pan\", fix))\n    if baking and pan_change:\n        if depth_ratio is\
  \ None or 0.9 <= depth_ratio <= 1.1:\n            tip = \"Batter depth stays about\
  \ the same, so the bake time stays about the same; start checking 5 minutes early.\
  \ Glass or dark pans bake faster: lower 25°F/15°C.\"\n        elif 0.8 <= depth_ratio\
  \ <= 1.25:\n            tip = f\"Batter depth changes slightly (x{depth_ratio:.2f});\
  \ {'bake a few minutes longer' if depth_ratio > 1 else 'start checking a few minutes\
  \ early'} and test the centre.\"\n        else:\n            tip = \"See DEPTH_CHANGE\
  \ for time and temperature.\"\n        if bake_time:\n            tip = f\"Original\
  \ {bake_time} min. \" + tip\n        findings.append((\"INFO\", \"PAN_TIME\", \"\
  -\", pan_change, tip))\n    if not baking and factor > 1.5:\n        findings.append((\"\
  INFO\", \"COOK_TIME\", \"-\", f\"scaled x{factor:.2f}\",\n                     \
  \    \"Cooking time does not scale with quantity: brown meat in batches, allow longer\
  \ to come to a boil, and use a pot that keeps the depth similar.\"))\n    findings.sort(key=lambda\
  \ f: SEV_ORDER[f[0]])\n    return items, [dict(zip((\"severity\", \"code\", \"ingredient\"\
  , \"problem\", \"fix\"), f)) for f in findings]\n\n\ndef render(path, factor, how,\
  \ target, items, findings, oven_line=None):\n    out = [f\"# Scaled recipe: {path}\"\
  , \"\", f\"Scale: {how} -> factor x{factor:.3f}   Units: {target}\", \"\"]\n   \
  \ out += [\"| Ingredient | Original | Scaled | Also |\", \"|---|---|---|---|\"]\n\
  \    for it in items:\n        out.append(f\"| {it['ingredient']} | {it['original']}\
  \ | {it['display']} | {it.get('also', '')} |\")\n    if oven_line:\n        out\
  \ += [\"\", f\"Oven: {oven_line}\"]\n    out += [\"\", \"## Notes\", \"\"]\n   \
  \ if findings:\n        out += [\"| Severity | Code | Ingredient | Problem | Advice\
  \ |\", \"|---|---|---|---|---|\"]\n        for f in findings:\n            out.append(f\"\
  | {f['severity']} | {f['code']} | {f['ingredient']} | {f['problem']} | {f['fix']}\
  \ |\")\n    else:\n        out.append(\"No caveats.\")\n    out += [\"\", \"Weights\
  \ for volume ingredients use spoon-and-level densities; weigh flour if you can.\"\
  ]\n    return \"\\n\".join(out)\n\n\ndef self_test():\n    cases = []\n    def t(name,\
  \ cond):\n        cases.append((name, bool(cond)))\n    close = lambda a, b, tol=1e-6:\
  \ abs(a - b) <= tol\n    t(\"parse 1 1/2\", close(parse_qty(\"1 1/2\"), 1.5))\n\
  \    t(\"parse 3/4 and .5 and ½\", close(parse_qty(\"3/4\"), .75) and close(parse_qty(\"\
  .5\"), .5) and close(parse_qty(\"1½\"), 1.5))\n    t(\"bad quantity rejected\",\
  \ raises(lambda: parse_qty(\"some\")))\n    t(\"unit aliases\", norm_unit(\"Tablespoons\"\
  ) == \"tbsp\" and norm_unit(\"T\") == \"tbsp\" and norm_unit(\"t\") == \"tsp\" and\
  \ norm_unit(\"\") == \"each\")\n    t(\"unknown unit rejected\", raises(lambda:\
  \ norm_unit(\"handful\")))\n    t(\"longest density match\", density_for(\"light\
  \ brown sugar\")[0] == \"brown sugar\" and density_for(\"all-purpose flour\")[1]\
  \ == 125)\n    t(\"salt vs kosher salt\", density_for(\"salt\")[1] == 288 and density_for(\"\
  kosher salt\")[1] is None)\n    t(\"eggs detected\", egg_kind(\"large eggs\") ==\
  \ \"egg\" and egg_kind(\"egg yolks\") == \"yolk\" and egg_kind(\"eggplant\") is\
  \ None)\n    a8 = parse_pan(\"8x8\")[0]; a913 = parse_pan(\"9x13\")[0]\n    t(\"\
  rect pan area\", close(a8, 64) and close(a913, 117))\n    t(\"round pan area\",\
  \ close(parse_pan(\"round9\")[0], math.pi * 20.25))\n    t(\"cm pan\", close(parse_pan(\"\
  20x20cm\")[0], (20 / 2.54) ** 2))\n    t(\"bad pan rejected\", raises(lambda: parse_pan(\"\
  big\")))\n    t(\"us volume 1 cup\", fmt_us_volume(236.588) == \"1 cup\")\n    t(\"\
  us volume 3/4 cup\", fmt_us_volume(ML[\"cup\"] * .75) == \"3/4 cup\")\n    t(\"\
  us volume 2/3 cup\", fmt_us_volume(ML[\"cup\"] * 2 / 3) == \"2/3 cup\")\n    t(\"\
  us volume cup + tbsp\", fmt_us_volume(ML[\"cup\"] * 1.125) == \"1 cup + 2 tbsp\"\
  )\n    t(\"fractions reduced, cups plural\", fmt_us_volume(ML[\"cup\"] * 0.61) ==\
  \ \"1/2 cup + 2 tbsp\" and fmt_us_volume(ML[\"cup\"] * 2) == \"2 cups\")\n    t(\"\
  us volume tbsp\", fmt_us_volume(ML[\"tbsp\"] * 1.5) == \"1 1/2 tbsp\")\n    t(\"\
  us volume tsp\", fmt_us_volume(ML[\"tsp\"] * .5) == \"1/2 tsp\")\n    t(\"us volume\
  \ pinch\", fmt_us_volume(ML[\"tsp\"] * .05) == \"pinch\")\n    t(\"metric rounding\"\
  , round_metric(7.3) == 7.5 and round_metric(57.4) == 57 and round_metric(228) ==\
  \ 230 and round_metric(1234) == 1230)\n    t(\"1 cup flour = 125 g\", convert({\"\
  qty\": 1, \"unit\": \"cup\", \"ingredient\": \"all-purpose flour\", \"original\"\
  : \"\"}, 1, \"weight\")[\"display\"] == \"125 g\")\n    t(\"1 stick butter in us/keep\"\
  , \"1 stick\" in convert({\"qty\": 1, \"unit\": \"stick\", \"ingredient\": \"butter\"\
  , \"original\": \"\"}, 1, \"keep\")[\"display\"])\n    t(\"8 oz to grams\", convert({\"\
  qty\": 8, \"unit\": \"oz\", \"ingredient\": \"cheese\", \"original\": \"\"}, 1,\
  \ \"metric\")[\"display\"] == \"225 g\")\n    t(\"500 g to us lb\", convert({\"\
  qty\": 500, \"unit\": \"g\", \"ingredient\": \"pasta\", \"original\": \"\"}, 1,\
  \ \"us\")[\"display\"] == \"1 lb\")\n    t(\"metric volume\", convert({\"qty\":\
  \ 1, \"unit\": \"cup\", \"ingredient\": \"milk\", \"original\": \"\"}, 2, \"metric\"\
  )[\"display\"] == \"475 ml\")\n    t(\"no density keeps ml\", \"NO_DENSITY\" in\
  \ convert({\"qty\": 1, \"unit\": \"tbsp\", \"ingredient\": \"fish sauce\", \"original\"\
  : \"\"}, 1, \"weight\")[\"notes\"])\n    rows = read_recipe(\"quantity,unit,ingredient,note\\\
  n2,each,large eggs,\\n1/4,tsp,baking soda,\\n1,cup,sugar,\\n\")\n    t(\"csv read\"\
  , len(rows) == 3 and rows[0][\"unit\"] == \"each\")\n    t(\"csv bad header rejected\"\
  , raises(lambda: read_recipe(\"a,b\\n1,2\\n\")))\n    t(\"csv bad unit names line\"\
  , \"line 2\" in err_of(lambda: read_recipe(\"quantity,unit,ingredient\\n1,handful,x\\\
  n\")))\n    _, f = scale(rows, 1.828, baking=True)\n    t(\"EGG_FRACTION at x1.83\"\
  , any(x[\"code\"] == \"EGG_FRACTION\" and \"3 whole eggs plus 33 g\" in x[\"fix\"\
  ] for x in f))\n    _, f = scale(rows, 2.0, baking=True)\n    t(\"no EGG_FRACTION\
  \ when whole\", not any(x[\"code\"] == \"EGG_FRACTION\" for x in f))\n    _, f =\
  \ scale(rows, 0.1, baking=True)\n    t(\"TINY_AMOUNT and BIG_FACTOR\", {\"TINY_AMOUNT\"\
  , \"BIG_FACTOR\", \"LEAVENING\"} <= {x[\"code\"] for x in f})\n    _, f = scale(rows,\
  \ 1.0, baking=True, depth_ratio=1.83)\n    t(\"DEPTH_CHANGE HIGH\", any(x[\"code\"\
  ] == \"DEPTH_CHANGE\" and x[\"severity\"] == \"HIGH\" for x in f))\n    _, f = scale(rows,\
  \ 1.0, baking=True, depth_ratio=1.3)\n    t(\"DEPTH_CHANGE MEDIUM\", any(x[\"code\"\
  ] == \"DEPTH_CHANGE\" and x[\"severity\"] == \"MEDIUM\" for x in f))\n    _, f =\
  \ scale(read_recipe(\"quantity,unit,ingredient\\n1,tsp,salt\\n\"), 3, baking=False)\n\
  \    t(\"SEASONING and COOK_TIME for cooking\", {\"SEASONING\", \"COOK_TIME\"} <=\
  \ {x[\"code\"] for x in f})\n    t(\"oven F to C\", oven(\"350F\") == \"350°F =\
  \ 180°C (fan oven 160°C)\" and oven(\"200C\") == \"200°C = 400°F\")\n    t(\"findings\
  \ sorted HIGH first\", scale(rows, 1.83, baking=True, depth_ratio=2)[1][0][\"severity\"\
  ] == \"HIGH\")\n    passed = sum(ok for _, ok in cases)\n    for name, ok in cases:\n\
  \        print((\"PASS \" if ok else \"FAIL \") + name)\n    print(f\"{passed}/{len(cases)}\
  \ passed\")\n    return 0 if passed == len(cases) else 1\n\n\ndef raises(fn):\n\
  \    try:\n        fn()\n    except ValueError:\n        return True\n    return\
  \ False\n\n\ndef err_of(fn):\n    try:\n        fn()\n    except ValueError as e:\n\
  \        return str(e)\n    return \"\"\n\n\ndef main():\n    ap = argparse.ArgumentParser(description=__doc__,\
  \ formatter_class=argparse.RawDescriptionHelpFormatter)\n    ap.add_argument(\"\
  recipe\", nargs=\"?\")\n    g = ap.add_mutually_exclusive_group()\n    g.add_argument(\"\
  --servings\", nargs=2, type=float, metavar=(\"FROM\", \"TO\"))\n    g.add_argument(\"\
  --factor\", type=float)\n    ap.add_argument(\"--from-pan\")\n    ap.add_argument(\"\
  --to-pan\")\n    ap.add_argument(\"--to\", default=\"keep\", choices=[\"keep\",\
  \ \"us\", \"metric\", \"weight\"])\n    ap.add_argument(\"--baking\", action=\"\
  store_true\", help=\"apply baking caveats (eggs, leavening, pan depth)\")\n    ap.add_argument(\"\
  --oven\", help=\"original oven temperature, e.g. 350F or 180C\")\n    ap.add_argument(\"\
  --time\", help=\"original bake time in minutes, e.g. 20-25\")\n    ap.add_argument(\"\
  --json\", action=\"store_true\")\n    ap.add_argument(\"--self-test\", action=\"\
  store_true\")\n    a = ap.parse_args()\n    if a.self_test:\n        return self_test()\n\
  \    if not a.recipe:\n        ap.print_usage(sys.stderr); return 2\n    try:\n\
  \        rows = read_recipe(open(a.recipe, encoding=\"utf-8\").read())\n       \
  \ depth_ratio = pan_change = None\n        if bool(a.from_pan) != bool(a.to_pan):\n\
  \            raise ValueError(\"give both --from-pan and --to-pan\")\n        if\
  \ a.from_pan:\n            fa, fd = parse_pan(a.from_pan)\n            ta, td =\
  \ parse_pan(a.to_pan)\n            pan_change = f\"{fd} -> {td}, area x{ta / fa:.2f}\"\
  \n        if a.servings:\n            if a.servings[0] <= 0 or a.servings[1] <=\
  \ 0:\n                raise ValueError(\"servings must be positive\")\n        \
  \    factor, how = a.servings[1] / a.servings[0], f\"{a.servings[0]:g} -> {a.servings[1]:g}\
  \ servings\"\n        elif a.factor is not None:\n            if a.factor <= 0:\n\
  \                raise ValueError(\"factor must be positive\")\n            factor,\
  \ how = a.factor, f\"factor {a.factor:g}\"\n        elif a.from_pan:\n         \
  \   factor, how = ta / fa, f\"pan {a.from_pan} -> {a.to_pan}\"\n        else:\n\
  \            raise ValueError(\"give --servings FROM TO, --factor F or --from-pan/--to-pan\"\
  )\n        if a.from_pan:\n            depth_ratio = factor * fa / ta\n        \
  \    if abs(depth_ratio - 1) < 0.01:\n                depth_ratio = None\n     \
  \   items, findings = scale(rows, factor, a.to, a.baking, depth_ratio, pan_change,\
  \ a.time)\n        oven_line = oven(a.oven) if a.oven else None\n    except (OSError,\
  \ UnicodeDecodeError, ValueError) as e:\n        print(f\"error: {e}\", file=sys.stderr);\
  \ return 2\n    if a.json:\n        print(json.dumps({\"factor\": factor, \"how\"\
  : how, \"units\": a.to, \"oven\": oven_line,\n                          \"items\"\
  : [{k: v for k, v in it.items() if k != \"notes\"} for it in items],\n         \
  \                 \"findings\": findings}, indent=2, ensure_ascii=False))\n    else:\n\
  \        print(render(a.recipe, factor, how, a.to, items, findings, oven_line))\n\
  \    return 1 if any(f[\"severity\"] == \"HIGH\" for f in findings) else 0\n\n\n\
  if __name__ == \"__main__\":\n    sys.exit(main())"
