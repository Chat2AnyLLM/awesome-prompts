  both banks sway gently, and the rowboat stays still at its mooring. The light stays
  a soft pink and gold sunrise glow. Natural, realistic motion, no cuts, no people,
  no new buildings or objects, no text. Soft sound of a light breeze, creaking sails,
  and distant birdsong.
