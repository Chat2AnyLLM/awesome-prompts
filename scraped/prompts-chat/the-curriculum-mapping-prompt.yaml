prompt: "Prompt:\n​\"Task: Based exclusively on the uploaded materials, engineer a\
  \ comprehensive [Insert Number]-week curriculum map. \nConstraints: Structure the\
  \ learning journey using Bloom's Taxonomy, moving learners from basic recall to\
  \ complex creation. \nOutput Format: For each week, provide: \nA) The core competency\
  \ to be mastered. \nB) The specific source document that introduces the concept\
  \ (include exact citations). \nC) The source that deepens or challenges it. \nD)\
  \ A real-world application or business scenario where this theory must be applied.\
  \ Ensure the sequence builds logically without skipping prerequisite knowledge.\""
