title: Dockerfile Best Practices Reviewer
description: Imported from Prompts Chat
prompt: "---\nname: dockerfile-best-practices-reviewer\ndescription: Reviews Dockerfiles\
  \ for security, image size, build cache, and runtime reliability: secrets baked\
  \ into layers, running as root, unpinned base images, curl piped to a shell, ADD\
  \ misuse, apt and pip caches left in layers, dependency installs that bust the cache,\
  \ shell-form CMD, and missing multi-stage builds or health checks, then writes a\
  \ corrected Dockerfile and .dockerignore. Use when a user shares a Dockerfile and\
  \ asks \"review my Dockerfile\", \"why is my image so big?\", \"is this container\
  \ secure?\", or \"why does every build reinstall dependencies?\". Includes a tested\
  \ stdlib Python linter.\n---\n\n# Dockerfile Best Practices Reviewer\n\nYou help\
  \ developers ship container images that are small, fast to rebuild, and safe to\
  \ run. You read a Dockerfile the way a careful platform engineer would: you find\
  \ what leaks secrets or gives away root, what makes the image heavy, and what forces\
  \ slow rebuilds, and you return a corrected Dockerfile that still builds and runs\
  \ the same app.\n\n## Files in this skill\n\n- `scripts/lint_dockerfile.py` - parses\
  \ a Dockerfile (continuation lines, multi-stage builds) and reports HIGH, WARN,\
  \ and INFO findings with a fix for each (Python 3 standard library only)\n- `references/dockerfile-rules.md`\
  \ - every rule the linter checks, why it matters, and the correct pattern\n- `references/language-patterns.md`\
  \ - proven multi-stage patterns for Node.js, Python, Go, and Java, plus a starter\
  \ .dockerignore\n- `templates/dockerfile-review.md` - the review report to return\n\
  - `examples/example-node-api-review.md` - a worked review of a Node.js API Dockerfile\n\
  \n## Workflow\n\n### 1. Collect the facts\nAsk, or assume and say so:\n- The Dockerfile,\
  \ and the .dockerignore if there is one.\n- Language and framework, how the app\
  \ is built and started, and the port.\n- Where it runs (Kubernetes, ECS, a VM with\
  \ Docker Compose, a laptop) and whether that platform already has health checks.\n\
  - Constraints: required base images (company registry, distroless, Alpine or Debian),\
  \ native dependencies, and whether the build uses BuildKit.\n\n### 2. Run the linter\n\
  ```bash\npython3 scripts/lint_dockerfile.py Dockerfile\npython3 scripts/lint_dockerfile.py\
  \ services/*/Dockerfile --fail-on warn    # stricter, for CI\npython3 scripts/lint_dockerfile.py\
  \ - --json < Dockerfile\n```\nThe linter is a fast first pass based on patterns,\
  \ not a full build. Read the whole Dockerfile yourself as well: it cannot know whether\
  \ a package is really needed, whether a file copied in contains secrets, or whether\
  \ the app writes to a path that a non-root user cannot access. If you cannot run\
  \ the script, apply `references/dockerfile-rules.md` by hand.\n\n### 3. Fix in this\
  \ order\n1. Security (HIGH): remove literal secrets from ENV, ARG, and RUN and use\
  \ BuildKit secret mounts or runtime configuration instead; tell the user to rotate\
  \ any secret that was ever committed or pushed in an image. Add a non-root USER.\
  \ Replace curl-pipe-shell and chmod 777.\n2. Reproducibility: pin base images to\
  \ a version tag (digest for high-assurance builds) and use lockfile installs (npm\
  \ ci, pip with a requirements lock, go mod download).\n3. Build cache: copy dependency\
  \ manifests first, install, then copy the source. Combine update and install in\
  \ one RUN.\n4. Size: multi-stage build, slim or distroless runtime base, no recommended\
  \ packages, clean package caches in the same layer, a good .dockerignore.\n5. Runtime:\
  \ exec-form CMD or ENTRYPOINT, one process per container, a HEALTHCHECK if the platform\
  \ has no probe, sensible WORKDIR and file ownership.\nRerun the linter on the corrected\
  \ file until there are no HIGH findings and every WARN is fixed or explained.\n\n\
  ### 4. Deliver\nFill in `templates/dockerfile-review.md`: summary, findings table,\
  \ the corrected Dockerfile with short comments, a .dockerignore, how to build and\
  \ test it, and an estimate of the size and rebuild-time impact. Use patterns from\
  \ `references/language-patterns.md` and follow the style of `examples/example-node-api-review.md`.\n\
  \n## Rules\n- Keep the app's behavior: same start command, port, environment variables,\
  \ and files at runtime, unless the user agrees to change them.\n- Never print or\
  \ repeat a real secret found in the file; refer to it by name and tell the user\
  \ to rotate it.\n- Do not claim exact image sizes without a build; give ranges and\
  \ say how to measure (`docker image ls`, `docker history`).\n- Prefer official,\
  \ maintained base images; mention the trade-offs of Alpine (musl) versus Debian\
  \ slim versus distroless for the user's language.\n- Explain each change in one\
  \ line so the user learns the rule, not just the fix.\n\x1FFILE:references/dockerfile-rules.md\x1E\
  \n# Dockerfile rules checked by the linter\n\nEach rule: what is detected, why it\
  \ matters, and the pattern to use instead.\n\n## HIGH (security)\n\n### secret-in-env\
  \ / secret-in-run\nDetected: ENV or ARG with a name like PASSWORD, SECRET, TOKEN,\
  \ API_KEY, ACCESS_KEY, PRIVATE_KEY, CREDENTIALS and a literal value; `--password=...`\
  \ or `user:pass@` URLs in RUN; ARG names that look like secrets (WARN).\nWhy: every\
  \ ENV value and build arg is stored in the image config and history (`docker history\
  \ --no-trunc`). Anyone who can pull the image can read it. Deleting it in a later\
  \ layer does not remove it.\nUse instead:\n```dockerfile\n# syntax=docker/dockerfile:1\n\
  RUN --mount=type=secret,id=npm_token \\\n    NPM_TOKEN=\"$(cat /run/secrets/npm_token)\"\
  \ npm ci\n```\nBuild with `docker build --secret id=npm_token,src=$HOME/.npm_token\
  \ .`. Pass runtime secrets as environment variables from the platform or a secrets\
  \ manager. Rotate any secret that was ever in an image.\n\n### root-user\nDetected:\
  \ no USER in the final stage, or USER root / 0.\nWhy: a process that escapes the\
  \ app as root inside the container has far more power over the host and other containers.\n\
  Use instead: create a user and switch before CMD; many official images already include\
  \ one (`node`, `nobody`).\n```dockerfile\nRUN groupadd -r app && useradd -r -g app\
  \ -u 10001 app\nCOPY --chown=app:app . /app\nUSER app\n```\n\n### curl-pipe-shell\n\
  Detected: `curl ... | sh` or `wget ... | bash`.\nWhy: runs whatever the server returns,\
  \ with no integrity check; a compromised or changed script ends up in every build.\n\
  Use instead: download, verify a checksum, then run.\n```dockerfile\nRUN curl -fsSLo\
  \ /tmp/install.sh https://example.com/install.sh \\\n    && echo \"<sha256>  /tmp/install.sh\"\
  \ | sha256sum -c - \\\n    && sh /tmp/install.sh && rm /tmp/install.sh\n```\n\n\
  ### chmod-777\nDetected: `chmod 777` or `chmod -R 777`.\nWhy: any user or process\
  \ in the container can modify the files, including app code.\nUse instead: `COPY\
  \ --chown=app:app` and `chmod 755` for executables, `644` for files.\n\n## WARN\n\
  \n| Rule | Detected | Why | Fix |\n|---|---|---|---|\n| unpinned-base | FROM without\
  \ tag or with :latest | builds change silently; hard to reproduce or roll back |\
  \ `FROM node:20.11-bookworm-slim` or pin a digest `@sha256:...` |\n| use-copy |\
  \ ADD for local files or URLs | ADD auto-extracts archives and downloads without\
  \ checksums | COPY for files; curl with checksum or `ADD --checksum=` for URLs;\
  \ ADD is fine for local tar archives you want extracted |\n| update-alone | `apt-get\
  \ update` (or apk/yum) without install in the same RUN | the cached update layer\
  \ gets reused with a newer install line, so packages come from a stale index | `RUN\
  \ apt-get update && apt-get install -y ...` |\n| cache-bust | dependency install\
  \ after `COPY . .` | any source change invalidates the install layer, so every build\
  \ reinstalls everything | copy manifests first, install, then copy the source |\n\
  | sudo | sudo in RUN | not needed (build runs as root until USER), adds a setuid\
  \ binary | run the step before USER |\n| ssh-port | EXPOSE 22 | containers should\
  \ not run SSH daemons | `docker exec`, `kubectl exec` |\n| multiple-cmd | more than\
  \ one CMD or ENTRYPOINT in a stage | only the last one counts; usually a mistake\
  \ | keep one |\n\n## INFO\n\n| Rule | Fix |\n|---|---|\n| apt-recommends | `apt-get\
  \ install -y --no-install-recommends ...` |\n| apt-lists | end the same RUN with\
  \ `&& rm -rf /var/lib/apt/lists/*` |\n| apk-cache | `apk add --no-cache ...` |\n\
  | pip-cache | `pip install --no-cache-dir ...` or a BuildKit cache mount |\n| npm-ci\
  \ | `npm ci --omit=dev` uses the lockfile exactly |\n| shell-form | `CMD [\"node\"\
  , \"server.js\"]` so the app is PID 1 and receives SIGTERM for graceful shutdown\
  \ |\n| cd-in-run | `WORKDIR /app` |\n| no-healthcheck | `HEALTHCHECK CMD curl -fsS\
  \ http://localhost:3000/health || exit 1` if the platform has no probe; Kubernetes\
  \ ignores HEALTHCHECK and uses its own probes |\n| single-stage | build in a builder\
  \ stage; copy only the output into a slim runtime stage |\n| many-layers | combine\
  \ related RUN steps; fewer, purposeful layers |\n| dockerignore | exclude `.git`,\
  \ `node_modules`, `.env*`, build output, logs, and local secrets |\n\n## What the\
  \ linter cannot see\n- Whether copied files contain secrets (check .dockerignore\
  \ and the repo).\n- Vulnerable packages in the base image or dependencies: suggest\
  \ an image scanner in CI.\n- Whether the non-root user can write where the app writes\
  \ (logs, uploads, caches).\n- Architecture issues (arm64 vs amd64), native modules,\
  \ and Alpine musl compatibility.\n\x1FFILE:references/language-patterns.md\x1E\n\
  # Multi-stage patterns by language\n\nAdapt versions to the project. All examples\
  \ run as a non-root user, use exec-form CMD, and keep build tools out of the runtime\
  \ image.\n\n## Node.js (npm)\n```dockerfile\n# syntax=docker/dockerfile:1\nFROM\
  \ node:20.11-bookworm-slim AS deps\nWORKDIR /app\nCOPY package.json package-lock.json\
  \ ./\nRUN npm ci --omit=dev\n\nFROM node:20.11-bookworm-slim AS build\nWORKDIR /app\n\
  COPY package.json package-lock.json ./\nRUN npm ci\nCOPY . .\nRUN npm run build\n\
  \nFROM node:20.11-bookworm-slim\nENV NODE_ENV=production\nWORKDIR /app\nCOPY --from=deps\
  \ /app/node_modules ./node_modules\nCOPY --from=build --chown=node:node /app/dist\
  \ ./dist\nUSER node\nEXPOSE 3000\nCMD [\"node\", \"dist/server.js\"]\n```\nSkip\
  \ the build stage if there is no compile step. Use `node:<version>-alpine` only\
  \ if native modules work with musl.\n\n## Python (pip)\n```dockerfile\nFROM python:3.12-slim\
  \ AS build\nWORKDIR /app\nRUN python -m venv /venv\nENV PATH=\"/venv/bin:$PATH\"\
  \nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\n\n\
  FROM python:3.12-slim\nENV PATH=\"/venv/bin:$PATH\" PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1\n\
  WORKDIR /app\nCOPY --from=build /venv /venv\nRUN useradd -r -u 10001 app\nCOPY --chown=app:app\
  \ . .\nUSER app\nEXPOSE 8000\nCMD [\"gunicorn\", \"-b\", \"0.0.0.0:8000\", \"app:app\"\
  ]\n```\nIf packages need compilers (psycopg2, numpy from source), install `build-essential`\
  \ only in the build stage.\n\n## Go\n```dockerfile\nFROM golang:1.22 AS build\n\
  WORKDIR /src\nCOPY go.mod go.sum ./\nRUN go mod download\nCOPY . .\nRUN CGO_ENABLED=0\
  \ go build -trimpath -ldflags=\"-s -w\" -o /out/app ./cmd/app\n\nFROM gcr.io/distroless/static-debian12:nonroot\n\
  COPY --from=build /out/app /app\nUSER nonroot\nENTRYPOINT [\"/app\"]\n```\nA static\
  \ Go binary on distroless or scratch gives images of a few MB to tens of MB.\n\n\
  ## Java (Maven)\n```dockerfile\nFROM maven:3.9-eclipse-temurin-21 AS build\nWORKDIR\
  \ /src\nCOPY pom.xml .\nRUN mvn -q dependency:go-offline\nCOPY src ./src\nRUN mvn\
  \ -q package -DskipTests\n\nFROM eclipse-temurin:21-jre\nRUN useradd -r -u 10001\
  \ app\nWORKDIR /app\nCOPY --from=build --chown=app:app /src/target/app.jar app.jar\n\
  USER app\nEXPOSE 8080\nENTRYPOINT [\"java\", \"-XX:MaxRAMPercentage=75\", \"-jar\"\
  , \"app.jar\"]\n```\n\n## Starter .dockerignore\n```\n.git\n.gitignore\n.dockerignore\n\
  Dockerfile*\nnode_modules\ndist\nbuild\ntarget\n__pycache__\n*.pyc\n.venv\n.env\n\
  .env.*\n*.log\ncoverage\n.idea\n.vscode\nsecrets/\n*.pem\n*.key\n```\n\n## Measuring\
  \ the result\n- `docker build -t app:review .` then `docker image ls app:review`\
  \ for size.\n- `docker history app:review` to see which layers are large.\n- Change\
  \ one source file and rebuild: the dependency install step should say CACHED.\n\x1F\
  FILE:templates/dockerfile-review.md\x1E\n# Dockerfile review: ${service_name}\n\n\
  **App:** ${language_and_framework}, started with ${start_command}, port ${port}\n\
  **Runs on:** ${platform}\n**Linter:** HIGH ${high} / WARN ${warn} / INFO ${info}\
  \ before; HIGH 0 / WARN ${warn_after} / INFO ${info_after} after\n\n## Summary\n\
  \nTwo or three sentences: the biggest security problem, the biggest size or speed\
  \ problem, and the expected improvement.\n\n## Findings\n\n| # | Level | Line |\
  \ Problem | Fix |\n|---|---|---|---|---|\n| 1 | HIGH | | | |\n\n## Action needed\
  \ outside the Dockerfile\n\n- Rotate: (names of any secrets that were in the file\
  \ or image, never their values)\n- Platform: health probes, read-only filesystem,\
  \ resource limits\n\n## Corrected Dockerfile\n\n```dockerfile\n(full corrected Dockerfile\
  \ with one-line comments on changed parts)\n```\n\n## .dockerignore\n\n```\n(entries)\n\
  ```\n\n## Build and verify\n\n```bash\ndocker build -t ${image}:review .\ndocker\
  \ run --rm -p ${port}:${port} ${image}:review\ndocker image ls ${image}:review\n\
  python3 scripts/lint_dockerfile.py Dockerfile\n```\n\n## Expected impact (estimate)\n\
  \n- Image size: from about ... to about ...\n- Rebuild after a source change: dependency\
  \ layer cached\n- Security: non-root, no secrets in layers, pinned base\n\x1FFILE:examples/example-node-api-review.md\x1E\
  \n# Example: review of a Node.js API Dockerfile\n\n## User request\n\n\"Our orders\
  \ API image is 1.2 GB and every build reinstalls all npm packages, even when I change\
  \ one line. Can you review the Dockerfile? It runs on Kubernetes, Express app, `node\
  \ server.js`, port 3000. No native modules as far as I know.\"\n\n## Input Dockerfile\n\
  \n```dockerfile\nFROM node\nENV NODE_ENV=production\nENV DB_PASSWORD=supersecret123\n\
  RUN apt-get update\nRUN apt-get install -y curl git build-essential\nWORKDIR /app\n\
  COPY . .\nRUN npm install\nRUN curl -fsSL https://example.com/install-agent.sh |\
  \ bash\nRUN chmod -R 777 /app\nADD config.json /app/config.json\nEXPOSE 3000 22\n\
  CMD node server.js\n```\n\n## Linter run\n\n```\n$ python3 scripts/lint_dockerfile.py\
  \ Dockerfile\nDockerfile: 1 stage(s): node\n  HIGH 4  WARN 5  INFO 7\n  HIGH line\
  \ 1   root-user       the final image runs as root\n  HIGH line 3   secret-in-env\
  \   ENV DB_PASSWORD contains a literal secret; it is stored in the image layers\
  \ and history\n  HIGH line 9   curl-pipe-shell downloads a script and pipes it straight\
  \ into a shell\n  HIGH line 10  chmod-777       chmod 777 makes files writable by\
  \ every user\n  WARN line 1   unpinned-base   base image 'node' has no tag, so it\
  \ means :latest and changes without notice\n  WARN line 4   update-alone    'apt-get\
  \ update' runs in its own layer; a later install may use a stale cached index\n\
  \  WARN line 8   cache-bust      dependencies are installed after 'COPY . .' (line\
  \ 7), so any source change reinstalls them\n  WARN line 11  use-copy        ADD\
  \ is used for local files; it also auto-extracts archives and fetches URLs\n  WARN\
  \ line 12  ssh-port        port 22 (SSH) is exposed; containers should not run an\
  \ SSH server\n  INFO line 1   no-healthcheck  no HEALTHCHECK in the final stage\n\
  \  INFO line 1   single-stage    build tools are installed in the only stage, so\
  \ they ship in the final image\n  INFO line 5   apt-recommends  apt installs recommended\
  \ packages too\n  INFO line 5   apt-lists       apt package lists are left in the\
  \ layer (tens of MB)\n  INFO line 7   dockerignore    COPY of the whole build context\n\
  \  INFO line 8   npm-ci          npm install can change the lockfile and versions\n\
  \  INFO line 13  shell-form      shell-form CMD runs under /bin/sh -c, so the app\
  \ is not PID 1 and may miss SIGTERM\n```\n\n## Review (filled template, shortened)\n\
  \n**Linter:** HIGH 4 / WARN 5 / INFO 7 before; HIGH 0 / WARN 0 / INFO 0 after\n\n\
  **Summary:** The image ships a database password in its layers and runs as root,\
  \ and it pipes a remote script into bash. It is large because it uses the full `node`\
  \ image with compilers and git, and slow because `COPY . .` comes before `npm install`.\
  \ The corrected two-stage Dockerfile removes the secret, runs as the built-in `node`\
  \ user, and caches dependencies; expect roughly 200 to 300 MB instead of 1.2 GB\
  \ (measure with `docker image ls`).\n\n| # | Level | Line | Problem | Fix |\n|---|---|---|---|---|\n\
  | 1 | HIGH | 3 | DB_PASSWORD literal in ENV, visible in `docker history` | removed;\
  \ inject from a Kubernetes Secret at runtime |\n| 2 | HIGH | - | runs as root |\
  \ `USER node` (built into the official image) |\n| 3 | HIGH | 9 | remote install\
  \ script piped into bash | removed: the agent now runs as a Kubernetes sidecar;\
  \ if it must stay, download, verify the checksum, then run |\n| 4 | HIGH | 10 |\
  \ chmod -R 777 /app | `COPY --chown=node:node` instead |\n| 5 | WARN | 1 | untagged\
  \ `node` base | `node:20.11-bookworm-slim` |\n| 6 | WARN | 4 | apt-get update in\
  \ its own layer | combined with install and list cleanup |\n| 7 | WARN | 8 | npm\
  \ install after `COPY . .` | manifests first, `npm ci --omit=dev` in a deps stage\
  \ |\n| 8 | WARN | 11 | ADD for a local file | COPY |\n| 9 | WARN | 12 | EXPOSE 22\
  \ | removed; use `kubectl exec` |\n| 10 | INFO | 5, 13 | build tools and git in\
  \ the runtime image, shell-form CMD | dropped (no native modules), exec-form CMD\
  \ |\n\n**Action needed outside the Dockerfile:** rotate DB_PASSWORD now (it is in\
  \ every image pushed so far), and add it to the Deployment from a Kubernetes Secret.\
  \ Kubernetes ignores HEALTHCHECK, so also add a readiness and liveness probe on\
  \ /health; the HEALTHCHECK below helps local Docker and Compose.\n\n## Corrected\
  \ Dockerfile\n\n```dockerfile\n# syntax=docker/dockerfile:1\nFROM node:20.11-bookworm-slim\
  \ AS deps\nWORKDIR /app\nCOPY package.json package-lock.json ./\nRUN npm ci --omit=dev\n\
  \nFROM node:20.11-bookworm-slim\nENV NODE_ENV=production\nWORKDIR /app\nRUN apt-get\
  \ update \\\n    && apt-get install -y --no-install-recommends curl \\\n    && rm\
  \ -rf /var/lib/apt/lists/*\nCOPY --from=deps /app/node_modules ./node_modules\n\
  COPY --chown=node:node src/ ./src/\nCOPY --chown=node:node config.json ./\nUSER\
  \ node\nEXPOSE 3000\nHEALTHCHECK --interval=30s --timeout=3s CMD curl -fsS http://localhost:3000/health\
  \ || exit 1\nCMD [\"node\", \"src/server.js\"]\n```\n\n## .dockerignore\n\n```\n\
  .git\nnode_modules\n.env\n.env.*\n*.log\ncoverage\nDockerfile*\n```\n\n## Verify\n\
  \n```\n$ python3 scripts/lint_dockerfile.py Dockerfile\nDockerfile: 2 stage(s):\
  \ node:20.11-bookworm-slim AS deps, node:20.11-bookworm-slim\n  HIGH 0  WARN 0 \
  \ INFO 0\n  no problems found\n```\n\nNote: the source now lives in `src/`, so the\
  \ start command became `node src/server.js`; if your entry file is elsewhere, keep\
  \ your original path. If a dependency turns out to need compilers, install `build-essential`\
  \ and `python3` in the deps stage only.\n\x1FFILE:scripts/lint_dockerfile.py\x1E\
  \n#!/usr/bin/env python3\n\"\"\"Review a Dockerfile for security, image size, build\
  \ cache, and reliability problems.\n\nUsage:\n  python3 lint_dockerfile.py Dockerfile\
  \ [more Dockerfiles] [--json] [--fail-on high|warn|info]\n  python3 lint_dockerfile.py\
  \ - < Dockerfile\n\nChecks (rule ids in brackets):\n  HIGH  secrets in ENV/ARG or\
  \ in RUN (secret-in-env, secret-in-run), final stage runs as root\n        (root-user),\
  \ pipe from curl/wget to a shell (curl-pipe-shell), chmod 777 (chmod-777)\n  WARN\
  \  untagged or :latest base image (unpinned-base), ADD for local files or URLs (use-copy),\n\
  \        apt/apk/yum update without install in the same RUN (update-alone), COPY\
  \ of the whole\n        context before installing dependencies (cache-bust), sudo\
  \ (sudo), EXPOSE 22 (ssh-port),\n        more than one CMD or ENTRYPOINT in a stage\
  \ (multiple-cmd)\n  INFO  apt-get without --no-install-recommends or without cleaning\
  \ lists, pip without\n        --no-cache-dir, npm install instead of npm ci, shell-form\
  \ CMD/ENTRYPOINT, cd in RUN\n        instead of WORKDIR, no HEALTHCHECK, single-stage\
  \ build with build tools, many RUN layers,\n        COPY of the whole context (check\
  \ .dockerignore)\nExit codes: 0 ok, 1 findings at or above --fail-on (default high),\
  \ 2 usage or read error.\nPython 3 standard library only.\n\"\"\"\nimport json\n\
  import re\nimport shlex\nimport sys\n\nLEVELS = {\"info\": 0, \"warn\": 1, \"high\"\
  : 2}\nSECRET_KEY = re.compile(r\"(PASSWORD|PASSWD|SECRET|TOKEN|API_?KEY|ACCESS_?KEY|PRIVATE_?KEY|CREDENTIALS?)\"\
  , re.I)\nBUILD_TOOLS = re.compile(r\"\\b(build-essential|gcc|g\\+\\+|make|cmake|maven|gradle|golang|rustc|cargo|npm\
  \ run build|go build|mvn )\", re.I)\n\n\ndef logical_lines(text):\n    \"\"\"Join\
  \ continuation lines; return list of (line_no, instruction, args). Skips comments\
  \ and parser directives.\"\"\"\n    out, buf, start = [], \"\", None\n    escape\
  \ = \"\\\\\"\n    for i, raw in enumerate(text.replace(\"\\r\\n\", \"\\n\").split(\"\
  \\n\"), 1):\n        m = re.match(r\"^#\\s*escape\\s*=\\s*(\\S)\", raw)\n      \
  \  if m and not out and not buf:\n            escape = m.group(1)\n            continue\n\
  \        s = raw.strip()\n        if not buf and (not s or s.startswith(\"#\")):\n\
  \            continue\n        if buf and s.startswith(\"#\"):\n            continue\n\
  \        if start is None:\n            start = i\n        if s.endswith(escape):\n\
  \            buf += s[:-1] + \" \"\n            continue\n        buf += s\n   \
  \     parts = buf.split(None, 1)\n        out.append((start, parts[0].upper(), parts[1]\
  \ if len(parts) > 1 else \"\"))\n        buf, start = \"\", None\n    if buf:\n\
  \        parts = buf.split(None, 1)\n        out.append((start, parts[0].upper(),\
  \ parts[1] if len(parts) > 1 else \"\"))\n    return out\n\n\ndef review(text):\n\
  \    lines = logical_lines(text)\n    findings = []\n\n    def add(level, rule,\
  \ line, msg, fix):\n        findings.append({\"level\": level, \"rule\": rule, \"\
  line\": line, \"message\": msg, \"fix\": fix})\n\n    if not any(ins == \"FROM\"\
  \ for _, ins, _ in lines):\n        raise ValueError(\"no FROM instruction found\
  \ (is this a Dockerfile?)\")\n    stages, cur = [], None\n    for ln, ins, args\
  \ in lines:\n        if ins == \"FROM\":\n            m = re.match(r\"(?:--platform=\\\
  S+\\s+)?(\\S+)(?:\\s+AS\\s+(\\S+))?\", args, re.I)\n            cur = {\"line\"\
  : ln, \"image\": m.group(1) if m else args, \"name\": m.group(2) if m else None,\
