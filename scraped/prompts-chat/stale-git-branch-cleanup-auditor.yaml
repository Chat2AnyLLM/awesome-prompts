  \ check(\"idle 45 d -> ASK_OWNER\", act(days=45) == \"ASK_OWNER\")\n    check(\"\
  idle 5 d -> KEEP_ACTIVE\", act(days=5) == \"KEEP_ACTIVE\")\n    check(\"closed PR\
