  : owners, \"findings\": findings,\n            \"cleanup_script\": \"\\n\".join(script)\
  \ + \"\\n\"}\n\n\ndef render(r):\n    c = r[\"counts\"]\n    out = [f\"# Branch\
  \ cleanup audit ({r['remote']}, base {r['base']}, as of {r['today']})\", \"\",\n\
  \           f\"{r['branches']} branches: {c['DELETE_MERGED']} delete (merged), {c['ARCHIVE_AND_DELETE']}\
  \ archive and delete, \"\n           f\"{c['ASK_OWNER']} ask owner, {c['KEEP_OPEN_PR']}\
  \ open PR, {c['KEEP_ACTIVE']} active, {c['KEEP_PROTECTED']} protected\",\n     \
  \      f\"Rules: stale >= {r['stale_days']} days idle, ask owner >= {r['ask_days']}\
  \ days\", \"\",\n           \"| Action | Branch | Last commit | Author | Ahead/behind\
  \ | Reason |\", \"|---|---|---|---|---|---|\"]\n    for row in r[\"rows\"]:\n  \
  \      out.append(f\"| {row['action']} | {row['branch']} | {row['last_commit']}\
  \ | {row['author']} | {row['ahead']}/{row['behind']} | {row['reason']} |\")\n  \
  \  out += [\"\", \"## Ask the owners\"]\n    if not r[\"owners\"]:\n        out.append(\"\
  - nobody\")\n    for who, names in sorted(r[\"owners\"].items()):\n        out.append(f\"\
  - {who}: {', '.join(names)}\")\n    out += [\"\", \"## Findings\"]\n    if not r[\"\
  findings\"]:\n        out.append(\"- none\")\n    for f in r[\"findings\"]:\n  \
