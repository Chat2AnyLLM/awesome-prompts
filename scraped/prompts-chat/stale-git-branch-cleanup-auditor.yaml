  )\n    ap.add_argument(\"--today\", help=\"YYYY-MM-DD (default: today)\")\n    ap.add_argument(\"\
  --stale-days\", type=int, default=90)\n    ap.add_argument(\"--ask-days\", type=int,\
  \ default=30)\n    ap.add_argument(\"--behind-limit\", type=int, default=300)\n\
  \    ap.add_argument(\"--protect\", default=DEFAULT_PROTECT)\n    ap.add_argument(\"\
  --prefixes\", default=DEFAULT_PREFIXES)\n    ap.add_argument(\"--json\", action=\"\
  store_true\")\n    ap.add_argument(\"--self-test\", action=\"store_true\")\n   \
  \ a = ap.parse_args()\n    if a.self_test:\n        return self_test()\n    try:\n\
  \        today = dt.date.fromisoformat(a.today) if a.today else dt.date.today()\n\
  \        if a.repo:\n            prs = {}\n            if a.prs:\n             \
  \   with open(a.prs, encoding=\"utf-8\") as fh:\n                    for line in\
  \ fh:\n                        if \"\\t\" in line:\n                           \
  \ k, v = line.rstrip(\"\\n\").split(\"\\t\", 1)\n                            prs[k]\
  \ = v.strip().lower()\n            branches = read_repo(a.repo, a.remote, a.base,\
  \ prs)\n        elif a.tsv:\n            with open(a.tsv, encoding=\"utf-8\") as\
