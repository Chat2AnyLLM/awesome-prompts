  \ today, **kw)[\"findings\"]}\n\n    check(\"case collision HIGH\", \"CASE_COLLISION\"\
  \ in codes([b(\"feature/Login\", 3), b(\"feature/login\", 3)]))\n    check(\"stale\
  \ PR MEDIUM\", \"PR_STALE\" in codes([b(\"feature/a\", 100, pr=\"open\")]))\n  \
  \  check(\"far behind MEDIUM\", \"FAR_BEHIND\" in codes([b(\"feature/a\", 10, behind=900)]))\n\
  \    check(\"merged far behind not flagged\", \"FAR_BEHIND\" not in codes([b(\"\
  feature/a\", 10, behind=900, merged=True)]))\n    check(\"long lived LOW\", \"LONG_LIVED\"\
  \ in codes([b(\"feature/a\", 40, ahead=80)]))\n    check(\"old release LOW\", \"\
  OLD_PROTECTED\" in codes([b(\"release/1.0\", 400)]))\n    check(\"bad name LOW\"\
  , \"BAD_NAME\" in codes([b(\"johns-test\", 3)]) and \"BAD_NAME\" in codes([b(\"\
  feature/NewThing\", 3)]))\n    check(\"good name not flagged\", \"BAD_NAME\" not\
  \ in codes([b(\"fix/cart-total\", 3)]))\n    r = audit([b(\"feature/old\", 200),\
  \ b(\"fix/done\", 3, merged=True)], today)\n    check(\"script deletes merged branch\"\
  , \"git push origin --delete fix/done\" in r[\"cleanup_script\"])\n    check(\"\
  script tags before deleting stale\", \"git tag archive/feature/old origin/feature/old\
  \ && git push origin refs/tags/archive/feature/old && git push origin --delete feature/old\"\
  \ in r[\"cleanup_script\"])\n    r = audit([b(\"main\", 1, ahead=0, behind=0), b(\"\
  feature/old\", 200), b(\"develop\", 300)], today)\n    check(\"script never deletes\
  \ protected branches\", \"--delete main\" not in r[\"cleanup_script\"] and \"--delete\
  \ develop\" not in r[\"cleanup_script\"]\n          and r[\"cleanup_script\"].rstrip().endswith(\"\
  git push origin --delete feature/old\"))\n    r = audit([b(\"feature/it's\", 200)],\
  \ today)\n    check(\"odd names are shell-quoted\", \"'feature/it'\\\"'\\\"'s'\"\
  \ in r[\"cleanup_script\"])\n    r = audit([b(\"feature/a\", 200, author=\"ana\"\
  ), b(\"feature/b\", 40, author=\"ana\"), b(\"feature/c\", 2, author=\"bo\")], today)\n\
  \    check(\"owners grouped\", r[\"owners\"] == {\"ana\": [\"feature/a\", \"feature/b\"\
  ]})\n    rows = parse_tsv(\"branch\\tlast_commit\\tauthor\\tahead\\tbehind\\tmerged\\\
  tpr\\nfeature/x\\t2026-10-01\\tAna\\t2\\t5\\tno\\topen\\n\")\n    check(\"TSV parsed\"\
  , rows[0][\"ahead\"] == 2 and rows[0][\"pr\"] == \"open\" and not rows[0][\"merged\"\
  ])\n    rows = parse_tsv(\"branch,last_commit,author,ahead,behind,merged,pr\\nfix/y,2026-09-01,Bo,0,3,yes,none\\\
  n\")\n    check(\"CSV parsed\", rows[0][\"branch\"] == \"fix/y\" and rows[0][\"\
  merged\"] and rows[0][\"behind\"] == 3)\n    try:\n        parse_tsv(\"branch\\\
  tauthor\\nx\\ty\\n\")\n        check(\"missing columns rejected\", False)\n    except\
  \ DataError:\n        check(\"missing columns rejected\", True)\n    # real git\
  \ repository round trip (skipped if git is missing)\n    import os, shutil, tempfile\n\
  \    if shutil.which(\"git\"):\n        d = tempfile.mkdtemp()\n        try:\n \
  \           env = {**os.environ, \"GIT_AUTHOR_NAME\": \"Ana\", \"GIT_AUTHOR_EMAIL\"\
  : \"a@x\", \"GIT_COMMITTER_NAME\": \"Ana\", \"GIT_COMMITTER_EMAIL\": \"a@x\"}\n\
  \            run = lambda *a, cwd=d: subprocess.run([\"git\", *a], cwd=cwd, env=env,\
  \ capture_output=True, check=True)\n            os.makedirs(f\"{d}/remote.git\"\
  ); run(\"init\", \"-q\", \"--bare\", \"-b\", \"main\", cwd=f\"{d}/remote.git\")\n\
  \            run(\"clone\", \"-q\", f\"{d}/remote.git\", \"w\"); w = f\"{d}/w\"\n\
  \            run(\"checkout\", \"-q\", \"-b\", \"main\", cwd=w); run(\"commit\"\
  , \"-q\", \"--allow-empty\", \"-m\", \"init\", cwd=w)\n            run(\"checkout\"\
  , \"-q\", \"-b\", \"fix/done\", cwd=w); run(\"commit\", \"-q\", \"--allow-empty\"\
  , \"-m\", \"fix\", cwd=w)\n            run(\"checkout\", \"-q\", \"main\", cwd=w);\
  \ run(\"merge\", \"-q\", \"--ff-only\", \"fix/done\", cwd=w)\n            run(\"\
  checkout\", \"-q\", \"-b\", \"feature/wip\", cwd=w); run(\"commit\", \"-q\", \"\
  --allow-empty\", \"-m\", \"wip\", cwd=w)\n            run(\"push\", \"-q\", \"origin\"\
  , \"main\", \"fix/done\", \"feature/wip\", cwd=w)\n            r = audit(read_repo(w,\
  \ \"origin\", \"main\", {}), today)\n            acts = {x[\"branch\"]: x[\"action\"\
  ] for x in r[\"rows\"]}\n            check(\"git repo: merged and active branches\
