prompt: A detailed watercolor cutaway of a busy open-air harbor fish market at dawn,
  landscape 4:3. A long stone pavilion with weathered Romanesque arches and a high
  timber-framed ceiling runs diagonally through the frame; the dark tiled floor is
  wet and reflective. Fishmongers in work shirts and aprons sort silver fish on crushed
  ice in wooden crates and along long tables; brass hanging scales dangle from the
  stone arches; empty crates stack nearby. Through the arches on the right, warm golden
  dawn light spreads over a calm harbor with docked fishing boats and a few seagulls
  in the pale sky. Soft watercolor washes, visible brush texture, cool blue-grey stone
  contrasted with warm sunrise gold, lively but orderly morning market mood. No readable
  signs, no logos, no watermarks, no brand names.
