title: Rain Trickling Down a Café Window Beside a Steaming Glass of Tea at Dusk (Image-to-Video
  Animation)
description: Imported from Prompts Chat
prompt: 'Use the attached still (step 1: a photorealistic close-up inside a quiet
  café at dusk, a clear glass cup of amber tea with a thin ribbon of steam on a wooden
  window ledge beside a closed book and a small sugar jar, a rain-covered window behind
  it and a blurred blue-hour street with warm bokeh lights outside) as the exact first
  frame and animate it into an 8-second, 16:9 cinematic shot. Keep every element as
  it is in the still: the cup, the saucer, the book, the jar, the window frame, the
  lamp light and the colors.


  Motion (0-8 s):

  - 0-3 s: the thin steam rises slowly from the tea and curls gently in the warm air;
  two or three larger raindrops start to run down the glass, leaving thin wavy trails.

  - 3-6 s: new small drops land softly on the outside of the pane; a drop merges with
  another and slides down faster; the bokeh lights of the street shimmer slightly
  through the wet glass as a distant car''s lights pass by, still fully blurred.

  - 6-8 s: the steam keeps drifting upward, a last drop traces a slow path down the
  glass, and the scene settles into calm.


  Camera: locked-off tripod shot with a very slow, subtle push in toward the cup (about
  3 percent); no cuts, no fast moves; the cup, ledge, book and window frame stay solid
  and still.


  Ambient motion: faint flicker of the street lights through the rain, tiny sparkles
  on the drops, the surface of the tea almost still.


  Lighting and mood: warm tungsten light inside, cool blue dusk outside, cozy and
  quiet.


  Sound: off (silent clip).


  Avoid: people, hands, animals, the cup moving or changing shape, tea spilling, steam
  turning into smoke clouds, raindrops running upward, the window fogging over completely,
  readable text, sudden light changes, time-lapse.'
