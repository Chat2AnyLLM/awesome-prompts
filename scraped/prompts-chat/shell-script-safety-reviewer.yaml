  $h\" uptime\\ndone < hosts\\n', lambda c: \"SSH_STDIN_LOOP\" not in c),\n      \
  \  (\"case word fine\", S + 'case $1 in\\n  a) echo \"a\" ;;\\nesac\\n', lambda\
  \ c: \"UNQUOTED_VAR\" not in c),\n    ]\n    passed = 0\n    for name, src, check\
  \ in cases:\n        got = _codes(src)\n        ok = check(got)\n        passed\
  \ += ok\n        print((\"PASS \" if ok else \"FAIL \") + name + (\"\" if ok else\
  \ f\"  -> {got}\"))\n    # masking check and exit code check\n    f = [x for x in\
  \ lint(S + 'export API_TOKEN=\"sk_live_abcdef123456\"\\n') if x.code == \"HARDCODED_SECRET\"\
  ][0]\n    ok = \"abcdef123456\" not in f.snippet\n    passed += ok; print((\"PASS\
  \ \" if ok else \"FAIL \") + \"secret value masked in output\")\n    ok = render_md(\"\
  t\", []).endswith(\"No findings.\")\n    passed += ok; print((\"PASS \" if ok else\
  \ \"FAIL \") + \"empty report\")\n    total = len(cases) + 2\n    print(f\"{passed}/{total}\
  \ passed\")\n    return 0 if passed == total else 1\n\n\ndef main():\n    ap = argparse.ArgumentParser(description=\"\
  Shell script safety linter (stdlib only)\")\n    ap.add_argument(\"files\", nargs=\"\
  *\")\n    ap.add_argument(\"--json\", action=\"store_true\")\n    ap.add_argument(\"\
  --min-severity\", default=\"LOW\", choices=list(SEV_ORDER))\n    ap.add_argument(\"\
  --ignore\", default=\"\", help=\"comma-separated codes to skip\")\n    ap.add_argument(\"\
  --self-test\", action=\"store_true\")\n    a = ap.parse_args()\n    if a.self_test:\n\
  \        return self_test()\n    if not a.files:\n        ap.error(\"give at least\
  \ one script or --self-test\")\n    ignore = {c.strip() for c in a.ignore.split(\"\
  ,\") if c.strip()}\n    worst, reports, js = 0, [], {}\n    for path in a.files:\n\
  \        try:\n            with open(path, encoding=\"utf-8\") as fh:\n        \
  \        text = fh.read()\n        except (OSError, UnicodeDecodeError) as e:\n\
  \            print(f\"error: cannot read {path}: {e}\", file=sys.stderr)\n     \
  \       return 2\n        fs = [f for f in lint(text, path) if f.code not in ignore\
  \ and SEV_ORDER[f.sev] <= SEV_ORDER[a.min_severity]]\n        if any(f.sev == \"\
  HIGH\" for f in fs):\n            worst = 1\n        js[path] = [f.as_dict() for\
  \ f in fs]\n        reports.append(render_md(path, fs))\n    print(json.dumps(js,\
  \ indent=2) if a.json else \"\\n\\n\".join(reports))\n    return worst\n\n\nif __name__\
  \ == \"__main__\":\n    sys.exit(main())"
