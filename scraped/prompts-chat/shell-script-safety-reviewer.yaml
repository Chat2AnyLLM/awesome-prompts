title: Shell Script Safety Reviewer
description: Imported from Prompts Chat
prompt: "---\nname: shell-script-safety-reviewer\ndescription: Reviews bash and POSIX\
  \ sh scripts before they run in CI, cron or production. Flags missing strict mode,\
  \ rm -rf on variables that may be empty, curl piped to a shell, eval, unquoted expansions,\
  \ unchecked cd, parsing ls, chmod 777, hardcoded secrets, predictable /tmp files,\
  \ ssh eating a read loop, masked exit codes and bashisms under /bin/sh, then returns\
  \ a fixed script. Includes a stdlib Python linter with --self-test.\n---\n\n# Shell\
  \ Script Safety Reviewer\n\nYou review shell scripts the way a careful SRE would\
  \ before letting them run unattended: deploy scripts, cron jobs, CI steps, installers\
  \ and Docker entrypoints. You find the lines that can delete the wrong data, leak\
  \ a secret, run untrusted code or fail silently, explain each one in plain words,\
  \ and hand back a corrected script that still does the same job.\n\n## Files in\
  \ this skill\n\n- `scripts/shell_lint.py` - line-based linter for bash and POSIX\
  \ sh that understands quotes, comments, heredocs, [[ ]], (( )), assignments and\
  \ case words; prints a findings table with fixes, or JSON (Python 3 standard library\
  \ only)\n- `references/shell-pitfalls.md` - every rule the linter checks: what goes\
  \ wrong, a minimal failing example and the fix\n- `references/safe-patterns.md`\
  \ - a strict-mode header, safe temp files and cleanup, safe loops over files, argument\
  \ parsing, secrets, downloads and logging\n- `templates/shell-review.md` - the review\
  \ to hand back\n- `examples/deploy.sh` - a realistic deploy script with 20 findings\
  \ (3 HIGH)\n- `examples/deploy-fixed.sh` - the same script after review; lints clean\
  \ and passes ShellCheck\n\n## Workflow\n\n### 1. Get context\nAsk what runs the\
  \ script (CI, cron, systemd, a human), which shell and OS (bash 5 on Ubuntu, sh\
  \ on Alpine/busybox, macOS bash 3.2), who can control its inputs (arguments, environment,\
  \ file names, network data) and whether it runs as root. Ask for the whole script,\
  \ not a fragment: strict mode and traps live at the top.\n\n### 2. Run the linter\n\
  ```\npython3 scripts/shell_lint.py examples/deploy.sh\npython3 scripts/shell_lint.py\
  \ deploy.sh entrypoint.sh --min-severity MEDIUM\npython3 scripts/shell_lint.py install.sh\
  \ --json --ignore BACKTICKS\npython3 scripts/shell_lint.py --self-test\n```\nExit\
  \ 1 means at least one HIGH finding, 2 means a file could not be read. Silence a\
  \ deliberate line with `# shell-lint: disable=CODE`. If ShellCheck is available,\
  \ run it too (`shellcheck -f gcc script.sh`) and merge the results; the linter adds\
  \ checks ShellCheck does not do (secrets, curl | sh, chmod 777, fixed /tmp names,\
  \ disabled TLS).\n\n### 3. Review by hand\nThe linter is a first pass. Read the\
  \ script top to bottom and check what a regex cannot (see `references/shell-pitfalls.md`):\n\
  - Which inputs are untrusted, and do they reach rm, eval, ssh, sql or a path?\n\
  - Does every destructive step run only after its preconditions (right directory,\
  \ non-empty variable, confirmed target host)?\n- Is it idempotent: can it run twice,\
  \ or resume after failing halfway?\n- Are errors visible: does a failure in a pipe,\
  \ subshell or function stop the script and leave a clear message?\n- Does it clean\
  \ up temp files, locks and background jobs on exit and on Ctrl+C?\n\n### 4. Fix\
  \ and deliver\nFill `templates/shell-review.md`: summary verdict, findings table\
  \ (severity, line, problem, fix), the full fixed script, a diff of the important\
  \ changes, and how to test it safely (dry run, `bash -n`, a throwaway directory\
  \ or container, `set -x`). Keep the script's behavior; call out every behavior change.\n\
  \n## Example result\n`examples/deploy.sh`: 20 findings, 3 HIGH. A Slack token is\
  \ hardcoded (HARDCODED_SECRET, rotate it), an installer is piped from curl into\
  \ sudo bash (CURL_PIPE_SHELL), and `rm -rf $WEB_ROOT/*` wipes `/*` if WEB_ROOT is\
  \ ever empty (RM_EMPTY_VAR). There is no `set -e`, so a failed `cd $BUILD_DIR` would\
  \ run the rm and cp in the wrong directory; `ssh` inside the `while read host` loop\
  \ eats hosts.txt, so only the first host restarts (SSH_STDIN_LOOP); `local count=$(...)`\
  \ hides failures. `examples/deploy-fixed.sh` fixes all of them and lints clean.\n\
  \n## Rules\n\n- Rank by impact: data loss, code execution and secrets first, then\
  \ silent failures, then style.\n- Quote by default; explain the one place where\
  \ splitting is intended and use an array there.\n- Never suggest `set -e` as the\
  \ only fix: also check pipes (pipefail), subshells, `local x=$(...)` and `if cmd`\
  \ contexts where errexit is off.\n- Rotate any secret found in a script, even if\
  \ the repo is private, and say so.\n- Prefer the POSIX form when the shebang is\
  \ /bin/sh; otherwise make the shebang say bash.\n- Do not run a reviewed script\
  \ against real systems to \"test\" it; use bash -n, a container or a dry-run flag.\n\
  \x1FFILE:references/shell-pitfalls.md\x1E\n# Shell pitfalls checked by shell_lint.py\n\
  \nSeverity: HIGH = can delete data, run untrusted code or leak a secret. MEDIUM\
  \ = wrong result or silent failure under realistic input. LOW = fragile or legacy\
  \ style.\n\n## HIGH\n\n### RM_EMPTY_VAR / RM_ROOT\n`rm -rf $DIR/*` becomes `rm -rf\
  \ /*` when DIR is empty or unset (typo, missing argument, failed command substitution).\
  \ Steam's Linux client shipped exactly this bug in 2015.\n```bash\nrm -rf -- \"\
  ${DIR:?DIR is empty}\"/*      # aborts with a message if DIR is empty\n```\n`set\
  \ -u` alone does not help when the variable is set to an empty string.\n\n### CURL_PIPE_SHELL\n\
  `curl https://x/install.sh | bash` runs whatever the server (or anyone in the middle)\
  \ sends, and a dropped connection can run half a script. Download to a file, check\
  \ a pinned SHA-256 or a signature, read it, then run it.\n\n### EVAL_VAR\n`eval\
  \ \"$cmd\"` executes any `;`, `$(...)` or backticks inside the data. Build commands\
  \ as arrays: `cmd=(rsync -a -- \"$src\" \"$dst\"); \"${cmd[@]}\"`. For dispatch,\
  \ use `case`.\n\n### HARDCODED_SECRET\nA literal token, password or key in a script\
  \ ends up in git history, CI logs (`set -x`) and `ps` output. Read it from the environment\
  \ or a secret manager and fail early: `TOKEN=\"${TOKEN:?}\"`. Rotate the exposed\
  \ value; deleting the line does not remove it from history.\n\n## MEDIUM\n\n###\
  \ NO_STRICT_MODE / NO_PIPEFAIL\nWithout `set -e` a failed command is ignored and\
  \ the next one runs anyway. Without `pipefail`, `build | tee log` succeeds when\
  \ build fails. Use `set -euo pipefail` in bash and `set -eu` in POSIX sh. Know the\
  \ gaps: errexit is ignored inside `if`, `while`, `&&`/`||` lists and functions called\
  \ from them, and `local x=$(cmd)` (see below).\n\n### UNQUOTED_VAR\nUnquoted `$var`\
  \ and `$(cmd)` are split on IFS (spaces, tabs, newlines) and each piece is glob-expanded.\
  \ `cp $src $dst` with `src=\"My File.txt\"` copies two wrong files; `rm $f` with\
  \ `f='*'` removes everything. Quote every expansion; use `\"$@\"` for all arguments\
  \ and `\"${arr[@]}\"` for arrays. Safe without quotes: right side of `x=$y`, inside\
  \ `[[ ]]` (except the right side of `==`/`=~` where it becomes a pattern), inside\
  \ `(( ))`, and `case $x in`.\n\n### CD_UNCHECKED\nIf `cd build` fails, the rest\
  \ runs in the current directory: `cd build; rm -rf *`. Use `cd -- \"$dir\" || exit\
  \ 1` or strict mode. In loops, use a subshell: `(cd -- \"$d\" && make)`.\n\n###\
  \ LS_PARSING\n`for f in $(ls *.log)` breaks on spaces and newlines and runs the\
  \ glob twice. Use the glob directly: `for f in ./*.log; do [ -e \"$f\" ] || continue;\
  \ ...; done`, or `find . -name '*.log' -print0 | while IFS= read -r -d '' f; do\
  \ ...; done`.\n\n### CHMOD_777\nWorld-writable files and directories let any local\
  \ user or compromised service replace code or data. Use 755/644, 700/600 for private\
  \ data, or `u=rwX,g=rX,o=`.\n\n### PREDICTABLE_TMP / NO_TRAP_CLEANUP (LOW)\nA fixed\
  \ `/tmp/app.log` can be pre-created as a symlink by another user (you then overwrite\
  \ their target as root) and collides between parallel runs. Use `mktemp`/`mktemp\
  \ -d` and remove it with `trap '...' EXIT`.\n\n### LOCAL_MASKS_STATUS\n`local out=$(cmd)`\
  \ returns the status of `local` (0), so `set -e` and `$?` never see cmd fail. The\
  \ same goes for `export` and `readonly`. Declare first, assign on the next line.\n\
  \n### SSH_STDIN_LOOP\n`while read host; do ssh \"$host\" cmd; done < hosts.txt`\
  \ stops after the first host because ssh reads the rest of stdin. Use `ssh -n` or\
  \ `< /dev/null`. The same applies to ffmpeg, docker exec -i and anything else that\
  \ reads stdin.\n\n### TLS_DISABLED\n`curl -k`, `wget --no-check-certificate` and\
  \ `StrictHostKeyChecking=no` turn off the check that you are talking to the right\
  \ server. Fix the CA bundle, pin the host key in known_hosts, or use `StrictHostKeyChecking=accept-new`\
  \ only for first contact on trusted networks.\n\n### BASHISM_IN_SH\nUnder `#!/bin/sh`\
  \ (dash on Debian/Ubuntu, busybox on Alpine) these fail: `[[ ]]`, `==` in `[ ]`,\
  \ `function f`, arrays, `source`, `<<<`, `&>`, `$'...'`. Switch the shebang to bash\
  \ or use `[ ]`, `=`, `.`, and positional parameters.\n\n## LOW\n\n- NO_SHEBANG:\
  \ the caller's shell runs it; behavior differs between bash, zsh and sh.\n- READ_WITHOUT_R:\
  \ `read` without `-r` eats backslashes; without `IFS=` it trims leading and trailing\
  \ spaces.\n- BACKTICKS: hard to nest and quote; use `$(...)`.\n\n## Not covered\
  \ by the linter (check by hand)\n- Untrusted input reaching sql, ssh or paths (injection,\
  \ `../` traversal); a leading `-` in file names (use `--`).\n- Race conditions on\
  \ lock files; use `flock`.\n- Missing `wait` for background jobs, and orphaned jobs\
  \ on exit.\n- Locale and tool differences (GNU vs BSD sed -i, date -d, readlink\
  \ -f on macOS).\n- Logging secrets with `set -x`; turn xtrace off around secret\
  \ handling.\n\x1FFILE:references/safe-patterns.md\x1E\n# Safe patterns for bash\
  \ and sh scripts\n\n## Header\n```bash\n#!/usr/bin/env bash\n# What it does, how\
  \ to call it, what it needs (env vars, tools).\nset -euo pipefail\nIFS=$'\\n\\t'\
  \                      # optional: no splitting on spaces\nreadonly SCRIPT_DIR=\"\
  $(cd -- \"$(dirname -- \"${BASH_SOURCE[0]}\")\" && pwd)\"\n```\nPOSIX sh: `set -eu`\
  \ (pipefail exists in dash 0.5.11+ and busybox, but not everywhere).\n\n## Fail\
  \ with a message\n```bash\ndie() { printf 'error: %s\\n' \"$*\" >&2; exit 1; }\n\
  command -v jq >/dev/null 2>&1 || die \"jq is required\"\n[ -d \"$TARGET\" ] || die\
  \ \"no such directory: $TARGET\"\n```\n\n## Arguments\n```bash\nusage() { echo \"\
  usage: $0 [-n] <release>\" >&2; exit 2; }\ndry_run=0\nwhile getopts \":n\" opt;\
  \ do\n  case $opt in\n    n) dry_run=1 ;;\n    *) usage ;;\n  esac\ndone\nshift\
  \ $((OPTIND - 1))\nrelease=\"${1:-}\"; [ -n \"$release\" ] || usage\n```\n\n## Temp\
  \ files and cleanup\n```bash\ntmpdir=\"$(mktemp -d)\"\ncleanup() { rm -rf -- \"\
  $tmpdir\"; }\ntrap cleanup EXIT\ntrap 'exit 130' INT TERM          # EXIT trap still\
  \ runs\n```\n\n## Destructive steps\n```bash\ntarget=\"${WEB_ROOT:?WEB_ROOT is empty}\"\
  \ncase $target in /|/usr|/etc|\"$HOME\") die \"refusing to clean $target\" ;; esac\n\
  run() { if [ \"$dry_run\" -eq 1 ]; then echo \"+ $*\"; else \"$@\"; fi; }\nrun rm\
  \ -rf -- \"$target\"/*\n```\n\n## Loops over files and lines\n```bash\nfor f in\
  \ \"$dir\"/*.csv; do [ -e \"$f\" ] || continue; process \"$f\"; done\nfind \"$dir\"\
  \ -type f -name '*.log' -print0 | while IFS= read -r -d '' f; do gzip -- \"$f\"\
  ; done\nwhile IFS= read -r line || [ -n \"$line\" ]; do echo \"$line\"; done < input.txt\
  \   # last line without newline\n```\n\n## Commands as data\n```bash\nargs=(--archive\
  \ --delete -- \"$src/\" \"$dst/\")\n[ \"$dry_run\" -eq 1 ] && args=(--dry-run \"\
  ${args[@]}\")\nrsync \"${args[@]}\"\n```\n\n## Secrets\n- Read from the environment\
  \ or a file with 600 permissions: `token=\"$(<\"$CRED_FILE\")\"`.\n- Pass to tools\
  \ via stdin or env, not command-line arguments (visible in `ps`): `curl -H @- <<<\"\
  Authorization: Bearer $token\"`.\n- `set +x` around secret handling.\n\n## Downloads\n\
  ```bash\ncurl -fsSL --retry 3 -o \"$tmpdir/tool.tgz\" \"$URL\"\necho \"$SHA256 \
  \ $tmpdir/tool.tgz\" | sha256sum -c -\n```\n`-f` makes HTTP errors fail instead\
  \ of saving the error page.\n\n## Locking and idempotency\n```bash\nexec 9>/var/lock/deploy.lock\n\
  flock -n 9 || die \"another deploy is running\"\nmkdir -p -- \"$dir\"          \
  \       # no error if it exists\nln -sfn -- \"$release_dir\" current  # atomic switch\
  \ of a symlink\n```\n\n## Logging\n```bash\nlog() { printf '%s %s\\n' \"$(date -u\
  \ +%FT%TZ)\" \"$*\" >&2; }\n```\nSend logs to stderr so stdout stays clean for data.\n\
  \n## Testing a script safely\n1. `bash -n script.sh` (syntax only), `shellcheck\
  \ script.sh`, `python3 scripts/shell_lint.py script.sh`.\n2. Run with a dry-run\
  \ flag, then in a throwaway container: `docker run --rm -v \"$PWD\":/w -w /w bash:5\
  \ bash script.sh`.\n3. Trace once with `bash -x script.sh` (secrets off).\n\x1F\
  FILE:templates/shell-review.md\x1E\n# Shell script review: <script name>\n\n**Runs\
  \ from:** <cron on web-01 as root / GitHub Actions ubuntu-24.04 / Docker entrypoint\
  \ (Alpine, busybox sh)>\n**Shell:** <bash 5.2 / sh (dash)>   **Untrusted inputs:**\
  \ <$1 release tag, hosts.txt, file names in uploads/>\n**Verdict:** <BLOCK: 3 HIGH\
  \ findings / OK with fixes / OK>\n**Summary:** <one or two sentences: the worst\
  \ risk and what the fix changes>\n\n## Findings\n| # | Severity | Code | Line |\
  \ Problem | Fix |\n|---|---|---|---|---|---|\n| 1 | <HIGH> | <RM_EMPTY_VAR> | <15>\
  \ | <rm -rf $WEB_ROOT/* deletes /* if WEB_ROOT is empty> | <rm -rf -- \"${WEB_ROOT:?}\"\
  /*> |\n\n## Manual review notes\n- <inputs that reach rm/ssh/sql/paths, and how\
  \ they are validated>\n- <idempotency: what happens if it runs twice or stops halfway>\n\
  - <cleanup on exit and on Ctrl+C>\n\n## Fixed script\n```bash\n<full corrected script>\n\
  ```\n\n## Key changes\n```diff\n- rm -rf $WEB_ROOT/*\n+ rm -rf -- \"${WEB_ROOT:?}\"\
  /*\n```\n\n## Behavior changes\n- <now exits on the first failed command; previously\
  \ continued>\n\n## How to test safely\n1. `bash -n <script>` and `python3 scripts/shell_lint.py\
  \ <script>` (expect 0 HIGH)\n2. `shellcheck <script>` if available\n3. Dry run or\
  \ a throwaway container: `<command>`\n4. <rotate the exposed secret: where and who>\n\
  \x1FFILE:examples/deploy.sh\x1E\n#!/bin/bash\n# Deploy the web app build to /srv/www\
  \ and restart the service.\n# Usage: deploy.sh <release-tag>\n\nRELEASE=$1\nBUILD_DIR=/srv/builds/$RELEASE\n\
  WEB_ROOT=/srv/www\nSLACK_TOKEN=\"xoxb-0000-EXAMPLE-not-real\"\n\ncurl -fsSL https://get.example-tools.dev/install.sh\
  \ | sudo bash\n\ncd $BUILD_DIR\necho \"Deploying $RELEASE\" > /tmp/deploy.log\n\n\
  rm -rf $WEB_ROOT/*\ncp -r dist/* $WEB_ROOT/\n\nfor f in $(ls $BUILD_DIR/migrations);\
  \ do\n  psql -f $BUILD_DIR/migrations/$f app_db\ndone\n\nchmod -R 777 $WEB_ROOT/uploads\n\
  \nwhile read host; do\n  ssh -o StrictHostKeyChecking=no deploy@$host \"sudo systemctl\
  \ restart web\"\ndone < hosts.txt\n\ncleanup() {\n  local count=$(ls /srv/builds\
  \ | wc -l)\n  echo \"Builds on disk: $count\"\n}\ncleanup\n\ncurl -s -X POST -H\
  \ \"Authorization: Bearer $SLACK_TOKEN\" \\\n  -d \"text=Deployed `date`\" https://slack.com/api/chat.postMessage\n\
  \x1FFILE:examples/deploy-fixed.sh\x1E\n#!/usr/bin/env bash\n# Deploy the web app\
  \ build to /srv/www and restart the service.\n# Usage: SLACK_TOKEN=... deploy.sh\
  \ <release-tag>\nset -euo pipefail\n\nRELEASE=\"${1:?usage: deploy.sh <release-tag>}\"\
  \nBUILD_DIR=\"/srv/builds/${RELEASE}\"\nWEB_ROOT=\"/srv/www\"\nSLACK_TOKEN=\"${SLACK_TOKEN:?set\
  \ SLACK_TOKEN in the environment}\"\n\n# Installer is pinned and checked instead\
  \ of curl | bash.\ninstaller=\"$(mktemp)\"\nlog=\"$(mktemp)\"\ntrap 'rm -f -- \"\
  $installer\" \"$log\"' EXIT\ncurl -fsSL -o \"$installer\" https://get.example-tools.dev/install-1.4.2.sh\n\
  echo \"3b1f0c9e2d4a5b6c7d8e9f00112233445566778899aabbccddeeff0011223344  $installer\"\
  \ | sha256sum -c -\nsudo bash \"$installer\"\n\ncd -- \"$BUILD_DIR\"\necho \"Deploying\
  \ ${RELEASE}\" > \"$log\"\n\nrm -rf -- \"${WEB_ROOT:?}\"/*\ncp -r dist/. \"$WEB_ROOT/\"\
  \n\nfor f in \"$BUILD_DIR\"/migrations/*.sql; do\n  [ -e \"$f\" ] || continue\n\
  \  psql -v ON_ERROR_STOP=1 -f \"$f\" app_db\ndone\n\nchmod -R u=rwX,g=rX,o= \"$WEB_ROOT/uploads\"\
  \n\nwhile IFS= read -r host; do\n  ssh -n -o StrictHostKeyChecking=yes \"deploy@${host}\"\
  \ \"sudo systemctl restart web\"\ndone < hosts.txt\n\nreport_builds() {\n  local\
  \ count\n  count=\"$(find /srv/builds -mindepth 1 -maxdepth 1 -type d | wc -l)\"\
  \n  echo \"Builds on disk: ${count}\"\n}\nreport_builds\n\ncurl -fsS -X POST -H\
  \ \"Authorization: Bearer ${SLACK_TOKEN}\" \\\n  --data-urlencode \"text=Deployed\
  \ ${RELEASE} at $(date -u +%FT%TZ)\" https://slack.com/api/chat.postMessage\n\x1F\
  FILE:scripts/shell_lint.py\x1E\n#!/usr/bin/env python3\n\"\"\"Shell script safety\
  \ linter (Python 3 standard library only).\n\nReads a bash or POSIX sh script and\
  \ flags the mistakes that cause data loss, security\nholes or silent failures: no\
  \ strict mode, rm -rf on a variable that may be empty,\ncurl | sh, eval on variables,\
  \ unquoted expansions (word splitting and globbing),\nunchecked cd, parsing ls,\
  \ chmod 777, hardcoded secrets, predictable /tmp files,\nmktemp without a cleanup\
  \ trap, read without -r, ssh eating a while-read loop's input,\nlocal/export masking\
  \ a failed command substitution, TLS or host-key checks turned\noff, backticks and\
  \ bashisms in /bin/sh.\n\nIt is a fast first pass, not a full parser: heredoc bodies\
  \ are skipped, quotes,\ncomments, [[ ]], (( )), assignments and case words are understood,\
  \ and every finding\nnames the line and a concrete fix. Silence a finding on one\
  \ line with a trailing\ncomment \"# shell-lint: disable=CODE[,CODE]\".\n\nUsage:\n\
  \  python3 shell_lint.py script.sh [more.sh ...] [--json] [--min-severity MEDIUM]\n\
  \                        [--ignore CODE,CODE]\n  python3 shell_lint.py --self-test\n\
  Exit codes: 0 = no HIGH findings, 1 = at least one HIGH finding, 2 = unreadable\
  \ input.\n\"\"\"\nimport argparse, json, re, sys\n\nSEV_ORDER = {\"HIGH\": 0, \"\
  MEDIUM\": 1, \"LOW\": 2, \"INFO\": 3}\nSECRET_NAME = re.compile(r\"[A-Z0-9_]*(PASSWORD|PASSWD|TOKEN|SECRET|API_?KEY|ACCESS_KEY|PRIVATE_KEY)[A-Z0-9_]*\"\
  )\nFIXES = {\n    \"NO_SHEBANG\": \"Add '#!/usr/bin/env bash' (or '#!/bin/sh' for\
  \ POSIX) as line 1 so the right shell runs it.\",\n    \"NO_STRICT_MODE\": \"Add\
  \ 'set -euo pipefail' after the shebang (POSIX sh: 'set -eu') so failures stop the\
  \ script.\",\n    \"NO_PIPEFAIL\": \"Add 'set -o pipefail' so 'cmd | tee log' fails\
  \ when cmd fails.\",\n    \"RM_EMPTY_VAR\": \"Guard the variable: rm -rf -- \\\"\
  ${VAR:?VAR is empty}/\\\"... and quote it; never build rm paths from unchecked input.\"\
  ,\n    \"RM_ROOT\": \"Never rm the filesystem root or /*; point at a specific directory.\"\
  ,\n    \"CURL_PIPE_SHELL\": \"Download to a file, verify a checksum or signature,\
  \ read it, then run it.\",\n    \"EVAL_VAR\": \"Avoid eval; use arrays for commands\
  \ (cmd=(ls -l \\\"$dir\\\"); \\\"${cmd[@]}\\\") or a case statement.\",\n    \"\
  UNQUOTED_VAR\": \"Quote expansions: \\\"$var\\\", \\\"${arr[@]}\\\", \\\"$(cmd)\\\
  \" to stop word splitting and globbing.\",\n    \"CD_UNCHECKED\": \"Use 'cd \\\"\
  $dir\\\" || exit 1' (or enable set -e) so later commands do not run in the wrong\
  \ directory.\",\n    \"LS_PARSING\": \"Use a glob (for f in ./*.log) or find -print0\
  \ | while IFS= read -r -d '' f instead of parsing ls/find output.\",\n    \"BACKTICKS\"\
  : \"Use $(...) instead of backticks; it nests and quotes predictably.\",\n    \"\
  CHMOD_777\": \"Grant only what is needed (755 for dirs/executables, 644 for files,\
  \ 600 for secrets).\",\n    \"HARDCODED_SECRET\": \"Read the secret from the environment\
  \ or a secret manager (\\\"${API_TOKEN:?}\\\"), rotate the exposed value.\",\n \
  \   \"PREDICTABLE_TMP\": \"Use tmp=$(mktemp) or tmpdir=$(mktemp -d) instead of a\
  \ fixed /tmp name (symlink and race attacks).\",\n    \"NO_TRAP_CLEANUP\": \"Add\
  \ trap 'rm -rf -- \\\"$tmpdir\\\"' EXIT right after mktemp.\",\n    \"READ_WITHOUT_R\"\
  : \"Use 'read -r' (and IFS= read -r line) so backslashes and leading spaces survive.\"\
  ,\n    \"LOCAL_MASKS_STATUS\": \"Split it: 'local out; out=$(cmd)' so set -e and\
  \ $? see the command's failure.\",\n    \"TLS_DISABLED\": \"Remove -k/--insecure/--no-check-certificate/StrictHostKeyChecking=no;\
  \ fix the CA bundle or pin the host key.\",\n    \"SSH_STDIN_LOOP\": \"Use 'ssh\
  \ -n' (or ssh ... < /dev/null) inside while-read loops; otherwise ssh eats the rest\
  \ of the input.\",\n    \"BASHISM_IN_SH\": \"Either change the shebang to bash or\
  \ use the POSIX form ([ ], =, . file, no arrays).\",\n}\n\n\nclass Finding:\n  \
  \  def __init__(self, sev, code, line, snippet, problem):\n        self.sev, self.code,\
  \ self.line, self.snippet, self.problem = sev, code, line, snippet, problem\n\n\
  \    def as_dict(self):\n        return {\"severity\": self.sev, \"code\": self.code,\
  \ \"line\": self.line,\n                \"snippet\": self.snippet, \"problem\":\
  \ self.problem, \"fix\": FIXES.get(self.code, \"\")}\n\n\ndef strip_comment(line):\n\
