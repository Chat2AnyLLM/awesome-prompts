slug: create-project
title: Create Project
description: Imported from Prompts Chat
prompt: "MASTER AI SOFTWARE DEVELOPMENT PROMPT\nDistrict Administration — Generic\
  \ Campaign Management, Field Operations, Survey, Verification, Reporting & Payment\
  \ Platform\nBuild a production-grade, full-stack, enterprise-level web application\
  \ for District Administration that can be used to create and operate large-scale\
  \ government field campaigns.\nThe platform must support campaigns involving:\n\
  •\tOne department.\n•\tMultiple departments.\n•\tJoint inter-department teams.\n\
  •\tSenior officers.\n•\tSupervisors.\n•\tField officers.\n•\tReserve/backup employees.\n\
  •\tInstitutions.\n•\tVillages.\n•\tWards.\n•\tMohallas.\n•\tHouseholds.\n•\tOther\
  \ configurable target entities.\nThe system must allow District Administration to\
  \ create a campaign, divide it into multiple phases, create different forms for\
  \ each phase, assign employees and teams to geographic areas and target entities,\
  \ collect field data through mobile devices, verify submissions through a configurable\
  \ hierarchy, request corrections, track final results, calculate authorized duty\
  \ payments/honorarium according to configurable government guidelines, and generate\
  \ dashboards and reports.\nThe system must be generic.\nDo not hard-code the application\
  \ for Census only.\nCensus 2027 should be implemented as an example campaign type.\n\
  Other campaign types must be possible without changing the core software.\nExamples:\n\
  •\tCensus 2027.\n•\tSchool Inspection.\n•\tHospital Inspection.\n•\tRoad Survey.\n\
  •\tFlood Damage Survey.\n•\tVillage Survey.\n•\tPDS Inspection.\n•\tAnganwadi Inspection.\n\
  •\tInfrastructure Survey.\n•\tGovernment Scheme Verification.\n•\tDisaster Assessment.\n\
  •\tPublic Grievance Field Verification.\n•\tAny future district campaign.\n________________________________________\n\
  1. CORE BUSINESS MODEL\nThe complete system should follow this structure:\nDistrict\n\
  → Campaign\n→ Campaign Phase\n→ Geographic Scope\n→ Departments\n→ Workforce\n→\
  \ Teams\n→ Target Entities\n→ Tasks\n→ Dynamic Forms\n→ Field Submission\n→ Verification\n\
  → Correction/Re-submission\n→ Final Approval\n→ Phase Result\n→ Payment/Honorarium\n\
  → Reports\nEvery part must be configurable.\n________________________________________\n\
  2. MAIN OBJECTIVE\nThe application must solve the real-world problem of:\n\"A District\
  \ Administration has thousands of employees from different departments and wants\
  \ to conduct multiple field campaigns simultaneously across different geographic\
  \ areas, with different teams, forms, workloads, verification processes, deadlines,\
  \ payment rules and reporting requirements.\"\nThe platform should reduce manual\
  \ Excel/WhatsApp/paper-based coordination.\nIt should provide one central command\
  \ system for District Administration.\n________________________________________\n\
  3. MULTIPLE CAMPAIGNS\nDistrict Administration must be able to run multiple campaigns\
  \ simultaneously.\nExample:\n•\tCensus 2027.\n•\tSchool Inspection.\n•\tRoad Survey.\n\
  •\tFlood Assessment.\n•\tDrinking Water Survey.\nEach campaign is independent.\n\
  Each campaign can have:\n•\tDifferent departments.\n•\tDifferent employees.\n•\t\
  Different geographic areas.\n•\tDifferent forms.\n•\tDifferent workflow.\n•\tDifferent\
  \ deadlines.\n•\tDifferent payment rules.\n•\tDifferent target entities.\n•\tDifferent\
  \ reporting structure.\n________________________________________\n4. MULTI-PHASE\
  \ CAMPAIGN\nEvery campaign can have multiple phases.\nExample:\nCensus 2027\nPhase\
  \ 1\nHouse Listing\nPhase 2\nHousehold Enumeration\nPhase 3\nVerification\nPhase\
  \ 4\nCorrection/Re-enumeration\nEach phase must be able to have:\n•\tDifferent dates.\n\
  •\tDifferent forms.\n•\tDifferent workforce.\n•\tDifferent teams.\n•\tDifferent\
  \ geographic assignments.\n•\tDifferent instructions.\n•\tDifferent workload.\n\
  •\tDifferent verification workflow.\n•\tDifferent payment rules.\n•\tDifferent results.\n\
  Do not assume that all phases use the same employees or form.\n________________________________________\n\
  5. CAMPAIGN TYPES\nCreate configurable campaign types.\nExamples:\n•\tCensus.\n\
  •\tInspection.\n•\tSurvey.\n•\tVerification.\n•\tEnumeration.\n•\tMonitoring.\n\
  •\tAssessment.\n•\tDisaster response.\n•\tInfrastructure survey.\n•\tCustom.\nAdmin\
  \ can create a new campaign type.\n________________________________________\n6.\
  \ ORGANIZATIONAL HIERARCHY\nThe organization must be configurable.\nExample:\nDistrict\
  \ Admin\n→ Department Head\n→ Subdivision Officer\n→ Tehsil Officer\n→ Block Officer\n\
  → Supervisor\n→ Field Team\n→ Field Officer\nBut another department may have a different\
  \ structure.\nTherefore do not hard-code hierarchy levels.\nUse:\nOrganizationNode\n\
  with configurable parent/child relationships.\n________________________________________\n\
  7. GEOGRAPHIC HIERARCHY\nSupport flexible geographic hierarchy.\nExample rural:\n\
  State\n→ District\n→ Subdivision\n→ Tehsil\n→ Block\n→ Village\n→ Mohalla/Hamlet\n\
  → Household\nExample urban:\nState\n→ District\n→ Municipality/Nagar Palika\n→ Zone\n\
  → Ward\n→ Mohalla\n→ Household\nThe system must support both.\nDo not assume every\
  \ area has the same structure.\n________________________________________\n8. GEOGRAPHIC\
  \ MASTER DATA\nCreate geographic master data management.\nAdmin can manage:\n•\t\
  District.\n•\tSubdivision.\n•\tTehsil.\n•\tBlock.\n•\tMunicipality.\n•\tWard.\n\
  •\tVillage.\n•\tMohalla.\n•\tGPS coordinates.\n•\tBoundary/polygon where available.\n\
  Support bulk import through:\n•\tCSV.\n•\tExcel.\n•\tGovernment master-data API\
  \ where available.\nValidate duplicate geographic records.\n________________________________________\n\
  9. TARGET ENTITY ENGINE\nDo not make \"household\" the only target.\nCreate a generic\
  \ target entity system.\nPossible entities:\n•\tHousehold.\n•\tPerson.\n•\tSchool.\n\
  •\tHospital.\n•\tRoad.\n•\tVillage.\n•\tShop.\n•\tAnganwadi.\n•\tGovernment building.\n\
  •\tWater source.\n•\tCustom entity.\nExample:\nCampaign:\nSchool Inspection\nTarget:\n\
  School\nCampaign:\nCensus\nTarget:\nHousehold\nCampaign:\nRoad Survey\nTarget:\n\
  Road segment.\n________________________________________\n10. ENTITY MASTER RECORD\n\
  Every target entity should have a permanent master record.\nExample:\nHousehold\
  \ ID:\nHH-000001\nSchool ID:\nSCH-000001\nRoad ID:\nROAD-000001\nThe master entity\
  \ can have multiple campaign/phase submissions.\nThis prevents duplication.\n________________________________________\n\
  11. HOUSEHOLD MODEL\nFor Census-type campaigns support:\nHousehold\n→ Household\
  \ members\n→ Individual person records\nThe household can have:\n•\tHousehold ID.\n\
  •\tAddress.\n•\tGeographic hierarchy.\n•\tHouse number.\n•\tGPS.\n•\tStatus.\n•\t\
  Source.\n•\tPhase history.\nThe individual/person structure must support variable\
  \ number of persons.\n________________________________________\n12. EMPLOYEE MASTER\n\
  Create a central employee database.\nFields:\n•\tEmployee ID.\n•\tName.\n•\tMobile\
  \ number.\n•\tDesignation.\n•\tDepartment.\n•\tOffice.\n•\tPosting location.\n•\t\
  District.\n•\tSubdivision.\n•\tTehsil.\n•\tBlock.\n•\tRole.\n•\tEmployment status.\n\
  •\tAvailability.\n•\tReserve status.\n•\tTraining status.\nEmployee ID should be\
  \ unique.\nMobile number should be unique where applicable.\n________________________________________\n\
  13. BULK EMPLOYEE IMPORT\nSupport import of thousands of employees.\nFormats:\n\
  •\tExcel.\n•\tCSV.\nBefore import:\n•\tValidate.\n•\tDetect duplicate Employee IDs.\n\
  •\tDetect duplicate mobile numbers.\n•\tDetect missing fields.\n•\tDetect invalid\
  \ departments.\n•\tShow row-level errors.\nAllow:\nImport Valid Records\nwithout\
  \ losing valid records because of invalid rows.\n________________________________________\n\
  14. EMPLOYEE AVAILABILITY\nEmployee status:\n•\tAvailable.\n•\tAssigned.\n•\tOn\
  \ Duty.\n•\tOn Leave.\n•\tUnavailable.\n•\tReserve.\n•\tActivated Reserve.\n•\t\
  Released.\n•\tSuspended.\nCampaign assignment must check availability.\nPrevent\
  \ incompatible double assignment.\n________________________________________\n15.\
  \ MULTI-DEPARTMENT CAMPAIGNS\nA campaign can include multiple departments.\nExample:\n\
  School Inspection:\n•\tEducation.\n•\tPWD.\n•\tFood.\n•\tRevenue.\nEach department\
  \ can have different responsibilities.\n________________________________________\n\
  16. JOINT TEAMS\nCreate a team engine.\nA team can contain employees from different\
  \ departments.\nExample:\nTeam 001:\n•\tRevenue employee.\n•\tEducation employee.\n\
  •\tPWD employee.\nEach team has:\n•\tTeam ID.\n•\tTeam leader.\n•\tMembers.\n•\t\
  Department.\n•\tGeographic responsibility.\n•\tCampaign.\n•\tPhase.\n•\tStatus.\n\
  ________________________________________\n17. TEAM FORMATION\nAllow:\nManual\nAdmin\
  \ selects employees.\nAutomatic\nSystem creates teams based on configured rules.\n\
  Rules may include:\n•\tTeam size.\n•\tDepartment combination.\n•\tGeographic area.\n\
  •\tDesignation.\n•\tSkill.\n•\tAvailability.\n•\tWorkload.\n________________________________________\n\
  18. TEAM LEADER\nTeam leader can:\n•\tSee team members.\n•\tSee assigned tasks.\n\
  •\tMonitor progress.\n•\tReview team-level work where authorized.\n•\tReport employee\
  \ absence.\n•\tRequest replacement.\n•\tSubmit team reports.\nDo not automatically\
  \ grant access to all data just because someone is team leader.\nPermissions must\
  \ still apply.\n________________________________________\n19. RESERVE EMPLOYEE SYSTEM\n\
  Every large campaign should support reserve employees.\nReserve employees can replace\
  \ active staff when necessary.\nReasons:\n•\tLeave.\n•\tIllness.\n•\tTransfer.\n\
  •\tEmergency.\n•\tAdministrative requirement.\n•\tOther authorized reasons.\nWorkflow:\n\
  Active Employee\n→ Unavailable\n→ Supervisor reports\n→ Authorized officer approves\n\
  → Reserve employee selected\n→ Reserve activated\n→ Assignment transferred\n→ Audit\
  \ record created.\n________________________________________\n20. RESERVE TEAM\n\
  Support reserve teams in addition to reserve individuals.\nExample:\nActive Team:\n\
  Team 001\nReserve Team:\nTeam R001\nIf an entire team becomes unavailable, the reserve\
  \ team can be activated.\n________________________________________\n21. WORKLOAD\
  \ MANAGEMENT\nBefore launching a campaign phase, show:\nTotal target entities.\n\
  Required workforce.\nAvailable workforce.\nReserve workforce.\nExpected workload\
  \ per employee.\nExpected workload per team.\nExample:\nTargets:\n1,000,000\nTeams:\n\
  10,000\nAverage:\n100 targets/team.\nAllow authorized admins to adjust distribution.\n\
  ________________________________________\n22. WORKLOAD BALANCING\nSupport:\n•\t\
  Equal distribution.\n•\tGeographic distribution.\n•\tRandom distribution.\n•\tManual\
  \ distribution.\n•\tSkill-based distribution.\n•\tWorkload balancing.\nThe system\
  \ should detect overloaded employees/teams.\nExample:\nEmployee A:\n300 tasks\n\
  Employee B:\n80 tasks\nShow warning.\n________________________________________\n\
  23. RANDOM ASSIGNMENT\nSupport random assignment where required.\nExample:\n10,000\
  \ schools\n1,000 officers\nSystem randomly assigns schools.\nPrevent duplicate assignments.\n\
  Allow administrators to preview before activation.\nMaintain assignment history.\n\
  ________________________________________\n24. GEOGRAPHIC ASSIGNMENT\nTasks can be\
  \ assigned based on:\n•\tDistrict.\n•\tSubdivision.\n•\tTehsil.\n•\tBlock.\n•\t\
  Village.\n•\tWard.\n•\tMohalla.\n•\tGPS boundary.\nSupport polygon-based geographic\
  \ assignment where feasible.\n________________________________________\n25. CAMPAIGN\
  \ CREATION WIZARD\nCreate a professional multi-step wizard.\nStep 1\nCampaign details.\n\
  Step 2\nCampaign type.\nStep 3\nGeographic scope.\nStep 4\nDepartments.\nStep 5\n\
  Workforce.\nStep 6\nTeams.\nStep 7\nTarget entities.\nStep 8\nForm.\nStep 9\nAssignment.\n\
  Step 10\nVerification workflow.\nStep 11\nPayment rules.\nStep 12\nGuidelines/documents.\n\
  Step 13\nPreview.\nStep 14\nLaunch.\n________________________________________\n\
  26. CAMPAIGN VALIDATION BEFORE LAUNCH\nBefore launch check:\n•\tNo target entities.\n\
  •\tNo teams.\n•\tNo officers.\n•\tMissing form.\n•\tMissing mandatory questions.\n\
  •\tMissing geographic assignment.\n•\tMissing verification workflow.\n•\tMissing\
  \ payment configuration where required.\n•\tEmployee conflicts.\n•\tDuplicate assignments.\n\
  •\tInsufficient workforce.\n•\tInvalid dates.\nShow warnings and errors.\nDo not\
  \ allow launch when critical requirements are missing.\n________________________________________\n\
  27. DYNAMIC FORM BUILDER\nDistrict Admin must create forms without coding.\nQuestion\
  \ types:\n•\tShort text.\n•\tLong text.\n•\tInteger.\n•\tDecimal.\n•\tPercentage.\n\
  •\tCurrency/amount.\n•\tDate.\n•\tDate/time.\n•\tYes/No.\n•\tRadio.\n•\tCheckbox.\n\
  •\tDropdown.\n•\tMulti-select.\n•\tImage.\n•\tMultiple image.\n•\tVideo.\n•\tFile.\n\
  •\tGPS.\n•\tSignature.\n•\tRating.\n•\tTable.\n•\tRepeating group.\n•\tCalculated\
  \ field.\n________________________________________\n28. FORM SECTIONS\nForms can\
  \ contain sections.\nExample:\nSchool Inspection:\n1.\tSchool Information.\n2.\t\
  Infrastructure.\n3.\tPWD.\n4.\tFood.\n5.\tEducation.\n6.\tFinal Remarks.\n________________________________________\n\
  29. CONDITIONAL QUESTIONS\nSupport rules.\nExample:\nIF:\nBuilding damaged = YES\n\
  THEN:\nShow:\n•\tDamage type.\n•\tDamage severity.\n•\tDamage photo.\n•\tRepair\
  \ estimate.\nOtherwise hide these fields.\nCreate a visual condition builder.\n\
  ________________________________________\n30. REPEATING GROUPS\nFor Census:\nHousehold:\n\
  Number of members = 6\nAutomatically create:\nPerson 1\nPerson 2\nPerson 3\nPerson\
  \ 4\nPerson 5\nPerson 6.\nSupport nested repeating data where required.\n________________________________________\n\
  31. FORM VALIDATION\nEach question can have:\n•\tRequired.\n•\tMinimum.\n•\tMaximum.\n\
  •\tLength.\n•\tRegex.\n•\tAllowed options.\n•\tDependency.\n•\tEvidence requirement.\n\
  •\tGPS requirement.\nValidation must happen:\nFrontend + Backend\nNever trust frontend\
  \ validation alone.\n________________________________________\n32. FORM VERSIONING\n\
  Forms must be versioned.\nExample:\nForm v1\nForm v2\nHistorical submissions remain\
  \ associated with their original form version.\nChanging a form must not change\
  \ old submissions.\n________________________________________\n33. CAMPAIGN FORM\n\
  Each phase can have its own form.\nExample:\nCampaign:\nCensus 2027\nPhase 1:\n\
  Form A\nPhase 2:\nForm B\nPhase 3:\nForm C\n________________________________________\n\
  34. FIELD OFFICER MOBILE APP\nBuild a mobile-first PWA.\nField employee dashboard:\n\
  Campaigns\n→ Active Phase\n→ Assigned Area\n→ Assigned Tasks\n→ Completed\n→ Pending\n\
  → Corrections\n→ Drafts\n→ Sync\n→ Notifications\n________________________________________\n\
  35. FIELD TASK\nEach task contains:\n•\tTask ID.\n•\tCampaign.\n•\tPhase.\n•\tTarget.\n\
  •\tGeographic location.\n•\tAssigned team.\n•\tAssigned employee.\n•\tDeadline.\n\
  •\tPriority.\n•\tStatus.\n•\tInstructions.\n________________________________________\n\
  36. TASK STATUS\nUse:\n•\tNot Started.\n•\tAssigned.\n•\tAccepted.\n•\tIn Progress.\n\
  •\tDraft.\n•\tSubmitted.\n•\tUnder Verification.\n•\tCorrection Required.\n•\tResubmitted.\n\
  •\tApproved.\n•\tRejected.\n•\tReassigned.\n•\tOverdue.\n•\tCompleted.\n________________________________________\n\
  37. FIELD DATA COLLECTION\nField officer should be able to:\n•\tOpen task.\n•\t\
  Start task.\n•\tFill form.\n•\tSave draft.\n•\tResume later.\n•\tCapture GPS.\n\
  •\tCapture image.\n•\tUpload video.\n•\tAdd remarks.\n•\tSubmit.\n________________________________________\n\
  38. GPS\nWhen configured:\nCapture:\n•\tLatitude.\n•\tLongitude.\n•\tAccuracy.\n\
  •\tTimestamp.\nOptionally calculate distance from target location.\nConfigurable:\n\
  •\tWarning.\n•\tSupervisor review.\n•\tBlock submission.\n________________________________________\n\
  39. PHOTO\nSupport:\n•\tCamera.\n•\tGallery.\n•\tMultiple images.\n•\tCompression.\n\
  •\tPreview.\n•\tRetake.\nAssociate image with:\n•\tCampaign.\n•\tPhase.\n•\tTask.\n\
  •\tQuestion.\n•\tEmployee.\n________________________________________\n40. VIDEO\n\
  Support:\n•\tRecord.\n•\tSelect.\n•\tPreview.\n•\tUpload.\n•\tProgress.\n•\tRetry.\n\
  •\tMaximum size.\n•\tMaximum duration.\nUse object storage.\nDo not store large\
  \ videos directly in PostgreSQL.\n________________________________________\n41.\
  \ OFFLINE MODE\nMobile application must work with poor connectivity.\nUse:\n•\t\
  PWA.\n•\tIndexedDB.\n•\tLocal draft.\n•\tOffline task list.\n•\tSync queue.\nStatus:\n\
  Online\nOffline\nSyncing\nSynced\nFailed.\n________________________________________\n\
  42. OFFLINE CONFLICT MANAGEMENT\nIf the same record changes from multiple sources:\n\
  Do not silently overwrite.\nCreate conflict:\nConflict requires review.\nMaintain\
  \ version history.\n________________________________________\n43. SUBMISSION\nBefore\
  \ final submission:\nShow review page.\nExample:\nRequired fields:\n✓\nGPS:\n✓\n\
  Required images:\n✓\nValidation:\n✓\nThen:\nSubmit\nServer returns:\nSubmission\
  \ ID.\nNever show successful submission before server confirmation.\n________________________________________\n\
  44. VERIFICATION ENGINE\nCreate configurable workflow.\nExample:\nField Officer\n\
  → Supervisor\n→ Tehsil Officer\n→ Subdivision Officer\n→ Department Head\n→ District\
  \ Admin\nBut administrators can configure different levels.\n________________________________________\n\
  45. VERIFICATION ACTIONS\nReviewer can:\n•\tApprove.\n•\tReject.\n•\tRequest correction.\n\
  •\tAdd comment.\n•\tEscalate.\n•\tReassign.\n•\tView history.\n________________________________________\n\
  46. CORRECTION WORKFLOW\nExample:\nReviewer:\n\"Please upload a clear photograph.\"\
  \nStatus:\nCorrection Required.\nEmployee receives notification.\nEmployee edits\
  \ only permitted fields.\nResubmits.\nReviewer receives notification.\n________________________________________\n\
  47. DATA VERSIONING\nEvery submission must preserve:\n•\tVersion.\n•\tAnswers.\n\
  •\tFiles.\n•\tGPS.\n•\tUser.\n•\tTimestamp.\n•\tChanges.\n•\tReason.\nNever destroy\
  \ historical versions.\n________________________________________\n48. FINAL APPROVAL\n\
  Only approved records should be included in final results when the campaign requires\
  \ final approval.\nAllow reports to distinguish:\n•\tPreliminary.\n•\tSubmitted.\n\
  •\tVerified.\n•\tFinal Approved.\n________________________________________\n49.\
  \ DATA QUALITY ENGINE\nCreate automatic quality checks.\nExamples:\n•\tDuplicate\
  \ household.\n•\tDuplicate task.\n•\tMissing GPS.\n•\tImpossible values.\n•\tInconsistent\
  \ totals.\n•\tRequired evidence missing.\n•\tConflicting phase data.\n•\tUnusual\
  \ completion speed.\n•\tRepeated identical GPS coordinates where suspicious.\n•\t\
  Excessive submissions in a short time.\nFlag anomalies for review.\nDo not automatically\
  \ accuse an employee of misconduct.\nMark:\nData Quality Exception\n________________________________________\n\
  50. EXCEPTION MANAGEMENT\nCreate a central Exception Center.\nExamples:\n•\tMissing\
  \ household.\n•\tDuplicate household.\n•\tGPS issue.\n•\tIncomplete form.\n•\tConflicting\
  \ data.\n•\tOverdue task.\n•\tEmployee unavailable.\n•\tTeam unavailable.\n•\tPayment\
  \ failure.\n•\tSync failure.\nAdmin can assign exceptions.\n________________________________________\n\
  51. CENSUS 2027 EXAMPLE\nCreate Census 2027 as a sample campaign.\nDo not invent\
  \ official Census questions.\nUse placeholder/configurable forms or officially supplied\
  \ forms.\nExample structure:\nCensus 2027\n→ Phase 1: House Listing\n→ Phase 2:\
  \ Enumeration\n→ Phase 3: Verification\n→ Phase 4: Correction\nEach phase has different\
  \ forms and possibly different workforce.\n________________________________________\n\
  52. CENSUS GEOGRAPHIC STRUCTURE\nSupport:\nDistrict\n→ Subdivision\n→ Tehsil\n→\
  \ Municipality / Nagar Palika\n→ Ward\n→ Village\n→ Mohalla\n→ Household\nThe actual\
  \ hierarchy must be configurable.\n________________________________________\n53.\
  \ CENSUS JOINT TEAM\nExample:\nTeam 001\nArea:\nWard 10 / Mohalla A\nMembers:\n\
  •\tEducation Department employee.\n•\tRevenue Department employee.\n•\tMunicipal\
  \ employee.\nThe team visits households within its assigned area.\n________________________________________\n\
  54. HOUSEHOLD CENSUS FLOW\nTeam opens:\nHousehold HH-000123\nSystem displays:\n\
  •\tLocation.\n•\tAddress.\n•\tPrevious phase information if authorized.\n•\tCurrent\
  \ phase form.\nTeam collects required information.\nSubmits.\nResult goes through\
  \ configured verification workflow.\n________________________________________\n\
  55. CENSUS MULTI-PHASE WORKLOAD\nSupport distributing work over multiple phases\
  \ to reduce employee workload.\nExample:\nPhase 1:\nEmployee Group A\nPhase 2:\n\
  Employee Group B\nPhase 3:\nEmployee Group C\nOr the same employees can participate\
  \ in multiple phases.\nThe system must support both.\n________________________________________\n\
  56. PAYMENT/HONORARIUM ENGINE\nCreate a dedicated payment module.\nIMPORTANT:\n\
  Never hard-code government payment amounts.\nPayment amounts must come from authorized\
  \ configurable rules based on the applicable government order/guideline.\n________________________________________\n\
  57. PAYMENT RULE\nPayment rule fields:\n•\tCampaign.\n•\tPhase.\n•\tRole.\n•\tDepartment\
  \ if applicable.\n•\tDuty type.\n•\tCalculation method.\n•\tAmount/rate.\n•\tEffective\
  \ date.\n•\tGovernment order reference.\n•\tVersion.\n•\tApproval status.\n________________________________________\n\
  58. PAYMENT CALCULATION\nPossible calculation models:\n•\tFixed amount.\n•\tPer\
  \ day.\n•\tPer task.\n•\tPer approved household.\n•\tRole-based.\n•\tPhase-based.\n\
  •\tComponent-based.\nDo not assume these are legally applicable.\nThe administrator\
  \ configures the permitted calculation method according to official rules.\n________________________________________\n\
  59. PAYMENT ELIGIBILITY\nExample:\nAssignment\n↓\nDuty completed\n↓\nRequired work\
  \ completed\n↓\nSubmission accepted/approved\n↓\nEligibility generated\n↓\nPayment\
  \ approval\n↓\nPayment processing\n↓\nPaid\nExact rules must be configurable.\n\
  ________________________________________\n60. EMPLOYEE PAYMENT DASHBOARD\nEmployee\
  \ sees:\nCampaign:\nCensus 2027\nPhase:\nPhase 1\nDuty:\nCompleted\nEligibility:\n\
  Eligible\nPayment:\n₹XXXX\nStatus:\nPending / Approved / Processing / Paid.\nSensitive\
  \ financial information must be protected.\n________________________________________\n\
  61. PAYMENT STATUS\nStatuses:\n•\tNot Eligible.\n•\tPending Eligibility.\n•\tEligible.\n\
  •\tPending Approval.\n•\tApproved.\n•\tProcessing.\n•\tPaid.\n•\tFailed.\n•\tReturned.\n\
  •\tOn Hold.\n•\tDisputed.\n________________________________________\n62. PAYMENT\
  \ REMINDERS\nIf payment is pending:\nSend:\n•\tIn-app notification.\n•\tSMS where\
  \ configured.\n•\tEmail where configured.\nExample:\nYour approved campaign duty\
  \ payment is still pending processing.\nDo not make unverified claims about payment\
  \ timing.\n________________________________________\n63. PAYMENT EXCEPTIONS\nSupport:\n\
  •\tFailed payments.\n•\tIncorrect records.\n•\tMissing approval.\n•\tDuplicate payment\
  \ prevention.\n•\tHold.\n•\tRetry.\n•\tResolution.\nMaintain complete audit trail.\n\
  ________________________________________\n64. PAYMENT DUPLICATE PREVENTION\nPrevent\
  \ duplicate payment for:\nEmployee + Campaign + Phase + Duty\nunless explicitly\
  \ allowed by an authorized adjustment process.\n________________________________________\n\
  65. ATTENDANCE / DUTY PROOF\nWhere required by campaign rules, support duty attendance.\n\
  Possible methods:\n•\tStart duty.\n•\tEnd duty.\n•\tGPS.\n•\tTeam leader confirmation.\n\
  •\tSupervisor approval.\n•\tTask completion.\nDo not assume attendance equals payment\
  \ eligibility.\nMake it configurable.\n________________________________________\n\
  66. TRAINING\nTrack:\n•\tTraining assigned.\n•\tTraining completed.\n•\tTraining\
  \ date.\n•\tTraining material.\n•\tAssessment.\n•\tCertification.\nA campaign phase\
  \ can optionally require training before assignment.\n________________________________________\n\
  67. GUIDELINES / DOCUMENTS\nCampaign administrators can upload:\n•\tGovernment orders.\n\
  •\tGuidelines.\n•\tSOPs.\n•\tTraining documents.\n•\tCirculars.\n•\tForms.\n•\t\
  Payment orders.\nDocuments should be versioned.\n________________________________________\n\
  68. NOTIFICATION ENGINE\nSupport:\n•\tIn-app.\n•\tSMS.\n•\tEmail.\n•\tPush notifications.\n\
  Notifications:\n•\tNew task.\n•\tNew campaign.\n•\tPhase starting.\n•\tDeadline.\n\
  •\tOverdue.\n•\tCorrection.\n•\tApproval.\n•\tReassignment.\n•\tReserve activation.\n\
  •\tPayment update.\n________________________________________\n69. ESCALATION ENGINE\n\
