  \ hierarchy.\n3. Geography Engine\nDistrict/tehsil/village/ward/mohalla.\n4. Workforce\
  \ Engine\nEmployees and availability.\n5. Team Engine\nJoint teams and reserve teams.\n\
  6. Target Entity Engine\nHouseholds, schools, roads, etc.\n7. Assignment Engine\n\
  Assign targets to teams/employees.\n8. Form Engine\nDynamic forms and versions.\n\
  9. Field Data Engine\nMobile data collection.\n10. Offline Sync Engine\nMobile offline\
  \ operation.\n11. Verification Engine\nReview and approval.\n12. Exception Engine\n\
  Data quality and operational exceptions.\n13. Payment Engine\nConfigurable government-guideline-based\
  \ payment.\n14. Notification Engine\nSMS/email/push/in-app.\n15. Reporting Engine\n\
  Dashboards and reports.\n16. Audit Engine\nComplete history.\n________________________________________\n\
  148. DEVELOPMENT ORDER\nDo not attempt to create the entire application as disconnected\
  \ pages.\nBuild in this order:\nPhase A — Foundation\n•\tArchitecture.\n•\tDatabase.\n\
  •\tAuthentication.\n•\tRBAC.\n•\tOrganization.\n•\tGeography.\nPhase B — Campaign\n\
  •\tCampaign.\n•\tPhase.\n•\tDepartment.\n•\tWorkforce.\n•\tTeam.\nPhase C — Target\
  \ & Assignment\n•\tTarget entities.\n•\tHousehold.\n•\tGeographic assignment.\n\
  •\tTask engine.\n•\tWorkload.\nPhase D — Forms\n•\tForm builder.\n•\tDynamic questions.\n\
  •\tConditions.\n•\tRepeating groups.\n•\tValidation.\n•\tVersioning.\nPhase E —\
  \ Mobile\n•\tField officer UI.\n•\tOffline.\n•\tGPS.\n•\tImage.\n•\tVideo.\n•\t\
  Sync.\nPhase F — Workflow\n•\tVerification.\n•\tCorrection.\n•\tResubmission.\n\
  •\tApproval.\n•\tExceptions.\nPhase G — Payment\n•\tPayment rules.\n•\tEligibility.\n\
  •\tApproval.\n•\tStatus.\n•\tReminders.\n•\tExceptions.\nPhase H — Intelligence\n\
  •\tDashboards.\n•\tMaps.\n•\tAnalytics.\n•\tReports.\n•\tExports.\nPhase I — Production\n\
  •\tSecurity.\n•\tTesting.\n•\tLoad testing.\n•\tMonitoring.\n•\tBackups.\n•\tDisaster\
  \ recovery.\n•\tDocker.\n•\tDocumentation.\n________________________________________\n\
  149. FINAL ACCEPTANCE CRITERIA\nThe project is considered complete only when a real\
  \ end-to-end flow works:\nDistrict Admin\n→ creates campaign\n→ creates multiple\
  \ phases\n→ selects departments\n→ imports workforce\n→ creates joint teams\n→ creates\
  \ reserve teams\n→ assigns geography\n→ loads target entities\n→ creates phase-specific\
  \ dynamic form\n→ creates verification workflow\n→ configures authorized payment\
  \ rule\n→ launches campaign\n↓\nField Team\n→ logs in on mobile\n→ receives assigned\
  \ area\n→ sees assigned targets\n→ visits target\n→ fills form\n→ captures GPS where\
  \ required\n→ captures media where required\n→ works offline if necessary\n→ synchronizes\n\
  → submits\n↓\nReviewer\n→ receives submission\n→ verifies\n→ requests correction\n\
  ↓\nField Team\n→ corrects\n→ resubmits\n↓\nReviewer\n→ approves\n↓\nSystem\n→ finalizes\
  \ result\n→ calculates authorized payment eligibility\n→ tracks payment\n→ sends\
  \ notifications\n↓\nDistrict Admin\n→ sees real-time progress\n→ drills down geographically\n\
  → views maps\n→ views department/team/employee performance\n→ views exceptions\n\
  → views payment status\n→ generates reports\n→ exports authorized data\n→ reviews\
  \ audit history.\n________________________________________\n150. FINAL INSTRUCTION\
  \ TO THE AI DEVELOPER\nDo not build a toy project.\nDo not build only frontend screens.\n\
  Do not use hard-coded arrays for core business data.\nDo not make fake buttons.\n\
  Do not create disconnected demo pages.\nBuild a real full-stack system with:\nFrontend\n\
  ↕\nBackend API\n↕\nBusiness Logic\n↕\nPostgreSQL\n↕\nObject Storage\n↕\nRedis/Background\
  \ Jobs\n↕\nNotification Services\nEvery important button must perform a real operation.\n\
  Every important record must be persisted.\nEvery permission must be enforced on\
  \ the backend.\nEvery official submission must be versioned.\nEvery important change\
  \ must be audited.\nEvery large operation must be designed for scale.\nEvery mobile\
  \ workflow must consider poor connectivity.\nEvery payment amount must be configurable\
  \ and linked to an authorized rule/reference.\nEvery campaign must be configurable.\n\
  Every phase must be independently configurable.\nEvery form must be dynamically\
  \ configurable.\nEvery organization/geographic hierarchy must be configurable.\n\
  The final product should be a reusable District Administration Digital Campaign\
  \ & Field Operations Platform, with Census 2027 as one realistic implementation,\
  \ rather than a Census-only application.\nOne thing I would strongly recommend\n\
  For a project of this scale, don't ask the AI to generate the entire application\
  \ in one shot. Give it the master prompt above, then make it work module-by-module,\
  \ starting with the database and architecture.\nThe most important foundation is:\n\
  Organization → Geography → Workforce → Campaign → Phase → Team → Target → Task →\
  \ Form → Submission → Verification → Result → Payment\nIf that data model is correct,\
  \ the rest of the application can evolve without needing to rebuild it later"
