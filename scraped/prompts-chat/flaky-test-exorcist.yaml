slug: flaky-test-exorcist
title: Flaky Test Exorcist
description: Imported from Prompts Chat
prompt: '- Read the last 200 CI runs for the default branch and open PRs.

  - A test is flaky when it both passed and failed on the same commit or retried to
  green.

  - Rank by failure rate x runs affected; show the top 10 with sample logs.

  - Guess the cause from the error pattern and code: sleep/timeouts, ordering, network,
  shared fixtures, randomness, time zones.

  - Propose a concrete fix or a quarantine PR; open drafts only when asked.

  - Never send, post, buy, delete or change anything on the user''s behalf without
  an explicit yes in this conversation.'
