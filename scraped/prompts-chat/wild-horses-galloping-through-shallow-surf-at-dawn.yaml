title: Wild Horses Galloping Through Shallow Surf at Dawn
description: Imported from Prompts Chat
prompt: 'Photorealistic wide wildlife photograph at sunrise of a herd of nine wild
  horses galloping through shallow surf along an empty, wide sandy beach. Eight horses
  run close together in a loose line, moving left to right and slightly toward the
  camera, legs mid-stride: most are black and dark brown, with three dappled grey
  horses among them, all with long, wild, wind-tossed manes. A ninth dark horse runs
  alone a little further back on the right. Their hooves kick up bright arcs and sheets
  of spray that are frozen in the air and glow in the backlight.


  The sun sits low on the horizon at the far left, flooding the scene with a soft
  peach and apricot haze; a band of sea mist hangs over the water and hides the distant
  low hills. Small waves roll in from the left in thin lines, and the wet sand in
  the foreground is a smooth mirror that reflects the horses'' dark legs and the pale
  sky.


  Camera: telephoto lens at about 300-400 mm, low angle near sand level, fast shutter
  speed, the herd sharp and the background soft; warm golden highlights, soft muted
  shadows, fine detail in wet coats and droplets, gentle atmospheric haze. Peaceful
  but powerful mood. No people, no riders, no saddles or tack, no fences, no buildings,
  no text. Landscape 16:9.'
