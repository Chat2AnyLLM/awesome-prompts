title: Rain Trickling Down a Café Window Beside a Steaming Glass of Tea at Dusk
description: Imported from Prompts Chat
prompt: 'A photorealistic close-up photograph taken inside a quiet café at dusk, looking
  out through a large rain-covered window. On the wooden window ledge in the foreground
  stands a clear glass cup of amber black tea on a small saucer, with a thin ribbon
  of steam rising from it, next to a closed hardcover book with a linen bookmark and
  a small ceramic jar of sugar cubes.


  The window glass is covered in raindrops of many sizes; several larger drops leave
  thin wavy trails as they run down the pane. Outside, softly out of focus, an empty
  evening street glows in blue-hour light, with warm round bokeh from street lamps,
  shop signs blurred beyond recognition and the faint red and white lights of distant
  traffic. Inside, warm tungsten light from a lamp to the right falls on the cup and
  the ledge, making the tea glow and the drops on the glass sparkle.


  50 mm lens at table height, shallow depth of field: the cup, the steam and the nearest
  raindrops tack-sharp, the street a dreamy blur of warm and cool lights. A calm,
  cozy, reflective mood, contrast between the cold blue evening outside and the warm
  interior. No people, no animals, no readable text or logos. Widescreen 16:9.'
