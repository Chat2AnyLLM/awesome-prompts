  \ | Correctness risk under specific conditions, or a boundary erosion |\n| low |\
  \ Hygiene, performance, or maintainability |\n\nSeverity may be lowered one level\
  \ with a stated reason (e.g., package is private). Never raise it.\n\n## Render\n\
  \nAfter all checks, run this snippet. It validates every findings file and fails\
  \ loudly (`stderr`, exit 1) if a status is outside the enum, `reason` is missing\
  \ for a non-`ok` status, a finding id does not start with `${check}/`, or evidence\
  \ is missing/empty. Arguments: output directory (default: `$(node -p 'require(\"\
  os\").tmpdir()')/monorepo-doctor-reports`). The default is outside `$W` because\
  \ detection wipes `$W`. Write into the audited repo only when the user gives that\
  \ path explicitly.\n\n```bash\nW=\"$(node -p 'require(\"os\").tmpdir()')/monorepo-doctor\"\
  \ncat > \"$W/render.mjs\" <<'EOF'\nimport fs from 'node:fs';\nimport os from 'node:os';\n\
