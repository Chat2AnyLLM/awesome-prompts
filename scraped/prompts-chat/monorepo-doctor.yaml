slug: monorepo-doctor
title: Monorepo Doctor
description: Imported from Prompts Chat
prompt: "---\nname: monorepo-doctor\ndescription: Use when a user asks for a JS/TS\
  \ monorepo audit, or Bazel target visibility or testonly issues in a JS or Java\
  \ workspace. Also covers Nx/Turborepo caching, affected tests, cycles and production\
  \ test leakage. Read-only; writes Markdown and JSON reports.\n---\n\n# Monorepo\
  \ Doctor\n\nAudit a JS/TS monorepo for five classes of problems that teams routinely\
  \ miss,\nor run the limited Bazel target checks in a standalone Bazel workspace,\
  \ and\nproduce an evidence-backed report. Bazel-only support does not analyze Java\n\
  source, cycles, caching, or CI test coverage.\n\nPrerequisites: Node ≥ 22.5. The\
  \ work dir is `$W` = `$(node -p 'require(\"os\").tmpdir()')/monorepo-doctor` (see\
  \ detection.md).\n\n## Rules\n\n- **Read-only.** Never install dependencies, build,\
  \ run tests, or edit project files. Allowed writes: `monorepo-doctor-report.md`,\
  \ `monorepo-doctor-report.json` (default `${tmpdir}/monorepo-doctor-reports`, or\
  \ a user-given dir) and `$W`.\n- Allowed commands: the snippets in the reference\
  \ files, `npm pack --dry-run --json --ignore-scripts`, read-only `git log`, and\
  \ the repo's own `./node_modules/.bin/{knip,publint,nx,turbo}` **only if** detection\
  \ reports them installed (nx/turbo: graph / `--dry=json` / `boundaries` only — never\
  \ real task runs, with read-only env vars from the references).\n- **No runtime\
  \ downloads by default.** Don't fetch packages (`npx`, `npm exec`, `pnpm dlx`, `yarn\
  \ dlx`, `bunx`). If a tool isn't installed, skip that sub-step and mark the check\
  \ `partial`. Only if the user explicitly allows downloads in this request may you\
  \ run the pinned `knip@6.41.0` / `publint@0.3.25` shown in the references — never\
  \ other versions, other packages, or nx/turbo.\n- **Never abort a check.** If a\
  \ tool fails, mark the check `partial` or `skipped` with a reason and continue.\n\
  - **Every finding needs evidence** (config snippet, file:line, or command output).\
  \ No evidence → no finding.\n- **Actionable only.** Do not emit a finding when the\
  \ honest fix is \"keep it as-is\" — a deliberate, idiomatic or correct pattern (e.g.\
  \ `cache: false` on a migration task, lazy ORM references). Mention it in the check's\
  \ `reason` instead.\n- **One root cause, one finding.** If two findings share the\
  \ same fix, merge them.\n- Use only the finding ids defined in the reference files.\n\
  \n## Workflow\n\n1. **Detect** — follow [references/detection.md](references/detection.md).\
  \ Stop if `NO_WORKSPACE`.\n2. **Scan** — follow [references/scan.md](references/scan.md).\
  \ If Bazel is detected, also run the static inspection in [references/bazel.md](references/bazel.md)\
  \ before the checks.\n3. **Check** — run all five unless the user asked for a subset\
  \ (write `{\"status\":\"not-run\",\"reason\":\"not requested\",\"findings\":[]}`\
  \ to `$W/findings/${check}.json` for the others):\n   - [references/boundaries.md](references/boundaries.md)\
  \ — package split & public API, including Bazel visibility\n   - [references/circular-deps.md](references/circular-deps.md)\
  \ — package and file cycles\n   - [references/caching.md](references/caching.md)\
  \ — Nx / Turborepo cache correctness\n   - [references/ci-coverage.md](references/ci-coverage.md)\
  \ — tests that silently don't run in CI\n   - [references/prod-leakage.md](references/prod-leakage.md)\
  \ — test code shipped to production\n   The checks are independent; if you can run\
  \ sub-agents, run them in parallel.\n4. **Report** — follow [references/report-format.md](references/report-format.md):\
  \ validate each `findings/${check}.json`, render, then show the user where the reports\
  \ were written, the summary line and the top 5 findings.\n5. **CI mode** (only if\
  \ asked, or when invoked non-interactively with a threshold) — run the exit-code\
  \ snippet from report-format.md.\n\n## Tracking\n\nCreate a todo per phase/check\
  \ and mark each done as its findings file is written.\n\n\x1FFILE:references/bazel.md\x1E\
  \n# Bazel static target inspection\n\nThis supplementary scan works for Bazel-backed\
  \ JS workspaces and standalone\nBazel workspaces, including Java. It reads the BUILD\
  \ files inventoried by\n[detection.md](detection.md) without invoking Bazel, loading\
  \ `.bzl` files, or\ndownloading anything. It writes `$W/bazel.json` for the boundary\
  \ and\nproduction-leakage checks.\n\nThe scan deliberately recognizes only literal\
  \ attributes on `filegroup`,\n`java_library`, `java_binary`, `java_test` loaded\
  \ from\n`@rules_java//java:defs.bzl`, and `js_library` loaded from\n`@aspect_rules_js//js:defs.bzl`\
  \ or `@rules_js//js:defs.bzl`. It follows\nliteral local labels in `srcs`, `deps`,\
  \ `data`, `resources`, `runtime_deps`,\nand `exports`. It does not evaluate macros,\
  \ `select()`, `glob()`, package\ngroups, external repositories, implicit dependencies,\
  \ or nonliteral\nattributes; its results are always `partial`. It is not a general\
  \ Starlark\ninterpreter. `REPO.bazel` `ignore_directories` patterns are not evaluated:\
  \ if\nthat name occurs in the file or exclusions cannot be read, target findings\
  \ are\nsuppressed and the reason is reported. Conditional call expressions and\n\
  rule names referenced as values or reassigned are not interpreted.\n\n- Visibility\
  \ finding: an exact `internal` tag and an explicit, literal public\n  visibility\
  \ on the target. For a native `filegroup` only, an explicit\n  `package(default_visibility\
  \ = ...)` also counts; macro-created targets do\n  not necessarily inherit that\
  \ default.\n  The tag is a project convention, **not** Bazel's own visibility policy.\n\
  \  Public untagged targets are valid. Review the intended consumers before\n  restricting\
  \ visibility.\n- Test-only finding: a target explicitly tagged `production` and\
  \ explicitly\n  marked `testonly = False` has a literal local dependency path to\
  \ a target\n  explicitly marked `testonly = True`. Bazel normally rejects such a\
  \ path at\n  analysis time; the finding is a broken production build, not proof\
  \ that test\n  code actually shipped. A test target using test-only fixtures is\
  \ valid.\n\nRun after detection and the JS scan, from the audited workspace root:\n\
  \n```bash\nW=\"$(node -p 'require(\"os\").tmpdir()')/monorepo-doctor\"\ncat > \"\
  $W/bazel-audit.mjs\" <<'EOF'\nimport fs from 'node:fs';\nimport os from 'node:os';\n\
  import path from 'node:path';\n\nconst work = path.join(os.tmpdir(), 'monorepo-doctor');\n\
  const ws = JSON.parse(fs.readFileSync(path.join(work, 'workspace.json'), 'utf8'));\n\
  const root = ws.root;\nconst findings = { boundaries: [], 'prod-leakage': [] };\n\
  const problems = [];\nconst targets = new Map(), duplicates = new Set();\nconst\
  \ closing = { '(': ')', '[': ']', '{': '}' };\n\nfunction lex(text) {\n  const out\
  \ = [];\n  let i = 0, line = 1, logicalLine = 1, depth = 0;\n  while (i < text.length)\
  \ {\n    const ch = text[i];\n    if (ch === '\\\\' && (text[i + 1] === '\\n' ||\
  \ (text[i + 1] === '\\r' && text[i + 2] === '\\n'))) {\n      i += text[i + 1] ===\
  \ '\\r' ? 3 : 2;\n      line++;\n      continue;\n    }\n    if (/\\s/.test(ch))\
  \ {\n      if (ch === '\\n') { line++; if (!depth) logicalLine++; }\n      i++;\n\
  \      continue;\n    }\n    if (ch === '#') { while (i < text.length && text[i]\
  \ !== '\\n') i++; continue; }\n    const start = i, startLine = line;\n    if (ch\
  \ === '\"' || ch === \"'\") {\n      const triple = text.slice(i, i + 3) === ch.repeat(3);\n\
  \      i += triple ? 3 : 1;\n      let value = '', valid = !triple, closed = false;\n\
  \      while (i < text.length) {\n        if (triple && text.slice(i, i + 3) ===\
  \ ch.repeat(3)) { i += 3; closed = true; break; }\n        if (!triple && text[i]\
  \ === ch) { i++; closed = true; break; }\n        if (text[i] === '\\\\') {\n  \
  \        i++;\n          if (i >= text.length) break;\n          const escapes =\
  \ { '\\\\': '\\\\', '\"': '\"', \"'\": \"'\", n: '\\n', r: '\\r', t: '\\t' };\n\
  \          if (!Object.hasOwn(escapes, text[i])) valid = false;\n          else\
  \ value += escapes[text[i]];\n          if (text[i] === '\\n') line++;\n       \
  \   i++;\n        } else {\n          if (text[i] === '\\n') {\n            line++;\n\
  \            if (!triple) throw new Error(`unterminated string at line ${startLine}`);\n\
  \          }\n          value += text[i++];\n        }\n      }\n      if (!closed)\
  \ throw new Error(`unterminated string at line ${startLine}`);\n      out.push({\
  \ type: valid ? 'string' : 'unknown', value, start, end: i, line: startLine, logicalLine\
  \ });\n    } else if (/[A-Za-z_]/.test(ch)) {\n      i++;\n      while (i < text.length\
  \ && /[A-Za-z0-9_]/.test(text[i])) i++;\n      out.push({ type: 'id', value: text.slice(start,\
  \ i), start, end: i, line: startLine, logicalLine });\n    } else {\n      i++;\n\
  \      out.push({ type: 'punct', value: ch, start, end: i, line: startLine, logicalLine\
  \ });\n      if (closing[ch]) depth++;\n      else if ([')', ']', '}'].includes(ch))\
  \ depth--;\n    }\n  }\n  return out;\n}\n\nfunction groupEnd(tokens, start) {\n\
  \  const stack = [closing[tokens[start].value]];\n  for (let i = start + 1; i <\
  \ tokens.length; i++) {\n    const value = tokens[i].value;\n    if (tokens[i].type\
  \ === 'punct' && closing[value]) stack.push(closing[value]);\n    else if (tokens[i].type\
  \ === 'punct' && [')', ']', '}'].includes(value)) {\n      if (stack.pop() !== value)\
  \ throw new Error(`unbalanced delimiter at line ${tokens[i].line}`);\n      if (!stack.length)\
  \ return i;\n    }\n  }\n  throw new Error(`unclosed delimiter at line ${tokens[start].line}`);\n\
  }\n\nfunction splitArgs(tokens) {\n  const parts = [];\n  let start = 0;\n  for\
  \ (let i = 0; i < tokens.length; i++) {\n    if (tokens[i].type === 'punct' && closing[tokens[i].value])\
  \ i = groupEnd(tokens, i);\n    else if (tokens[i].type === 'punct' && tokens[i].value\
  \ === ',') { if (i > start) parts.push(tokens.slice(start, i)); start = i + 1; }\n\
  \  }\n  if (start < tokens.length) parts.push(tokens.slice(start));\n  return parts;\n\
  }\n\nfunction literal(tokens) {\n  if (tokens.length === 1 && tokens[0].type ===\
  \ 'string') return tokens[0].value;\n  if (tokens.length === 1 && tokens[0].type\
  \ === 'id' && ['True', 'False'].includes(tokens[0].value)) return tokens[0].value\
  \ === 'True';\n  if (tokens[0]?.type === 'punct' && tokens[0].value === '[' && groupEnd(tokens,\
  \ 0) === tokens.length - 1) {\n    const parts = splitArgs(tokens.slice(1, -1));\n\
  \    if (parts.every((p) => p.length === 1 && p[0].type === 'string')) return parts.map((p)\
  \ => p[0].value);\n  }\n  return undefined;\n}\n\nfunction calls(text) {\n  const\
  \ tokens = lex(text), result = [], loadTokens = new Set();\n  for (let i = 0; i\
  \ < tokens.length; i++) {\n    const t = tokens[i];\n    const isSemicolon = (tok)\
  \ => tok?.type === 'punct' && tok.value === ';';\n    const statementStart = i ===\
  \ 0 || tokens[i - 1].logicalLine !== t.logicalLine || isSemicolon(tokens[i - 1]);\n\
  \    if (t.type === 'id' && tokens[i + 1]?.type === 'punct' && tokens[i + 1].value\
  \ === '('\n        && tokens[i + 1].logicalLine === t.logicalLine && statementStart)\
  \ {\n      const end = groupEnd(tokens, i + 1);\n      if (tokens[end + 1]?.logicalLine\
  \ !== tokens[end].logicalLine || isSemicolon(tokens[end + 1])) {\n        result.push({\
  \ name: t.value, line: t.line, parts: splitArgs(tokens.slice(i + 2, end)) });\n\
  \        if (t.value === 'load') for (let j = i + 1; j < end; j++) loadTokens.add(j);\n\
  \      }\n      i = end;\n    } else if (t.type === 'punct' && closing[t.value])\
  \ {\n      i = groupEnd(tokens, i);\n    }\n  }\n  const referenced = new Set(tokens.flatMap((t,\
  \ i) =>\n    t.type === 'id' && tokens[i + 1]?.value !== '(' && !loadTokens.has(i)\
  \ ? [t.value] : []));\n  return { calls: result, referenced };\n}\n\nfunction attributes(parts,\
  \ text) {\n  const attrs = {};\n  for (const p of parts) {\n    if (p[0]?.type !==\
  \ 'id' || p[1]?.value !== '=' || p.length < 3) continue;\n    if (Object.hasOwn(attrs,\
  \ p[0].value)) throw new Error(`duplicate ${p[0].value} attribute at line ${p[0].line}`);\n\
  \    const expr = p.slice(2);\n    attrs[p[0].value] = {\n      value: literal(expr),\n\
  \      text: text.slice(expr[0].start, expr[expr.length - 1].end),\n      line:\
  \ p[0].line,\n    };\n  }\n  return attrs;\n}\n\nfunction loadBindings(parsed) {\n\
  \  const bindings = new Map();\n  for (const call of parsed.filter((c) => c.name\
  \ === 'load')) {\n    const source = literal(call.parts[0] ?? []);\n    if (typeof\
  \ source !== 'string') continue;\n    for (const part of call.parts.slice(1)) {\n\
  \      const local = part.length === 1 && part[0].type === 'string' ? part[0].value\n\
  \        : part[0]?.type === 'id' && part[1]?.value === '=' ? part[0].value : null;\n\
  \      const symbol = part.length === 1 ? literal(part) : literal(part.slice(2));\n\
  \      if (local && typeof symbol === 'string') bindings.set(local, { source, symbol\
  \ });\n    }\n  }\n  return bindings;\n}\n\nfunction ruleKind(name, bindings) {\n\
  \  const binding = bindings.get(name);\n  if (name === 'filegroup' && !binding)\
  \ return name;\n  if (binding?.source === '@rules_java//java:defs.bzl'\n      &&\
  \ ['java_library', 'java_binary', 'java_test'].includes(binding.symbol)) return\
  \ binding.symbol;\n  if (['@aspect_rules_js//js:defs.bzl', '@rules_js//js:defs.bzl'].includes(binding?.source)\n\
  \      && binding.symbol === 'js_library') return binding.symbol;\n  return null;\n\
  }\n\nfunction label(value, pkg) {\n  if (typeof value !== 'string') return null;\n\
  \  if (value.startsWith('@@//')) value = value.slice(2);\n  else if (value.startsWith('@'))\
  \ return null;\n  let dir = pkg, name = value;\n  if (value.startsWith('//')) {\n\
  \    const body = value.slice(2), colon = body.indexOf(':');\n    dir = colon <\
  \ 0 ? body : body.slice(0, colon);\n    name = colon < 0 ? path.posix.basename(dir)\
  \ : body.slice(colon + 1);\n  } else if (value.startsWith(':')) name = value.slice(1);\n\
  \  if (!name || name.includes(':') || dir.split('/').includes('..') || name.split('/').includes('..')\n\
  \      || !/^[A-Za-z0-9_./+~=-]*$/.test(dir) || !/^[A-Za-z0-9_./+~=-]+$/.test(name))\
  \ return null;\n  return `//${dir}:${name}`;\n}\n\nfunction owner(dir) {\n  return\
  \ [...ws.packages]\n    .filter((p) => p.dir === '.' || dir === p.dir || dir.startsWith(`${p.dir}/`))\n\
  \    .sort((a, b) => b.dir.length - a.dir.length)[0]?.name;\n}\n\nfor (const file\
  \ of ws.bazel?.unresolvedExclusions ? [] : ws.bazel?.buildFiles ?? []) {\n  try\
  \ {\n    const text = fs.readFileSync(path.join(root, file), 'utf8');\n    const\
  \ { calls: parsed, referenced } = calls(text);\n    const bindings = loadBindings(parsed);\n\
  \    const packageCall = !referenced.has('package') && !bindings.has('package')\n\
  \      ? parsed.find((c) => c.name === 'package') : undefined;\n    const defaults\
  \ = packageCall ? attributes(packageCall.parts, text) : {};\n    const pkg = path.posix.dirname(file)\
  \ === '.' ? '' : path.posix.dirname(file);\n    for (const call of parsed) {\n \
  \     const kind = referenced.has(call.name) ? null : ruleKind(call.name, bindings);\n\
  \      if (!kind) continue;\n      const attrs = attributes(call.parts, text);\n\
  \      const name = attrs.name?.value;\n      const targetLabel = label(typeof name\
  \ === 'string' ? `:${name}` : null, pkg);\n      if (!targetLabel) continue;\n \
  \     const visibility = Object.hasOwn(attrs, 'visibility') ? attrs.visibility\n\
  \        : kind === 'filegroup' ? defaults.default_visibility : undefined;\n   \
  \   const edges = [];\n      for (const key of ['srcs', 'deps', 'data', 'resources',\
  \ 'runtime_deps', 'exports']) {\n        if (!Array.isArray(attrs[key]?.value))\
  \ continue;\n        for (const value of attrs[key].value) {\n          const dest\
  \ = label(value, pkg);\n          if (dest) edges.push({ label: dest, attribute:\
  \ key, line: attrs[key].line });\n        }\n      }\n      const target = { label:\
  \ targetLabel, file, line: call.line, pkg: owner(pkg), attrs, visibility, edges\
  \ };\n      if (targets.has(targetLabel)) duplicates.add(targetLabel);\n      else\
  \ targets.set(targetLabel, target);\n    }\n  } catch (error) {\n    problems.push(`${file}:\
  \ ${error.message}`);\n  }\n}\nfor (const duplicate of duplicates) {\n  targets.delete(duplicate);\n\
  \  problems.push(`duplicate target ${duplicate}`);\n}\n\nfor (const target of targets.values())\
  \ {\n  if (Array.isArray(target.attrs.tags?.value)\n      && target.attrs.tags.value.includes('internal')\n\
  \      && Array.isArray(target.visibility?.value)\n      && target.visibility.value.length\
  \ === 1\n      && target.visibility.value[0] === '//visibility:public') {\n    findings.boundaries.push({\n\
  \      id: 'boundaries/bazel-public-internal-target', severity: 'medium',\n    \
  \  title: `Internal-tagged target ${target.label} is publicly visible`,\n      location:\
  \ { file: target.file, line: target.line, ...(target.pkg ? { package: target.pkg\
  \ } : {}) },\n      evidence: `${target.label} (${target.file}:${target.line}):\
  \ tags = ${target.attrs.tags.text}; ${Object.hasOwn(target.attrs, 'visibility')\
  \ ? 'visibility' : 'package default_visibility'} = ${target.visibility.text}`,\n\
  \      fix: 'Confirm the intended consumers and restrict visibility if the target\
  \ is meant to be internal; retain any required access.',\n    });\n  }\n\n  if (!Array.isArray(target.attrs.tags?.value)\
  \ || !target.attrs.tags.value.includes('production')\n      || target.attrs.testonly?.value\
  \ !== false) continue;\n  const seen = new Set([target.label]);\n  const queue =\
  \ [{ target, edges: [] }];\n  for (let i = 0; i < queue.length; i++) {\n    const\
  \ current = queue[i];\n    for (const edge of current.target.edges) {\n      if\
  \ (seen.has(edge.label) || !targets.has(edge.label)) continue;\n      seen.add(edge.label);\n\
  \      const next = targets.get(edge.label);\n      const chain = [...current.edges,\
  \ { from: current.target, edge }];\n      if (next.attrs.testonly?.value === true)\
  \ {\n        findings['prod-leakage'].push({\n          id: 'prod-leakage/bazel-testonly-dependency',\
  \ severity: 'high',\n          title: `Production target ${target.label} depends\
  \ on test-only target ${next.label}`,\n          location: { file: target.file,\
  \ line: target.line, ...(target.pkg ? { package: target.pkg } : {}) },\n       \
  \   evidence: `${target.label}: tags = ${target.attrs.tags.text}; testonly = ${target.attrs.testonly.text}\\\
  n${chain.map(({ from, edge: e }) => `${from.label} (${from.file}:${e.line}) ${e.attribute}\
  \ -> ${e.label}`).join('\\n')}\\n${next.label} (${next.file}:${next.attrs.testonly.line}):\
  \ testonly = ${next.attrs.testonly.text}`,\n          fix: 'Remove the test-only\
  \ dependency from the production target or replace it with a production-safe input;\
  \ keep test fixtures test-only.',\n        });\n      }\n      queue.push({ target:\
  \ next, edges: chain });\n    }\n  }\n}\n\nconst reason = [\n  'Bazel static inspection\
  \ covers only literal local targets; macros, selects, package groups and external\
  \ dependencies are not resolved',\n  ...(!ws.bazel?.buildFiles.length ? ['no Bazel\
  \ BUILD files found'] : []),\n  ...(ws.bazel?.errors ?? []),\n  ...problems,\n].join(';\
  \ ');\nconst result = Object.fromEntries(Object.entries(findings).map(([check, entries])\
  \ => [check, {\n  status: 'partial', reason, findings: entries,\n}]));\nfs.writeFileSync(path.join(work,\
  \ 'bazel.json'), JSON.stringify(result, null, 2));\nconsole.log(JSON.stringify({\
  \ boundaries: findings.boundaries.length, testonly: findings['prod-leakage'].length,\
  \ status: 'partial' }));\nEOF\nnode \"$W/bazel-audit.mjs\"\n```\n\nEach check merges\
  \ its own findings from this file and keeps the scan's partial\nreason alongside\
  \ any other incomplete subchecks. If this scan fails or\n`bazel.json` is missing\
  \ or invalid, mark both Bazel-aware checks `partial` with\nthe failure reason; do\
  \ not treat the absence of results as a clean audit.\n\x1FFILE:references/boundaries.md\x1E\
  \n# Check 1 — Package boundaries\n\nQuestion: are packages split along real seams,\
  \ and is each package's public API respected?\nInputs: `workspace.json`, `scan.json`.\
  \ Output: `findings/boundaries.json`.\n\n## Rules\n\n| id | severity | detect |\
  \ evidence |\n|---|---|---|---|\n| `boundaries/oversized-package` | low | `scan.packages[p].sourceFiles\
  \ > 500` or `loc > 50000` (generated files are already excluded by scan) **and**\
  \ at least 2 other workspace packages import it (`scan.imports` with `target ===\
  \ p`). Apps and leaf packages with no workspace consumers are never flagged: splitting\
  \ them adds export maps and tags with no consumer that benefits. | counts + the\
  \ consumers and which subpaths/symbols each uses |\n| `boundaries/deep-import` |\
  \ medium | each `scan.imports` entry with `deep && (declared \\|\\| fromSource ===\
  \ \"project.json\")` (undeclared package.json importers are reported by ci-coverage\
  \ instead) | file:line + import specifier + target's `exports` keys |\n| `boundaries/unlisted-dependency`\
  \ | medium | knip `unlisted` entries | knip output line |\n| `boundaries/unused-dependency`\
  \ | low | knip `dependencies` / `devDependencies` entries | knip output line |\n\
  | `boundaries/nx-missing-module-boundaries-rule` | medium | Nx detected and no ESLint\
  \ config in the root mentions `@nx/enforce-module-boundaries` | list of ESLint config\
  \ files checked |\n| `boundaries/nx-permissive-module-boundaries` | low | the rule\
  \ exists but `depConstraints` contains `{ sourceTag: '*', onlyDependOnLibsWithTags:\
  \ ['*'] }` | the config snippet |\n| `boundaries/nx-untagged-project` | low | Nx\
  \ detected, rule absent or permissive, and a project has empty `tags` | project.json\
  \ path |\n| `boundaries/turbo-package-boundaries-tags` | medium | verified Turbo\
  \ 2.5+ (2.x) and a package-level Turbo config defines `boundaries.tags`, which is\
  \ root-only | package config path + `boundaries.tags` snippet |\n| `boundaries/turbo-tag-package-name-collision`\
  \ | medium | verified Turbo 2.5+ (2.x) and a root `boundaries.tags` rule key exactly\
  \ equals a workspace package name | root rule snippet + package.json name and path\
  \ |\n| `boundaries/turbo-boundaries-violation` | medium | each violation printed\
  \ by `turbo boundaries` | output line |\n| `boundaries/bazel-public-internal-target`\
  \ | medium | an explicitly internal Bazel target (`tags` contains `internal`) has\
  \ effective `//visibility:public` | target label + `tags` and effective visibility\
  \ declarations |\n\nGroup `deep-import` findings: one finding per (from, target)\
