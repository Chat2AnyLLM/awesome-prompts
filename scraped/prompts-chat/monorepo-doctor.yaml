  \ code shipped. |\n| `prod-leakage/publint-issue` | error→high, warning→medium,\
  \ suggestion→low | `publint` messages for publishable packages. |\n\nFor a Bazel-only\
  \ workspace, skip the JS package/build-output subchecks and keep\nthis check `partial`;\
  \ Java build outputs and shipped artifacts are not analyzed.\n\n## Steps\n\n1. For\
  \ each publishable package (non-private, `source: package.json`):\n   ```bash\n\
  \   W=\"$(node -p 'require(\"os\").tmpdir()')/monorepo-doctor\"\n   (cd \"<pkg-dir>\"\
  \ && npm pack --dry-run --json --ignore-scripts 2>&1)\n   ```\n   Parse `[0].files[].path`;\
  \ any match of the test pattern → `test-files-in-package` (list up to 10 in `evidence`).\n\
  \   Parse stdout as JSON. If `npm pack` fails (e.g. `workspace:` protocol under\
