  \ skipped subchecks. A test-only target being public, or being used by a test, is\
  \ not a production leak. If the file is missing or invalid, mark this check `partial`\
  \ with the failure reason.\n7. Write `findings/prod-leakage.json`.\n\n## Fix guidance\n\
  \n- test-files-in-package: add `\"files\": [\"dist\"]` to package.json (preferred\
  \ over `.npmignore`).\n- build-tsconfig-includes-tests: `\"exclude\": [\"**/*.spec.ts\"\
  , \"**/*.test.ts\", \"**/__tests__/**\"]`.\n- test-lib-in-dependencies: move it\
  \ to `devDependencies`.\n\x1FFILE:references/report-format.md\x1E\n# Report format\n\
  \nEvery check writes one file: `$W/findings/${check}.json`\nwhere `${check}` is\
  \ one of `boundaries`, `circular-deps`, `caching`, `ci-coverage`, `prod-leakage`.\n\
  \n```json\n{\n  \"status\": \"ok | partial | skipped | not-run\",\n  \"reason\"\
  : \"required unless status is ok\",\n  \"findings\": [\n    {\n      \"id\": \"\
  caching/missing-outputs\",\n      \"severity\": \"critical | high | medium | low\"\
  ,\n      \"title\": \"One line, specific: name the package/task\",\n      \"location\"\
  : { \"file\": \"turbo.json\", \"line\": 4, \"package\": \"@acme/ui\" },\n      \"\
  evidence\": \"The exact config/code/command output that proves it\",\n      \"fix\"\
  : \"Concrete change, ideally a snippet\"\n    }\n  ]\n}\n```\n\n- `ok`: check ran\
  \ fully. `partial`: some sub-steps skipped (say which in `reason`).\n  `skipped`:\
  \ check could not run at all. `not-run`: user scoped it out. A missing findings\
  \ file is rendered as `skipped` with reason `no findings file`; for user-scoped-out\
  \ checks, write an explicit `not-run` file at `$W/findings/${check}.json`.\n- `location.file`\
  \ is relative to the workspace root. Include `package` whenever the finding belongs\
