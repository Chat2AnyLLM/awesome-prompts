  \ package entries with `source === \"project.json\"`: these are Nx-only projects,\
  \ not Turbo workspace packages. Use the helper below with parsed root config and\
  \ the remaining Turbo workspace packages shaped as `{ name, dir, turboConfig?, turboFile?\
  \ }`. `dir` comes from `workspace.json`; read `name` from that directory's `package.json`\
  \ manifest, not an Nx project name or directory fallback. An unreadable manifest\
  \ or missing manifest name makes that package's checks `partial` with the file and\
  \ reason. `turboConfig` is the package's own parsed config, and `turboFile` is its\
  \ workspace-relative path (defaults to `${dir}/turbo.json`). Do not use `workspace.json`'s\
  \ `tags`: those are Nx tags, not Turbo tags. Locate each emitted config key in the\
  \ original file and add `location.line` when available.\n\n```js\nfunction turboBoundaryConfigFindings({\
  \ version, config, packages, rootFile = 'turbo.json' }) {\n  const findings = [];\n\
  \  const stable = /^2\\.(\\d+)\\.\\d+$/.exec(version ?? '');\n  if (!stable || Number(stable[1])\
  \ < 5) {\n    return { findings, reason: `Turbo static boundary configuration checks\
  \ require verified stable 2.x >= 2.5.0; got ${version ?? 'unknown'}` };\n  }\n \
  \ for (const pkg of packages) {\n    if (pkg.turboConfig?.boundaries && Object.hasOwn(pkg.turboConfig.boundaries,\
  \ 'tags')) {\n      const file = pkg.turboFile ?? `${pkg.dir}/turbo.json`;\n   \
  \   findings.push({\n        id: 'boundaries/turbo-package-boundaries-tags',\n \
