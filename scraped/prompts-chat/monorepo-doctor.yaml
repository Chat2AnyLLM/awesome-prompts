  \  evidence: `${file}: boundaries.tags = ${JSON.stringify(pkg.turboConfig.boundaries.tags)}`,\n\
  \        fix: 'Move tag rules to the root boundaries.tags map, preserving existing\
  \ rules; keep package labels in top-level tags.',\n      });\n    }\n    if (config.boundaries?.tags\
  \ && Object.hasOwn(config.boundaries.tags, pkg.name)) {\n      findings.push({\n\
  \        id: 'boundaries/turbo-tag-package-name-collision',\n        severity: 'medium',\n\
  \        title: `Boundary tag ${pkg.name} collides with a workspace package name`,\n\
  \        location: { file: rootFile, package: pkg.name },\n        evidence: `${rootFile}:\
  \ boundaries.tags[${JSON.stringify(pkg.name)}] = ${JSON.stringify(config.boundaries.tags[pkg.name])};\
  \ ${pkg.dir}/package.json: name = ${JSON.stringify(pkg.name)}`,\n        fix: 'Rename\
  \ the rule tag and its package labels/tag references to a distinct label; preserve\
  \ allow/deny entries that intentionally refer to the package name.',\n      });\n\
  \    }\n  }\n  return { findings };\n}\n```\n\nMissing `boundaries`, absent/empty\
  \ rules, untagged packages, and tags with no rule are valid defaults: emit no missing/permissive/untagged\
  \ Turbo finding. Package names in `allow`/`deny` are explicitly supported; do not\
  \ confuse them with rule-map keys. Lists contain literal tags/package names, not\
  \ Nx-style wildcard constraints. An omitted `allow` permits all; `allow: []` restricts\
  \ all relations, not a permissive policy. Leave dependency/dependent policy evaluation\
  \ (including transitive relations and deny precedence) to `turbo boundaries`, rather\
  \ than approximating it from direct source imports.\n\n## Fix guidance\n\n- deep-import:\
  \ add the subpath to the target's `exports`, or re-export from its entry point,\
  \ then import from the package root.\n- oversized-package: identify clusters by\
  \ which consumers import which files (`scan.imports` subpaths); propose 2–3 splits\
  \ along clusters used by different consumers. If every consumer uses the same parts,\
  \ don't emit the finding.\n- nx-missing-module-boundaries-rule: add `@nx/enforce-module-boundaries`\
  \ with `depConstraints` based on `scope:*`/`type:*` tags.\n\n\x1FFILE:references/caching.md\x1E\
  \n# Check 3 — Task caching\n\nQuestion: will a cache hit ever replay a wrong result,\
  \ and are tasks re-running when they should hit?\nOutput: `findings/caching.json`.\
  \ If no orchestrator is detected, only `caching/uncached-root-script` applies; set\
  \ status `ok` with reason `no task orchestrator`.\n\nThese rules do not inspect\
  \ Bazel caching. For a Bazel-only workspace (no JS/Nx\npackages), write `{\"status\"\
  :\"skipped\",\"reason\":\"Bazel caching is not analyzed\",\"findings\":[]}`\nand\
  \ stop this check. In a mixed workspace, retain applicable JS/Nx/Turbo\nfindings\
  \ but mark the check `partial` with reason `Bazel caching is not analyzed`.\nFor\
  \ `uncached-root-script`, only Nx and Turborepo count as task orchestrators;\nthe\
  \ presence of Bazel alone does not establish how npm scripts are orchestrated.\n\
  \n## Facts the rules rely on\n\n- **Turborepo**: a task with no `outputs` caches\
  \ only logs — on a hit, `dist/` is NOT restored, so downstream tasks see stale or\
  \ missing files. A package's hash covers its own files, its `package.json`, `turbo.json`\
  \ and the lockfile; changes in workspace dependencies reach a task's hash **only**\
  \ through `dependsOn` entries with `^` (e.g. `^build`). Env vars affect the hash\
  \ only when listed in `env`, `globalEnv` (or `passThroughEnv` for runtime-only);\
  \ framework prefixes such as `NEXT_PUBLIC_`, `VITE_` are auto-included. Turbo 2\
  \ strict env mode can also restrict which env vars are visible to tasks, so undeclared\
  \ env is both a cache-key and runtime-visibility risk.\n- **Nx**: when `outputs`\
  \ is omitted, Nx caches `{workspaceRoot}/dist/{projectRoot}`, `{projectRoot}/dist`,\
  \ `{projectRoot}/build`, `{projectRoot}/public`. Env vars affect the hash only through\
  \ an `{ \"env\": \"NAME\" }` entry in `inputs`. Without a `production` named input\
  \ that excludes tests, editing a spec file invalidates the build cache.\n\n## Rules\n\
  \n| id | severity | detect |\n|---|---|---|\n| `caching/missing-outputs` | high\
  \ | **Turbo**: a cacheable task named `build`/`compile`/`bundle`/`*:build` (or whose\
  \ package script runs `tsc`, `vite build`, `tsup`, `rollup`, `webpack`, `next build`,\
  \ `esbuild`) has no `outputs`. Package-level `turbo.json` overrides count. **Nx**:\
  \ cacheable build-like target without `outputs` whose real out dir (`outDir` in\
  \ the build tsconfig, `outDir`/`--out-dir` flags, `build.outDir` in vite config)\
  \ is not one of Nx's defaults — one finding per affected project, with `package`.\
  \ Turbo findings are per task: `location.file: \"turbo.json\"`, no `package`. |\n\
  | `caching/build-inputs-include-tests` | low | **Turbo**: build-like task has no\
  \ `inputs`, or `inputs` that don't exclude test globs (`!**/*.test.*`, `!**/*.spec.*`,\
  \ `!**/__tests__/**`). **Nx**: no `production` named input, or `build` inputs don't\
  \ reference it, or `production` doesn't negate test globs. Low severity because\
  \ `$TURBO_DEFAULT$` already covers all git-tracked files; the finding is about avoiding\
  \ rebuilds when tests change, not correctness. Follow `dependsOn` chains: tests\
  \ hashed by a dependency task (e.g. a `transit` task, or `^build` of a package whose\
  \ build inputs include tests) also invalidate the build. Measure impact (step 3)\
  \ and put it in `evidence`. |\n| `caching/undeclared-env` | medium | for each `scan.env`\
  \ entry that can affect a cacheable task output. Flag build tasks only when the\
  \ build inlines env (Next/Vite framework bundlers, webpack/Rspack/Rsbuild `define`,\
  \ esbuild/tsup `define`, Rollup/plugin-replace, or similar bundlers), not runtime-only\
  \ reads in a plain `tsc` service. Always flag cacheable test tasks when tests execute\
  \ code that reads the env var (`scan.env.isTest`, or a test file in the package\
  \ imports the module with the env read), because a cached pass can be replayed under\
  \ a different value. **Turbo**: name not matched by the task's `env` or `globalEnv`\
  \ (`*` wildcards; `!` negation) and not framework-prefixed. `passThroughEnv` / `globalPassThroughEnv`\
  \ do **not** count: they make the var available without adding it to the hash, so\
  \ a cached result can still be replayed under a different value. **Nx**: no `{ \"\
  env\": NAME }` in the target's inputs (resolve named inputs). Ignore `CI`, `PATH`,\
  \ `HOME`, `TZ`, `PWD`. Ignore `NODE_ENV` only when the scan confirms it cannot affect\
  \ the output (e.g. the task's script or bundler sets it to a fixed value); otherwise\
  \ treat it like any other name. One finding per task config (Turbo task, or Nx target/targetDefault)\
  \ that is missing declarations: list every missing name with its packages and up\
  \ to 5 locations across all names, and set `location.package` only when a single\
  \ package is affected. |\n| `caching/turbo-cache-disabled` | low | Turbo task with\
  \ `cache: false` that is deterministic by name: `build`, `compile`, `bundle`, `lint`,\
  \ `typecheck`, `check-types`, `format:check`, or a unit `test` (`test`, `test:unit`,\
  \ `*:build`, `*:lint`). Treat `cache: false` as deliberate — and do **not** flag\
  \ — when the task is `persistent: true`; its name contains `dev`, `start`, `serve`,\
  \ `watch`, `deploy`, `release`, `publish`, `clean`, `db`, `migrat`, `seed`, `generate`,\
  \ `extract`, `sync`, `upload`, `e2e`, `integration`, or ends in `:ci`; or its `env`/`passThroughEnv`\
  \ lists external-state vars (`*DATABASE*`, `*DB_*`, `*REDIS*`, `*_URL`, `*TOKEN*`,\
  \ `*SECRET*`). Mention deliberately uncached tasks in `reason`, not as findings.\
  \ |\n| `caching/nx-cache-disabled` | low | An existing Nx target whose **effective**\
  \ configuration explicitly sets `cache: false` and whose name is deterministic by\
  \ the same allowlist as `caching/turbo-cache-disabled`. Resolve configuration as\
  \ below; never treat an omitted `cache` as explicit false. Apply the same deliberate-task\
  \ name exclusions, and skip `continuous: true`, watch-mode commands/options, long-running\
  \ servers, and targets with external-state env inputs (resolve named inputs; match\
  \ the external-state patterns above). Also skip when the command, executor, or configuration\
  \ shows side effects or external-state dependence despite a deterministic name (e.g.\
  \ `test` running integration tests). Mention deliberately uncached targets in `reason`,\
  \ not as findings. |\n| `caching/unstable-hash` | high | turbo installed: run `TURBO_TELEMETRY_DISABLED=1\
  \ ./node_modules/.bin/turbo run build --dry=json` twice; any task whose `hash` differs\
  \ between runs. Report the task and the `inputs`/`environmentVariables` that differ.\
  \ |\n| `caching/volatile-input` | high | non-negated task `inputs` or `globalDependencies`\
  \ include build artifacts or machine-local files: `dist`, `build`, `.turbo`, `.nx`,\
  \ `*.tsbuildinfo`, `**/*.log`, `node_modules`. Ignore negated globs (`!…`). Do not\
  \ flag `.env*` files: including env files usually makes caches more correct. |\n\
  | `caching/uncached-root-script` | low | a root `package.json` script that runs\
  \ tasks across packages bypassing the orchestrator: `-r`/`--recursive`, `--workspaces`/`-ws`,\
  \ `yarn workspaces foreach`, `lerna run`. In repos **without** an orchestrator,\
  \ say \"consider adding Nx or Turborepo\" in `fix`. |\n\n## Steps\n\n1. Read `turbo.json`\
  \ (Turbo v2 `tasks` and Turbo v1 `pipeline`, plus `//#task` root tasks and `${pkg}/turbo.json`\
  \ overrides with `\"extends\": [\"//\"]`) and/or `nx.json` + every `project.json`\
  \ / `package.json#nx`. For Nx, also read `targetDefaults` (including defaults keyed\
  \ by executor), `namedInputs`, and legacy `tasksRunnerOptions.*.options.cacheableOperations`,\
  \ and remember that Nx plugins (`plugins` in `nx.json`) can infer targets — if a\
  \ target exists only via plugin inference, report rules that depend on its config\
  \ as `partial` and say so.\n2. Apply the rules above. Quote the exact JSON in `evidence`\
  \ (task name + its config object). Config-level findings (Turbo tasks, Nx `targetDefaults`/`namedInputs`)\
  \ omit `location.package`; only set `package` when the problem is specific to one\
  \ package (e.g. its own `turbo.json`/`project.json`, or an env read in its source).\n\
  3. For `build-inputs-include-tests`, measure how often it matters with read-only\
  \ git: `git log --since=\"6 months ago\" --name-only --format=%x00%H` and count\
  \ commits whose changed files are all test files (`TEST` pattern from scan.md).\
  \ Report `N of M commits (P%) changed only tests`. Skip if the repo has no git history.\n\
  4. `unstable-hash` runs only when turbo is installed; otherwise mark the check `partial`\
  \ with reason `turbo not installed; dry-run hash comparison skipped`. Never run\
  \ real tasks — only `--dry=json`.\n5. Write `findings/caching.json`.\n\n### Resolving\
  \ Nx disabled-cache findings\n\n- Enumerate actual targets from project configuration,\
  \ `package.json` scripts / `nx.targets`, and available inferred-target data. A `targetDefaults`\
  \ entry does not itself create a target. Merge package configuration with `project.json`\
  \ (project configuration takes precedence for the same target).\n- Select the applicable\
  \ `nx.json#targetDefaults` for each target: a matching executor key takes precedence\
  \ over a target-name key; **do not merge both defaults**. Account for matching target-name\
  \ patterns and filtered defaults supported by the workspace's Nx version (see [Nx\
  \ target defaults](https://nx.dev/docs/reference/nx-json#target-defaults)). Before\
  \ applying a selected default, check Nx's target compatibility: skip it when both\
  \ it and the target specify different executors. For `nx:run-commands` / `nx:run-script`,\
  \ also respect the workspace version's command/script compatibility checks. An incompatible\
  \ default does not supply an effective `cache: false`. Apply compatible defaults\
  \ below explicit project/package target properties; an explicit project `cache:\
  \ true` overrides an inherited `cache: false`. Track which file and config object\
  \ supplies the effective false, not every false encountered in source files.\n-\
  \ Plugins can infer targets and properties such as executor, inputs, and cache settings.\
  \ Use already available resolved Nx project-graph configuration (see circular-deps.md)\
