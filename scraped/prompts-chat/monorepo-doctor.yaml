  \ lower severity and say so in `evidence`; do not guess.\n- Use only the ids defined\
  \ in the check reference files.\n\n## Severity rubric\n\n| Severity | Meaning |\n\
  |---|---|\n| critical | Wrong code can ship or tests are silently skipped for real\
