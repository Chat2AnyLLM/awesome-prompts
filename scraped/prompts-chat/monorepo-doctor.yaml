  \ local GitLab `include:` entries and local GitHub reusable workflows referenced\
  \ from these files.\n\n\x1FFILE:references/prod-leakage.md\x1E\n# Check 5 — Test\
  \ code in production\n\nQuestion: do test files, fixtures or test libraries end\
  \ up in a published package or a deployable build?\nOutput: `findings/prod-leakage.json`.\n\
  \nTest files are `scan.packages[p].testFiles` (the scan classifies `*.spec.*`, `*.test.*`,\
