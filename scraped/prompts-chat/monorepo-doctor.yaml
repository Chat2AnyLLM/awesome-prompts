  \ cell = (v) => safe(v).replace(/\\|/g, '\\\\|').replace(/\\r?\\n/g, '<br>');\n\
  const heading = (v) => safe(v).replace(/\\s*\\r?\\n\\s*/g, ' ');\n// Escape emphasis\
