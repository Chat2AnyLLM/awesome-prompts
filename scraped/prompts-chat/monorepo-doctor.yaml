  \ the exact source JSON, the effective target name and relevant overrides/inputs/command\
  \ so the exclusion and precedence decisions are reviewable. Do not duplicate a shared\
  \ default as one finding per project.\n\n## Fix guidance\n\n- missing-outputs (Turbo):\
  \ `\"outputs\": [\"dist/**\"]` (add `\".next/**\", \"!.next/cache/**\"` for Next.js).\n\
