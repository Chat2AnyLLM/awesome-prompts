  \ '', fence, safe(f.evidence), fence, '', ...fixLines, '');\n  }\n}\nif (!findings.length)\
  \ md.push('No findings. \U0001F389', '');\nfs.writeFileSync(path.join(outDir, 'monorepo-doctor-report.md'),\
  \ md.join('\\n'));\nconsole.log(JSON.stringify({ outDir, summary }));\nEOF\nnode\
  \ \"$W/render.mjs\" \"<output-dir>\"   # replace <output-dir> with a literal path;\
  \ use the user-given path, or omit it to write to <tmpdir>/monorepo-doctor-reports\n\
  ```\n\nTell the user the absolute report paths (the render step prints `outDir`).\n\
  \n## CI mode\n\nWhen the user asks for CI mode (or a fail threshold), write the\
  \ reports first. In hosted CI, the agent step itself may not be able to fail the\
  \ job reliably, so document/run this threshold check as a separate workflow step\
  \ against the report file:\n\n```bash\nnode -e '\nconst fs = require(\"node:fs\"\
  );\nconst path = require(\"node:path\");\nconst order = [\"low\", \"medium\", \"\
  high\", \"critical\"];\nconst reportPath = process.argv[1];\nconst threshold = process.argv[2]\
  \ || \"high\";\nconst min = order.indexOf(threshold);\nif (!reportPath || min ===\
  \ -1) {\n  console.error(\"usage: node -e <script> <report.json> <low|medium|high|critical>\"\
  );\n  process.exit(2);\n}\nconst r = JSON.parse(fs.readFileSync(path.resolve(reportPath),\
  \ \"utf8\"));\nconst bad = (r.findings ?? []).filter((f) => order.indexOf(f.severity)\
  \ >= min);\nfor (const f of bad) console.error(`${f.severity.toUpperCase()} ${f.id\
  \ ?? \"—\"} ${f.location?.file ?? \"—\"}`);\nprocess.exit(bad.length ? 1 : 0);\n\
  ' \"<output-dir>/monorepo-doctor-report.json\" high\n```\n\n\x1FFILE:references/scan.md\x1E\
  \n# Phase 2 — Source scan\n\nReads `workspace.json`, walks every package's source\
  \ files, and writes `$W/scan.json`:\n\n| key | content |\n|---|---|\n| `packages[name]`\
  \ | `{ sourceFiles, testFiles: [file], loc }` (`sourceFiles`/`loc` exclude tests\
  \ and generated files: `*.gen.*`, `*.generated.*`, `__generated__/`) |\n| `imports`\
  \ | every import that crosses a package boundary: `{ from, fromSource, target, kind,\
  \ spec, subpath, file, line, isTest, declared, deep }` |\n| `fileEdges[name]` |\
  \ intra-package `[fromFile, toFile]` edges from value imports (type-only imports\
  \ excluded) |\n| `env` | `{ package, file, line, name, isTest }` for `process.env.X`,\
  \ `process.env['X']`, `import.meta.env.X` |\n\n`kind`: `relative` (`../../other-pkg/src/x`),\
  \ `package` (`@scope/pkg/sub`), `alias` (tsconfig `paths`).\n`fromSource`: the importing\
  \ package's `source` from `workspace.json` (`package.json` or `project.json`).\n\
  `declared`: the importing package lists the target in any dependency field.\n`deep`:\
  \ the import bypasses the target's public API — any `relative` cross-package import,\
  \ a package subpath starting with `src/`, `lib/` or `internal/`, or a `src`/`lib`/`internal`\
  \ package subpath when the target has no `exports`, or any subpath not covered by\
  \ the target's `exports` keys. Alias imports are resolved to the target package\
  \ first; aliases to the target entry point stay non-deep, while aliases to any non-entry\
  \ file are deep.\n\n```bash\nW=\"$(node -p 'require(\"os\").tmpdir()')/monorepo-doctor\"\
  \ncat > \"$W/scan.mjs\" <<'EOF'\nimport fs from 'node:fs';\nimport os from 'node:os';\n\
  import path from 'node:path';\nconst work = path.join(os.tmpdir(), 'monorepo-doctor');\n\
  const ws = JSON.parse(fs.readFileSync(path.join(work, 'workspace.json'), 'utf8'));\n\
  const root = ws.root;\nconst SKIP_DIRS = new Set(['node_modules', 'dist', 'build',\
  \ 'out', 'coverage', '.turbo', '.next', '.nx', '.git', 'lib-cov', '.svelte-kit',\
  \ '.docusaurus', '.output', 'storybook-static', '.vercel', '.cache']);\nconst SRC\
  \ = /\\.(?:[cm]?[jt]sx?)$/;\nconst GENERATED = /(\\.gen|\\.generated)\\.[cm]?[jt]sx?$|(^|\\\
  /)__generated__\\//;\nconst TEST = /\\.(spec|test)\\.[cm]?[jt]sx?$|(^|\\/)(__tests__|__mocks__|test|tests|e2e|cypress)(\\\
  /|$)/;\nconst EXTS = ['.ts', '.tsx', '.mts', '.cts', '.js', '.jsx', '.mjs', '.cjs'];\n\
  const toPosix = (p) => p.split(path.sep).join('/');\nconst byDir = [...ws.packages].sort((a,\
  \ b) => b.dir.length - a.dir.length);\nconst owner = (relFile) => byDir.find((p)\
  \ => relFile === p.dir || relFile.startsWith(p.dir + '/'));\nconst byName = new\
  \ Map(ws.packages.map((p) => [p.name, p]));\n\nconst stripJsonc = (s) => s\n  .replace(/\"\
  (?:[^\"\\\\]|\\\\.)*\"|\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\//g, (m) => m[0] === '\"\
  ' ? m : '')\n  .replace(/\"(?:[^\"\\\\]|\\\\.)*\"|,(\\s*[}\\]])/g, (m, g) => g !==\
  \ undefined ? g : m);\nconst readJsonc = (p) => {\n  if (!fs.existsSync(p)) return\
  \ null;\n  try { return JSON.parse(stripJsonc(fs.readFileSync(p, 'utf8'))); }\n\
  \  catch (e) { console.error(`WARN: failed to parse ${toPosix(path.relative(root,\
  \ p))}: ${e.message}`); return null; }\n};\nconst tsBasePath = path.join(root, 'tsconfig.base.json');\n\
  const tsConfigPath = path.join(root, 'tsconfig.json');\nconst tsBaseJson = readJsonc(tsBasePath);\n\
  const tsConfigJson = readJsonc(tsConfigPath);\nconst tsBase = tsBaseJson?.compilerOptions?.paths\
  \ ? tsBaseJson : (tsConfigJson?.compilerOptions?.paths ? tsConfigJson : (tsBaseJson\
  \ ?? tsConfigJson ?? {}));\nconst baseUrl = path.join(root, tsBase.compilerOptions?.baseUrl\
  \ ?? '.');\nconst aliases = Object.entries(tsBase.compilerOptions?.paths ?? {})\n\
  \  .map(([k, v]) => ({ key: k, target: Array.isArray(v) ? v[0] : v }))\n  .filter((a)\
  \ => typeof a.target === 'string')\n  .sort((a, b) => (a.key.includes('*') - b.key.includes('*'))\
  \ || b.key.replace('*', '').length - a.key.replace('*', '').length);\nfunction matchAlias(spec)\
  \ {\n  return aliases.find((a) => a.key === spec || (a.key.endsWith('*') && spec.startsWith(a.key.slice(0,\
  \ -1))));\n}\n\nfunction walk(dir, out) {\n  let entries = [];\n  try { entries\
  \ = fs.readdirSync(dir, { withFileTypes: true }); } catch { return out; }\n  for\
  \ (const e of entries) {\n    if (e.isDirectory()) { if (!SKIP_DIRS.has(e.name))\
  \ walk(path.join(dir, e.name), out); }\n    else if (SRC.test(e.name) && !e.name.endsWith('.d.ts'))\
  \ out.push(path.join(dir, e.name));\n  }\n  return out;\n}\nfunction resolveFile(abs)\
  \ {\n  const cands = [abs, ...EXTS.map((e) => abs + e), ...EXTS.map((e) => path.join(abs,\
  \ 'index' + e))];\n  if (/\\.[cm]?js$/.test(abs)) cands.push(...['.ts', '.tsx',\
  \ '.mts', '.cts'].map((e) => abs.replace(/\\.[cm]?js$/, e)));\n  if (/\\.jsx$/.test(abs))\
  \ cands.push(abs.replace(/\\.jsx$/, '.tsx'));\n  return cands.find((c) => { try\
  \ { return fs.statSync(c).isFile(); } catch { return false; } }) ?? null;\n}\nfunction\
  \ exportEntries(pkg) {\n  if (typeof pkg.exports === 'string') return [['.', pkg.exports]];\n\
  \  if (pkg.exports && typeof pkg.exports === 'object') return Object.entries(pkg.exports).filter(([k,\
  \ v]) => k.startsWith('.') && v !== null);\n  return (pkg.exportKeys ?? []).map((k)\
  \ => [k, true]);\n}\nfunction covered(pkg, subpath) {\n  const entries = exportEntries(pkg);\n\
  \  if (!entries.length) return true;\n  const want = './' + subpath;\n  return entries.some(([k])\
  \ => k === want || (k.endsWith('/') && want.startsWith(k)) || (k.includes('*') &&\
  \ new RegExp('^' + k.split('*').map((s) => s.replace(/[.+?^${}()|[\\]\\\\]/g, '\\\
  \\$&')).join('.*') + '$').test(want)));\n}\nconst entryValues = (value) => {\n \
  \ if (typeof value === 'string') return [value];\n  if (value && typeof value ===\
  \ 'object') return Object.values(value).flatMap(entryValues);\n  return [];\n};\n\
  function isEntrySubpath(pkg, subpath) {\n  const norm = (s) => s.replace(/^\\.\\\
  //, '').replace(/\\.[cm]?[jt]sx?$/, '').replace(/\\/(?:index)$/, '/index');\n  const\
  \ bare = norm(subpath);\n  const entries = new Set(['index', 'src/index']);\n  if\
  \ (pkg.main) entries.add(norm(pkg.main));\n  if (typeof pkg.exports === 'string')\
  \ entries.add(norm(pkg.exports));\n  else if (pkg.exports && typeof pkg.exports\
  \ === 'object' && pkg.exports['.'] !== undefined && pkg.exports['.'] !== null) {\n\
  \    for (const v of entryValues(pkg.exports['.'])) entries.add(norm(v));\n  }\n\
  \  return entries.has(bare);\n}\nfunction lineStarts(text) {\n  const starts = [0];\n\
  \  for (let i = 0; i < text.length; i++) if (text.charCodeAt(i) === 10) starts.push(i\
  \ + 1);\n  return starts;\n}\nfunction lineAt(starts, idx) {\n  let lo = 0, hi =\
  \ starts.length - 1;\n  while (lo <= hi) {\n    const mid = (lo + hi) >> 1;\n  \
  \  if (starts[mid] <= idx) lo = mid + 1; else hi = mid - 1;\n  }\n  return hi +\
  \ 1;\n}\nconst stripComments = (s) => s.replace(/\\/\\*[\\s\\S]*?\\*\\//g, '').replace(/\\\
  /\\/[^\\n]*/g, '');\nfunction allNamedSpecifiersAreTypeOnly(clause = '') {\n  const\
  \ m = clause.match(/\\{([\\s\\S]*?)\\}/);\n  if (!m) return false;\n  const beforeBrace\
  \ = stripComments(clause.slice(0, m.index)).replace(/[\\s,]/g, '');\n  if (beforeBrace.length\
  \ > 0) return false;\n  const specs = stripComments(m[1]).split(',').map((s) =>\
  \ s.trim()).filter(Boolean);\n  return specs.length > 0 && specs.every((s) => /^type\\\
  s+[$\\w]+(?:\\s+as\\s+[$\\w]+)?$/.test(s));\n}\n\nconst scan = { packages: {}, imports:\
  \ [], fileEdges: {}, env: [] };\nfor (const pkg of ws.packages) {\n  const files\
  \ = walk(path.join(root, pkg.dir), []).filter((f) => owner(toPosix(path.relative(root,\
  \ f)))?.name === pkg.name);\n  const info = { sourceFiles: 0, testFiles: [], loc:\
  \ 0 };\n  const edges = [];\n  for (const abs of files) {\n    const file = toPosix(path.relative(root,\
  \ abs));\n    const packageRel = pkg.dir === '.' ? file : file.slice(pkg.dir.length\
  \ + 1);\n    const isTest = TEST.test(packageRel);\n    const text = fs.readFileSync(abs,\
  \ 'utf8');\n    const starts = lineStarts(text);\n    if (isTest) info.testFiles.push(file);\
  \ else if (!GENERATED.test(packageRel)) { info.sourceFiles++; info.loc += text.split('\\\
  n').length; }\n    const specs = [];\n    const importRe = /^[ \\t]*(import|export)\\\
  s+(type\\s+)?((?:(?!\\n[ \\t]*(?:import|export)\\b)[\\w$*{},\\s]|\\/\\/[^\\n]*\\\
  n|\\/\\*[\\s\\S]*?\\*\\/)*?\\bfrom\\s*)?['\"]([^'\"\\n]+)['\"]/gm;\n    for (const\
  \ m of text.matchAll(importRe)) {\n      if (m[2]) continue;\n      if (m[1] ===\
  \ 'export' && !m[3]) continue;\n      if (allNamedSpecifiersAreTypeOnly(m[3])) continue;\n\
  \      specs.push({ spec: m[4], line: lineAt(starts, m.index + m[0].search(/\\S/))\
  \ });\n    }\n    for (const m of text.matchAll(/\\b(?:import|require)\\s*\\(\\\
  s*['\"]([^'\"\\n]+)['\"]\\s*\\)/g)) {\n      const line = lineAt(starts, m.index);\n\
  \      if (/\\bimport\\s+type\\s+[\\w$]+\\s*=\\s*$/.test(text.slice(Math.max(0,\
  \ m.index - 200), m.index))) continue;\n      specs.push({ spec: m[1], line });\n\
  \    }\n    for (const m of text.matchAll(/\\bprocess\\.env\\.([A-Za-z_][\\w]*)|\\\
  bprocess\\.env\\[\\s*['\"]([^'\"]+)['\"]\\s*\\]|\\bimport\\.meta\\.env\\.([A-Za-z_][\\\
  w]*)/g)) {\n      scan.env.push({ package: pkg.name, file, line: lineAt(starts,\
  \ m.index), name: m[1] ?? m[2] ?? m[3], isTest });\n    }\n    for (const { spec,\
  \ line } of specs) {\n      let kind, target, subpath = '', resolved = null;\n \
  \     if (spec.startsWith('.')) {\n        resolved = resolveFile(path.resolve(path.dirname(abs),\
  \ spec));\n        const relTarget = toPosix(path.relative(root, resolved ?? path.resolve(path.dirname(abs),\
  \ spec)));\n        const t = owner(relTarget);\n        if (!t) continue;\n   \
  \     if (t.name === pkg.name) { if (resolved) edges.push([file, toPosix(path.relative(root,\
  \ resolved))]); continue; }\n        kind = 'relative'; target = t.name; subpath\
  \ = relTarget.slice(t.dir.length + 1);\n      } else {\n        const parts = spec.split('/');\n\
  \        const name = spec.startsWith('@') ? parts.slice(0, 2).join('/') : parts[0];\n\
  \        if (byName.has(name)) { kind = 'package'; target = name; subpath = parts.slice(spec.startsWith('@')\
  \ ? 2 : 1).join('/'); }\n        else {\n          const a = matchAlias(spec);\n\
  \          if (!a) continue;\n          const mapped = a.key.endsWith('*') ? a.target.replace('*',\
  \ spec.slice(a.key.length - 1)) : a.target;\n          resolved = resolveFile(path.resolve(baseUrl,\
  \ mapped)) ?? path.resolve(baseUrl, mapped);\n          const relResolved = toPosix(path.relative(root,\
  \ resolved));\n          const t = owner(relResolved);\n          if (!t || t.name\
  \ === pkg.name) continue;\n          kind = 'alias'; target = t.name; subpath =\
  \ relResolved.slice(t.dir.length + 1);\n        }\n      }\n      const tp = byName.get(target);\n\
  \      const entry = isEntrySubpath(tp, subpath);\n      const hasExports = exportEntries(tp).length\
  \ > 0;\n      const deep = kind === 'relative'\n        || (kind === 'alias' ? !entry\n\
  \          : (subpath !== '' && (hasExports ? !covered(tp, subpath) : /^(src|lib|internal)(\\\
  /|$)/.test(subpath))));\n      scan.imports.push({ from: pkg.name, fromSource: pkg.source,\
  \ target, kind, spec, subpath, file, line, isTest, declared: pkg.workspaceDeps.includes(target),\
  \ deep });\n    }\n  }\n  scan.packages[pkg.name] = info;\n  scan.fileEdges[pkg.name]\
  \ = edges;\n}\nfs.writeFileSync(path.join(work, 'scan.json'), JSON.stringify(scan,\
  \ null, 2));\nconsole.log(JSON.stringify({\n  packages: Object.keys(scan.packages).length,\n\
  \  crossPackageImports: scan.imports.length,\n  undeclared: scan.imports.filter((i)\
  \ => !i.declared).length,\n  deep: scan.imports.filter((i) => i.deep).length,\n\
  \  envReads: scan.env.length,\n}));\nEOF\nnode \"$W/scan.mjs\"\n```\n\nNotes for\
  \ the agent:\n- The scan is regex-based. Commented-out imports can produce false\
  \ positives — open the file at `line` to confirm before reporting.\n- Type-only\
  \ imports (`import type …`, `export type … from`, imports whose named specifiers\
  \ are all `type X`, and `import type X = require(…)`) are excluded because they\
  \ are erased at compile time.\n- `.vue`, `.svelte`, and `.astro` files are not scanned.\n\
  - Same-package aliases such as `@/x` produce no file edges; package-boundary checks\
  \ are unaffected.\n- Environment reads using destructuring, such as `const { API_URL\
  \ } = process.env`, are not detected.\n- Huge repos: the scan is linear in file\
  \ count and import/env match count, with line numbers resolved by precomputed offsets;\
  \ if it takes > 2 minutes, tell the user and proceed."
