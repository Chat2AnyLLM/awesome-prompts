  \ If inference or version-specific defaults cannot be resolved from available data,\
  \ mark caching `partial`, name the unresolved targets/configuration in `reason`,\
  \ and do not guess a finding. Independently provable explicit-false findings can\
  \ still be emitted.\n- Legacy `tasksRunnerOptions.*.options.cacheableOperations`\
  \ lists cacheable target names, not explicit disabled-cache declarations. A missing\
  \ entry (or missing modern `cache`) is **not** this rule. Check the workspace's\
  \ Nx version and active runner before interpreting `cache: false` alongside legacy/custom\
  \ runners; if the runner does not honor the property, do not report it as effective\
  \ disabled caching. If runner semantics cannot be established, mark that portion\
