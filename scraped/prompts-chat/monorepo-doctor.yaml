  b(npm\\|pnpm\\|yarn\\|bun\\|npx\\|nx\\|turbo)\\b[^\\n]*\\btest\\b\\|\\b(vitest\\\
  |jest\\|mocha)\\b\\|\\b(make\\|task\\|just)\\s+test\\b/` (each `\\|` is a Markdown\
  \ table escape for a regex alternation bar). If `ciFiles` is empty, set this check\
  \ status to `partial` with reason `no CI configuration found` and emit no `tests-not-run-in-ci`\
  \ finding. |\n| `ci-coverage/shallow-checkout-affected` | high | an affected/filtered\
  \ CI job lacks full base history. GitHub Actions: job runs `nx affected`, `turbo\
  \ … --affected`, or `--filter=…[${ref}]`, uses `actions/checkout`, and does **not**\
  \ set `fetch-depth: 0`. GitLab: affected logic is used while `GIT_DEPTH` is unset/nonzero\
  \ (default 20) or the MR target branch is not fetched. Azure: `checkout: self` lacks\
  \ `fetchDepth: 0`. Bitbucket: `clone: depth` is set while affected logic is used.\
  \ |\n| `ci-coverage/nx-affected-base-missing` | high | `nx affected` in CI with\
  \ no `--base`, no `nrwl/nx-set-shas` step, no `NX_BASE` env, and no `nx.json#defaultBase`.\
  \ |\n| `ci-coverage/turbo-invalid-comparison-base` | high | a pre-landing Turbo\
  \ test run uses `--affected` or a Git-qualified `--filter` / `-F` with a **proven\
  \ invalid comparison**: base and head resolve to the same commit, an explicit range\
  \ is malformed after expansion, or available CI evidence proves the range omits\
  \ changes that this job must test. Follow the comparison procedure below. Missing\
  \ explicit env vars, unavailable runtime values, and shallow history alone do not\
  \ satisfy this rule. |\n| `ci-coverage/nx-test-inputs-ignore-deps` | high | Nx `test`\
  \ target (targetDefaults or project) is cacheable and explicitly sets `inputs` with\
  \ no `^` dependency entry after resolving named inputs. Omitted `inputs` are ok\
  \ because Nx defaults to `default` + `^default`. |\n| `ci-coverage/turbo-test-missing-dependson`\
  \ | high | Turbo `test` (or `*:test`) task is cacheable and its `dependsOn` graph\
  \ has no transitive `^` entry. Follow local task indirections such as `\"transit\"\
  : { \"dependsOn\": [\"^transit\"] }`, `\"test\": { \"dependsOn\": [\"transit\"]\
  \ }`; that pattern satisfies the rule. |\n\n## Steps\n\n1. Read every file in `ciFiles`.\
  \ Also follow GitLab `include:` entries that point to local files and local reusable\
  \ GitHub workflows referenced with `uses: ./.github/workflows/x.yml`. For GitHub\
  \ Actions, reason per job: a checkout step's `with.fetch-depth` applies to the steps\
  \ after it in the same job. If there are no CI files, write `status: \"partial\"\
  `, `reason: \"no CI configuration found\"`, and do not emit `ci-coverage/tests-not-run-in-ci`.\n\
  \   Only Turbo options before its `--` task-argument delimiter count as affected/filtered\
  \ selection, including for `shallow-checkout-affected`.\n2. Resolve Nx targets as\
  \ in caching (targetDefaults merged with project config). Resolve Turbo tasks from\
  \ `turbo.json`/`pipeline` and package overrides.\n3. Apply the rules; quote the\
  \ CI step / config object as `evidence`.\n4. Write `findings/ci-coverage.json`.\n\
  \n## Turbo comparison-base validation\n\nThis is the Turbo counterpart to Nx base\
  \ validation, **not** a requirement to set a base explicitly.\n\n1. Follow CI commands\
  \ through local package scripts and wrappers without executing them. Scope this\
  \ rule to jobs that test changes before landing, as for `tests-not-run-in-ci`. Resolve\
  \ workflow, job, step and inline shell environment in execution order, including\
  \ `$GITHUB_ENV` writes and reusable-workflow inputs when their values are available.\
  \ An env value in another job or a later step does not configure this invocation.\
  \ Do not confuse flags after Turbo's `--` task-argument delimiter with Turbo options.\n\
  2. For `--affected`, `TURBO_SCM_BASE` and `TURBO_SCM_HEAD` override its comparison\
  \ endpoints; an omitted head defaults to `HEAD`. With neither override, accept Turbo's\
  \ documented defaults: the run reference describes `main...HEAD`; GitHub Actions\
  \ resolves PR bases using `GITHUB_BASE_REF` and push bases using `GITHUB_EVENT_PATH`\
  \ (`before`, with special first/force-push handling). Current implementations also\
  \ try `main` / `master` outside GitHub Actions. Check the repository's Turbo version\
  \ before relying on version-specific behavior. A non-`main` default branch, a push\
  \ event without `GITHUB_BASE_REF`, or no explicit base is **not by itself a finding**.\n\
  3. Explicit Git filters own their endpoints: `--filter='...[origin/main]'` compares\
  \ that ref to the working tree, including uncommitted changes; `--filter='...[base...head]'`\
  \ compares the merge-base to head. Prefix `...` includes dependents; it is not the\
  \ Git range separator inside `[]`. Accept both `--filter=value` and `--filter value`,\
  \ and `-F`. `TURBO_SCM_BASE` / `TURBO_SCM_HEAD` configure `--affected`, **not**\
  \ an explicit bracketed range. Package/directory-only filters and unfiltered full\
  \ test runs need no Git base. Account for all selectors: positive filters form a\
  \ union, exclusions subtract, and on versions supporting `--affected` with `--filter`,\
  \ they intersect; an empty selector alone does not prove tests are omitted when\
  \ another selector covers them.\n4. Emit one finding per independently broken invocation\
  \ only with evidence of a bad comparison and its effect on the required test selection.\
  \ Examples: a clean checkout followed by `TURBO_SCM_BASE=HEAD turbo run test --affected`\
  \ with default head; identical explicit endpoints `[HEAD...HEAD]`; or `...[${BASE}...HEAD]`\
  \ when CI demonstrably expands `BASE` to an empty string. A previous-commit base\
  \ such as `HEAD^` is not inherently wrong (e.g. intentional per-commit push testing);\
  \ flag it only when available evidence proves it misses required changes, such as\
  \ earlier commits in a multi-commit PR. Do not assume two different refs resolve\
  \ to the same commit, or that a historical range is wrong merely because it does\
  \ not end at `HEAD`.\n5. Unknown secret/output/input values, external wrappers,\
  \ missing CI event data, or insufficient history are **unavailable evidence**, not\
  \ proven invalid refs. Emit no speculative finding; set `ci-coverage` to `partial`\
  \ and explain the unresolved comparison in `reason`, retaining other evidenced findings.\
  \ Do not claim `--affected` silently skips tests when it cannot resolve history:\
  \ its documented fallback selects all packages (remaining filters can still narrow\
  \ them). Explicit Git filters can instead fail on unresolved refs; they do not inherit\
  \ that fallback. Use `shallow-checkout-affected` alone when fetching history is\
  \ the fix; add this finding only for a separate bad-range root cause that full history\
  \ would not fix.\n\nFor each finding, locate the Turbo invocation (`location.file`\
  \ and line), quote its effective selector/env and relevant checkout/event configuration\
  \ in `evidence`, explain why the comparison fails or omits required tests, and give\
  \ a concrete correction. Do not raise a separate missing-base finding for each unset\
  \ environment variable.\n\nFor an unknown runtime comparison value, include the\
  \ CI filename, the wording `unavailable runtime comparison`, and the unresolved\
  \ variable or input in the partial check's `reason`.\n\nAuthoritative semantics:\
  \ [run: affected and filters](https://turborepo.com/docs/reference/run#--affected),\
  \ [system environment variables](https://turborepo.com/docs/reference/system-environment-variables),\
  \ and [constructing CI: GitHub Actions defaults and fallback](https://turborepo.com/docs/crafting-your-repository/constructing-ci#using---affected-in-github-actions).\
  \ Implementation details can be checked in [`git.rs`](https://github.com/vercel/turborepo/blob/4485b660b2773d0700290521df228d73017205dc/crates/turborepo-scm/src/git.rs)\
  \ and [`target_selector.rs`](https://github.com/vercel/turborepo/blob/4485b660b2773d0700290521df228d73017205dc/crates/turborepo-scope/src/target_selector.rs);\
  \ do not assume the latest implementation matches an older installed version.\n\n\
  ## Fix guidance\n\n- undeclared-workspace-dependency: add `\"${target}\": \"workspace:*\"\
  ` (pnpm/yarn/bun) or `\"*\"` (npm) to the importer's dependencies, and import via\
  \ the package name.\n- shallow-checkout-affected: `with: { fetch-depth: 0 }` on\
  \ `actions/checkout`.\n- nx-affected-base-missing: add `- uses: nrwl/nx-set-shas@v4`\
  \ before `nx affected`.\n- turbo-invalid-comparison-base: remove a self-comparing\
  \ `TURBO_SCM_BASE` / `TURBO_SCM_HEAD` override when the documented CI defaults cover\
  \ the job. Otherwise supply the intended CI base/head, or correct the refs inside\
  \ the explicit Git filter itself (setting `TURBO_SCM_BASE` does not repair that\
  \ filter). On a PR job, for example, use the PR base/head SHAs with `--affected`\
  \ and full history; preserve valid event-specific push handling rather than applying\
  \ a PR-only variable to every event.\n- nx-test-inputs-ignore-deps: `\"test\": {\
  \ \"inputs\": [\"default\", \"^production\"] }`.\n- turbo-test-missing-dependson:\
  \ `\"test\": { \"dependsOn\": [\"^build\"] }` (or `[\"^test\"]` when tests run on\
  \ sources).\n\n\x1FFILE:references/circular-deps.md\x1E\n# Check 2 — Circular dependencies\n\
  \nOutput: `findings/circular-deps.json`.\n\nFor a Bazel-only workspace (`workspace.json`\
  \ has no JS/Nx packages), write\n`{\"status\":\"skipped\",\"reason\":\"Bazel dependency\
  \ and Java source cycles are not analyzed\",\"findings\":[]}`\nand stop this check.\
  \ For a mixed workspace, report `partial` because Bazel and\nnon-JS source cycles\
  \ are not covered, while retaining JS/Nx findings.\n\n| id | severity | detect |\n\
  |---|---|---|\n| `circular-deps/package-cycle` | high | a strongly connected component\
  \ (SCC) in the package graph (`workspaceDeps`, or the Nx project graph when Nx is\
  \ installed). One finding per SCC. |\n| `circular-deps/file-cycle` | medium when\
  \ eager, low when deferred, skipped when idiomatic (see step 3) | an SCC of 2+ files\
  \ among a package's own files (`scan.fileEdges`). One finding per SCC, not per simple\
  \ cycle: cycles that share files share a fix. |\n\nPackage cycles break topological\
  \ builds (`^build` order is undefined), cause stale caches and make packages unpublishable\
  \ independently.\nFile cycles cause `undefined`/TDZ errors only when a module reads\
  \ an imported binding **while it is being evaluated** (eager). When every cross-edge\
  \ use is deferred (inside a function, component render or callback), ESM live bindings\
  \ make it work at runtime and the cost is coupling: larger bundles/chunks, Fast\
  \ Refresh full reloads, and tests that need mocks to break the cycle.\n\n## Steps\n\
  \n1. If Nx is installed, refresh the graph and use it as the package graph:\n  \
  \ ```bash\n   W=\"$(node -p 'require(\"os\").tmpdir()')/monorepo-doctor\"\n   rm\
  \ -f \"$W/nx-graph.json\" \"$W/nx-graph.failed\"\n   NX_DAEMON=false NX_NO_CLOUD=true\
  \ NX_WORKSPACE_DATA_DIRECTORY=\"$W/nx-data\" ./node_modules/.bin/nx graph --file=\"\
  $W/nx-graph.json\" \\\n     || touch \"$W/nx-graph.failed\"\n   ```\n   The file\
  \ has `graph.dependencies[project] = [{ target }]`. Otherwise use `workspace.json`\
  \ `workspaceDeps`.\n   If Turborepo is installed, `TURBO_TELEMETRY_DISABLED=1 ./node_modules/.bin/turbo\
  \ run build --dry=json` failing with a message containing `cyclic` is also evidence.\
  \ Turbo dry-run JSON writes no project files beyond Turborepo's own cache directory.\n\
  \   Status: the `workspaceDeps` graph is complete for package.json-based workspaces,\
  \ so missing turbo does **not** make this check partial. Under Nx without a local\
  \ install, mark `partial` with reason `nx not installed; project graph inferred\
  \ from package.json only`; if Nx is installed but `nx graph` fails, mark `partial`\
  \ with reason `nx graph failed; project graph inferred from package.json only` (Nx\
  \ also infers edges from imports and `implicitDependencies`).\n2. Run the cycle\
  \ snippet:\n\n```bash\nW=\"$(node -p 'require(\"os\").tmpdir()')/monorepo-doctor\"\
  \ncat > \"$W/cycles.mjs\" <<'EOF'\nimport fs from 'node:fs';\nimport os from 'node:os';\n\
  import path from 'node:path';\nconst work = path.join(os.tmpdir(), 'monorepo-doctor');\n\
  const ws = JSON.parse(fs.readFileSync(path.join(work, 'workspace.json'), 'utf8'));\n\
  const scan = JSON.parse(fs.readFileSync(path.join(work, 'scan.json'), 'utf8'));\n\
  const nxGraphPath = path.join(work, 'nx-graph.json');\nconst hasBazel = ws.orchestrators.some((o)\
  \ => o.name === 'bazel');\nif (hasBazel && !ws.packages.length) {\n  fs.writeFileSync(path.join(work,\
  \ 'findings', 'circular-deps.json'), JSON.stringify({\n    status: 'skipped', reason:\
  \ 'Bazel dependency and Java source cycles are not analyzed', findings: [],\n  },\
  \ null, 2));\n  process.exit(0);\n}\n\n// Tarjan: strongly connected components\
  \ with 2+ nodes (or a self-loop), nodes sorted.\nfunction sccs(graph) {\n  const\
  \ index = new Map(), low = new Map(), onStack = new Set(), stack = [], out = [];\n\
  \  let i = 0;\n  const visit = (n) => {\n    index.set(n, i); low.set(n, i++); stack.push(n);\
  \ onStack.add(n);\n    for (const m of graph.get(n) ?? []) {\n      if (!index.has(m))\
  \ { visit(m); low.set(n, Math.min(low.get(n), low.get(m))); }\n      else if (onStack.has(m))\
  \ low.set(n, Math.min(low.get(n), index.get(m)));\n    }\n    if (low.get(n) ===\
  \ index.get(n)) {\n      const comp = [];\n      let m;\n      do { m = stack.pop();\
  \ onStack.delete(m); comp.push(m); } while (m !== n);\n      if (comp.length > 1\
  \ || (graph.get(n) ?? []).includes(n)) out.push(comp.sort());\n    }\n  };\n  for\
  \ (const n of graph.keys()) if (!index.has(n)) visit(n);\n  return out;\n}\nconst\
  \ innerEdges = (graph, comp) => comp.flatMap((a) => (graph.get(a) ?? []).filter((b)\
  \ => comp.includes(b)).map((b) => [a, b]));\n\nconst nx = ws.orchestrators.find((o)\
  \ => o.name === 'nx');\nconst graphFailed = Boolean(nx?.installed) && (fs.existsSync(path.join(work,\
  \ 'nx-graph.failed')) || !fs.existsSync(nxGraphPath));\nconst useNxGraph = Boolean(nx?.installed)\
  \ && !graphFailed;\nlet pkgGraph;\nif (useNxGraph) {\n  const g = JSON.parse(fs.readFileSync(nxGraphPath,\
  \ 'utf8')).graph;\n  pkgGraph = new Map(Object.entries(g.dependencies).map(([k,\
  \ v]) => [k, v.map((d) => d.target).filter((t) => g.nodes[t])]));\n} else {\n  pkgGraph\
  \ = new Map(ws.packages.map((p) => [p.name, p.workspaceDeps]));\n}\nconst byName\
  \ = new Map(ws.packages.map((p) => [p.name, p]));\nconst findings = [];\nfor (const\
  \ c of sccs(pkgGraph)) {\n  const first = byName.get(c[0]);\n  findings.push({\n\
  \    id: 'circular-deps/package-cycle', severity: 'high',\n    title: `Package cycle:\
  \ ${c.join(' ↔ ')}`,\n    location: { file: first ? `${first.dir}/package.json`\
  \ : 'package.json', package: c[0] },\n    evidence: innerEdges(pkgGraph, c).map(([a,\
  \ b]) => `${a} depends on ${b}`).join('\\n'),\n    fix: 'Extract the shared code\
  \ into a new package both can depend on, or invert one edge (dependency injection\
  \ / events). Remove the back-edge from package.json.',\n  });\n}\nfor (const [pkg,\
  \ edges] of Object.entries(scan.fileEdges)) {\n  const g = new Map();\n  for (const\
  \ [a, b] of edges) { if (!g.has(a)) g.set(a, []); g.get(a).push(b); }\n  for (const\
  \ c of sccs(g)) {\n    const e = innerEdges(g, c);\n    findings.push({\n      id:\
  \ 'circular-deps/file-cycle', severity: 'low',\n      title: `File cycle in ${pkg}\
  \ (${c.length} files)`,\n      location: { file: c[0], package: pkg },\n      evidence:\
  \ e.slice(0, 15).map(([a, b]) => `${a} → ${b}`).join('\\n') + (e.length > 15 ? `\\\
  n… ${e.length - 15} more edges` : ''),\n      fix: 'Move the shared symbols into\
  \ a third module that both import, or merge the files.',\n    });\n  }\n}\nconst\
  \ status = (nx && !useNxGraph) || hasBazel ? 'partial' : 'ok';\nconst result = {\
  \ status, findings };\nif (status === 'partial') result.reason = [\n  ...(nx &&\
  \ !useNxGraph ? [graphFailed\n    ? 'nx graph failed; project graph inferred from\
  \ package.json only'\n    : 'nx not installed; project graph inferred from package.json\
  \ only'] : []),\n  ...(hasBazel ? ['Bazel dependency and non-JS source cycles are\
  \ not analyzed'] : []),\n].join('; ');\nfs.writeFileSync(path.join(work, 'findings',\
  \ 'circular-deps.json'), JSON.stringify(result, null, 2));\nconsole.log(JSON.stringify({\
  \ packageCycles: findings.filter((f) => f.id.endsWith('package-cycle')).length,\
  \ fileCycles: findings.filter((f) => f.id.endsWith('file-cycle')).length }));\n\
  EOF\nnode \"$W/cycles.mjs\"\n```\n\n3. Review every `file-cycle` finding (the snippet\
  \ writes them as `low`; you must classify each before rendering). For each edge\
  \ in `evidence`, open the import line and find where each imported name is used\
  \ in the importing file.\n   - **Drop** an edge that is not a real value import\
  \ (inside a comment, type-only). Drop the finding if the component no longer has\
  \ a cycle.\n   - **Eager** — an imported binding is read during module evaluation:\
  \ a top-level call or property read, `class X extends Imported`, a top-level object/array/spread\
  \ built from it, decorator arguments, or a top-level `const` initialized from it.\
  \ Any eager edge → `severity: \"medium\"`; quote the eager line in `evidence`.\n\
  \   - **Deferred** — every use is inside a function body, component render, hook,\
  \ or callback → keep `low`.\n   - **Idiomatic, skip** — all edges deferred and the\
  \ files are ORM schema/entity modules using lazy references (Drizzle `.references(()\
  \ => t.id)` / `relations(...)`, TypeORM/MikroORM `() => Entity` decorators, Sequelize/Objection\
  \ associations set up in functions). Remove the finding and add `\"N idiomatic ORM\
  \ schema cycles skipped (lazy references)\"` to `reason`.\n   - **Cost evidence**\
  \ (add to `evidence` when present): a `.tsx`/`.jsx` file in the cycle that exports\
  \ a non-component value next to components (React Fast Refresh falls back to a full\
  \ reload when it is edited); test files that `vi.mock`/`jest.mock` a module in the\
  \ cycle.\n   - **Fix:** name the back-edge — the smallest set of exported symbols\
  \ that, moved into a new module, breaks the cycle (e.g. \"Move `tabLabel` from `shell.tsx`\
  \ to `workspace/tab-label.ts`; import it from shell, coach-sheet and saved\").\n\
  \   - Rewrite `title` to name the files and the shared symbol, e.g. `shell.tsx ↔\
  \ coach-sheet.tsx, saved.tsx via tabLabel`.\n4. If more than 20 file-cycle components\
  \ exist in one package, keep the 20 smallest and add `\"reason\": \"N file-cycle\
  \ components; showing 20 smallest\"` with status `partial`.\n\x1FFILE:references/detection.md\x1E\
  \n# Phase 1 — Detection\n\nGoal: build an inventory at `$W/workspace.json`. Every\
  \ later phase reads it.\n\nRequires Node ≥ 22.5 because this phase uses `fs.globSync`\
  \ and `path.matchesGlob`. The snippet below exits 2 with `monorepo-doctor requires\
  \ Node >= 22.5` when either API is missing.\nThis phase resets the work directory.\
  \ In every shell, start with `W=\"$(node -p 'require(\"os\").tmpdir()')/monorepo-doctor\"\
  `; all later phases reuse `$W`, and you should recompute it in each new shell. `os.tmpdir()`\
  \ honors `TMPDIR`: if the default temp dir is not writable in your environment,\
  \ `export TMPDIR=<writable dir outside the audited repo>` in every shell before\
  \ computing `$W`, so the shell and the Node snippets agree.\n\nRun from the workspace\
  \ root (the directory the user pointed at; default: current directory):\n\n```bash\n\
  W=\"$(node -p 'require(\"os\").tmpdir()')/monorepo-doctor\"\nmkdir -p \"$W\"\ncat\
  \ > \"$W/detect.mjs\" <<'EOF'\nimport fs from 'node:fs';\nimport os from 'node:os';\n\
  import path from 'node:path';\nif (typeof fs.globSync !== 'function' || typeof path.matchesGlob\
  \ !== 'function') {\n  console.error('monorepo-doctor requires Node >= 22.5');\n\
  \  process.exit(2);\n}\nconst root = path.resolve(process.argv[2] ?? '.');\nconst\
  \ work = path.join(os.tmpdir(), 'monorepo-doctor');\nfs.rmSync(work, { recursive:\
  \ true, force: true });\nfs.mkdirSync(path.join(work, 'findings'), { recursive:\
  \ true });\nconst toPosix = (p) => p.split(path.sep).join('/');\nconst readJson\
  \ = (p) => { try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch { return\
  \ null; } };\nconst exists = (p) => fs.existsSync(path.join(root, p));\n\nconst\
  \ pm = exists('pnpm-lock.yaml') || exists('pnpm-workspace.yaml') ? 'pnpm'\n  : exists('bun.lockb')\
  \ || exists('bun.lock') ? 'bun'\n  : exists('yarn.lock') ? 'yarn'\n  : exists('package-lock.json')\
  \ ? 'npm' : 'unknown';\n\nconst rootPkg = readJson(path.join(root, 'package.json'))\
  \ ?? {};\nconst stripYamlComment = (s) => {\n  let out = '', quote = null;\n  for\
  \ (let i = 0; i < s.length; i++) {\n    const ch = s[i];\n    if (quote) { if (ch\
  \ === quote && s[i - 1] !== '\\\\') quote = null; out += ch; }\n    else if (ch\
  \ === '\"' || ch === \"'\") { quote = ch; out += ch; }\n    else if (ch === '#')\
  \ break;\n    else out += ch;\n  }\n  return out.trim();\n};\nconst unquote = (s)\
  \ => stripYamlComment(s).trim().replace(/^['\"]|['\"]$/g, '').trim();\nconst splitFlow\
  \ = (s) => {\n  const out = [];\n  let cur = '', quote = null;\n  for (let i = 0;\
  \ i < s.length; i++) {\n    const ch = s[i];\n    if (quote) { if (ch === quote\
  \ && s[i - 1] !== '\\\\') quote = null; cur += ch; }\n    else if (ch === '\"' ||\
  \ ch === \"'\") { quote = ch; cur += ch; }\n    else if (ch === ',') { const v =\
  \ unquote(cur); if (v) out.push(v); cur = ''; }\n    else cur += ch;\n  }\n  const\
  \ v = unquote(cur); if (v) out.push(v);\n  return out;\n};\nfunction pnpmWorkspaceGlobs(file)\
  \ {\n  const lines = fs.readFileSync(file, 'utf8').split(/\\r?\\n/);\n  const globs\
  \ = [];\n  for (let i = 0; i < lines.length; i++) {\n    const m = lines[i].match(/^packages:\\\
  s*(.*)$/);\n    if (!m) continue;\n    const rest = stripYamlComment(m[1]);\n  \
  \  if (rest.startsWith('[') && rest.endsWith(']')) globs.push(...splitFlow(rest.slice(1,\
  \ -1)));\n    for (let j = i + 1; j < lines.length; j++) {\n      const line = lines[j];\n\
  \      if (!line.trim() || line.trimStart().startsWith('#')) continue;\n      const\
  \ item = line.match(/^\\s*-\\s*(.+)$/);\n      if (item) { const v = unquote(item[1]);\
  \ if (v) globs.push(v); continue; }\n      if (/^\\S/.test(line)) break;\n    }\n\
  \    break;\n  }\n  return globs;\n}\nlet globs = [];\nif (exists('pnpm-workspace.yaml'))\
  \ {\n  globs = pnpmWorkspaceGlobs(path.join(root, 'pnpm-workspace.yaml'));\n  if\
  \ (!globs.length) console.error('WARN: pnpm-workspace.yaml contains no package globs');\n\
  }\nif (!globs.length) globs = Array.isArray(rootPkg.workspaces) ? rootPkg.workspaces\
  \ : rootPkg.workspaces?.packages ?? [];\nconst include = globs.filter((g) => !g.startsWith('!'));\n\
  const exclude = globs.filter((g) => g.startsWith('!')).map((g) => g.slice(1).replace(/\\\
  /$/, ''));\nconst isExcluded = (dir) => exclude.some((g) => path.matchesGlob(dir,\
  \ g) || path.matchesGlob(`${dir}/package.json`, `${g}/package.json`));\n\nconst\
