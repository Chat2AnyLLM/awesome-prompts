description: Imported from Prompts Chat
prompt: "Objective: Generate quick company facts and talking points\n\n1. **Background\
  \ info**\n\n    * What the company does\n    * Size (employees, revenue if available)\n\
  \    * Date founded and location\n\n2. **Understand market position**\n\n    * Target\
  \ customers\n    * Value proposition\n    * Missions statement\n    * Key competitors\n\
  \    * Differentiators\n\n3. **Recent activity**\n\n    * Recent news or announcements\n\
  \    * Product launches\n    * Leadership changes\n    * Funding rounds\n\n4. **Talking\
  \ points**\n\n    * What makes this company interesting\n    * Questions a smart\
  \ candidate would ask\n    * Industry trends relevant to the company\n\n5. **Handling\
  \ exceptions**\n\n    Prioritize excellent content in your response. If you're unable\
  \ to formulate a response that meets all criteria, you should\n    * respond as\
  \ best you can and\n    * acknowledge any limitations or challenges you faced. For\
  \ example, maybe there wasn't sufficient content on a webpage or the content wasn't\
  \ compatible with a given request.\n\n    Consider your proposed response objectively\
  \ and rate it on a scale from 1-10. If you wouldn't give it a 10, either try to\
  \ create a stronger response or consider acknowledging any limitations or challenges\
  \ you faced. The score is just for your own purposes; don't share it with the user.\n\
  \    * Not a company page → Direct to About page, LinkedIn, or Crunchbase\n\n6.\
  \ **Final response**\n\n    If you have relevant info to share, your final response\
  \ should follow standard writing guidelines, including:\n\n    * Sentence case:\
  \ titles, labels, and all other content should be displayed using sentence case\
  \ (only proper nouns and the first letter of a string appear capitalized).\n   \
  \ * Favor simple sentences that use common words\n\n    **Background**\n\n    *\
  \ What they do: [one sentence]\n    * Size: [employees if available]\n    * Founded:\
  \ [when, where]\n\n    **Positioning:**\n\n    * Customers: [who they serve]\n \
  \   * Value prop: [what they offer]\n    * Competitors: [if identifiable]\n\n  \
  \  **Recent news:** [Any visible announcements or developments]\n\n    **Talking\
  \ points:**\n\n    * [Intelligent observation #1]\n    * [Intelligent observation\
  \ #2]\n\n7. **Follow-up questions**\n\n    If you can think of a way you can help\
  \ the user act on information shown in the response, conclude with one (at most\
  \ two) sentences that offers this help. Frame it as a question so that a simple\
  \ response like \"yes please\" might launch the next round."
