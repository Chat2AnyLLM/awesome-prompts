prompt: 'Construction hyperlapse of one man building an entire data center on an empty
  flat plot, one continuous locked-off wide shot. The builder is [describe your builder,
  e.g. a stocky man in his 40s in a hi-vis vest, hard hat, work trousers and muddy
  boots, or attach a reference image of your character]. The camera is fixed on a
  tall tripod at the edge of the plot, looking across graded ground toward a distant
  tree line. The camera stays completely fixed: no pan, tilt, zoom, reframing or cuts.


  Time runs extremely fast. The man is always mid-task with motion blur, and the building
  grows only because he works.


  0-2s: Bare levelled ground. He walks in and pegs out a huge rectangle with stakes
  and string.

  2-4s: Concrete foundation slab spreads across the rectangle as he screeds it.

  4-6s: Grey steel frame and wall panels rise around him.

  6-8s: Flat roof goes on, rooftop cooling units and a row of diesel generators appear
  beside the building.

  8-10s: Cable trunks run in, the finished windowless data center stands complete
  and he walks to the door. Hold on the finished building.


  Shot on iPhone 15 Pro ultra-wide. Overcast daylight, soft shadows. Mud, dust, concrete
  splashes. Natural motion blur, 24fps, muted realistic colour, subtle grain.


  Sound: drills, hammering, concrete mixer and steel clanks only. No music, no speech.


  The camera position and horizon stay identical throughout. One man only. No morphing
  or dissolves, no floating materials, no text, no legible logos.'
