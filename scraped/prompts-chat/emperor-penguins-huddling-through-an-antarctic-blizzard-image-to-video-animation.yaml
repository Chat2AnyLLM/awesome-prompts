title: Emperor Penguins Huddling Through an Antarctic Blizzard (Image-to-Video Animation)
description: Imported from Prompts Chat
prompt: 'Use the attached still (step 1: a photorealistic telephoto photograph of
  about forty emperor penguins pressed into a dense huddle on Antarctic sea ice in
  a blizzard, two grey chicks on their parents'' feet at the left, snow streaking
  from right to left in blue polar twilight) as the exact first frame and animate
  it into an 8-second, 16:9 cinematic shot. Keep every element as it is in the still:
  the size and shape of the huddle, the two chicks at the left, the faint ice cliffs,
  the pink-violet glow on the far left horizon and the cold blue light.


  Motion (0-8 s):

  - 0-3 s: the frozen snow starts moving; gusts drive fine snow from right to left
  across the frame; penguins in the huddle shuffle in tiny steps, heads shifting and
  shoulders pressing closer.

  - 3-6 s: the slow rolling movement of a real huddle: birds on the windward right
  edge waddle a few steps along the side toward the sheltered left side; frost on
  their backs glints; one chick lifts its head, blinks and settles back against its
  parent.

  - 6-8 s: a stronger gust sweeps a wave of blowing snow over the huddle, the birds
  lower their heads, and the group stays tight together as the snow thins slightly.


  Camera: locked-off telephoto shot with a very slow push-in (about 5 percent), subtle
  wind shake only; focus stays on the front row; no cuts, no zoom jumps.


  Ambient motion: drifting spindrift low over the ice, snow building on backs and
  heads, faint movement of the haze in the background.


  Lighting and mood: constant soft blue polar twilight with the faint pink glow on
  the left; quiet, harsh and tender at the same time.


  Sound: off (silent clip).


  Avoid: people, vehicles, penguins flying or swimming, birds merging or morphing,
  extra heads or wings, penguins walking out of the huddle across the frame, sudden
  daylight, text.'
