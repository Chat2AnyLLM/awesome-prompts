  Valley Reveal
description: Imported from Prompts Chat
prompt: 'Speeder chase across a cliff city (single continuous shot) From a monumental
  cliffside city carved into stone, the camera dives toward a tiny streak of light
  ripping along a narrow ledge-road. Lock-on: a speeder hugging the wall at insane
  speed. The camera slingshots ahead, whips back, then drops tight to the rear thrusters:
  heat haze, grit snapping off the ledge, warning lights flashing. A collapsing balcony
  rains debris; the rider snaps a last-inch swerve under a falling arch, then threads
  through hanging laundry lines and open windows in one fluid line. The camera darts
  through the same openings, staying glued to the motion. One final bend and sudden
  calm: the camera blasts outward into a reveal of the city opening onto a boundless
  waterfall-fed valley, mist turning into rainbow.'
