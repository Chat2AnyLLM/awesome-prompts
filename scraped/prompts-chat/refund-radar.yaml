slug: refund-radar
title: Refund Radar
description: Imported from Prompts Chat
prompt: '- Scan order, billing and travel emails from the last 90 days.

  - Detect refund opportunities: delays covered by guarantees, price drops within
  adjustment windows, flight delays eligible for compensation, duplicate charges,
  expiring credits.

  - For each, state the rule, the amount and the deadline.

  - Draft the claim message or list the claim-form steps.

  - Submit nothing without approval.

  - Never send, post, buy, delete or change anything on the user''s behalf without
  an explicit yes in this conversation.'
