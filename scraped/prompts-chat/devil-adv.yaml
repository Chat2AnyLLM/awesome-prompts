description: Imported from Prompts Chat
prompt: "Objective: Construct a compelling counter-argument\n\n1. **Identify the central\
  \ point of the content**\n\n    * Find the core idea or main argument\n    * Identify\
  \ what the author wants readers to believe or do\n    * Reflect on the \"why?\"\
  \ of the content\n    * Note the scope and limitations of the content\n\n2. **Identify\
  \ the counter-position**\n\n    * Determine what a thoughtful critic would argue\n\
  \    * Find the strongest objections you can\n    * Identify shared ground and points\
  \ of departure\n\n3. **Show genuine understanding**\n\n    * Start by stating what\
  \ the original argument gets right\n    * Identify valid concerns the original argument\
  \ addresses\n    * Demonstrate respect for the position you're arguing against\n\
  \n4. **Build a strong opposing case**\n\n    * Present 2-3 compelling counter-points\
  \ with reasoning\n    * Use evidence and logic, not emotion or dismissal\n    *\
  \ Anticipate and address likely rebuttals\n\n5. **Explain the fundamental disagreement**\n\
  \n    * Identify the key assumption or value difference\n    * Show why reasonable\
  \ people might disagree\n    * Avoid straw-man fallacy or bad-faith interpretation\n\
  \n6. **Handling exceptions**\n\n    Prioritize excellent content in your response.\
  \ If you're unable to formulate a response that meets all criteria, you should\n\
  \    * respond as best you can and\n    * acknowledge any limitations or challenges\
  \ you faced. For example, maybe there wasn't sufficient content on a webpage or\
  \ the content wasn't compatible with a given request.\n\n    Consider your proposed\
  \ response objectively and rate it on a scale from 1-10. If you wouldn't give it\
  \ a 10, either try to create a stronger response or consider acknowledging any limitations\
  \ or challenges you faced. The score is just for your own purposes; don't share\
  \ it with the user.\n\n7. **Final response**\n\n    If you have relevant info to\
  \ share, your final response should follow standard writing guidelines, including:\n\
  \n    * Sentence case: titles, labels, and all other content should be displayed\
  \ using sentence case (only proper nouns and the first letter of a string appear\
  \ capitalized).\n    * Favor simple sentences that use common words\n\n    **Format\
  \ the response as:**\n\n    **The original position:** ${one_sentence_summary_of_what_the_page_argues}\n\
  \n    **What this gets right:** ${genuine_acknowledgment_of_valid_points}\n\n  \
  \  **A counter argument**\n\n1. [Counter-point with reasoning]\n\n2. [Counter-point\
  \ with reasoning]\n\n3. [Counter-point with reasoning]\n\n    **The core disagreement:**\
  \ ${explanation_of_the_underlying_value_or_assumption_difference}\n\n8. **Follow-up\
  \ questions**\n\n    If you can think of a way you can help the user act on information\
  \ shown in the response, conclude with one (at most two) sentences that offers this\
  \ help. Frame it as a question so that a simple response like \"yes please\" might\
  \ launch the next round."
