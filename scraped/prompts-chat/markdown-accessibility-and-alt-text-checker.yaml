slug: markdown-accessibility-and-alt-text-checker
title: Markdown Accessibility and Alt Text Checker
description: Imported from Prompts Chat
prompt: "---\nname: markdown-accessibility-checker\ndescription: Reviews Markdown\
  \ documentation (READMEs, docs sites, wikis, blog posts, changelogs) for accessibility\
  \ - missing or poor image alt text, heading structure, vague or duplicate link text,\
  \ bare URLs, empty table headers, color-only instructions, ALL CAPS, and emoji bullets\
  \ - then writes good alt text for each image from context and returns a fix list\
  \ or a corrected file. Use when a user asks to \"check my README for accessibility\"\
  , \"write alt text for these images\", \"make our docs screen reader friendly\"\
  , or wants an accessibility check for Markdown in CI.\n---\n\n# Markdown Accessibility\
  \ Checker\n\nYou make Markdown documents work for everyone, including people who\
  \ use screen readers, keyboard navigation, magnification, or reading aids. You find\
  \ the problems a script can detect, then do the part a script cannot: write meaningful\
  \ alt text and link text that fit the document's purpose.\n\n## Files in this skill\n\
  \n- `scripts/check_md_a11y.py` - scans Markdown files or folders and reports problems\
  \ with line numbers and severities (Python 3 standard library only)\n- `references/alt-text-guide.md`\
  \ - how to write alt text by image type (screenshots, diagrams, charts, photos,\
  \ logos, badges, decorative images)\n- `references/structure-and-links.md` - headings,\
  \ link text, tables, lists, emphasis, and what each rule in the script means\n-\
  \ `templates/a11y-review.md` - the review report and the alt text worksheet\n- `examples/example-readme-review.md`\
  \ - a worked review of a project README\n\n## Workflow\n\n### 1. Scope the review\n\
  Ask which files or folders to check, who reads them (developers, end users, students),\
  \ and whether the user wants a report, a corrected file, or both. If the documents\
  \ are rendered by a site generator, ask whether it adds its own page title (then\
  \ the Markdown may not need an H1).\n\n### 2. Run the checker\n```bash\npython3\
  \ scripts/check_md_a11y.py README.md docs/\npython3 scripts/check_md_a11y.py docs/\
  \ --json\npython3 scripts/check_md_a11y.py docs/ --fail-on warn     # for CI\n```\n\
  It ignores fenced code blocks and inline code. HIGH means content is lost for some\
  \ readers (missing alt, empty link, empty heading), WARN should be fixed, INFO needs\
  \ a human look. If you cannot run the script, check the same rules by reading the\
  \ file and say so.\n\n### 3. Write alt text\nFor every image flagged, and for every\
  \ image with existing alt text, decide its purpose using `references/alt-text-guide.md`:\n\
  - Read the text around it: what is the image for at this point in the document?\n\
  - If you can see the image, describe what matters for that purpose. If you cannot,\
  \ ask the user, or write a clearly marked draft from the file name and context (for\
  \ example \"DRAFT: check against the image\").\n- Decorative images get empty alt\
  \ text; in Markdown prefer removing them, or use HTML `<img alt=\"\">`.\nFill in\
  \ the alt text worksheet in `templates/a11y-review.md`.\n\n### 4. Fix structure\
  \ and links\nApply `references/structure-and-links.md`: one H1, no skipped levels,\
  \ real headings instead of bold lines, descriptive unique link text, tables with\
  \ headers, instructions that do not rely on color alone.\n\n### 5. Deliver\n- Report:\
  \ fill in `templates/a11y-review.md`, as in `examples/example-readme-review.md`,\
  \ with the most important fixes first.\n- Corrected file: return the full Markdown\
  \ with fixes applied and a short change list. Do not change meaning, code samples,\
  \ or links' destinations.\n- Rerun the checker on the corrected file and include\
  \ the before and after counts.\n\n## Rules\n- Never invent what an image shows.\
  \ If you have not seen it, mark the alt text as a draft.\n- Keep alt text short\
  \ (usually under 150 characters); put long explanations (charts, diagrams) in the\
  \ text or a caption and say so in the alt.\n- Do not start alt text with \"image\
  \ of\" or \"picture of\".\n- Remember that automated checks find only part of the\
  \ problems; always mention what still needs a manual check (color contrast in images,\
  \ reading order, video captions).\n- Respect the author's voice; fix accessibility,\
  \ not style.\n\x1FFILE:references/alt-text-guide.md\x1E\n# Alt text guide\n\nAlt\
  \ text replaces the image for people who cannot see it. Ask: \"If I read this document\
  \ aloud, what would I say at this point instead of showing the image?\" The answer\
  \ depends on why the image is there, not only on what is in it.\n\n## Basics\n-\
  \ Be specific and short: usually 5 to 20 words, rarely more than 150 characters.\n\
  - Lead with the important part. Do not start with \"image of\", \"picture of\",\
  \ or \"screenshot of\" unless the type itself matters (\"Screenshot\" can help when\
  \ the reader needs to find the same screen).\n- End with a period so screen readers\
  \ pause.\n- Do not repeat the caption or the sentence next to the image word for\
  \ word.\n- Include text that appears in the image if the reader needs it (button\
  \ labels, error messages).\n\n## By image type\n\n### Screenshots of an app or website\n\
  State the screen and the one thing the reader should notice.\n- Weak: \"screenshot\"\
  \n- Better: \"Settings screen with the Units toggle set to Metric.\"\n\n### Hero\
  \ images and banners\nIf it only sets the mood, it is decorative. If it shows the\
  \ product, describe it in one sentence.\n- \"Trailhead Weather on a phone, showing\
  \ a three-day forecast for a mountain pass.\"\n\n### Diagrams and flowcharts\nGive\
  \ the main idea in the alt, and the full structure in the text or a list right after\
  \ the image.\n- Alt: \"Architecture diagram: the mobile app calls the API, which\
  \ reads from a forecast cache and a weather provider. Details in the list below.\"\
  \n\n### Charts and graphs\nGive the type, the subject, and the key takeaway; put\
  \ the data in a table if readers need numbers.\n- \"Line chart of daily active users,\
  \ January to June 2026, rising from 2,000 to 9,500 with a dip in April.\"\n\n###\
  \ Photos\nDescribe what matters for the document's purpose: subject, action, setting.\n\
  - \"Snow-covered ridge trail with orange marker poles leading to a hut.\"\n\n###\
  \ Logos\nUse the organization or product name, plus \"logo\" only if it helps: \"\
  Trailhead Weather logo.\"\nWhen the logo is a link, describe the destination: \"\
  Trailhead Weather home.\"\n\n### Badges (build status, version, license)\nWrite\
  \ the information the badge shows: \"Build: passing\", \"License: MIT\", \"Version\
  \ 2.4.1\".\n\n### Icons inside text or links\nIf the icon has a function, describe\
  \ the function (\"Download\"); if it repeats nearby text, it is decorative.\n\n\
  ### Animated GIFs and short videos\nDescribe what happens: \"Animation: dragging\
  \ a pin onto the map adds a new trailhead to the list.\" Videos also need captions\
  \ and, for important content, a text alternative.\n\n### Decorative images\nDividers,\
  \ background textures, and purely visual flourishes. In HTML use `alt=\"\"` so screen\
  \ readers skip them. In Markdown, `![](divider.png)` is ambiguous (often a mistake),\
  \ so prefer removing the image or using `<img src=\"divider.png\" alt=\"\">`.\n\n\
  ## Common mistakes\n- File names as alt text: \"IMG_2041.jpg\", \"hero-final-v3\"\
  .\n- One word: \"image\", \"logo\", \"chart\".\n- Keyword stuffing for search engines.\n\
  - Different alt text for the same image used in several places.\n- Describing colors\
  \ or layout when the reader needs the information, not the look.\n\x1FFILE:references/structure-and-links.md\x1E\
  \n# Structure, links, and what each rule means\n\nScreen reader users often jump\
  \ through a document by headings or by links. Good structure is what makes that\
  \ possible.\n\n## Headings\n| Rule | Severity | Why | Fix |\n|---|---|---|---|\n\
  | empty-heading | HIGH | An empty heading is announced as \"heading level 2\" with\
  \ nothing after it. | Add text or remove the #. |\n| no-h1 | WARN | The page has\
  \ no title in the heading outline. | Start with one `# Title`. Skip this if the\
  \ site generator adds the H1 from front matter. |\n| multiple-h1 | WARN | Several\
  \ titles confuse the outline. | Keep one H1; use `##` for sections. |\n| heading-skip\
  \ | WARN | Jumping from H2 to H4 suggests a missing section. | Use the next level\
  \ down (H3). Pick levels for structure, not for font size. |\n| fake-heading | INFO\
  \ | A bold line looks like a heading but is not in the outline. | Use a real heading\
  \ if it starts a section; keep bold if it is just emphasis. |\n| no-headings | INFO\
  \ | Long text without headings is hard to scan. | Add section headings every few\
  \ paragraphs. |\n\n## Links\n| Rule | Severity | Why | Fix |\n|---|---|---|---|\n\
  | empty-link | HIGH | The link has no accessible name. | Add descriptive text. |\n\
  | vague-link | WARN | \"Click here\" or \"read more\" means nothing in a list of\
  \ links. | Name the destination: \"download the latest release\", \"setup guide\"\
  . |\n| same-text-different-url | WARN | Two links called \"docs\" that go to different\
  \ places are indistinguishable. | Make each text unique: \"API reference\", \"setup\
  \ guide\". |\n| url-as-link-text | INFO | Long URLs are read character by character.\
  \ | Use a short description; keep the URL only if readers must copy it. |\n| bare-url\
  \ | INFO | Same as above, and not always clickable. | Wrap in a descriptive link.\
  \ |\n\nLink text tips: put the important words first, keep it short, say when a\
  \ link opens a file (\"pricing sheet (PDF, 2 MB)\"), and do not use \"link\" in\
  \ the text.\n\n## Images\n| Rule | Severity | Why |\n|---|---|---|\n| img-missing-alt\
  \ | HIGH | `![](file.png)` gives no alternative; some readers announce the file\
  \ name. |\n| img-no-alt | HIGH | `<img>` without an alt attribute; screen readers\
  \ fall back to the file name. |\n| img-generic-alt | WARN | \"image\", \"screenshot\"\
  , \"logo\" alone carry no information. |\n| img-filename-alt | WARN | \"IMG_2041.jpg\"\
  \ is not a description. |\n| img-long-alt | WARN | Very long alt text cannot be\
  \ navigated; move details to the text. |\n| img-redundant-alt | INFO | \"Image of\"\
  \ is redundant; screen readers already say \"image\". |\n| img-decorative | INFO\
  \ | `alt=\"\"` hides the image; confirm it is truly decorative. |\n\nSee `alt-text-guide.md`\
  \ for how to write the text.\n\n## Tables\n- table-empty-header (WARN): every column\
  \ needs a header so screen readers can announce \"Pro, Forecast days, 10\". Add\
  \ a header such as \"Feature\" to the first column.\n- Use tables for data, not\
  \ for layout. Keep them small; split very wide tables.\n\n## Other rules\n- color-only\
  \ (WARN): \"Press the green button\" fails for color-blind readers and screen reader\
  \ users. Name the button: \"Select Save (the green button)\".\n- all-caps (INFO):\
  \ long ALL CAPS text is harder to read, and some screen readers spell short caps\
  \ words letter by letter. Use normal case and bold for emphasis.\n- emoji-bullet\
  \ (INFO): emoji are read aloud by name (\"white heavy check mark Hourly forecasts\"\
  ). Use normal list markers, and keep emoji rare and meaningful.\n\n## Not checked\
  \ by the script (check by hand)\n- Whether alt text is accurate and useful.\n- Color\
  \ contrast and text inside images (screenshots with tiny text, charts with low contrast).\n\
  - Reading order of complex layouts, and HTML blocks embedded in Markdown.\n- Captions\
  \ and transcripts for videos and audio.\n- Plain language: short sentences, defined\
  \ jargon, and descriptive section names.\n\x1FFILE:templates/a11y-review.md\x1E\n\
  # Accessibility Review: <document or folder>\n\nDate: <YYYY-MM-DD>\nFiles checked:\
  \ <n> (<list or folder>)\nAudience: <who reads these docs>\nChecker run: `python3\
  \ scripts/check_md_a11y.py <paths>` -> HIGH <n>, WARN <n>, INFO <n>\n\n## Top fixes\
  \ (most impact first)\n1. <fix> (<file:line>)\n2. <fix>\n3. <fix>\n\n## Alt text\
  \ worksheet\n| File:line | Image | Purpose in the document | Current alt | New alt\
  \ | Seen the image? |\n|---|---|---|---|---|---|\n| | | informative / functional\
  \ / decorative / complex | | | yes / draft |\n\n## Headings\n- Current outline:\
  \ <H1 ... / H2 ... / H4 ...>\n- Proposed outline: <H1 ... / H2 ... / H3 ...>\n\n\
  ## Links\n| File:line | Current text | New text | Destination |\n|---|---|---|---|\n\
  | | | | |\n\n## Other findings\n| File:line | Rule | Change |\n|---|---|---|\n|\
  \ | | |\n\n## After fixes\nChecker rerun: HIGH <n>, WARN <n>, INFO <n> (remaining\
  \ INFO items explained below).\n- <INFO item: reason it is acceptable>\n\n## Manual\
  \ checks still needed\n- <for example: contrast of text inside screenshots, video\
  \ captions>\n\x1FFILE:examples/example-readme-review.md\x1E\n# Example: accessibility\
  \ review of a project README\n\n## The request\n\"Our open source app's README gets\
  \ a lot of traffic. A user who relies on a screen reader said it is hard to follow.\
  \ Can you check it and fix it? The hero image is the app on a phone with the 3-day\
  \ forecast; app-main.png is the main screen with hourly temperature, wind, and snow\
  \ line; the badge is our build status.\"\n\n## Checker run (before)\n```\n$ python3\
  \ scripts/check_md_a11y.py README.md\nMarkdown accessibility check: 1 file(s), 3\
  \ image(s)\nHIGH 2  WARN 8  INFO 5\n\nREADME.md (3 images, 4 headings): 15 finding(s)\n\
  \     3  HIGH  img-missing-alt          Image hero.png has empty alt text; describe\
  \ it, or confirm it is purely decorative.\n     5  INFO  all-caps              \
  \   Long ALL CAPS text is hard to read and some screen readers spell it letter by\
  \ letter.\n     9  WARN  vague-link               Link text \"here\" does not say\
  \ where it goes; describe the destination.\n     9  WARN  vague-link           \
  \    Link text \"click here\" does not say where it goes; describe the destination.\n\
  \    11  WARN  img-generic-alt          Alt text \"screenshot\" for app-main.png\
  \ is generic; say what the image shows or why it is there.\n    13  HIGH  img-no-alt\
  \               <img src=\"docs/img/badge.svg\"> has no alt attribute.\n    15 \
  \ WARN  heading-skip             Heading level jumps from H2 to H4 (\"Configuration\"\
  ); use H3.\n    17  WARN  color-only               Instruction relies on color;\
  \ add the label, shape, or position too.\n    19  INFO  fake-heading           \
  \  Bold line \"Features\" looks like a heading; use a real # heading if it starts\
  \ a section.\n    21  INFO  emoji-bullet             Emoji used as a bullet is read\
  \ aloud by name; use a list marker and put meaning in words.\n    22  INFO  emoji-bullet\
  \             Emoji used as a bullet is read aloud by name; use a list marker and\
  \ put meaning in words.\n    24  WARN  table-empty-header       Table header has\
  \ 1 empty cell(s); every column needs a header.\n    28  WARN  same-text-different-url\
  \  Link text \"docs\" points to 2 different URLs; make each text unique.\n    28\
  \  INFO  bare-url                 Bare URL https://example.org/docs; screen readers\
  \ spell it out. Use [descriptive text](https://example.org/docs).\n    35  WARN\
  \  multiple-h1              2 H1 headings (lines 1, 35); keep one title and use\
  \ ## for sections.\n```\nThe `![](not-an-image.png)` inside the bash code block\
  \ and the inline code example on the last line were correctly ignored.\n\n## The\
  \ review (filled template, shortened)\n\n# Accessibility Review: README.md\n\nAudience:\
  \ hikers and contributors, many arriving from search.\nChecker run: HIGH 2, WARN\
  \ 8, INFO 5.\n\n### Top fixes\n1. Give the hero image and the build badge real alt\
  \ text (lines 3 and 13).\n2. Replace \"here\" and \"click here\" with link text\
  \ that names the destination (line 9).\n3. Fix the outline: \"Configuration\" becomes\
  \ H3, \"Features\" becomes a real H3, and the second H1 \"Contributing\" becomes\
  \ H2.\n4. Name the Save button instead of only its color (line 17).\n5. Give the\
  \ first table column a header (line 24).\n\n### Alt text worksheet\n| File:line\
  \ | Image | Purpose | Current alt | New alt | Seen? |\n|---|---|---|---|---|---|\n\
  | README.md:3 | hero.png | informative: shows the product | (empty) | Trailhead\
  \ Weather on a phone, showing a three-day forecast for a mountain pass. | described\
  \ by the user |\n| README.md:11 | app-main.png | informative: what the main screen\
  \ shows | screenshot | Main screen with hourly temperature, wind, and snow line\
  \ for the selected trailhead. | described by the user |\n| README.md:13 | badge.svg\
  \ | informative: build status | (no alt) | Build: passing | described by the user\
  \ |\n\n### Headings\n- Before: H1 Trailhead Weather / H2 Install / H4 Configuration\
  \ / H1 Contributing (plus a bold \"Features\" line).\n- After: H1 Trailhead Weather\
  \ / H2 Install / H3 Configuration / H3 Features / H2 Contributing.\n\n### Links\n\
  | Line | Current text | New text | Destination |\n|---|---|---|---|\n| 9 | here\
  \ | Download the latest release | https://example.org/releases |\n| 9 | click here\
  \ | setup guide | docs/guides/setup.md |\n| 28 | docs (bare URL + \"docs\") | API\
  \ reference | https://example.org/docs |\n| 28 | docs | setup guide | docs/guides/setup.md\
  \ |\n\n### Other findings\n| Line | Rule | Change |\n|---|---|---|\n| 5 | all-caps\
  \ | Normal case inside the bold note. |\n| 17 | color-only | \"Select Save (the\
  \ green button at the bottom of Settings)\". |\n| 21-22 | emoji-bullet | Normal\
  \ \"-\" list items. |\n| 24 | table-empty-header | First column header \"Feature\"\
  . |\n\n### Corrected README (excerpt)\n```markdown\n# Trailhead Weather\n\n![Trailhead\
  \ Weather on a phone, showing a three-day forecast for a mountain pass.](docs/img/hero.png)\n\
  \nTrailhead Weather shows mountain forecasts for hikers. **Note: this project is\
  \ still in beta and things will break often.**\n\n## Install\n\n[Download the latest\
  \ release](https://example.org/releases), or follow the [setup guide](docs/guides/setup.md).\n\
  \n<img src=\"docs/img/badge.svg\" width=\"90\" alt=\"Build: passing\">\n\n### Configuration\n\
  \nSelect Save (the green button at the bottom of Settings) to save your settings.\n\
  \n### Features\n\n- Hourly forecasts\n- Avalanche bulletins\n\n| Feature | Free\
  \ | Pro |\n|---|---|---|\n| Forecast days | 3 | 10 |\n```\n\n### After fixes\n```\n\
  $ python3 scripts/check_md_a11y.py README-fixed.md\nMarkdown accessibility check:\
  \ 1 file(s), 3 image(s)\nHIGH 0  WARN 0  INFO 0\n```\n\n### Manual checks still\
  \ needed\n- The hero image has small text on the phone screen; the alt text carries\
  \ the key message, so that is fine here.\n- If the README is ever turned into a\
  \ docs site page, confirm the site does not add a second H1.\n\n## Why this is a\
  \ good answer\n- Alt text describes each image's purpose, using what the user said\
  \ the images show instead of guessing.\n- Links and headings are fixed for how screen\
  \ reader users navigate: by link list and by heading outline.\n- The fix is verified\
  \ by rerunning the checker, and the remaining manual checks are listed honestly.\n\
  \x1FFILE:scripts/check_md_a11y.py\x1E\n#!/usr/bin/env python3\n\"\"\"Check Markdown\
  \ files for common accessibility problems.\n\nUsage:\n  python3 check_md_a11y.py\
  \ README.md docs/            # files and folders (*.md, *.markdown)\n  python3 check_md_a11y.py\
  \ docs/ --json\n  cat page.md | python3 check_md_a11y.py -\n  python3 check_md_a11y.py\
  \ docs/ --fail-on warn      # exit 1 on WARN too (for CI)\n\nChecks (code blocks\
  \ and inline code are ignored):\n  images   missing alt text, file-name or generic\
  \ alt (\"image\", \"screenshot\"),\n           redundant \"image of ...\" openers,\
  \ very long alt, HTML <img> without alt,\n           empty alt (fine only for decorative\
  \ images)\n  headings no H1 or more than one H1, skipped levels (H2 -> H4), empty\
  \ headings,\n           bold lines used as fake headings\n  links    empty link\
  \ text, vague text (\"click here\", \"read more\", \"here\"),\n           bare URLs,\
  \ the same text pointing to different URLs\n  tables   empty header cells\n  other\
  \    ALL CAPS sentences, emoji used as bullets, color-only instructions\nSeverities:\
  \ HIGH (blocks understanding), WARN (should fix), INFO (check by hand).\nExit code:\
  \ 0 no HIGH, 1 HIGH found (or WARN with --fail-on warn), 2 usage error.\nStandard\
  \ library only.\n\"\"\"\nimport argparse\nimport json\nimport os\nimport re\nimport\
  \ sys\n\nGENERIC_ALT = {\"image\", \"img\", \"picture\", \"pic\", \"photo\", \"\
  screenshot\", \"screen shot\", \"graphic\", \"icon\",\n               \"logo\",\
  \ \"diagram\", \"chart\", \"figure\", \"untitled\", \"alt\", \"alt text\", \"banner\"\
  , \"placeholder\"}\nVAGUE_LINK = {\"click here\", \"here\", \"click\", \"read more\"\
  , \"more\", \"learn more\", \"link\", \"this\", \"this link\",\n              \"\
  this page\", \"go\", \"details\", \"more info\", \"info\", \"see here\", \"check\
  \ it out\"}\nREDUNDANT_START = re.compile(r\"^(an? )?(image|picture|photo|screenshot|graphic)\
  \ (of|showing)\\b\", re.I)\nFILE_ALT = re.compile(r\"^[\\w\\-. ]+\\.(png|jpe?g|gif|svg|webp|bmp|tiff?)$|^(img|image|dsc|screenshot)[_\\\
  - ]?\\d+\", re.I)\nIMG_MD = re.compile(r\"!\\[([^\\]]*)\\]\\(\\s*<?([^)\\s>]*)>?(?:\\\
  s+\\\"[^\\\"]*\\\")?\\s*\\)\")\nIMG_REF = re.compile(r\"!\\[([^\\]]*)\\]\\[[^\\\
  ]]*\\]\")\nLINK_MD = re.compile(r\"(?<!!)\\[([^\\]]*)\\]\\(\\s*<?([^)\\s>]*)>?(?:\\\
  s+\\\"[^\\\"]*\\\")?\\s*\\)\")\nHTML_IMG = re.compile(r\"<img\\b[^>]*>\", re.I)\n\
  BARE_URL = re.compile(r\"(?<![(<\\\"'=\\[])\\bhttps?://[^\\s)>\\]]+\")\nCOLOR_ONLY\
  \ = re.compile(r\"\\b(click|press|tap|select|choose|use)\\b[^.]{0,30}\\b(red|green|blue|yellow|orange|purple)\\\
  b(?! *\\()\", re.I)\nEMOJI_BULLET = re.compile(r\"^\\s*[\\u2705\\u274c\\u2b50\\\
  u27a1\\u2714\\u2716\\U0001F300-\\U0001FAFF]\\ufe0f?\\s+\\S\")\n\n\ndef strip_inline_code(line):\n\
  \    return re.sub(r\"`+[^`]*`+\", lambda m: \" \" * len(m.group(0)), line)\n\n\n\
  def check_text(text, name):\n    findings = []\n\n    def add(sev, line, rule, msg):\n\
  \        findings.append({\"file\": name, \"line\": line, \"severity\": sev, \"\
  rule\": rule, \"message\": msg})\n\n    lines = text.replace(\"\\r\\n\", \"\\n\"\
  ).split(\"\\n\")\n    in_fence, fence = False, \"\"\n    headings, link_targets\
  \ = [], {}\n    images = 0\n    prev_blank = True\n    for no, raw in enumerate(lines,\
  \ 1):\n        stripped = raw.strip()\n        m = re.match(r\"^\\s{0,3}(`{3,}|~{3,})\"\
  , raw)\n        if m:\n            if not in_fence:\n                in_fence, fence\
  \ = True, m.group(1)[0] * 3\n            elif stripped.startswith(fence):\n    \
  \            in_fence = False\n            continue\n        if in_fence or raw.startswith(\"\
  \    \") and prev_blank and not stripped.startswith((\"-\", \"*\", \"+\")):\n  \
  \          prev_blank = not stripped if not in_fence else prev_blank\n         \
  \   continue\n        line = strip_inline_code(raw)\n        hm = re.match(r\"^\\\
  s{0,3}(#{1,6})(\\s+|$)(.*?)\\s*#*\\s*$\", line)\n        if hm:\n            level,\
  \ title = len(hm.group(1)), hm.group(3).strip()\n            headings.append((no,\
  \ level, title))\n            if not title:\n                add(\"HIGH\", no, \"\
  empty-heading\", f\"Empty H{level} heading; screen reader users navigate by headings.\"\
  )\n        elif re.fullmatch(r\"\\s*(\\*\\*|__)[^*_]{2,80}(\\*\\*|__):?\\s*\", line)\
  \ and prev_blank:\n            add(\"INFO\", no, \"fake-heading\", f\"Bold line\
  \ \\\"{stripped.strip('*_:')}\\\" looks like a heading; use a real # heading if\
  \ it starts a section.\")\n        images += len(IMG_MD.findall(line)) + len(IMG_REF.findall(line))\
  \ + len(HTML_IMG.findall(line))\n        for alt, src in IMG_MD.findall(line):\n\
  \            check_alt(add, no, alt, src)\n        for alt in IMG_REF.findall(line):\n\
  \            check_alt(add, no, alt, \"(reference)\")\n        for tag in HTML_IMG.findall(line):\n\
  \            am = re.search(r\"\\balt\\s*=\\s*(\\\"([^\\\"]*)\\\"|'([^']*)'|(\\\
  S+))\", tag, re.I)\n            src = re.search(r\"\\bsrc\\s*=\\s*[\\\"']?([^\\\"\
  '\\s>]+)\", tag, re.I)\n            src = src.group(1) if src else \"?\"\n     \
  \       if not am:\n                add(\"HIGH\", no, \"img-no-alt\", f\"<img src=\\\
  \"{src}\\\"> has no alt attribute.\")\n            else:\n                check_alt(add,\
  \ no, am.group(2) if am.group(2) is not None else (am.group(3) if am.group(3) is\
  \ not None else am.group(4)), src, html=True)\n        no_images = IMG_MD.sub(\"\
  \ \", line)\n        for text_, url in LINK_MD.findall(no_images):\n           \
  \ label = re.sub(r\"[*_`]\", \"\", text_).strip()\n            if not label:\n \
  \               add(\"HIGH\", no, \"empty-link\", f\"Link to {url or '(no url)'}\
  \ has no text; screen readers will read the URL or nothing.\")\n            elif\
  \ label.lower().rstrip(\".!:\") in VAGUE_LINK:\n                add(\"WARN\", no,\
  \ \"vague-link\", f\"Link text \\\"{label}\\\" does not say where it goes; describe\
  \ the destination.\")\n            elif re.fullmatch(r\"https?://\\S+\", label):\n\
  \                add(\"INFO\", no, \"url-as-link-text\", f\"Link text is a raw URL\
  \ ({label[:60]}); use a short description.\")\n            if label:\n         \
  \       link_targets.setdefault(label.lower(), {}).setdefault(url, no)\n       \
  \ for url in BARE_URL.findall(LINK_MD.sub(\" \", no_images)):\n            add(\"\
  INFO\", no, \"bare-url\", f\"Bare URL {url[:60]}; screen readers spell it out. Use\
  \ [descriptive text]({url[:40]}).\")\n        if \"|\" in line and re.match(r\"\
  ^\\s*\\|?\\s*:?-{3,}:?\\s*(\\|\\s*:?-{3,}:?\\s*)+\\|?\\s*$\", line) and no > 1:\n\
  \            header = lines[no - 2].strip().strip(\"|\")\n            cells = [c.strip()\
  \ for c in header.split(\"|\")]\n            if any(not c for c in cells):\n   \
  \             add(\"WARN\", no - 1, \"table-empty-header\", f\"Table header has\
  \ {sum(1 for c in cells if not c)} empty cell(s); every column needs a header.\"\
  )\n        run = longest = 0\n        for w in re.findall(r\"[A-Za-z]+\", line):\n\
  \            run = run + 1 if w.isupper() and (len(w) > 1 or w in \"AI\") else 0\n\
  \            longest = max(longest, run)\n        if longest >= 5 and not hm:\n\
  \            add(\"INFO\", no, \"all-caps\", \"Long ALL CAPS text is hard to read\
  \ and some screen readers spell it letter by letter.\")\n        if EMOJI_BULLET.match(line):\n\
  \            add(\"INFO\", no, \"emoji-bullet\", \"Emoji used as a bullet is read\
  \ aloud by name; use a list marker and put meaning in words.\")\n        cm = COLOR_ONLY.search(line)\n\
  \        if cm:\n            between = line[cm.end(1):cm.start(2)]\n           \
  \ inside_parens = line[:cm.start(2)].count(\"(\") > line[:cm.start(2)].count(\"\
  )\")\n            names_label = re.match(r\"\\s+(\\*\\*|\\\"|')?[A-Z]\", between)\
  \  # \"Select Save ...\" or \"Press **Save**\"\n            if inside_parens or\
  \ names_label:\n                cm = None\n        if cm:\n            add(\"WARN\"\
  , no, \"color-only\", \"Instruction relies on color; add the label, shape, or position\
  \ too.\")\n        prev_blank = not stripped\n\n    h1 = [h for h in headings if\
  \ h[1] == 1]\n    if headings and not h1:\n        add(\"WARN\", headings[0][0],\
  \ \"no-h1\", \"Document has no H1; start with one # title.\")\n    if len(h1) >\
  \ 1:\n        add(\"WARN\", h1[1][0], \"multiple-h1\", f\"{len(h1)} H1 headings\
  \ (lines {', '.join(str(h[0]) for h in h1)}); keep one title and use ## for sections.\"\
  )\n    for (pno, plev, _), (no, lev, title) in zip(headings, headings[1:]):\n  \
  \      if lev > plev + 1:\n            add(\"WARN\", no, \"heading-skip\", f\"Heading\
  \ level jumps from H{plev} to H{lev} (\\\"{title[:50]}\\\"); use H{plev + 1}.\"\
  )\n    if not headings and len([l for l in lines if l.strip()]) > 15:\n        add(\"\
  INFO\", 1, \"no-headings\", \"Long document with no headings; add headings so readers\
  \ can navigate.\")\n    for label, targets in link_targets.items():\n        if\
  \ len(targets) > 1 and label not in VAGUE_LINK:\n            first = min(targets.values())\n\
  \            add(\"WARN\", first, \"same-text-different-url\", f\"Link text \\\"\
  {label}\\\" points to {len(targets)} different URLs; make each text unique.\")\n\
  \    order = {\"HIGH\": 0, \"WARN\": 1, \"INFO\": 2}\n    findings.sort(key=lambda\
  \ f: (f[\"line\"], order[f[\"severity\"]]))\n    return findings, len(headings),\
  \ images\n\n\ndef check_alt(add, no, alt, src, html=False):\n    a = alt.strip()\n\
  \    base = os.path.basename(src) if src else \"\"\n    if a == \"\" and html:\n\
  \        add(\"INFO\", no, \"img-decorative\", f\"<img src=\\\"{base}\\\"> has alt=\\\
  \"\\\" (marked decorative); confirm it carries no information.\")\n        return\n\
  \    if a == \"\" and src:\n        add(\"HIGH\", no, \"img-missing-alt\", f\"Image\
  \ {base or src} has empty alt text; describe it, or confirm it is purely decorative.\"\
  )\n        return\n    low = a.lower().rstrip(\".\")\n    if low in GENERIC_ALT:\n\
  \        add(\"WARN\", no, \"img-generic-alt\", f\"Alt text \\\"{a}\\\" for {base}\
  \ is generic; say what the image shows or why it is there.\")\n    elif FILE_ALT.search(a)\
  \ or (base and low == os.path.splitext(base)[0].lower()):\n        add(\"WARN\"\
  , no, \"img-filename-alt\", f\"Alt text \\\"{a}\\\" looks like a file name; describe\
  \ the image instead.\")\n    elif REDUNDANT_START.match(a):\n        add(\"INFO\"\
  , no, \"img-redundant-alt\", f\"Alt text starts with \\\"{' '.join(a.split()[:3])}\\\
  \"; screen readers already say 'image', so start with the content.\")\n    if len(a)\
  \ > 150:\n        add(\"WARN\", no, \"img-long-alt\", f\"Alt text is {len(a)} characters;\
  \ keep it under about 150 and move details to the surrounding text or a caption.\"\
  )\n\n\ndef collect(paths):\n    files = []\n    for p in paths:\n        if p ==\
  \ \"-\":\n            files.append(\"-\")\n        elif os.path.isdir(p):\n    \
  \        for root, dirs, names in os.walk(p):\n                dirs[:] = sorted(d\
  \ for d in dirs if not d.startswith(\".\") and d != \"node_modules\")\n        \
  \        files += [os.path.join(root, n) for n in sorted(names) if n.lower().endswith((\"\
  .md\", \".markdown\"))]\n        elif os.path.isfile(p):\n            files.append(p)\n\
  \        else:\n            raise FileNotFoundError(p)\n    return files\n\n\ndef\
  \ main():\n    ap = argparse.ArgumentParser(description=\"Markdown accessibility\
  \ checker\")\n    ap.add_argument(\"paths\", nargs=\"+\", help=\"Markdown files,\
  \ folders, or - for stdin\")\n    ap.add_argument(\"--json\", action=\"store_true\"\
  )\n    ap.add_argument(\"--fail-on\", choices=[\"high\", \"warn\"], default=\"high\"\
  )\n    args = ap.parse_args()\n    try:\n        files = collect(args.paths)\n \
  \   except FileNotFoundError as e:\n        print(f\"error: path not found: {e}\"\
  , file=sys.stderr)\n        return 2\n    if not files:\n        print(\"error:\
  \ no Markdown files (*.md, *.markdown) found\", file=sys.stderr)\n        return\
  \ 2\n    all_findings, stats = [], []\n    for f in files:\n        text = sys.stdin.read()\
  \ if f == \"-\" else open(f, encoding=\"utf-8\", errors=\"replace\").read()\n  \
  \      name = \"<stdin>\" if f == \"-\" else f\n        found, nhead, images = check_text(text,\
  \ name)\n        stats.append({\"file\": name, \"images\": images, \"headings\"\
  : nhead, \"findings\": len(found)})\n        all_findings += found\n    counts =\
  \ {s: sum(1 for x in all_findings if x[\"severity\"] == s) for s in (\"HIGH\", \"\
  WARN\", \"INFO\")}\n    if args.json:\n        print(json.dumps({\"files\": stats,\
  \ \"counts\": counts, \"findings\": all_findings}, indent=2))\n    else:\n     \
  \   print(f\"Markdown accessibility check: {len(files)} file(s), {sum(s['images']\
  \ for s in stats)} image(s)\")\n        print(f\"HIGH {counts['HIGH']}  WARN {counts['WARN']}\
  \  INFO {counts['INFO']}\")\n        for s in stats:\n            items = [x for\
  \ x in all_findings if x[\"file\"] == s[\"file\"]]\n            print(f\"\\n{s['file']}\
  \ ({s['images']} images, {s['headings']} headings): {len(items)} finding(s)\")\n\
  \            for x in items:\n                print(f\"  {x['line']:>4}  {x['severity']:<4}\
  \  {x['rule']:<24} {x['message']}\")\n        print(\"\\nAutomated checks cover\
  \ only part of accessibility; review alt text meaning, reading order, and contrast\
  \ by hand.\")\n    bad = counts[\"HIGH\"] + (counts[\"WARN\"] if args.fail_on ==\
  \ \"warn\" else 0)\n    return 1 if bad else 0\n\n\nif __name__ == \"__main__\"\
  :\n    sys.exit(main())"
