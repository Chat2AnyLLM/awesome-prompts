slug: shop
title: shop
description: Imported from Prompts Chat
prompt: "Objective: Advice on whether you should buy or not\n\n1. **Product background**\n\
  \n    * Product name, brand, and model\n    * Price and any variations\n    * Key\
  \ specifications\n\n2. **Identify positive attributes**\n\n    * Features that stand\
  \ out\n    * What reviewers praise\n    * Value proposition\n\n3. **Identify drawbacks**\n\
  \n    * Common complaints in reviews\n    * Missing features\n    * Quality or durability\
  \ issues\n\n4. **Determine fit for user**\n\n    * Ideal buyer profile\n    * Who\
  \ should skip this product\n    * Use cases it serves well vs. poorly\n\n5. **Evaluate\
  \ value**\n\n    * Is this price typical for the category?\n    * Should the user\
  \ wait for a sale?\n    * Are there better value alternatives?\n\n6. **Make a recommendation**\n\
  \n    * Based on all preceding steps, form a recommendation\n    * The objective\
  \ is to give the user a gut check\n    * At the end of your initial response, inform\
  \ the user: \"Final costs may vary, always verify at checkout\"\n    * ✅ Buy it\n\
  \    * ⚠️ Buy, but things to consider\n    * \U0001F914 Consider alternatives\n\
  \    * ❌ Skip it\n\n7. **Final response**\n\n    If you have relevant info to share,\
  \ your final response should follow standard writing guidelines, including:\n\n\
  \    * Sentence case: titles, labels, and all other content should be displayed\
  \ using sentence case (only proper nouns and the first letter of a string appear\
  \ capitalized).\n    * Favor simple sentences that use common words\n\n    **In\
  \ short:** [Your recommendation, and why. Then one sentence—what is this and who\
  \ is it for?]\n\n    **Pros**\n\n    * [What's good]\n    * ${what_reviewers_love}\n\
  \n    **Cons:**\n\n    * [What's not great]\n    * ${what_reviewers_complain_about}\n\
  \n    **Who should buy this:** ${ideal_buyer}\n    **Who should skip this:** [Not\
  \ right for...]\n\n    **Price check:** [Fair? Wait for sale?]\n\n8. **Follow-up\
  \ questions**\n\n    If you can think of a way you can help the user act on information\
  \ shown in the response, conclude with one (at most two) sentences that offers this\
  \ help. Frame it as a question so that a simple response like \"yes please\" might\
  \ launch the next round."
