title: URL Shortening Service — Full-Stack Application
description: Imported from Prompts Chat
prompt: "## \U0001F680 URL Shortening Service — Full-Stack Application\n\n### \U0001F4CB\
  \ Project Overview\nBuild a production-ready, full-stack URL shortening service\
  \ with a modern, accessible frontend and a robust RESTful backend API. The application\
  \ must handle the complete lifecycle of shortened links: creation, redirection,\
  \ tracking, management, and expiration. Prioritize performance, security, and an\
  \ exceptional user experience across all devices.\n\n---\n\n### \U0001F6E0️ Tech\
  \ Stack\n\n**Frontend:**\n- Semantic HTML5 with ARIA attributes for accessibility\
  \ (WCAG 2.1 AA compliance)\n- CSS3 with CSS Custom Properties (variables), Flexbox,\
  \ and CSS Grid\n- Vanilla JavaScript (ES2022+) using modular architecture (ES Modules)\n\
  - No heavy frameworks — keep the bundle lightweight and fast\n\n**Backend API:**\n\
  - RESTful API design following OpenAPI 3.0 specification\n- JSON request/response\
  \ format with proper HTTP status codes\n- CORS configuration for cross-origin requests\n\
  - Rate limiting per IP and per API key\n\n**Libraries (CDN or bundled):**\n- QR\
  \ Code generation (e.g., `qrcode.js` or `qr-creator`)\n- Charting library for analytics\
  \ (e.g., Chart.js or lightweight alternative)\n- Date picker for expiration (e.g.,\
  \ `flatpickr`)\n- Toast notification system (custom-built, no dependency)\n\n---\n\
  \n### \U0001F3A8 Frontend — UI/UX Requirements\n\n**Layout & Design:**\n- Clean,\
  \ minimalist design with a hero section featuring a **large, prominent URL input\
  \ field** centered on the page\n- Implement a **dark/light mode toggle** with system\
  \ preference detection (`prefers-color-scheme`) and `localStorage` persistence\n\
  - Use a consistent design system: typography scale, spacing tokens, color palette\n\
  - Smooth micro-animations and transitions (fade-ins, slide-ups, button ripples)\
  \ for all interactive elements\n- Skeleton loading states for async content (analytics,\
  \ history table)\n\n**Responsive Design:**\n- Mobile-first approach with breakpoints\
  \ at 480px, 768px, 1024px, and 1440px\n- Touch-friendly tap targets (minimum 44×44px)\n\
  - Collapsible navigation menu on mobile (hamburger menu with animation)\n- Fluid\
  \ typography using `clamp()`\n\n**Accessibility:**\n- Full keyboard navigation support\
  \ (tab order, focus trapping in modals)\n- Screen reader announcements for dynamic\
  \ content (`aria-live` regions)\n- Visible focus indicators on all interactive elements\n\
  - Sufficient color contrast ratios (minimum 4.5:1 for text)\n- Reduced motion support\
  \ (`prefers-reduced-motion`)\n\n---\n\n### ⚙️ Core Features\n\n#### 1. URL Shortening\
  \ Engine\n- Prominent input field with placeholder text and real-time validation\
  \ feedback\n- **URL validation**: Check for valid protocol (`http://`, `https://`),\
  \ proper domain structure, and reject malformed URLs using both regex and the `URL`\
  \ constructor API\n- **URL sanitization**: Strip tracking parameters (UTM, fbclid,\
  \ gclid), remove redundant slashes, normalize protocol and case\n- Auto-prepend\
  \ `https://` if no protocol is provided\n- Display the shortened URL immediately\
  \ after creation with a success animation\n- **Bulk URL shortening**: Allow users\
  \ to paste multiple URLs (one per line) and shorten them all at once\n\n#### 2.\
  \ Custom Alias Support\n- Optional custom alias field (e.g., `short.ly/my-brand`)\n\
  - Real-time availability check as the user types (debounced API call, 300ms)\n-\
  \ Alias validation rules: alphanumeric, hyphens, underscores only; 3–30 characters;\
  \ reserved word blacklist (e.g., `admin`, `api`, `login`, `static`)\n- Clear error\
  \ messaging if the alias is taken or invalid\n\n#### 3. QR Code Generation\n- Auto-generate\
  \ a QR code for every shortened URL upon creation\n- QR code modal/panel with options\
  \ to:\n  - Download as PNG (high resolution, 1024×1024)\n  - Download as SVG (vector,\
  \ scalable)\n  - Customize foreground/background colors\n  - Add a small logo overlay\
  \ in the center (optional)\n- Ensure QR codes encode the full shortened URL and\
  \ are scannable at small sizes\n\n#### 4. Click Tracking & Analytics Dashboard\n\
  - Track every redirect with the following data points:\n  - Timestamp (UTC)\n  -\
  \ Country and city (via IP geolocation API)\n  - Device type (mobile, tablet, desktop)\n\
  \  - Operating system and browser (via User-Agent parsing)\n  - Referrer URL\n \
  \ - Unique vs. returning visitor (via cookie/fingerprint)\n- **Analytics Dashboard**\
  \ per link including:\n  - Total clicks and unique clicks counters\n  - Clicks over\
  \ time line chart (filterable: last 24h, 7d, 30d, 90d, all time)\n  - Geographic\
  \ distribution map or bar chart (top 10 countries)\n  - Device/OS/Browser breakdown\
  \ (donut or pie charts)\n  - Top referrers table\n  - Click heatmap by day of week\
  \ and hour of day\n- Aggregate analytics overview on the main dashboard (total links,\
  \ total clicks, most popular link)\n\n#### 5. Link Expiration\n- Optional expiration\
  \ date/time picker when creating a link\n- Support presets: 1 hour, 24 hours, 7\
  \ days, 30 days, custom date\n- Display a countdown or \"expires in X\" badge on\
  \ active links\n- Automatically deactivate expired links and show a friendly \"\
  This link has expired\" page on redirect attempts\n- Allow users to extend or remove\
  \ expiration on existing links\n\n#### 6. Password Protection\n- Optional password\
  \ toggle when creating a link\n- If enabled, show a password input gate page before\
  \ redirecting to the target URL\n- Hash passwords server-side using bcrypt or Argon2\
  \ (never store plaintext)\n- Rate-limit password attempts (max 5 per minute per\
  \ IP) with lockout messaging\n- Visual indicator (lock icon \U0001F512) on password-protected\
  \ links in the history view\n\n#### 7. Copy-to-Clipboard\n- One-click copy button\
  \ next to every shortened URL\n- Use the Clipboard API (`navigator.clipboard.writeText()`)\
  \ with fallback to `document.execCommand('copy')`\n- Visual confirmation: button\
  \ icon changes to a checkmark ✅ with a \"Copied!\" tooltip/toast that auto-dismisses\
  \ after 2 seconds\n- Keyboard shortcut support (e.g., `Ctrl+Shift+C` to copy the\
  \ most recently created link)\n\n#### 8. URL History & Management\n- Persistent\
  \ history table/grid of all shortened URLs (stored in `localStorage` for guests,\
  \ database for authenticated users)\n- Each entry displays: original URL (truncated\
  \ with tooltip), short URL, creation date, click count, status (active/expired/password-protected),\
  \ and action buttons\n- **Search**: Full-text search across original URLs, aliases,\
  \ and tags\n- **Filtering**: By status (active, expired, protected), date range,\
  \ click count range, and tags\n- **Sorting**: By creation date, click count, alphabetically\
  \ (ascending/descending)\n- **Pagination or infinite scroll** for large histories\
  \ (25 items per page)\n- **Bulk actions**: Select multiple links to delete, disable,\
  \ or export as CSV/JSON\n- **Tags/Labels**: Allow users to add custom tags to organize\
  \ links (e.g., \"marketing\", \"social\", \"campaign-q4\")\n\n---\n\n### \U0001F512\
  \ Security Requirements\n- Input sanitization on both client and server to prevent\
  \ XSS attacks\n- CSRF protection on all state-changing API endpoints\n- Validate\
  \ and sanitize redirect targets to prevent open redirect vulnerabilities (whitelist\
  \ allowed protocols, block `javascript:`, `data:`, `file:` schemes)\n- Implement\
  \ Content Security Policy (CSP) headers\n- Rate limiting: max 20 link creations\
  \ per minute per IP; max 100 API requests per minute\n- Secure HTTP headers: `X-Content-Type-Options`,\
  \ `X-Frame-Options`, `Strict-Transport-Security`\n- Never expose internal IDs; use\
  \ nanoid or UUID for public link identifiers\n\n---\n\n### ⚡ Performance Requirements\n\
  - Target Lighthouse scores: Performance >90, Accessibility >95, Best Practices >95,\
  \ SEO >90\n- Lazy-load analytics charts and non-critical assets\n- Debounce all\
  \ search and validation inputs\n- Use `IntersectionObserver` for scroll-based animations\
  \ and lazy loading\n- Minimize reflows and repaints; use CSS `transform` and `opacity`\
  \ for animations\n- Cache API responses where appropriate (e.g., analytics data\
  \ with 60s TTL)\n- Redirects should resolve in under 100ms server-side\n\n---\n\n\
  ### \U0001F9EA Error Handling & Edge Cases\n- Graceful error messages for: network\
  \ failures, API timeouts, invalid URLs, duplicate aliases, server errors (500),\
  \ rate limit exceeded (429)\n- Offline detection: show a banner when the user loses\
  \ connectivity and queue actions for retry\n- Handle extremely long URLs (up to\
  \ 2048 characters) without breaking the layout\n- Handle Unicode/internationalized\
  \ domain names (IDN) correctly\n- Empty state illustrations for when the user has\
  \ no links or no analytics data\n\n---\n\n### \U0001F4C1 Deliverables\n1. Complete,\
  \ well-commented source code with a clear folder structure\n2. `README.md` with\
  \ setup instructions, API documentation, and feature list\n3. API endpoint reference\
  \ table (method, path, parameters, response format)\n4. A `demo` mode with sample\
  \ data pre-loaded for immediate preview\n5. Responsive across Chrome, Firefox, Safari,\
  \ and Edge (latest 2 versions)\n\n---\n\n> **Note:** Build this incrementally —\
  \ start with the core shortening flow (input → validate → shorten → display → copy),\
  \ then layer on QR codes, analytics, custom aliases, expiration, password protection,\
  \ and the full history dashboard. Ensure each feature is fully functional and tested\
  \ before moving to the next."
