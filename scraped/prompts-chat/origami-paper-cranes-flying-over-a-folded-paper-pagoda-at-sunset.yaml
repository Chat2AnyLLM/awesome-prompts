prompt: A handcrafted origami paper art diorama of dozens of folded paper cranes flying
  in a sweeping arc over a five-tier folded-paper pagoda at sunset, in a wide landscape
  16:9 composition. About thirty origami cranes in crimson red, golden yellow, and
  cream white rise in a gentle curve from the lower left, just beside the sun, up
  and across to the upper right corner, each with sharp, crisp folds and visible paper
  grain. In the center, the pagoda stands on a stepped paper base with a small staircase
  at the top of a hill, built from natural cream paper with five tiers of upturned
  eaves trimmed in thin red edges, tiny railings, and small windows. A small pink
  folded-paper cherry blossom tree sits just left of the pagoda base, and a large
  cherry tree with a twisted brown paper trunk and clusters of pink paper blossoms
  fills the right foreground. Behind them, layered faceted paper mountains in beige,
  warm grey, and soft pink (pink on the left) recede in overlapping ridges, with crumpled
  beige paper hills in the foreground. A large flat orange textured paper circle sun
  hangs low on the left against a plain light grey-beige paper sky. Soft studio lighting
  with gentle shadows between the paper layers, shallow depth of field, warm and calm
  handcrafted mood. No text, no people.
