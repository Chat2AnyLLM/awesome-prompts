prompt: 'Traditional Turkish ebru paper marbling artwork: a bouquet of three red-and-white
  tulips, two purple hyacinths and a few slender green leaves floating on a swirled
  deep indigo and teal marbled ground, created entirely with the ebru technique of
  dropping ox-gall paints onto thickened water and shaping them with a stylus and
  horsehair brush. The tulip petals show the characteristic soft-edged, pulled-teardrop
  shapes of ebru flowers, with fine white veins dragged through the red; the hyacinths
  are built from clusters of tiny lilac dots; the background shows classic battal
  and gelgit combed patterns in indigo, teal, ochre and cream, with organic flowing
  lines and tiny paint speckles. Slightly irregular, hand-made look, matte paper texture
  visible, soft natural daylight, viewed straight on as a flat artwork filling the
  frame, portrait 3:4. No text, no signature, no frame, no people, no hands.'
