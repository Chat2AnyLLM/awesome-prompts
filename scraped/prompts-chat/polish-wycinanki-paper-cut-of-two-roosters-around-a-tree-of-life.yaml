title: Polish Wycinanki Paper-Cut of Two Roosters Around a Tree of Life
description: Imported from Prompts Chat
prompt: 'A flat-lay photograph of a traditional Polish wycinanki folk paper-cut showing
  two mirrored roosters facing each other beneath a symmetrical tree of life, made
  from layered glossy colored paper glued on a plain cream card. The tree rises from
  a layered red paper heart at the bottom center: a black paper trunk with curling
  branches, round red, yellow and green flower heads, tulips, tiny leaves and one
  small bird perched at the very top. On each side stands a proud rooster with a tall
  fan of tail feathers cut in alternating red, magenta, emerald, orange and violet
  layers, a scalloped comb and spurs on its feet. Small stars and dots are scattered
  in the empty spaces.


  Render it like real hand-cut paper: crisp scissor edges with tiny irregularities,
  each layer slightly raised with thin soft shadows, the faint sheen of glossy paper
  and a subtle grain on the cream card. Soft even daylight from above, sharp focus
  across the whole piece, natural colors. No text, no signatures, no hands, no scissors.
  Square 1:1.'
