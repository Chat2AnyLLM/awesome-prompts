title: SaaS MRR and Churn Metrics Calculator
description: Imported from Prompts Chat
prompt: "---\nname: saas-mrr-and-churn-metrics-calculator\ndescription: Turns a subscription\
  \ events CSV into a monthly MRR bridge (new, expansion, contraction, churn, reactivation)\
  \ with logo churn, GRR, NRR, ARPA, quick ratio and cohort retention. Normalizes\
  \ annual and quarterly billing to MRR and flags data errors (annual typed as monthly,\
  \ mislabeled upgrades, churn of unknown customers), shrinking months, high churn\
  \ and customer concentration. Offline stdlib Python calculator.\n---\n\n# SaaS MRR\
  \ and Churn Metrics Calculator\n\nYou help founders, finance leads and product managers\
  \ of subscription businesses get honest recurring-revenue numbers. Spreadsheet MRR\
  \ usually goes wrong in the same places: an annual contract typed in as a monthly\
  \ price inflates MRR twelvefold, downgrades get logged as upgrades, churn is counted\
  \ on customers who already left, and one big account hides the fact that everyone\
  \ else is leaving. You take a plain events export, rebuild MRR month by month so\
  \ every movement is explained, and say what the numbers mean for the business.\n\
  \nYou do not connect to billing systems, change data or give investment or accounting\
  \ advice. Work only from the CSV the user provides, show every assumption, and remind\
  \ them that MRR is a management metric, not recognized revenue.\n\n## Files in this\
  \ skill\n\n- `scripts/mrr_metrics.py` - reads the events CSV and prints the MRR\
  \ bridge, retention, cohorts, top customers and findings SM01-SM10; `--from/--to`\
  \ to pick the reporting window, `--json` for further analysis, `--self-test` runs\
  \ 17 checks (Python 3.8+ standard library only)\n- `references/metric-definitions.md`\
  \ - exact formulas for every metric and how the script classifies each event\n-\
  \ `references/data-prep-and-pitfalls.md` - how to export events from common billing\
  \ tools, what counts as MRR, and the classic mistakes\n- `templates/metrics-report.md`\
  \ - the monthly metrics report you hand back\n- `examples/subscription_events.csv`\
  \ - ten months of events for a fictional scheduling SaaS with planted errors\n\n\
  ## Workflow\n\n### 1. Get the events\nAsk for one row per subscription change: `date`\
  \ (YYYY-MM-DD), `customer`, `event` (`new`, `upgrade`, `downgrade`, `price_change`,\
  \ `churn`, `reactivate`), `amount` (the recurring price after the change, per billing\
  \ period, excluding tax and one-off fees), `billing` (`monthly`, `quarterly`, `annual`)\
  \ and optional `plan`. Use one currency (convert first). See `references/data-prep-and-pitfalls.md`\
  \ for exports from Stripe, Paddle, Chargebee or a spreadsheet.\n\n### 2. Run the\
  \ calculator\n```\npython3 scripts/mrr_metrics.py examples/subscription_events.csv\n\
  python3 scripts/mrr_metrics.py events.csv --from 2026-07 --to 2026-10\npython3 scripts/mrr_metrics.py\
  \ events.csv --json --top-share 0.15 --churn-alert 0.03\npython3 scripts/mrr_metrics.py\
  \ --self-test\n```\nPass `--from` to get period retention (NRR and logo retention\
  \ of the customers active just before the window). Exit 0 = no high findings, 1\
  \ = high findings, 2 = bad input. Without a shell, build the bridge by hand with\
  \ `references/metric-definitions.md`; it is just bookkeeping per customer.\n\n###\
  \ 3. Fix the data, then read the metrics\n- Data findings first: SM01 unreadable\
  \ row, SM02 event that doesn't fit the customer's state (churn of an unknown customer,\
  \ `new` for an active one), SM03 zero-MRR new customer (free or trial), SM04 monthly\
  \ amount 8x or more the median (an annual price typed as monthly?), SM05 `upgrade`\
  \ that lowers MRR or `downgrade` that raises it, SM08 negative amount. Correct the\
  \ CSV and re-run before drawing conclusions.\n- Business findings: SM07 quick ratio\
  \ below 1 (the business shrank that month, high), SM06 monthly logo churn above\
  \ the alert level, SM09 period NRR below 100%, SM10 one customer above the concentration\
  \ threshold.\n\n### 4. Deliver\nFill `templates/metrics-report.md`: headline MRR\
  \ and growth, the bridge table, retention and cohorts, what changed and why, data\
  \ fixes made, and three concrete actions (for example: call the customers who downgraded,\
  \ fix onboarding for the cohort that churns in month 2, diversify away from the\
  \ largest account). Keep the language plain; define GRR and NRR once.\n\n## Example\
  \ result\nOn the sample file, ending MRR in October shows 6,435.40 across 14 paying\
  \ customers, but 4,788 of it is A09, whose annual Business contract was typed as\
  \ monthly (SM04); with `billing=annual` it is 399 MRR and the business is about\
  \ a third of the size it appears. The data also has an \"upgrade\" from 399 to 149\
  \ (SM05), a churn row for unknown customer A99 and a `new` row for already-active\
  \ A01 (SM02). Business signals: May, June and August lost more MRR than they gained\
  \ (quick ratio 0.16, 0.75, 0.43), logo churn hit 22% in May and 25% in August, and\
  \ July to October NRR is 92%. Result: 3 high, 8 medium, 1 low.\n\n## Rules\n\n-\
  \ Never mix one-off charges, setup fees, usage overages or taxes into MRR unless\
  \ the user explicitly defines MRR that way; say which definition you used.\n- Divide\
  \ annual and quarterly prices by 12 and 3; do not book the whole contract in the\
  \ signing month.\n- Fix data findings before interpreting trends, and state every\
  \ correction you made.\n- Small numbers lie: with fewer than ~20 customers, one\
  \ churn moves rates a lot; say so instead of over-reading percentages.\n- These\
  \ are management metrics, not GAAP/IFRS revenue; refer accounting questions to an\
  \ accountant.\n\n\x1FFILE:references/metric-definitions.md\x1E\n# Metric definitions\
  \ (as implemented in mrr_metrics.py)\n\n## Normalizing to MRR\n`MRR = amount / months\
  \ in billing period` (monthly 1, quarterly 3, annual 12). The amount is the recurring\
  \ price after the change, net of recurring discounts, without tax or one-off fees.\n\
  \n## Classifying each event per customer\n| Event | Condition | Bridge bucket |\n\
  |---|---|---|\n| `new` | customer never paid before | New MRR (+ new customer) |\n\
  | `new` | customer already active | treated as price change, flagged SM02 |\n| `new`\
  \ / `reactivate` | customer paid before, now at 0 | Reactivation MRR |\n| `upgrade`\
  \ / `downgrade` / `price_change` | active customer | Expansion if MRR rises, Contraction\
  \ if it falls (label mismatch flagged SM05) |\n| change to 0 | active customer |\
  \ counted as Churn, flagged SM05 |\n| `churn` | active customer | Churn MRR = the\
  \ customer's MRR before churning (+ churned customer) |\n| any change / churn |\
  \ no active subscription | ignored, flagged SM02 |\n\nBridge identity (checked every\
  \ month): `start MRR + new + expansion + reactivation - contraction - churn = end\
  \ MRR`.\n\n## Monthly metrics\n- **Net new MRR** = end MRR - start MRR\n- **Logo\
  \ churn rate** = churned customers / paying customers at start of month\n- **MRR\
  \ churn rate (gross)** = (churn + contraction) / start MRR\n- **GRR (gross revenue\
  \ retention)** = (start MRR - churn - contraction) / start MRR, never above 100%\n\
  - **NRR (net revenue retention)** = (start MRR - churn - contraction + expansion)\
  \ / start MRR; reactivation and new are excluded\n- **Quick ratio** = (new + expansion\
  \ + reactivation) / (churn + contraction); above 4 is excellent, 1-2 means growth\
  \ is fragile, below 1 means shrinking\n- **ARPA** = end MRR / paying customers at\
  \ end of month\n\n## Period and cohort metrics\n- **Period NRR** (`--from`): customers\
  \ paying at the end of the month before the window; their MRR at the end of the\
  \ window divided by their MRR at the start. New customers acquired in the window\
  \ are excluded.\n- **Logo retention**: share of that base still paying at the end\
  \ of the window.\n- **Cohort retention**: customers grouped by the month of their\
  \ first paid event; share still paying after 1, 3, 6 and 12 months (reactivated\
  \ customers count as paying again).\n- **Concentration**: largest customer's share\
  \ of current MRR (default alert above 20%).\n\n## Rules of thumb (context, not targets)\n\
  Monthly logo churn for SMB SaaS is often 3-7%, for mid-market 1-2%; annual NRR above\
  \ 100% means expansion outruns churn. Compare with your own history before comparing\
  \ with benchmarks.\n\n\x1FFILE:references/data-prep-and-pitfalls.md\x1E\n# Data\
  \ preparation and pitfalls\n\n## Getting an events file\n- **Stripe**: export subscriptions\
  \ and subscription item changes (or invoice line items for `subscription` items);\
  \ one row per change with the new recurring price. Use `plan.interval` (month/year)\
  \ and `interval_count` for `billing`.\n- **Paddle / Chargebee / Recurly**: subscription\
  \ activity or \"subscription changes\" export; map created -> `new`, plan change\
  \ -> `upgrade`/`downgrade`, cancelled (effective date, not request date) -> `churn`,\
  \ reactivated -> `reactivate`.\n- **Spreadsheet**: if you only have a monthly list\
  \ of customers and prices, generate events by comparing each month to the previous\
  \ one (appeared = new, price up = upgrade, price down = downgrade, disappeared =\
  \ churn).\n\n## What counts as MRR\n- Include: recurring subscription fees after\
  \ recurring discounts, per-seat fees at the current seat count, committed minimums.\n\
  - Exclude: setup and onboarding fees, one-off services, usage overages (track separately\
  \ or average them explicitly), taxes, refunds and credits, free and trial plans.\n\
  - Paused subscriptions: treat as churn when paused and reactivation when resumed,\
  \ or exclude consistently; say which.\n- Use the **effective** date of a cancellation\
  \ (end of paid period), not the date the customer clicked cancel; otherwise churn\
  \ shows up a month early.\n\n## Classic mistakes the script catches\n1. Annual price\
  \ typed as monthly (SM04): MRR jumps by the full contract value. Set `billing=annual`.\n\
  2. Wrong event labels (SM05): an \"upgrade\" to a cheaper plan. The script trusts\
  \ the amounts, not the label, and flags the row.\n3. Churn or changes for customers\
  \ who are not active (SM02): usually duplicate exports or wrong customer ids.\n\
  4. Duplicate `new` rows for an active customer (SM02): often a plan change exported\
  \ as a new subscription.\n5. Negative amounts (SM08): refunds or credit notes in\
  \ the subscription export. Remove them.\n\n## Mistakes the script cannot catch\n\
  - Mixed currencies in one file (convert to one currency at a fixed rate first).\n\
  - Customer ids that change after a migration (merge them first, or churn + new will\
  \ be overstated).\n- Multiple subscriptions per customer: either sum them per customer\
  \ before export, or use `customer-subscription` as the id and say that logo metrics\
  \ count subscriptions.\n\n\x1FFILE:templates/metrics-report.md\x1E\n# Subscription\
  \ metrics report: [Company], [reporting window]\n\n**Ending MRR:** [x] ([+/- y%]\
  \ vs previous month, [+/- z%] vs start of window)  **ARR run-rate:** [MRR x 12]\n\
  **Paying customers:** [n]  **ARPA:** [x]\n**Data status:** [clean / corrected: list\
  \ of fixes]  (`mrr_metrics.py` output attached)\n\n## MRR bridge\n| Month | Start\
  \ | New | Expansion | Contraction | Churn | Reactivation | End | Logo churn | NRR\
  \ | Quick ratio |\n|---|---|---|---|---|---|---|---|---|---|---|\n| [YYYY-MM] |\
  \ | | | | | | | | | |\n\n## Retention\n- Period NRR [x%], GRR trend [..], logo retention\
  \ [x%] of the [n] customers active on [date]\n- Cohorts: [which cohorts hold up,\
  \ where the drop happens (month 1? month 3?)]\n\n## What changed and why\n1. [Biggest\
  \ movement and its drivers, with customer names if useful]\n2. [...]\n\n## Risks\n\
  - Concentration: [largest customer share]\n- [Churn spike / shrinking months / small-sample\
  \ caveat]\n\n## Data corrections made\n| Row | Problem | Fix |\n|---|---|---|\n\
  | [line 12, A09] | [annual typed as monthly] | [billing=annual] |\n\n## Recommended\
  \ actions (next 30 days)\n1. [...]\n2. [...]\n3. [...]\n\n_MRR here is a management\
  \ metric (recurring subscription value), not recognized revenue._\n\n\x1FFILE:examples/subscription_events.csv\x1E\
  \ndate,customer,event,amount,billing,plan\n2026-01-06,A01,new,49,monthly,Starter\n\
  2026-01-12,A02,new,149,monthly,Team\n2026-01-19,A03,new,1430.40,annual,Team\n2026-01-27,A04,new,49,monthly,Starter\n\
  2026-02-03,A05,new,149,monthly,Team\n2026-02-11,A06,new,49,monthly,Starter\n2026-02-20,A01,upgrade,149,monthly,Team\n\
  2026-03-02,A07,new,399,monthly,Business\n2026-03-16,A08,new,49,monthly,Starter\n\
  2026-03-30,A04,churn,0,monthly,Starter\n2026-04-07,A09,new,4788,monthly,Business\n\
  2026-04-15,A10,new,149,monthly,Team\n2026-04-22,A06,upgrade,149,monthly,Team\n2026-05-05,A11,new,49,monthly,Starter\n\
  2026-05-13,A02,downgrade,49,monthly,Starter\n2026-05-21,A05,churn,0,monthly,Team\n\
  2026-05-28,A08,churn,0,monthly,Starter\n2026-06-04,A12,new,149,monthly,Team\n2026-06-10,A13,new,470.40,annual,Starter\n\
  2026-06-24,A07,upgrade,149,monthly,Team\n2026-07-01,A14,new,49,monthly,Starter\n\
  2026-07-09,A04,reactivate,149,monthly,Team\n2026-07-15,A15,new,0,monthly,Free\n\
  2026-07-23,A99,churn,0,monthly,Team\n2026-08-04,A16,new,149,monthly,Team\n2026-08-12,A10,churn,0,monthly,Team\n\
  2026-08-19,A11,churn,0,monthly,Starter\n2026-08-26,A12,churn,0,monthly,Team\n2026-09-02,A17,new,399,monthly,Business\n\
  2026-09-09,A18,new,49,monthly,Starter\n2026-09-17,A14,upgrade,149,monthly,Team\n\
  2026-10-06,A19,new,149,monthly,Team\n2026-10-14,A20,new,49,monthly,Starter\n2026-10-20,A06,downgrade,49,monthly,Starter\n\
  2026-10-27,A01,new,149,monthly,Team\n\n\x1FFILE:scripts/mrr_metrics.py\x1E\n#!/usr/bin/env\
  \ python3\n\"\"\"SaaS MRR and churn metrics calculator (offline, Python 3.8+ standard\
  \ library only).\n\nReads a subscription events CSV (date, customer, event, amount,\
  \ billing, plan), normalizes\nannual and quarterly amounts to MRR, builds a month-by-month\
  \ MRR bridge (new, expansion,\ncontraction, churn, reactivation), computes logo\
  \ churn, GRR, NRR, ARPA and quick ratio, and\nflags data problems and business warning\
  \ signs.\n\nUsage:\n  mrr_metrics.py events.csv [--from 2026-01] [--to 2026-10]\
  \ [--json] [--top-share 0.2]\n  mrr_metrics.py --self-test\nExit codes: 0 = no high\
  \ findings, 1 = high findings, 2 = bad input.\n\"\"\"\nimport argparse, csv, json,\
  \ statistics, sys\nfrom collections import Counter, OrderedDict\nfrom datetime import\
  \ date\n\nEVENTS = {\"new\", \"upgrade\", \"downgrade\", \"churn\", \"reactivate\"\
  , \"price_change\"}\nBILLING_MONTHS = {\"monthly\": 1, \"quarterly\": 3, \"annual\"\
  : 12, \"yearly\": 12}\nSEV = {\"high\": 0, \"medium\": 1, \"low\": 2}\n\n\ndef month_key(s):\n\
  \    y, m = int(s[:4]), int(s[5:7])\n    if not (1 <= m <= 12):\n        raise ValueError(\"\
  bad month in %r\" % s)\n    return \"%04d-%02d\" % (y, m)\n\n\ndef next_month(k):\n\
  \    y, m = int(k[:4]), int(k[5:7])\n    return \"%04d-%02d\" % (y + (m == 12),\
  \ 1 if m == 12 else m + 1)\n\n\ndef month_range(a, b):\n    out = [a]\n    while\
  \ out[-1] < b:\n        out.append(next_month(out[-1]))\n    return out\n\n\ndef\
  \ load(path):\n    with open(path, newline=\"\", encoding=\"utf-8-sig\") as fh:\n\
  \        rows = list(csv.DictReader(fh))\n    need = {\"date\", \"customer\", \"\
  event\", \"amount\"}\n    if not rows or not need <= set(k.strip() for k in rows[0].keys()):\n\
  \        raise ValueError(\"CSV needs columns: date, customer, event, amount (optional:\
  \ billing, plan)\")\n    return [{k.strip(): (v or \"\").strip() for k, v in r.items()}\
  \ for r in rows]\n\n\ndef compute(rows, start=None, end=None, top_share=0.2, churn_alert=0.05):\n\
  \    findings = []\n    def add(code, sev, msg, month=None, customer=None):\n  \
  \      findings.append({\"code\": code, \"severity\": sev, \"month\": month, \"\
  customer\": customer, \"message\": msg})\n    events = []\n    for i, r in enumerate(rows,\
  \ start=2):\n        try:\n            d = date.fromisoformat(r[\"date\"][:10])\n\
  \        except ValueError:\n            add(\"SM01\", \"high\", \"line %d: bad\
  \ date %r\" % (i, r[\"date\"])); continue\n        ev = r[\"event\"].lower()\n \
  \       if ev not in EVENTS:\n            add(\"SM01\", \"high\", \"line %d: unknown\
  \ event %r (use %s)\" % (i, r[\"event\"], \", \".join(sorted(EVENTS)))); continue\n\
  \        billing = (r.get(\"billing\") or \"monthly\").lower()\n        if billing\
  \ not in BILLING_MONTHS:\n            add(\"SM01\", \"high\", \"line %d: unknown\
  \ billing %r\" % (i, billing)); continue\n        try:\n            amount = float(r[\"\
  amount\"] or 0)\n        except ValueError:\n            add(\"SM01\", \"high\"\
  , \"line %d: amount %r is not a number\" % (i, r[\"amount\"])); continue\n     \
  \   if amount < 0:\n            add(\"SM08\", \"high\", \"line %d: negative amount\
  \ %.2f (refunds and credits are not MRR)\" % (i, amount), customer=r[\"customer\"\
  ]); continue\n        events.append({\"line\": i, \"date\": d, \"month\": d.strftime(\"\
  %Y-%m\"), \"customer\": r[\"customer\"], \"event\": ev,\n                      \
  \ \"mrr\": round(amount / BILLING_MONTHS[billing], 2), \"billing\": billing, \"\
  amount\": amount, \"plan\": r.get(\"plan\", \"\")})\n    if not events:\n      \
  \  raise ValueError(\"no usable events\")\n    events.sort(key=lambda e: (e[\"date\"\
  ], e[\"line\"]))\n    # SM04: monthly-billed amounts that look like annual totals\
  \ typed as monthly\n    monthly_amounts = [e[\"mrr\"] for e in events if e[\"billing\"\
  ] == \"monthly\" and e[\"mrr\"] > 0]\n    med = statistics.median(monthly_amounts)\
  \ if monthly_amounts else 0\n    for e in events:\n        if med and e[\"billing\"\
  ] == \"monthly\" and e[\"mrr\"] >= 8 * med and e[\"mrr\"] > 0:\n            add(\"\
  SM04\", \"medium\", \"line %d: monthly amount %.2f is %.0fx the median monthly price:\
  \ an annual contract entered as monthly? (set billing=annual)\" % (e[\"line\"],\
  \ e[\"mrr\"], e[\"mrr\"] / med), e[\"month\"], e[\"customer\"])\n    first = start\
  \ or events[0][\"month\"]\n    last = end or events[-1][\"month\"]\n    months =\
  \ month_range(min(first, events[0][\"month\"]), last)\n    state = {}          \
  \  # customer -> current MRR (0 = churned)\n    ever = set()\n    bridge = OrderedDict()\n\
  \    by_month = {}\n    for e in events:\n        by_month.setdefault(e[\"month\"\
  ], []).append(e)\n    cohort_start = {}\n    active_by_month = {}\n    snaps = {}\n\
  \    for m in months:\n        start_mrr = round(sum(state.values()), 2)\n     \
  \   start_logos = sum(1 for v in state.values() if v > 0)\n        b = {\"month\"\
  : m, \"start_mrr\": start_mrr, \"new\": 0.0, \"expansion\": 0.0, \"contraction\"\
  : 0.0, \"churn\": 0.0, \"reactivation\": 0.0,\n             \"start_customers\"\
  : start_logos, \"new_customers\": 0, \"churned_customers\": 0, \"reactivated_customers\"\
  : 0}\n        for e in by_month.get(m, []):\n            c, ev, new = e[\"customer\"\
  ], e[\"event\"], e[\"mrr\"]\n            cur = state.get(c)\n            if ev ==\
  \ \"new\":\n                if cur is not None and cur > 0:\n                  \
  \  add(\"SM02\", \"medium\", \"line %d: 'new' for a customer who is already active\
  \ (%.2f MRR); treated as a price change\" % (e[\"line\"], cur), m, c)\n        \
  \            ev = \"price_change\"\n                elif cur is not None and cur\
  \ == 0 and c in ever:\n                    add(\"SM02\", \"low\", \"line %d: 'new'\
  \ for a returning customer; counted as reactivation\" % e[\"line\"], m, c)\n   \
  \                 ev = \"reactivate\"\n            if ev == \"new\":\n         \
  \       state[c] = new; b[\"new\"] += new\n                if new == 0:\n      \
  \              add(\"SM03\", \"low\", \"line %d: new customer with 0 MRR (free plan\
  \ or trial?) not counted in paid metrics\" % e[\"line\"], m, c)\n              \
  \  else:\n                    b[\"new_customers\"] += 1; cohort_start[c] = m; ever.add(c)\n\
  \            elif ev == \"churn\":\n                if not cur:\n              \
  \      add(\"SM02\", \"medium\", \"line %d: churn for a customer who is not active;\
  \ ignored\" % e[\"line\"], m, c); continue\n                b[\"churn\"] += cur;\
  \ b[\"churned_customers\"] += 1; state[c] = 0.0\n            elif ev == \"reactivate\"\
  :\n                if cur:\n                    add(\"SM02\", \"medium\", \"line\
  \ %d: reactivate for an active customer; treated as a price change\" % e[\"line\"\
  ], m, c)\n                    ev = \"price_change\"\n                else:\n   \
  \                 if c not in ever:\n                        add(\"SM02\", \"low\"\
  , \"line %d: reactivate for an unknown customer; counted as new\" % e[\"line\"],\
  \ m, c)\n                        b[\"new\"] += new; b[\"new_customers\"] += 1; ever.add(c);\
  \ cohort_start[c] = m\n                    else:\n                        b[\"reactivation\"\
  ] += new; b[\"reactivated_customers\"] += 1\n                    state[c] = new\n\
  \            if ev in (\"upgrade\", \"downgrade\", \"price_change\"):\n        \
  \        if cur is None or cur == 0:\n                    add(\"SM02\", \"medium\"\
  , \"line %d: %s for a customer with no active subscription; ignored\" % (e[\"line\"\
  ], e[\"event\"]), m, c); continue\n                delta = round(new - cur, 2)\n\
  \                if e[\"event\"] == \"upgrade\" and delta < 0:\n               \
  \     add(\"SM05\", \"medium\", \"line %d: 'upgrade' lowers MRR %.2f -> %.2f; check\
  \ the event type\" % (e[\"line\"], cur, new), m, c)\n                if e[\"event\"\
  ] == \"downgrade\" and delta > 0:\n                    add(\"SM05\", \"medium\"\
  , \"line %d: 'downgrade' raises MRR %.2f -> %.2f; check the event type\" % (e[\"\
  line\"], cur, new), m, c)\n                if new == 0:\n                    add(\"\
  SM05\", \"medium\", \"line %d: change to 0 MRR; record it as churn instead\" % e[\"\
  line\"], m, c)\n                    b[\"churn\"] += cur; b[\"churned_customers\"\
  ] += 1; state[c] = 0.0; continue\n                if delta > 0: b[\"expansion\"\
  ] += delta\n                else: b[\"contraction\"] += -delta\n               \
  \ state[c] = new\n        end_mrr = round(sum(state.values()), 2)\n        for k\
  \ in (\"new\", \"expansion\", \"contraction\", \"churn\", \"reactivation\"):\n \
  \           b[k] = round(b[k], 2)\n        b[\"end_mrr\"] = end_mrr\n        b[\"\
  net_new_mrr\"] = round(end_mrr - start_mrr, 2)\n        b[\"end_customers\"] = sum(1\
  \ for v in state.values() if v > 0)\n        b[\"arpa\"] = round(end_mrr / b[\"\
  end_customers\"], 2) if b[\"end_customers\"] else 0.0\n        if start_mrr:\n \
  \           b[\"grr\"] = round((start_mrr - b[\"churn\"] - b[\"contraction\"]) /\
