  \ the tests>`\n2. `git status --ignored --short` and check nothing important shows\
  \ as `!!`\n3. Untrack files that are now ignored but were committed: `git rm --cached\
  \ <path>` (rotate any secret that was committed)\n4. Commit: `chore: fix .gitignore\
  \ (<short reason>)`\n\n## Follow-ups\n- <move editor files to the global ignore\
  \ file>\n- <add a secret scanner (gitleaks, trufflehog) to CI>\n\x1FFILE:examples/webapp.gitignore\x1E\
  \n# Dependencies\nnode_modules\n/vendor/\n\n# Build output\ndist/\nbuild\n*.log\n\
  logs/\n!logs/.gitkeep\n\n# Environment\n.env*\nconfig/secrets.yml # never commit\n\
  \n# OS and editor files\n.DS_Store\n.idea/\n*.swp\n Thumbs.db\n\n# Test coverage\n\
  coverage/**\n!coverage/README.md\n\n# Generated code\nsrc\\generated\n*.log\n\x1F\
  FILE:examples/webapp-fixed.gitignore\x1E\n# Dependencies\nnode_modules/\n/vendor/\n\
  \n# Build output (root only, so src/build/ stays tracked)\n/dist/\n/build/\n*.log\n\
  # ignore the contents of logs/, not the folder, so the negation can work\nlogs/*\n\
  !logs/.gitkeep\n\n# Environment and secrets\n.env\n.env.*\n!.env.example\n*.pem\n\
  *.key\nid_rsa*\n# never commit\nconfig/secrets.yml\n\n# OS and editor files\n.DS_Store\n\
  Thumbs.db\n.idea/\n*.swp\n\n# Test coverage\ncoverage/**\n!coverage/README.md\n\n\
  # Generated code\n/src/generated/\n\x1FFILE:examples/webapp-paths.txt\x1E\n# Paths\
  \ for examples/webapp.gitignore and webapp-fixed.gitignore\n# \"+ path\" = must\
  \ be ignored, \"- path\" = must stay committable\n+ node_modules/react/index.js\n\
  + packages/api/node_modules/lodash/lodash.js\n+ vendor/autoload.php\n- packages/vendor/README.md\n\
  + dist/app.js\n+ build/output.js\n- src/build/README.md\n+ logs/app.log\n- logs/.gitkeep\n\
  + .env\n+ .env.local\n- .env.example\n+ config/secrets.yml\n+ .DS_Store\n+ Thumbs.db\n\
  + coverage/lcov.info\n- coverage/README.md\n+ src/generated/types.ts\n- src/index.ts\n\
  \x1FFILE:scripts/gitignore_check.py\x1E\n#!/usr/bin/env python3\n\"\"\"Gitignore\
  \ pattern tester and reviewer (Python 3 standard library only).\n\nExplains every\
  \ rule in a .gitignore file, tests the file against paths that must be\nignored\
  \ (\"+ path\") or must stay committable (\"- path\"), names the rule that decides\n\
  each path, and flags common mistakes: negations that cannot work because a parent\n\
  directory is excluded, inline comments, leading spaces, Windows backslashes, stray\n\
  \"**\", duplicates, secrets that are not covered and .env.example being ignored.\n\
  \nMatching follows git's documented gitignore rules for a single .gitignore at the\n\
  repository root: last matching rule wins, \"!\" re-includes, a trailing \"/\" matches\n\
  directories only, a \"/\" at the start or in the middle anchors the pattern to the\n\
  .gitignore's directory, \"*\" \"?\" \"[...]\" never match \"/\", \"**\" spans directories,\n\
  and a file can never be re-included if a parent directory is excluded.\n\nUsage:\n\
  \  python3 gitignore_check.py .gitignore [--test paths.txt] [--json]\n  python3\
