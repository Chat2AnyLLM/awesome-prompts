  \   rules, findings, seen = [], [], {}\n    for no, raw in enumerate(text.split(\"\
  \\n\"), 1):\n        if raw.endswith(\"\\r\"):\n            findings.append((\"\
  LOW\", \"CRLF\", no, \"line ends with CR (Windows line ending)\",\n            \
