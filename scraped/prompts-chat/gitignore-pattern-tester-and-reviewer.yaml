  !\\\"#$%&'()*+,-./:;<=>?@[\\\\]^_`{|}~\"), \"blank\": \" \\\\t\"}\n\n\nclass Rule:\n\
  \    def __init__(self, line_no, raw, negate, dir_only, anchored, body, regex):\n\
