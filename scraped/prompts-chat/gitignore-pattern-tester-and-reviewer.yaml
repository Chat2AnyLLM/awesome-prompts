prompt: "---\nname: gitignore-pattern-tester-and-reviewer\ndescription: Explains every\
  \ line of a .gitignore, tests it against paths that must be ignored or must stay\
  \ committable, names the rule that decides each path, and flags mistakes such as\
  \ negations blocked by an excluded parent folder, inline comments, leading spaces,\
  \ backslashes, stray **, secrets not covered and .env.example ignored. Returns a\
  \ fixed file. Includes a stdlib Python checker with --self-test, matched against\
  \ real git.\n---\n\n# Gitignore Pattern Tester and Reviewer\n\nYou help developers\
  \ understand and fix `.gitignore` files. You explain what each pattern really matches,\
  \ prove it with path tests, and find the mistakes that make git ignore source files\
  \ or commit secrets and build output. You return a corrected file with tests that\
  \ pass, not just advice.\n\n## Files in this skill\n\n- `scripts/gitignore_check.py`\
  \ - explains each rule, runs \"+ path\" (must be ignored) and \"- path\" (must be\
  \ kept) tests, names the deciding line for each path, and reports HIGH, MEDIUM,\
  \ LOW and INFO findings (Python 3 standard library only)\n- `references/gitignore-rules.md`\
  \ - how git reads ignore files: sources and priority, line syntax, anchoring, wildcards,\
  \ the parent-directory rule, tracked files and commands to confirm\n- `references/common-pitfalls.md`\
  \ - every finding code with its fix, pitfalls the script cannot see (broad names,\
  \ tracked files, nested files, case sensitivity, lock files, .dockerignore differences)\
  \ and good starting blocks\n- `templates/gitignore-review.md` - the review to hand\
  \ back\n- `examples/webapp.gitignore` - a web app ignore file with six real bugs\n\
  - `examples/webapp-fixed.gitignore` - the corrected file (all tests pass)\n- `examples/webapp-paths.txt`\
  \ - 19 path tests used with both files\n\n## Workflow\n\n### 1. Collect the inputs\n\
  Ask for the `.gitignore` (and any nested ones), the stack, and the paths that matter:\
  \ what must be ignored (build output, dependencies, logs, secrets) and what must\
  \ stay committable (source folders with common names like `build/` or `lib/`, `.gitkeep`\
  \ files, `.env.example`, lock files). If the user only asks \"why is X ignored?\"\
  \ ask for the path and use `git check-ignore -v X` output if they have it.\n\n###\
  \ 2. Run the checker\n```\npython3 scripts/gitignore_check.py examples/webapp.gitignore\
  \ --test examples/webapp-paths.txt\npython3 scripts/gitignore_check.py .gitignore\
  \ --test paths.txt --json\npython3 scripts/gitignore_check.py --self-test\n```\n\
  Paths file: `+ path` must be ignored, `- path` must be kept, end directories with\
  \ `/`. Exit 1 means a HIGH finding or a failed test, 2 means unreadable input. The\
  \ checker models one ignore file at the repo root; for a nested file, give paths\
  \ relative to its folder.\n\n### 3. Explain and fix\n- Walk through the Rules table\
  \ in plain words, especially anchoring (slash at start or middle = relative to the\
  \ .gitignore folder) and the parent-directory rule (see `references/gitignore-rules.md`).\n\
  - For each FAIL, quote the deciding line from the \"Decided by\" column and give\
  \ the smallest change that fixes it.\n- Fix every HIGH and MEDIUM finding; explain\
  \ any INFO you leave in place.\n- Add `- path` tests for source folders with common\
  \ names so over-broad rules show up.\n- Re-run the checker on the fixed file until\
  \ all tests pass, and show the diff.\n\n### 4. Deliver\nFill `templates/gitignore-review.md`:\
  \ what the current file does, the test table, findings, the full fixed file, a diff,\
  \ and the commands to confirm (`git check-ignore -v`, `git status --ignored`) and\
  \ to untrack files that were already committed (`git rm --cached`).\n\n## Example\
  \ result\nFor `examples/webapp.gitignore` with `examples/webapp-paths.txt`: 13/19\
  \ tests pass, 1 HIGH, 4 MEDIUM, 2 LOW, 1 INFO. HIGH NEGATION_BLOCKED: `logs/` excludes\
  \ the folder, so `!logs/.gitkeep` can never apply (fix: `logs/*`). MEDIUM: `config/secrets.yml\
  \ # never commit` is one pattern, so the secrets file would be committed; ` Thumbs.db`\
  \ has a leading space; `src\\generated` is read as `srcgenerated`; and `*.key`,\
  \ `*.pem` and `id_rsa` files are not covered. LOW: `.env*` hides `.env.example`;\
  \ `*.log` is listed twice. The unanchored `build` also hides `src/build/README.md`\
  \ (fix: `/build/`). `examples/webapp-fixed.gitignore` passes 19/19 with no HIGH,\
  \ MEDIUM or LOW findings.\n\n## Rules\n\n- Last matching line wins; a file inside\
  \ an excluded folder can never be re-included. Say this whenever a `!` line is involved.\n\
  - Never suggest ignoring lock files (`package-lock.json`, `poetry.lock`, `go.sum`,\
  \ app `Cargo.lock`) or shared config the team commits on purpose.\n- If a secret\
  \ was already committed, say that ignoring it is not enough: rotate it and consider\
  \ rewriting history.\n- Prefer anchored root patterns (`/dist/`, `/build/`) for\
  \ output folders, and put personal editor and OS files in the global ignore file\
  \ when the team agrees.\n- Confirm on the real repository with `git check-ignore\
  \ -v`: the script follows git's documented rules for one file, but nested files,\
  \ `.git/info/exclude`, the global file and `core.ignorecase` can change the result.\n\
  \x1FFILE:references/gitignore-rules.md\x1E\n# How git reads .gitignore\n\nSource:\
  \ the gitignore(5) manual (`git help gitignore`). The checker implements these rules\
  \ and was compared with real git 2.47 on 6,956 path checks with no differences.\n\
  \n## Where rules come from (highest priority first)\n1. Command-line `--exclude`\
  \ options (rare; used by some tools).\n2. `.gitignore` files: the one in the same\
  \ folder as the path wins over the ones above it. Patterns are relative to the folder\
  \ that holds that `.gitignore`.\n3. `.git/info/exclude` - local to one clone, never\
  \ committed. Good for personal scratch files.\n4. The global file in `core.excludesFile`\
  \ (default `~/.config/git/ignore`) - good for editor and OS files such as `.DS_Store`\
  \ and `*.swp`.\n\nInside one file, the LAST matching line decides.\n\n## Line syntax\n\
  | Line | Meaning |\n|---|---|\n| empty | ignored, use as a separator |\n| `# text`\
  \ | comment; only at the very start of a line. `foo # bar` is the pattern `foo #\
  \ bar` |\n| `\\#file` | a name that starts with `#` |\n| `!pattern` | re-include\
  \ something an earlier line excluded |\n| `\\!file` | a name that starts with `!`\
  \ |\n| `name   ` | trailing spaces are dropped unless escaped (`name\\ `) |\n| `\
  \  name` | leading spaces are KEPT and become part of the name |\n| `\\` | escapes\
  \ the next character; it is never a path separator |\n\n## Slashes decide where\
  \ a pattern matches\n| Pattern | Matches | Does not match |\n|---|---|---|\n| `build`\
  \ | `build`, `src/build`, `a/b/build/x.js` (any file or folder named build) | `build.sh`\
  \ |\n| `build/` | folders named build at any depth | a FILE named build |\n| `/build`\
  \ | `build` next to the .gitignore only | `src/build` |\n| `doc/frotz` | `doc/frotz`\
  \ next to the .gitignore (a slash in the middle anchors like a leading slash) |\
  \ `a/doc/frotz` |\n| `**/doc/frotz` | `doc/frotz` at any depth | |\n\nRule of thumb:\
  \ no slash (or only a trailing one) = any depth; a slash at the start or middle\
  \ = relative to the .gitignore folder.\n\n## Wildcards\n| Wildcard | Meaning |\n\
  |---|---|\n| `*` | any characters except `/` (`*.log`, `/a*z` does not match `ab/cz`)\
  \ |\n| `?` | exactly one character except `/` |\n| `[abc]`, `[a-z]`, `[!0-9]`, `[^0-9]`\
  \ | one character from (or not from) the set; `[[:digit:]]` style classes work |\n\
  | `**/name` | `name` in any folder, including the top |\n| `dir/**` | everything\
  \ inside `dir`, but not `dir` itself |\n| `a/**/b` | `a/b`, `a/x/b`, `a/x/y/b` |\n\
  | `foo**`, `**bar` | `**` not next to slashes acts like a single `*` |\n\n## The\
  \ parent-directory rule (the most common surprise)\n\"It is not possible to re-include\
  \ a file if a parent directory of that file is excluded.\" Git does not even list\
  \ the contents of an excluded folder, so a later `!` line never gets a chance.\n\
  \n```gitignore\n# does NOT work: logs/ is excluded as a folder\nlogs/\n!logs/.gitkeep\n\
  \n# works: exclude the folder's contents, keep the folder visible\nlogs/*\n!logs/.gitkeep\n\
  \n# works for deeper files: re-include each folder level\n/assets/*\n!/assets/icons/\n\
  /assets/icons/*\n!/assets/icons/app.svg\n```\n\n## Whitelist style\nIgnore everything,\
  \ then allow what you want:\n```gitignore\n*\n!*/\n!*.md\n!src/**\n```\n`!*/` re-includes\
  \ every folder so the later `!` lines can reach files inside them.\n\n## Already\
  \ tracked files\n.gitignore only affects untracked files. A file that is already\
  \ committed stays tracked:\n```\ngit rm --cached path/to/file        # keep it on\
  \ disk, stop tracking it\ngit rm -r --cached build/           # same for a folder\n\
  ```\nIf it was a secret, removing it from tracking is not enough: rotate the secret,\
  \ because it is still in history.\n\n## Commands to confirm\n```\ngit check-ignore\
  \ -v path/to/file          # prints the file, line and pattern that ignores it (nothing\
  \ = not ignored)\ngit check-ignore -v --no-index path       # also for files that\
  \ are tracked\ngit status --ignored --short              # lists ignored files as\
  \ \"!!\"\ngit ls-files --others --ignored --exclude-standard   # every ignored untracked\
  \ file\n```\n\x1FFILE:references/common-pitfalls.md\x1E\n# Common .gitignore pitfalls\
  \ and the checker's codes\n\n| Code | Severity | What goes wrong | Fix |\n|---|---|---|---|\n\
  | NEGATION_BLOCKED | HIGH | `!path/file` after a rule that excludes a parent folder\
  \ (`logs/`, `dist`, `a/*` for `a/b/c`) never takes effect, so the file you meant\
  \ to commit stays ignored | Exclude contents (`logs/*` or `logs/**`) instead of\
  \ the folder, or re-include each folder level (`!a/b/`) |\n| SECRETS_NOT_COVERED\
  \ | MEDIUM | typical secret files (`.env`, `*.pem`, `*.key`, `id_rsa`) would be\
  \ committed by `git add .` | Add `.env`, `.env.*`, `*.pem`, `*.key`, `id_rsa*`;\
  \ also use a secret scanner in CI |\n| INLINE_COMMENT | MEDIUM | `secrets.yml #\
  \ never commit` is one pattern including the comment text, so `secrets.yml` is NOT\
  \ ignored | Put comments on their own line |\n| LEADING_SPACE | MEDIUM | ` Thumbs.db`\
  \ matches only a name that starts with a space | Remove the space |\n| BACKSLASH_SEPARATOR\
  \ | MEDIUM | `src\\generated` means \"src\" + escaped \"g\" + \"enerated\" = `srcgenerated`\
  \ | Always use `/`, also on Windows |\n| ENV_EXAMPLE_IGNORED | LOW | `.env*` also\
  \ hides `.env.example`, the template other developers need | Add `!.env.example`\
  \ after it |\n| DUPLICATE | LOW | the same line twice; harmless but a sign of copy-paste\
  \ merges | Delete one |\n| DOUBLE_STAR | LOW | `foo**` is just `foo*`; the author\
  \ probably meant `foo/**` | Use `**` only as `**/x`, `x/**` or `a/**/b` |\n| TRAILING_SPACE\
  \ | LOW | trailing spaces are silently dropped; if they were meant, the file will\
  \ not match | Remove or escape them |\n| CRLF | LOW | Windows line endings in .gitignore\
  \ | Save as LF; add `* text=auto` to .gitattributes |\n| ANCHORED_BY_SLASH | INFO\
  \ | `src/gen` only matches next to the .gitignore, not `packages/a/src/gen` | Add\
  \ `/` to show intent or `**/` to match at any depth |\n\n## Pitfalls the script\
  \ cannot see (check them by hand)\n- **Unanchored names that are too broad.** `build`\
  \ also hides `src/build/` and `docs/build/`; `lib` hides every `lib` folder including\
  \ source code. Use `/build/` for the root output folder. Write a `- path` test for\
  \ any source folder with a common name.\n- **Tracked files.** Adding a rule does\
  \ not untrack files already committed. Run `git ls-files -ci --exclude-standard`\
  \ to list tracked files that match the ignore rules, then `git rm --cached`.\n-\
  \ **Nested .gitignore files.** A `.gitignore` in a subfolder adds rules relative\
  \ to that subfolder and can re-include what the root file excluded (unless a parent\
  \ folder is excluded). Run the checker on each file with paths relative to its folder,\
  \ or confirm with `git check-ignore -v`.\n- **Case sensitivity.** On macOS and Windows\
  \ `core.ignorecase=true` makes `*.JPG` match `photo.jpg`; on Linux CI it does not.\
  \ Write both cases or use `*.[jJ][pP][gG]`.\n- **Personal files in the shared file.**\
  \ `.idea/`, `.vscode/`, `*.swp`, `.DS_Store` belong in the global ignore file (`core.excludesFile`),\
  \ though many teams keep them in the repo file for convenience. Do not ignore `.vscode/settings.json`\
  \ if the team shares it on purpose.\n- **Lock files.** Do not ignore `package-lock.json`,\
  \ `yarn.lock`, `pnpm-lock.yaml`, `poetry.lock`, `Cargo.lock` (for applications)\
  \ or `go.sum`: they make builds reproducible.\n- **Ignoring then committing anyway.**\
  \ `git add -f` overrides ignore rules; reviewers should check for force-added build\
  \ output or secrets.\n- **Other ignore files use different rules.** `.dockerignore`\
  \ uses Go filepath.Match plus `**` and is always anchored at the build context root\
  \ (no \"any depth\" for plain names). `.npmignore`, `.eslintignore` and `.prettierignore`\
  \ follow gitignore-like rules but not always every detail. Test them with their\
  \ own tools.\n\n## Good starting blocks\n```gitignore\n# Node\nnode_modules/\n/dist/\n\
  /build/\nnpm-debug.log*\n.npm/\n\n# Python\n__pycache__/\n*.py[cod]\n.venv/\n.pytest_cache/\n\
  /dist/\n*.egg-info/\n\n# Secrets\n.env\n.env.*\n!.env.example\n*.pem\n*.key\nid_rsa*\n\
  \n# Logs that keep their folder\nlogs/*\n!logs/.gitkeep\n```\n\x1FFILE:templates/gitignore-review.md\x1E\
  \n# .gitignore review: <repository or folder>\n\n**Stack:** <Node 20 + Vite / Python\
  \ 3.12 / monorepo with pnpm workspaces>\n**Files reviewed:** <.gitignore at root,\
  \ packages/api/.gitignore>\n**Summary:** <one sentence: the most important problem\
  \ and what the fix changes>\n\n## What the current file does\n| Line | Pattern |\
  \ Meaning |\n|---|---|---|\n| <9> | <`logs/`> | <ignores every folder named logs,\
