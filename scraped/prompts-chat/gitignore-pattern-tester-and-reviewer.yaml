  #\"):\n            continue\n        line = strip_trailing_spaces(raw)\n       \
  \ if line != raw:\n            findings.append((\"LOW\", \"TRAILING_SPACE\", no,\
  \ f\"`{raw}` has trailing spaces, which git drops\",\n                         \
  \    \"Delete them; escape a real trailing space as `\\\\ `.\"))\n        if raw[0]\
  \ in \" \\t\":\n            findings.append((\"MEDIUM\", \"LEADING_SPACE\", no,\
  \ f\"`{raw}` starts with whitespace, which git keeps as part of the name, so it\
  \ matches nothing useful\",\n                             \"Remove the leading whitespace.\"\
  ))\n        m = re.search(r\"\\s#\", line)\n        if m:\n            findings.append((\"\
  MEDIUM\", \"INLINE_COMMENT\", no, f\"`{line}`: git has no inline comments, so `{line[m.start():].strip()}`\
  \ becomes part of the pattern\",\n                             \"Move the comment\
  \ to its own line starting with #.\"))\n        if re.search(r\"\\\\[A-Za-z0-9_]\"\
  , line):\n            findings.append((\"MEDIUM\", \"BACKSLASH_SEPARATOR\", no,\
  \ f\"`{line}` uses a backslash, which escapes the next character instead of separating\
  \ directories\",\n                             \"Use forward slashes: `\" + line.replace(\"\
  \\\\\", \"/\") + \"`.\"))\n        key = line.strip()\n        if key in seen:\n\
  \            findings.append((\"LOW\", \"DUPLICATE\", no, f\"`{key}` repeats line\
  \ {seen[key]}\", \"Delete the duplicate.\"))\n        else:\n            seen[key]\
  \ = no\n        negate = line.startswith(\"!\")\n        body = line[1:] if negate\
  \ else line\n        if body.startswith(\"\\\\!\") or body.startswith(\"\\\\#\"\
  ):\n            body = body[1:]\n        if negate and not body:\n            findings.append((\"\
  LOW\", \"EMPTY_NEGATION\", no, \"`!` alone does nothing\", \"Delete the line.\"\
  ))\n            continue\n        dir_only = body.endswith(\"/\") and not body.endswith(\"\
  \\\\/\")\n        if dir_only:\n            body = body.rstrip(\"/\")\n        if\
  \ not body:\n            continue\n        anchored = \"/\" in body\n        if\
  \ body.startswith(\"/\"):\n            body = body[1:]\n        if any((m.start()\
  \ > 0 and body[m.start() - 1] != \"/\") or (m.end() < len(body) and body[m.end()]\
  \ != \"/\")\n               for m in re.finditer(r\"\\*{2,}\", body)):\n       \
  \     findings.append((\"LOW\", \"DOUBLE_STAR\", no, f\"`{line}`: `**` not between\
  \ slashes acts like a single `*`\",\n                             \"Use `**/name`,\
  \ `dir/**` or `a/**/b`, or a single `*`.\"))\n        rules.append(Rule(no, line,\
  \ negate, dir_only, anchored, body, re.compile(glob_to_regex(body), re.S)))\n  \
  \  return rules, findings\n\n\ndef last_match(rules, rel_path, is_dir):\n    hit\
  \ = None\n    for r in rules:\n        if r.matches(rel_path, is_dir):\n       \
  \     hit = r\n    return hit\n\n\ndef check_path(rules, path):\n    \"\"\"Return\
  \ (ignored, reason, blocked_rule) following git's parent-directory rule.\"\"\"\n\
  \    is_dir = path.endswith(\"/\")\n    parts = [p for p in path.strip(\"/\").split(\"\
  /\") if p]\n    for k in range(1, len(parts) + 1):\n        sub = \"/\".join(parts[:k])\n\
  \        sub_is_dir = k < len(parts) or is_dir\n        hit = last_match(rules,\
  \ sub, sub_is_dir)\n        if k < len(parts):\n            if hit and not hit.negate:\n\
  \                own = last_match(rules, \"/\".join(parts), is_dir)\n          \
  \      blocked = own if own and own.negate else None\n                return True,\
  \ f\"parent `{sub}/` excluded by {hit.label()}\", blocked\n        else:\n     \
  \       if hit is None:\n                return False, \"no rule matches\", None\n\
  \            if hit.negate:\n                return False, f\"re-included by {hit.label()}\"\
  , None\n            return True, f\"ignored by {hit.label()}\", None\n    return\
  \ False, \"empty path\", None\n\n\ndef literal_dirs(body):\n    parts = body.split(\"\
  /\")[:-1]\n    out = []\n    for p in parts:\n        if any(ch in p for ch in \"\
  *?[\\\\\"):\n            break\n        out.append(p)\n    return out\n\n\ndef lint_negations(rules):\n\
  \    findings = []\n    for idx, r in enumerate(rules):\n        if not r.negate\
  \ or not r.anchored:\n            continue\n        before = rules[:idx]\n     \
  \   dirs = literal_dirs(r.body)\n        for k in range(1, len(dirs) + 1):\n   \
  \         sub = \"/\".join(dirs[:k])\n            hit = last_match(before, sub,\
  \ True)\n            if hit and not hit.negate:\n                findings.append((\"\
  HIGH\", \"NEGATION_BLOCKED\", r.line_no,\n                                 f\"`{r.raw.strip()}`\
  \ can never apply: its parent directory `{sub}/` is excluded by {hit.label()} and\
  \ git does not look inside excluded directories\",\n                           \
  \      f\"Exclude the contents instead of the directory (`{sub}/*` or `{sub}/**`),\
  \ then keep the `!` rule; or re-include `!{sub}/` first.\"))\n                break\n\
  \    return findings\n\n\ndef lint_secrets(rules):\n    findings = []\n    missing\
  \ = [p for p in SECRET_PROBES if not check_path(rules, p)[0]]\n    if missing:\n\
  \        findings.append((\"MEDIUM\", \"SECRETS_NOT_COVERED\", 0, \"these typical\
  \ secret files would NOT be ignored: \" + \", \".join(missing),\n              \
  \           \"Add `.env`, `.env.*` (with `!.env.example`), `*.pem`, `*.key`, `id_rsa*`\
  \ if the project could ever contain them.\"))\n    if check_path(rules, \".env.example\"\
  )[0]:\n        findings.append((\"LOW\", \"ENV_EXAMPLE_IGNORED\", 0, \"`.env.example`\
  \ is ignored, so the documented template cannot be committed\",\n              \
  \           \"Add `!.env.example` after the .env rule.\"))\n    return findings\n\
  \n\ndef explain(rule):\n    body = rule.body\n    kind = \"directories\" if rule.dir_only\
  \ else \"files or directories\"\n    verb = \"Re-includes\" if rule.negate else\
  \ \"Ignores\"\n    wild = any(ch in body for ch in \"*?[\")\n    if rule.anchored\
  \ and body.endswith(\"/**\") and \"*\" not in body[:-3]:\n        text = f\"{verb}\
  \ everything inside `{body[:-3]}/` (but not the folder itself), relative to the\
  \ .gitignore folder\"\n    elif rule.anchored and body.startswith(\"**/\") and \"\
  /\" not in body[3:]:\n        text = f\"{verb} {kind} {'matching' if wild else 'named'}\
  \ `{body[3:]}` at any depth\"\n    elif rule.anchored:\n        text = f\"{verb}\
  \ {kind} {'matching' if wild else 'at'} `{body}` relative to the .gitignore folder\
  \ only\"\n    else:\n        text = f\"{verb} {kind} {'matching' if wild else 'named'}\
  \ `{body}` at any depth\"\n    if not rule.negate and not body.endswith(\"/**\"\
  ):\n        text += \"; a matched directory hides everything inside it\"\n    if\
  \ rule.negate:\n        text += \" (only works if no parent directory is excluded)\"\
  \n    return text + \".\"\n\n\ndef read_tests(text):\n    tests = []\n    for no,\
  \ line in enumerate(text.splitlines(), 1):\n        s = line.strip()\n        if\
  \ not s or s.startswith(\"#\"):\n            continue\n        if s[0] not in \"\
  +-\" or len(s) < 3:\n            raise ValueError(f\"paths file line {no}: expected\
  \ '+ path' or '- path', got {line!r}\")\n        tests.append((s[0] == \"+\", s[1:].strip()))\n\
  \    return tests\n\n\ndef review(gi_text, tests_text=None):\n    rules, findings\
  \ = parse_rules(gi_text)\n    findings += lint_negations(rules)\n    findings +=\
  \ lint_secrets(rules)\n    anchored = [r.line_no for r in rules if r.anchored and\
  \ not r.negate and \"/\" in r.body\n                and not r.raw.startswith((\"\
  /\", \"**/\")) and not r.body.endswith(\"/**\")]\n    if anchored:\n        findings.append((\"\
  INFO\", \"ANCHORED_BY_SLASH\", anchored[0],\n                         \"lines \"\
  \ + \", \".join(map(str, anchored)) + \" contain a slash, so they only match relative\
  \ to the .gitignore folder, not deeper copies\",\n                         \"Fine\
  \ if intended; add a leading `/` to make that explicit, or prefix `**/` to match\
  \ at any depth.\"))\n    results = []\n    if tests_text:\n        for want, path\
  \ in read_tests(tests_text):\n            got, reason, blocked = check_path(rules,\
  \ path)\n            note = reason\n            if blocked:\n                note\
  \ += f\"; {blocked.label()} cannot re-include it\"\n            results.append({\"\
  path\": path, \"expect\": \"ignored\" if want else \"kept\",\n                 \
  \           \"actual\": \"ignored\" if got else \"kept\", \"pass\": got == want,\
  \ \"why\": note})\n    findings.sort(key=lambda f: (SEV_ORDER[f[0]], f[2]))\n  \
  \  return {\"rules\": [{\"line\": r.line_no, \"pattern\": r.raw, \"meaning\": explain(r)}\
  \ for r in rules],\n            \"findings\": [dict(zip((\"severity\", \"code\"\
  , \"line\", \"problem\", \"fix\"), f)) for f in findings],\n            \"tests\"\
  : results}\n\n\ndef render(name, rep):\n    out = [f\"# .gitignore review: {name}\"\
  , \"\"]\n    counts = {s: sum(1 for f in rep[\"findings\"] if f[\"severity\"] ==\
  \ s) for s in SEV_ORDER}\n    failed = sum(1 for t in rep[\"tests\"] if not t[\"\
  pass\"])\n    out.append(f\"Findings: {counts['HIGH']} HIGH, {counts['MEDIUM']}\
  \ MEDIUM, {counts['LOW']} LOW, {counts['INFO']} INFO\")\n    if rep[\"tests\"]:\n\
  \        out.append(f\"Tests: {len(rep['tests']) - failed}/{len(rep['tests'])} passed\"\
  )\n    out += [\"\", \"## Rules\", \"\", \"| Line | Pattern | Meaning |\", \"|---|---|---|\"\
  ]\n    for r in rep[\"rules\"]:\n        out.append(f\"| {r['line']} | `{r['pattern']}`\
  \ | {r['meaning']} |\")\n    if rep[\"tests\"]:\n        out += [\"\", \"## Path\
  \ tests\", \"\", \"| Result | Path | Expected | Actual | Decided by |\", \"|---|---|---|---|---|\"\
  ]\n        for t in rep[\"tests\"]:\n            out.append(f\"| {'PASS' if t['pass']\
  \ else 'FAIL'} | `{t['path']}` | {t['expect']} | {t['actual']} | {t['why']} |\"\
  )\n    out += [\"\", \"## Findings\", \"\"]\n    if rep[\"findings\"]:\n       \
  \ out += [\"| Severity | Code | Line | Problem | Fix |\", \"|---|---|---|---|---|\"\
  ]\n        for f in rep[\"findings\"]:\n            out.append(f\"| {f['severity']}\
  \ | {f['code']} | {f['line'] or '-'} | {f['problem']} | {f['fix']} |\")\n    else:\n\
  \        out.append(\"No findings.\")\n    out += [\"\", \"Confirm on the real repo\
  \ with `git check-ignore -v <path>` and `git status --ignored`; files that are already\
  \ tracked stay tracked until `git rm --cached <path>`.\"]\n    return \"\\n\".join(out)\n\
  \n\ndef self_test():\n    cases = []\n    def t(name, cond):\n        cases.append((name,\
  \ bool(cond)))\n    R = lambda s: parse_rules(s)[0]\n    ign = lambda s, p: check_path(R(s),\
  \ p)[0]\n    t(\"*.log matches at any depth\", ign(\"*.log\", \"a/b/c.log\") and\
  \ ign(\"*.log\", \"x.log\"))\n    t(\"* does not cross /\", not ign(\"/a*z\", \"\
  ab/cz\") and ign(\"/a*z\", \"abcz\"))\n    t(\"name without slash matches basename\
  \ anywhere\", ign(\"build\", \"src/build/x.js\"))\n    t(\"leading slash anchors\"\
  , ign(\"/vendor\", \"vendor/a\") and not ign(\"/vendor\", \"lib/vendor/a\"))\n \
  \   t(\"middle slash anchors\", ign(\"doc/frotz\", \"doc/frotz\") and not ign(\"\
  doc/frotz\", \"a/doc/frotz\"))\n    t(\"trailing slash = directory only\", ign(\"\
  logs/\", \"logs/x\") and not ign(\"logs/\", \"logs\"))\n    t(\"dir-only rule ignores\
  \ a dir path\", ign(\"logs/\", \"logs/\"))\n    t(\"**/ prefix matches any depth\"\
  , ign(\"**/foo\", \"foo\") and ign(\"**/foo\", \"a/b/foo\"))\n    t(\"**/foo/bar\"\
  , ign(\"**/foo/bar\", \"x/foo/bar\") and not ign(\"**/foo/bar\", \"x/foo/baz\"))\n\
  \    t(\"trailing /** matches contents only\", ign(\"abc/**\", \"abc/x/y\") and\
  \ not ign(\"abc/**\", \"abc\"))\n    t(\"a/**/b zero or more dirs\", ign(\"a/**/b\"\
  , \"a/b\") and ign(\"a/**/b\", \"a/x/y/b\") and not ign(\"a/**/b\", \"ab\"))\n \
  \   t(\"? matches one char not /\", ign(\"/a?c\", \"abc\") and not ign(\"/a?c\"\
  , \"a/c\"))\n    t(\"[abc] class\", ign(\"file[12].txt\", \"file1.txt\") and not\
  \ ign(\"file[12].txt\", \"file3.txt\"))\n    t(\"[!x] negated class\", ign(\"f[!0-9]\"\
  , \"fa\") and not ign(\"f[!0-9]\", \"f5\"))\n    t(\"[[:digit:]] posix class\",\
  \ ign(\"v[[:digit:]]\", \"v7\") and not ign(\"v[[:digit:]]\", \"vx\"))\n    t(\"\
  last match wins with negation\", not ign(\"*.txt\\n!keep.txt\", \"keep.txt\") and\
  \ ign(\"*.txt\\n!keep.txt\", \"a.txt\"))\n    t(\"order matters\", ign(\"!keep.txt\\\
  n*.txt\", \"keep.txt\"))\n    t(\"parent dir excluded blocks negation\", ign(\"\
  logs/\\n!logs/.gitkeep\", \"logs/.gitkeep\"))\n    t(\"dir/* allows negation\",\
  \ not ign(\"logs/*\\n!logs/.gitkeep\", \"logs/.gitkeep\"))\n    t(\"dir/** allows\
  \ negation\", not ign(\"coverage/**\\n!coverage/README.md\", \"coverage/README.md\"\
  ))\n    t(\"re-include dir then file\", not ign(\"/a/*\\n!/a/b/\\n/a/b/*\\n!/a/b/c\"\
  , \"a/b/c\"))\n    t(\"escaped # and !\", ign(\"\\\\#notes\", \"#notes\") and ign(\"\
  \\\\!bang\", \"!bang\"))\n    t(\"comment lines skipped\", not ign(\"# *.log\",\
  \ \"a.log\"))\n    t(\"trailing spaces stripped\", ign(\"foo   \", \"foo\"))\n \
  \   t(\"escaped trailing space kept\", ign(\"foo\\\\ \", \"foo \") and not ign(\"\
  foo\\\\ \", \"foo\"))\n    t(\"leading space kept as part of name\", not ign(\"\
  \ Thumbs.db\", \"Thumbs.db\"))\n    t(\"inline comment becomes pattern\", not ign(\"\
  secrets.yml # x\", \"secrets.yml\"))\n    t(\"backslash escapes, not a separator\"\
  , not ign(\"src\\\\gen\", \"src/gen/a.ts\"))\n    def codes(s):\n        return\
  \ {f[1] for f in parse_rules(s)[1]} | {f[1] for f in lint_negations(parse_rules(s)[0])}\
  \ | {f[1] for f in lint_secrets(parse_rules(s)[0])}\n    t(\"NEGATION_BLOCKED found\"\
  , \"NEGATION_BLOCKED\" in codes(\"logs/\\n!logs/.gitkeep\"))\n    t(\"NEGATION_BLOCKED\
  \ not for dir/*\", \"NEGATION_BLOCKED\" not in codes(\"logs/*\\n!logs/.gitkeep\"\
  ))\n    t(\"NEGATION_BLOCKED via dir/* deeper\", \"NEGATION_BLOCKED\" in codes(\"\
  a/*\\n!a/b/c.txt\"))\n    t(\"INLINE_COMMENT found\", \"INLINE_COMMENT\" in codes(\"\
  x.yml # c\"))\n    t(\"LEADING_SPACE found\", \"LEADING_SPACE\" in codes(\" x\"\
  ))\n    t(\"BACKSLASH_SEPARATOR found\", \"BACKSLASH_SEPARATOR\" in codes(\"a\\\\\
  b\"))\n    t(\"DUPLICATE found\", \"DUPLICATE\" in codes(\"*.log\\n*.log\"))\n \
  \   t(\"DOUBLE_STAR found\", \"DOUBLE_STAR\" in codes(\"foo**\") and \"DOUBLE_STAR\"\
  \ not in codes(\"**/foo\\nfoo/**\"))\n    t(\"CRLF found\", \"CRLF\" in codes(\"\
  a\\r\\nb\"))\n    t(\"SECRETS_NOT_COVERED found\", \"SECRETS_NOT_COVERED\" in codes(\"\
  *.log\"))\n    t(\"secrets covered\", \"SECRETS_NOT_COVERED\" not in codes(\".env\\\
  n.env.*\\n!.env.example\\n*.key\\n*.pem\\nid_rsa*\"))\n    t(\"ENV_EXAMPLE_IGNORED\
  \ found\", \"ENV_EXAMPLE_IGNORED\" in codes(\".env*\"))\n    acodes = lambda s:\
  \ {f[\"code\"] for f in review(s)[\"findings\"]}\n    t(\"ANCHORED_BY_SLASH info\"\
  , \"ANCHORED_BY_SLASH\" in acodes(\"src/gen\") and \"ANCHORED_BY_SLASH\" not in\
  \ acodes(\"/src/gen\\nlogs/**\\n**/x/y\"))\n    rep = review(\"logs/\\n!logs/.gitkeep\\\
  n\", \"+ logs/a.log\\n- logs/.gitkeep\\n\")\n    t(\"test table marks blocked negation\
  \ FAIL\", rep[\"tests\"][0][\"pass\"] and not rep[\"tests\"][1][\"pass\"] and \"\
  cannot re-include\" in rep[\"tests\"][1][\"why\"])\n    try:\n        read_tests(\"\
  ? bad\")\n        t(\"bad paths line rejected\", False)\n    except ValueError:\n\
  \        t(\"bad paths line rejected\", True)\n    t(\"findings sorted HIGH first\"\
  , review(\"x # c\\nlogs/\\n!logs/a\\n\")[\"findings\"][0][\"severity\"] == \"HIGH\"\
  )\n    passed = sum(ok for _, ok in cases)\n    for name, ok in cases:\n       \
  \ print((\"PASS \" if ok else \"FAIL \") + name)\n    print(f\"{passed}/{len(cases)}\
  \ passed\")\n    return 0 if passed == len(cases) else 1\n\n\ndef main():\n    ap\
  \ = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)\n\
  \    ap.add_argument(\"gitignore\", nargs=\"?\")\n    ap.add_argument(\"--test\"\
  , help=\"paths file with '+ path' (must be ignored) and '- path' (must be kept)\"\
  )\n    ap.add_argument(\"--json\", action=\"store_true\")\n    ap.add_argument(\"\
  --self-test\", action=\"store_true\")\n    a = ap.parse_args()\n    if a.self_test:\n\
  \        return self_test()\n    if not a.gitignore:\n        ap.print_usage(sys.stderr);\
  \ return 2\n    try:\n        gi = open(a.gitignore, encoding=\"utf-8\", newline=\"\
  \").read()\n        tests = open(a.test, encoding=\"utf-8\").read() if a.test else\
  \ None\n        rep = review(gi, tests)\n    except (OSError, UnicodeDecodeError,\
  \ ValueError) as e:\n        print(f\"error: {e}\", file=sys.stderr); return 2\n\
  \    print(json.dumps(rep, indent=2) if a.json else render(a.gitignore, rep))\n\
  \    bad = any(f[\"severity\"] == \"HIGH\" for f in rep[\"findings\"]) or any(not\
  \ t[\"pass\"] for t in rep[\"tests\"])\n    return 1 if bad else 0\n\n\nif __name__\
  \ == \"__main__\":\n    sys.exit(main())"
