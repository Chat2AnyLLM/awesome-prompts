  \ | Actual | Decided by |\n|---|---|---|---|---|\n| <FAIL> | <`logs/.gitkeep`> |\
  \ <kept> | <ignored> | <parent logs/ excluded by L9; L10 cannot re-include it> |\n\
  \n## Findings\n| # | Severity | Code | Line | Problem | Fix |\n|---|---|---|---|---|---|\n\
  | 1 | <HIGH> | <NEGATION_BLOCKED> | <10> | <...> | <use logs/* instead of logs/>\
