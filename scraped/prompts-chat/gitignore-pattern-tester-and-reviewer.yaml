  \ k = 0, end - 2\n        while k >= 0 and s[k] == \"\\\\\":\n            bs +=\
  \ 1; k -= 1\n        if bs % 2 == 1:\n            break\n        end -= 1\n    return\
  \ s[:end]\n\n\ndef class_to_regex(body):\n    out, m = \"\", 0\n    while m < len(body):\n\
  \        ch = body[m]\n        if ch == \"[\" and body.startswith(\"[:\", m):\n\
