  \ }\n.badge-high { background: var(--text); color: var(--surface); border-color:\
  \ var(--text); }\n.dot { display: inline-block; width: 8px; height: 8px; border-radius:\
  \ 50%; border: 1.5px solid currentColor; vertical-align: 0; margin-right: 2px; }\n\
  .dot-high { background: currentColor; }\n.dot-medium { background: linear-gradient(90deg,\
  \ currentColor 50%, transparent 50%); }\n.commits { margin: 6px 0 0; padding-left:\
  \ 18px; font-size: 13px; overflow-wrap: anywhere; }\n.groups, .clusters { padding-left:\
  \ 20px; }\n.groups li, .clusters li { margin: 8px 0; overflow-wrap: anywhere; }\n\
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));\
  \ gap: 12px; margin: 8px 0; }\n.signals { min-width: 240px; }\n.plan { background:\
  \ var(--surface-2); border-radius: 12px; padding: 4px 20px 12px; }\n#tip { position:\
  \ fixed; pointer-events: none; z-index: 10; max-width: 320px; padding: 8px 10px;\
  \ border-radius: 8px; font-size: 12px; background: var(--text); color: var(--surface);\
  \ box-shadow: 0 4px 16px rgb(0 0 0 / .25); opacity: 0; }\nfooter { margin-top: 48px;\
  \ color: var(--text-2); font-size: 12px; }\n@media (max-width: 720px) {\n  .hero\
  \ { grid-template-columns: 1fr; }\n  .hero-value { font-size: 36px; }\n  .bar-row\
  \ { grid-template-columns: 1fr; gap: 2px; }\n  .bar-label { text-align: left; }\n\
  }\n@media print {\n  #tip, .filters { display: none; }\n  .bug { break-inside: avoid;\
  \ }\n  details.bug:not([open]) > *:not(summary) { display: block; }\n}\n</style>\n\
  </head>\n<body>\n<main>\n<h1>Polyrepo Tax Report</h1>\n<p class=\"meta\">${r.repos.length}\
  \ repos (${esc(repoList)}) · ${esc(r.window.since)} → ${esc(r.window.until)} (${r.window.days}\
  \ days) · ${fmt.full(r.rates.developerHourly)}/dev-hour · ${esc(r.rates.currency)}\
  \ ${esc(r.rates.ciPerMinute)}/CI-minute</p>\n${r.problems.length ? `<p class=\"\
  verdict verdict-no\"><strong>Data problems:</strong> ${esc(r.problems.join('; '))}</p>`\
  \ : ''}\n\n<section class=\"hero\" aria-label=\"Headline numbers\">\n  <div class=\"\
  hero-main\">\n    <div class=\"hero-label\">Polyrepo tax per year, expected</div>\n\
  \    <div class=\"hero-value\">${fmt.full(ex)}</div>\n    <div class=\"muted\">${fmt.full(lo)}\
  \ – ${fmt.full(hi)} depending on which bugs you count</div>\n    ${range}\n  </div>\n\
  \  <div class=\"tiles\">\n    <div class=\"tile\"><div class=\"tile-label\">Developer\
  \ time (window)</div><div class=\"tile-value\">${num(e.totals.hours)} h</div><div\
  \ class=\"tile-note\">${fmt.full(e.totals.devCost)}</div></div>\n    <div class=\"\
  tile\"><div class=\"tile-label\">CI time (window)</div><div class=\"tile-value\"\
  >${num(e.totals.ciMinutes)} min</div><div class=\"tile-note\">${fmt.full(e.totals.ciCost)}\
  \ · ${ciMeasured ? `measured for ${ciMeasured} of ${r.repos.length} repos` : 'assumed'}</div></div>\n\
  \    <div class=\"tile\"><div class=\"tile-label\">Bugs attributable to repo boundaries</div><div\
  \ class=\"tile-value\">${bugsBy('high').length + bugsBy('medium').length}</div><div\
  \ class=\"tile-note\">${bugsBy('high').length} high · ${bugsBy('medium').length}\
  \ medium · ${bugsBy('low').length} low confidence</div></div>\n    <div class=\"\
  tile\"><div class=\"tile-label\">Migration payback</div><div class=\"tile-value\"\
  >${esc(paybackText)}</div><div class=\"tile-note\">${fmt.full(m.oneTime.cost)} one-time\
  \ · saves ${fmt.full(e.totals.annualSavings)}/yr</div></div>\n  </div>\n</section>\n\
  <p class=\"verdict ${verdict.cls}\">${esc(verdict.text)}</p>\n<p class=\"muted\"\
  >Estimates from git history, not invoices. Every count links to commits below; every\
  \ rate and assumption is listed at the end and can be overridden.</p>\n\n<h2>Where\
  \ the money goes</h2>\n<p class=\"muted\">Annualized cost per driver, expected scenario.\
  \ Hover or focus a bar for hours and CI minutes.</p>\n<div class=\"chart\">${bars\
  \ || '<p class=\"muted\">No measurable polyrepo cost in this window.</p>'}</div>\n\
  <details><summary>Table view</summary><div class=\"table-wrap\">${costTable}</div></details>\n\
  <h3>Scenarios</h3>\n<div class=\"table-wrap\">${scenarioTable}</div>\n\n<h2>Bugs\
  \ attributable to repo boundaries</h2>\n${r.bugs.length ? `<div class=\"filters\"\
  \ role=\"group\" aria-label=\"Filter by confidence\">\n  <button type=\"button\"\
  \ data-filter=\"all\" aria-pressed=\"true\">All ${r.bugs.length}</button>\n  ${['high',\
  \ 'medium', 'low'].map((c) => `<button type=\"button\" data-filter=\"${c}\" aria-pressed=\"\
  false\">${confIcon[c]} ${c[0].toUpperCase()}${c.slice(1)} ${bugsBy(c).length}</button>`).join('')}\n\
  </div>\n<div id=\"bugs\">${bugCards}</div>` : '<p class=\"muted\">None found in\
  \ this window.</p>'}\n\n<h2>Internal dependency churn</h2>\n<div class=\"stats\"\
  >\n  <div class=\"tile\"><div class=\"tile-label\">Internal bumps</div><div class=\"\
  tile-value\">${ups.length}</div><div class=\"tile-note\">${ups.filter((b) => b.bot).length}\
  \ by bots · ${ups.filter((b) => !b.bot).length} by people</div></div>\n  <div class=\"\
  tile\"><div class=\"tile-label\">Internal releases to move code</div><div class=\"\
  tile-value\">${ib.releases.length}</div><div class=\"tile-note\">${(r.publicPackages\
  \ === true || r.publicPackages?.length) ? 'public packages excluded' : 'packages\
  \ consumed by sibling repos'}</div></div>\n  <div class=\"tile\"><div class=\"tile-label\"\
  >Median release → bump lag</div><div class=\"tile-value\">${ib.medianBumpLagDays\
  \ ?? 'n/a'}${ib.medianBumpLagDays === null ? '' : ' days'}</div><div class=\"tile-note\"\
  >time a consumer runs old code</div></div>\n  <div class=\"tile\"><div class=\"\
  tile-label\">Consumers behind today</div><div class=\"tile-value\">${ib.drift.length}</div><div\
  \ class=\"tile-note\">${ib.drift.filter((d) => d.majorsBehind > 0).length} a major\
  \ version or more</div></div>\n</div>\n<div class=\"table-wrap\">${pkgTable}</div>\n\
  ${ib.skew.length ? `<h3>Version skew today</h3><ul>${ib.skew.map((s) => `<li><code>${esc(s.pkg)}</code>:\
  \ ${Object.entries(s.majors).map(([v, rs]) => `v${esc(v)} in ${esc(rs.join(', '))}`).join('\
  \ · ')}</li>`).join('')}</ul>` : ''}\n\n<h2>Duplicated and coordinated work</h2>\n\
  ${groupList}\n\n<h2>Migration</h2>\n<p><strong>Recommended tooling:</strong> ${esc(m.recommendedTool)}\
  \ <span class=\"muted\">(${esc(Object.entries(m.languages).map(([l, n]) => `${l}\
  \ ${n} files`).join(', ') || 'no languages detected')})</span></p>\n${whyHtml}\n\
  ${optionsHtml}\n<h3>Clusters to migrate, heaviest first</h3>\n${clusterList}\n${m.isolated.length\
  \ ? `<p><strong>Keep separate</strong> (no measured coupling): ${esc(m.isolated.join(',\
  \ '))}</p>` : ''}\n<p><strong>One-time effort:</strong> ~${m.oneTime.days} dev-days\
  \ (${fmt.full(m.oneTime.cost)}) for ${m.oneTime.repos.length} repos · <strong>payback</strong>\
  \ ${pb.expected === null ? 'not reached' : `~${pb.expected} months`} <span class=\"\
  muted\">(range ${pb.high ?? '—'} – ${pb.low ?? 'never'} months)</span></p>\n${couplingTable\
  \ ? `<h3>Coupling between repos</h3><div class=\"table-wrap\">${couplingTable}</div>`\
  \ : ''}\n<h3>External dependencies to align first</h3>\n<div class=\"table-wrap\"\
  >${conflicts}</div>\n${plan ? `<h3>Migration plan</h3><div class=\"plan\">${markdownToHtml(plan.replace(/^\\\
  s*#{1,6}\\s*Migration plan\\s*\\n/i, ''))}</div>` : ''}\n\n<h2>Assumptions</h2>\n\
  <div class=\"table-wrap\">${assumptions}</div>\n<div class=\"table-wrap\">${repoTable}</div>\n\
  \n<footer>Generated ${esc(r.generatedAt)} by the polyrepo-tax skill. Full data:\
  \ polyrepo-tax-report.json.</footer>\n</main>\n<div id=\"tip\" role=\"tooltip\"\
  ></div>\n<script>\n(() => {\n  const tip = document.getElementById('tip');\n  const\
  \ show = (el, x, y) => {\n    tip.textContent = el.dataset.tip;\n    const w = tip.offsetWidth,\
  \ h = tip.offsetHeight;\n    tip.style.left = Math.max(8, Math.min(x + 12, innerWidth\
  \ - w - 8)) + 'px';\n    tip.style.top = Math.max(8, y - h - 12) + 'px';\n    tip.style.opacity\
  \ = 1;\n  };\n  const hide = () => { tip.style.opacity = 0; };\n  for (const el\
  \ of document.querySelectorAll('[data-tip]')) {\n    el.addEventListener('pointermove',\
  \ (ev) => show(el, ev.clientX, ev.clientY));\n    el.addEventListener('pointerleave',\
  \ hide);\n    el.addEventListener('focus', () => { const b = el.getBoundingClientRect();\
  \ show(el, b.left + 16, b.top); });\n    el.addEventListener('blur', hide);\n  }\n\
  \  const buttons = document.querySelectorAll('.filters button');\n  for (const btn\
  \ of buttons) btn.addEventListener('click', () => {\n    for (const b of buttons)\
  \ b.setAttribute('aria-pressed', String(b === btn));\n    for (const card of document.querySelectorAll('#bugs\
  \ .bug')) card.hidden = btn.dataset.filter !== 'all' && card.dataset.conf !== btn.dataset.filter;\n\
  \  });\n})();\n</script>\n</body>\n</html>\n`;\n}\n\nif (process.argv[1] === fileURLToPath(import.meta.url))\
  \ {\n  const argv = process.argv.slice(2);\n  const opt = (n) => { const i = argv.indexOf(n);\
  \ return i >= 0 ? argv[i + 1] : undefined; };\n  const input = argv.find((a, i)\
  \ => !a.startsWith('--') && !['--plan', '--out'].includes(argv[i - 1]));\n  if (!input)\
  \ { console.error('usage: render-html.mjs <polyrepo-tax-report.json> [--plan migration-plan.md]\
  \ [--out report.html]'); process.exit(2); }\n  const report = JSON.parse(fs.readFileSync(input,\
  \ 'utf8'));\n  const planPath = opt('--plan') ?? path.join(path.dirname(input),\
  \ 'migration-plan.md');\n  const plan = fs.existsSync(planPath) ? fs.readFileSync(planPath,\
  \ 'utf8') : undefined;\n  const out = opt('--out') ?? path.join(path.dirname(input),\
  \ 'polyrepo-tax-report.html');\n  fs.writeFileSync(out, renderHtml(report, { plan\
  \ }));\n  console.log(`wrote ${out}${plan ? ` (with ${path.basename(planPath)})`\
  \ : ''}`);\n}"
