slug: polyrepo-tax
title: Polyrepo Tax
description: Imported from Prompts Chat
prompt: "---\nname: polyrepo-tax\ndescription: Use when a user wants to know what\
  \ their polyrepo setup costs - bugs from version drift and cross-repo changes, developer\
  \ and CI time spent on internal dependency bumps, releases and duplicated fixes\
  \ - converted to money, or wants a business case and migration plan for moving several\
  \ repositories into a monorepo. Read-only; analyzes git history and writes Markdown\
  \ and JSON reports.\n---\n\n# Polyrepo Tax\n\nMeasure what splitting code across\
  \ repositories costs an organization, from the\nrepositories' own git history: bugs\
  \ attributable to repo boundaries, developer\nhours and CI minutes spent moving\
  \ code between repos, the equivalent money, and\na migration plan for the repos\
  \ that would actually benefit.\n\nPrerequisites: Node ≥ 22.5 and git. Optional:\
  \ an authenticated `gh` CLI for real CI minutes.\n`$S` is this skill's directory\
  \ (the one holding this file). The work dir is `$W` = `$(node -p 'require(\"os\"\
  ).tmpdir()')/polyrepo-tax`.\n\n## Rules\n\n- **Read-only.** Never push, open PRs,\
  \ edit files or run builds in the analysed repos. Allowed writes: clones and config\
  \ under `$W`, and the reports (`polyrepo-tax-report.{md,json,html}`, `migration-plan.md`)\
  \ (default `${tmpdir}/polyrepo-tax-reports`, or a user-given dir).\n- Allowed commands:\
  \ `git clone --bare` / `git fetch` into `$W`, read-only `git` (`log`, `show`, `ls-tree`,\
  \ `for-each-ref`, `rev-parse`), `node $S/scripts/analyze.mjs`, `node $S/scripts/render-html.mjs`,\
  \ `node $S/scripts/fetch-ci.mjs` (only `gh api` GETs), and `gh repo list` to discover\
  \ repos.\n- **Estimates, not invoices.** Every number must trace to commits or to\
  \ a stated assumption. Never invent counts, rates, incidents or CI minutes. Use\
  \ the user's numbers when given; otherwise use the defaults and label them as defaults.\n\
  - **Attribution, not blame.** Bugs are \"attributable to repo boundaries\" with\
  \ a confidence level, never \"caused by\" a person. Do not name individual authors\
  \ in the summary.\n- **Honest recommendation.** If the measured tax is small, coupling\
  \ is low or payback is longer than the user's horizon, say that a monorepo is not\
  \ worth it (or only for one cluster). Never inflate assumptions to reach a target.\n\
  - Use only the bug categories defined in [references/signals.md](references/signals.md).\n\
  \n## Workflow\n\n1. **Collect inputs** — follow [references/inputs.md](references/inputs.md):\
  \ get the repo list, the window, internal package scopes, the loaded developer rate\
  \ and the CI price. Clone the repos with full history into `$W/repos` and write\
  \ `$W/polyrepo-tax.config.json`.\n2. **CI minutes (optional)** — if the repos are\
  \ on GitHub and `gh auth status` succeeds, run `fetch-ci.mjs` as described in inputs.md.\
  \ Otherwise skip it: the analyzer uses `ciMinutesPerCommit` and marks CI as `assumed`.\n\
  3. **Analyze** — `node \"$S/scripts/analyze.mjs\" --config \"$W/polyrepo-tax.config.json\"\
  \ --out <report dir>`. Signal definitions are in [references/signals.md](references/signals.md);\
  \ the cost formulas are in [references/cost-model.md](references/cost-model.md).\n\
  4. **Review** — read the high- and medium-confidence bugs in the JSON report. For\
  \ each one that the commit evidence does not support (for example `git show <sha>`\
  \ shows an unrelated change), add the full SHA to `excludeCommits` in `$W/overrides.json`\
  \ and rerun step 3 with `\"overrides\": \"overrides.json\"` in the config. Tell\
  \ the user how many you excluded and why.\n5. **Migration plan** — follow [references/migration.md](references/migration.md)\
  \ to turn the report's `migration` section into a phased plan. Write it to `migration-plan.md`\
  \ in the report dir, append it to the Markdown report, and run `node \"$S/scripts/render-html.mjs\"\
  \ <report dir>/polyrepo-tax-report.json` so the HTML report includes it.\n6. **Present**\
  \ — follow [references/report-format.md](references/report-format.md): where the\
  \ reports are, the headline numbers as a range, the top bugs with evidence, the\
  \ assumptions that drive most of the cost, and the recommendation.\n\n## Tracking\n\
  \nCreate a todo per workflow step and mark each done when its output exists.\n\x1F\
  FILE:references/cost-model.md\x1E\n# Cost model\n\n`cost = developer hours × developerHourly\
  \ + CI minutes × ciPerMinute`, computed per cost driver, then annualized as `cost\
  \ × 365 / window days`.\n\n## Assumptions\n\nAll are overridable through `assumptions`\
  \ in the config. The report prints the values it used.\n\n| Name | Default | Used\
  \ for |\n|---|---:|---|\n| `bumpHumanHours` | 0.5 | Each internal bump by a person:\
  \ open, review, merge, babysit CI. |\n| `bumpBotHours` | 0.2 | Each internal bump\
  \ by a bot: review and merge. |\n| `releaseHours` | 0.5 | Each internal release\
  \ consumed by a sibling repo, except `publicPackages`. |\n| `coordinationHoursPerExtraRepo`\
  \ | 2 | Each extra repo in a coordinated change: sequencing PRs, waiting on releases,\
  \ cross-repo review. |\n| `duplicateChangeHoursPerCopy` | 1 | Each extra copy of\
  \ a repeated maintenance change or duplicated fix (`bumpBotHours` instead when every\
  \ copy is by a bot). |\n| `bugHours` | 8 | Each bug: triage, fix, review, release,\
  \ bump. Duplicated fixes add `duplicateChangeHoursPerCopy` per extra repo. |\n|\
  \ `ciMinutesPerCommit` | 15 | CI minutes per landed commit when a repo has no CI\
  \ data. With CI data: `totalMinutes ÷ commits in window`. |\n| `bumpFixWindowDays`\
  \ | 7 | `post-bump-fix` window. |\n| `groupWindowDays` | 14 | Max spread of one\
  \ cross-repo group. |\n| `similarity` | 0.75 | Subject similarity threshold. |\n\
  | `migrationDaysPerRepo` | 3 | One-time import + CI + ownership work per migrated\
  \ repo. |\n| `migrationDaysPerConflict` | 0.5 | One-time alignment per external\
  \ dependency with conflicting majors. |\n| `monorepoToolingMonthly` | 0 | Ongoing\
  \ monorepo cost (remote cache, larger runners), subtracted before payback. |\n\n\
  If the user has better numbers (for example \"a production incident costs us 20\
  \ hours on average\"), use them and say so.\n\n## CI minutes per driver\n\nEach\
  \ driver's commits (bump commits, release commits, every commit in a bug, each extra-repo\
  \ commit in a group) × that repo's CI minutes per commit. This treats an overhead\
  \ commit as costing as much CI as an average landed change in that repo, including\
  \ its PR runs.\n\n## Scenarios\n\n| Scenario | Bugs included |\n|---|---|\n| `low`\
  \ | high confidence only |\n| `expected` | high + medium |\n| `high` | high + medium\
  \ + low |\n\nNon-bug drivers are identical across scenarios. Present `low`–`high`\
  \ as the range, `expected` as the headline.\n\n## Monorepo savings\n\nShare of each\
  \ driver a monorepo with workspace dependencies (`workspace:*`), affected-only CI\
  \ and atomic commits removes:\n\n| Driver | Removed | Reason |\n|---|---:|---|\n\
  | Internal bumps, internal releases | 100% | Consumers build against source; no\
  \ publish/bump cycle. |\n| Repeated tooling changes, duplicated fixes, fix propagation\
  \ | 100% | One config and one copy of the code. |\n| Coordinated changes | 75% |\
  \ One atomic PR; review across teams still costs time. |\n| Dependency regressions,\
  \ post-bump fixes | 90% | The producer PR runs consumer tests; some breaks still\
  \ slip past tests. |\n| Cross-repo fixes | 50% | Atomic fix, but the bug can still\
  \ happen. |\n\nPayback months = one-time migration cost ÷ (annual savings ÷ 12 −\
  \ `monorepoToolingMonthly`). Both sides cover only the repos that would move (coupled\
  \ clusters):\n\n- Savings count an event only when its repos are all in scope: bumps\
  \ and releases in migrated repos of packages produced by migrated repos, bugs whose\
  \ repos all move, and the in-scope part of a cross-repo group with at least two\
  \ in-scope repos. Cost per driver still covers every analysed repo.\n- One-time\
  \ cost = (`migrationDaysPerRepo` × migrated repos + `migrationDaysPerConflict` ×\
  \ external conflicts among migrated repos) × 8 × `developerHourly`.\n\nIsolated\
  \ repos are excluded from migration cost, savings and the recommendation.\n\nThe\
  \ model does not count costs that are real but hard to measure from git: onboarding\
  \ to N toolchains, context switching, slower discovery of shared code, and security\
  \ patches applied N times (unless they show up as repeated changes). Mention them\
  \ qualitatively, never as numbers.\n\x1FFILE:references/inputs.md\x1E\n# Step 1\
  \ — Inputs\n\nAsk for anything below that the user has not given, in **one** message.\
  \ Offer the default for each so they can just say \"use defaults\".\n\n| Input |\
  \ Default | Notes |\n|---|---|---|\n| Repositories | — (required) | Git URLs, `owner/repo`\
  \ slugs, local paths, or \"all repos in org X that team Y contributes to\". Include\
  \ the libraries the apps consume, not only the apps. |\n| Window | last 12 months\
  \ | Shorter windows are noisier; the report annualizes. |\n| Internal package scopes\
  \ | packages published by the listed repos | e.g. `@acme/`. Add a scope when apps\
  \ consume internal packages from repos that are not in the list. |\n| Loaded developer\
  \ cost per hour | 100 USD | Salary + benefits + overhead ÷ working hours. Ask for\
  \ their number; teams often use 75–150 USD. |\n| CI price per minute | 0.008 USD\
  \ | GitHub-hosted 2-core Linux list price at the time of writing. Ask for theirs:\
  \ larger runners, macOS, self-hosted and plan discounts all differ. |\n| Currency\
  \ | USD | Set `rates.currency`; the report prints it. |\n| Packages also used outside\
  \ these repos | none | Packages published for other teams or open source keep releasing\
  \ after a migration, so their releases are not costed. Put them in `publicPackages`\
  \ (or `true` for all). |\n\nTo expand \"all repos in org X\": `gh repo list X --limit\
  \ 1000 --no-archived --json nameWithOwner,pushedAt`. Show the list and ask which\
  \ to include. Do not guess team membership.\n\n## Clone\n\nUse bare clones with\
  \ full history. Shallow clones are reported as a data problem because they hide\
  \ most history.\n\n```bash\nW=\"$(node -p 'require(\"os\").tmpdir()')/polyrepo-tax\"\
  \nmkdir -p \"$W/repos\"\n# one per repo; for local paths, skip cloning and use the\
  \ path directly\ngit clone --bare --quiet https://github.com/acme/web-app.git \"\
  $W/repos/web-app.git\"\n```\n\nIf a clone fails (no access, SSO), tell the user\
  \ and continue with the others; list the missing repos in the final summary.\n\n\
  ## Config\n\nWrite `$W/polyrepo-tax.config.json`. Paths are relative to the config\
  \ file.\n\n```json\n{\n  \"repos\": [\n    { \"name\": \"ui-lib\", \"path\": \"\
  repos/ui-lib.git\", \"github\": \"acme/ui-lib\" },\n    { \"name\": \"web-app\"\
  , \"path\": \"repos/web-app.git\", \"github\": \"acme/web-app\" }\n  ],\n  \"since\"\
  : \"2025-11-25\",\n  \"internalScopes\": [\"@acme/\"],\n  \"publicPackages\": [],\n\
  \  \"rates\": { \"developerHourly\": 100, \"ciPerMinute\": 0.008, \"currency\":\
  \ \"USD\" },\n  \"assumptions\": {},\n  \"ci\": \"ci.json\"\n}\n```\n\nPut only\
  \ overrides the user gave in `assumptions` (see cost-model.md for names). Leave\
  \ out `\"ci\"` if step 2 is skipped.\n\n## CI minutes (optional)\n\nOnly when `gh\
  \ auth status` succeeds and repos have a `github` slug:\n\n```bash\nnode \"$S/scripts/fetch-ci.mjs\"\
  \ --config \"$W/polyrepo-tax.config.json\" --out \"$W/ci.json\"\n```\n\nIt sums\
  \ the wall-clock time of every completed GitHub Actions run in the window. The API\
  \ caps a filtered query at 1000 runs, so it queries one month at a time and splits\
  \ any range at the cap until each part is complete; if a single day still hits the\
  \ cap, that repo fails and keeps the assumed CI minutes. It also samples job timings\
  \ for up to 30 runs per repo (`--sample`) and scales the total by the measured job/wall\
  \ ratio, which can be below 1 when queueing inflates wall-clock time. It makes only\
  \ GET requests. A repo that fails keeps the assumed per-commit CI minutes; mention\
  \ it.\n\nOther CI systems: if the user can export total CI minutes per repo for\
  \ the window, write `ci.json` by hand as `{ \"${repo_name}\": { \"totalMinutes\"\
  : 12345 } }`.\n\n\x1FFILE:references/migration.md\x1E\n# Step 5 — Migration plan\n\
  \nWrite the plan from the report's `migration` section. Use only facts from the\
  \ report and the repos; mark anything else as a suggestion.\n\n## Decide scope first\n\
  \n- **Migrate:** the coupled clusters in `migration.clusters`, heaviest first.\n\
  - **Keep separate:** `migration.isolated`. Say why: no shared packages, no co-changes\
  \ and no shared bugs in the window.\n- **Don't migrate at all** when expected payback\
  \ is longer than 24 months, or the user's horizon if they gave one, or every cluster\
  \ has a weight below 5. Say so plainly, and suggest cheaper fixes for the top cost\
  \ drivers instead: Renovate grouping and automerge for internal bumps, a shared\
  \ CI template, contract tests between producer and consumer.\n\n## Why migrate and\
  \ tool options\n\nThe report carries two sections built from a dated snapshot of\
  \ [monorepo.tools](https://monorepo.tools/) (`scripts/monorepo-tools.json`). Copy\
  \ them into the plan as they are. Do not add tools, change ratings or give reasons\
  \ the report does not list.\n\n- **Why migrate** — `migration.whyMigrate`: the polyrepo\
  \ costs monorepo.tools names (cumbersome code sharing, code duplication, costly\
  \ cross-repo changes, hard-to-enforce conventions). Each appears only when this\
  \ report measured evidence for it, with the counts. Present it as monorepo.tools'\
  \ reasons, backed by this team's numbers.\n- **Tool options** — `migration.toolOptions`:\
  \ every tool monorepo.tools compares, not just one pick. Show all of them in a table\
  \ with the rating, the per-category counts, the partial and unsupported counts,\
  \ fit and whether the team already uses the tool.\n  - **monorepo.tools rating /10**\
  \ = 10 × the features monorepo.tools marks \"natively supported\" ÷ the number of\
  \ compared features. \"Implement your own\" and \"community provided\" are counted\
  \ but not scored. Always call it the monorepo.tools rating, never just \"the rating\"\
  \ or a neutral score.\n  - **Sources** — list every source under the table, monorepo.tools\
  \ first, each with its publisher, retrieval date, role and coverage: monorepo.tools\
  \ (published by Nx, scored), State of JS 2024 and 2025, and the Thoughtworks Radar\
  \ (independent, not scored). The report renders this list; keep it when copying\
  \ the table.\n  - **Fit** is `no` only when monorepo.tools marks polyglot support\
  \ \"not supported\" and the repos contain more than JS/TS. Otherwise every tool\
  \ fits; don't infer more.\n  - State `migration.toolSource`: the URLs, the snapshot\
  \ date, and that monorepo.tools is made by Nx and accepts corrections by pull request.\
  \ A feature count isn't a quality score: the team's stack, existing tools and skills\
  \ matter too. Call those out as considerations, not as rating changes.\n  - **Independent\
  \ signals (not scored)** — each option carries `independent`, from sources that\
  \ aren't tool vendors: State of JS 2024 satisfaction (with its 2021 value), State\
  \ of JS 2025 regular-use counts, and the Thoughtworks Technology Radar ring. They\
  \ cover only some tools. Show \"—\" where none applies, never fill a gap, and never\
  \ fold them into the rating: they measure sentiment, usage or expert opinion, not\
  \ features. Say that every Radar blip shown is archived (none is on the current\
  \ edition), and give its date.\n  - If the snapshot is older than about six months,\
  \ or the user doubts a mark, tell them to check monorepo.tools/compare and update\
  \ `scripts/monorepo-tools.json`. The same applies to new State of JS editions or\
  \ Radar volumes. Never patch marks or signals from memory.\n\n## Plan template\n\
  \nWrite this to `migration-plan.md` in the report directory, filled in, append it\
  \ to `polyrepo-tax-report.md`, then re-render the HTML report (`render-html.mjs`\
  \ embeds `migration-plan.md` from the same directory):\n\n1. **Target layout and\
  \ tooling** — the tool options table, then the pick: `migration.recommendedTool`\
  \ is the stack-based default. If the team chooses another fitting tool from the\
  \ table, use that one. Propose `apps/${repo}` for deployables and `packages/${name}`\
  \ for libraries. If one repo already uses Nx, Turborepo or Bazel, build on it rather\
  \ than adding a second tool.\n2. **Phase 0 — prepare (no repo moves).**\n   - Align\
  \ each entry in `migration.externalConflicts`, starting with those in the most repos.\
  \ Each is a normal PR in the existing repo.\n   - Agree on one package manager,\
  \ Node version and lint/format config (from `repos[].packageManager`, `nodeVersion`).\n\
  \   - Freeze new internal packages outside the monorepo.\n3. **Phase 1 — first cluster.**\
  \ Import the producer libraries, then their consumers, keeping history:\n   - Nx:\
  \ `nx import <repo-url> <dest-dir>`\n   - Otherwise: `git subtree add --prefix=<dest-dir>\
  \ <repo-url> <branch>`, or rewrite with `git filter-repo --to-subdirectory-filter\
  \ <dest-dir>` and merge with `--allow-unrelated-histories`.\n   - Replace internal\
  \ version ranges with `workspace:*` and delete the publish step for packages no\
  \ external consumer uses.\n   - Set up affected-only CI (`nx affected` / `turbo\
  \ run --affected` / Bazel target selection) so a change runs only the tests it can\
  \ break.\n   - Move each repo's CODEOWNERS entries under its new directory.\n  \
  \ - Archive the old repo (read-only, README pointing to the new path) once its last\
  \ open PRs are merged or moved.\n4. **Phase 2+** — the next clusters in order of\
  \ weight.\n5. **Verify** — run the `monorepo-doctor` skill on the new monorepo for\
  \ boundaries, cycles, caching, CI coverage and test leakage. Use `monorepo-boundaries-cleanup`\
  \ to pay down what it finds.\n6. **Measure** — rerun polyrepo-tax on the old repos\
  \ for the pre-migration window, and track bumps, duplicated fixes and regressions\
  \ after the move.\n\nState the one-time effort (`migration.oneTime`) and payback\
  \ range, and the risks: CI capacity during the transition, history-rewrite mistakes,\
  \ ownership disputes, and teams that release independently.\n\n\x1FFILE:references/report-format.md\x1E\
  \n# Step 6 — Report\n\nThe analyzer writes three files to the output directory (default\
  \ `${tmpdir}/polyrepo-tax-reports`):\n\n- `polyrepo-tax-report.html` — the shareable\
  \ report: headline range, cost-by-driver chart, filterable bug list with commit\
  \ evidence, churn, migration and assumptions. One self-contained file with no network\
  \ requests, light and dark mode, printable. Re-render it with `render-html.mjs`\
  \ after writing `migration-plan.md`.\n- `polyrepo-tax-report.md` — the same content\
  \ as Markdown; step 5 appends the migration plan.\n- `polyrepo-tax-report.json`\
  \ — the full data.\n\n## JSON shape (version 1)\n\n| Key | Contents |\n|---|---|\n\
  | `window`, `rates`, `assumptions` | Inputs actually used. |\n| `problems` | Data\
  \ problems (missing repo, shallow clone). |\n| `repos[]` | Name, commit count, packages,\
  \ languages, package manager, build tools, CI files, and `ci` (`minutesPerCommit`,\
  \ `source`: `measured` or `assumed`). |\n| `internal` | `packages` (producer → consumers),\
  \ `bumps`, `releases`, `medianBumpLagDays`, `drift`, `skew`. |\n| `bugs[]` | `id`,\
  \ `category`, `confidence`, `repos`, `title`, `why`, `commits[]` (`repo`, `sha`,\
  \ `date`, `subject`). |\n| `coordinated[]`, `duplicatedTooling[]` | Cross-repo groups\
  \ with commits. |\n| `cost.{low,expected,high}` | `lines[]` per driver (`count`,\
  \ `hours`, `ciMinutes`, `cost`, `annualCost`, `savingsShare`, `annualSavings`) and\
  \ `totals`. |\n| `migration` | `recommendedTool`, `toolOptions[]` (every monorepo.tools\
  \ tool: `rating` /10, `counts` per mark, `categories[]`, `gaps`, `fit`, `fitReason`,\
  \ `alreadyUsed`, `independent`: State of JS and Thoughtworks Radar data where a\
  \ source covers the tool, else `null`), `whyMigrate[]` (monorepo.tools reasons with\
  \ measured `evidence`), `toolSource` (URLs, snapshot date, publisher, legend, `independent`\
  \ sources with metric and coverage), `clusters`, `isolated`, `coupling`, `externalConflicts`,\
  \ `oneTime`, `paybackMonths`. |\n\n## What to tell the user\n\nKeep the message\
  \ short; the report has the detail.\n\n1. Paths of the reports; suggest the HTML\
  \ file for sharing with leadership. It contains repo names, commit subjects and\
  \ SHAs, so it is as confidential as the repos.\n2. One line: expected cost for the\
  \ window and annualized range, split into developer and CI money.\n3. Bug counts\
  \ by confidence, and the 3 strongest bugs, each with its commit evidence.\n4. The\
  \ two cost drivers that dominate, and the assumption each depends on, so the user\
  \ knows which number to challenge.\n5. The recommendation: which cluster to migrate\
  \ first and its payback, which repos to keep separate, or why not to migrate. When\
  \ recommending a migration, give the measured reasons from `migration.whyMigrate`,\
  \ and the top fitting tools from `migration.toolOptions` with their ratings and\
  \ the monorepo.tools source. The full table is in the report.\n6. Data gaps: repos\
  \ that failed to clone, CI that was assumed, commits you excluded in review.\n\n\
  Never present the expected number without the range, or money without the rates\
  \ that produced it.\n\x1FFILE:references/signals.md\x1E\n# Signals\n\nThe analyzer\
  \ reads the history reachable from each repo's `HEAD` (`git log --no-merges`) between\
  \ the window start and `now`, `package.json` diffs, tags, and the files at `HEAD`.\
  \ In the bare clones from inputs.md, `HEAD` is the default branch. For a local working\
  \ copy, check out the default branch first; a feature branch adds unmerged commits\
  \ and misses ones it does not contain. Package ecosystems other than npm contribute\
  \ to grouping signals (tickets, repeated fixes, tooling churn) but not to dependency\
  \ bumps.\n\n## Internal packages\n\nA package is internal when an analysed repo\
  \ publishes it (a `package.json` `name` at `HEAD`) or its name starts with a configured\
  \ `internalScopes` prefix.\n\n- **Bump** — a commit that changes an internal dependency's\
  \ version range in a `package.json` upwards. Authors matching `[bot]`, Renovate,\
  \ Dependabot or github-actions count as bots. One count per (commit, package). A\
  \ repo bumping its own package (a playground or docs workspace) is not counted.\n\
  - **Downgrade** — the same, but to a lower minimum version.\n- **Release** — a commit\
  \ that changes the `version` field of an internal package that another analysed\
  \ repo consumes, or a tag `vX.Y.Z` / `name@X.Y.Z`. Tags only date releases; costed\
  \ releases come from version commits. Packages listed in `publicPackages` (also\
  \ consumed outside the analysed repos) are excluded: they keep releasing in a monorepo.\n\
  - **Lag** — days from a release to the consumer's bump to that version.\n- **Drift\
  \ / skew** — at `HEAD`, consumers below the newest known version, and internal packages\
  \ used at more than one major version across repos.\n\n## Bug categories\n\nOnly\
  \ these categories exist. Each bug carries commit evidence.\n\n| Category | Confidence\
  \ | Detected when | Why it is a repo-boundary bug |\n|---|---|---|---|\n| `dependency-regression`\
  \ | high | A commit downgrades an internal dependency, or is `Revert \"${subject}\"\
  ` of a bump commit in the same repo. | An internal release broke a consumer after\
  \ it shipped. In a monorepo, the producer change runs the consumer's tests before\
  \ merge. |\n| `duplicated-fix` | medium | Fix commits (see below) with near-identical\
  \ subjects land in ≥2 repos within `groupWindowDays`, or share a ticket and a subject.\
  \ | The same code or contract was copied into several repos and had to be fixed\
  \ in each. |\n| `cross-repo-fix` | medium | Fix commits in ≥2 repos share a ticket\
  \ key (`ABC-123`, `owner/repo#12`) but have different subjects. | One bug needed\
  \ coordinated changes across repos: the contract between them lives nowhere. |\n\
  | `fix-propagation` | medium | A fix commit that also bumps an internal dependency\
  \ up. | The fix needed a producer release and a consumer bump to reach users. |\n\
  | `post-bump-fix` | medium / low | A fix commit within `bumpFixWindowDays` after\
  \ an internal bump in the same repo. Medium if it names the bumped package or uses\
  \ compatibility words (breaking, compat, migrate, mismatch…); low if it only lands\
  \ within 2 days of a **major** internal bump. | The bump exposed an integration\
  \ break after release. |\n\nA **fix commit** has a `fix:`/`hotfix:`/`bugfix:` conventional\
  \ prefix (but not the `deps` or `release` scopes), or has no conventional prefix\
  \ and a subject containing fix/bug/hotfix/regression/broken/crash/incident (but\
  \ not \"typo\"). Any other conventional type wins: `docs: fix anchors` and `chore:\
  \ fix lint` are not fixes. Dependency-update subjects (`chore(deps)`, `fix(deps)`,\
  \ `update dependency … to v2`) are bumps, not fixes.\n\nEach commit is assigned\
  \ to at most one bug, in the order of the table rows: regressions, then groups,\
  \ then single-commit categories.\n\n## Duplicated and coordinated work\n\nCommits\
  \ that are not bumps, releases or bugs are grouped across repos when they share\
