  \n#!/usr/bin/env node\n// Renders a polyrepo-tax JSON report as one self-contained\
  \ HTML file (no network requests).\n// Usage: node render-html.mjs <polyrepo-tax-report.json>\
  \ [--plan migration-plan.md] [--out report.html]\n// Without --plan, a migration-plan.md\
  \ next to the JSON is embedded when present.\nimport fs from 'node:fs';\nimport\
  \ path from 'node:path';\nimport { fileURLToPath } from 'node:url';\n\nconst esc\
  \ = (s) => String(s ?? '').replace(/[&<>\"']/g, (c) => ({ '&': '&amp;', '<': '&lt;',\
  \ '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[c]);\n\nfunction moneyFormatter(currency)\
  \ {\n  try {\n    const full = new Intl.NumberFormat('en-US', { style: 'currency',\
  \ currency, maximumFractionDigits: 0 });\n    const compact = new Intl.NumberFormat('en-US',\
  \ { style: 'currency', currency, notation: 'compact', maximumFractionDigits: 1 });\n\
  \    return { full: (n) => full.format(n), compact: (n) => (Math.abs(n) < 10_000\
  \ ? full.format(n) : compact.format(n)) };\n  } catch {\n    // Not an ISO 4217\
  \ code: keep only characters that are safe in HTML text and attributes.\n    const\
  \ label = String(currency).replace(/[^A-Za-z0-9 ._-]/g, '').slice(0, 12) || 'USD';\n\
  \    const f = (n) => `${label} ${Math.round(n).toLocaleString('en-US')}`;\n   \
  \ return { full: f, compact: f };\n  }\n}\nconst num = (n) => Math.round(n).toLocaleString('en-US');\n\
  \n// One line per tool from the independent sources; null when none covers it. Never\
  \ feeds the rating.\nconst MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul',\
  \ 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];\nconst month = (ym) => { const [y, m] = ym.split('-');\
  \ return `${MONTHS[Number(m) - 1]} ${y}`; };\nexport function independentSignals(ind)\
  \ {\n  if (!ind) return null;\n  const parts = [];\n  const s24 = ind.stateOfJs2024;\n\
  \  if (s24) {\n    const years = Object.keys(s24.satisfaction).sort();\n    const\
