  \ of JS 2024 satisfaction ${pct(years.at(-1))}${years.length > 1 ? ` (${pct(years[0])}\
  \ in ${years[0]})` : ''}`);\n  }\n  if (ind.stateOfJs2025) parts.push(`State of\
  \ JS 2025 regular use ${ind.stateOfJs2025.regularUse.toLocaleString('en-US')}${ind.stateOfJs2025.writeIn\
  \ ? ' (write-in)' : ''}`);\n  if (ind.radar) parts.push(`Thoughtworks Radar ${ind.radar.ring}\
  \ (${month(ind.radar.edition)}, archived)`);\n  return parts.join(' · ');\n}\n\n\
  // Every source behind the tool options table, monorepo.tools first: the one that\
