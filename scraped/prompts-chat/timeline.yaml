prompt: "Objective: Construct a chronological sequence of events\n\n1. **Identify\
  \ the central point of the content**\n\n    * Find explicit dates, for example,\
  \ \"January 15, 2024\"; \"2019\"; or \"last Tuesday\"\n    * Identify relative references,\
  \ for example, \"three months later\", \"the following year\"\n    * Note sequence\
  \ words like \"first\", \"then\", \"finally\", \"before\", and \"after\"\n\n2. **Identify\
  \ what happened at each point**\n\n    * Identify the action or occurrence\n   \
  \ * Note who was involved\n    * Note the significance, if stated\n\n3. **Convert\
  \ events to specific dates when possible**\n\n    * Use context clues to calculate\
  \ relative dates\n    * Mark uncertain dates with (?)\n    * Preserve original phrasing\
  \ when dates can't be determined\n\n4. **Unless there is a strong reason not to,\
  \ arrange events**\n\n    * Place earliest events first\n    * Group events with\
  \ the same date/timeframe\n    * Use relative markers (\"Before X,\" \"After Y\"\
  ) when exact sequence is known but dates aren't\n\n5. **Cover the entire timeline\
  \ of events presented on the page**\n\n    * Comprehensiveness is important, so\
  \ complete timelines with all information available on a webpage\n    * Contextual\
  \ accuracy is important, so don't add additional events to the timeline that aren't\
  \ mentioned on the webpage\n\n6. **Handling exceptions**\n\n    Prioritize excellent\
  \ content in your response. If you're unable to formulate a response that meets\
  \ all criteria, you should\n    * respond as best you can and\n    * acknowledge\
  \ any limitations or challenges you faced. For example, maybe there wasn't sufficient\
  \ content on a webpage or the content wasn't compatible with a given request.\n\n\
  \    Consider your proposed response objectively and rate it on a scale from 1-10.\
  \ If you wouldn't give it a 10, either try to create a stronger response or consider\
  \ acknowledging any limitations or challenges you faced. The score is just for your\
  \ own purposes; don't share it with the user.\n\n7. **Final response**\n\n    If\
  \ you have relevant info to share, your final response should follow standard writing\
  \ guidelines, including:\n\n    * Sentence case: titles, labels, and all other content\
  \ should be displayed using sentence case (only proper nouns and the first letter\
  \ of a string appear capitalized).\n    * Favor simple sentences that use common\
  \ words\n\n    **Format the response as:**\n\n    **Timeline**\n\n    * **[Date/Timeframe]**:\
  \ ${event_description}\n    * **[Date/Timeframe]**: ${event_description}\n    *\
  \ **[Date/Timeframe]**: ${event_description}\n\n    **Notes**\n\n    * ${any_dates_marked_uncertain}\n\
  \    * ${any_events_where_sequence_is_unclear}\n\n8. **Follow-up questions**\n\n\
  \    If you can think of a way you can help the user act on information shown in\
  \ the response, conclude with one (at most two) sentences that offers this help.\
  \ Frame it as a question so that a simple response like \"yes please\" might launch\
  \ the next round."
