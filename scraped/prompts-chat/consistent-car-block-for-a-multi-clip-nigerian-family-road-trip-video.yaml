title: Consistent Car Block for a Multi-Clip Nigerian Family Road Trip Video
description: Imported from Prompts Chat
prompt: 'CAR BLOCK (paste into every car clip)

  The car is an old, faded silver Toyota Corolla with a dented front bumper, left-hand
  drive, as in Nigeria. It always drives FORWARD, never in reverse: the front of the
  car, the headlights and the windscreen face the direction of travel. Exactly three
  people are in the car: the father in the driver''s seat (front left), the mother
  in the front passenger seat (front right), and their daughter Nimi in the back seat
  directly behind her mother (rear right). The rear left seat is empty and piled with
  plastic buckets and bags. Luggage is tied on the roof rack. No other passengers.

  CLIP 1: The old car on the road

  Photorealistic cinematic live-action, vertical 9:16, bright morning daylight, a
  road in Nigeria leading toward a university campus. Side tracking shot: the old
  faded silver Toyota Corolla drives forward from the left of the frame to the right,
  front of the car leading, luggage tied on the roof rack and plastic buckets visible
  against the rear window. [Paste CAR BLOCK.] Sound: rattling old engine, birds, distant
  traffic. No dialogue, no subtitles, no on-screen text. Not cartoon or anime.

  CLIP 2: All three in the car

  Photorealistic cinematic live-action, vertical 9:16, natural daylight. Camera is
  in front of the car, looking at it through the windscreen as it drives toward the
  camera at a slow speed. [Paste CAR BLOCK.] The father, a kind dark-skinned Nigerian
  man of about fifty, slightly heavyset, short greying hair, simple short-sleeve shirt,
  holds the steering wheel in the driver''s seat (on the right side of the frame).
  The mother, a warm dark-skinned Nigerian woman in her late forties wearing a colourful
  Ankara top and head tie, sits in the front passenger seat (on the left side of the
  frame). Nimi, an 18-year-old dark-skinned Nigerian girl, timid and shy, with neat
  black braids and a modest blouse, sits in the rear seat behind her mother, looking
  out of the side window with nervous quiet eyes. The mother turns her head back toward
  Nimi and says: "Nimi, you have been quiet since we left home." Nimi gives a small
  shy smile and says softly: "I''m just nervous, Mummy." Authentic Nigerian accents,
  accurate lip sync. Sound: engine hum, light traffic. No subtitles, no on-screen
  text. Not cartoon or anime.

  CLIP 3: Dad speaks

  Photorealistic cinematic live-action, vertical 9:16, natural daylight, interior
  of a moving old car in Nigeria. Camera is in the back seat, looking forward between
  the two front seats. The father sits at the steering wheel on the left of the frame
  (the driver''s seat) and the mother sits in the front passenger seat on the right
  of the frame. The father glances at the rear-view mirror with a reassuring smile
  and says: "You will be fine, my daughter. Just focus on your books." The mother
  nods with a soft smile. Through the windscreen, a Nigerian road moves slowly ahead.
  Authentic Nigerian accents, accurate lip sync. Sound: engine hum, light traffic.
  No subtitles, no on-screen text. Not cartoon or anime.

  CLIP 4: Arriving at campus

  Photorealistic cinematic live-action, vertical 9:16, bright morning daylight, entrance
  area of a Nigerian university campus. Wide shot: the old faded silver Toyota Corolla
  drives forward into frame, slows down and parks facing forward in a space beside
  the student hostel gate. Luggage is on the roof rack. Other students and families
  walk past with bags and buckets in the background. The car never reverses. The car
  doors open and the three occupants step out: the father from the driver''s door
  (left front), the mother from the front passenger door (right front), and Nimi from
  the rear right door. Sound: campus chatter, car doors, birds. No dialogue, no subtitles,
  no on-screen text. Not cartoon or anime.

  CLIP 8: The car leaves

  Photorealistic cinematic live-action, vertical 9:16, bright morning daylight, Nigerian
  university hostel gate. The old faded silver Toyota Corolla pulls forward and drives
  away from the camera down the road, seen from behind, with the father at the wheel
  and the mother in the front passenger seat waving out of the window. The car moves
  forward only, never in reverse. Nimi, an 18-year-old dark-skinned Nigerian girl
  with neat braids and a modest blouse, stands at the gate holding a bucket and a
  bag, waves back with a small shy smile, then walks slowly through the gate. Slow
  push-in on her back as she goes in, then the shot fades to black. Sound: engine
  fading, campus chatter softening, birds. No dialogue, no subtitles, no on-screen
  text. Not cartoon or anime.'
