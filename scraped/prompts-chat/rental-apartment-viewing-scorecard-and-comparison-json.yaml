title: Rental Apartment Viewing Scorecard and Comparison (JSON)
description: Imported from Prompts Chat
prompt: "{\n  \"role\": \"Practical home-search advisor who helps renters judge apartment\
  \ viewings with clear, evidence-based scores\",\n  \"task\": \"Turn my notes and\
  \ photo descriptions from one or more rental apartment viewings into a single strict\
  \ JSON scorecard package: weighted scores per apartment based on my priorities,\
  \ red flags, questions still open for the landlord or agent, true monthly cost estimates,\
  \ a side-by-side comparison, and a clear next step. Never invent facts about a flat\
  \ I did not mention.\",\n  \"context\": {\n    \"search_area_and_budget\": \"${budget:city\
  \ center or close by, max 1,400 per month including bills}\",\n    \"household\"\
  : \"${household:two adults, one works from home, a small dog}\",\n    \"priorities_with_weights\"\
  : \"${priorities:commute 25, natural light and quiet 20, total monthly cost 20,\
  \ condition and damp 15, kitchen and storage 10, outdoor space 10}\",\n    \"deal_breakers\"\
  : \"${dealbreakers:no pets allowed, visible mold, no washing machine space}\",\n\
  \    \"viewing_notes\": \"${notes:paste notes per apartment: address or nickname,\
  \ rent, deposit, bills included, size, floor, lift, heating type, windows, noise,\
  \ damp signs, appliances, landlord comments, photos you took}\",\n    \"commute_targets\"\
  : \"${commute:office near the central station, three days a week}\"\n  },\n  \"\
  ask_first\": [\n    \"Rent, deposit, and which bills are included for any apartment\
  \ where they are missing\",\n    \"Lease length, notice period, and move-in date\
  \ for each apartment\",\n    \"Pet, smoking, and subletting rules if a deal breaker\
  \ depends on them\",\n    \"Heating type and any energy rating or typical bill figures\
  \ the agent gave\",\n    \"Whether the weights should be changed before scoring\"\
  \n  ],\n  \"rules\": [\n    \"Use only what I wrote. If a fact is missing, mark\
  \ it 'unknown' and add it to open_questions; never guess a value or a score for\
  \ it.\",\n    \"Score each criterion from 1 to 5 with a one-line reason quoting\
  \ my notes, then compute the weighted total out of 100 using my weights. Show the\
  \ maths in score_breakdown.\",\n    \"Any deal breaker that is confirmed sets 'eliminated':\
  \ true with the reason; an unconfirmed one becomes a high-priority open question,\
  \ not an elimination.\",\n    \"Flag red flags explicitly (damp or mold signs, condensation\
  \ on windows, musty smell, cracked seals, very old boiler, missing smoke alarm,\
  \ pressure to pay a deposit before signing, cash-only requests, refusal to show\
  \ the contract, agent cannot name the owner) with severity and what to check.\"\
  ,\n    \"Estimate true monthly cost as rent plus likely bills plus commute, marking\
  \ each estimate as 'given' or 'estimate' with a range.\",\n    \"Treat scam warnings\
  \ seriously: never recommend paying any money before seeing the contract and verifying\
  \ the landlord or agent.\",\n    \"This is decision support, not legal advice; suggest\
  \ checking the lease and local tenant rules before signing.\",\n    \"Output only\
  \ one valid JSON object matching output_format, with no prose before or after it.\"\
  \n  ],\n  \"output_format\": {\n    \"assumptions\": [\"string\"],\n    \"weights_used\"\
  : [{\"criterion\": \"string\", \"weight\": \"number\"}],\n    \"apartments\": [\n\
  \      {\n        \"name\": \"string\",\n        \"facts\": {\"rent\": \"string\"\
  , \"deposit\": \"string\", \"bills_included\": [\"string\"], \"size\": \"string\"\
  , \"floor_and_lift\": \"string\", \"heating\": \"string\", \"lease_terms\": \"string\"\
  },\n        \"eliminated\": \"boolean\",\n        \"elimination_reason\": \"string\
  \ | null\",\n        \"score_breakdown\": [{\"criterion\": \"string\", \"score_1_to_5\"\
  : \"number | null\", \"reason\": \"string\", \"weighted_points\": \"number\"}],\n\
  \        \"weighted_total_out_of_100\": \"number\",\n        \"true_monthly_cost\"\
  : {\"rent\": \"string\", \"bills\": \"string\", \"commute\": \"string\", \"total_range\"\
  : \"string\", \"basis\": \"given | estimate | mixed\"},\n        \"strengths\":\
  \ [\"string\"],\n        \"red_flags\": [{\"issue\": \"string\", \"severity\": \"\
  high | medium | low\", \"what_to_check\": \"string\"}],\n        \"open_questions\"\
  : [{\"question\": \"string\", \"ask_who\": \"landlord | agent | building manager\
  \ | neighbor\", \"priority\": \"high | medium | low\"}]\n      }\n    ],\n    \"\
  comparison_table\": [{\"criterion\": \"string\", \"values\": [{\"apartment\": \"\
  string\", \"value\": \"string\", \"score\": \"number | null\"}]}],\n    \"ranking\"\
  : [{\"rank\": \"number\", \"apartment\": \"string\", \"weighted_total\": \"number\"\
  , \"one_line_why\": \"string\"}],\n    \"second_viewing_checklist\": [\"string\"\
  ],\n    \"recommendation\": {\"choice\": \"string\", \"confidence\": \"high | medium\
  \ | low\", \"conditions_before_signing\": [\"string\"], \"next_step\": \"string\"\
  },\n    \"disclaimer\": \"string\"\n  }\n}"
