prompt: "---\nname: grocery-meal-plan-cost-estimator\ndescription: Builds a weekly\
  \ meal plan with portion estimates and a grocery list rolled up by store section,\
  \ then estimates total cost from unit prices you provide or simple defaults. Use\
  \ when planning meals on a budget, batch cooking, or asking \"what should I buy\
  \ for 4 people this week?\". Includes a stdlib Python cost estimator with --self-test.\n\
  ---\n\n# Grocery Meal Plan Cost Estimator\n\nYou help households plan a week of\
  \ meals, scale portions to headcount, build a grocery list grouped by store section,\
  \ and estimate cost from unit prices. You are practical about leftovers and pantry\
  \ staples. You do not give medical diet therapy; you note allergies and preferences\
  \ the user states.\n\n## Files in this skill\n\n- `scripts/estimate_cost.py` - sums\
  \ a grocery list with unit prices and prints section totals (Python 3 standard library\
  \ only)\n- `references/portion-guide.md` - rough per-person amounts for common foods\n\
  - `references/store-section-map.md` - where items usually live in a supermarket\n\
  - `templates/meal-plan.md` - weekly plan + list structure\n- `examples/sample-week.md`\
  \ - worked example for 2 adults\n\n## Workflow\n\n### 1. Collect constraints\nAsk\
  \ for: headcount and ages, nights cooking at home, budget and currency, diet rules\
  \ (veg, halal, allergies), appliances/time, and pantry items already owned.\n\n\
  ### 2. Draft the week\nPropose breakfast / lunch / dinner / snacks with leftover\
  \ reuse. Keep variety without requiring 21 unique recipes.\n\n### 3. Explode to\
  \ groceries\nUsing `references/portion-guide.md`, convert meals to ingredients and\
  \ quantities. Deduplicate (one bottle of oil, not seven).\n\n### 4. Map to store\
  \ sections\nGroup with `references/store-section-map.md` so the list is walkable.\n\
  \n### 5. Estimate cost\n```\npython3 scripts/estimate_cost.py --list groceries.json\n\
  python3 scripts/estimate_cost.py --self-test\n```\nIf the user has no prices, use\
  \ clearly labeled default unit prices and say they are placeholders.\n\n### 6. Answer\n\
  Return: meal plan table, grocery list by section with qty, estimated total, cost\
  \ per person-day, and 2 to 3 swap ideas if over budget.\n\n## Rules\n\n- Never invent\
  \ that something is \"healthy\" as medical advice; stick to preferences and macros\
  \ only if asked.\n- Prefer grams and milliliters plus a household measure.\n- Flag\
  \ perishable items that should be bought mid-week.\n\x1FFILE:references/portion-guide.md\x1E\
  \n# Rough per-person cooked portions (adjust for appetite)\n\n| Food | Per adult\
  \ | Per child (5–10) |\n| --- | --- | --- |\n| Cooked rice / grains | 150–180 g\
  \ | 80–100 g |\n| Dry pasta | 80–100 g | 50–70 g |\n| Protein (raw meat/fish) |\
  \ 120–150 g | 70–90 g |\n| Beans/lentils (dry) | 50–70 g | 30–40 g |\n| Vegetables\
  \ (raw weight) | 150–200 g | 80–120 g |\n| Fruit | 1 piece or 120 g | 1 small piece\
  \ |\n| Milk / alt milk | 200–250 ml | 150 ml |\n| Bread | 2 slices | 1 slice |\n\
  | Oil for cooking | ~10 ml per saute | shared |\n| Eggs | 2 | 1 |\n\n## Scaling\
  \ tips\n\n- Soups/stews: scale liquid 90% when going from 2 to 4 (pot efficiency).\n\
  - Spices: do not scale linearly past 4 portions; taste and adjust.\n- Leftovers\
  \ lunch: cook +40% dinner on two weeknights instead of separate recipes.\n\x1FFILE:references/store-section-map.md\x1E\
  \n# Typical supermarket section map\n\nUse these buckets on the grocery list (adapt\
  \ names to local stores):\n\n1. **Produce** — fruit, vegetables, herbs, salad\n\
  2. **Bakery** — bread, tortillas, buns\n3. **Meat & seafood** — fresh/cooled protein\n\
  4. **Dairy & eggs** — milk, yogurt, cheese, butter, eggs\n5. **Deli / prepared**\
  \ — if used\n6. **Pantry dry** — rice, pasta, beans, flour, sugar, cereal\n7. **Cans\
  \ & jars** — tomatoes, tuna, sauces\n8. **Oils & spices** — cooking oil, salt, spices,\
  \ vinegar\n9. **Frozen** — vegetables, frozen protein, ice cream\n10. **Beverages**\
  \ — coffee, tea, juice, sparkling water\n11. **Household** — if buying soap/bags\
  \ on the same trip\n\nWalk order suggestion: produce → bakery → meat → dairy → center\
  \ aisles → frozen → beverages.\n\x1FFILE:templates/meal-plan.md\x1E\n# Weekly meal\
  \ plan\n\n- **People**:\n- **Budget / currency**:\n- **Diet notes**:\n\n## Meals\n\
  \n| Day | Breakfast | Lunch | Dinner | Notes |\n| --- | --- | --- | --- | --- |\n\
  | Mon |  |  |  |  |\n| Tue |  |  |  |  |\n| Wed |  |  |  |  |\n| Thu |  |  |  |\
  \  |\n| Fri |  |  |  |  |\n| Sat |  |  |  |  |\n| Sun |  |  |  |  |\n\n## Grocery\
  \ list by section\n\n### Produce\n- [ ] item — qty — est. price\n\n### Dairy & eggs\n\
  - [ ]\n\n## Cost summary\n\n- Estimated total:\n- Per person-day:\n- Mid-week top-up:\n\
  \x1FFILE:examples/sample-week.md\x1E\n# Sample week — 2 adults, flexible omnivore,\
  \ EUR\n\nBudget target: €70\n\n## Meals (short)\n\n| Day | Dinner highlight | Lunch\
  \ plan |\n| --- | --- | --- |\n| Mon | Chickpea curry + rice | Leftover curry |\n\
  | Tue | Pasta aglio e olio + salad | Egg sandwiches |\n| Wed | Sheet-pan chicken\
  \ + veg | Leftover chicken bowls |\n| Thu | Lentil soup + bread | Soup + fruit |\n\
  | Fri | Fish tacos (frozen fish) | Rice fried with leftover veg |\n| Sat | Veggie\
  \ omelette feast | Eating out / skip |\n| Sun | Batch chili for Mon lunch | Chili\
  \ |\n\n## Grocery excerpt (for estimate_cost.py)\n\nSee accompanying JSON shape:\n\
  \n```json\n{\n  \"currency\": \"EUR\",\n  \"items\": [\n    {\"name\": \"rice 1kg\"\
  , \"section\": \"Pantry dry\", \"qty\": 1, \"unit_price\": 2.2},\n    {\"name\"\
  : \"chickpeas canned x4\", \"section\": \"Cans & jars\", \"qty\": 4, \"unit_price\"\
  : 0.9},\n    {\"name\": \"pasta 500g\", \"section\": \"Pantry dry\", \"qty\": 2,\
  \ \"unit_price\": 1.1},\n    {\"name\": \"chicken thighs 1kg\", \"section\": \"\
  Meat & seafood\", \"qty\": 1, \"unit_price\": 6.5},\n    {\"name\": \"mixed veg\
  \ 1kg\", \"section\": \"Produce\", \"qty\": 1, \"unit_price\": 3.0},\n    {\"name\"\
  : \"eggs 12\", \"section\": \"Dairy & eggs\", \"qty\": 1, \"unit_price\": 3.2},\n\
  \    {\"name\": \"milk 1L\", \"section\": \"Dairy & eggs\", \"qty\": 2, \"unit_price\"\
  : 1.1},\n    {\"name\": \"frozen white fish 500g\", \"section\": \"Frozen\", \"\
  qty\": 1, \"unit_price\": 4.5}\n  ]\n}\n```\n\x1FFILE:scripts/estimate_cost.py\x1E\
  \n#!/usr/bin/env python3\n\"\"\"Estimate grocery cost from a JSON list.\n\nUsage:\n\
  \    python3 estimate_cost.py --list groceries.json\n    python3 estimate_cost.py\
  \ --self-test\n\nJSON shape:\n{\n  \"currency\": \"EUR\",\n  \"items\": [{\"name\"\
  : \"...\", \"section\": \"...\", \"qty\": 1, \"unit_price\": 2.5}]\n}\n\nPython\
  \ 3 standard library only.\n\"\"\"\nfrom __future__ import annotations\n\nimport\
  \ argparse\nimport json\nimport sys\nfrom collections import defaultdict\nfrom typing\
  \ import Any, Dict, List\n\n\ndef load_list(path: str) -> dict:\n    return json.load(open(path,\
  \ encoding=\"utf-8\"))\n\n\ndef estimate(data: dict) -> dict:\n    currency = data.get(\"\
  currency\") or \"USD\"\n    items = data.get(\"items\") or []\n    by_section: Dict[str,\
  \ float] = defaultdict(float)\n    lines = []\n    total = 0.0\n    for it in items:\n\
  \        name = it[\"name\"]\n        section = it.get(\"section\") or \"Other\"\
  \n        qty = float(it.get(\"qty\", 1))\n        price = float(it[\"unit_price\"\
  ])\n        line_total = qty * price\n        total += line_total\n        by_section[section]\
  \ += line_total\n        lines.append({\n            \"name\": name,\n         \
  \   \"section\": section,\n            \"qty\": qty,\n            \"unit_price\"\
  : price,\n            \"line_total\": round(line_total, 2),\n        })\n    return\
  \ {\n        \"currency\": currency,\n        \"total\": round(total, 2),\n    \
  \    \"by_section\": {k: round(v, 2) for k, v in sorted(by_section.items())},\n\
  \        \"lines\": lines,\n        \"item_count\": len(lines),\n    }\n\n\ndef\
  \ format_report(result: dict) -> str:\n    cur = result[\"currency\"]\n    lines\
  \ = [f\"Estimated total: {result['total']:.2f} {cur} ({result['item_count']} lines)\"\
  ]\n    lines.append(\"By section:\")\n    for sec, amt in result[\"by_section\"\
  ].items():\n        lines.append(f\"  - {sec}: {amt:.2f} {cur}\")\n    return \"\
  \\n\".join(lines)\n\n\ndef self_test() -> int:\n    sample = {\n        \"currency\"\
  : \"EUR\",\n        \"items\": [\n            {\"name\": \"rice\", \"section\":\
  \ \"Pantry dry\", \"qty\": 1, \"unit_price\": 2.2},\n            {\"name\": \"eggs\"\
  , \"section\": \"Dairy & eggs\", \"qty\": 1, \"unit_price\": 3.2},\n           \
  \ {\"name\": \"milk\", \"section\": \"Dairy & eggs\", \"qty\": 2, \"unit_price\"\
  : 1.1},\n        ],\n    }\n    r = estimate(sample)\n    cases = [\n        (\"\
  total\", r[\"total\"], 7.6),\n        (\"dairy_section\", r[\"by_section\"][\"Dairy\
  \ & eggs\"], 5.4),\n        (\"pantry\", r[\"by_section\"][\"Pantry dry\"], 2.2),\n\
  \        (\"count\", r[\"item_count\"], 3),\n        (\"currency\", r[\"currency\"\
  ], \"EUR\"),\n        (\"empty\", estimate({\"items\": []})[\"total\"], 0.0),\n\
  \        (\"qty_scale\", estimate({\"items\": [{\"name\": \"x\", \"section\": \"\
  A\", \"qty\": 3, \"unit_price\": 1.5}]})[\"total\"], 4.5),\n        (\"default_section\"\
  , estimate({\"items\": [{\"name\": \"y\", \"qty\": 1, \"unit_price\": 2}]})[\"by_section\"\
  ][\"Other\"], 2.0),\n        (\"round\", estimate({\"items\": [{\"name\": \"z\"\
  , \"section\": \"A\", \"qty\": 1, \"unit_price\": 1.005}]})[\"total\"], 1.0),\n\
  \    ]\n    failed = 0\n    for name, got, expected in cases:\n        if isinstance(expected,\
  \ float):\n            ok = abs(float(got) - expected) < 1e-9\n        else:\n \
  \           ok = got == expected\n        failed += not ok\n        print(f\"{'PASS'\
  \ if ok else 'FAIL'}  {name}: got={got!r} expected={expected!r}\")\n    print(f\"\
  \\n{len(cases) - failed}/{len(cases)} passed\")\n    return 1 if failed else 0\n\
  \n\ndef main(argv=None) -> int:\n    p = argparse.ArgumentParser(description=\"\
  Estimate grocery list cost.\")\n    p.add_argument(\"--list\", help=\"Path to groceries\
  \ JSON\")\n    p.add_argument(\"--json\", action=\"store_true\")\n    p.add_argument(\"\
  --self-test\", action=\"store_true\")\n    a = p.parse_args(argv)\n    if a.self_test:\n\
  \        return self_test()\n    if not a.list:\n        p.error(\"--list is required\
  \ (or use --self-test)\")\n    result = estimate(load_list(a.list))\n    if a.json:\n\
  \        print(json.dumps(result, indent=2))\n    else:\n        print(format_report(result))\n\
  \    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())"
