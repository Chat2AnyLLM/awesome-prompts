title: Identity-Locked Image Transformation Prompt
description: Imported from Prompts Chat
prompt: "IDENTITY LOCK — FACIAL PRESERVATION MODE\n\nReference Image(s) Provided:\
  \ [attach 1–3 clear reference photos of the subject]\n\nCORE DIRECTIVE:\nYou are\
  \ performing a targeted visual transformation on the provided reference image(s).\
  \ \nThe subject's facial identity is LOCKED and must not be altered, reconstructed,\
  \ or averaged \nunder any circumstance. The face in the final output must be unmistakably\
  \ recognizable as \nthe exact same individual shown in the reference image(s).\n\
  \n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nIDENTITY ELEMENTS — DO NOT CHANGE:\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\
  - Overall face shape and skull structure\n- Eye shape, spacing, depth, and lid contour\n\
  - Nose bridge width, tip shape, and nostrils\n- Lip contour, cupid's bow shape,\
  \ fullness ratio (upper vs. lower lip)\n- Jawline definition and chin shape\n- Cheekbone\
  \ placement and facial width\n- Forehead height and brow ridge\n- Skin texture,\
  \ undertone, and ethnicity markers\n- Distinctive facial features: moles, freckles,\
  \ dimples, scars, asymmetries\n- Inter-feature distances (eye-to-eye, nose-to-lip,\
  \ lip-to-chin)\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nPERMITTED CHANGES (non-identity\
  \ elements):\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n- Clothing, fabric, materials, and\
  \ accessories\n- Environment, setting, and background\n- Lighting direction, color\
  \ temperature, and intensity\n- Color grading and overall image tone\n- Camera angle,\
  \ framing, and composition\n- Body pose, gesture, and stance\n- Artistic style or\
  \ genre (e.g., cinematic, painterly, editorial) — IF requested\n- Subtle facial\
  \ expression changes (slight smile, calm, thoughtful) \n  ONLY as micro-adjustments\
  \ ON THE EXISTING FACE STRUCTURE — not by rebuilding the face\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\
  ABSOLUTE PROHIBITIONS:\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n- Do NOT replace the face\
  \ with an averaged, idealized, or generic face\n- Do NOT apply beauty enhancement\
  \ that alters facial proportions\n- Do NOT make the subject appear younger, older,\
  \ or a different gender\n- Do NOT change ethnicity or racial features\n- Do NOT\
  \ smooth skin to the point of erasing texture and distinctiveness\n- Do NOT modify\
  \ face shape under the guise of lighting, style, or genre change\n- Do NOT reconstruct\
  \ the face from scratch for any reason\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nQUALITY\
  \ TARGET:\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nPhotorealistic output. Natural skin texture.\
  \ Accurate subsurface scattering.\nCoherent lighting between subject and environment.\
  \ The subject must pass \na \"same person\" recognition test when the output is\
  \ placed side-by-side \nwith the reference image. Facial similarity takes priority\
  \ over stylistic polish.\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nTRANSFORMATION REQUEST:\n\
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n[Describe your specific change here — e.g., \"Place\
  \ the subject in a candlelit medieval \ntavern, wearing a worn leather coat. Keep\
  \ lighting warm and moody. Photorealistic.\"]"
