  : \"string\",\n      \"send_how\": \"string\",\n      \"subject\": \"string\",\n\
  \      \"body\": \"string\"\n    },\n    \"deduction_dispute_letter\": {\n     \
  \ \"send_when\": \"string\",\n      \"send_how\": \"string\",\n      \"subject\"\
  : \"string\",\n      \"body\": \"string\",\n      \"attachments\": [\"string\"]\n\
  \    },\n    \"escalation_path\": [\n      {\n        \"step\": \"number\",\n  \
