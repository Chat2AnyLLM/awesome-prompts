  : [\"string\"],\n      \"assumptions\": [\"string\"],\n      \"open_questions\"\
  : [\"string\"]\n    },\n    \"local_rules_to_confirm\": [\n      {\n        \"rule_type\"\
  : \"string\",\n        \"why_it_matters\": \"string\",\n        \"where_to_confirm\"\
  : \"string\",\n        \"confirm\": true\n      }\n    ],\n    \"move_out_checklist\"\
  : [\n      {\n        \"room\": \"string\",\n        \"tasks\": [\n          {\n\
  \            \"task\": \"string\",\n            \"priority\": \"must | should |\
  \ nice\",\n            \"time_minutes\": \"number\",\n            \"supplies\":\
