  \        }\n      ]\n    },\n    \"wear_vs_damage\": [\n      {\n        \"issue\"\
  : \"string\",\n        \"room\": \"string\",\n        \"classification\": \"normal_wear\
  \ | damage | cleaning | unclear\",\n        \"reason\": \"string\",\n        \"\
  my_action\": \"string\",\n        \"likely_cost_note\": \"string\"\n      }\n  \
  \  ],\n    \"deduction_review\": [\n      {\n        \"deduction\": \"string\",\n\
  \        \"amount\": \"number | null\",\n        \"assessment\": \"fair | questionable\
  \ | may_not_be_allowed | need_more_info\",\n        \"reason\": \"string\",\n  \
