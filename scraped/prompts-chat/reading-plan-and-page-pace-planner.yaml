  , \"event\": \"classics club\"},\n    {\"title\": \"Piranesi (audiobook)\", \"audio_minutes\"\
  : 400, \"speed\": 1.25}\n  ]\n}\n\x1FFILE:examples/book-club-plan.md\x1E\n# Reading\
  \ plan: Nov-Dec 2026 (two book clubs and a work book)\n\nStart 2026-11-03, even\
  \ mode, 2 buffer day(s) before each deadline, catch-up days: sun. Planned reading:\
  \ 36 h 44 min over 81 days.\n\n**Verdict: 1 book(s) cannot be finished by their\
  \ deadline - change the plan**\n\n## Books\n\n| Book | Left | Est. time | Deadline\
  \ | Finish by | Planned finish | Days spare | Avg per reading day |\n|---|---|---|---|---|---|---|---|\n\
  | The Remains of the Day | 245 pp | 4:31 h | 2026-11-19 (Thursday book club) | 2026-11-17\
