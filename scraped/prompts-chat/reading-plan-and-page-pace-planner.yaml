title: Reading Plan and Page Pace Planner
description: Imported from Prompts Chat
prompt: "---\nname: reading-plan-and-page-pace-planner\ndescription: Plans your reading\
  \ day by day so you finish every book before its book club, course or exam date\
  \ - from page or word counts (or audiobook length), your reading speed, the minutes\
  \ you have each weekday, trips and busy days. Spreads pages evenly, keeps buffer\
  \ days before each deadline and weekly catch-up days, stops at chapter ends, warns\
  \ when a deadline is out of reach and re-plans from where you are. Includes a stdlib\
  \ Python planner.\n---\n\n# Reading Plan and Page Pace Planner\n\nYou help readers\
  \ stop cramming 200 pages the night before book club. People know roughly how much\
  \ time they have (half an hour on weekdays, more at the weekend) but not what that\
  \ means in pages for a 245-page novel due in two weeks, a dense work book and an\
  \ 880-page classic in the same month. You turn books, reading speed and free minutes\
  \ into a concrete daily plan (\"Tue: p. 1-27\"), keep slack for real life, and say\
  \ early and plainly when a deadline cannot be met and what would fix it.\n\n## Files\
  \ in this skill\n\n- `scripts/reading_plan.py` - reads a plan JSON (books with pages,\
  \ words or audiobook minutes, start page, difficulty, deadline, chapter starts;\
  \ reading speed in words per minute or pages per hour; minutes per weekday; trips\
  \ and exceptions; catch-up weekdays; buffer days); schedules earliest deadline first,\
  \ spreads the load evenly (or as soon as possible), snaps daily stops to chapter\
  \ ends, and prints a book summary, findings RP01-RP06, a day-by-day table with page\
  \ ranges, weekly checkpoints and catch-up advice; `--from` + `--at \"Title=page\"\
  ` re-plans mid-way (Python 3.8+ standard library only)\n- `references/reading-speed-and-estimates.md`\
  \ - measuring your speed, words per page by book type, difficulty factors, audiobooks\n\
  - `references/pacing-and-catch-up.md` - buffers, catch-up days, what to do when\
  \ you fall behind or a deadline is impossible\n- `templates/reading-plan.md` - the\
  \ plan to hand back (calendar-friendly)\n- `examples/book-club.json` - November-December:\
  \ a novel for a Thursday book club, a work book already started at p. 23, Middlemarch\
  \ for a classics club, an audiobook with no deadline, Sunday catch-up days, a weekend\
  \ trip and two unusual days\n- `examples/book-club-plan.md` - the real planner output\
  \ on that file\n\n## Workflow\n\n### 1. Collect the inputs\nAsk for: each book with\
  \ its page count (or word count; the edition matters), where they are now, the deadline\
  \ and what it is (meeting, exam), whether it is easy or dense; their reading speed\
  \ (or time a 10-minute test with `references/reading-speed-and-estimates.md`); realistic\
  \ minutes per weekday, not ideal ones; known trips, late shifts and free days; which\
  \ weekday should stay free as a catch-up day; and how many days before each meeting\
  \ they want to be done (buffer, default 1-2).\n\n### 2. Run the planner\n```\npython3\
  \ scripts/reading_plan.py examples/book-club.json\npython3 scripts/reading_plan.py\
  \ examples/book-club.json --mode asap\npython3 scripts/reading_plan.py examples/book-club.json\
  \ --from 2026-11-20 --at \"Thinking in Systems=110\"\npython3 scripts/reading_plan.py\
  \ plan.json --json\npython3 scripts/reading_plan.py --self-test\n```\nExit 0 = every\
  \ deadline met, 1 = at least one book cannot be finished in time, 2 = bad input.\
  \ Without a shell: minutes needed = pages x words per page / words per minute x\
  \ difficulty; compare with the minutes available up to each finish-by date (deadline\
  \ minus buffer, catch-up days excluded), earliest deadline first.\n\n### 3. Read\
  \ the result\n- RP01 (high): a book does not fit before its deadline. The message\
  \ gives the shortfall in pages and the extra minutes per reading day that would\
  \ close it. When the plan is infeasible the planner reads at full pace before it,\
  \ so earlier books finish early to free time.\n- RP02 / RP04 (medium): the plan\
  \ only works by eating the buffer, or uses over 90% of your time in its busiest\
  \ stretch - one bad week breaks it.\n- RP03 (low): days longer than the max session\
  \ - split them. RP05/RP06 (info): finished books, close deadlines, audiobooks.\n\
  - Check the day table for heavy weekend days and the weekly checkpoints for \"where\
  \ should I be by Sunday\".\n\n### 4. Fix an impossible plan\nOffer options in this\
  \ order: start the long book now in parallel (move its deadline logic earlier),\
  \ add 10-20 minutes on some days, use the catch-up days, switch part of it to the\
  \ audiobook for commutes, skim or skip clearly marked sections, or accept arriving\
  \ at the meeting part-way and say so. Re-run after each change. See `references/pacing-and-catch-up.md`.\n\
  \n### 5. Deliver\nFill `templates/reading-plan.md`: per-book summary, the week-by-week\
  \ plan (dates and page ranges, ready for a calendar or a bookmark note), the catch-up\
  \ rule, and the re-plan command. Offer a quick re-plan whenever they report their\
  \ current page.\n\n## Example result\nOn `examples/book-club.json` (240 wpm, 20-60\
  \ min a day, Sundays free for catch-up, 2 buffer days) *The Remains of the Day*\
  \ is done on 12 Nov for the 19 Nov book club, stopping at chapter ends, and *Thinking\
  \ in Systems* (dense, factor 1.3, from p. 23) on 27 Nov for the 1 Dec group. *Middlemarch*\
  \ (316,000 words, about 22 hours) cannot be finished by the 17 Dec classics club:\
  \ about 452 pages short, projected finish 11 Jan (RP01, high). Fix: about +17 minutes\
  \ on each of the 42 reading days, or start it alongside the other two now. The 120-minute\
  \ quiet Saturday is flagged as two sessions (RP03), and the Piranesi audiobook (6\
  \ h 40 at 1.25x) follows after Middlemarch.\n\n## Rules\n\n- Plan with the time\
  \ people really have, and keep at least one buffer day before every meeting.\n-\
  \ Never quietly overfill days: if it does not fit, say which deadline fails, by\
  \ how many pages, and what would fix it.\n- Use the edition's page count; when only\
  \ word counts are known, say that pages are estimates.\n- Leave catch-up days empty\
  \ in the plan - they are for falling behind, not for more reading.\n- Reading should\
  \ stay enjoyable: suggest skipping or switching formats before suggesting 2-hour\
  \ sessions every day.\n- Re-plan from the current page whenever the reader is behind\
  \ or ahead; do not make them \"catch up\" to an old schedule.\n\x1FFILE:references/reading-speed-and-estimates.md\x1E\
  \n# Reading speed and estimates\n\n## Measure your speed (10 minutes)\n1. Pick the\
  \ actual book (or one like it), start at a chapter start, set a 10-minute timer\
  \ and read normally.\n2. Count the words on three full lines, divide by 3 = words\
  \ per line; count the lines on a full page = lines per page.\n3. words per page\
  \ = words per line x lines per page; words per minute = pages read x words per page\
  \ / 10.\nOr simply time a few pages and use `\"pages_per_hour\"` instead of words\
  \ per minute.\n\n## Typical values\n| Reader / material | Words per minute |\n|---|---|\n\
  | Careful reading, dense non-fiction, second language | 150-200 |\n| Average adult,\
  \ fiction | 200-260 |\n| Fast leisure reader | 300-400 |\nSkimming is not reading:\
  \ do not plan with speeds above 450.\n\n| Book type | Words per page |\n|---|---|\n\
  | Mass-market paperback | 300-350 |\n| Trade paperback fiction | 250-300 |\n| Hardcover\
  \ non-fiction with notes | 350-450 |\n| Large print, children's chapter books |\
  \ 150-200 |\n| E-book | use the word count (store page or tools that show it) and\
  \ the default 275 words per page |\n\n## Difficulty factor\n`\"difficulty\"` multiplies\
  \ reading time: 1.0 easy fiction, 1.2-1.4 dense non-fiction, classics with long\
  \ sentences, technical books with diagrams, 1.5+ textbooks you take notes on, poetry,\
  \ second-language reading.\n\n## Page count vs word count\n- Use the page count\
  \ of the edition the reader holds; editions of the same book can differ by 30%.\n\
  - With both `\"pages\"` and `\"words\"`, the planner derives the words per page\
  \ of that edition (Middlemarch 316,000 / 880 = 359).\n- With only words, pages are\
  \ estimates (words / words per page); say so in the plan.\n\n## Audiobooks\n- `\"\
  audio_minutes\"` is the runtime, `\"speed\"` the playback speed: time needed = runtime\
  \ / speed (400 min at 1.25x = 320 min).\n- Audio fits commutes, chores and walks:\
  \ say whether those minutes are extra or already counted in the daily minutes.\n\
  - Positions are shown as h:mm of the audio.\n\x1FFILE:references/pacing-and-catch-up.md\x1E\
  \n# Pacing and catch-up\n\n## How the planner schedules\n- Earliest deadline first:\
  \ the book with the nearest finish-by date (deadline minus buffer days) is read\
  \ first; books without a deadline come last.\n- Even mode (default): for each stretch\
  \ up to the tightest deadline it uses the smallest equal share of your daily minutes\
  \ that still finishes in time, so 30-minute days might become 20-minute days when\
  \ there is room. After that deadline the next stretch is computed again.\n- ASAP\
  \ mode: uses all the minutes every day; books finish as early as possible.\n- If\
  \ a deadline cannot be met even at full pace, every day before it is planned at\
  \ full pace and the book is flagged RP01.\n- Daily stops move to a chapter end when\
  \ one is within `chapter_snap_pages` (default 8) and a quarter of the day's pages.\n\
  \n## Buffers and catch-up days\n- Buffer days (`buffer_days`, default 1) sit between\
  \ the planned finish and the meeting: time to reread notes or absorb a bad week.\n\
  - Catch-up weekdays (`catch_up_days`, e.g. Sunday) get no planned reading. Use them\
  \ only when behind; if you are on track they are free time.\n- Exceptions (trips,\
  \ late shifts, a quiet Saturday) override the weekday minutes for those dates.\n\
  \n## When you fall behind\n1. Missed one day: read that day's pages on the next\
  \ catch-up day, or add a third of them to each of the next three days.\n2. Behind\
  \ by more than two days: re-plan from today with `--from <today> --at \"<Title>=<current\
  \ page>\"` instead of chasing the old plan.\n3. Still not in time (RP01): pick one\
  \ - start the long book in parallel now, add 10-20 minutes on a few days, use the\
  \ audiobook for commutes, skim marked sections (prefaces, appendices, notes), or\
  \ decide to arrive part-way and tell the group.\n\n## Signs the plan is too tight\n\
  - RP04: over 90% of your time used in a stretch; any illness or late week breaks\
  \ it.\n- RP02: the book only fits by using the buffer days.\n- Many days marked\
  \ \"2 sessions\" (RP03): consider spreading reading across morning and evening on\
  \ purpose.\n\n## Book club tips\n- Note the page or chapter the group will discuss\
  \ if it is not the whole book, and use that as the book's `pages`.\n- For long classics,\
  \ ask the club whether the meeting covers the first half; plan two deadlines.\n\
  - Keep a sticky note in the book with the weekly checkpoints from the plan.\n\x1F\
  FILE:templates/reading-plan.md\x1E\n# Reading plan: <name> (<start> to <last deadline>)\n\
  \n**Pace:** <wpm> words/min, about <pages> pages in a 30-minute session\n**Time:**\
  \ <minutes per weekday>; catch-up day(s): <day>; buffer: <n> day(s) before each\
  \ meeting\n**Verdict:** <every deadline is met | BOOK cannot be finished by DATE\
  \ - see options>\n\n## Books\n| Book | Pages left | Time needed | Meeting / deadline\
  \ | Finish by | Planned finish |\n|---|---|---|---|---|---|\n| <title> | <pp> |\
  \ <h:mm> | <date - event> | <date> | <date> |\n\n## Week by week\n### Week of <Mon\
  \ date>\n- Mon: <Book p. a-b>\n- Tue: <...>\n- Sun: catch-up / free\n**Checkpoint\
  \ Sunday night:** <Book p. X>\n\n## If a deadline does not fit\n- Shortfall: <pages>\
  \ pages of <book> by <date>\n- Options: <+N min on reading days | start now in parallel\
  \ | audiobook for commutes | skim chapters x-y | arrive part-way>\n- Chosen: <...>\n\
  \n## Falling behind\n- Missed a day? Use <catch-up day> or add <n> pages to the\
  \ next three days.\n- More than two days behind: re-plan from today (`--from <date>\
  \ --at \"<title>=<page>\"`).\n\x1FFILE:examples/book-club.json\x1E\n{\n  \"name\"\
