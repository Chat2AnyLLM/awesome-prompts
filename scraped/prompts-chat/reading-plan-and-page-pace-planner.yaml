  ] <= 10.31)\n    r, m = run(dict(base, books=[{\"title\": \"A\", \"pages\": 300,\
  \ \"deadline\": \"2026-11-08\"}]))\n    t(\"infeasible -> RP01 high\", any(f[1]\
  \ == \"RP01\" and f[0] == \"high\" for f in r[\"findings\"]))\n    t(\"RP01 suggests\
  \ extra minutes\", any(\"+13 min\" in f[2] for f in r[\"findings\"] if f[1] == \"\
  RP01\"))\n    r, m = run(dict(base, buffer_days=2, books=[{\"title\": \"A\", \"\
  pages\": 70, \"deadline\": \"2026-11-08\"}]))\n    t(\"buffer days: finish 2 days\
  \ early\", r[\"books\"][0][\"finish\"] == datetime.date(2026, 11, 6))\n    r, m\
  \ = run(dict(base, catch_up_days=[\"sun\"], books=[{\"title\": \"A\", \"pages\"\
  : 60, \"deadline\": \"2026-11-08\"}]))\n    t(\"catch-up Sunday gets no planned\
  \ reading\", r[\"days\"][-1][\"planned\"] == 0 and r[\"books\"][0][\"finish\"] ==\
  \ datetime.date(2026, 11, 7))\n    r, m = run(dict(base, exceptions=[{\"dates\"\
  : \"2026-11-03..2026-11-04\", \"minutes\": 0, \"note\": \"trip\"}], books=[{\"title\"\
  : \"A\", \"pages\": 50, \"deadline\": \"2026-11-08\"}]))\n    t(\"exception range\
  \ has no reading\", all(x[\"planned\"] == 0 for x in r[\"days\"][1:3]))\n    two\
  \ = [{\"title\": \"Late\", \"pages\": 30, \"deadline\": \"2026-11-20\"}, {\"title\"\
  : \"Soon\", \"pages\": 60, \"deadline\": \"2026-11-04\"}]\n    r, m = run(dict(base,\
  \ books=two))\n    t(\"earliest deadline first\", r[\"days\"][0][\"items\"][0][\"\
  title\"] == \"Soon\")\n    t(\"tight segment then lighter load\", r[\"load\"][0]\
  \ > 0.6 and r[\"load\"][5] < 0.2)\n    r, m = run(dict(base, books=[{\"title\":\
  \ \"A\", \"pages\": 70, \"deadline\": \"2026-11-08\"}]), at={\"A\": 36})\n    t(\"\
  --at resumes from page\", abs(sum(x[\"planned\"] for x in r[\"days\"]) - 35) < 0.01)\n\
  \    r, m = run(dict(base, books=[{\"title\": \"W\", \"words\": 25000, \"deadline\"\
  : \"2026-11-08\"}]))\n    t(\"word count -> pages via words_per_page\", r[\"all_books\"\
  ][0][\"units\"] == 100)\n    r, m = run(dict(base, books=[{\"title\": \"H\", \"\
  pages\": 70, \"difficulty\": 1.5, \"deadline\": \"2026-11-08\"}]))\n    t(\"difficulty\
  \ scales time\", abs(r[\"books\"][0][\"need\"] - 105) < 0.01)\n    r, m = run(dict(base,\
  \ books=[{\"title\": \"Au\", \"audio_minutes\": 300, \"speed\": 1.5, \"deadline\"\
  : \"2026-11-08\"}]))\n    t(\"audiobook at 1.5x = 200 min\", abs(r[\"books\"][0][\"\
  need\"] - 200) < 0.01 and any(f[1] == \"RP06\" for f in r[\"findings\"]))\n    r,\
  \ m = run(dict(base, books=[{\"title\": \"C\", \"pages\": 70, \"deadline\": \"2026-11-08\"\
  , \"chapters\": [1, 12, 23, 31, 42, 55]}]))\n    ends = [round(it[\"to\"]) for x\
  \ in r[\"days\"] for it in x[\"items\"]]\n    t(\"chapter snapping stops at chapter\
  \ ends\", 11 in ends and 22 in ends and ends[-1] == 70)\n    t(\"one item per book\
  \ per day\", all(len({it[\"title\"] for it in x[\"items\"]}) == len(x[\"items\"\
  ]) for x in r[\"days\"]))\n    t(\"page ranges do not overlap\", all(fmt_item(it)\
  \ for x in r[\"days\"] for it in x[\"items\"]) and\n      [int(round(it[\"from\"\
  ])) for x in r[\"days\"] for it in x[\"items\"]][1:] == [int(round(it[\"to\"]))\
  \ for x in r[\"days\"] for it in x[\"items\"]][:-1])\n    r, m = run(dict(base,\
  \ max_session_minutes=20, minutes=60, books=[{\"title\": \"A\", \"pages\": 300,\
  \ \"deadline\": \"2026-11-08\"}]))\n    t(\"long sessions -> RP03\", any(f[1] ==\
  \ \"RP03\" for f in r[\"findings\"]))\n    r, m = run(dict(base, books=[{\"title\"\
  : \"A\", \"pages\": 200, \"deadline\": \"2026-11-08\"}]))\n    t(\"tight plan ->\
  \ RP04 or RP01\", any(f[1] in (\"RP04\", \"RP01\") for f in r[\"findings\"]))\n\
  \    r, m = run(dict(base, books=[{\"title\": \"A\", \"pages\": 30}, {\"title\"\
  : \"B\", \"pages\": 60, \"deadline\": \"2026-11-05\"}]))\n    t(\"undated book after\
  \ dated ones\", r[\"books\"][-1][\"title\"] == \"A\" and r[\"books\"][-1][\"finish\"\
  ])\n    r, m = run(dict(base, books=[{\"title\": \"A\", \"pages\": 20, \"start_page\"\
  : 21}]))\n    t(\"finished book -> RP05\", any(f[1] == \"RP05\" for f in r[\"findings\"\
  ]))\n    t(\"pages_per_hour\", abs(load(dict(base, reader={\"pages_per_hour\": 30},\
  \ books=[{\"title\": \"P\", \"pages\": 30}]))[\"books\"][0][\"unit_min\"] - 2) <\
  \ 1e-9)\n    for bad in [dict(base, books=[]), dict(base, books=[{\"title\": \"\
  x\"}]), dict(base, minutes={\"funday\": 3}, books=[{\"title\": \"a\", \"pages\"\
  : 3}]),\n                dict(base, books=[{\"title\": \"a\", \"pages\": 3, \"deadline\"\
  : \"2026-13-01\"}])]:\n        try:\n            run(bad); okk = False\n       \
  \ except InputError:\n            okk = True\n        t(\"bad input rejected: %s\"\
  \ % (list(bad.get(\"minutes\", {})) if isinstance(bad.get(\"minutes\"), dict) else\
  \ (bad[\"books\"][0] if bad[\"books\"] else \"no books\")), okk)\n    r, m = run(dict(base,\
  \ books=[{\"title\": \"Old\", \"pages\": 30, \"deadline\": \"2026-10-01\"}]))\n\
  \    t(\"passed deadline -> RP05, planned without deadline\", any(f[1] == \"RP05\"\
  \ for f in r[\"findings\"]) and r[\"books\"][0][\"finish\"])\n    rep = report(*run(dict(base,\
  \ books=two)), \"even\")\n    t(\"report has verdict, day table and catch-up advice\"\
  , \"Verdict\" in rep and \"| Date |\" in rep and \"If you fall behind\" in rep)\n\
  \    for name, okk in tests:\n        print((\"PASS  \" if okk else \"FAIL  \")\
  \ + name)\n    n = sum(1 for _, okk in tests if okk)\n    print(\"%d/%d passed\"\
  \ % (n, len(tests)))\n    return 0 if n == len(tests) else 1\n\n\ndef main(argv=None):\n\
  \    ap = argparse.ArgumentParser(description=__doc__.split(\"\\n\")[0])\n    ap.add_argument(\"\
  plan\", nargs=\"?\")\n    ap.add_argument(\"--mode\", choices=[\"even\", \"asap\"\
  ], default=\"even\")\n    ap.add_argument(\"--from\", dest=\"start\", help=\"re-plan\
  \ from this date (YYYY-MM-DD)\")\n    ap.add_argument(\"--at\", action=\"append\"\
  , default=[], help='\"Title=page\" (or \"Title=minute\" for audiobooks): where you\
  \ are now')\n    ap.add_argument(\"--json\", action=\"store_true\")\n    ap.add_argument(\"\
  --self-test\", action=\"store_true\")\n    a = ap.parse_args(argv)\n    if a.self_test:\n\
  \        return self_test()\n    if not a.plan:\n        ap.error(\"plan JSON required\
  \ (or --self-test)\")\n    try:\n        try:\n            cfg = json.load(open(a.plan,\
  \ encoding=\"utf-8\"))\n        except (OSError, ValueError) as e:\n           \
  \ raise InputError(str(e))\n        at = {}\n        for s in a.at:\n          \
  \  if \"=\" not in s:\n                raise InputError(\"--at needs Title=page,\
  \ got %r\" % s)\n            k, v = s.rsplit(\"=\", 1)\n            try:\n     \
  \           at[k.strip()] = float(v)\n            except ValueError:\n         \
  \       raise InputError(\"--at page must be a number, got %r\" % v)\n        titles\
  \ = {b.get(\"title\") for b in cfg.get(\"books\", [])} if isinstance(cfg, dict)\
  \ else set()\n        for k in at:\n            if k not in titles:\n          \
  \      raise InputError(\"--at: no book titled %r\" % k)\n        m = load(cfg,\
  \ a.start, at)\n        r = plan(m, a.mode)\n    except (InputError, KeyError, TypeError,\
  \ ValueError) as e:\n        print(\"error: %s\" % e, file=sys.stderr)\n       \
  \ return 2\n    if a.json:\n        out = {\"books\": [{\"title\": b[\"title\"],\
  \ \"deadline\": str(b[\"deadline\"]) if b[\"deadline\"] else None, \"finish\": str(b.get(\"\
  finish\")) if b.get(\"finish\") else None,\n                          \"minutes_needed\"\
  : round(b[\"need\"])} for b in r[\"all_books\"]],\n               \"days\": [{\"\
  date\": str(x[\"date\"]), \"minutes\": round(x[\"planned\"]), \"read\": [fmt_item(it)\
  \ for it in x[\"items\"]]} for x in r[\"days\"]],\n               \"findings\":\
  \ [{\"severity\": s, \"code\": c, \"message\": msg} for s, c, msg in r[\"findings\"\
  ]]}\n        print(json.dumps(out, indent=2))\n    else:\n        print(report(r,\
  \ m, a.mode))\n    return 1 if any(f[0] == \"high\" for f in r[\"findings\"]) else\
  \ 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())"
