  -----END CERTIFICATE-----\n\n\x1FFILE:scripts/check_certs.py\x1E\n#!/usr/bin/env\
  \ python3\n\"\"\"TLS certificate expiry and inventory checker (Python 3.8+ standard\
  \ library only).\n\nReads a JSON inventory of certificates (and optional PEM files\
  \ referenced by \"pem_path\")\nand reports TC01-TC14 findings: expiry, stuck renewals,\
  \ hostname coverage, weak keys,\nweak signatures, long lifetimes, broken chains,\
  \ self-signed public certs, ownership,\nshared wildcards and renewal clusters.\n\
  \nUsage:\n  python3 scripts/check_certs.py examples/inventory.json --today 2026-11-11\n\
  \  python3 scripts/check_certs.py inventory.json --json\n  python3 scripts/check_certs.py\
  \ --self-test\nExit codes: 0 = no high findings, 1 = high findings, 2 = bad input.\n\
  \"\"\"\nimport argparse, datetime as dt, json, os, ssl, sys\n\nSEV_ORDER = {\"high\"\
  : 0, \"medium\": 1, \"low\": 2}\nWEAK_SIG = (\"sha1\", \"md5\")\nMIN_BITS = {\"\
  rsa\": 2048, \"dsa\": 2048, \"ec\": 256, \"ecdsa\": 256, \"ed25519\": 0}\n\n\ndef\
  \ parse_date(s):\n    \"\"\"Accept YYYY-MM-DD, ISO timestamps, or OpenSSL style\
  \ 'Nov 11 10:00:00 2026 GMT'.\"\"\"\n    if not s:\n        return None\n    s =\
  \ str(s).strip()\n    for fmt in (\"%Y-%m-%d\", \"%Y-%m-%dT%H:%M:%SZ\", \"%Y-%m-%dT%H:%M:%S\"\
  , \"%b %d %H:%M:%S %Y %Z\"):\n        try:\n            return dt.datetime.strptime(s,\
  \ fmt).date()\n        except ValueError:\n            pass\n    try:\n        return\
  \ dt.datetime.utcfromtimestamp(ssl.cert_time_to_seconds(s)).date()\n    except (ValueError,\
  \ TypeError):\n        raise ValueError(\"unparseable date: %r\" % s)\n\n\ndef decode_pem(path):\n\
  \    \"\"\"Decode a PEM certificate with the stdlib test decoder; returns a partial\
  \ cert dict.\"\"\"\n    info = ssl._ssl._test_decode_cert(path)  # stdlib, no third-party\
  \ crypto needed\n    subject = {k: v for rdn in info.get(\"subject\", ()) for k,\
  \ v in rdn}\n    issuer = {k: v for rdn in info.get(\"issuer\", ()) for k, v in\
  \ rdn}\n    sans = [v for k, v in info.get(\"subjectAltName\", ()) if k == \"DNS\"\
  ]\n    return {\n        \"subject_cn\": subject.get(\"commonName\", \"\"),\n  \
  \      \"issuer\": issuer.get(\"organizationName\") or issuer.get(\"commonName\"\
  , \"\"),\n        \"issuer_cn\": issuer.get(\"commonName\", \"\"),\n        \"not_before\"\
  : info.get(\"notBefore\"),\n        \"not_after\": info.get(\"notAfter\"),\n   \
  \     \"sans\": sans,\n        \"serial\": info.get(\"serialNumber\", \"\"),\n \
  \   }\n\n\ndef host_covered(host, sans):\n    host = host.lower().rstrip(\".\")\n\
  \    for san in sans:\n        san = san.lower().rstrip(\".\")\n        if san ==\
  \ host:\n            return True\n        if san.startswith(\"*.\"):\n         \
  \   base = san[2:]\n            # a wildcard matches exactly one label: *.example.com\
  \ covers a.example.com, not a.b.example.com or example.com\n            if host.endswith(\"\
  .\" + base) and host.count(\".\") == base.count(\".\") + 1:\n                return\
  \ True\n    return False\n\n\ndef load(path, base_dir):\n    with open(path, encoding=\"\
  utf-8\") as f:\n        data = json.load(f)\n    certs = data[\"certificates\"]\
  \ if isinstance(data, dict) else data\n    if not isinstance(certs, list) or not\
  \ certs:\n        raise ValueError(\"inventory must contain a non-empty 'certificates'\
  \ list\")\n    out = []\n    for i, c in enumerate(certs):\n        c = dict(c)\n\
  \        c.setdefault(\"name\", \"cert-%d\" % (i + 1))\n        if c.get(\"pem_path\"\
  ):\n            p = c[\"pem_path\"]\n            if not os.path.isabs(p):\n    \
  \            p = os.path.join(base_dir, p)\n            pem = decode_pem(p)\n  \
  \          for k, v in pem.items():\n                if not c.get(k):\n        \
  \            c[k] = v\n            c[\"_from_pem\"] = True\n        out.append(c)\n\
  \    return out\n\n\ndef check(certs, today, warn_days=30, crit_days=14):\n    findings\
  \ = []\n\n    def add(code, sev, cert, msg, fix):\n        findings.append({\"code\"\
  : code, \"severity\": sev, \"cert\": cert[\"name\"], \"message\": msg, \"fix\":\
  \ fix})\n\n    expiry_dates = []\n    wildcard_envs = {}\n    for c in certs:\n\
  \        na, nb = parse_date(c.get(\"not_after\")), parse_date(c.get(\"not_before\"\
  ))\n        if na is None:\n            add(\"TC00\", \"high\", c, \"no not_after\
  \ date\", \"Add not_after or a pem_path so expiry can be checked.\")\n         \
  \   continue\n        left = (na - today).days\n        c[\"_days_left\"] = left\n\
  \        expiry_dates.append((na, c[\"name\"]))\n        auto = bool(c.get(\"auto_renew\"\
  ))\n        public = c.get(\"public\", True)\n        if left < 0:\n           \
  \ add(\"TC01\", \"high\", c, \"expired %d days ago (%s)\" % (-left, na), \"Renew\
  \ and deploy now; check every host in 'hosts'.\")\n        elif left <= crit_days:\n\
  \            add(\"TC02\", \"high\", c, \"expires in %d days (%s)\" % (left, na),\
  \ \"Renew this week; confirm the new cert is actually served.\")\n        elif left\
  \ <= warn_days and not auto:\n            add(\"TC03\", \"medium\", c, \"expires\
  \ in %d days with manual renewal\" % left, \"Schedule the renewal with an owner\
  \ and a date.\")\n        if auto and 0 <= left <= 20:\n            add(\"TC04\"\
  , \"medium\", c, \"auto_renew is on but only %d days left - renewal looks stuck\"\
  \ % left,\n                \"Check the renewal job logs (ACME clients renew around\
  \ 30 days left); fix DNS/HTTP challenge or permissions.\")\n        if nb and nb\
  \ > today:\n            add(\"TC14\", \"high\", c, \"not_before %s is in the future\"\
  \ % nb, \"Check server clock or wait; clients will reject it now.\")\n        sans\
  \ = c.get(\"sans\") or []\n        for h in c.get(\"hosts\") or []:\n          \
  \  if not host_covered(h, sans):\n                add(\"TC05\", \"high\", c, \"\
  host %s is not covered by SANs %s\" % (h, sans), \"Reissue with the host in subjectAltName\
  \ (CN alone is ignored by browsers).\")\n        kt = str(c.get(\"key_type\", \"\
  \")).lower()\n        bits = c.get(\"key_bits\")\n        if kt in MIN_BITS and\
  \ bits is not None and int(bits) < MIN_BITS[kt]:\n            add(\"TC06\", \"high\"\
  , c, \"%s key of %s bits is too small (min %d)\" % (kt.upper(), bits, MIN_BITS[kt]),\
  \ \"Reissue with RSA 2048+/3072 or ECDSA P-256.\")\n        sig = str(c.get(\"sig_alg\"\
  , \"\")).lower()\n        if any(w in sig for w in WEAK_SIG):\n            add(\"\
  TC07\", \"high\", c, \"weak signature algorithm %s\" % c.get(\"sig_alg\"), \"Reissue\
  \ with a SHA-256 based signature.\")\n        if nb and na and public and (na -\
  \ nb).days > 398:\n            add(\"TC08\", \"medium\", c, \"lifetime %d days exceeds\
  \ 398 days for a publicly trusted cert\" % (na - nb).days,\n                \"Publicly\
  \ trusted certs must be <=398 days and are getting shorter; automate renewal.\"\
  )\n        if c.get(\"chain_complete\") is False:\n            add(\"TC09\", \"\
  high\", c, \"served chain is incomplete (missing intermediate)\", \"Serve the full\
  \ chain (leaf + intermediates); test with a fresh client.\")\n        self_signed\
  \ = c.get(\"self_signed\")\n        if self_signed is None and c.get(\"subject_cn\"\
  ) and c.get(\"issuer_cn\"):\n            self_signed = c[\"subject_cn\"] == c[\"\
  issuer_cn\"]\n        if self_signed and public:\n            add(\"TC10\", \"high\"\
  , c, \"self-signed certificate on a public endpoint\", \"Use a publicly trusted\
  \ CA cert, or mark public=false if internal-only.\")\n        if not c.get(\"owner\"\
  ):\n            add(\"TC11\", \"medium\", c, \"no owner recorded\", \"Name a team\
  \ or person who gets the expiry alert.\")\n        if any(str(s).startswith(\"*.\"\
  ) for s in sans):\n            for s in sans:\n                if str(s).startswith(\"\
  *.\"):\n                    wildcard_envs.setdefault(s, set()).add(str(c.get(\"\
  environment\", \"unknown\")))\n        if not auto and not c.get(\"renewal_runbook\"\
  ):\n            add(\"TC12\", \"low\", c, \"manual renewal without a runbook link\"\
  , \"Add a short renewal runbook (CSR, CA, deploy targets, test).\")\n    for wc,\
  \ envs in wildcard_envs.items():\n        if \"production\" in envs and len(envs)\
  \ > 1:\n            findings.append({\"code\": \"TC13\", \"severity\": \"medium\"\
  , \"cert\": wc,\n                             \"message\": \"wildcard %s is used\
  \ in production and %s\" % (wc, \", \".join(sorted(envs - {\"production\"}))),\n\
  \                             \"fix\": \"Use separate certs per environment to shrink\
  \ the blast radius of a leaked key.\"})\n    expiry_dates.sort()\n    for i in range(len(expiry_dates)):\n\
  \        window = [n for d, n in expiry_dates if 0 <= (d - expiry_dates[i][0]).days\
  \ <= 7 and d >= today]\n        if len(window) >= 3:\n            findings.append({\"\
  code\": \"TC15\", \"severity\": \"low\", \"cert\": \", \".join(window),\n      \
  \                       \"message\": \"%d certs expire within the same 7-day window\"\
  \ % len(window),\n                             \"fix\": \"Stagger renewals so one\
  \ bad week cannot take down several services.\"})\n            break\n    findings.sort(key=lambda\
  \ f: (SEV_ORDER[f[\"severity\"]], f[\"code\"], f[\"cert\"]))\n    return findings\n\
  \n\ndef report(certs, findings, today):\n    lines = [\"TLS certificate check as\
  \ of %s - %d certificates\" % (today, len(certs)), \"\"]\n    lines.append(\"%-24s\
  \ %-12s %6s  %-10s %s\" % (\"NAME\", \"EXPIRES\", \"DAYS\", \"AUTO\", \"OWNER\"\
  ))\n    for c in sorted(certs, key=lambda c: c.get(\"_days_left\", -10**6)):\n \
  \       na = parse_date(c.get(\"not_after\"))\n        lines.append(\"%-24s %-12s\
  \ %6s  %-10s %s\" % (c[\"name\"][:24], na or \"?\", c.get(\"_days_left\", \"?\"\
  ),\n                                                  \"yes\" if c.get(\"auto_renew\"\
  ) else \"no\", c.get(\"owner\") or \"-\"))\n    counts = {s: sum(1 for f in findings\
  \ if f[\"severity\"] == s) for s in SEV_ORDER}\n    lines += [\"\", \"Findings:\
  \ %d high, %d medium, %d low\" % (counts[\"high\"], counts[\"medium\"], counts[\"\
  low\"]), \"\"]\n    for f in findings:\n        lines.append(\"[%s] %s %s: %s\"\
  \ % (f[\"severity\"].upper(), f[\"code\"], f[\"cert\"], f[\"message\"]))\n     \
  \   lines.append(\"    fix: %s\" % f[\"fix\"])\n    if not findings:\n        lines.append(\"\
  No findings.\")\n    return \"\\n\".join(lines)\n\n\ndef self_test():\n    today\
  \ = dt.date(2026, 11, 11)\n    base = {\"name\": \"ok\", \"hosts\": [\"a.example.com\"\
  ], \"sans\": [\"a.example.com\"], \"not_before\": \"2026-09-01\",\n            \"\
  not_after\": \"2027-01-20\", \"key_type\": \"ec\", \"key_bits\": 256, \"sig_alg\"\
  : \"ecdsa-with-SHA256\",\n            \"auto_renew\": True, \"owner\": \"web\",\
  \ \"chain_complete\": True, \"environment\": \"production\"}\n\n    def run(**kw):\n\
  \        c = dict(base); c.update(kw)\n        return {f[\"code\"] for f in check([c],\
  \ today)}\n\n    cases = [\n        (\"clean\", run(), set()),\n        (\"TC01\
  \ expired\", run(not_after=\"2026-11-01\") >= {\"TC01\"}, True),\n        (\"TC02\
  \ critical\", run(not_after=\"2026-11-20\") >= {\"TC02\"}, True),\n        (\"TC03\
  \ manual 30d\", run(not_after=\"2026-12-05\", auto_renew=False, renewal_runbook=\"\
  x\") >= {\"TC03\"}, True),\n        (\"TC04 stuck renewal\", \"TC04\" in run(not_after=\"\
  2026-11-28\"), True),\n        (\"TC05 SAN miss\", \"TC05\" in run(hosts=[\"b.example.com\"\
  ]), True),\n        (\"wildcard one label\", host_covered(\"a.example.com\", [\"\
  *.example.com\"]) and not host_covered(\"x.a.example.com\", [\"*.example.com\"])\
  \ and not host_covered(\"example.com\", [\"*.example.com\"]), True),\n        (\"\
  TC06 weak rsa\", \"TC06\" in run(key_type=\"rsa\", key_bits=1024), True),\n    \
  \    (\"TC07 sha1\", \"TC07\" in run(sig_alg=\"sha1WithRSAEncryption\"), True),\n\
  \        (\"TC08 long life\", \"TC08\" in run(not_before=\"2025-01-01\", not_after=\"\
  2027-01-01\"), True),\n        (\"TC08 private ok\", \"TC08\" in run(not_before=\"\
  2025-01-01\", not_after=\"2027-01-01\", public=False), False),\n        (\"TC09\
  \ chain\", \"TC09\" in run(chain_complete=False), True),\n        (\"TC10 self-signed\"\
  , \"TC10\" in run(self_signed=True), True),\n        (\"TC11 owner\", \"TC11\" in\
  \ run(owner=\"\"), True),\n        (\"TC14 future\", \"TC14\" in run(not_before=\"\
  2026-12-01\"), True),\n    ]\n    two = [dict(base, name=\"w1\", sans=[\"*.example.com\"\
  ], hosts=[\"a.example.com\"]),\n           dict(base, name=\"w2\", sans=[\"*.example.com\"\
  ], hosts=[\"a.example.com\"], environment=\"staging\")]\n    cases.append((\"TC13\
  \ shared wildcard\", any(f[\"code\"] == \"TC13\" for f in check(two, today)), True))\n\
  \    three = [dict(base, name=\"c%d\" % i, not_after=\"2027-01-0%d\" % (i + 1))\
  \ for i in range(3)]\n    cases.append((\"TC15 cluster\", any(f[\"code\"] == \"\
  TC15\" for f in check(three, today)), True))\n    cases.append((\"date formats\"\
  , parse_date(\"Nov 11 10:00:00 2026 GMT\") == dt.date(2026, 11, 11), True))\n  \
  \  ok = 0\n    for name, got, want in cases:\n        passed = got == want\n   \
  \     ok += passed\n        print(\"%s  %s\" % (\"PASS\" if passed else \"FAIL\"\
  , name))\n    print(\"%d/%d passed\" % (ok, len(cases)))\n    return 0 if ok ==\
  \ len(cases) else 1\n\n\ndef main(argv=None):\n    ap = argparse.ArgumentParser(description=__doc__.splitlines()[0])\n\
  \    ap.add_argument(\"inventory\", nargs=\"?\")\n    ap.add_argument(\"--today\"\
  , help=\"as-of date YYYY-MM-DD (default: today)\")\n    ap.add_argument(\"--warn-days\"\
  , type=int, default=30)\n    ap.add_argument(\"--crit-days\", type=int, default=14)\n\
  \    ap.add_argument(\"--json\", action=\"store_true\")\n    ap.add_argument(\"\
  --self-test\", action=\"store_true\")\n    a = ap.parse_args(argv)\n    if a.self_test:\n\
  \        return self_test()\n    if not a.inventory:\n        ap.print_usage();\
  \ return 2\n    try:\n        today = parse_date(a.today) if a.today else dt.date.today()\n\
  \        certs = load(a.inventory, os.path.dirname(os.path.abspath(a.inventory)))\n\
  \        findings = check(certs, today, a.warn_days, a.crit_days)\n    except (OSError,\
  \ ValueError, KeyError, json.JSONDecodeError, ssl.SSLError) as e:\n        print(\"\
  input error: %s\" % e, file=sys.stderr)\n        return 2\n    if a.json:\n    \
  \    clean = [{k: v for k, v in c.items() if not k.startswith(\"_\") or k == \"\
  _days_left\"} for c in certs]\n        print(json.dumps({\"today\": str(today),\
  \ \"certificates\": clean, \"findings\": findings}, indent=2, default=str))\n  \
  \  else:\n        print(report(certs, findings, today))\n    return 1 if any(f[\"\
  severity\"] == \"high\" for f in findings) else 0\n\n\nif __name__ == \"__main__\"\
  :\n    sys.exit(main())"
