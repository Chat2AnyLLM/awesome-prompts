title: Monarch Butterflies Clustered on Sunlit Fir Trees in a Mountain Forest (Image-to-Video
  Animation)
description: Imported from Prompts Chat
prompt: 'Use the attached still (step 1: a photorealistic wide photograph of thousands
  of monarch butterflies clustered on fir branches in a high mountain forest, a heavy
  cluster on a big branch in the right foreground, more clusters on hazy firs behind,
  low sunbeams from the upper left and a few dozen butterflies already flying in the
  light) as the exact first frame and animate it into an 8-second, 16:9 cinematic
  shot. Keep every element as it is in the still: the shape of the trees and branches,
  the position of the clusters, the sunbeams and the haze.


  Motion (0-8 s):

  - 0-3 s: as the sun warms the cluster in the right foreground, many butterflies
  slowly open and close their wings, showing flashes of bright orange; the flying
  butterflies in the sunbeams flutter and drift lazily.

  - 3-6 s: small groups lift off the near branch one after another and flutter up
  into the light, joining the others; the branch rises very slightly as the weight
  leaves it.

  - 6-8 s: dozens of monarchs float through the sunbeams in soft, natural, irregular
  flight paths, some crossing close to the camera slightly out of focus; the clusters
  on the far trees shimmer as wings open.


  Camera: very slow, smooth push-in toward the sunlit gap (about 3 percent), no cuts,
  no fast moves; the tree trunks stay solid and still.


  Ambient motion: faint drifting haze in the sunbeams, tiny specks of dust glinting,
  fir needles barely moving.


  Lighting and mood: early winter sunlight, warm orange wings against cool blue-green
  shadows; calm, magical and quiet.


  Sound: off (silent clip).


  Avoid: people, birds, butterflies merging or changing species, extra wings or legs,
  wings flapping too fast like insects in a time-lapse, trees bending or melting,
  sudden light changes, text.'
