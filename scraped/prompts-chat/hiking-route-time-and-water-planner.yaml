prompt: "---\nname: hiking-route-time-and-water-planner\ndescription: Plans a day\
  \ hike leg by leg. Estimates time with Naismith's rule and Langmuir's descent corrections,\
  \ adjusted for terrain, fitness, pack weight and breaks, gives clock times for each\
  \ leg, checks the finish against sunset and the latest safe start, and works out\
  \ water to carry between refills and snacks to pack. Flags after-dark finishes,\
  \ long dry stretches and hard terrain late in the day. Includes a stdlib Python\
  \ planner with --self-test.\n---\n\n# Hiking Route Time and Water Planner\n\nYou\
  \ help hikers turn a route into a realistic timetable: when they will reach each\
  \ point, whether they finish in daylight, and how much water and food to carry.\
  \ You show the rule behind each number, prefer conservative estimates, and always\
  \ leave room for a slower day. You are not a substitute for local knowledge, a map\
  \ or a weather forecast, and you say so when it matters.\n\n## Files in this skill\n\
  \n- `scripts/hike_plan.py` - reads a legs CSV and prints a timetable, daylight check,\
  \ water per stretch, food and findings (Python 3 standard library only)\n- `references/time-rules.md`\
  \ - Naismith's rule, Langmuir's corrections, terrain/fitness/pack factors, breaks\
  \ and how to calibrate them\n- `references/water-food-and-safety.md` - drinking\
  \ rates, refill planning and water treatment, snacks, daylight margins, turnaround\
  \ times and the safety checklist\n- `templates/hike-plan.md` - the plan to share\
  \ with the group and leave with a contact at home\n- `examples/eagle-ridge-loop.csv`\
  \ - a 22 km late-October loop with a scramble section and one refill point\n\n##\
  \ Workflow\n\n### 1. Split the route into legs\nAsk for the route (map app or guidebook),\
  \ the date, and the group: pace, fitness, youngest or slowest member, pack weight.\
  \ Split the route at summits, passes, huts, junctions and water sources; for each\
  \ leg get the distance, ascent and descent (from the app's elevation profile) and\
  \ the terrain type (road, path, rough, scramble, snow, bushwhack). Mark where water\
  \ can be refilled. Get the sunset time for the date and place, and the forecast\
  \ temperature.\n\n### 2. Run the planner\n```\npython3 scripts/hike_plan.py examples/eagle-ridge-loop.csv\
  \ --start 09:30 --sunset 17:20 --temp 24 --fitness 1.1 --pack-kg 9\npython3 scripts/hike_plan.py\
  \ my-route.csv --start 07:00 --sunset 20:45 --temp 31 --break-min 15 --json\npython3\
  \ scripts/hike_plan.py --self-test\n```\nExit code 1 means a HIGH finding (finish\
  \ after sunset), 2 means bad input.\n\n### 3. Adjust the plan\nFor AFTER_DARK or\
  \ SMALL_MARGIN: start earlier (the script prints the latest sensible start), shorten\
  \ the route, or pick a bail-out point and a turnaround time. For LONG_DRY_STRETCH:\
  \ add a refill, carry more capacity, or move the long climb to the cool morning.\
  \ For HARD_TERRAIN_LATE: reverse the loop so the scramble comes first. Explain the\
  \ formulas from `references/time-rules.md` when asked, and suggest calibrating the\
  \ fitness factor after the first leg.\n\n### 4. Deliver\nFill `templates/hike-plan.md`:\
  \ timetable with clock times, turnaround time, water and food list, bail-out options\
  \ and the emergency details to leave with someone at home.\n\n## Example result\n\
  For `examples/eagle-ridge-loop.csv` (22.2 km, +1170 m / -1150 m) starting 09:30\
  \ at fitness 1.1 and 24 C: 7h08 moving, 8h19 with breaks, finish about 17:49, which\
  \ is 29 minutes after the 17:20 sunset (HIGH AFTER_DARK; latest sensible start 08:01).\
  \ The first four legs have no water, so 4.4 L must be carried (MEDIUM LONG_DRY_STRETCH).\
  \ Starting at 08:00 finishes at 16:19 with 61 minutes to spare; the water stretch\
  \ remains, so the plan adds a 2 L bladder or a cached bottle at Pine Saddle.\n\n\
  ## Rules\n\n- Estimates are a starting point: tell the group to compare the real\
  \ time on the first leg with the plan and rescale.\n- Keep at least 60 minutes of\
  \ daylight in hand, and a headlamp in every pack all year.\n- Never suggest drinking\
  \ untreated water; recommend filtering or treating any natural source.\n- Weather,\
  \ snow, river crossings and route conditions override any timetable: tell users\
  \ to check the forecast and local reports, and to turn back when conditions change.\n\
  - Do not give medical advice beyond basic hydration and food guidance; point to\
  \ first-aid training and local rescue numbers.\n\x1FFILE:references/time-rules.md\x1E\
  \n# Time Rules\n\n## Naismith's rule (1892)\nAllow 1 hour for every 5 km on the\
  \ flat plus 1 hour for every 600 m of ascent (the original was 3 miles per hour\
  \ plus 1 hour per 2000 ft).\n```\nmoving minutes = distance_km / pace_kmh * 60 +\
  \ ascent_m / 10\n```\nExample: 4.2 km with 380 m of ascent = 50.4 + 38 = 88 minutes\
  \ before adjustments.\n\n## Langmuir's corrections for descent\nNaismith treats\
  \ descent like the flat. Langmuir refined it:\n- gentle descent, 5 to 12 degrees\
  \ (about 9 to 21 %): subtract 10 minutes per 300 m of descent\n- steep descent,\
  \ more than 12 degrees: add 10 minutes per 300 m of descent\n- under 5 degrees:\
  \ no change\nThe script estimates the descent angle from the descent and the share\
  \ of the leg's distance spent going down. It never lets a leg drop below half its\
  \ flat time.\n\n## Multipliers used by the script\n| Factor | Value | When |\n|---|---|---|\n\
  | Terrain road | 0.9 | Paved or forest road |\n| Terrain path | 1.0 | Good footpath\
  \ |\n| Terrain rough | 1.25 | Rocky, rooty, loose or boggy path |\n| Terrain scramble\
  \ | 1.6 | Hands needed, exposed steps |\n| Terrain snow | 1.5 | Soft or old snow\
  \ without crampon work |\n| Terrain bushwhack | 1.6 | No path, vegetation |\n| Fitness\
  \ | 0.85 / 1.0 / 1.2 / 1.4 | Fast and fit / average / relaxed or mixed group / young\
  \ children |\n| Pack | +2 % per kg above 10 kg | Overnight or heavy loads |\n| Breaks\
  \ | 10 min per hour (default) | Use 15 to 20 for photo walks, families, big groups\
  \ |\n\nTerrain multiplies the whole leg, including the climbing time.\n\n## Calibrating\n\
  After the first leg, divide the real time by the planned time. If the group took\
  \ 1h50 for a planned 1h37, the factor is 1.13: rerun with `--fitness` multiplied\
  \ by that and check the finish again. Groups move at the pace of the slowest person;\
  \ plan for them.\n\n## Other rules you may meet\n- Tranter's corrections: a fitness\
  \ and fatigue table on top of Naismith, used for long mountain days.\n- Tobler's\
  \ hiking function: speed = 6 * exp(-3.5 * |slope + 0.05|) km/h, used in GIS tools;\
  \ it gives similar totals on mixed routes.\n\n## Turnaround time\nFor an out-and-back\
  \ or a route with a bail-out, set a fixed turnaround time: the latest time you can\
  \ leave the farthest point and still be back with an hour of daylight. Example:\
  \ sunset 17:20, keep 60 minutes, the return takes 3h10 -> turn around by 13:10 wherever\
  \ you are.\n\x1FFILE:references/water-food-and-safety.md\x1E\n# Water, Food and\
  \ Safety\n\n## Drinking rates used by the script\n| Temperature | Litres per hour\
  \ (total time) |\n|---|---|\n| under 15 C | 0.4 |\n| 15 to 24 C | 0.5 |\n| 25 to\
  \ 29 C | 0.75 |\n| 30 C and above | 1.0 |\nPlus 0.1 L per 100 m of ascent, because\
  \ climbing makes you sweat more. Needs vary a lot between people; heavy sweaters,\
  \ children and people at altitude may need more. Drink a little often rather than\
  \ a lot at once, and add electrolytes (salt tablets, drink mix or salty snacks)\
  \ on hot days or when drinking more than about 3 L.\n\n## Carry planning\n- The\
  \ start and every leg marked `water_at_end = yes` are refill points.\n- Carry =\
  \ largest amount needed between two refill points plus a 0.5 L reserve.\n- More\
  \ than 3 L (3 kg) is heavy; options are caching water, choosing a route past a hut\
  \ or spring, or moving the hottest climb to early morning.\n- Confirm that springs\
  \ and huts actually have water at that time of year (many huts close in late autumn;\
  \ springs dry up in late summer).\n\n## Treating water\nTreat all natural water:\
  \ a hollow-fibre filter (bacteria and protozoa), chlorine dioxide tablets (also\
  \ viruses, wait the full contact time, often 30 minutes, up to 4 hours for Cryptosporidium),\
  \ UV pens for clear water, or boiling for 1 minute (3 minutes above 2000 m). Filter\
  \ cloudy water through a cloth first.\n\n## Food\nAbout 200 to 300 kcal per hour\
  \ on the move keeps energy steady on a long day: nuts, bars, dried fruit, cheese,\
  \ sandwiches. The script uses 250 kcal per hour of total time. Pack one extra snack\
  \ per person as an emergency reserve.\n\n## Daylight\n- Get sunset for the exact\
  \ place and date (weather or astronomy apps). In mountains the sun leaves valleys\
  \ and east-facing slopes earlier than the official time.\n- Civil twilight gives\
  \ about 20 to 40 minutes of usable light after sunset in mid-latitudes, less in\
  \ the tropics. Do not plan to use it.\n- Keep 60 minutes of daylight in hand (the\
  \ default `--margin`). Every pack gets a headlamp with charged batteries.\n\n##\
  \ Safety checklist\n- Forecast checked the evening before and the morning of the\
  \ hike (thunderstorms, wind on ridges, freezing level).\n- Route plan, start time,\
  \ turnaround time and expected return left with someone at home, with who to call\
  \ and when.\n- Map offline on the phone, plus a power bank; paper map and compass\
  \ on remote routes.\n- Layers and a waterproof jacket, hat and gloves above the\
  \ tree line even in summer, sun protection.\n- Small first-aid kit, blister plasters,\
  \ emergency blanket, whistle.\n- Know the local emergency number (112 in Europe,\
  \ 911 in North America) and the mountain rescue procedure.\n- Rule: the group stays\
  \ together and turns back at the turnaround time, at the first lightning, or when\
  \ anyone is not feeling well.\n\x1FFILE:templates/hike-plan.md\x1E\n# Hike plan:\
  \ <route name>, <date>\n\n**Group:** <names / number of people>   **Leader:** <name,\
  \ phone>\n**Route:** <22.2 km loop, +1170 m / -1150 m, map link>\n**Start:** <08:00\
  \ at Eagle Ridge car park>   **Expected finish:** <16:19>   **Sunset:** <17:20>\n\
  **Turnaround time:** <13:00 at the summit, whatever happens>\n**Latest call-out\
  \ time for the home contact:** <19:00>\n\n## Timetable\n| Leg | km | Up / down m\
  \ | Terrain | Planned start | Planned end | Water refill |\n|---|---|---|---|---|---|---|\n\
  | <Car park to Pine Saddle> | <4.2> | <+380 / -20> | <path> | <08:00> | <09:53>\
  \ | <no> |\n\nSettings used: <pace 5 km/h, fitness 1.1, breaks 10 min/h, 24 C>.\
  \ Check the first leg and rescale.\n\n## Water and food\n- Carry from the start:\
  \ <4.4 L per person> (no refill until <Spring Hut>)\n- Refill at: <Spring Hut tap\
  \ (open until end of October?), treat stream water>\n- Snacks: <2100 kcal per person>\
  \ + one spare\n- Electrolytes: <yes / no>\n\n## Bail-out options\n- <After Pine\
  \ Saddle: forest road back to the car park, 3.5 km, 1h>\n- <Skip the ridge traverse:\
  \ descend the north path from the summit>\n\n## Kit\n- <headlamp, layers, waterproof,\
  \ map offline + power bank, first aid, whistle, filter or tablets>\n\n## Weather\
  \ and conditions\n- Forecast: <checked on ... : dry, 24 C, wind 20 km/h on ridge>\n\
  - Notes: <scramble section is wet after rain; avoid if wet>\n\n## Emergency\n- Emergency\
  \ number: <112>   Mountain rescue: <...>\n- Home contact: <name, phone>: if no message\
  \ by <19:00>, call <number> with this plan.\n\x1FFILE:examples/eagle-ridge-loop.csv\x1E\
  \nleg,distance_km,ascent_m,descent_m,terrain,water_at_end\nCar park to Pine Saddle,4.2,380,20,path,no\n\
  Pine Saddle to Eagle Ridge summit,3.1,520,40,rough,no\nEagle Ridge traverse,1.6,120,150,scramble,no\n\
  Ridge down to Spring Hut,3.8,30,560,path,yes\nSpring Hut to Blue Lake,4.5,80,210,path,no\n\
  Blue Lake back to car park,5.0,40,170,road,yes\n\x1FFILE:scripts/hike_plan.py\x1E\
  \n#!/usr/bin/env python3\n\"\"\"Hiking route time and water planner (Python 3 standard\
  \ library only).\n\nReads a CSV of route legs and estimates moving time per leg\
  \ with Naismith's rule\n(5 km/h plus 1 hour per 600 m of ascent) and Langmuir's\
  \ descent corrections,\nadjusted for terrain, fitness and pack weight, then adds\
  \ breaks, gives clock\ntimes for every leg, checks the finish against sunset, and\
  \ works out how much\nwater to carry between refill points and how much food to\
  \ pack.\n\nCSV columns (header required; ; or , separated):\n  leg, distance_km,\
  \ ascent_m, descent_m, terrain, water_at_end\nterrain: road | path | rough | scramble\
  \ | snow | bushwhack   water_at_end: yes/no\n\nUsage:\n  python3 hike_plan.py route.csv\
  \ --start 08:30 --sunset 17:10 --temp 24\n  python3 hike_plan.py route.csv --start\
  \ 07:00 --fitness 1.2 --pack-kg 14 --json\n  python3 hike_plan.py --self-test\n\
  Exit codes: 0 = plan fine, 1 = HIGH findings (finish after sunset), 2 = bad input.\n\
  \"\"\"\nimport argparse, csv, io, json, math, sys\n\nTERRAIN = {\"road\": 0.9, \"\
  path\": 1.0, \"trail\": 1.0, \"rough\": 1.25, \"scramble\": 1.6, \"snow\": 1.5,\
  \ \"bushwhack\": 1.6}\nREQUIRED = [\"leg\", \"distance_km\", \"ascent_m\", \"descent_m\"\
  , \"terrain\", \"water_at_end\"]\nSEV = {\"HIGH\": 0, \"MEDIUM\": 1, \"LOW\": 2}\n\
  \n\nclass InputError(Exception):\n    pass\n\n\ndef num(v, field, row):\n    try:\n\
  \        x = float(str(v).strip().replace(\",\", \".\"))\n    except ValueError:\n\
  \        raise InputError(f\"row {row}: {field} '{v}' is not a number\")\n    if\
  \ x < 0:\n        raise InputError(f\"row {row}: {field} cannot be negative\")\n\
  \    return x\n\n\ndef hm(s):\n    try:\n        h, m = s.strip().split(\":\")\n\
  \        h, m = int(h), int(m)\n        assert 0 <= h < 24 and 0 <= m < 60\n   \
  \     return h * 60 + m\n    except Exception:\n        raise InputError(f\"time\
  \ '{s}' must be HH:MM\")\n\n\ndef clock(mins):\n    mins = int(round(mins))\n  \
  \  day, rem = divmod(mins, 1440)\n    return f\"{rem // 60:02d}:{rem % 60:02d}\"\
  \ + (f\" (+{day}d)\" if day else \"\")\n\n\ndef dur(mins):\n    mins = int(round(mins))\n\
  \    return f\"{mins // 60}h{mins % 60:02d}\"\n\n\ndef read_legs(text):\n    sample\
  \ = text[:2000]\n    delim = \";\" if sample.count(\";\") > sample.count(\",\")\
  \ else \",\"\n    rd = csv.DictReader(io.StringIO(text), delimiter=delim)\n    if\
  \ not rd.fieldnames:\n        raise InputError(\"empty CSV\")\n    fields = [f.strip().lower()\
  \ for f in rd.fieldnames]\n    missing = [c for c in REQUIRED if c not in fields]\n\
  \    if missing:\n        raise InputError(\"missing columns: \" + \", \".join(missing))\n\
  \    legs = []\n    for i, raw in enumerate(rd, start=2):\n        r = {k.strip().lower():\
  \ (v or \"\").strip() for k, v in raw.items() if k}\n        if not any(r.values()):\n\
  \            continue\n        t = r[\"terrain\"].lower() or \"path\"\n        if\
  \ t not in TERRAIN:\n            raise InputError(f\"row {i}: terrain '{t}' must\
  \ be one of {', '.join(TERRAIN)}\")\n        w = r[\"water_at_end\"].lower()\n \
  \       if w not in (\"yes\", \"no\", \"y\", \"n\", \"1\", \"0\", \"true\", \"false\"\
  , \"\"):\n            raise InputError(f\"row {i}: water_at_end must be yes or no\"\
  )\n        legs.append({\"leg\": r[\"leg\"] or f\"Leg {len(legs) + 1}\",\n     \
  \                \"distance_km\": num(r[\"distance_km\"], \"distance_km\", i),\n\
  \                     \"ascent_m\": num(r[\"ascent_m\"], \"ascent_m\", i),\n   \
  \                  \"descent_m\": num(r[\"descent_m\"], \"descent_m\", i),\n   \
  \                  \"terrain\": t, \"water_at_end\": w in (\"yes\", \"y\", \"1\"\
  , \"true\")})\n    if not legs:\n        raise InputError(\"no legs in CSV\")\n\
  \    return legs\n\n\ndef water_rate(temp_c):\n    \"\"\"Litres per hour of total\
  \ time, before the ascent extra.\"\"\"\n    if temp_c < 15:\n        return 0.4\n\
  \    if temp_c < 25:\n        return 0.5\n    if temp_c < 30:\n        return 0.75\n\
  \    return 1.0\n\n\ndef leg_minutes(leg, pace_kmh):\n    d, up, down = leg[\"distance_km\"\
  ], leg[\"ascent_m\"], leg[\"descent_m\"]\n    flat = d / pace_kmh * 60\n    climb\
  \ = up / 10.0  # Naismith: 60 min per 600 m\n    descent_adj = 0.0\n    steep =\
  \ False\n    if down > 0 and d > 0:\n        horiz = d * 1000 * (down / (up + down))\
  \  # share of the leg spent descending\n        angle = math.degrees(math.atan(down\
  \ / horiz)) if horiz > 0 else 90\n        if 5 <= angle <= 12:\n            descent_adj\
  \ = -down / 300 * 10   # Langmuir: gentle descent is faster\n        elif angle\
  \ > 12:\n            descent_adj = down / 300 * 10    # steep descent is slower\n\
  \        steep = angle > 14\n    if up > 0 and d > 0:\n        horiz_up = d * 1000\
  \ * (up / (up + down))\n        steep = steep or math.degrees(math.atan(up / horiz_up))\
  \ > 14  # about 25 %\n    return max(flat + climb + descent_adj, flat * 0.5), steep\n\
  \n\ndef plan(legs, start, sunset=None, pace=5.0, fitness=1.0, pack_kg=8.0, break_min=10.0,\
  \ temp=18.0, margin=60):\n    if pace <= 0 or fitness <= 0:\n        raise InputError(\"\
  pace and fitness must be positive\")\n    pack_factor = 1.0 + max(0.0, pack_kg -\
  \ 10) * 0.02  # +2 % per kg above 10 kg\n    rate = water_rate(temp)\n    t = start\n\
  \    rows, findings = [], []\n    stretch, stretches, stretch_legs = 0.0, [], []\n\
  \    for leg in legs:\n        base, steep = leg_minutes(leg, pace)\n        moving\
  \ = base * TERRAIN[leg[\"terrain\"]] * fitness * pack_factor\n        total = moving\
  \ * (1 + break_min / 60)\n        water = total / 60 * rate + leg[\"ascent_m\"]\
  \ / 100 * 0.1\n        t_start, t = t, t + total\n        rows.append({**leg, \"\
  moving_min\": round(moving), \"with_breaks_min\": round(total),\n              \
  \       \"start\": clock(t_start), \"end\": clock(t), \"end_min\": t, \"water_l\"\
  : round(water, 2), \"steep\": steep})\n        stretch += water\n        stretch_legs.append(leg[\"\
  leg\"])\n        if leg[\"water_at_end\"]:\n            stretches.append((stretch,\
  \ stretch_legs)); stretch, stretch_legs = 0.0, []\n        if steep:\n         \
  \   findings.append((\"LOW\", \"STEEP_LEG\", f\"{leg['leg']}: average gradient over\
  \ 25 %; expect slower going than the formula and take care on the descent\"))\n\
  \    if stretch_legs:\n        stretches.append((stretch, stretch_legs))\n    moving_total\
  \ = sum(r[\"moving_min\"] for r in rows)\n    total = t - start\n    carry = max(s\
  \ for s, _ in stretches) + 0.5\n    for s, names in stretches:\n        if s + 0.5\
  \ > 3.0:\n            findings.append((\"MEDIUM\", \"LONG_DRY_STRETCH\", f\"{' ->\
  \ '.join(names)}: {s + 0.5:.1f} L to carry with no refill; add a refill, cache water\
  \ or start earlier in the cool\"))\n    summary = {\n        \"distance_km\": round(sum(l[\"\
  distance_km\"] for l in legs), 1),\n        \"ascent_m\": round(sum(l[\"ascent_m\"\
  ] for l in legs)),\n        \"descent_m\": round(sum(l[\"descent_m\"] for l in legs)),\n\
  \        \"moving_min\": round(moving_total), \"total_min\": round(total),\n   \
  \     \"start\": clock(start), \"finish\": clock(t),\n        \"water_total_l\"\
  : round(sum(r[\"water_l\"] for r in rows), 1),\n        \"carry_max_l\": round(carry,\
  \ 1),\n        \"food_kcal\": int(round(total / 60 * 250, -1)),\n        \"water_rate_l_per_h\"\
  : rate, \"pack_factor\": round(pack_factor, 2),\n    }\n    if sunset is not None:\n\
  \        left = sunset - t\n        summary[\"sunset\"] = clock(sunset)\n      \
  \  summary[\"minutes_before_sunset\"] = round(left)\n        summary[\"latest_start\"\
  ] = clock(sunset - margin - total)\n        if left < 0:\n            findings.append((\"\
  HIGH\", \"AFTER_DARK\", f\"finish {clock(t)} is {dur(-left)} after sunset {clock(sunset)};\
  \ start by {summary['latest_start']}, shorten the route or plan a bail-out\"))\n\
  \        elif left < margin:\n            findings.append((\"MEDIUM\", \"SMALL_MARGIN\"\
  , f\"finish {clock(t)} leaves only {round(left)} min before sunset (target {margin});\
  \ start by {summary['latest_start']} and carry a headlamp\"))\n        for r in\
  \ rows:\n            if r[\"terrain\"] in (\"scramble\", \"snow\") and r[\"end_min\"\
  ] > sunset - 120:\n                findings.append((\"MEDIUM\", \"HARD_TERRAIN_LATE\"\
  , f\"{r['leg']} ({r['terrain']}) ends at {r['end']}, within 2 h of sunset; tired\
  \ legs and fading light on hard ground\"))\n    if moving_total > 8 * 60:\n    \
  \    findings.append((\"LOW\", \"LONG_DAY\", f\"{dur(moving_total)} moving time;\
  \ check that everyone has done a day this long recently\"))\n    if temp >= 28 and\
  \ any(l[\"ascent_m\"] >= 300 for l in legs):\n        findings.append((\"MEDIUM\"\
  , \"HEAT\", f\"{temp:g} C with big climbs: start at first light, rest in shade,\
  \ electrolytes with the water\"))\n    findings.sort(key=lambda f: SEV[f[0]])\n\
  \    for r in rows:\n        r.pop(\"end_min\")\n    return {\"legs\": rows, \"\
  summary\": summary, \"stretches\": [{\"legs\": n, \"litres\": round(s + 0.5, 1)}\
  \ for s, n in stretches],\n            \"findings\": [{\"severity\": a, \"code\"\
  : b, \"message\": c} for a, b, c in findings]}\n\n\ndef to_markdown(p, args):\n\
  \    s = p[\"summary\"]\n    out = [\"# Hike plan\", \"\",\n           f\"Settings:\
  \ pace {args.pace:g} km/h, fitness x{args.fitness:g}, pack {args.pack_kg:g} kg (x{s['pack_factor']}),\
  \ breaks {args.break_min:g} min per hour, {args.temp:g} C\",\n           \"\",\n\
  \           f\"Route: {s['distance_km']} km, +{s['ascent_m']} m / -{s['descent_m']}\
  \ m; moving {dur(s['moving_min'])}, with breaks {dur(s['total_min'])}\",\n     \
  \      f\"Start {s['start']}, finish about {s['finish']}\" + (f\"; sunset {s['sunset']},\
  \ \" + (f\"{s['minutes_before_sunset']} min to spare\" if s['minutes_before_sunset']\
  \ >= 0 else f\"{dur(-s['minutes_before_sunset'])} AFTER sunset\") + f\"; latest\
  \ sensible start {s['latest_start']}\" if \"sunset\" in s else \"\"),\n        \
  \   \"\", \"| Leg | km | Up m | Down m | Terrain | Moving | With breaks | Start\
  \ | End | Water L | Refill at end |\",\n           \"|---|---|---|---|---|---|---|---|---|---|---|\"\
  ]\n    for r in p[\"legs\"]:\n        out.append(f\"| {r['leg']} | {r['distance_km']:g}\
  \ | {r['ascent_m']:g} | {r['descent_m']:g} | {r['terrain']} | {dur(r['moving_min'])}\
  \ | \"\n                   f\"{dur(r['with_breaks_min'])} | {r['start']} | {r['end']}\
  \ | {r['water_l']:.1f} | {'yes' if r['water_at_end'] else 'no'} |\")\n    out +=\
  \ [\"\", \"## Water and food\",\n            f\"- Drinking rate {s['water_rate_l_per_h']}\
  \ L/h at this temperature plus 0.1 L per 100 m of climbing; total about {s['water_total_l']}\
  \ L\",\n            f\"- Carry at most {s['carry_max_l']} L (largest stretch between\
  \ refills, incl. 0.5 L reserve); treat stream water\"]\n    for st in p[\"stretches\"\
  ]:\n        out.append(f\"  - {' -> '.join(st['legs'])}: {st['litres']} L\")\n \
  \   out.append(f\"- Food: about {s['food_kcal']} kcal of snacks (about 250 kcal\
  \ per hour on the move), plus a spare\")\n    out += [\"\", \"## Findings\"]\n \
  \   out += [f\"- {f['severity']} {f['code']}: {f['message']}\" for f in p[\"findings\"\
  ]] or [\"- none\"]\n    out += [\"\", \"Estimates only: check them against your\
  \ group's real pace on the first leg and adjust.\"]\n    return \"\\n\".join(out)\n\
  \n\ndef self_test():\n    res = []\n\n    def check(name, cond):\n        res.append(cond)\n\
  \        print((\"PASS \" if cond else \"FAIL \") + name)\n\n    def L(d, up, down,\
  \ terrain=\"path\", water=\"no\", name=\"x\"):\n        return {\"leg\": name, \"\
  distance_km\": d, \"ascent_m\": up, \"descent_m\": down, \"terrain\": terrain, \"\
  water_at_end\": water == \"yes\"}\n\n    check(\"flat 10 km at 5 km/h = 120 min\"\
  , round(leg_minutes(L(10, 0, 0), 5)[0]) == 120)\n    check(\"Naismith 600 m climb\
  \ adds 60 min\", round(leg_minutes(L(5, 600, 0), 5)[0]) == 120)\n    g = leg_minutes(L(6,\
  \ 0, 900), 5)[0]  # angle ~8.5 deg: gentle\n    check(\"gentle descent is faster\
  \ (Langmuir)\", round(g) == 72 - 30)\n    st = leg_minutes(L(2, 0, 600), 5)  # ~16.7\
  \ deg: steep\n    check(\"steep descent is slower and flagged\", round(st[0]) ==\
  \ 24 + 20 and st[1])\n    check(\"steep ascent flagged\", leg_minutes(L(1, 400,\
  \ 0), 5)[1])\n    check(\"descent never below half the flat time\", leg_minutes(L(10,\
  \ 0, 1500), 5)[0] >= 60)\n    p = plan([L(10, 0, 0)], hm(\"08:00\"), break_min=0)\n\
  \    check(\"finish time no breaks\", p[\"summary\"][\"finish\"] == \"10:00\")\n\
  \    p = plan([L(10, 0, 0)], hm(\"08:00\"), break_min=10)\n    check(\"10 min break\
  \ per hour\", p[\"summary\"][\"total_min\"] == 140)\n    check(\"terrain multiplier\"\
  , plan([L(10, 0, 0, \"scramble\")], 0, break_min=0)[\"summary\"][\"moving_min\"\
  ] == 192)\n    check(\"fitness multiplier\", plan([L(10, 0, 0)], 0, fitness=1.2,\
  \ break_min=0)[\"summary\"][\"moving_min\"] == 144)\n    check(\"pack over 10 kg\
  \ slows\", plan([L(10, 0, 0)], 0, pack_kg=15, break_min=0)[\"summary\"][\"moving_min\"\
  ] == 132)\n    p = plan([L(10, 0, 0)], hm(\"15:00\"), sunset=hm(\"16:30\"), break_min=0)\n\
  \    check(\"AFTER_DARK HIGH\", p[\"findings\"][0][\"code\"] == \"AFTER_DARK\" and\
  \ p[\"findings\"][0][\"severity\"] == \"HIGH\")\n    check(\"latest start\", p[\"\
  summary\"][\"latest_start\"] == \"13:30\")\n    p = plan([L(10, 0, 0)], hm(\"14:00\"\
  ), sunset=hm(\"16:30\"), break_min=0)\n    check(\"SMALL_MARGIN\", [f[\"code\"]\
  \ for f in p[\"findings\"]] == [\"SMALL_MARGIN\"])\n    check(\"no finding with\
  \ time to spare\", plan([L(10, 0, 0)], hm(\"08:00\"), sunset=hm(\"18:00\"))[\"findings\"\
  ] == [])\n    check(\"HARD_TERRAIN_LATE\", any(f[\"code\"] == \"HARD_TERRAIN_LATE\"\
  \ for f in\n          plan([L(3, 0, 0, \"scramble\")], hm(\"13:00\"), sunset=hm(\"\
  15:00\"))[\"findings\"]))\n    check(\"water rate by temperature\", [water_rate(t)\
  \ for t in (10, 20, 27, 33)] == [0.4, 0.5, 0.75, 1.0])\n    p = plan([L(10, 0, 0,\
  \ water=\"yes\"), L(10, 0, 0)], 0, temp=20, break_min=0)\n    check(\"water per\
  \ leg\", p[\"legs\"][0][\"water_l\"] == 1.0)\n    check(\"carry = largest stretch\
  \ + reserve\", p[\"summary\"][\"carry_max_l\"] == 1.5)\n    p = plan([L(10, 500,\
  \ 0), L(10, 0, 500)], 0, temp=31, break_min=0)\n    check(\"LONG_DRY_STRETCH and\
  \ HEAT\", {\"LONG_DRY_STRETCH\", \"HEAT\"} <= {f[\"code\"] for f in p[\"findings\"\
  ]})\n    check(\"LONG_DAY\", any(f[\"code\"] == \"LONG_DAY\" for f in plan([L(45,\
  \ 0, 0)], 0)[\"findings\"]))\n    check(\"food kcal\", plan([L(10, 0, 0)], 0, break_min=0)[\"\
  summary\"][\"food_kcal\"] == 500)\n    check(\"clock wraps past midnight\", clock(1500)\
  \ == \"01:00 (+1d)\")\n    legs = read_legs(\"leg;distance_km;ascent_m;descent_m;terrain;water_at_end\\\
  nA;3,5;200;0;Path;yes\\n\")\n    check(\"semicolon CSV + decimal comma\", legs[0][\"\
  distance_km\"] == 3.5 and legs[0][\"water_at_end\"])\n    for bad, why in [(\"leg,distance_km\\\
  nA,1\\n\", \"missing columns\"),\n                     (\"leg,distance_km,ascent_m,descent_m,terrain,water_at_end\\\
  nA,x,0,0,path,no\\n\", \"non-number\"),\n                     (\"leg,distance_km,ascent_m,descent_m,terrain,water_at_end\\\
  nA,1,-5,0,path,no\\n\", \"negative\"),\n                     (\"leg,distance_km,ascent_m,descent_m,terrain,water_at_end\\\
  nA,1,0,0,lava,no\\n\", \"unknown terrain\")]:\n        try:\n            read_legs(bad);\
  \ check(\"rejects \" + why, False)\n        except InputError:\n            check(\"\
  rejects \" + why, True)\n    try:\n        hm(\"25:00\"); check(\"rejects bad time\"\
  , False)\n    except InputError:\n        check(\"rejects bad time\", True)\n  \
  \  passed = sum(res)\n    print(f\"{passed}/{len(res)} passed\")\n    return 0 if\
  \ passed == len(res) else 1\n\n\ndef main():\n    ap = argparse.ArgumentParser(description=\"\
  Hiking route time and water planner\")\n    ap.add_argument(\"csv\", nargs=\"?\"\
  , help=\"legs CSV\")\n    ap.add_argument(\"--start\", help=\"start time HH:MM\"\
  )\n    ap.add_argument(\"--sunset\", help=\"sunset time HH:MM\")\n    ap.add_argument(\"\
  --pace\", type=float, default=5.0, help=\"flat walking speed km/h (default 5)\"\
  )\n    ap.add_argument(\"--fitness\", type=float, default=1.0, help=\"time multiplier:\
  \ 0.85 fast, 1.0 average, 1.2 relaxed, 1.4 with young kids\")\n    ap.add_argument(\"\
  --pack-kg\", type=float, default=8.0, help=\"pack weight; +2%% time per kg above\
  \ 10\")\n    ap.add_argument(\"--break-min\", type=float, default=10.0, help=\"\
  break minutes per hour of walking (default 10)\")\n    ap.add_argument(\"--temp\"\
  , type=float, default=18.0, help=\"expected daytime temperature C\")\n    ap.add_argument(\"\
  --margin\", type=int, default=60, help=\"minutes of daylight to keep in hand (default\
  \ 60)\")\n    ap.add_argument(\"--json\", action=\"store_true\")\n    ap.add_argument(\"\
  --self-test\", action=\"store_true\")\n    a = ap.parse_args()\n    if a.self_test:\n\
  \        return self_test()\n    if not a.csv or not a.start:\n        ap.error(\"\
  give a CSV and --start, or --self-test\")\n    try:\n        with open(a.csv, encoding=\"\
  utf-8-sig\") as fh:\n            legs = read_legs(fh.read())\n        p = plan(legs,\
  \ hm(a.start), hm(a.sunset) if a.sunset else None, a.pace, a.fitness, a.pack_kg,\
  \ a.break_min, a.temp, a.margin)\n    except (OSError, InputError) as e:\n     \
  \   print(f\"error: {e}\", file=sys.stderr)\n        return 2\n    print(json.dumps(p,\
  \ indent=2) if a.json else to_markdown(p, a))\n    return 1 if any(f[\"severity\"\
  ] == \"HIGH\" for f in p[\"findings\"]) else 0\n\n\nif __name__ == \"__main__\"\
  :\n    sys.exit(main())"
