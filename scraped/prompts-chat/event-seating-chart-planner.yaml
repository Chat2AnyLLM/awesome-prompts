  \ enumerate(g) if x[\"name\"] == name][0]\n        return r[\"seat\"].get(i)\n \
  \   T2 = [{\"name\": \"A\", \"seats\": 4}, {\"name\": \"B\", \"seats\": 4}]\n  \
  \  rows = \"Ann,P1,work,yes\\nBob,P1,work,yes\\nCid,P2,family,yes\\nDee,P2,family,yes\\\
  nEve,P3,work,yes\\nFay,P4,family,yes\\n\"\n    r, g = P(T2, rows)\n    t(\"parties\
  \ stay together\", tab(r, g, \"Ann\") == tab(r, g, \"Bob\") and tab(r, g, \"Cid\"\
  ) == tab(r, g, \"Dee\"))\n    t(\"groups fill tables\", tab(r, g, \"Eve\") == tab(r,\
  \ g, \"Ann\") and tab(r, g, \"Fay\") == tab(r, g, \"Cid\"))\n    t(\"clean plan\
  \ has no high/medium\", not [f for f in r[\"findings\"] if f[0] in (\"high\", \"\
  medium\")])\n    r, g = P(T2, \"Ann,P1,work,yes,,,,,Bob\\nBob,P2,work,yes\\nCid,P3,work,yes\\\
  nDee,P4,work,yes\\n\")\n    t(\"keep_apart respected\", tab(r, g, \"Ann\") != tab(r,\
  \ g, \"Bob\") and (\"high\", \"SC02\") not in codes(r))\n    r, g = P(T2, \"Ann,P1,work,yes,,,,Dee\\\
  nBob,P2,family,yes\\nCid,P3,family,yes\\nDee,P4,friends,yes\\n\")\n    t(\"sit_with\
  \ respected\", tab(r, g, \"Ann\") == tab(r, g, \"Dee\"))\n    r, g = P(T2, \"Ann,P1,work,yes,,,,Bob,Bob\\\
  nBob,P2,work,yes\\n\")\n    t(\"sit_with vs keep_apart conflict -> SC02 high\",\
  \ (\"high\", \"SC02\") in codes(r))\n    r, g = P(T2, \"Ann,P1,work,yes,,,,,Bob\\\
  nBob,P1,work,yes\\n\")\n    t(\"keep apart inside one party -> SC02\", (\"high\"\
  , \"SC02\") in codes(r))\n    r, g = P(T2, \"Ann,P1,work,yes,,,,Bobb\\nBob,P2,work,yes\\\
  n\")\n    t(\"misspelled name -> SC03 with suggestion\", any(f[1] == \"SC03\" and\
  \ \"did you mean Bob\" in f[3] for f in r[\"findings\"]))\n    r, g = P([{\"name\"\
  : \"A\", \"seats\": 2}], \"Ann,P1,w,yes\\nBob,P2,w,yes\\nCid,P3,w,yes\\n\")\n  \
  \  t(\"not enough seats -> SC01 high\", (\"high\", \"SC01\") in codes(r))\n    r,\
  \ g = P(T2, \"Ann,P1,w,yes\\nAnn,P1,w,yes\\nBob,P1,w,yes\\n\")\n    t(\"duplicate\
  \ -> SC08 and seated once\", (\"medium\", \"SC08\") in codes(r) and len(g) == 2)\n\
  \    r, g = P(T2, \"Ann,P1,w,no\\nBob,P2,w,pending\\nCid,P3,w,yes\\nDee,P3,w,yes\\\
  n\")\n    t(\"declined and pending excluded\", len(g) == 2)\n    r, g = P(T2, \"\
  Bob,P2,w,pending\\nCid,P3,w,yes\\n\", pending=True)\n    t(\"--include-pending seats\
  \ pending -> SC07\", len(g) == 2 and (\"info\", \"SC07\") in codes(r))\n    r, g\
  \ = P([{\"name\": \"A\", \"seats\": 4}, {\"name\": \"B\", \"seats\": 4, \"accessible\"\
  : True}], \"Ann,P1,w,yes\\nBob,P2,x,yes,,wheelchair\\n\")\n    t(\"wheelchair ->\
  \ accessible table\", tab(r, g, \"Bob\") == 1)\n    r, g = P([{\"name\": \"A\",\
  \ \"seats\": 4}, {\"name\": \"B\", \"seats\": 4}], \"Ann,P1,w,yes\\nBob,P2,x,yes,,wheelchair\\\
  n\")\n    t(\"no accessible table -> SC05\", (\"medium\", \"SC05\") in codes(r))\n\
  \    r, g = P(T2, \"Ann,P1,work,yes\\nBob,P1,work,yes\\nZed,P9,gym,yes\\n\")\n \
  \   t(\"lonely guest -> SC04\", (\"medium\", \"SC04\") in codes(r))\n    r, g =\
  \ P([{\"name\": \"Head\", \"seats\": 4, \"fixed\": [\"Bride\", \"Groom\"]}, {\"\
  name\": \"B\", \"seats\": 4}], \"Bride,C,couple,yes\\nGroom,C,couple,yes\\nBest,Best,groom\
  \ family,yes,,,,Groom\\n\")\n    t(\"sit_with partner counts as someone they know\"\
  , (\"medium\", \"SC04\") not in codes(r) and tab(r, g, \"Best\") == 0)\n    r, g\
  \ = P([{\"name\": \"A\", \"seats\": 4}, {\"name\": \"B\", \"seats\": 4}, {\"name\"\
  : \"C\", \"seats\": 4}],\n             \"A1,a1,fam,yes\\nA2,a1,fam,yes\\nA3,a1,fam,yes\\\
  nW1,w1,work,yes\\nB1,b1,fam,yes\\nB2,b1,fam,yes\\nB3,b1,fam,yes\\nW2,w2,work,yes\\\
  n\")\n    t(\"group split by greedy is pulled together\", tab(r, g, \"W1\") == tab(r,\
  \ g, \"W2\"))\n    r, g = P([{\"name\": \"A\", \"seats\": 3}, {\"name\": \"B\",\
  \ \"seats\": 3}], \"A1,Big,w,yes\\nA2,Big,w,yes\\nA3,Big,w,yes\\nA4,Big,w,yes\\\
  n\")\n    t(\"party bigger than a table is split -> SC09\", (\"medium\", \"SC09\"\
  ) in codes(r) and len(r[\"seat\"]) == 4)\n    r, g = P([{\"name\": \"Head\", \"\
  seats\": 2, \"fixed\": [\"Cid\"]}, {\"name\": \"B\", \"seats\": 4}], \"Ann,P1,w,yes\\\
  nBob,P1,w,yes\\nCid,P3,w,yes\\n\")\n    t(\"fixed seat honoured\", tab(r, g, \"\
  Cid\") == 0)\n    r, g = P([{\"name\": \"Head\", \"seats\": 2, \"fixed\": [\"Cyd\"\
  ]}, {\"name\": \"B\", \"seats\": 4}], \"Cid,P3,w,yes\\n\")\n    t(\"fixed seat typo\
  \ -> SC03\", (\"high\", \"SC03\") in codes(r))\n    r, g = P([{\"name\": \"A\",\
  \ \"seats\": 10}, {\"name\": \"B\", \"seats\": 10}], \"Ann,P1,w,yes\\nBob,P1,w,yes\\\
  n\")\n    t(\"half-empty and empty tables -> SC06\", (\"low\", \"SC06\") in codes(r)\
  \ and (\"info\", \"SC06\") in codes(r))\n    r, g = P([{\"name\": \"A\", \"seats\"\
  : 4}, {\"name\": \"Kids\", \"seats\": 4, \"kids\": True}], \"Mum,F,fam,yes\\nTim,F,fam,yes,yes\\\
  nLia,G,fam,yes,yes\\nDad,G,fam,yes\\n\")\n    t(\"children stay with their party\
  \ by default\", tab(r, g, \"Tim\") == tab(r, g, \"Mum\"))\n    r, g = P(T2, \"Ann,P1,w,yes,,,vegetarian\\\
  nBob,P1,w,yes,,,\\n\")\n    t(\"diet counted\", \"vegetarian 1\" in report({\"event\"\
  : \"x\", \"date\": \"\"}, r, {\"no\": 0, \"pending\": 0}, \"x\"))\n    r, g = P([{\"\
  name\": \"A\", \"seats\": 2}, {\"name\": \"B\", \"seats\": 2}], \"Ann,P1,w,yes,,,,Bob;Cid\\\
  nBob,P2,w,yes\\nCid,P3,w,yes\\n\")\n    t(\"sit_with group larger than any table\
  \ -> SC09\", (\"medium\", \"SC09\") in codes(r))\n    for bad, name in (({\"tables\"\
  : []}, \"no tables\"), ({\"tables\": [{\"name\": \"A\", \"seats\": 0}]}, \"zero\
  \ seats\"),\n                      ({\"tables\": [{\"name\": \"A\", \"seats\": 4},\
  \ {\"name\": \"A\", \"seats\": 4}]}, \"duplicate table\"),\n                   \
  \   ({\"tables\": [{\"name\": \"A\", \"seats\": 4, \"colour\": \"red\"}]}, \"unknown\
  \ table key\")):\n        try:\n            load_event(bad); t(\"rejected: \" +\
  \ name, False)\n        except InputError:\n            t(\"rejected: \" + name,\
  \ True)\n    try:\n        load_guests(\"first,last\\nA,B\\n\"); t(\"rejected: no\
  \ name column\", False)\n    except InputError:\n        t(\"rejected: no name column\"\
  , True)\n    r, g = P(T2, rows)\n    rep = report({\"event\": \"x\", \"date\": \"\
  \"}, r, {\"no\": 0, \"pending\": 0}, \"x\")\n    t(\"report has verdict, tables\
  \ and place cards\", \"**Verdict:\" in rep and \"## Tables\" in rep and \"## Place\
  \ cards\" in rep)\n    for n, ok in tests:\n        print(\"%s  %s\" % (\"PASS\"\
  \ if ok else \"FAIL\", n))\n    p = sum(ok for _, ok in tests)\n    print(\"%d/%d\
  \ passed\" % (p, len(tests)))\n    return 0 if p == len(tests) else 1\n\n\ndef main(argv=None):\n\
  \    ap = argparse.ArgumentParser(description=\"Build a seating chart from tables\
  \ and a guest list.\")\n    ap.add_argument(\"event\", nargs=\"?\")\n    ap.add_argument(\"\
  guests\", nargs=\"?\")\n    ap.add_argument(\"--include-pending\", action=\"store_true\"\
  , help=\"seat guests whose RSVP is pending\")\n    ap.add_argument(\"--csv\", action=\"\
  store_true\", help=\"print name,table CSV (place cards)\")\n    ap.add_argument(\"\
  --json\", action=\"store_true\")\n    ap.add_argument(\"--self-test\", action=\"\
  store_true\")\n    a = ap.parse_args(argv)\n    if a.self_test:\n        return\
  \ self_test()\n    if not a.event or not a.guests:\n        ap.error(\"give EVENT.json\
  \ and GUESTS.csv\")\n    try:\n        ev, r, skipped = run(a.event, a.guests, a.include_pending)\n\
  \    except InputError as e:\n        print(\"error: %s\" % e, file=sys.stderr)\n\
  \        return 2\n    G, T = r[\"guests\"], r[\"tables\"]\n    if a.json:\n   \
  \     print(json.dumps({\"tables\": [{\"name\": t[\"name\"], \"seats\": t[\"seats\"\
  ], \"guests\": [G[i][\"name\"] for i in sorted(r[\"seat\"]) if r[\"seat\"][i] ==\
  \ ti]} for ti, t in enumerate(T)],\n                          \"unseated\": [g[\"\
  name\"] for i, g in enumerate(G) if i not in r[\"seat\"]],\n                   \
  \       \"findings\": [dict(zip((\"severity\", \"code\", \"who\", \"finding\", \"\
  fix\"), f)) for f in r[\"findings\"]]}, indent=2))\n    elif a.csv:\n        w =\
  \ csv.writer(sys.stdout, lineterminator=\"\\n\")\n        w.writerow([\"name\",\
  \ \"table\", \"diet\"])\n        for i in sorted(r[\"seat\"], key=lambda i: norm(G[i][\"\
  name\"])):\n            w.writerow([G[i][\"name\"], T[r[\"seat\"][i]][\"name\"],\
  \ G[i][\"diet\"]])\n    else:\n        sys.stdout.write(report(ev, r, skipped, a.guests))\n\
  \    return 1 if any(f[0] == \"high\" for f in r[\"findings\"]) else 0\n\n\nif __name__\
  \ == \"__main__\":\n    sys.exit(main())"
