title: Event Seating Chart Planner
description: Imported from Prompts Chat
prompt: "---\nname: event-seating-chart-planner\ndescription: Builds a seating chart\
  \ for weddings, dinners and team events from your tables and guest list - keeps\
  \ couples and families together, honours sit-with and keep-apart requests and head-table\
  \ seats, puts mobility needs at accessible tables, seats nobody among strangers\
  \ and fills tables by group. Flags misspelled names, duplicates, conflicting requests\
  \ and missing seats; prints place cards and meal counts. Includes an offline stdlib\
  \ Python planner.\n---\n\n# Event Seating Chart Planner\n\nYou help hosts turn a\
  \ guest list into a seating chart without the spreadsheet agony. Seating is the\
  \ job everyone leaves until the last week: the divorced uncle and aunt must not\
  \ share a table, grandma needs a step-free spot by the door, the plus-one knows\
  \ nobody, two RSVPs are still missing, the caterer wants vegan and child meals per\
  \ table, and every change breaks something else. You collect the tables and the\
  \ guest list, check the list for problems first, build a chart that meets the hard\
  \ requests, explain the trade-offs and produce place cards and a caterer sheet.\n\
  \nYou work only from the information the host gives you. You do not judge family\
  \ politics: when two requests conflict, say so and ask the host which one wins.\
  \ Keep the guest list private - do not repeat notes about relationships beyond what\
  \ the chart needs.\n\n## Files in this skill\n\n- `scripts/seating_plan.py` - reads\
  \ an event JSON (tables with seats, accessible, kids, fixed head-table guests; rules)\
  \ and a guest CSV (name, party, group, rsvp, child, needs, diet, sit_with, keep_apart),\
  \ merges parties and sit-with requests, places them table by table and improves\
  \ the plan by moving and swapping groups; reports SC01-SC10 and prints the chart,\
  \ a caterer summary and place cards; `--csv` place-card export, `--json`, `--include-pending`\
  \ (Python 3.8+ standard library only)\n- `references/seating-rules-and-etiquette.md`\
  \ - how to collect the list, what counts as a hard or soft request, head table and\
  \ family conventions, accessibility, children, dietary needs and room layout tips\n\
  - `references/checks-and-codes.md` - every finding code, its severity and what to\
  \ do, plus the input format and how the planner scores a chart\n- `templates/seating-brief.md`\
  \ - the summary to send the host (and the venue / caterer)\n- `examples/event.json`\
  \ - a wedding dinner with a head table, an accessible table, four tables of 8 and\
  \ a kids table\n- `examples/guests.csv` - 32 rows with families, friends, work colleagues,\
  \ a declined and a pending RSVP, a duplicate row, a misspelled sit-with name, a\
  \ keep-apart pair, a wheelchair user and dietary needs\n- `examples/seating-chart.md`\
  \ - the real planner output on the example\n\n## Workflow\n\n### 1. Collect the\
  \ tables and the list\nAsk for the venue's table plan (number of tables, seats per\
  \ table, which are step-free or near the exit, a kids table, the head table and\
  \ who sits there). Ask for the guest list with RSVP, party (people who arrive together:\
  \ couple, family), group (how they know the hosts: bride family, work, school friends),\
  \ children, mobility or other needs, meal choice, and any \"must sit with\" or \"\
  keep apart\" requests. Put them in `examples/event.json` and `examples/guests.csv`\
  \ form.\n\n### 2. Run the planner\n```\npython3 scripts/seating_plan.py examples/event.json\
  \ examples/guests.csv\npython3 scripts/seating_plan.py event.json guests.csv --include-pending\n\
  python3 scripts/seating_plan.py event.json guests.csv --csv > place-cards.csv\n\
  python3 scripts/seating_plan.py event.json guests.csv --json\npython3 scripts/seating_plan.py\
  \ --self-test\n```\nExit 0 = all hard requests met, 1 = a hard request failed or\
  \ the list has a high finding, 2 = bad input. Without a shell, seat fixed guests\
  \ first, then the accessibility needs, then the largest groups, and check every\
  \ keep-apart pair at the end.\n\n### 3. Read the result\n- High: SC01 not enough\
  \ seats (or a group that fits nowhere), SC02 conflicting or broken keep-apart requests,\
  \ SC03 names in requests or fixed seats that are not on the attending list (spelling\
  \ suggestions shown).\n- Medium: SC04 a guest at a table with nobody they know,\
  \ SC05 a mobility need at a non-accessible table, SC08 duplicate rows, SC09 parties\
  \ or requests too big for one table, SC10 a child without an adult from their party.\n\
  - Low/info: half-empty or empty tables (SC06), pending RSVPs seated provisionally\
  \ (SC07).\n\n### 4. Adjust with the host\nFix the list problems first (spelling,\
  \ duplicates, RSVPs) and re-run. Then walk the host through each table: who is there\
  \ and why, the lonely guests and the trade-offs. Make manual moves the host asks\
  \ for and re-run to confirm the keep-apart pairs still hold. Fill `templates/seating-brief.md`.\n\
  \n### 5. Deliver\nReturn the chart per table, the open questions, the place-card\
  \ list A-Z, the meal counts per table and in total, and the special needs list for\
  \ the venue (wheelchair space, high chairs, allergies).\n\n## Example result\n29\
  \ guests attend (1 declined, 1 pending left out) for 44 seats. The couple, maid\
  \ of honour, best man and Zeynep (who asked to sit with Selin) fill the head table.\
  \ Grandma Fatma (wheelchair) sits at accessible Table 1 with the Kaya family; Linda\
  \ and Richard Moore are kept apart (Tables 2 and 3); the work colleagues share Table\
  \ 4 with the bride's friends. Sam's request to sit with \"Olivr Grant\" is a typo\
  \ of Oliver Grant, Merve Sahin is listed twice, and neighbour Kemal knows nobody\
  \ at his table. The kids table is empty because children stay with their parents.\n\
  \n## Rules\n\n- Hard requests (keep apart, fixed seats, accessibility) beat soft\
  \ ones (groups, balance); say clearly which request was dropped and why.\n- Never\
  \ split a couple or a parent and a young child unless the host asks.\n- Do not guess\
  \ at conflicts: ask the host, and keep sensitive notes out of anything printed.\n\
  - Re-run after every manual change; the chart is only valid for the list it was\
  \ made from.\n- Pending RSVPs are left out unless the host says to seat them; chase\
  \ them before printing place cards.\n\x1FFILE:references/seating-rules-and-etiquette.md\x1E\
  \n# Seating rules and etiquette\n\n## Collecting the list\n- One row per person,\
  \ including children and plus-ones (use \"Guest of <name>\" until you have a name).\n\
  - Party = who arrives together and must sit together (couple, parent with young\
  \ children). Group = how they know the hosts; it decides who shares a table.\n-\
  \ Ask the hosts directly for keep-apart pairs (exes, family feuds) and keep this\
  \ column out of anything printed or shared with the venue.\n- RSVP status: seat\
  \ only confirmed guests; set a deadline for pending ones about 3 weeks before the\
  \ event, when most venues need final numbers.\n\n## Hard vs soft requests\n- Hard:\
  \ keep apart, fixed seats (head table, speakers, VIPs), accessibility, a young child\
  \ next to a parent, capacity.\n- Soft: sit with friends, tables by group, balanced\
  \ tables, mixing groups at networking events.\nWhen a soft request breaks a hard\
  \ one, the hard one wins; tell the host.\n\n## Common conventions\n- Weddings: the\
  \ head table (couple, wedding party, sometimes parents) faces the room; parents\
  \ and grandparents at the tables closest to it; families of both sides near the\
  \ front; friends and colleagues further back. Sweetheart table = couple only.\n\
  - Family dinners and birthdays: the guest of honour in the middle of the long side,\
  \ with the people they see least often nearby.\n- Corporate dinners: a host from\
  \ the company at every table; mix departments if networking is the goal (`mix_groups:\
  \ true`), seat speakers near the stage and the exit.\n- Round tables of 8-10 work\
  \ best for conversation; 12+ means people only talk to their neighbours.\n- Avoid\
  \ a table where one guest is the only one from their group - pair singles with someone\
  \ outgoing or a similar-age group.\n\n## Accessibility and needs\n- Wheelchair users:\
  \ a table on a step-free route near the door and the toilets, with a chair removed\
  \ at the place (mark it on the room plan).\n- Hearing impairment: away from speakers\
  \ and the band, facing the room.\n- Older guests: away from loudspeakers and the\
  \ dance floor, near the exit and toilets.\n- High chairs and booster seats: tell\
  \ the venue per table.\n- Allergies: list name, table and allergen for the caterer;\
  \ a printed card at the place for severe allergies.\n\n## Children\n- Toddlers stay\
  \ with their parents. A kids table works for ages about 5-12 when it is next to\
  \ the parents' tables and has an adult or sitter nearby.\n- Count child meals separately\
  \ (and high chairs) in the caterer summary.\n\n## Room layout tips\n- Number tables\
  \ in a way guests can find (signs on every table, an alphabetical escort-card list\
  \ at the entrance).\n- Keep the path from the door to the accessible table clear.\n\
  - Leave 1-2 empty seats across the room for late changes; venues usually allow 1-2\
  \ extra chairs per round table, but check the fire-safety capacity.\n\n## Final\
  \ week checklist\n- Final RSVPs and meal choices -> re-run the planner -> host approval.\n\
  - Send the venue: table plan, guest count per table, high chairs, wheelchair spaces.\n\
  - Send the caterer: meals per table and in total, allergies with names and tables.\n\
  - Print place cards and the escort-card list from `--csv`.\n\x1FFILE:references/checks-and-codes.md\x1E\
  \n# Checks and finding codes\n\n| Code | Severity | Check | What to do |\n|---|---|---|---|\n\
  | SC01 | high | more attending guests than seats, or a party/group that fits at\
  \ no table with enough free seats | add a table or seats, confirm RSVPs, split the\
  \ group over neighbouring tables |\n| SC02 | high | a sit-with request joins two\
  \ guests who must be kept apart (request dropped); keep-apart inside one party;\
  \ a keep-apart pair seated together | ask the host which request wins |\n| SC03\
  \ | high | a name in sit_with / keep_apart or a fixed seat is not on the attending\
  \ list (did-you-mean suggestion) | fix the spelling or add the guest |\n| SC04 |\
  \ medium | guest at a table with fewer than `min_known` people from their party,\
  \ group or sit-with list | swap, or seat them next to a sociable guest |\n| SC05\
  \ | medium | wheelchair / step-free / walker / mobility / crutches need at a table\
  \ not marked accessible | swap with someone at an accessible table |\n| SC06 | low:\
  \ table under half full; info: empty table | balance | merge tables or remove one\
  \ |\n| SC07 | info | RSVP pending, seated because of `--include-pending` | chase\
  \ the RSVP |\n| SC08 | medium | the same name twice (seated once), row without a\
  \ name | check if two different people; add an initial |\n| SC09 | medium | a party\
  \ larger than the largest table (split), a sit-with group that would exceed the\
  \ largest table (request dropped), a party split over tables | neighbouring tables;\
  \ free seats at one table |\n| SC10 | medium | child at a non-kids table without\
  \ an adult from their party | move next to their parents |\n\n## Verdict\n- **N\
  \ hard request(s) could not be met** - any high finding.\n- **all hard requests\
  \ met, N soft issue(s)** - medium findings only.\n- **all requests met**.\n\n##\
  \ How the planner works\n1. Attending guests only (rsvp yes; pending with `--include-pending`;\
  \ no/declined skipped).\n2. Parties are merged (when `keep_parties_together`), then\
  \ sit-with requests, unless that joins a keep-apart pair or exceeds the largest\
  \ table.\n3. Groups are placed in order: fixed head-table guests (only they and\
  \ their sit-with partners use a table with `fixed`), mobility needs, then by group\
  \ size.\n4. Each group goes to the table where the chart's penalty rises least;\
  \ then the planner moves single groups, whole groups and swaps pairs while the penalty\
  \ falls.\n5. Penalty: keep-apart pair at one table 100, mobility need at a non-accessible\
  \ table 40, a guest who knows fewer than `min_known` people 12, each extra group\
  \ at a table 2 (unless `mix_groups`), each extra table a group is spread over 3,\
  \ an adult at the kids table 3.\nThe plan is deterministic: the same input gives\
  \ the same chart.\n\n## Event JSON\n`event, date, rules{keep_parties_together (true),\
  \ mix_groups (false), min_known (1)}, tables[{name, seats, accessible, kids, fixed[names],\
  \ notes}]`.\n\n## Guest CSV\n`name, party, group, rsvp (yes/no/pending), child (yes),\
  \ needs (wheelchair; high chair; nut allergy), diet (vegetarian, vegan, gluten-free,\
  \ child menu ...), sit_with (names separated by ;), keep_apart (names separated\
  \ by ;)`. Only `name` is required; party defaults to the name, group to \"-\", rsvp\
  \ to yes.\n\x1FFILE:templates/seating-brief.md\x1E\n# Seating brief: <event> (<date>)\n\
  \n**Guests:** <29 attending (1 declined, 1 pending)>   **Seats:** <44 at 6 tables>\
  \   **Status:** <draft 2 - waiting for 1 RSVP>\n\n## Open questions for the host\n\
  - [ ] <Sam asked to sit with \"Olivr Grant\" - Oliver Grant? (seated together after\
  \ the fix)>\n- [ ] <Merve Sahin is on the list twice - one person or two?>\n- [\
  \ ] <Kemal knows nobody at Table 3 - who should he sit next to?>\n- [ ] <Chris Evans:\
  \ RSVP pending - seat at Table 3 if he comes>\n\n## Tables\n| Table | Who | Notes\
  \ |\n|---|---|---|\n| <Head table> | <Elif, Daniel, Selin, Tom, Zeynep> | <facing\
  \ the room> |\n| <Table 1 (accessible)> | <Kaya family, Grandma Fatma> | <wheelchair\
  \ place on the aisle, high chair for Ela> |\n\n## For the venue\n- Tables and seat\
  \ counts: <...>\n- Wheelchair places: <Table 1 x1>   High chairs: <Table 1 x1>\n\
  - Remove: <kids table (empty)>\n\n## For the caterer\n| Table | Standard | Vegetarian\
  \ | Vegan | Gluten-free | Child | Other |\n|---|---|---|---|---|---|---|\n| <Head\
  \ table> | <3> | <2> | <0> | <0> | <0> | <-> |\n| **Total** | <18> | <3> | <2> |\
  \ <1> | <3> | <pescatarian 1, soft food 1> |\n\nAllergies: <Max Hill (Table 2) -\
  \ nut allergy>\n\n## Place cards\n<attach place-cards.csv from `seating_plan.py\
  \ --csv`>\n\x1FFILE:examples/event.json\x1E\n{\n  \"event\": \"Elif and Daniel's\
  \ wedding dinner\",\n  \"date\": \"2027-06-12\",\n  \"rules\": {\"keep_parties_together\"\
  : true, \"mix_groups\": false, \"min_known\": 1},\n  \"tables\": [\n    {\"name\"\
  : \"Head table\", \"seats\": 6, \"fixed\": [\"Elif Kaya\", \"Daniel Moore\"], \"\
  notes\": \"facing the room\"},\n    {\"name\": \"Table 1\", \"seats\": 8, \"accessible\"\
  : true, \"notes\": \"next to the terrace door, step-free\"},\n    {\"name\": \"\
  Table 2\", \"seats\": 8},\n    {\"name\": \"Table 3\", \"seats\": 8},\n    {\"name\"\
  : \"Table 4\", \"seats\": 8},\n    {\"name\": \"Kids table\", \"seats\": 6, \"kids\"\
  : true, \"notes\": \"near Table 2, crayons and placemats\"}\n  ]\n}\n\x1FFILE:examples/guests.csv\x1E\
  \nname,party,group,rsvp,child,needs,diet,sit_with,keep_apart\nElif Kaya,Couple,couple,yes,,,vegetarian,,\n\
  Daniel Moore,Couple,couple,yes,,,standard,,\nSelin Kaya,Maid of honour,bride friends,yes,,,standard,Elif\
  \ Kaya,\nTom Moore,Best man,groom family,yes,,,standard,Daniel Moore,\nAyse Kaya,Kaya\
  \ parents,bride family,yes,,,standard,,\nMehmet Kaya,Kaya parents,bride family,yes,,,standard,,\n\
  Fatma Yilmaz,Grandma Fatma,bride family,yes,,wheelchair,soft food,Ayse Kaya,\nCan\
  \ Kaya,Can family,bride family,yes,,,standard,,\nDeniz Kaya,Can family,bride family,yes,,,vegan,,\n\
  Ela Kaya,Can family,bride family,yes,yes,high chair,child menu,,\nLinda Moore,Linda,groom\
  \ family,yes,,,gluten-free,,Richard Moore\nRichard Moore,Richard and Jo,groom family,yes,,,standard,,Linda\
  \ Moore\nJo Parker,Richard and Jo,groom family,yes,,,standard,,\nSarah Moore,Sarah\
  \ family,groom family,yes,,,standard,,\nJames Hill,Sarah family,groom family,yes,,,standard,,\n\
  Lily Hill,Sarah family,groom family,yes,yes,,child menu,,\nMax Hill,Sarah family,groom\
  \ family,yes,yes,nut allergy,child menu,,\nZeynep Arslan,Zeynep,bride friends,yes,,,vegetarian,Selin\
  \ Kaya,\nBurak Demir,Burak and Ece,bride friends,yes,,,standard,,\nEce Demir,Burak\
  \ and Ece,bride friends,yes,,,standard,,\nMerve Sahin,Merve,bride friends,yes,,,vegan,,\n\
  Oliver Grant,Oliver and Priya,groom friends,yes,,,standard,,\nPriya Grant,Oliver\
  \ and Priya,groom friends,yes,,,vegetarian,,\nSam Turner,Sam,groom friends,yes,,,standard,Olivr\
  \ Grant,\nChris Evans,Chris,groom friends,pending,,,standard,,\nNina Patel,Nina,work,yes,,,standard,,\n\
  Leo Fischer,Leo and Mia,work,yes,,,standard,,\nMia Fischer,Leo and Mia,work,yes,,,pescatarian,,\n\
  Hannah Lee,Hannah,work,yes,,,standard,,\nPeter Novak,Peter,work,no,,,standard,,\n\
  Kemal Ozturk,Kemal,neighbours,yes,,,standard,,\nMerve Sahin,Merve,bride friends,yes,,,vegan,,\n\
  \x1FFILE:examples/seating-chart.md\x1E\n# Seating chart: Elif and Daniel's wedding\
  \ dinner (2027-06-12)\n\n29 attending guest(s) (1 declined; 1 pending left out),\
  \ 44 seat(s) at 6 table(s). Source: examples/guests.csv.\n\n**Verdict: 1 hard request(s)\
  \ could not be met - see findings**\n\nFindings: 1 high, 2 medium, 0 low, 1 info.\n\
  \n## Tables\n\n| Table | Seats | Guests | Groups | Meals |\n|---|---|---|---|---|\n\
  | Head table [fixed] | 5/6 | Tom Moore, Elif Kaya, Daniel Moore, Selin Kaya, Zeynep\
  \ Arslan | bride friends 2, couple 2, groom family 1 | standard 3, vegetarian 2\
  \ |\n| Table 1 [accessible] | 6/8 | Can Kaya, Deniz Kaya, Ela Kaya (child), Fatma\
  \ Yilmaz *, Ayse Kaya, Mehmet Kaya | bride family 6 | child menu (child) 1, soft\
  \ food 1, standard 3, vegan 1 |\n| Table 2 | 5/8 | Linda Moore, Sarah Moore, James\
  \ Hill, Lily Hill (child), Max Hill (child) | groom family 5 | child menu (child)\
  \ 2, gluten-free 1, standard 2 |\n| Table 3 | 6/8 | Kemal Ozturk, Oliver Grant,\
  \ Priya Grant, Richard Moore, Jo Parker, Sam Turner | groom family 2, groom friends\
  \ 3, neighbours 1 | standard 5, vegetarian 1 |\n| Table 4 | 7/8 | Burak Demir, Ece\
  \ Demir, Hannah Lee, Leo Fischer, Mia Fischer, Merve Sahin, Nina Patel | bride friends\
  \ 3, work 4 | pescatarian 1, standard 5, vegan 1 |\n| Kids table [kids] | 0/6 |\
  \ - | - | - |\n\n`*` = mobility need (seat on the aisle side, nearest the door).\n\
  \n## Findings\n\n| Sev | Code | Who | Finding | Fix |\n|---|---|---|---|---|\n|\
  \ high | SC03 | Sam Turner | sit_with 'Olivr Grant' is not on the (attending) guest\
  \ list - did you mean Oliver Grant? | fix the spelling |\n| medium | SC04 | Kemal\
  \ Ozturk | at Table 3 without anyone from their party or group (neighbours) | seat\
  \ them next to the most sociable guest there, or swap |\n| medium | SC08 | Merve\
  \ Sahin | listed twice (lines 22 and 33) - seated once | check whether these are\
  \ two different people; add a surname or initial |\n| info | SC06 | Kids table |\
  \ empty table | remove it from the room plan |\n\n## Caterer summary\n\n| Meal |\
  \ Count |\n|---|---|\n| child menu (child) | 3 |\n| gluten-free | 1 |\n| pescatarian\
  \ | 1 |\n| soft food | 1 |\n| standard | 18 |\n| vegan | 2 |\n| vegetarian | 3 |\n\
  \nSpecial needs: Ela Kaya (Table 1) - high chair; Fatma Yilmaz (Table 1) - wheelchair;\
  \ Max Hill (Table 2) - nut allergy.\n\n## Place cards (A-Z)\n\n| Guest | Table |\n\
  |---|---|\n| Ayse Kaya | Table 1 |\n| Burak Demir | Table 4 |\n| Can Kaya | Table\
  \ 1 |\n| Daniel Moore | Head table |\n| Deniz Kaya | Table 1 |\n| Ece Demir | Table\
  \ 4 |\n| Ela Kaya | Table 1 |\n| Elif Kaya | Head table |\n| Fatma Yilmaz | Table\
  \ 1 |\n| Hannah Lee | Table 4 |\n| James Hill | Table 2 |\n| Jo Parker | Table 3\
  \ |\n| Kemal Ozturk | Table 3 |\n| Leo Fischer | Table 4 |\n| Lily Hill | Table\
  \ 2 |\n| Linda Moore | Table 2 |\n| Max Hill | Table 2 |\n| Mehmet Kaya | Table\
  \ 1 |\n| Merve Sahin | Table 4 |\n| Mia Fischer | Table 4 |\n| Nina Patel | Table\
  \ 4 |\n| Oliver Grant | Table 3 |\n| Priya Grant | Table 3 |\n| Richard Moore |\
  \ Table 3 |\n| Sam Turner | Table 3 |\n| Sarah Moore | Table 2 |\n| Selin Kaya |\
  \ Head table |\n| Tom Moore | Head table |\n| Zeynep Arslan | Head table |\n\nThe\
  \ chart is a starting point: move people by hand where you know better, then re-run\
  \ to check the requests still hold.\n\x1FFILE:scripts/seating_plan.py\x1E\n#!/usr/bin/env\
  \ python3\n\"\"\"Event seating chart planner (stdlib only, Python 3.8+).\n\nReads\
  \ an event file (tables with seat counts, accessible / kids / fixed head-table seats,\
  \ rules)\nand a guest list CSV (name, party, group, RSVP, child, needs, diet, sit_with,\
  \ keep_apart) and\nbuilds a seating chart: parties stay together, \"sit with\" requests\
  \ share a table, \"keep apart\"\npairs never share one, guests with mobility needs\
  \ go to accessible tables, nobody is seated\nwithout someone they know, and tables\
  \ are filled by group where possible. Checks the list first\n(unknown or misspelled\
  \ names, duplicates, impossible or conflicting requests, not enough seats)\nand\
  \ prints the chart, place cards and a per-table meal count for the caterer.\n\n\
  Usage:\n  seating_plan.py EVENT.json GUESTS.csv [--include-pending] [--csv] [--json]\n\
  \  seating_plan.py --self-test\nExit: 0 = all hard requests met, 1 = a hard request\
  \ could not be met (or a high finding), 2 = bad input.\n\"\"\"\nimport argparse,\
  \ csv, difflib, io, json, sys\n\nSEV = {\"high\": 0, \"medium\": 1, \"low\": 2,\
  \ \"info\": 3}\nEVENT_KEYS = {\"event\", \"date\", \"tables\", \"rules\"}\nTABLE_KEYS\
  \ = {\"name\", \"seats\", \"accessible\", \"kids\", \"fixed\", \"notes\"}\nRULE_KEYS\
  \ = {\"keep_parties_together\", \"mix_groups\", \"min_known\"}\nMOBILITY = (\"wheelchair\"\
  , \"step-free\", \"walker\", \"mobility\", \"crutches\")\nW_APART, W_ACCESS, W_LONELY,\
  \ W_GROUP, W_SPREAD = 100, 40, 12, 2, 3\n\n\nclass InputError(Exception):\n    pass\n\
  \n\ndef norm(s):\n    return \" \".join(str(s or \"\").split()).lower()\n\n\ndef\
  \ split_list(s):\n    return [x.strip() for x in str(s or \"\").replace(\",\", \"\
  ;\").split(\";\") if x.strip()]\n\n\n# ----------------------------------------------------------------\
  \ load\ndef load_event(cfg):\n    if not isinstance(cfg, dict) or not isinstance(cfg.get(\"\
  tables\"), list) or not cfg[\"tables\"]:\n        raise InputError(\"event file\
  \ must be a JSON object with a non-empty \\\"tables\\\" list\")\n    bad = set(cfg)\
  \ - EVENT_KEYS\n    if bad:\n        raise InputError(\"unknown key(s) in event\
  \ file: %s\" % \", \".join(sorted(bad)))\n    rules = cfg.get(\"rules\") or {}\n\
  \    badr = set(rules) - RULE_KEYS\n    if badr:\n        raise InputError(\"unknown\
  \ rule(s): %s\" % \", \".join(sorted(badr)))\n    tables, names = [], set()\n  \
  \  for i, t in enumerate(cfg[\"tables\"], 1):\n        badt = set(t) - TABLE_KEYS\n\
  \        if badt:\n            raise InputError(\"table #%d: unknown key(s) %s\"\
  \ % (i, \", \".join(sorted(badt))))\n        name = str(t.get(\"name\") or \"Table\
  \ %d\" % i)\n        if name in names:\n            raise InputError(\"table name\
  \ %r used twice\" % name)\n        names.add(name)\n        seats = t.get(\"seats\"\
  )\n        if not isinstance(seats, int) or seats < 1:\n            raise InputError(\"\
  table %s: seats must be a positive whole number, got %r\" % (name, seats))\n   \
  \     tables.append({\"name\": name, \"seats\": seats, \"accessible\": bool(t.get(\"\
  accessible\")), \"kids\": bool(t.get(\"kids\")),\n                       \"fixed\"\
  : [str(x) for x in t.get(\"fixed\") or []], \"notes\": t.get(\"notes\", \"\")})\n\
  \    return {\"event\": cfg.get(\"event\", \"Event\"), \"date\": cfg.get(\"date\"\
  , \"\"), \"tables\": tables,\n            \"together\": rules.get(\"keep_parties_together\"\
  , True), \"mix\": bool(rules.get(\"mix_groups\", False)),\n            \"min_known\"\
  : int(rules.get(\"min_known\", 1))}\n\n\ndef load_guests(text, include_pending=False):\n\
