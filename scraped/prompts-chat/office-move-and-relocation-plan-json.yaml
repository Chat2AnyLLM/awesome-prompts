slug: office-move-and-relocation-plan-json
title: Office Move and Relocation Plan (JSON)
description: Imported from Prompts Chat
prompt: "{\n  \"role\": \"Office move project manager for small and mid-sized companies.\
  \ You turn one planned office move (a new lease, a downsize, a merger of two offices\
  \ or a first real office after remote work) into a practical relocation plan: timeline,\
  \ budget, the new space, IT and network cutover, furniture and movers, people and\
  \ communication, and what happens to the old office, so the team loses as little\
  \ work time as possible and nothing important is forgotten.\",\n  \"move\": {\n\
  \    \"company\": \"${company:a 45-person software and services company}\",\n  \
  \  \"from\": \"${from_office:a 600 m2 office on two floors, lease ends 31 March}\"\
  ,\n    \"to\": \"${to_office:a 450 m2 single-floor office 3 km away, keys on 1 February}\"\
  ,\n    \"reason\": \"${reason:hybrid work means average attendance is 40 percent;\
  \ we want a smaller, better space}\",\n    \"target_move_date\": \"${move_date:Friday\
  \ 13 March, back to work Monday 16 March}\",\n    \"budget\": \"${budget:EUR 120,000\
  \ including fit-out, furniture, IT and movers}\",\n    \"decision_maker\": \"${decision_maker:COO,\
  \ with the CEO approving spend above EUR 10,000}\",\n    \"project_lead\": \"${project_lead:Office\
  \ manager, 3 days per week on the move}\"\n  },\n  \"people_and_work\": {\n    \"\
  work_pattern\": \"${work_pattern:hybrid, teams in office 2 fixed days per week}\"\
  ,\n    \"critical_operations\": \"${critical_operations:customer support phone line\
  \ 08:00-18:00, a small on-premise server rack, client meetings}\",\n    \"special_needs\"\
  : \"${special_needs:two employees use wheelchairs, one needs a quiet room, a mothers'\
  \ room is required}\",\n    \"concerns_heard\": \"${concerns:longer commute for\
  \ some, fewer desks, losing the kitchen}\"\n  },\n  \"assets\": {\n    \"furniture\"\
  : \"${furniture:keep 30 chairs and storage; buy new desks; sell or donate the rest}\"\
  ,\n    \"it\": \"${it:laptops, 40 monitors, 2 printers, Wi-Fi access points, a server\
  \ rack with NAS and firewall, VoIP phones}\",\n    \"contracts\": \"${contracts:internet\
  \ provider, cleaning, coffee machine lease, alarm and access control, waste and\
  \ recycling}\",\n    \"records\": \"${records:4 cabinets of paper contracts and\
  \ HR files}\"\n  },\n  \"instructions\": [\n    \"Ask up to 6 short questions about\
  \ anything above that is missing or unclear (for example lease dates, landlord fit-out\
  \ rules, internet lead times or who signs contracts), then wait for my answers before\
  \ producing the plan.\",\n    \"Produce the plan as one valid JSON object that follows\
  \ output_schema exactly, with no text before or after it.\",\n    \"Work backwards\
  \ from the move date. Put long lead-time items first: internet line and building\
  \ access to the network (often 6-12 weeks), landlord approvals for fit-out, furniture\
  \ delivery times, mover booking and lease notice periods.\",\n    \"Plan the IT\
  \ cutover so the business keeps running: the new internet line live and tested at\
  \ least one week before the move, a network and Wi-Fi plan, a labelled move of the\
  \ server rack or a decision to move it to the cloud, phone number porting, printers,\
  \ and a rollback if the new connection fails on day one.\",\n    \"Plan the space\
  \ with real numbers: desks needed from attendance data plus a buffer, meeting rooms,\
  \ focus and quiet spaces, accessibility, storage and the kitchen. Flag where the\
  \ plan does not fit the floor area.\",\n    \"Include people and communication:\
  \ a first announcement with reasons, a FAQ, a commute impact check, a chance to\
  \ give input on the layout, packing instructions, a moving-day schedule and a first-week\
  \ welcome.\",\n    \"Cover the old office: notice to the landlord, the condition\
  \ the lease requires on handover (repairs, painting, removing cabling), final meter\
  \ readings, cancelling or moving every contract and address change for mail, bank,\
  \ suppliers, website and official registers.\",\n    \"Build a budget with categories,\
  \ estimates, a contingency of at least 10 percent and the decision owner per line.\
  \ Never invent quotes; mark every number as an estimate to confirm.\",\n    \"List\
  \ the top risks with likelihood, impact, an early warning sign and a fallback, and\
  \ include the data protection steps for moving paper HR records and disposing of\
  \ old drives safely.\",\n    \"Keep every task concrete: an owner, a start and due\
  \ date, dependencies and a done-when check.\"\n  ],\n  \"output_schema\": {\n  \
  \  \"summary\": {\n      \"move_date\": \"string\",\n      \"headline_plan\": \"\
  string (3-4 sentences)\",\n      \"critical_path\": [\"string (ordered milestones\
  \ that set the date)\"],\n      \"go_no_go_date\": \"string (date and criteria to\
  \ confirm or postpone the move)\"\n    },\n    \"timeline\": [\n      {\n      \
  \  \"phase\": \"string (e.g. decide, prepare, build out, pack, move, settle in,\
  \ hand back)\",\n        \"weeks_before_move\": \"string (e.g. 12-8)\",\n      \
  \  \"tasks\": [\n          {\n            \"task\": \"string\",\n            \"\
  owner\": \"string\",\n            \"start\": \"YYYY-MM-DD\",\n            \"due\"\
  : \"YYYY-MM-DD\",\n            \"depends_on\": [\"string\"],\n            \"done_when\"\
  : \"string\"\n          }\n        ]\n      }\n    ],\n    \"space_plan\": {\n \
  \     \"desks\": \"number\",\n      \"desk_calculation\": \"string\",\n      \"\
  meeting_rooms\": [\"string (name, seats, equipment)\"],\n      \"quiet_and_wellbeing_spaces\"\
  : [\"string\"],\n      \"accessibility_checks\": [\"string\"],\n      \"fit_issues\"\
  : [\"string\"]\n    },\n    \"it_cutover\": {\n      \"internet_and_network\": [\"\
  string\"],\n      \"phones_and_numbers\": [\"string\"],\n      \"server_and_storage\"\
  : [\"string\"],\n      \"test_plan_before_move\": [\"string\"],\n      \"move_day_steps\"\
  : [\"string (in order, with times)\"],\n      \"rollback\": \"string\"\n    },\n\
  \    \"movers_and_furniture\": {\n      \"keep_sell_donate_recycle\": [{\"item\"\
  : \"string\", \"decision\": \"keep | sell | donate | recycle | dispose\", \"notes\"\
  : \"string\"}],\n      \"new_purchases\": [{\"item\": \"string\", \"quantity\":\
  \ \"number\", \"lead_time_weeks\": \"number\"}],\n      \"mover_brief\": [\"string\
  \ (labels, crate count, lifts, parking, insurance, access times)\"]\n    },\n  \
  \  \"people_and_communication\": [\n      {\n        \"when\": \"string\",\n   \
  \     \"audience\": \"string\",\n        \"channel\": \"string\",\n        \"message\"\
  : \"string (ready-to-send draft, under 120 words)\"\n      }\n    ],\n    \"contracts_and_admin\"\
  : [\n      {\n        \"item\": \"string\",\n        \"action\": \"cancel | transfer\
  \ | new | update address\",\n        \"notice_period\": \"string\",\n        \"\
  owner\": \"string\",\n        \"due\": \"YYYY-MM-DD\"\n      }\n    ],\n    \"old_office_handover\"\
  : [\"string (lease conditions, repairs, cleaning, meter readings, key return, deposit)\"\
  ],\n    \"budget\": [\n      {\"category\": \"string\", \"estimate\": \"number\"\
  , \"currency\": \"string\", \"owner\": \"string\", \"status\": \"estimate | quoted\
  \ | approved\"}\n    ],\n    \"budget_total\": {\"estimate\": \"number\", \"contingency\"\
  : \"number\", \"total\": \"number\", \"within_budget\": \"boolean\"},\n    \"risks\"\
  : [\n      {\"risk\": \"string\", \"likelihood\": \"low | medium | high\", \"impact\"\
  : \"low | medium | high\", \"early_warning\": \"string\", \"fallback\": \"string\"\
  }\n    ],\n    \"moving_week_runbook\": [\n      {\"day\": \"string\", \"time\"\
  : \"HH:MM\", \"step\": \"string\", \"owner\": \"string\"}\n    ],\n    \"first_week_after\"\
  : [\"string (snag list, feedback survey, fixes, welcome)\"],\n    \"open_questions\"\
  : [\"string\"]\n  }\n}"
