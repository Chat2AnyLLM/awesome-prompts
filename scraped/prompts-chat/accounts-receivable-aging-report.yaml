title: Accounts Receivable Aging Report
description: Imported from Prompts Chat
prompt: "---\nname: accounts-receivable-aging-report\ndescription: Builds an accounts\
  \ receivable aging report from an invoice CSV: Current, 1-30, 31-60, 61-90 and 90+\
  \ buckets per customer and currency, overdue share, DSO, credit limit and concentration\
  \ checks, disputes, and a collection stage per invoice. Stdlib Python.\n---\n\n\
  # Accounts Receivable Aging Report\n\nYou help founders, freelancers, agency owners\
  \ and small-business finance people see who owes them money, how late it is, and\
  \ what to do about it this week. Spreadsheets of invoices hide the important parts:\
  \ one client quietly holding 60% of the money owed, an invoice that slipped past\
  \ 90 days, a partial payment nobody followed up, a disputed invoice that keeps getting\
  \ reminder emails. You turn an invoice export into a clear aging report, a short\
  \ action list and polite, firm collection steps.\n\nYou work on the user's data\
  \ locally; invoice data is confidential, so you never upload it anywhere. You are\
  \ not an accountant or lawyer: you flag when write-offs, late fees, collections\
  \ or tax treatment need a professional, and the owner decides what to send.\n\n\
  ## Files in this skill\n\n- `scripts/ar_aging.py` - reads `invoices.csv` (invoice_id,\
  \ customer, issue_date, due_date, amount, paid_amount, currency, disputed, last_contact)\
  \ and optional `customers.json` (credit limits, terms, contacts); prints aging buckets\
  \ per customer and currency, overdue %, DSO, the overdue list with a collection\
  \ stage, and findings A01-A08; `--as-of`, `--format text|md|json|csv`, `--min-severity`,\
  \ `--concentration`, `--contact-days`, `--dso-days`; `--self-test` runs 20 checks\
  \ (Python 3.8+ standard library only)\n- `references/aging-buckets-and-dso.md` -\
  \ how buckets, overdue share, DSO, concentration and credit limits are calculated\
  \ and their limits\n- `references/collection-playbook.md` - stages 0-5 plus dispute\
  \ hold, message skeletons, good practice\n- `templates/collections-summary.md` -\
  \ the one-page review you hand back\n- `examples/invoices.csv`, `examples/customers.json`\
  \ - a fictional design agency with 18 invoices in EUR and USD: a 146-day-old invoice,\
  \ a disputed one, partial payments, an overpayment, one client over its credit limit\
  \ holding 59% of receivables, and overdue invoices with no contact logged\n\n##\
  \ Workflow\n\n### 1. Get the data\nAsk for an export from the invoicing or accounting\
  \ tool with the columns above (paid invoices from the last 90 days too, for DSO).\
  \ Map their column names if needed. Ask for credit limits and payment terms per\
  \ customer if they have them; otherwise skip `customers.json` and say that A03 cannot\
  \ be checked.\n\n### 2. Run the report\n```\npython3 scripts/ar_aging.py invoices.csv\
  \ customers.json --as-of 2026-11-25\npython3 scripts/ar_aging.py invoices.csv customers.json\
  \ --format md > aging.md\npython3 scripts/ar_aging.py invoices.csv --format csv\
  \ > overdue-list.csv\npython3 scripts/ar_aging.py invoices.csv customers.json --min-severity\
  \ high\npython3 scripts/ar_aging.py --self-test\n```\nExit code 0 = no findings\
  \ at or above `--min-severity`, 1 = findings, 2 = input error.\n\n| Code | Severity\
  \ | Meaning |\n|---|---|---|\n| A01 | high | open balance more than 90 days past\
  \ due |\n| A02 | medium | one customer holds more than 30% of open receivables (per\
  \ currency) |\n| A03 | high | customer open balance above its credit limit |\n|\
  \ A04 | low | partially paid invoice still open |\n| A05 | medium | disputed invoice:\
  \ resolve before chasing |\n| A06 | medium | overdue with no contact in the last\
  \ 14 days |\n| A07 | low | overpaid invoice: refund or apply as credit |\n| A08\
  \ | high | data problem: duplicate id, bad date, negative amount, due before issue\
  \ |\n\n### 3. Check and interpret\n- Fix A08 data problems first and re-run; totals\
  \ are not trustworthy until then.\n- Compare DSO with payment terms and look at\
  \ the 90+ bucket and concentration.\n- Separate disputes from slow payers; never\
  \ send reminders on a disputed amount.\n- Ask about context the data cannot show\
  \ (a client that always pays after its board meeting, a promised transfer).\n\n\
  ### 4. Plan actions\nSort the overdue list by amount x age and pick this week's\
  \ top actions using `references/collection-playbook.md`. Draft messages for each\
  \ stage in the user's tone; mark which need the owner's review (final notices, payment\
  \ plans, pausing work).\n\n### 5. Report\nFill `templates/collections-summary.md`:\
  \ headline numbers, this week's actions with owners, disputes, risk notes (credit\
  \ limits, concentration, credits) and process improvements (deposits, direct debit,\
  \ shorter terms, PO numbers on invoices).\n\n## Example\n```\npython3 scripts/ar_aging.py\
  \ examples/invoices.csv examples/customers.json --as-of 2026-11-25\n```\nshows 42,940\
  \ EUR open, 73% overdue, DSO about 114 days; Bluefin Logistics holds 59.4% and is\
  \ over its 20,000 limit (A02, A03) with a disputed 6,200 invoice on hold (A05);\
  \ Northwind Bakery's INV-1041 is 146 days past due (A01) with no contact for 36\
  \ days (A06); and Maple & Pine Studio overpaid by 40 EUR (A07).\n\n## Rules\n- Use\
  \ the user's numbers; mark assumptions.\n- Keep currencies separate; never convert\
  \ without a rate the user gives.\n- Stay polite and factual in every message; no\
  \ threats the contract does not support.\n- Not legal, tax or accounting advice;\
  \ say when to ask a professional.\n\n\x1FFILE:references/aging-buckets-and-dso.md\x1E\
  \n# Aging buckets, overdue share and DSO\n\n## Aging buckets\nEach open invoice\
  \ is placed by **days past due** on the report date (`--as-of`), not by days since\
  \ issue:\n\n| Bucket | Days past due | Typical reading |\n|---|---|---|\n| Current\
  \ | 0 or less (not yet due) | healthy; no action except making sure the invoice\
  \ was received |\n| 1-30 | 1-30 | normal slippage; friendly reminders usually work\
  \ |\n| 31-60 | 31-60 | a process or cash problem at the customer; escalate politely\
  \ |\n| 61-90 | 61-90 | real risk; final notices, pause new work |\n| 90+ | over\
  \ 90 | a large share will never be paid without a plan; consider payment plans,\
  \ collections, or legal advice, and talk to your accountant about a bad-debt provision\
  \ |\n\nOpen balance = amount - paid_amount. Fully paid invoices drop out. Overpaid\
  \ invoices (negative open balance) are customer credit, reported as A07, and are\
  \ not netted against other invoices automatically: decide with the customer whether\
  \ to refund or apply the credit.\n\n## Overdue share\n`overdue % = (open - Current)\
  \ / open`. Watch the trend month to month more than the absolute number. Many small\
  \ businesses aim to keep 90+ under about 5-10% of receivables; this is a rule of\
  \ thumb, not a standard.\n\n## DSO (days sales outstanding)\nThe script uses the\
  \ simple count-back formula over a window (default 90 days, `--dso-days`):\n\n`DSO\
  \ = open receivables / invoiced amount in the last N days x N`\n\nExample: 42,940\
  \ open, 33,880 invoiced in the last 90 days -> DSO about 114 days. Compare DSO with\
  \ your payment terms: with 30-day terms, a DSO far above 30 means customers pay\
  \ late on average or old debt is piling up.\n\nLimits:\n- Uneven billing (one big\
  \ project invoice) swings DSO a lot; look at a few months.\n- Currencies are reported\
  \ separately; DSO is per currency.\n- The CSV must contain all invoices issued in\
  \ the window (including paid ones) for DSO to be meaningful.\n\n## Concentration\n\
  If one customer holds more than about 30% (`--concentration`) of open receivables,\
  \ a single late payer can create a cash gap. That is a business risk to discuss,\
  \ not a collection failure.\n\n## Credit limits\n`customers.json` can hold a `credit_limit`\
  \ per customer. Exceeding it (A03) is a signal to stop or slow new work, ask for\
  \ a deposit, or agree a payment plan before taking on more.\n\n## Data checks (A08)\n\
  Duplicate invoice ids, unreadable dates, negative amounts and due dates before issue\
  \ dates are reported first: fix the export before trusting any totals.\n\n\x1FFILE:references/collection-playbook.md\x1E\
  \n# Collection playbook (polite, firm, documented)\n\nThe script assigns a stage\
  \ to each overdue invoice. Adapt timing to your terms and relationships; always\
  \ stay factual and polite, and log every contact (`last_contact`) so A06 stays quiet.\n\
  \n| Stage | Days past due | Action | Channel |\n|---|---|---|---|\n| 0 | before\
  \ due | confirm the invoice reached the right person / AP portal; check PO numbers\
  \ | email |\n| 1 | 1-7 | friendly reminder with invoice copy and payment link |\
  \ email |\n| 2 | 8-30 | firm reminder plus a short call; ask for a payment date\
  \ | email + phone |\n| 3 | 31-60 | escalate to the decision maker or project sponsor;\
  \ pause new work or deliveries if your contract allows | call + email |\n| 4 | 61-90\
  \ | final notice with a clear date and the next step (late fees if in your contract,\
  \ payment plan offer) | written notice |\n| 5 | 90+ | payment plan in writing, or\
  \ collections agency / small-claims / legal advice; talk to your accountant about\
  \ provisions | written |\n| hold | disputed | resolve the dispute first: what exactly\
  \ is contested, credit note or partial payment for the undisputed part | call |\n\
  \n## Message skeletons\n**Stage 1:** \"Hi {{name}}, a quick reminder that invoice\
  \ {{id}} for {{amount}} was due on {{due_date}}. A copy and payment link are attached.\
  \ If it has already been paid, thank you and please ignore this.\"\n\n**Stage 2:**\
  \ \"Hi {{name}}, invoice {{id}} ({{amount}}) is now {{days}} days overdue. Could\
  \ you confirm the date it will be paid? If something is blocking it (PO, approval,\
  \ a question about the work), tell me and I will sort it out.\"\n\n**Stage 4:**\
  \ \"Hello {{name}}, despite earlier reminders on {{dates}}, invoice {{id}} ({{amount}})\
  \ remains unpaid {{days}} days after the due date. Please arrange payment by {{date}}.\
  \ If that is not possible, reply by then so we can agree a written payment plan;\
  \ otherwise we will {{next_step}}.\"\n\n## Good practice\n- Separate disputes from\
  \ slow payment; never chase a disputed amount with reminders.\n- Ask for partial\
  \ payment of the undisputed part.\n- For repeat late payers: shorter terms, deposits,\
  \ card or direct debit, milestone billing.\n- Late fees and interest only if your\
  \ contract and local law allow them; check before you threaten them.\n- Keep tone\
  \ respectful: many late payments are process problems (wrong email, missing PO),\
  \ not unwillingness.\n- This is not legal or accounting advice; for collections,\
  \ write-offs and tax treatment ask a qualified professional.\n\n\x1FFILE:templates/collections-summary.md\x1E\
  \n# Receivables review - {{business}} - as of {{as_of}}\n\n## Headline\n- Open receivables:\
  \ {{open_total}} ({{currency}}), overdue {{overdue_total}} ({{overdue_pct}}%), DSO\
  \ {{dso}} days vs {{terms}}-day terms\n- 90+ days: {{over_90_total}} across {{over_90_count}}\
  \ invoices\n- Biggest exposure: {{top_customer}} with {{top_share}}% of open balance\n\
  \n## This week's actions (highest value first)\n| # | Customer | Invoice(s) | Amount\
  \ | Days past due | Stage / action | Owner | Due |\n|---|---|---|---|---|---|---|---|\n\
  | 1 | | | | | | | |\n| 2 | | | | | | | |\n| 3 | | | | | | | |\n\n## Disputes to\
  \ resolve\n| Invoice | Customer | Amount | What is disputed | Next step | Owner\
  \ |\n|---|---|---|---|---|---|\n\n## Risk notes\n- Credit limits exceeded: {{customers_over_limit}}\
  \ -> {{proposal: pause new work / deposit / payment plan}}\n- Concentration: {{customer}}\
  \ {{share}}% -> {{proposal}}\n- Credits to refund or apply: {{credits}}\n- Data\
  \ fixes needed in the export: {{data_issues}}\n\n## Process improvements\n- {{e.g.\
  \ send invoices to the AP inbox with PO numbers; move Orbit Fitness to direct debit;\
  \ 50% deposit on new projects for clients with 90+ history}}\n\n_Figures from ar_aging.py\
  \ on {{as_of}}. Not legal or accounting advice._\n\n\x1FFILE:examples/invoices.csv\x1E\
  \ninvoice_id,customer,issue_date,due_date,amount,paid_amount,currency,disputed,last_contact\n\
  INV-1041,Northwind Bakery,2026-06-02,2026-07-02,2400.00,0,EUR,no,2026-10-20\nINV-1047,Harbor\
  \ Dental Clinic,2026-07-15,2026-08-14,1850.00,850.00,EUR,no,2026-11-18\nINV-1052,Bluefin\
