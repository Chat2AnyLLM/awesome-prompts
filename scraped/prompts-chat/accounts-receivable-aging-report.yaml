  \ Bakery,2026-08-20,2026-09-19,1200.00,0,EUR,no,2026-10-20\nINV-1058,Maple & Pine\
  \ Studio,2026-09-01,2026-10-01,980.00,980.00,EUR,no,\nINV-1060,Bluefin Logistics,2026-09-10,2026-10-10,7400.00,0,EUR,no,\n\
  INV-1063,Greenleaf Co-op,2026-09-22,2026-10-22,1500.00,0,EUR,no,2026-11-21\nINV-1064,Harbor\
  \ Dental Clinic,2026-10-01,2026-10-31,1850.00,0,EUR,no,2026-11-18\nINV-1066,Orbit\
  \ Fitness,2026-10-03,2026-11-02,3200.00,0,EUR,no,\nINV-1067,Maple & Pine Studio,2026-10-06,2026-11-05,760.00,800.00,EUR,no,\n\
  INV-1069,Bluefin Logistics,2026-10-15,2026-11-14,5100.00,0,EUR,no,2026-11-19\nINV-1070,Greenleaf\
  \ Co-op,2026-10-20,2026-11-19,1500.00,0,EUR,no,\nINV-1072,Orbit Fitness,2026-11-01,2026-12-01,3200.00,0,EUR,no,\n\
  INV-1073,Northwind Bakery,2026-11-05,2026-12-05,950.00,0,EUR,no,\nINV-1074,Bluefin\
  \ Logistics,2026-11-10,2026-12-10,6800.00,0,EUR,no,\nINV-1075,Lakeside Hostel,2026-11-12,2026-11-26,640.00,0,EUR,no,\n\
  INV-1076,Atlas Outdoor Inc,2026-09-15,2026-10-15,4500.00,2000.00,USD,no,2026-11-03\n\
  INV-1077,Atlas Outdoor Inc,2026-11-15,2026-12-15,4500.00,0,USD,no,\n\n\x1FFILE:examples/customers.json\x1E\
  \n{\n  \"default_terms_days\": 30,\n  \"note\": \"Fictional clients of a small design\
  \ and web agency. Credit limits are what the agency is willing to have open per\
  \ client.\",\n  \"customers\": {\n    \"Northwind Bakery\": {\"credit_limit\": 5000,\
  \ \"terms_days\": 30, \"contact\": \"owner, prefers phone\"},\n    \"Harbor Dental\
  \ Clinic\": {\"credit_limit\": 4000, \"terms_days\": 30, \"contact\": \"practice\
  \ manager\"},\n    \"Bluefin Logistics\": {\"credit_limit\": 20000, \"terms_days\"\
  : 30, \"contact\": \"accounts payable inbox + project sponsor\"},\n    \"Maple &\
  \ Pine Studio\": {\"credit_limit\": 3000, \"terms_days\": 30, \"contact\": \"founder\"\
  },\n    \"Greenleaf Co-op\": {\"credit_limit\": 4000, \"terms_days\": 30, \"contact\"\
  : \"treasurer, pays after monthly board meeting\"},\n    \"Orbit Fitness\": {\"\
  credit_limit\": 6000, \"terms_days\": 30, \"contact\": \"finance lead\"},\n    \"\
  Lakeside Hostel\": {\"credit_limit\": 2000, \"terms_days\": 14, \"contact\": \"\
  manager\"},\n    \"Atlas Outdoor Inc\": {\"credit_limit\": 8000, \"terms_days\"\
  : 30, \"contact\": \"AP portal, PO required\"}\n  }\n}\n\n\x1FFILE:scripts/ar_aging.py\x1E\
  \n#!/usr/bin/env python3\n\"\"\"ar_aging.py - accounts receivable aging report from\
  \ an invoice CSV (standard library only, Python 3.8+).\n\ninvoices.csv columns (header\
  \ required; extra columns ignored):\n  invoice_id, customer, issue_date, due_date,\
  \ amount, paid_amount, currency,\n  disputed (yes/no, optional), last_contact (YYYY-MM-DD,\
  \ optional)\ncustomers.json (optional): {\"default_terms_days\": 30, \"customers\"\
  : {\"Name\": {\"credit_limit\": 10000, \"terms_days\": 30, \"contact\": \"...\"\
  }}}\n\nReport: open balance per invoice, aging buckets by days past due as of --as-of\n\
  (Current, 1-30, 31-60, 61-90, 90+), totals per customer and currency, % overdue,\n\
  approximate DSO (open balance / sales in the last --dso-days days x --dso-days),\n\
  a collection stage per overdue invoice, and findings:\n  A01 high    open balance\
  \ more than 90 days past due\n  A02 medium  one customer holds more than --concentration\
  \ % (default 30) of the open balance\n  A03 high    customer open balance above\
  \ its credit_limit\n  A04 low     partially paid invoice still open\n  A05 medium\
  \  disputed invoice (excluded from reminders, needs resolution)\n  A06 medium  overdue\
  \ with no contact logged in the last --contact-days (default 14)\n  A07 low    \
  \ overpaid invoice (customer credit to refund or apply)\n  A08 high    data problem\
  \ (bad date, negative amount, due before issue, duplicate id)\nUsage: ar_aging.py\
  \ invoices.csv [customers.json] [--as-of YYYY-MM-DD] [--format text|md|json|csv]\n\
  \                   [--min-severity low|medium|high] [--concentration PCT] [--contact-days\
  \ N] [--dso-days N]\n       ar_aging.py --self-test\nExit: 0 no findings at or above\
  \ --min-severity, 1 findings, 2 usage/input error.\n\"\"\"\nimport argparse, csv,\
  \ datetime as dt, io, json, sys\nfrom collections import OrderedDict, defaultdict\n\
  \nBUCKETS = [\"Current\", \"1-30\", \"31-60\", \"61-90\", \"90+\"]\nSEV = {\"low\"\
  : 1, \"medium\": 2, \"high\": 3}\n\n\ndef bucket(days_past_due):\n    if days_past_due\
  \ <= 0: return \"Current\"\n    if days_past_due <= 30: return \"1-30\"\n    if\
  \ days_past_due <= 60: return \"31-60\"\n    if days_past_due <= 90: return \"61-90\"\
  \n    return \"90+\"\n\n\ndef stage(days_past_due, disputed):\n    if disputed:\
  \ return \"hold: resolve dispute first\"\n    if days_past_due <= 0: return \"none\
  \ (not due)\"\n    if days_past_due <= 7: return \"1 friendly reminder\"\n    if\
  \ days_past_due <= 30: return \"2 firm reminder + call\"\n    if days_past_due <=\
  \ 60: return \"3 escalate to decision maker, pause new work\"\n    if days_past_due\
  \ <= 90: return \"4 final notice with date\"\n    return \"5 payment plan or collections/legal\
  \ review\"\n\n\ndef parse_date(s):\n    return dt.datetime.strptime(s.strip(), \"\
  %Y-%m-%d\").date()\n\n\ndef money(s):\n    s = (s or \"\").strip().replace(\",\"\
  , \"\")\n    return round(float(s), 2) if s else 0.0\n\n\ndef load_invoices(text):\n\
  \    rows, problems, seen = [], [], set()\n    reader = csv.DictReader(io.StringIO(text))\n\
  \    need = {\"invoice_id\", \"customer\", \"issue_date\", \"due_date\", \"amount\"\
  }\n    if not reader.fieldnames or not need <= {f.strip() for f in reader.fieldnames}:\n\
  \        raise ValueError(\"invoices.csv needs columns: \" + \", \".join(sorted(need)))\n\
  \    for n, r in enumerate(reader, 2):\n        r = {k.strip(): (v or \"\").strip()\
  \ for k, v in r.items() if k}\n        iid = r[\"invoice_id\"]\n        try:\n \
  \           issue, due = parse_date(r[\"issue_date\"]), parse_date(r[\"due_date\"\
  ])\n            amount, paid = money(r[\"amount\"]), money(r.get(\"paid_amount\"\
  ))\n            last = parse_date(r[\"last_contact\"]) if r.get(\"last_contact\"\
  ) else None\n        except ValueError as e:\n            problems.append((iid or\
  \ \"line %d\" % n, \"line %d: %s\" % (n, e))); continue\n        if iid in seen:\n\
  \            problems.append((iid, \"duplicate invoice_id %s (line %d skipped)\"\
  \ % (iid, n))); continue\n        seen.add(iid)\n        if amount < 0 or paid <\
  \ 0:\n            problems.append((iid, \"negative amount on line %d\" % n)); continue\n\
  \        if due < issue:\n            problems.append((iid, \"due_date before issue_date\
  \ on line %d\" % n))\n        rows.append(dict(invoice_id=iid, customer=r[\"customer\"\
  ], issue=issue, due=due, amount=amount, paid=paid,\n                         currency=r.get(\"\
  currency\") or \"EUR\", disputed=r.get(\"disputed\", \"\").lower() in (\"yes\",\
  \ \"y\", \"true\", \"1\"),\n                         last_contact=last))\n    return\
  \ rows, problems\n\n\ndef analyze(rows, problems, customers, o):\n    as_of = o.as_of\n\
  \    inv, findings = [], []\n    def add(code, sev, ref, msg): findings.append(dict(code=code,\
  \ severity=sev, ref=ref, message=msg))\n    for ref, msg in problems: add(\"A08\"\
  , \"high\", ref, msg)\n    for r in rows:\n        open_bal = round(r[\"amount\"\
  ] - r[\"paid\"], 2)\n        dpd = (as_of - r[\"due\"]).days\n        rec = dict(r,\
  \ open=open_bal, days_past_due=dpd, bucket=bucket(dpd) if open_bal > 0 else \"-\"\
  , stage=stage(dpd, r[\"disputed\"]) if open_bal > 0 else \"-\")\n        inv.append(rec)\n\
  \        if open_bal < 0:\n            add(\"A07\", \"low\", r[\"invoice_id\"],\
  \ \"%s overpaid by %.2f %s: refund or apply as credit\" % (r[\"customer\"], -open_bal,\
  \ r[\"currency\"]))\n            continue\n        if open_bal == 0: continue\n\
  \        if r[\"paid\"] > 0:\n            add(\"A04\", \"low\", r[\"invoice_id\"\
  ], \"partially paid: %.2f of %.2f %s still open\" % (open_bal, r[\"amount\"], r[\"\
  currency\"]))\n        if r[\"disputed\"]:\n            add(\"A05\", \"medium\"\
  , r[\"invoice_id\"], \"disputed (%.2f %s, %d days past due): resolve before chasing\"\
  \ % (open_bal, r[\"currency\"], max(dpd, 0)))\n        if dpd > 90:\n          \
  \  add(\"A01\", \"high\", r[\"invoice_id\"], \"%s: %.2f %s is %d days past due\"\
  \ % (r[\"customer\"], open_bal, r[\"currency\"], dpd))\n        if dpd > 0 and not\
  \ r[\"disputed\"]:\n            since = (as_of - r[\"last_contact\"]).days if r[\"\
  last_contact\"] else None\n            if since is None or since > o.contact_days:\n\
  \                add(\"A06\", \"medium\", r[\"invoice_id\"], \"%d days overdue,\
  \ %s\" % (dpd, \"no contact logged\" if since is None else \"last contact %d days\
  \ ago\" % since))\n    # per currency summaries\n    by_cur = OrderedDict()\n  \
  \  for r in inv:\n        if r[\"open\"] <= 0: continue\n        c = by_cur.setdefault(r[\"\
  currency\"], dict(total=0.0, buckets={b: 0.0 for b in BUCKETS}, customers=defaultdict(lambda:\
  \ {b: 0.0 for b in BUCKETS})))\n        c[\"total\"] += r[\"open\"]; c[\"buckets\"\
  ][r[\"bucket\"]] += r[\"open\"]; c[\"customers\"][r[\"customer\"]][r[\"bucket\"\
  ]] += r[\"open\"]\n    summaries = OrderedDict()\n    for cur, c in by_cur.items():\n\
  \        total = round(c[\"total\"], 2)\n        overdue = round(total - c[\"buckets\"\
  ][\"Current\"], 2)\n        sales = sum(r[\"amount\"] for r in inv if r[\"currency\"\
  ] == cur and 0 <= (as_of - r[\"issue\"]).days < o.dso_days)\n        dso = round(total\
  \ / sales * o.dso_days, 1) if sales else None\n        custs = []\n        for name,\
  \ b in c[\"customers\"].items():\n            ct = round(sum(b.values()), 2)\n \
  \           custs.append(dict(customer=name, total=ct, buckets={k: round(v, 2) for\
  \ k, v in b.items()}, share_pct=round(100 * ct / total, 1) if total else 0))\n \
  \           if total and 100 * ct / total > o.concentration and len(c[\"customers\"\
  ]) > 1:\n                add(\"A02\", \"medium\", name, \"holds %.1f%% of open %s\
  \ receivables (%.2f)\" % (100 * ct / total, cur, ct))\n            lim = (customers.get(\"\
  customers\", {}).get(name) or {}).get(\"credit_limit\")\n            if lim is not\
  \ None and ct > lim:\n                add(\"A03\", \"high\", name, \"open balance\
  \ %.2f %s exceeds credit limit %.2f\" % (ct, cur, lim))\n        custs.sort(key=lambda\
  \ x: -x[\"total\"])\n        summaries[cur] = dict(total=total, overdue=overdue,\
  \ overdue_pct=round(100 * overdue / total, 1) if total else 0,\n               \
  \               buckets={k: round(v, 2) for k, v in c[\"buckets\"].items()}, dso=dso,\
  \ customers=custs)\n    order = {\"high\": 0, \"medium\": 1, \"low\": 2}\n    findings.sort(key=lambda\
  \ f: (order[f[\"severity\"]], f[\"code\"], f[\"ref\"]))\n    return inv, summaries,\
  \ findings\n\n\ndef render(inv, summaries, findings, o):\n    minsev = SEV[o.min_severity]\n\
  \    shown = [f for f in findings if SEV[f[\"severity\"]] >= minsev]\n    if o.format\
  \ == \"json\":\n        def ser(r): return {k: (v.isoformat() if isinstance(v, dt.date)\
  \ else v) for k, v in r.items()}\n        return json.dumps(dict(as_of=o.as_of.isoformat(),\
  \ summaries=summaries, invoices=[ser(r) for r in inv if r[\"open\"] != 0], findings=shown),\
  \ indent=2)\n    if o.format == \"csv\":\n        out = io.StringIO(); w = csv.writer(out)\n\
  \        w.writerow([\"invoice_id\", \"customer\", \"currency\", \"due_date\", \"\
  days_past_due\", \"bucket\", \"open\", \"disputed\", \"stage\"])\n        for r\
  \ in sorted(inv, key=lambda r: -r[\"days_past_due\"]):\n            if r[\"open\"\
  ] > 0: w.writerow([r[\"invoice_id\"], r[\"customer\"], r[\"currency\"], r[\"due\"\
  ].isoformat(), r[\"days_past_due\"], r[\"bucket\"], \"%.2f\" % r[\"open\"], \"yes\"\
  \ if r[\"disputed\"] else \"no\", r[\"stage\"]])\n        return out.getvalue().rstrip(\"\
  \\n\")\n    md = o.format == \"md\"\n    L = [\"# AR aging as of %s\" % o.as_of\
  \ if md else \"AR aging as of %s\" % o.as_of, \"\"]\n    for cur, s in summaries.items():\n\
  \        L.append((\"## %s: open %.2f, overdue %.2f (%.1f%%), DSO %s\" if md else\
  \ \"%s: open %.2f, overdue %.2f (%.1f%%), DSO %s\") % (cur, s[\"total\"], s[\"overdue\"\
  ], s[\"overdue_pct\"], \"%.1f days\" % s[\"dso\"] if s[\"dso\"] is not None else\
  \ \"n/a\"))\n        L.append(\"\")\n        hdr = [\"Customer\"] + BUCKETS + [\"\
  Total\", \"Share\"]\n        if md:\n            L.append(\"| \" + \" | \".join(hdr)\
  \ + \" |\"); L.append(\"|\" + \"---|\" * len(hdr))\n        else:\n            L.append(\"\
  %-22s\" % hdr[0] + \"\".join(\"%11s\" % h for h in hdr[1:]))\n        rows = s[\"\
  customers\"] + [dict(customer=\"TOTAL\", total=s[\"total\"], buckets=s[\"buckets\"\
  ], share_pct=100.0)]\n        for c in rows:\n            vals = [\"%.2f\" % c[\"\
  buckets\"][b] for b in BUCKETS] + [\"%.2f\" % c[\"total\"], \"%.1f%%\" % c[\"share_pct\"\
  ]]\n            L.append(\"| \" + \" | \".join([c[\"customer\"]] + vals) + \" |\"\
  \ if md else \"%-22s\" % c[\"customer\"][:22] + \"\".join(\"%11s\" % v for v in\
  \ vals))\n        L.append(\"\")\n    L.append(\"## Overdue invoices and next step\"\
  \ if md else \"Overdue invoices and next step:\")\n    od = sorted([r for r in inv\
  \ if r[\"open\"] > 0 and r[\"days_past_due\"] > 0], key=lambda r: -r[\"days_past_due\"\
  ])\n    for r in od:\n        L.append(\"%s %s %s %.2f %s, %d days past due -> %s\"\
  \ % (\"-\" if md else \" \", r[\"invoice_id\"], r[\"customer\"], r[\"open\"], r[\"\
  currency\"], r[\"days_past_due\"], r[\"stage\"]))\n    if not od: L.append(\"  none\"\
  )\n    L.append(\"\")\n    L.append((\"## Findings (%s+)\" if md else \"Findings\
  \ (%s+):\") % o.min_severity)\n    for f in shown:\n        L.append(\"%s [%s] %s\
  \ %s: %s\" % (\"-\" if md else \" \", f[\"severity\"].upper(), f[\"code\"], f[\"\
  ref\"], f[\"message\"]))\n    if not shown: L.append(\"  none\")\n    return \"\\\
  n\".join(L)\n\n\ndef parser():\n    p = argparse.ArgumentParser(description=\"Accounts\
  \ receivable aging report.\")\n    p.add_argument(\"invoices\", nargs=\"?\")\n \
  \   p.add_argument(\"customers\", nargs=\"?\")\n    p.add_argument(\"--as-of\",\
  \ type=parse_date, default=dt.date.today())\n    p.add_argument(\"--format\", choices=[\"\
  text\", \"md\", \"json\", \"csv\"], default=\"text\")\n    p.add_argument(\"--min-severity\"\
  , choices=list(SEV), default=\"low\")\n    p.add_argument(\"--concentration\", type=float,\
  \ default=30.0)\n    p.add_argument(\"--contact-days\", type=int, default=14)\n\
  \    p.add_argument(\"--dso-days\", type=int, default=90)\n    p.add_argument(\"\
  --self-test\", action=\"store_true\")\n    return p\n\n\ndef self_test():\n    o\
  \ = parser().parse_args([\"--as-of\", \"2026-06-30\"])\n    H = \"invoice_id,customer,issue_date,due_date,amount,paid_amount,currency,disputed,last_contact\\\
  n\"\n    checks = []\n    def check(n, c): checks.append((n, bool(c)))\n    def\
  \ run(body, cust=None, **kw):\n        oo = parser().parse_args([\"--as-of\", \"\
  2026-06-30\"]); [setattr(oo, k, v) for k, v in kw.items()]\n        rows, probs\
  \ = load_invoices(H + body)\n        return analyze(rows, probs, cust or {}, oo)\n\
  \    codes = lambda f: sorted({x[\"code\"] for x in f})\n    check(\"bucket edges\"\
  , [bucket(d) for d in (0, 1, 30, 31, 60, 61, 90, 91)] == [\"Current\", \"1-30\"\
  , \"1-30\", \"31-60\", \"31-60\", \"61-90\", \"61-90\", \"90+\"])\n    inv, s, f\
  \ = run(\"I1,Acme,2026-06-01,2026-07-01,1000,0,EUR,,\\n\")\n    check(\"not yet\
  \ due is Current, no findings\", inv[0][\"bucket\"] == \"Current\" and f == [])\n\
  \    inv, s, f = run(\"I1,Acme,2026-05-01,2026-05-31,1000,0,EUR,,2026-06-25\\n\"\
  )\n    check(\"30 days past due in 1-30 with recent contact\", inv[0][\"bucket\"\
  ] == \"1-30\" and f == [])\n    inv, s, f = run(\"I1,Acme,2026-01-01,2026-01-31,500,0,EUR,,2026-06-29\\\
  n\")\n    check(\"150 days past due gives A01\", \"A01\" in codes(f) and inv[0][\"\
  bucket\"] == \"90+\")\n    inv, s, f = run(\"I1,Acme,2026-05-01,2026-06-01,500,0,EUR,,\\\
  n\")\n    check(\"overdue without contact gives A06\", codes(f) == [\"A06\"])\n\
  \    inv, s, f = run(\"I1,Acme,2026-05-01,2026-06-01,500,0,EUR,,2026-06-01\\n\"\
  , contact_days=14)\n    check(\"stale contact gives A06\", codes(f) == [\"A06\"\
  ])\n    inv, s, f = run(\"I1,Acme,2026-05-01,2026-06-01,500,200,EUR,,2026-06-28\\\
  n\")\n    check(\"partial payment gives A04 and open 300\", codes(f) == [\"A04\"\
  ] and inv[0][\"open\"] == 300)\n    inv, s, f = run(\"I1,Acme,2026-05-01,2026-06-01,500,0,EUR,yes,\\\
  n\")\n    check(\"disputed gives A05, no A06, hold stage\", codes(f) == [\"A05\"\
  ] and inv[0][\"stage\"].startswith(\"hold\"))\n    inv, s, f = run(\"I1,Acme,2026-05-01,2026-06-01,500,600,EUR,,\\\
  n\")\n    check(\"overpaid gives A07 only\", codes(f) == [\"A07\"])\n    inv, s,\
  \ f = run(\"I1,Acme,2026-06-01,2026-07-01,9000,0,EUR,,\\nI2,Bolt,2026-06-01,2026-07-01,1000,0,EUR,,\\\
  n\")\n    check(\"concentration A02 for 90% customer\", [x[\"ref\"] for x in f if\
  \ x[\"code\"] == \"A02\"] == [\"Acme\"])\n    inv, s, f = run(\"I1,Acme,2026-06-01,2026-07-01,9000,0,EUR,,\\\
  n\", {\"customers\": {\"Acme\": {\"credit_limit\": 5000}}})\n    check(\"credit\
  \ limit A03, single customer no A02\", codes(f) == [\"A03\"])\n    inv, s, f = run(\"\
  I1,Acme,2026-06-01,2026-07-01,100,0,EUR,,\\nI1,Acme,2026-06-01,2026-07-01,100,0,EUR,,\\\
  nI3,Acme,2026-13-01,2026-07-01,100,0,EUR,,\\nI4,Acme,2026-06-01,2026-07-01,-5,0,EUR,,\\\
  n\")\n    check(\"duplicate, bad date, negative give A08 x3\", len([x for x in f\
  \ if x[\"code\"] == \"A08\"]) == 3 and len(inv) == 1)\n    inv, s, f = run(\"I1,Acme,2026-06-10,2026-06-01,100,0,EUR,,2026-06-29\\\
  n\")\n    check(\"due before issue flagged A08 but kept\", \"A08\" in codes(f) and\
  \ len(inv) == 1)\n    inv, s, f = run(\"I1,Acme,2026-06-01,2026-07-01,1000,0,EUR,,\\\
  nI2,Acme,2026-06-01,2026-07-01,800,0,USD,,\\n\")\n    check(\"currencies kept separate\"\
  , set(s) == {\"EUR\", \"USD\"} and s[\"USD\"][\"total\"] == 800)\n    inv, s, f\
  \ = run(\"I1,Acme,2026-04-15,2026-05-15,3000,0,EUR,,2026-06-29\\nI2,Acme,2026-06-15,2026-07-15,3000,0,EUR,,\\\
  n\")\n    check(\"DSO = open / 90-day sales x 90\", s[\"EUR\"][\"dso\"] == 90.0\
  \ and s[\"EUR\"][\"overdue_pct\"] == 50.0)\n    check(\"stage ladder\", [stage(d,\
  \ False)[0] for d in (3, 20, 45, 80, 120)] == [\"1\", \"2\", \"3\", \"4\", \"5\"\
  ])\n    inv, s, f = run(\"I1,Acme,2026-05-01,2026-06-01,1000,1000,EUR,,\\n\")\n\
  \    check(\"fully paid invoice ignored\", f == [] and s == {})\n    try:\n    \
  \    load_invoices(\"id,name\\n1,x\\n\"); check(\"missing columns rejected\", False)\n\
  \    except ValueError:\n        check(\"missing columns rejected\", True)\n   \
  \ oo = parser().parse_args([\"--as-of\", \"2026-06-30\", \"--format\", \"csv\"])\n\
  \    rows, probs = load_invoices(H + \"I1,Acme,2026-05-01,2026-06-01,500,0,EUR,,\\\
  n\")\n    out = render(*analyze(rows, probs, {}, oo), oo)\n    check(\"csv output\
  \ has header and row\", out.splitlines()[0].startswith(\"invoice_id\") and \"I1,Acme\"\
  \ in out)\n    oo.format = \"json\"\n    check(\"json output parses\", json.loads(render(*analyze(rows,\
  \ probs, {}, oo), oo))[\"as_of\"] == \"2026-06-30\")\n    for n, c in checks: print((\"\
  PASS  \" if c else \"FAIL  \") + n)\n    print(\"%d/%d checks passed\" % (sum(c\
  \ for _, c in checks), len(checks)))\n    return 0 if all(c for _, c in checks)\
  \ else 1\n\n\ndef main(argv=None):\n    o = parser().parse_args(argv)\n    if o.self_test:\
  \ return self_test()\n    if not o.invoices:\n        parser().print_usage(sys.stderr);\
  \ return 2\n    try:\n        with open(o.invoices, encoding=\"utf-8-sig\") as fh:\
  \ rows, probs = load_invoices(fh.read())\n        customers = json.load(open(o.customers,\
  \ encoding=\"utf-8\")) if o.customers else {}\n    except (OSError, ValueError)\
  \ as e:\n        print(\"input error: %s\" % e, file=sys.stderr); return 2\n   \
  \ inv, summaries, findings = analyze(rows, probs, customers, o)\n    print(render(inv,\
  \ summaries, findings, o))\n    return 1 if any(SEV[f[\"severity\"]] >= SEV[o.min_severity]\
  \ for f in findings) else 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())"
