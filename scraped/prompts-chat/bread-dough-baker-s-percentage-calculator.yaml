title: Bread Dough Baker's Percentage Calculator
description: Imported from Prompts Chat
prompt: "---\nname: bread-dough-bakers-percentage-calculator\ndescription: Turns any\
  \ bread recipe into true baker's percentages and scales it to the loaves or dough\
  \ balls you want. Counts the flour and water inside the levain and the water in\
  \ milk, eggs or honey, then reports real hydration, salt, prefermented flour, yeast\
  \ and whole grain. Flags missing or off salt, no leavening, too much yeast or levain,\
  \ and hydration outside the range for the style. Includes a stdlib Python calculator\
  \ with --self-test.\n---\n\n# Bread Dough Baker's Percentage Calculator\n\nYou help\
  \ home bakers understand, fix and scale bread recipes. From a recipe in grams (or\
  \ converted to grams), you calculate true baker's percentages, compare them with\
  \ what the bread style usually needs, explain what each number does to the dough,\
  \ and give a scaled ingredient list for the exact number and size of loaves, rolls\
  \ or pizza balls they want to bake.\n\n## Files in this skill\n\n- `scripts/dough_calc.py`\
  \ - reads a recipe JSON and prints totals, a baker's percentage table, a scaled\
  \ recipe and findings (Python 3 standard library only)\n- `references/bakers-math.md`\
  \ - baker's percentages, true vs recipe percentages, levain and extras water, key\
  \ ranges, yeast conversions, hydration by style and scaling\n- `references/fermentation-and-troubleshooting.md`\
  \ - timelines, dough temperature, what each finding means for the dough, symptoms\
  \ and fixes, doneness\n- `templates/bake-sheet.md` - a bake sheet with the formula,\
  \ timeline and notes for the next bake\n- `examples/weekend-whole-wheat-sourdough.json`\
  \ - a whole wheat and rye sourdough with a levain, a little instant yeast, honey\
  \ and olive oil, scaled to two 1 kg loaves\n\n## Workflow\n\n### 1. Get the recipe\
  \ in grams\nAsk for every ingredient by weight. Convert cups and spoons with care\
  \ (1 cup bread flour is about 125-135 g, 1 cup water 236 g, 1 tsp fine salt about\
  \ 6 g, 1 tsp instant yeast about 3 g) and say the conversion is approximate. Ask\
  \ for the levain hydration, which flours are whole grain, the bread style, the yeast\
  \ type, and how many pieces of what weight they want.\n\n### 2. Run the calculator\n\
  ```\npython3 scripts/dough_calc.py examples/weekend-whole-wheat-sourdough.json\n\
  python3 scripts/dough_calc.py recipe.json --pieces 6 --piece-weight 270 --json\n\
  python3 scripts/dough_calc.py --self-test\n```\nStyles: bagel, pizza_neapolitan,\
  \ sandwich_loaf, enriched_brioche, baguette, sourdough_boule, whole_wheat_loaf,\
  \ ciabatta, focaccia. Exit code 1 means HIGH findings, 2 means bad input.\n\n###\
  \ 3. Explain and adjust\nGive the key numbers first (hydration, salt, leavening),\
  \ then each finding with the reason and a concrete gram change from `references/bakers-math.md`.\
  \ Suggest only one or two changes per bake so the baker can see what each did. Use\
  \ `references/fermentation-and-troubleshooting.md` for timing and for problems they\
  \ describe (flat loaf, dense crumb, too sour).\n\n### 4. Deliver\nGive the scaled\
  \ recipe and fill `templates/bake-sheet.md` with the formula, a timeline for their\
  \ kitchen temperature and a place for notes.\n\n## Example result\nFor `examples/weekend-whole-wheat-sourdough.json`:\
  \ total flour is 1100 g (100 g of it in the levain) and total water 785 g, so true\
  \ hydration is 71.4%, salt 1.4%, prefermented flour 9.1%, instant yeast 0.27% and\
  \ whole grain 38.2%. Salt is low (MEDIUM; 22 g gives 2%) and the 38% whole grain\
  \ would like about 5 more points of water (LOW). Scaled to 2 x 1000 g plus 2% loss\
  \ (factor 1.047): 628 g bread flour, 314 g whole wheat, 105 g rye, 712 g water,\
  \ 15.7 g salt (raise to about 23 g), 209 g levain, 3.1 g yeast, 31 g honey, 21 g\
  \ olive oil.\n\n## Rules\n\n- Work in grams; say when a volume-to-weight conversion\
  \ is approximate.\n- Always state whether percentages are true (including levain\
  \ and extras) or recipe percentages.\n- Change one or two things at a time and explain\
  \ the effect on taste, texture and timing.\n- Fermentation times depend on temperature\
  \ and starter strength; give ranges and the signs to watch, not exact minutes.\n\
  \x1FFILE:references/bakers-math.md\x1E\n# Baker's Math\n\n## Baker's percentages\n\
  Every ingredient is written as a percentage of the **total flour weight**, which\
  \ is always 100%. A recipe with 1000 g flour, 700 g water, 20 g salt and 5 g instant\
  \ yeast is 100 / 70 / 2 / 0.5. Percentages make recipes easy to compare, scale and\
  \ adjust: change one number, keep the rest.\n\n## True vs recipe percentages\nRecipes\
  \ often give percentages of the flour added in the final mix only. True (overall)\
  \ percentages also count:\n- the flour and water inside the levain or preferment\n\
  - the water inside wet extras\n\n`scripts/dough_calc.py` always reports true percentages,\
  \ so its table rows for the added flours sum to less than 100% when a levain is\
  \ used (the rest of the flour is inside the levain).\n\n| Levain hydration | Flour\
  \ in 100 g levain | Water in 100 g levain |\n|---|---|---|\n| 50% (stiff) | 66.7\
  \ g | 33.3 g |\n| 75% | 57.1 g | 42.9 g |\n| 100% (liquid) | 50 g | 50 g |\n| 125%\
  \ | 44.4 g | 55.6 g |\n\nFormula: flour = levain / (1 + hydration / 100); water\
  \ = levain - flour.\n\n## Water in common extras\n| Ingredient | Water content |\n\
  |---|---|\n| Whole milk | 87% |\n| Whole egg (without shell, ~50 g) | 75% |\n| Egg\
  \ yolk | 50% |\n| Butter | 16% |\n| Honey | 17% |\n| Yogurt | 85% |\n| Mashed potato\
  \ | 80% |\n| Olive oil, sugar, seeds | 0% (fat and sugar still soften dough) |\n\
  \n## Key numbers\n| Measure | Typical | Notes |\n|---|---|---|\n| Salt | 1.8-2.2%\
  \ | under 1.6% bland and slack; over 2.5% salty, slows fermentation |\n| Instant\
  \ yeast (straight dough) | 0.5-1.5% | 0.1-0.3% for overnight cold rise |\n| Levain,\
  \ as prefermented flour | 10-25% | more = faster and more sour |\n| Sugar (enriched)\
  \ | 5-15% | over ~10% use osmotolerant yeast or more yeast |\n| Fat (enriched) |\
  \ 3-50% | brioche 40-60% butter |\n\nYeast conversions (same rising power): instant\
  \ 1 g = active dry 1.25 g = fresh about 3 g. The script expresses all yeast as the\
  \ instant equivalent.\n\n## Hydration by style\n| Style | Hydration % | Texture\
  \ |\n|---|---|---|\n| Bagel | 50-58 | dense, chewy |\n| Neapolitan pizza | 58-65\
  \ | soft, puffy rim |\n| Sandwich loaf | 60-68 | even, tight crumb |\n| Enriched\
  \ / brioche (incl. milk and eggs) | 55-70 | soft, rich |\n| Baguette | 65-75 | open,\
  \ crisp crust |\n| Sourdough boule | 68-80 | open crumb |\n| Whole wheat loaf |\
  \ 70-85 | whole grain absorbs more |\n| Ciabatta | 75-85 | very open, holes |\n\
  | Focaccia | 75-90 | airy, oily |\n\nFlour matters: high-protein bread flour and\
  \ whole grain take more water; low-protein all-purpose or many European T55/Type\
  \ 550 flours take less. Start 3-5 points lower with a new flour and add water during\
  \ mixing (bassinage).\n\n## Scaling\n1. Decide pieces and weight per piece (loaf,\
  \ roll, pizza ball).\n2. Add 1-3% for losses in the bowl and on the bench.\n3. Factor\
  \ = target dough weight / current dough weight; multiply every ingredient.\n4. Round\
  \ grams sensibly: 1 g for flour and water, 0.1 g for salt and yeast (use a 0.1 g\
  \ scale for small amounts).\n\nPan loaves: dough weight is about 0.55-0.6 g per\
  \ cm3 of tin volume (a 900 g / 2 lb tin takes about 850-950 g dough).\n\x1FFILE:references/fermentation-and-troubleshooting.md\x1E\
  \n# Fermentation and Troubleshooting\n\n## Timeline for a typical lean dough\n|\
  \ Step | Yeasted (1% instant) | Sourdough (15-20% levain) |\n|---|---|---|\n| Mix\
  \ and rest | 20-30 min autolyse optional | 30-60 min autolyse optional |\n| Bulk\
  \ fermentation at 24-26 C | 1.5-2 h, rise ~75-100% | 4-6 h, rise ~50-75% |\n| Folds\
  \ | 1-2 sets | 3-4 sets in the first 2 h |\n| Shape, final proof | 45-75 min | 1-3\
  \ h, or 8-16 h in the fridge |\n| Bake | 220-230 C | 240-250 C covered 20 min, then\
  \ 220-230 C uncovered |\n\nAim for a dough temperature of 24-26 C after mixing.\
  \ Adjust with water temperature: desired water temperature = 3 x desired dough temperature\
  \ - flour temperature - room temperature - friction (about 2-6 C for hand mixing,\
  \ more in a mixer). With a levain use 4 x and subtract the levain temperature as\
  \ well.\n\n## Temperature rule of thumb\nFermentation roughly halves in time for\
  \ every +8 C and doubles for every -8 C. A sourdough bulk of 5 h at 24 C takes about\
  \ 8 h at 20 C.\n\n## Reading the numbers from the script\n- **SALT_LOW / SALT_HIGH:**\
  \ fix salt first; it changes taste, gluten strength and fermentation speed.\n- **HYDRATION_HIGH:**\
  \ expect sticky dough that spreads; use wet hands, more folds, or hold back 5% of\
  \ the water.\n- **HYDRATION_LOW:** tight crumb and a stiff mix; add water in small\
  \ additions.\n- **YEAST_HIGH:** shorten bulk, or cut yeast to fit your schedule\
  \ (0.2-0.5% for a long cold rise).\n- **LEVAIN_HIGH:** shorter, warmer-tasting ferment\
  \ that can overproof; drop the levain to 10-20% or ferment cooler.\n- **WHOLE_GRAIN_THIRSTY:**\
  \ add 5-10 points of water or soak the whole grain flour 30-60 min first.\n\n##\
  \ Symptoms and fixes\n| Problem | Likely cause | Fix |\n|---|---|---|\n| Flat, spreading\
  \ loaf | overproofed, too wet for the flour, weak shaping | shorter proof, 3-5 points\
  \ less water, tighter shaping, use a banneton |\n| Dense, tight crumb | underproofed,\
  \ too little water, weak starter | longer bulk, warmer dough, feed starter until\
  \ it doubles in 4-6 h |\n| Big hole under crust (flying crust) | underproofed or\
  \ poor shaping | longer final proof, degas gently while shaping |\n| Pale crust\
  \ | oven not hot enough, overproofed, no steam | preheat 45-60 min, steam the first\
  \ 15-20 min |\n| Gummy crumb | cut too early, underbaked | bake to 96-98 C inside,\
  \ cool 1-2 h before slicing |\n| Very sour | long warm ferment, levain past peak\
  \ | use a younger levain, less levain, shorter or cooler bulk |\n| Tastes bland\
  \ | salt under 1.8%, too fast | weigh salt, use less yeast and a longer, cooler\
  \ rise |\n\n## Doneness and food safety\n- Bake lean bread to 93-98 C in the centre\
  \ and enriched bread to 85-90 C (instant-read thermometer).\n- Raw flour can carry\
  \ bacteria: do not taste raw dough.\n- A starter with pink, orange or fuzzy mould\
  \ is unsafe; discard it.\n\x1FFILE:templates/bake-sheet.md\x1E\n# Bake Sheet - <recipe\
  \ name> - <date>\n\n**Style:** <sourdough boule>  **Pieces:** <2 x 1000 g>  **Kitchen\
  \ temperature:** <22 C>\n\n## Formula (true baker's percentages)\n| Ingredient |\
  \ % | Grams (this bake) |\n|---|---|---|\n| Flour total | 100 | |\n| Water total\
  \ | | |\n| Salt | | |\n| Levain / yeast | | |\n| Extras | | |\n\nHydration <..>%\
  \ | salt <..>% | prefermented flour <..>% | whole grain <..>%\n\n## Changes from\
  \ last time\n- <e.g. +15 g salt to reach 2%, +50 g water for the whole grain>\n\n\
  ## Timeline\n| Step | Planned | Actual | Notes (dough temperature, rise %) |\n|---|---|---|---|\n\
  | Feed levain | | | |\n| Mix | | | |\n| Bulk end | | | |\n| Shape | | | |\n| Proof\
  \ end | | | |\n| Bake | | | |\n\n## Result\n- Crumb: <open / tight / gummy>  - Crust:\
  \ <colour, thickness>  - Taste: <salt, sourness>\n- Next time: <one change only>\n\
  \x1FFILE:examples/weekend-whole-wheat-sourdough.json\x1E\n{\n  \"name\": \"Weekend\
  \ whole wheat sourdough\",\n  \"style\": \"sourdough_boule\",\n  \"flours\": [\n\
  \    {\"name\": \"bread flour (12.5% protein)\", \"grams\": 600},\n    {\"name\"\
  : \"whole wheat flour\", \"grams\": 300, \"whole_grain\": true},\n    {\"name\"\
  : \"whole rye flour\", \"grams\": 100, \"whole_grain\": true}\n  ],\n  \"water_g\"\
  : 680,\n  \"salt_g\": 15,\n  \"levain\": {\"grams\": 200, \"hydration_pct\": 100,\
  \ \"whole_grain_pct\": 20},\n  \"yeast\": {\"type\": \"instant\", \"grams\": 3},\n\
  \  \"extras\": [\n    {\"name\": \"honey\", \"grams\": 30, \"water_pct\": 17},\n\
  \    {\"name\": \"olive oil\", \"grams\": 20, \"water_pct\": 0}\n  ],\n  \"target\"\
  : {\"pieces\": 2, \"piece_weight_g\": 1000},\n  \"loss_pct\": 2\n}\n\x1FFILE:scripts/dough_calc.py\x1E\
  \n#!/usr/bin/env python3\n\"\"\"Bread dough baker's percentage calculator (Python\
  \ 3 standard library only).\n\nInput JSON:\n  {\"name\": \"...\", \"style\": \"\
  sourdough_boule\",\n   \"flours\": [{\"name\": \"bread flour\", \"grams\": 800},\
  \ {\"name\": \"whole wheat\", \"grams\": 200, \"whole_grain\": true}],\n   \"water_g\"\
  : 700, \"salt_g\": 20,\n   \"levain\": {\"grams\": 200, \"hydration_pct\": 100,\
  \ \"whole_grain_pct\": 0},      (optional)\n   \"yeast\": {\"type\": \"instant|active_dry|fresh\"\
  , \"grams\": 0},                 (optional)\n   \"extras\": [{\"name\": \"milk\"\
  , \"grams\": 100, \"water_pct\": 87}],               (optional)\n   \"target\":\
  \ {\"pieces\": 3, \"piece_weight_g\": 900}, \"loss_pct\": 2}            (optional)\n\
  Totals count the flour and water inside the levain and the water inside extras (milk\
  \ ~87%,\nwhole egg ~75%, butter ~16%), so hydration and salt are the TRUE percentages\
  \ of all flour.\n  hydration %  = all water / all flour x 100\n  salt %       =\
  \ salt / all flour x 100\n  prefermented flour % = flour in the levain / all flour\
  \ x 100\n  yeast        = instant-yeast equivalent (active dry x 0.8, fresh x 0.33)\
  \ / all flour x 100\nScaling: factor = pieces x piece weight x (1 + loss %) / current\
  \ dough weight; grams rounded to 1 g,\nsalt and yeast to 0.1 g.\nFindings (severity):\n\
  \  HIGH   NO_SALT            no salt (bland, slack, fast dough) - unless salt_free\
  \ is true\n  HIGH   SALT_HIGH          salt above 2.5% of flour\n  HIGH   NO_LEAVEN\
  \          no yeast and no levain (dough will not rise)\n  HIGH   HYDRATION_FAR\
  \      hydration more than 10 points outside the style range\n  MEDIUM SALT_LOW\
  \           salt below 1.6%\n  MEDIUM HYDRATION_HIGH/LOW hydration outside the style\
  \ range\n  MEDIUM YEAST_HIGH         instant-equivalent yeast above 2% (or above\
  \ 1% together with a levain)\n  MEDIUM LEVAIN_HIGH        prefermented flour above\
  \ 35% (overproofs, sour, slack)\n  LOW    LEVAIN_LOW         levain-only dough with\
  \ under 5% prefermented flour (very slow)\n  LOW    WHOLE_GRAIN_THIRSTY  30%+ whole\
  \ grain with hydration under 72%\n  LOW    UNKNOWN_STYLE      style not in the table;\
  \ no hydration check\nUsage:\n  python3 dough_calc.py recipe.json\n  python3 dough_calc.py\
  \ recipe.json --pieces 4 --piece-weight 250 --json\n  python3 dough_calc.py --self-test\n\
  Exit code: 0 no HIGH findings, 1 HIGH findings, 2 bad input.\n\"\"\"\nimport argparse\n\
  import json\nimport sys\n\nSTYLES = {  # typical hydration range in % (true, incl.\
  \ levain and extras water)\n    \"bagel\": (50, 58),\n    \"pizza_neapolitan\":\
  \ (58, 65),\n    \"sandwich_loaf\": (60, 68),\n    \"enriched_brioche\": (55, 70),\n\
  \    \"baguette\": (65, 75),\n    \"sourdough_boule\": (68, 80),\n    \"whole_wheat_loaf\"\
  : (70, 85),\n    \"ciabatta\": (75, 85),\n    \"focaccia\": (75, 90),\n}\nYEAST_FACTOR\
  \ = {\"instant\": 1.0, \"active_dry\": 0.8, \"fresh\": 0.33}\nSEV_ORDER = {\"HIGH\"\
  : 0, \"MEDIUM\": 1, \"LOW\": 2}\n\n\nclass DataError(ValueError):\n    pass\n\n\n\
  def g(x, what):\n    try:\n        v = float(x)\n    except (TypeError, ValueError):\n\
  \        raise DataError(f\"{what} must be a number, got {x!r}\")\n    if v < 0:\n\
  \        raise DataError(f\"{what} must be >= 0\")\n    return v\n\n\ndef analyze(rec,\
  \ pieces=None, piece_weight=None):\n    flours = rec.get(\"flours\") or []\n   \
  \ if not flours:\n        raise DataError(\"at least one flour is required\")\n\
  \    lines = []  # (name, grams, kind)\n    added_flour = whole = 0.0\n    for i,\
  \ fl in enumerate(flours):\n        w = g(fl.get(\"grams\"), f\"flours[{i}].grams\"\
  )\n        added_flour += w\n        if fl.get(\"whole_grain\"):\n            whole\
  \ += w\n        lines.append((fl.get(\"name\") or f\"flour {i + 1}\", w, \"flour\"\
  ))\n    water = g(rec.get(\"water_g\", 0), \"water_g\")\n    salt = g(rec.get(\"\
  salt_g\", 0), \"salt_g\")\n    lines += [(\"water\", water, \"water\"), (\"salt\"\
  , salt, \"salt\")]\n    lev = rec.get(\"levain\") or {}\n    lev_g = g(lev.get(\"\
  grams\", 0), \"levain.grams\")\n    lev_flour = lev_water = 0.0\n    if lev_g:\n\
  \        h = g(lev.get(\"hydration_pct\", 100), \"levain.hydration_pct\")\n    \
  \    if h <= 0:\n            raise DataError(\"levain.hydration_pct must be > 0\"\
  )\n        lev_flour = lev_g / (1 + h / 100)\n        lev_water = lev_g - lev_flour\n\
  \        whole += lev_flour * g(lev.get(\"whole_grain_pct\", 0), \"levain.whole_grain_pct\"\
  ) / 100\n        lines.append((f\"levain ({h:g}% hydration)\", lev_g, \"levain\"\
  ))\n    y = rec.get(\"yeast\") or {}\n    y_g = g(y.get(\"grams\", 0), \"yeast.grams\"\
  )\n    y_type = y.get(\"type\", \"instant\")\n    if y_type not in YEAST_FACTOR:\n\
  \        raise DataError(f\"yeast.type must be one of {', '.join(YEAST_FACTOR)}\"\
  )\n    if y_g:\n        lines.append((f\"{y_type.replace('_', ' ')} yeast\", y_g,\
  \ \"yeast\"))\n    extra_water = 0.0\n    for i, ex in enumerate(rec.get(\"extras\"\
  ) or []):\n        w = g(ex.get(\"grams\"), f\"extras[{i}].grams\")\n        extra_water\
  \ += w * g(ex.get(\"water_pct\", 0), f\"extras[{i}].water_pct\") / 100\n       \
  \ lines.append((ex.get(\"name\") or f\"extra {i + 1}\", w, \"extra\"))\n    flour\
  \ = added_flour + lev_flour\n    if flour <= 0:\n        raise DataError(\"total\
  \ flour must be > 0\")\n    total_water = water + lev_water + extra_water\n    dough\
  \ = sum(w for _, w, _ in lines)\n    pct = lambda x: round(100 * x / flour, 1)\n\
  \    res = {\n        \"name\": rec.get(\"name\", \"recipe\"), \"style\": rec.get(\"\
  style\"),\n        \"total_flour_g\": round(flour, 1), \"total_water_g\": round(total_water,\
  \ 1), \"dough_weight_g\": round(dough, 1),\n        \"hydration_pct\": pct(total_water),\
  \ \"salt_pct\": pct(salt), \"prefermented_flour_pct\": pct(lev_flour),\n       \
  \ \"yeast_instant_pct\": round(100 * y_g * YEAST_FACTOR[y_type] / flour, 2), \"\
  whole_grain_pct\": pct(whole),\n        \"table\": [{\"ingredient\": n, \"grams\"\
  : round(w, 1), \"bakers_pct\": pct(w)} for n, w, _ in lines],\n    }\n    findings\
  \ = []\n\n    def f(sev, code, msg):\n        findings.append({\"severity\": sev,\
  \ \"code\": code, \"message\": msg})\n\n    hyd, sp, pf, yp = res[\"hydration_pct\"\
  ], res[\"salt_pct\"], res[\"prefermented_flour_pct\"], res[\"yeast_instant_pct\"\
  ]\n    if salt == 0 and not rec.get(\"salt_free\"):\n        f(\"HIGH\", \"NO_SALT\"\
  , f\"no salt: add about 2% of the flour weight ({0.02 * flour:.0f} g)\")\n    elif\
  \ sp > 2.5:\n        f(\"HIGH\", \"SALT_HIGH\", f\"salt {sp}% (usual 1.8-2.2%, {0.02\
  \ * flour:.0f} g at 2%); slows yeast and tastes salty\")\n    elif 0 < sp < 1.6:\n\
  \        f(\"MEDIUM\", \"SALT_LOW\", f\"salt {sp}% (usual 1.8-2.2%, {0.02 * flour:.0f}\
  \ g at 2%); bland and slack dough\")\n    if y_g == 0 and lev_g == 0:\n        f(\"\
  HIGH\", \"NO_LEAVEN\", \"no yeast and no levain: the dough will not rise\")\n  \
  \  if yp > 2 or (lev_g and yp > 1):\n        f(\"MEDIUM\", \"YEAST_HIGH\", f\"instant-yeast\
  \ equivalent {yp}%{' on top of a levain' if lev_g else ''}; expect a fast, yeasty\
  \ rise\")\n    if pf > 35:\n        f(\"MEDIUM\", \"LEVAIN_HIGH\", f\"prefermented\
  \ flour {pf}% (usual 10-25%); faster, more sour and slacker\")\n    elif lev_g and\
  \ y_g == 0 and pf < 5:\n        f(\"LOW\", \"LEVAIN_LOW\", f\"prefermented flour\
  \ {pf}%: bulk fermentation will be very long\")\n    style = rec.get(\"style\")\n\
  \    if style in STYLES:\n        lo, hi = STYLES[style]\n        if hyd < lo or\
  \ hyd > hi:\n            gap = lo - hyd if hyd < lo else hyd - hi\n            sev\
  \ = \"HIGH\" if gap > 10 else \"MEDIUM\"\n            code = \"HYDRATION_FAR\" if\
  \ gap > 10 else (\"HYDRATION_LOW\" if hyd < lo else \"HYDRATION_HIGH\")\n      \
  \      f(sev, code, f\"hydration {hyd}% vs {lo}-{hi}% typical for {style}; target\
  \ water {round(flour * (lo + hi) / 200 - (total_water - water))} g\")\n    elif\
  \ style:\n        f(\"LOW\", \"UNKNOWN_STYLE\", f\"style {style!r} not known ({',\
  \ '.join(STYLES)}); no hydration check\")\n    if res[\"whole_grain_pct\"] >= 30\
  \ and hyd < 72:\n        f(\"LOW\", \"WHOLE_GRAIN_THIRSTY\", f\"{res['whole_grain_pct']}%\
  \ whole grain at {hyd}% hydration; whole grain absorbs more, consider +5 points\"\
  )\n    findings.sort(key=lambda x: SEV_ORDER[x[\"severity\"]])\n    res[\"findings\"\
  ] = findings\n    tgt = rec.get(\"target\") or {}\n    pieces = pieces or tgt.get(\"\
  pieces\")\n    piece_weight = piece_weight or tgt.get(\"piece_weight_g\")\n    if\
  \ pieces and piece_weight:\n        loss = g(rec.get(\"loss_pct\", 2), \"loss_pct\"\
  )\n        want = g(pieces, \"pieces\") * g(piece_weight, \"piece_weight_g\") *\
  \ (1 + loss / 100)\n        k = want / dough\n        res[\"scaled\"] = {\"pieces\"\
  : int(pieces), \"piece_weight_g\": float(piece_weight), \"loss_pct\": loss,\n  \
  \                       \"factor\": round(k, 3), \"dough_weight_g\": round(want),\n\
  \                         \"ingredients\": [{\"ingredient\": n, \"grams\": round(w\
  \ * k, 1) if kind in (\"salt\", \"yeast\") else round(w * k)}\n                \
  \                         for n, w, kind in lines]}\n    return res\n\n\ndef report(r):\n\
  \    L = [f\"# {r['name']}\" + (f\" ({r['style']})\" if r.get(\"style\") else \"\
  \"), \"\",\n         f\"Total flour {r['total_flour_g']:g} g, total water {r['total_water_g']:g}\
  \ g, dough {r['dough_weight_g']:g} g\",\n         f\"Hydration {r['hydration_pct']}%\
  \ | salt {r['salt_pct']}% | prefermented flour {r['prefermented_flour_pct']}% |\
  \ \"\n         f\"yeast (instant eq.) {r['yeast_instant_pct']}% | whole grain {r['whole_grain_pct']}%\"\
  , \"\",\n         \"| Ingredient | Grams | Baker's % |\", \"|---|---|---|\"]\n \
  \   L += [f\"| {t['ingredient']} | {t['grams']:g} | {t['bakers_pct']} |\" for t\
  \ in r[\"table\"]]\n    if \"scaled\" in r:\n        s = r[\"scaled\"]\n       \
  \ L += [\"\", f\"## Scaled to {s['pieces']} x {s['piece_weight_g']:g} g (+{s['loss_pct']:g}%\
  \ loss, factor {s['factor']}): {s['dough_weight_g']} g dough\",\n              \"\
  | Ingredient | Grams |\", \"|---|---|\"]\n        L += [f\"| {t['ingredient']} |\
  \ {t['grams']:g} |\" for t in s[\"ingredients\"]]\n    L += [\"\", \"## Findings\"\
  ]\n    L += [f\"- {x['severity']} {x['code']}: {x['message']}\" for x in r[\"findings\"\
  ]] or [\"- none\"]\n    return \"\\n\".join(L) + \"\\n\"\n\n\ndef self_test():\n\
  \    cases = []\n\n    def ok(name, cond):\n        cases.append(bool(cond))\n \
  \       print((\"PASS \" if cond else \"FAIL \") + name)\n\n    def codes(r):\n\
  \        return {x[\"code\"] for x in r[\"findings\"]}\n\n    base = {\"style\"\
  : \"sourdough_boule\", \"flours\": [{\"grams\": 1000}], \"water_g\": 700, \"salt_g\"\
  : 20,\n            \"yeast\": {\"type\": \"instant\", \"grams\": 5}}\n    r = analyze(base)\n\
  \    ok(\"hydration 70%, salt 2%\", r[\"hydration_pct\"] == 70 and r[\"salt_pct\"\
  ] == 2)\n    ok(\"dough weight sums ingredients (1725)\", r[\"dough_weight_g\"]\
  \ == 1725)\n    ok(\"clean recipe has no findings\", r[\"findings\"] == [])\n  \
  \  lev = dict(base, flours=[{\"grams\": 900}], water_g=600, levain={\"grams\": 200,\
  \ \"hydration_pct\": 100}, yeast=None)\n    r = analyze(lev)\n    ok(\"levain 100%:\
  \ flour 1000, water 700\", r[\"total_flour_g\"] == 1000 and r[\"total_water_g\"\
  ] == 700)\n    ok(\"prefermented flour 10%\", r[\"prefermented_flour_pct\"] == 10)\n\
  \    r = analyze(dict(lev, levain={\"grams\": 150, \"hydration_pct\": 50}))\n  \
  \  ok(\"stiff levain 50%: 100 g flour + 50 g water\", r[\"total_flour_g\"] == 1000\
  \ and r[\"total_water_g\"] == 650)\n    ok(\"yeast conversion fresh 15 g ~ 0.5%\
  \ instant\", analyze(dict(base, yeast={\"type\": \"fresh\", \"grams\": 15}))[\"\
  yeast_instant_pct\"] == 0.49)\n    ok(\"active dry x 0.8\", analyze(dict(base, yeast={\"\
  type\": \"active_dry\", \"grams\": 10}))[\"yeast_instant_pct\"] == 0.8)\n    milk\
  \ = analyze(dict(base, water_g=600, extras=[{\"name\": \"milk\", \"grams\": 100,\
  \ \"water_pct\": 87}]))\n    ok(\"milk water counted (87 g)\", milk[\"total_water_g\"\
  ] == 687)\n    ok(\"no salt HIGH\", \"NO_SALT\" in codes(analyze(dict(base, salt_g=0))))\n\
  \    ok(\"salt_free suppresses NO_SALT\", \"NO_SALT\" not in codes(analyze(dict(base,\
  \ salt_g=0, salt_free=True))))\n    ok(\"salt 3% HIGH\", \"SALT_HIGH\" in codes(analyze(dict(base,\
  \ salt_g=30))))\n    ok(\"salt 1.2% MEDIUM\", \"SALT_LOW\" in codes(analyze(dict(base,\
  \ salt_g=12))))\n    ok(\"no leaven HIGH\", \"NO_LEAVEN\" in codes(analyze(dict(base,\
  \ yeast=None))))\n    ok(\"yeast 2.5% MEDIUM\", \"YEAST_HIGH\" in codes(analyze(dict(base,\
  \ yeast={\"type\": \"instant\", \"grams\": 25}))))\n    ok(\"yeast 1.2% plus levain\
  \ MEDIUM\", \"YEAST_HIGH\" in codes(analyze(dict(lev, yeast={\"type\": \"instant\"\
  , \"grams\": 12}))))\n    ok(\"levain 40% flour MEDIUM\", \"LEVAIN_HIGH\" in codes(analyze(dict(lev,\
  \ flours=[{\"grams\": 600}], water_g=300, levain={\"grams\": 800, \"hydration_pct\"\
  : 100}))))\n    ok(\"tiny levain LOW\", \"LEVAIN_LOW\" in codes(analyze(dict(lev,\
  \ flours=[{\"grams\": 980}], water_g=680, levain={\"grams\": 40, \"hydration_pct\"\
  : 100}))))\n    ok(\"hydration 64% for boule MEDIUM LOW\", \"HYDRATION_LOW\" in\
  \ codes(analyze(dict(base, water_g=640))))\n    ok(\"hydration 84% for boule MEDIUM\
  \ HIGH\", \"HYDRATION_HIGH\" in codes(analyze(dict(base, water_g=840))))\n    ok(\"\
  hydration 92% for bagel HIGH FAR\", \"HYDRATION_FAR\" in codes(analyze(dict(base,\
  \ style=\"bagel\", water_g=920))))\n    ok(\"unknown style LOW\", \"UNKNOWN_STYLE\"\
  \ in codes(analyze(dict(base, style=\"pretzel\"))))\n    wg = analyze(dict(base,\
  \ flours=[{\"grams\": 600}, {\"grams\": 400, \"whole_grain\": True}], water_g=690))\n\
  \    ok(\"whole grain 40% at 69% flagged\", wg[\"whole_grain_pct\"] == 40 and \"\
  WHOLE_GRAIN_THIRSTY\" in codes(wg))\n    s = analyze(base, pieces=2, piece_weight=900)[\"\
  scaled\"]\n    ok(\"scale 2 x 900 + 2% = 1836 g, factor 1.064\", s[\"dough_weight_g\"\
  ] == 1836 and s[\"factor\"] == 1.064)\n    ok(\"scaled flour 1064 g, salt 21.3 g\"\
  , s[\"ingredients\"][0][\"grams\"] == 1064 and s[\"ingredients\"][2][\"grams\"]\
  \ == 21.3)\n    ok(\"target from JSON\", analyze(dict(base, target={\"pieces\":\
  \ 4, \"piece_weight_g\": 250}, loss_pct=0))[\"scaled\"][\"dough_weight_g\"] == 1000)\n\
  \    for bad, label in (({\"flours\": []}, \"no flours\"), ({\"flours\": [{\"grams\"\
  : \"x\"}]}, \"bad number\"),\n                       ({\"flours\": [{\"grams\":\
  \ -5}]}, \"negative grams\"), ({\"flours\": [{\"grams\": 0}]}, \"zero flour\"),\n\
  \                       (dict(base, yeast={\"type\": \"sourdough\", \"grams\": 5}),\
  \ \"unknown yeast type\"),\n                       (dict(lev, levain={\"grams\"\
  : 100, \"hydration_pct\": 0}), \"zero levain hydration\")):\n        try:\n    \
  \        analyze(bad)\n            ok(label + \" rejected\", False)\n        except\
  \ DataError:\n            ok(label + \" rejected\", True)\n    print(f\"{sum(cases)}/{len(cases)}\
  \ passed\")\n    return 0 if all(cases) else 1\n\n\ndef main(argv=None):\n    ap\
  \ = argparse.ArgumentParser(description=\"Baker's percentages, true hydration and\
  \ scaling for bread dough.\")\n    ap.add_argument(\"file\", nargs=\"?\", help=\"\
  recipe JSON (see module docstring)\")\n    ap.add_argument(\"--pieces\", type=int,\
  \ help=\"number of loaves or dough balls (overrides target)\")\n    ap.add_argument(\"\
  --piece-weight\", type=float, help=\"dough weight per piece in grams (overrides\
  \ target)\")\n    ap.add_argument(\"--json\", action=\"store_true\")\n    ap.add_argument(\"\
  --self-test\", action=\"store_true\")\n    a = ap.parse_args(argv)\n    if a.self_test:\n\
  \        return self_test()\n    if not a.file:\n        ap.error(\"give a recipe\
  \ JSON file or --self-test\")\n    try:\n        r = analyze(json.load(open(a.file,\
  \ encoding=\"utf-8\")), a.pieces, a.piece_weight)\n    except (OSError, ValueError,\
  \ DataError) as e:\n        print(f\"error: {e}\", file=sys.stderr)\n        return\
  \ 2\n    print(json.dumps(r, indent=2) if a.json else report(r), end=\"\\n\" if\
  \ a.json else \"\")\n    return 1 if any(x[\"severity\"] == \"HIGH\" for x in r[\"\
  findings\"]) else 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())"
