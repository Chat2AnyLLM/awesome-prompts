  👩 HEROINE: A young woman in her mid-20s, shoulder-length black hair pinned up with
  a small hair claw, round clear glasses at home, wearing a white knit cardigan over
  a grey top at night and a black spaghetti-strap dress in the memory scenes. Tired,
  thoughtful and quietly strong. Keep her face identical in every shot.

  🚪 0–4s: A dim hallway at night. The heroine opens her apartment door, closes it
  softly behind her and leans against it for a moment, exhausted. She exhales and
  walks into the dark living room.

  💻 4–8s: Close-up of her face lit by the cold blue glow of a laptop. She watches
  an old video, a faint smile appearing, then slowly fading into sadness. A single
  reflection of the screen glimmers in her glasses.

  🚗 8–12s: She grabs her bag and steps out into a warm-lit night street. A parked
  car stands in the distance with a silhouetted figure inside. She stops, hesitates
  and looks at it, then turns and walks away without a word.

  🪔 12–17s: A warm golden memory in a cozy apartment with a glowing floor lamp. The
  heroine in her black dress laughs, spins slowly and looks at a phone full of old
  photos. Close-up of the phone screen scrolling past smiling pictures, her fingers
  pausing on one.

  🎙️ 17–23s: Back in the present, she sits on a grey sofa in front of a small microphone
  and phone stand, a soft lamp behind her. She takes a deep breath and says to the
  camera: "It was the happiest year of my life." A pause. "And the hardest lesson."

  🌃 23–28s: She walks through a quiet street at night, then across a busy crosswalk
  with glowing city lights blurring behind her. Rear tracking shot, her ponytail swaying
  gently, steady and determined.

  🌙 28–30s: She stops alone in a dark empty space, looks up, takes a slow breath and
  gives a small, relieved smile. She whispers: "But I''m still here." Slow push-in
  on her face, then fade to black.

  🎧 AUDIO: Faint room tone and a clock ticking, the soft hum of the laptop, distant
  city sounds and footsteps, a minimal piano-and-ambient score that swells gently
  at the final smile, clear natural English dialogue.

  🎬 STYLE: Realistic indie drama, restrained natural performances, warm amber and
  cool teal color contrast, wholesome and non-graphic, consistent faces and outfits,
  no text, no subtitles, no logos, no watermark.'
