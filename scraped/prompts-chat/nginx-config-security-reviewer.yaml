slug: nginx-config-security-reviewer
title: Nginx Config Security Reviewer
description: Imported from Prompts Chat
prompt: "---\nname: nginx-config-security-reviewer\ndescription: Reviews nginx.conf\
  \ and site configs for security problems such as TLS 1.0/1.1, weak ciphers, missing\
  \ HSTS and security headers, the add_header inheritance trap, alias off-by-slash\
  \ path traversal, autoindex, unlimited body size, $uri in redirects, HTTP without\
  \ an HTTPS redirect, open admin paths and logins without rate limits. Gives a fixed\
  \ config. Includes a stdlib Python checker with --self-test.\n---\n\n# Nginx Config\
  \ Security Reviewer\n\nYou review nginx configurations the way a careful ops engineer\
  \ would before a security audit: find the settings that expose data or weaken TLS,\
  \ explain each one in plain words, and hand back a corrected config that still serves\
  \ the same routes. You never guess at files you have not seen, and you never tell\
  \ the user to reload without `nginx -t`.\n\n## Files in this skill\n\n- `scripts/nginx_review.py`\
  \ - parses nginx config files into blocks and prints findings with severity, line\
  \ and fix (Python 3 standard library only)\n- `references/hardening-checklist.md`\
  \ - every check the script runs, why it matters and the fix, plus items to check\
  \ by hand\n- `references/tls-and-headers.md` - TLS protocol and cipher settings,\
  \ HSTS rollout, security headers and how add_header inheritance works\n- `templates/review-report.md`\
  \ - the report you hand back: summary, findings table, config diff, test commands\n\
  - `examples/shop-site.conf` - a small shop config from 2019 with 18 findings (3\
  \ HIGH)\n- `examples/shop-site-fixed.conf` - the same site after the fixes (no findings\
  \ apart from the include note)\n\n## Workflow\n\n### 1. Collect the full config\n\
  Ask for the output of `sudo nginx -T` (it prints the main file and every included\
  \ file), or for nginx.conf plus the relevant sites-enabled files. Ask what the site\
  \ does (static, reverse proxy, PHP), which paths must stay public, the nginx version\
  \ (`nginx -v`) and whether a CDN or load balancer terminates TLS in front of it.\
  \ Tell the user to remove private keys or secrets before pasting; certificate paths\
  \ are fine.\n\n### 2. Run the checker\n```\npython3 scripts/nginx_review.py examples/shop-site.conf\n\
  python3 scripts/nginx_review.py /etc/nginx/nginx.conf /etc/nginx/sites-enabled/shop\
  \ --json\npython3 scripts/nginx_review.py --self-test\n```\nExit code 1 means HIGH\
  \ findings, 2 means the file could not be read or parsed (the error names the line).\n\
  \n### 3. Confirm and add manual checks\nRead each finding against the user's context:\
  \ a CDN in front changes TLS findings, an internal-only admin route may already\
  \ be firewalled, a `return 404` may already hide a path. Then go through the manual\
  \ items in `references/hardening-checklist.md` (included files, upstream TLS verification,\
  \ `if` blocks, PHP handlers, file permissions). Drop false positives and say why.\n\
  \n### 4. Deliver\nFill `templates/review-report.md`: HIGH items first, a minimal\
  \ diff of the config, and the test steps. Explain the add_header inheritance rule\
  \ whenever ADD_HEADER_INHERITANCE appears, because it surprises most people. Introduce\
  \ HSTS with a short max-age first if the site has never used it.\n\n## Example result\n\
  For `examples/shop-site.conf`: 3 HIGH (TLS 1.0/1.1 enabled, RC4 and 3DES ciphers,\
  \ `location /images` with `alias .../images/` allowing `/images../` traversal),\
  \ 6 MEDIUM (unlimited body size, port 80 serving content instead of redirecting,\
  \ autoindex on /downloads/, /api/ dropping HSTS and nosniff because it sets its\
  \ own add_header, unprotected /admin/, `$uri` in a redirect), 8 LOW (server_tokens,\
  \ dotfiles, missing CSP/Referrer-Policy/X-Frame-Options, proxy headers, no rate\
  \ limit on /api/auth/login) and 1 INFO. `examples/shop-site-fixed.conf` shows the\
  \ fixes and passes `nginx -t`.\n\n## Rules\n\n- Quote the exact line and the exact\
  \ replacement; keep changes minimal and route-preserving.\n- Always end with `sudo\
  \ nginx -t && sudo systemctl reload nginx` and a curl check; never suggest a restart\
  \ that drops connections when a reload works.\n- Do not invent directives: check\
  \ names against the nginx docs for the user's version (for example `http2 on;` needs\
  \ 1.25.1+, older versions use `listen 443 ssl http2;`).\n- Never ask for or repeat\
  \ private keys, passwords or htpasswd hashes.\n- Treat security headers like CSP\
  \ as a rollout: suggest `Content-Security-Policy-Report-Only` first for complex\
  \ apps.\n\x1FFILE:references/hardening-checklist.md\x1E\n# Nginx Hardening Checklist\n\
  \nEvery code the script prints, why it matters and the fix. Severity is the default;\
  \ raise or lower it with context.\n\n## HIGH\n\n### OLD_TLS_PROTOCOL\n`ssl_protocols`\
  \ lists SSLv3, TLSv1 or TLSv1.1. These are deprecated (RFC 8996), fail PCI DSS and\
  \ allow downgrade attacks. Fix: `ssl_protocols TLSv1.2 TLSv1.3;` (the default since\
  \ nginx 1.23.4, so deleting the line also works on new versions). Only very old\
  \ clients (Android 4.3, IE on Windows 7 without updates) lose access.\n\n### WEAK_CIPHERS\n\
  `ssl_ciphers` allows RC4, DES/3DES (SWEET32), MD5, NULL, EXPORT or anonymous (aNULL/ADH)\
  \ suites. Entries starting with `!` or `-` are exclusions and are fine. Fix: use\
  \ the Mozilla \"intermediate\" list from ssl-config.mozilla.org or remove `ssl_ciphers`\
  \ to use the OpenSSL default, and set `ssl_prefer_server_ciphers off;` when only\
  \ modern AEAD suites remain.\n\n### NO_CERTIFICATE\nA server listens with `ssl`\
  \ but no `ssl_certificate` is set in it or in http. nginx refuses to start or fails\
  \ the handshake. Add `ssl_certificate` (full chain) and `ssl_certificate_key`.\n\
  \n### ALIAS_TRAVERSAL (off-by-slash)\n`location /images { alias /var/www/media/images/;\
  \ }`: a request for `/images../secret.txt` maps to `/var/www/media/images/../secret.txt`,\
  \ so files one level above the alias are readable (a well-known finding in many\
  \ audits). Fix: both the location and the alias end with a slash, `location /images/\
  \ { alias /var/www/media/images/; }`, or use `root` when the path matches the folder\
  \ name.\n\n## MEDIUM\n\n### HTTP_NO_REDIRECT\nA port-80 server with the same server_name\
  \ as an HTTPS server serves pages instead of redirecting. Users and cookies stay\
  \ on plain HTTP. Fix:\n```\nserver {\n    listen 80;\n    server_name shop.example.com;\n\
  \    location /.well-known/acme-challenge/ { root /var/www/certbot; }\n    location\
  \ / { return 301 https://$host$request_uri; }\n}\n```\n\n### NO_HSTS\nNo `Strict-Transport-Security`\
  \ header on an HTTPS server, so the first request of a session can be downgraded.\
  \ See `tls-and-headers.md` for the rollout.\n\n### ADD_HEADER_INHERITANCE\nnginx\
  \ inherits `add_header` from the parent level only when the current level has no\
  \ `add_header` at all. One `add_header Cache-Control no-store;` in `location /api/`\
  \ drops every security header from the server block for that location. Fix: repeat\
  \ the headers in that location, or keep them in a snippet (`include snippets/security-headers.conf;`)\
  \ and include it in every block that has its own add_header. On nginx 1.29.3+ `add_header_inherit\
  \ merge;` in http makes child blocks add to the parent headers instead of replacing\
  \ them. `proxy_set_header`, `fastcgi_param` and `proxy_hide_header` follow the same\
  \ rule.\n\n### AUTOINDEX_ON\nDirectory listing shows every file name, including\
  \ backups and exports nobody linked. Turn it off or protect the location.\n\n###\
  \ ADMIN_OPEN\nPaths such as /admin, /phpmyadmin, /actuator, /server-status, /nginx_status\
  \ or /metrics without allow/deny, auth_basic or auth_request. Fix: `allow 10.20.0.0/16;\
  \ deny all;` (office or VPN range), or `auth_request` to an SSO service. Basic auth\
  \ only over HTTPS.\n\n### UNLIMITED_BODY\n`client_max_body_size 0` disables the\
  \ request size limit, making disk and memory exhaustion easy. Keep the default 1m\
  \ or a real limit in http, and raise it only in the upload location.\n\n### URI_IN_REDIRECT\n\
  `$uri` is normalized and URL-decoded, so `%0d%0a` becomes a real line break and\
  \ an attacker can inject headers (`Set-Cookie`) into the redirect response. Use\
  \ `$request_uri` (the raw, still-encoded request line) in `return`, `rewrite` targets\
  \ and `add_header`.\n\n## LOW\n\n### SERVER_TOKENS\nThe version appears in the `Server`\
  \ header and on error pages, which helps attackers match known CVEs. `server_tokens\
  \ off;` in http.\n\n### MISSING_SECURITY_HEADERS\nOn HTTPS servers: `X-Content-Type-Options\
  \ nosniff`, `X-Frame-Options` (or CSP `frame-ancestors`), `Content-Security-Policy`,\
  \ `Referrer-Policy`. Add them with `always` so they are also sent on 4xx/5xx responses.\n\
  \n### SHORT_HSTS\nHSTS max-age under 180 days. Fine during rollout; raise it to\
  \ one year afterwards.\n\n### DOTFILES_EXPOSED\nThe server serves files but has\
  \ no rule for hidden files, so `/.git/config`, `/.env` or `/.htpasswd` may be downloadable\
  \ if they exist under the web root. Fix: `location ~ /\\.(?!well-known) { deny all;\
  \ }` (keeps ACME challenges working).\n\n### NO_RATE_LIMIT\nA login, auth or token\
  \ path without `limit_req`. Add a zone in http and apply it to the location; return\
  \ 429 with `limit_req_status 429;`.\n\n### PROXY_HEADERS\nA `proxy_pass` location\
  \ that does not send Host, X-Forwarded-For and X-Forwarded-Proto, so the app logs\
  \ the proxy's IP, builds wrong redirect URLs and may think HTTPS requests are HTTP.\
  \ Remember the inheritance rule: one `proxy_set_header` in the location replaces\
  \ all inherited ones.\n\n## INFO\n\n### INCLUDE_NOT_FOLLOWED\nThe script reads only\
  \ the files you pass. Ask for `nginx -T` or the included files.\n\n## Check by hand\
  \ (not automated)\n- `proxy_pass https://...` to an upstream on the internet without\
  \ `proxy_ssl_verify on;` and `proxy_ssl_trusted_certificate`.\n- PHP: `location\
  \ ~ \\.php$` must use `try_files $uri =404;` (or `fastcgi_split_path_info` with\
  \ a check) so uploaded images cannot run as PHP; uploads directories should never\
  \ pass to PHP.\n- `if` inside location with anything other than `return` or `rewrite\
  \ ... last` (\"if is evil\").\n- `default_server` blocks: an unknown Host should\
  \ get `return 444;` with a self-signed or `ssl_reject_handshake on;` (1.19.4+) instead\
  \ of the first site.\n- Permissions: nginx workers should not be able to write the\
  \ web root; private keys `chmod 600`, owned by root.\n- Large headers / slow clients:\
  \ `client_body_timeout`, `client_header_timeout`, `large_client_header_buffers`\
  \ for public APIs under attack.\n- Logging: access logs must not record tokens in\
  \ query strings; use a custom log_format if needed.\n\x1FFILE:references/tls-and-headers.md\x1E\
  \n# TLS and Security Headers\n\n## TLS settings that pass most audits (nginx 1.25+\
  \ with OpenSSL 1.1.1 or 3.x)\n```\nssl_protocols TLSv1.2 TLSv1.3;\nssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;\n\
  ssl_prefer_server_ciphers off;\nssl_session_timeout 1d;\nssl_session_cache shared:SSL:10m;\n\
  ssl_session_tickets off;\n```\nThis is the Mozilla \"intermediate\" profile. TLS\
  \ 1.3 suites are not set with ssl_ciphers (OpenSSL handles them). If DHE suites\
  \ stay, provide `ssl_dhparam` with at least 2048 bits or drop the DHE entries.\n\
  \nOCSP stapling (`ssl_stapling on; ssl_stapling_verify on;`) is optional; Let's\
  \ Encrypt ended OCSP support in 2025, so do not add it for LE certificates.\n\n\
  HTTP/2: `http2 on;` inside the server on nginx 1.25.1+; older versions use `listen\
  \ 443 ssl http2;`.\n\n## HSTS rollout\n1. Make sure every subdomain works over HTTPS.\n\
  2. Start short: `add_header Strict-Transport-Security \"max-age=300\" always;`\n\
  3. After a week without problems: `max-age=31536000; includeSubDomains`.\n4. Only\
  \ add `preload` and submit to hstspreload.org when you are sure; removal takes months.\n\
  HSTS on plain HTTP responses is ignored by browsers, so set it on the 443 server.\n\
  \n## Security headers\n| Header | Typical value | Notes |\n|---|---|---|\n| X-Content-Type-Options\
  \ | `nosniff` | Stops MIME sniffing of uploads |\n| X-Frame-Options | `DENY` or\
  \ `SAMEORIGIN` | Clickjacking; CSP `frame-ancestors` is the modern equivalent |\n\
  | Content-Security-Policy | `default-src 'self'` and more | App-specific; roll out\
  \ with `Content-Security-Policy-Report-Only` |\n| Referrer-Policy | `strict-origin-when-cross-origin`\
  \ | Keeps paths and query strings out of other sites' logs |\n| Permissions-Policy\
  \ | `camera=(), microphone=(), geolocation=()` | Optional |\nAdd `always` so headers\
  \ are also sent on error responses.\n\n## The add_header inheritance rule\n```\n\
  server {\n    add_header X-Content-Type-Options nosniff always;   # A\n    location\
  \ / { }                                      # gets A\n    location /api/ {\n  \
  \      add_header Cache-Control no-store;              # gets ONLY this one, A is\
  \ gone\n    }\n}\n```\nA block inherits add_header from its parent only if it defines\
  \ none itself. Keep shared headers in a snippet and include it in every block that\
  \ adds its own. nginx 1.29.3 (October 2025) added `add_header_inherit merge;`, which\
  \ makes nested blocks add to the inherited headers; check `nginx -v` before suggesting\
  \ it (Debian 13 ships 1.26).\n\n## Testing\n```\nsudo nginx -t && sudo systemctl\
  \ reload nginx\ncurl -sI https://shop.example.com/ | grep -iE 'strict|x-content|x-frame|content-security|referrer|server:'\n\
  curl -sI http://shop.example.com/page?x=1        # expect 301 to https://shop.example.com/page?x=1\n\
  curl -s -o /dev/null -w '%{http_code}\\n' https://shop.example.com/.git/config \
  \  # expect 403 or 404\ncurl -s -o /dev/null -w '%{http_code}\\n' https://shop.example.com/images../\
  \      # expect 404 after the alias fix\nopenssl s_client -connect shop.example.com:443\
  \ -tls1_1 </dev/null   # expect a handshake failure\n```\nFor a full external check:\
  \ SSL Labs server test or `testssl.sh shop.example.com`.\n\x1FFILE:templates/review-report.md\x1E\
  \n# Nginx security review: <site or server name>\n\n**Version:** <nginx 1.26.3,\
  \ OpenSSL 3.x>   **Role:** <static site / reverse proxy to Node on :3000 / PHP-FPM>\n\
  **Files reviewed:** <nginx -T output, 2 files>   **TLS terminated by:** <nginx /\
  \ CDN / load balancer>\n**Summary:** <one sentence: the most serious problem and\
  \ what the fix changes>\n\n## Findings\n| # | Severity | Code | File:line | Problem\
  \ | Fix |\n|---|---|---|---|---|---|\n| 1 | HIGH | <ALIAS_TRAVERSAL> | <nginx.conf:51>\
  \ | <location /images allows /images../> | <location /images/ { alias .../images/;\
  \ }> |\n| 2 | <MEDIUM> | <...> | <...> | <...> | <...> |\n\n## Not changed (with\
  \ reason)\n- <ADMIN_OPEN on /admin/: already limited by the cloud firewall to the\
  \ VPN; added deny all anyway? yes/no>\n\n## Config changes\n```diff\n- ssl_protocols\
  \ TLSv1 TLSv1.1 TLSv1.2;\n+ ssl_protocols TLSv1.2 TLSv1.3;\n```\n\n## Apply and\
  \ test\n1. Back up: `sudo cp -a /etc/nginx /etc/nginx.bak-<date>`\n2. Edit, then\
  \ `sudo nginx -t && sudo systemctl reload nginx`\n3. Checks:\n   - `curl -sI https://<host>/`\
  \ shows the security headers\n   - `curl -sI http://<host>/x?y=1` returns 301 to\
  \ the same path on https\n   - <path traversal / dotfile / admin checks from the\
  \ findings>\n4. Roll back: restore the backup and reload.\n\n## Follow-ups\n- <HSTS:\
  \ raise max-age to 31536000 after <date>>\n- <CSP: move from Report-Only to enforcing\
  \ after reviewing reports>\n\x1FFILE:examples/shop-site.conf\x1E\n# /etc/nginx/nginx.conf\
  \ for shop.example.com (single-file setup)\n# A small online shop: static storefront,\
  \ product images, a Node.js API on :3000\n# and a legacy admin panel. Written in\
  \ 2019, certificates renewed by certbot.\n\nuser www-data;\nworker_processes auto;\n\
  \nevents {\n    worker_connections 1024;\n}\n\nhttp {\n    include /etc/nginx/mime.types;\n\
  \    sendfile on;\n    keepalive_timeout 65;\n    client_max_body_size 0;\n\n  \
  \  ssl_protocols TLSv1 TLSv1.1 TLSv1.2;\n    ssl_ciphers \"HIGH:RC4-SHA:DES-CBC3-SHA:!aNULL\"\
  ;\n    ssl_prefer_server_ciphers on;\n\n    server {\n        listen 80;\n     \
  \   server_name shop.example.com www.shop.example.com;\n        root /var/www/shop;\n\
  \n        location /.well-known/acme-challenge/ {\n            root /var/www/certbot;\n\
  \        }\n    }\n\n    server {\n        listen 443 ssl;\n        http2 on;\n\
  \        server_name shop.example.com www.shop.example.com;\n\n        ssl_certificate\
  \ /etc/letsencrypt/live/shop.example.com/fullchain.pem;\n        ssl_certificate_key\
  \ /etc/letsencrypt/live/shop.example.com/privkey.pem;\n\n        add_header Strict-Transport-Security\
  \ \"max-age=31536000\" always;\n        add_header X-Content-Type-Options nosniff\
  \ always;\n\n        root /var/www/shop;\n        index index.html;\n\n        location\
  \ / {\n            try_files $uri $uri/ /index.html;\n        }\n\n        location\
  \ /images {\n            alias /var/www/shop-media/images/;\n        }\n\n     \
  \   location /downloads/ {\n            alias /var/www/shop-media/downloads/;\n\
  \            autoindex on;\n        }\n\n        location /api/ {\n            add_header\
  \ Cache-Control \"no-store\";\n            proxy_pass http://127.0.0.1:3000;\n \
  \       }\n\n        location /api/auth/login {\n            proxy_pass http://127.0.0.1:3000;\n\
  \            proxy_set_header Host $host;\n        }\n\n        location /admin/\
  \ {\n            proxy_pass http://127.0.0.1:8080/;\n        }\n\n        location\
  \ /old-blog {\n            return 301 https://blog.example.com$uri;\n        }\n\
  \    }\n}\n\x1FFILE:examples/shop-site-fixed.conf\x1E\n# shop.example.com after\
  \ the review: same routes, hardened.\n# Shared security headers live in one snippet\
  \ so locations with their own\n# add_header can include it again (add_header is\
  \ not inherited into a block\n# that sets any add_header of its own).\n\nuser www-data;\n\
  worker_processes auto;\n\nevents {\n    worker_connections 1024;\n}\n\nhttp {\n\
  \    include /etc/nginx/mime.types;\n    sendfile on;\n    keepalive_timeout 65;\n\
  \    server_tokens off;\n    client_max_body_size 10m;\n\n    ssl_protocols TLSv1.2\
  \ TLSv1.3;\n    ssl_prefer_server_ciphers off;\n    ssl_session_timeout 1d;\n  \
  \  ssl_session_cache shared:SSL:10m;\n\n    limit_req_zone $binary_remote_addr zone=login:10m\
  \ rate=5r/m;\n\n    server {\n        listen 80;\n        server_name shop.example.com\
  \ www.shop.example.com;\n\n        location /.well-known/acme-challenge/ {\n   \
  \         root /var/www/certbot;\n        }\n\n        location / {\n          \
  \  return 301 https://$host$request_uri;\n        }\n    }\n\n    server {\n   \
  \     listen 443 ssl;\n        http2 on;\n        server_name shop.example.com www.shop.example.com;\n\
  \n        ssl_certificate /etc/letsencrypt/live/shop.example.com/fullchain.pem;\n\
  \        ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;\n\
  \n        # same lines as /etc/nginx/snippets/security-headers.conf\n        add_header\
  \ Strict-Transport-Security \"max-age=31536000; includeSubDomains\" always;\n  \
  \      add_header X-Content-Type-Options nosniff always;\n        add_header X-Frame-Options\
  \ SAMEORIGIN always;\n        add_header Content-Security-Policy \"default-src 'self';\
  \ img-src 'self' data:; frame-ancestors 'self'\" always;\n        add_header Referrer-Policy\
  \ strict-origin-when-cross-origin always;\n\n        proxy_set_header Host $host;\n\
  \        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header\
  \ X-Forwarded-Proto $scheme;\n\n        root /var/www/shop;\n        index index.html;\n\
  \n        location ~ /\\.(?!well-known) {\n            deny all;\n        }\n\n\
  \        location / {\n            try_files $uri $uri/ /index.html;\n        }\n\
  \n        location /images/ {\n            alias /var/www/shop-media/images/;\n\
  \        }\n\n        location /downloads/ {\n            alias /var/www/shop-media/downloads/;\n\
  \        }\n\n        location /api/ {\n            add_header Cache-Control \"\
  no-store\" always;\n            add_header Strict-Transport-Security \"max-age=31536000;\
  \ includeSubDomains\" always;\n            add_header X-Content-Type-Options nosniff\
  \ always;\n            add_header X-Frame-Options SAMEORIGIN always;\n         \
  \   add_header Content-Security-Policy \"default-src 'self'; img-src 'self' data:;\
  \ frame-ancestors 'self'\" always;\n            add_header Referrer-Policy strict-origin-when-cross-origin\
  \ always;\n            proxy_pass http://127.0.0.1:3000;\n        }\n\n        location\
  \ /api/auth/login {\n            limit_req zone=login burst=5 nodelay;\n       \
  \     proxy_pass http://127.0.0.1:3000;\n        }\n\n        location /admin/ {\n\
  \            allow 10.20.0.0/16;\n            deny all;\n            proxy_pass\
  \ http://127.0.0.1:8080/;\n        }\n\n        location /old-blog {\n         \
  \   return 301 https://blog.example.com$request_uri;\n        }\n    }\n}\n\x1F\
  FILE:scripts/nginx_review.py\x1E\n#!/usr/bin/env python3\n\"\"\"Nginx config security\
  \ reviewer (Python 3 standard library only).\n\nParses nginx.conf / sites-available\
  \ files into a block tree and flags common\nsecurity and hardening problems: old\
  \ TLS protocols, weak ciphers, missing HSTS\nand security headers, the add_header\
  \ inheritance trap, alias off-by-slash path\ntraversal, autoindex, unlimited body\
  \ size, $uri in redirects (CRLF injection),\nplain-HTTP servers without a redirect,\
  \ open admin paths, login paths without\nrate limiting, exposed dotfiles and proxies\
  \ without forwarding headers.\n\nUsage:\n  python3 nginx_review.py site.conf [more.conf\
  \ ...] [--json]\n  python3 nginx_review.py --self-test\nExit codes: 0 = no HIGH\
  \ findings, 1 = HIGH findings, 2 = unreadable/unparseable input.\n\"\"\"\nimport\
  \ argparse, json, re, sys\n\nSEV_ORDER = {\"HIGH\": 0, \"MEDIUM\": 1, \"LOW\": 2,\
  \ \"INFO\": 3}\nOLD_PROTOCOLS = {\"SSLv2\", \"SSLv3\", \"TLSv1\", \"TLSv1.1\"}\n\
  WEAK_CIPHER_WORDS = [\"RC4\", \"DES\", \"3DES\", \"MD5\", \"NULL\", \"EXPORT\",\
  \ \"EXP-\", \"aNULL\", \"eNULL\", \"ADH\", \"AECDH\"]\nSECURITY_HEADERS = {\n  \
  \  \"x-content-type-options\": \"X-Content-Type-Options nosniff\",\n    \"x-frame-options\"\
  : \"X-Frame-Options DENY or SAMEORIGIN (or CSP frame-ancestors)\",\n    \"content-security-policy\"\
  : \"Content-Security-Policy\",\n    \"referrer-policy\": \"Referrer-Policy strict-origin-when-cross-origin\"\
  ,\n}\nLOGIN_RE = re.compile(r\"login|signin|sign-in|auth|token|password|wp-login\"\
