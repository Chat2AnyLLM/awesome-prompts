title: Cap Table Round and SAFE Conversion Calculator
description: Imported from Prompts Chat
prompt: "---\nname: cap-table-round-and-safe-conversion-calculator\ndescription: Models\
  \ a priced seed or Series A round on your cap table: converts post-money and pre-money\
  \ SAFEs (cap and/or discount), tops up the option pool to a post-money target, prices\
  \ the new shares and shows every holder's dilution, value and red flags, with a\
  \ pre-money comparison. Offline stdlib Python.\n---\n\n# Cap Table Round and SAFE\
  \ Conversion Calculator\n\nYou help founders, early employees and small-company\
  \ finance leads understand what a priced equity round does to their cap table before\
  \ they sign a term sheet. SAFEs, option pool top-ups and the price per share interact\
  \ in ways that are easy to get wrong in a spreadsheet: a \"10% pool post-money\"\
  \ request quietly lowers the price, several post-money SAFEs dilute each other's\
  \ holders but not each other, and a discount can beat a cap. You build the model,\
  \ explain it in plain language and point out what to negotiate or check with a lawyer.\n\
  \nYou work only with the numbers the user gives you, on their machine. You never\
  \ present the model as legal, tax or investment advice, and you tell the user that\
  \ the signed SAFEs, the term sheet and the closing cap table prepared by their lawyer\
  \ decide the real numbers.\n\n## Files in this skill\n\n- `scripts/captable_round.py`\
  \ - the calculator: reads a cap table CSV and a round JSON, solves price per share,\
  \ SAFE conversions and pool top-up together, prints before/after fully diluted tables,\
  \ SAFE conversion details and warnings; `--compare 10000000,12000000` adds a pre-money\
  \ comparison, `--json` for tooling, `--self-test` runs 18 checks (Python 3.8+ standard\
  \ library only)\n- `references/cap-table-math.md` - the formulas: fully diluted\
  \ shares, price per share, post-money and pre-money SAFE conversion, discount vs\
  \ cap, the option pool shuffle, rounding\n- `references/term-sheet-checks.md` -\
  \ what to check and negotiate: pool size and timing, SAFE stacking, MFN and pro\
  \ rata side letters, liquidation preference basics, questions for your lawyer\n\
  - `templates/round-summary.md` - the summary you hand back to the founders\n- `examples/cap_table.csv`,\
  \ `examples/round.json` - a fictional two-founder company raising 3M at 12M pre-money\
  \ with three SAFEs and a 10% post-money pool target\n\n## Workflow\n\n### 1. Collect\
  \ the inputs\nAsk for:\n- The current fully diluted cap table: every holder of common\
  \ and preferred shares, granted options (vested or not), and the unissued pool.\
  \ Warrants and convertible notes too, if any (treat notes like SAFEs with a cap/discount\
  \ and add accrued interest to the amount).\n- Every SAFE: holder, amount, valuation\
  \ cap, discount, and whether it is a post-money or pre-money SAFE (the document\
  \ title says \"Post-Money Valuation Cap\" for the current standard). Ask about MFN\
  \ and pro rata side letters.\n- The proposed round: pre-money valuation, new money,\
  \ and the option pool requirement (for example \"unissued pool equal to 10% post-money\"\
  ).\nIf something is missing, ask; do not guess the SAFE type or the pool definition.\n\
  \n### 2. Build the input files\nWrite `cap_table.csv` with columns `holder,class,shares`\
  \ (class: common, preferred, options, pool) and `round.json` with `pre_money`, `new_money`,\
  \ optional `pool_target_post` as a fraction (0.10, not 10), optional `investor_name`,\
  \ and `safes` (`holder`, `amount`, optional `cap`, optional `discount` as a fraction,\
  \ `type` \"post\" or \"pre\").\n\n### 3. Run the model\n```\npython3 scripts/captable_round.py\
  \ examples/cap_table.csv examples/round.json\npython3 scripts/captable_round.py\
  \ cap_table.csv round.json --compare 10000000,12000000,15000000\npython3 scripts/captable_round.py\
  \ cap_table.csv round.json --json > round_model.json\npython3 scripts/captable_round.py\
  \ --self-test\n```\nExit 0 = no warnings, 1 = warnings to discuss, 2 = bad input.\
  \ Without a shell, follow `references/cap-table-math.md` step by step and show your\
  \ working; iterate the price and pool top-up two or three times until they stop\
  \ changing.\n\n### 4. Explain the result\n- Lead with four numbers: price per share,\
  \ post-money valuation, new investor ownership, and founders' combined ownership\
  \ after the round.\n- Explain each SAFE: which term won (cap or discount), the effective\
  \ price, and the ownership it buys.\n- Explain the pool shuffle in one sentence:\
  \ the top-up is counted pre-money, so it lowers the price and is paid for by existing\
  \ holders. Show its cost in percentage points.\n- Use the comparison table to show\
  \ how pre-money, pool size or a smaller raise move founder ownership. Suggest specific\
  \ levers (a smaller pool sized to a real hiring plan, pool counted post-money, a\
  \ higher pre-money, a smaller raise).\n\n### 5. Flag what to check\nGo through every\
  \ warning the script prints and `references/term-sheet-checks.md`. Always mention:\
  \ verify SAFE types and caps against the signed documents, confirm how the investor\
  \ defines the pool, ask about MFN and pro rata rights, and ask the lawyer for the\
  \ pro forma closing cap table to compare against this model.\n\n### 6. Hand back\
  \ the summary\nFill `templates/round-summary.md`: headline numbers, before/after\
  \ table, SAFE conversions, pool shuffle cost, comparison, warnings, negotiation\
  \ points and open questions.\n\n## Rules\n- Shares are whole numbers: the script\
  \ rounds SAFE and investor shares down and the pool top-up up, so totals can differ\
  \ from the headline valuation by a few currency units; say so if asked.\n- Percentages\
  \ are of the fully diluted total (all shares, granted options and the unissued pool).\n\
  - Never tell the user a round is \"good\" or \"bad\"; show the trade-offs and the\
  \ questions to ask.\n- Keep the user's numbers private; do not upload the cap table\
  \ anywhere.\n\n\x1FFILE:references/cap-table-math.md\x1E\n# Cap table math used\
  \ by captable_round.py\n\n## Fully diluted shares\nFully diluted (FD) = issued common\
  \ + issued preferred + granted options (vested and unvested) + unissued option pool\
  \ (+ warrants). Ownership percentages in the report are always of the FD total.\n\
  \n## Priced round\n- Pre-money FD = existing FD + SAFE conversion shares + option\
  \ pool top-up.\n- Price per share = pre-money valuation / pre-money FD.\n- New investor\
  \ shares = new money / price per share (rounded down).\n- Post-money FD = pre-money\
  \ FD + new investor shares; post-money valuation = post-money FD x price.\nBecause\
  \ the SAFE shares and the pool top-up are inside the pre-money FD, the price depends\
  \ on them and they depend on the price. The script solves this by fixed-point iteration\
  \ (it converges in a few rounds) and then rounds to whole shares.\n\n## Option pool\
  \ shuffle\nIf the investor asks for an unissued pool equal to T% of the post-money\
  \ FD:\n- Top-up = max(0, T x post-money FD - existing unissued pool).\n- The top-up\
  \ is part of the pre-money FD, so it lowers the price per share. The new investor\
  \ still gets new money / post-money valuation; existing holders carry the whole\
  \ dilution of the top-up.\n- Cost to existing holders, in percentage points of pre-money\
  \ ownership = top-up / pre-money FD.\n\n## Post-money SAFE (current standard)\n\
  The holder gets ownership = amount / post-money valuation cap, measured against\
  \ the \"company capitalization\" just before the round: existing FD (including the\
  \ unissued pool, excluding the new pool top-up) plus the shares of all converting\
  \ post-money SAFEs.\n- With several post-money SAFEs with fractions f1..fn (fi =\
  \ amount / cap) and existing FD C, total SAFE shares S = C x f / (1 - f) where f\
  \ = sum fi; each SAFE gets fi x (C + S).\n- Cap price = cap / (C + S).\n- Post-money\
  \ SAFEs dilute the founders and earlier holders, not each other.\n\n## Pre-money\
  \ SAFE (older form)\nCap price = cap / existing FD before any SAFE converts. Each\
  \ later SAFE dilutes the earlier ones.\n\n## Discount and \"better of\"\nDiscount\
  \ price = round price x (1 - discount). A SAFE with both terms converts at the lower\
  \ of cap price and discount price, so it gets more shares. A SAFE with neither converts\
  \ at the round price (check for an MFN clause instead).\n\n## Convertible notes\n\
  Treat a note like a SAFE: amount = principal + accrued interest to the conversion\
  \ date, with its cap and discount. Note maturity and repayment terms are not modeled.\n\
  \n## Rounding\nSAFE and investor shares are rounded down; the pool top-up is rounded\
  \ up so the pool target is met. Real closing sets may round differently by a few\
  \ shares.\n\n## Worked example (examples/)\nExisting FD 9,000,000 (8,000,000 founders,\
  \ 700,000 granted options, 300,000 unissued pool). Raise 3,000,000 at 12,000,000\
  \ pre-money with a 10% post-money pool target and three post-money SAFEs. Result:\
  \ price about 1.1104, pool top-up 1,050,912, investor 20.00%, SAFEs 5.60% together,\
  \ founders from 88.89% to 59.22%.\n\n\x1FFILE:references/term-sheet-checks.md\x1E\
  \n# Term sheet and SAFE checks to raise with founders\n\n## Option pool\n- Size\
  \ the pool to a real 12-18 month hiring plan (roles x typical grant) instead of\
  \ a round percentage; a smaller, justified pool is the most common negotiation win.\n\
  - Ask whether the pool target is measured pre-money or post-money, and whether already\
  \ granted options count toward it.\n- Compare \"pool counted pre-money\" vs \"pool\
  \ counted post-money\" with the script (set the target lower or 0 and add the pool\
  \ to the investor side) to show the difference in founder ownership.\n\n## SAFEs\n\
  - Confirm every SAFE's type (post-money or pre-money), cap, discount and amount\
  \ from the signed document, not from memory or a spreadsheet.\n- Post-money SAFEs\
  \ stack: every new post-money SAFE dilutes the founders by roughly amount / cap.\
  \ Add them up before raising more on SAFEs.\n- MFN clauses let an uncapped SAFE\
  \ take better terms from a later SAFE; check whether any MFN was triggered.\n- Pro\
  \ rata side letters let SAFE holders buy into this round; their money usually comes\
  \ out of the round size, so confirm the allocation with the lead.\n\n## Round terms\
  \ that change outcomes but not this model\n- Liquidation preference (1x non-participating\
  \ is the common seed standard; participating or more than 1x is investor-friendly).\n\
  - Anti-dilution protection (broad-based weighted average is common; full ratchet\
  \ is harsh).\n- Board seats, protective provisions, founder vesting reset, and information\
  \ rights.\nThe script does not model exit waterfalls; say so and suggest a waterfall\
  \ model if the user asks what they receive at a given exit value.\n\n## Questions\
  \ for the lawyer\n1. Please share the pro forma closing cap table so we can compare\
  \ it with our model.\n2. Which SAFEs and notes convert, and at what price did you\
  \ use for each?\n3. How is the option pool target defined, and is it measured on\
  \ a fully diluted basis including the SAFEs?\n4. Are there MFN, pro rata or side\
  \ letter rights we need to honor in this round?\n5. Are there any warrants, promised\
  \ options or advisor grants not yet on the cap table?\n\n## Red flags to mention\n\
  - SAFEs converting into more than about 20% of the company.\n- A single round selling\
  \ more than about 25-30% of the company.\n- Founders together below 50% after a\
  \ seed round.\n- A cap table with no pool at all, or a pool far larger than the\
  \ hiring plan.\n- Numbers in the term sheet that do not match the model by more\
  \ than rounding.\n\n\x1FFILE:templates/round-summary.md\x1E\n# Round summary: {{company}}\
  \ - {{round_name}}\n\nPrepared {{date}} from the cap table and SAFE terms you shared.\
  \ Model only: the signed documents and the lawyer's closing cap table decide the\
  \ real numbers.\n\n## Headline\n- Raise: {{new_money}} at {{pre_money}} pre-money\
  \ ({{post_money}} post-money)\n- Price per share: {{price_per_share}}\n- New investors\
  \ own: {{investor_pct}}\n- Founders together: {{founders_before_pct}} before ->\
  \ {{founders_after_pct}} after\n- Option pool after the round: {{pool_after_pct}}\
  \ unissued (top-up {{pool_top_up}} shares)\n\n## SAFE conversions\n| SAFE | type\
  \ | amount | cap | discount | term that won | shares | ownership |\n|---|---|---:|---:|---:|---|---:|---:|\n\
  | {{safe}} | {{type}} | {{amount}} | {{cap}} | {{discount}} | {{cap_or_discount}}\
  \ | {{shares}} | {{pct}} |\n\n## Cap table before and after\n(paste the table from\
  \ captable_round.py)\n\n## What the option pool shuffle costs\n{{one sentence: top-up\
  \ counted pre-money, cost in percentage points, who pays}}\n\n## Scenarios\n| pre-money\
  \ | price/share | new investors % | founders % |\n|---:|---:|---:|---:|\n| {{pre}}\
  \ | {{price}} | {{inv_pct}} | {{founders_pct}} |\n\n## Warnings from the model\n\
  - {{warning}}\n\n## Negotiation points\n1. {{for example: size the pool to the 18-month\
  \ hiring plan (about X%) instead of 10%}}\n2. {{...}}\n\n## Open questions for the\
  \ lawyer and investors\n- {{question}}\n\n\x1FFILE:examples/cap_table.csv\x1E\n\
  holder,class,shares\nFounder A (CEO),common,4200000\nFounder B (CTO),common,3800000\n\
  Early employee grants,options,600000\nAdvisor grants,options,100000\nUnissued option\
  \ pool,pool,300000\n\n\x1FFILE:examples/round.json\x1E\n{\n  \"investor_name\":\
  \ \"Seed lead and syndicate\",\n  \"pre_money\": 12000000,\n  \"new_money\": 3000000,\n\
  \  \"pool_target_post\": 0.10,\n  \"safes\": [\n    {\"holder\": \"Angel SAFE 2024\"\
  , \"amount\": 250000, \"cap\": 6000000, \"discount\": 0.2, \"type\": \"post\"},\n\
  \    {\"holder\": \"Accelerator SAFE\", \"amount\": 125000, \"cap\": 5000000, \"\
  type\": \"post\"},\n    {\"holder\": \"Friends and family note-style SAFE\", \"\
  amount\": 100000, \"discount\": 0.15, \"type\": \"post\"}\n  ]\n}\n\n\x1FFILE:scripts/captable_round.py\x1E\
  \n#!/usr/bin/env python3\n\"\"\"captable_round.py - model a priced equity round\
  \ on a startup cap table.\n\nConverts post-money and pre-money SAFEs (valuation\
  \ cap and/or discount), tops up the\noption pool to a post-money target (the \"\
  option pool shuffle\"), prices the new\nshares, and prints the pre-round and post-round\
  \ fully diluted cap table, the price\nper share, each holder's dilution and sanity\
  \ warnings. Standard library only.\n\nUsage:\n  python3 captable_round.py CAP_TABLE.csv\
  \ ROUND.json [--json] [--compare PRE1,PRE2,...]\n  python3 captable_round.py --self-test\n\
  \nCAP_TABLE.csv columns: holder,class,shares   (class: common, preferred, options,\
  \ pool)\n  - \"options\" = granted options (outstanding), \"pool\" = unissued option\
  \ pool.\nROUND.json keys:\n  pre_money (number, required), new_money (number, required),\n\
  \  pool_target_post (fraction 0-1, optional, e.g. 0.10), investor_name (optional),\n\
  \  safes: [{\"holder\", \"amount\", \"cap\" (optional), \"discount\" (fraction,\
  \ optional),\n           \"type\": \"post\" | \"pre\" (default \"post\")}]\nExit\
  \ codes: 0 ok, 1 ok with warnings, 2 bad input.\nThis is a model for planning and\
  \ negotiation. Lawyers and the signed documents decide the real numbers.\n\"\"\"\
  \nimport csv, json, math, sys\n\nCLASSES = {\"common\", \"preferred\", \"options\"\
  , \"pool\"}\n\n\nclass InputError(Exception):\n    pass\n\n\ndef load_cap_table(path):\n\
  \    rows = []\n    with open(path, newline=\"\", encoding=\"utf-8\") as f:\n  \
  \      r = csv.DictReader(f)\n        need = {\"holder\", \"class\", \"shares\"\
  }\n        if not r.fieldnames or not need.issubset({h.strip() for h in r.fieldnames}):\n\
  \            raise InputError(\"cap table needs columns holder,class,shares\")\n\
  \        for i, row in enumerate(r, start=2):\n            row = {k.strip(): (v\
  \ or \"\").strip() for k, v in row.items()}\n            if not row[\"holder\"]\
  \ and not row[\"shares\"]:\n                continue\n            cls = row[\"class\"\
  ].lower()\n            if cls not in CLASSES:\n                raise InputError(\"\
  line %d: class must be one of %s\" % (i, \", \".join(sorted(CLASSES))))\n      \
  \      try:\n                sh = int(row[\"shares\"].replace(\",\", \"\").replace(\"\
  _\", \"\"))\n            except ValueError:\n                raise InputError(\"\
  line %d: shares must be a whole number\" % i)\n            if sh < 0:\n        \
  \        raise InputError(\"line %d: negative shares\" % i)\n            rows.append({\"\
  holder\": row[\"holder\"] or \"(unnamed)\", \"class\": cls, \"shares\": sh})\n \
  \   if not rows:\n        raise InputError(\"cap table is empty\")\n    return rows\n\
  \n\ndef validate_round(rd):\n    for k in (\"pre_money\", \"new_money\"):\n    \
  \    if not isinstance(rd.get(k), (int, float)) or rd[k] <= 0:\n            raise\
  \ InputError(\"round.%s must be a positive number\" % k)\n    t = rd.get(\"pool_target_post\"\
  , 0) or 0\n    if not 0 <= t < 0.5:\n        raise InputError(\"pool_target_post\
  \ must be a fraction between 0 and 0.5 (e.g. 0.10)\")\n    for s in rd.get(\"safes\"\
  , []) or []:\n        if not isinstance(s.get(\"amount\"), (int, float)) or s[\"\
  amount\"] <= 0:\n            raise InputError(\"every SAFE needs a positive amount\
  \ (%s)\" % s.get(\"holder\"))\n        if s.get(\"cap\") is not None and s[\"cap\"\
  ] <= 0:\n            raise InputError(\"SAFE cap must be positive (%s)\" % s.get(\"\
  holder\"))\n        d = s.get(\"discount\") or 0\n        if not 0 <= d < 1:\n \
  \           raise InputError(\"SAFE discount must be a fraction like 0.2 (%s)\"\
  \ % s.get(\"holder\"))\n        if s.get(\"type\", \"post\") not in (\"post\", \"\
  pre\"):\n            raise InputError(\"SAFE type must be 'post' or 'pre' (%s)\"\
  \ % s.get(\"holder\"))\n\n\ndef model(rows, rd, iterations=500):\n    \"\"\"Fixed-point\
  \ solve for price, SAFE conversion shares and pool top-up.\"\"\"\n    validate_round(rd)\n\
  \    safes = rd.get(\"safes\", []) or []\n    C = sum(r[\"shares\"] for r in rows)\
  \                       # pre-round fully diluted, before SAFEs\n    unissued =\
  \ sum(r[\"shares\"] for r in rows if r[\"class\"] == \"pool\")\n    target = rd.get(\"\
  pool_target_post\", 0) or 0\n    pre_money, new_money = float(rd[\"pre_money\"]),\
  \ float(rd[\"new_money\"])\n    safe_sh = [0.0] * len(safes)\n    pool_top = 0.0\n\
  \    price = pre_money / C\n    for _ in range(iterations):\n        S = sum(safe_sh)\n\
  \        pre_fd = C + S + pool_top\n        price = pre_money / pre_fd\n       \
  \ new_sh = new_money / price\n        post = pre_fd + new_sh\n        pool_top_n\
  \ = max(0.0, target * post - unissued) if target else 0.0\n        S_post = sum(sh\
  \ for sh, s in zip(safe_sh, safes) if s.get(\"type\", \"post\") == \"post\")\n \
  \       new_safe = []\n        for s in safes:\n            prices = []\n      \
  \      if s.get(\"cap\"):\n                if s.get(\"type\", \"post\") == \"post\"\
  :\n                    # post-money SAFE: capitalization includes all converting\
  \ post-money SAFEs (not the new money or pool top-up)\n                    prices.append(s[\"\
  cap\"] / (C + S_post))\n                else:\n                    prices.append(s[\"\
  cap\"] / C)\n            if s.get(\"discount\"):\n                prices.append(price\
  \ * (1 - s[\"discount\"]))\n            if not prices:\n                prices.append(price)\
  \       # uncapped, no discount: converts at the round price\n            new_safe.append(s[\"\
  amount\"] / min(prices))\n        delta = abs(pool_top_n - pool_top) + sum(abs(a\
  \ - b) for a, b in zip(new_safe, safe_sh))\n        safe_sh, pool_top = new_safe,\
  \ pool_top_n\n        if delta < 1e-6:\n            break\n    # final integer shares\
  \ (round down, like most closing sets)\n    safe_int = [math.floor(x) for x in safe_sh]\n\
  \    pool_int = math.ceil(pool_top) if pool_top > 0 else 0\n    pre_fd = C + sum(safe_int)\
  \ + pool_int\n    price = pre_money / pre_fd\n    new_int = math.floor(new_money\
  \ / price)\n    post = pre_fd + new_int\n    conv = []\n    for s, sh in zip(safes,\
  \ safe_int):\n        conv.append({\"holder\": s.get(\"holder\", \"SAFE\"), \"amount\"\
  : s[\"amount\"], \"type\": s.get(\"type\", \"post\"),\n                     \"cap\"\
  : s.get(\"cap\"), \"discount\": s.get(\"discount\"), \"shares\": sh,\n         \
  \            \"effective_price\": round(s[\"amount\"] / sh, 6) if sh else None})\n\
  \    return {\"price_per_share\": price, \"pre_round_fd_before_safes\": C, \"pre_money_fd\"\
  : pre_fd,\n            \"safe_conversions\": conv, \"pool_top_up\": pool_int, \"\
  new_money_shares\": new_int,\n            \"post_money_fd\": post, \"post_money_valuation\"\
  : post * price,\n            \"investor\": rd.get(\"investor_name\", \"New investors\"\
  )}\n\n\ndef tables(rows, rd, res):\n    post = res[\"post_money_fd\"]\n    C = res[\"\
  pre_round_fd_before_safes\"]\n    out = []\n    for r in rows:\n        out.append({\"\
  holder\": r[\"holder\"], \"class\": r[\"class\"], \"before\": r[\"shares\"], \"\
  after\": r[\"shares\"]})\n    if res[\"pool_top_up\"]:\n        out.append({\"holder\"\
  : \"Option pool top-up\", \"class\": \"pool\", \"before\": 0, \"after\": res[\"\
  pool_top_up\"]})\n    for c in res[\"safe_conversions\"]:\n        out.append({\"\
  holder\": c[\"holder\"] + \" (SAFE)\", \"class\": \"preferred\", \"before\": 0,\
  \ \"after\": c[\"shares\"]})\n    out.append({\"holder\": res[\"investor\"], \"\
  class\": \"preferred\", \"before\": 0, \"after\": res[\"new_money_shares\"]})\n\
  \    for o in out:\n        o[\"pct_before\"] = o[\"before\"] / C if C else 0\n\
  \        o[\"pct_after\"] = o[\"after\"] / post if post else 0\n        o[\"value_after\"\
  ] = o[\"after\"] * res[\"price_per_share\"]\n    return out\n\n\ndef warnings(rows,\
  \ rd, res, tab):\n    w = []\n    post = res[\"post_money_fd\"]\n    safe_pct =\
  \ sum(c[\"shares\"] for c in res[\"safe_conversions\"]) / post\n    inv_pct = res[\"\
  new_money_shares\"] / post\n    if safe_pct > 0.20:\n        w.append(\"SAFEs convert\
  \ into %.1f%% of the company: more than 20%% is a lot of dilution for one round.\"\
  \ % (100 * safe_pct))\n    if inv_pct > 0.30:\n        w.append(\"New investors\
  \ get %.1f%% post-money; above about 25-30%% in one round can make later rounds\
  \ hard.\" % (100 * inv_pct))\n    for c in res[\"safe_conversions\"]:\n        if\
  \ not c[\"cap\"] and not c[\"discount\"]:\n            w.append(\"%s is uncapped\
  \ with no discount: it converts at the round price; check for an MFN clause.\" %\
  \ c[\"holder\"])\n        if c[\"effective_price\"] and c[\"effective_price\"] >\
  \ res[\"price_per_share\"] + 1e-9:\n            w.append(\"%s converts above the\
  \ round price (cap higher than the round): check the SAFE terms.\" % c[\"holder\"\
  ])\n    if res[\"pool_top_up\"]:\n        pre_cost = res[\"pool_top_up\"] / res[\"\
  pre_money_fd\"]\n        w.append(\"Option pool shuffle: the %s-share pool top-up\
  \ is counted pre-money, so existing holders (not the new investor) absorb %.1f%%\
  \ of pre-money dilution.\" % (format(res[\"pool_top_up\"], \",\"), 100 * pre_cost))\n\
  \    founders = [t for t in tab if t[\"class\"] == \"common\" and t[\"before\"]]\n\
  \    fpct = sum(t[\"pct_after\"] for t in founders)\n    if founders and fpct <\
  \ 0.5:\n        w.append(\"Common holders together own %.1f%% after the round (below\
  \ 50%%).\" % (100 * fpct))\n    granted = sum(r[\"shares\"] for r in rows if r[\"\
  class\"] == \"options\")\n    if granted == 0 and not any(r[\"class\"] == \"pool\"\
  \ for r in rows):\n        w.append(\"No options or pool in the cap table: is the\
  \ employee pool missing?\")\n    if abs(res[\"post_money_valuation\"] - (rd[\"pre_money\"\
  ] + rd[\"new_money\"])) / (rd[\"pre_money\"] + rd[\"new_money\"]) > 0.001:\n   \
  \     w.append(\"Post-money value differs from pre-money + new money because of\
  \ share rounding (%.0f vs %.0f).\" % (res[\"post_money_valuation\"], rd[\"pre_money\"\
  ] + rd[\"new_money\"]))\n    return w\n\n\ndef money(x):\n    return \"{:,.0f}\"\
  .format(x)\n\n\ndef report(rows, rd, res, tab, warns):\n    L = []\n    L.append(\"\
  # Round model: %s raises %s at %s pre-money\" % (res[\"investor\"], money(rd[\"\
  new_money\"]), money(rd[\"pre_money\"])))\n    L.append(\"\")\n    L.append(\"Price\
  \ per share: %.4f | pre-money fully diluted shares: %s | post-money fully diluted\
  \ shares: %s | post-money valuation: %s\" % (\n        res[\"price_per_share\"],\
  \ money(res[\"pre_money_fd\"]), money(res[\"post_money_fd\"]), money(res[\"post_money_valuation\"\
  ])))\n    if rd.get(\"pool_target_post\"):\n        L.append(\"Option pool target:\
  \ %.1f%% post-money unissued; top-up %s shares (pre-money).\" % (100 * rd[\"pool_target_post\"\
  ], money(res[\"pool_top_up\"])))\n    L.append(\"\")\n    if res[\"safe_conversions\"\
  ]:\n        L.append(\"## SAFE conversions\")\n        L.append(\"| SAFE | type\
  \ | amount | cap | discount | shares | effective price |\")\n        L.append(\"\
  |---|---|---:|---:|---:|---:|---:|\")\n        for c in res[\"safe_conversions\"\
  ]:\n            L.append(\"| %s | %s-money | %s | %s | %s | %s | %.4f |\" % (c[\"\
  holder\"], c[\"type\"], money(c[\"amount\"]),\n                     money(c[\"cap\"\
  ]) if c[\"cap\"] else \"none\", (\"%d%%\" % round(100 * c[\"discount\"])) if c[\"\
  discount\"] else \"none\",\n                     money(c[\"shares\"]), c[\"effective_price\"\
  ] or 0))\n        L.append(\"\")\n    L.append(\"## Cap table before and after (fully\
  \ diluted)\")\n    L.append(\"| holder | class | shares before | % before | shares\
  \ after | % after | value at round price |\")\n    L.append(\"|---|---|---:|---:|---:|---:|---:|\"\
  )\n    for t in tab:\n        L.append(\"| %s | %s | %s | %.2f%% | %s | %.2f%% |\
  \ %s |\" % (t[\"holder\"], t[\"class\"], money(t[\"before\"]), 100 * t[\"pct_before\"\
  ],\n                 money(t[\"after\"]), 100 * t[\"pct_after\"], money(t[\"value_after\"\
  ])))\n    L.append(\"| **Total** | | %s | 100.00%% | %s | 100.00%% | %s |\" % (money(res[\"\
  pre_round_fd_before_safes\"]), money(res[\"post_money_fd\"]), money(res[\"post_money_valuation\"\
  ])))\n    L.append(\"\")\n    L.append(\"## Warnings\")\n    L.extend([\"- \" +\
  \ x for x in warns] or [\"- none\"])\n    L.append(\"\")\n    L.append(\"Model only:\
  \ the signed SAFEs, term sheet and closing cap table from your lawyer decide the\
  \ real numbers.\")\n    return \"\\n\".join(L)\n\n\ndef compare(rows, rd, pres):\n\
  \    L = [\"## Pre-money comparison\", \"| pre-money | price/share | new investors\
  \ % | SAFEs % | pool top-up | common holders % |\", \"|---:|---:|---:|---:|---:|---:|\"\
  ]\n    for p in pres:\n        r2 = dict(rd, pre_money=p)\n        res = model(rows,\
  \ r2)\n        tab = tables(rows, r2, res)\n        post = res[\"post_money_fd\"\
  ]\n        L.append(\"| %s | %.4f | %.2f%% | %.2f%% | %s | %.2f%% |\" % (money(p),\
  \ res[\"price_per_share\"], 100 * res[\"new_money_shares\"] / post,\n          \
  \       100 * sum(c[\"shares\"] for c in res[\"safe_conversions\"]) / post, money(res[\"\
  pool_top_up\"]),\n                 100 * sum(t[\"pct_after\"] for t in tab if t[\"\
  class\"] == \"common\")))\n    return \"\\n\".join(L)\n\n\ndef self_test():\n  \
  \  ok = True\n    def check(name, cond):\n        nonlocal ok\n        print((\"\
  PASS  \" if cond else \"FAIL  \") + name)\n        ok = ok and cond\n    base =\
  \ [{\"holder\": \"A\", \"class\": \"common\", \"shares\": 4_500_000}, {\"holder\"\
  : \"B\", \"class\": \"common\", \"shares\": 4_500_000},\n            {\"holder\"\
  : \"Pool\", \"class\": \"pool\", \"shares\": 1_000_000}]\n    r = model(base, {\"\
  pre_money\": 10_000_000, \"new_money\": 2_500_000})\n    check(\"plain round price\
  \ = pre-money / FD\", abs(r[\"price_per_share\"] - 1.0) < 1e-9)\n    check(\"plain\
  \ round investor shares = new money / price\", r[\"new_money_shares\"] == 2_500_000)\n\
  \    check(\"post-money = pre + new\", abs(r[\"post_money_valuation\"] - 12_500_000)\
  \ < 1)\n    r = model(base, {\"pre_money\": 10_000_000, \"new_money\": 2_500_000,\
  \ \"pool_target_post\": 0.15})\n    pool_after = 1_000_000 + r[\"pool_top_up\"]\n\
  \    check(\"pool shuffle hits 15% post-money\", abs(pool_after / r[\"post_money_fd\"\
  ] - 0.15) < 1e-4)\n    check(\"pool shuffle lowers the price\", r[\"price_per_share\"\
  ] < 1.0)\n    check(\"investor still owns new/post-money (20%)\", abs(r[\"new_money_shares\"\
  ] / r[\"post_money_fd\"] - 0.2) < 1e-4)\n    r = model(base, {\"pre_money\": 10_000_000,\
  \ \"new_money\": 2_500_000, \"safes\": [{\"holder\": \"S\", \"amount\": 500_000,\
  \ \"cap\": 5_000_000, \"type\": \"post\"}]})\n    c = r[\"safe_conversions\"][0]\n\
  \    check(\"post-money SAFE owns amount/cap of pre-round capitalization (10%)\"\
  , abs(c[\"shares\"] / (10_000_000 + c[\"shares\"]) - 0.10) < 1e-6)\n    check(\"\
  capped SAFE converts below round price\", c[\"effective_price\"] < r[\"price_per_share\"\
  ])\n    r = model(base, {\"pre_money\": 10_000_000, \"new_money\": 2_500_000, \"\
  safes\": [{\"holder\": \"S\", \"amount\": 500_000, \"discount\": 0.2}]})\n    c\
  \ = r[\"safe_conversions\"][0]\n    check(\"discount-only SAFE converts at 80% of\
  \ round price\", abs(c[\"effective_price\"] / r[\"price_per_share\"] - 0.8) < 1e-4)\n\
  \    r = model(base, {\"pre_money\": 10_000_000, \"new_money\": 2_500_000, \"safes\"\
  : [{\"holder\": \"S\", \"amount\": 500_000, \"cap\": 50_000_000, \"discount\": 0.2}]})\n\
  \    c = r[\"safe_conversions\"][0]\n    check(\"cap above round: discount wins\"\
  , abs(c[\"effective_price\"] / r[\"price_per_share\"] - 0.8) < 1e-4)\n    r = model(base,\
  \ {\"pre_money\": 10_000_000, \"new_money\": 2_500_000, \"safes\": [{\"holder\"\
  : \"S\", \"amount\": 500_000, \"cap\": 4_000_000, \"type\": \"pre\"}]})\n    c =\
  \ r[\"safe_conversions\"][0]\n    check(\"pre-money SAFE price = cap / pre-round\
  \ FD\", abs(c[\"effective_price\"] - 0.4) < 1e-3)\n    r = model(base, {\"pre_money\"\
  : 10_000_000, \"new_money\": 2_500_000, \"safes\": [{\"holder\": \"S\", \"amount\"\
  : 500_000}]})\n    tab = tables(base, {\"pre_money\": 10_000_000, \"new_money\"\
  : 2_500_000}, r)\n    w = warnings(base, {\"pre_money\": 10_000_000, \"new_money\"\
  : 2_500_000}, r, tab)\n    check(\"uncapped SAFE warning\", any(\"uncapped\" in\
  \ x for x in w))\n    two = {\"pre_money\": 8_000_000, \"new_money\": 2_000_000,\
  \ \"safes\": [{\"holder\": \"S1\", \"amount\": 300_000, \"cap\": 6_000_000}, {\"\
  holder\": \"S2\", \"amount\": 600_000, \"cap\": 6_000_000}]}\n    r = model(base,\
  \ two)\n    s1, s2 = r[\"safe_conversions\"]\n    check(\"two post-money SAFEs at\
  \ same cap: shares proportional to amount\", abs(s2[\"shares\"] / s1[\"shares\"\
  ] - 2) < 1e-4)\n    check(\"two post-money SAFEs together own 15% of capitalization\"\
  , abs((s1[\"shares\"] + s2[\"shares\"]) / (10_000_000 + s1[\"shares\"] + s2[\"shares\"\
  ]) - 0.15) < 1e-5)\n    tab = tables(base, two, r)\n    check(\"post-round table\
  \ sums to post-money FD\", sum(t[\"after\"] for t in tab) == r[\"post_money_fd\"\
  ])\n    for bad, name in (({\"pre_money\": 0, \"new_money\": 1}, \"zero pre-money\
  \ rejected\"), ({\"pre_money\": 1, \"new_money\": 1, \"pool_target_post\": 15},\
  \ \"pool target as percent rejected\"),\n                      ({\"pre_money\":\
  \ 1, \"new_money\": 1, \"safes\": [{\"holder\": \"x\", \"amount\": 1, \"discount\"\
  : 20}]}, \"discount as percent rejected\")):\n        try:\n            model(base,\
  \ bad); check(name, False)\n        except InputError:\n            check(name,\
  \ True)\n    print(\"ALL PASS\" if ok else \"SOME TESTS FAILED\")\n    return 0\
  \ if ok else 1\n\n\ndef main(argv):\n    if \"--self-test\" in argv:\n        return\
  \ self_test()\n    args = [a for a in argv if not a.startswith(\"--\")]\n    pres\
  \ = None\n    if \"--compare\" in argv:\n        i = argv.index(\"--compare\")\n\
  \        try:\n            pres = [float(x) for x in argv[i + 1].split(\",\")]\n\
  \        except (IndexError, ValueError):\n            print(\"--compare needs comma-separated\
  \ pre-money values\", file=sys.stderr); return 2\n        args = [a for a in args\
  \ if a != argv[i + 1]]\n    if len(args) != 2:\n        print(__doc__, file=sys.stderr);\
  \ return 2\n    try:\n        rows = load_cap_table(args[0])\n        with open(args[1],\
  \ encoding=\"utf-8\") as f:\n            rd = json.load(f)\n        res = model(rows,\
  \ rd)\n    except (InputError, OSError, json.JSONDecodeError) as e:\n        print(\"\
  input error: %s\" % e, file=sys.stderr); return 2\n    tab = tables(rows, rd, res)\n\
  \    warns = warnings(rows, rd, res, tab)\n    if \"--json\" in argv:\n        print(json.dumps({\"\
  round\": rd, \"result\": res, \"table\": tab, \"warnings\": warns}, indent=2))\n\
  \    else:\n        print(report(rows, rd, res, tab, warns))\n        if pres:\n\
  \            print(); print(compare(rows, rd, pres))\n    return 1 if warns else\
  \ 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main(sys.argv[1:]))"
