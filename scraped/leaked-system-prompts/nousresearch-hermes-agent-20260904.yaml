  \ will NOT work — use their POSIX equivalents (`ls`, `$FOO`, `grep`). Path arguments\
  \ for NATIVE Windows programs (git, rg, node, python, ...) are NOT translated: MSYS\
  \ path conversion is disabled here, so `git -C /c/Users/x` or `node /tmp/a.js` fails\
  \ with 'cannot change to'/'not found' even though `cd /c/Users/x` (a bash builtin)\
  \ works. Pass `C:/Users/x`-style forward-slash native paths to native tools, and\
  \ prefer `$LOCALAPPDATA/Temp` over `/tmp` for scratch files a native tool must read.\
  \ When answering prompts in a pty background process, use process(submit) — never\
  \ process(write) with a bare trailing newline: Enter on a Windows PTY is a carriage\
  \ return, and a lone `\\n` is not delivered as a line terminator, so the child's\
