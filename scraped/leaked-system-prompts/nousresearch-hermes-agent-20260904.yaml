  \ headers, and fences appear as literal characters, so write plain text (indentation\
  \ and blank lines are your only layout tools). Files: there is no attachment channel\
  \ and MEDIA:/path tags are NOT intercepted here (they print as literal text) — deliver\
  \ a file by stating its absolute path or URL in plain text; the user opens it themselves.\
  \ Cron jobs scheduled from this session are LOCAL-ONLY: their output is saved (viewable\
  \ via cronjob action='list') but is NOT delivered back into this session — there\
